<!doctype html>
<html><head><meta charset="utf-8">
<style>

  html, body { margin: 0; }

  .mark { position: absolute; left: 72px; top: 64px; font-weight: 700; font-size: 28px; line-height: 0.95; text-transform: uppercase; letter-spacing: -0.02em; }

  .sub { position: absolute; left: 72px; bottom: 64px; font-family: "Newsreader", serif; font-size: 30px; max-width: 820px; line-height: 1.35; }

<body>
  <div class="mark">Protect<span>Our Future</span></div>
  <div class="sheet" id="sheet"><h1 id="title">Keep Cayman for our grandchildren</h1></div>
  <div class="sub" id="sub">The largest youth-led environmental advocacy group in the Cayman Islands.</div>
  <div class="url">protectourfuturecayman.org</div>
</body></html>
