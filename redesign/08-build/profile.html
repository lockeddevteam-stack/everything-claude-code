<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOCKED — Profile</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="fixtures.js"></script>
<script src="store.js"></script>
<script src="units.js"></script>
<script src="app.js"></script>
<script src="chrome.js"></script>
<script src="session.js"></script>
</head>
<body>
<!--
  PROFILE — the fifth tab.

  It is a record, not a dashboard. Everything here was earned by doing
  something, and nothing on it is a target: the screens that ask you to do
  more are Home, Train and Coach. This one only says what happened.

  WHY THE BADGES ARE OFF BY DEFAULT
  Streaks and badges are a setting, off unless somebody turned them on. A
  badge is motivating for one kind of person and a source of guilt for
  another, and the app is used by both. When the setting is off the section
  is not there at all, rather than being there and empty.

  WHY LOCKED BADGES SHOW A COUNT AND NOT A LOCK
  "3 more to go" is something you can act on. A padlock is decoration that
  says you have not done enough.

  SETTINGS IS A PUSH, NOT A PANEL
  Settings already exists as its own screen and is reached from here. The
  fifth tab holds identity and record; the settings screen holds every
  control. Two jobs, two screens.

  STATES
  populated, badges (the gaming layer on), guest, new, loading, error.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-profile" data-state="populated">

      <header class="hdr hdr--large" data-large-title="#body" data-scroll-edge="#body" id="hdr"></header>

      <main class="body" id="body" data-testid="profile-scroll" tabindex="-1"></main>

      <div id="overlay"></div>

      <!-- The live session, seen from here. Empty unless a workout is
           running; it sits between the content and the bottom of the
           screen rather than over it, so nothing it says costs a row. -->
      <div id="shelf-slot"></div>


      <nav class="tabbar" aria-label="Sections" data-minimize="#body">
        <button class="tabbar__item" type="button" data-testid="tab-home">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></svg>
          <span class="tabbar__label">Home</span>
        </button>
        <button class="tabbar__item" type="button" data-testid="tab-train">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>
          <span class="tabbar__label">Train</span>
        </button>
        <button class="tabbar__item" type="button" data-testid="tab-fuel">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 3v8a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M9 13v8"/><path d="M17 3c-1.5 1.8-2 3.6-2 5.5 0 1.6.7 2.5 2 2.5s2-.9 2-2.5c0-1.9-.5-3.7-2-5.5Z"/><path d="M17 11v10"/></svg>
          <span class="tabbar__label">Fuel</span>
        </button>
        <button class="tabbar__item" type="button" data-testid="tab-coach">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 15a3 3 0 0 1-3 3H9l-4 3V7a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3z"/></svg>
          <span class="tabbar__label">Coach</span>
        </button>
        <button class="tabbar__item" type="button" aria-current="page" data-testid="tab-profile">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
          <span class="tabbar__label">Profile</span>
        </button>
      </nav>

    </div>
  </div>
</div>

<div class="dev">
  <button class="dev__toggle" id="dev-toggle" aria-expanded="false" aria-controls="dev-menu" data-testid="dev-toggle">State</button>
  <div class="dev__menu" id="dev-menu" hidden data-testid="dev-menu"></div>
</div>

<script>
(function () {
  "use strict";

  var screen = document.getElementById('screen');
  var hdr    = document.getElementById('hdr');
  var body   = document.getElementById('body');
  var overlay = document.getElementById('overlay');
  var menu   = document.getElementById('dev-menu');

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }
  function n(v) { return Number(v).toLocaleString('en-GB'); }

  var ICO = {
    chev: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg>',
    cog:  '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.4"/><path d="M19.1 14.3a1.5 1.5 0 0 0 .3 1.7l.1.1a1.8 1.8 0 1 1-2.6 2.6l-.1-.1a1.5 1.5 0 0 0-1.7-.3 1.5 1.5 0 0 0-.9 1.4v.2a1.8 1.8 0 1 1-3.6 0V20a1.5 1.5 0 0 0-1-1.4 1.5 1.5 0 0 0-1.7.3l-.1.1a1.8 1.8 0 1 1-2.6-2.6l.1-.1a1.5 1.5 0 0 0 .3-1.7 1.5 1.5 0 0 0-1.4-.9H4a1.8 1.8 0 1 1 0-3.6h.2a1.5 1.5 0 0 0 1.4-1 1.5 1.5 0 0 0-.3-1.7l-.1-.1a1.8 1.8 0 1 1 2.6-2.6l.1.1a1.5 1.5 0 0 0 1.7.3H10a1.5 1.5 0 0 0 .9-1.4V4a1.8 1.8 0 1 1 3.6 0v.2a1.5 1.5 0 0 0 .9 1.4 1.5 1.5 0 0 0 1.7-.3l.1-.1a1.8 1.8 0 1 1 2.6 2.6l-.1.1a1.5 1.5 0 0 0-.3 1.7v.1a1.5 1.5 0 0 0 1.4.9h.2a1.8 1.8 0 1 1 0 3.6H20a1.5 1.5 0 0 0-1.4.9z"/></svg>',
    alert:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>'
  };

  /* The record. Every figure is the sum of something that was logged, which
     is why none of them can be edited from this screen. */
  /* Counted, not stated. Every one of these was a literal: 84 sessions,
     19 records, 1,642 sets and 413k kg against a history holding 22, 12, 288
     and 140k -- and a records list naming four lifts that appear in no
     session at all. Progress on the next screen said "12 across 9 lifts" and
     Train said "All 22" from the same fixture these numbers claimed to
     describe. The badges inherited the invented figures too, so they reported
     a distance to a milestone that was not the reader's. */
  var FXP = window.LKFixtures || {};
  var TOT = FXP.totals || {};
  var ST = window.LKStore;
  function get(key, dflt) { return ST ? ST.get(key, dflt) : dflt; }

  /* Counted from lk_history, not from a summary. The totals key is a
     generated roll-up of the same sessions and agrees with this to the
     kilogram -- 22 sessions, 288 working sets, 140,204 kg -- but a figure
     read from the sessions themselves is one that still tells the truth
     after a session is logged, and that is the whole point of the store.
     Warm-ups are not working sets and their load is not volume, which is the
     rule every stored session summary already follows. */
  function countTotals(history) {
    var sets = 0, vol = 0;
    history.forEach(function (h) {
      sets += Number(h.sets) || 0;
      vol += Number(h.kg) || 0;
    });
    return { sessions: history.length, sets: sets, volumeKg: vol };
  }

  /* lk_prs ships in two shapes. The app's own is a map of exercise id to
     every record on that lift, which is where "12 records over 9 lifts"
     comes from; fixtures.js flattens it to one row per lift, so a read of
     the untouched key gives 9 rows and no count. Both are read; the count
     falls back to the roll-up when the flat shape is all there is. */
  function readRecords() {
    var raw = get('lk_prs', null);
    if (raw && !Array.isArray(raw) && typeof raw === 'object') {
      var rows = [], count = 0;
      Object.keys(raw).forEach(function (id) {
        var list = raw[id] || [];
        count += list.length;
        var best = list.slice().sort(function (a, b) { return b.w - a.w || b.r - a.r; })[0];
        if (best) rows.push({ lift: best.name || nameFor(id), group: best.group || '', kg: best.w });
      });
      rows.sort(function (a, b) { return b.kg - a.kg; });
      return { rows: rows, count: count };
    }
    /* ONE ROW PER LIFT, its heaviest. Sorted by load across all twelve
       record rows, the list showed Barbell Deadlift twice and Barbell Squat
       twice and pushed the bench press -- the lift the coach talks about --
       off the end of a list capped at six. */
    var arr = Array.isArray(raw) ? raw : (FXP.prs || []);
    var best = {}, order = [];
    arr.forEach(function (r) {
      var id = String(r.exId != null ? r.exId : r.id);
      var cur = best[id];
      if (!cur) { order.push(id); best[id] = r; return; }
      if (r.kg > cur.kg || (r.kg === cur.kg && r.reps > cur.reps)) best[id] = r;
    });
    return {
      rows: order.map(function (id) { return best[id]; })
        .sort(function (a, b) { return b.kg - a.kg; })
        .map(function (r) { return { lift: r.name, group: r.group || r.muscle || '', kg: r.kg }; }),
      count: arr.length,
      lifts: order.length
    };
  }
  function nameFor(id) {
    var hit = '';
    (FXP.prs || []).forEach(function (r) { if (String(r.exId) === String(id)) hit = r.name; });
    return hit;
  }

  function readMe() {
    var p = get('lk_profile', {}) || {};
    var history = get('lk_history', []) || [];
    var t = countTotals(history);
    var recs = readRecords();
    return {
      /* What Settings writes when somebody changes their name. It wrote
         nothing at all before, so the name typed there never arrived here. */
      name: p.displayName || p.name || '',
      handle: p.username || '',
      workouts: t.sessions,
      prs: recs.count,
      recordLifts: recs.lifts || recs.rows.length,
      sets: t.sets,
      volumeKg: t.volumeKg,
      useKg: p.useKg !== false,
      records: recs.rows,
      history: history
    };
  }
  var ME = readMe();

  /* THE STREAK. Settings offers "Streaks and badges" and promises "On.
     Profile shows them." There was no streak anywhere in the build: no
     screen computed one and no key held one. It is days in a row with a
     session, counted back from today, out of lk_history -- and the longest
     run this history holds, because a run of zero with no second number is
     a scolding rather than a record.

     TODAY is the fixture's date, not the wall clock: every other figure on
     this screen is measured against the seed, and a streak measured against
     a real clock would report zero the day this build is next opened. */
  /* The store's today, then the fixture's, then the clock -- never a
     literal as the last word, which is how a shipped build ends up
     measuring a real person's dates against a date in the past. */
  var TODAY = (window.LKStore ? LKStore.today() : null) || FXP.today ||
              new Date().toISOString().slice(0, 10);
  function dayMs(iso) {
    var p = String(iso).slice(0, 10).split('-');
    return Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function streak() {
    var days = {}, list = [];
    ME.history.forEach(function (h) {
      var t = dayMs(h.date);
      if (isNaN(t) || days[t]) return;
      days[t] = 1;
      list.push(t);
    });
    list.sort(function (a, b) { return b - a; });
    var DAY = 86400000;
    /* Today counts if it has a session; if it does not, yesterday still
       starts a run, because a streak should not break at breakfast. */
    var cur = 0, t = dayMs(TODAY);
    if (!days[t]) t -= DAY;
    while (days[t]) { cur++; t -= DAY; }
    var best = 0, run = 0;
    for (var i = 0; i < list.length; i++) {
      run = (i && list[i - 1] - list[i] === DAY) ? run + 1 : 1;
      if (run > best) best = run;
    }
    var lastGap = list.length ? Math.round((dayMs(TODAY) - list[0]) / DAY) : null;
    return { current: cur, best: best, days: list.length, lastGap: lastGap, last: list.length ? list[0] : null };
  }

  /* A badge is earned by a count crossing a line. The line is written next
     to the badge so nothing about it is a mystery. */
  var BADGES = [
    { id: 'first',  face: '1',   name: 'First rep',   need: 1,    of: 'workouts', got: 'Logged your first session' },
    { id: 'w5',     face: '5',   name: '5 sessions',  need: 5,    of: 'workouts', got: 'The habit is starting' },
    { id: 'w10',    face: '10',  name: '10 sessions', need: 10,   of: 'workouts', got: 'The habit has formed' },
    { id: 'w25',    face: '25',  name: '25 sessions', need: 25,   of: 'workouts', got: 'Six months of showing up' },
    { id: 'w100',   face: '100', name: '100 sessions',need: 100,  of: 'workouts', got: 'Two years of showing up' },
    { id: 'pr1',    face: 'PR',  name: 'First record',need: 1,    of: 'prs',      got: 'Logged your first record' },
    { id: 'pr5',    face: 'P5',  name: '5 records',   need: 5,    of: 'prs',      got: 'Measurably stronger' },
    { id: 'pr25',   face: 'P25', name: '25 records',  need: 25,   of: 'prs',      got: 'Stronger everywhere' },
    { id: 's100',   face: 'S',   name: '100 sets',    need: 100,  of: 'sets',     got: 'That is a lot of reps' },
    { id: 's2000',  face: 'S2k', name: '2,000 sets',  need: 2000, of: 'sets',     got: 'That is a lot of reps' }
  ];

  /* The gaming layer is a setting, not a state: a guest can have badges on
     and a signed-in reader can have them off. It was only ever `state ===
     "badges"`, so reading the setting meant giving up the guest state. */
  var S = { state: 'populated', badges: false };
  function showBadges() { return S.badges || S.state === 'badges'; }

  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function dayLabel(t) {
    var d = new Date(t);
    return MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate();
  }
  /* The streak, in the header, where the switch that turns it on says it
     will be. A run of zero says so and says when the last session was,
     because "0" on its own is a number a reader cannot check. */
  function streakLine() {
    if (!showBadges()) return '';
    var k = streak();
    var main = k.current > 0
      ? n(k.current) + (k.current === 1 ? ' day in a row' : ' days in a row')
      : (k.last === null ? 'No sessions yet' : 'No run going, last trained ' + dayLabel(k.last));
    var best = k.best ? ' &middot; best ' + n(k.best) : '';
    return '<span class="t-meta" data-testid="streak" data-current="' + k.current +
      '" data-best="' + k.best + '">' + main + best + '</span>';
  }
  function headerHTML() {
    return '' +
      '<div class="hdr__title stack stack--1">' +
        '<span class="t-meta">@' + esc(ME.handle) + '</span>' +
        '<h1 class="hdr__title-large" data-title-large>' + esc(ME.name) + '</h1>' +
        streakLine() +
      '</div>' +
      '<span class="hdr__title-small" data-title-small aria-hidden="true">' + esc(ME.name) + '</span>';
  }

  /* ---------------------------------------------------------------
     Identity. The one row that leaves this screen, plus the account
     state, which is the only thing here that can need attention.
     --------------------------------------------------------------- */
  function identity() {
    var guest = S.state === 'guest';
    /* "Backed up. Last synced 12 minutes ago" was a literal on a build with
       no server and no request in it. lk_lastSync is the only thing that can
       say otherwise, and it is empty. */
    var synced = get('lk_lastSync', null);
    return '<div class="card card--flush" data-testid="identity">' +
      '<div class="row row--static">' +
        '<span class="avatar" aria-hidden="true">' + esc(ME.name.charAt(0).toUpperCase()) + '</span>' +
        '<span class="row__main stack">' +
          '<span class="row__title">' + (guest ? 'On this phone only' : synced ? 'Backed up' : 'Not backed up') + '</span>' +
          '<span class="row__sub">' + (guest
            ? 'Nothing leaves this device'
            : synced ? 'Last synced ' + esc(String(synced))
            /* Two different facts, and saying the wrong one is the failure
               this whole build is written against. A build with no server
               has nothing to sync with; a build that has one and has not
               synced is waiting on a sign-in. */
            : (window.LKCloud && LKCloud.ready())
                ? (window.LKCloud.signedIn()
                    ? 'Nothing has left this device yet. It syncs on your next change.'
                    : 'Nothing has left this device. Sign in to back it up.')
                : 'Nothing has left this device. This build has no server to sync with.') + '</span>' +
        '</span>' +
      '</div>' +
      '<button class="row" type="button" data-action="settings" data-testid="open-settings">' +
        '<span class="ico-well" aria-hidden="true">' + ICO.cog + '</span>' +
        '<span class="row__main"><span class="row__title">Settings</span></span>' +
        '<span class="row__chev">' + ICO.chev + '</span>' +
      '</button>' +
    '</div>';
  }

  function guestBanner() {
    if (S.state !== 'guest') return '';
    return '<div class="card card--sunken mt-4" data-testid="guest-banner">' +
      '<h2 class="t-label">On this phone only</h2>' +
      '<p class="t-detail mt-2">Everything you have logged is here and works offline. It is not backed up, ' +
        'so a lost phone is a lost record. An account copies it and changes nothing else.</p>' +
      '<button class="btn btn--primary btn--block mt-3" type="button" data-action="signup" data-testid="signup">' +
        '<span class="btn__label">Create an account</span></button>' +
    '</div>';
  }

  /* ---------------------------------------------------------------
     The record
     --------------------------------------------------------------- */
  function stat(label, value, unit) {
    var zero = value === 0 || value === '0';
    return '<div class="stat" data-testid="stat-' + label.toLowerCase().replace(/\W+/g, '-') + '">' +
      '<span class="stat__value"' + (zero ? ' style="color: var(--text-tertiary)"' : '') + '>' + value +
        (unit ? '<span class="stat__unit"> ' + unit + '</span>' : '') + '</span>' +
      '<span class="stat__label">' + label + '</span>' +
    '</div>';
  }

  function totals() {
    var vol = Math.round(LKUnits.vRound(ME.volumeKg) / 1000);
    return '<div class="card mt-4" data-testid="totals">' +
      '<div class="tiles">' +
        stat('Sessions', n(ME.workouts), '') +
        stat('Records',  n(ME.prs), '') +
      '</div>' +
      '<div class="tiles mt-4">' +
        stat('Sets',   n(ME.sets), '') +
        stat('Volume', n(vol) + 'k', LKUnits.label()) +
      '</div>' +
    '</div>';
  }

  function records() {
    if (!ME.records.length) return '';
    /* Six, because a record you have to scroll to is a record you do not
       remember setting. The rest are in the exercise's own history. */
    return '<div class="section">' +
      '<div class="section__head">' +
        '<h2 class="t-label">Personal records</h2>' +
        /* What the list is: the heaviest on each lift. The header said
           "12 in all" over six rows and no way to reach the others. */
        '<span class="t-meta num">' + (ME.records.length > 6
          ? 'Top 6 of ' + ME.recordLifts + ' lifts'
          : ME.recordLifts + (ME.recordLifts === 1 ? ' lift' : ' lifts')) +
        ' &middot; ' + ME.prs + ' records</span>' +
      '</div>' +
      '<div class="card card--flush">' + ME.records.slice(0, 6).map(function (r, i) {
        return '<div class="row row--static" data-testid="pr-' + i + '">' +
          '<span class="row__main stack">' +
            '<span class="row__title">' + esc(r.lift) + '</span>' +
            '<span class="row__sub">' + esc(r.group) + '</span>' +
          '</span>' +
          '<span class="row__value num">' + LKUnits.v(r.kg) +
            '<small class="t-caption-2 quiet"> ' + LKUnits.label() + '</small></span>' +
        '</div>';
      }).join('') + '</div>' +
    '</div>';
  }

  function badges() {
    if (!showBadges()) return '';
    var have = { workouts: ME.workouts, prs: ME.prs, sets: ME.sets };
    var earned = BADGES.filter(function (b) { return have[b.of] >= b.need; });
    var locked = BADGES.filter(function (b) { return have[b.of] < b.need; });

    if (!earned.length && !locked.length) return '';
    var k = streak();
    var streakCard = '<div class="card mt-4" data-testid="streak-card">' +
      '<div class="tiles">' +
        stat('Day streak', n(k.current), '') +
        stat('Best run', n(k.best), k.best === 1 ? 'day' : 'days') +
      '</div>' +
      '<p class="t-detail mt-3">Days in a row with a session, counted back from ' + dayLabel(dayMs(TODAY)) + '. ' +
        (k.last === null
          ? 'Nothing logged yet.'
          : 'Your last session was ' + dayLabel(k.last) +
            (k.lastGap > 1 ? ', ' + n(k.lastGap) + ' days ago, which is what ended the run.' : '.')) +
      '</p>' +
    '</div>';
    return streakCard + '<div class="section">' +
      '<div class="section__head"><h2 class="t-label">Badges</h2>' +
        '<span class="t-meta num">' + earned.length + ' of ' + BADGES.length + '</span></div>' +
      (earned.length
        ? '<div class="card card--flush">' + earned.map(function (b) {
            return '<div class="row row--static" data-testid="badge-' + b.id + '">' +
              '<span class="badge-face" aria-hidden="true">' + b.face + '</span>' +
              '<span class="row__main stack">' +
                '<span class="row__title">' + esc(b.name) + '</span>' +
                '<span class="row__sub">' + esc(b.got) + '</span>' +
              '</span>' +
            '</div>';
          }).join('') + '</div>'
        : '<p class="t-detail">Log a session and the first one is yours.</p>') +
      (locked.length
        ? '<div class="card card--flush mt-3">' + locked.map(function (b) {
            /* A count, not a padlock: "16 more sessions" is something to do
               this month, a padlock is a thing that has been withheld. */
            var togo = b.need - have[b.of];
            return '<div class="row row--static row--quiet" data-testid="badge-' + b.id + '">' +
              '<span class="badge-face badge-face--locked" aria-hidden="true">' + b.face + '</span>' +
              '<span class="row__main stack">' +
                '<span class="row__title">' + esc(b.name) + '</span>' +
                '<span class="row__sub">' + n(togo) + ' more ' +
                  (b.of === 'workouts' ? 'sessions' : b.of === 'prs' ? 'records' : 'sets') + '</span>' +
              '</span>' +
            '</div>';
          }).join('') + '</div>'
        : '') +
    '</div>';
  }

  /* ---------------------------------------------------------------
     Views
     --------------------------------------------------------------- */
  var VIEWS = {};

  VIEWS.populated = function () {
    return identity() + guestBanner() + totals() + badges() + records();
  };
  VIEWS.badges = VIEWS.populated;
  VIEWS.guest  = VIEWS.populated;

  VIEWS['new'] = function () {
    var save = { w: ME.workouts, p: ME.prs, s: ME.sets, v: ME.volumeKg, r: ME.records };
    ME.workouts = 0; ME.prs = 0; ME.sets = 0; ME.volumeKg = 0; ME.records = [];
    var out = identity() + totals() +
      '<div class="empty mt-5" data-testid="state-new">' +
        '<p class="empty__title">Nothing to show yet</p>' +
        '<p class="empty__body">This page fills itself in as you train. Finish one session and the ' +
          'four figures above stop being zeroes.</p>' +
        '<button class="btn btn--primary mt-2" type="button" data-action="start" data-testid="start-first">' +
          '<span class="btn__label">Start a session</span></button>' +
      '</div>';
    ME.workouts = save.w; ME.prs = save.p; ME.sets = save.s; ME.volumeKg = save.v; ME.records = save.r;
    return out;
  };

  VIEWS.loading = function () {
    return '<div role="status" aria-busy="true" aria-label="Loading your profile">' +
      '<div class="skel" style="height: 120px"></div>' +
      '<div class="skel mt-4" style="height: 148px"></div>' +
      '<div class="skel mt-4" style="height: var(--sp-4); width: 42%"></div>' +
      '<div class="skel mt-3" style="height: 200px"></div>' +
    '</div>';
  };

  VIEWS.error = function () {
    return '<div class="mt-4" data-testid="state-error">' +
      '<div class="banner banner--error">' + ICO.alert +
        '<span><strong>Your totals did not load</strong>Every session you logged is on this phone and is ' +
        'not lost. The totals are counted on the server and it did not answer.</span></div>' +
      '<button class="btn btn--primary btn--block mt-4" type="button" data-action="retry" data-testid="retry">' +
        '<span class="btn__label">Try again</span></button>' +
      '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="settings" data-testid="open-settings">' +
        '<span class="btn__label">Open settings</span></button>' +
    '</div>';
  };

  /* WHICH onboarding screen. Both of these landed on Welcome, so somebody
     who had already chosen "Create account" was asked to choose again. The
     demo's router takes the click, so the answer is left where onboarding
     reads it rather than written in a handler that never runs. */
  var ONBOARD_OPEN = { 'signup': 'signup', 'start-first': 'signup' };
  function handOnboarding(tid) {
    if (!ONBOARD_OPEN[tid]) return;
    try { localStorage.setItem('lk_openOnboarding', ONBOARD_OPEN[tid]); } catch (e) {}
  }
  document.addEventListener('lk:handoff', function (e) {
    var el = (e.detail || {}).el;
    var tid = el && el.getAttribute ? el.getAttribute('data-testid') : null;
    handOnboarding(tid);
  });
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-testid]') : null;
    if (el) handOnboarding(el.getAttribute('data-testid'));
  }, true);

  function render() {
    screen.setAttribute('data-state', S.state);
    LKPatch(hdr, headerHTML());
    LKPatch(body, (VIEWS[S.state] || VIEWS.populated)());
    LKPatch(overlay, '');
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.state));
    });
    if (window.LKChrome) LKChrome.init(document);
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!el) return;
    var a = el.getAttribute('data-action');
    if (a === 'retry') {
      S.state = 'loading'; render();
      setTimeout(function () { S.state = 'populated'; render(); }, 700);
      return;
    }
    /* Settings and the account flow. Both were rendered as enabled buttons
       with nothing behind them: a guest could never become an account
       holder, and Settings only worked because the demo's router took the
       click before this handler saw it. Standalone these are pages; in the
       demo the router still takes them first. */
    if (a === 'settings') { LKGo('settings'); return; }
    if (a === 'signup' || a === 'start') { LKGo('onboarding'); return; }
  });

  var STATES = [
    ['populated', 'Populated'], ['badges', 'Badges on'], ['guest', 'Guest'],
    ['new', 'New account'], ['loading', 'Loading'], ['error', 'Error']
  ];
  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join(''));
  document.getElementById('dev-toggle').addEventListener('click', function () {
    var open = menu.hidden;
    menu.hidden = !open;
    this.setAttribute('aria-expanded', String(open));
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (!b) return;
    S.state = b.dataset.state; render();
  });

  /* "Streaks and badges are a setting, off unless somebody turned them on" --
     the comment at the top of this file has said so all along, and until now
     there was no such setting anywhere. Settings owns it and writes it where
     this screen can see it. The dev switcher still overrides.

     lk_guestMode is read here too. It ships in the seed and grep found it in
     no screen in the build, so guest was a state only the dev switcher could
     reach and Settings' own sign-out never arrived. */
  var badgesOn = get('lk_badges', false);
  S.badges = badgesOn === true || badgesOn === 'true';
  if (String(get('lk_guestMode', '0')) === '1') S.state = 'guest';

  var q = new URLSearchParams(location.search);
  if (q.get('state') && VIEWS[q.get('state')]) S.state = q.get('state');
  render();

  /* Settings is a push from this screen, so a reader comes back to it with
     the unit, the name or the badge switch just changed. Neither reached
     here without a reload: LKUnits.onChange existed and nothing subscribed
     to it, and nothing watched the store at all. */
  if (window.LKUnits) LKUnits.onChange(function () { render(); });
  if (ST) {
    ST.onChange(function (value, key) {
      ME = readMe();
      if (key === 'lk_badges') S.badges = value === true || value === 'true';
      if (key === 'lk_guestMode' && S.state !== 'new' && S.state !== 'loading' && S.state !== 'error') {
        S.state = String(value) === '1' ? 'guest' : 'populated';
      }
      render();
    });
  }
  requestAnimationFrame(function () { window.__ready = true; });
})();

  /* The running workout, from a screen that is not it. Leaving the workout
     log used to lose the session outright: nothing was written down, and no
     screen but Home and Fuel had anywhere to say one was open. The record
     lives in session.js; this mounts its shelf and takes the tap back. */
  if (window.LKSession) {
    LKSession.mount(document.getElementById('shelf-slot'),
      typeof LKPatch === 'function' ? LKPatch : null);
    document.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-testid="shelf-resume"]') : null;
      if (el) { e.preventDefault(); LKGo('workout-log'); }
    });
  }
</script>
</body>
</html>
