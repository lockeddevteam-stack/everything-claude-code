              '<span class="btn__label">Back</span></button>'
          : '') +
        '<button class="btn btn--primary grow" type="button" data-act="setup-next" data-testid="su-next">' +
          '<span class="btn__label">' + (last ? 'Start tracking' : 'Continue') + '</span></button>' +
      '</div>' +
      '<p class="t-caption-1 quiet mt-3">Stored on this phone. Nothing is uploaded and nothing is ' +
        'shared with the coach unless you turn that on.</p>';
  };

  VIEWS.empty = function () {
    return ringHTML() + quickHTML() + inlineStrips() +
      '<div class="empty mt-5" data-testid="cycle-empty">' +
        '<p class="empty__title">Nothing logged yet</p>' +
        '<p class="empty__body">Tap a day below to record flow, how you felt, or a note. ' +
          'One tap a day is enough for the pattern to be worth reading.</p>' +
      '</div>' + strip() + scienceHTML();
  };

  VIEWS.loading = function () {
    return '<div class="mt-4" role="status" aria-busy="true" aria-label="Loading your cycle">' +
      '<div class="card">' +
        '<div class="skel" style="height: var(--sp-3); width: 30%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-6); width: 45%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-3); width: 80%"></div>' +
      '</div>' +
      '<div class="card mt-3"><div class="skel" style="height: var(--sp-6); width: 100%"></div></div>' +
    '</div>';
  };

  VIEWS.error = function () {
    return '<div class="banner banner--error mt-4" role="alert" data-testid="cycle-error">' +
        ICO.alert +
        '<span><strong>Could not read your cycle log</strong>It is on this phone; the app could ' +
          'not open it just now. Nothing has been changed or lost.</span>' +
      '</div>' +
      '<button class="btn btn--primary btn--block mt-3" type="button" data-act="retry" data-testid="cycle-retry">' +
        '<span class="btn__label">Try again</span></button>';
  };

  /* ---------------------------------------------------------------
     The day sheet
     --------------------------------------------------------------- */
  function hiddenNote(what) {
    return '<div class="card card--outline mt-3" data-testid="discreet-' + what + '">' +
      '<p class="t-detail">Hidden by discreet mode.</p>' +
      '<button class="btn btn--secondary btn--block mt-2" type="button" data-act="reveal" ' +
        'data-testid="reveal-' + what + '"><span class="btn__label">Show them for now</span></button>' +
      '<p class="t-caption-1 quiet mt-2">Showing them here does not turn discreet mode off, and they ' +
        'go again when this sheet closes.</p>' +
    '</div>';
  }

  function daySheet(day) {
    var d = S.draft, p = S.p;
    var quiet = p.discreet && !S.reveal;
    var dc = dayInCycleAt(day);
    return '<div class="scrim" data-act="close" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dy-title" ' +

        '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-headline grow" id="dy-title">' + dowOf(day) + ', ' + esc(absDate(day)) +
            (dc !== null && !p.discreet ? ' <span class="t-caption-1 quiet">day ' + dc + '</span>' : '') + '</h2>' +
          '<button class="iconbtn" type="button" data-act="close" aria-label="Close" data-testid="day-close">' +
            ICO.close + '</button></div>' +
        '<div class="sheet__body">' +

          '<h3 class="t-label">Flow</h3>' +
          scaleStrip({ id: 'flow', label: 'Flow', act: 'flow', value: d.flow || 0, items: FLOWS }) +

          (isPill(p.birthControl)
            ? '<div class="card card--flush mt-4"><div class="row">' +
                '<span class="row__main"><span class="row__title" id="lbl-pill">Pill taken</span>' +
                '<span class="row__sub">' + esc(bcLabel(p.birthControl)) + '</span></span>' +
                '<button class="switch" role="switch" aria-checked="' + !!d.pill + '" ' +
                  'aria-labelledby="lbl-pill" data-act="pill" data-testid="day-pill">' +
                  '<span class="switch__track"></span><span class="switch__knob"></span></button>' +
              '</div></div>'
            : '') +

          '<h3 class="t-label mt-5">Symptoms</h3>' +
          (quiet ? hiddenNote('symptoms') :
            '<div class="stack stack--3 mt-2">' + SYMPTOMS.map(function (sy) {
              var v = (d.sym && d.sym[sy[0]]) || 0;
              return '<div class="cycsev" data-testid="sym-' + sy[0] + '">' +
                '<span class="t-body cycsev__n" id="sev-lbl-' + sy[0] + '">' + esc(sy[1]) + '</span>' +
                '<div class="seg" role="radiogroup" aria-labelledby="sev-lbl-' + sy[0] + '">' +
                  SEVERITY.map(function (s) {
                    return '<button class="seg__item" type="button" role="radio" ' +
                      'aria-checked="' + (v === s[0]) + '" data-act="sym" data-k="' + sy[0] + '" ' +
                      'data-v="' + s[0] + '" data-testid="sym-' + sy[0] + '-' + s[0] + '">' + s[1] + '</button>';
                  }).join('') +
                '</div></div>';
            }).join('') + '</div>') +

          '<h3 class="t-label mt-5">Energy, 1 low to 5 high</h3>' +
          scaleStrip({ id: 'energy', label: 'Energy', act: 'energy', value: d.energy || 0, items: SCALE5 }) +

          '<h3 class="t-label mt-5">Sleep, 1 poor to 5 good</h3>' +
          scaleStrip({ id: 'sleep', label: 'Sleep', act: 'sleep', value: d.sleep || 0, items: SCALE5 }) +

          '<h3 class="t-label mt-5">How you felt</h3>' +
          (quiet ? hiddenNote('mood') :
            '<div class="chiprow mt-2">' + MOODS.map(function (m) {
              var on = (d.mood || []).indexOf(m[0]) >= 0;
              return '<button class="chip" type="button" aria-pressed="' + on + '" ' +
                'data-act="mood" data-k="' + m[0] + '" data-testid="mood-' + m[0] + '">' + m[1] + '</button>';
            }).join('') + '</div>') +

          '<h3 class="t-label mt-5">Sex</h3>' +
          (quiet ? hiddenNote('sex') :
            '<div class="seg mt-2" role="radiogroup" aria-label="Sex">' + SEX.map(function (x) {
              return '<button class="seg__item" type="button" role="radio" ' +
                'aria-checked="' + ((d.sex || 'none') === x[0]) + '" data-act="sex" data-v="' + x[0] + '" ' +
                'data-testid="sex-' + x[0] + '">' + x[1] + '</button>';
            }).join('') + '</div>' +
            '<p class="t-caption-1 quiet mt-2">Logged because it is a fact about the day, next to the ' +
              'other facts. It is not used to work anything out.</p>') +

          '<h3 class="t-label mt-5">Events</h3>' +
          (quiet ? hiddenNote('events') :
            '<div class="card card--flush mt-2">' + EVENTS.map(function (ev) {
              var on = (d.events || []).indexOf(ev[0]) >= 0;
              return '<button class="opt" type="button" role="checkbox" aria-checked="' + on + '" ' +
                'data-act="event" data-k="' + ev[0] + '" data-testid="event-' + ev[0] + '">' +
                '<span class="opt__mark">' + svg('<path d="m5 12 4.5 4.5L19 7"/>') + '</span>' +
                '<span class="opt__main"><span class="opt__title">' + esc(ev[1]) + '</span>' +
                (ev[2] ? '<span class="opt__sub">' + esc(ev[2]) + '</span>' : '') + '</span></button>';
            }).join('') + '</div>') +

          '<label class="t-label field__label mt-5" for="day-note">Note</label>' +
          '<textarea class="input" id="day-note" rows="3" data-testid="day-note" ' +
            'placeholder="Anything worth remembering.">' + esc(d.note || '') + '</textarea>' +
        '</div>' +
        '<div class="sheet__foot">' +
          '<div class="hstack hstack--2">' +
            '<button class="btn btn--primary grow" type="button" data-act="day-save" data-testid="day-save">' +
              '<span class="btn__label">Save</span></button>' +
            (S.days[day]
              ? '<button class="btn btn--danger" type="button" data-act="day-clear" data-testid="day-clear">' +
                  '<span class="btn__label">Clear</span></button>'
              : '') +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* ---------------------------------------------------------------
     Settings and birth control sheets
     --------------------------------------------------------------- */
  function settingsSheet() {
    var p = S.p;
    return '<div class="scrim" data-act="close" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cs-title" ' +
        'data-detents="0.7 0.92" data-detent-open="0.92" data-testid="cycle-settings-sheet">' +
        '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
        '<div class="sheet__head"><h2 class="t-headline grow" id="cs-title">Cycle settings</h2>' +
          '<button class="iconbtn" type="button" data-act="close" aria-label="Close" data-testid="cs-close">' +
            ICO.close + '</button></div>' +
        '<div class="sheet__body">' +
          '<div class="card card--flush">' +
            '<div class="row">' +
              '<span class="row__main">' +
                '<span class="row__title" id="lbl-discreet">Discreet mode</span>' +
                '<span class="row__sub">' + (p.discreet
                  ? 'The day count stays. The phase name, the symptom names and the events section are hidden until you tap to show them.'
                  : 'Shows the phase name, your symptoms and the events section.') + '</span>' +
              '</span>' +
              '<button class="switch" role="switch" aria-checked="' + !!p.discreet + '" ' +
                'aria-labelledby="lbl-discreet" data-act="discreet" data-testid="cs-discreet">' +
                '<span class="switch__track"></span><span class="switch__knob"></span></button>' +
            '</div>' +
            '<div class="row">' +
              '<span class="row__main">' +
                '<span class="row__title" id="lbl-irregular">Irregular cycles</span>' +
                '<span class="row__sub">' + (p.irregular
                  ? 'Estimates are shown as a range rather than a date, widened to ' + plural(band().days, 'day', 'days') + ' either side.'
                  : 'Estimates are shown as a single date with a give or take.') + '</span>' +
              '</span>' +
              '<button class="switch" role="switch" aria-checked="' + !!p.irregular + '" ' +
                'aria-labelledby="lbl-irregular" data-act="irregular" data-testid="cs-irregular">' +
                '<span class="switch__track"></span><span class="switch__knob"></span></button>' +
            '</div>' +
            /* F-CYCLE-036. The opt-in half of health-data sync, built and
               honest. The switch records the decision in the profile this
               screen already owns; there is no server in this build, so the
               row says what would leave the phone and that none of it has.

            '<div class="row">' +
              '<span class="row__main">' +
                '<span class="row__title" id="lbl-cloud">Back this log up</span>' +
                '<span class="row__sub">' + (p.cloudBackup
                  ? (cloudReady()
                      ? 'On. Your logged days and these settings go with the rest of your account.'

                  : 'Off. The log stays on this phone.') +
                  ' A backup would send your logged days — flow, symptoms, moods, notes and events — and these settings to your account. This switch is the only record that you said yes, and a sync has to read it before it carries any of them.</span>' +
              '</span>' +
              '<button class="switch" role="switch" aria-checked="' + !!p.cloudBackup + '" ' +
                'aria-labelledby="lbl-cloud" data-act="cs-cloud" data-testid="cs-cloud">' +
                '<span class="switch__track"></span><span class="switch__knob"></span></button>' +
            '</div>' +
            '<button class="row row--withaside" type="button" data-act="open-bc" data-testid="cs-bc">' +
              '<span class="row__main"><span class="row__title">Birth control</span>' +
                '<span class="row__sub">Changes what this screen can honestly say</span></span>' +
              '<span class="row__value">' + esc(bcLabel(p.birthControl)) + '</span>' +
              '<span class="row__chev" aria-hidden="true">' + ICO.chev + '</span>' +
            '</button>' +
          '</div>' +

          '<label class="t-label field__label mt-4" for="cs-start">Last period started</label>' +
          '<input class="input" id="cs-start" type="date" max="' + TODAY + '" ' +
            'value="' + esc(p.lastStart || '') + '" data-testid="cs-start">' +
          '<label class="t-label field__label mt-3" for="cs-cycle">Cycle length, days</label>' +
          '<input class="input num" id="cs-cycle" type="number" min="15" max="60" step="1" ' +
            'inputmode="numeric" value="' + p.cycleLen + '" data-testid="cs-cycle">' +
          '<label class="t-label field__label mt-3" for="cs-period">Period length, days</label>' +
          '<input class="input num" id="cs-period" type="number" min="1" max="10" step="1" ' +
            'inputmode="numeric" value="' + p.periodLen + '" data-testid="cs-period">' +
          (S.setupError ? '<p class="field__error mt-2" role="alert" data-testid="cs-error">' +
            esc(S.setupError) + '</p>' : '') +

          '<div class="card card--flush mt-4">' +
            '<button class="row row--withaside" type="button" data-act="cs-export" data-testid="cs-export">' +
              '<span class="row__main"><span class="row__title">Export your cycle log</span>' +
                '<span class="row__sub">A file saved to this phone. Nothing is uploaded.</span></span>' +
              '<span class="row__chev" aria-hidden="true">' + ICO.save + '</span>' +
            '</button>' +
          '</div>' +

          '<p class="t-caption-1 quiet mt-4">Everything here stays on this phone unless you ' +
            'turn the backup switch on. Deleting removes the log and the settings and ' +
            'cannot be undone.</p>' +
        '</div>' +
        '<div class="sheet__foot">' +
          '<div class="stack stack--2">' +
            '<button class="btn btn--primary btn--block" type="button" data-act="cs-save" data-testid="cs-save">' +
              '<span class="btn__label">Save</span></button>' +
            /* Two taps. Every other destructive control in this build arms
               first; this one used to wipe the log and the settings on one,
               with no confirm and no undo. */
            '<button class="btn btn--danger btn--block" type="button" data-act="cs-delete" data-testid="cs-delete">' +
              '<span class="btn__label">Delete everything logged here</span></button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function bcSheet() {
    var p = S.p;
    return '<div class="scrim" data-act="close" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bc-title" data-testid="cycle-bc-sheet">' +
        '<div class="sheet__head"><h2 class="t-headline grow" id="bc-title">Birth control</h2>' +

              '<span class="opt__mark">' + svg('<path d="m5 12 4.5 4.5L19 7"/>') + '</span>' +

          '<p class="t-caption-1 quiet mt-3">On a combined pill or a hormonal IUD the bleed you get is ' +

          (isPill(p.birthControl)
            ? '<p class="t-caption-1 quiet mt-2">A pill taken toggle is added to each day sheet.</p>'
            : '') +
        '</div>' +
      '</div>';
  }

  var DIALOGS = {
    'delete': {
      title: 'Delete everything logged here?',
      body: 'Your cycle settings and every day you have logged are removed from this phone. ' +

    }

  function dialogHTML(id) {

        'aria-describedby="dlg-body" data-testid="dialog-' + id + '">' +
        '<h2 class="t-section" id="dlg-title">' + esc(c.title) + '</h2>' +
        '<p class="t-detail mt-2" id="dlg-body">' + esc(c.body) + '</p>' +
        '<div class="stack stack--2 mt-5">' +
          '<button class="btn btn--danger-solid btn--block" type="button" data-act="confirm" data-k="' + id + '" ' +
            'data-testid="confirm-' + id + '"><span class="btn__label">' + esc(c.go) + '</span></button>' +
          '<button class="btn btn--tertiary btn--block" type="button" data-act="close-dialog" ' +
            'data-testid="cancel-' + id + '"><span class="btn__label">Cancel</span></button>' +
        '</div>' +
      '</div>';
  }

  function overlayHTML() {
    if (S.dialog) return dialogHTML(S.dialog);
    if (S.sheet === 'settings') return settingsSheet();
    if (S.sheet === 'bc') return bcSheet();
    if (S.sheet) return daySheet(S.sheet);
    return '';
  }

  /* ---------------------------------------------------------------
     Paint
     --------------------------------------------------------------- */
  var hdr = document.getElementById('hdr');
  var body = document.getElementById('body');
  var overlay = document.getElementById('overlay');
  var screen = document.getElementById('screen');
  var toastTimer = null;

  function toastHTML() {
    if (!S.toast) return '';
    return '<div class="toast toast--nonav" role="status" data-testid="toast">' +
      '<span class="toast__body">' + esc(S.toast) + '</span></div>';
  }

  function render() {
    /* The bridge is refreshed from the paint, because the paint is the one
       thing that happens on every route in, every logged day and every
       settings change. It writes only when the answer has moved. */
    if (S.state === 'populated' || S.state === 'discreet') writeBridge();
    screen.setAttribute('data-state', S.state);
    screen.setAttribute('data-view', S.view);
    LKPatch(hdr, headerHTML());
    LKPatch(body, (VIEWS[S.state] || VIEWS.populated)());
    LKPatch(overlay, overlayHTML() + toastHTML());
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.devState));
    });
    if (window.LKChrome) LKChrome.init(document);
    /* Today is the rightmost day, so the strip opens on it rather than on
       four weeks ago. Only when the reader has not scrolled it themselves --
       LKPatch keeps the scroll position, and overriding a deliberate scroll
       on every render would fight the finger. */
    var st = document.querySelector('.cyc');
    if (st && !st.__lk_placed) {
      st.__lk_placed = true;
      st.scrollLeft = st.scrollWidth;
    }
    bindRing();
    clearTimeout(toastTimer);
    if (S.toast) toastTimer = setTimeout(function () { S.toast = null; render(); }, 5000);
  }
  function say(msg) { S.toast = msg; render(); }

  /* ---------------------------------------------------------------
     The ring's drag. Pointer events on the box, and arrow keys for
     anybody not using one.
     --------------------------------------------------------------- */
  function bindRing() {
    var box = document.getElementById('ring-box');
    if (!box || box.__lk_bound) return;
    box.__lk_bound = true;
    var dragging = false;
    function dayAt(e) {
      var r = box.getBoundingClientRect();
      var a = Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
      var deg = a * 180 / Math.PI + 90;
      while (deg < 0) deg += 360;
      deg = deg % 360;
      return Math.min(S.p.cycleLen, Math.max(1, Math.floor(deg / 360 * S.p.cycleLen) + 1));
    }
    box.addEventListener('pointerdown', function (e) {
      if (e.target.closest('button')) return;
      dragging = true;
      try { box.setPointerCapture(e.pointerId); } catch (err) {}
      var d = dayAt(e);
      if (d !== S.preview) { S.preview = d; render(); }
    });
    box.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var d = dayAt(e);
      if (d !== S.preview) { S.preview = d; render(); }
    });
    box.addEventListener('pointerup', function () { dragging = false; });
    box.addEventListener('pointercancel', function () { dragging = false; });
    box.addEventListener('keydown', function (e) {
      var cur = S.preview !== null ? S.preview : Math.min(dayInCycle() || 1, S.p.cycleLen);
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { S.preview = Math.min(S.p.cycleLen, cur + 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { S.preview = Math.max(1, cur - 1); }
      else if (e.key === 'Home') { S.preview = 1; }
      else if (e.key === 'End') { S.preview = S.p.cycleLen; }
      else if (e.key === 'Escape' && S.preview !== null) { S.preview = null; }
      else return;
      e.preventDefault();
      render();
      var again = document.getElementById('ring-box');
      if (again) again.focus();
    });
  }

  /* ---------------------------------------------------------------
     Writes. Each one goes where the action is, not on a Save button
     somewhere else.
     --------------------------------------------------------------- */
  function writeToday(patch) {
    var e = S.days[TODAY] ? clone(S.days[TODAY]) : { flow: 0, sym: {}, mood: [], note: '' };
    Object.keys(patch).forEach(function (k) { e[k] = patch[k]; });
    if (isBlank(e)) delete S.days[TODAY]; else S.days[TODAY] = e;
    persistDays();
  }
  function isBlank(e) {
    if (e.flow) return false;
    if (e.energy || e.sleep) return false;
    if (e.pill) return false;
    if (e.note) return false;
    if (e.training) return false;
    if ((e.mood || []).length) return false;
    if ((e.events || []).length) return false;
    if (e.sex && e.sex !== 'none') return false;
    var sym = e.sym || {}, any = false;
    Object.keys(sym).forEach(function (k) { if (sym[k]) any = true; });
    return !any;
  }

  function exportLog() {
    var payload = {
      exportedOn: TODAY,
      note: 'LOCKED cycle log, exported on this device. Nothing was uploaded.',
      lk_mcProfile: S.p,
      lk_mcDays: S.days
    };
    try {
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'locked-cycle-' + TODAY + '.json';
      a.setAttribute('data-testid', 'export-link');
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 2000);
      return Object.keys(S.days).length;
    } catch (e) {
      return -1;
    }
  }

  /* ---------------------------------------------------------------
     Clicks
     --------------------------------------------------------------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t) return;
    var a = t.getAttribute('data-act');

    if (a === 'back') { LKGo('home'); return; }
    if (a === 'open-settings') { LKGo('settings'); return; }
    if (a === 'open-train') { LKGo('train'); return; }
    if (a === 'close') { S.sheet = null; S.draft = null; S.setupError = null; S.reveal = false; render(); return; }
    if (a === 'close-dialog') { S.dialog = null; render(); return; }
    if (a === 'settings') { S.sheet = 'settings'; S.setupError = null; render(); return; }
    if (a === 'open-bc') { S.sheet = 'bc'; render(); return; }
    if (a === 'back-settings') { S.sheet = 'settings'; render(); return; }
    if (a === 'reveal') { S.reveal = true; render(); return; }
    if (a === 'toggle-view') { S.view = S.view === 'calendar' ? 'cycle' : 'calendar'; render(); return; }
    if (a === 'cal-prev') { S.calOffset--; render(); return; }
    if (a === 'cal-next') { S.calOffset++; render(); return; }
    if (a === 'acc') {
      var ak = t.getAttribute('data-k');
      S.open[ak] = !S.open[ak];
      render();
      return;
    }
    if (a === 'ring-today') { S.preview = null; render(); return; }
    if (a === 'retry') {
      S.state = 'loading'; render();
      setTimeout(function () { S.state = 'populated'; render(); }, 700);
      return;
    }

    /* --- quick actions ------------------------------------------- */
    if (a === 'log-period' || a === 'log-symptoms' || a === 'log-more') {
      openDay(TODAY);
      return;
    }
    if (a === 'pill-quick') {
      var was = (today() || {}).pill;
      writeToday({ pill: !was });
      render();
      say(was ? 'Pill unticked for today.' : 'Pill logged for today.');
      return;
    }
    if (a === 'focus-energy') {
      var strip1 = document.getElementById('today-energy');
      if (strip1) {
        strip1.scrollIntoView({ block: 'center' });
        var b1 = strip1.querySelector('button');
        if (b1) b1.focus();
      }
      return;
    }
    if (a === 'quick-flow') {
      writeToday({ flow: Number(t.getAttribute('data-v')) });
      render();
      say('Flow saved for today.');
      return;
    }
    if (a === 'quick-energy') {
      writeToday({ energy: Number(t.getAttribute('data-v')) });
      render();
      say('Energy saved for today.');
      return;
    }
    if (a === 'train-lighter' || a === 'train-fine') {
      writeToday({ training: a === 'train-lighter' ? 'lighter' : 'fine' });
      render();
      say(a === 'train-lighter' ? 'Written onto today: take it lighter.' : 'Written onto today: feeling fine.');
      return;
    }
    if (a === 'hide-flag') {
      S.p.flagsHidden = S.p.flagsHidden || {};
      S.p.flagsHidden[t.getAttribute('data-k')] = true;
      persistProfile();
      render();
      return;
    }
    if (a === 'end-recovery') {
      /* The date of the event being dismissed, so a later one still counts. */
      S.p.recoveryOffAt = recoveryDate() || TODAY;
      S.p.recoveryOff = true;
      persistProfile();
      render();
      say('Estimates are back on.');
      return;
    }

    /* --- the day sheet ------------------------------------------- */
    if (a === 'open-day') { openDay(t.getAttribute('data-day')); return; }
    if (a === 'flow') { S.draft.flow = Number(t.getAttribute('data-v')); render(); return; }
    if (a === 'energy') { S.draft.energy = Number(t.getAttribute('data-v')); render(); return; }
    if (a === 'sleep') { S.draft.sleep = Number(t.getAttribute('data-v')); render(); return; }
    if (a === 'pill') { S.draft.pill = !S.draft.pill; render(); return; }
    if (a === 'sex') { S.draft.sex = t.getAttribute('data-v'); render(); return; }
    if (a === 'sym') {
      var k = t.getAttribute('data-k'), v = Number(t.getAttribute('data-v'));
      S.draft.sym = S.draft.sym || {};
      if (v === 0) delete S.draft.sym[k]; else S.draft.sym[k] = v;
      render();
      return;
    }
    if (a === 'mood') {
      var m = t.getAttribute('data-k');
      S.draft.mood = S.draft.mood || [];
      var at = S.draft.mood.indexOf(m);
      if (at >= 0) S.draft.mood.splice(at, 1); else S.draft.mood.push(m);
      render();
      return;
    }
    if (a === 'event') {
      var ev = t.getAttribute('data-k');
      S.draft.events = S.draft.events || [];
      var ai = S.draft.events.indexOf(ev);
      if (ai >= 0) S.draft.events.splice(ai, 1); else S.draft.events.push(ev);
      render();
      return;
    }
    if (a === 'day-save') {
      var f = document.getElementById('day-note');
      S.draft.note = f ? f.value.trim() : '';
      var target = S.sheet;
      /* An entry with nothing in it is not an entry. Saving a blank day
         clears it rather than filling the strip with empty marks. */
      var blank = isBlank(S.draft);
      if (blank) delete S.days[target]; else S.days[target] = S.draft;
      /* No lastStart is written here. The starts are read back out of the
         log whenever they are needed, which is what makes clearing this day
         undo exactly what saving it did. */
      persistDays();
      persistProfile();
      S.sheet = null; S.draft = null; S.reveal = false;
      render();
      say(blank ? absDate(target) + ' cleared.' : absDate(target) + ' saved.');
      return;
    }
    if (a === 'day-clear') {
      var c = S.sheet;
      delete S.days[c];
      persistDays();
      S.sheet = null; S.draft = null; S.reveal = false;
      render();
      say(absDate(c) + ' cleared. Any estimate it moved has moved back.');
      return;
    }

    /* F-CYCLE-020, F-CYCLE-022. The switch is the whole of the write: on
       writes today's phase and the guidance table to lk_mcFuelAdjust, off
       puts the key back to `false`, which is what it holds in the seed. */
    if (a === 'fuel-share') {
      var wasOn = bridgeOn();
      if (store()) store().set('lk_mcFuelAdjust', wasOn ? false : bridgeRecord());
      render();
      say(wasOn
        ? 'Fuel and Train stop seeing your phase. Nothing is deleted from this screen.'
        : 'Fuel and Train can read today’s phase now. Nothing was sent anywhere.');
      return;
    }

    /* --- settings ------------------------------------------------ */
    if (a === 'discreet') { S.p.discreet = !S.p.discreet; S.reveal = false; persistProfile(); render(); return; }
    if (a === 'irregular') { S.p.irregular = !S.p.irregular; persistProfile(); render(); return; }
    if (a === 'cs-cloud') {
      S.p.cloudBackup = !S.p.cloudBackup;
      persistProfile();
      render();
      say(S.p.cloudBackup
        ? (cloudReady() ? 'Backup on.' : 'Recorded. Nothing has been backed up. Your log stays on this phone.')
        : 'Backup off. Nothing had been uploaded anyway.');
      return;
    }
    if (a === 'bc') {
      S.p.birthControl = t.getAttribute('data-v');
      persistProfile();
      S.sheet = 'settings';
      render();
      say('Birth control set to ' + bcLabel(S.p.birthControl).toLowerCase() + '.');
      return;
    }
    if (a === 'cs-export') {
      var n = exportLog();
      say(n < 0
        ? 'This browser would not save the file. Nothing left the phone either way.'
        : 'Saved ' + plural(n, 'logged day', 'logged days') + ' to a file on this device. Nothing was uploaded.');
      return;
    }
    if (a === 'cs-save') {
      var cy = parseInt((document.getElementById('cs-cycle') || {}).value, 10);
      var pe = parseInt((document.getElementById('cs-period') || {}).value, 10);
      var stv = (document.getElementById('cs-start') || {}).value;
      var err = validate(cy, pe, stv, false);
      if (err) { S.setupError = err; render(); return; }
      S.p.cycleLen = cy; S.p.periodLen = pe;
      S.p.lastStart = stv || null;
      persistProfile();
      S.sheet = null; S.setupError = null;
      render();
      say('Saved.');
      return;
    }
    if (a === 'cs-delete') { S.dialog = 'delete'; render(); return; }
    if (a === 'confirm') {
      if (t.getAttribute('data-k') === 'delete') {
        S.days = {};
        S.p = { setup: false, goal: null, lastStart: null, cycleLen: 28, periodLen: 5,
                irregular: false, birthControl: 'none', discreet: false, createdAt: TODAY };
        persistDays();
        persistProfile();
        S.dialog = null; S.sheet = null; S.setupStep = 0;
        S.state = 'setup';
        render();
        say('Everything logged here is gone.');
      }
      return;
    }

    /* --- setup --------------------------------------------------- */
    if (a === 'su-goal') { S.p.goal = t.getAttribute('data-v'); render(); return; }
    if (a === 'su-bc') { S.p.birthControl = t.getAttribute('data-v'); render(); return; }
    if (a === 'su-irregular') { S.p.irregular = !S.p.irregular; render(); return; }
    if (a === 'su-unsure') {
      S.p.lastStart = null;
      S.setupError = null;
      S.setupStep++;
      render();
      return;
    }
    if (a === 'setup-back') { S.setupStep = Math.max(0, S.setupStep - 1); S.setupError = null; render(); return; }
    if (a === 'setup-skip') {
      S.p.setup = true;
      persistProfile();
      S.state = 'populated';
      render();
      say('Skipped. The defaults are 28 and 5, and settings changes them.');
      return;
    }
    if (a === 'setup-next') {
      var step = SETUP_STEPS[S.setupStep];
      if (step === 'start') {
        var sv = (document.getElementById('su-start') || {}).value;
        if (!sv) { S.setupError = 'Pick a date, or tap "I am not sure".'; render(); return; }
        var serr = validate(S.p.cycleLen, S.p.periodLen, sv, true);
        if (serr) { S.setupError = serr; render(); return; }
        S.p.lastStart = sv;
      }
      if (step === 'lengths') {
        var c2 = parseInt((document.getElementById('su-cycle') || {}).value, 10);
        var p2 = parseInt((document.getElementById('su-period') || {}).value, 10);
        var lerr = validate(c2, p2, S.p.lastStart, true);
        if (lerr) { S.setupError = lerr; render(); return; }
        S.p.cycleLen = c2; S.p.periodLen = p2;
      }
      S.setupError = null;
      if (S.setupStep < SETUP_STEPS.length - 1) { S.setupStep++; render(); return; }
      S.p.setup = true;
      persistProfile();
      S.state = 'populated';
      render();
      say('Tracking from ' + (S.p.lastStart ? absDate(S.p.lastStart) : 'your first logged period') + '.');
      return;
    }
  });

  /* One validator for the setup flow and the settings sheet, so a date the
     setup refuses cannot be typed into settings instead. */
  function validate(cy, pe, start, skipLengths) {
    if (!skipLengths || cy !== undefined) {
      if (isNaN(cy) || cy < 15 || cy > 60) return 'A cycle between 15 and 60 days.';
      if (isNaN(pe) || pe < 1 || pe > 10) return 'A period between 1 and 10 days.';
      if (pe >= cy) return 'A period cannot be as long as the whole cycle.';
    }
    if (start) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(start)) return 'That is not a date this screen can read.';
      var ago = daysBetween(start, TODAY);
      if (ago < 0) return 'That date has not happened yet. A start date is in the past.';
      if (ago > 400) return 'That is over a year ago. Use a more recent start, or clear it.';
    }
    return null;
  }

  function openDay(day) {
    var e0 = S.days[day];
    S.draft = e0 ? clone(e0) : { flow: 0, sym: {}, mood: [], note: '' };
    S.sheet = day;
    S.reveal = false;
    render();
  }

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (S.dialog) { S.dialog = null; render(); return; }
    if (S.sheet) { S.sheet = null; S.draft = null; S.reveal = false; render(); }
  });

  /* ---- dev states -------------------------------------------------- */
  var STATES = [
    ['populated', 'Tracking', function () {}],
    ['discreet', 'Discreet mode', function () { S.p.discreet = true; }],
    ['calendar', 'Calendar', function () { S.state = 'populated'; S.view = 'calendar'; }],
    ['rough', 'Rough day', function () {
      S.state = 'populated';
      S.days[TODAY] = { flow: 0, sym: { cramps: 2, fatigue: 2 }, mood: ['low'], energy: 2, note: '' };
    }],
    ['history', 'Several cycles', function () {
      /* Six months of starts so the calendar, the stats strip and the
         length chart have something to be about. Everything they show is
         still read out of this log, not stored as a figure. */
      S.state = 'populated';
      [['2026-04-06', 27], ['2026-05-03', 30], ['2026-06-02', 26], ['2026-06-28', 29],
       ['2026-07-27', 33], ['2026-08-29', 0]].forEach(function (pair) {
        for (var i = 0; i < 4; i++) {
          var d = shift(pair[0], i);
          if (!S.days[d]) S.days[d] = { flow: i === 0 ? 3 : i === 3 ? 1 : 2, sym: {}, mood: [], note: '' };
        }
      });
      S.p.lastStart = '2026-08-29';
    }],
    ['flags', 'Health flags', function () {
      S.state = 'populated';
      S.days = { '2026-05-20': { flow: 3, sym: {}, mood: [], note: '' },
                 '2026-05-21': { flow: 2, sym: {}, mood: [], note: '' } };
      S.p.lastStart = '2026-05-20';
    }],
    ['recovery', 'Recovery', function () {
      S.state = 'populated';
      S.days['2026-09-01'] = { flow: 3, sym: {}, mood: [], note: '', events: ['miscarriage'] };
    }],
    ['ec', 'After the morning-after pill', function () {
      S.state = 'populated';
      S.days['2026-09-06'] = { flow: 0, sym: {}, mood: [], note: '', events: ['ec'], sex: 'unprotected' };
    }],
    ['overdue', 'Overdue', function () {
      S.state = 'populated';
      S.days = { '2026-07-25': { flow: 3, sym: {}, mood: [], note: '' },
                 '2026-07-26': { flow: 2, sym: {}, mood: [], note: '' } };
      S.p.lastStart = '2026-07-25';
    }],
    ['empty', 'Nothing logged', function () { S.days = {}; }],
    ['setup', 'First run', function () {
      S.days = {};
      S.p = { setup: false, goal: null, lastStart: null, cycleLen: 28, periodLen: 5,
              irregular: false, birthControl: 'none', discreet: false, createdAt: TODAY };
    }],
    ['gated', 'Not enabled', function () {}],
    ['loading', 'Loading', function () {}],
    ['error', 'Error', function () {}]
  ];
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join(''));
  toggle.addEventListener('click', function () {
    var open = menu.hidden;
    menu.hidden = !open;
    this.setAttribute('aria-expanded', String(open));
  });
  function applyState(id) {
    var found = null;
    STATES.forEach(function (s) { if (s[0] === id) found = s; });
    if (!found) return;
    /* fresh: the switcher rebuilds from the seed rather than reading a
       person's stored log back over the state it is showing. */
    reset(true);
    S.devState = id;
    S.state = (id === 'populated' || id === 'discreet') ? id
      : (id === 'empty' || id === 'setup' || id === 'gated' || id === 'loading' || id === 'error') ? id
      : 'populated';
    S.view = 'cycle';
    found[2]();
    render();
  }
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (!b) return;
    applyState(b.dataset.state);
  });

  /* ---------------------------------------------------------------
     Boot
     --------------------------------------------------------------- */
  reset(false);
  S.devState = 'populated';
  if (!S.p.setup) S.state = 'setup';

  /* Settings owns the gate and writes it where this screen can read it. It
     is the default here, not an override: the dev switcher still wins.

     F-CYCLE-045, and why this is not gated on sex. The shipped app showed
     this screen only when lk_profile.sex was "female" and showed everybody
     else an explainer they could not act on. The gate is the reader's own
     switch now, for two reasons: a stored sex field is a worse predictor of
     who wants a cycle screen than the person saying so, and onboarding now
     offers cycle tracking as a step of its own, which is the same question
     asked once, in the open. The explainer below is kept -- it is what
     somebody who arrives here with the switch off needs -- and it points at
     the switch rather than at a field they cannot change. */
  function gateOn() {
    try { return localStorage.getItem('lk_cycle') === 'true'; } catch (e) { return false; }
  }
  if (!gateOn()) S.state = 'gated';

  /* THE SWITCH CAN MOVE AFTER THIS SCREEN HAS BOOTED. Read once, turning
     tracking on in Settings left this screen gated for good: Home grew a
     correct cycle row, tapping it said tracking was off, and Open Settings
     landed on the switch that was already on. Only a reload escaped, which a
     phone has no way to do. */
  function regate() {
    var want = gateOn();
    if (!want && S.state !== 'gated') { S.state = 'gated'; render(); return; }
    if (want && S.state === 'gated') {
      S.state = (store() && store().touched('lk_mcProfile')) || (S.p && S.p.setup) ? 'populated' : 'setup';
      render();
    }
  }
  document.addEventListener('lk:enter', regate);

  var q = new URLSearchParams(location.search);
  if (q.get('state')) applyState(q.get('state'));
  else render();

  /* Another tab, or Settings, changing the same keys. Two screens on one
     log cannot be allowed to drift. */
  if (store()) {
    store().onChange('lk_mcProfile', function (v) { if (v) { S.p = v; render(); } });
    store().onChange('lk_mcDays', function (v) { if (v) { S.days = v; render(); } });
    store().onChange('lk_cycle', regate);
  }

  requestAnimationFrame(function () { window.__ready = true; });
})();

  /* The running workout, from a screen that is not it. Leaving the workout
     log used to lose the session outright: nothing was written down, and no
     screen but Home and Fuel had anywhere to say one was open. The record
     lives in session.js; this mounts its shelf and takes the tap back. */
  if (window.LKSession) {
    LKSession.mount(document.getElementById('shelf-slot'),
      typeof LKPatch === 'function' ? LKPatch : null);
    document.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-testid="shelf-resume"]') : null;
      if (el) { e.preventDefault(); LKGo('workout-log'); }
    });
  }
</script>
</body>
</html>
