<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOCKED — Train</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="fixtures.js"></script>

<script src="chrome.js"></script>
<script src="session.js"></script>

<body>
<!--
  TRAIN — what this screen is, and why it is shaped this way.

  WHY IT EXISTS. The HIG audit's finding 2: "the split builder has no
  entrance once you have a split. Train lands directly on Exercises with
  no sub-navigation, and populated Home offers only 'Choose another
  session'. For a user who already has a split, editing their own
  program is unreachable at any depth." Train is now the home of
  everything training-related that is not the active session: the splits
  you own, the record of what you did, cardio, and the catalogue.

  STRUCTURE: ONE SCROLLING SCREEN, ONE PUSHED DESTINATION, TWO SHEETS.

  Sections on one screen, not tabs. The audited hub had a three-item
  underline sub-tab row (My Splits / History / Library) that was broken
  as a set — "Library" replaced the whole hub while the other two swapped
  content — and the design audit counted it as the app's sixth tab
  idiom. The four things this screen holds are not peers you switch
  between; they are one continuous answer to "what do I do about
  training". Splits, cardio and history are read in that order, top to
  bottom, and stacking them costs a scroll rather than a tap. The
  segmented control is spent once, on the one place a filter genuinely
  reduces work: the full history list. That is the app's single
  segmented control, and this screen introduces no second tab pattern.

  Two things push away, both because they are deeper than daily:
    - All history (22 sessions, filterable) is its own destination,
      reached from a five-row preview. Same row component in both, so
      this is a preview and its expansion, not the two competing
      history lists the Cardio audit found.
    - Editing a split lives inside a sheet on the split, one level below
      starting a day. Monthly action, one level deeper; still findable
      because the split row is the obvious thing to touch.

  TAPS. Start today's session: 1 (Start Push, first fold). Start any
  other day: 2 (split row, then the day). Edit a split: 2 (split row,
  then Edit split). The audited hub was 3 taps cold to a programmed
  workout, and editing a split had no entrance at all.

  WHAT CAME FROM CARDIO. Both audits concluded Cardio merges here: its
  history list filtered the same lk_history Train already rendered, so
  one of the two was pure duplication.
    - The history row design. The Cardio audit judged its row the
      better of the two: icon, title, one muted metric line, a
      right-aligned date. Train's printed the duration twice and wrapped
      the metrics in an accent-outlined pill that competed with the
      lifting volume figure. This screen has one row component, used for
      both kinds of session; the duration is printed once and no metric
      carries a pill.
    - MINUTES PER WEEK, kept as built: eight bars, tabular labels, a
      dated axis, one bar standing out. Its ink is --text rather than
      the accent, because the accent on this screen is on Start.
    - Instead of the 41-tile wall: ranking. The audit called the wall a
      selection problem — 41 equal tiles ordered by category, ~2,700px
      tall, favourites the real fix but taught only in the empty state.
      Here the three activities this lifter actually does are rows at
      the top, already carrying their usual duration, one tap to log.
      Everything else is behind one row that opens a search-first
      picker. Rank the list, do not enlarge the grid.
    - Dropped from Cardio: the separate screen and its back button, the
      duplicate history list and filter chips, the "which treadmill?"
      step its own copy called cosmetic, the tile gradients and glow.

  ALSO CUT. Quick Start (an accent fill that started an empty workout
  while the programmed session sat below the fold), the RECENT strip
  (clipped past the third chip, every chip reachable from history), the
  day sheet that re-listed days already on screen, and Delete split from
  the footer row — it had no confirm and sat a thumb-width from Start.
  Deleting a split belongs in the editor that owns it.

  ACCENT: exactly one fill per state, on the action a lifter came to
  take. Populated: Start Push. Empty: Build a split. Error: Try again.
  Loading and the history destination carry none.

  DATA: inlined from tests/fixtures/seed-data.json — lk_splits (3),
  lk_history (18 lifting + 4 cardio, 2026-07-30 to 2026-09-06),
  lk_cardioFavorites. Units kg from lk_profile.useKg. Today is
  Wed 9 Sep 2026, matching home.html.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-train" data-state="populated" data-view="hub">

      <header class="hdr" data-scroll-edge="#body" id="hdr">
      </header>

      <main class="body" id="body" data-testid="train-scroll" tabindex="-1"></main>

      <!-- The live session, seen from here. Empty unless a workout is
           running; it sits between the content and the bottom of the
           screen rather than over it, so nothing it says costs a row. -->
      <div id="shelf-slot"></div>


      <nav class="tabbar" aria-label="Sections" data-minimize="#body">
        <button class="tabbar__item" type="button" data-testid="tab-home">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></svg>
          <span class="tabbar__label">Home</span>
        </button>
        <button class="tabbar__item" type="button" aria-current="page" data-testid="tab-train">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>
          <span class="tabbar__label">Train</span>
        </button>
        <button class="tabbar__item" type="button" data-testid="tab-fuel">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 3v8a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M9 13v8"/><path d="M17 3c-1.5 1.8-2 3.6-2 5.5 0 1.6.7 2.5 2 2.5s2-.9 2-2.5c0-1.9-.5-3.7-2-5.5Z"/><path d="M17 11v10"/></svg>
          <span class="tabbar__label">Fuel</span>
        </button>
        <button class="tabbar__item" type="button" data-testid="tab-coach">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 15a3 3 0 0 1-3 3H9l-4 3V7a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3z"/></svg>
          <span class="tabbar__label">Coach</span>
        </button>
        <button class="tabbar__item" type="button" data-testid="tab-profile">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
          <span class="tabbar__label">Profile</span>
        </button>
      </nav>

      <div id="overlay" data-testid="overlay"></div>
      <div id="toast-slot" data-testid="toast-slot"></div>

    </div>
  </div>
</div>

<div class="dev">
  <button class="dev__toggle" type="button" id="dev-toggle" aria-expanded="false" aria-controls="dev-menu" data-testid="dev-toggle">State</button>
  <div class="dev__menu" id="dev-menu" hidden data-testid="dev-menu"></div>
</div>

<script>
(function () {
  "use strict";

  /* =============================================================
     Icons. One set, one stroke weight, one optical size. Cardio
     sessions all carry the same glyph: the label says which
     activity, so 41 distinct icons would be 41 things to learn.
     ============================================================= */
  function svg(d, extra) {
    return '<svg class="ico' + (extra || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + d + '</svg>';
  }
  var ICO = {
    play:    svg('<path d="M8 5.5v13l11-6.5z"/>'),
    chev:    svg('<path d="m9 5 7 7-7 7"/>'),
    back:    svg('<path d="m15 5-7 7 7 7"/>'),
    lift:    svg('<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>'),
    cardio:  svg('<path d="M3 12h3.5l2-6 4 12 2.2-6H21"/>'),
    split:   svg('<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M8 3v4M16 3v4M3.5 10.5h17"/>'),
    book:    svg('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/>'),
    plus:    svg('<path d="M12 6v12M6 12h12"/>'),
    pencil:  svg('<path d="M4 20h4l10-10-4-4L4 16zM14 6l4 4"/>'),
    close:   svg('<path d="M7 7l10 10M17 7L7 17"/>'),
    alert:   svg('<path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/>'),
    search:  svg('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>'),
    plan:    svg('<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M8 3v4M16 3v4M3.5 10.5h17"/>'),
    star:    svg('<path d="M12 4l2.4 5.2 5.6.7-4.1 3.9 1.1 5.6-5-2.9-5 2.9 1.1-5.6L4 9.9l5.6-.7z"/>'),
    trash:   svg('<path d="M5 7h14M10 7V4.5h4V7M9 11v6M15 11v6M7 7l1 13h8l1-13"/>'),
    up:      svg('<path d="M12 19V5M6 11l6-6 6 6"/>'),
    down:    svg('<path d="M12 5v14M6 13l6 6 6-6"/>')
  };

  /* =============================================================
     Formatting. Every figure is tabular and carries its unit.
     Dates are relative inside the week, absolute after it.
     ============================================================= */
  var MONTHS = ['January','February','March','April','May','June','July',
                'August','September','October','November','December'];
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  /* The fixture's today, not the wall clock. Every date on this screen is
     measured against the seed, so a log stamped with the real date read
     "last -1 days ago" the moment the two disagreed. */
  /* The wall clock, or the seed's date while a seed is loaded. Pinned to
     the fixture, a build with no seed read undefined. */
  var TODAY = window.LKStore ? LKStore.today() : new Date().toISOString().slice(0, 10);

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function n(v) { return '<span class="num">' + v + '</span>'; }
  function group(v) { return Number(v).toLocaleString('en-US'); }
  function ms(iso) {
    var p = iso.split('-');
    return Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function daysAgo(iso) { return Math.round((ms(TODAY) - ms(iso)) / 86400000); }
  function absDate(iso) {
    var p = iso.split('-');
    return MON[Number(p[1]) - 1] + ' ' + Number(p[2]);
  }
  function relDate(iso) {
    var d = daysAgo(iso);
    if (d === 0) return 'Today';
    if (d === 1) return 'Yesterday';
    if (d < 7) return d + ' days ago';
    return absDate(iso);
  }
  function monthOf(iso) {
    var p = iso.split('-');
    return MONTHS[Number(p[1]) - 1] + ' ' + p[0];
  }

  /* =============================================================
     Seed and store. tests/fixtures/seed-data.json is the seed; once a
     person has logged anything, LKStore holds the truth and the fixture
     is never consulted again for that key. Everything below is READ
     through loadData() rather than frozen into a const, because a cardio
     session logged on this screen has to move the chart, the week row and
     the history list, and a reload has to find it still there.
     ============================================================= */
  function store() { return window.LKStore; }
  /* `fresh` is the dev switcher rebuilding a state from scratch: it must not
     read a person's stored sessions back over the state it is showing. */
  function rd(key, fallback, fresh) {
    var st = store();
    if (!st || fresh) {
      var F = window.LKFixtures;
      if (!fresh && !st) return fallback;
      if (key === 'lk_history' && F) return JSON.parse(JSON.stringify(F.history));
      if (key === 'lk_splits' && F) return JSON.parse(JSON.stringify(F.splits));
      return fallback;
    }
    return st.get(key, fallback);
  }

  /* A stored split carries `created` as "7/25/2026" and history carries ISO.
     absDate() split on "-" and so read "edited undefined NaN" on every split
     sheet in the build. Both shapes are understood here, and anything that is
     neither is absent rather than a word. */
  function toISO(s) {
    if (!s) return null;
    s = String(s);
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!m) return null;
    function p2(v) { return (v.length < 2 ? '0' : '') + v; }
    return m[3] + '-' + p2(m[1]) + '-' + p2(m[2]);
  }

  var MIN_PER_EX = 10;
  var SPLITS = [], HISTORY = [], WEEKS = [], FAVS = [], CUSTOM_CARDIO = [];
  var PREFS = {}, PROFILE = {}, BODY_KG = 70;

  /* lk_splits. The day rows' exercise counts are COUNTED and the split's own
     total is the sum of them. The sheet printed days.length * 5, which is
     true of PPL and of nothing else: an Upper/Lower of 10 exercises read 10
     only by coincidence, and a day with four lifts was still counted as five. */
  /* The median length of the sessions logged under a day's name, to the
     nearest five minutes. Home computes the same figure the same way; two
     screens describing one session must not disagree about how long it is. */
  function medianMinutes(dayName) {
    var raw = (window.LKStore ? window.LKStore.get('lk_history', null) : null) ||
              (window.LKFixtures && LKFixtures.history) || [];
    var needle = String(dayName || '').toLowerCase(), mins = [];
    if (!needle) return 0;
    raw.forEach(function (w) {
      if (w.kind !== 'lift' || !w.min) return;
      if (String(w.name).toLowerCase().indexOf(needle) < 0) return;
      mins.push(w.min);
    });
    if (!mins.length) return 0;
    mins.sort(function (a, b) { return a - b; });
    return Math.round(mins[Math.floor(mins.length / 2)] / 5) * 5;
  }

  /* WHICH day the log should open. Handed over by id, because the log used
     to open its own seeded Push session whatever was pressed. */
  function handStartDay(key) {
    try { localStorage.setItem('lk_startDay', String(key || '')); } catch (e) {}
  }
  function todayDayKey() {
    if (!SPLITS.length || !SPLITS[0].days.length) return '';
    return SPLITS[0].id + ':' + SPLITS[0].days[0].id;
  }

  /* A DAY'S LIFTS, in either shape it is stored in. A phone that has been
     running LOCKED holds `exIds: [111, 302, ...]` on each day -- that is what
     tests/fixtures/seed-data.json carries, because it is a copy of a real
     phone -- while the split builder writes the resolved `exercises: [{id,
     name, group, muscle}]`. Reading only the second counted every day of a
     real user's split as zero exercises, and the card said "0 exercises,
     about 0 min" over a Push day with five lifts in it. */
  function dayExercises(d) {
    if (d && d.exercises && d.exercises.length) return d.exercises;
    if (d && d.exIds && d.exIds.length) {
      return d.exIds.map(function (id) { return { id: id }; });
    }
    return [];
  }

  function loadSplits(fresh) {
    var raw = rd('lk_splits', [], fresh) || [];
    SPLITS = raw.map(function (sp, i) {
      var days = (sp.days || []).map(function (d, j) {
        var count = dayExercises(d).length;
        var blocks = (d.blocks || []).length;
        /* How long this day has ACTUALLY taken, the median of the sessions
           logged under its name, rounded to five minutes. A flat ten minutes
           a lift put Train at 50 min for the same Push session Home called
           55, on the same screenful. */
        var mins = medianMinutes(d.name);
        return { id: (d.name || ('day' + j)).toLowerCase().replace(/\W+/g, '-'), name: d.name,
                 exercises: count, blocks: blocks,
                 minutes: mins || (count * MIN_PER_EX),
                 measured: !!mins, next: i === 0 && j === 0 };
      });
      return {
        id: sp.id, name: sp.name, current: i === 0,
        updated: toISO(sp.updated || sp.created),
        exercises: days.reduce(function (a, d) { return a + d.exercises; }, 0),
        days: days
      };
    });
  }

  /* =============================================================
     CARDIO v1 -> v2 — F-TRAIN-025.

     LOCKED shipped a first cardio schema and then replaced it. A v1 row is
     { cardioType, duration (minutes), distance + distanceUnit, intensity (a
     word), calories } under `type: 'cardio'`; a v2 row is the one every
     screen in this build reads — kind, min, km, cal, modality, durationSec,
     distanceM, intensity { rpe, estMET }. Nothing anywhere mapped one onto
     the other, so a phone that had been logging cardio before the upgrade
     opened Train to an empty cardio history, an empty chart and no bests:
     the rows were still on the device and no screen could read them.

     It runs once, before anything reads lk_history, and lk_cardioMigrated
     records that it has. It is safe to run twice: a row that is already v2
     is returned untouched. Nothing is deleted — a field that cannot be
     mapped is left on the record rather than dropped.
     ============================================================= */
  var V1_MODALITY = {
    run: 'run', jog: 'run', running: 'run', treadmill: 'treadmill_run',
    walk: 'walk', walking: 'walk', hike: 'hike', hiking: 'hike',
    bike: 'cycling', cycling: 'cycling', cycle: 'cycling', spin: 'spin_class',
    row: 'row', rowing: 'row', swim: 'swim_freestyle', swimming: 'swim_freestyle',
    elliptical: 'elliptical', stairs: 'stair_climber', stairmaster: 'stair_climber',
    hiit: 'hiit', circuit: 'circuit', other: 'custom'
  };
  var V1_RPE = { light: 3, easy: 3, moderate: 5, steady: 5, vigorous: 7, hard: 7, max: 9, 'all out': 9 };

  function isV1Cardio(w) {
    if (!w) return false;
    var isCardio = w.kind === 'cardio' || w.type === 'cardio';
    if (!isCardio) return false;
    /* Already v2: it carries the minutes and the modality this build reads. */
    if (w.min != null && w.modality) return false;
    return w.cardioType !== undefined || w.duration !== undefined;
  }

  function cardioV1toV2(w) {
    var out = {};
    Object.keys(w).forEach(function (k) { out[k] = w[k]; });
    var type = String(w.cardioType || w.type || '').toLowerCase();
    var mod = V1_MODALITY[type] || 'custom';
    out.kind = 'cardio';
    out.modality = w.modality || mod;
    /* The ISO date, because every date on every screen is compared as one.
       A v1 row carried a display string ("Sep 6") beside it. */
    out.date = String(w.dateISO || w.date || '').slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(out.date)) out.date = String(w.dateISO || '').slice(0, 10);
    var min = Number(w.min != null ? w.min : w.duration);
    if (!(min > 0) && w.durationSec) min = Math.round(Number(w.durationSec) / 60);
    out.min = min > 0 ? Math.round(min) : 0;
    out.durationSec = out.durationSec || out.min * 60;
    /* Distance: v1 stored the number and its unit side by side. Miles are
       converted to the kilometres the model is in, once, here. */
    if (out.km == null && w.distance != null && w.distance !== '') {
      var d = Number(w.distance);
      if (d > 0) {
        out.km = String(w.distanceUnit || 'km').toLowerCase().indexOf('mi') === 0
          ? Math.round(d * 1.609344 * 100) / 100 : Math.round(d * 100) / 100;
        out.distanceM = Math.round(out.km * 1000);
      }
    }
    /* Intensity was a word. It becomes the RPE the v2 shape carries, and the
       word is kept so nothing a person recorded is thrown away. */
    if (typeof w.intensity === 'string') {
      var rpe = V1_RPE[w.intensity.toLowerCase()];
      out.intensity = { rpe: rpe || null, estMET: null, talkTest: null, v1: w.intensity };
    }
    var cal = w.cal != null ? w.cal : (w.calories && w.calories.value != null ? w.calories.value : w.calories);
    if (typeof cal === 'number' && cal > 0) out.cal = Math.round(cal);
    /* No calorie figure in v1 and none can be invented: the estimate is done
       from this device's own body weight and what the row actually holds,
       and it is marked as an estimate, exactly like one logged today. */
    if (out.cal == null && out.min > 0) {
      var act = byModality(out.modality) || { name: out.name || 'Cardio', met: 6, f: [] };
      var est = estimate(act, { min: out.min, dist: out.km,
                                hr: (w.heartRate && w.heartRate.avg) || null });
      out.cal = est.kcal;
      out.calDetail = { value: est.kcal, net: est.net, gross: est.kcal,
                        range: [est.lo, est.hi], method: est.method, tier: est.tier,
                        confidence: est.conf.toLowerCase(), basis: 'gross', estimated: true };
    }
    if (!out.name) {
      var a2 = byModality(out.modality);
      out.name = a2 ? a2.name : 'Cardio';
    }
    if (!out.environment) out.environment = /treadmill|erg|elliptical|stair|spin|hiit|circuit|row$/.test(out.modality) ? 'indoor' : 'outdoor';
    out.schemaVersion = 2;
    return out;
  }

  function migrateCardio() {
    if (!window.LKStore) return false;
    if (LKStore.get('lk_cardioMigrated', false)) return false;
    var raw = LKStore.get('lk_history', null);
    if (raw && raw.length) {
      var changed = false;
      var next = raw.map(function (w) {
        if (!isV1Cardio(w)) return w;
        changed = true;
        return cardioV1toV2(w);
      });
      if (changed) LKStore.set('lk_history', next);
    }
    LKStore.set('lk_cardioMigrated', true);
    return true;
  }

  /* lk_history, in this screen's row shape. A lifting row carries sets and
     volume; a cardio row carries whatever was actually measured and nothing
     it was not. */
  function loadHistory(fresh) {
    var raw = rd('lk_history', [], fresh) || [];
    /* Every row needs an id before one is written into a testid, or the
       whole list renders as `history-undefined`. Stamped in place and
       written back once, unless this is the dev switcher showing a state
       it built itself -- that must not touch stored sessions. */
    if (window.LKHistory) {
      var st = LKHistory.withIds(raw);
      if (st.stamped && !fresh && window.LKStore) {
        try { LKStore.set('lk_history', st.list); } catch (e) {}
      }
      raw = st.list;
    }
    HISTORY = raw.map(function (w) {
      var row = { id: w.id, kind: w.kind === 'cardio' ? 'cardio' : 'lift',
                  /* ESCAPED BEFORE THE ENTITY IS PUT IN, not after. This
                     row's name is typed by a person -- and arrives from
                     the server on any phone that syncs -- and it is
                     concatenated straight into innerHTML below, so a
                     name containing a tag became a tag. Escaping has to
                     happen first, because the middot substituted next is
                     itself an entity and escaping after it would print
                     the word &middot; on the screen. */
                  name: String(w.name || '').replace(/ - /g, ' &middot; '),
                  date: w.date, min: w.min };
      if (row.kind === 'lift') { row.sets = w.sets; row.kg = w.kg; }
      else {
        /* A cardio record carries a lot and a hand-logged one carries almost
           none of it, so every field here is copied only where it exists.
           The row printed "undefined km, undefined cal" for a session nothing
           had measured. */

         'watts', 'hr', 'note', 'act', 'modality', 'environment', 'climb'
        ].forEach(function (k) { if (w[k] !== undefined && w[k] !== null && w[k] !== '') row[k] = w[k]; });
        if (w.heartRate && w.heartRate.avg) row.hr = Number(w.heartRate.avg);
        if (w.intensity) {
          if (w.intensity.rpe != null) row.rpe = Number(w.intensity.rpe);
          if (w.intensity.estMET != null) row.met = Number(w.intensity.estMET);
        }
        if (w.machine && w.machine.category) {
          /* The machine's NAME, not the id the record stores it under. A
             treadmill run logged on this screen writes category "treadrun",
             and the row printed that word back at the reader. */
          row.machine = machineName(w.machine.category) +
            (w.machine.brand ? ' \u00b7 ' + w.machine.brand : '');

  /* Minutes of cardio per week, Monday weeks, eight buckets ending on the
     week TODAY falls in. It was a hand-typed array, so a session logged on
     this screen moved a chart that had already been drawn from constants. */
  function mondayOf(iso) {
    var d = new Date(ms(iso));
    var dow = (d.getUTCDay() + 6) % 7;          /* Monday = 0 */
    d.setUTCDate(d.getUTCDate() - dow);
    return d.toISOString().slice(0, 10);
  }
  function loadWeeks() {
    var thisWeek = mondayOf(TODAY);
    var starts = [];
    for (var i = 7; i >= 0; i--) {
      var d = new Date(ms(thisWeek));
      d.setUTCDate(d.getUTCDate() - i * 7);
      starts.push(d.toISOString().slice(0, 10));
    }
    WEEKS = starts.map(function (s) {
      return { start: s, min: 0, cal: 0, n: 0, now: s === thisWeek };
    });
    HISTORY.forEach(function (w) {
      if (w.kind !== 'cardio') return;
      var wk = mondayOf(w.date);
      for (var i = 0; i < WEEKS.length; i++) {
        if (WEEKS[i].start === wk) {
          WEEKS[i].min += w.min || 0;
          WEEKS[i].cal += w.cal || 0;
          WEEKS[i].n += 1;
        }
      }
    });
  }

  /* The field schema. One row per field id, so a form is built from the
     activity rather than from a fixed list of questions. */
  /* =============================================================
     DISTANCE, in the unit this reader chose — F-CARDIO-020.

     Only pack weight was converted. Distance was hard-wired to kilometres,
     so a reader in pounds typed kilometres into the form, and the row, the
     detail, the pace and the bests all came back in kilometres beside every
     other figure on the screen in pounds.

     There is one stored answer about units and LKUnits owns it
     (lk_profile.useKg). Kilometres go with kilograms and miles with pounds:
     one switch, one answer, one conversion — and, exactly as with weight,
     THE MODEL IS ALWAYS METRIC. A record holds kilometres whatever the
     screen says, so switching units re-reads the history rather than
     rewriting it.
     ============================================================= */
  var KM_PER_MI = 1.609344;
  function useKm() { return !window.LKUnits || LKUnits.useKg(); }
  function distUnit() { return useKm() ? 'km' : 'mi'; }
  function speedUnit() { return useKm() ? 'km/h' : 'mph'; }
  /* Kilometres out of the record, as the number this screen shows. */
  function distV(km, d) {
    if (km === null || km === undefined || isNaN(km)) return km;
    var x = useKm() ? Number(km) : Number(km) / KM_PER_MI;
    var p = Math.pow(10, d === undefined ? 2 : d);
    return Math.round(x * p) / p;
  }
  /* What was typed, on the way into the record, and never again. */
  function distIn(v) {
    if (v === '' || v === null || v === undefined || isNaN(v)) return v;
    return useKm() ? Number(v) : Math.round(Number(v) * KM_PER_MI * 1000) / 1000;
  }
  function fmtDist(km) {
    var x = distV(km);
    return x === null || x === undefined || isNaN(x) ? '' : x + ' ' + distUnit();
  }

  var FIELD = {

  var EFFORT_K = { 'Easy': 0.85, 'Steady': 1, 'Hard': 1.15, 'All out': 1.3 };

  /* A machine id, as the name a person would call it. A record stores the
     catalogue's own id ("treadrun") or the shipped app's category word

  /* =============================================================
     THE CALORIE ESTIMATE. A logged cardio session carried no calorie
     figure at all: the sheet asked for minutes, wrote minutes, and the
     history row printed minutes. Every figure below is arithmetic done
     on this device from this person's own body weight and what they
     typed; nothing is fetched and nothing is invented.

       kcal = MET x 3.5 x kg / 200 x minutes

     which is the standard reading of a MET as 3.5 ml of oxygen per
     kilogram per minute at about 5 kcal per litre of oxygen. Where a
     distance was given for a run, walk or ride, the MET is read off the
     actual pace instead of the catalogue's steady-effort value, which is
     the single biggest improvement available without a chest strap.

     NET is the burn above simply existing for those minutes: (MET - 1).
     It is the smaller and the more honest number for anyone subtracting
     it from a food target, so both are shown and both are labelled.

     The range is not decoration. It widens as the inputs thin out, and
     the confidence pill says which of the five things the estimate wants
     were actually known. Nothing here is presented as measured. */
  function metForSpeed(kind, kph) {
    if (!(kph > 0)) return null;
    if (kind === 'run') {
      /* ACSM running: 0.2 ml/kg/min per m/min, plus 3.5 resting. */
      if (kph < 6.4) return null;                 /* that is a walk, not a run */
      return Math.min(23, (0.2 * (kph * 1000 / 60) + 3.5) / 3.5);
    }
    if (kind === 'walk') {
      if (kph > 8) return null;
      return Math.max(2, Math.min(9, (0.1 * (kph * 1000 / 60) + 3.5) / 3.5));
    }
    if (kind === 'bike') {
      if (kph < 8) return 3.5;
      if (kph < 16) return 5.8;
      if (kph < 19) return 6.8;
      if (kph < 22) return 8.0;
      if (kph < 26) return 10.0;
      if (kph < 30) return 12.0;
      return 15.8;
    }
    return null;
  }

  /* Five things an estimate wants. Each one that is known both narrows the
     range and lights a bar on the meter, so the reader can see what the
     figure is standing on rather than being asked to trust it. */
  function estimate(act, v) {
    var min = Number(v.min) || 0;
    var known = [];
    var met = act.met, from = 'the ' + act.name.toLowerCase() + ' average';

    known.push({ k: 'Your body weight', on: BODY_KG > 0 });
    known.push({ k: 'Duration', on: min > 0 });

    var km = Number(v.dist) || 0;
    var paceMet = null;
    if (act.speed && km > 0 && min > 0) {
      paceMet = metForSpeed(act.speed, km / (min / 60));
      if (paceMet) { met = paceMet; from = 'your actual pace'; }
    }
    known.push({ k: 'Distance', on: km > 0 });

    var eff = v.effort;
    if (!paceMet && eff && EFFORT_K[eff]) { met = met * EFFORT_K[eff]; from = 'the average, adjusted for ' + eff.toLowerCase(); }
    known.push({ k: 'How hard it felt', on: !!eff });

    var hr = Number(v.hr) || 0;
    known.push({ k: 'Heart rate', on: hr > 0 });

    var score = known.filter(function (x) { return x.on; }).length;
    /* The band: five knowns is still an estimate, so it never closes below
       eight per cent either side. */
    var spread = [0.30, 0.30, 0.22, 0.16, 0.12, 0.08][score];
    var gross = met * 3.5 * BODY_KG / 200 * min;
    var net = Math.max(0, (met - 1) * 3.5 * BODY_KG / 200 * min);

    var tier = met < 3 ? 'Light' : met < 6 ? 'Moderate' : met < 9 ? 'Vigorous' : 'Hard';
    var conf = score >= 4 ? 'High' : score >= 3 ? 'Fair' : 'Low';

    return {
      kcal: Math.round(gross),
      net: Math.round(net),
      lo: Math.round(gross * (1 - spread)),
      hi: Math.round(gross * (1 + spread)),
      met: Math.round(met * 10) / 10,
      method: paceMet ? 'pace-derived' : 'met-lookup',
      from: from,
      tier: tier,
      conf: conf,
      score: score,
      known: known
    };
  }

  /* COUNTED, NOT SEEDED. The fallback was { total: 0, logged: 0 } and the

      if (Array.isArray(h)) {

    }
    return { total: total, logged: logged };
  }());

  /* =============================================================

     ============================================================= */

  /* ONE history row, both kinds of session. Taken from Cardio's row,
     which the design audit judged the better of the two: an icon, the
     name, one muted metric line, a right-aligned relative date, a
     chevron into the session. The duration appears once and nothing
     here is wrapped in an accent pill. */
  function historyRow(w) {
    /* Only the parts that exist. A cardio record logged by hand has minutes
       and nothing else -- no watch measured a distance -- and the fixed
       three-part line printed "undefined km, undefined cal" for it. An
       absent figure is absent, not zero and not a word. */
    var parts = w.kind === 'lift'
      ? [n(w.min) + ' min', n(w.sets) + ' ' + LKPlural(w.sets, 'set'), n(LKUnits.fmtTotal(w.kg))]
      : [n(w.min) + ' min',
         w.km != null ? n(distV(w.km)) + ' ' + distUnit() : null,
         w.cal != null ? n(w.cal) + ' kcal' : null];
    var meta = parts.filter(Boolean).join(' &middot; ');
    /* The date sits on the title line, not beside the metrics: at 393px
       a lifting metric line plus a date wrapped to two lines. */
    /* A LIFTING row pushes to the session it names. A CARDIO row opens in
       place: a cardio session is eight figures and a note, not a screen, and
       workout-detail is built around exercises and sets it does not have. */
    var open = S.open === w.id;
    return '' +
      '<button class="row" type="button" data-action="' +
              (w.kind === 'lift' ? 'open-session' : 'toggle-session') + '" data-id="' + w.id + '" ' +
              (w.kind === 'lift' ? '' : 'aria-expanded="' + open + '" ') +
              'data-testid="history-' + w.id + '">' +
        '<span class="ico-well">' + (w.kind === 'lift' ? ICO.lift : ICO.cardio) + '</span>' +
        '<span class="row__main stack">' +
          '<span class="spread">' +
            /* Escaped HERE, where the markup is built, rather than once
                 upstream where the next reader of this line cannot see
                 it. The middot the name carries is an entity, so it is
                 put back after the escape rather than escaped with it. */
              '<span class="row__title truncate">' + esc(w.name).replace(/&amp;middot;/g, '&middot;') + '</span>' +
            '<span class="t-meta num nowrap">' + relDate(w.date) + '</span>' +
          '</span>' +
          '<span class="row__sub">' + meta + '</span>' +
        '</span>' +
        '<span class="row__chev">' + ICO.chev + '</span>' +
      '</button>' +
      (open ? cardioDetail(w) : '');
  }

  /* What the record actually holds — F-CARDIO-012. Every line is a stored
     figure or one derived from two of them; nothing is filled in. */
  function cardioDetail(w) {
    var rows = [];
    function add(label, val) { if (val !== undefined && val !== null && val !== '') rows.push([label, val]); }
    add('Duration', w.min + ' min');
    add('Distance', w.km != null ? fmtDist(w.km) : null);
    if (w.km > 0 && w.min > 0) {
      /* Pace is minutes per unit of distance, so it converts with the
         distance: 5:30 /km is 8:51 /mi, and printing the first under a
         screen reading miles is a different number entirely. */
      add('Pace', paceStr(w.min / distV(w.km, 4)) + ' /' + distUnit());
      add('Speed', (Math.round(distV(w.km, 4) / (w.min / 60) * 10) / 10) + ' ' + speedUnit());
      if (/row/.test(w.modality || '')) add('Split', paceStr(w.min / (w.km * 2)) + ' /500 m');
    }
    add('Average power', w.watts != null ? w.watts + ' W' : null);
    add('Heart rate', w.hr != null ? w.hr + ' bpm' : null);
    add('Effort', w.rpe != null ? 'RPE ' + w.rpe : w.effort);
    add('Surface', w.surface ? capitalise(w.surface) : null);
    add('Machine', w.machine ? capitalise(String(w.machine).replace(/_/g, ' ')) : null);
    add('Gross burn', w.cal != null ? group(w.cal) + ' kcal' : null);
    add('Net burn', w.calNet != null ? group(w.calNet) + ' kcal' : null);
    return '<div class="card card--sunken" data-testid="detail-' + w.id + '">' +
      rows.map(function (r) {
        return '<div class="spread mt-2"><span class="t-detail">' + r[0] + '</span>' +
          '<span class="t-meta num">' + r[1] + '</span></div>';
      }).join('') +
      (w.note ? '<p class="t-detail mt-3">' + esc(w.note) + '</p>' : '') +
      (w.calRange
        ? '<p class="t-caption-1 quiet mt-3">The burn is an estimate at ' +
          esc(String(w.calConf || 'unknown')) + ' confidence, between ' +
          group(w.calRange[0]) + ' and ' + group(w.calRange[1]) + ' kcal. Nothing measured it.</p>'
        : '') +
      /* Favourite THIS session — F-CARDIO-023. A setup could only be kept
         from the sheet of the session you had just logged, so a session from
         last month could not be turned into a favourite at all. */
      favFromHistory(w) +
    '</div>';
  }

  function favFromHistory(w) {
    var act = byModality(w.modality) || (w.act && findCardio(w.act)) || byName(w.name);
    if (!act) return '';
    var on = !!favForAct(act.id);
    return '<button class="btn btn--tertiary btn--block mt-3" type="button" ' +
      'data-action="fav-toggle" data-id="' + act.id + '" data-from="' + esc(w.id) + '" ' +
      'data-testid="fav-from-' + esc(w.id) + '">' + ICO.star +
      '<span class="btn__label">' + (on ? 'Remove this setup from favourites' : 'Save this setup as a favourite') +
      '</span></button>';
  }

  function splitRow(sp) {
    var names = sp.days.map(function (d) { return d.name; }).join(', ');
    return '' +
      '<button class="row" type="button" data-action="open-split" data-id="' + sp.id + '" ' +
              'data-testid="split-' + sp.id + '">' +
        '<span class="ico-well">' + ICO.split + '</span>' +
        '<span class="row__main stack">' +
          '<span class="row__title">' + esc(sp.name) +
            (sp.current ? ' <span class="badge badge--accent">Current</span>' : '') + '</span>' +
          '<span class="row__sub truncate">' + n(sp.days.length) + ' ' + LKPlural(sp.days.length, 'day') + ' &middot; ' + esc(names) + '</span>' +
        '</span>' +
        '<span class="row__chev">' + ICO.chev + '</span>' +
      '</button>';
  }

  /* MINUTES PER WEEK, kept as the Cardio audit found it: eight bars,
     tabular labels, a dated axis, one bar standing out. The standout
     is --text, not the accent: the accent is on Start. An empty week
     still draws a stub, so nothing on this chart is invisible. */
  function weekChart() {
    var W = 329, H = 128, padL = 30, padR = 4, padT = 20, padB = 22;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var top = 60;
    var slot = plotW / WEEKS.length;
    var barW = slot * 0.56;
    var out = [];

    [0, top].forEach(function (t) {
      var y = padT + plotH - (t / top) * plotH;
      out.push('<line class="chart__grid" x1="' + padL + '" y1="' + y.toFixed(1) +
               '" x2="' + (padL + plotW) + '" y2="' + y.toFixed(1) + '"/>');
      out.push('<text class="chart__axis" x="' + (padL - 6) + '" y="' + (y + 4).toFixed(1) +
               '" text-anchor="end">' + t + '</text>');
    });

    WEEKS.forEach(function (w, i) {
      var cx = padL + slot * i + slot / 2;
      var h = w.min > 0 ? Math.max(2, (w.min / top) * plotH) : 2;
      var y = padT + plotH - h;
      out.push('<rect class="chart__bar' + (w.now ? ' chart__bar--now' : '') +
               '" x="' + (cx - barW / 2).toFixed(1) + '" y="' + y.toFixed(1) +
               '" width="' + barW.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2"/>');
      /* Label every other bucket, ending on the current week: the
         brightest bar must be the one that is named. */
      if (i % 2 === 1) {
        out.push('<text class="chart__axis" x="' + cx.toFixed(1) + '" y="' + (H - 6) +
                 '" text-anchor="middle">' + absDate(w.start) + '</text>');
      }
    });

    var peak = WEEKS[4];
    var px = padL + slot * 4 + slot / 2;
    var py = padT + plotH - (peak.min / top) * plotH - 6;
    out.push('<text class="chart__value" x="' + px.toFixed(1) + '" y="' + py.toFixed(1) +
             '" text-anchor="middle">' + peak.min + '</text>');

    var read = 'Minutes of cardio per week, eight weeks. ' + WEEKS.map(function (w) {
      return 'week of ' + absDate(w.start) + ', ' + w.min + ' minutes';
    }).join('; ') + '.';

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + read + '">' +
           out.join('') + '</svg>';
  }

  /* TODAY, not the wall clock. Every date on this screen is measured against
     the fixture, so a log stamped with the real date read "last -1 days ago"
     the moment the two disagreed. */
  function todayISO() { return TODAY; }

  /* =============================================================
     Cardio: favourites, the form, the write.
     ============================================================= */

  /* The quick rows. A favourite is a SAVED SETUP -- an activity, a duration
     and whatever else was filled in last time -- so tapping it opens the form
     already answered rather than at the catalogue default. Under the stored
     favourites sit the other modalities this person has actually done
     recently, which is what makes the top of the block a ranking rather than
     a second catalogue. */
  function favName(f) { return f.label || f.name || 'Saved setup'; }
  function favMin(f) {
    if (f.defaults && f.defaults.durationSec) return Math.round(f.defaults.durationSec / 60);
    return f.min || 30;
  }
  function favAct(f) {
    return byModality(f.modality) || byName(favName(f)) || findCardio(f.act);
  }
  function byModality(mod) {
    if (!mod) return null;
    var all = allActivities();
    for (var i = 0; i < all.length; i++) if (all[i].mod === mod || all[i].id === mod) return all[i];
    return null;
  }
  function favRows() {
    var out = FAVS.map(function (f) {
      var act = favAct(f) || { id: f.modality || f.id, name: favName(f), min: favMin(f) };
      return { key: 'fav:' + f.id, id: act.id, fav: f, name: favName(f),
               min: favMin(f), note: 'Saved setup',
               last: f.lastUsedAt ? String(f.lastUsedAt).slice(0, 10) : f.last };
    });
    var seen = {};
    out.forEach(function (r) { seen[r.id] = 1; });
    /* Recently done, newest first, up to three rows in total. */
    for (var i = 0; i < HISTORY.length && out.length < 3; i++) {
      var w = HISTORY[i];
      if (w.kind !== 'cardio') continue;
      var act = byModality(w.modality) || (w.act && findCardio(w.act)) || byName(w.name);
      if (!act || seen[act.id]) continue;
      seen[act.id] = 1;
      out.push({ key: 'recent:' + act.id, id: act.id, name: act.name, min: w.min || act.min, last: w.date });
    }
    return out;
  }
  function byName(name) {
    var all = allActivities();
    var flat = String(name || '').replace(/&middot;/g, '').trim().toLowerCase();
    for (var i = 0; i < all.length; i++) if (all[i].name.toLowerCase() === flat) return all[i];
    return null;
  }
  function lastCardioFor(id) {
    for (var i = 0; i < HISTORY.length; i++) {
      var w = HISTORY[i];
      if (w.kind !== 'cardio') continue;
      var a = byModality(w.modality) || (w.act && findCardio(w.act)) || byName(w.name);
      if (a && a.id === id) return w;
    }
    return null;
  }

  /* THIS WEEK, from the history rather than from a constant. Three figures
     a reader can check against the list below them. */
  function weekStats() {
    var wk = WEEKS[WEEKS.length - 1];
    return { n: wk.n, min: wk.min, cal: wk.cal };
  }

  /* Personal bests, computed from every cardio session on this device.
     Only over what was actually recorded: a session with no distance cannot
     win "furthest", and a stat nothing can win is not shown at all. */
  function cardioBests() {
    var best = {};
    HISTORY.forEach(function (w) {
      if (w.kind !== 'cardio') return;
      function keep(k, val, label) {
        if (val === null || val === undefined || isNaN(val)) return;
        if (!best[k] || val > best[k].v) best[k] = { v: val, label: label, w: w };
      }
      function keepLow(k, val, label) {
        if (val === null || val === undefined || isNaN(val)) return;
        if (!best[k] || val < best[k].v) best[k] = { v: val, label: label, w: w };
      }
      keep('far', w.km, 'Furthest');
      keep('long', w.min, 'Longest');
      keep('burn', w.cal, 'Biggest burn');
      keep('watts', w.watts, 'Most power');
      if (w.km > 0 && w.min > 0) {
        /* Pace is a minutes-per-kilometre figure and it only means anything
           on foot: a 21.6 km/h bike ride read "best pace 2:47 /km" beside a
           run, which is a comparison between two different things. Wheels
           and water get a speed; feet get a pace. */
        var onFoot = /run|walk|hike|ruck/.test(w.modality || '') ||
                     /run|walk|hik|ruck/i.test(w.name || '');
        if (onFoot) keepLow('pace', w.min / w.km, 'Best pace');
        else keep('speed', w.km / (w.min / 60), 'Fastest');
      }
    });
    return best;
  }
  function paceStr(minPerKm) {
    var m = Math.floor(minPerKm), s = Math.round((minPerKm - m) * 60);
    if (s === 60) { m += 1; s = 0; }
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function bestsStrip() {
    var b = cardioBests();
    var tiles = [];
    function tile(k, value, sub) {
      if (!b[k]) return;
      tiles.push('<div class="stat" data-testid="best-' + k + '"><span class="stat__label">' + b[k].label + '</span>' +
        '<span class="stat__value">' + value + '</span>' +
        '<span class="t-detail">' + esc(sub) + '</span></div>');
    }
    tile('far', n(b.far ? distV(b.far.v) : 0) + '<span class="stat__unit"> ' + distUnit() + '</span>',
         b.far ? b.far.w.name.replace(/&middot;/g, '·') + ', ' + absDate(b.far.w.date) : '');
    if (b.pace) tile('pace', n(paceStr(useKm() ? b.pace.v : b.pace.v * KM_PER_MI)) + '<span class="stat__unit"> /' + distUnit() + '</span>',
         b.pace.w.name + ', ' + absDate(b.pace.w.date));
    if (b.speed) tile('speed', n(Math.round(distV(b.speed.v, 4) * 10) / 10) + '<span class="stat__unit"> ' + speedUnit() + '</span>',
         b.speed.w.name + ', ' + absDate(b.speed.w.date));
    tile('long', n(b.long ? b.long.v : 0) + '<span class="stat__unit"> min</span>',
         b.long ? b.long.w.name + ', ' + absDate(b.long.w.date) : '');
    tile('burn', n(b.burn ? b.burn.v : 0) + '<span class="stat__unit"> kcal</span>',
         b.burn ? b.burn.w.name + ', ' + absDate(b.burn.w.date) : '');
    if (b.watts) tile('watts', n(b.watts.v) + '<span class="stat__unit"> W</span>',
         b.watts.w.name + ', ' + absDate(b.watts.w.date));
    if (!tiles.length) return '';
    return '<div class="card mt-3" data-testid="cardio-bests">' +
      '<div class="spread"><span class="t-label">Your bests</span>' +
      '<span class="t-meta">From what was recorded</span></div>' +
      '<div class="facts mt-3">' + tiles.join('') + '</div>' +
      /* TIME IN ZONE, honestly. No session on this device carries a heart
         rate, and a zone chart drawn without one would be a picture of
         nothing. The form asks for average heart rate; once one is entered
         this says which zone it fell in. */
      timeInZone() +
    '</div>';
  }

  /* TIME IN ZONE, on the model lk_cardioPrefs actually stores: five zones of
     heart rate RESERVE, which needs a resting rate as well as a maximum and
     is the reason restingHr is stored at all. A session with no heart rate
     cannot be placed in a zone and is counted as unplaced rather than
     quietly dropped into Z1. */
  var ZONES = [[0, 0.60, 'Z1 Recovery'], [0.60, 0.70, 'Z2 Easy'], [0.70, 0.80, 'Z3 Steady'],
               [0.80, 0.90, 'Z4 Hard'], [0.90, 9, 'Z5 Max']];
  function maxHR() {
    if (Number(PREFS.maxHrOverride) > 0) return Number(PREFS.maxHrOverride);
    return 220 - (Number(PROFILE.age) || 30);
  }
  function restHR() { return Number(PREFS.restingHr) > 0 ? Number(PREFS.restingHr) : 60; }
  function timeInZone() {
    var mx = maxHR(), rest = restHR();
    var rows = ZONES.map(function (z) { return { name: z[2], min: 0 }; });
    var total = 0, unplaced = 0;
    HISTORY.forEach(function (w) {
      if (w.kind !== 'cardio') return;
      if (!(w.hr > 0)) { unplaced += w.min || 0; return; }
      var pct = (w.hr - rest) / (mx - rest);
      for (var i = 0; i < ZONES.length; i++) {
        if (pct >= ZONES[i][0] && pct < ZONES[i][1]) { rows[i].min += w.min || 0; total += w.min || 0; }
      }
    });
    if (!total) {
      return '<p class="t-caption-1 quiet mt-3" data-testid="zone-empty">Time in zone needs a heart rate, ' +
        'and no cardio session on this phone carries one. Type an average heart rate when you log and it lands ' +
        'in a zone here, against a reserve of ' + rest + ' to ' + mx + ' bpm.</p>';
    }
    return '<div class="mt-3" data-testid="zone-card">' +
      '<div class="spread"><span class="t-label">Time in zone</span>' +
        '<span class="t-meta num">' + total + ' min placed</span></div>' +
      rows.filter(function (r) { return r.min; }).map(function (r) {
        return '<div class="spread mt-2"><span class="t-detail">' + esc(r.name) + '</span>' +
          '<span class="t-meta num">' + r.min + ' min</span></div>' +
          /* Quiet, not accent. One accent fill to a screen: the start button
             is the thing being pointed at, and three coloured bars beside it
             make four, which is the rule the accent audit exists to keep. */
          '<div class="meter meter--quiet"><span class="meter__fill" style="width:' +
          Math.round(r.min / total * 100) + '%"></span></div>';
      }).join('') +
      '<p class="t-caption-1 quiet mt-2">Heart rate reserve, ' + rest + ' to ' + mx + ' bpm' +
        (unplaced ? '. ' + unplaced + ' more minutes carried no heart rate and are not placed' : '') + '.</p>' +
    '</div>';
  }

  /* The write. A logged session is a full record in lk_history through
     LKStore: it survives the reload, it moves the chart, the week row and
     the history list, and it carries a calorie figure, which it never did.
     Everything the form did not ask for is absent from the record rather
     than stored as zero. */
  function saveCardio() {
    var l = S.logging;
    if (!l) return;
    var act = findCardio(l.id) || { name: l.name, met: 6, f: [] };
    var min = Number(l.v.min);
    if (isNaN(min) || min < 1 || min > 600) {
      S.logError = 'Between 1 and 600 minutes.';
      render();
      focusField('cardio-min');
      return;
    }
    var est = estimate(act, l.v);
    /* The record is written in the shape every other screen reads: the same
       keys the seeded cardio sessions carry, so a session logged here and a
       session that came with the app are indistinguishable to the reader of
       lk_history. calDetail says the figure is estimated, because it is. */
    var rec = {
      id: 'w' + Date.now(), kind: 'cardio', act: act.id, modality: act.mod || act.id,
      name: act.name, date: todayISO(), dateISO: todayISO(),
      min: min, durationSec: min * 60,
      cal: est.kcal, sets: 0, vol: 0, exercises: [],
      calDetail: { value: est.kcal, net: est.net, gross: est.kcal,
                   range: [est.lo, est.hi], method: est.method, tier: est.tier,
                   confidence: est.conf.toLowerCase(), basis: 'gross', estimated: true },
      intensity: { rpe: null, estMET: est.met, talkTest: null },
      environment: act.g === 'machine' ? 'indoor' : 'outdoor'
    };
    (act.f || []).forEach(function (k) {
      var val = l.v[k];
      if (val === undefined || val === null || val === '') return;
      if (FIELD[k].type === 'choice') rec[k] = val;
      else if (k === 'dist') { rec.km = Number(val); rec.distanceM = Math.round(Number(val) * 1000); }
      else if (k === 'hr') rec.heartRate = { avg: Number(val) };
      else rec[k] = Number(val);
    });
    if (act.g === 'machine') rec.machine = { category: act.id, brand: null, model: null };
    if (l.v.note && l.v.note.trim()) rec.note = l.v.note.trim();

    var hist = rd('lk_history', [], false) || [];
    hist.unshift(rec);
    if (store()) store().set('lk_history', hist);
    loadHistory(false);
    loadWeeks();
    S.logging = { id: l.id, name: act.name, v: l.v, done: rec, est: est };
    S.logError = null;
    render();
  }

  /* "Save this setup" — F-CARDIO-021. A favourite is what was just logged,
     minus the date: the activity and every answer, so the next one is one
     tap and already right. */
  function saveFavourite() {
    var l = S.logging;
    if (!l || !l.done) return;
    var act = findCardio(l.id) || {};
    /* One favourite per setup. The star on the activity row and this button
       write the same list, so without this a second tap made a second copy of
       the same saved setup and the quick rows printed it twice. */
    var already = favForAct(l.id);
    if (already) { say(esc(favName(already)) + ' is already in your favourites.'); return; }
    var stored = (rd('lk_cardioFavorites', [], false) || []).slice();
    var fav = {
      id: 'fav_' + Date.now(), label: l.done.name, modality: act.mod || l.id,
      environment: l.done.environment, machine: l.done.machine || null,
      defaults: { durationSec: l.done.min * 60, surface: l.done.surface || null, v: l.v },
      order: stored.length, useCount: 0, lastUsedAt: todayISO(), pinned: false
    };
    stored.push(fav);
    if (store()) store().set('lk_cardioFavorites', stored);
    loadData(false);
    say(esc(fav.label) + ' saved to your favourites.');
  }

  /* =============================================================
     FAVOURITING, from anywhere — F-CARDIO-023.

     A favourite could be made from exactly one place: the "Save this setup"
     button on the sheet of the session you had just logged. Miss it and the
     only way to make one was to log the session again. So the star is on the
     activity rows in the picker and on every cardio session in the history,
     and it toggles: the same tap takes one away.
     ============================================================= */
  function favForAct(id) {
    for (var i = 0; i < FAVS.length; i++) {
      var a = favAct(FAVS[i]);
      if (a && a.id === id) return FAVS[i];
      if (FAVS[i].modality === id) return FAVS[i];
    }
    return null;
  }
  /* A favourite made from a session is that session's own setup, minus its
     date. Made from a catalogue row with nothing logged, it is the
     catalogue's default duration — which is what the row already says. */
  function favFromSession(act, w) {
    var v = { min: (w && w.min) || act.min };
    if (w) {
      if (w.km != null) v.dist = w.km;
      if (w.hr != null) v.hr = w.hr;
      if (w.surface) v.surface = capitalise(w.surface);
      if (w.effort) v.effort = w.effort;
      if (w.watts != null) v.watts = w.watts;
    }
    return {
      id: 'fav_' + Date.now(), label: act.name, modality: act.mod || act.id,
      environment: act.g === 'machine' ? 'indoor' : 'outdoor',
      machine: act.g === 'machine' ? { category: act.id, brand: null, model: null } : null,
      defaults: { durationSec: (v.min || act.min) * 60, surface: v.surface || null, v: v },
      order: FAVS.length, useCount: 0, lastUsedAt: todayISO(), pinned: false
    };
  }
  function toggleFav(actId, w) {
    var act = findCardio(actId);
    if (!act) return;
    var have = favForAct(actId);
    var stored = (rd('lk_cardioFavorites', [], false) || []).slice();
    if (have) {
      stored = stored.filter(function (f) { return f.id !== have.id; });
      stored.forEach(function (f, i) { f.order = i; });
      if (store()) store().set('lk_cardioFavorites', stored);
      loadData(false);
      say(esc(favName(have)) + ' removed from favourites.');
      return;
    }
    var fav = favFromSession(act, w || lastCardioFor(actId));
    stored.push(fav);
    if (store()) store().set('lk_cardioFavorites', stored);
    loadData(false);
    say(esc(fav.label) + ' saved to your favourites.');
  }
  function starBtn(actId, name, extra) {
    var on = !!favForAct(actId);
    return '<button class="iconbtn' + (on ? ' iconbtn--on' : '') + '" type="button" ' +
      'data-action="fav-toggle" data-id="' + actId + '"' + (extra || '') +
      ' aria-pressed="' + on + '" data-testid="star-' + actId + '" ' +
      'aria-label="' + (on ? 'Remove ' : 'Save ') + esc(name) + (on ? ' from' : ' to') +
      ' your favourites">' + ICO.star + '</button>';
  }

  function field(k, v, act) {
    var f = FIELD[k];
    if (!f) return '';
    var id = 'cf-' + k;
    if (f.type === 'choice') {
      return '<div class="section" style="padding:0">' +
        '<span class="t-label">' + f.label + '</span>' +
        '<div class="chiprow mt-2">' + f.opts.map(function (o) {
          return '<button class="chip" type="button" data-action="cf-choice" data-k="' + k + '" data-v="' + esc(o) + '" ' +
            'aria-pressed="' + (v === o) + '" data-testid="cf-' + k + '-' + o.toLowerCase().replace(/\W+/g, '-') + '">' +
            esc(o) + '</button>';
        }).join('') + '</div></div>';
    }
    var unit = f.type === 'weight' ? LKUnits.label() : f.type === 'dist' ? distUnit() : f.unit;
    var shown = v;
    var max = f.max;
    if (v !== '' && v !== undefined && v !== null) {
      if (f.type === 'weight') shown = LKUnits.v(Number(v));
      else if (f.type === 'dist') shown = distV(Number(v));
    }
    if (f.type === 'dist') max = distV(f.max, 0);
    return '<label class="field mt-3"><span class="field__label t-label">' + f.label +
      (unit ? ' <span class="quiet">(' + unit + ')</span>' : '') + '</span>' +
      '<input class="input num" id="' + id + '" type="number" inputmode="decimal" ' +
        'step="' + f.step + '" min="' + (f.min || 0) + '" max="' + max + '" ' +
        'value="' + (shown === undefined || shown === null ? '' : esc(shown)) + '" ' +
        'data-action="cf-num" data-k="' + k + '" data-testid="cf-' + k + '"></label>';
  }

  var DUR_CHIPS = [10, 15, 20, 30, 45, 60];

  /* The live estimate. A count-up would be motion for its own sake on a
     figure that changes as you type, so the number is simply current, the
     band under it says how wide the estimate is, and the five bars say what
     it is standing on. */
  function estimateCard(act, v) {
    var est = estimate(act, v);
    var bars = est.known.map(function (k, i) {
      return '<span class="strength__seg' + (k.on ? ' strength__seg--good' : '') + '" ' +
        'data-testid="qbar-' + i + '"></span>';
    }).join('');
    var missing = est.known.filter(function (k) { return !k.on; }).map(function (k) { return k.k.toLowerCase(); });
    return '<div class="card card--sunken mt-4" data-testid="cardio-estimate">' +
      '<div class="spread"><span class="t-label">Estimated burn</span>' +
        '<span class="badge badge--est" data-testid="cardio-conf">' + est.conf + ' confidence</span></div>' +
      '<div class="spread mt-2">' +
        '<span class="t-title num" data-testid="cardio-kcal">' + group(est.kcal) + ' kcal</span>' +
        '<span class="t-meta num" data-testid="cardio-range">' + group(est.lo) + ' to ' + group(est.hi) + '</span>' +
      '</div>' +
      '<div class="strength__scale mt-2" role="img" aria-label="' + est.score +
        ' of 5 inputs known">' + bars + '</div>' +
      '<p class="t-caption-1 quiet mt-2" data-testid="cardio-basis">' +
        est.tier + ' effort, ' + est.met + ' MET from ' + esc(est.from) + ', at ' +
        LKUnits.fmt(BODY_KG, 1) + ' body weight. ' +
        'Net of simply being alive for ' + (Number(v.min) || 0) + ' minutes: ' + group(est.net) + ' kcal. ' +
        'Estimated on this phone, not measured' +
        (missing.length ? '; it would tighten with ' + esc(missing.join(' and ')) : '') + '.</p>' +
    '</div>';
  }

  function cardioSheet() {
    var l = S.logging;
    if (!l) return '';
    var act = findCardio(l.id) || { name: l.name, met: 6, f: [], min: 30 };
    if (l.done) return loggedSheet(l, act);
    var v = l.v;
    var body = '' +
      '<span class="t-label">Minutes</span>' +
      '<div class="chiprow mt-2">' + DUR_CHIPS.map(function (d) {

      }).join('') + '</div>' +
      '<input class="input num mt-2" id="cardio-min" type="number" min="1" max="600" step="1" ' +
        'inputmode="numeric" value="' + esc(v.min) + '" aria-label="Minutes" ' +
        'data-action="cf-num" data-k="min" data-testid="cardio-min">' +
      (S.logError ? '<p class="field__error" role="alert" data-testid="cardio-error">' + esc(S.logError) + '</p>' : '') +
      (act.f || []).map(function (k) { return field(k, v[k], act); }).join('') +
      '<label class="field mt-3"><span class="field__label t-label">Notes</span>' +

      estimateCard(act, v);

    return '<div class="scrim" data-action="cardio-cancel" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cd-title" data-testid="cardio-sheet" ' +
        'data-detents="0.6 0.94" data-detent-open="0.94">' +

        '<div class="sheet__grab"></div>' +
        '<div class="sheet__head"><h2 class="t-section grow" id="cd-title">' + esc(act.name) + '</h2>' +
          '<button class="iconbtn" type="button" data-action="cardio-cancel" aria-label="Cancel" ' +
            'data-testid="cardio-close">' + ICO.close + '</button></div>' +
        '<div class="sheet__body">' + body + '</div>' +
        '<div class="sheet__foot">' +
          '<button class="btn btn--primary btn--block" type="button" data-action="cardio-save" ' +
            'data-testid="cardio-save"><span class="btn__label">Log it</span></button>' +
        '</div>' +
      '</div>';
  }

  /* What was written, in the record's own words. It replaces the toast that
     was the whole of the old confirmation. */
  function loggedSheet(l, act) {
    var w = l.done, est = l.est;
    var rows = [];
    function add(label, val) { if (val !== undefined && val !== null && val !== '') rows.push([label, val]); }
    add('Duration', w.min + ' min');
    add('Distance', w.km != null ? fmtDist(w.km) : null);
    if (w.km > 0 && w.min > 0) {
      /* Pace is minutes per unit of distance, so it converts with the
         distance: 5:30 /km is 8:51 /mi, and printing the first under a
         screen reading miles is a different number entirely. */
      add('Pace', paceStr(w.min / distV(w.km, 4)) + ' /' + distUnit());
      add('Speed', (Math.round(distV(w.km, 4) / (w.min / 60) * 10) / 10) + ' ' + speedUnit());
      if (act.id === 'row' || act.id === 'waterrow') add('Split', paceStr(w.min / (w.km * 2)) + ' /500 m');
    }
    add('Average power', w.watts != null ? w.watts + ' W' : null);
    /* Off the record, in the record's own shape. `w` here is what was just
       written to lk_history, where a heart rate is heartRate.avg and a
       machine is machine.category -- so reading w.hr and w.surface dropped
       the two figures somebody had just typed, on the screen confirming what
       had been saved. */
    add('Heart rate', (w.heartRate && w.heartRate.avg != null) ? w.heartRate.avg + ' bpm'
                    : (w.hr != null ? w.hr + ' bpm' : null));
    add('Effort', w.effort);
    /* A surface is a surface and a machine is a machine — F-CARDIO-021. This
       fell back to the machine id when no surface had been asked for, so a
       treadmill run logged here read "Surface  treadrun": a row labelled with
       a question the form never asked, answered with an internal id. */
    add('Surface', w.surface ? capitalise(w.surface) : null);
    /* Only where it says something the title does not: a treadmill run on a
       treadmill does not need a row to say so. */
    var mach = (w.machine && w.machine.category) ? machineName(w.machine.category) : null;
    add('Machine', mach && mach !== w.name ? mach : null);
    add('Riding position', w.position);
    add('Gross burn', group(w.cal) + ' kcal');
    add('Net burn', group(w.calDetail ? w.calDetail.net : est.net) + ' kcal');
    return '<div class="scrim" data-action="cardio-cancel" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cd-title" data-testid="cardio-logged">' +
        '<div class="sheet__head"><h2 class="t-section grow" id="cd-title">Logged &middot; ' + esc(w.name) + '</h2>' +
          '<button class="iconbtn" type="button" data-action="cardio-cancel" aria-label="Close" ' +
            'data-testid="cardio-close">' + ICO.close + '</button></div>' +
        '<div class="sheet__body">' +
          '<p class="t-detail">Saved to your history on this phone. Nothing has left this device.</p>' +
          '<div class="card card--flush mt-3">' + rows.map(function (r) {
            return '<div class="row row--static"><span class="row__main"><span class="row__title">' + r[0] +
              '</span></span><span class="row__value num">' + r[1] + '</span></div>';
          }).join('') + '</div>' +
          '<p class="t-caption-1 quiet mt-3">The burn is an estimate at ' + est.conf.toLowerCase() +
            ' confidence, between ' + group(est.lo) + ' and ' + group(est.hi) + ' kcal. Nothing measured it.</p>' +
        '</div>' +
        '<div class="sheet__foot">' +
          '<button class="btn btn--secondary btn--block" type="button" data-action="cardio-fav" ' +
            'data-testid="cardio-fav">' + ICO.star + '<span class="btn__label">Save this setup</span></button>' +
          '<button class="btn btn--primary btn--block mt-2" type="button" data-action="cardio-cancel" ' +
            'data-testid="cardio-done"><span class="btn__label">Done</span></button>' +
        '</div>' +
      '</div>';
  }

  function cardioBlock() {
    /* The last four weeks INCLUDING this one. It was the four before this
       one, so anything logged today landed in a week the figure did not
       count and the total never moved. */
    var last4 = WEEKS.slice(-4).reduce(function (a, w) { return a + w.min; }, 0);
    var wk = weekStats();
    /* TWO CONTROLS ON A SAVED SETUP — F-CARDIO-003. The row opens the form
       already answered, because "logged 30 minutes" when it was 22 is a wrong
       number in the record and the shipped app asked. But a FAVOURITE is a
       duration this person chose and saved on purpose, so it also carries the
       one-tap re-log the audit asked for, as its own labelled button: the tap

    var rows = favRows().map(function (c) {

        '<button class="trainrow__main stack" type="button" data-action="log-cardio" data-id="' + c.id + '" ' +

          '<span class="row__sub truncate">' + (c.fav ? '' : n(c.min) + ' min') +

        '<div class="row row--withaside" data-testid="favrow-' + c.key.replace(/[^\w]/g, '-') + '">' +
          '<span class="ico-well">' + (c.fav ? ICO.star : ICO.cardio) + '</span>' +

          (c.fav
            ? '<button class="btn btn--secondary btn--sm" type="button" data-action="quick-log" ' +
                'data-id="' + c.id + '" data-fav="' + c.fav.id + '" ' +
                'data-testid="quick-' + c.fav.id + '" ' +
                'aria-label="Log ' + esc(c.name) + ', ' + c.min + ' minutes, now">' +
                '<span class="btn__label">Log ' + c.min + ' min</span></button>'
            : starBtn(c.id, c.name)) +

    return '' +
      '<section class="section" data-testid="section-cardio">' +
        '<div class="section__head"><h2 class="t-label">Cardio</h2>' +

            '<span class="btn__label">Favourites</span></button>' +
        '</div>' +
        /* THIS WEEK, three figures from the same history the list below is
           drawn from. The block used to open on an eight-week chart and say
           nothing at all about the week you are in. */
        '<div class="card" data-testid="cardio-week">' +
          '<div class="facts">' +
            '<div class="stat"><span class="stat__label">This week</span>' +
              '<span class="stat__value">' + n(wk.n) + '</span>' +
              '<span class="t-detail">' + (wk.n === 1 ? 'session' : 'sessions') + '</span></div>' +
            '<div class="stat"><span class="stat__label">Minutes</span>' +
              '<span class="stat__value">' + n(wk.min) + '</span>' +
              '<span class="t-detail">' + (PREFS.weeklyTargetMin
                ? 'of ' + PREFS.weeklyTargetMin + ' target' : 'this week') + '</span></div>' +
            '<div class="stat"><span class="stat__label">Calories</span>' +
              '<span class="stat__value">' + n(group(wk.cal)) + '</span>' +
              '<span class="t-detail">estimated</span></div>' +
          '</div>' +
          '<div class="spread mt-4">' +
            '<span class="t-label">Minutes per week</span>' +
            '<span class="t-meta num">' + last4 + ' min in 4 weeks</span>' +
          '</div>' +
          '<div class="mt-3">' + weekChart() + '</div>' +
        '</div>' +
        bestsStrip() +
        '<div class="card card--flush mt-3">' +
          rows +
          '<button class="row" type="button" data-action="open-activities" data-testid="open-activities">' +
            '<span class="ico-well">' + ICO.search + '</span>' +
            '<span class="row__main stack">' +
              '<span class="row__title">Log something else</span>' +
              '<span class="row__sub">' + n(catCount()) + ' activities, searchable</span>' +
            '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
        '</div>' +
      '</section>';
  }

  /* =============================================================
     Views
     ============================================================= */
  var VIEWS = {};

  VIEWS.populated = function () {
    /* Gated on the DATA, not on a dev state. A reader with no splits was
       still shown a training day, because the state came from the switcher. */
    if (!SPLITS.length || !SPLITS[0].days.length) return VIEWS.empty();
    var sp = SPLITS[0];
    var day = sp.days[0];
    var recent = HISTORY.slice(0, 5);
    /* WHEN this day was last done, from the history rather than a literal
       date typed into the markup. */
    var lastDone = null;
    for (var i = 0; i < HISTORY.length && !lastDone; i++) {
      var w = HISTORY[i];
      if (w.kind === 'lift' && w.name.indexOf(day.name) > -1) lastDone = w.date;
    }

    return '' +
      /* The one thing a lifter opens this tab to do, in the first fold
         and one tap deep. The audited hub spent its only accent fill on
         a Quick Start that began an empty workout. */
      '<section class="card card--raised mt-4 enter-rise" data-testid="card-today">' +
        '<div class="t-label">Today &middot; ' + esc(sp.name) + '</div>' +
        '<h2 class="t-title mt-2">' + esc(day.name) + '</h2>' +
        '<p class="t-detail mt-2" data-testid="today-meta">' + n(day.exercises) + ' ' + LKPlural(day.exercises, 'exercise') + ' &middot; about ' +
          n(day.minutes) + ' min' +

        '</button>' +

      cycleBanner() +

      '<section class="section" data-testid="section-splits">' +
        '<div class="section__head">' +
          '<h2 class="t-label">Your splits</h2>' +
          '<button class="btn btn--tertiary btn--sm" type="button" data-action="new-split" data-testid="new-split">' +
            ICO.plus + '<span class="btn__label">New</span></button>' +

            '<span class="btn__label">All ' + n(HISTORY.length) + '</span></button>' +
