        '<div class="section__head"><h2 class="t-label">Reference</h2></div>' +
        '<div class="card card--flush">' +
          '<button class="row" type="button" data-action="open-library" data-testid="open-library">' +
            '<span class="ico-well">' + ICO.book + '</span>' +
            '<span class="row__main stack">' +
              '<span class="row__title">Exercise library</span>' +
              '<span class="row__sub">' + n(LIBRARY.logged) + ' of ' + n(LIBRARY.total) + ' logged</span>' +
            '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
        '</div>' +
      '</section>';
  };

  /* =============================================================
     THE CYCLE BANNER — F-CYCLE-022.

     Cycle tracking is an opt-in behind lk_cycle, and when it is on the one
     thing it has to say about training belongs on the training screen. The
     word "cycle" appeared on Train exactly once before this, on the outdoor
     cycling cardio activity.

     WHERE THE FACTS COME FROM. lk_mcFuelAdjust, which the cycle screen
     writes: the phase, the day, the cycle length, whether the reader asked
     for discreet mode, and the phase's own training line. That key is the
     bridge the cycle screen exists to publish, so this screen keeps no copy
     of the arithmetic and no copy of the guidance — two copies is how three
     screens came to give three answers about one cycle.

     WHAT IT IS NOT. Not a control and not an instruction. There is no
     declared crossing from Train to the cycle screen, so this states what
     today is and says nothing it cannot back; it carries no accent, because
     the accent on this screen is on Start.

     DISCREET MODE travels with the bridge. With it on, the phase is not
     named and the day number is not printed: the guidance stands alone,
     which is the whole point of the setting.
     ============================================================= */
  function cycleOnFlag() {
    var v = rd('lk_cycle', false, false);
    return v === true || v === 'true';
  }
  function cycleBridge() {
    var v = rd('lk_mcFuelAdjust', false, false);
    if (!v || typeof v !== 'object' || v.on !== true) return null;
    return v;
  }
  function cycleBanner() {
    if (!cycleOnFlag()) return '';
    var c = cycleBridge();
    if (!c || !c.train) return '';
    var head = c.discreet
      ? 'Today'
      : (c.phaseName || 'Cycle') + (c.day ? ' · day ' + c.day +
          (c.cycleLen ? ' of about ' + c.cycleLen : '') : '');
    return '<section class="section" data-testid="section-cycle">' +
      '<div class="card card--sunken">' +
        '<div class="spread">' +
          '<span class="t-label" data-testid="cycle-phase">' + esc(head) + '</span>' +
          '<span class="t-meta">Cycle</span>' +
        '</div>' +
        '<p class="t-body-em mt-2" data-testid="cycle-train">' + esc(c.train) + '</p>' +
        '<p class="t-caption-1 quiet mt-2">From your cycle log on this phone' +
          (c.updated ? ', as of ' + absDate(String(c.updated).slice(0, 10)) : '') +
          '. It is guidance, not a rule, and it changes nothing in your split.</p>' +
      '</div>' +
    '</section>';
  }

  /* =============================================================
     What has been trained, and what has had time to recover.

     Neither existed. The screen could tell you what you did yesterday and
     what your split says to do next, and nothing at all about which muscles
     had been hit twice this week and which had not been touched in nine days
     -- the one question a split is meant to answer and the one a log is
     uniquely able to answer.

     The muscles are the seed's own strings, grouped the way the body is
     trained rather than the way an anatomy chart names it, so Mid Chest and
     Upper Chest are Chest and the screen does not report thirteen separate
     regions nobody plans around.
     ============================================================= */
  var MUSCLE_GROUP = {
    'Quads': 'Legs', 'Hamstrings': 'Legs', 'Calves': 'Legs', 'Glutes': 'Legs',
    'Lats': 'Back', 'Mid Back': 'Back', 'Lower Back': 'Back', 'Traps': 'Back',
    'Mid Chest': 'Chest', 'Upper Chest': 'Chest', 'Lower Chest': 'Chest',
    'Front Delt': 'Shoulders', 'Side Delt': 'Shoulders', 'Rear Delt': 'Shoulders',
    'Long Head': 'Arms', 'Short Head': 'Arms', 'Lateral Head': 'Arms',
    'Medial Head': 'Arms', 'Biceps': 'Arms', 'Triceps': 'Arms', 'Forearms': 'Arms',
    'Abs': 'Core', 'Obliques': 'Core'
  };
  var GROUP_ORDER = ['Legs', 'Back', 'Chest', 'Shoulders', 'Arms', 'Core'];

  /* Sets and days since, per group, from the logged sets only. A warm-up is
     not volume and an unfinished set is not work. */
  function muscleState() {
    var out = {};
    GROUP_ORDER.forEach(function (g) { out[g] = { week: 0, last: null, total: 0 }; });
    var weekAgo = new Date(ms(TODAY) - 6 * 86400000).toISOString().slice(0, 10);
    (rd('lk_history', [], false) || []).forEach(function (w) {
      if (w.kind === 'cardio') return;
      var iso = String(w.date || w.dateISO || '').slice(0, 10);
      if (!iso) return;
      (w.exercises || []).forEach(function (ex) {
        var g = MUSCLE_GROUP[ex.muscle];
        if (!g || !out[g]) return;
        var work = (ex.sets || []).filter(function (st) { return st.done && !st.warm; }).length;
        if (!work) return;
        out[g].total += work;
        if (iso >= weekAgo) out[g].week += work;
        if (!out[g].last || iso > out[g].last) out[g].last = iso;
      });
    });
    return out;
  }

  /* Recovered, ready, or resting. Forty-eight hours is the figure most
     programmes use for a trained muscle group, so two clear days is "ready"
     and anything past six days without work is called what it is. */
  function recoveryWord(days) {
    if (days === null) return ['Never logged', 'rec--none'];
    if (days <= 1) return ['Trained ' + (days === 0 ? 'today' : 'yesterday'), 'rec--fresh'];
    if (days <= 3) return ['Ready', 'rec--ready'];
    if (days <= 6) return [days + ' days ago', 'rec--ready'];
    return [days + ' days ago', 'rec--stale'];
  }

  function recoveryBlock() {
    var st = muscleState();
    var any = GROUP_ORDER.some(function (g) { return st[g].total > 0; });
    if (!any) return '';
    var max = Math.max.apply(null, GROUP_ORDER.map(function (g) { return st[g].week; }).concat([1]));
    /* What to train today, from what has recovered. v6 put this in hours;
       the log is dated to the day, so hours would be precision this data does
       not have. Days, and the sentence says which groups rather than naming a
       number nothing measured. */
    var ready = [], resting = [], never = [];
    GROUP_ORDER.forEach(function (g) {
      var d = st[g];
      if (!d.total) { never.push(g); return; }
      var days = daysAgo(d.last);
      if (days >= 2) ready.push({ g: g, days: days }); else resting.push({ g: g, days: days });
    });
    /* Least recently trained first: the group that has waited longest is the
       one a week has been neglecting. */
    ready.sort(function (a, b) { return b.days - a.days; });
    var line;
    if (ready.length) {
      var pick = ready.slice(0, 2).map(function (r) { return r.g.toLowerCase(); });
      line = 'Recovered and ready: ' + (pick.length === 2 ? pick[0] + ' or ' + pick[1] : pick[0]) + '.';
      if (resting.length) {
        line += ' ' + resting.map(function (r) { return r.g.toLowerCase(); }).join(' and ') +
          (resting.length === 1 ? ' was' : ' were') + ' trained ' +
          (resting[0].days === 0 ? 'today' : 'yesterday') + '.';
      }
    } else if (resting.length) {
      line = 'Everything you train was hit in the last two days. Rest, or something easy.';
    } else {
      line = 'Nothing logged yet, so there is nothing to recover from.';
    }
    if (never.length) {
      line += ' ' + never.map(function (g) { return g.toLowerCase(); }).join(' and ') +
        ' ' + (never.length === 1 ? 'has' : 'have') + ' never been logged.';
    }

    return '<section class="section" data-testid="section-recovery">' +
      '<div class="section__head"><h2 class="t-label">By muscle, this week</h2></div>' +
      '<div class="card">' +
      '<p class="t-body-em" data-testid="rec-suggestion">' + esc(line) + '</p>' +
      '<div class="mt-3">' + GROUP_ORDER.map(function (g, i) {
        var d = st[g];
        var days = d.last === null ? null : daysAgo(d.last);
        var word = recoveryWord(days);
        var pct = Math.round(d.week / max * 100);
        return '<div class="recrow' + (i ? ' mt-3' : '') + '" data-testid="rec-' + g.toLowerCase() + '">' +
          '<div class="hstack hstack--3">' +
            '<span class="t-subheadline recrow__name">' + g + '</span>' +
            '<span class="t-caption-1 ' + word[1] + '">' + esc(word[0]) + '</span>' +
            '<span class="t-subheadline num">' + n(d.week) + '</span>' +
          '</div>' +
          '<div class="meter meter--quiet mt-2" role="img" aria-label="' + g + ', ' + d.week +
            (d.week === 1 ? ' working set' : ' working sets') + ' in the last seven days">' +
            '<span class="meter__fill" style="width:' + pct + '%"></span></div>' +
        '</div>';
      }).join('') + '</div>' +
      '<p class="t-caption-1 quiet mt-3">Working sets in the last seven days, counted from what ' +
        'you ticked. Warm-ups are not volume. The bar is each group against the hardest-worked ' +
        'one, not against a target: this screen does not have an opinion about how much is ' +
        'right for you.</p>' +
      '</div>' +
    '</section>';
  }

  /* One sentence, ONE accent fill, and a second way in under it — the
     F-TRAIN-302 finding. The builder has two modes and the draft one had no
     entrance at all from an empty Train: you had to start the manual builder
     and find the tertiary button inside its own empty state. So the draft is
     offered here, as a tertiary control under the primary, which is one
     action competing with nothing rather than two fills competing with each
     other. Both open the same screen; the key says which mode. */
  VIEWS.empty = function () {
    return '' +
      '<div class="empty mt-5 enter-settle" data-testid="train-empty">' +
        '<span class="empty__ico">' + ICO.plan + '</span>' +
        '<h2 class="empty__title">No splits yet</h2>' +
        '<p class="empty__body">A split is the week you intend to train. Build one and each day of it starts from this screen.</p>' +
        '<button class="btn btn--primary" type="button" data-action="new-split" data-testid="empty-build-split">' +
          '<span class="btn__label">Build a split</span>' +
        '</button>' +
        '<button class="btn btn--tertiary mt-2" type="button" data-action="new-split" data-mode="draft" data-testid="empty-draft-split">' +
          '<span class="btn__label">Draft one from a description</span>' +
        '</button>' +
      '</div>';
  };

  VIEWS.loading = function () {
    return '' +
      '<div class="card card--raised mt-4" role="status" aria-busy="true" aria-label="Loading your training" data-testid="train-loading">' +
        '<div class="skel" style="height: var(--sp-3); width: 30%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-5); width: 45%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-4); width: 75%"></div>' +
        '<div class="skel mt-4" style="height: var(--tap)"></div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="skel" style="height: var(--sp-3); width: 28%"></div>' +
        '<div class="skel mt-3" style="height: calc(var(--tap) * 3)"></div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="skel" style="height: var(--sp-3); width: 22%"></div>' +
        '<div class="skel mt-3" style="height: calc(var(--tap) * 3)"></div>' +
      '</div>';
  };

  /* What happened, what it means for the data on screen, and the one
     thing that fixes it. */
  VIEWS.error = function () {
    return '' +
      '<div class="card mt-4" data-testid="train-error">' +
        '<div class="banner banner--error" role="alert">' +
          ICO.alert +
          '<span><strong>Training did not load</strong>Your last sync failed, so your splits and any session logged after ' +
            'Sep 3 are missing here. Nothing was lost on this phone.</span>' +
        '</div>' +
        '<button class="btn btn--primary btn--block mt-4" type="button" data-action="retry" data-testid="retry">' +
          '<span class="btn__label">Try again</span>' +
        '</button>' +
        '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="use-cached" data-testid="use-cached">' +
          '<span class="btn__label">Use what is on this phone</span>' +
        '</button>' +
      '</div>';
  };

  /* The full record, one level deep. The app's ONE segmented control
     is spent here, on the only filter that removes work: two kinds of
     session in one list. Same row component as the preview above. */
  /* Which group of activities a cardio session belongs to, through the
     catalogue rather than through a second table. A session whose activity is
     not in the catalogue at all is "other", and is never silently dropped. */
  function groupOfSession(w) {
    if (w.kind !== 'cardio') return null;
    var a = byModality(w.modality) || (w.act && findCardio(w.act)) || byName(w.name);
    return a ? a.g : 'other';
  }

  function historyView() {
    var list = HISTORY.filter(function (w) {
      if (S.filter !== 'all' && w.kind !== S.filter) return false;
      /* The per-group chips narrow the cardio list to a kind of session —
         F-CARDIO-007. They exist only where they mean something: under All
         and Lifting there is nothing for them to narrow. */
      if (S.filter === 'cardio' && S.cgroup !== 'all' && groupOfSession(w) !== S.cgroup) return false;
      return true;
    });
    var out = [], month = null, buf = [];
    function flush() {
      if (!buf.length) return;
      out.push(
        '<section class="section">' +
          '<div class="section__head"><h2 class="t-label">' + month + '</h2>' +
            '<span class="t-meta num">' + buf.length + (buf.length === 1 ? ' session' : ' sessions') + '</span></div>' +
          '<div class="card card--flush">' + buf.join('') + '</div>' +
        '</section>');
      buf = [];
    }
    list.forEach(function (w) {
      var m = monthOf(w.date);
      if (m !== month) { flush(); month = m; }
      buf.push(historyRow(w));
    });
    flush();

    var FILTERS = [['all', 'All'], ['lift', 'Lifting'], ['cardio', 'Cardio']];
    /* Only the groups this person's own cardio history actually contains, with
       the count beside each: a chip for a kind of session nobody has done
       would filter a list to nothing and teach nothing. */
    var seen = {};
    HISTORY.forEach(function (w) {
      if (w.kind !== 'cardio') return;
      var g = groupOfSession(w);
      seen[g] = (seen[g] || 0) + 1;
    });
    var GNAMES = { other: 'Other' };
    CARDIO_GROUPS.forEach(function (g) { GNAMES[g[0]] = g[1]; });
    var order = CARDIO_GROUPS.map(function (g) { return g[0]; }).concat(['other']);
    var present = order.filter(function (g) { return seen[g]; });
    var nCardio = HISTORY.filter(function (w) { return w.kind === 'cardio'; }).length;
    var chips = (S.filter === 'cardio' && present.length > 1)
      ? '<div class="chiprow mt-3" data-testid="cardio-groups">' +
          [['all', 'All ' + nCardio]].concat(present.map(function (g) {
            return [g, GNAMES[g] + ' ' + seen[g]];
          })).map(function (c) {
            return '<button class="chip" type="button" data-action="cgroup" data-g="' + c[0] + '" ' +
              'aria-pressed="' + (S.cgroup === c[0]) + '" data-testid="cgroup-' + c[0] + '">' +
              esc(c[1]) + '</button>';
          }).join('') +
        '</div>'
      : '';
    return '' +
      '<div class="section" style="margin-top: var(--sp-3)">' +
        '<div class="seg seg--lg" role="radiogroup" aria-label="Session type" data-testid="history-filter">' +
          FILTERS.map(function (f) {
            return '<button class="seg__item" type="button" role="radio" aria-checked="' + (S.filter === f[0]) +
              '" data-action="filter" data-filter="' + f[0] + '" data-testid="filter-' + f[0] + '">' +
              f[1] + '</button>';
          }).join('') +
        '</div>' +
        chips +
      '</div>' +
      (list.length ? out.join('') :
        '<div class="empty mt-5" data-testid="history-empty-filter">' +
          '<span class="empty__ico">' + ICO.plan + '</span>' +
          '<h2 class="empty__title">' +
            (S.filter === 'lift' ? 'No lifting sessions yet'
             : S.cgroup !== 'all' ? 'Nothing under ' + esc(GNAMES[S.cgroup] || S.cgroup)
             : 'No cardio yet') + '</h2>' +
          '<p class="empty__body">' +
            (S.filter === 'lift'
              ? 'Sessions you finish in the workout log appear here.'
              : 'Cardio you log on the Train screen appears here beside your lifting.') + '</p>' +
        '</div>');
  }

  /* =============================================================
     Header. Back is labelled with its origin, as iOS labels it.
     ============================================================= */
  function headerHTML() {
    if (S.view === 'history') {
      return '' +
        '<button class="hdr__back" type="button" data-action="back" data-testid="history-back" aria-label="Back to Train">' +
          ICO.back + '</button>' +
        '<div class="hdr__title stack stack--1">' +
          '<span class="t-meta">TRAIN</span>' +
          '<h1 class="t-title">History</h1>' +
        '</div>';
    }
    /* Tab-level, so it carries the large title. A pushed sub-view above keeps
       a 17px one: a screen you arrived at from somewhere else is already the
       collapsed state. */
    return '' +
      '<div class="hdr__title stack stack--1">' +
        '<span class="t-meta">TRAINING</span>' +
        '<h1 class="hdr__title-large" data-title-large>Train</h1>' +
      '</div>' +
      '<span class="hdr__title-small" data-title-small aria-hidden="true">Train</span>';
  }

  /* =============================================================
     Sheets. A split's sheet is where a monthly action lives: start
     any day of it, or edit it. Delete is not here — it belongs in
     the editor that owns the split, behind its own confirmation.
     ============================================================= */
  function splitSheet(sp) {
    var days = sp.days.map(function (d) {
      return '' +
        '<button class="row" type="button" data-action="start-day" data-id="' + sp.id + ':' + d.id + '" ' +
                'data-testid="start-day-' + d.id + '" aria-label="Start ' + esc(d.name) + '">' +
          '<span class="ico-well">' + ICO.lift + '</span>' +
          '<span class="row__main stack">' +
            '<span class="row__title">' + esc(d.name) +
              (d.next ? ' <span class="badge badge--accent">Next</span>' : '') + '</span>' +
            '<span class="row__sub">' + n(d.exercises) + ' ' + LKPlural(d.exercises, 'exercise') +
              /* A day can hold blocks now -- a warm-up, some mobility, a
                 finisher -- and they are part of what that day is. */
              (d.blocks ? ' &middot; ' + n(d.blocks) + (d.blocks === 1 ? ' block' : ' blocks') : '') +
              ' &middot; about ' + n(d.minutes) + ' min</span>' +
          '</span>' +
          '<span class="row__chev">' + ICO.play + '</span>' +
        '</button>';
    }).join('');

    return '' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-testid="split-sheet">' +
        '<div class="sheet__grab"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-section" id="sheet-title">' + esc(sp.name) + '</h2>' +
          '<button class="iconbtn" type="button" data-action="close-sheet" data-testid="sheet-close" aria-label="Close split">' +
            ICO.close + '</button>' +
        '</div>' +
        '<div class="sheet__body">' +
          /* COUNTED, and DATED. This line read "3 days, 15 exercises, edited
             undefined NaN": the count was days.length * 5, which is true of
             PPL and of no other split stored here, and the date was an ISO
             parse of "7/25/2026". Both come off the split itself now. */
          '<p class="t-detail" data-testid="split-summary">' + n(sp.days.length) +
            (sp.days.length === 1 ? ' day' : ' days') + ' &middot; ' +
            n(sp.exercises) + (sp.exercises === 1 ? ' exercise' : ' exercises') +
            (sp.updated ? ' &middot; edited ' + absDate(sp.updated) : '') + '</p>' +
          '<div class="card card--flush mt-3">' + days + '</div>' +
        '</div>' +
        '<div class="sheet__foot">' +
          '<button class="btn btn--secondary btn--block" type="button" data-action="edit-split" data-id="' + sp.id + '" ' +
                  'data-testid="edit-split">' + ICO.pencil +
            '<span class="btn__label">Edit split</span></button>' +
          /* A split could be made and edited and never removed, so a week
             somebody had stopped running sat at the top of the screen for
             good. Two taps, and the sessions it produced are not touched:
             deleting a plan is not a claim the training never happened. */
          '<button class="btn btn--block mt-2 ' +
            (S.confirmDel === sp.id ? 'btn--danger' : 'btn--tertiary') + '" type="button" ' +
            'data-action="del-split" data-id="' + sp.id + '" data-testid="delete-split">' +
            '<span class="btn__label">' + (S.confirmDel === sp.id
              ? 'Tap again to delete ' + esc(sp.name)
              : 'Delete this split') + '</span></button>' +
          (S.confirmDel === sp.id
            ? '<p class="t-meta mt-2" data-testid="delete-split-note">The sessions you logged from ' +
              'it stay in your history.</p>'
            : '') +
        '</div>' +
      '</div>';
  }

  /* The 41-tile wall, replaced. The catalogue is real now and it is all
     reachable: the sheet opens on the four groups, search reduces every one
     of them, and the count in the field is the count of the list. It said
     "Search 41 activities" over a list of nine and showed six of those. */
  function activitySheet() {
    var q = S.query.trim().toLowerCase();
    var all = allActivities();
    var body;
    if (q) {
      var shown = all.filter(function (a) {
        return a.name.toLowerCase().indexOf(q) > -1 ||
               (GNAME_CARDIO[a.g] || '').toLowerCase().indexOf(q) > -1;
      });
      body = (shown.length
        ? '<div class="card card--flush">' + shown.map(activityRow).join('') + '</div>'
        : '<div class="empty mt-4" data-testid="activity-none">' +
            '<span class="empty__ico">' + ICO.search + '</span>' +
            '<h2 class="empty__title">Nothing matches &ldquo;' + esc(S.query) + '&rdquo;</h2>' +
            '<p class="empty__body">Add it as your own and it joins the list for good.</p>' +
            '<button class="btn btn--primary" type="button" data-action="new-cardio" data-testid="new-cardio">' +
              ICO.plus + '<span class="btn__label">Add &ldquo;' + esc(S.query) + '&rdquo;</span></button>' +
          '</div>') +
        '<p class="t-meta mt-3" data-testid="activity-count">' + shown.length + ' of ' + catCount() + ' activities</p>';
    } else {
      var groups = CARDIO_GROUPS.slice();
      if (CUSTOM_CARDIO.length) groups = groups.concat([['yours', 'Yours']]);
      body = groups.map(function (g) {
        var list = all.filter(function (a) { return a.g === g[0] || (g[0] === 'yours' && a.custom); });
        if (!list.length) return '';
        return '<div class="section" style="padding-left:0;padding-right:0">' +
          '<div class="section__head"><h3 class="t-label">' + g[1] + '</h3>' +
            '<span class="t-meta num">' + list.length + '</span></div>' +
          '<div class="card card--flush">' + list.map(activityRow).join('') + '</div>' +
        '</div>';
      }).join('') +
      '<button class="btn btn--secondary btn--block mt-3" type="button" data-action="new-cardio" data-testid="new-cardio">' +
        ICO.plus + '<span class="btn__label">Add your own activity</span></button>' +
      '<p class="t-meta mt-3" data-testid="activity-count">All ' + catCount() + ' activities. Type to reduce them.</p>';
    }

    return '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="act-title" data-testid="activity-sheet" ' +
        'data-detents="0.6 0.94" data-detent-open="0.94">' +
        '<div class="sheet__grab"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-section" id="act-title">Log cardio</h2>' +
          '<button class="iconbtn" type="button" data-action="close-sheet" data-testid="activity-close" aria-label="Close activities">' +
            ICO.close + '</button>' +
        '</div>' +
        '<div class="search">' +
          '<span class="search__ico" aria-hidden="true">' + ICO.search + '</span>' +
          '<label class="vis-hidden" for="act-q">Search activities</label>' +
          '<input class="input" id="act-q" type="text" autocomplete="off" spellcheck="false" ' +
                 'placeholder="Search ' + catCount() + ' activities" value="' + esc(S.query) + '" ' +
                 'data-testid="activity-search">' +
        '</div>' +
        '<div class="sheet__body mt-3">' + body + '</div>' +
      '</div>';
  }
  var GNAME_CARDIO = {};
  CARDIO_GROUPS.forEach(function (g) { GNAME_CARDIO[g[0]] = g[1]; });

  /* Every activity row carries its own star — F-CARDIO-023. The row is a
     container rather than a button so the star can be a control of its own:
     a button inside a button is not markup a browser will render. */
  function activityRow(a) {
    var last = lastCardioFor(a.id);
    return '' +
      '<div class="row row--withaside" data-testid="actrow-' + a.id + '">' +
        '<span class="ico-well">' + ICO.cardio + '</span>' +
        '<button class="trainrow__main stack" type="button" data-action="log-cardio" data-id="' + a.id + '" ' +
                'data-testid="pick-' + a.id + '" aria-label="Log ' + esc(a.name) + '">' +
          '<span class="row__title">' + esc(a.name) +
            (a.custom ? ' <span class="badge">Yours</span>' : '') + '</span>' +
          '<span class="row__sub">' + n(a.min) + ' min by default &middot; ' + a.met + ' MET' +
            (last ? ' &middot; last ' + relDate(last.date) : '') + '</span>' +
        '</button>' +
        starBtn(a.id, a.name) +
      '</div>';
  }

  /* Your own activities — F-CARDIO-025. A name and a MET value is all an
     estimate needs; the MET is offered as four plain efforts rather than a
     number nobody carries in their head. */
  function newCardioSheet() {
    var d = S.newCardio;
    var EFFORTS = [['Easy, you could hold a conversation', 4], ['Steady, breathing hard', 7],
                   ['Hard, sentences are short', 9], ['All out', 11.5]];
    return '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="nc-title" data-testid="newcardio-sheet">' +
      '<div class="sheet__grab"></div>' +
      '<div class="sheet__head"><h2 class="t-section grow" id="nc-title">Your own activity</h2>' +
        '<button class="iconbtn" type="button" data-action="close-sheet" aria-label="Close" ' +
          'data-testid="newcardio-close">' + ICO.close + '</button></div>' +
      '<div class="sheet__body">' +
        '<label class="field"><span class="field__label t-label">Name</span>' +
          '<input class="input" type="text" value="' + esc(d.name) + '" data-action="nc-name" ' +
            'data-testid="nc-name" placeholder="Padel with Marco"></label>' +
        (d.error ? '<p class="field__error" role="alert" data-testid="nc-error">' + esc(d.error) + '</p>' : '') +
        '<label class="field mt-4"><span class="field__label t-label">Usual duration (min)</span>' +
          '<input class="input num" type="number" min="1" max="600" value="' + esc(d.min) + '" ' +
            'data-action="nc-min" data-testid="nc-min"></label>' +
        '<div class="mt-4"><span class="t-label">How hard it usually is</span>' +
          '<div class="card card--flush mt-2" role="radiogroup" aria-label="Effort">' + EFFORTS.map(function (e) {
            return '<button class="opt" type="button" role="radio" aria-checked="' + (d.met === e[1]) + '" ' +
              'data-action="nc-met" data-v="' + e[1] + '" data-testid="nc-met-' + e[1] + '">' +
              '<span class="opt__mark">' + ICO.play + '</span>' +
              '<span class="opt__main"><span class="opt__title">' + esc(e[0]) + '</span>' +
              '<span class="opt__sub">' + e[1] + ' MET</span></span></button>';
          }).join('') + '</div></div>' +
        '<p class="t-caption-1 quiet mt-3">Saved on this phone and added to the catalogue. ' +
          'The MET value is what the calorie estimate is built on.</p>' +
      '</div>' +
      '<div class="sheet__foot">' +
        '<button class="btn btn--primary btn--block" type="button" data-action="nc-save" data-testid="nc-save">' +
          '<span class="btn__label">Add it</span></button>' +
      '</div>' +
    '</div>';
  }

  /* FAVOURITES — F-CARDIO-002..005. They are stored setups, so this is where
     they are read, renamed, reordered and removed. Deleting takes two taps
     and the second one is the red one; there is no dialog, because a
     favourite is a shortcut and losing one costs a tap to rebuild. */
  function favSheet() {
    var body;
    if (!FAVS.length) {
      body = '<div class="empty" data-testid="favs-empty">' +
        '<span class="empty__ico">' + ICO.star + '</span>' +
        '<h2 class="empty__title">No favourites yet</h2>' +
        '<p class="empty__body">Log a cardio session and keep the setup. It comes back here as one tap, ' +
          'already carrying the duration and everything else you filled in.</p></div>';
    } else {
      body = '<div class="card card--flush">' + FAVS.map(function (f, i) {
        var confirming = S.confirmFav === f.id;
        return '<div class="row" data-testid="fav-' + f.id + '">' +
          '<span class="ico-well">' + ICO.star + '</span>' +
          '<span class="row__main stack">' +
            /* favName/favMin, not f.name/f.min. A stored favourite carries
               `label` and `defaults.durationSec` -- the shipped app's shape,
               which is why the helpers exist two hundred lines above this --
               so reading the raw keys rendered the literal string "undefined"
               in the name field, in the sub-line, and in all three aria
               labels. The helpers were written for exactly this and this row
               was the one place that did not call them. */
            '<input class="input" type="text" value="' + esc(favName(f)) + '" aria-label="Name of favourite" ' +
              'data-action="fav-rename" data-id="' + f.id + '" data-testid="fav-name-' + f.id + '">' +
            '<span class="row__sub">' + n(favMin(f)) + ' min' +
              (f.last ? ' &middot; saved ' + relDate(f.last) : '') + '</span>' +
          '</span>' +
          '<button class="iconbtn" type="button" data-action="fav-move" data-dir="-1" data-id="' + f.id + '" ' +
            (i === 0 ? 'disabled aria-disabled="true" ' : '') + 'aria-label="Move ' + esc(favName(f)) + ' up" ' +
            'data-testid="fav-up-' + f.id + '">' + ICO.up + '</button>' +
          '<button class="iconbtn" type="button" data-action="fav-move" data-dir="1" data-id="' + f.id + '" ' +
            (i === FAVS.length - 1 ? 'disabled aria-disabled="true" ' : '') + 'aria-label="Move ' + esc(favName(f)) + ' down" ' +
            'data-testid="fav-down-' + f.id + '">' + ICO.down + '</button>' +
          '<button class="iconbtn iconbtn--danger' + (confirming ? '' : '-quiet') + '" type="button" ' +
            'data-action="fav-delete" data-id="' + f.id + '" data-testid="fav-delete-' + f.id + '" ' +
            'aria-label="' + (confirming ? 'Confirm removing ' : 'Remove ') + esc(favName(f)) + '">' +
            (confirming ? '<span class="btn__label">Remove</span>' : ICO.trash) + '</button>' +
        '</div>';
      }).join('') + '</div>' +
      '<p class="t-meta mt-3">Tap the bin once to arm it, again to remove. Renaming saves as you type.</p>';
    }
    return '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fav-title" data-testid="favs-sheet">' +
      '<div class="sheet__grab"></div>' +
      '<div class="sheet__head"><h2 class="t-section grow" id="fav-title">Favourites</h2>' +
        '<button class="iconbtn" type="button" data-action="close-sheet" aria-label="Close favourites" ' +
          'data-testid="favs-close">' + ICO.close + '</button></div>' +
      '<div class="sheet__body">' + body + '</div>' +
    '</div>';
  }

  function overlayHTML() {
    if (S.logging) return cardioSheet();
    if (!S.sheet) return '';
    var inner = S.sheet.kind === 'split'
      ? splitSheet(SPLITS.filter(function (s) { return s.id === S.sheet.id; })[0])
      : S.sheet.kind === 'favs' ? favSheet()
      : S.sheet.kind === 'newcardio' ? newCardioSheet()
      : activitySheet();
    return '<div class="scrim" data-action="close-sheet" data-testid="scrim"></div>' + inner;
  }

  function toastHTML() {
    if (!S.toast) return '';
    return '' +
      '<div class="toast" role="status" data-testid="toast">' +
        '<span class="toast__body">' + S.toast + '</span>' +
        '<button class="toast__action" type="button" data-action="undo" data-testid="toast-undo">Undo</button>' +
      '</div>';
  }

  /* =============================================================
     Render
     ============================================================= */
  var screen = document.getElementById('screen');
  var hdr = document.getElementById('hdr');
  var body = document.getElementById('body');
  var overlay = document.getElementById('overlay');
  var toastSlot = document.getElementById('toast-slot');
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  var lastFocus = null;
  var toastTimer = null;

  function render(keepScroll) {
    var top = keepScroll ? body.scrollTop : 0;
    screen.setAttribute('data-state', S.state);
    screen.setAttribute('data-view', S.view);
    /* The large title belongs to the tab-level view only. A pushed sub-view
       has a back chevron and a 17px title, which is the collapsed state
       already, so collapsing it again would be collapsing nothing. */
    var pushed = S.view === 'history';
    hdr.classList.toggle('hdr--large', !pushed);
    if (pushed) hdr.removeAttribute('data-large-title');
    else hdr.setAttribute('data-large-title', '#body');
    LKPatch(hdr, headerHTML());
    if (window.LKChrome) LKChrome.init(document);
    LKPatch(body, (S.view === 'history' && S.state === 'populated')
      ? historyView()
      : (VIEWS[S.state] || VIEWS.populated)());
    body.scrollTop = top;
    LKPatch(overlay, overlayHTML());
    LKPatch(toastSlot, toastHTML());
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.state));
    });
    if (S.sheet) {
      var f = overlay.querySelector('.iconbtn');
      if (f) f.focus();
    }
  }

  function openSheet(sheet) {
    lastFocus = document.activeElement;
    S.sheet = sheet;
    S.confirmFav = null;
    if (sheet.kind !== 'newcardio') S.query = '';
    render(true);
  }
  function focusField(testid) {
    var f = overlay.querySelector('[data-testid="' + testid + '"]');
    if (f) { f.focus(); if (f.select) { try { f.select(); } catch (e) {} } }
  }
  function capitalise(s2) { return String(s2).charAt(0).toUpperCase() + String(s2).slice(1); }

  /* Re-draw the log sheet's body only, so a chip tap or a keystroke does not
     rebuild the field the caret is in. The live estimate moves with it. */
  function renderSheetBody() {
    var holder = overlay.querySelector('[data-testid="cardio-sheet"] .sheet__body');
    if (!holder) { render(true); return; }
    var tmp = document.createElement('div');
    tmp.innerHTML = cardioSheet();
    var next = tmp.querySelector('[data-testid="cardio-sheet"] .sheet__body');
    if (next) LKPatch(holder, next.innerHTML);
  }

  /* A favourite that gets used says so: the count and the date are what make
     the list orderable by anything other than when it was made. */
  function markFavUsed(fav) {
    fav.useCount = (fav.useCount || 0) + 1;
    fav.lastUsedAt = todayISO();
    if (store()) store().set('lk_cardioFavorites', FAVS);
  }

  function saveCustomCardio() {
    var d = S.newCardio;
    if (!d.name.trim()) {
      d.error = 'Give it a name first.';
      render(true); focusField('nc-name'); return;
    }
    var min = Number(d.min);
    if (isNaN(min) || min < 1 || min > 600) {
      d.error = 'A usual duration between 1 and 600 minutes.';
      render(true); focusField('nc-min'); return;
    }
    var act = { id: 'own_' + Date.now(), mod: 'custom', name: d.name.trim(), g: 'yours',
                met: d.met, min: min, custom: true, f: ['dist', 'hr', 'effort'] };
    var stored = (rd('lk_cardioCustom', [], false) || []).slice();
    stored.push(act);
    if (store()) store().set('lk_cardioCustom', stored);
    loadData(false);
    S.sheet = { kind: 'activity' };
    S.query = '';
    S.newCardio = null;
    render(true);
    say(esc(act.name) + ' added to your activities.');
  }
  function closeSheet() {
    S.sheet = null;
    S.query = '';
    render(true);
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }
  function say(msg) {
    S.toast = msg;
    render(true);
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; render(true); }, 4000);
  }

  /* =============================================================
     Events. Every action is declared on the element, so the whole
     screen is one delegated listener.
     ============================================================= */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    /* Any other control disarms a pending delete. An armed destructive button
       that stays armed while somebody does three other things is a trap. */
    if (S.confirmDel && (!t || t.getAttribute('data-action') !== 'del-split')) {
      S.confirmDel = null;
    }
    if (!t) return;
    var a = t.dataset.action;

    if (a === 'open-split') { openSheet({ kind: 'split', id: t.dataset.id }); return; }
    if (a === 'open-activities') { openSheet({ kind: 'activity' }); return; }
    if (a === 'close-sheet') { closeSheet(); return; }
    if (a === 'open-history') { S.view = 'history'; render(); body.focus(); return; }
    if (a === 'back') { S.view = 'hub'; render(); return; }
    if (a === 'filter') { S.filter = t.dataset.filter; S.cgroup = 'all'; render(true); return; }
    if (a === 'cgroup') { S.cgroup = t.getAttribute('data-g') || 'all'; render(true); return; }
    /* The star, from an activity row or from a session in the history. */
    if (a === 'fav-toggle') {
      var fid2 = t.getAttribute('data-id');
      var fromId = t.getAttribute('data-from');
      var fromW = null;
      if (fromId) {
        for (var fi = 0; fi < HISTORY.length; fi++) if (HISTORY[fi].id === fromId) fromW = HISTORY[fi];
      }
      toggleFav(fid2, fromW);
      render(true);
      return;
    }
    /* ONE TAP — F-CARDIO-003. The saved setup, logged at the duration it was
       saved with, with no form in between. What was written is shown
       immediately, in the same sheet a form-logged session ends on, so the
       figure can be checked and the session removed if it is wrong. */
    if (a === 'quick-log') {
      var qid = t.getAttribute('data-id');
      var qfav = FAVS.filter(function (f) { return f.id === t.getAttribute('data-fav'); })[0];
      var qact = findCardio(qid);
      if (!qact || !qfav) return;
      var qv = { min: favMin(qfav), note: '' };
      if (qfav.defaults && qfav.defaults.v) {
        Object.keys(qfav.defaults.v).forEach(function (k2) { qv[k2] = qfav.defaults.v[k2]; });
        qv.min = favMin(qfav);
      }
      markFavUsed(qfav);
      S.logging = { id: qid, name: qact.name, v: qv };
      S.logError = null;
      if (S.sheet) { S.sheet = null; S.query = ''; }
      saveCardio();
      return;
    }
    /* Opens the duration sheet rather than logging on the tap. The row
       carries the duration this activity is normally done for, and one tap
       from there logs it -- but "logged 30 minutes" when it was 22 is a
       wrong number in the record, and the shipped app asked. */
    if (a === 'log-cardio') {
      var id = t.getAttribute('data-id');
      var c = findCardio(id);
      if (!c) return;
      /* The form opens on what this person last did, not on the catalogue
         default: a saved setup first, then the last logged session, then the
         catalogue. Every answer is pre-filled, which is the whole value of a
         favourite. */
      var v = { min: c.min, note: '' };
      var favId = t.getAttribute('data-fav');
      var fav = favId && FAVS.filter(function (f) { return f.id === favId; })[0];
      var last = lastCardioFor(id);
      if (last) {
        v.min = last.min;
        if (last.km != null) v.dist = last.km;
        if (last.hr != null) v.hr = last.hr;
        if (last.surface) v.surface = capitalise(last.surface);
        if (last.effort) v.effort = last.effort;
        if (last.watts != null) v.watts = last.watts;
      }
      if (fav) {
        v.min = favMin(fav);
        if (fav.defaults && fav.defaults.v) {
          Object.keys(fav.defaults.v).forEach(function (k) { v[k] = fav.defaults.v[k]; });
          v.min = favMin(fav);
        }
        markFavUsed(fav);
      }
      S.logging = { id: id, name: c.name, v: v };
      S.logError = null;
      if (S.sheet) closeSheet(); else render();
      focusField('cardio-min');
      return;
    }
    if (a === 'cardio-cancel') { S.logging = null; S.logError = null; render(); return; }
    if (a === 'cardio-save') { saveCardio(); return; }
    if (a === 'cardio-fav') { saveFavourite(); return; }
    if (a === 'cf-min') { S.logging.v.min = Number(t.getAttribute('data-v')); renderSheetBody(); return; }
    if (a === 'cf-choice') {
      var k = t.getAttribute('data-k'), val = t.getAttribute('data-v');
      S.logging.v[k] = S.logging.v[k] === val ? undefined : val;
      renderSheetBody();
      return;
    }
    if (a === 'open-favs') { openSheet({ kind: 'favs' }); return; }
    if (a === 'new-cardio') {
      S.newCardio = { name: S.query.trim(), min: 30, met: 7, error: null };
      openSheet({ kind: 'newcardio' });
      focusField('nc-name');
      return;
    }
    if (a === 'nc-met') { S.newCardio.met = Number(t.getAttribute('data-v')); render(true); return; }
    if (a === 'nc-save') { saveCustomCardio(); return; }
    if (a === 'fav-move') {
      var dir = Number(t.getAttribute('data-dir'));
      var fid = t.getAttribute('data-id');
      var i = FAVS.map(function (f) { return f.id; }).indexOf(fid);
      if (i < 0 || i + dir < 0 || i + dir >= FAVS.length) return;
      FAVS.splice(i + dir, 0, FAVS.splice(i, 1)[0]);
      FAVS.forEach(function (f, k) { f.order = k; });
      if (store()) store().set('lk_cardioFavorites', FAVS);
      render(true);
      focusField('fav-' + (dir < 0 ? 'up' : 'down') + '-' + fid);
      return;
    }
    if (a === 'fav-delete') {
      var did = t.getAttribute('data-id');
      /* Two taps, not a dialog. The first arms the button and says so; the
         second removes. A favourite is a shortcut, so losing one costs a tap
         to rebuild and does not deserve a modal. */
      if (S.confirmFav !== did) { S.confirmFav = did; render(true); return; }
      var gone = FAVS.filter(function (f) { return f.id === did; })[0];
      FAVS = FAVS.filter(function (f) { return f.id !== did; });
      FAVS.forEach(function (f, k) { f.order = k; });
      if (store()) store().set('lk_cardioFavorites', FAVS);
      S.confirmFav = null;
      render(true);
      say(esc(favName(gone || {})) + ' removed from favourites.');
      return;
    }
    if (a === 'toggle-session') {
      S.open = S.open === t.getAttribute('data-id') ? null : t.getAttribute('data-id');
      render(true);
      return;
    }
    if (a === 'undo') { S.toast = null; render(true); return; }
    if (a === 'retry') { S.state = 'loading'; render(); setTimeout(function () { S.state = 'populated'; render(); }, 900); return; }
    if (a === 'use-cached') { S.state = 'populated'; render(); return; }
    /* These leave the screen. They used to toast "Opens the split builder."
       and stay put, which is a sentence that describes what a working button
       would have done. In the demo the router takes them first, by the same
       selectors, and every destination below is declared in MANIFEST.nav. */
    /* WHICH day. The log opened its own seeded Push session whatever was
       pressed, so "Start Upper A" landed in a PPL - Push already 21 minutes
       in with 1,088 kg on it. The day is handed over by id. */
    if (a === 'start-today') { handStartDay(todayDayKey()); LKGo('workout-log'); return; }
    if (a === 'start-day') { handStartDay(t.getAttribute('data-id') || ''); closeSheet(); LKGo('workout-log'); return; }
    /* WHICH split. Both of these opened the builder with no idea which split
       was meant, so "Edit split" and "New split" landed on the same thing. */
    if (a === 'del-split') {
      var did = t.getAttribute('data-id');
      if (S.confirmDel !== did) { S.confirmDel = did; render(true); return; }
      var keep = [], goneSp = null;
      (rd('lk_splits', [], false) || []).forEach(function (x) {
        if (x.id === did) goneSp = x; else keep.push(x);
      });
      if (store()) store().set('lk_splits', keep);
      S.confirmDel = null; S.sheet = null;
      loadSplits(false);
      render(true);
      say(goneSp ? esc(goneSp.name) + ' deleted. Its sessions are still in your history.' : 'Deleted.');
      return;
    }
    if (a === 'edit-split') {
      try { localStorage.setItem('lk_openSplit', t.getAttribute('data-id') || ''); } catch (err) {}
      LKGo('split-builder'); return;
    }
    if (a === 'new-split') {
      try {
        localStorage.setItem('lk_openSplit', t.getAttribute('data-mode') === 'draft' ? '__draft__' : '__new__');
      } catch (err) {}
      LKGo('split-builder'); return;
    }
    if (a === 'open-library') { LKGo('exercise-library'); return; }
    if (a === 'open-session') {
      /* WHICH session. Every history row used to open the same hand-written
         workout-detail, so tapping any of the eighteen sessions showed one
         fixed Sep 5 Pull -- with lifts that appear in no session at all. */
      try { localStorage.setItem('lk_openWorkout', t.getAttribute('data-id') || ''); } catch (err) {}
      LKGo('workout-detail');
      return;
    }
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.id === 'act-q') {
      S.query = el.value;
      var holder = overlay.querySelector('[data-testid="activity-sheet"] .sheet__body');
      if (!holder) return;
      /* Re-render the sheet body only, so the field keeps focus and
         the caret. */
      var tmp = document.createElement('div');
      tmp.innerHTML = activitySheet();
      LKPatch(holder, tmp.querySelector('.sheet__body').innerHTML);
      return;
    }
    var a = el.getAttribute && el.getAttribute('data-action');
    if (!a) return;
    if (a === 'cf-num' && S.logging) {
      var k = el.getAttribute('data-k');
      var raw = el.value === '' ? '' : Number(el.value);
      /* The model is always kilograms: a pack weight typed in pounds is
         converted here, on the way in, and never again. */
      if (k !== 'min' && FIELD[k] && FIELD[k].type === 'weight' && raw !== '') {
        raw = LKUnits.useKg() ? raw : Math.round(raw / LKUnits.lbPerKg * 100) / 100;
      }
      /* And the same for a distance typed in miles. The record is kilometres
         whatever the field is labelled. */
      if (k !== 'min' && FIELD[k] && FIELD[k].type === 'dist' && raw !== '') {
        raw = distIn(raw);
      }
      S.logging.v[k] = raw;
      updateEstimate();
      return;
    }
    if (a === 'cf-note' && S.logging) { S.logging.v.note = el.value; return; }
    if (a === 'nc-name' && S.newCardio) { S.newCardio.name = el.value; return; }
    if (a === 'nc-min' && S.newCardio) { S.newCardio.min = el.value; return; }
    if (a === 'fav-rename') {
      var fid = el.getAttribute('data-id');
      FAVS.forEach(function (f) { if (f.id === fid) f.label = el.value; });
      if (store()) store().set('lk_cardioFavorites', FAVS);
      return;
    }
  });

  /* Only the estimate card, so typing a distance never rebuilds the field
     the caret is in. */
  function updateEstimate() {
    var holder = overlay.querySelector('[data-testid="cardio-estimate"]');
    if (!holder || !S.logging) return;
    var act = findCardio(S.logging.id);
    if (!act) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = estimateCard(act, S.logging.v);
    LKPatch(holder, tmp.firstChild.innerHTML);
  }

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (S.sheet) { closeSheet(); return; }
    if (S.view === 'history') { S.view = 'hub'; render(); }
  });

  /* =============================================================
     Dev state toggle
     ============================================================= */
  var STATES = [
    ['populated', 'Populated'],
    ['empty', 'Empty'],
    ['loading', 'Loading'],
    ['error', 'Error']
  ];
  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" type="button" data-state="' + s[0] + '" aria-pressed="false" ' +
      'data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join(''));
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (!b) return;
    /* The switcher shows a STATE, so it rebuilds from the fixture and must
       not read a person's stored sessions back over the state it is showing. */
    loadData(true);
    S.state = b.dataset.state;
    S.view = 'hub';
    S.sheet = null;
    S.toast = null;
    S.logging = null;
    S.open = null;
    render();
  });

  /* Another tab logging a session, or the workout log finishing one, moves
     this screen rather than leaving the two to drift. */
  if (window.LKStore) {
    ['lk_history', 'lk_splits', 'lk_cardioFavorites', 'lk_cardioCustom'].forEach(function (k) {
      LKStore.onChange(k, function () {
        if (S.logging || S.sheet) return;
        loadData(false);
        render(true);
      });
    });
  }

  /* The migration runs before the first read, and the estimate it may need
     is built on this person's own body weight, so the profile is loaded
     first and the history re-read after. */
  loadData(false);
  if (migrateCardio()) loadData(false);
  var params = new URLSearchParams(location.search);
  if (params.get('state')) S.state = params.get('state');
  if (params.get('view')) S.view = params.get('view');
  render();
})();

  /* The running workout, from a screen that is not it. Leaving the workout
     log used to lose the session outright: nothing was written down, and no
     screen but Home and Fuel had anywhere to say one was open. The record
     lives in session.js; this mounts its shelf and takes the tap back. */
  if (window.LKSession) {
    LKSession.mount(document.getElementById('shelf-slot'),
      typeof LKPatch === 'function' ? LKPatch : null);
    document.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-testid="shelf-resume"]') : null;
      if (el) { e.preventDefault(); LKGo('workout-log'); }
    });
  }
</script>
</body>
</html>
