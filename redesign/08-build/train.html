<body>
<!--
  TRAIN — what this screen is, and why it is shaped this way.

  WHY IT EXISTS. The HIG audit's finding 2: "the split builder has no
  entrance once you have a split. Train lands directly on Exercises with
  no sub-navigation, and populated Home offers only 'Choose another
  session'. For a user who already has a split, editing their own
  program is unreachable at any depth." Train is now the home of
  everything training-related that is not the active session: the splits
  you own, the record of what you did, cardio, and the catalogue.

  STRUCTURE: ONE SCROLLING SCREEN, ONE PUSHED DESTINATION, TWO SHEETS.

  Sections on one screen, not tabs. The audited hub had a three-item
  underline sub-tab row (My Splits / History / Library) that was broken
  as a set — "Library" replaced the whole hub while the other two swapped
  content — and the design audit counted it as the app's sixth tab
  idiom. The four things this screen holds are not peers you switch
  between; they are one continuous answer to "what do I do about
  training". Splits, cardio and history are read in that order, top to
  bottom, and stacking them costs a scroll rather than a tap. The
  segmented control is spent once, on the one place a filter genuinely
  reduces work: the full history list. That is the app's single
  segmented control, and this screen introduces no second tab pattern.

  Two things push away, both because they are deeper than daily:
    - All history (22 sessions, filterable) is its own destination,
      reached from a five-row preview. Same row component in both, so
      this is a preview and its expansion, not the two competing
      history lists the Cardio audit found.
    - Editing a split lives inside a sheet on the split, one level below
      starting a day. Monthly action, one level deeper; still findable
      because the split row is the obvious thing to touch.

  TAPS. Start today's session: 1 (Start Push, first fold). Start any
  other day: 2 (split row, then the day). Edit a split: 2 (split row,
  then Edit split). The audited hub was 3 taps cold to a programmed
  workout, and editing a split had no entrance at all.

  WHAT CAME FROM CARDIO. Both audits concluded Cardio merges here: its
  history list filtered the same lk_history Train already rendered, so
  one of the two was pure duplication.
    - The history row design. The Cardio audit judged its row the
      better of the two: icon, title, one muted metric line, a
      right-aligned date. Train's printed the duration twice and wrapped
      the metrics in an accent-outlined pill that competed with the
      lifting volume figure. This screen has one row component, used for
      both kinds of session; the duration is printed once and no metric
      carries a pill.
    - MINUTES PER WEEK, kept as built: eight bars, tabular labels, a
      dated axis, one bar standing out. Its ink is --text rather than
      the accent, because the accent on this screen is on Start.
    - Instead of the 41-tile wall: ranking. The audit called the wall a
      selection problem — 41 equal tiles ordered by category, ~2,700px
      tall, favourites the real fix but taught only in the empty state.
      Here the three activities this lifter actually does are rows at
      the top, already carrying their usual duration, one tap to log.
      Everything else is behind one row that opens a search-first
      picker. Rank the list, do not enlarge the grid.
    - Dropped from Cardio: the separate screen and its back button, the
      duplicate history list and filter chips, the "which treadmill?"
      step its own copy called cosmetic, the tile gradients and glow.

  ALSO CUT. Quick Start (an accent fill that started an empty workout
  while the programmed session sat below the fold), the RECENT strip
  (clipped past the third chip, every chip reachable from history), the
  day sheet that re-listed days already on screen, and Delete split from
  the footer row — it had no confirm and sat a thumb-width from Start.
  Deleting a split belongs in the editor that owns it.

  ACCENT: exactly one fill per state, on the action a lifter came to
  take. Populated: Start Push. Empty: Build a split. Error: Try again.
  Loading and the history destination carry none.

  DATA: inlined from tests/fixtures/seed-data.json — lk_splits (3),
  lk_history (18 lifting + 4 cardio, 2026-07-30 to 2026-09-06),
  lk_cardioFavorites. Units kg from lk_profile.useKg. Today is
  Wed 9 Sep 2026, matching home.html.
-->

<script>
(function () {
  "use strict";

  /* =============================================================
     Icons. One set, one stroke weight, one optical size. Cardio
     sessions all carry the same glyph: the label says which
     activity, so 41 distinct icons would be 41 things to learn.
     ============================================================= */
  function svg(d, extra) {
    return '<svg class="ico' + (extra || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + d + '</svg>';
  }
  var ICO = {
    play:    svg('<path d="M8 5.5v13l11-6.5z"/>'),
    chev:    svg('<path d="m9 5 7 7-7 7"/>'),
    back:    svg('<path d="m15 5-7 7 7 7"/>'),
    lift:    svg('<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>'),
    cardio:  svg('<path d="M3 12h3.5l2-6 4 12 2.2-6H21"/>'),
    split:   svg('<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M8 3v4M16 3v4M3.5 10.5h17"/>'),
    book:    svg('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/>'),
    plus:    svg('<path d="M12 6v12M6 12h12"/>'),
    pencil:  svg('<path d="M4 20h4l10-10-4-4L4 16zM14 6l4 4"/>'),
    close:   svg('<path d="M7 7l10 10M17 7L7 17"/>'),
    alert:   svg('<path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/>'),
    search:  svg('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>'),
    plan:    svg('<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M8 3v4M16 3v4M3.5 10.5h17"/>'),
    star:    svg('<path d="M12 4l2.4 5.2 5.6.7-4.1 3.9 1.1 5.6-5-2.9-5 2.9 1.1-5.6L4 9.9l5.6-.7z"/>'),
    trash:   svg('<path d="M5 7h14M10 7V4.5h4V7M9 11v6M15 11v6M7 7l1 13h8l1-13"/>'),
    up:      svg('<path d="M12 19V5M6 11l6-6 6 6"/>'),
    down:    svg('<path d="M12 5v14M6 13l6 6 6-6"/>')
  };

  /* =============================================================
     Formatting. Every figure is tabular and carries its unit.
     Dates are relative inside the week, absolute after it.
     ============================================================= */
  var MONTHS = ['January','February','March','April','May','June','July',
                'August','September','October','November','December'];
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var TODAY = '2026-09-09';

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function n(v) { return '<span class="num">' + v + '</span>'; }
  function group(v) { return Number(v).toLocaleString('en-US'); }
  function ms(iso) {
    var p = iso.split('-');
    return Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function daysAgo(iso) { return Math.round((ms(TODAY) - ms(iso)) / 86400000); }
  function absDate(iso) {
    var p = iso.split('-');
    return MON[Number(p[1]) - 1] + ' ' + Number(p[2]);
  }
  function relDate(iso) {
    var d = daysAgo(iso);
    if (d === 0) return 'Today';
    if (d === 1) return 'Yesterday';
    if (d < 7) return d + ' days ago';
    return absDate(iso);
  }
  function monthOf(iso) {
    var p = iso.split('-');
    return MONTHS[Number(p[1]) - 1] + ' ' + p[0];
  }

  /* =============================================================
     Seed and store. tests/fixtures/seed-data.json is the seed; once a
     person has logged anything, LKStore holds the truth and the fixture
     is never consulted again for that key. Everything below is READ
     through loadData() rather than frozen into a const, because a cardio
     session logged on this screen has to move the chart, the week row and
     the history list, and a reload has to find it still there.
     ============================================================= */
  function store() { return window.LKStore; }
  /* `fresh` is the dev switcher rebuilding a state from scratch: it must not
     read a person's stored sessions back over the state it is showing. */
  function rd(key, fallback, fresh) {
    var st = store();
    if (!st || fresh) {
      var F = window.LKFixtures;
      if (!fresh && !st) return fallback;
      if (key === 'lk_history' && F) return JSON.parse(JSON.stringify(F.history));
      if (key === 'lk_splits' && F) return JSON.parse(JSON.stringify(F.splits));
      return fallback;
    }
    return st.get(key, fallback);
  }

  /* A stored split carries `created` as "7/25/2026" and history carries ISO.
     absDate() split on "-" and so read "edited undefined NaN" on every split
     sheet in the build. Both shapes are understood here, and anything that is
     neither is absent rather than a word. */
  function toISO(s) {
    if (!s) return null;
    s = String(s);
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!m) return null;
    function p2(v) { return (v.length < 2 ? '0' : '') + v; }
    return m[3] + '-' + p2(m[1]) + '-' + p2(m[2]);
  }

  var MIN_PER_EX = 10;
  var SPLITS = [], HISTORY = [], WEEKS = [], FAVS = [], CUSTOM_CARDIO = [];
  var BODY_KG = 70;

  /* lk_splits. The day rows' exercise counts are COUNTED and the split's own
     total is the sum of them. The sheet printed days.length * 5, which is
     true of PPL and of nothing else: an Upper/Lower of 10 exercises read 10
     only by coincidence, and a day with four lifts was still counted as five. */
  function loadSplits(fresh) {
    var raw = rd('lk_splits', [], fresh) || [];
    SPLITS = raw.map(function (sp, i) {
      var days = (sp.days || []).map(function (d, j) {
        var count = (d.exercises || []).length;
        return { id: (d.name || ('day' + j)).toLowerCase().replace(/\W+/g, '-'), name: d.name,
                 exercises: count, minutes: count * MIN_PER_EX, next: i === 0 && j === 0 };
      });
      return {
        id: sp.id, name: sp.name, current: i === 0,
        updated: toISO(sp.updated || sp.created),
        exercises: days.reduce(function (a, d) { return a + d.exercises; }, 0),
        days: days
      };
    });
  }

  /* lk_history, in this screen's row shape. A lifting row carries sets and
     volume; a cardio row carries whatever was actually measured and nothing
     it was not. */
  function loadHistory(fresh) {
    var raw = rd('lk_history', [], fresh) || [];
    HISTORY = raw.map(function (w) {
      var row = { id: w.id, kind: w.kind === 'cardio' ? 'cardio' : 'lift',
                  name: String(w.name || '').replace(/ - /g, ' &middot; '),
                  date: w.date, min: w.min };
      if (row.kind === 'lift') { row.sets = w.sets; row.kg = w.kg; }
      else {
        ['km', 'cal', 'calNet', 'calRange', 'calTier', 'calConf', 'effort', 'surface',
         'position', 'machine', 'resistance', 'incline', 'watts', 'hr', 'note', 'act'
        ].forEach(function (k) { if (w[k] !== undefined && w[k] !== null && w[k] !== '') row[k] = w[k]; });
      }
      return row;
    }).sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  }

  /* Minutes of cardio per week, Monday weeks, eight buckets ending on the
     week TODAY falls in. It was a hand-typed array, so a session logged on
     this screen moved a chart that had already been drawn from constants. */
  function mondayOf(iso) {
    var d = new Date(ms(iso));
    var dow = (d.getUTCDay() + 6) % 7;          /* Monday = 0 */
    d.setUTCDate(d.getUTCDate() - dow);
    return d.toISOString().slice(0, 10);
  }
  function loadWeeks() {
    var thisWeek = mondayOf(TODAY);
    var starts = [];
    for (var i = 7; i >= 0; i--) {
      var d = new Date(ms(thisWeek));
      d.setUTCDate(d.getUTCDate() - i * 7);
      starts.push(d.toISOString().slice(0, 10));
    }
    WEEKS = starts.map(function (s) {
      return { start: s, min: 0, cal: 0, n: 0, now: s === thisWeek };
    });
    HISTORY.forEach(function (w) {
      if (w.kind !== 'cardio') return;
      var wk = mondayOf(w.date);
      for (var i = 0; i < WEEKS.length; i++) {
        if (WEEKS[i].start === wk) {
          WEEKS[i].min += w.min || 0;
          WEEKS[i].cal += w.cal || 0;
          WEEKS[i].n += 1;
        }
      }
    });
  }

  function loadData(fresh) {
    loadSplits(fresh);
    loadHistory(fresh);
    loadWeeks();
    FAVS = rd('lk_cardioFavorites', [], fresh) || [];
    CUSTOM_CARDIO = rd('lk_cardioCustom', [], fresh) || [];
    var prof = rd('lk_profile', null, fresh) ||
               (window.LKFixtures && LKFixtures.profile) || {};
    BODY_KG = Number(prof.weightKg) > 0 ? Number(prof.weightKg) : 70;
  }

  /* =============================================================
     THE CARDIO CATALOGUE. The picker said "41 activities, searchable"
     over a list of nine, and the sheet it opened offered six of them.
     Here are the forty-one, in the four groups the shipped app groups
     them by, each carrying what it needs to be logged honestly:

       met     the Compendium of Physical Activities value for a steady
               effort, which is what the calorie estimate is built on
       speed   'run' | 'walk' | 'bike' | null — where a distance lets the
               MET be read off the actual pace rather than assumed
       fields  what this activity is asked for beyond duration. A treadmill
               is asked for incline, a road bike for its riding position,
               a rower for its split. Asking a swimmer for a surface was
               the kind of question the Cardio audit called cosmetic.
     ============================================================= */
  var CARDIO_GROUPS = [
    ['machine', 'Machines'],
    ['outdoor', 'Outdoors'],
    ['water',   'Water and snow'],
    ['studio',  'Studio and sport']
  ];
  var CARDIO_CAT = [
    /* Machines */
    { id: 'treadrun',  name: 'Treadmill run',      g: 'machine', met: 9.8,  min: 30, speed: 'run',  f: ['dist', 'incline', 'hr', 'effort'] },

    { id: 'recumbent', name: 'Recumbent bike',     g: 'machine', met: 5.5,  min: 30, f: ['dist', 'resistance', 'hr', 'effort'] },
    { id: 'spinbike',  name: 'Spin bike',          g: 'machine', met: 8.5,  min: 45, f: ['dist', 'resistance', 'watts', 'hr', 'effort'] },
    { id: 'ellip',     name: 'Elliptical',         g: 'machine', met: 5.0,  min: 30, f: ['dist', 'resistance', 'hr', 'effort'] },
    { id: 'stair',     name: 'Stair climber',      g: 'machine', met: 9.0,  min: 20, f: ['floors', 'resistance', 'hr', 'effort'] },
    { id: 'ski',       name: 'Ski erg',            g: 'machine', met: 7.0,  min: 15, f: ['dist', 'watts', 'hr', 'effort'] },
    { id: 'airbike',   name: 'Air bike',           g: 'machine', met: 8.5,  min: 15, f: ['dist', 'watts', 'hr', 'effort'] },
    { id: 'armerg',    name: 'Arm ergometer',      g: 'machine', met: 5.0,  min: 15, f: ['dist', 'resistance', 'hr', 'effort'] },
    { id: 'curved',    name: 'Curved treadmill',   g: 'machine', met: 10.0, min: 20, speed: 'run', f: ['dist', 'hr', 'effort'] },
    { id: 'versa',     name: 'VersaClimber',       g: 'machine', met: 9.0,  min: 15, f: ['floors', 'hr', 'effort'] },

    { id: 'run',       name: 'Outdoor run',        g: 'outdoor', met: 9.8,  min: 35, speed: 'run',  f: ['dist', 'surface', 'hr', 'effort'] },
    { id: 'trail',     name: 'Trail run',          g: 'outdoor', met: 10.0, min: 45, speed: 'run',  f: ['dist', 'climb', 'hr', 'effort'] },
    { id: 'walk',      name: 'Walking',            g: 'outdoor', met: 3.5,  min: 45, speed: 'walk', f: ['dist', 'surface', 'hr', 'effort'] },
    { id: 'powerwalk', name: 'Power walking',      g: 'outdoor', met: 5.0,  min: 30, speed: 'walk', f: ['dist', 'surface', 'hr', 'effort'] },
    { id: 'hike',      name: 'Hiking',             g: 'outdoor', met: 6.0,  min: 60, f: ['dist', 'climb', 'hr', 'effort'] },
    { id: 'cycle',     name: 'Outdoor cycling',    g: 'outdoor', met: 8.0,  min: 45, speed: 'bike', f: ['dist', 'position', 'climb', 'hr', 'effort'] },
    { id: 'mtb',       name: 'Mountain biking',    g: 'outdoor', met: 8.5,  min: 60, f: ['dist', 'climb', 'hr', 'effort'] },
    { id: 'commute',   name: 'Cycling commute',    g: 'outdoor', met: 6.8,  min: 25, speed: 'bike', f: ['dist', 'position', 'hr'] },
    { id: 'hills',     name: 'Hill sprints',       g: 'outdoor', met: 10.0, min: 15, f: ['reps', 'hr', 'effort'] },
    { id: 'sled',      name: 'Sled push and drag', g: 'outdoor', met: 8.0,  min: 12, f: ['dist', 'hr', 'effort'] },
    { id: 'ruck',      name: 'Rucking',            g: 'outdoor', met: 7.0,  min: 50, speed: 'walk', f: ['dist', 'packkg', 'climb', 'hr'] },
    { id: 'stairs',    name: 'Stair climbing',     g: 'outdoor', met: 8.8,  min: 20, f: ['floors', 'hr', 'effort'] },
    /* Water and snow */
    { id: 'swimfree',  name: 'Swimming, freestyle', g: 'water', met: 8.3,  min: 30, f: ['dist', 'hr', 'effort'] },
    { id: 'swimbreast',name: 'Swimming, breaststroke', g: 'water', met: 10.3, min: 30, f: ['dist', 'hr', 'effort'] },
    { id: 'swimopen',  name: 'Open water swim',    g: 'water', met: 9.5,  min: 40, f: ['dist', 'hr', 'effort'] },
    { id: 'aqua',      name: 'Aqua jogging',       g: 'water', met: 8.0,  min: 30, f: ['hr', 'effort'] },

    { id: 'waterrow',  name: 'Rowing on water',    g: 'water', met: 7.0,  min: 60, f: ['dist', 'hr', 'effort'] },
    { id: 'sup',       name: 'Paddleboarding',     g: 'water', met: 6.0,  min: 45, f: ['dist', 'hr'] },
    { id: 'xcski',     name: 'Cross-country skiing', g: 'water', met: 9.0, min: 60, f: ['dist', 'climb', 'hr', 'effort'] },
    { id: 'snowshoe',  name: 'Snowshoeing',        g: 'water', met: 7.5,  min: 60, f: ['dist', 'climb', 'hr'] },
    /* Studio and sport */
    { id: 'rope',      name: 'Jump rope',          g: 'studio', met: 12.3, min: 12, f: ['reps', 'hr', 'effort'] },
    { id: 'hiit',      name: 'HIIT circuit',       g: 'studio', met: 8.0,  min: 20, f: ['rounds', 'hr', 'effort'] },
    { id: 'circuit',   name: 'Circuit training',   g: 'studio', met: 7.5,  min: 30, f: ['rounds', 'hr', 'effort'] },
    { id: 'bag',       name: 'Boxing, heavy bag',  g: 'studio', met: 7.8,  min: 20, f: ['rounds', 'hr', 'effort'] },
    { id: 'kick',      name: 'Kickboxing class',   g: 'studio', met: 10.3, min: 45, f: ['hr', 'effort'] },
    { id: 'spinclass', name: 'Spin class',         g: 'studio', met: 8.5,  min: 45, f: ['watts', 'hr', 'effort'] },
    { id: 'dance',     name: 'Dance cardio',       g: 'studio', met: 7.3,  min: 45, f: ['hr', 'effort'] },
    { id: 'climb',     name: 'Rock climbing',      g: 'studio', met: 8.0,  min: 60, f: ['hr', 'effort'] },
    { id: 'football',  name: 'Football',           g: 'studio', met: 7.0,  min: 60, f: ['hr', 'effort'] },
    { id: 'basketball',name: 'Basketball',         g: 'studio', met: 6.5,  min: 45, f: ['hr', 'effort'] },
    { id: 'tennis',    name: 'Tennis',             g: 'studio', met: 7.3,  min: 60, f: ['hr', 'effort'] },
    { id: 'padel',     name: 'Padel',              g: 'studio', met: 7.0,  min: 60, f: ['hr', 'effort'] }
  ];

  /* The field schema. One row per field id, so a form is built from the
     activity rather than from a fixed list of questions. */
  var FIELD = {
    dist:       { label: 'Distance', unit: 'km',      type: 'num', step: '0.01', max: 500 },
    floors:     { label: 'Floors',   unit: 'floors',  type: 'num', step: '1',    max: 5000 },
    reps:       { label: 'Reps',     unit: 'reps',    type: 'num', step: '1',    max: 5000 },
    rounds:     { label: 'Rounds',   unit: 'rounds',  type: 'num', step: '1',    max: 200 },
    watts:      { label: 'Average power', unit: 'W',  type: 'num', step: '1',    max: 900 },
    hr:         { label: 'Average heart rate', unit: 'bpm', type: 'num', step: '1', min: 30, max: 230 },
    incline:    { label: 'Incline',  unit: '%',       type: 'num', step: '0.5',  max: 40 },
    climb:      { label: 'Elevation gain', unit: 'm', type: 'num', step: '1',    max: 9000 },
    resistance: { label: 'Resistance level', unit: '', type: 'num', step: '1',   max: 30 },
    packkg:     { label: 'Pack weight', unit: 'kg',   type: 'weight', step: '0.5', max: 80 },
    surface:    { label: 'Surface',  type: 'choice', opts: ['Road', 'Track', 'Trail', 'Treadmill', 'Sand'] },
    position:   { label: 'Riding position', type: 'choice', opts: ['Upright', 'Hoods', 'Drops', 'Aero bars'] },
    effort:     { label: 'How hard', type: 'choice', opts: ['Easy', 'Steady', 'Hard', 'All out'] }
  };
  var EFFORT_K = { 'Easy': 0.85, 'Steady': 1, 'Hard': 1.15, 'All out': 1.3 };

  function catCount() { return CARDIO_CAT.length + CUSTOM_CARDIO.length; }
  function allActivities() { return CARDIO_CAT.concat(CUSTOM_CARDIO); }
  function findCardio(id) {
    var all = allActivities();
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return null;
  }

  /* =============================================================
     THE CALORIE ESTIMATE. A logged cardio session carried no calorie
     figure at all: the sheet asked for minutes, wrote minutes, and the
     history row printed minutes. Every figure below is arithmetic done
     on this device from this person's own body weight and what they
     typed; nothing is fetched and nothing is invented.

       kcal = MET x 3.5 x kg / 200 x minutes

     which is the standard reading of a MET as 3.5 ml of oxygen per
     kilogram per minute at about 5 kcal per litre of oxygen. Where a
     distance was given for a run, walk or ride, the MET is read off the
     actual pace instead of the catalogue's steady-effort value, which is
     the single biggest improvement available without a chest strap.

     NET is the burn above simply existing for those minutes: (MET - 1).
     It is the smaller and the more honest number for anyone subtracting
     it from a food target, so both are shown and both are labelled.

     The range is not decoration. It widens as the inputs thin out, and
     the confidence pill says which of the five things the estimate wants
     were actually known. Nothing here is presented as measured. */
  function metForSpeed(kind, kph) {
    if (!(kph > 0)) return null;
    if (kind === 'run') {
      /* ACSM running: 0.2 ml/kg/min per m/min, plus 3.5 resting. */
      if (kph < 6.4) return null;                 /* that is a walk, not a run */
      return Math.min(23, (0.2 * (kph * 1000 / 60) + 3.5) / 3.5);
    }
    if (kind === 'walk') {
      if (kph > 8) return null;
      return Math.max(2, Math.min(9, (0.1 * (kph * 1000 / 60) + 3.5) / 3.5));
    }
    if (kind === 'bike') {
      if (kph < 8) return 3.5;
      if (kph < 16) return 5.8;
      if (kph < 19) return 6.8;
      if (kph < 22) return 8.0;
      if (kph < 26) return 10.0;
      if (kph < 30) return 12.0;
      return 15.8;
    }
    return null;
  }

  /* Five things an estimate wants. Each one that is known both narrows the
     range and lights a bar on the meter, so the reader can see what the
     figure is standing on rather than being asked to trust it. */
  function estimate(act, v) {
    var min = Number(v.min) || 0;
    var known = [];
    var met = act.met, from = 'the ' + act.name.toLowerCase() + ' average';

    known.push({ k: 'Your body weight', on: BODY_KG > 0 });
    known.push({ k: 'Duration', on: min > 0 });

    var km = Number(v.dist) || 0;
    var paceMet = null;
    if (act.speed && km > 0 && min > 0) {
      paceMet = metForSpeed(act.speed, km / (min / 60));
      if (paceMet) { met = paceMet; from = 'your actual pace'; }
    }
    known.push({ k: 'Distance', on: km > 0 });

    var eff = v.effort;
    if (!paceMet && eff && EFFORT_K[eff]) { met = met * EFFORT_K[eff]; from = 'the average, adjusted for ' + eff.toLowerCase(); }
    known.push({ k: 'How hard it felt', on: !!eff });

    var hr = Number(v.hr) || 0;
    known.push({ k: 'Heart rate', on: hr > 0 });

    var score = known.filter(function (x) { return x.on; }).length;
    /* The band: five knowns is still an estimate, so it never closes below
       eight per cent either side. */
    var spread = [0.30, 0.30, 0.22, 0.16, 0.12, 0.08][score];
    var gross = met * 3.5 * BODY_KG / 200 * min;
    var net = Math.max(0, (met - 1) * 3.5 * BODY_KG / 200 * min);

    var tier = met < 3 ? 'Light' : met < 6 ? 'Moderate' : met < 9 ? 'Vigorous' : 'Hard';
    var conf = score >= 4 ? 'High' : score >= 3 ? 'Fair' : 'Low';

    return {
      kcal: Math.round(gross),
      net: Math.round(net),
      lo: Math.round(gross * (1 - spread)),
      hi: Math.round(gross * (1 + spread)),
      met: Math.round(met * 10) / 10,
      from: from,
      tier: tier,
      conf: conf,
      score: score,
      known: known
    };
  }

  /* Counted from the catalogue and the history. It was { total: 227,
     logged: 46 } -- neither figure appears anywhere else in the app, and the
     library screen the row leads to says 867. */
  var LIBRARY = (window.LKFixtures && LKFixtures.library)
    ? { total: LKFixtures.library.total, logged: LKFixtures.library.logged }
    : { total: 0, logged: 0 };

  /* =============================================================
     State
     ============================================================= */
  var S = {
    state: 'populated',   /* populated | empty | loading | error */
    view: 'hub',          /* hub | history */
    filter: 'all',        /* all | lift | cardio */
    sheet: null,          /* null | {kind:'split'|'activity'|'favs'|'newcardio'} */
    query: '',
    toast: null,
    /* The cardio log in progress. `v` is the form, `done` the record once it
       has been written, so the sheet can show what was logged rather than
       closing on a toast. */
    logging: null,
    logError: null,
    open: null,           /* id of the expanded cardio row in history */
    confirmFav: null      /* favourite id awaiting its second tap to delete */
  };

  /* =============================================================
     Pieces
     ============================================================= */

  /* ONE history row, both kinds of session. Taken from Cardio's row,
     which the design audit judged the better of the two: an icon, the
     name, one muted metric line, a right-aligned relative date, a
     chevron into the session. The duration appears once and nothing
     here is wrapped in an accent pill. */
  function historyRow(w) {
    /* Only the parts that exist. A cardio record logged by hand has minutes
       and nothing else -- no watch measured a distance -- and the fixed
       three-part line printed "undefined km, undefined cal" for it. An
       absent figure is absent, not zero and not a word. */
    var parts = w.kind === 'lift'
      ? [n(w.min) + ' min', n(w.sets) + ' sets', n(LKUnits.fmtTotal(w.kg))]
      : [n(w.min) + ' min',
         w.km != null ? n(w.km) + ' km' : null,
         w.cal != null ? n(w.cal) + ' kcal' : null];
    var meta = parts.filter(Boolean).join(' &middot; ');
    /* The date sits on the title line, not beside the metrics: at 393px
       a lifting metric line plus a date wrapped to two lines. */
    return '' +
      '<button class="row" type="button" data-action="open-session" data-id="' + w.id + '" ' +
              'data-testid="history-' + w.id + '">' +
        '<span class="ico-well">' + (w.kind === 'lift' ? ICO.lift : ICO.cardio) + '</span>' +
        '<span class="row__main stack">' +
          '<span class="spread">' +
            '<span class="row__title truncate">' + w.name + '</span>' +
            '<span class="t-meta num nowrap">' + relDate(w.date) + '</span>' +
          '</span>' +
          '<span class="row__sub">' + meta + '</span>' +
        '</span>' +
        '<span class="row__chev">' + ICO.chev + '</span>' +
      '</button>';
  }

  function splitRow(sp) {
    var names = sp.days.map(function (d) { return d.name; }).join(', ');
    return '' +
      '<button class="row" type="button" data-action="open-split" data-id="' + sp.id + '" ' +
              'data-testid="split-' + sp.id + '">' +
        '<span class="ico-well">' + ICO.split + '</span>' +
        '<span class="row__main stack">' +
          '<span class="row__title">' + esc(sp.name) +
            (sp.current ? ' <span class="badge badge--accent">Current</span>' : '') + '</span>' +
          '<span class="row__sub truncate">' + n(sp.days.length) + ' days &middot; ' + esc(names) + '</span>' +
        '</span>' +
        '<span class="row__chev">' + ICO.chev + '</span>' +
      '</button>';
  }

  /* MINUTES PER WEEK, kept as the Cardio audit found it: eight bars,
     tabular labels, a dated axis, one bar standing out. The standout
     is --text, not the accent: the accent is on Start. An empty week
     still draws a stub, so nothing on this chart is invisible. */
  function weekChart() {
    var W = 329, H = 128, padL = 30, padR = 4, padT = 20, padB = 22;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var top = 60;
    var slot = plotW / WEEKS.length;
    var barW = slot * 0.56;
    var out = [];

    [0, top].forEach(function (t) {
      var y = padT + plotH - (t / top) * plotH;
      out.push('<line class="chart__grid" x1="' + padL + '" y1="' + y.toFixed(1) +
               '" x2="' + (padL + plotW) + '" y2="' + y.toFixed(1) + '"/>');
      out.push('<text class="chart__axis" x="' + (padL - 6) + '" y="' + (y + 4).toFixed(1) +
               '" text-anchor="end">' + t + '</text>');
    });

    WEEKS.forEach(function (w, i) {
      var cx = padL + slot * i + slot / 2;
      var h = w.min > 0 ? Math.max(2, (w.min / top) * plotH) : 2;
      var y = padT + plotH - h;
      out.push('<rect class="chart__bar' + (w.now ? ' chart__bar--now' : '') +
               '" x="' + (cx - barW / 2).toFixed(1) + '" y="' + y.toFixed(1) +
               '" width="' + barW.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2"/>');
      /* Label every other bucket, ending on the current week: the
         brightest bar must be the one that is named. */
      if (i % 2 === 1) {
        out.push('<text class="chart__axis" x="' + cx.toFixed(1) + '" y="' + (H - 6) +
                 '" text-anchor="middle">' + absDate(w.start) + '</text>');
      }
    });

    var peak = WEEKS[4];
    var px = padL + slot * 4 + slot / 2;
    var py = padT + plotH - (peak.min / top) * plotH - 6;
    out.push('<text class="chart__value" x="' + px.toFixed(1) + '" y="' + py.toFixed(1) +
             '" text-anchor="middle">' + peak.min + '</text>');

    var read = 'Minutes of cardio per week, eight weeks. ' + WEEKS.map(function (w) {
      return 'week of ' + absDate(w.start) + ', ' + w.min + ' minutes';
    }).join('; ') + '.';

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + read + '">' +
           out.join('') + '</svg>';
  }

  /* TODAY, not the wall clock. Every date on this screen is measured against
     the fixture, so a log stamped with the real date read "last -1 days ago"
     the moment the two disagreed. */
  function todayISO() { return TODAY; }

  /* =============================================================
     Cardio: favourites, the form, the write.
     ============================================================= */

  /* The quick rows. A favourite is a SAVED SETUP -- an activity, a duration
     and whatever else was filled in last time -- so tapping it opens the form
     already answered rather than at the catalogue default. Under the stored
     favourites sit the other modalities this person has actually done
     recently, which is what makes the top of the block a ranking rather than
     a second catalogue. */
  function favRows() {
    var out = FAVS.map(function (f) {
      var act = findCardio(f.act) || { name: f.name, min: f.min };
      return { key: 'fav:' + f.id, id: f.act, fav: f, name: f.name || act.name,
               min: f.min || act.min, note: 'Saved setup', last: f.last };
    });
    var seen = {};
    out.forEach(function (r) { seen[r.id] = 1; });
    /* Recently done, newest first, up to three rows in total. */
    for (var i = 0; i < HISTORY.length && out.length < 3; i++) {
      var w = HISTORY[i];
      if (w.kind !== 'cardio') continue;
      var act = (w.act && findCardio(w.act)) || byName(w.name);
      if (!act || seen[act.id]) continue;
      seen[act.id] = 1;
      out.push({ key: 'recent:' + act.id, id: act.id, name: act.name, min: w.min || act.min, last: w.date });
    }
    return out;
  }
  function byName(name) {
    var all = allActivities();
    var flat = String(name || '').replace(/&middot;/g, '').trim().toLowerCase();
    for (var i = 0; i < all.length; i++) if (all[i].name.toLowerCase() === flat) return all[i];
    return null;
  }
  function lastCardioFor(id) {
    for (var i = 0; i < HISTORY.length; i++) {
      var w = HISTORY[i];
      if (w.kind === 'cardio' && ((w.act && w.act === id) || (byName(w.name) || {}).id === id)) return w;
    }
    return null;
  }

  /* THIS WEEK, from the history rather than from a constant. Three figures
     a reader can check against the list below them. */
  function weekStats() {
    var wk = WEEKS[WEEKS.length - 1];
    return { n: wk.n, min: wk.min, cal: wk.cal };
  }

  /* Personal bests, computed from every cardio session on this device.
     Only over what was actually recorded: a session with no distance cannot
     win "furthest", and a stat nothing can win is not shown at all. */
  function cardioBests() {
    var best = {};
    HISTORY.forEach(function (w) {
      if (w.kind !== 'cardio') return;
      function keep(k, val, label) {
        if (val === null || val === undefined || isNaN(val)) return;
        if (!best[k] || val > best[k].v) best[k] = { v: val, label: label, w: w };
      }
      function keepLow(k, val, label) {
        if (val === null || val === undefined || isNaN(val)) return;
        if (!best[k] || val < best[k].v) best[k] = { v: val, label: label, w: w };
      }
      keep('far', w.km, 'Furthest');
      keep('long', w.min, 'Longest');
      keep('burn', w.cal, 'Biggest burn');
      keep('watts', w.watts, 'Most power');
      if (w.km > 0 && w.min > 0) {
        keepLow('pace', w.min / w.km, 'Best pace');
        keep('speed', w.km / (w.min / 60), 'Fastest');
      }
    });
    return best;
  }
  function paceStr(minPerKm) {
    var m = Math.floor(minPerKm), s = Math.round((minPerKm - m) * 60);
    if (s === 60) { m += 1; s = 0; }
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function bestsStrip() {
    var b = cardioBests();
    var tiles = [];
    function tile(k, value, sub) {
      if (!b[k]) return;
      tiles.push('<div class="stat" data-testid="best-' + k + '"><span class="stat__label">' + b[k].label + '</span>' +
        '<span class="stat__value">' + value + '</span>' +
        '<span class="t-detail">' + esc(sub) + '</span></div>');
    }
    tile('far', n(b.far ? b.far.v : 0) + '<span class="stat__unit"> km</span>',
         b.far ? b.far.w.name.replace(/&middot;/g, '·') + ', ' + absDate(b.far.w.date) : '');
    if (b.pace) tile('pace', n(paceStr(b.pace.v)) + '<span class="stat__unit"> /km</span>',
         b.pace.w.name + ', ' + absDate(b.pace.w.date));
    tile('long', n(b.long ? b.long.v : 0) + '<span class="stat__unit"> min</span>',
         b.long ? b.long.w.name + ', ' + absDate(b.long.w.date) : '');
    tile('burn', n(b.burn ? b.burn.v : 0) + '<span class="stat__unit"> kcal</span>',
         b.burn ? b.burn.w.name + ', ' + absDate(b.burn.w.date) : '');
    if (b.watts) tile('watts', n(b.watts.v) + '<span class="stat__unit"> W</span>',
         b.watts.w.name + ', ' + absDate(b.watts.w.date));
    if (!tiles.length) return '';
    return '<div class="card mt-3" data-testid="cardio-bests">' +
      '<div class="spread"><span class="t-label">Your bests</span>' +
      '<span class="t-meta">From what was recorded</span></div>' +
      '<div class="facts mt-3">' + tiles.join('') + '</div>' +
      /* TIME IN ZONE, honestly. No session on this device carries a heart
         rate, and a zone chart drawn without one would be a picture of
         nothing. The form asks for average heart rate; once one is entered
         this says which zone it fell in. */
      timeInZone() +
    '</div>';
  }

  var ZONES = [[0.50, 0.60, 'Z1 Recovery'], [0.60, 0.70, 'Z2 Easy'], [0.70, 0.80, 'Z3 Steady'],
               [0.80, 0.90, 'Z4 Hard'], [0.90, 1.01, 'Z5 Max']];
  function maxHR() { var prof = rd('lk_profile', {}, false) || {}; return 220 - (Number(prof.age) || 30); }
  function timeInZone() {
    var mx = maxHR(), rows = ZONES.map(function (z) { return { name: z[2], min: 0 }; });
    var total = 0;
    HISTORY.forEach(function (w) {
      if (w.kind !== 'cardio' || !(w.hr > 0)) return;
      var pct = w.hr / mx;
      for (var i = 0; i < ZONES.length; i++) {
        if (pct >= ZONES[i][0] && pct < ZONES[i][1]) { rows[i].min += w.min || 0; total += w.min || 0; }
      }
    });
    if (!total) {
      return '<p class="t-caption-1 quiet mt-3" data-testid="zone-empty">Time in zone needs a heart rate. ' +
        'No cardio session on this phone carries one. Type an average heart rate when you log and it lands in a zone here, ' +
        'against a maximum of ' + mx + ' bpm from your age.</p>';
    }
    return '<div class="mt-3" data-testid="zone-card"><span class="t-label">Time in zone</span>' +
      rows.filter(function (r) { return r.min; }).map(function (r) {
        return '<div class="spread mt-2"><span class="t-detail">' + r.name + '</span>' +
          '<span class="t-meta num">' + r.min + ' min</span></div>' +
          '<div class="meter"><span class="meter__fill" style="width:' +
          Math.round(r.min / total * 100) + '%"></span></div>';
      }).join('') + '</div>';
  }

  /* The write. A logged session is a full record in lk_history through
     LKStore: it survives the reload, it moves the chart, the week row and
     the history list, and it carries a calorie figure, which it never did.
     Everything the form did not ask for is absent from the record rather
     than stored as zero. */
  function saveCardio() {
    var l = S.logging;
    if (!l) return;
    var act = findCardio(l.id) || { name: l.name, met: 6, f: [] };
    var min = Number(l.v.min);
    if (isNaN(min) || min < 1 || min > 600) {
      S.logError = 'Between 1 and 600 minutes.';
      render();
      focusField('cardio-min');
      return;
    }
    var est = estimate(act, l.v);
    var rec = {
      id: 'w' + Date.now(), kind: 'cardio', act: act.id, name: act.name,
      date: todayISO(), dateISO: todayISO(), min: min,
      cal: est.kcal, calNet: est.net, calRange: [est.lo, est.hi],
      calTier: est.tier, calConf: est.conf, sets: 0, vol: 0, exercises: []
    };
    (act.f || []).forEach(function (k) {
      var val = l.v[k];
      if (val === undefined || val === null || val === '') return;
      if (FIELD[k].type === 'choice') rec[k === 'effort' ? 'effort' : k] = val;
      else rec[k === 'dist' ? 'km' : k] = Number(val);
    });
    if (l.v.note && l.v.note.trim()) rec.note = l.v.note.trim();

    var hist = rd('lk_history', [], false) || [];
    hist.unshift(rec);
    if (store()) store().set('lk_history', hist);
    loadHistory(false);
    loadWeeks();
    S.logging = { id: l.id, name: act.name, v: l.v, done: rec, est: est };
    S.logError = null;
    render();
  }

  /* "Save this setup" — F-CARDIO-021. A favourite is what was just logged,
     minus the date: the activity and every answer, so the next one is one
     tap and already right. */
  function saveFavourite() {
    var l = S.logging;
    if (!l || !l.done) return;
    var fav = { id: 'fav_' + Date.now(), act: l.id, name: l.done.name,
                min: l.done.min, v: l.v, last: todayISO() };
    FAVS = (rd('lk_cardioFavorites', [], false) || []).slice();
    FAVS.unshift(fav);
    if (store()) store().set('lk_cardioFavorites', FAVS);
    say(esc(fav.name) + ' saved to your favourites.');
  }

  function field(k, v, act) {
    var f = FIELD[k];
    if (!f) return '';
    var id = 'cf-' + k;
    if (f.type === 'choice') {
      return '<div class="section" style="padding:0">' +
        '<span class="t-label">' + f.label + '</span>' +
        '<div class="chiprow mt-2">' + f.opts.map(function (o) {
          return '<button class="chip" type="button" data-action="cf-choice" data-k="' + k + '" data-v="' + esc(o) + '" ' +
            'aria-pressed="' + (v === o) + '" data-testid="cf-' + k + '-' + o.toLowerCase().replace(/\W+/g, '-') + '">' +
            esc(o) + '</button>';
        }).join('') + '</div></div>';
    }
    var unit = f.type === 'weight' ? LKUnits.label() : f.unit;
    var shown = f.type === 'weight' && v !== '' && v !== undefined ? LKUnits.v(Number(v)) : v;
    return '<label class="field mt-3"><span class="field__label t-label">' + f.label +
      (unit ? ' <span class="quiet">(' + unit + ')</span>' : '') + '</span>' +
      '<input class="input num" id="' + id + '" type="number" inputmode="decimal" ' +
        'step="' + f.step + '" min="' + (f.min || 0) + '" max="' + f.max + '" ' +
        'value="' + (shown === undefined || shown === null ? '' : esc(shown)) + '" ' +
        'data-action="cf-num" data-k="' + k + '" data-testid="cf-' + k + '"></label>';
  }

  var DUR_CHIPS = [10, 15, 20, 30, 45, 60];

  /* The live estimate. A count-up would be motion for its own sake on a
     figure that changes as you type, so the number is simply current, the
     band under it says how wide the estimate is, and the five bars say what
     it is standing on. */
  function estimateCard(act, v) {
    var est = estimate(act, v);
    var bars = est.known.map(function (k, i) {
      return '<span class="strength__seg' + (k.on ? ' strength__seg--good' : '') + '" ' +
        'data-testid="qbar-' + i + '"></span>';
    }).join('');
    var missing = est.known.filter(function (k) { return !k.on; }).map(function (k) { return k.k.toLowerCase(); });
    return '<div class="card card--sunken mt-4" data-testid="cardio-estimate">' +
      '<div class="spread"><span class="t-label">Estimated burn</span>' +
        '<span class="badge badge--est" data-testid="cardio-conf">' + est.conf + ' confidence</span></div>' +
      '<div class="spread mt-2">' +
        '<span class="t-title num" data-testid="cardio-kcal">' + group(est.kcal) + ' kcal</span>' +
        '<span class="t-meta num" data-testid="cardio-range">' + group(est.lo) + ' to ' + group(est.hi) + '</span>' +
      '</div>' +
      '<div class="strength__scale mt-2" role="img" aria-label="' + est.score +
        ' of 5 inputs known">' + bars + '</div>' +
      '<p class="t-caption-1 quiet mt-2" data-testid="cardio-basis">' +
        est.tier + ' effort, ' + est.met + ' MET from ' + esc(est.from) + ', at ' +
        LKUnits.fmt(BODY_KG, 1) + ' body weight. ' +
        'Net of simply being alive for ' + (Number(v.min) || 0) + ' minutes: ' + group(est.net) + ' kcal. ' +
        'Estimated on this phone, not measured' +
        (missing.length ? '; it would tighten with ' + esc(missing.join(' and ')) : '') + '.</p>' +
    '</div>';
  }

  function cardioSheet() {
    var l = S.logging;
    if (!l) return '';
    var act = findCardio(l.id) || { name: l.name, met: 6, f: [], min: 30 };
    if (l.done) return loggedSheet(l, act);
    var v = l.v;
    var body = '' +
      '<span class="t-label">Minutes</span>' +
      '<div class="chiprow mt-2">' + DUR_CHIPS.map(function (d) {
        return '<button class="chip" type="button" data-action="cf-min" data-v="' + d + '" ' +
          'aria-pressed="' + (Number(v.min) === d) + '" data-testid="cf-min-' + d + '">' + d + '</button>';
      }).join('') + '</div>' +
      '<input class="input num mt-2" id="cardio-min" type="number" min="1" max="600" step="1" ' +
        'inputmode="numeric" value="' + esc(v.min) + '" aria-label="Minutes" ' +
        'data-action="cf-num" data-k="min" data-testid="cardio-min">' +
      (S.logError ? '<p class="field__error" role="alert" data-testid="cardio-error">' + esc(S.logError) + '</p>' : '') +
      (act.f || []).map(function (k) { return field(k, v[k], act); }).join('') +
      '<label class="field mt-3"><span class="field__label t-label">Notes</span>' +
        '<textarea class="input" rows="2" data-action="cf-note" data-testid="cf-note" ' +
        'placeholder="Anything worth remembering">' + esc(v.note || '') + '</textarea></label>' +
      estimateCard(act, v);

    return '<div class="scrim" data-action="cardio-cancel" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cd-title" data-testid="cardio-sheet" ' +
        'data-detents="0.6 0.94" data-detent-open="0.94">' +
        '<div class="sheet__head"><h2 class="t-section grow" id="cd-title">' + esc(act.name) + '</h2>' +
          '<button class="iconbtn" type="button" data-action="cardio-cancel" aria-label="Cancel" ' +
            'data-testid="cardio-close">' + ICO.close + '</button></div>' +
        '<div class="sheet__body">' + body + '</div>' +
        '<div class="sheet__foot">' +
          '<button class="btn btn--primary btn--block" type="button" data-action="cardio-save" ' +
            'data-testid="cardio-save"><span class="btn__label">Log it</span></button>' +
        '</div>' +
      '</div>';
  }

  /* What was written, in the record's own words. It replaces the toast that
     was the whole of the old confirmation. */
  function loggedSheet(l, act) {
    var w = l.done, est = l.est;
    var rows = [];
    function add(label, val) { if (val !== undefined && val !== null && val !== '') rows.push([label, val]); }
    add('Duration', w.min + ' min');
    add('Distance', w.km != null ? w.km + ' km' : null);
    if (w.km > 0 && w.min > 0) {
      add('Pace', paceStr(w.min / w.km) + ' /km');
      add('Speed', (Math.round(w.km / (w.min / 60) * 10) / 10) + ' km/h');
      if (act.id === 'row' || act.id === 'waterrow') add('Split', paceStr(w.min / (w.km * 2)) + ' /500 m');
    }
    add('Average power', w.watts != null ? w.watts + ' W' : null);
    add('Heart rate', w.hr != null ? w.hr + ' bpm' : null);
    add('Effort', w.effort);
    add('Surface', w.surface);
    add('Riding position', w.position);
    add('Gross burn', group(w.cal) + ' kcal');
    add('Net burn', group(w.calNet) + ' kcal');
    return '<div class="scrim" data-action="cardio-cancel" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cd-title" data-testid="cardio-logged">' +
        '<div class="sheet__head"><h2 class="t-section grow" id="cd-title">Logged &middot; ' + esc(w.name) + '</h2>' +
          '<button class="iconbtn" type="button" data-action="cardio-cancel" aria-label="Close" ' +
            'data-testid="cardio-close">' + ICO.close + '</button></div>' +
        '<div class="sheet__body">' +
          '<p class="t-detail">Saved to your history on this phone. Nothing has left this device.</p>' +
          '<div class="card card--flush mt-3">' + rows.map(function (r) {
            return '<div class="row row--static"><span class="row__main"><span class="row__title">' + r[0] +
              '</span></span><span class="row__value num">' + r[1] + '</span></div>';
          }).join('') + '</div>' +
          '<p class="t-caption-1 quiet mt-3">The burn is an estimate at ' + est.conf.toLowerCase() +
            ' confidence, between ' + group(est.lo) + ' and ' + group(est.hi) + ' kcal. Nothing measured it.</p>' +
        '</div>' +
        '<div class="sheet__foot">' +
          '<button class="btn btn--secondary btn--block" type="button" data-action="cardio-fav" ' +
            'data-testid="cardio-fav">' + ICO.star + '<span class="btn__label">Save this setup</span></button>' +
          '<button class="btn btn--primary btn--block mt-2" type="button" data-action="cardio-cancel" ' +
            'data-testid="cardio-done"><span class="btn__label">Done</span></button>' +
        '</div>' +
      '</div>';
  }

  function cardioBlock() {
    /* The last four weeks INCLUDING this one. It was the four before this
       one, so anything logged today landed in a week the figure did not
       count and the total never moved. */
    var last4 = WEEKS.slice(-4).reduce(function (a, w) { return a + w.min; }, 0);
    var wk = weekStats();
    var rows = favRows().map(function (c) {
      return '' +
        '<button class="row" type="button" data-action="log-cardio" data-id="' + c.id + '" ' +
                (c.fav ? 'data-fav="' + c.fav.id + '" ' : '') +
                'data-testid="log-' + c.key.replace(/[^\w]/g, '-') + '" ' +
                'aria-label="Log ' + esc(c.name) + ', ' + c.min + ' minutes">' +
          '<span class="ico-well">' + (c.fav ? ICO.star : ICO.cardio) + '</span>' +
          '<span class="row__main stack">' +
            '<span class="row__title">' + esc(c.name) + '</span>' +
            '<span class="row__sub">' + n(c.min) + ' min' +
              (c.note ? ' &middot; ' + esc(c.note) : '') +
              (c.last ? ' &middot; last ' + relDate(c.last) : '') + '</span>' +
          '</span>' +
          '<span class="row__chev">' + ICO.plus + '</span>' +
        '</button>';
    }).join('');

    return '' +
      '<section class="section" data-testid="section-cardio">' +
        '<div class="section__head"><h2 class="t-label">Cardio</h2>' +
          '<button class="btn btn--tertiary btn--sm" type="button" data-action="open-favs" data-testid="open-favs">' +
            '<span class="btn__label">Favourites</span></button>' +
        '</div>' +
        /* THIS WEEK, three figures from the same history the list below is
           drawn from. The block used to open on an eight-week chart and say
           nothing at all about the week you are in. */
        '<div class="card" data-testid="cardio-week">' +
          '<div class="facts">' +
            '<div class="stat"><span class="stat__label">This week</span>' +
              '<span class="stat__value">' + n(wk.n) + '</span>' +
              '<span class="t-detail">' + (wk.n === 1 ? 'session' : 'sessions') + '</span></div>' +
            '<div class="stat"><span class="stat__label">Minutes</span>' +
              '<span class="stat__value">' + n(wk.min) + '</span>' +
              '<span class="t-detail">this week</span></div>' +
            '<div class="stat"><span class="stat__label">Calories</span>' +
              '<span class="stat__value">' + n(group(wk.cal)) + '</span>' +
              '<span class="t-detail">estimated</span></div>' +
          '</div>' +
          '<div class="spread mt-4">' +
            '<span class="t-label">Minutes per week</span>' +
            '<span class="t-meta num">' + last4 + ' min in 4 weeks</span>' +
          '</div>' +
          '<div class="mt-3">' + weekChart() + '</div>' +
        '</div>' +
        bestsStrip() +
        '<div class="card card--flush mt-3">' +
          rows +
          '<button class="row" type="button" data-action="open-activities" data-testid="open-activities">' +
            '<span class="ico-well">' + ICO.search + '</span>' +
            '<span class="row__main stack">' +
              '<span class="row__title">Log something else</span>' +
              '<span class="row__sub">' + n(catCount()) + ' activities, searchable</span>' +
            '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
        '</div>' +
      '</section>';
  }

  /* =============================================================
     Views
     ============================================================= */
  var VIEWS = {};

  VIEWS.populated = function () {
    var sp = SPLITS[0];
    var day = sp.days[0];
    var recent = HISTORY.slice(0, 5);

    return '' +
      /* The one thing a lifter opens this tab to do, in the first fold
         and one tap deep. The audited hub spent its only accent fill on
         a Quick Start that began an empty workout. */
      '<section class="card card--raised mt-4 enter-rise" data-testid="card-today">' +
        '<div class="t-label">Today &middot; ' + esc(sp.name) + '</div>' +
        '<h2 class="t-title mt-2">' + esc(day.name) + '</h2>' +
        '<p class="t-detail mt-2">' + n(day.exercises) + ' exercises &middot; about ' +
          n(day.minutes) + ' min &middot; last done ' + relDate('2026-09-03') + '</p>' +
        '<button class="btn btn--primary btn--block mt-4" type="button" data-action="start-today" data-testid="start-today">' +
          ICO.play + '<span class="btn__label">Start ' + esc(day.name) + '</span>' +
        '</button>' +
      '</section>' +

      '<section class="section" data-testid="section-splits">' +
        '<div class="section__head">' +
          '<h2 class="t-label">Your splits</h2>' +
          '<button class="btn btn--tertiary btn--sm" type="button" data-action="new-split" data-testid="new-split">' +
            ICO.plus + '<span class="btn__label">New</span></button>' +
        '</div>' +
        '<div class="card card--flush">' + SPLITS.map(splitRow).join('') + '</div>' +
      '</section>' +

      cardioBlock() +

      '<section class="section" data-testid="section-history">' +
        '<div class="section__head">' +
          '<h2 class="t-label">History</h2>' +
          '<button class="btn btn--tertiary btn--sm" type="button" data-action="open-history" data-testid="open-history">' +
            '<span class="btn__label">All ' + n(HISTORY.length) + '</span></button>' +
        '</div>' +
        '<div class="card card--flush">' + recent.map(historyRow).join('') + '</div>' +
      '</section>' +

      '<section class="section" data-testid="section-library">' +
        '<div class="section__head"><h2 class="t-label">Reference</h2></div>' +
        '<div class="card card--flush">' +
          '<button class="row" type="button" data-action="open-library" data-testid="open-library">' +
            '<span class="ico-well">' + ICO.book + '</span>' +
            '<span class="row__main stack">' +
              '<span class="row__title">Exercise library</span>' +
              '<span class="row__sub">' + n(LIBRARY.logged) + ' of ' + n(LIBRARY.total) + ' logged</span>' +
            '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
        '</div>' +
      '</section>';
  };

  /* Nothing has been earned yet, so nothing is claimed and nothing
     competes: one sentence, one action. The audited empty state
     offered two. */
  VIEWS.empty = function () {
    return '' +
      '<div class="empty mt-5 enter-settle" data-testid="train-empty">' +
        '<span class="empty__ico">' + ICO.plan + '</span>' +
        '<h2 class="empty__title">No splits yet</h2>' +
        '<p class="empty__body">A split is the week you intend to train. Build one and each day of it starts from this screen.</p>' +
        '<button class="btn btn--primary" type="button" data-action="new-split" data-testid="empty-build-split">' +
          '<span class="btn__label">Build a split</span>' +
        '</button>' +
      '</div>';
  };

  VIEWS.loading = function () {
    return '' +
      '<div class="card card--raised mt-4" role="status" aria-busy="true" aria-label="Loading your training" data-testid="train-loading">' +
        '<div class="skel" style="height: var(--sp-3); width: 30%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-5); width: 45%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-4); width: 75%"></div>' +
        '<div class="skel mt-4" style="height: var(--tap)"></div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="skel" style="height: var(--sp-3); width: 28%"></div>' +
        '<div class="skel mt-3" style="height: calc(var(--tap) * 3)"></div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="skel" style="height: var(--sp-3); width: 22%"></div>' +
        '<div class="skel mt-3" style="height: calc(var(--tap) * 3)"></div>' +
      '</div>';
  };

  /* What happened, what it means for the data on screen, and the one
     thing that fixes it. */
  VIEWS.error = function () {
    return '' +
      '<div class="card mt-4" data-testid="train-error">' +
        '<div class="banner banner--error" role="alert">' +
          ICO.alert +
          '<span><strong>Training did not load</strong>Your last sync failed, so your splits and any session logged after ' +
            'Sep 3 are missing here. Nothing was lost on this phone.</span>' +
        '</div>' +
        '<button class="btn btn--primary btn--block mt-4" type="button" data-action="retry" data-testid="retry">' +
          '<span class="btn__label">Try again</span>' +
        '</button>' +
        '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="use-cached" data-testid="use-cached">' +
          '<span class="btn__label">Use what is on this phone</span>' +
        '</button>' +
      '</div>';
  };

  /* The full record, one level deep. The app's ONE segmented control
     is spent here, on the only filter that removes work: two kinds of
     session in one list. Same row component as the preview above. */
  function historyView() {
    var list = HISTORY.filter(function (w) {
      return S.filter === 'all' || w.kind === S.filter;
    });
    var out = [], month = null, buf = [];
    function flush() {
      if (!buf.length) return;
      out.push(
        '<section class="section">' +
          '<div class="section__head"><h2 class="t-label">' + month + '</h2>' +
            '<span class="t-meta num">' + buf.length + (buf.length === 1 ? ' session' : ' sessions') + '</span></div>' +
          '<div class="card card--flush">' + buf.join('') + '</div>' +
        '</section>');
      buf = [];
    }
    list.forEach(function (w) {
      var m = monthOf(w.date);
      if (m !== month) { flush(); month = m; }
      buf.push(historyRow(w));
    });
    flush();

    var FILTERS = [['all', 'All'], ['lift', 'Lifting'], ['cardio', 'Cardio']];
    return '' +
      '<div class="section" style="margin-top: var(--sp-3)">' +
        '<div class="seg seg--lg" role="radiogroup" aria-label="Session type" data-testid="history-filter">' +
          FILTERS.map(function (f) {
            return '<button class="seg__item" type="button" role="radio" aria-checked="' + (S.filter === f[0]) +
              '" data-action="filter" data-filter="' + f[0] + '" data-testid="filter-' + f[0] + '">' +
              f[1] + '</button>';
          }).join('') +
        '</div>' +
      '</div>' +
      (list.length ? out.join('') :
        '<div class="empty mt-5" data-testid="history-empty-filter">' +
          '<span class="empty__ico">' + ICO.plan + '</span>' +
          '<h2 class="empty__title">No cardio yet</h2>' +
          '<p class="empty__body">Cardio you log on the Train screen appears here beside your lifting.</p>' +
        '</div>');
  }

  /* =============================================================
     Header. Back is labelled with its origin, as iOS labels it.
     ============================================================= */
  function headerHTML() {
    if (S.view === 'history') {
      return '' +
        '<button class="hdr__back" type="button" data-action="back" data-testid="history-back" aria-label="Back to Train">' +
          ICO.back + '</button>' +
        '<div class="hdr__title stack stack--1">' +
          '<span class="t-meta">TRAIN</span>' +
          '<h1 class="t-title">History</h1>' +
        '</div>';
    }
    /* Tab-level, so it carries the large title. A pushed sub-view above keeps
       a 17px one: a screen you arrived at from somewhere else is already the
       collapsed state. */
    return '' +
      '<div class="hdr__title stack stack--1">' +
        '<span class="t-meta">TRAINING</span>' +
        '<h1 class="hdr__title-large" data-title-large>Train</h1>' +
      '</div>' +
      '<span class="hdr__title-small" data-title-small aria-hidden="true">Train</span>';
  }

  /* =============================================================
     Sheets. A split's sheet is where a monthly action lives: start
     any day of it, or edit it. Delete is not here — it belongs in
     the editor that owns the split, behind its own confirmation.
     ============================================================= */
  function splitSheet(sp) {
    var days = sp.days.map(function (d) {
      return '' +
        '<button class="row" type="button" data-action="start-day" data-id="' + sp.id + ':' + d.id + '" ' +
                'data-testid="start-day-' + d.id + '" aria-label="Start ' + esc(d.name) + '">' +
          '<span class="ico-well">' + ICO.lift + '</span>' +
          '<span class="row__main stack">' +
            '<span class="row__title">' + esc(d.name) +
              (d.next ? ' <span class="badge badge--accent">Next</span>' : '') + '</span>' +
            '<span class="row__sub">' + n(d.exercises) + ' exercises &middot; about ' + n(d.minutes) + ' min</span>' +
          '</span>' +
          '<span class="row__chev">' + ICO.play + '</span>' +
        '</button>';
    }).join('');

    return '' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-testid="split-sheet">' +
        '<div class="sheet__grab"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-section" id="sheet-title">' + esc(sp.name) + '</h2>' +
          '<button class="iconbtn" type="button" data-action="close-sheet" data-testid="sheet-close" aria-label="Close split">' +
            ICO.close + '</button>' +
        '</div>' +
        '<div class="sheet__body">' +
          /* COUNTED, and DATED. This line read "3 days, 15 exercises, edited
             undefined NaN": the count was days.length * 5, which is true of
             PPL and of no other split stored here, and the date was an ISO
             parse of "7/25/2026". Both come off the split itself now. */
          '<p class="t-detail" data-testid="split-summary">' + n(sp.days.length) +
            (sp.days.length === 1 ? ' day' : ' days') + ' &middot; ' +
            n(sp.exercises) + (sp.exercises === 1 ? ' exercise' : ' exercises') +
            (sp.updated ? ' &middot; edited ' + absDate(sp.updated) : '') + '</p>' +
          '<div class="card card--flush mt-3">' + days + '</div>' +
        '</div>' +
        '<div class="sheet__foot">' +
          '<button class="btn btn--secondary btn--block" type="button" data-action="edit-split" data-id="' + sp.id + '" ' +
                  'data-testid="edit-split">' + ICO.pencil +
            '<span class="btn__label">Edit split</span></button>' +
        '</div>' +
      '</div>';
  }

  /* The 41-tile wall, replaced. What this lifter is likely to log is
     already a row on the screen behind; here the rest of the
     catalogue is a ranked list with search as the reducer. */
  function activitySheet() {
    var q = S.query.trim().toLowerCase();
    var list = CARDIO_ALL.concat(CARDIO_QUICK.map(function (c) {
      return { id: 'p_' + c.id, name: c.name, min: c.min };
    }));
    var shown = q ? list.filter(function (a) { return a.name.toLowerCase().indexOf(q) > -1; })
                  : CARDIO_ALL.slice(0, 6);

    var rows = shown.map(function (a) {
      return '' +
        '<button class="row" type="button" data-action="log-cardio" data-id="' + a.id + '" ' +
                'data-testid="pick-' + a.id + '" aria-label="Log ' + esc(a.name) + ', ' + a.min + ' minutes">' +
          '<span class="ico-well">' + ICO.cardio + '</span>' +
          '<span class="row__main stack">' +
            '<span class="row__title">' + esc(a.name) + '</span>' +
            '<span class="row__sub">' + n(a.min) + ' min by default</span>' +
          '</span>' +
          '<span class="row__chev">' + ICO.plus + '</span>' +
        '</button>';
    }).join('');

    return '' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="act-title" data-testid="activity-sheet">' +
        '<div class="sheet__grab"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-section" id="act-title">Log cardio</h2>' +
          '<button class="iconbtn" type="button" data-action="close-sheet" data-testid="activity-close" aria-label="Close activities">' +
            ICO.close + '</button>' +
        '</div>' +
        '<div class="search">' +
          '<span class="search__ico" aria-hidden="true">' + ICO.search + '</span>' +
          '<label class="vis-hidden" for="act-q">Search activities</label>' +
          '<input class="input" id="act-q" type="text" autocomplete="off" spellcheck="false" ' +
                 'placeholder="Search ' + CARDIO_CATALOGUE + ' activities" value="' + esc(S.query) + '" ' +
                 'data-testid="activity-search">' +
        '</div>' +
        '<div class="sheet__body mt-3">' +
          (shown.length
            ? '<div class="card card--flush">' + rows + '</div>'
            : '<p class="t-detail center mt-4">Nothing matches &ldquo;' + esc(S.query) + '&rdquo;.</p>') +
          '<p class="t-meta mt-3">' + (q ? shown.length + ' of ' + CARDIO_CATALOGUE + ' activities'
                                         : 'Your usual three are on the Train screen. Type to reach any of the ' +
                                           CARDIO_CATALOGUE + '.') + '</p>' +
        '</div>' +
      '</div>';
  }

  function overlayHTML() {
    if (S.logging) return cardioSheet();
    if (!S.sheet) return '';
    var inner = S.sheet.kind === 'split'
      ? splitSheet(SPLITS.filter(function (s) { return s.id === S.sheet.id; })[0])
      : activitySheet();
    return '<div class="scrim" data-action="close-sheet" data-testid="scrim"></div>' + inner;
  }

  function toastHTML() {
    if (!S.toast) return '';
    return '' +
      '<div class="toast" role="status" data-testid="toast">' +
        '<span class="toast__body">' + S.toast + '</span>' +
        '<button class="toast__action" type="button" data-action="undo" data-testid="toast-undo">Undo</button>' +
      '</div>';
  }

  /* =============================================================
     Render
     ============================================================= */
  var screen = document.getElementById('screen');
  var hdr = document.getElementById('hdr');
  var body = document.getElementById('body');
  var overlay = document.getElementById('overlay');
  var toastSlot = document.getElementById('toast-slot');
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  var lastFocus = null;
  var toastTimer = null;

  function render(keepScroll) {
    var top = keepScroll ? body.scrollTop : 0;
    screen.setAttribute('data-state', S.state);
    screen.setAttribute('data-view', S.view);
    /* The large title belongs to the tab-level view only. A pushed sub-view
       has a back chevron and a 17px title, which is the collapsed state
       already, so collapsing it again would be collapsing nothing. */
    var pushed = S.view === 'history';
    hdr.classList.toggle('hdr--large', !pushed);
    if (pushed) hdr.removeAttribute('data-large-title');
    else hdr.setAttribute('data-large-title', '#body');
    LKPatch(hdr, headerHTML());
    if (window.LKChrome) LKChrome.init(document);
    LKPatch(body, (S.view === 'history' && S.state === 'populated')
      ? historyView()
      : (VIEWS[S.state] || VIEWS.populated)());
    body.scrollTop = top;
    LKPatch(overlay, overlayHTML());
    LKPatch(toastSlot, toastHTML());
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.state));
    });
    if (S.sheet) {
      var f = overlay.querySelector('.iconbtn');
      if (f) f.focus();
    }
  }

  function openSheet(sheet) {
    lastFocus = document.activeElement;
    S.sheet = sheet;
    S.query = '';
    render(true);
  }
  function closeSheet() {
    S.sheet = null;
    S.query = '';
    render(true);
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }
  function say(msg) {
    S.toast = msg;
    render(true);
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; render(true); }, 4000);
  }

  /* =============================================================
     Events. Every action is declared on the element, so the whole
     screen is one delegated listener.
     ============================================================= */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var a = t.dataset.action;

    if (a === 'open-split') { openSheet({ kind: 'split', id: t.dataset.id }); return; }
    if (a === 'open-activities') { openSheet({ kind: 'activity' }); return; }
    if (a === 'close-sheet') { closeSheet(); return; }
    if (a === 'open-history') { S.view = 'history'; render(); body.focus(); return; }
    if (a === 'back') { S.view = 'hub'; render(); return; }
    if (a === 'filter') { S.filter = t.dataset.filter; render(true); return; }
    /* Opens the duration sheet rather than logging on the tap. The row
       carries the duration this activity is normally done for, and one tap
       from there logs it -- but "logged 30 minutes" when it was 22 is a
       wrong number in the record, and the shipped app asked. */
    if (a === 'log-cardio') {
      var id = t.getAttribute('data-id');
      var c = findCardio(id);
      if (!c) return;
      S.logging = { id: id, name: c.name, min: c.min };
      if (S.sheet) closeSheet();
      render();
      var f = overlay.querySelector('[data-testid="cardio-min"]');
      if (f) { f.focus(); f.select(); }
      return;
    }
    if (a === 'cardio-cancel') { S.logging = null; render(); return; }
    if (a === 'cardio-save') { saveCardio(); return; }
    if (a === 'undo') { S.toast = null; render(true); return; }
    if (a === 'retry') { S.state = 'loading'; render(); setTimeout(function () { S.state = 'populated'; render(); }, 900); return; }
    if (a === 'use-cached') { S.state = 'populated'; render(); return; }
    /* These leave the screen. They used to toast "Opens the split builder."
       and stay put, which is a sentence that describes what a working button
       would have done. In the demo the router takes them first, by the same
       selectors, and every destination below is declared in MANIFEST.nav. */
    if (a === 'start-today') { location.href = 'workout-log.html'; return; }
    if (a === 'start-day') { closeSheet(); location.href = 'workout-log.html'; return; }
    /* WHICH split. Both of these opened the builder with no idea which split
       was meant, so "Edit split" and "New split" landed on the same thing. */
    if (a === 'edit-split') {
      try { localStorage.setItem('lk_openSplit', t.getAttribute('data-id') || ''); } catch (err) {}
      location.href = 'split-builder.html'; return;
    }
    if (a === 'new-split') {
      try { localStorage.setItem('lk_openSplit', '__new__'); } catch (err) {}
      location.href = 'split-builder.html'; return;
    }
    if (a === 'open-library') { location.href = 'exercise-library.html'; return; }
    if (a === 'open-session') {
      /* WHICH session. Every history row used to open the same hand-written
         workout-detail, so tapping any of the eighteen sessions showed one
         fixed Sep 5 Pull -- with lifts that appear in no session at all. */
      try { localStorage.setItem('lk_openWorkout', t.getAttribute('data-id') || ''); } catch (err) {}
      location.href = 'workout-detail.html';
      return;
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id !== 'act-q') return;
    S.query = e.target.value;
    var holder = overlay.querySelector('.sheet__body');
    if (!holder) return;
    /* Re-render the sheet body only, so the field keeps focus and
       the caret. */
    var tmp = document.createElement('div');
    tmp.innerHTML = activitySheet();
    LKPatch(holder, tmp.querySelector('.sheet__body').innerHTML);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (S.sheet) { closeSheet(); return; }
    if (S.view === 'history') { S.view = 'hub'; render(); }
  });

  /* =============================================================
     Dev state toggle
     ============================================================= */
  var STATES = [
    ['populated', 'Populated'],
    ['empty', 'Empty'],
    ['loading', 'Loading'],
    ['error', 'Error']
  ];
  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" type="button" data-state="' + s[0] + '" aria-pressed="false" ' +
      'data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join(''));
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (!b) return;
    S.state = b.dataset.state;
    S.view = 'hub';
    S.sheet = null;
    S.toast = null;
    render();
  });

  var params = new URLSearchParams(location.search);
  if (params.get('state')) S.state = params.get('state');
  if (params.get('view')) S.view = params.get('view');
  render();
})();

  /* The running workout, from a screen that is not it. Leaving the workout
     log used to lose the session outright: nothing was written down, and no
     screen but Home and Fuel had anywhere to say one was open. The record
     lives in session.js; this mounts its shelf and takes the tap back. */
  if (window.LKSession) {
    LKSession.mount(document.getElementById('shelf-slot'),
      typeof LKPatch === 'function' ? LKPatch : null);
    document.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-testid="shelf-resume"]') : null;
      if (el) { e.preventDefault(); location.href = 'workout-log.html'; }
    });
  }
</script>
</body>
</html>
