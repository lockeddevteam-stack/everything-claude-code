<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOCKED — Body map (concept mockup)</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="app.js"></script>
<script src="vendor/body-art.js"></script>
<script src="bodymap.js"></script>
<style>
/* ---------------------------------------------------------------
   Body map. Concept mockup only — nothing here is production code.
   Every value is a token except the SVG geometry itself, and the
   anatomy palette, which lives in tokens.css as documented data.

   The figure is a physique, not a silhouette with patches on it. It
   is built as a figure artist builds one: an armature of skeletal
   landmarks at bodybuilder proportions, muscle masses placed on it
   as volumes, and an outer contour that is nothing but the union of
   those masses. Every muscle is a separate body with a dark seam
   between it and its neighbour, a lit face, a shaded rim and a
   highlight so each belly reads as a dome, and fibre striations
   following the real fibre direction of the muscle they sit in.

   The twelve groups are LOCKED's own groups, taken from the exercise
   database, so a group tapped on the body lists exactly what that
   group holds. Five of them hold sub-regions and open into them;
   the other seven go straight to their exercises.
   --------------------------------------------------------------- */

.map {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.map[hidden], .rotate[hidden], .findbar[hidden] { display: none; }

/* Stage four keeps the chest on screen above its exercises, so the
   list is visibly the inside of the muscle the lifter just opened. */
.map--strip { flex: none; height: 200px; }

</style>
<style>
/* The opened group's regions. Each is a tint of the parent hue, so the three
   read as one family and the relationship to the group they came from stays
   visible. They fade up in order after the camera settles, so the eye is led
   to them rather than surprised by them. */
.zones { pointer-events: none; }
.map[data-zoom] .zones { pointer-events: auto; }
.zone { cursor: pointer; opacity: 0; }
.map[data-zoom] .zone { opacity: 1; transition: opacity var(--dur-slow) var(--ease); }
.map[data-zoom] .zone { transition-delay: calc(var(--zone-step, 0) * 90ms + 120ms); }
.zone__fill { stroke: color-mix(in srgb, var(--zone-hue, var(--anat-chest)) 22%, #000);
  stroke-width: 1.1; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
/* Four steps of the one hue, lightest at the top, so the regions read in
   anatomical order and as one family. The hue is set on the layer from the
   group that opened, so there is still exactly one palette entry per group. */
.zone:nth-of-type(1) .zone__fill { fill: color-mix(in srgb, var(--zone-hue) 55%, #fff); }
.zone:nth-of-type(2) .zone__fill { fill: color-mix(in srgb, var(--zone-hue) 80%, #fff); }
.zone:nth-of-type(3) .zone__fill { fill: var(--zone-hue); }
.zone:nth-of-type(4) .zone__fill { fill: color-mix(in srgb, var(--zone-hue) 78%, #000); }
.zone:focus, .zone:focus-visible { outline: none; }
.zone:focus-visible .zone__fill { stroke: var(--text); stroke-width: 2.5; }
/* Under an open group the body itself steps back, so the regions are the only
   thing with colour on the screen. */
.map[data-zoom] .mg .mg__gnd { fill: var(--anat-muted);
  stroke: color-mix(in srgb, var(--anat-muted) 22%, #000); }
@media (prefers-reduced-motion: reduce) {
  .map[data-zoom] .zone { transition: none; transition-delay: 0s; }
}
/* Under an open group the inert body steps back so the regions carry the
   screen. The muscles keep their own rule above. */
.map[data-zoom] .sil, .map[data-zoom] .inert { opacity: 0.72; }

/* The label. One at a time, on selection, in the reference's
   convention: a filled disc carrying a line pictogram, the group
   name beside it, and a hairline leader to a dot on the muscle.
   Twelve labels at once would be unreadable at 393px, so the map
   names what the lifter has just chosen and nothing else. */
.lab { opacity: 0; transition: opacity var(--dur-fast) var(--ease); pointer-events: none; }
.map[data-selected]:not([data-zoom]) .lab[data-on] { opacity: 1; transition: opacity var(--dur-slow) var(--ease) 80ms; }
.lab__line { fill: none; stroke: var(--text-tertiary); stroke-width: 1; vector-effect: non-scaling-stroke; }
.lab__dot { fill: var(--text-tertiary); }
.lab__disc { fill: currentColor; }
.lab__ico { fill: none; stroke: var(--bg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.lab__t {
  font-family: inherit;
  font-weight: var(--w-semibold);
  letter-spacing: var(--tr-11);
  fill: var(--text);
  dominant-baseline: middle;
}

/* The three part labels reuse the same convention, so zooming in
   introduces nothing new. */
.map--strip .lab { opacity: 0 !important; }
.zlabs { opacity: 0; transition: opacity var(--dur-slow) var(--ease); }
.map[data-zoom] .zlabs { opacity: 1; transition-delay: var(--dur-slow); }
.zlab__t { font-family: inherit; font-weight: var(--w-semibold); letter-spacing: var(--tr-11); fill: var(--text); dominant-baseline: middle; }
.zlab__n { fill: var(--text-tertiary); font-weight: var(--w-medium); }

/* The rotate control. Two 44px targets, labelled, no icon-only guess. */
.rotate { padding: var(--sp-3) var(--page-x) var(--sp-4); display: flex; justify-content: center; }
.rotate .seg { width: 100%; max-width: 220px; }

/* The selection card. Rises from the bottom, carries what a lifter
   wants before committing a tap: how much is in there, and when they
   last trained it. */
.pick {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: var(--sp-4);
  padding-bottom: calc(var(--sp-4) + var(--safe-bottom));
  background: var(--surface-raised);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  box-shadow: var(--shadow-overlay);
  transform: translateY(101%);
  transition: transform var(--dur-slow) var(--spring);
}
.pick[data-open="true"] { transform: translateY(0); }
.pick__dot { width: var(--sp-3); height: var(--sp-3); border-radius: var(--r-full); flex: none; }

.findbar { padding: var(--sp-2) var(--page-x) var(--sp-3); }
.listhead { display: flex; align-items: baseline; justify-content: space-between; padding: var(--sp-4) var(--page-x) var(--sp-2); }
.gutter { margin: 0 var(--page-x); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<!--
  BODY MAP — visual mockup for approval. Not a build.

  Four stages: the body, a group selected, the group zoomed into its
  sub-regions, and the sub-region's exercises. Front and back views.

  The body is data, so it carries the anatomy palette; every other
  surface stays monochrome and the accent orange marks the one primary
  action on screen. Set the stage with ?stage=body|selected|zoom|list
  and the view with &view=front|back, and the group with &g=<id>.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-bodymap">

      <header class="hdr" id="hdr"></header>

      <div class="findbar" id="findbar">
        <div class="search">
          <span class="search__ico" aria-hidden="true">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" focusable="false"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>
          </span>
          <label class="vis-hidden" for="q">Search exercises by name, muscle or equipment</label>
          <input class="input" id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search 225 exercises">
        </div>
      </div>

      <!-- bodymap.js builds the figure into this frame and owns it. The
           label and region layers this screen adds are appended to the SVG
           it returns, so nothing here duplicates the component. -->
      <div class="map" id="map" data-testid="bodymap">
        <div class="pick" id="pick" data-open="false" role="region" aria-label="Selected muscle group"></div>
      </div>

      <div class="rotate" id="rotate">
        <div class="seg" role="tablist" aria-label="Body view">
          <button class="seg__item" type="button" role="tab" id="tab-front" aria-selected="true">Front</button>
          <button class="seg__item" type="button" role="tab" id="tab-back" aria-selected="false">Back</button>
        </div>
      </div>

      <main class="body body--flush" id="list" hidden tabindex="-1"></main>

    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------
     THE FIGURE

     Built the way a figure artist builds one, not the way a chart is
     traced. First an armature: skeletal landmarks laid down in the
     SVG space at bodybuilder proportions, which are not textbook
     proportions. Seven and a half heads on a 38-unit head, but the
     deltoids close to four head-widths across against a waist of
     little more than one, a neck as wide as the head, an upper arm
     thicker than the neck, thighs wider than the waist is deep.

     Then the masses: every muscle is a filled volume placed on that
     armature from its origin to its insertion, overlapping its
     neighbours the way muscles do. Each is authored as a ring of
     points around the belly and rounded into a body by `blob`, so a
     shape can only ever be a swelling, never a cylinder.

     Then the silhouette, which is not drawn at all. The inert body --
     head, neck, elbows, pelvis, knees, hands, feet -- and every mass
     from both views are painted once more in the ground colour, and
     their union IS the outer contour. Every bump on the edge of the
     figure is therefore a muscle belly, because there is nothing else
     the edge could be made of.

     Centre line is x = 100. Everything is authored for the right side
     of the body and mirrored, so a tap on either side selects the
     pair. A lifter never trains one pec.
     --------------------------------------------------------------- */

  /* ---------------------------------------------------------------
     The twelve groups, straight from the exercise database, with the
     sub-regions the five divisible ones hold. A group with no
     sub-regions goes from selection to its exercises without a zoom.
     --------------------------------------------------------------- */
  var GROUPS = {
    chest:    { name: 'Chest',     n: 30, subs: ['Upper Chest', 'Mid Chest', 'Lower Chest'], last: 'Trained 3 days ago · Incline DB Press 32 kg' },
    back:     { name: 'Back',      n: 40, subs: ['Lats', 'Mid Back', 'Lower Back', 'Traps'], last: 'Trained 2 days ago · Barbell Row 80 kg' },
    shoulders:{ name: 'Shoulders', n: 29, subs: ['Front Delt', 'Side Delt', 'Rear Delt'], last: 'Trained 5 days ago · DB Lateral Raise 12 kg' },
    triceps:  { name: 'Triceps',   n: 30, subs: ['Long Head', 'Lateral Head', 'Medial Head'], last: 'Trained 5 days ago · Rope Pushdown 30 kg' },
    biceps:   { name: 'Biceps',    n: 20, subs: ['Long Head', 'Short Head'], last: 'Trained 5 days ago · EZ Bar Curl 35 kg' },
    forearms: { name: 'Forearms',  n: 8,  subs: null, last: 'Trained 9 days ago · Wrist Curl 20 kg' },
    quads:    { name: 'Quads',     n: 9,  subs: null, last: 'Trained 6 days ago · Back Squat 120 kg' },
    hams:     { name: 'Hamstrings',n: 10, subs: null, last: 'Trained 6 days ago · Romanian Deadlift 90 kg' },
    glutes:   { name: 'Glutes',    n: 10, subs: null, last: 'Trained 6 days ago · Hip Thrust 140 kg' },
    adduc:    { name: 'Inner/Outer Thigh', n: 10, subs: null, last: 'Trained 12 days ago · Hip Abduction 55 kg' },
    abs:      { name: 'Abs',       n: 20, subs: ['Weighted', 'Bodyweight'], last: 'Trained 8 days ago · Cable Crunch 45 kg' },
    calves:   { name: 'Calves',    n: 9,  subs: null, last: 'Trained 6 days ago · Standing Calf Raise 90 kg' }
  };
  var ORDER = ['chest', 'back', 'shoulders', 'triceps', 'biceps', 'forearms',
               'quads', 'hams', 'glutes', 'adduc', 'abs', 'calves'];

  /* Label pictograms, on the same 24-unit grid and the same stroke
     weight as the icons in components.css. Each is a mark for the
     shape of the muscle, not a picture of it. */
  var ICO = {
    chest:    'M12 7 C7 7 4 9 4 12 C4 16 8 18 12 18 M12 7 C17 7 20 9 20 12 C20 16 16 18 12 18',
    back:     'M5 5 L12 19 L19 5',
    shoulders:'M4 17 C4 8 20 8 20 17',
    triceps:  'M4 7 C5 15 8 17 12 17 C16 17 19 15 20 7',
    biceps:   'M4 17 C5 9 8 7 12 7 C16 7 19 9 20 17',
    forearms: 'M5 6 L19 12 L5 18',
    quads:    'M8 5 C7 11 7 15 8 19 M12 5 L12 19 M16 5 C17 11 17 15 16 19',
    hams:     'M9 5 C7 11 8 15 10 19 M15 5 C17 11 16 15 14 19',
    glutes:   'M5 12 C5 7 10 5 14 7 C18 9 18 17 13 18 C8 19 5 16 5 12 Z',
    adduc:    'M9 5 L9 19 M15 5 L15 19 M3 12 L6 12 M18 12 L21 12',
    abs:      'M12 5 L12 19 M7 9 L17 9 M7 14 L17 14',
    calves:   'M12 4 C16 8 16 16 12 20 C8 16 8 8 12 4 Z'
  };

  /* One label per group per view: which side it sits on, where its
     leader lands on the muscle, and where its row sits in the column.
     Only one is ever visible, so the column is a place, not a list. */
  var LABELS = {
    front: {
      back:      ['R', 128,  72,  66],
      shoulders: ['R', 158, 106, 100],
      triceps:   ['R', 166, 152, 156],
      biceps:    ['R', 150, 144, 138],
      forearms:  ['R', 164, 212, 208],
      chest:     ['L', 124, 112, 108],
      abs:       ['L', 110, 172, 170],
      quads:     ['L', 126, 254, 252],
      adduc:     ['L', 108, 246, 298],
      calves:    ['R', 122, 350, 348]
    },
    back: {
      shoulders: ['R', 158, 106, 100],
      triceps:   ['R', 158, 148, 146],
      forearms:  ['R', 164, 212, 208],
      back:      ['L', 124, 142, 140],
      glutes:    ['L', 120, 226, 224],
      hams:      ['L', 122, 280, 278],
      calves:    ['R', 122, 352, 350]
    }
  };

  /* ---------------------------------------------------------------
     State
     --------------------------------------------------------------- */
  var S = { stage: 'body', view: 'front', gid: null, part: null };

  var map = document.getElementById('map'),
      pick = document.getElementById('pick'),
      hdr = document.getElementById('hdr'),
      list = document.getElementById('list'),
      rotate = document.getElementById('rotate');

  var EX = [
    ['Incline Barbell Press', 'Barbell', '70 kg'],
    ['Incline DB Press', 'Dumbbell', '32 kg'],
    ['Incline Cable Fly', 'Cable', '15 kg'],
    ['Incline Machine Press', 'Machine', '55 kg'],
    ['Smith Machine Incline', 'Smith Machine', '60 kg'],
    ['Low-to-High Cable Fly', 'Cable', '12.5 kg'],
    ['Incline DB Fly', 'Dumbbell', '16 kg'],
    ['Landmine Press', 'Barbell', '30 kg'],
    ['Incline Push Up', 'Bodyweight', ''],
    ['Cable Upper Chest Crossover', 'Cable', '14 kg']
  ];


  /* The figure is a component. This screen mounts it, then adds the two
     things only this screen has: the callout labels and the zoom into a
     group's regions. */
  var FIG = LKBodyMap.mount(map, {
    groups: GROUPS, order: ORDER,
    onSelect: function (gid) { select(gid); }
  });

  var svg = FIG.svg, defs = FIG.defs, cam = FIG.cam;
  var el = FIG.el, n2 = FIG.n2, boxIn = FIG.boxIn, fitAttr = FIG.fitAttr;
  var MEASURED = FIG.measured, PART_BOX = FIG.partBox, partsOf = FIG.partsOf;
  var ART = FIG.art;

  /* Layers this screen adds, in the component's own SVG. Regions ride inside
     the camera so they zoom with the body; labels stay outside it so zooming
     never scales the type. */
  var zones = el('g', { class: 'zones' });
  cam.appendChild(zones);
  var zlabs = el('g', { class: 'zlabs', 'aria-hidden': 'true' });
  var labsFront = el('g', { 'aria-hidden': 'true' });
  var labsBack = el('g', { 'aria-hidden': 'true' });
  svg.appendChild(labsFront);
  svg.appendChild(labsBack);
  svg.appendChild(zlabs);

  /* Labels: disc, pictogram, name, and a hairline leader to a dot on
     the muscle. Left-hand labels read disc-then-name toward the body;
     right-hand labels mirror that, so both columns read outward-in. */
  var COL_L = -10, COL_R = 218, R = 8;
  var LAB = [];

  function buildLabels(host, set) {
    Object.keys(set).forEach(function (gid) {
      var L = set[gid], left = L[0] === 'L';
      var ax = left ? 200 - L[1] : L[1], ay = L[2], cy = L[3];
      var g = el('g', { class: 'lab lab--' + gid, 'data-g': gid });
      var dx = left ? COL_L + R : COL_R - R;               /* disc centre */
      var tx = left ? dx + R + 5 : dx - R - 5;             /* text edge */
      var line = el('path', { class: 'lab__line' });
      g.appendChild(line);
      g.appendChild(el('circle', { class: 'lab__dot', cx: ax, cy: ay, r: 2 }));
      g.appendChild(el('circle', { class: 'lab__disc', cx: dx, cy: cy, r: R }));
      var ig = el('g', { transform: 'translate(' + (dx - R * 0.78) + ' ' + (cy - R * 0.78) +
        ') scale(' + (R * 1.56 / 24) + ')' });
      ig.appendChild(el('path', { class: 'lab__ico', d: ICO[gid] }));
      g.appendChild(ig);
      var t = el('text', { class: 'lab__t', x: tx, y: cy, 'text-anchor': left ? 'start' : 'end' });
      t.textContent = GROUPS[gid].name;
      g.appendChild(t);
      host.appendChild(g);
      LAB.push({ line: line, text: t, tx: tx, cy: cy, ax: ax, ay: ay, left: left });
    });
  }

  /* The leader starts where the name ends, so a short name is not left
     with a stub and a long one is not overrun. Measured after the type
     is sized, because the type size is measured too. */
  function layoutLabels() {
    LAB.forEach(function (L) {
      var w = 0;
      try { w = L.text.getComputedTextLength(); } catch (e) { w = 40; }
      var end = L.left ? L.tx + w + 4 : L.tx - w - 4;
      var bend = L.left ? end + 8 : end - 8;
      L.line.setAttribute('d', 'M' + n2(end) + ' ' + L.cy + ' L' + n2(bend) + ' ' + L.cy +
        ' L' + L.ax + ' ' + L.ay);
    });
  }

  buildLabels(labsFront, LABELS.front);
  buildLabels(labsBack, LABELS.back);

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function chev() {
    return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  }
  function backIco() {
    return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  }

  function renderHeader() {
    var title = 'Body map', sub = 'Tap a muscle group', back = null;
    if (S.stage === 'selected') { sub = GROUPS[S.gid].name + ' selected'; }
    if (S.stage === 'zoom') { title = GROUPS[S.gid].name; sub = 'Tap a region'; back = 'Body'; }
    if (S.stage === 'list') { title = 'Upper Chest'; sub = '10 exercises'; back = 'Chest'; }
    LKPatch(hdr, (back ? '<button class="hdr__back" type="button" data-action="back" aria-label="Back to ' + esc(back) + '">' + backIco() + '</button>' : '') +
      '<div class="hdr__title"><h1 class="t-section">' + esc(title) + '</h1>' +
      '<p class="t-meta">' + esc(sub) + '</p></div>');
  }

  /* The card names what the tap will do. A group with sub-regions
     opens into them; a group without them goes to its exercises, and
     says so, so the path is never a dead end. */
  function renderPick() {
    if (!S.gid) { LKPatch(pick, ''); return; }
    var g = GROUPS[S.gid];
    var act = g.subs ? 'Open ' + g.name : 'See ' + g.n + ' exercises';
    LKPatch(pick, '<div class="hstack hstack--2"><span class="pick__dot pick__dot--' + S.gid + '"></span>' +
        '<h2 class="t-section grow truncate">' + esc(g.name) + '</h2>' +
        '<span class="t-meta" data-num>' + g.n + ' exercises</span></div>' +
      '<p class="t-detail mt-2">' + esc(g.last) + '</p>' +
      (g.subs ? '<p class="t-meta mt-2">' + esc(g.subs.join(' · ')) + '</p>' : '') +
      '<button class="btn btn--primary btn--block mt-3" type="button" data-action="open">' +
        '<span class="btn__label">' + esc(act) + '</span></button>');
  }

  function renderList() {
    var region = S.part || (GROUPS[S.gid] && GROUPS[S.gid].name) || '';
    LKPatch(list, '<div class="listhead"><h2 class="t-label">' + esc(region) +
      '</h2><span class="t-meta" data-num>10</span></div>' +
      '<div class="card card--flush gutter">' + EX.map(function (x) {
        return '<button class="row" type="button">' +
          '<span class="row__main stack"><span class="row__title">' + esc(x[0]) + '</span>' +
          '<span class="row__sub truncate">' + esc(GROUPS[S.gid].name) +
          (S.part ? ' &middot; ' + esc(S.part) : '') + ' &middot; ' + esc(x[1]) + '</span></span>' +
          (x[2] ? '<span class="row__value">' + esc(x[2]) + '</span>' : '') +
          '<span class="row__chev">' + chev() + '</span></button>';
      }).join('') + '</div>');
  }

  /* ZOOM

     Only two of the twelve groups divide honestly on this figure.

     Back divides into three real muscles the art draws separately: the
     trapezius, the latissimus and the erectors of the lower back. Tapping one
     highlights that muscle, because that muscle is there.

     Chest divides into upper, mid and lower, which are the clavicular,
     sternal and costal heads of one continuous sheet. There is no border
     between them to draw, so the three regions are the pec itself clipped
     into three horizontal bands. That is what the heads are.

     The other ten do not. Front, side and rear deltoid are three faces of one
     mass and two of them are on the other side of the body; the heads of the
     triceps and biceps are stacked, not banded; and the Abs group's own
     sub-regions -- Weighted and Bodyweight -- are a way of choosing an
     exercise, not a part of anybody. Drawing regions on those would be
     inventing anatomy, so those groups go from selection straight to their
     exercises and the sub-regions appear where they belong, as a filter over
     the list. */

  /* The camera frames the group's own measured extent with a margin, and
     leaves the right-hand gutter clear for the region labels. */
  var ZGUTTER = 64, ZPAD = 10;
  var ZCAM = { x: 80, y: 209, k: 1.8, ox: 100, oy: 112 };

  function fitCamera() {
    var b = MEASURED[S.view] && MEASURED[S.view][S.gid];
    if (!b) return;
    var r = boxIn(S.view, b);
    /* The frame is the screen viewBox less the label gutter. */
    var fw = 240 - ZGUTTER, fh = 402;
    var k = Math.min(fw / (r.w + ZPAD * 2), fh / (r.h + ZPAD * 2), 3.2);
    ZCAM.k = Math.round(k * 100) / 100;
    ZCAM.ox = r.x + r.w / 2;
    ZCAM.oy = r.y + r.h / 2;
    ZCAM.x = -16 + fw / 2;
    ZCAM.y = 8 + fh / 2;
  }

  function camera() {
    return S.stage === 'zoom'
      ? 'translate(' + n2(ZCAM.x) + ' ' + n2(ZCAM.y) + ') scale(' + ZCAM.k +
        ') translate(' + n2(-ZCAM.ox) + ' ' + n2(-ZCAM.oy) + ')'
      : 'translate(0 0) scale(1)';
  }

  var ZCOL = 176;

  /* The zoomed regions are built into the map when a group opens, and the
     labels are placed from where those regions actually landed rather than
     from a table, so a region and its label can never drift apart. */
  var zoneBoxes = [];

  function buildZones() {
    zones.textContent = '';
    zoneBoxes = [];
    if (S.stage !== 'zoom' || !S.gid) return;
    var P = partsOf(S.gid, S.view);
    if (!P) return;
    zones.style.setProperty('--zone-hue', 'var(--anat-' + S.gid + ')');
    var fit = fitAttr(S.view);
    var paths = ART[S.view].groups[S.gid] || [];
    var box = MEASURED[S.view][S.gid];

    P.names.forEach(function (name, i) {
      var g = el('g', { class: 'zone', 'data-part': name, tabindex: '0', role: 'button',
        'data-testid': 'zone-' + name.toLowerCase().replace(/ /g, '-'),
        'aria-label': name + ', ' + GROUPS[S.gid].name });
      var inner = el('g', { transform: fit });

      if (P.kind === 'muscles') {
        P.paths[name].forEach(function (d) {
          inner.appendChild(el('path', { d: d, class: 'zone__fill' }));
        });
      } else {
        /* A band of the sheet: the muscle drawn again and clipped to a
           horizontal slice of its own extent. The bands together are exactly
           the muscle, so it never changes shape when it opens. */
        var clip = 'zb-' + i;
        var cp = el('clipPath', { id: clip, clipPathUnits: 'userSpaceOnUse' });
        cp.appendChild(el('rect', { x: box[0] - 4, y: box[1] + box[3] * i / P.names.length,
          width: box[2] + 8, height: box[3] / P.names.length }));
        defs.appendChild(cp);
        var band = el('g', { 'clip-path': 'url(#' + clip + ')' });
        paths.forEach(function (d) { band.appendChild(el('path', { d: d, class: 'zone__fill' })); });
        inner.appendChild(band);
      }
      g.appendChild(inner);
      g.style.setProperty('--zone-step', String(i));
      zones.appendChild(g);
      /* The region's own extent in art units. A clipped band's box is the
         clip, not the shape's, and getBoundingClientRect on a group would
         report the unclipped shape, so the box is carried rather than
         re-measured. */
      var pb = P.kind === 'muscles'
        ? PART_BOX[S.view][S.gid][name]
        : [box[0], box[1] + box[3] * i / P.names.length, box[2], box[3] / P.names.length];
      zoneBoxes.push([name, boxIn(S.view, pb)]);
    });
  }

  function placeZoomLabels() {
    zlabs.textContent = '';
    if (S.stage !== 'zoom' || !zoneBoxes.length) return;
    zoneBoxes.forEach(function (Z) {
      /* The region's right edge and vertical centre, put through the same
         camera the body is under, so the leader lands on the region. */
      var r = Z[1];
      var ax = ZCAM.x + (r.x + r.w - ZCAM.ox) * ZCAM.k;
      var ay = ZCAM.y + (r.y + r.h / 2 - ZCAM.oy) * ZCAM.k;
      ax = Math.min(ax, ZCOL - 14);
      var g = el('g', { class: 'lab', style: 'opacity:1' });
      g.appendChild(el('path', { class: 'lab__line',
        d: 'M' + n2(ax) + ' ' + n2(ay) + ' L' + n2(ZCOL - 6) + ' ' + n2(ay) }));
      g.appendChild(el('circle', { class: 'lab__dot', cx: n2(ax), cy: n2(ay), r: 2.5 }));
      var t = el('text', { class: 'zlab__t', x: ZCOL, y: n2(ay), 'text-anchor': 'start' });
      t.textContent = Z[0];
      var n = el('tspan', { class: 'zlab__n', dx: 6 });
      n.textContent = Math.round(GROUPS[S.gid].n / zoneBoxes.length);
      t.appendChild(n);
      g.appendChild(t);
      zlabs.appendChild(g);
    });
    sizeType();

    /* The column sits wherever the longest name still fits. 'Lower Back' is
       eleven characters and runs off a 240-unit frame from a fixed column, so
       the column moves to the text rather than the text being shortened. */
    var right = 222, over = 0;
    Array.prototype.forEach.call(zlabs.querySelectorAll('.zlab__t'), function (t) {
      /* getBBox rather than getComputedTextLength: the count is a tspan with
         its own offset, and only the box accounts for it. */
      var w = t.getBBox ? t.getBBox().width : 0;
      over = Math.max(over, ZCOL + w - right);
    });
    if (over > 0) {
      Array.prototype.forEach.call(zlabs.children, function (g) {
        var t = g.querySelector('.zlab__t');
        var line = g.querySelector('.lab__line');
        if (t) t.setAttribute('x', n2(ZCOL - over));
        if (line) {
          var d = line.getAttribute('d').split(' L');
          line.setAttribute('d', d[0] + ' L' + n2(ZCOL - over - 6) + ' ' + d[1].split(' ')[1]);
        }
      });
    }
  }

  /* Type is set at the 11px step of the scale as measured on screen:
     the user-unit size is 11 divided by the current viewBox scale, so
     the rendered size is the token and not whatever the viewBox
     happens to magnify. */
  function sizeType() {
    var box = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    if (!box.width || !vb.width) return;
    var s = Math.min(box.width / vb.width, box.height / vb.height);
    var px = (11 / s) + 'px';
    Array.prototype.forEach.call(document.querySelectorAll('.lab__t, .zlab__t'), function (t) {
      t.style.fontSize = px;
    });
    layoutLabels();
  }
  window.addEventListener('resize', function () { sizeType(); placeZoomLabels(); });

  function render() {
    renderHeader();
    map.toggleAttribute('data-zoom', S.stage === 'zoom');
    if (S.gid) map.setAttribute('data-selected', S.gid); else map.removeAttribute('data-selected');
    Array.prototype.forEach.call(document.querySelectorAll('.mg, .lab[data-g]'), function (g) {
      if (g.getAttribute('data-g') === S.gid) g.setAttribute('data-on', ''); else g.removeAttribute('data-on');
    });
    cam.setAttribute('transform', camera());
    FIG.setView(S.view);
    labsFront.style.display = S.view === 'front' ? '' : 'none';
    labsBack.style.display = S.view === 'back' ? '' : 'none';
    document.getElementById('tab-front').setAttribute('aria-selected', S.view === 'front');
    document.getElementById('tab-back').setAttribute('aria-selected', S.view === 'back');

    pick.setAttribute('data-open', S.stage === 'selected' ? 'true' : 'false');
    renderPick();

    rotate.hidden = S.stage !== 'body';
    list.hidden = S.stage !== 'list';
    map.classList.toggle('map--strip', S.stage === 'list');
    if (S.stage === 'list') map.setAttribute('data-part', 'upper'); else map.removeAttribute('data-part');
    svg.setAttribute('viewBox', S.stage === 'list' ? '36 78 128 65' : '-16 8 240 402');
    if (S.stage === 'zoom') fitCamera();
    buildZones();
    if (S.stage === 'list') renderList();
    requestAnimationFrame(function () { sizeType(); placeZoomLabels(); });
  }

  /* ---------------------------------------------------------------
     Behaviour
     --------------------------------------------------------------- */
  function select(gid) { S.gid = gid; S.part = null; S.stage = 'selected'; render(); }

  document.addEventListener('click', function (e) {
    /* '[data-g]' rather than '.mg': the reach paths carry the group id but
       sit outside the groups, so that a thin muscle can be grown without
       being painted over by the group drawn after it. */
    var mg = e.target.closest ? e.target.closest('[data-g]') : null;
    var act = e.target.closest ? e.target.closest('[data-action]') : null;
    if (act) {
      var a = act.getAttribute('data-action');
      /* A group opens into its regions only where those regions are real.
         Everywhere else Open goes straight to the exercises. */
      if (a === 'open') { S.stage = partsOf(S.gid, S.view) ? 'zoom' : 'list'; render(); return; }
      if (a === 'back') {
        S.stage = (S.stage === 'list' && partsOf(S.gid, S.view)) ? 'zoom' : 'selected';
        render(); return;
      }
    }
    var zone = e.target.closest && e.target.closest('.zone');
    if (zone && S.stage === 'zoom') { S.part = zone.getAttribute('data-part'); S.stage = 'list'; render(); return; }
    if (mg) { select(mg.getAttribute('data-g')); return; }
    if (e.target.id === 'tab-front') { S.view = 'front'; S.gid = null; S.stage = 'body'; render(); }
    if (e.target.id === 'tab-back') { S.view = 'back'; S.gid = null; S.stage = 'body'; render(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var mg = e.target.closest && e.target.closest('.mg');
    if (mg) { e.preventDefault(); select(mg.getAttribute('data-g')); }
  });

  /* Stage, view and group are addressable so each can be captured. */
  var p = new URLSearchParams(location.search);
  /* ?sil=1 hides every muscle so the silhouette can be judged on its own. */
  if (p.get('sil')) {
    Array.prototype.forEach.call(svg.querySelectorAll('.mg'), function (g) {
      g.style.display = 'none';
    });
  }
  S.view = p.get('view') === 'back' ? 'back' : 'front';
  var st = p.get('stage');
  if (st === 'selected' || st === 'zoom' || st === 'list') {
    S.stage = st;
    S.gid = GROUPS[p.get('g')] ? p.get('g') : 'chest';
  }
  render();
  requestAnimationFrame(function () { window.__ready = true; });
})();
</script>
</body>
</html>
