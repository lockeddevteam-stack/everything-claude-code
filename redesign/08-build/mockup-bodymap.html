<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOCKED — Body map (concept mockup)</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
/* ---------------------------------------------------------------
   Body map. Concept mockup only — nothing here is production code.
   Every value is a token except the SVG geometry itself, and the
   anatomy palette, which lives in tokens.css as documented data.

   The figure is drawn as an anatomy chart: real muscle outlines in
   bezier curves, fibre striations following each muscle's true fibre
   direction, and labels in a column down each side on leader lines.
   --------------------------------------------------------------- */

.map {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.map__svg { width: 100%; height: 100%; display: block; touch-action: manipulation; }
.map[hidden], .rotate[hidden], .findbar[hidden] { display: none; }

/* Stage four keeps the chest on screen above its exercises, so the
   list is visibly the inside of the muscle the lifter just opened. */
.map--strip { flex: none; height: 200px; }

/* The camera. Zoom is a transform on one group so the selection
   travels with it and the lifter sees where they came from. */
.cam { transition: transform var(--dur-slow) var(--spring); }

/* Rotation front to back: the two views cross-fade through a Y-scale,
   which reads as a turn rather than a cut. */
.view { transition: opacity var(--dur-slow) var(--ease), transform var(--dur-slow) var(--ease); }
.view[data-hidden="true"] { opacity: 0; transform: scaleX(0.1); pointer-events: none; }

.silhouette { fill: var(--anat-silhouette); }
/* The inert body carries one hairline so the figure has an edge in
   dark mode without any hue of its own. */
.silhouette path { stroke: var(--anat-edge); stroke-width: 1; vector-effect: non-scaling-stroke; }

/* A muscle group. Fill is set per group from the anatomy palette.
   Saturation lifts on select and falls on the rest in 150ms; nothing
   moves, because movement would mean more than a selection. */
.mg { cursor: pointer; }
.mg__shape {
  transition: fill var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease);
}
.mg .hit { fill: transparent; }
.map[data-selected] .mg:not([data-on]) .mg__shape { fill: var(--anat-muted); }

.mg--chest .mg__shape { fill: var(--anat-chest); }
.mg--shoulders .mg__shape { fill: var(--anat-shoulders); }
.mg--back .mg__shape { fill: var(--anat-back); }
.mg--arms .mg__shape { fill: var(--anat-arms); }
.mg--core .mg__shape { fill: var(--anat-core); }
.mg--legs .mg__shape { fill: var(--anat-legs); }

/* Fibre striations. Fine lines inside each muscle, following its own
   fibre direction, drawn in a darker step of that muscle's own hue.
   The darker step is derived from the group token, so the anatomy
   palette stays the single source for body colour. */
.fib { fill: none; stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linecap: round; opacity: 0.5; }
.mg--chest .fib     { stroke: color-mix(in srgb, var(--anat-chest) 45%, #000); }
.mg--shoulders .fib { stroke: color-mix(in srgb, var(--anat-shoulders) 45%, #000); }
.mg--back .fib      { stroke: color-mix(in srgb, var(--anat-back) 45%, #000); }
.mg--arms .fib      { stroke: color-mix(in srgb, var(--anat-arms) 45%, #000); }
.mg--core .fib      { stroke: color-mix(in srgb, var(--anat-core) 45%, #000); }
.mg--legs .fib      { stroke: color-mix(in srgb, var(--anat-legs) 45%, #000); }
.map[data-selected] .mg:not([data-on]) .fib { stroke: color-mix(in srgb, var(--anat-muted) 45%, #000); }

/* Sub-regions: the same hue, three steps, so parts read as a family.
   The three bands together are the pec fan, so the muscle is never a
   different shape once it opens. */
.pec[data-part="upper"] { fill: var(--anat-chest-1); }
.pec[data-part="mid"]   { fill: var(--anat-chest-2); }
.pec[data-part="lower"] { fill: var(--anat-chest-3); }
.map:not([data-zoom]):not([data-part]) .pec { fill: var(--anat-chest); }
.map[data-selected]:not([data-zoom]) .mg--chest:not([data-on]) .pec { fill: var(--anat-muted); }
.map[data-part="upper"] .pec:not([data-part="upper"]) { fill: var(--anat-muted); }
.pec { transition: fill var(--dur-slow) var(--ease), opacity var(--dur-slow) var(--ease); }

/* Parts separate in sequence once the zoom settles: the single pec
   becomes three tints, upper first, so the eye is led to them. */
.pec[data-part="mid"] { transition-delay: 100ms; }
.pec[data-part="lower"] { transition-delay: 200ms; }
.map[data-zoom] .mg:not(.mg--chest) { opacity: 0; pointer-events: none; }

/* Focus follows the shape, in text white. The accent is never spent
   on the body. */
.mg:focus-visible, .part:focus-visible { outline: none; }
.mg:focus-visible .mg__shape,
.part:focus-visible .pec {
  stroke: var(--text);
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}

/* Labels. The reference convention: a short name in a clean column
   down each side, a hairline leader to a dot on the muscle, set at
   the 11px step of the type scale and never larger. JS sets the font
   size in user units from the measured scale so the rendered size is
   the token, not whatever the viewBox happens to magnify. */
.lab { pointer-events: none; transition: opacity var(--dur-slow) var(--ease); }
.lab__line { stroke: var(--anat-edge); stroke-width: 1; vector-effect: non-scaling-stroke; fill: none; }
.lab__dot { stroke: none; }
.lab__t {
  font-family: inherit;
  font-weight: var(--w-medium);
  letter-spacing: var(--tr-11);
  fill: var(--text-tertiary);
  dominant-baseline: middle;
}
/* On selection the named muscles take their own hue and the rest
   stay a muted neutral, so the column reads as an index. */
.map[data-selected] .lab[data-on] .lab__t { fill: currentColor; font-weight: var(--w-semibold); }
.map[data-selected] .lab:not([data-on]) { opacity: 0.45; }
.lab--chest     { color: var(--anat-chest); }
.lab--shoulders { color: var(--anat-shoulders); }
.lab--back      { color: var(--anat-back); }
.lab--arms      { color: var(--anat-arms); }
.lab--core      { color: var(--anat-core); }
.lab--legs      { color: var(--anat-legs); }
.map[data-zoom] .labs, .map--strip .labs { opacity: 0; }
.labs { transition: opacity var(--dur-fast) var(--ease); }

/* The three part labels use the same convention as the body labels,
   so nothing new is introduced by zooming in. */
.zlabs { opacity: 0; transition: opacity var(--dur-slow) var(--ease); }
.map[data-zoom] .zlabs { opacity: 1; transition-delay: var(--dur-slow); }
.zlab__t { font-family: inherit; font-weight: var(--w-semibold); letter-spacing: var(--tr-11); fill: var(--text); dominant-baseline: middle; }
.zlab__n { fill: var(--text-tertiary); font-weight: var(--w-medium); }

/* The rotate control. Two 44px targets, labelled, no icon-only guess. */
.rotate { padding: var(--sp-3) var(--page-x) var(--sp-4); display: flex; justify-content: center; }
.rotate .seg { width: 100%; max-width: 220px; }

/* The selection card. Rises from the bottom, carries what a lifter
   wants before committing a tap: how much is in there, and when they
   last trained it. */
.pick {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: var(--sp-4);
  padding-bottom: calc(var(--sp-4) + var(--safe-bottom));
  background: var(--surface-raised);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  box-shadow: var(--shadow-overlay);
  transform: translateY(101%);
  transition: transform var(--dur-slow) var(--spring);
}
.pick[data-open="true"] { transform: translateY(0); }
.pick__dot { width: var(--sp-3); height: var(--sp-3); border-radius: var(--r-full); flex: none; }
.pick__dot--chest { background: var(--anat-chest); }

.findbar { padding: var(--sp-2) var(--page-x) var(--sp-3); }
.listhead { display: flex; align-items: baseline; justify-content: space-between; padding: var(--sp-4) var(--page-x) var(--sp-2); }
.gutter { margin: 0 var(--page-x); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<!--
  BODY MAP — visual mockup for approval. Not a build.

  Four stages: the body, a group selected, the group zoomed into its
  parts, and the parts' exercises. Front and back views.

  The body is data, so it carries the anatomy palette; every other
  surface stays monochrome and the accent orange marks the one primary
  action on screen. Set the stage with ?stage=body|selected|zoom|list
  and the view with &view=front|back.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-bodymap">

      <header class="hdr" id="hdr"></header>

      <div class="findbar" id="findbar">
        <div class="search">
          <span class="search__ico" aria-hidden="true">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" focusable="false"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>
          </span>
          <label class="vis-hidden" for="q">Search exercises by name, muscle or equipment</label>
          <input class="input" id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search 227 exercises">
        </div>
      </div>

      <div class="map" id="map" data-testid="bodymap">
        <svg class="map__svg" id="svg" viewBox="-40 2 280 414" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Muscle map, front view">
          <defs id="defs"></defs>
          <g class="cam" id="cam">

            <!-- ================= FRONT ================= -->
            <g class="view" id="view-front">
              <g class="silhouette" id="f-base"></g>
              <g id="f-groups"></g>
            </g>

            <!-- ================= BACK ================== -->
            <g class="view" id="view-back" data-hidden="true">
              <g class="silhouette" id="b-base"></g>
              <g id="b-groups"></g>
            </g>

          </g>

          <!-- Labels live outside the camera so zooming the body never
               scales the type. -->
          <g class="labs" id="labs-front" aria-hidden="true"></g>
          <g class="labs" id="labs-back" aria-hidden="true"></g>
          <g class="zlabs" id="zlabs" aria-hidden="true"></g>
        </svg>

        <div class="pick" id="pick" data-open="false" role="region" aria-label="Selected muscle group"></div>
      </div>

      <div class="rotate" id="rotate">
        <div class="seg" role="tablist" aria-label="Body view">
          <button class="seg__item" type="button" role="tab" id="tab-front" aria-selected="true">Front</button>
          <button class="seg__item" type="button" role="tab" id="tab-back" aria-selected="false">Back</button>
        </div>
      </div>

      <main class="body body--flush" id="list" hidden tabindex="-1"></main>

    </div>
  </div>
</div>

<script>

  /* ---------------------------------------------------------------

     nipple line 108, navel 176, crotch 214, knee 300, sole 398.
     Centre line is x = 100; every muscle is drawn once for the right
     half and placed twice inside one group — the shape and its mirror
     — so tapping either side selects the pair. A lifter never trains
     one pec.

     Muscles carry fibre lines: `f` is a list of paths in the same
     coordinate space, clipped to the muscle, stroked in a darker step
     of the muscle's hue. They follow the real fibre direction and
     converge where the muscle converges.
     --------------------------------------------------------------- */

  var HEAD = 'M100 13 C110 13 118 20 119 32 C120 43 116 54 108 61 C105 63 102 64 100 64 Z';

     chest is declared after the shoulder and the arm. */

    /* Anterior deltoid — a rounded cap over the shoulder joint that
       overlaps the pec's upper outer edge, fibres converging down to

          'M137 181 C143 194 148 208 152 224'] },

    { g: 'core', d: 'M102 166 C108 165 114 168 116 172 C116 175 116 177 115 179 C110 176 105 176 102 176 Z',

    /* Posterior deltoid. */
    { g: 'shoulders', d: 'M126 79 C138 82 148 92 151 106 C153 117 150 126 146 129 C142 132 137 129 136 121 C134 109 131 92 126 79 Z',

    { g: 'legs', d: 'M124 238 C131 245 133 260 131 275 C129 288 126 296 122 300 C119 302 116 299 118 293 C122 280 124 263 124 250 C124 243 124 239 124 238 Z',

    { g: 'legs', d: 'M107 238 C113 239 117 249 117 263 C117 277 115 289 112 297 C110 302 105 301 105 295 C104 281 104 262 105 250 C105 243 106 239 107 238 Z',
      f: ['M108 243 C112 260 113 280 110 298',
          'M111 248 C114 264 114 281 112 295',

    /* Gastrocnemius — two heads forming a diamond, both tapering into
       the Achilles. */
    { g: 'legs', d: 'M107 303 C113 306 117 318 117 333 C117 345 114 353 111 356 C108 358 105 354 105 346 C105 332 104 315 107 303 Z',
      f: ['M108 308 C113 320 114 338 110 355',
          'M111 314 C115 325 115 340 112 353',
          'M106 312 C108 326 108 342 107 354'] },
    { g: 'legs', d: 'M120 303 C125 310 127 322 126 334 C125 343 122 350 119 351 C116 352 115 347 116 341 C118 330 119 315 120 303 Z',
      f: ['M121 309 C124 322 123 338 118 350',
          'M124 318 C126 328 124 341 120 349'] },
    { g: 'legs', d: 'M110 355 C115 354 119 358 120 366 C121 373 118 377 114 377 C110 377 108 373 108 366 Z',
      f: ['M111 358 C114 362 116 369 116 375'] }
  ];

  /* Labels. [text, group, anchor x, anchor y, column y] — anchors are
     given on the right half; a left-column label mirrors its anchor
     to 200 - x. The column y values are spaced evenly so the two
     columns read as lists, not as scatter. */
  var LABELS = {
    front: {
      left: [
        ['Deltoid',          'shoulders', 142,  95,  86],
        ['Pectoralis major', 'chest',     118, 101, 116],
        ['Serratus anterior','core',      130, 138, 146],
        ['Rectus abdominis', 'core',      110, 158, 176],
        ['Quadriceps',       'legs',      119, 252, 254]
      ],
      right: [
        ['Biceps brachii',    'arms', 143, 138, 132],
        ['External oblique',  'core', 126, 172, 172],
        ['Forearm flexors',   'arms', 152, 205, 212],
        ['Tibialis anterior', 'legs', 121, 332, 332]
      ]
    },
    back: {
      left: [
        ['Trapezius',        'back',  118,  88,  84],
        ['Latissimus dorsi', 'back',  124, 142, 130],
        ['Erector spinae',   'back',  107, 178, 176],
        ['Gluteus maximus',  'legs',  118, 214, 218],
        ['Gastrocnemius',    'legs',  112, 332, 332]
      ],
      right: [
        ['Posterior deltoid', 'shoulders', 143,  99,  96],
        ['Triceps brachii',   'arms',      147, 136, 140],
        ['Hamstrings',        'legs',      126, 268, 268]
      ]
    }
  };

  var GROUPS = {
    chest:     { name: 'Chest',     n: 31, last: 'Trained 3 days ago · Incline DB Press 32 kg' },
    shoulders: { name: 'Shoulders', n: 27, last: 'Trained 5 days ago · DB Lateral Raise 12 kg' },
    back:      { name: 'Back',      n: 42, last: 'Trained 2 days ago · Barbell Row 80 kg' },
    arms:      { name: 'Arms',      n: 34, last: 'Trained 5 days ago · Rope Pushdown 30 kg' },
    core:      { name: 'Core',      n: 22, last: 'Trained 8 days ago · Cable Crunch 45 kg' },
    legs:      { name: 'Legs',      n: 39, last: 'Trained 6 days ago · Back Squat 120 kg' }
  };

  var MIRROR = 'matrix(-1 0 0 1 200 0)';
  var NS = 'http://www.w3.org/2000/svg';
  var defs = document.getElementById('defs');
  var uid = 0;

  function el(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    return n;
  }

  /* One muscle, drawn twice: the shape and its mirror. The fibre
     lines are clipped to the muscle and sit inside the same mirrored
     group, so they mirror with it. */
  function muscle(host, m, cls, part) {
    var clip = null;
    if (m.f && m.f.length) {
      clip = 'fib' + (++uid);
      var cp = el('clipPath', { id: clip });
      cp.appendChild(el('path', { d: m.d }));
      defs.appendChild(cp);
    }
    [null, MIRROR].forEach(function (t) {
      var side = el('g', { transform: t });
      side.appendChild(el('path', { d: m.d, class: cls, 'data-part': part }));
      if (clip) {
        var fg = el('g', { 'clip-path': 'url(#' + clip + ')' });
        m.f.forEach(function (d) { fg.appendChild(el('path', { d: d, class: 'fib' })); });
        side.appendChild(fg);
      }
      host.appendChild(side);
    });
  }

  function base(host, paths) {
    paths.forEach(function (d) {
      [null, MIRROR].forEach(function (t) { host.appendChild(el('path', { d: d, transform: t })); });
    });
  }

  /* Hit areas. The drawn biceps is 15 units wide, about 21 CSS px on
     this frame, and the abdominal column is narrower still. Each group
     carries an invisible rect per side, sized so the measured target
     clears 44 by 44 on a 393px screen. */
  function hit(g, x, y, w, h) {
    [null, MIRROR].forEach(function (t) {
      g.appendChild(el('rect', { class: 'hit', x: x, y: y, width: w, height: h, transform: t }));
    });
  }

  var HITS = {
    front: {
      shoulders: [122, 76, 33, 50], arms: [128, 130, 33, 128],
      chest: [100, 74, 36, 62], core: [100, 137, 34, 78], legs: [100, 206, 36, 196]
    },
    back: {
      shoulders: [124, 76, 33, 50], arms: [132, 100, 33, 82],
      back: [100, 62, 38, 142], legs: [100, 192, 36, 210]
    }
  };

  function buildView(host, defsList, hits) {
    var made = {};
    function groupFor(gid) {
      if (made[gid]) return made[gid];
      var g = el('g', {
        class: 'mg mg--' + gid, tabindex: '0', role: 'button',
        'data-g': gid, 'data-testid': 'mg-' + gid,
        'aria-label': GROUPS[gid].name + ', ' + GROUPS[gid].n + ' exercises'
      });
      host.appendChild(g);
      made[gid] = g;
      return g;
    }
    defsList.forEach(function (m) {
      var host2 = groupFor(m.g);
      if (m.part) {
        var pg = el('g', { class: 'part', 'data-part': m.part, tabindex: '-1', role: 'button',
          'aria-label': m.part + ' chest' });
        muscle(pg, m, m.cls || 'mg__shape', m.part);
        host2.appendChild(pg);
      } else {
        muscle(host2, m, m.cls || 'mg__shape', null);
      }
    });
    Object.keys(hits).forEach(function (gid) {
      var h = hits[gid];
      hit(groupFor(gid), h[0], h[1], h[2], h[3]);
    });
  }

  base(document.getElementById('f-base'), FRONT_BASE);
  base(document.getElementById('b-base'), BACK_BASE);
  buildView(document.getElementById('f-groups'), FRONT_MG, HITS.front);
  buildView(document.getElementById('b-groups'), BACK_MG, HITS.back);

  /* Labels: a hairline from the column to a dot on the muscle. */
  var COL_L = 44, COL_R = 156;

  function buildLabels(host, set) {
    ['left', 'right'].forEach(function (sideName) {
      var isLeft = sideName === 'left';
      set[sideName].forEach(function (L) {
        var ax = isLeft ? 200 - L[2] : L[2], ay = L[3], cy = L[4];
        var cx = isLeft ? COL_L : COL_R;
        var g = el('g', { class: 'lab lab--' + L[1], 'data-g': L[1] });
        var bend = isLeft ? cx + 14 : cx - 14;
        g.appendChild(el('path', { class: 'lab__line',
          d: 'M' + cx + ' ' + cy + ' L' + bend + ' ' + cy + ' L' + ax + ' ' + ay }));
        g.appendChild(el('circle', { class: 'lab__dot', cx: ax, cy: ay, r: 1.8, fill: 'currentColor' }));
        var t = el('text', { class: 'lab__t', x: isLeft ? cx - 4 : cx + 4, y: cy,
          'text-anchor': isLeft ? 'end' : 'start' });
        t.textContent = L[0];
        g.appendChild(t);
        host.appendChild(g);
      });
    });
  }
  buildLabels(document.getElementById('labs-front'), LABELS.front);
  buildLabels(document.getElementById('labs-back'), LABELS.back);

  /* ---------------------------------------------------------------
     State
     --------------------------------------------------------------- */
  var S = { stage: 'body', view: 'front', gid: null, part: null };

  var map = document.getElementById('map'),
      svg = document.getElementById('svg'),
      cam = document.getElementById('cam'),
      pick = document.getElementById('pick'),
      hdr = document.getElementById('hdr'),
      list = document.getElementById('list'),
      rotate = document.getElementById('rotate'),
      zlabs = document.getElementById('zlabs');

  var EX = {
    upper: [
      ['Incline Barbell Press', 'Barbell', '70 kg'],
      ['Incline DB Press', 'Dumbbell', '32 kg'],
      ['Incline Cable Fly', 'Cable', '15 kg'],
      ['Low-to-High Cable Fly', 'Cable', '12.5 kg'],
      ['Incline Machine Press', 'Machine', '55 kg'],
      ['Incline Push Up', 'Bodyweight', ''],
      ['Reverse Grip Bench Press', 'Barbell', '55 kg'],
      ['Incline Smith Press', 'Machine', '60 kg'],
      ['Landmine Press', 'Barbell', '30 kg']
    ]
  };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  function chev() {
    return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  }
  function backIco() {
    return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  }

  function renderHeader() {
    var title = 'Body map', sub = 'Tap a muscle group', back = null;
    if (S.stage === 'selected') { sub = GROUPS[S.gid].name + ' selected'; }
    if (S.stage === 'zoom') { title = 'Chest'; sub = 'Tap a region'; back = 'Body'; }
    if (S.stage === 'list') { title = 'Upper Chest'; sub = '9 exercises'; back = 'Chest'; }
    hdr.innerHTML =
      (back ? '<button class="hdr__back" type="button" data-action="back" aria-label="Back to ' + esc(back) + '">' + backIco() + '</button>' : '') +
      '<div class="hdr__title"><h1 class="t-section">' + esc(title) + '</h1>' +
      '<p class="t-meta">' + esc(sub) + '</p></div>';
  }

  function renderPick() {
    if (!S.gid) { pick.innerHTML = ''; return; }
    var g = GROUPS[S.gid];
    pick.innerHTML =
      '<div class="hstack hstack--2"><span class="pick__dot pick__dot--chest"></span>' +
        '<h2 class="t-section grow">' + esc(g.name) + '</h2>' +
        '<span class="t-meta" data-num>' + g.n + ' exercises</span></div>' +
      '<p class="t-detail mt-2">' + esc(g.last) + '</p>' +
      '<button class="btn btn--primary btn--block mt-3" type="button" data-action="open">' +
        '<span class="btn__label">Open ' + esc(g.name) + '</span></button>';
  }

  function renderList() {
    list.innerHTML =
      '<div class="listhead"><h2 class="t-label">Upper chest</h2><span class="t-meta" data-num>9</span></div>' +
      '<div class="card card--flush gutter">' + EX.upper.map(function (x) {
        return '<button class="row" type="button">' +
          '<span class="row__main stack"><span class="row__title">' + esc(x[0]) + '</span>' +
          '<span class="row__sub truncate">Chest &middot; Upper &middot; ' + esc(x[1]) + '</span></span>' +
          (x[2] ? '<span class="row__value">' + esc(x[2]) + '</span>' : '') +
          '<span class="row__chev">' + chev() + '</span></button>';
      }).join('') + '</div>';
  }

  /* Zoom camera: the pec pair centres on (100, 106) and fills the
     frame at 2.9x, leaving the side gutters for the part labels. */
  function camera() {
    if (S.stage === 'zoom') {
      return 'translate(100 209) scale(2.9) translate(-100 -106)';
    }
    return 'translate(0 0) scale(1)';
  }

  /* The three part labels are placed from the band they name, in the
     same column-and-leader convention as the body labels, so nothing
     new is introduced by zooming in. Screen coordinates are converted
     back to viewBox units so the type never scales with the camera. */
  var PART_N = { upper: 9, mid: 12, lower: 10 };
  function placeZoomLabels() {
    zlabs.textContent = '';
    if (S.stage !== 'zoom') return;
    var box = svg.getBoundingClientRect();
    var vb = svg.viewBox.baseVal;
    var s = Math.min(box.width / vb.width, box.height / vb.height);
    var ox = box.width / 2 - (vb.x + vb.width / 2) * s;
    var oy = box.height / 2 - (vb.y + vb.height / 2) * s;
    var col = vb.x + vb.width - 6;
    ['upper', 'mid', 'lower'].forEach(function (part) {
      var band = document.querySelector('#view-front .pec[data-part="' + part + '"]');
      if (!band) return;
      var r = band.getBoundingClientRect();
      var ax = ((r.left + r.width * 0.78) - box.left - ox) / s;
      var ay = ((r.top + r.height / 2) - box.top - oy) / s;
      var g = el('g', { class: 'lab', id: 'zlab-' + part });
      g.appendChild(el('path', { class: 'lab__line',
        d: 'M' + col + ' ' + ay + ' L' + (col - 16) + ' ' + ay + ' L' + ax + ' ' + ay }));
      g.appendChild(el('circle', { class: 'lab__dot', cx: ax, cy: ay, r: 2, fill: 'var(--text)' }));
      var t = el('text', { class: 'zlab__t', x: col + 4, y: ay, 'text-anchor': 'start' });
      t.textContent = part.charAt(0).toUpperCase() + part.slice(1);
      var n = el('tspan', { class: 'zlab__n', dx: 5 });
      n.textContent = PART_N[part];
      t.appendChild(n);
      g.appendChild(t);
      zlabs.appendChild(g);
    });
    sizeType();
  }

  /* Labels are set at the 11px step of the type scale as measured on
     screen: the user-unit size is 11 divided by the current scale. */
  function sizeType() {
    var box = svg.getBoundingClientRect();
    var vb = svg.viewBox.baseVal;
    if (!box.width || !vb.width) return;
    var s = Math.min(box.width / vb.width, box.height / vb.height);
    var px = (11 / s) + 'px';
    Array.prototype.forEach.call(document.querySelectorAll('.lab__t, .zlab__t'), function (t) {
      t.style.fontSize = px;
    });
  }
  window.addEventListener('resize', function () { sizeType(); placeZoomLabels(); });

  function render() {
    renderHeader();
    map.toggleAttribute('data-zoom', S.stage === 'zoom');
    if (S.gid) map.setAttribute('data-selected', S.gid); else map.removeAttribute('data-selected');
    Array.prototype.forEach.call(document.querySelectorAll('.mg'), function (g) {
      if (g.getAttribute('data-g') === S.gid) g.setAttribute('data-on', ''); else g.removeAttribute('data-on');
    });
    Array.prototype.forEach.call(document.querySelectorAll('.lab[data-g]'), function (g) {
      if (g.getAttribute('data-g') === S.gid) g.setAttribute('data-on', ''); else g.removeAttribute('data-on');
    });
    cam.setAttribute('transform', camera());
    document.getElementById('view-front').setAttribute('data-hidden', S.view === 'front' ? 'false' : 'true');
    document.getElementById('view-back').setAttribute('data-hidden', S.view === 'back' ? 'false' : 'true');
    document.getElementById('labs-front').style.opacity = S.view === 'front' ? '' : '0';
    document.getElementById('labs-back').style.opacity = S.view === 'back' ? '' : '0';
    document.getElementById('tab-front').setAttribute('aria-selected', S.view === 'front');
    document.getElementById('tab-back').setAttribute('aria-selected', S.view === 'back');

    pick.setAttribute('data-open', S.stage === 'selected' ? 'true' : 'false');
    renderPick();

    rotate.hidden = S.stage !== 'body';
    list.hidden = S.stage !== 'list';
    map.classList.toggle('map--strip', S.stage === 'list');
    if (S.stage === 'list') map.setAttribute('data-part', 'upper'); else map.removeAttribute('data-part');
    svg.setAttribute('viewBox', S.stage === 'list' ? '62 70 76 72' : '-40 2 280 414');
    if (S.stage === 'list') renderList();
    requestAnimationFrame(function () { sizeType(); placeZoomLabels(); });
  }

  /* ---------------------------------------------------------------
     Behaviour
     --------------------------------------------------------------- */
  function select(gid) { S.gid = gid; S.stage = 'selected'; render(); }

  document.addEventListener('click', function (e) {
    var mg = e.target.closest ? e.target.closest('.mg') : null;
    var act = e.target.closest ? e.target.closest('[data-action]') : null;
    if (act) {
      var a = act.getAttribute('data-action');
      if (a === 'open') { S.stage = 'zoom'; render(); return; }
      if (a === 'back') {
        S.stage = S.stage === 'list' ? 'zoom' : 'selected';
        render(); return;
      }
    }
    if (e.target.closest('.part') && S.stage === 'zoom') { S.stage = 'list'; render(); return; }
    if (mg) { select(mg.getAttribute('data-g')); return; }
    if (e.target.id === 'tab-front') { S.view = 'front'; S.gid = null; S.stage = 'body'; render(); }
    if (e.target.id === 'tab-back') { S.view = 'back'; S.gid = null; S.stage = 'body'; render(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var mg = e.target.closest && e.target.closest('.mg');
    if (mg) { e.preventDefault(); select(mg.getAttribute('data-g')); }
  });

  /* Stage and view are addressable so each can be captured. */
  var p = new URLSearchParams(location.search);
  S.view = p.get('view') === 'back' ? 'back' : 'front';
  var st = p.get('stage');
  if (st === 'selected' || st === 'zoom' || st === 'list') { S.stage = st; S.gid = 'chest'; }
  render();
  requestAnimationFrame(function () { window.__ready = true; });
})();
</script>
</body>
