<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOCKED — Body map (concept mockup)</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<style>
/* ---------------------------------------------------------------
   Body map. Concept mockup only — nothing here is production code.
   Every value is a token except the SVG geometry itself, and the
   anatomy palette, which lives in tokens.css as documented data.

   The figure is an anatomy chart, not a silhouette with patches on
   it: a developed athletic build, every muscle a separate body with
   a dark seam between it and its neighbour, a lit face and a shaded
   face so each belly reads round, and fibre striations following the
   real fibre direction of the muscle they sit in.

   The twelve groups are LOCKED's own groups, taken from the exercise
   database, so a group tapped on the body lists exactly what that
   group holds. Five of them hold sub-regions and open into them;
   the other seven go straight to their exercises.
   --------------------------------------------------------------- */

.map {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.map__svg { width: 100%; height: 100%; display: block; touch-action: manipulation; }
.map[hidden], .rotate[hidden], .findbar[hidden] { display: none; }

/* Stage four keeps the chest on screen above its exercises, so the
   list is visibly the inside of the muscle the lifter just opened. */
.map--strip { flex: none; height: 200px; }

/* The camera. Zoom is a transform on one group so the selection
   travels with it and the lifter sees where they came from. */
.cam { transition: transform var(--dur-slow) var(--spring); }

/* Rotation front to back: the two views cross-fade through a Y-scale,
   which reads as a turn rather than a cut. */
.view { transition: opacity var(--dur-slow) var(--ease), transform var(--dur-slow) var(--ease); }
.view[data-hidden="true"] { opacity: 0; transform: scaleX(0.1); pointer-events: none; }

/* The inert body: head, neck, limbs and trunk that carry no muscle,
   plus the shorts. No hue, no meaning. */
.sil { fill: var(--anat-silhouette); }
.shorts { fill: var(--anat-shorts); stroke: var(--anat-silhouette); stroke-width: 1.6; }

/* A muscle group. Every muscle is drawn twice: a dark ground in the
   group's shade step, then the same path in the group's hue offset
   two units up and left and clipped back to the ground. What is left
   of the ground is a rim on the lower right — one consistent light
   direction — and, where two muscles touch, the two rims meet and
   read as the seam between them. */
.mg { cursor: pointer; }
.mg__lit, .mg__gnd, .fib { transition: fill var(--dur-fast) var(--ease), stroke var(--dur-fast) var(--ease); }
.mg .hit { fill: transparent; }
.fib { fill: none; stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linecap: round; opacity: 0.55; }
</style>
<style id="hues">
/* One block per group, generated from the anatomy palette: the hue
   for the lit face, a 45% mix of the hue into black for the ground,
   the seam and the striations. */
</style>
<style>
/* Deselected: the group falls to the neutral muted grey, so the
   selected group is the only colour on the body. */
.map[data-selected] .mg:not([data-on]) .mg__lit { fill: var(--anat-muted); }
.map[data-selected] .mg:not([data-on]) .mg__gnd { fill: color-mix(in srgb, var(--anat-muted) 45%, #000); }
.map[data-selected] .mg:not([data-on]) .fib { stroke: color-mix(in srgb, var(--anat-muted) 45%, #000); }

/* Sub-regions: the same hue, three steps, so parts read as a family.
   The three bands together are the pec fan, so the muscle never
   changes shape when it opens. */
.map:not([data-zoom]):not([data-part]) .pec { display: none; }
.map[data-zoom] .whole, .map[data-part] .whole { display: none; }
.pec[data-part="upper"] .mg__lit { fill: var(--anat-chest-1); }
.pec[data-part="mid"] .mg__lit   { fill: var(--anat-chest-2); }
.pec[data-part="lower"] .mg__lit { fill: var(--anat-chest-3); }
.map:not([data-zoom]):not([data-part]) .pec .mg__lit { fill: var(--anat-chest); }
.map[data-selected]:not([data-zoom]) .mg--chest:not([data-on]) .pec .mg__lit { fill: var(--anat-muted); }
.map[data-part="upper"] .pec:not([data-part="upper"]) .mg__lit { fill: var(--anat-muted); }
.map[data-part="upper"] .pec:not([data-part="upper"]) .mg__gnd { fill: color-mix(in srgb, var(--anat-muted) 45%, #000); }
.map[data-part="upper"] .pec:not([data-part="upper"]) .fib { stroke: color-mix(in srgb, var(--anat-muted) 45%, #000); }
.pec .mg__lit { transition: fill var(--dur-slow) var(--ease); }
.pec[data-part="mid"] .mg__lit { transition-delay: 100ms; }
.pec[data-part="lower"] .mg__lit { transition-delay: 200ms; }
.map[data-zoom] .mg:not(.mg--chest) { opacity: 0; pointer-events: none; }
.map[data-zoom] #f-base, .map[data-zoom] #b-base,
.map[data-zoom] #f-wear, .map[data-zoom] #b-wear { opacity: 0.72; }

/* Focus follows the shape, in text white. The accent is never spent
   on the body. */
.mg:focus-visible, .part:focus-visible { outline: none; }
.mg:focus-visible .mg__gnd,
.part:focus-visible .mg__gnd {
  stroke: var(--text);
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}

/* The label. One at a time, on selection, in the reference's
   convention: a filled disc carrying a line pictogram, the group
   name beside it, and a hairline leader to a dot on the muscle.
   Twelve labels at once would be unreadable at 393px, so the map
   names what the lifter has just chosen and nothing else. */
.lab { opacity: 0; transition: opacity var(--dur-fast) var(--ease); pointer-events: none; }
.map[data-selected]:not([data-zoom]) .lab[data-on] { opacity: 1; transition: opacity var(--dur-slow) var(--ease) 80ms; }
.lab__line { fill: none; stroke: var(--text-tertiary); stroke-width: 1; vector-effect: non-scaling-stroke; }
.lab__dot { fill: var(--text-tertiary); }
.lab__disc { fill: currentColor; }
.lab__ico { fill: none; stroke: var(--bg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.lab__t {
  font-family: inherit;
  font-weight: var(--w-semibold);
  letter-spacing: var(--tr-11);
  fill: var(--text);
  dominant-baseline: middle;
}

/* The three part labels reuse the same convention, so zooming in
   introduces nothing new. */
.map--strip .lab { opacity: 0 !important; }
.zlabs { opacity: 0; transition: opacity var(--dur-slow) var(--ease); }
.map[data-zoom] .zlabs { opacity: 1; transition-delay: var(--dur-slow); }
.zlab__t { font-family: inherit; font-weight: var(--w-semibold); letter-spacing: var(--tr-11); fill: var(--text); dominant-baseline: middle; }
.zlab__n { fill: var(--text-tertiary); font-weight: var(--w-medium); }

/* The rotate control. Two 44px targets, labelled, no icon-only guess. */
.rotate { padding: var(--sp-3) var(--page-x) var(--sp-4); display: flex; justify-content: center; }
.rotate .seg { width: 100%; max-width: 220px; }

/* The selection card. Rises from the bottom, carries what a lifter
   wants before committing a tap: how much is in there, and when they
   last trained it. */
.pick {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: var(--sp-4);
  padding-bottom: calc(var(--sp-4) + var(--safe-bottom));
  background: var(--surface-raised);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  box-shadow: var(--shadow-overlay);
  transform: translateY(101%);
  transition: transform var(--dur-slow) var(--spring);
}
.pick[data-open="true"] { transform: translateY(0); }
.pick__dot { width: var(--sp-3); height: var(--sp-3); border-radius: var(--r-full); flex: none; }

.findbar { padding: var(--sp-2) var(--page-x) var(--sp-3); }
.listhead { display: flex; align-items: baseline; justify-content: space-between; padding: var(--sp-4) var(--page-x) var(--sp-2); }
.gutter { margin: 0 var(--page-x); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<!--
  BODY MAP — visual mockup for approval. Not a build.

  Four stages: the body, a group selected, the group zoomed into its
  sub-regions, and the sub-region's exercises. Front and back views.

  The body is data, so it carries the anatomy palette; every other
  surface stays monochrome and the accent orange marks the one primary
  action on screen. Set the stage with ?stage=body|selected|zoom|list
  and the view with &view=front|back, and the group with &g=<id>.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-bodymap">

      <header class="hdr" id="hdr"></header>

      <div class="findbar" id="findbar">
        <div class="search">
          <span class="search__ico" aria-hidden="true">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" focusable="false"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>
          </span>
          <label class="vis-hidden" for="q">Search exercises by name, muscle or equipment</label>
          <input class="input" id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search 225 exercises">
        </div>
      </div>

      <div class="map" id="map" data-testid="bodymap">
        <svg class="map__svg" id="svg" viewBox="-16 8 240 402" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Muscle map, front view">
          <defs id="defs"></defs>
          <g class="cam" id="cam">
            <g class="view" id="view-front">
              <g id="f-base"></g>
              <g id="f-groups"></g>
              <g id="f-wear"></g>
            </g>
            <g class="view" id="view-back" data-hidden="true">
              <g id="b-base"></g>
              <g id="b-groups"></g>
              <g id="b-wear"></g>
            </g>
          </g>

          <!-- Labels live outside the camera so zooming the body never
               scales the type. -->
          <g id="labs-front" aria-hidden="true"></g>
          <g id="labs-back" aria-hidden="true"></g>
          <g class="zlabs" id="zlabs" aria-hidden="true"></g>
        </svg>

        <div class="pick" id="pick" data-open="false" role="region" aria-label="Selected muscle group"></div>
      </div>

      <div class="rotate" id="rotate">
        <div class="seg" role="tablist" aria-label="Body view">
          <button class="seg__item" type="button" role="tab" id="tab-front" aria-selected="true">Front</button>
          <button class="seg__item" type="button" role="tab" id="tab-back" aria-selected="false">Back</button>
        </div>
      </div>

      <main class="body body--flush" id="list" hidden tabindex="-1"></main>

    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------
     THE FIGURE

     Seven and a half heads: crown y=13, chin 64, nipple line 110,
     navel 180, iliac crest 192, crotch 216, knee 302, sole 404.
     Shoulders 114 units across against a 60-unit waist, so the
     V-taper is in the silhouette before any muscle is drawn. The arms
     hang clear of the ribs so the lat and the arm outline both read.

     Centre line is x = 100. Every muscle is drawn once for the right
     half and placed twice inside one group — the shape and its mirror
     — so tapping either side selects the pair. A lifter never trains
     one pec.
     --------------------------------------------------------------- */

  /* ---------------------------------------------------------------
     THE FIGURE

     Seven and a half heads on a 52-unit head: crown y=10, chin 62,
     nipple line 114, navel 166, crotch 218, knee 296, sole 400.
     Shoulders 112 units across against a 54-unit waist, so the
     V-taper is in the silhouette before a single muscle is drawn, and
     the arms hang clear of the ribs so the flank and the arm outline
     both read.

     Centre line is x = 100. Every muscle is drawn once for the right
     half and placed twice inside one group -- the shape and its
     mirror -- so tapping either side selects the pair. A lifter never
     trains one pec.

     Fibre lines are specified, not drawn: `ax` gives the axis of a
     strap or spindle muscle and how many fibres to lay along it,
     `fan` gives the point every fibre converges on and the border
     they run from. They are clipped to the muscle, so the direction
     is what is authored and the extent takes care of itself.
     --------------------------------------------------------------- */

  /* THE OUTLINE.

     One continuous contour for the right half of the body, closed
     along the centre line at x = 100 and mirrored, plus one contour
     for the arm which overlaps the shoulder so no seam shows. Nothing
     is assembled from primitives: the edge changes direction at every
     joint and every muscle belly, because that is what makes an edge
     read as a body rather than a mannequin.

     Seven and a half heads: crown 12, chin 66, shoulder line 93,
     nipple 116, waist 160, crotch 206 (the midpoint of the figure),
     knee 301, ankle 385, sole 405. Elbows land at the waist, wrists
     at the crotch, fingertips at mid-thigh. */
  var SIL = [
    /* head, neck, trunk, leg, foot -- one path. The head narrows from
       the cranium through the cheekbone to a jaw, then the neck widens
       back out into the trapezius. */
    'M100 12 C111 12 121 21 122 34 C123 43 121 50 117 56 C114 60 110 64 108 68' +
    ' C107 71 110 75 116 79 C123 83 130 88 136 94 C140 99 143 104 143 112' +
    ' C143 121 141 130 138 139 C134 148 129 155 127 163 C126 172 128 181 131 190' +
    ' C134 196 137 202 137 210 C137 219 136 229 135 241 C133 257 130 274 126 289' +
    ' C124 294 123 297 123 301 C126 309 128 320 127 333 C126 347 122 359 117 371' +
    ' C115 377 114 381 114 386 C116 392 121 397 126 401 C128 403 127 406 122 406' +
    ' L105 406 C102 406 101 402 102 395 C103 389 105 384 105 378' +
    ' C103 367 102 356 102 344 C102 332 103 320 105 308 C107 302 108 298 107 292' +
    ' C105 276 103 258 102 240 C101 226 100 214 100 206 Z',
    /* arm and hand: the top edge is the trapezius slope, so the neck
       runs into the shoulder as a diagonal rather than a step. Deltoid
       cap, biceps belly, a narrow elbow, the forearm swell just below
       it, and a narrow wrist. The forearm carries inward so the hand
       falls beside the hip, not out in space. */
    'M110 72 C124 75 138 82 149 93 C153 99 155 106 154 113' +
    ' C153 120 152 124 152 129 C153 135 155 140 155 147' +
    ' C155 155 152 161 150 167 C152 173 155 179 157 187' +
    ' C159 194 160 201 159 209 C158 215 156 218 155 222' +
    ' C157 227 157 233 154 239 C152 243 148 245 146 241' +
    ' C144 237 144 232 145 226 C145 221 144 217 143 212' +
    ' C141 203 140 195 138 187 C136 180 136 174 136 168' +
    ' C136 160 136 154 135 147 C134 139 133 132 132 124' +
    ' C131 114 129 97 125 89 C123 84 117 78 110 72 Z',
    /* the trapezius wedge, entirely under the arm and the neck: it
       closes the seam where the two contours meet */
    'M106 65 C116 70 127 78 137 90 C128 93 116 89 108 85 C105 83 104 69 106 65 Z'
  ];

  /* One garment, both views: the front is covered, the back carries
     only the waistband, because a hem across the glutes would hide the
     muscle the group is named for. */
  var SHORTS = 'M100 188 C112 187 123 192 130 200 C133 205 134 210 132 214 C124 217 112 218 100 218 Z';
  var WAIST  = 'M100 180 C112 179 123 183 130 190 C132 193 132 197 130 198 C120 193 110 192 100 192 Z';

  /* ---------------- FRONT ----------------
     At body level every group is ONE continuous shape. The only
     internal detail is the fibre striation, which follows the muscle's
     true direction and gives the surface life without cutting it into
     plates. Subdivision belongs to the zoom, and only to the five
     groups the database actually divides.

     Order is draw order and hit-test order: a group declared later
     wins where two hit rectangles overlap. */

  var FRONT = [
    /* Upper trapezius as seen from the front: the slope from the neck
       to the acromion. */
    { g: 'back', d: 'M104 64 C114 69 124 77 134 88 C126 92 114 89 106 85 C103 83 103 70 104 64 Z',
      fan: [136, 89, [[104, 66], [104, 72], [104, 78], [107, 84]]] },

    /* Deltoid: one cap over the shoulder joint, fibres converging on
       the tuberosity. */
    { g: 'shoulders', d: 'M126 79 C137 82 147 90 152 101 C155 109 155 119 152 126 C149 131 144 132 141 127 C138 117 136 106 133 97 C131 89 128 82 126 79 Z',
      fan: [147, 130, [[127, 81], [132, 83], [138, 87], [145, 94], [150, 103]]] },

    /* Biceps: a spindle, fullest a third of the way down the upper
       arm, tapering into the elbow. */
    { g: 'biceps', d: 'M136 112 C147 118 154 132 155 148 C155 159 153 167 150 173 C147 179 141 179 140 172 C138 156 136 138 135 124 C135 116 135 113 136 112 Z',
      ax: [139, 115, 146, 176, 5, 17] },

    /* Forearm: full just below the elbow, tapering to a narrow wrist. */
    { g: 'forearms', d: 'M138 175 C148 180 155 193 158 207 C160 217 160 227 158 234 C156 240 149 240 148 232 C147 218 143 201 138 188 C135 181 135 177 138 175 Z',
      ax: [141, 178, 153, 236, 5, 17] },

    /* Pectoralis major: one fan, wide across the sternum, flatter at
       the clavicle, fuller below, every fibre converging on the
       armpit. */
    { g: 'chest', cls: 'whole',
      d: 'M100 79 C110 79 120 81 128 85 C133 89 137 95 137 102 C132 110 124 117 114 121 C108 122 104 122 100 122 Z',
      fan: [139, 102, [[100, 80], [109, 80], [118, 82], [127, 86], [100, 89], [100, 97], [100, 105], [100, 113], [100, 121]]] },

    /* The three regions of the pec, for the zoom only. They are cut on
       radial lines that all converge on the insertion at the armpit --
       the real fan of the muscle -- not on horizontal bars: the
       clavicular head above, the sternal head across, the costal head
       below. */
    { g: 'chest', part: 'upper', cls: 'pec',
      d: 'M100 79 C110 79 120 81 128 85 C133 89 137 95 137 102 C126 96 113 92 100 91 Z',
      fan: [139, 102, [[100, 80], [109, 80], [118, 82], [127, 86], [100, 85], [100, 90]]] },
    { g: 'chest', part: 'mid', cls: 'pec',
      d: 'M100 93 C112 94 125 99 137 104 C133 109 127 113 120 116 C112 112 106 110 100 109 Z',
      fan: [139, 103, [[100, 94], [100, 99], [100, 104], [100, 108]]] },
    { g: 'chest', part: 'lower', cls: 'pec',
      d: 'M100 111 C107 112 114 114 120 118 C113 121 106 122 100 122 Z',
      fan: [126, 117, [[100, 112], [100, 115], [100, 118], [100, 121]]] },

    /* Abdominal wall: one region, the rectus down the centre carrying
       into the oblique at the flank. Fibres run with it. */
    { g: 'abs', d: 'M100 133 C107 134 113 139 117 147 C120 155 120 166 119 176 C117 188 112 198 105 205 C102 207 100 207 100 204 Z',
      ax: [109, 138, 104, 203, 6, 18] },

    /* Quadriceps: one thigh mass, fullest high and outside, narrowing
       to the knee. */
    { g: 'quads', d: 'M100 212 C114 208 128 213 134 222 C136 238 133 258 128 277 C125 288 122 296 119 300 C112 303 105 303 101 300 C100 284 100 262 100 240 C100 226 100 218 100 212 Z',
      ax: [116, 216, 113, 298, 6, 28] },

    /* Inner and outer thigh: the adductor wedge along the inner
       thigh, drawn over the quadriceps it sits beside. */
    { g: 'adduc', d: 'M100 214 C105 216 108 224 109 236 C110 248 108 260 105 269 C103 274 100 276 100 276 Z',
      ax: [102, 217, 104, 272, 3, 7] },

    /* Calves from the front: the shin mass, full high and tapering to
       the ankle. */
    { g: 'calves', d: 'M104 306 C114 303 124 306 127 314 C128 328 126 344 122 358 C119 369 116 376 114 380 C110 382 106 381 105 377 C104 362 103 340 103 324 C103 314 103 308 104 306 Z',
      ax: [114, 309, 110, 379, 5, 20] }
  ];

  /* ---------------- BACK ---------------- */

  var BACK = [
    /* Back: one mass -- trapezius over the shoulders, latissimus
       sweeping down and in, erectors at the base. Every fibre runs to
       the humeral insertion under the armpit, which is what gives the
       V. */
    { g: 'back', d: 'M100 62 C112 64 123 73 131 84 C135 90 137 96 136 104 C135 116 133 128 129 140 C125 156 118 172 109 186 C105 193 102 198 100 200 Z',
      fan: [137, 102, [[100, 64], [100, 78], [100, 94], [100, 112], [100, 132], [100, 154], [100, 176], [100, 196], [108, 188]]] },

    /* Deltoid, rear. */
    { g: 'shoulders', d: 'M126 79 C137 82 147 90 152 101 C155 109 155 119 152 126 C149 131 144 132 141 127 C138 117 136 106 133 97 C131 89 128 82 126 79 Z',
      fan: [147, 130, [[127, 81], [132, 83], [138, 87], [145, 94], [150, 103]]] },

    /* Triceps: one three-headed mass, fuller at the top, tapering
       into the tendon above the elbow. */
    { g: 'triceps', d: 'M135 110 C147 116 154 131 155 147 C155 159 153 168 150 175 C147 182 141 182 140 173 C138 157 136 136 135 122 C135 114 134 111 135 110 Z',
      ax: [139, 113, 147, 179, 5, 18] },

    /* Forearm extensors. */
    { g: 'forearms', d: 'M138 177 C148 182 155 195 158 209 C160 219 160 229 158 236 C156 242 149 242 148 234 C147 220 143 203 138 190 C135 183 135 179 138 177 Z',
      ax: [141, 180, 153, 238, 5, 17] },

    /* Gluteus maximus: a rounded mass, wider than it is tall. */
    { g: 'glutes', d: 'M100 188 C113 186 126 193 133 203 C138 211 137 224 131 232 C124 241 112 245 103 243 C101 242 100 239 100 235 Z',
      fan: [137, 226, [[100, 190], [100, 200], [100, 212], [100, 224], [102, 240]]] },

    /* Hamstrings: one mass from the fold to the knee. */
    { g: 'hams', d: 'M102 234 C114 231 127 235 132 243 C134 258 131 276 126 290 C123 297 120 301 117 302 C110 304 105 303 103 300 C102 286 101 268 101 252 C101 242 101 236 102 234 Z',
      ax: [117, 238, 114, 300, 5, 26] },

    /* Calves: the gastrocnemius mass, high and full, tapering into
       the Achilles. */
    { g: 'calves', d: 'M103 304 C114 301 124 305 127 314 C129 328 126 346 121 360 C118 370 115 377 113 381 C109 383 106 381 105 377 C104 360 103 340 103 324 Z',
      ax: [114, 307, 110, 379, 5, 22] }
  ];

  /* ---------------------------------------------------------------
     The twelve groups, straight from the exercise database, with the
     sub-regions the five divisible ones hold. A group with no
     sub-regions goes from selection to its exercises without a zoom.
     --------------------------------------------------------------- */
  var GROUPS = {
    chest:    { name: 'Chest',     n: 30, subs: ['Upper Chest', 'Mid Chest', 'Lower Chest'], last: 'Trained 3 days ago · Incline DB Press 32 kg' },
    back:     { name: 'Back',      n: 40, subs: ['Lats', 'Mid Back', 'Lower Back', 'Traps'], last: 'Trained 2 days ago · Barbell Row 80 kg' },
    shoulders:{ name: 'Shoulders', n: 29, subs: ['Front Delt', 'Side Delt', 'Rear Delt'], last: 'Trained 5 days ago · DB Lateral Raise 12 kg' },
    triceps:  { name: 'Triceps',   n: 30, subs: ['Long Head', 'Lateral Head', 'Medial Head'], last: 'Trained 5 days ago · Rope Pushdown 30 kg' },
    biceps:   { name: 'Biceps',    n: 20, subs: ['Long Head', 'Short Head'], last: 'Trained 5 days ago · EZ Bar Curl 35 kg' },
    forearms: { name: 'Forearms',  n: 8,  subs: null, last: 'Trained 9 days ago · Wrist Curl 20 kg' },
    quads:    { name: 'Quads',     n: 9,  subs: null, last: 'Trained 6 days ago · Back Squat 120 kg' },
    hams:     { name: 'Hamstrings',n: 10, subs: null, last: 'Trained 6 days ago · Romanian Deadlift 90 kg' },
    glutes:   { name: 'Glutes',    n: 10, subs: null, last: 'Trained 6 days ago · Hip Thrust 140 kg' },
    adduc:    { name: 'Inner/Outer Thigh', n: 10, subs: null, last: 'Trained 12 days ago · Hip Abduction 55 kg' },
    abs:      { name: 'Abs',       n: 20, subs: ['Weighted', 'Bodyweight'], last: 'Trained 8 days ago · Cable Crunch 45 kg' },
    calves:   { name: 'Calves',    n: 9,  subs: null, last: 'Trained 6 days ago · Standing Calf Raise 90 kg' }
  };
  var ORDER = ['chest', 'back', 'shoulders', 'triceps', 'biceps', 'forearms',
               'quads', 'hams', 'glutes', 'adduc', 'abs', 'calves'];

  /* Label pictograms, on the same 24-unit grid and the same stroke
     weight as the icons in components.css. Each is a mark for the
     shape of the muscle, not a picture of it. */
  var ICO = {
    chest:    'M12 7 C7 7 4 9 4 12 C4 16 8 18 12 18 M12 7 C17 7 20 9 20 12 C20 16 16 18 12 18',
    back:     'M5 5 L12 19 L19 5',
    shoulders:'M4 17 C4 8 20 8 20 17',
    triceps:  'M4 7 C5 15 8 17 12 17 C16 17 19 15 20 7',
    biceps:   'M4 17 C5 9 8 7 12 7 C16 7 19 9 20 17',
    forearms: 'M5 6 L19 12 L5 18',
    quads:    'M8 5 C7 11 7 15 8 19 M12 5 L12 19 M16 5 C17 11 17 15 16 19',
    hams:     'M9 5 C7 11 8 15 10 19 M15 5 C17 11 16 15 14 19',
    glutes:   'M5 12 C5 7 10 5 14 7 C18 9 18 17 13 18 C8 19 5 16 5 12 Z',
    adduc:    'M9 5 L9 19 M15 5 L15 19 M3 12 L6 12 M18 12 L21 12',
    abs:      'M12 5 L12 19 M7 9 L17 9 M7 14 L17 14',
    calves:   'M12 4 C16 8 16 16 12 20 C8 16 8 8 12 4 Z'
  };

  /* One label per group per view: which side it sits on, where its
     leader lands on the muscle, and where its row sits in the column.
     Only one is ever visible, so the column is a place, not a list. */
  var LABELS = {
    front: {
      back:      ['R', 130,  84,  76],
      shoulders: ['R', 147, 102,  98],
      biceps:    ['R', 147, 142, 142],
      forearms:  ['R', 152, 206, 204],
      chest:     ['L', 118, 106, 106],
      abs:       ['L', 112, 168, 168],
      quads:     ['L', 120, 250, 248],
      adduc:     ['L', 106, 244, 300],
      calves:    ['R', 118, 340, 338]
    },
    back: {
      shoulders: ['R', 147, 102,  98],
      triceps:   ['R', 148, 142, 142],
      forearms:  ['R', 152, 208, 206],
      back:      ['L', 122, 140, 140],
      glutes:    ['L', 118, 212, 210],
      hams:      ['L', 116, 264, 262],
      calves:    ['R', 118, 338, 336]
    }
  };

  /* Hit areas. The drawn biceps is 19 units across, about 31 CSS px on
     this frame, so every group carries invisible rectangles -- sized
     and ordered so each group keeps at least one 44 by 44 target once
     the overlaps are resolved. Later entries win. */
  var HITS = {
    front: [
      ['shoulders', 124,  76, 30, 44],
      ['biceps',    130, 110, 29, 62],
      ['forearms',  132, 174, 29, 60],
      ['chest',     100,  78, 34, 60],
      ['abs',       100, 140, 30, 62],
      ['quads',     108, 214, 30, 86],
      ['adduc',     100, 212, 28, 60],
      ['calves',    100, 304, 29, 74],
      ['back',      103,  48, 30, 34]
    ],
    back: [
      ['back',      100,  58, 38, 140],
      ['shoulders', 124,  76, 30, 44],
      ['triceps',   130, 108, 29, 66],
      ['forearms',  132, 176, 29, 60],
      ['glutes',    100, 186, 32, 50],
      ['hams',      102, 236, 30, 60],
      ['calves',    100, 302, 29, 76]
    ]
  };

  var MIRROR = 'matrix(-1 0 0 1 200 0)';
  var NS = 'http://www.w3.org/2000/svg';
  var defs = document.getElementById('defs');
  var uid = 0;

  function n2(v) { return Math.round(v * 10) / 10; }

  /* Fibre lines from a spec rather than by hand, so the direction is
     what is authored and every muscle in the figure is striated the
     same way. `ax` lays n fibres along an axis, spread w across it,
     each bowed slightly outward; `fan` runs a fibre from each point
     on a border to the point the muscle converges on. Both overshoot
     and are clipped to the muscle. */
  function fibres(m) {
    var out = [];
    if (m.ax) {
      var x1 = m.ax[0], y1 = m.ax[1], x2 = m.ax[2], y2 = m.ax[3], n = m.ax[4], w = m.ax[5];
      var dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy) || 1;
      var px = -dy / L, py = dx / L;
      for (var i = 0; i < n; i++) {
        var t = (n === 1 ? 0 : i / (n - 1) - 0.5), o = t * w;
        var ax = x1 + px * o, ay = y1 + py * o, bx = x2 + px * o, by = y2 + py * o;
        var cx = (ax + bx) / 2 + px * o * 0.4, cy = (ay + by) / 2 + py * o * 0.4;
        out.push('M' + n2(ax) + ' ' + n2(ay) + ' Q' + n2(cx) + ' ' + n2(cy) +
                 ' ' + n2(bx) + ' ' + n2(by));
      }
    }
    if (m.fan) {
      var fx = m.fan[0], fy = m.fan[1];
      m.fan[2].forEach(function (p) {
        var mx = (p[0] + fx) / 2, my = (p[1] + fy) / 2;
        var vx = fx - p[0], vy = fy - p[1], l = Math.sqrt(vx * vx + vy * vy) || 1;
        out.push('M' + n2(p[0]) + ' ' + n2(p[1]) + ' Q' + n2(mx - vy / l * 3) + ' ' +
                 n2(my + vx / l * 3) + ' ' + n2(fx) + ' ' + n2(fy));
      });
    }
    return out;
  }

  function el(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    return n;
  }

  /* Generate the per-group fill rules from the palette, so the twelve
     hues are declared once, in tokens.css, and nowhere else. */
  (function hues() {
    var css = ORDER.map(function (gid) {
      var v = 'var(--anat-' + gid + ')';
      return '.mg--' + gid + ' .mg__lit { fill: ' + v + '; }\n' +
             '.mg--' + gid + ' .mg__gnd { fill: color-mix(in srgb, ' + v + ' 45%, #000); }\n' +
             '.mg--' + gid + ' .fib { stroke: color-mix(in srgb, ' + v + ' 45%, #000); }\n' +
             '.lab--' + gid + ' { color: ' + v + '; }\n' +
             '.pick__dot--' + gid + ' { background: ' + v + '; }';
    }).join('\n');
    document.getElementById('hues').textContent = css;
  })();

  /* One muscle, drawn twice: the shape and its mirror. Inside each
     side, the dark ground, then the hue offset toward the light and
     clipped back to the ground, then the fibre lines. The offset is
     flipped on the mirrored side so both halves are lit from the same
     direction on screen. */
  function muscle(host, m, cls, part) {
    var clip = 'm' + (++uid);
    var cp = el('clipPath', { id: clip });
    cp.appendChild(el('path', { d: m.d }));
    defs.appendChild(cp);
    var off = m.sm ? 0.9 : 2.2, offY = m.sm ? 0.8 : 1.8;
    [[null, -off], [MIRROR, off]].forEach(function (s) {
      var side = el('g', { transform: s[0] });
      side.appendChild(el('path', { d: m.d, class: 'mg__gnd' }));
      var inner = el('g', { 'clip-path': 'url(#' + clip + ')' });
      inner.appendChild(el('path', { d: m.d, class: 'mg__lit',
        transform: 'translate(' + s[1] + ' ' + (-offY) + ')' }));
      fibres(m).forEach(function (d) { inner.appendChild(el('path', { d: d, class: 'fib' })); });
      side.appendChild(inner);
      var wrap = el('g', { class: cls });
      wrap.appendChild(side);
      if (part) wrap.setAttribute('data-part', part);
      host.appendChild(wrap);
    });
  }

  function plain(host, paths, cls) {
    paths.forEach(function (d) {
      [null, MIRROR].forEach(function (t) {
        host.appendChild(el('path', { d: d, class: cls, transform: t }));
      });
    });
  }

  function buildView(host, list, hits) {
    var made = {};
    function groupFor(gid) {
      if (made[gid]) return made[gid];
      var g = el('g', {
        class: 'mg mg--' + gid, tabindex: '0', role: 'button',
        'data-g': gid, 'data-testid': 'mg-' + gid,
        'aria-label': GROUPS[gid].name + ', ' + GROUPS[gid].n + ' exercises'
      });
      host.appendChild(g);
      made[gid] = g;
      return g;
    }
    list.forEach(function (m) {
      var g = groupFor(m.g);
      if (m.part) {
        var pg = el('g', { class: 'part', 'data-part': m.part, tabindex: '-1', role: 'button',
          'aria-label': m.part + ' chest' });
        muscle(pg, m, m.cls || '', m.part);
        g.appendChild(pg);
      } else {
        muscle(g, m, m.cls || '', null);
      }
    });
    hits.forEach(function (h) {
      [null, MIRROR].forEach(function (t) {
        groupFor(h[0]).appendChild(el('rect', { class: 'hit', x: h[1], y: h[2],
          width: h[3], height: h[4], transform: t }));
      });
    });
  }

  plain(document.getElementById('f-base'), SIL, 'sil');
  plain(document.getElementById('b-base'), SIL, 'sil');
  buildView(document.getElementById('f-groups'), FRONT, HITS.front);
  buildView(document.getElementById('b-groups'), BACK, HITS.back);
  plain(document.getElementById('f-wear'), [SHORTS], 'shorts');
  plain(document.getElementById('b-wear'), [WAIST], 'shorts');

  /* Labels: disc, pictogram, name, and a hairline leader to a dot on
     the muscle. Left-hand labels read disc-then-name toward the body;
     right-hand labels mirror that, so both columns read outward-in. */
  var COL_L = -10, COL_R = 218, R = 8;
  var LAB = [];

  function buildLabels(host, set) {
    Object.keys(set).forEach(function (gid) {
      var L = set[gid], left = L[0] === 'L';
      var ax = left ? 200 - L[1] : L[1], ay = L[2], cy = L[3];
      var g = el('g', { class: 'lab lab--' + gid, 'data-g': gid });
      var dx = left ? COL_L + R : COL_R - R;               /* disc centre */
      var tx = left ? dx + R + 5 : dx - R - 5;             /* text edge */
      var line = el('path', { class: 'lab__line' });
      g.appendChild(line);
      g.appendChild(el('circle', { class: 'lab__dot', cx: ax, cy: ay, r: 2 }));
      g.appendChild(el('circle', { class: 'lab__disc', cx: dx, cy: cy, r: R }));
      var ig = el('g', { transform: 'translate(' + (dx - R * 0.78) + ' ' + (cy - R * 0.78) +
        ') scale(' + (R * 1.56 / 24) + ')' });
      ig.appendChild(el('path', { class: 'lab__ico', d: ICO[gid] }));
      g.appendChild(ig);
      var t = el('text', { class: 'lab__t', x: tx, y: cy, 'text-anchor': left ? 'start' : 'end' });
      t.textContent = GROUPS[gid].name;
      g.appendChild(t);
      host.appendChild(g);
      LAB.push({ line: line, text: t, tx: tx, cy: cy, ax: ax, ay: ay, left: left });
    });
  }

  /* The leader starts where the name ends, so a short name is not left
     with a stub and a long one is not overrun. Measured after the type
     is sized, because the type size is measured too. */
  function layoutLabels() {
    LAB.forEach(function (L) {
      var w = 0;
      try { w = L.text.getComputedTextLength(); } catch (e) { w = 40; }
      var end = L.left ? L.tx + w + 4 : L.tx - w - 4;
      var bend = L.left ? end + 8 : end - 8;
      L.line.setAttribute('d', 'M' + n2(end) + ' ' + L.cy + ' L' + n2(bend) + ' ' + L.cy +
        ' L' + L.ax + ' ' + L.ay);
    });
  }

  buildLabels(document.getElementById('labs-front'), LABELS.front);
  buildLabels(document.getElementById('labs-back'), LABELS.back);

  /* ---------------------------------------------------------------
     State
     --------------------------------------------------------------- */
  var S = { stage: 'body', view: 'front', gid: null };

  var map = document.getElementById('map'),
      svg = document.getElementById('svg'),
      cam = document.getElementById('cam'),
      pick = document.getElementById('pick'),
      hdr = document.getElementById('hdr'),
      list = document.getElementById('list'),
      rotate = document.getElementById('rotate'),
      zlabs = document.getElementById('zlabs');

  var EX = [
    ['Incline Barbell Press', 'Barbell', '70 kg'],
    ['Incline DB Press', 'Dumbbell', '32 kg'],
    ['Incline Cable Fly', 'Cable', '15 kg'],
    ['Incline Machine Press', 'Machine', '55 kg'],
    ['Smith Machine Incline', 'Smith Machine', '60 kg'],
    ['Low-to-High Cable Fly', 'Cable', '12.5 kg'],
    ['Incline DB Fly', 'Dumbbell', '16 kg'],
    ['Landmine Press', 'Barbell', '30 kg'],
    ['Incline Push Up', 'Bodyweight', ''],
    ['Cable Upper Chest Crossover', 'Cable', '14 kg']
  ];

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function chev() {
    return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  }
  function backIco() {
    return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
  }

  function renderHeader() {
    var title = 'Body map', sub = 'Tap a muscle group', back = null;
    if (S.stage === 'selected') { sub = GROUPS[S.gid].name + ' selected'; }
    if (S.stage === 'zoom') { title = GROUPS[S.gid].name; sub = 'Tap a region'; back = 'Body'; }
    if (S.stage === 'list') { title = 'Upper Chest'; sub = '10 exercises'; back = 'Chest'; }
    hdr.innerHTML =
      (back ? '<button class="hdr__back" type="button" data-action="back" aria-label="Back to ' + esc(back) + '">' + backIco() + '</button>' : '') +
      '<div class="hdr__title"><h1 class="t-section">' + esc(title) + '</h1>' +
      '<p class="t-meta">' + esc(sub) + '</p></div>';
  }

  /* The card names what the tap will do. A group with sub-regions
     opens into them; a group without them goes to its exercises, and
     says so, so the path is never a dead end. */
  function renderPick() {
    if (!S.gid) { pick.innerHTML = ''; return; }
    var g = GROUPS[S.gid];
    var act = g.subs ? 'Open ' + g.name : 'See ' + g.n + ' exercises';
    pick.innerHTML =
      '<div class="hstack hstack--2"><span class="pick__dot pick__dot--' + S.gid + '"></span>' +
        '<h2 class="t-section grow truncate">' + esc(g.name) + '</h2>' +
        '<span class="t-meta" data-num>' + g.n + ' exercises</span></div>' +
      '<p class="t-detail mt-2">' + esc(g.last) + '</p>' +
      (g.subs ? '<p class="t-meta mt-2">' + esc(g.subs.join(' · ')) + '</p>' : '') +
      '<button class="btn btn--primary btn--block mt-3" type="button" data-action="open">' +
        '<span class="btn__label">' + esc(act) + '</span></button>';
  }

  function renderList() {
    list.innerHTML =
      '<div class="listhead"><h2 class="t-label">Upper chest</h2><span class="t-meta" data-num>10</span></div>' +
      '<div class="card card--flush gutter">' + EX.map(function (x) {
        return '<button class="row" type="button">' +
          '<span class="row__main stack"><span class="row__title">' + esc(x[0]) + '</span>' +
          '<span class="row__sub truncate">Chest &middot; Upper &middot; ' + esc(x[1]) + '</span></span>' +
          (x[2] ? '<span class="row__value">' + esc(x[2]) + '</span>' : '') +
          '<span class="row__chev">' + chev() + '</span></button>';
      }).join('') + '</div>';
  }

  /* Zoom camera: the pec pair centres on (100, 112) and fills the
     frame, leaving the right gutter for the part labels. */
  function camera() {
    return S.stage === 'zoom'
      ? 'translate(' + ZCAM.x + ' ' + ZCAM.y + ') scale(' + ZCAM.k + ') translate(-' + ZCAM.ox + ' -' + ZCAM.oy + ')'
      : 'translate(0 0) scale(1)';
  }

  /* The zoomed camera and the three part labels are one piece of
     geometry: the camera is fixed, so the point each leader lands on
     is the band's own outer edge put through the same transform. That
     keeps the three labels in a true column instead of wherever a
     measured bounding box happens to fall. */
  var ZCAM = { x: 80, y: 209, k: 2.1, ox: 100, oy: 109 };
  var ZPART = [['Upper', 10, 134, 92], ['Mid', 10, 137, 113], ['Lower', 10, 127, 130]];
  var ZCOL = 176;

  function placeZoomLabels() {
    zlabs.textContent = '';
    if (S.stage !== 'zoom') return;
    ZPART.forEach(function (P) {
      var ax = ZCAM.x + (P[2] - ZCAM.ox) * ZCAM.k;
      var ay = ZCAM.y + (P[3] - ZCAM.oy) * ZCAM.k;
      var g = el('g', { class: 'lab', style: 'opacity:1' });
      g.appendChild(el('path', { class: 'lab__line',
        d: 'M' + n2(ax) + ' ' + n2(ay) + ' L' + n2(ZCOL - 6) + ' ' + n2(ay) }));
      g.appendChild(el('circle', { class: 'lab__dot', cx: n2(ax), cy: n2(ay), r: 2.5 }));
      var t = el('text', { class: 'zlab__t', x: ZCOL, y: n2(ay), 'text-anchor': 'start' });
      t.textContent = P[0];
      var n = el('tspan', { class: 'zlab__n', dx: 6 });
      n.textContent = P[1];
      t.appendChild(n);
      g.appendChild(t);
      zlabs.appendChild(g);
    });
    sizeType();
  }

  /* Type is set at the 11px step of the scale as measured on screen:
     the user-unit size is 11 divided by the current viewBox scale, so
     the rendered size is the token and not whatever the viewBox
     happens to magnify. */
  function sizeType() {
    var box = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    if (!box.width || !vb.width) return;
    var s = Math.min(box.width / vb.width, box.height / vb.height);
    var px = (11 / s) + 'px';
    Array.prototype.forEach.call(document.querySelectorAll('.lab__t, .zlab__t'), function (t) {
      t.style.fontSize = px;
    });
    layoutLabels();
  }
  window.addEventListener('resize', function () { sizeType(); placeZoomLabels(); });

  function render() {
    renderHeader();
    map.toggleAttribute('data-zoom', S.stage === 'zoom');
    if (S.gid) map.setAttribute('data-selected', S.gid); else map.removeAttribute('data-selected');
    Array.prototype.forEach.call(document.querySelectorAll('.mg, .lab[data-g]'), function (g) {
      if (g.getAttribute('data-g') === S.gid) g.setAttribute('data-on', ''); else g.removeAttribute('data-on');
    });
    cam.setAttribute('transform', camera());
    document.getElementById('view-front').setAttribute('data-hidden', S.view === 'front' ? 'false' : 'true');
    document.getElementById('view-back').setAttribute('data-hidden', S.view === 'back' ? 'false' : 'true');
    document.getElementById('labs-front').style.display = S.view === 'front' ? '' : 'none';
    document.getElementById('labs-back').style.display = S.view === 'back' ? '' : 'none';
    document.getElementById('tab-front').setAttribute('aria-selected', S.view === 'front');
    document.getElementById('tab-back').setAttribute('aria-selected', S.view === 'back');

    pick.setAttribute('data-open', S.stage === 'selected' ? 'true' : 'false');
    renderPick();

    rotate.hidden = S.stage !== 'body';
    list.hidden = S.stage !== 'list';
    map.classList.toggle('map--strip', S.stage === 'list');
    if (S.stage === 'list') map.setAttribute('data-part', 'upper'); else map.removeAttribute('data-part');
    svg.setAttribute('viewBox', S.stage === 'list' ? '56 76 88 66' : '-16 8 240 402');
    if (S.stage === 'list') renderList();
    requestAnimationFrame(function () { sizeType(); placeZoomLabels(); });
  }

  /* ---------------------------------------------------------------
     Behaviour
     --------------------------------------------------------------- */
  function select(gid) { S.gid = gid; S.stage = 'selected'; render(); }

  document.addEventListener('click', function (e) {
    var mg = e.target.closest ? e.target.closest('.mg') : null;
    var act = e.target.closest ? e.target.closest('[data-action]') : null;
    if (act) {
      var a = act.getAttribute('data-action');
      if (a === 'open') { S.stage = GROUPS[S.gid].subs ? 'zoom' : 'list'; render(); return; }
      if (a === 'back') { S.stage = S.stage === 'list' && GROUPS[S.gid].subs ? 'zoom' : 'selected'; render(); return; }
    }
    if (e.target.closest('.part') && S.stage === 'zoom') { S.stage = 'list'; render(); return; }
    if (mg) { select(mg.getAttribute('data-g')); return; }
    if (e.target.id === 'tab-front') { S.view = 'front'; S.gid = null; S.stage = 'body'; render(); }
    if (e.target.id === 'tab-back') { S.view = 'back'; S.gid = null; S.stage = 'body'; render(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var mg = e.target.closest && e.target.closest('.mg');
    if (mg) { e.preventDefault(); select(mg.getAttribute('data-g')); }
  });

  /* Stage, view and group are addressable so each can be captured. */
  var p = new URLSearchParams(location.search);
  /* ?sil=1 hides every fill so the outline can be judged on its own. */
  if (p.get('sil')) {
    document.getElementById('f-groups').style.display = 'none';
    document.getElementById('b-groups').style.display = 'none';
    document.getElementById('f-wear').style.display = 'none';
    document.getElementById('b-wear').style.display = 'none';
  }
  S.view = p.get('view') === 'back' ? 'back' : 'front';
  var st = p.get('stage');
  if (st === 'selected' || st === 'zoom' || st === 'list') {
    S.stage = st;
    S.gid = GROUPS[p.get('g')] ? p.get('g') : 'chest';
  }
  render();
  requestAnimationFrame(function () { window.__ready = true; });
})();
</script>
</body>
