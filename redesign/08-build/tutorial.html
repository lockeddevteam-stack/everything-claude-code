<title>LOCKED — First run</title>
<!-- INSTALLABLE, ON ITS OWN. 10-final/assemble.mjs puts a manifest and the
     apple metas into the assembled demo; opened as a standalone screen this
     file had neither, so a phone that installed it got a browser bookmark
     with a screenshot for an icon. The manifest is a data URL rather than a
     file beside it so the screen stays one file and works from file://. -->
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22LOCKED%22%2C%22short_name%22%3A%22LOCKED%22%2C%22description%22%3A%22Training%2C%20food%20and%20recovery%2C%20on%20your%20phone%2C%20on%20your%20device.%22%2C%22start_url%22%3A%22.%2F%22%2C%22scope%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22portrait%22%2C%22background_color%22%3A%22%230b0b0c%22%2C%22theme_color%22%3A%22%230b0b0c%22%2C%22categories%22%3A%5B%22health%22%2C%22fitness%22%5D%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2522http%253A%252F%252Fwww.w3.org%252F2000%252Fsvg%2522%2520viewBox%253D%25220%25200%2520512%2520512%2522%253E%253Crect%2520width%253D%2522512%2522%2520height%253D%2522512%2522%2520rx%253D%2522114%2522%2520fill%253D%2522%25230b0b0c%2522%252F%253E%253Crect%2520x%253D%2522150%2522%2520y%253D%2522150%2522%2520width%253D%2522212%2522%2520height%253D%2522212%2522%2520rx%253D%252246%2522%2520fill%253D%2522none%2522%2520stroke%253D%2522%2523f2f2f4%2522%2520stroke-width%253D%252234%2522%252F%253E%253Crect%2520x%253D%2522222%2522%2520y%253D%2522222%2522%2520width%253D%252268%2522%2520height%253D%252268%2522%2520rx%253D%252218%2522%2520fill%253D%2522%2523f2f2f4%2522%252F%253E%253C%252Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%22%7D%2C%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2522http%253A%252F%252Fwww.w3.org%252F2000%252Fsvg%2522%2520viewBox%253D%25220%25200%2520512%2520512%2522%253E%253Crect%2520width%253D%2522512%2522%2520height%253D%2522512%2522%2520rx%253D%2522114%2522%2520fill%253D%2522%25230b0b0c%2522%252F%253E%253Crect%2520x%253D%2522150%2522%2520y%253D%2522150%2522%2520width%253D%2522212%2522%2520height%253D%2522212%2522%2520rx%253D%252246%2522%2520fill%253D%2522none%2522%2520stroke%253D%2522%2523f2f2f4%2522%2520stroke-width%253D%252234%2522%252F%253E%253Crect%2520x%253D%2522222%2522%2520y%253D%2522222%2522%2520width%253D%252268%2522%2520height%253D%252268%2522%2520rx%253D%252218%2522%2520fill%253D%2522%2523f2f2f4%2522%252F%253E%253C%252Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22maskable%22%7D%5D%7D">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22114%22%20fill%3D%22%230b0b0c%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22150%22%20width%3D%22212%22%20height%3D%22212%22%20rx%3D%2246%22%20fill%3D%22none%22%20stroke%3D%22%23f2f2f4%22%20stroke-width%3D%2234%22%2F%3E%3Crect%20x%3D%22222%22%20y%3D%22222%22%20width%3D%2268%22%20height%3D%2268%22%20rx%3D%2218%22%20fill%3D%22%23f2f2f4%22%2F%3E%3C%2Fsvg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22114%22%20fill%3D%22%230b0b0c%22%2F%3E%3Crect%20x%3D%22150%22%20y%3D%22150%22%20width%3D%22212%22%20height%3D%22212%22%20rx%3D%2246%22%20fill%3D%22none%22%20stroke%3D%22%23f2f2f4%22%20stroke-width%3D%2234%22%2F%3E%3Crect%20x%3D%22222%22%20y%3D%22222%22%20width%3D%2268%22%20height%3D%2268%22%20rx%3D%2218%22%20fill%3D%22%23f2f2f4%22%2F%3E%3C%2Fsvg%3E">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LOCKED">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark light">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="LOCKED. Training, food and recovery, on your phone, on your device.">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="fixtures.js"></script>
<script src="store.js"></script>
<script src="units.js"></script>
<script src="app.js"></script>
<script src="chrome.js"></script>
</head>
<body>
<!--
  TUTORIAL — the first-run walkthrough.

  WHY IT IS BACK. The Apple directive cut it along with every other overlay,
  and the parity pass found that a new account now arrives at Home with no
  introduction at all. The owner asked for the animation specifically, so it
  is the animation that has been rebuilt, not a static help page.

  WHAT IT SAYS, AND WHAT IT NO LONGER SAYS. The shipped version had seven
  hardcoded cards, one of which promised "Voice mode reads your numbers back
  so you never look away from the bar" (:54251). The audit found nothing in
  the app that does that, and the redesign cut the voice button outright. A
  tutorial that teaches a feature the app does not have is worse than no
  tutorial: it is the first thing a new user is told, and it is false. The
  cards here are the five tabs, and each one describes something that
  exists on the screen it names.

  THE ANIMATION. Intro types LOCKED a letter at a time over a grid that
  drifts, then the five cards deal in, each title typing and its three lines
  rising behind it. Under prefers-reduced-motion none of it runs: the text
  is simply there, the grid is still, and the pacing controls become a plain
  list. That is not a degraded path, it is the same content without the
  motion, which is the only version of reduced motion worth shipping.

  IT IS SKIPPABLE FROM THE FIRST FRAME. A walkthrough you cannot leave is a
  wall. Skip is present on every screen of it, at full contrast, not hidden
  as faint text under the primary.

  GATE: lk_tutorialSeen. Written on finish AND on skip -- the shipped app
  wrote it only on completion, so skipping meant seeing it again next launch.
-->

<div class="stage">
  <div class="phone">
    <div class="screen tut" id="screen" data-testid="screen-tutorial" data-state="intro">

      <div class="tut__grid" id="grid" aria-hidden="true"></div>

      <main class="body tut__body" id="body" data-testid="tutorial-scroll" tabindex="-1"></main>

      <!-- A landmark. These are the controls that move through the
           walkthrough, and content outside every landmark is what axe's
           region rule exists to catch. -->
      <nav class="tut__foot gutter" id="foot" aria-label="Walkthrough"></nav>
      <div id="live" class="vis-hidden" role="status" aria-live="polite"></div>

    </div>
  </div>
</div>

<div class="dev">
  <button class="dev__toggle" id="dev-toggle" aria-expanded="false" aria-controls="dev-menu" data-testid="dev-toggle">State</button>
  <div class="dev__menu" id="dev-menu" hidden data-testid="dev-menu"></div>
</div>

<script>
(function () {
  'use strict';

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* The five tabs. Every line names something on the screen it belongs to;
     nothing here describes a feature the build does not carry. */
  var CARDS = [
    { tab: 'Home', title: 'Train today, or not',
      lines: ['The session you are meant to do, one tap from the top.',
              'Weeks on plan, and the week so far, in one band.',
              'Recap opens the day, the week and the month.'],
      tag: 'Start here' },
    { tab: 'Train', title: 'The whole session',
      lines: ['Log weight and reps inline. No dialog, no save button.',
              'Every row carries what you lifted last time.',
              'The library and your history live in the same tab.'],
      tag: 'The core loop' },
    { tab: 'Fuel', title: 'What you ate',
      lines: ['Scan a barcode or search, and it logs in two taps.',
              'Recipes divide themselves into servings.',
              'Shopping and the budget sit behind the same tab.'],
      tag: 'Two taps' },
    { tab: 'Coach', title: 'Someone to ask',
      lines: ['Chat, and a plan that is bound to a real split.',
              'A weekly check-in: energy, sleep, soreness, stress.',
              'Plans save as cards, so good advice does not scroll away.'],
      tag: 'Weekly' },
    /* Rewritten against the screens. Three of these lines described things
       the build does not do: goals cannot be edited in place (they are added
       and measured, on Progress), the weight unit is a choice in Settings
       rather than something that follows the system, and sync is a button you
       press rather than a switch you turn on. A tutorial is the first thing a
       new reader is told; a false line there is worse than no line. */
    { tab: 'Profile', title: 'Yours to set',
      lines: ['Goals sit under Progress, each one measured against a number.',
              'Appearance and text size follow the system until you choose.',
              'Everything stays on this device until you press Sync.'],
      tag: 'Settings live here' }
  ];

  var S = { phase: 'intro', i: 0, typed: 0, lines: 0 };

  var screen = document.getElementById('screen');
  var body = document.getElementById('body');
  var foot = document.getElementById('foot');
  var grid = document.getElementById('grid');
  var live = document.getElementById('live');
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function say(m) { live.textContent = m; }

  /* The drifting grid. Drawn once as cells rather than a background image so
     it can be dimmed per phase without a second asset. */
  (function drawGrid() {
    var cells = '';
    for (var i = 0; i < 96; i++) cells += '<span></span>';
    grid.innerHTML = cells;
  })();

  var timer = null;
  function stop() { clearTimeout(timer); timer = null; }

  /* ---------------------------------------------------------------
     Intro
     --------------------------------------------------------------- */
  var WORD = 'LOCKED';

  function introHTML() {
    var shown = reduced ? WORD : WORD.slice(0, S.typed);
    return '<div class="tut__intro">' +
      '<h1 class="tut__word" data-testid="tut-word">' + esc(shown) +
        (reduced || S.typed >= WORD.length ? '' : '<span class="tut__caret" aria-hidden="true"></span>') +
      '</h1>' +
      '<p class="tut__tag' + (reduced || S.typed >= WORD.length ? ' is-in' : '') + '">Your training. Locked in.</p>' +
    '</div>';
  }

  function typeIntro() {
    if (reduced) { S.typed = WORD.length; paint(); return; }
    S.typed = 0;
    (function step() {
      paint();
      if (S.typed >= WORD.length) return;
      S.typed++;
      timer = setTimeout(step, 110);
    })();
  }

  /* ---------------------------------------------------------------
     Cards
     --------------------------------------------------------------- */
  function cardHTML() {
    var c = CARDS[S.i];
    var title = reduced ? c.title : c.title.slice(0, S.typed);
    return '<div class="tut__card" data-testid="tut-card-' + S.i + '">' +
      '<p class="tut__tab">' + esc(c.tab) + '</p>' +
      /* h1, not h2. Each phase of this screen is its own page as far as a
         reader is concerned, and the cards phase had no level-one heading
         at all -- the intro's was gone by then. */
      '<h1 class="tut__title">' + esc(title) +
        (reduced || S.typed >= c.title.length ? '' : '<span class="tut__caret" aria-hidden="true"></span>') +
      '</h1>' +
      '<ul class="tut__lines">' + c.lines.map(function (l, k) {
        return '<li class="' + (reduced || k < S.lines ? 'is-in' : '') + '">' + esc(l) + '</li>';
      }).join('') + '</ul>' +
      '<p class="tut__pill">' + esc(c.tag) + '</p>' +
    '</div>';
  }

  function playCard() {
    var c = CARDS[S.i];
    if (reduced) { S.typed = c.title.length; S.lines = c.lines.length; paint(); return; }
    S.typed = 0; S.lines = 0;
    (function step() {
      paint();
      if (S.typed < c.title.length) { S.typed++; timer = setTimeout(step, 34); return; }
      if (S.lines < c.lines.length) { S.lines++; timer = setTimeout(step, 160); return; }
    })();
  }

  /* ---------------------------------------------------------------
     Chrome
     --------------------------------------------------------------- */
  function footHTML() {
    if (S.phase === 'intro') {
      return '<button class="btn btn--primary btn--block" type="button" data-action="begin" data-testid="tut-begin">' +
          '<span class="btn__label">Show me around</span></button>' +
        '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="skip" data-testid="tut-skip">' +
          '<span class="btn__label">Skip</span></button>';
    }
    if (S.phase === 'done') {
      /* THE FULL TOUR IS OFFERED HERE AND NOWHERE ELSE ON A FIRST RUN.
         One row, under the primary, so the person who wants the rest can
         have it and the person who wants to train is one tap from doing
         so. */
      return '<button class="btn btn--primary btn--block" type="button" data-action="finish" data-testid="tut-finish">' +
          '<span class="btn__label">Start training</span></button>' +
        (hasApp()
          ? '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="tour" data-testid="tut-tour">' +
              '<span class="btn__label">Take the full tour</span></button>'
          : '');
    }
    if (S.phase === 'hub') {
      return '<button class="btn btn--secondary btn--block" type="button" data-action="finish" data-testid="tut-finish">' +
        '<span class="btn__label">Not now</span></button>';
    }
    var last = S.i === CARDS.length - 1;
    return '<div class="tut__dots" role="group" aria-label="Step ' + (S.i + 1) + ' of ' + CARDS.length + '">' +
        CARDS.map(function (c, k) {
          return '<span class="tut__dot' + (k === S.i ? ' is-on' : '') + '" aria-hidden="true"></span>';
        }).join('') + '</div>' +
      '<button class="btn btn--primary btn--block" type="button" data-action="next" data-testid="tut-next">' +
        '<span class="btn__label">' + (last ? 'Done' : 'Next') + '</span></button>' +
      '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="skip" data-testid="tut-skip">' +
        '<span class="btn__label">Skip</span></button>';
  }

  function doneHTML() {
    return '<div class="tut__intro">' +
      '<h1 class="tut__word is-in" data-testid="tut-done">Ready</h1>' +
      '<p class="tut__tag is-in">Everything is on this device. Nothing has been sent anywhere.</p>' +
    '</div>';
  }

  /* ---------------------------------------------------------------
     THE HUB. Five modules, each ending where the app actually leaves
     you, each resuming where it was left rather than starting again.
     It is only offered, never played: a five minute tutorial that
     starts itself is a five minute tutorial nobody finishes.
     --------------------------------------------------------------- */
  /* Named hasApp, not live: `live` is already the aria-live element on
     this page, and a var assignment at load quietly overwrote the
     function declaration that shared its name. */
  function hasApp() { return !!(window.LKTutor && LKTutor.available()); }

  function hubHTML() {
    if (!hasApp()) {
      return '<div class="tut__intro">' +
        '<h1 class="tut__word is-in">The tour</h1>' +
        '<p class="tut__tag is-in">The full tour drives the real screens, so it ' +
          'runs inside the app rather than on this page on its own.</p>' +
      '</div>';
    }
    var done = LKTutor.progress();
    var rows = LKTutor.tracks().filter(function (t) { return t.id !== 'quick'; })
      .map(function (t) {
        var at = done[t.id] || 0;
        var state = !t.ready ? (t.why || 'not yet')
                  : at >= t.steps ? 'Done'
                  : at > 0 ? 'Resume, step ' + (at + 1)
                  : t.steps + ' steps';
        return '<button class="btn btn--secondary btn--block mt-2" type="button"' +
            (t.ready ? '' : ' disabled') +
            ' data-action="module" data-module="' + t.id + '" data-testid="tut-module-' + t.id + '">' +
            '<span class="btn__label">' + esc(t.name) + ' \u00b7 ' + esc(state) + '</span></button>';
      }).join('');
    return '<div class="tut__intro">' +
      '<h1 class="tut__word is-in">The full tour</h1>' +
      '<p class="tut__tag is-in">Five modules. Take one, or take none.</p>' +
    '</div>' + rows;
  }

  function paint() {
    screen.setAttribute('data-state', S.phase);
    LKPatch(body, S.phase === 'intro' ? introHTML()
                : S.phase === 'done' ? doneHTML()
                : S.phase === 'hub'  ? hubHTML() : cardHTML());
    LKPatch(foot, footHTML());
    Array.prototype.forEach.call(document.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.phase));
    });
  }

  function seen() {
    try { localStorage.setItem('lk_tutorialSeen', 'true'); } catch (e) {}
  }

  /* Hand over to the player, which routes to the screen the track starts
     on and takes this screen out from under itself. Finishing comes back
     here so the offer of the rest is made once, in the one place a
     person has just proved they will read. Skipping does not: somebody
     who left is not asked again on the way out. */
  function runTrack(id) {
    if (!hasApp()) return;
    LKTutor.start(id, { resume: id !== 'quick', onEnd: function (end) {
      if (end.why !== 'finished') { LKGo('home'); return; }
      if (id === 'quick') {
        location.hash = '#/tutorial';
        S.phase = 'done'; paint(); say('Ready');
      } else {
        location.hash = '#/tutorial';
        S.phase = 'hub'; paint(); say('The full tour');
      }
    } });
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!t) return;
    var a = t.getAttribute('data-action');
    stop();
    if (a === 'begin') {
      /* WHEN THE APP IS THERE, TEACH ON THE APP. The cards below are the
         fallback for this screen opened on its own, where there is
         nothing to drive and spotlighting thin air would be a lie about
         what the reader is looking at. */
      if (hasApp()) { runTrack('quick'); return; }
      S.phase = 'cards'; S.i = 0; playCard(); say(CARDS[0].tab); return;
    }
    if (a === 'tour') { S.phase = 'hub'; paint(); say('The full tour'); return; }
    if (a === 'module') { runTrack(t.getAttribute('data-module')); return; }
    if (a === 'next') {
      if (S.i < CARDS.length - 1) { S.i++; playCard(); say(CARDS[S.i].tab); }
      else { S.phase = 'done'; paint(); say('Ready'); }
      return;
    }
    /* Skip writes the gate too. The shipped app wrote it only on completion,
       so anyone who skipped was shown the whole thing again next launch. */
    if (a === 'skip') { seen(); LKGo('home'); return; }
    if (a === 'finish') { seen(); LKGo('home'); return; }
  });

  /* Settings' Full tour row asks for the hub rather than the intro. It is
     sessionStorage because it is about this navigation and nothing else:
     a preference that outlived the trip would open the hub every time. */
  try {
    if (sessionStorage.getItem('lk_tutorialOpen') === 'hub') {
      sessionStorage.removeItem('lk_tutorialOpen');
      S.phase = 'hub';
      stop();
      paint();
    }
  } catch (e) {}

  var PRESETS = [['intro', 'Intro'], ['cards', 'Cards'], ['done', 'Ready'], ['hub', 'Full tour']];
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  LKPatch(menu, PRESETS.map(function (p) {
    return '<button class="dev__item" type="button" data-state="' + p[0] +
      '" aria-pressed="false" data-testid="dev-state-' + p[0] + '">' + p[1] + '</button>';
  }).join(''));
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (!b) return;
    stop();
    S.phase = b.dataset.state; S.i = 0;
    if (S.phase === 'intro') typeIntro();
    else if (S.phase === 'cards') playCard();
    else paint();
  });

  /* PINCH ZOOM (F-SYS-005). chrome.js stops the double-tap zoom on every
     screen; a pinch it does not stop, and a walkthrough somebody has pinched
     into has no way back out of it. The browser's own zoom controls are
     untouched: this refuses the gesture, not the choice. */
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
  });

  var q = new URLSearchParams(location.search);
  var want = q.get('state');
  if (want === 'cards') { S.phase = 'cards'; playCard(); }
  else if (want === 'done') { S.phase = 'done'; paint(); }
  else typeIntro();
  window.__ready = true;
})();
</script>
</body>
</html>
