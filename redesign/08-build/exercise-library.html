     running LOCKED holds `exIds: [111, ...]` on a day; this builder and the
     split builder write the resolved `exercises: [{id, name, ...}]`. Reading
     only the second counted every day of a real user's split as empty, so
     "In your splits" said "Not in a split" about a lift that was in one. */
  function dayExIds(d) {
    if (d && d.exercises && d.exercises.length) {
      return d.exercises.map(function (e) { return e.id; });
    }
    return (d && d.exIds) || [];
  }
  function buildSplits() {
    var inSplit = {}, days = [];
    rdSplits().forEach(function (sp) {
      (sp.days || []).forEach(function (d) {
        var exs = dayExIds(d).map(function (id) { return { id: id }; });
        days.push({ id: 'd' + days.length, splitId: sp.id, day: d.name,
                    name: d.name, split: sp.name, count: exs.length });
        exs.forEach(function (e) {
          if (e.id == null) return;
          if (!inSplit[e.id]) inSplit[e.id] = sp.name + ' \u00b7 ' + d.name;
        });
      });
    });
    return { inSplit: inSplit, days: days };
  }
  /* Write the lift into the stored split day. Returns false when it is
     already there, so the toast can say so rather than claim a second copy. */
  function addToSplitDay(d, it) {
    var all = rdSplits(), done = false, dup = false;
    all.forEach(function (sp) {
      if (sp.id !== d.splitId) return;
      (sp.days || []).forEach(function (day) {
        if (day.name !== d.day) return;
        /* Written into the day in the shape that day is stored in. A day held
           as bare ids gets an id; a resolved day gets the record. Writing the
           wrong one made a second, parallel list the rest of the app did not
           read. */
        var bare = !(day.exercises && day.exercises.length) && !!(day.exIds && day.exIds.length);
        var have = dayExIds(day);
        for (var i = 0; i < have.length; i++) {
          if (String(have[i]) === String(it.id)) { dup = true; return; }
        }
        if (dup) return;
        if (bare) day.exIds.push(it.id);
        else {
          day.exercises = day.exercises || [];
          day.exercises.push({ id: it.id, name: it.name, group: it.group, muscle: it.muscle });
        }
        done = true;
      });
    });
    if (done && window.LKStore) window.LKStore.set('lk_splits', all);
    return done;
  }

  var SPLIT_MAP = buildSplits();
  var IN_SPLIT = SPLIT_MAP.inSplit;
  var SPLIT_DAYS = SPLIT_MAP.days;

  /* ---------------------------------------------------------------
     PER-EXERCISE NOTES — F-TRAIN-007. They were written from the workout
     log into lk_exNotes and could be read nowhere else, so the note you
     wrote about a lift was invisible on the screen where you browse that
     lift. Same key, same shape (keyed by exercise id), read and written
     here through these two functions and nowhere else in this file.
     --------------------------------------------------------------- */
  function allNotes() {
    return (window.LKStore ? window.LKStore.get('lk_exNotes', {}) : null) || {};
  }
  /* Two shapes are in the wild under this key: the seed carries
     { text, updated } and the workout log writes a bare string. Read both,
     write the one the log writes, so a note typed here is the note the log
     puts on the card and neither screen renders "[object Object]". */
  function exNote(id) {
    var all = allNotes();
    var v = all[id];
    if (v === undefined) v = all[String(id)];
    if (v === undefined || v === null) return '';
    if (typeof v === 'object') return String(v.text || v.note || '');
    return String(v);
  }
  function setExNote(id, text) {
    if (!window.LKStore) return false;
    var all = allNotes();
    if (text.trim()) all[id] = text; else { delete all[id]; delete all[String(id)]; }
    window.LKStore.set('lk_exNotes', all);
    return true;
  }

  /* ---------------------------------------------------------------
     HOW MUCH OF THE CATALOGUE IS ACTUALLY HERE — F-TRAIN-306. The app
     ships 867 exercises and Train's row says so; over file:// the fetch
     cannot run and this screen has the inline list only. Rather than two
     screens quoting two different totals with nothing saying why, the
     count on screen is always the count of what can be opened, and this
     sentence says what is missing when anything is.
     --------------------------------------------------------------- */
  function shipped() {
    var lib = window.LKFixtures && window.LKFixtures.library;
    return lib && lib.total ? Number(lib.total) : 0;
  }
  function shortfallNote() {
    var have = S.items.length, all = shipped();
    if (!all || have >= all) return '';
    return have + ' of the ' + all + ' exercises LOCKED ships are readable here. ' +
      'The rest are in the app’s own catalogue file, which a page opened straight ' +
      'from disk cannot read.';
  }

  /* ---------------------------------------------------------------
     LEAVING FOR THE WORKOUT LOG. In the assembled demo this file is one
     screen of locked-demo.html and a raw location.href would take the
     whole page with it, so the one crossing declared out of this screen
     -- the session shelf's Resume -- is the one that is used. Standalone
     that same click reaches this screen's own handler at the bottom of
     the file, which navigates. One path, both builds.
     --------------------------------------------------------------- */
  function leaveToLog() {
    var b = document.querySelector('[data-testid="shelf-resume"]');
    if (b) { b.click(); return true; }
    if (/exercise-library\.html$/i.test(location.pathname)) {
      LKGo('workout-log');
      return true;
    }
    return false;
  }

  /* The running session's own rows, under the workout log's key. Adding a
     lift to a workout that is already going means appending to them; the
     record is stamped with the session's start time, so a stale set of rows
     from a finished workout is never written back into a live one. */
  function addToLiveSession(it) {
    if (!window.LKStore || !window.LKSession) return false;
    var live = window.LKSession.get();
    if (!live) return false;
    var rows = window.LKStore.get('lk_liveSessionRows', null);
    if (!rows || !rows.exercises || rows.startedAt !== live.startedAt) return false;
    for (var i = 0; i < rows.exercises.length; i++) {
      if (String(rows.exercises[i].id) === String(it.id)) return 'dup';
    }
    rows.exercises.push(newExRow(it));
    window.LKStore.set('lk_liveSessionRows', rows);
    return true;
  }
  /* The log's own row shape, three empty working sets. Written here so what
     this screen appends is indistinguishable from what the log itself adds. */
  function newExRow(it) {
    var sets = [];
    for (var i = 0; i < 3; i++) {
      sets.push({ kg: null, reps: null, rir: 2, done: false, warm: false, partials: 0 });
    }
    return { id: it.id, name: it.name, muscle: it.muscle || '', note: exNote(it.id), sets: sets };
  }

  /* Words a lifter types that are not in the catalogue. */
  var ALIAS = {
    legs: ['quads', 'hams', 'glutes', 'calves', 'adduc'],
    arms: ['biceps', 'triceps', 'forearms'],
    core: ['abs'],
    upper: ['chest', 'back', 'shoulders', 'biceps', 'triceps', 'forearms'],
    lower: ['quads', 'hams', 'glutes', 'calves', 'adduc']
  };

  /* ---------------------------------------------------------------
     State
     --------------------------------------------------------------- */
  var S = {
    status: 'ready',      /* ready | loading | error */
    source: 'inline',     /* inline | fetch */
    raw: [],
    customs: CUSTOMS.slice(),
    items: [],
    q: '',
    gid: null,
    browse: 'map',        /* map | list, how the groups are chosen. The
                             body is what the library opens on: it names
                             the muscle you mean without you naming it. */
    bodyView: 'front',    /* front | back, while browsing by body */
    scope: 'group',       /* group | all, while a group is open */
    filter: 'all',        /* all | custom */
    sheet: null,          /* exercise id */
    delArmed: null,       /* a custom lift asked about, awaiting the second tap */
    media: 'none',        /* none | loading | error | image */
    entry: 'tab',         /* tab | active | picker */
    days: false,          /* split-day chooser open */
    create: null,         /* { name, gid, sid } */
    toast: null,
    restore: null
  };

  /* How this person last chose to browse. A preference about reading, not a
     step in a task, so it outlives the session. */
  try {
    var savedBrowse = localStorage.getItem('lk_libBrowse');
    if (savedBrowse === 'map' || savedBrowse === 'list') S.browse = savedBrowse;
  } catch (e) { /* private mode: the body is the default and stays it */ }


  function normalise(list) {
    return list.map(function (x) {
      var gid = x.gid, sid = x.sid;
      return {
        id: x.id, name: x.name, eq: x.eq, gid: gid, sid: sid,
        group: GNAME[gid] || gid, muscle: SNAME[gid + '/' + sid] || sid,
        custom: !!x.custom
      };
    });
  }
  function fromTuples(rows) {
    return rows.map(function (r) { return { id: r[0], name: r[1], eq: r[2], gid: r[3], sid: r[4] }; });
  }
  /* The merge. gid and sid only: the two fields a stored custom carries. */
  function rebuild() {
    var customs = S.customs.map(function (c) {
      return { id: c.id, name: c.name, eq: c.eq, gid: c.gid, sid: c.sid, custom: true };
    });
    S.items = normalise(S.raw.concat(customs)).sort(function (a, b) {
      if (GORDER[a.gid] !== GORDER[b.gid]) return GORDER[a.gid] - GORDER[b.gid];
      var sa = SORDER[a.gid + '/' + a.sid], sb = SORDER[b.gid + '/' + b.sid];
      if (sa !== sb) return sa - sb;
      if (a.custom !== b.custom) return a.custom ? 1 : -1;
      return a.id - b.id;
    });
  }

  /* ---------------------------------------------------------------
     Search. Name, region, group, equipment and aliases, from the first
     character. Every token must match; the score ranks the result.
     --------------------------------------------------------------- */
  function tokenScore(it, t) {
    var name = it.name.toLowerCase();
    if (name.indexOf(t) === 0) return 100;
    if ((' ' + name).indexOf(' ' + t) > 0) return 80;
    if (name.indexOf(t) > 0) return 60;
    var m = it.muscle.toLowerCase(), g = it.group.toLowerCase();
    if (m.indexOf(t) === 0 || g.indexOf(t) === 0) return 50;
    if (m.indexOf(t) >= 0 || g.indexOf(t) >= 0) return 45;
    if (it.eq.toLowerCase().indexOf(t) >= 0) return 30;
    if (it.custom && 'custom'.indexOf(t) === 0) return 25;
    for (var key in ALIAS) {
      if (key.indexOf(t) === 0 && t.length >= 3 && ALIAS[key].indexOf(it.gid) >= 0) return 35;
    }
    return 0;
  }
  function search(pool, q) {
    var tokens = q.toLowerCase().trim().split(/\s+/).filter(Boolean);
    if (!tokens.length) return [];
    var out = [];
    pool.forEach(function (it) {
      var total = 0;
      for (var i = 0; i < tokens.length; i++) {
        var s = tokenScore(it, tokens[i]);
        if (!s) return;
        total += s;
      }
      out.push({ it: it, s: total });
    });
    out.sort(function (a, b) {
      if (b.s !== a.s) return b.s - a.s;
      if (GORDER[a.it.gid] !== GORDER[b.it.gid]) return GORDER[a.it.gid] - GORDER[b.it.gid];
      return a.it.name.localeCompare(b.it.name);
    });
    return out.map(function (o) { return o.it; });
  }

  function pool() {
    var list = S.items;
    if (S.filter === 'custom') return list.filter(function (x) { return x.custom; });
    /* THE SHORT LIST, when Settings says so. The library is a reference
       and keeps all 866 on the All filter and in search -- completeness
       is the point of a reference, and a lift you cannot find is a lift
       you do not have. Browsing a muscle is the other job: forty
       near-identical incline presses is not a list anybody reads. */
    if (S.filter !== 'all' && window.LKExercises && LKExercises.offered) {
      var offered = LKExercises.offered(list);
      if (offered.length) return offered;
    }
    return list;
  }

  /* Lifts already logged come first wherever a list is browsed: the one
     you did last Tuesday beats whatever sorts first alphabetically. */
  function doneFirst(list) {
    if (!window.LKExercises || !LKExercises.doneBefore) return list;
    var seen = LKExercises.doneBefore();
    return list.slice().map(function (x, i) { return [x, i]; }).sort(function (a, b) {
      var ra = seen[a[0].id], rb = seen[b[0].id];
      var ha = ra === undefined ? 1 : 0, hb = rb === undefined ? 1 : 0;
      if (ha !== hb) return ha - hb;
      if (!ha && ra !== rb) return ra - rb;
      return a[1] - b[1];
    }).map(function (p) { return p[0]; });
  }
  function inGroup(gid) { return doneFirst(pool().filter(function (x) { return x.gid === gid; })); }
  function results() {
    var base = (S.gid && S.scope === 'group') ? inGroup(S.gid) : pool();
    return search(base, S.q);
  }
  function byId(id) {
    for (var i = 0; i < S.items.length; i++) if (S.items[i].id === id) return S.items[i];
    return null;
  }

  /* ---------------------------------------------------------------
     Muscle map. The sheet's illustration is the same figure the body view
     draws, not a second, simpler body: one app, one anatomy. Two small
     copies, front and back, each lighting only the group this exercise
     works. They are pictures rather than controls, so they carry no tab
     stops and the whole pair is named once, by the sheet.

     The placeholders are patched in with the rest of the sheet and filled
     afterwards, because a mounted SVG is a node, not a string. Each carries
     the group it is showing, so a re-render that changes nothing leaves the
     figure alone and a different exercise rebuilds it.
     --------------------------------------------------------------- */
  function mountSheetFigures() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-fig]'), function (slot) {
      var gid = slot.getAttribute('data-fig-gid');
      /* The guard is a PROPERTY, not an attribute. It was an attribute on a
         node inside the container LKPatch reconciles, and syncAttributes
         removes every attribute the new markup does not declare — which this
         markup does not — so the guard was wiped on every render and both
         SVG figures were rebuilt from scratch each time. A property survives
         a morph, which is the whole reason the morph exists. */
      if (slot.__figBuilt === gid) return;
      slot.textContent = '';
      var fig = LKBodyMap.mount(slot, {
        groups: mapGroups(), order: GROUP_INDEX.map(function (g) { return g[0]; }),
        interactive: false, view: slot.getAttribute('data-fig')
      });
      fig.select(gid);
      slot.__figBuilt = gid;
    });
  }

  function bodymap(it) {
    return '<div class="bodymap" role="img" aria-label="Muscle map: ' + esc(it.group) + ' highlighted, front and back">' +
      '<div class="bodymap__unit"><div class="bodymap__fig" data-fig="front" data-fig-gid="' + esc(it.gid) + '"></div><span class="t-meta">Front</span></div>' +
      '<div class="bodymap__unit"><div class="bodymap__fig" data-fig="back" data-fig-gid="' + esc(it.gid) + '"></div><span class="t-meta">Back</span></div>' +
      '<div class="grow stack stack--2">' +
        '<span class="t-label">Works</span>' +
        '<span class="t-body-em">' + esc(it.muscle) + '</span>' +
        '<span class="t-detail">' + esc(it.group) + ' &middot; ' + esc(it.eq) + '</span>' +
      '</div>' +
    '</div>';
  }

  /* ---------------------------------------------------------------
     Rows and lists
     --------------------------------------------------------------- */
  function exRow(it) {
    var h = HISTORY[it.id];
    return '<button class="row" type="button" data-action="open" data-id="' + it.id + '" data-testid="row-ex-' + it.id + '">' +
      '<span class="row__main stack">' +
        '<span class="row__title">' + esc(it.name) + (it.custom ? ' <span class="badge badge--accent">Custom</span>' : '') + '</span>' +
        '<span class="row__sub truncate">' + esc(it.muscle) + ' &middot; ' + esc(it.eq) + '</span>' +
      '</span>' +
      (h ? '<span class="row__value">' + kg(h.last.kg) + '</span>' : '') +
      '<span class="row__chev">' + ico('chev') + '</span>' +
    '</button>';
  }
  function groupRow(gid) {
    var list = inGroup(gid);
    var subs = GROUP_INDEX[GORDER[gid]][2].map(function (s) { return s[1]; });
    /* A group with one region would only repeat its own name, so it
       previews its equipment instead. Either way the row says what is
       inside before it is opened. */
    if (subs.length < 2) {
      /* Ranked by how much of the group each one is, so the preview leads
         with what a person will mostly find inside. Other is a bucket the
         catalogue could not name, so it goes last however big it is. */
      var byEq = {};
      list.forEach(function (x) { byEq[x.eq] = (byEq[x.eq] || 0) + 1; });
      subs = Object.keys(byEq).sort(function (a, b) {
        if ((a === 'Other') !== (b === 'Other')) return a === 'Other' ? 1 : -1;
        return byEq[b] - byEq[a] || a.localeCompare(b);
      }).slice(0, 4);
    }
    return '<button class="row" type="button" data-action="group" data-gid="' + gid + '" data-testid="row-group-' + gid + '">' +
      '<span class="row__main stack">' +
        '<span class="row__title">' + esc(GNAME[gid]) + '</span>' +
        '<span class="row__sub truncate">' + esc(subs.join(' · ')) + '</span>' +
      '</span>' +
      '<span class="row__value">' + n(list.length) + '</span>' +
      '<span class="row__chev">' + ico('chev') + '</span>' +
    '</button>';
  }
  function listCard(rows) { return '<div class="card card--flush gutter">' + rows.join('') + '</div>'; }
  function head(left, right) {
    return '<div class="listhead"><h2 class="t-label">' + left + '</h2>' +
      (right ? '<span class="t-meta">' + right + '</span>' : '') + '</div>';
  }

  /* ---------------------------------------------------------------
     Body views
     --------------------------------------------------------------- */
  function viewGroups() {
    var total = pool().length;
    /* Browsing by body puts the figure where the list would be, so the two
       are one choice rather than two surfaces stacked on each other. */
    /* The figure is not inside the patched body; it is a sibling that takes
       the whole browse surface. So the body renders nothing here, and the
       heading and the hint travel with the figure instead. */
    if (S.browse === 'map') return '';
    var short = shortfallNote();
    return head('Muscle groups', n(total) + ' exercises') +
      listCard(GROUP_INDEX.map(function (g) { return groupRow(g[0]); })) +
      '<p class="t-detail quiet mt-4 gutter">Search finds a lift by name, muscle, region or equipment. Browsing is two taps: a group, then the lift.</p>' +
      (short ? '<p class="t-detail quiet mt-3 gutter" data-testid="catalogue-short">' + esc(short) + '</p>' : '');
  }

  function viewGroup(gid) {
    var list = inGroup(gid), out = '';
    GROUP_INDEX[GORDER[gid]][2].forEach(function (s) {
      var rows = list.filter(function (x) { return x.sid === s[0]; });
      if (!rows.length) return;
      out += head(esc(s[1]), n(rows.length)) + listCard(rows.map(exRow));
    });
    return out;
  }

  function viewResults() {
    var list = results();
    if (!list.length) return viewNoResults();
    var scoped = S.gid && S.scope === 'group';
    var wider = scoped ? search(pool(), S.q).length : 0;
    return head(n(list.length) + ' ' + (list.length === 1 ? 'result' : 'results') + ' for &ldquo;' + esc(S.q) + '&rdquo;',
        scoped ? esc(GNAME[S.gid]) + ' only' : '') +
      listCard(list.map(exRow)) +
      (scoped && wider > list.length
        ? '<div class="gutter mt-3"><button class="btn btn--secondary btn--block" type="button" data-action="scope-all" data-testid="search-all">' +
            '<span class="btn__label">Search all ' + n(pool().length) + ' exercises (' + n(wider - list.length) + ' more)</span></button></div>'
        : '');
  }

  function viewNoResults() {
    var suggestions = suggest(S.q);
    return '<div class="empty" data-testid="state-no-results">' +
      '<span class="empty__ico">' + ico('search', 'ico--lg') + '</span>' +
      '<h2 class="empty__title">No exercise matches &ldquo;' + esc(S.q) + '&rdquo;</h2>' +
      '<p class="empty__body">Search takes a muscle group, a region, a piece of equipment or part of the name. Try one of these, or add the lift yourself.</p>' +
      '<div class="chiprow chiprow--center mt-2">' + suggestions.map(function (t) {
        return '<button class="chip" type="button" data-action="try" data-q="' + esc(t) + '" data-testid="suggest-' + esc(t.toLowerCase().replace(/\s+/g, '-')) + '">' + esc(t) + '</button>';
      }).join('') + '</div>' +
      '<button class="btn btn--primary mt-2" type="button" data-action="create" data-testid="create-custom">' +
        ico('plus') + '<span class="btn__label">Create &ldquo;' + esc(S.q.trim()) + '&rdquo;</span>' +
      '</button>' +
    '</div>';
  }

  /* Suggestions are the nearest real things in the catalogue: the group
     whose name shares the most letters with the query, plus the two
     commonest pieces of equipment. */
  function suggest(q) {
    var t = q.toLowerCase().trim().slice(0, 3);
    var near = GROUP_INDEX.filter(function (g) { return t && g[1].toLowerCase().indexOf(t.charAt(0)) === 0; })
      .map(function (g) { return g[1]; }).slice(0, 2);
    if (!near.length) near = ['Chest', 'Back'];
    return near.concat(['Dumbbell', 'Cable']).slice(0, 4);
  }

  function viewCustomEmpty() {
    return '<div class="empty" data-testid="state-empty">' +
      '<span class="empty__ico">' + ico('star', 'ico--lg') + '</span>' +
      '<h2 class="empty__title">No custom exercises</h2>' +
      '<p class="empty__body">Add a lift your gym has and the catalogue does not. It appears in browse, in search and in the counts, next to the rest.</p>' +
      '<button class="btn btn--primary" type="button" data-action="create" data-testid="create-custom">' +
        ico('plus') + '<span class="btn__label">Create a custom exercise</span>' +
      '</button>' +
    '</div>';
  }

  function viewLoading() {
    var rows = '';
    for (var i = 0; i < 7; i++) {
      rows += '<div class="row"><span class="row__main stack stack--2">' +
        '<span class="skel" style="height: var(--sp-4); width: ' + (72 - i * 4) + '%"></span>' +
        '<span class="skel" style="height: var(--sp-3); width: ' + (48 - i * 2) + '%"></span>' +
      '</span></div>';
    }
    return head('Muscle groups', 'Loading') +
      '<div class="card card--flush gutter" role="status" aria-busy="true" aria-label="Loading the exercise library" data-testid="state-loading">' + rows + '</div>';
  }

  function viewError() {
    return '<div class="gutter mt-4" data-testid="state-error">' +
      '<div class="banner banner--error">' + ico('alert') +
        '<span><strong>The exercise list did not load</strong>LOCKED could not read the catalogue on this device. Your ' +
        n(S.customs.length) + ' custom exercises are still here.</span>' +
      '</div>' +
      '<button class="btn btn--primary btn--block mt-4" type="button" data-action="retry" data-testid="retry">' +
        '<span class="btn__label">Try again</span></button>' +
      '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="filter" data-filter="custom" data-testid="show-customs">' +
        '<span class="btn__label">Show my custom exercises</span></button>' +
    '</div>';
  }

  function renderBody() {
    if (S.status === 'loading') return viewLoading();
    if (S.status === 'error') return viewError();
    if (S.q.trim()) return viewResults();
    if (S.filter === 'custom') {
      var list = pool();
      if (!list.length) return viewCustomEmpty();
      return head('Custom exercises', n(list.length)) +
        listCard(list.map(exRow).concat([
          '<button class="row" type="button" data-action="create" data-testid="create-custom">' +
            '<span class="ico-well">' + ico('plus') + '</span>' +
            '<span class="row__main stack"><span class="row__title accent">Create a custom exercise</span>' +
            '<span class="row__sub">A lift your gym has and the catalogue does not</span></span>' +
          '</button>'
        ]));
    }
    if (S.gid) return viewGroup(S.gid);
    return viewGroups();
  }

  /* ---------------------------------------------------------------
     Detail sheet
     --------------------------------------------------------------- */
  function spark(trend) {
    var w = 240, h = 44, min = Math.min.apply(null, trend), max = Math.max.apply(null, trend);
    var span = (max - min) || 1;
    var pts = trend.map(function (v, i) {
      var x = (i / (trend.length - 1)) * (w - 8) + 4;
      var y = h - 6 - ((v - min) / span) * (h - 14);
      return [x, y];
    });
    var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    return '<svg class="chart chart--quiet" viewBox="0 0 ' + w + ' ' + h + '" height="' + h + '" aria-hidden="true" focusable="false">' +
      '<path class="chart__line" d="' + d + '"/>' +
      '<circle class="chart__dot" cx="' + pts[pts.length - 1][0].toFixed(1) + '" cy="' + pts[pts.length - 1][1].toFixed(1) + '" r="3"/>' +
    '</svg>';
  }

  function historyBlock(it) {
    var h = HISTORY[it.id];
    if (!h) {
      return '<div class="section"><div class="section__head"><h3 class="t-label">Your history</h3></div>' +
        '<p class="t-detail">No sets logged yet. The first time you log this lift, your last and best set appear here.</p></div>';
    }
    return '<div class="section"><div class="section__head"><h3 class="t-label">Your history</h3>' +
      '<span class="t-meta">Last ' + n(h.trend.length) + (h.trend.length === 1 ? ' session' : ' sessions') + '</span></div>' +
      '<div class="facts">' +
        '<div class="stat"><span class="stat__label">Last set</span>' +
          '<span class="stat__value">' + n(h.last.kg) + '<span class="stat__unit"> kg</span></span>' +
          '<span class="t-detail">' + n(h.last.reps) + ' reps &middot; ' + when(h.last.daysAgo, h.last.iso) + '</span></div>' +
        '<div class="stat"><span class="stat__label">Best set</span>' +
          '<span class="stat__value">' + n(h.best.kg) + '<span class="stat__unit"> kg</span></span>' +
          '<span class="t-detail">' + n(h.best.reps) + ' reps &middot; ' + when(99, h.best.iso) + '</span></div>' +
      '</div>' +
      '<div class="mt-3">' + spark(h.trend) +
        '<div class="spread"><span class="t-meta">' + kg(h.trend[0]) + ', ' +
          (h.trend.length > 1 ? n(h.trend.length - 1) + ' sessions ago' : 'your only session') + '</span>' +
        '<span class="t-meta">' + kg(h.trend[h.trend.length - 1]) + ', last</span></div>' +
      '</div>' +
    '</div>';
  }

  function factsBlock(it) {
    return '<div class="facts mt-4">' +
      '<div class="stack stack--1"><span class="t-label">Muscle group</span><span class="t-body-em">' + esc(it.group) + '</span></div>' +
      '<div class="stack stack--1"><span class="t-label">Region</span><span class="t-body-em">' + esc(it.muscle) + '</span></div>' +
      '<div class="stack stack--1"><span class="t-label">Equipment</span><span class="t-body-em">' + esc(it.eq) + '</span></div>' +
      '<div class="stack stack--1"><span class="t-label">In your splits</span><span class="t-body-em">' +
        (IN_SPLIT[it.id] ? esc(IN_SPLIT[it.id]) : 'Not in a split') + '</span></div>' +
    '</div>';
  }

  /* The demonstration slot only exists when there is a clip to show.
     It is never the sheet's subject, so its three states are three small
     things in one 16:9 box, not a void. */
  /* YOUR NOTES ON THIS LIFT — F-TRAIN-007. The same lk_exNotes the workout
     log autosaves into, so a cue typed mid-set is here when the lift is next
     browsed, and one typed here is on the card when it is next lifted. It
     saves as you type; there is no Save button because there is nothing to
     confirm and nothing to lose. */
  function notesBlock(it) {
    var has = !!window.LKStore;
    return '<div class="section"><div class="section__head"><h3 class="t-label">Your notes</h3>' +
      '<span class="t-meta" data-testid="note-status">' +
        (has ? 'Saves as you type' : 'Storage unavailable') + '</span></div>' +
      '<label class="field">' +
        '<span class="vis-hidden">Your notes on ' + esc(it.name) + '</span>' +
        '<textarea class="input" rows="3" data-action="exnote" data-id="' + it.id + '"' +
          (has ? '' : ' disabled') + ' data-testid="sheet-note" ' +
          'placeholder="Seat 4, elbows tucked, pause a beat at the bottom.">' +
          esc(exNote(it.id)) + '</textarea>' +
      '</label>' +
      '<p class="field__help">Kept on this phone against this exercise, and shown on its ' +
        'card in the workout log.</p>' +
    '</div>';
  }

  /* Asked for, never fetched on open: a clip is a second's curiosity and
     most of the time somebody opening a lift wants the muscle map and
     their own history, both of which are already there. */
  function findClip() {
    var it = S.sheet ? byId(S.sheet) : null;
    var C = window.LKCloud;
    if (!it) return;
    if (!C || !C.ready() || !C.formVideo) {
      S.media = 'error';
      S.mediaWhy = 'There is no clip search in this build';
      render();
      return;
    }
    S.media = 'loading'; S.mediaWhy = null; S.videoId = null; render();
    C.formVideo(it.name, it.id).then(function (r) {
      if (r && r.ok) { S.videoId = r.data; S.media = 'ready'; render(); return; }
      S.media = 'error';
      S.mediaWhy = (r && r.error === 'none')
        ? 'No clip was found for this lift'
        : 'The clip search could not be reached';
      render();
    }, function () {
      S.media = 'error';
      S.mediaWhy = 'The clip search could not be reached';
      render();
    });
  }

  function mediaBlock(it) {
    if (S.media === 'none') return demoNote();
    var inner;
    if (S.media === 'loading') {
      inner = '<div class="media" role="status" aria-busy="true" aria-label="Loading the demonstration clip" data-testid="media-loading">' +
        '<span class="skel media__art"></span></div>';
    } else if (S.media === 'error') {
      inner = '<div class="banner banner--warn" data-testid="media-error">' + ico('alert') +
        '<span><strong>' + esc(S.mediaWhy || 'The demonstration clip did not load') +
        '</strong>It is not stored on this device. The muscle map and your history above do not need it.</span></div>' +
        '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="media-retry" data-testid="media-retry">' +
        '<span class="btn__label">Try again</span></button>';
    } else {
      inner = '<div class="media" data-testid="media-image">' +
        '<svg class="media__art" viewBox="0 0 320 180" role="img" aria-label="Demonstration: the top and bottom position of ' + esc(it.name) + '" focusable="false">' +
          '<rect class="demofig" x="0" y="0" width="320" height="180"/>' +
          '<g class="demofig"><circle cx="96" cy="60" r="14"/><rect x="70" y="78" width="52" height="54" rx="10"/>' +
            '<rect x="52" y="82" width="16" height="40" rx="8"/><rect x="124" y="82" width="16" height="40" rx="8"/>' +
            '<rect x="78" y="132" width="16" height="34" rx="8"/><rect x="98" y="132" width="16" height="34" rx="8"/></g>' +
          '<g class="demofig--end"><circle cx="224" cy="60" r="14"/><rect x="198" y="78" width="52" height="54" rx="10"/>' +
            '<rect x="180" y="70" width="16" height="40" rx="8"/><rect x="252" y="70" width="16" height="40" rx="8"/>' +
            '<rect x="206" y="132" width="16" height="34" rx="8"/><rect x="226" y="132" width="16" height="34" rx="8"/></g>' +
        '</svg></div>' +
        /* A LINK, NOT AN EMBEDDED FRAME. An embed would put a third
           party's player and its tracking inside a fitness app, on a
           screen somebody opens mid-set. The clip opens where clips
           live, and the figure above stays as what it always was: a
           drawing of the two positions, not a photograph of anybody. */
        (S.videoId
          ? '<a class="btn btn--secondary btn--block mt-2" target="_blank" rel="noopener noreferrer" ' +
              'href="https://www.youtube.com/watch?v=' + esc(S.videoId) + '" data-testid="media-clip">' +
              '<span class="btn__label">Watch a demonstration</span></a>' +
            '<p class="t-caption-1 quiet mt-2">Opens outside LOCKED. The drawing above is this ' +
              'app\u2019s own; the clip is somebody else\u2019s.</p>'
          : '');
    }
    return '<div class="section"><div class="section__head"><h3 class="t-label">Demonstration</h3></div>' + inner + '</div>';
  }

  /* F-TRAIN-015, said rather than mimed. Nothing on this device holds a
     demonstration clip: there is no cache to look in and no lookup to run,
     so the slot is not shown as an empty box waiting on a network that is
     not there. What the remaining half needs is named, at the point where a
     reader would otherwise wonder where the video is. */
  function demoNote() {
    return '<div class="section"><div class="section__head"><h3 class="t-label">Demonstration</h3></div>' +
      '<p class="t-detail">No clip is stored on this phone. Form videos come from LOCKED’s ' +
      'media service, which this build has no connection to; nothing is downloaded and nothing ' +
      'is cached. The muscle map and your history above do not need one.</p></div>';
  }

  function actions(it) {
    var primary, secondary = '';
    if (S.entry === 'picker') {
      var first = SPLIT_DAYS[0];
      primary = ['add-day', 'Add to ' + esc(first ? first.name : 'a split day'), 'plus'];
    } else if (S.entry === 'active') {
      primary = ['add-workout', 'Add to today&rsquo;s workout', 'plus'];
      secondary = 'Add to a split day';
    } else {
      primary = ['start', 'Start a workout with this', 'play'];
      secondary = 'Add to a split day';
    }
    return '<div class="sheet__foot mt-4">' +
      '<button class="btn btn--primary btn--block" type="button" data-action="' + primary[0] + '" data-id="' + it.id + '" data-testid="sheet-primary">' +
        ico(primary[2]) + '<span class="btn__label">' + primary[1] + '</span></button>' +
      (secondary
        ? '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="choose-day" data-id="' + it.id + '" data-testid="sheet-secondary">' +
            '<span class="btn__label">' + secondary + '</span></button>'
        : '') +
      /* A LIFT YOU MADE IS A LIFT YOU CAN UNMAKE. Creating a custom
         exercise worked and nothing could be done to it afterwards: a
         typo in the name was permanent and the list could only ever grow.
         Only your own -- the catalogue is not yours to delete from.
         Tap once to arm, tap again to remove, the pattern the split list
         and the goal list already use; anything already logged against it
         is untouched, and a split that names it keeps working. */
      (it.custom
        ? '<button class="btn btn--block mt-2 ' +
            (S.delArmed === it.id ? 'btn--danger-solid' : 'btn--danger') + '" type="button" ' +
            'data-action="del-custom" data-id="' + it.id + '" data-testid="sheet-delete">' +
            '<span class="btn__label">' +
            (S.delArmed === it.id ? 'Tap again to delete it' : 'Delete this exercise') +
            '</span></button>' +
          (S.delArmed === it.id
            ? '<p class="t-detail quiet mt-2" data-testid="sheet-delete-note">Sessions you have ' +
              'already logged with it keep it, and a split that names it goes on working.</p>'
            : '')
        : '') +
    '</div>';
  }

  function sheetDetail(it) {
    return '<div class="scrim" data-action="close-sheet" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-testid="sheet-detail" data-media="' + S.media + '">' +
        '<div class="sheet__grab"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-section grow" id="sheet-title">' + esc(it.name) +
            (it.custom ? ' <span class="badge badge--accent">Custom</span>' : '') + '</h2>' +
          '<button class="iconbtn" type="button" data-action="close-sheet" data-testid="sheet-close" aria-label="Close">' + ico('close') + '</button>' +
        '</div>' +
        '<div class="sheet__body" tabindex="0">' +
          bodymap(it) +
          factsBlock(it) +
          historyBlock(it) +
          notesBlock(it) +
          mediaBlock(it) +
        '</div>' +
        actions(it) +
      '</div>';
  }

  function sheetDays(it) {
    return '<div class="scrim" data-action="close-days" data-testid="scrim-days"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="days-title" data-testid="sheet-days">' +
        '<div class="sheet__grab"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-section grow" id="days-title">Add ' + esc(it.name) + ' to</h2>' +
          '<button class="iconbtn" type="button" data-action="close-days" data-testid="days-close" aria-label="Close">' + ico('close') + '</button>' +
        '</div>' +
        '<div class="sheet__body" tabindex="0">' +
          '<div class="card card--flush">' + SPLIT_DAYS.map(function (d) {
            return '<button class="row" type="button" data-action="add-day" data-day="' + d.id + '" data-id="' + it.id + '" data-testid="row-day-' + d.id + '">' +
              '<span class="row__main stack"><span class="row__title">' + esc(d.name) + '</span>' +
              '<span class="row__sub">' + esc(d.split) + ' &middot; ' + n(d.count) + ' exercises</span></span>' +
              '<span class="row__chev">' + ico('chev') + '</span></button>';
          }).join('') + '</div>' +
        '</div>' +
      '</div>';
  }

  /* The nine ways a load is actually carried. Each one changes how a number
     on a set is read, which is why it is a choice rather than the constant
     'Machine' every custom exercise used to get. */
  var EQUIPMENT = [
    ['Barbell', 'The bar counts. Set what it weighs below.'],
    ['Dumbbell', 'The figure you log is one dumbbell, the way the rack is labelled.'],
    ['Machine', 'Whatever the stack says.'],
    ['Cable', 'Whatever the stack says.'],
    ['Smith machine', 'The carriage may or may not count. Say which below.'],
    ['Bodyweight', 'No load to set. Add weight as a set figure when you wear it.'],
    ['Band', 'Bands are not kilos. Log what you can, the trend is the useful part.'],
    ['Kettlebell', 'The bell you picked up.'],
    ['Plate-loaded', 'The carriage counts. Set what it weighs below.']
  ];
  function eqNote(id) {
    for (var i = 0; i < EQUIPMENT.length; i++) if (EQUIPMENT[i][0] === id) return EQUIPMENT[i][1];
    return EQUIPMENT[2][1];
  }
  function eqIsPlate(id) {
    return id === 'Barbell' || id === 'Plate-loaded' || id === 'Smith machine';
  }

  function sheetCreate() {
    var d = S.create, subs = GROUP_INDEX[GORDER[d.gid]][2];
    return '<div class="scrim" data-action="close-create" data-testid="scrim-create"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="create-title" data-testid="sheet-create">' +
        '<div class="sheet__grab"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-section grow" id="create-title">New exercise</h2>' +
          '<button class="iconbtn" type="button" data-action="close-create" data-testid="create-close" aria-label="Close">' + ico('close') + '</button>' +
        '</div>' +
        '<div class="sheet__body" tabindex="0">' +
          '<label class="field"><span class="field__label t-label">Name</span>' +
            '<input class="input" id="cname" type="text" value="' + esc(d.name) + '" data-action="cname" data-testid="create-name" placeholder="Machine decline press"></label>' +
          '<label class="field mt-4"><span class="field__label t-label">Muscle group</span>' +
            '<select class="input" id="cgroup" data-action="cgroup" data-testid="create-group">' +
              GROUP_INDEX.map(function (g) {
                return '<option value="' + g[0] + '"' + (g[0] === d.gid ? ' selected' : '') + '>' + esc(g[1]) + '</option>';
              }).join('') + '</select></label>' +
          '<label class="field mt-4"><span class="field__label t-label">Region</span>' +
            '<select class="input" id="csub" data-action="csub" data-testid="create-sub">' +
              subs.map(function (s) {
                return '<option value="' + s[0] + '"' + (s[0] === d.sid ? ' selected' : '') + '>' + esc(s[1]) + '</option>';
              }).join('') + '</select></label>' +
          /* Equipment, which decides how the weight is read. It was hardcoded
             'Machine' on every custom exercise, so a barbell lift somebody
             added carried the wrong word in the list and the wrong maths
             behind it. */
          '<label class="field mt-4"><span class="field__label t-label">Equipment</span>' +
            '<select class="input" id="ceq" data-action="ceq" data-testid="create-equipment">' +
              EQUIPMENT.map(function (e) {
                return '<option value="' + esc(e[0]) + '"' + (e[0] === d.eq ? ' selected' : '') +
                  '>' + esc(e[0]) + '</option>';
              }).join('') + '</select></label>' +
          '<p class="field__help">' + esc(eqNote(d.eq)) + '</p>' +
          /* Only where it means something. A dumbbell has no bar and a
             cable has no counterbalance, so asking about either would be
             asking a question with no answer. */
          (eqIsPlate(d.eq)
            ? '<label class="field mt-4"><span class="field__label t-label">Weight before any plates</span>' +
                '<input class="input num" id="cbase" type="number" min="0" max="200" step="0.5" ' +
                  'inputmode="decimal" value="' + (d.startResist || 0) + '" ' +
                  'data-action="cbase" data-testid="create-base"></label>' +
              '<p class="field__help">The bar, sled or carriage on its own, in kg. Added to every ' +
                'set so the log matches what was lifted.</p>'
            : '') +
          (d.eq === 'Smith machine'
            ? '<div class="row row--withaside mt-3">' +
                '<span class="row__main stack">' +
                  '<span class="row__title" id="cnocb-lbl">No counterbalance</span>' +
                  '<span class="row__sub">' + (d.smithNoCB
                    ? 'The carriage weight counts, so it is added.'
                    : 'The carriage is counterbalanced, so only the plates count.') + '</span>' +
                '</span>' +
                '<button class="switch" role="switch" aria-checked="' + !!d.smithNoCB + '" ' +
                  'aria-labelledby="cnocb-lbl" data-action="cnocb" data-testid="create-nocb">' +
                  '<span class="switch__knob"></span></button>' +
              '</div>'
            : '') +
          '<p class="field__help mt-3">It is saved on this device and appears in browse, search and the counts.</p>' +
        '</div>' +
        '<div class="sheet__foot mt-4">' +
          '<button class="btn btn--primary btn--block" type="button" data-action="save-custom" data-testid="create-save"' +
            (d.name.trim() ? '' : ' disabled') + '>' + ico('plus') + '<span class="btn__label">Save exercise</span></button>' +
        '</div>' +
    '</div>';
  }

  function renderLayer() {
    var html = '';
    if (S.create) html = sheetCreate();
    else if (S.days && S.sheet) html = sheetDays(byId(S.sheet));
    else if (S.sheet) { var it = byId(S.sheet); if (it) html = sheetDetail(it); }
    if (S.toast) {
      html += '<div class="toast" role="status" data-testid="toast"><span class="toast__body">' + S.toast.text + '</span>' +
        (S.toast.undo ? '<button class="toast__action" type="button" data-action="undo" data-testid="toast-undo">Undo</button>' : '') + '</div>';
    }
    return html;
  }

  /* ---------------------------------------------------------------
     Header and filters
     --------------------------------------------------------------- */
  function renderHdr() {
    var title, meta;
    if (S.gid) { title = GNAME[S.gid]; meta = n(inGroup(S.gid).length) + ' exercises'; }
    else if (S.filter === 'custom') { title = 'Custom'; meta = n(pool().length) + ' of your own'; }
    else if (S.status === 'error') { title = 'Exercises'; meta = 'List unavailable'; }
    else if (S.status === 'loading') { title = 'Exercises'; meta = 'Loading'; }
    else { title = 'Exercises'; meta = n(pool().length) + ' in the library'; }
    /* A group is a pushed view: it has a back chevron and a 17px title, which
       is the collapsed state already. Only the tab-level list collapses. */
    var pushed = !!S.gid;
    /* A SCREEN YOU CAN ONLY LEAVE WITH THE BROWSER BUTTON IS A DEAD END.
       Back used to render only once a muscle group was open, so the
       library's own top level -- the screen this pushes you to -- had no
       exit on it at all. Installed to a home screen there is no browser
       chrome to fall back on, so the one way out was a gesture. The
       control is now always there; it steps back to the groups when a
       group is open, and out to Train when one is not. */
    return '<button class="hdr__back" type="button" data-action="' +
             (S.gid ? 'back' : 'library-exit') + '" data-testid="' +
             (S.gid ? 'back' : 'library-exit') + '" aria-label="' +
             (S.gid ? 'Back to muscle groups' : 'Back to Train') + '">' +
             ico('back') + '</button>' +
      '<div class="hdr__title stack stack--1">' +
        '<span class="t-meta">' + meta + '</span>' +
        (pushed
          ? '<h1 class="t-title">' + esc(title) + '</h1>'
          : '<h1 class="hdr__title-large" data-title-large>' + esc(title) + '</h1>') +
      '</div>' +
      (pushed ? '' : '<span class="hdr__title-small" data-title-small aria-hidden="true">' + esc(title) + '</span>');
  }

  function renderFilters() {
    if (S.status !== 'ready') return '';
    var customs = S.items.filter(function (x) { return x.custom; }).length;
    var chips = [['all', 'All ' + S.items.length], ['custom', 'Custom ' + customs]].map(function (f) {
      return '<button class="chip" type="button" data-action="filter" data-filter="' + f[0] + '" aria-pressed="' +
        (f[0] === 'custom' ? S.filter === 'custom' : (S.filter === 'all' && S.browse === 'list')) +
        '" data-testid="filter-' + f[0] + '">' + esc(f[1]) + '</button>';
    }).join('');

    /* Three ways to reach a lift, in the order they are worth reaching for:
       the body first, then the catalogue as a list, then your own. Body is
       the shape, All and Custom are the lists. The body chip appears only
       where it means anything: once a group is open or a search is running,
       there is nothing left on the figure to choose. */
    if (S.gid || S.q.trim()) return chips;
    return '<button class="chip chip--icon" type="button" data-action="browse" data-browse="map" ' +
        'aria-pressed="' + (S.browse === 'map' && S.filter !== 'custom') + '" ' +
        'data-testid="browse-toggle">' + ico('body') + '<span>Body</span></button>' + chips;
  }

  /* ---------------------------------------------------------------
     Render
     --------------------------------------------------------------- */
  var screen = document.getElementById('screen');
  var hdr = document.getElementById('hdr');
  var body = document.getElementById('body-content');
  var scroller = document.getElementById('body');
  var layer = document.getElementById('layer');
  var input = document.getElementById('q');
  var clear = document.getElementById('clear');
  var filters = document.getElementById('filters');

  /* The figure. Mounted the first time the body is asked for and kept, so
     switching back to it is instant and the SVG is built once. */
  var libmap = document.getElementById('libmap');
  var mapFrame = document.getElementById('map');
  var FIG = null;

  function mapGroups() {
    var out = {};
    GROUP_INDEX.forEach(function (g) {
      out[g[0]] = { name: g[1], n: inGroup(g[0]).length };
    });
    return out;
  }

  function syncMap() {
    var on = S.browse === 'map' && !S.gid && !S.q.trim() &&
             S.filter !== 'custom' && S.status === 'ready';
    libmap.hidden = !on;
    scroller.classList.toggle('body--figure', on);
    if (!on) return;
    if (!FIG) {
      FIG = LKBodyMap.mount(mapFrame, {
        groups: mapGroups(), order: GROUP_INDEX.map(function (g) { return g[0]; }),
        onSelect: function (gid) {
          /* The same destination a row in the list goes to. The map is a
             second way to the group, not a second flow. */
          S.gid = gid;
          S.scope = 'group';
          /* AND THE FIGURE GOES WHERE THE FINGER WENT. Tapping a muscle
             used to filter the list and leave the body at full height, so
             the part just chosen stayed the same small shape it had been.
             The camera frames it now, which is the whole reason the map is
             on this screen rather than a list of group names. */
          S.zoomed = gid;
          try { if (FIG && FIG.zoomTo) FIG.zoomTo(gid, S.bodyView); } catch (e) {}
          render({ scrollTop: true });
        }
      });
    }
    FIG.setView(S.bodyView);
    FIG.select(S.gid || null);
    /* The camera follows the state rather than being reset behind it: a
       person who comes back to the map with a group still chosen should
       find it framed, not snapped back to the whole body. */
    try { if (FIG.zoomTo) FIG.zoomTo(S.gid || null, S.bodyView); } catch (e) {}
    var count = document.getElementById('libmap-count');
    if (count) count.textContent = pool().length + ' exercises';
    var note = document.getElementById('libmap-note');
    if (note) {
      var short = shortfallNote();
      note.textContent = short;
      note.hidden = !short;
    }
    var f = document.getElementById('tab-front'), b = document.getElementById('tab-back');
    if (f) f.setAttribute('aria-selected', String(S.bodyView === 'front'));
    if (b) b.setAttribute('aria-selected', String(S.bodyView === 'back'));
  }

  function stateName() {
    if (S.status !== 'ready') return S.status;
    if (S.q.trim()) return results().length ? 'results' : 'no-results';
    if (S.filter === 'custom' && !pool().length) return 'empty';
    return S.gid ? 'group' : 'browse';
  }

  function render(opts) {
    var pushedView = !!S.gid;
    hdr.classList.toggle('hdr--large', !pushedView);
    if (pushedView) hdr.removeAttribute('data-large-title');
    else hdr.setAttribute('data-large-title', '#body');
    LKPatch(hdr, renderHdr());
    if (window.LKChrome) LKChrome.init(document);
    LKPatch(filters, renderFilters());
    LKPatch(body, renderBody());
    LKPatch(layer, renderLayer());
    clear.hidden = !S.q;
    input.disabled = S.status !== 'ready';
    /* COUNTED, not typed. Both of these said 227 -- the length of the inline
       fallback -- whichever catalogue was actually loaded, so the field
       offered 227 over a list of 867. */
    input.placeholder = S.status !== 'ready' ? 'Search'
      : (S.gid && !S.q ? 'Search all ' + S.items.length + ', not just ' + GNAME[S.gid]
                       : 'Search ' + S.items.length + ' exercises');
    syncMap();
    mountSheetFigures();
    screen.setAttribute('data-state', stateName());
    screen.setAttribute('data-entry', S.entry);
    screen.setAttribute('data-source', S.source);
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.preset === String(S.preset)));
    });
    if (opts && opts.focus) {
      var el = document.querySelector('[data-testid="' + opts.focus + '"]');
      if (el) el.focus();
    }
    if (opts && opts.scrollTop) body.scrollTop = 0;
  }

  /* ---------------------------------------------------------------
     Actions
     --------------------------------------------------------------- */
  function toast(text, undo) {
    S.toast = { text: text, undo: !!undo };
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { S.toast = null; render(); }, 4000);
  }

  var ACTIONS = {
    /* Out of the library, back to Train. The header's back control is
       this only at the library's top level; one group deep it steps back
       to the groups instead, which is what the reader expects of the
       same arrow in the same place. */
    'library-exit': function () { LKGo('train'); },

    /* Switching between the list of groups and the body. The choice is
       remembered, because it is a preference about how a person reads
       rather than a step in a task. */
    browse: function (el) {
      S.browse = el.getAttribute('data-browse') === 'map' ? 'map' : 'list';
      /* Going back to the body means going back to the whole body, so a
         filter left on from the lists does not silently follow you here. */
      if (S.browse === 'map') { S.filter = 'all'; S.gid = null; }
      try { localStorage.setItem('lk_libBrowse', S.browse); } catch (e) {}
      render({ scrollTop: true });
    },
    'body-view': function (el) {
      S.bodyView = el.getAttribute('data-view') === 'back' ? 'back' : 'front';
      if (FIG) FIG.setView(S.bodyView);
      syncMap();
    },
    group: function (el) { S.gid = el.getAttribute('data-gid'); S.scope = 'group'; render({ scrollTop: true }); },
    back: function () { S.gid = null; render({ scrollTop: true, focus: 'search-input' }); },
    filter: function (el) {
      S.filter = el.getAttribute('data-filter');
      S.gid = null;
      /* All and Custom are list shapes. Picking one puts the surface in the
         shape it named, rather than leaving the figure standing above it. */
      S.browse = 'list';
      try { localStorage.setItem('lk_libBrowse', S.browse); } catch (e) {}
      /* Reached from the error state: the catalogue is gone, the customs
         on this device are not, and the list says so rather than staying
         on the error. */
      if (S.status === 'error') { S.raw = []; S.status = 'ready'; rebuild(); }
      render({ scrollTop: true });
    },
    'scope-all': function () { S.scope = 'all'; render({ scrollTop: true }); },
    try: function (el) { S.q = el.getAttribute('data-q'); input.value = S.q; S.scope = 'all'; render({ scrollTop: true, focus: 'search-input' }); },
    open: function (el) {
      S.restore = 'row-ex-' + el.getAttribute('data-id');
      S.sheet = Number(el.getAttribute('data-id'));
      render({ focus: 'sheet-primary' });
    },
    'close-sheet': function () {
      var back = S.restore; S.sheet = null; S.days = false; S.restore = null; S.delArmed = null;
      render({ focus: back });
    },
    'choose-day': function () { S.days = true; render({ focus: SPLIT_DAYS.length ? 'row-day-' + SPLIT_DAYS[0].id : 'days-close' }); },
    'close-days': function () { S.days = false; render({ focus: 'sheet-secondary' }); },
    'del-custom': function (el) {
      var id = Number(el.getAttribute('data-id'));
      if (S.delArmed !== id) { S.delArmed = id; render({ focus: 'sheet-delete' }); return; }
      S.delArmed = null;
      var all = (window.LKStore ? LKStore.get('lk_customEx', null) : null) || [];
      if (Array.isArray(all)) {
        var kept = all.filter(function (c) { return c && c.id !== id; });
        if (window.LKStore) LKStore.set('lk_customEx', kept);
      }
      S.sheet = null;
      reread();
      render();
      toast('Deleted. Your logged sessions keep it.');
    },
    'add-day': function (el) {
      var it = byId(Number(el.getAttribute('data-id')));
      /* The sheet's own primary carries no day, so it means the first one --
         which is what its label says. It used to default to the literal
         string "push", which matches no day id at all, so the button did
         nothing at all from a picker. */
      var day = el.getAttribute('data-day') || (SPLIT_DAYS[0] && SPLIT_DAYS[0].id);
      var d = SPLIT_DAYS.filter(function (x) { return x.id === day; })[0];
      S.days = false; S.sheet = null;
      if (!d) { render({ focus: S.restore }); return; }
      /* The toast used to be the whole of it. The lift is written into the
         stored split now, so the planner and Train see it on the next open. */
      var added = addToSplitDay(d, it);
      SPLIT_MAP = buildSplits(); IN_SPLIT = SPLIT_MAP.inSplit; SPLIT_DAYS = SPLIT_MAP.days;
      S.lastAdded = added ? { kind: 'day', id: it.id, name: it.name, day: d } : null;
      render({ focus: S.restore });
      toast(added
        ? 'Added ' + esc(it.name) + ' to ' + esc(d.name) + ', ' + esc(d.split) + '.'
        : esc(it.name) + ' is already in ' + esc(d.name) + ', ' + esc(d.split) + '.', !!added);
      render();
    },
    /* F-TRAIN-006. Both of these used to toast and stop: nothing was written
       anywhere and nothing moved, so the whole catalogue was a dead end
       unless you happened to pick the secondary. They write now, through the
       keys the workout log actually reads, and they leave. */
    'add-workout': function (el) {
      var it = byId(Number(el.getAttribute('data-id')));
      if (!it) return;
      var r = addToLiveSession(it);
      if (r === 'dup') {
        S.sheet = null;
        render({ focus: S.restore });
        toast(esc(it.name) + ' is already in this workout.', false);
        render();
        return;
      }
      if (!r) {
        /* No live rows to append to -- the workout has not written any yet,
           or it has ended. Say that rather than claim the lift went in. */
        toast('That workout is not open on this phone, so nothing was added.', false);
        render();
        return;
      }
      S.lastAdded = { kind: 'workout', id: it.id, name: it.name };
      S.sheet = null;
      render({ focus: S.restore });
      toast('Added ' + esc(it.name) + ' to your workout.', true);
      render();
      leaveToLog();
    },
    start: function (el) {
      var it = byId(Number(el.getAttribute('data-id')));
      if (!it) return;
      /* lk_repeatWorkout is the log's own "start this session" key: a name
         and the lifts, each with its planned set count. The log reads it on
         boot and on lk:enter, clears it, and opens a fresh session at zero. */
      if (window.LKStore) {
        window.LKStore.set('lk_repeatWorkout', {
          name: it.name,
          exercises: [{ id: it.id, name: it.name, muscle: it.muscle || '', sets: 3 }]
        });
      }
      /* The session record, so the shelf exists and the one declared crossing
         out of this screen is there to be taken. */
      if (window.LKSession) window.LKSession.start({ name: it.name, done: 0, total: 3 });
      S.sheet = null; S.days = false; S.entry = 'active';
      render();
      if (!leaveToLog()) toast('Workout started with ' + esc(it.name) + '. Open it from the strip below.', false);
    },
    undo: function () {
      var last = S.lastAdded;
      S.toast = null;
      /* Undo takes the lift back OUT of the running session. It used to only
         print a second sentence saying it had. */
      var removed = false;
      if (last && last.kind === 'day') {
        /* Out of the stored split day it was just written into. */
        var all = rdSplits();
        all.forEach(function (sp) {
          if (sp.id !== last.day.splitId) return;
          (sp.days || []).forEach(function (dd) {
            if (dd.name !== last.day.day) return;
            if (dd.exIds && !(dd.exercises && dd.exercises.length)) {
              var b0 = dd.exIds.length;
              dd.exIds = dd.exIds.filter(function (x) { return String(x) !== String(last.id); });
              if (dd.exIds.length !== b0) removed = true;
              return;
            }
            if (!dd.exercises) return;
            var before = dd.exercises.length;
            dd.exercises = dd.exercises.filter(function (x) { return String(x.id) !== String(last.id); });
            if (dd.exercises.length !== before) removed = true;
          });
        });
        if (removed && window.LKStore) window.LKStore.set('lk_splits', all);
        SPLIT_MAP = buildSplits(); IN_SPLIT = SPLIT_MAP.inSplit; SPLIT_DAYS = SPLIT_MAP.days;
        S.lastAdded = null;
        render();
        toast(removed ? 'Took ' + esc(last.name) + ' back out of ' + esc(last.day.name) + '.' : 'Undone.', false);
        render();
        return;
      }
      if (last && window.LKStore && window.LKSession && window.LKSession.get()) {
        var rows = window.LKStore.get('lk_liveSessionRows', null);
        if (rows && rows.exercises) {
          var keep = rows.exercises.filter(function (x) { return String(x.id) !== String(last.id); });
          if (keep.length !== rows.exercises.length) {
            rows.exercises = keep;
            window.LKStore.set('lk_liveSessionRows', rows);
            removed = true;
          }
        }
      }
      S.lastAdded = null;
      render();
      toast(removed ? 'Took ' + esc(last.name) + ' back out of your workout.' : 'Undone.', false);
      render();
    },
    create: function () {
      S.create = { name: S.q.trim(), gid: 'chest', sid: 'upper', eq: 'Machine',
                   startResist: 0, smithNoCB: false };
      render({ focus: 'create-name' });
    },
    'close-create': function () { S.create = null; render({ focus: 'search-input' }); },
    cnocb: function () {
      S.create.smithNoCB = !S.create.smithNoCB;
      render({ focus: 'create-nocb' });
    },
    'save-custom': function () {
      var d = S.create;
      if (!d.name.trim()) return;
      var id = 900001 + S.customs.length + 1;
      S.customs.push({ id: id, name: d.name.trim(), eq: d.eq || 'Machine',
                       gid: d.gid, sid: d.sid,
                       startResist: eqIsPlate(d.eq) ? (Number(d.startResist) || 0) : 0,
                       smithNoCB: d.eq === 'Smith machine' ? !!d.smithNoCB : false });
      /* Written, because the sheet says "It is saved on this device" and it
         was not: the exercise appeared in the list, in the counts and in
         search, and was gone on the next load. A screen that claims a save it
         did not perform is worse than one with no save at all. */
      saveCustoms();
      rebuild();
      S.create = null; S.q = ''; input.value = ''; S.filter = 'all'; S.gid = d.gid;
      render({ scrollTop: true });
      toast(esc(d.name.trim()) + ' added to ' + esc(SNAME[d.gid + '/' + d.sid]) + '.', false);
      render();
    },
    retry: function () { load(); },
    'media-retry': function () { findClip(); }
  };

  var INPUTS = {
    /* Autosaving, like the workout log's note field: no Save button, because
       there is nothing to confirm. The status line is written directly rather
       than through a render, so the caret never moves while typing. */
    exnote: function (el) {
      var ok = setExNote(Number(el.getAttribute('data-id')), el.value);
      var st = document.querySelector('[data-testid="note-status"]');
      if (st) st.textContent = ok ? 'Saved' : 'Not saved: storage unavailable';
    },
    cname: function (el) { S.create.name = el.value; document.querySelector('[data-testid="create-save"]').disabled = !el.value.trim(); },
    ceq: function (el) { S.create.eq = el.value; render({ focus: 'create-equipment' }); },
    cbase: function (el) { S.create.startResist = el.value; },
    cgroup: function (el) {
      S.create.gid = el.value;
      S.create.sid = GROUP_INDEX[GORDER[el.value]][2][0][0];
      render({ focus: 'create-group' });
    },
    csub: function (el) { S.create.sid = el.value; }
  };

  document.addEventListener('click', function (e) {
    var dev = e.target.closest('[data-preset]');
    if (dev) { applyPreset(Number(dev.getAttribute('data-preset'))); return; }
    var el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute('data-action')];
    if (fn) { e.preventDefault(); fn(el); }
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el === input) {
      S.q = input.value;
      if (!S.q.trim()) S.scope = 'group';
      render({ scrollTop: true });
      return;
    }
    var a = el.getAttribute && el.getAttribute('data-action');
    if (a && INPUTS[a]) INPUTS[a](el);
  });
  document.addEventListener('change', function (e) {
    var a = e.target.getAttribute && e.target.getAttribute('data-action');
    if (a && INPUTS[a] && a !== 'cname') INPUTS[a](e.target);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (S.create) { ACTIONS['close-create'](); return; }
      if (S.days) { ACTIONS['close-days'](); return; }
      if (S.sheet) { ACTIONS['close-sheet'](); return; }
      if (S.q) { S.q = ''; input.value = ''; render({ focus: 'search-input' }); return; }
      if (S.gid) { ACTIONS.back(); return; }
    }
    if (e.key === 'Enter' && e.target === input) {
      var list = results();
      if (list.length) {
        e.preventDefault();
        S.restore = 'row-ex-' + list[0].id;
        S.sheet = list[0].id;
        render({ focus: 'sheet-primary' });
      }
    }
  });

  clear.addEventListener('click', function () {
    S.q = ''; input.value = ''; S.scope = 'group';
    render({ scrollTop: true, focus: 'search-input' });
  });

  /* ---------------------------------------------------------------
     Data. Fetched when a server is there, inline when the file is
     opened from disk. Either way the page browses and searches.
     --------------------------------------------------------------- */
  function seed(rows, source) {
    S.raw = rows; S.source = source; S.status = 'ready'; rebuild();
  }
  function load() {
    S.status = 'loading';
    render({ scrollTop: true });
    var done = false;
    var finish = function (rows, source) {
      if (done) return; done = true;
      seed(rows, source);
      render();
    };
    /* fetch() cannot read a file:// URL in any engine, and the failure is a
       console error the page cannot catch. The demo opens from disk, so ask
       first and go straight to the inline catalogue when the answer is disk. */
    if (location.protocol === 'file:') {
      finish(fromTuples(FALLBACK), 'inline');
    } else {
      try {
        fetch('../tests/fixtures/exercise-db.json', { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
          .then(function (rows) { finish(rows, 'fetch'); })
          .catch(function () { finish(fromTuples(FALLBACK), 'inline'); });
      } catch (err) {
        finish(fromTuples(FALLBACK), 'inline');
      }
    }
    setTimeout(function () { finish(fromTuples(FALLBACK), 'inline'); }, 1500);
  }

  /* ---------------------------------------------------------------
     Dev state switcher
     --------------------------------------------------------------- */
  var PRESETS = [
    ['Browse (library tab)', function () { reset(); }],
    ['Search: "chest"', function () { reset(); S.q = 'chest'; input.value = 'chest'; }],
    ['Search inside a group', function () { reset(); S.gid = 'back'; S.q = 'row'; input.value = 'row'; }],
    ['No results', function () { reset(); S.q = 'kettlebell swing'; input.value = 'kettlebell swing'; }],
    ['Group: Chest', function () { reset(); S.gid = 'chest'; }],
    ['Detail: logged lift', function () { reset(); S.sheet = 111; S.media = 'none'; }],
    ['Detail: never logged', function () { reset(); S.sheet = 123; S.media = 'none'; }],
    ['Detail: clip loading', function () { reset(); S.sheet = 111; S.media = 'loading'; }],
    ['Detail: clip failed', function () { reset(); S.sheet = 111; S.media = 'error'; }],
    ['Detail: clip loaded', function () { reset(); S.sheet = 111; S.media = 'image'; }],
    ['Detail: from a picker', function () { reset(); S.entry = 'picker'; S.sheet = 111; }],
    ['Detail: workout running', function () { reset(); S.entry = 'active'; S.sheet = 111; }],
    ['Create custom', function () { reset(); S.create = { name: '', gid: 'chest', sid: 'lower' }; }],
    ['Empty: no customs', function () { reset(); S.customs = []; rebuild(); S.filter = 'custom'; S.browse = 'list'; }],
    ['Loading', function () { reset(); S.status = 'loading'; }],
    ['Error', function () { reset(); S.status = 'error'; }]
  ];
  function reset() {
    S.q = ''; input.value = ''; S.gid = null; S.scope = 'group'; S.filter = 'all';
    S.browse = 'map';
    S.sheet = null; S.days = false; S.create = null; S.toast = null; S.media = 'none';
    S.entry = 'tab'; S.status = 'ready'; S.customs = CUSTOMS.slice(); rebuild();
  }
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  LKPatch(menu, PRESETS.map(function (p, i) {
    return '<button class="dev__item" type="button" data-preset="' + i + '" aria-pressed="false" data-testid="dev-preset-' + i + '">' + p[0] + '</button>';
  }).join(''));
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  function applyPreset(i) {
    S.preset = i;
    PRESETS[i][1]();
    menu.hidden = true;
    toggle.setAttribute('aria-expanded', 'false');
    render({ scrollTop: true });
    if (!S.sheet && !S.create && S.status === 'ready') input.focus();
  }

  /* ---------------------------------------------------------------
     Boot. Inline data first so the screen is never blank, then the
     full catalogue if a server can serve it.

     The field is NOT focused on arrival. It was, and opening a tab then
     raised the keyboard and rendered the screen at rest inside a focus
     ring -- iOS does not do this on a tab-level screen, and half the
     library was behind a keyboard nobody asked for. Focus follows the
     tap on the field, and follows a preset, because those are asks.
     --------------------------------------------------------------- */
  /* WHICH ENTRY THIS IS, from the session record rather than from the dev
     switcher. S.entry decided the sheet's primary action and only the
     switcher ever changed it, so with a workout genuinely running the sheet
     still offered to start a second one. */
  function syncEntry() {
    if (S.entry === 'picker') return;
    S.entry = (window.LKSession && window.LKSession.get()) ? 'active' : 'tab';
  }

  /* Everything on this screen that comes from stored data, re-read. The demo
     mounts each screen once, so a split edited in the builder, a session
     finished in the log or a note typed anywhere else reached this screen
     only after a full reload. */
  function reread() {
    HISTORY = buildHistory();
    SPLIT_MAP = buildSplits(); IN_SPLIT = SPLIT_MAP.inSplit; SPLIT_DAYS = SPLIT_MAP.days;
    CUSTOMS = ((window.LKStore ? window.LKStore.get('lk_customEx', null) : null) ||
               (window.LKFixtures && LKFixtures.customEx) || []).map(function (c) {
      return { id: c.id, name: c.name, eq: c.eq, gid: c.gid, sid: c.sid,
               startResist: c.startResist || 0, smithNoCB: !!c.smithNoCB };
    });
    S.customs = CUSTOMS.slice();
    syncEntry();
    rebuild();
  }
  document.addEventListener('lk:enter', function () { reread(); render(); });
  if (window.LKStore && window.LKStore.onChange) {
    ['lk_history', 'lk_splits', 'lk_customEx'].forEach(function (k) {
      window.LKStore.onChange(k, function () {
        if (S.sheet || S.create || S.days) return;
        reread();
        render();
      });
    });
  }

  seed(fromTuples(FALLBACK), 'inline');
  syncEntry();
  S.preset = 0;
  render();
  /* Same reason as above: from disk the inline catalogue is the catalogue. */
  if (location.protocol !== 'file:') {
    fetch('../tests/fixtures/exercise-db.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (rows) {
        if (!Array.isArray(rows) || !rows.length) return;
        seed(rows, 'fetch');
        render();
      })
      .catch(function () { /* inline catalogue stands */ });
  }
})();

  /* The running workout, from a screen that is not it. Leaving the workout
     log used to lose the session outright: nothing was written down, and no
     screen but Home and Fuel had anywhere to say one was open. The record
     lives in session.js; this mounts its shelf and takes the tap back. */
  if (window.LKSession) {
    LKSession.mount(document.getElementById('shelf-slot'),
      typeof LKPatch === 'function' ? LKPatch : null);
    document.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-testid="shelf-resume"]') : null;
      if (el) { e.preventDefault(); LKGo('workout-log'); }
    });
  }
</script>
</body>
</html>
