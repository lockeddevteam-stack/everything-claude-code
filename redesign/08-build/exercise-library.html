<!--
  EXERCISE LIBRARY — what changed, and why.

  The audits measured a screen that reads as "a menu of body parts": the
  search field's border was 1.07:1 against its own fill, it vanished at
  8px blur, it was not focused on arrival, and it disappeared entirely
  once a group was open. Browsing cost 3 taps. Search matched name
  substrings only, above a 2-character floor, so "chest" returned 7 of
  30. Custom exercises never appeared in browse because the merge matched
  on fields stored customs do not carry. The detail sheet's dominant
  object was a 351x351 void — 81% of the sheet body — and its primary
  action did nothing when the library was entered from its own tab.

  DECISIONS

  1. Search is the screen. The field sits above the scroll body, so it is
     present at the root, inside a group and over results; it is focused
     on arrival; it is raised off the ground and bounded by
     --text-tertiary (4.71:1 on its own fill, 5.49:1 on the page ground).
     Enter opens the top result, so a named lift costs 0 taps.
  2. Search matches name, muscle group, region, equipment and a small
     alias list (legs, arms, core, upper, lower), from the first
     character, ranked: name prefix, word start, substring, region and
     group, equipment. "chest" now returns all 31, not 7.
  3. Browsing is two taps, not three. A group opens one flat list of all
     its exercises with the regions as sticky headings, instead of a
     second list of subgroup rows.
  4. Customs merge on gid/sid — the fields a stored custom carries — so
     they appear in browse, in counts and in search, marked CUSTOM.
     Lower Chest reads 11, not 10.
  5. The detail sheet is drawn, not fetched. Its illustration is a muscle
     map rendered in SVG from the exercise's own group and region, so the
     sheet is complete with no network: name, tags, map, four facts
     (group, region, equipment, which split day uses it) and your logged
     history. A demonstration clip is an extra when one is cached, never
     the sheet's subject: loading is a skeleton in the same 16:9 box,
     failure is one line and a Try again button, and neither leaves a
     void, because nothing was ever holding the sheet up.
  6. Every row leads somewhere. The sheet's primary action depends on the
     entry: from a picker it adds to the summoning day; with a workout
     running it adds to that workout; from the Library tab with nothing
     running it starts a workout with the lift, and the secondary adds it
     to a split day. No dead primary.

  ACCENT: one accent fill per screen. On the browse and results screens
  it is the focus ring on the search field — the screen's primary tool,
  focused on arrival. When a sheet is open it is the sheet's primary
  button. Never both: focus moves into the sheet.
-->

      <main class="body body--flush" id="body" tabindex="-1" data-testid="library-scroll">

           not inside it: LKPatch replaces what is inside #body-content, and
           rebuilding an SVG this size on every keystroke would be both slow
           and visibly a flicker. It is shown or hidden instead. It sits
           inside the one landmark on the screen, because when the library
           opens on the body this figure is the screen's whole content. -->
      <div class="libmap" id="libmap" hidden>

               can actually read. Over file:// the fetch cannot run and the
               inline list is all there is, and the screen used to go on
               offering "867" in every count regardless. -->
          <p class="t-detail quiet mt-2" id="libmap-note" hidden></p>
        </div>
      </div>

      <div id="body-content"></div>
      </main>

      <div class="findbar findbar--bottom" id="findbar" role="search" aria-label="Find an exercise">
        <div class="search search--find">

          <label class="vis-hidden" for="q">Search exercises by name, muscle or equipment</label>

          </button>
        </div>
        <div class="chiprow mt-3" id="filters"></div>
      </div>

      <!-- The live session, seen from here. Empty unless a workout is
           running; it sits between the content and the bottom of the
           screen rather than over it, so nothing it says costs a row. -->
      <div id="shelf-slot"></div>

      <nav class="tabbar" aria-label="Sections" data-minimize="#body">
        <button class="tabbar__item" type="button" data-testid="tab-home">

  /* Customs as they are actually stored: id, name, equipment, gid, sid.
     No group or muscle string — the audited merge needed those and so
     dropped every custom out of browse. */
  /* lk_customEx, through the shared fixture. Two were invented here, so the
     library reported "Custom 2" where the stored data holds one. */
  function saveCustoms() {
    if (!window.LKStore) return;
    /* The fixture's own keys -- eq, gid, sid -- so what is written reads
       back through the same mapping the seed does. Writing a prettier shape
       would mean this file could load its own output and get nothing. */
    window.LKStore.set('lk_customEx', S.customs.map(function (c) {
      return { id: c.id, name: c.name, eq: c.eq, gid: c.gid, sid: c.sid, custom: true,
               startResist: c.startResist || 0, smithNoCB: !!c.smithNoCB };
    }));
  }

  var CUSTOMS = ((window.LKStore ? window.LKStore.get('lk_customEx', null) : null) ||
                 (window.LKFixtures && LKFixtures.customEx) || []).map(function (c) {
    return { id: c.id, name: c.name, eq: c.eq, gid: c.gid, sid: c.sid,
             startResist: c.startResist || 0, smithNoCB: !!c.smithNoCB };
  });

  /* Logged history, derived from the stored sessions. A hand-written table
     used to sit here, and it disagreed with Progress, Train, the workout log
     and the seed on every lift it named. There is one source now. */
  /* The wall clock, or the seed's date while a seed is loaded. Pinned to
     the fixture, a build with no seed read undefined. */
  var TODAY = window.LKStore ? LKStore.today() : new Date().toISOString().slice(0, 10);
  function daysBack(iso) {
    var a = Date.parse(iso + 'T00:00:00Z'), b = Date.parse(TODAY + 'T00:00:00Z');
    if (isNaN(a) || isNaN(b)) return 0;
    return Math.round((b - a) / 86400000);
  }
  function rdHistory() {
    return (window.LKStore ? window.LKStore.get('lk_history', null) : null) ||
           (window.LKFixtures && LKFixtures.history) || [];
  }
  /* The top working set of a lift inside one session. Warm-ups and
     unticked rows never count, the same rule the log and Progress use. */
  function topSet(ex) {
    var top = null;
    (ex.sets || []).forEach(function (st) {
      if (!st.done || st.warm || st.kg == null || st.reps == null) return;
      if (!top || st.kg > top.kg || (st.kg === top.kg && st.reps > top.reps)) top = { kg: st.kg, reps: st.reps };
    });
    return top;
  }
  function buildHistory() {
    var out = {};
    var sess = rdHistory().slice().sort(function (a, b) {
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });
    sess.forEach(function (s) {
      (s.exercises || []).forEach(function (ex) {
        var top = topSet(ex);
        if (!top || ex.id == null) return;
        var h = out[ex.id] || (out[ex.id] = { last: null, best: null, trend: [] });
        h.last = { kg: top.kg, reps: top.reps, iso: s.date, daysAgo: daysBack(s.date) };
        h.trend.push(top.kg);
        if (!h.best || top.kg > h.best.kg || (top.kg === h.best.kg && top.reps > h.best.reps)) {
          h.best = { kg: top.kg, reps: top.reps, iso: s.date };
        }
