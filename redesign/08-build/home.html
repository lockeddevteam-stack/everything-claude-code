<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOCKED — Home</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<!--
  HOME — what survives, and why.

  The audits measured a 1,688px screen whose only real action started at
  y659 of a 781px fold, behind 534px of read-only material. This screen
  answers one question — train today, or not, and if so, what — and puts
  the answer, the reason to act on it, and the action in the first fold.

  FOUR BLOCKS (was 10):
  1. Momentum band. The hero figure the old screen never had: weeks on
     plan (5, measured from lk_history: weeks of Aug 3, 10, 17, 24 and 31
     each carry three lifting sessions; the week of Jul 27 carries two,
     which is where the count starts). Beside it, the week rhythm — a
     sunken track showing the seven days as trained, today, planned or
     rest. Streak plus this week, one line, no chrome. Not interactive,
     so nothing here is a target under 44px.
  2. Answer card. Session name, its shape, the accent-filled primary.
     Raised on a training day, sunken on a rest day: the two states are
     given different tone, not different colour.
  3. Last session row. One tap back into the thing most likely to be
     unfinished, and the only place a relative date belongs.
  4. Climbing lift row. The third timescale: the squat's top set across
     five weeks, drawn as a sparkline whose endpoints are named in text.

  CUT: greeting block, 2x2 stat grid (179px, 0 controls), quick actions,
  feed cards (source of the "999 days" sentinel), VIEW PROGRESS (a button
  standing in for a tab), Weekly Recap, calendar (338px, no tappable
  cells), cycle row, ThrowbackCard, the voice FAB (second accent fill,
  and it intercepted pointer events over the last block).

  MOTION: one entry animation per state, on the block that answers the
  question. Training rises into place; rest settles down into it. The
  week track fills left to right and stops on today. Both are switched
  off under prefers-reduced-motion.

  ACCENT: exactly one accent fill per state, on the primary action.
  Today's mark in the week track carries a 2px --accent-text ring, not
  a fill, and only on a training day.

  NUMBERS: every figure is tabular and carries its unit. Dates are
  relative inside the week, absolute after it, never a sentinel.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-home">

      <header class="hdr">
        <div class="hdr__title stack stack--1">
          <span class="t-meta num" id="hdr-date">WED, SEP 9</span>
          <h1 class="t-title">Today</h1>
        </div>
        <button class="hdr__account" data-testid="open-account" aria-label="Account and settings">
          <span class="hdr__initial" aria-hidden="true">C</span>
        </button>
      </header>

      <main class="body" id="body" data-testid="home-scroll" tabindex="-1"></main>

      <nav class="tabbar" aria-label="Sections">
        <button class="tabbar__item" aria-current="page" data-testid="tab-home">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></svg>
          Home
        </button>
        <button class="tabbar__item" data-testid="tab-train">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>
          Train
        </button>
        <button class="tabbar__item" data-testid="tab-fuel">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M9 13v8"/><path d="M17 3c-1.5 1.8-2 3.6-2 5.5 0 1.6.7 2.5 2 2.5s2-.9 2-2.5c0-1.9-.5-3.7-2-5.5Z"/><path d="M17 11v10"/></svg>
          Fuel
        </button>
        <button class="tabbar__item" data-testid="tab-progress">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M7 16v-4M12 16V7M17 16v-6"/></svg>
          Progress
        </button>
        <button class="tabbar__item" data-testid="tab-coach">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H9l-4 3V7a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3z"/></svg>
          Coach
        </button>
      </nav>

    </div>
  </div>
</div>

<div class="dev">
  <button class="dev__toggle" id="dev-toggle" aria-expanded="false" aria-controls="dev-menu" data-testid="dev-toggle">State</button>
  <div class="dev__menu" id="dev-menu" hidden data-testid="dev-menu"></div>
</div>

<script>
(function () {
  "use strict";

  /* ---- icons ------------------------------------------------------ */
  var svg = function (d, extra) {
    return '<svg class="ico' + (extra || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  };
  var ICO = {
    play: svg('<path d="M8 5.5v13l11-6.5z"/>'),
    moon: svg('<path d="M20 14.5A8 8 0 0 1 9.5 4 8.2 8.2 0 1 0 20 14.5z"/>'),
    chev: svg('<path d="m9 5 7 7-7 7"/>'),
    alert: svg('<path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/>'),
    plan: svg('<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>', ' ico--lg'),
    lift: svg('<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>')
  };

  /* ---- formatting ------------------------------------------------- */
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function n(v) { return '<span class="num">' + v + '</span>'; }
  function kg(v) { return n(v.toLocaleString('en-US')) + ' kg'; }
  /* Relative inside a week, absolute after it. Never a sentinel. */
  function when(daysAgo, dateISO) {
    if (daysAgo === 0) return 'today';
    if (daysAgo === 1) return 'yesterday';
    if (daysAgo < 7) return n(daysAgo) + ' days ago';
    var d = dateISO.split('-');
    return MONTHS[Number(d[1]) - 1] + ' ' + n(String(Number(d[2])));
  }

  /* ---- seed (fixtures/seed-data.json, guest profile in kg) --------
     momentum.weeks   counted from lk_history, Monday weeks with three
                      lifting sessions: Aug 3, 10, 17, 24, 31 = 5.
     momentum.days    this week, Monday first.
     lift             Barbell Squat top set per Legs day, Aug 3 to Sep 7:
                      75, 77.5, 80, 82.5, 85, 87.5 kg.                 */
  var LIFT = {
    name: 'Barbell Squat',
    topKg: 87.5, fromKg: 75, gainKg: 12.5, weeks: 5,
    series: [75, 77.5, 80, 82.5, 85, 87.5]
  };
  var DATA = {
    training: {
      date: 'WED, SEP 9',
      momentum: {
        weeks: 5,
        days: [['M','done'],['T','rest'],['W','today'],['T','rest'],['F','planned'],['S','rest'],['S','rest']],
        read: 'This week, Monday first: Monday trained, Tuesday rest, Wednesday is today and planned, ' +
              'Thursday rest, Friday planned, Saturday rest, Sunday rest.'
      },
      next: { name: 'Push', split: 'PPL', exercises: 5, minutes: 50 },
      last: { name: 'PPL - Legs', daysAgo: 2, dateISO: '2026-09-07', sets: 16, volumeKg: 14363 }
    },
    rest: {
      date: 'WED, SEP 9',
      momentum: {
        weeks: 5,
        days: [['M','done'],['T','done'],['W','today-rest'],['T','planned'],['F','rest'],['S','rest'],['S','rest']],
        read: 'This week, Monday first: Monday trained, Tuesday trained, Wednesday is today and a rest day, ' +
              'Thursday planned, Friday rest, Saturday rest, Sunday rest.'
      },
      next: { name: 'Pull', split: 'PPL', dayLabel: 'tomorrow' },
      last: { name: 'PPL - Push', daysAgo: 1, dateISO: '2026-09-08', sets: 16, volumeKg: 4266 }
    }
  };

  /* ---- blocks ----------------------------------------------------- */

  /* The hero figure and the week rhythm, side by side on the page
     ground. Read-only, so there is no target here to undersize. */
  function momentum(m) {
    var days = m.days.map(function (d) {
      var now = d[1] === 'today' || d[1] === 'today-rest';
      return '<span class="week__day' + (now ? ' week__day--now' : '') + '">' +
               '<span class="week__mark week__mark--' + d[1] + '"></span>' +
               '<span class="week__cap" aria-hidden="true">' + d[0] + '</span>' +
             '</span>';
    }).join('');
    return '' +
      '<div class="hstack hstack--4 mt-4" data-testid="momentum">' +
        '<div class="hero">' +
          '<span class="hero__figure">' +
            '<span class="hero__value num" data-testid="hero-value">' + m.weeks + '</span>' +
            '<span class="hero__unit">weeks</span>' +
          '</span>' +
          '<span class="hero__label">On plan</span>' +
        '</div>' +
        '<div class="week grow" role="img" aria-label="' + m.read + '" data-testid="week-rhythm">' + days + '</div>' +
      '</div>';
  }

  function lastRow(last) {
    return '' +
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">Last session</h2></div>' +
        '<div class="card card--flush">' +
          '<button class="row" data-testid="row-last-session">' +
            '<span class="ico-well">' + ICO.lift + '</span>' +
            '<span class="row__main stack">' +
              '<span class="row__title">' + last.name + '</span>' +
              '<span class="row__sub">' + when(last.daysAgo, last.dateISO) + ' &middot; ' +
                n(last.sets) + ' sets &middot; ' + kg(last.volumeKg) + '</span>' +
            '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
        '</div>' +
      '</div>';
  }

  /* Sparkline. Six top sets, plotted in a 64x24 box, endpoints named
     in the row text so the drawing is never the only source. */
  function sparkline(series) {
    var lo = Math.min.apply(null, series), hi = Math.max.apply(null, series);
    var pts = series.map(function (v, i) {
      var x = (i / (series.length - 1)) * 60 + 2;
      var y = 22 - ((v - lo) / (hi - lo)) * 20;
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    var end = pts[pts.length - 1].split(',');
    return '<svg class="spark" viewBox="0 0 64 24" aria-hidden="true">' +
             '<polyline class="spark__line" points="' + pts.join(' ') + '"/>' +
             '<circle class="spark__dot" cx="' + end[0] + '" cy="' + end[1] + '" r="2.5"/>' +
           '</svg>';
  }

  function liftRow(l) {
    return '' +
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">Climbing</h2></div>' +
        '<div class="card card--flush">' +
          '<button class="row" data-testid="row-climbing-lift">' +
            '<span class="row__main stack">' +
              '<span class="row__title">' + l.name + '</span>' +
              '<span class="row__sub">Up ' + kg(l.gainKg) + ' in ' + n(l.weeks) + ' weeks</span>' +
            '</span>' +
            sparkline(l.series) +
            '<span class="row__value">' + kg(l.topKg) + '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
        '</div>' +
      '</div>';
  }

  /* ---- states ----------------------------------------------------- */
  var VIEWS = {};

  /* Training day. Raised card, verb first, rises into place. */
  VIEWS.training = function () {
    var d = DATA.training, s = d.next;
    return '' +
      momentum(d.momentum) +
      '<div class="card card--raised mt-4 enter-rise" data-testid="card-answer" data-answer="train">' +
        '<h2 class="t-title">' + s.name + '</h2>' +
        '<p class="t-detail mt-2">' + s.split + ' &middot; ' + n(s.exercises) + ' exercises &middot; about ' +
          n(s.minutes) + ' min</p>' +
        '<button class="btn btn--primary btn--block mt-4" data-testid="primary-action">' +
          ICO.play + '<span class="btn__label">Start ' + s.name + '</span>' +
        '</button>' +
        '<button class="btn btn--secondary btn--block mt-2" data-testid="action-choose-session">' +
          '<span class="btn__label">Choose another session</span>' +
        '</button>' +
      '</div>' +
      lastRow(d.last) + liftRow(LIFT);
  };

  /* Rest day. Sunken card, sentence first, settles into place. The
     session is still one tap away, but nothing here asks for it. */
  VIEWS.rest = function () {
    var d = DATA.rest, s = d.next;
    return '' +
      momentum(d.momentum) +
      '<div class="card card--sunken mt-4 enter-settle" data-testid="card-answer" data-answer="rest">' +
        '<div class="hstack hstack--3">' +
          '<span class="ico-well">' + ICO.moon + '</span>' +
          '<div class="grow stack stack--1">' +
            '<h2 class="t-section">Rest day</h2>' +
            '<p class="t-detail">' + n(2) + ' sessions logged this week. Next is ' + s.name + ', ' + s.dayLabel + '.</p>' +
          '</div>' +
        '</div>' +
        '<button class="btn btn--primary btn--block mt-4" data-testid="primary-action">' +
          ICO.play + '<span class="btn__label">Start ' + s.name + ' early</span>' +
        '</button>' +
      '</div>' +
      lastRow(d.last) + liftRow(LIFT);
  };

  /* Empty. Nothing has been earned yet, so nothing is claimed: no
     hero figure, no week track, one sentence, one action. */
  VIEWS.empty = function () {
    return '' +
      '<div class="empty mt-5 enter-settle" data-testid="card-answer" data-answer="empty">' +
        '<span class="empty__ico">' + ICO.plan + '</span>' +
        '<h2 class="empty__title">No sessions yet</h2>' +
        '<p class="empty__body">Build a split and LOCKED puts one session on this screen each training day.</p>' +
        '<button class="btn btn--primary" data-testid="primary-action">' +
          '<span class="btn__label">Build a split</span>' +
        '</button>' +
      '</div>';
  };

  VIEWS.loading = function () {
    return '' +
      '<div class="hstack hstack--4 mt-4" role="status" aria-busy="true" aria-label="Loading today">' +
        '<div class="stack stack--1">' +
          '<div class="skel" style="height: var(--sp-6); width: var(--sp-6)"></div>' +
          '<div class="skel" style="height: var(--sp-3); width: var(--sp-6)"></div>' +
        '</div>' +
        '<div class="skel grow" style="height: calc(var(--sp-6) * 2)"></div>' +
      '</div>' +
      '<div class="card card--raised mt-4" data-testid="card-answer" data-answer="loading">' +
        '<div class="skel" style="height: var(--sp-5); width: 45%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-4); width: 80%"></div>' +
        '<div class="skel mt-4" style="height: var(--tap)"></div>' +
      '</div>';
  };

  /* Error. What happened, and the one thing that fixes it. No hero
     figure: the momentum data did not load either, and a number that
     might be wrong is worse than no number. */
  VIEWS.error = function () {
    return '' +
      '<div class="card card--raised mt-4 enter-rise" data-testid="card-answer" data-answer="error">' +
        '<div class="banner banner--error">' +
          ICO.alert +
          '<span><strong>Today did not load</strong>Your last sync failed, so the session for today is unknown.</span>' +
        '</div>' +
        '<button class="btn btn--primary btn--block mt-4" data-testid="primary-action">' +
          '<span class="btn__label">Try again</span>' +
        '</button>' +
        '<button class="btn btn--secondary btn--block mt-2" data-testid="action-choose-session">' +
          '<span class="btn__label">Choose a session</span>' +
        '</button>' +
      '</div>';
  };

  /* ---- render ----------------------------------------------------- */
  var STATES = [
    ['training', 'Training day'],
    ['rest', 'Rest day'],
    ['empty', 'Empty'],
    ['loading', 'Loading'],
    ['error', 'Error']
  ];
  var body = document.getElementById('body');
  var hdrDate = document.getElementById('hdr-date');
  var current = 'training';

  function render(state) {
    current = VIEWS[state] ? state : 'training';
    document.getElementById('screen').setAttribute('data-state', current);
    hdrDate.textContent = (DATA[current] || DATA.training).date;
    body.innerHTML = VIEWS[current]();
    body.scrollTop = 0;
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === current));
    });
  }

  /* ---- dev toggle -------------------------------------------------- */
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  menu.innerHTML = STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join('');
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (b) render(b.dataset.state);
  });

  render(new URLSearchParams(location.search).get('state') || 'training');
})();
</script>
</body>
</html>
