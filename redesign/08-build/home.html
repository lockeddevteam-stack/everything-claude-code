<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOCKED — Home</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="fixtures.js"></script>
<script src="store.js"></script>
<script src="units.js"></script>
<script src="app.js"></script>
<script src="chrome.js"></script>
<script src="session.js"></script>
</head>
<body>
<!--
  HOME — what survives, and why.

  The audits measured a 1,688px screen whose only real action started at
  y659 of a 781px fold, behind 534px of read-only material. This screen
  answers one question — train today, or not, and if so, what — and puts
  the answer, the reason to act on it, and the action in the first fold.

  EVERY FIGURE ON IT IS NOW READ, NOT TYPED. The rebuild hand-wrote its
  numbers into a DATA literal: the weeks on plan, the week track, the last
  session, the squat series, the session name and its length. They happened
  to agree with the seed, but nothing made them agree, and the cycle row did
  not — it said "Day 16 / Luteal" where the profile says day 12 and
  follicular. Everything below now comes out of LKStore, which means it also
  survives a reload and changes when another screen writes.

  THE BLOCKS:
  1. Momentum band. Weeks on plan (5: consecutive weeks carrying three
     lifting sessions, counted back from last week; the week of Jul 27
     carries two, which is where the count stops). Beside it the week
     rhythm, Monday first. Under it the week's own line — training days
     and the consistency label — and the streak when the gaming layer is on.
  2. Answer card. Session name, its shape, the accent-filled primary.
     Raised on a training day, sunken on a rest day.
  3. The card stack. Things that are true today and are not the session:
     an insight worked out from the history, supplements due in this part
     of the day, what has run out, compounds due. Each card is present only
     when its own data says so, and each can be put away.
  4. Last session row, and the recent five under it.
  5. Climbing lift row. The third timescale.
  6. Cycle row, when cycle tracking is on.

  CUT: greeting block, 2x2 stat grid (179px, 0 controls), quick actions,
  VIEW PROGRESS (a button standing in for a tab), Weekly Recap as a block
  (it is a row into recap.html), calendar (338px, no tappable cells),
  ThrowbackCard, the voice FAB (second accent fill, and it intercepted
  pointer events over the last block).

  MOTION: one entry animation per state, on the block that answers the
  question. Both are switched off under prefers-reduced-motion.

  ACCENT: exactly one accent fill per state, on the primary action.

  NUMBERS: every figure is tabular and carries its unit. Dates are
  relative inside the week, absolute after it, never a sentinel.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-home">

      <!-- Large title. Both titles live in the DOM at once and cross-fade,
           because morphing one element between 34px left and 17px centred
           fights the baseline the whole way. chrome.js drives it from the
           scroller's own offset, not from an observer, because the collapse
           is a continuous morph and an observer only reports a crossing. -->
      <header class="hdr hdr--large" data-large-title="#body"
              data-scroll-edge="#body">
        <div class="hdr__title stack stack--1">
          <span class="t-meta num" id="hdr-date">WED, SEP 9</span>
          <h1 class="hdr__title-large" data-title-large>Today</h1>
        </div>
        <button class="hdr__account" data-testid="open-account" aria-label="Account and settings">
          <span class="hdr__initial" aria-hidden="true" id="hdr-initial">C</span>
        </button>
        <span class="hdr__title-small" data-title-small aria-hidden="true">Today</span>
      </header>

      <main class="body" id="body" data-testid="home-scroll" tabindex="-1"></main>

      <!-- The accessory shelf. Empty unless a session is running, and it sits
           between the content and the tab bar rather than over the content,
           so nothing it says costs the screen a row. -->
      <div id="shelf-slot"></div>

      <nav class="tabbar" aria-label="Sections" data-minimize="#body">
        <button class="tabbar__item" aria-current="page" data-testid="tab-home">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></svg>
          <span class="tabbar__label">Home</span>
        </button>
        <button class="tabbar__item" data-testid="tab-train">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>
          <span class="tabbar__label">Train</span>
        </button>
        <button class="tabbar__item" data-testid="tab-fuel">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M9 13v8"/><path d="M17 3c-1.5 1.8-2 3.6-2 5.5 0 1.6.7 2.5 2 2.5s2-.9 2-2.5c0-1.9-.5-3.7-2-5.5Z"/><path d="M17 11v10"/></svg>
          <span class="tabbar__label">Fuel</span>
        </button>
        <button class="tabbar__item" data-testid="tab-coach">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H9l-4 3V7a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3z"/></svg>
          <span class="tabbar__label">Coach</span>
        </button>
        <button class="tabbar__item" data-testid="tab-profile">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
          <span class="tabbar__label">Profile</span>
        </button>
      </nav>

    </div>
  </div>
</div>

<div class="dev">
  <button class="dev__toggle" id="dev-toggle" aria-expanded="false" aria-controls="dev-menu" data-testid="dev-toggle">State</button>
  <div class="dev__menu" id="dev-menu" hidden data-testid="dev-menu"></div>
</div>

<script>
(function () {
  "use strict";

  /* ---- icons ------------------------------------------------------ */
  var svg = function (d, extra) {
    return '<svg class="ico' + (extra || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  };
  var ICO = {
    play: svg('<path d="M8 5.5v13l11-6.5z"/>'),
    moon: svg('<path d="M20 14.5A8 8 0 0 1 9.5 4 8.2 8.2 0 1 0 20 14.5z"/>'),
    chev: svg('<path d="m9 5 7 7-7 7"/>'),
    alert: svg('<path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/>'),
    plan: svg('<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>', ' ico--lg'),
    lift: svg('<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>'),
    run: svg('<path d="M13 5.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/><path d="M7 21l3-6 4-2-1-5-3 2-2 3"/><path d="M13 13l3 3 1 5"/>'),
    spark: svg('<path d="M12 3v4M12 17v4M4.9 7l2.8 2.8M16.3 14.2l2.8 2.8M3 12h4M17 12h4M4.9 17l2.8-2.8M16.3 9.8l2.8-2.8"/>'),
    pill: svg('<path d="M10.5 3.5 3.5 10.5a4.95 4.95 0 0 0 7 7l7-7a4.95 4.95 0 0 0-7-7z"/><path d="M7 7l7 7"/>'),
    cart: svg('<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.3a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/>'),
    close: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
    flame: svg('<path d="M12 3c.6 3-1.2 4.2-2.6 5.6A5.9 5.9 0 0 0 7.5 13a4.5 4.5 0 0 0 9 0c0-1.8-.9-3-1.8-4.1"/>')
  };

  /* ---- formatting ------------------------------------------------- */
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW3 = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function n(v) { return '<span class="num">' + esc(v) + '</span>'; }
  /* One unit, from lk_profile.useKg, through LKUnits. This printed kg
     whatever Settings said, which is the relabel-without-convert defect
     Settings itself claims to have fixed. */
  function kg(v) { return n(LKUnits.fmtTotal(v)); }
  function plural(v, one, many) { return v === 1 ? one : many; }

  /* ---- dates ------------------------------------------------------
     UTC throughout. A local-midnight date is a day out for half the
     planet, and every date in this build is an ISO day, not an instant. */
  /* The wall clock, or the seed's date while a seed is loaded. Pinned to
     the fixture, a build with no seed read undefined. */
  var TODAY = window.LKStore ? LKStore.today() : new Date().toISOString().slice(0, 10);
  function ms(iso) { var a = String(iso).split('-'); return Date.UTC(+a[0], +a[1] - 1, +a[2]); }
  function isoOf(t) { return new Date(t).toISOString().slice(0, 10); }
  function addDays(iso, k) { return isoOf(ms(iso) + k * 86400000); }
  function daysBetween(a, b) { return Math.round((ms(b) - ms(a)) / 86400000); }
  function dow(iso) { return new Date(ms(iso)).getUTCDay(); }
  /* Monday first, because the week track on this screen is Monday first and
     two week windows on one screen would disagree about the same Sunday.
     The shipped app started its week on Sunday; that is the one figure here
     that deliberately differs from it, and it differs in one place only. */
  function weekStart(iso) { return addDays(iso, -((dow(iso) + 6) % 7)); }
  /* Relative inside a week, absolute after it. Never a sentinel. */
  function when(dateISO) {
    var d = daysBetween(dateISO, TODAY);
    if (d === 0) return 'today';
    if (d === 1) return 'yesterday';
    if (d > 1 && d < 7) return n(d) + ' days ago';
    var p = String(dateISO).split('-');
    return MONTHS[Number(p[1]) - 1] + ' ' + n(String(Number(p[2])));
  }
  function headerDate(iso) {
    var p = String(iso).split('-');
    return DOW3[dow(iso)] + ', ' + MONTHS[+p[1] - 1].toUpperCase() + ' ' + (+p[2]);
  }

  /* ---- the store --------------------------------------------------
     Every read on this screen goes through LKStore: the fixture is the
     seed, the stored value wins the moment a person has written one.
     Nothing below is a literal that could drift from the data. */
  function get(key, fb) { return window.LKStore ? LKStore.get(key, fb) : fb; }
  function set(key, v) { return window.LKStore ? LKStore.set(key, v) : false; }
  /* Settings writes these as booleans and older builds wrote the strings,
     so both are accepted. This is the same rule Settings itself applies. */
  function bool(key) { var v = get(key, false); return v === true || v === 'true'; }
  function arr(key) { var v = get(key, []); return Array.isArray(v) ? v : []; }

  /* ---- the model --------------------------------------------------
     One pass over the stored history, splits, pantry, supplements and
     cycle profile. `blank` is the dev switcher asking for the empty
     screen: it must not read a person's data back over the state it is
     showing, so the flag is passed in rather than storage being cleared. */
  function buildModel(blank) {
    var M = {};
    M.history = blank ? [] : arr('lk_history').slice().sort(function (a, b) {
      return a.date === b.date ? 0 : (a.date < b.date ? 1 : -1);
    });
    M.splits = blank ? [] : arr('lk_splits');
    M.profile = get('lk_profile', {}) || {};

    /* The week, Monday first. A day is "done" when something was logged on
       it. Nothing here is marked "planned": the splits carry no weekday, so
       which future day is a training day is not in the data. The rebuild
       drew a planned Friday anyway, which is a claim the build cannot back. */
    var ws = weekStart(TODAY);
    var dates = {};
    M.history.forEach(function (w) { dates[w.date] = true; });
    M.week = [];
    for (var i = 0; i < 7; i++) {
      var iso = addDays(ws, i);
      var done = !!dates[iso];
      var today = iso === TODAY;
      M.week.push({
        iso: iso,
        cap: 'MTWTFSS'.charAt(i),
        mark: done ? 'done' : (today ? 'today' : 'rest'),
        today: today,
        done: done
      });
    }
    M.weekSessions = M.history.filter(function (w) {
      return w.date >= ws && w.date <= addDays(ws, 6);
    });
    /* uDays: distinct days trained this week, which is the figure the
       shipped app put in the stats grid and in the weekly recap. */
    var seen = {};
    M.weekSessions.forEach(function (w) { seen[w.date] = true; });
    M.uDays = Object.keys(seen).length;
    /* F-HOME-005. The rest of the week's aggregates, which were measured
       here and then shown only on the recap: sets, volume and cardio
       minutes. Lifting volume and sets come from lifting sessions only --
       a cardio session carries no kg and no sets, and adding its zero to
       the total made the figure look like it had counted it. */
    M.weekSets = 0; M.weekVol = 0; M.weekCardio = 0;
    M.weekSessions.forEach(function (w) {
      if (w.kind === 'cardio') { M.weekCardio += w.min || 0; return; }
      M.weekSets += w.sets || 0;
      M.weekVol += w.kg || 0;
    });
    M.consistency = M.uDays >= 5 ? 'Incredible week'
      : M.uDays >= 3 ? 'Solid week'
      : M.uDays === 0 ? 'Rest week' : 'Building momentum';

    /* Weeks on plan: consecutive whole weeks carrying at least three
       lifting sessions, counted back from the week before this one. The
       current week is included only once it has earned it, so the figure
       never counts a week that has not happened. */
    var weeks = 0, cursor = addDays(ws, -7);
    if (liftsInWeek(M.history, ws) >= 3) { weeks++; }
    while (weeks < 520 && liftsInWeek(M.history, cursor) >= 3) {
      weeks++; cursor = addDays(cursor, -7);
    }
    M.weeks = weeks;

    /* The streak: consecutive days trained, counted back from today, or
       from yesterday when today has not been trained yet. With the seed
       this is 0 -- the last session was Sep 7 and today is Sep 9 -- and a
       streak of nothing is not shown at all. */
    var cur = dates[TODAY] ? TODAY : addDays(TODAY, -1);
    var streak = 0;
    while (dates[cur] && streak < 3650) { streak++; cur = addDays(cur, -1); }
    M.streak = streak;
    /* lk_badges, which is the key Settings' "Streaks and badges" switch
       writes and the key Profile reads. This read lk_gamingLayer, a third
       name nothing in the build has ever written, so the streak pill could
       not appear however long the streak ran: the switch was on, Profile
       showed "3 days in a row", and Home showed nothing. */
    M.gaming = bool('lk_badges');

    M.last = M.history[0] || null;
    M.lastLift = null;
    for (var j = 0; j < M.history.length; j++) {
      if (M.history[j].kind === 'lift') { M.lastLift = M.history[j]; break; }
    }
    M.recent = M.history.slice(0, 5);
    M.next = nextSession(M);
    M.lift = climbingLift(M.history);
    M.trainedToday = !!dates[TODAY];
    return M;
  }

  function liftsInWeek(history, ws) {
    var a = ws, b = addDays(ws, 6), c = 0;
    history.forEach(function (w) { if (w.kind === 'lift' && w.date >= a && w.date <= b) c++; });
    return c;
  }

  /* Which session comes next, and how long it takes.

     Both were literals: "Push, PPL, 5 exercises, about 50 min". The day now
     comes from the split -- the one after the day the last lifting session
     used, which its name carries -- and the exercise count from that day's
     own list. The length is the median of how long that day has actually
     taken, because an estimate the app can measure should not be a guess:
     with the seed, Push has taken 55, 57 and 51 minutes, so it says 55. */
  function nextSession(M) {
    var sp = M.splits[0];
    if (!sp || !sp.days || !sp.days.length) return null;
    var idx = -1;
    if (M.lastLift) {
      var nm = String(M.lastLift.name).toLowerCase();
      for (var i = 0; i < sp.days.length; i++) {
        if (nm.indexOf(String(sp.days[i].name).toLowerCase()) >= 0) { idx = i; break; }
      }
    }
    var day = sp.days[(idx + 1) % sp.days.length];
    var count = (day.exercises || []).length;
    var mins = medianMinutes(M.history, day.name);
    return {
      name: day.name,
      split: sp.name,
      /* The key the workout log opens a day by. "Start Push" used to switch
         to the Train tab and start nothing. */
      key: sp.id + ':' + String(day.name || '').toLowerCase().replace(/\W+/g, '-'),
      exercises: count,
      minutes: mins || (count * 9 + 5),
      measured: !!mins
    };
  }
  function medianMinutes(history, dayName) {
    var mins = [];
    var needle = String(dayName).toLowerCase();
    history.forEach(function (w) {
      if (w.kind !== 'lift' || !w.min) return;
      if (String(w.name).toLowerCase().indexOf(needle) < 0) return;
      mins.push(w.min);
    });
    if (!mins.length) return 0;
    mins.sort(function (a, b) { return a - b; });
    /* To the nearest five minutes. The median of six Push sessions is 55.5
       and the card says "about": a figure that says about should not then
       claim a minute it cannot know. */
    return Math.round(mins[Math.floor(mins.length / 2)] / 5) * 5;
  }

  /* The climbing lift. This was a literal too -- id, name, series and the
     "up 12.5 kg in 5 weeks" -- so it could not have followed a session
     logged today. It is now the lift whose top set has gained the most
     across the stored history, with its last six top sets as the series. */
  function climbingLift(history) {
    var byId = {};
    for (var i = history.length - 1; i >= 0; i--) {
      var w = history[i];
      if (w.kind !== 'lift' || !w.exercises) continue;
      w.exercises.forEach(function (ex) {
        var top = topSet(ex);
        if (!top) return;
        var rec = byId[ex.id] || (byId[ex.id] = { id: ex.id, name: ex.name, points: [] });
        rec.points.push({ date: w.date, kg: top });
      });
    }
    var best = null;
    Object.keys(byId).forEach(function (k) {
      var r = byId[k];
      if (r.points.length < 3) return;
      var from = r.points[0].kg, to = r.points[r.points.length - 1].kg;
      var gain = to - from;
      if (gain <= 0) return;
      if (!best || gain > best.gainKg) {
        best = {
          id: r.id, name: r.name, fromKg: from, topKg: to, gainKg: gain,
          weeks: Math.max(1, Math.round(daysBetween(r.points[0].date, r.points[r.points.length - 1].date) / 7)),
          series: r.points.slice(-6).map(function (p) { return p.kg; })
        };
      }
    });
    return best;
  }
  function topSet(ex) {
    var top = null;
    (ex.sets || []).forEach(function (st) {
      if (!st.done || st.warm || st.kg === null || st.kg === undefined) return;
      if (top === null || st.kg > top) top = st.kg;
    });
    return top;
  }

  /* ---- blocks ----------------------------------------------------- */

  /* The hero figure and the week rhythm, side by side on the page
     ground. Read-only, so there is no target here to undersize. */
  function momentum(M) {
    var read = 'This week, Monday first: ' + M.week.map(function (d) {
      var name = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][M.week.indexOf(d)];
      return name + (d.today ? ' is today and ' : ' ') + (d.done ? 'trained' : 'not trained');
    }).join(', ') + '.';
    var days = M.week.map(function (d) {
      return '<span class="week__day' + (d.today ? ' week__day--now' : '') + '">' +
               '<span class="week__mark week__mark--' + d.mark + '"></span>' +
               '<span class="week__cap" aria-hidden="true">' + d.cap + '</span>' +
             '</span>';
    }).join('');
    /* F-HOME-005. The week's own line: days trained and the label the
       shipped app put on them. It was measured and then never shown. */
    var line = '<p class="t-detail mt-3" data-testid="week-summary">' +
      n(M.uDays) + ' ' + plural(M.uDays, 'day', 'days') + ' this week &middot; ' + M.consistency +
      '</p>';
    /* The three aggregates under it, each one only when the week has it:
       a week with no cardio should not print "0 min cardio", and a week
       with no lifting should not print a volume of nothing. */
    var bits = [];
    if (M.weekSets) bits.push(n(M.weekSets) + ' ' + plural(M.weekSets, 'set', 'sets'));
    if (M.weekVol) bits.push(kg(M.weekVol));
    if (M.weekCardio) bits.push(n(M.weekCardio) + ' min cardio');
    var totals = bits.length
      ? '<p class="t-meta mt-1" data-testid="week-totals">' + bits.join(' &middot; ') + '</p>'
      : '';
    /* F-GAME-001. The streak, on Home and on the Profile header, and only
       when the gaming layer is switched on -- which it is not by default,
       and a streak of zero is never claimed. */
    var streak = (M.gaming && M.streak > 0)
      ? '<span class="streakpill" data-testid="streak-pill">' + ICO.flame +
          '<span class="num">' + M.streak + '</span>' +
          '<span class="vis-hidden">day streak</span></span>'
      : '';
    return '' +
      '<div class="hstack hstack--4 mt-4" data-testid="momentum">' +
        '<div class="hero">' +
          '<span class="hero__figure">' +
            '<span class="t-hero num" data-testid="hero-value">' + M.weeks + '</span>' +
            '<span class="hero__unit">' + plural(M.weeks, 'week', 'weeks') + '</span>' +
          '</span>' +
          '<span class="hero__label">On plan</span>' +
        '</div>' +
        '<div class="week grow" role="img" aria-label="' + esc(read) + '" data-testid="week-rhythm">' + days + '</div>' +
      '</div>' +
      '<div class="hstack hstack--2">' + line + streak + '</div>' + totals;
  }

  function sessionSub(w) {
    if (w.kind === 'cardio') {
      return when(w.date) + ' &middot; ' + n(w.min) + ' min';
    }
    return when(w.date) + ' &middot; ' + n(w.sets) + ' sets &middot; ' + kg(w.kg);
  }

  function lastRow(M) {
    if (!M.last) return '';
    return '' +
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">Last session</h2></div>' +
        '<div class="card card--flush">' +
          '<button class="row" data-testid="row-last-session" data-id="' + esc(M.last.id) + '">' +
            '<span class="ico-well">' + (M.last.kind === 'cardio' ? ICO.run : ICO.lift) + '</span>' +
            '<span class="row__main stack">' +
              '<span class="row__title">' + esc(M.last.name) + '</span>' +
              '<span class="row__sub">' + sessionSub(M.last) + '</span>' +
            '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
          /* The way back through everything already trained. Three scales
             were cut from this screen during the rebuild -- the Weekly
             Recap, the month calendar, and a daily view the old app never
             had -- and putting three entrances back on a screen rebuilt
             down to four blocks would undo the rebuild. One row, one
             destination; the segment inside it does the choosing. */
          '<button class="row" data-testid="row-recap">' +
            '<span class="ico-well">' + ICO.plan + '</span>' +
            '<span class="row__main stack">' +
              '<span class="row__title">Recap</span>' +
              '<span class="row__sub">Day, week and month</span>' +
            '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
        '</div>' +
      '</div>';
  }

  /* F-HOME-013 and F-HOME-014. The five most recent sessions, each one a
     target, and a way to the rest of them. The rebuild cut the list to a
     single "last session" row, and that row went to Train -- so there was
     no route from Home to any session's own detail at all. Each row now
     hands workout-detail the id it is about, which is how Train and Recap
     already open it. */
  function recentBlock(M) {
    if (M.recent.length < 2) return '';
    var rows = M.recent.map(function (w) {
      return '<button class="row" data-testid="row-recent" data-id="' + esc(w.id) + '">' +
               '<span class="ico-well">' + (w.kind === 'cardio' ? ICO.run : ICO.lift) + '</span>' +
               '<span class="row__main stack">' +
                 '<span class="row__title">' + esc(w.name) + '</span>' +
                 '<span class="row__sub">' + sessionSub(w) + '</span>' +
               '</span>' +
               '<span class="row__chev">' + ICO.chev + '</span>' +
             '</button>';
    }).join('');
    return '' +
      '<div class="section">' +
        '<div class="section__head">' +
          '<h2 class="t-label grow">Recent</h2>' +
          '<button class="btn btn--tertiary btn--sm" data-testid="recent-see-all">See all</button>' +
        '</div>' +
        '<div class="card card--flush">' + rows + '</div>' +
      '</div>';
  }

  /* Sparkline. Six top sets, plotted in a 64x24 box, endpoints named
     in the row text so the drawing is never the only source. */
  function sparkline(series) {
    var lo = Math.min.apply(null, series), hi = Math.max.apply(null, series);
    var span = hi - lo || 1;
    var pts = series.map(function (v, i) {
      var x = (i / Math.max(1, series.length - 1)) * 60 + 2;
      var y = 22 - ((v - lo) / span) * 20;
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    var end = pts[pts.length - 1].split(',');
    return '<svg class="spark" viewBox="0 0 64 24" aria-hidden="true">' +
             '<polyline class="spark__line" points="' + pts.join(' ') + '"/>' +
             '<circle class="spark__dot" cx="' + end[0] + '" cy="' + end[1] + '" r="2.5"/>' +
           '</svg>';
  }

  function liftRow(l) {
    if (!l) return '';
    return '' +
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">Climbing</h2></div>' +
        '<div class="card card--flush">' +
          '<button class="row" data-testid="row-climbing-lift" data-id="' + esc(l.id) + '">' +
            '<span class="row__main stack">' +
              '<span class="row__title">' + esc(l.name) + '</span>' +
              '<span class="row__sub">Up ' + kg(l.gainKg) + ' in ' + n(l.weeks) + ' ' + plural(l.weeks, 'week', 'weeks') + '</span>' +
            '</span>' +
            sparkline(l.series) +
            '<span class="row__value">' + kg(l.topKg) + '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
        '</div>' +
      '</div>';
  }

  /* ---- the cycle row ----------------------------------------------
     It appears only when the profile has cycle tracking on, the same gate
     the screen behind it uses -- a row that leads to "this is off" is a row
     that wastes a tap.

     WHAT IT SAID. "Day 16 / Luteal, estimated, next period in 12 days",
     typed in. lk_mcProfile says the last period started on 2026-08-29 with a
     28-day cycle, so on Sep 9 it is day 12, follicular, and the next period
     is Sep 26 -- seventeen days away, not twelve.

     WHERE IT COMES FROM NOW. LKFixtures.cycleOn(), which is the one
     calculator the Cycle screen reads as well, so the row and the screen
     behind it cannot disagree again. It also reports a cycle that has run
     past its length as "late" with a day count rather than wrapping the
     number round, and returns no day at all for a start date in the future.

     DISCREET MODE. mcProfile.discreet is a real setting: the Cycle screen
     hides the phase name and the symptoms when it is on, so this row hides
     the phase too and shows only the day and the date. */
  function mcProfile() {
    var p = get('lk_mcProfile', null);
    return (p && typeof p === 'object') ? p : {};
  }
  var PHASE_NAME = { menstrual: 'Period', follicular: 'Follicular',
                     ovulatory: 'Ovulation', luteal: 'Luteal', late: 'Late' };
  function cycleFacts() {
    if (!(window.LKFixtures && typeof LKFixtures.cycleOn === 'function')) return null;
    /* cycleOn() reads LKFixtures.mcProfile, which is the seed. The store is
       the truth the moment somebody has edited their own cycle, so the
       stored profile is put in front of the calculator for the length of
       the call and the seed is put back after it. The calculator should
       take a profile argument instead; until it does, this is the one place
       that difference is handled, rather than this screen growing a second
       copy of the arithmetic -- which is how the two disagreed before. */
    var stored = get('lk_mcProfile', null);
    var seed = LKFixtures.mcProfile;
    try {
      if (stored && typeof stored === 'object') LKFixtures.mcProfile = stored;
      return LKFixtures.cycleOn(TODAY);
    } catch (e) {
      return null;
    } finally {
      LKFixtures.mcProfile = seed;
    }
  }
  function cycleRow() {
    if (!bool('lk_cycle')) return '';
    var f = cycleFacts();
    var discreet = !!mcProfile().discreet;
    var title = 'Cycle tracking', sub = 'Not set up yet &middot; two dates is all it needs';
    if (f && f.overdue) {
      title = 'Day ' + n(f.day);
      sub = (discreet ? '' : 'Period is ' + n(f.overdue) + ' ' + plural(f.overdue, 'day', 'days') +
            ' late &middot; ') + 'estimated from a ' + n(f.cycleLen) + '-day cycle';
    } else if (f && f.day !== null && f.day !== undefined) {
      title = 'Day ' + n(f.day);
      sub = (discreet ? '' : (PHASE_NAME[f.phase] || f.phase) + ', estimated &middot; ') +
            'next period in ' + n(f.daysToNext) + ' ' + plural(f.daysToNext, 'day', 'days');
    }
    return '' +
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">Cycle</h2></div>' +
        '<div class="card card--flush">' +
          '<button class="row" data-testid="row-cycle">' +
            '<span class="row__main stack">' +
              '<span class="row__title" data-testid="cycle-day">' + title + '</span>' +
              '<span class="row__sub" data-testid="cycle-sub">' + sub + '</span>' +
            '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
        '</div>' +
      '</div>';
  }

  /* ---- the card stack ---------------------------------------------
     F-HOME-006, F-HOME-009, F-SUPP-010, F-SHOP-031, F-CYCLE-210.

     The rebuild cut the feed cards outright, and the sign-off found that
     with them went four things that are only true for part of a day: the
     insight, what is due to be swallowed, what has run out, and what is
     due to be injected. None of them had anywhere to live, so none of them
     were built.

     The stack is the feed: each card asks its own data whether it applies,
     and a card with nothing to say does not render. Nothing here is on a
     timer or a rotation. Every card can be put away, and putting one away
     is written to lk_homeLayout -- the shipped app's own key for which
     Home blocks a person has hidden -- so it is still away tomorrow. The
     seed ships with the insight already hidden, which is why the stack
     carries its own way back: a hidden card is a decision, not a deletion.
     ------------------------------------------------------------------ */
  /* F-TRAIN-320. The five training cards the sign-off found missing, built
     from what is already stored rather than from a rotation:

       recovery   — what the last few check-ins said about sleep and soreness
       restday    — a run of consecutive days trained, and nothing between them
       comeback   — a gap since the last session
       nextsplit  — what follows the session the answer card names

     THE CHECK-IN CARD IS CUT, and this is the reason. Coach owns the daily
     check-in: it writes the whole of lk_feedback -- energy, sleep, soreness,
     stress and mood -- and reads it back the same way, including
     "log[0].sleep <= 2", which a null satisfies. A one-tap mood card here
     would write an entry for today with four of the five answers missing,
     and Coach would then offer "I have slept badly. Should I still train
     today?" about a night nobody rated. A card that makes another screen
     say something untrue is worse than a card that is not there.

     Each of these renders only when its own data says so, which means most
     of them are silent on a well-rested week -- that is the point of them.
     None is on a timer and none rotates. */
  var CARD_IDS = ['recovery', 'comeback', 'restday', 'insight', 'nextsplit', 'supps', 'restock', 'cycle'];
  var CARD_NAMES = {
    insight: 'Insight', supps: 'Supplements due', restock: 'Running low', cycle: 'Compounds due',
    recovery: 'Recovery', restday: 'Rest day', comeback: 'Comeback', nextsplit: 'Next session'
  };
  function hiddenCards() {
    var L = get('lk_homeLayout', {}) || {};
    return (L && typeof L.hidden === 'object' && L.hidden) ? L.hidden : {};
  }
  function hideCard(id, on) {
    var L = get('lk_homeLayout', {}) || {};
    if (typeof L !== 'object') L = {};
    L.hidden = (typeof L.hidden === 'object' && L.hidden) ? L.hidden : {};
    if (on === !!L.hidden[id]) return false;
    if (on) L.hidden[id] = true; else delete L.hidden[id];
    return set('lk_homeLayout', L);
  }

  function cardShell(id, title, icon, bodyHTML, testid) {
    return '' +
      '<div class="feedcard" data-testid="' + testid + '">' +
        '<div class="feedcard__head">' +
          '<span class="ico-well">' + icon + '</span>' +
          '<h3 class="t-label grow">' + esc(title) + '</h3>' +
          '<button class="iconbtn feedcard__dismiss" data-act="dismiss-card" data-card="' + id + '" ' +
            'data-testid="dismiss-' + id + '" ' +
            'aria-label="Put the ' + esc(title) + ' card away">' + ICO.close + '</button>' +
        '</div>' +
        bodyHTML +
      '</div>';
  }

  /* F-HOME-006. The insight, worked out here and cached for the day in
     lk_proactiveTip -- the shipped app's key, which holds {text, date}.
     The shipped card came back from a model over the network. There is no
     network in this build, so this one is arithmetic over the stored
     history and it says so on its face: a sentence that reads like advice
     and is not labelled is the one thing this screen must not print. */
  function insightText(M) {
    if (M.lift && M.lift.gainKg > 0) {
      return LKUnits.fmt(M.lift.fromKg) + ' to ' + LKUnits.fmt(M.lift.topKg) + ' on the ' +
        M.lift.name.toLowerCase() + ' top set in ' + M.lift.weeks + ' weeks. That is ' +
        LKUnits.fmt(Math.round((M.lift.gainKg / M.lift.weeks) * 100) / 100, 1) + ' a week, and it is still going up.';
    }
    if (M.weeks > 0) {
      return M.weeks + ' weeks with three lifting sessions in each. The weeks are the part most people lose.';
    }
    return '';
  }
  function insightCard(M) {
    /* Worked out fresh every paint. The finished sentence used to be cached
       for the day, so after a switch to pounds the card still read "115 kg"
       next to a figure reading 31,665 lb on the same screen. The cache keeps
       the day's line for anything that wants to read it back, but the screen
       shows what the current unit says. */
    var text = insightText(M);
    if (!text) return '';
    var cached = get('lk_proactiveTip', null);
    if (!cached || cached.date !== TODAY || cached.text !== text) {
      set('lk_proactiveTip', { text: text, date: TODAY });
    }
    return cardShell('insight', 'Worth knowing', ICO.spark,
      '<p class="t-body mt-2">' + esc(text) + '</p>' +
      '<p class="t-meta mt-2">Worked out from your logged sets on this device. Not a coach, and nothing was sent anywhere.</p>',
      'card-insight');
  }

  /* F-SUPP-010. What is due now, not what is due today: the shipped card
     has a window per time of day and this one keeps them -- Morning 05-12,
     Pre-Workout 12-18, With Food 11-14, Before Bed from 19, anything else
     always due. A supplement already ticked off today is gone from the
     card, and the tick is written to lk_suppLog on the tap rather than to
     a Save button somewhere else. */
  var SUPP_WINDOW = {
    'Morning': [5, 12], 'Pre-Workout': [12, 18], 'Pre-workout': [12, 18],
    'With Food': [11, 14], 'Before Bed': [19, 24]
  };
  function suppDue(nowHour) {
    var log = get('lk_suppLog', {}) || {};
    var today = log[TODAY] || [];
    return arr('lk_supplements').filter(function (s) {
      if (s.reminder === false) return false;
      if (today.indexOf(s.name) >= 0) return false;
      var f = String(s.freq || 'Daily').toLowerCase();
      if (f.indexOf('other') >= 0 && Math.floor(ms(TODAY) / 86400000) % 2 !== 0) return false;
      if (f.indexOf('week') >= 0 && dow(TODAY) !== 1) return false;
      var w = SUPP_WINDOW[s.timeOf];
      if (w && (nowHour < w[0] || nowHour >= w[1])) return false;
      return true;
    });
  }
  function suppCard(M, nowHour) {
    var due = suppDue(nowHour);
    if (!due.length) return '';
    var rows = due.map(function (s) {
      return '<div class="row row--static">' +
               '<span class="row__main stack">' +
                 '<span class="row__title">' + esc(s.name) + '</span>' +
                 '<span class="row__sub">' + esc(s.dose || '') + (s.timeOf ? ' &middot; ' + esc(s.timeOf) : '') + '</span>' +
               '</span>' +
               '<button class="btn btn--secondary btn--sm" data-act="supp-taken" data-name="' + esc(s.name) + '" ' +
                 'data-testid="supp-taken">Taken</button>' +
             '</div>';
    }).join('');
    return cardShell('supps', 'Supplements due', ICO.pill,
      '<div class="card card--flush mt-2">' + rows + '</div>', 'card-supps');
  }

  /* F-SHOP-031, and F-HOME-015 underneath it.

     Two things belong on this card: a staple whose restock interval has
     elapsed, and a pantry item somebody marked empty. The shipped app auto-
     added the first kind to the shopping list on every Home mount and then
     showed the same rows here with "N days overdue", so the card is what
     the auto-add did, made visible. "Bought" clears it, the way the pantry
     screen's own control does; the shopping list is not edited from here
     beyond the add that already happened. */
  function pantryDue() {
    var list = arr('lk_shoppingList');
    var onList = {};
    list.forEach(function (it) { onList[String(it.itemName).toLowerCase()] = true; });
    var out = [];
    arr('lk_pantryItems').forEach(function (it) {
      var since = it.lastBought || it.dateAdded;
      var due = null;
      if (it.staple && since) {
        var dueISO = addDays(String(since).slice(0, 10), Number(it.intervalDays) || 7);
        var over = daysBetween(dueISO, TODAY);
        if (over >= 0) due = over === 0 ? 'due now' : n(over) + ' ' + plural(over, 'day', 'days') + ' overdue';
      }
      if (!due && it.empty) due = 'marked empty';
      if (!due) return;
      out.push({ id: it.id, name: it.name, why: due, onList: !!onList[String(it.name).toLowerCase()] });
    });
    return out;
  }
  /* F-HOME-015. The one invisible thing Home did: on mount, a staple whose
     interval has elapsed goes on the shopping list, once, and is marked
     bought-forward so it is not added again tomorrow. It runs before the
     first render so the card below can say "on your list" truthfully. */
  function autoAddDueStaples() {
    var pantry = arr('lk_pantryItems');
    if (!pantry.length) return 0;
    var list = arr('lk_shoppingList');
    var onList = {};
    list.forEach(function (it) { onList[String(it.itemName).toLowerCase()] = true; });
    var added = 0;
    pantry.forEach(function (it) {
      if (!it.staple) return;
      var since = it.lastBought || it.dateAdded;
      if (!since) return;
      var dueISO = addDays(String(since).slice(0, 10), Number(it.intervalDays) || 7);
      if (daysBetween(dueISO, TODAY) < 0) return;
      if (onList[String(it.name).toLowerCase()]) return;
      list.push({
        id: 'sh_' + ms(TODAY) + '_' + String(it.id).slice(-4),
        itemName: it.name, quantity: it.quantity || 1, unit: it.unit || '',
        category: it.category || 'pantry', dateAdded: TODAY + 'T00:00:00.000Z',
        checked: false, auto: true
      });
      added++;
    });
    if (added) set('lk_shoppingList', list);
    return added;
  }
  function restockCard() {
    var due = pantryDue();
    if (!due.length) return '';
    var rows = due.map(function (it) {
      return '<div class="row row--static">' +
               '<span class="row__main stack">' +
                 '<span class="row__title">' + esc(it.name) + '</span>' +
                 '<span class="row__sub">' + it.why + (it.onList ? ' &middot; on your list' : '') + '</span>' +
               '</span>' +
               '<button class="btn btn--secondary btn--sm" data-act="staple-bought" data-id="' + esc(it.id) + '" ' +
                 'data-testid="staple-bought">Bought</button>' +
             '</div>';
    }).join('');
    return cardShell('restock', 'Running low', ICO.cart,
      '<div class="card card--flush mt-2">' + rows + '</div>', 'card-restock');
  }

  /* F-CYCLE-210. Compounds due today, and only when performance tracking
     is on -- the same gate the Stack screen uses, and off by default.

     The cycles themselves are read from lk_cycles. Nothing in this build
     writes that key yet (Stack holds its cycles in a literal), so with the
     seed alone this card has nothing to read and does not render. It is
     wired to the key rather than to a copy of Stack's data on purpose: two
     screens with their own copy of the same cycle is the defect this
     sign-off keeps finding, and one of them inventing the other's data is
     worse than a card that waits. */
  function dueOn(comp, iso) {
    var f = String(comp.freq || '');
    if (f === 'daily') return true;
    if (f === 'eod') return daysBetween(comp.since || iso, iso) % 2 === 0;
    if (f === 'e3d') return daysBetween(comp.since || iso, iso) % 3 === 0;
    if (f === 'weekly') return dow(iso) === (comp.day !== undefined ? comp.day : dow(comp.since || iso));
    if (f === 'twice-weekly') {
      var d0 = comp.day !== undefined ? comp.day : dow(comp.since || iso);
      return dow(iso) === d0 || dow(iso) === (d0 + 3) % 7;
    }
    return false;
  }
  function compoundsDue() {
    if (!bool('lk_perfTracking')) return [];
    var out = [];
    arr('lk_cycles').forEach(function (c) {
      if (c.status !== 'active') return;
      if (c.start && c.start > TODAY) return;
      if (c.endActual && c.endActual < TODAY) return;
      (c.comps || []).forEach(function (x) {
        if (!dueOn(x, TODAY)) return;
        if ((x.taken || []).indexOf(TODAY) >= 0) return;
        out.push({ cycle: c.id, name: x.name, dose: x.dose, route: x.route, cycleName: c.name });
      });
    });
    return out;
  }
  function compoundCard() {
    var due = compoundsDue();
    if (!due.length) return '';
    var rows = due.map(function (x) {
      return '<div class="row row--static">' +
               '<span class="row__main stack">' +
                 '<span class="row__title">' + esc(x.name) + '</span>' +
                 '<span class="row__sub">' + esc(x.dose || '') + ' &middot; ' + esc(x.route || '') +
                   ' &middot; ' + esc(x.cycleName || '') + '</span>' +
               '</span>' +
               '<button class="btn btn--secondary btn--sm" data-act="comp-taken" data-cycle="' + esc(x.cycle) + '" ' +
                 'data-name="' + esc(x.name) + '" data-testid="comp-taken">Taken</button>' +
             '</div>';
    }).join('');
    return cardShell('cycle', 'Compounds due', ICO.pill,
      '<div class="card card--flush mt-2">' + rows + '</div>', 'card-compounds');
  }

  /* ---- the four training cards ------------------------------------
     Every figure on them is counted out of lk_feedback, lk_history or
     lk_splits on this paint. Nothing here is advice the build cannot
     stand behind: each card says what was logged and stops. */

  /* The check-ins inside a window, newest first. lk_feedback's own shape:
     an ISO `date`, a US `dateStr`, and 1-5 scales. */
  function feedbackWithin(days) {
    var out = [];
    arr('lk_feedback').forEach(function (c) {
      if (!c) return;
      var d = c.date && /^\d{4}-\d{2}-\d{2}/.test(String(c.date)) ? String(c.date).slice(0, 10) : null;
      if (!d && c.dateStr) {
        var a = String(c.dateStr).split('/');
        if (a.length === 3) d = a[2] + '-' + ('0' + a[0]).slice(-2) + '-' + ('0' + a[1]).slice(-2);
      }
      if (!d) return;
      var ago = daysBetween(d, TODAY);
      if (ago < 0 || ago > days) return;
      out.push({ iso: d, ago: ago, sleep: Number(c.sleep), soreness: Number(c.soreness) });
    });
    out.sort(function (a, b) { return a.ago - b.ago; });
    return out;
  }
  function recoveryCard() {
    var log = feedbackWithin(7);
    if (log.length < 2) return '';
    var sore = log.filter(function (c) { return c.soreness >= 4; }).length;
    var poor = log.filter(function (c) { return c.sleep <= 2; }).length;
    if (sore < 2 && poor < 2) return '';
    var says = [];
    if (sore >= 2) says.push(n(sore) + ' logged soreness at 4 or more');
    if (poor >= 2) says.push(n(poor) + ' logged sleep at 2 or less');
    return cardShell('recovery', 'Recovery', ICO.moon,
      '<p class="t-body mt-2">Of your last ' + n(log.length) + ' check-' +
        plural(log.length, 'in', 'ins') + ', ' + says.join(' and ') + '.</p>' +
      '<p class="t-meta mt-2">Counted from the check-ins you saved in the last seven days. Nothing here changes your session.</p>',
      'card-recovery');
  }
  /* A run of days trained with nothing between them. The streak is already
     counted for the pill; this is the same figure read the other way round,
     so the two can never disagree. */
  function restdayCard(M) {
    if (M.streak < 5 || !M.trainedToday) return '';
    return cardShell('restday', 'Rest day', ICO.moon,
      '<p class="t-body mt-2">' + n(M.streak) + ' days in a row with a session on each. ' +
        'A day off is the part of the plan that does the repairing.</p>' +
      '<p class="t-meta mt-2">Counted from your logged sessions. Nothing is skipped for you.</p>',
      'card-restday');
  }
  function comebackCard(M) {
    if (!M.last || M.trainedToday) return '';
    var gap = daysBetween(M.last.date, TODAY);
    if (gap < 4) return '';
    return cardShell('comeback', 'Since the last one', ICO.lift,
      '<p class="t-body mt-2">' + n(gap) + ' days since ' + esc(M.last.name) + '. ' +
        'The session on the card above is the one that comes next, unchanged.</p>' +
      '<p class="t-meta mt-2">Nothing has been reset or dropped from your plan.</p>',
      'card-comeback');
  }
  /* What follows the session the answer card names, so the week has a shape
     beyond today. Read off the split's own day order. */
  function nextSplitCard(M) {
    var sp = M.splits[0];
    if (!sp || !sp.days || sp.days.length < 2 || !M.next) return '';
    var idx = -1;
    for (var i = 0; i < sp.days.length; i++) {
      if (String(sp.days[i].name) === String(M.next.name)) { idx = i; break; }
    }
    if (idx < 0) return '';
    var after = sp.days[(idx + 1) % sp.days.length];
    var then = sp.days.length > 2 ? sp.days[(idx + 2) % sp.days.length] : null;
    return cardShell('nextsplit', 'After that', ICO.plan,
      '<p class="t-body mt-2">' + esc(M.next.name) + ', then ' + esc(after.name) +
        (then ? ', then ' + esc(then.name) : '') + '.</p>' +
      '<p class="t-meta mt-2">The order in ' + esc(sp.name) + '. Which day you train is yours to pick; the rotation is the split’s.</p>',
      'card-nextsplit');
  }

  function builtCard(id, M) {
    if (id === 'insight') return insightCard(M);
    if (id === 'supps') return suppCard(M, new Date().getHours());
    if (id === 'restock') return restockCard();
    if (id === 'cycle') return compoundCard();
    if (id === 'recovery') return recoveryCard();
    if (id === 'restday') return restdayCard(M);
    if (id === 'comeback') return comebackCard(M);
    if (id === 'nextsplit') return nextSplitCard(M);
    return '';
  }

  function stack(M) {
    var hid = hiddenCards();
    var html = '', hiddenWithContent = 0;
    CARD_IDS.forEach(function (id) {
      var card = builtCard(id, M);
      if (!card) return;
      if (hid[id]) { hiddenWithContent++; return; }
      html += card;
    });
    if (!html && !hiddenWithContent) return '';
    return '<div class="feed mt-4" data-testid="card-stack">' + html +
      (hiddenWithContent
        ? '<button class="btn btn--tertiary btn--sm feed__restore" data-act="restore-cards" data-testid="restore-cards">' +
            'Show ' + hiddenWithContent + ' hidden ' + plural(hiddenWithContent, 'card', 'cards') + '</button>'
        : '') +
      '</div>';
  }

  /* ---- the layout, and the editor for it -------------------------
     F-HOME-003 and F-PROF-024.

     lk_homeLayout was already the key each feed card's dismiss writes to,
     and it already carries `hidden`. This adds the other half the shipped
     app had: which blocks are on the screen, and in what order. One key,
     two fields:

       lk_homeLayout = { hidden: { insight: true, "blk:recent": true },
                         order:  ["stack", "last", "recent", "climbing", "cycle"] }

     A feed card's id is bare -- it is the shipped app's own -- and a block's
     is prefixed "blk:", so the two cannot collide in one map.

     TWO BLOCKS DO NOT MOVE. The week band and the answer card. The answer
     card is the screen: a Home whose owner has scrolled the answer under
     four other blocks is a Home that has stopped answering, and a control
     that lets somebody do that by accident is not a preference. The band
     can be hidden; it cannot be moved below the answer, because it is the
     week the answer is about. Everything under them reorders and hides.

     Settings cut its own layout editor with a reason recorded there
     ("Ordering Home is the designer's job, not a setting"). That reason
     holds for a list of abstract block names in a settings screen, three
     taps from the thing being described. It does not hold here, where the
     control is on the block itself and the result is the screen you are
     standing on. */
  var BLOCKS = [
    ['stack', 'Your feed'],
    ['last', 'Last session'],
    ['recent', 'Recent'],
    ['climbing', 'Climbing'],
    ['cycle', 'Cycle']
  ];
  var editing = false;

  function layout() {
    var L = get('lk_homeLayout', {}) || {};
    return (typeof L === 'object' && L) ? L : {};
  }
  function blockHidden(id) { return !!hiddenCards()['blk:' + id]; }
  function blockOrder() {
    var L = layout();
    var want = Array.isArray(L.order) ? L.order : [];
    var known = BLOCKS.map(function (b) { return b[0]; });
    var out = want.filter(function (id) { return known.indexOf(id) >= 0; });
    known.forEach(function (id) { if (out.indexOf(id) < 0) out.push(id); });
    return out;
  }
  function setOrder(list) {
    var L = layout();
    L.order = list;
    return set('lk_homeLayout', L);
  }
  function moveBlock(id, dir) {
    var o = blockOrder(), i = o.indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= o.length) return false;
    o.splice(j, 0, o.splice(i, 1)[0]);
    return setOrder(o);
  }
  function blockLabel(id) {
    for (var i = 0; i < BLOCKS.length; i++) if (BLOCKS[i][0] === id) return BLOCKS[i][1];
    return id;
  }
  function blockHTML(id, M) {
    if (id === 'stack') return stack(M);
    if (id === 'last') return lastRow(M);
    if (id === 'recent') return recentBlock(M);
    if (id === 'climbing') return liftRow(M.lift);
    if (id === 'cycle') return cycleRow();
    return '';
  }

  /* In edit mode every block wears its own controls. Out of it the markup
     is exactly what it was: the editor costs the ordinary screen nothing. */
  function frame(id, label, inner, hidden, first, last) {
    var tools =
      '<div class="hstack hstack--2 mt-2">' +
        '<span class="t-label grow">' + esc(label) + '</span>' +
        (hidden
          ? '<button class="btn btn--secondary btn--sm" data-act="blk-show" data-blk="' + id + '" ' +
              'data-testid="blk-show-' + id + '">Show</button>'
          : '<button class="btn btn--tertiary btn--sm" data-act="blk-hide" data-blk="' + id + '" ' +
              'data-testid="blk-hide-' + id + '">Hide</button>') +
        (first === null ? '' :
          /* A 35px arrow is not a target. The pair carry their own width
             rather than the label's, because the label is one glyph. */
          '<button class="btn btn--tertiary btn--sm" style="min-width: var(--tap)" data-act="blk-up" data-blk="' + id + '" ' +
            'data-testid="blk-up-' + id + '" aria-label="Move ' + esc(label) + ' up"' +
            (first ? ' disabled' : '') + '>&uarr;</button>' +
          '<button class="btn btn--tertiary btn--sm" style="min-width: var(--tap)" data-act="blk-down" data-blk="' + id + '" ' +
            'data-testid="blk-down-' + id + '" aria-label="Move ' + esc(label) + ' down"' +
            (last ? ' disabled' : '') + '>&darr;</button>') +
      '</div>';
    return '<div class="card card--sunken mt-3" data-testid="blk-' + id + '"' +
      (hidden ? ' data-hidden="true"' : '') + '>' + tools +
      (hidden
        ? '<p class="t-meta mt-2">Hidden. Nothing in it is deleted.</p>'
        : (inner || '<p class="t-meta mt-2">Nothing to show here today.</p>')) +
      '</div>';
  }

  function blocksHTML(M) {
    var order = blockOrder(), out = '';
    order.forEach(function (id, i) {
      var hid = blockHidden(id);
      var inner = hid && !editing ? '' : blockHTML(id, M);
      if (editing) out += frame(id, blockLabel(id), inner, hid, i === 0, i === order.length - 1);
      else if (!hid) out += inner;
    });
    return out;
  }
  function momentumBlock(M) {
    var hid = blockHidden('momentum');
    if (editing) return frame('momentum', 'This week', hid ? '' : momentum(M), hid, null, null);
    return hid ? '' : momentum(M);
  }
  function customiseBar() {
    return '<div class="hstack hstack--2 mt-5">' +
      '<button class="btn ' + (editing ? 'btn--primary' : 'btn--tertiary') + ' btn--sm grow" ' +
        'data-act="layout-edit" aria-pressed="' + editing + '" data-testid="layout-edit">' +
        '<span class="btn__label">' + (editing ? 'Done' : 'Customise this screen') + '</span></button>' +
    '</div>' +
    (editing
      ? '<p class="t-meta mt-2" data-testid="layout-note">Hiding a block hides it here only. Nothing it shows is deleted, and it comes back from this list.</p>'
      : '');
  }

  /* ---- states ----------------------------------------------------- */
  var VIEWS = {};

  /* Training day. Raised card, verb first, rises into place. */
  VIEWS.training = function (M) {
    var s = M.next;
    var shape = s
      ? esc(s.split) + ' &middot; ' + n(s.exercises) + ' exercises &middot; about ' + n(s.minutes) + ' min' +
        (s.measured ? ', from your last ' + esc(s.name) + ' sessions' : '')
      : 'No split chosen yet';
    return '' +
      momentumBlock(M) +
      '<div class="card card--raised mt-4 enter-rise" data-testid="card-answer" data-answer="train">' +
        '<h2 class="t-title" data-testid="next-name">' + (s ? esc(s.name) : 'Train') + '</h2>' +
        '<p class="t-detail mt-2" data-testid="next-shape">' + shape + '</p>' +
        '<button class="btn btn--primary btn--block mt-4" data-testid="primary-action">' +
          ICO.play + '<span class="btn__label">Start ' + (s ? esc(s.name) : 'a session') + '</span>' +
        '</button>' +
        '<button class="btn btn--secondary btn--block mt-2" data-testid="action-choose-session">' +
          '<span class="btn__label">Choose another session</span>' +
        '</button>' +
      '</div>' +
      blocksHTML(M) + customiseBar();
  };

  /* Rest day. Sunken card, sentence first, settles into place. The
     session is still one tap away, but nothing here asks for it. */
  VIEWS.live = function (M) { return VIEWS.training(M); };

  VIEWS.rest = function (M) {
    var s = M.next;
    return '' +
      momentumBlock(M) +
      '<div class="card card--sunken mt-4 enter-settle" data-testid="card-answer" data-answer="rest">' +
        '<div class="hstack hstack--3">' +
          '<span class="ico-well">' + ICO.moon + '</span>' +
          '<div class="grow stack stack--1">' +
            '<h2 class="t-section">Rest day</h2>' +
            '<p class="t-detail" data-testid="rest-line">' + n(M.weekSessions.length) + ' ' +
              plural(M.weekSessions.length, 'session', 'sessions') + ' logged this week.' +
              (s ? ' Next is ' + esc(s.name) + '.' : '') + '</p>' +
          '</div>' +
        '</div>' +
        (s ? '<button class="btn btn--primary btn--block mt-4" data-testid="primary-action">' +
          ICO.play + '<span class="btn__label">Start ' + esc(s.name) + ' early</span>' +
        '</button>' : '') +
      '</div>' +
      blocksHTML(M) + customiseBar();
  };

  /* Empty. Nothing has been earned yet, so nothing is claimed: no
     hero figure, no week track, one sentence, one action.

     F-HOME-016. This was a dev state and only a dev state: `render(get
     ('state') || 'training')`, so a reader with no splits at all still got
     a training day, a session name and a Start button for a plan that did
     not exist. The state is now chosen by the data -- no splits means this
     -- and the dev switcher only overrides what the data already decides. */
  VIEWS.empty = function () {
    return '' +
      '<div class="empty mt-5 enter-settle" data-testid="card-answer" data-answer="empty">' +
        '<span class="empty__ico">' + ICO.plan + '</span>' +
        '<h2 class="empty__title">No sessions yet</h2>' +
        '<p class="empty__body">Build a split and LOCKED puts one session on this screen each training day.</p>' +
        '<button class="btn btn--primary" data-testid="primary-action">' +
          '<span class="btn__label">Build a split</span>' +
        '</button>' +
      '</div>';
  };

  /* A skeleton is a promise about the shape that is coming, so it holds the
     shape this screen actually loads into: the hero figure, the seven-day
     week track beside it, the session card, then the last-session row. The
     week track is in every other state of this screen and was missing here,
     which taught the wrong shape and then moved everything when the real one
     arrived. Seven marks, not one bar. */
  VIEWS.loading = function () {
    var days = '';
    for (var i = 0; i < 7; i++) {
      /* Sized like a mark, but not a .week__mark: that class paints its own
         white background and wins on source order, so a skeleton wearing it
         came out brighter than the screen it was standing in for. */
      days += '<span class="week__day">' +
              '<span class="skel" style="width: 100%; height: var(--sp-6)"></span>' +
              '<span class="skel" style="height: var(--sp-2); width: 10px; margin-top: 4px"></span></span>';
    }
    return '' +
      '<div class="hstack hstack--4 mt-4" role="status" aria-busy="true" aria-label="Loading today">' +
        '<div class="hero">' +
          '<span class="hero__figure">' +
            '<span class="skel" style="height: var(--sp-6); width: var(--sp-6)"></span>' +
          '</span>' +
          '<span class="skel mt-1" style="height: var(--sp-3); width: 48px"></span>' +
        '</div>' +
        '<div class="week grow">' + days + '</div>' +
      '</div>' +
      /* The week summary line -- "3 days this week, solid week" -- was added
         to the loaded view and not to this skeleton, so everything below it
         dropped 31px the moment the week arrived. A skeleton is a promise
         about the shape that is coming; it has to include every line the
         shape has. */
      '<div class="skel mt-3" style="height: var(--lh-13); width: 58%"></div>' +
      /* And the totals line under it, for the same reason: the week's sets,
         volume and cardio arrived after the skeleton had promised one line
         where there are two. */
      '<div class="skel mt-1" style="height: var(--lh-11); width: 44%"></div>' +
      /* The answer card gained a line when it started naming where the
         session's shape came from ("from your last Push sessions"), and the
         skeleton did not follow: 108px reserved against 139px loaded, so
         everything under it dropped 31px the moment the day arrived. */
      '<div class="card card--raised mt-4" data-testid="card-answer" data-answer="loading">' +
        '<div class="skel" style="height: var(--sp-5); width: 45%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-4); width: 80%"></div>' +
        '<div class="skel mt-4" style="height: var(--tap)"></div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">Last session</h2></div>' +
        '<div class="card card--flush">' +
          '<div class="row">' +
            '<span class="skel" style="height: var(--sp-6); width: var(--sp-6); border-radius: var(--r-md)"></span>' +
            '<span class="row__main stack stack--2">' +
              '<span class="skel" style="height: var(--sp-4); width: 58%"></span>' +
              '<span class="skel" style="height: var(--sp-3); width: 76%"></span>' +
            '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
  };

  /* Error. What happened, and the one thing that fixes it. No hero
     figure: the momentum data did not load either, and a number that
     might be wrong is worse than no number. */
  VIEWS.error = function () {
    return '' +
      '<div class="card card--raised mt-4 enter-rise" data-testid="card-answer" data-answer="error">' +
        '<div class="banner banner--error">' +
          ICO.alert +
          '<span><strong>Today did not load</strong>The training history on this device could not be read, so the session for today is unknown.</span>' +
        '</div>' +
        /* NOT data-testid="primary-action". That id is declared as the route
           into the workout log, so "Try again" on the screen that says it
           could not read your history started a session instead of trying
           again. It reloads, which is what trying again is. */
        '<button class="btn btn--primary btn--block mt-4" data-act="retry" data-testid="error-retry">' +
          '<span class="btn__label">Try again</span>' +
        '</button>' +
        '<button class="btn btn--secondary btn--block mt-2" data-testid="action-choose-session">' +
          '<span class="btn__label">Choose a session</span>' +
        '</button>' +
      '</div>';
  };

  /* ---- render ----------------------------------------------------- */
  var STATES = [
    ['auto', 'From your data'],
    ['training', 'Training day'],
    ['live', 'Session running'],
    ['rest', 'Rest day'],
    ['empty', 'Empty'],
    ['loading', 'Loading'],
    ['error', 'Error']
  ];
  var body = document.getElementById('body');
  var hdrDate = document.getElementById('hdr-date');
  var current = 'auto';
  var MODEL = null;

  /* The shelf is what a running session looks like from anywhere else in the
     app: it names the session, counts what is done, and gets back in one tap.
     A floating pill would do the same job while covering a row of content. */
  /* The shelf comes from the live session record, not from this screen.
     It used to be hand-written markup gated on a dev state, which meant it
     showed a fixed "Push A, 4 of 7, 38:12" whether or not a workout was
     running, and never showed a real one. The dev state is kept: it seeds a
     session so the demo can show the strip without anybody training. */
  function shelfHTML() {
    return window.LKSession && LKSession.get() ? LKSession.html() : '';
  }

  /* The demo's own "live" state, seeded into the record so the shelf on
     every other screen agrees with this one. */
  function seedDemoSession(on) {
    if (!window.LKSession) return;
    var live = LKSession.get();
    if (on && !live) LKSession.start({ name: 'Push A', startedAt: Date.now() - 2292000, done: 4, total: 7 });
    else if (!on && live && live.name === 'Push A') LKSession.end();
  }

  /* Which state the data is in. The screen used to take this from the dev
     switcher alone. */
  function autoState(M) {
    if (!M.splits.length) return 'empty';
    return M.trainedToday ? 'rest' : 'training';
  }

  var rendering = false;
  /* Set by an action whose own control disappears in the render it triggers. */
  var focusAfterRender = null;
  /* The first card that will be on screen after a restore. Restoring puts
     every card back, so the first id in the list is the first card, and its
     dismiss button is a real control that is certain to exist. */
  /* The FIRST CARD THAT WILL ACTUALLY BE THERE, not the first id in the
     list: most of these cards are silent on most days, so naming CARD_IDS[0]
     sent focus to a control that does not exist and dropped it to the body
     -- which is the very thing this is here to prevent. */
  function firstVisibleCardDismiss() {
    for (var i = 0; i < CARD_IDS.length; i++) {
      if (MODEL && builtCard(CARD_IDS[i], MODEL)) return 'dismiss-' + CARD_IDS[i];
    }
    return 'layout-edit';
  }

  function render(state) {
    if (rendering) return;
    rendering = true;
    try { paint(state); } finally { rendering = false; }
  }
  function paint(state) {
    /* What had focus, and where the caret was, so a re-render does not throw
       both away. Dismissing a card used to scroll the page to the top and
       drop focus to the body -- on a keyboard that is the whole screen to
       walk again, and it is invisible to everybody else. */
    var active = document.activeElement;
    var key = active && active.getAttribute ? active.getAttribute('data-testid') : null;
    var caret = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    var wasScroll = body.scrollTop;
    /* An action can name where focus should land when the control it was on
       is about to vanish. */
    if (focusAfterRender) { key = focusAfterRender; caret = null; focusAfterRender = null; }
    /* A dev-state press is a different screen and starts at the top. An
       ordinary re-render is the same screen and keeps its place. */
    var switching = !!state;

    if (state) current = (state === 'auto' || VIEWS[state]) ? state : 'auto';
    var blank = current === 'empty';
    MODEL = buildModel(blank);
    var view = current === 'auto' ? autoState(MODEL) : current;
    if (!VIEWS[view]) view = autoState(MODEL);
    document.getElementById('screen').setAttribute('data-state', view);
    hdrDate.textContent = headerDate(TODAY);
    var initial = String(MODEL.profile.displayName || 'A').charAt(0).toUpperCase();
    document.getElementById('hdr-initial').textContent = initial;
    LKPatch(body, VIEWS[view](MODEL));
    seedDemoSession(view === 'live');
    LKPatch(document.getElementById('shelf-slot'), shelfHTML());
    body.scrollTop = switching ? 0 : wasScroll;
    if (key) {
      var next = document.querySelector('[data-testid="' + key + '"]');
      if (next && !next.disabled) {
        next.focus({ preventScroll: true });
        if (caret !== null && typeof next.setSelectionRange === 'function') {
          try { next.setSelectionRange(caret, caret); } catch (e) {}
        }
      }
    }
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === current));
    });
  }

  /* ---- actions ------------------------------------------------------
     The cards write on the tap, not on a Save somewhere else, and every
     one of them writes the shipped app's own key. */
  function act(name, el) {
    if (name === 'dismiss-card') {
      hideCard(el.getAttribute('data-card'), true);
      return true;
    }
    if (name === 'restore-cards') {
      CARD_IDS.forEach(function (id) { hideCard(id, false); });
      /* This control removes itself: once the cards are back there is
         nothing left to restore. A button that disappears under the finger
         drops focus to the body, which restarts the next Tab at the top of
         the document, so the screen says where focus goes instead. The first
         restored card is the thing the press just produced. */
      focusAfterRender = firstVisibleCardDismiss();
      return true;
    }
    /* The layout editor. Every one of these writes lk_homeLayout on the tap,
       so the arrangement is the same tomorrow and on the next screen that
       reads the key. */
    if (name === 'retry') { location.reload(); return true; }
    if (name === 'layout-edit') {
      editing = !editing;
      /* The button relabels itself rather than vanishing, so focus has
         somewhere to be after the render. */
      focusAfterRender = 'layout-edit';
      render();
      return true;
    }
    if (name === 'blk-hide' || name === 'blk-show') {
      hideCard('blk:' + el.getAttribute('data-blk'), name === 'blk-hide');
      return true;
    }
    if (name === 'blk-up' || name === 'blk-down') {
      var bid = el.getAttribute('data-blk');
      moveBlock(bid, name === 'blk-up' ? -1 : 1);
      focusAfterRender = (name === 'blk-up' ? 'blk-up-' : 'blk-down-') + bid;
      return true;
    }
    if (name === 'supp-taken') {
      var log = get('lk_suppLog', {}) || {};
      var day = log[TODAY] || [];
      var nm = el.getAttribute('data-name');
      if (day.indexOf(nm) < 0) day.push(nm);
      log[TODAY] = day;
      set('lk_suppLog', log);
      return true;
    }
    if (name === 'staple-bought') {
      var id = el.getAttribute('data-id');
      var pantry = arr('lk_pantryItems');
      pantry.forEach(function (it) {
        if (String(it.id) !== id) return;
        it.lastBought = TODAY;
        it.empty = false;
      });
      set('lk_pantryItems', pantry);
      return true;
    }
    if (name === 'comp-taken') {
      var cid = el.getAttribute('data-cycle'), cname = el.getAttribute('data-name');
      var cycles = arr('lk_cycles');
      cycles.forEach(function (c) {
        if (String(c.id) !== cid) return;
        (c.comps || []).forEach(function (x) {
          if (x.name !== cname) return;
          x.taken = x.taken || [];
          if (x.taken.indexOf(TODAY) < 0) x.taken.push(TODAY);
        });
      });
      set('lk_cycles', cycles);
      return true;
    }
    return false;
  }

  /* ---- crossings ----------------------------------------------------
     Home is a hub: every control on it leads somewhere else, and standalone
     the screen had NO application click listener at all -- six enabled
     controls with nothing behind any of them, including the session shelf,
     which exists so a running workout is not lost.

     In the demo the router takes these first, by the same testids, and every
     one is declared in MANIFEST.nav. Standalone they are page navigations.
     -------------------------------------------------------------------- */
  /* Start the session the card names, rather than landing on the list of
     sessions. Choosing another one is still Train's job, which is what that
     button says it does. */
  function handStart() {
    var nx = MODEL && MODEL.next;
    if (nx && nx.key) { try { localStorage.setItem('lk_startDay', nx.key); } catch (e) {} }
  }

  var GOES = {
    'primary-action': 'workout-log.html',
    'action-choose-session': 'train.html',
    'row-last-session': 'workout-detail.html',
    'row-recent': 'workout-detail.html',
    'recent-see-all': 'train.html',
    'row-recap': 'recap.html',
    'row-climbing-lift': 'progress.html',
    'open-account': 'settings.html',
    'shelf-resume': 'workout-log.html',
    'row-cycle': 'cycle.html'
  };
  /* In the demo the router claims these clicks before the handler below can
     run, so the id of the row that was tapped never reached the screen it
     opened: every session row opened the same session and the climbing-lift
     row opened whatever chart Progress defaults to. */
  document.addEventListener('lk:handoff', function (e) {
    var el = (e.detail || {}).el;
    if (!el || !el.getAttribute) return;
    var tid = el.getAttribute('data-testid') ||
              (el.closest ? (el.closest('[data-testid]') || {}).getAttribute &&
                 el.closest('[data-testid]').getAttribute('data-testid') : null);
    try {
      if (tid === 'primary-action') handStart();
      if (tid === 'row-climbing-lift') localStorage.setItem('lk_openLift', String(el.getAttribute('data-id') || ''));
      if (tid === 'row-last-session' || tid === 'row-recent') {
        localStorage.setItem('lk_openWorkout', String(el.getAttribute('data-id') || ''));
      }
    } catch (err) {}
  });

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act],[data-testid]') : null;
    while (el) {
      var a = el.getAttribute('data-act');
      if (a && act(a, el)) return;
      var tid = el.getAttribute('data-testid');
      var to = GOES[tid];
      if (to) {
        /* WHICH lift. The row names the squat; Progress opened on whatever
           its own default was, which was the bench press -- so the one
           sentence on Home about a lift led to a chart of a different one. */
        if (tid === 'primary-action') handStart();
        if (tid === 'row-climbing-lift') {
          try { localStorage.setItem('lk_openLift', String(el.getAttribute('data-id') || '')); } catch (err) {}
        }
        /* WHICH session. The last-session row went to Train, which is a
           list of every session and not the one the row names. Both rows
           hand workout-detail the id, the way Train and Recap already do. */
        if (tid === 'row-last-session' || tid === 'row-recent') {
          try { localStorage.setItem('lk_openWorkout', String(el.getAttribute('data-id') || '')); } catch (err) {}
        }
        location.href = to; return;
      }
      el = el.parentElement && el.parentElement.closest ? el.parentElement.closest('[data-act],[data-testid]') : null;
    }
  });

  /* ---- dev toggle -------------------------------------------------- */
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join(''));
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (b) render(b.dataset.state);
  });

  /* Another screen writing the same key repaints this one rather than
     letting the two drift apart. */
  /* Anything written -- by a card on this screen, by another screen in the
     demo, or by another tab -- repaints this one rather than letting the two
     drift apart. It is also why the card handlers above only write: the
     repaint is the store's answer to the write, not a second job for every
     handler to remember. */
  if (window.LKStore) {
    LKStore.onChange(function (v, key) {
      /* Two keys are handoffs to the screen being opened, not state this
         screen shows. */
      if (key === 'lk_openWorkout' || key === 'lk_openLift') return;
      /* The insight card writes its own cache on the render that builds it,
         so a repaint from inside a repaint has to be refused rather than
         allowed to recurse. */
      if (rendering) return;
      render();
    });
  }

  /* Screens mount once in the demo, so a route back to Home is not a load.
     The store's own listener catches anything another screen wrote, but not
     the passage of time: the supplement card is windowed on the hour, and
     Home could sit on "Morning" until something else happened to write. */
  document.addEventListener('lk:enter', function () { if (!rendering) render(); });

  /* F-SHARED-004. A boundary for the screen itself. Every state below is a
     state this screen knows it is in; this is the one it does not -- a throw
     out of a render, a patch or a handler, which used to leave whatever was
     on screen frozen with no way forward. It says what happened and offers
     the one thing that fixes it, and it never claims the data is lost,
     because it is on the device and it is not. */
  function crashed(what) {
    try {
      document.getElementById('screen').setAttribute('data-state', 'error');
      LKPatch(body, VIEWS.error());
      var slot = document.getElementById('shelf-slot');
      if (slot) LKPatch(slot, '');
    } catch (e) {}
    return what;
  }
  /* ONLY WHEN THIS SCREEN IS THE ONE ON SCREEN. In the demo every screen
     shares one window, so an unguarded listener here would paint Home's
     error state because the workout log threw. A hidden screen's root has
     no client rects. */
  function mine() {
    var el = document.getElementById('screen');
    return !!el && el.getClientRects().length > 0;
  }
  window.addEventListener('error', function (e) {
    if (!e || !e.message || !mine()) return;
    crashed(e.message);
  });
  window.addEventListener('unhandledrejection', function () { if (mine()) crashed('promise'); });

  /* F-ONB-001. Nothing in this build asked whether anybody had ever set the
     app up: a first run landed on Home, which then showed a plan, a history
     and a name that belonged to nobody. Home is the front door, so it asks
     here, and onboarding.html writes the answer (lk_onboarded) when it
     finishes. The fixture seeds a reader six weeks into a plan, so the demo
     is not a first run and is not sent anywhere; the gate fires when there
     is no seed and nothing written, which is what a real install is. */
  function needsOnboarding() {
    if (!window.LKStore) return false;
    if (get('lk_onboarded', false) === true) return false;
    if (LKStore.touched('lk_profile') || LKStore.touched('lk_splits') || LKStore.touched('lk_history')) return false;
    return !(window.LKFixtures && LKFixtures.profile);
  }

  /* F-HOME-015 runs before the first paint, so the restock card can say
     "on your list" about something this mount has just put there. */
  autoAddDueStaples();

  /* THE FILE NAVIGATION LOOPED THE APP FOREVER ON A REAL INSTALL. In the
     shipped build there is no onboarding.html: everything is one document,
     and the host rewrites any stray path back to it. So a phone with
     nothing on it went / -> #/onboarding -> onboarding.html -> the host
     hands back the app -> Home boots, still not onboarded -> replace
     again, round and round, with nothing ever on screen. It never showed
     up because every test that reaches this gate either seeds the phone
     (so the gate does not fire) or opens the standalone page (where the
     file really is there).

     The router owns the crossing where there is a router, and the file is
     only for the standalone pages. Screens mount lazily, so onboarding may
     not be registered yet at this line -- hence the retry on the next
     turn of the loop rather than an immediate fall back to the file. If it
     is somehow never there, Home stays up: a front door showing the wrong
     thing beats a page that reloads itself forever. */
  function toOnboarding() {
    var D = window.DEMO;
    if (!D || !D.screens || !D.screens.onboarding) return false;
    try {
      var rec = D.screens.onboarding;
      if (rec.tab && typeof D.go === 'function') { D.go(rec.tab); return true; }
      if (typeof D.push === 'function') { D.push('onboarding'); return true; }
    } catch (e) {}
    return false;
  }

  if (needsOnboarding()) {
    if (!toOnboarding()) {
      if (window.DEMO) setTimeout(toOnboarding, 0);
      else location.replace('onboarding.html');
    }
  } else {
    render(new URLSearchParams(location.search).get('state') || 'auto');
  }
})();

  /* The strip's clock, on a screen that only repaints when something on it
     changes. Without this the shelf freezes at whatever second you arrived. */
  if (window.LKSession) {
    var shelfWas = null;
    window.setInterval(function () {
      var now = LKSession.html();
      if (now === shelfWas) return;
      shelfWas = now;
      LKPatch(document.getElementById('shelf-slot'), now);
    }, 1000);
  }
</script>
</body>
</html>
