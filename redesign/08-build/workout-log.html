        }
        say('Set ' + (ki + 1) + ' is a ' + KIND_WORD[next] + '.');
        break;
      }
      case 'equip-kind': {
        var ee = S.exercises[S.overlayEx];
        if (ee) setEquip(ee.id, { eq: t.getAttribute('data-v') });
        break;
      }
      case 'equip-cb': {
        var ec = S.exercises[S.overlayEx];
        if (ec) setEquip(ec.id, { noCB: !(equipFor(ec.id) || {}).noCB });
        break;
      }
      case 'equip-save': {
        var es = S.exercises[S.overlayEx];
        var bf = document.getElementById('equip-base');
        if (es && bf) {
          var bv = parseFloat(bf.value);
          setEquip(es.id, { base: isNaN(bv) || bv < 0 ? 0 : Math.min(200, bv) });
        }
        S.overlay = null;
        toast('Saved for ' + (es ? es.name : 'this lift') + '.');
        break;
      }
      case 'idle-stay': { S.overlay = null; touchIdle(); break; }
      case 'idle-finish': {
        S.over = true;
        handOff();
        if (window.LKSession) LKSession.end();
        LKGo('review');
        return;
      }
      case 'addex-all': { S.addexAll = true; S.addexN = ADDEX_PAGE; break; }
      case 'delrow-go': {
        var dre = S.overlayEx, dri = Number(t.getAttribute('data-i'));
        var dex = S.exercises[dre];
        if (!dex || dex.sets.length <= 1) { S.overlay = null; break; }
        var goneRow = dex.sets.splice(dri, 1)[0];
        S.overlay = null;
        toast('Set removed.', 'info', 'Undo', function () {
          dex.sets.splice(dri, 0, goneRow);
          paint();
        });
        break;
      }
      case 'plate-solve': {
        var tf = document.getElementById('plate-target');
        var want = tf ? parseFloat(tf.value) : NaN;
        if (isNaN(want) || want <= 0) { S.plate.solveNote = 'Type the weight you want on the bar.'; break; }
        var wantKg = S.unit === 'kg' ? want : want / LB_PER_KG;
        var sol = solvePlates(wantKg, S.plate.bar);
        if (!sol) { S.plate.solveNote = 'That is less than the bar on its own.'; break; }
        S.plate.added = sol.plates;
        if (sol.exact) {
          S.plate.solveNote = 'Per side: ' + sol.plates.map(function (x) {
            return trim(toDisplay(x));
          }).join(' + ') + ' ' + unitLabel() + '.';
        } else {
          /* Named, not silently rounded. */
          S.plate.solveNote = 'The nearest this bar and these plates can make is ' +
            trim(toDisplay(sol.made)) + ' ' + unitLabel() + ', not ' + trim(toDisplay(wantKg)) + ' ' + unitLabel() +
            '. Per side: ' + (sol.plates.length
              ? sol.plates.map(function (x) { return trim(toDisplay(x)); }).join(' + ') + ' ' + unitLabel()
              : 'nothing, the bar alone') + '.';
        }
        break;
      }
      case 'block-add': {
        var ti = document.getElementById('block-title');
        var no = document.getElementById('block-notes');
        var title = ti ? ti.value.trim() : '';
        /* An untitled block called "Block" is a row that says nothing, in a
           list whose whole job is to say what is next. It silently accepted
           an empty title and named it for you. */
        if (!title) {
          S.blockError = 'Give the block a name, so the row says what it is.';
          paint();
          if (ti) ti.focus();
          return;
        }
        /* Blank is fine -- not every block is timed. A number that is not a
           number of minutes is not. */
        var mi = document.getElementById('block-mins');
        var raw = mi ? mi.value.trim() : '';
        var mins = raw === '' ? null : Number(raw);
        if (raw !== '' && (!isFinite(mins) || mins < 1 || mins > 180)) {
          S.blockError = 'A length between 1 and 180 minutes, or leave it blank.';
          paint();
          if (mi) mi.focus();
          return;
        }
        S.blocks.push({ title: title, notes: no ? no.value.trim() : '',
                        duration: mins === null ? '' : Math.round(mins) + ' min',
                        open: false });
        S.blockError = null;
        S.overlay = null;
        toast('Block added.');
        break;
      }
      /* Undoable, not confirmed. Every other destructive control in this
         build offers the thing back; this one deleted on the tap and left
         nothing to press. */
      case 'block-open': {
        var oi = Number(t.getAttribute('data-i'));
        if (S.blocks[oi]) S.blocks[oi].open = !S.blocks[oi].open;
        break;
      }
      case 'block-remove': {
        var bi = Number(t.getAttribute('data-i'));
        var goneB = S.blocks.splice(bi, 1)[0];
        if (goneB) {
          toast('\u201c' + goneB.title + '\u201d removed.', 'Undo', function () {
            S.blocks.splice(bi, 0, goneB);
            paint();
          });
        }
        break;
      }

      case 'toast-action': {
        var tf = S.toast && S.toast.fn;
        S.toast = null;
        if (tf) tf();
        break;
      }
      /* swapAt goes with the picker. Left set, the next plain "Add
         Exercise" would replace instead of adding. */
      case 'close': S.overlay = null; S.swapAt = null; S.addexQ = ''; S.addexGid = null; break;
      default: break;
    }
    paint();
  });

  /* =============================================================
     Reordering. Three ways in, one function: Up/Down on the move bar,
     the arrow keys while a grip has focus, and dragging the grip.
     ============================================================= */
  function moveEx(from, to) {
    if (to < 0 || to >= S.exercises.length || from === to) return false;
    /* Pairing is by adjacency, so moving one half of a superset past
       something else would silently pair it with whatever landed beside it.
       Both flags that touch the moved card are dropped instead, and the
       toast says so rather than leaving a pair nobody made. */
    var broke = !!(S.exercises[from].superset ||
                   (S.exercises[from - 1] && S.exercises[from - 1].superset));
    S.exercises[from].superset = false;
    if (S.exercises[from - 1]) S.exercises[from - 1].superset = false;
    var it = S.exercises.splice(from, 1)[0];
    S.exercises.splice(to, 0, it);
    if (broke) toast('Superset undone: the two lifts are no longer next to each other.');
    return true;
  }

  var dragEndedAt = 0;

  /* ---- press and hold, on the exercise name ---------------------------
     450ms, the shipped app's own dwell. The card squeezes while the finger
     is down so the gesture is visible before it fires, the phone taps back
     the moment it does, and a finger that slides more than a few pixels is
     a scroll rather than a hold. Nothing inside the card can start one: the
     grip, the cells, the ticks and the foot buttons are all their own
     controls, and this only ever begins on .exc__main itself. */
  var HOLD_MS = 450;
  var holdTimer = null;
  var heldOpenAt = 0;
  function cancelHold(el) {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (el && el.classList) el.classList.remove('exc__main--holding');
    Array.prototype.forEach.call(document.querySelectorAll('.exc__main--holding'), function (nd) {
      nd.classList.remove('exc__main--holding');
    });
  }
  document.addEventListener('pointerdown', function (ev) {
    var main = ev.target.closest ? ev.target.closest('.exc__main[data-act="exsheet"]') : null;
    if (!main) return;
    /* A control inside the card that happens to sit over the name -- there
       are none today, and there must not be one tomorrow either. */
    if (ev.target.closest('[data-act]') !== main) return;
    var ie = Number(main.getAttribute('data-ex'));
    var x0 = ev.clientX, y0 = ev.clientY;
    main.classList.add('exc__main--holding');
    cancelHoldOnMove = function (e2) {
      if (Math.abs(e2.clientX - x0) > 8 || Math.abs(e2.clientY - y0) > 8) done();
    };
    function done() {
      cancelHold(main);
      document.removeEventListener('pointermove', cancelHoldOnMove);
      document.removeEventListener('pointerup', done);
      document.removeEventListener('pointercancel', done);
    }
    document.addEventListener('pointermove', cancelHoldOnMove);
    document.addEventListener('pointerup', done);
    document.addEventListener('pointercancel', done);
    holdTimer = setTimeout(function () {
      holdTimer = null;
      cancelHold(main);
      buzz(18);
      markHoldTipSeen();
      heldOpenAt = Date.now();
      lastOpener = 'exercise-menu-' + ie;
      S.overlayEx = ie;
      S.overlay = 'sheet';
      paint();
    }, HOLD_MS);
  });
  var cancelHoldOnMove = function () {};

  /* A keyboard has no hold. Enter and Space open it outright. */
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ' && ev.key !== 'Spacebar') return;
    var main = ev.target.closest ? ev.target.closest('.exc__main[data-act="exsheet"]') : null;
    if (!main) return;
    ev.preventDefault();
    heldOpenAt = Date.now();
    markHoldTipSeen();
    lastOpener = main.dataset.testid;
    S.overlayEx = Number(main.getAttribute('data-ex'));
    S.overlay = 'sheet';
    paint();
  });

  /* THERE WAS A SECOND DRAG ON THIS SAME HANDLE, and it is gone.

     An older implementation lived here: it started on 6px of movement
     with no hold, reordered the model on every midpoint crossing, and
     called paint() each time. It was never removed when the hold-to-lift
     drag below was written, so both were listening on the same grip at
     the same time, and the older one won almost every gesture -- 6px is
     less than the 10px that hands the hold back to the scroller, so any
     drag that did not begin with the finger held perfectly still for
     350ms got the old one: no lift, no gap, no spring, the list jumping
     under the thumb a row at a time.

     Worse, on the drags that did complete the hold, BOTH ran. The old
     one's paint() stripped the inline translate, scale and z-index the
     lifted card was carrying, because LKPatch syncs the style attribute
     like any other and the markup does not declare one. That is what a
     drag tearing mid-gesture looks like.

     Everything it did is still here: the reorder gesture below, the
     arrow buttons on the grip, and the keyboard move bar, all through
     moveEx. */

  /* lk_prs comes in two shapes and both are real. The seed is a flat array of
     {exId, kg, reps, date}; once Progress has written, it is a map of exercise
     id to a list of {r, w, date}. Reading one and ignoring the other is how a
     personal best goes missing, so this normalises both to one list and the
     writer puts back the map shape, carrying the seed's records into it. */
  function prMap() {
    if (!window.LKStore) return {};
    var raw = LKStore.get('lk_prs', null);
    if (!raw) return {};
    if (!Array.isArray(raw)) return raw;
    var map = {};
    raw.forEach(function (r) {
      var k = String(r.exId);
      (map[k] = map[k] || []).push({ r: r.reps, w: r.kg, date: r.date });
    });
    return map;
  }

  function bestFor(exId, reps) {
    if (!exId) return null;
    var map = prMap();
    var list = map[exId] || map[String(exId)] || [];
    var best = null;
    list.forEach(function (r) {
      if (reps !== undefined && r.r < reps) return;
      if (!best || r.w > best.w) best = r;
    });
    return best;
  }

  /* Beaten means more weight at the same reps or better, or the same weight
     for more reps. The same rule Progress uses to refuse a junk record. */
  /* In the unit the row is being read in. It printed "kg" whatever the
     screen said, so a lifter working in pounds was told they had just put
     165 kg over their head. */
  /* THE REPS A RECORD IS JUDGED ON. On a set tracked per side that is the
     better of the two arms: twelve on the right and ten on the left is
     twelve reps at that weight, and reading only the left would lose the
     lifter a record they earned. The old two-row shape got this for free,
     because each row claimed its own. */
  function prReps(st) {
    if (!st) return null;
    if (st.repsR == null) return st.reps;
    if (st.reps == null) return st.repsR;
    return Math.max(st.reps, st.repsR);
  }
  function prBeaten(ex, st) {
    if (!ex || !ex.id || st.warm) return null;
    var reps = prReps(st);
    if (st.kg === null || reps == null) return null;
    var u = unitOf(ex);
    var w = function (v) { return trim(toDisplay(v, u)) + ' ' + unitLabel(u); };
    var b = bestFor(ex.id, reps);
    if (!b) {
      var any = bestFor(ex.id);
      if (!any) return null;              /* nothing to beat: not a claim */
      if (st.kg > any.w) return w(st.kg) + ' for ' + reps + ', past ' + w(any.w) + ' for ' + any.r + '.';
      return null;
    }
    if (st.kg > b.w) return w(st.kg) + ' for ' + reps + ', past ' + w(b.w) + '.';
    if (st.kg === b.w && reps > b.r) return w(st.kg) + ' for ' + reps + ', past ' + b.r + ' reps.';
    return null;
  }

  /* Appended as a row, in the one shape lk_prs holds everywhere. This used
     to write back the lookup map prMap() builds, which carries no name,
     group or muscle -- so a bench record set here read on Progress as three
     records fewer than before it was set. */
  function recordPR(ex, st) {
    if (!window.LKStore || !ex.id) return;
    var raw = LKStore.get('lk_prs', null);
    var rows = [];
    if (Array.isArray(raw)) rows = raw.slice();
    else if (raw && typeof raw === 'object') {
      Object.keys(raw).forEach(function (k) {
        (raw[k] || []).forEach(function (r) {
          rows.push({ exId: Number(k), name: '', group: '', muscle: '',
                      kg: r.w, reps: r.r, date: r.date });
        });
      });
    }
    rows.unshift({ exId: ex.id, name: ex.name || '', group: ex.group || '',
                   muscle: ex.muscle || '', kg: st.kg, reps: prReps(st),
                   date: window.LKStore ? LKStore.today() : new Date().toISOString().slice(0, 10) });
    LKStore.set('lk_prs', rows);
  }

  /* Every record row this session wrote, taken back out. Matched on the
     lift, the load, the reps and today's date, so a record set on an
     earlier day -- or by another session today that was saved -- is left
     exactly where it is. */
  function rollbackRecords() {
    if (!window.LKStore) return;
    var today = LKStore.today();
    var raw = LKStore.get('lk_prs', null);
    if (!Array.isArray(raw)) return;
    var mine = [];
    S.exercises.forEach(function (ex) {
      if (!ex || !ex.id) return;
      (ex.sets || []).forEach(function (st) {
        if (st && st.pr && st.kg != null && st.reps != null) {
          mine.push(ex.id + '|' + st.kg + '|' + st.reps);
        }
      });
    });
    if (!mine.length) return;
    var kept = raw.filter(function (r) {
      if (!r || String(r.date) !== String(today)) return true;
      return mine.indexOf(r.exId + '|' + r.kg + '|' + r.reps) < 0;
    });
    if (kept.length !== raw.length) LKStore.set('lk_prs', kept);
  }

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown') return;
    var grip = ev.target.closest ? ev.target.closest('[data-act="grip"]') : null;
    if (!grip) return;
    ev.preventDefault();
    var from = Number(grip.getAttribute('data-ex'));
    var to = from + (ev.key === 'ArrowUp' ? -1 : 1);
    if (!moveEx(from, to)) return;
    S.liftedEx = to;
    paint();
    say(S.exercises[to].name + ' moved to position ' + (to + 1) + ' of ' + S.exercises.length + '.');
    refocus('grip-' + to);
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target.closest('[data-act="rir"]');
    if (!t) return;
    var e = Number(t.getAttribute('data-ex')), i = Number(t.getAttribute('data-set'));
    S.exercises[e].sets[i].rir = Number(t.value);
    say('Set ' + (i + 1) + ' RIR ' + t.value);
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target.closest('[data-act="note"]');
    if (t) {
      var exn = S.exercises[S.overlayEx];
      exn.note = t.value;
      /* Per exercise, not per session. The sheet asks "what to remember next
         time", and the note lived only in this workout's rows: next time was
         exactly when it was gone. lk_exNotes is keyed by exercise id, so the
         note comes back the next time that lift is opened, in any session. */
      if (window.LKStore && exn.id) {
        var notes = LKStore.get('lk_exNotes', {}) || {};
        if (t.value.trim()) notes[exn.id] = t.value.trim();
        else delete notes[exn.id];
        LKStore.set('lk_exNotes', notes);
      }
      return;
    }
    var q = ev.target.closest('[data-act="addex-q"]');
    if (q) {
      S.addexQ = q.value;
      S.addexN = ADDEX_PAGE;
      /* A search is a question about the whole body. Leaving the chosen
         part in place would silently hide most of the answers. */
      if (S.addexQ.trim()) S.addexGid = null;
      paint();
    }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (S.pad) { S.pad = null; paint(); }
      else if (S.overlay) { S.overlay = null; paint(); }
      return;
    }
    /* A modal that Tab walks out of is not modal. Fourteen presses inside
       the plate sheet landed in the dev menu behind it, which is the whole
       screen a dialog exists to keep you out of. Escape closed it; Tab did
       not respect it. */
    if (ev.key !== 'Tab') return;
    var host = document.getElementById('overlay');
    if (!host || (!S.overlay && !S.pad)) return;
    var f = host.querySelectorAll(
      'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), ' +
      'textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (!host.contains(document.activeElement)) { ev.preventDefault(); first.focus(); return; }
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  });

  /* What Review reviews. Review used to hold a fixed 16-set, 4,383 kg Push
     with a bench PR in it, and the log navigated to it without handing
     anything over -- so a session of seven sets, and a session of none at
     all, both produced the same review with the same invented record.
     Written on Finish, read once by Review. */
  function handOff() {
    var lifts = [], exercises = [];
    S.exercises.forEach(function (ex) {
      var vol = 0, top = null, sets = 0;
      /* THE ROWS, not only the totals. The hand-over carried five numbers
         per lift, so Review could say the volume moved and could not show
         one set, and the record it saved to history had no sets in it --
         a workout you could never open again and read. */
      var rows = [];
      ex.sets.forEach(function (st) {
        if (!st.done || st.kg == null || st.reps == null) return;
        var row = { kg: st.kg, reps: st.reps, rir: st.rir, warm: !!st.warm,
                    partials: st.partials || 0, done: true, pr: !!st.pr,
                    prBeat: st.prBeat || null };
        /* BOTH SIDES TRAVEL. The hand-over used to drop the side off every
           row, so a session of three sets tracked left and right reached
           history as six numbered sets that nothing could pair back up.
           One row carrying both is what history now reads, and the rows
           already in history keep their own shape and their own reader. */
        if (st.repsR != null) row.repsR = st.repsR;
        if (st.kgR != null) row.kgR = st.kgR;
        rows.push(row);
        if (st.warm) return;
        sets++; vol += st.kg * st.reps;
        if (st.repsR) vol += kgRight(st) * st.repsR;
        var tr = prReps(st);
        if (!top || st.kg > top[0] || (st.kg === top[0] && tr > top[1])) top = [st.kg, tr];
      });
      if (!rows.length) return;
      if (sets) lifts.push({ id: ex.id, name: ex.name, sets: sets, vol: Math.round(vol), top: top });
      exercises.push({ id: ex.id, name: ex.name, muscle: ex.muscle || '', sets: rows });
    });
    var rec = {
      title: S.name,
      /* WHICH KIND OF SESSION THIS WAS, and what the reader said about it.
         A quick workout counts toward volume and PRs and is left out of
         split adherence, which is a one-field filter wherever that is
         asked -- and only possible if the field is written down here. The
         note is why a thin Tuesday makes sense in March: "at the hotel
         gym" is the difference between a bad week and a week away. */
      type: S.quick ? 'quick' : 'split',
      note: S.note || '',
      /* WHERE IT CAME FROM, so Review can offer to keep what changed.
         Undefined for a quick workout and for the demo's seeded session:
         Review asks about a split day or it asks about nothing, and a
         session with no plan behind it has nothing to have drifted from. */
      source: S.source || null,
      dateISO: window.LKStore ? LKStore.today() : null,
      sets: doneSets(),
      warmups: doneWarmups(),
      volumeKg: Math.round(volumeKg()),
      minutes: Math.max(0, Math.round(elapsedSec() / 60)),
      lifts: lifts,
      exercises: exercises
    };
    if (window.LKStore) LKStore.set('lk_lastSession', rec);
    else { try { localStorage.setItem('lk_lastSession', JSON.stringify(rec)); } catch (e) {} }
  }

  /* In the demo the router claims the Finish click in the capture phase --
     it has to, because the handler above leaves with location.href -- so the
     hand-over never ran and Review opened on a session nobody had done. The
     router announces the crossing first and this does the handing over. */
  document.addEventListener('lk:handoff', function (e) {
    var d = e.detail || {};
    if (d.selector === '[data-testid="btn-finish"]') {
      S.over = true;
      handedOff = true;
      handOff();
      return;
    }
    /* Discard is claimed by the router in the same capture phase, so the
       screen's own handler never runs: the record and the saved rows
       survived a workout that had been thrown away, and every screen went
       on offering to Resume it. The emptying happens here instead, on the
       announcement, the way the hand-over does. */
    if (d.selector === '[data-testid="discard-confirm"]') {
      /* AND THE RECORDS THIS SESSION CLAIMED GO WITH IT. Records are
         written the moment a set is ticked, so a workout you threw away
         left its personal bests behind -- a 120 kg mark from a session
         that, by the reader's own decision, never happened. */
      rollbackRecords();
      S.over = true;
      S.overlay = null;
      S.exercises = [];
      S.blocks = [];
      S.elapsed = 0;
      stopRest();
      if (window.LKStore) {
        LKStore.remove('lk_lastSession');
        LKStore.remove(ROWS_KEY);
      }
      if (window.LKSession) LKSession.end();
      paint();
    }
  });

  /* Entered, rather than merely still on screen. In the demo the log stays
     mounted for the life of the page, so after Finish, Train's "Start today's
     session" dropped the reader back into the workout they had just saved --
     sets still ticked, clock still running past the finish. */
  /* BACK FROM A LOCKED SCREEN. Nothing ran while the phone was away, so
     the strip is redrawn from the deadline the moment it is looked at
     again -- and if the rest ran out in the meantime, that is said now
     rather than never. */
  function wakeRest() {
    if (syncRest()) say('Rest done');
    paint();
  }
  /* On `window`, not on `document`: inside the assembled app `document` is
     this screen's shadow root, and visibilitychange is fired at the real
     document. It bubbles, so window hears it either way. */
  window.addEventListener('focus', wakeRest);
  window.addEventListener('pageshow', wakeRest);
  window.addEventListener('visibilitychange', function () {
    if (!document.hidden) wakeRest();
  });

  document.addEventListener('lk:enter', function () {
    syncRest();
    /* A day asked for from Train wins: it is a new session, not this one. */
    if (startRequested()) { paintMenu(); paint(); return; }
    if (!S.over) return;
    /* COMING BACK TO A WORKOUT THAT IS OVER. Finishing ends the record and
       hands the session to Review, so arriving here again -- the iOS
       edge-swipe back from Review, which is the likeliest input in the
       second after finishing -- found no session and painted the empty
       state: "Quick Workout, 0 working sets, 0 kg, Nothing logged yet".
       The work was not lost (it is in lk_lastSession, and Review still
       holds it) but the screen said it was, which is worse than losing it
       quietly. There is no workout here any more; Train is where one
       starts, and it is this screen's declared parent. */
    /* ONLY STRAIGHT BACK OFF REVIEW. Bouncing on any entry with no live
       session also bounced somebody who opened the log deliberately, so
       the route could never be shown at all. handedOff is set by Finish
       and cleared here, so this fires exactly once: on the way back from
       the Review the finish opened. */
    if (handedOff && !(window.LKSession && LKSession.get())) {
      handedOff = false;
      LKGo('train');
      return;
    }
    applyState('mid-session');
    paint();
  });

  /* The record can end from outside this screen -- the demo's router ends it
     on Finish, because it has to swallow the click that would otherwise
     navigate the whole demo away, and a stale shelf's Finish ends it from
     another screen entirely. Either way this screen is now looking at a
     workout that is over, and the next paint would helpfully start a brand
     new session from the exercises still on the page. */
  if (window.LKSession) {
    LKSession.onChange(function (r) { if (!r) S.over = true; });
  }

  /* =============================================================
     SWIPE A SET AWAY, AND PICK AN EXERCISE UP.

     Both gestures were in the shipped app and neither survived the
     rebuild: sets could only be removed through a menu two taps deep, and
     exercises could only be reordered with the arrow buttons. The buttons
     stay -- they are how this works with a keyboard and a screen reader,
     and a gesture nobody can see is not an interface on its own -- but
     the hand gets its part back.

     The numbers are v6's, because they were tuned on a phone and they
     were right: a 15px vertical escape so scrolling always wins, an 80px
     threshold, a velocity projection so a flick counts short of it, 350ms
     to lift a row, and a 10px escape from that so a scroll never picks
     anything up.

     The set grid is one flat CSS grid with no per-row element, so a row
     is moved by moving the cells that belong to it. That keeps a layout
     every design audit passes exactly as it is.
     ============================================================= */
  var SWIPE_OPEN = -80;          /* how far left is "gone" */
  var SWIPE_ESCAPE = 15;         /* vertical travel that hands it to the scroller */
  var HOLD_MS = 350;             /* to lift an exercise */
  var HOLD_ESCAPE = 10;          /* movement that cancels the lift */

  function buzzSafe(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  /* Every cell of one set row: the number, both figures, the RIR select,
     the tick, and the partials marker when it is shown. */
  function rowCells(e, i) {
    if (!screen) return [];
    var sel = '[data-ex="' + e + '"][data-set="' + i + '"]';
    return Array.prototype.slice.call(screen.querySelectorAll(sel));
  }
  /* How close this is to being gone, 0 to 1. The aura is drawn from it,
     so the point of no return is visible on the way to it rather than
     discovered afterwards. */
  function peril(dx) {
    if (dx >= 0) return 0;
    return Math.max(0, Math.min(1, dx / SWIPE_OPEN));
  }
  function moveRow(cells, dx, fade) {
    var p = peril(dx);
    cells.forEach(function (c) {
      c.style.transition = 'none';
      c.style.transform = dx ? 'translateX(' + dx + 'px)' : '';
      if (fade !== undefined) c.style.opacity = fade;
      c.style.setProperty('--peril', p);
      if (p > 0) c.classList.add('is-peril'); else c.classList.remove('is-peril');
    });
  }
  function settleRow(cells) {
    cells.forEach(function (c) {
      c.style.transition = 'transform var(--dur-quick, .18s) var(--spring-soft, ease), opacity .18s linear';
      c.style.transform = '';
      c.style.opacity = '';
      c.classList.remove('is-peril');
      c.style.removeProperty('--peril');
    });
  }

  /* Rightward drag gives, but not much: the row is telling you it only
     goes one way. v6's curve. */
  function rubber(dx) {
    if (dx <= 0) return dx;
    return (1 - 1 / (dx * 0.55 / 80 + 1)) * 80 * 0.35;
  }
  /* A flick counts. Projected travel at v6's deceleration. */
  function projected(dx, v) { return dx + (v || 0) / 1000 * (0.998 / (1 - 0.998)); }

  var SW = null;

  /* Pointer events, not touch: one path for a finger, a pen and a mouse,
     and the only one a test harness can drive honestly. */
  screen.addEventListener('pointerdown', function (ev) {
    if (S.pad || S.overlay || S.liftedEx !== -1) return;
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    var cell = ev.target.closest ? ev.target.closest('[data-ex][data-set]') : null;
    if (!cell) return;
    var e = Number(cell.getAttribute('data-ex')), i = Number(cell.getAttribute('data-set'));
    if (isNaN(e) || isNaN(i) || !S.exercises[e]) return;
    SW = { e: e, i: i, x: ev.clientX, y: ev.clientY, dx: 0, v: 0, t: 0,
           on: false, crossed: false, cells: rowCells(e, i), id: ev.pointerId };
  });

  screen.addEventListener('pointermove', function (ev) {
    if (!SW || (SW.id !== undefined && ev.pointerId !== SW.id)) return;
    var dx = ev.clientX - SW.x;
    var dy = Math.abs(ev.clientY - SW.y);
    /* Scrolling wins until the swipe has committed. */
    if (!SW.on && dy > SWIPE_ESCAPE) { settleRow(SW.cells); SW = null; return; }
    var now = ev.timeStamp || Date.now();
    if (SW.t) {
      var dt = Math.max(now - SW.t, 1);
      SW.v = 0.75 * ((dx - SW.dx) / dt * 1000) + 0.25 * SW.v;
    }
    SW.t = now;
    if (dx < -10) SW.on = true;
    SW.dx = dx;
    if (!SW.crossed && dx < SWIPE_OPEN) { SW.crossed = true; buzzSafe(10); }
    if (SW.on) {
      ev.preventDefault();               /* the row is ours now, not the scroller's */
      var shown = dx < 0 ? dx : rubber(dx);
      moveRow(SW.cells, shown, Math.max(0.35, 1 + shown / 220));
    }
  });

  function endSwipe() {
    if (!SW) return;
    var s = SW; SW = null;
    if (!s.on) { settleRow(s.cells); return; }
    /* A FLICK COUNTS, A TWITCH DOES NOT. v6 projected the throw and
       deleted on the projection alone, which means a fast 24px nudge --
       velocity is distance over a very short time, so a twitch projects a
       long way -- destroyed a set. Deleting is the one thing on this
       screen that cannot be undone by doing it again, so it asks for real
       travel first: past the threshold outright, or half of it with
       enough speed behind it to mean it. */
    var wentFar = s.dx <= SWIPE_OPEN;
    var flicked = s.dx <= SWIPE_OPEN / 2 && projected(s.dx, s.v) <= SWIPE_OPEN;
    if (!wentFar && !flicked) { settleRow(s.cells); return; }
    var ex = S.exercises[s.e];
    if (!ex) { settleRow(s.cells); return; }
    if (ex.sets.length <= 1) {
      settleRow(s.cells);
      toast('An exercise keeps at least one set.');
      return;
    }
    var gone = ex.sets.splice(s.i, 1)[0];
    buzzSafe(12);
    paint();
    toast('Set ' + (s.i + 1) + ' removed from ' + ex.name + '.', 'info', 'Undo', function () {
      ex.sets.splice(s.i, 0, gone);
      paint();
      say('Set ' + (s.i + 1) + ' is back.');
    });
  }
  screen.addEventListener('pointerup', endSwipe);
  screen.addEventListener('pointercancel', function () {
    if (SW) { settleRow(SW.cells); SW = null; }
  });

  /* ---- PICKING AN EXERCISE UP -------------------------------------
     Hold the grip for 350ms and the card lifts; move and the cards below
     open a gap for it; let go and it lands. A move of more than 10px
     before the hold completes hands the gesture back to the scroller, so
     a flick down the page never picks anything up.

     The arrow buttons the grip already carried still work and are still
     the only way to do this from a keyboard. */
  var DRAG = null, holdTimer = null, holdWatch = null;

  function cardEls() {
    return Array.prototype.slice.call(screen.querySelectorAll('[data-testid^="exercise-card-"]'));
  }
  function clearHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (holdWatch) { document.removeEventListener('pointermove', holdWatch); holdWatch = null; }
  }

  /* LETTING GO IS NOT THE SAME AS ARRIVING.

     This used to drop every inline style in one frame, which put the
     card in its new slot instantly. It reads as the app losing the card
     and finding it somewhere else. v6 threw it to the slot on a spring
     seeded with the speed the finger was going and only changed the
     order once the card had stopped, and that is the difference the
     owner is describing when he says the physics are gone.

     The order here is: work out where the slot is, fly there, then move
     the data and repaint. Repainting first would pull the card being
     animated out from under the animation. */
  function endDrag(commit) {
    if (!DRAG) return;
    var d = DRAG; DRAG = null;
    if (d.stopEdge) d.stopEdge();
    if (d.glide) d.glide.cancel();
    /* NOW, not when the spring finishes. The click that ends a drag lands
       on the grip within the same tick as the pointerup, and the grip's
       click handler opens the move bar; stamping this half a second later
       from inside the landing is stamping it after the damage. */
    dragEndedAt = Date.now();
    var adj = d.to > d.from ? d.to - 1 : d.to;
    var landed = commit && d.to !== null ? (adj - d.from) * d.h : 0;
    var card = d.cards[d.from];

    function settle() {
      /* Through LKReorder, so the workout log cannot drift out of step with
         the other three lists that do the same gesture. It clears `scale`
         and `translate` too, which a hand-rolled reset here kept forgetting. */
      d.cards.forEach(function (c) {
        if (window.LKReorder) LKReorder.clear(c);
        else { c.style.transition = ''; c.style.transform = ''; c.style.translate = '';
               c.style.scale = ''; c.style.zIndex = ''; c.style.opacity = ''; }
      });
      S.dragEx = -1;
      if (commit && d.to !== null && d.to !== d.from) {
        var moved = S.exercises.splice(d.from, 1)[0];
        S.exercises.splice(adj, 0, moved);
        /* Lighter than the lift. Picking something up is an event; putting
           it down is a confirmation, and v6 ticked 8 against the lift's
           20. A drop that buzzes as hard as the lift feels like an error. */
        buzzSafe(8);
        paint();
        say(moved.name + ' moved to position ' + (adj + 1) + '.');
      } else {
        paint();
      }
    }

    if (!card || !window.LKReorder || !LKReorder.drop ||
        Math.abs(d.dy - landed) < 0.5) { settle(); return; }
    LKReorder.drop(card, d.dy, landed, d.v, settle);
  }

  /* Where the card sits and what it is now over, recomputed from the
     finger and from the scroll position together. The boxes were read
     once at the lift, in viewport coordinates, so once the list can
     creep under the drag every one of them is out by however far it has
     crept -- and the drop lands rows away from where it looks. */
  /* THE LIST RUNS UP TO ITS TOP WHILE YOU HOLD THE CARD.

     280ms on an ease-out, which is the length of a sheet arriving in this
     app and short enough that it is over before anybody decides to move.
     placeDrag on every frame, so the card does not travel with the list:
     the scroll delta goes straight back into its translate and it sits
     still under the finger while everything else slides past it. */
  /* THE FOLD'S THREE PROBLEMS LIVE IN LKReorder NOW. They were written
     here, for this list, and every one of them is the same problem on any
     list long enough to fold: the card jumping out of the hand, the reader
     parked where the list used to be long, and the card wandering out from
     behind the header. The split builder needed all three, and two copies
     of a gesture is how two surfaces start feeling different. This screen
     still owns its own drag loop, because it is also the screen where a
     sideways pull on the same handle throws an exercise away; what it no
     longer owns is the arithmetic. */
  function scrollInset(el) {
    return window.LKReorder && LKReorder.scrollInset
      ? LKReorder.scrollInset(el) : [0, 0];
  }

  function glideToTop() {
    if (!DRAG || !DRAG.scroller || !window.LKReorder || !LKReorder.glide) return;
    DRAG.glide = LKReorder.glide(DRAG.scroller, function () {
      if (DRAG) placeDrag(DRAG.cy);
    });
  }

  /* The translate that puts the card where the finger is, given where the
     list has scrolled to since the lift. Wanted in two places: every move,
     and the lift itself, which has to put the card under the hand before
     anything else happens. */
  function dragDy(clientY) {
    var ds = DRAG.scroller ? DRAG.scroller.scrollTop - DRAG.s0 : 0;
    /* `anchor` is what put the card back under the finger across the fold,
       and it is a constant offset on everything that follows. Leave it out
       of one of these two sums and the card and its drop target disagree
       by however far the fold moved it. */
    var dy = clientY - DRAG.y0 + ds + (DRAG.anchor || 0);
    /* THE CARD STAYS INSIDE THE LIST, and the list moves instead.

       Drag a row to the very top of a table on iOS and the row does not
       carry on past the edge and disappear; it stops against the edge and
       the content runs underneath it. Here the scroller starts 86px down
       under a header, so a finger at the top of the SCREEN was putting the
       card half behind that header -- you were holding something you could
       not see. Pinned at the edge, the creep does the travelling, which is
       the behaviour the edge creep exists for. */
    if (DRAG.scroller && window.LKReorder && LKReorder.clampDy) {
      dy = LKReorder.clampDy(dy, DRAG.boxes[DRAG.from], DRAG.scroller, DRAG.inset, ds);
    }
    return dy;
  }

  function placeDrag(clientY) {
    if (!DRAG) return;
    var dy = dragDy(clientY);
    DRAG.dy = dy;
    DRAG.cy = clientY;
    var card = DRAG.cards[DRAG.from];
    if (window.LKReorder) LKReorder.carry(card, dy);
    /* NOT UNTIL THE FINGER HAS ACTUALLY MOVED. The lift brings the card to
       the hand, and on a long list that alone puts it over a different slot
       -- so a press and release with no drag in it would have quietly
       reordered the workout. The gap only starts following once there is a
       drag to follow. */
    if (!DRAG.armed) return;
    var y = DRAG.boxes[DRAG.from].mid + dy;
    var to = DRAG.boxes.length;
    for (var i = 0; i < DRAG.boxes.length; i++) {
      if (y < DRAG.boxes[i].mid) { to = i; break; }
    }
    if (to === DRAG.from + 1) to = DRAG.from;
    if (to !== DRAG.to) {
      if (DRAG.to !== null) buzzSafe(10);
      DRAG.to = to;
      if (window.LKReorder) LKReorder.layout(DRAG.cards, DRAG.from, to, DRAG.h);
    }
  }

  screen.addEventListener('pointerdown', function (ev) {
    var grip = ev.target.closest ? ev.target.closest('[data-act="grip"]') : null;
    if (!grip || S.pad || S.overlay) return;
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    var e = Number(grip.getAttribute('data-ex'));
    if (isNaN(e) || !S.exercises[e]) return;
    var y0 = ev.clientY, x0 = ev.clientX;
    holdWatch = function (m) {
      var mdx = m.clientX - x0, mdy = Math.abs(m.clientY - y0);
      /* LEFT IS THE OTHER GESTURE ON THIS HANDLE. Going sideways before
         the hold has completed is a throw, not a scroll and not a
         reorder, so the hold is abandoned and the card starts to leave. */
      /* Measured from where the finger LANDED, not from where the throw
         was recognised. The first ten pixels are what tells a pull from a
         scroll; they are still part of the pull. */
      if (mdx < -HOLD_ESCAPE && Math.abs(mdx) > mdy) { clearHold(); startPeril(e, x0); return; }
      if (mdy > HOLD_ESCAPE) clearHold();
    };
    document.addEventListener('pointermove', holdWatch);
    holdTimer = setTimeout(function () {
      clearHold();
      /* WHERE ON THE CARD THE FINGER IS, read before anything folds. This
         is the one measurement that has to happen first: it is how far
         down the thing you grabbed you grabbed it, and it is what keeps
         the card under your hand once every card on screen has changed
         height. */
      var was = cardEls()[e];
      var grabDY = was ? y0 - was.getBoundingClientRect().top : 0;
      /* FOLDED FIRST, MEASURED SECOND. Every card becomes a tab the
         instant one is picked up, which changes every height on screen --
         so the geometry the drag works against is read after the fold,
         never before it. Measuring first put the drop targets where the
         cards used to be. */
      S.dragEx = e;
      paint();
      var cards = cardEls();
      var card = cards[e];
      if (!card) { S.dragEx = -1; paint(); return; }
      var boxes = cards.map(function (c) {
        var b = c.getBoundingClientRect();
        return { mid: b.top + b.height / 2, h: b.height, top: b.top };
      });
      /* ONE SLOT, NOT ONE CARD. What a neighbour has to travel to take
         over the gap is the card's height PLUS the space between cards.
         Shifting by the height alone left every gap about eleven pixels
         short, so the cards overlapped where the lifted one had been and
         the gap you were aiming at was never quite open. */
      var pitch = window.LKReorder && LKReorder.pitch
        ? LKReorder.pitch(boxes, e) : boxes[e].h;
      /* THE CARD HAS TO STAY UNDER THE FINGER ACROSS THE FOLD.

         This was the loudest thing wrong with the gesture. A 469px card
         folds to a 62px tab, the list above it shrinks by thousands of
         pixels, and the browser clamps the scroll -- so the card you were
         holding ended up four hundred pixels away from your hand, and
         from then on every millimetre of the drag was offset by that gap.
         The card looked dropped and the drop landed somewhere you never
         pointed at.

         `anchor` is the translate that puts the grab point back under the
         finger the instant the fold has happened, and it rides along with
         every later translate. The finger's depth into the card is kept
         where it will fit on the tab, clamped 8px in from either end so a
         card grabbed by its bottom edge does not hang off the hand. */
      var anchor = window.LKReorder && LKReorder.anchorFor
        ? LKReorder.anchorFor(y0, grabDY, boxes[e]) : 0;
      DRAG = { from: e, to: e, y0: y0, cards: cards, boxes: boxes, h: pitch,
               dy: anchor, anchor: anchor, v: 0, t: 0, cy: y0,
               glide: null, armed: false, inset: scrollInset(body),
               scroller: body, s0: body ? body.scrollTop : 0 };
      card.style.zIndex = '20';
      /* Carried, not re-targeted. The card comes to the hand at once, but
         the gap stays in its own slot until the finger actually moves --
         otherwise a hold with no drag at all would land the card wherever
         the fold happened to leave it and count that as a reorder. */
      if (window.LKReorder) LKReorder.carry(card, DRAG.dy = dragDy(y0));
      /* v6 fired 30 and then 20 back to back from two different places,
         and a second vibrate() call cancels the first -- so what the
         shipped app's hand actually felt on a lift was the 20. */
      buzzSafe(20);
      /* BACK TO THE TOP OF THE LIST, WHICH IS THE POINT OF FOLDING IT.

         Folding every card into a tab is what makes eight exercises fit on
         one screen, and that is worth nothing if you are still parked
         nine hundred pixels down where the eighth card used to be. The
         browser's own clamp gets you part of the way -- it will not let
         you stay past the end of a list that just got shorter -- and on a
         long list that leaves you in the middle of it.

         Glided rather than jumped. The card stays nailed to the finger the
         whole way, because placeDrag adds the scroll delta back into the
         translate, so what a reader sees is the list running up underneath
         a card they are still holding. */
      glideToTop();
      /* A list longer than the screen could only be reordered inside one
         screenful: there was nothing to carry a card past the bottom
         edge. v6 crept the list and so does this.

         NaN once the drag is over, never 0: zero is the top of the screen
         and the band now reaches past the scroller's own edge, so a stale
         zero would leave the list creeping upwards on its own. While the
         glide above is running the finger is reported as nowhere, so the
         two are never writing scrollTop in the same frame. */
      if (window.LKReorder && LKReorder.edgeScroll) {
        DRAG.stopEdge = LKReorder.edgeScroll(body,
          function () {
            if (!DRAG) return NaN;
            return DRAG.glide && DRAG.glide.running ? NaN : DRAG.cy;
          },
          function () { if (DRAG) placeDrag(DRAG.cy); });
      }
    }, HOLD_MS);
  });

  /* ---- THROWING A WHOLE EXERCISE AWAY ------------------------------
     The same gesture as a set and the same signal, because it means the
     same thing. It starts on the grip rather than anywhere on the card,
     so nothing that is scrolled past can be deleted by accident, and it
     takes the same real travel a set does. It is undoable, which is the
     only reason a swipe is allowed to do it at all. */
  var PERIL = null;

  function startPeril(e, x) {
    var card = cardEls()[e];
    if (!card || !S.exercises[e]) return;
    PERIL = { e: e, card: card, x0: x, dx: 0, v: 0, t: 0 };
    buzzSafe(8);
  }
  function drawPeril(dx) {
    if (!PERIL) return;
    var p = peril(dx);
    PERIL.card.style.transition = 'none';
    PERIL.card.style.transform = 'translateX(' + (dx < 0 ? dx : rubber(dx)) + 'px)';
    PERIL.card.style.setProperty('--peril', p);
    if (p > 0) PERIL.card.classList.add('is-peril');
    else PERIL.card.classList.remove('is-peril');
  }
  function settlePeril() {
    if (!PERIL) return;
    var c = PERIL.card;
    c.style.transition = 'transform var(--dur-quick, .18s) var(--spring-soft, ease)';
    c.style.transform = '';
    c.classList.remove('is-peril');
    c.style.removeProperty('--peril');
    PERIL = null;
  }
  function endPeril() {
    if (!PERIL) return;
    var d = PERIL;
    var wentFar = d.dx <= SWIPE_OPEN;
    var flicked = d.dx <= SWIPE_OPEN / 2 && projected(d.dx, d.v) <= SWIPE_OPEN;
    if (!wentFar && !flicked) { settlePeril(); return; }
    var ex = S.exercises[d.e];
    if (!ex) { settlePeril(); return; }
    PERIL = null;
    var gone = S.exercises.splice(d.e, 1)[0];
    var at = d.e;
    buzzSafe(14);
    S.dragEx = -1;
    S.liftedEx = -1;
    paint();
    toast(gone.name + ' removed.', 'info', 'Undo', function () {
      S.exercises.splice(at, 0, gone);
      paint();
      say(gone.name + ' is back.');
    });
  }

  document.addEventListener('pointermove', function (ev) {
    if (!PERIL) return;
    ev.preventDefault();
    var dx = ev.clientX - PERIL.x0;
    var now = ev.timeStamp || Date.now();
    if (PERIL.t) {
      var dt = Math.max(now - PERIL.t, 1);
      PERIL.v = 0.75 * ((dx - PERIL.dx) / dt * 1000) + 0.25 * PERIL.v;
    }
    PERIL.t = now;
    if (dx <= SWIPE_OPEN && PERIL.dx > SWIPE_OPEN) buzzSafe(10);
    PERIL.dx = dx;
    drawPeril(dx);
  });
  document.addEventListener('pointerup', endPeril);
  document.addEventListener('pointercancel', settlePeril);

  document.addEventListener('pointermove', function (ev) {
    if (!DRAG) return;
    ev.preventDefault();
    /* The speed the drop spring is seeded with, smoothed v6's way: three
       parts of this sample to one of the running value. A raw
       frame-to-frame delta off a finger that has just paused is noise,
       and noise here throws the card across the list. */
    var now = ev.timeStamp || Date.now();
    var ds = DRAG.scroller ? DRAG.scroller.scrollTop - DRAG.s0 : 0;
    /* The same sum placeDrag makes, anchor and all. Without the anchor the
       first sample is the whole fold offset measured as one frame of
       travel, and the drop spring gets seeded with several thousand pixels
       a second the finger never moved. */
    var dy = ev.clientY - DRAG.y0 + ds + (DRAG.anchor || 0);
    if (DRAG.t) {
      var dtm = Math.max(now - DRAG.t, 1);
      DRAG.v = 0.75 * ((dy - DRAG.dy) / dtm * 1000) + 0.25 * DRAG.v;
    }
    DRAG.t = now;
    DRAG.armed = true;
    placeDrag(ev.clientY);
  });

  document.addEventListener('pointerup', function () {
    clearHold();
    endDrag(true);
  });
  document.addEventListener('pointercancel', function () {
    clearHold();
    endDrag(false);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && DRAG) { ev.preventDefault(); endDrag(false); }
  });

  /* Clocks. One interval, no per-row timers. */
  setInterval(function () {
    var dirty = false;
    /* Only the fallback counter ticks. With a record running, elapsed is
       derived from startedAt and incrementing here would double-count. */
    if (!(window.LKSession && LKSession.get())) S.elapsed++;
    /* Nothing is decremented. The deadline is re-read, so a second spent
       with the screen off costs exactly one second here too. */
    var wasRunning = S.restRunning;
    if (syncRest() || (wasRunning && !S.restRunning)) { say('Rest done'); dirty = true; }
    else if (wasRunning !== S.restRunning) dirty = true;
    var el = document.querySelector('[data-testid="session-timer"] .num');
    if (el) el.textContent = hhmm(elapsedSec());
    var rl = document.querySelector('[data-testid="rest-remaining"] .num');
    if (rl) rl.textContent = clock(S.restLeft);
    if (dirty && !S.restRunning) paint();
  }, 1000);

  /* =============================================================
     Dev states
     ============================================================= */
  var STATES = [
    ['mid-session', 'Mid-session'],
    ['first-set', 'First set'],
    ['keypad', 'Keypad open'],
    ['rest', 'Rest running'],
    ['exercise-done', 'Exercise done'],
    ['plates', 'Plate calculator'],
    ['empty', 'Empty'],
    ['loading', 'Loading'],
    ['error', 'Error']
  ];
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  function paintMenu() {
    LKPatch(menu, STATES.map(function (s) {
      return '<button class="dev__item" type="button" data-state="' + s[0] + '" data-testid="dev-' + s[0] + '" aria-pressed="' + (S.state === s[0] ? 'true' : 'false') + '">' + s[1] + '</button>';
    }).join(''));
  }
  toggle.addEventListener('click', function () {
    var open = menu.hasAttribute('hidden');
    if (open) menu.removeAttribute('hidden'); else menu.setAttribute('hidden', '');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  menu.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-state]');
    if (!b) return;
    applyState(b.getAttribute('data-state'));
    paintMenu();
    paint();
  });

  loadLibrary();

  /* A workout already running gets its own rows back, not the fixture's.
     This is the whole point of writing them down. */
  /* A day asked for from Train replaces the seeded session outright, and it
     is not something to "pick up where you left off" from. */
  var asked = startRequested();
  var restored = asked ? false : restoreRows();

  paintMenu();
  paint();
  /* The idle clock starts with the session. */
  touchIdle();
  if (restored) say('Picked up where you left off.');
  window.__LK = { state: S, apply: function (s) { applyState(s); paintMenu(); paint(); } };
})();
</script>
</body>
</html>
