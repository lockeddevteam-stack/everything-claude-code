  /* THE PICKER'S LIBRARY. Six rows, typed into this file, against a library
     of 866 -- so "Search all exercises" searched six, and a swap could only
     ever reach whichever six somebody had chosen months ago. The whole
     catalogue is fetched the way split-builder.html and the library screen
     fetch it; from a file:// origin the fetch cannot run, the six below
     stand, and the sheet says how many it is offering either way. */
  /* Names and regions read off tests/fixtures/exercise-db.json. Five of the
     six were wrong: 211 is a Barbell Row, not a Lat Pulldown; 503 a Barbell
     Curl, not a Cable Curl; 321 a Face Pull. Swapping to one of these put a
     different lift in the session than the row said, under an id the rest of
     the app resolves for itself. */
  var LIBRARY = [
    { id: 202, name: 'Lat Pulldown', muscle: 'Lats' },
    { id: 113, name: 'Machine Chest Press', muscle: 'Mid Chest' },
    { id: 321, name: 'Face Pull', muscle: 'Rear Delt' },
    { id: 503, name: 'Barbell Curl', muscle: 'Long Head' },
    { id: 701, name: 'Barbell Squat', muscle: 'Quads' },
    { id: 802, name: 'Lying Leg Curl', muscle: 'Hamstrings' }
  ];
  var LIBRARY_FULL = false;

  function loadLibrary() {
    /* Custom exercises a person made are theirs and belong in the picker
       whether or not the catalogue loads. */
    function withCustom(rows) {
      ((window.LKStore ? LKStore.get('lk_customEx', []) : []) || []).forEach(function (c) {
        rows.push({ id: c.id, name: c.name, muscle: c.muscle || c.sid || c.gid || 'Custom', custom: true });
      });
      return rows;
    }
    if (location.protocol === 'file:' || typeof fetch !== 'function') {
      LIBRARY = withCustom(LIBRARY.slice());
      return;
    }
    fetch('../tests/fixtures/exercise-db.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (rows) {
        if (!Array.isArray(rows) || !rows.length) return;
        LIBRARY = withCustom(rows.map(function (x) {
          return { id: x.id, name: x.name, muscle: x.muscle || x.group || '' };
        }));
        LIBRARY.sort(function (a, b) { return a.name < b.name ? -1 : 1; });
        LIBRARY_FULL = true;
        if (S.overlay === 'addex') paint();
      })
      .catch(function () { LIBRARY = withCustom(LIBRARY.slice()); });
  }

  function addExHTML() {
    return '<div class="scrim" data-act="close" data-testid="addex-scrim" role="presentation"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="Add exercise" data-testid="addex-sheet">' +
        '<div class="sheet__grab" aria-hidden="true"></div>' +
        '<div class="sheet__head"><h2 class="t-section">' +
          (S.swapAt !== null && S.exercises[S.swapAt]
            ? 'Replacing: ' + esc(S.exercises[S.swapAt].name)
            : 'Add exercise') + '</h2>' +
          '<button class="iconbtn" type="button" data-act="close" data-testid="addex-close" aria-label="Close add exercise">' + ICO.close + '</button></div>' +
        '<div class="search"><span class="search__ico">' + ICO.search + '</span>' +
          '<label class="vis-hidden" for="addex-q">Search all exercises</label>' +
          '<input class="input" id="addex-q" data-act="addex-q" data-testid="addex-search" ' +
            'value="' + esc(S.addexQ || '') + '" autocomplete="off" placeholder="Search all exercises"></div>' +
        '<p class="t-meta mt-2" data-testid="addex-count">' + n(LIBRARY.length) + ' exercises' +
          (LIBRARY_FULL ? '' : ', which is all this build could read from here') + '</p>' +
        '<div class="sheet__body mt-3">' + addExList() +
        '</div>' +
      '</div>';
  }

  /* The list the search actually filters. It was rendered straight from
     LIBRARY with the field wired to nothing: typing anything left all six
     rows exactly where they were, which is worse than having no field. */
  var ADDEX_PAGE = 40;
  function addExList() {
    var q = (S.addexQ || '').trim().toLowerCase();
    var all = q
      ? LIBRARY.filter(function (x) {
          return x.name.toLowerCase().indexOf(q) > -1 || (x.muscle || '').toLowerCase().indexOf(q) > -1;
        })
      : LIBRARY;
    /* A SWAP WANTS THE SAME MUSCLE. Swapping the bench press opened the
       library at 3/4 Sit-Up and 45-degree Incline Lateral Raise -- an
       alphabetical list of 866 lifts, when the question being asked is "what
       else trains this". Anything hitting the same muscle comes first, and
       with nothing typed only those are offered, with a way to see the rest.
       A plain Add is unchanged: there the whole library IS the answer. */
    var swapping = S.swapAt !== null && S.exercises[S.swapAt];
    var sameOnly = false;
    if (swapping && !q) {
      var want = String(S.exercises[S.swapAt].muscle || '').toLowerCase();
      var same = all.filter(function (x) {
        return want && String(x.muscle || '').toLowerCase() === want;
      });
      if (same.length && !S.addexAll) { all = same; sameOnly = true; }
    } else if (swapping && q) {
      var want2 = String(S.exercises[S.swapAt].muscle || '').toLowerCase();
      all = all.slice().sort(function (a, b) {
        var sa = String(a.muscle || '').toLowerCase() === want2 ? 0 : 1;
        var sb = String(b.muscle || '').toLowerCase() === want2 ? 0 : 1;
        return sa - sb;
      });
    }
    /* 866 rows in one sheet is a scroll nobody finishes, and it is the
       search field's job anyway. A page at a time, with the count and a way
       to see more, so the number offered is never hidden. */
    var rows = all.slice(0, S.addexN || ADDEX_PAGE);
    var sameNote = sameOnly
      ? '<p class="t-detail muted" data-testid="addex-same">' + n(all.length) +
        (all.length === 1 ? ' lift' : ' lifts') + ' for ' +
        esc(S.exercises[S.swapAt].muscle) + ', which is what this one trains. ' +
        '<button class="btn btn--tertiary btn--sm" type="button" data-act="addex-all" ' +
        'data-testid="addex-all">Show the whole library</button></p>'
      : '';
    if (!all.length) {
      return '<div class="empty" data-testid="addex-empty">' +
        '<p class="empty__title">Nothing matches &ldquo;' + esc(S.addexQ.trim()) + '&rdquo;</p>' +
        '<p class="empty__body">Search by the lift or by the muscle it works. ' +
          'The full library has more than this session offers.</p></div>';
    }
    return sameNote + '<div class="card card--flush' + (sameNote ? ' mt-2' : '') + '">' + rows.map(function (x) {
      var i = LIBRARY.indexOf(x);
      return '<button class="row" type="button" data-act="addex-pick" data-i="' + i + '" data-testid="addex-pick-' + x.id + '">' +
        '<span class="row__main"><span class="row__title">' + esc(x.name) + '</span><span class="row__sub">' + esc(x.muscle) + '</span></span>' +
        '<span class="row__chev">' + ICO.plus + '</span></button>';
    }).join('') + '</div>' +
    (all.length > rows.length
      ? '<button class="btn btn--secondary btn--block mt-3" type="button" data-act="addex-more" data-testid="addex-more">' +
          '<span class="btn__label">Show more (' + (all.length - rows.length) + ' left)</span></button>'
      : '');
  }

  /* THE SESSION LEFT OPEN. A workout started and walked away from stays live
     for ever: the shelf says you are training, Home says you are training, and
     the next real session either resumes a ghost or starts beside it.

     Forty minutes of nothing, which is long enough that no set of rest reaches
     it and short enough to catch somebody who left the gym. It asks rather
     than deciding: ending a session nobody meant to end loses the sets. */
  var IDLE_MS = 40 * 60 * 1000;
  var idleTimer = null;
  function touchIdle() {
    if (idleTimer) clearTimeout(idleTimer);
    if (S.over || !S.exercises.length) return;
    idleTimer = setTimeout(function () {
      if (S.over || S.overlay === 'idle') return;
      S.overlay = 'idle';
      paint();
    }, IDLE_MS);
  }

  function idleHTML() {
    var mins = Math.round(IDLE_MS / 60000);
    return '<div class="scrim" data-act="idle-stay" data-testid="idle-scrim" role="presentation"></div>' +
      '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="idle-t" data-testid="idle-dialog">' +
        '<h2 class="t-section" id="idle-t">Still training?</h2>' +
        '<p class="t-detail muted mt-2">Nothing has been logged for ' + mins + ' minutes. ' +
          n(doneSets()) + ' sets are saved either way \u2014 this is only about whether the ' +
          'session stays open.</p>' +
        '<div class="addrow">' +
          '<button class="btn btn--secondary" type="button" data-act="idle-stay" data-testid="idle-stay">' +
            'No, continue</button>' +
          '<button class="btn btn--primary" type="button" data-act="idle-finish" data-testid="idle-finish">' +
            'End and review</button>' +
        '</div>' +
      '</div>';
  }

  function discardHTML() {
    return '<div class="scrim" data-act="close" data-testid="discard-scrim" role="presentation"></div>' +
      '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dc-t" data-testid="discard-dialog">' +
        '<h2 class="t-section" id="dc-t">Throw this workout away?</h2>' +
        '<p class="t-detail muted mt-2">' + n(doneSets()) + ' logged sets will be lost. This cannot be undone.</p>' +
        '<div class="addrow">' +
          '<button class="btn btn--secondary" type="button" data-act="close" data-testid="discard-cancel">Keep training</button>' +
          '<button class="btn btn--danger-solid" type="button" data-act="discard-confirm" data-testid="discard-confirm">Discard</button>' +
        '</div>' +
      '</div>';
  }

  function overlayHTML() {
    if (S.pad) return padHTML();
    switch (S.overlay) {
      case 'tools': return toolsHTML();
      case 'sheet': return exSheetHTML();
      case 'detail': return detailHTML();
      case 'plates': return platesHTML();
      case 'rest': return restSettingsHTML();
      case 'block': return blockModalHTML();
      case 'pickset': return pickSetHTML();
      case 'equip': return equipHTML();
      case 'idle': return idleHTML();
      case 'addex': return addExHTML();
      case 'discard': return discardHTML();
      default: return '';
    }
  }

  function toastHTML() {
    if (!S.toast) return '';
    var t = S.toast;
    return '<div class="toast" role="status" data-testid="toast">' +
      '<span class="toast__body">' + esc(t.text) + '</span>' +
      (t.action ? '<button class="toast__action" type="button" data-act="toast-action" data-testid="toast-action">' + esc(t.action) + '</button>' : '') +
    '</div>';
  }

  /* =============================================================
     Paint. Regions only, scroll and focus preserved: this screen is
     edited mid-set and must never jump under the thumb.
     ============================================================= */
  var hdr = document.getElementById('hdr');
  var restSlot = document.getElementById('rest-slot');
  var body = document.getElementById('body');
  var tabs = document.getElementById('tabs');
  var overlay = document.getElementById('overlay');
  var toastSlot = document.getElementById('toast-slot');
  var live = document.getElementById('live');
  var screen = document.getElementById('screen');

  /* Every region goes through the shared reconciler in app.js, which is
     loaded in <head> on this screen and inlined into the demo. Nothing is
     rebuilt: the caret, the scroll and the running animations survive. */
  function put(el, html) { LKPatch(el, html); }

  /* What was rendered last time, so an overlay that has just appeared can be
     told from one that was already there. Reading the state instead always
     says it was already open, because the caller sets it and then paints. */
  var renderedOverlay = false;

  /* The record the rest of the app reads. Written from paint rather than
     from each action, because a session that is on screen but not in the
     record is exactly the bug this file used to have: eighteen actions
     change the session and remembering to write in all eighteen is a thing
     a person forgets once and loses a workout to. Painting is the one thing
     they all do. */
  /* The one clock. The record's startedAt is the truth once a session is
     running, and this screen reads it rather than counting: a counter of its
     own restarted at the fixture's 21:01 on every load, so the header and the
     shelf for the same session could sit four hours apart on screen. */
  function elapsedSec() {
    var r = window.LKSession && LKSession.get();
    return r ? Math.floor(r.elapsed / 1000) : (S.elapsed || 0);
  }

  function record() {
    if (!window.LKSession) return;
    /* Finish and discard both end the session. Finish leaves the exercises on
       screen, so without this the very next paint saw a full workout with no
       record and started a brand new one -- every screen in the app then
       offered to Resume the workout you had just finished. */
    if (S.over) { return; }
    if (!S.exercises.length || S.state === 'empty') { LKSession.end(); return; }
    /* Seeded from the elapsed time already on screen the first time, so a
       session opened twenty-one minutes in does not restart its clock at
       zero. After that the record's own start time is the truth and this
       screen reads it rather than counting. */
    if (!LKSession.get()) {
      LKSession.start({
        name: S.name,
        startedAt: Date.now() - (S.elapsed || 0) * 1000,
        done: doneSets(),
        total: totalSets()
      });
      return;
    }
    LKSession.update({ name: S.name, done: doneSets(), total: totalSets() });
  }

  /* THE SETS, NOT ONLY THE CLOCK. LKSession's record carries the name, the
     start, and how many sets of how many are done -- it is the shelf's
     record, and every screen in the app reads it. What it cannot carry is
     the work: reload the log mid-session and the header kept counting from
     the right minute while every weight, rep and tick went back to the
     fixture. The rows live here, under the log's own key, tied to the
     record's start time so they can never be pasted onto a different
     session. LKSession itself is shared and was left alone. */
  var ROWS_KEY = 'lk_liveSessionRows';

  function persistRows() {
    if (!window.LKStore) return;
    if (S.over || !S.exercises.length) { LKStore.remove(ROWS_KEY); return; }
    var r = window.LKSession && LKSession.get();
    if (!r) return;
    LKStore.set(ROWS_KEY, {
      startedAt: r.startedAt,
      name: S.name,
      state: S.state,
      exercises: S.exercises,
      blocks: S.blocks,
      /* Auto-rest and the rest length are per-session: turning them off
         mid-workout should survive a reload of that workout. Partials
         visibility is not -- it is a preference Settings owns, and storing it
         per session meant a switch flipped in Settings could never reach a
         phone that had ever opened this screen. */
      restEnabled: S.restEnabled,
      restSeconds: S.restSeconds
    });
  }

  function restoreRows() {
    if (!window.LKStore || !window.LKSession) return false;
    var live = LKSession.get();
    if (!live) { LKStore.remove(ROWS_KEY); return false; }
    var rows = LKStore.get(ROWS_KEY, null);
    if (!rows || !rows.exercises || !rows.exercises.length) return false;
    /* A different workout's rows are not this workout's rows. */
    if (rows.startedAt !== live.startedAt) return false;
    S.name = rows.name || S.name;
    S.exercises = rows.exercises;
    S.blocks = rows.blocks || [];
    if (rows.restEnabled !== undefined) S.restEnabled = rows.restEnabled;
    if (rows.restSeconds !== undefined) S.restSeconds = rows.restSeconds;
    /* The note belongs to the exercise, not to the session's saved rows. A
       note typed mid-workout was written to lk_exNotes and then read back
       over by the rows this same workout had saved a moment earlier, so it
       came back as whatever the seed said. */
    if (window.LKStore) {
      var kept = LKStore.get('lk_exNotes', {}) || {};
      S.exercises.forEach(function (e) {
        if (e.id && kept[e.id] !== undefined) e.note = kept[e.id];
      });
    }
    return true;
  }

  function paint() {
    record();
    persistRows();
    var hadOverlay = renderedOverlay;
    var opener = document.activeElement && document.activeElement.dataset
      ? document.activeElement.dataset.testid : null;

    screen.setAttribute('data-state', S.state);
    put(hdr, headerHTML());
    put(restSlot, restHTML());
    put(body, bodyHTML());
    put(tabs, tabsHTML());
    put(overlay, overlayHTML());
    put(toastSlot, toastHTML());

    if (S.pop) {
      var popped = document.querySelector('[data-testid="' + S.pop + '"]');
      S.pop = null;
      if (popped) {
        popped.classList.remove('done--pop');
        /* Next frame, or the class is added inside the same style pass the
           element was patched in and the animation never restarts. */
        requestAnimationFrame(function () { popped.classList.add('done--pop'); });
      }
    }

    var nowOverlay = !!(S.overlay || S.pad);
    renderedOverlay = nowOverlay;

    /* Opening takes focus to the way OUT, never to the destructive control.
       Closing puts it back on whatever opened the thing, so the next Tab
       carries on from where the person was rather than at the top of the
       document. */
    if (nowOverlay && !hadOverlay) {
      if (opener) lastOpener = opener;
      var safe = overlay.querySelector('button[data-act="close"], button[data-act="pad-cancel"]') ||
                 overlay.querySelector('.sheet button, .dialog button');
      if (safe) safe.focus({ preventScroll: true });
    } else if (!nowOverlay && hadOverlay) {
      refocus(lastOpener);
      lastOpener = null;
    }
  }

  var lastOpener = null;
  function say(msg) { live.textContent = msg; }

  /* Focus goes back to the control that opened the thing being closed. A
     sheet that closes onto <body> restarts the next Tab at the top of the
     document, and for anybody on a keyboard or VoiceOver that is the whole
     screen to walk again. Deferred a frame because the caller closes the
     overlay by re-rendering after this returns. */
  function refocus(testid) {
    if (!testid) return;
    requestAnimationFrame(function () {
      var el = document.querySelector('[data-testid="' + testid + '"]');
      if (el && !el.disabled) el.focus({ preventScroll: true });
    });
  }

  /* =============================================================
     Behaviour
     ============================================================= */
  function startRest() {
    if (!S.restEnabled) return;
    S.restRunning = true;
    S.restLeft = S.restSeconds;
  }

  /* A toast says what happened and gets out of the way; it never sits
     on top of Add Exercise waiting to be dismissed. */
  var toastTimer = null;
  /* `fn` is what the action button does. It used to take a label and nothing
     else, and the only handler for the button dismissed the toast -- so the
     Undo on "Exercise removed." threw the exercise away for good under a
     control whose whole job was to bring it back, and the Retry on the error
     state did nothing either. A toast that offers an action now has to be
     handed one. */
  function toast(text, kind, action, fn) {
    S.toast = { text: text, kind: kind || 'info', action: action || null, fn: fn || null };
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; paint(); }, 4000);
  }

  document.addEventListener('click', function (ev) {
    /* Any tap on the screen is somebody still here. The clock restarts on
       every action rather than on a set being logged, because reading the
       plate calculator between heavy singles is training too. */
    touchIdle();
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    var e = Number(t.getAttribute('data-ex'));
    var i = Number(t.getAttribute('data-set'));
    S.tapCount++;

    /* Remember what was pressed, so whatever it opens can hand focus back to
       it. Only a control outside the overlay counts: a button inside a sheet
       is not what the sheet was opened from. */
    if (!t.closest('#overlay') && t.dataset.testid) lastOpener = t.dataset.testid;

    switch (act) {
      /* ---- editing any set, not only the current one ---- */
      case 'edit':
        S.pad = openPadFor(e, i, t.getAttribute('data-field'));
        S.toast = null;
        break;
      case 'pad-key': padDigit(t.getAttribute('data-key')); break;
      case 'pad-del': {
        var p = S.pad;
        p.replaced = true;
        p.buffer = p.buffer.slice(0, -1);
        break;
      }
      case 'pad-step': padStep(parseFloat(t.getAttribute('data-step'))); break;
      case 'pad-done': {
        var f = S.pad.field, ex = S.pad.ex, ix = S.pad.set;
        lastOpener = 'cell-' + ex + '-' + ix + '-' + f;
        padCommit();
        say('Set ' + (ix + 1) + ' ' + f + ' saved');
        break;
      }
      case 'pad-cancel': {
        lastOpener = S.pad ? 'cell-' + S.pad.ex + '-' + S.pad.set + '-' + S.pad.field : lastOpener;
        S.pad = null;
        break;
      }

      case 'rir':
        break;

      case 'done': {
        var st = S.exercises[e].sets[i];
        if (!st.done) {
          /* Nothing to log. The tick used to turn a row of dashes into a
             counted set of 0 kg, which inflated the header, the shelf and the
             discard warning by tapping. */
          var fillKg = st.kg !== null ? st.kg : st.prevKg;
          var fillReps = st.reps !== null ? st.reps : st.prevReps;
          if (fillKg === null || fillKg === undefined || fillReps === null || fillReps === undefined) {
            say('Set ' + (i + 1) + ' needs a weight and reps first.');
            toast('Put a weight and reps in set ' + (i + 1) + ' before logging it.');
            break;
          }
        }
        st.done = !st.done;
        if (st.done) {
          if (st.kg === null) st.kg = st.prevKg;
          if (st.reps === null) st.reps = st.prevReps;
          startRest();
          /* Felt as well as seen. One short pulse for a set, two for a
             record, and the tick pops under the thumb. */
          buzz(12);
          S.pop = 'done-' + e + '-' + i;
          /* The moment a best is beaten is the moment to say so. A 100 kg
             set against a 72.5 kg best produced "Set 4 logged" and nothing
             else, and the record only appeared days later on another
             screen. */
          var pr = prBeaten(S.exercises[e], st);
          if (pr) {
            recordPR(S.exercises[e], st);
            /* On the set, so the banner and the card badge can be drawn from
               the session itself and outlive the toast. */
            st.pr = true;
            st.prText = pr;
            buzz([12, 60, 24]);
            toast('All-time PR. ' + pr, 'info');
            say(S.exercises[e].name + ', personal best. ' + pr);
          } else {
            say('Set ' + (i + 1) + ' logged. ' + doneSets() + ' sets this session.');
          }
        } else {
          S.restRunning = false;
          /* Reopening a set takes back what ticking it claimed. The record
             row already written stands -- it was lifted -- but this session
             stops announcing it. */
          st.pr = false; st.prText = '';
          say('Set ' + (i + 1) + ' reopened');
        }
        break;
      }
      case 'partial': {
        var ps = S.exercises[e].sets[i];
        ps.partials = ps.partials >= 9 ? 0 : ps.partials + 1;
        say('Set ' + (i + 1) + ': ' + ps.partials + ' partials');
        break;
      }
      case 'addset': {
        var lastSet = S.exercises[e].sets[S.exercises[e].sets.length - 1];
        S.exercises[e].sets.push(set(null, null, { prevKg: lastSet ? lastSet.kg || lastSet.prevKg : null, prevReps: lastSet ? lastSet.prevReps : null, rir: lastSet ? lastSet.rir : 2 }));
        say('Set added to ' + S.exercises[e].name);
        break;
      }
      /* One Add Set for a pair, because a superset is performed in rounds:
         adding a round to one half and not the other is not a thing that
         happens on the gym floor. */
      case 'addset-both': {
        [e, e + 1].forEach(function (ix) {
          var ex2 = S.exercises[ix];
          if (!ex2) return;
          var ls = ex2.sets[ex2.sets.length - 1];
          ex2.sets.push(set(null, null, { prevKg: ls ? ls.kg || ls.prevKg : null,
                                          prevReps: ls ? ls.prevReps : null,
                                          rir: ls ? ls.rir : 2 }));
        });
        say('A set added to both halves of the superset.');
        break;
      }
      case 'airec': {
        if (S.aiBusyEx === e) break;
        S.aiBusyEx = e;
        S.toast = null;
        paint();
        setTimeout(function () {
          S.aiBusyEx = -1;
          var target = null;
          for (var k = 0; k < S.exercises[e].sets.length; k++) { if (!S.exercises[e].sets[k].done) { target = k; break; } }
          if (target === null) { toast('Every set in this exercise is logged.'); paint(); return; }
          var s2 = S.exercises[e].sets[target];
          /* A suggestion, on the set, beside the record -- never written into
             prevKg. Writing it there made the app report a weight nobody had
             lifted as what was lifted last time, and every further tap added
             another 2.5 kg to that false record with no ceiling. The base is
             the last session's top set, so the suggestion is the same figure
             on every tap rather than an escalation. */
          var base = s2.prevKg || (S.exercises[e].sets.reduce(function (a, x) {
            return Math.max(a, x.prevKg || 0);
          }, 0)) || 20;
          s2.suggestKg = Math.round((base + 2.5) * 2) / 2;
          s2.suggestReps = s2.prevReps || 8;
          toast('Suggested ' + trim(toDisplay(s2.suggestKg, unitAt(e))) + ' ' + unitLabel(unitAt(e)) + ' x ' +
                s2.suggestReps + ' for set ' + (target + 1) + '. Tap the cell to take it.',
                'info', 'Take it', function () {
                  s2.kg = s2.suggestKg; s2.reps = s2.suggestReps;
                  paint();
                  say('Set ' + (target + 1) + ' set to the suggestion.');
                });
          say('Recommendation ready');
          paint();
        }, 900);
        return;
      }

      /* ---- exercise card ---- */
      case 'grip':
        /* A drag ends with a click on whatever is under the finger. Without
           this, finishing a drag immediately lifted some other card. */
        if (Date.now() - dragEndedAt < 350) return;
        S.liftedEx = S.liftedEx === e ? -1 : e;
        say(S.liftedEx === e
          ? 'Reordering ' + S.exercises[e].name + '. Use Up and Down, or drag the grip.'
          : 'Order kept');
        break;
      case 'move': {
        var dir = Number(t.getAttribute('data-dir'));
        if (moveEx(e, e + dir)) {
          S.liftedEx = e + dir;
          say(S.exercises[e + dir].name + ' moved to position ' + (e + dir + 1) +
              ' of ' + S.exercises.length + '.');
          refocus('grip-' + (e + dir));
        }
        break;
      }
      case 'move-done': S.liftedEx = -1; say('Order kept'); refocus('grip-' + e); break;
      /* THE SHEET IS HELD OPEN, NOT TAPPED OPEN. It opened on a plain tap of
         the exercise name -- a 44-tall target sitting directly above the set
         grid, in the middle of a screen people jab at with one hand between
         sets -- so it fired by accident, and the gesture the shipped app
         taught was gone. A short press now says how to open it instead of
         opening it, which is the one thing a tap can do that is neither a
         surprise nor a dead control. Enter and Space still open it outright,
         because a keyboard cannot hold. */
      case 'exsheet':
        if (heldOpenAt && Date.now() - heldOpenAt < 600) break;   /* the hold already opened it */
        say('Hold ' + S.exercises[e].name + ' to open its options.');
        toast('Hold the name to open options for ' + S.exercises[e].name + '.');
        break;
      case 'exact': {
        var key = t.getAttribute('data-key');
        var cur = S.exercises[S.overlayEx];
        if (key === 'info') { S.overlay = 'detail'; break; }
        if (key === 'unit') {
          /* An override, stored against the lift. Nothing already logged
             changes: the rows are kilograms and stay kilograms, and only the
             reading of them moves. */
          var wasU = unitOf(cur);
          var nextU = wasU === S.unit ? (S.unit === 'kg' ? 'lb' : 'kg') : null;
          cur.unit = nextU;
          if (cur.id) setEquip(cur.id, { unit: nextU });
          S.overlay = null;
          toast(nextU
            ? cur.name + ' reads in ' + unitLabel(nextU) + '. Every other lift stays in ' + unitLabel(S.unit) + '.'
            : cur.name + ' is back in ' + unitLabel(S.unit) + ', like the rest of the session.');
          break;
        }
        if (key === 'warmup') {
          /* A ramp, not the same set twice. Pressing this twice put two
             identical 50% warm-ups on the exercise, which is not how anybody
             warms up: the rungs are 50, 70 and 85 per cent of the working
             weight, inserted in order, with the reps coming down as the
             weight goes up. Past three it stops, because a fourth warm-up on
             one lift is a different session. */
          var RAMP = [[0.5, 10], [0.7, 6], [0.85, 3]];
          var warms = cur.sets.filter(function (x) { return x.warm; }).length;
          if (warms >= RAMP.length) {
            S.overlay = null;
            toast('Three warm-ups is the most this adds. Edit one, or add a plain set.');
            break;
          }
          var work = null;
          cur.sets.forEach(function (x) {
            if (x.warm || work !== null) return;
            work = x.kg !== null ? x.kg : x.prevKg;
          });
          if (work === null || work === undefined) work = 20;
          var rung = RAMP[warms];
          var at = 0;
          /* After the warm-ups already there, before the first working set,
             so the ramp reads in the order it is performed. */
          while (at < cur.sets.length && cur.sets[at].warm) at++;
          cur.sets.splice(at, 0, set(Math.round(work * rung[0] * 2) / 2, rung[1],
                                     { warm: true, rir: 4 }));
          S.overlay = null;
          toast('Warm-up at ' + trim(toDisplay(Math.round(work * rung[0] * 2) / 2, unitOf(cur))) + ' ' +
                unitLabel(unitOf(cur)) + ' added.');
          break;
        }
        /* Any set, not only the last. delset pops, so shedding the second of
           four meant deleting two and retyping one. */
        if (key === 'equip') { S.overlay = 'equip'; break; }
        if (key === 'delrow') {
          if (cur.sets.length <= 1) { S.overlay = null; toast('An exercise keeps at least one set.'); break; }
          S.overlay = 'pickset';
          break;
        }
        if (key === 'delset') {
          if (cur.sets.length <= 1) { S.overlay = null; toast('An exercise keeps at least one set.'); break; }
          var lastIx = cur.sets.length - 1, goneSet = cur.sets.pop();
          S.overlay = null;
          toast('Last set removed from ' + cur.name + '.', 'info', 'Undo', function () {
            cur.sets.splice(lastIx, 0, goneSet);
            paint();
            say('Set ' + (lastIx + 1) + ' is back.');
          });
          break;
        }
        if (key === 'remove') {
          var at = S.overlayEx, gone = S.exercises.splice(at, 1)[0];
          S.overlay = null;
          toast('Exercise removed.', 'info', 'Undo', function () {
            S.exercises.splice(at, 0, gone);
            paint();
            say(gone.name + ' is back, with its sets.');
          });
          break;
        }
        /* Swap REPLACES. It opened the add picker, which pushes -- so
           "Swap exercise" left the original in place and appended the new
           one beside it: five exercises became six. S.swapAt records which
           one is being replaced, and the picker reads it. */
        if (key === 'swap') {
          S.swapAt = S.overlayEx; S.addexAll = false; S.addexQ = ''; S.addexN = ADDEX_PAGE;
          S.overlay = 'addex'; break;
        }
        if (key === 'superset') {
          /* A superset is with the NEXT exercise, so the last one has
             nothing to pair with and the sheet used to say it had. */
          if (!cur.superset && !S.exercises[S.overlayEx + 1]) {
            S.overlay = null;
            toast('Nothing after ' + cur.name + ' to superset it with. Add the other exercise first.');
            break;
          }
          cur.superset = !cur.superset;
          S.overlay = null;
          toast(cur.superset
            ? 'Supersetted with ' + S.exercises[S.overlayEx + 1].name + '.'
            : 'Superset off.');
          break;
        }
        if (key === 'unilateral') {
          cur.unilateral = !cur.unilateral;
          /* The flag alone changed nothing on screen. Turning it on splits
             every set into the two rows it is actually performed in, and
             turning it off folds them back onto the left-hand row -- which
             is the row that already holds the weight and reps, so nothing a
             person typed is lost either way. */
          if (cur.unilateral) {
            var out = [];
            cur.sets.forEach(function (st) {
              st.side = 'L';
              out.push(st);
              var r = JSON.parse(JSON.stringify(st));
              r.side = 'R'; r.done = false; r.partials = 0;
              out.push(r);
            });
            cur.sets = out;
          } else {
            cur.sets = cur.sets.filter(function (st) { return st.side !== 'R'; });
            cur.sets.forEach(function (st) { delete st.side; });
          }
          S.overlay = null;
          toast(cur.unilateral
            ? 'Left and right tracked separately. Each set is two rows now.'
            : 'Tracked as one side. The right-hand rows are gone.');
          break;
        }
        S.overlay = null;
        break;
      }

      /* ---- header ---- */
      case 'tools': S.overlay = 'tools'; break;
      case 'tool': {
        var tool = t.getAttribute('data-tool');
        if (tool === 'unit') { setUnit(S.unit === 'kg' ? 'lb' : 'kg'); S.overlay = null; toast('Showing ' + unitLabel() + ' everywhere.'); }
        else S.overlay = tool;
        break;
      }
      case 'discard': S.overlay = 'discard'; break;
      /* Discard DISCARDS. It toasted "Workout discarded." and left all five
         exercises and every set on screen, which is the worst possible
         outcome for a destructive confirm: the reader believes their session
         is gone and it is not. The session empties and the screen says so;
         Undo is not offered, because the dialog already asked. */
      case 'discard-confirm':
        S.over = true;
        S.overlay = null;
        S.exercises = [];
        S.blocks = [];
        S.elapsed = 0;
        S.restRunning = false; S.restLeft = 0;
        if (window.LKSession) LKSession.end();
        toast('Workout discarded.');
        break;
      /* Finish leaves for Review; in the demo the router takes the click
         first. It used to toast "Opening review." and stay here. */
      /* The session is over the moment Finish is pressed. Review reads the
         numbers it shows from the workout, not from this record, so ending
         it here is what stops a finished workout following you around the
         app on a shelf that says Resume. */
      case 'finish':
        S.over = true;
        handOff();
        if (window.LKSession) LKSession.end();
        location.href = 'review.html';
        break;

      /* ---- rest ---- */
      case 'rest-add': S.restLeft += 30; say('Rest extended to ' + clock(S.restLeft)); break;
      case 'rest-skip': S.restRunning = false; say('Rest skipped'); break;
      case 'rest-toggle': S.restEnabled = !S.restEnabled; break;
      case 'rest-set': S.restSeconds = Number(t.getAttribute('data-secs')); if (S.restRunning) S.restLeft = S.restSeconds; break;

      /* ---- plate calculator ---- */
      case 'plate-add': S.plate.added.push(Number(t.getAttribute('data-plate'))); break;
      case 'plate-bar': S.plate.bar = Number(t.getAttribute('data-bar')); break;
      case 'plate-side': S.plate.perSide = t.getAttribute('data-side') === '1'; break;
      case 'plate-undo': S.plate.added.pop(); break;
      case 'plate-clear': S.plate.added = []; break;
      case 'plate-apply': {
        var target2 = nextUndone();
        if (target2) {
          var total = S.plate.bar + S.plate.added.reduce(function (a, b) { return a + b; }, 0) * 2;
          S.exercises[target2.ex].sets[target2.set].kg = total;
          S.overlay = null;
          var au = unitAt(target2.ex);
          toast(trim(toDisplay(total, au)) + unitLabel(au) + ' applied to set ' + (target2.set + 1) + '.');
        }
        break;
      }

      /* ---- add exercise, block ---- */
      case 'addex': S.overlay = 'addex'; S.addexN = ADDEX_PAGE; break;
      case 'addex-more': S.addexN = (S.addexN || ADDEX_PAGE) + ADDEX_PAGE; break;
      case 'addex-pick': {
        var pick = LIBRARY[Number(t.getAttribute('data-i'))];
        if (S.swapAt !== null && S.exercises[S.swapAt]) {
          /* The sets stay. A swap is "I did this movement instead", not "start
             again" -- the weights already entered are the reader's work and
             throwing them away to change a name would be the worse bug. */
          var was = S.exercises[S.swapAt];
          was.id = pick.id; was.name = pick.name; was.muscle = pick.muscle;
          /* The sets stay; the OTHER lift's history does not. A swapped-in
             machine press kept the cable fly's "last session 15 kg", and
             because ticking a blank set commits prevKg, one stray tap logged
             15 kg x 12 of a movement never performed. */
          was.sets.forEach(function (st) {
            st.prevKg = null; st.prevReps = null; st.suggestKg = null; st.suggestReps = null;
          });
          S.overlay = null; S.addexQ = '';
          var from = S.swapAt; S.swapAt = null;
          toast('Swapped to ' + pick.name + '.', 'info');
          break;
        }
        var keptNote = '';
        if (window.LKStore) {
          var allN = LKStore.get('lk_exNotes', {}) || {};
          if (allN[pick.id]) keptNote = allN[pick.id];
        }
        S.exercises.push({ id: pick.id, name: pick.name, muscle: pick.muscle, note: keptNote, sets: [set(null, null, {}), set(null, null, {}), set(null, null, {})] });
        S.overlay = null; S.addexQ = '';
        toast(pick.name + ' added.');
        break;
      }
      case 'block': S.overlay = 'block'; break;
      /* Cycles rather than opening a menu: four states, one tap each, on a
         control that is already on every row. A menu for a four-way choice
         is a sheet to open, read and dismiss for something that takes a
         tap. */
      case 'rest-custom': {
        var mf = document.getElementById('rest-min');
        var sf = document.getElementById('rest-sec');
        var mins = mf ? parseInt(mf.value, 10) : NaN;
        var secs0 = sf ? parseInt(sf.value, 10) : NaN;
        if (isNaN(mins)) mins = 0;
        if (isNaN(secs0)) secs0 = 0;
        if (mins < 0 || secs0 < 0 || secs0 > 59) {
          S.restError = 'Minutes, then seconds under 60.';
          break;
        }
        var secs = mins * 60 + secs0;
        if (secs < 5 || secs > 900) {
          S.restError = 'Between 5 seconds and 15 minutes.';
          break;
        }
        S.restSeconds = secs;
        S.restError = null;
        /* A rest already running takes the new length too, or the setting
           would only apply from the next set and the sheet would look as
           though it had done nothing. */
        if (S.restRunning) S.restLeft = secs;
        toast('Rest set to ' + clock(secs) + '.');
        break;
      }
      case 'set-kind': {
        var ke = Number(t.getAttribute('data-ex')), ki = Number(t.getAttribute('data-set'));
        var kex = S.exercises[ke], ks = kex.sets[ki];
        var at = SET_KINDS.indexOf(kindOf(ks));
        var next = SET_KINDS[(at + 1) % SET_KINDS.length];
        ks.warm = next === 'warm';
        ks.kind = next === 'warm' ? null : next;
        /* A DROP SET IS THE SET ABOVE IT, LIGHTER. That is the whole reason
           the state exists, and the weight was left to be typed by hand in
           the one moment nobody has a free hand: straight off a set, with the
           bar still loaded. Three quarters of the preceding set's load,
           rounded to the half, and only into a row nobody has typed into --
           a figure already entered is the lifter's and is never overwritten.
           An undone row can be re-filled; a logged one cannot. */
        if (next === 'drop' && !ks.done) {
          var above = null;
          for (var kk = ki - 1; kk >= 0; kk--) {
            var cand = kex.sets[kk];
            var load = cand.kg !== null && cand.kg !== undefined ? cand.kg : cand.prevKg;
            if (load !== null && load !== undefined) { above = { kg: load, reps: cand.reps }; break; }
          }
          if (above) {
            ks.kg = Math.round(above.kg * 0.75 * 2) / 2;
            if (ks.reps === null || ks.reps === undefined) ks.reps = above.reps;
            var du = unitOf(kex);
            toast('Drop set at ' + trim(toDisplay(ks.kg, du)) + ' ' + unitLabel(du) +
                  ', three quarters of set ' + (ki) + '. Type over it if it was not.');
          }
        }
        say('Set ' + (ki + 1) + ' is a ' + KIND_WORD[next] + '.');
        break;
      }
      case 'equip-kind': {
        var ee = S.exercises[S.overlayEx];
        if (ee) setEquip(ee.id, { eq: t.getAttribute('data-v') });
        break;
      }
      case 'equip-cb': {
        var ec = S.exercises[S.overlayEx];
        if (ec) setEquip(ec.id, { noCB: !(equipFor(ec.id) || {}).noCB });
        break;
      }
      case 'equip-save': {
        var es = S.exercises[S.overlayEx];
        var bf = document.getElementById('equip-base');
        if (es && bf) {
          var bv = parseFloat(bf.value);
          setEquip(es.id, { base: isNaN(bv) || bv < 0 ? 0 : Math.min(200, bv) });
        }
        S.overlay = null;
        toast('Saved for ' + (es ? es.name : 'this lift') + '.');
        break;
      }
      case 'idle-stay': { S.overlay = null; touchIdle(); break; }
      case 'idle-finish': {
        S.over = true;
        handOff();
        if (window.LKSession) LKSession.end();
        location.href = 'review.html';
        return;
      }
      case 'addex-all': { S.addexAll = true; S.addexN = ADDEX_PAGE; break; }
      case 'delrow-go': {
        var dre = S.overlayEx, dri = Number(t.getAttribute('data-i'));
        var dex = S.exercises[dre];
        if (!dex || dex.sets.length <= 1) { S.overlay = null; break; }
        var goneRow = dex.sets.splice(dri, 1)[0];
        S.overlay = null;
        toast('Set removed.', 'info', 'Undo', function () {
          dex.sets.splice(dri, 0, goneRow);
          paint();
        });
        break;
      }
      case 'plate-solve': {
        var tf = document.getElementById('plate-target');
        var want = tf ? parseFloat(tf.value) : NaN;
        if (isNaN(want) || want <= 0) { S.plate.solveNote = 'Type the weight you want on the bar.'; break; }
        var wantKg = S.unit === 'kg' ? want : want / LB_PER_KG;
        var sol = solvePlates(wantKg, S.plate.bar);
        if (!sol) { S.plate.solveNote = 'That is less than the bar on its own.'; break; }
        S.plate.added = sol.plates;
        if (sol.exact) {
          S.plate.solveNote = 'Per side: ' + sol.plates.map(function (x) {
            return trim(toDisplay(x));
          }).join(' + ') + ' ' + unitLabel() + '.';
        } else {
          /* Named, not silently rounded. */
          S.plate.solveNote = 'The nearest this bar and these plates can make is ' +
            trim(toDisplay(sol.made)) + ' ' + unitLabel() + ', not ' + trim(toDisplay(wantKg)) + ' ' + unitLabel() +
            '. Per side: ' + (sol.plates.length
              ? sol.plates.map(function (x) { return trim(toDisplay(x)); }).join(' + ') + ' ' + unitLabel()
              : 'nothing, the bar alone') + '.';
        }
        break;
      }
      case 'block-add': {
        var ti = document.getElementById('block-title');
        var no = document.getElementById('block-notes');
        var title = ti ? ti.value.trim() : '';
        /* An untitled block called "Block" is a row that says nothing, in a
           list whose whole job is to say what is next. It silently accepted
           an empty title and named it for you. */
        if (!title) {
          S.blockError = 'Give the block a name, so the row says what it is.';
          paint();
          if (ti) ti.focus();
          return;
        }
        /* Blank is fine -- not every block is timed. A number that is not a
           number of minutes is not. */
        var mi = document.getElementById('block-mins');
        var raw = mi ? mi.value.trim() : '';
        var mins = raw === '' ? null : Number(raw);
        if (raw !== '' && (!isFinite(mins) || mins < 1 || mins > 180)) {
          S.blockError = 'A length between 1 and 180 minutes, or leave it blank.';
          paint();
          if (mi) mi.focus();
          return;
        }
        S.blocks.push({ title: title, notes: no ? no.value.trim() : '',
                        duration: mins === null ? '' : Math.round(mins) + ' min',
                        open: false });
        S.blockError = null;
        S.overlay = null;
        toast('Block added.');
        break;
      }
      /* Undoable, not confirmed. Every other destructive control in this
         build offers the thing back; this one deleted on the tap and left
         nothing to press. */
      case 'block-open': {
        var oi = Number(t.getAttribute('data-i'));
        if (S.blocks[oi]) S.blocks[oi].open = !S.blocks[oi].open;
        break;
      }
      case 'block-remove': {
        var bi = Number(t.getAttribute('data-i'));
        var goneB = S.blocks.splice(bi, 1)[0];
        if (goneB) {
          toast('\u201c' + goneB.title + '\u201d removed.', 'Undo', function () {
            S.blocks.splice(bi, 0, goneB);
            paint();
          });
        }
        break;
      }

      case 'toast-action': {
        var tf = S.toast && S.toast.fn;
        S.toast = null;
        if (tf) tf();
        break;
      }
      /* swapAt goes with the picker. Left set, the next plain "Add
         Exercise" would replace instead of adding. */
      case 'close': S.overlay = null; S.swapAt = null; S.addexQ = ''; break;
      default: break;
    }
    paint();
  });

  /* =============================================================
     Reordering. Three ways in, one function: Up/Down on the move bar,
     the arrow keys while a grip has focus, and dragging the grip.
     ============================================================= */
  function moveEx(from, to) {
    if (to < 0 || to >= S.exercises.length || from === to) return false;
    /* Pairing is by adjacency, so moving one half of a superset past
       something else would silently pair it with whatever landed beside it.
       Both flags that touch the moved card are dropped instead, and the
       toast says so rather than leaving a pair nobody made. */
    var broke = !!(S.exercises[from].superset ||
                   (S.exercises[from - 1] && S.exercises[from - 1].superset));
    S.exercises[from].superset = false;
    if (S.exercises[from - 1]) S.exercises[from - 1].superset = false;
    var it = S.exercises.splice(from, 1)[0];
    S.exercises.splice(to, 0, it);
    if (broke) toast('Superset undone: the two lifts are no longer next to each other.');
    return true;
  }

  var dragEndedAt = 0;

  /* ---- press and hold, on the exercise name ---------------------------
     450ms, the shipped app's own dwell. The card squeezes while the finger
     is down so the gesture is visible before it fires, the phone taps back
     the moment it does, and a finger that slides more than a few pixels is
     a scroll rather than a hold. Nothing inside the card can start one: the
     grip, the cells, the ticks and the foot buttons are all their own
     controls, and this only ever begins on .exc__main itself. */
  var HOLD_MS = 450;
  var holdTimer = null;
  var heldOpenAt = 0;
  function cancelHold(el) {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (el && el.classList) el.classList.remove('exc__main--holding');
    Array.prototype.forEach.call(document.querySelectorAll('.exc__main--holding'), function (nd) {
      nd.classList.remove('exc__main--holding');
    });
  }
  document.addEventListener('pointerdown', function (ev) {
    var main = ev.target.closest ? ev.target.closest('.exc__main[data-act="exsheet"]') : null;
    if (!main) return;
    /* A control inside the card that happens to sit over the name -- there
       are none today, and there must not be one tomorrow either. */
    if (ev.target.closest('[data-act]') !== main) return;
    var ie = Number(main.getAttribute('data-ex'));
    var x0 = ev.clientX, y0 = ev.clientY;
    main.classList.add('exc__main--holding');
    cancelHoldOnMove = function (e2) {
      if (Math.abs(e2.clientX - x0) > 8 || Math.abs(e2.clientY - y0) > 8) done();
    };
    function done() {
      cancelHold(main);
      document.removeEventListener('pointermove', cancelHoldOnMove);
      document.removeEventListener('pointerup', done);
      document.removeEventListener('pointercancel', done);
    }
    document.addEventListener('pointermove', cancelHoldOnMove);
    document.addEventListener('pointerup', done);
    document.addEventListener('pointercancel', done);
    holdTimer = setTimeout(function () {
      holdTimer = null;
      cancelHold(main);
      buzz(18);
      markHoldTipSeen();
      heldOpenAt = Date.now();
      lastOpener = 'exercise-menu-' + ie;
      S.overlayEx = ie;
      S.overlay = 'sheet';
      paint();
    }, HOLD_MS);
  });
  var cancelHoldOnMove = function () {};

  /* A keyboard has no hold. Enter and Space open it outright. */
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ' && ev.key !== 'Spacebar') return;
    var main = ev.target.closest ? ev.target.closest('.exc__main[data-act="exsheet"]') : null;
    if (!main) return;
    ev.preventDefault();
    heldOpenAt = Date.now();
    markHoldTipSeen();
    lastOpener = main.dataset.testid;
    S.overlayEx = Number(main.getAttribute('data-ex'));
    S.overlay = 'sheet';
    paint();
  });

  document.addEventListener('pointerdown', function (ev) {
    var grip = ev.target.closest ? ev.target.closest('[data-act="grip"]') : null;
    if (!grip) return;
    var index = Number(grip.getAttribute('data-ex'));
    var startY = ev.clientY;
    var moved = false;
    function rectsNow() {
      return [].slice.call(body.querySelectorAll('.exc')).map(function (nd) {
        return nd.getBoundingClientRect();
      });
    }
    var rects = rectsNow();
    try { grip.setPointerCapture(ev.pointerId); } catch (e2) {}

    function onMove(e2) {
      if (!moved && Math.abs(e2.clientY - startY) < 6) return;
      if (!moved) { moved = true; S.dragEx = index; S.liftedEx = -1; paint(); }
      var target = index;
      for (var k = 0; k < rects.length; k++) {
        var c = rects[k].top + rects[k].height / 2;
        if (k < index && e2.clientY < c) { target = k; break; }
        if (k > index && e2.clientY > c) { target = k; }
      }
      if (target !== index && moveEx(index, target)) {
        index = target;
        S.dragEx = index;
        paint();
        rects = rectsNow();
      }
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      if (!moved) return;
      dragEndedAt = Date.now();
      S.dragEx = -1;
      paint();
      say(S.exercises[index].name + ' moved to position ' + (index + 1) +
          ' of ' + S.exercises.length + '.');
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });

  /* lk_prs comes in two shapes and both are real. The seed is a flat array of
     {exId, kg, reps, date}; once Progress has written, it is a map of exercise
     id to a list of {r, w, date}. Reading one and ignoring the other is how a
     personal best goes missing, so this normalises both to one list and the
     writer puts back the map shape, carrying the seed's records into it. */
  function prMap() {
    if (!window.LKStore) return {};
    var raw = LKStore.get('lk_prs', null);
    if (!raw) return {};
    if (!Array.isArray(raw)) return raw;
    var map = {};
    raw.forEach(function (r) {
      var k = String(r.exId);
      (map[k] = map[k] || []).push({ r: r.reps, w: r.kg, date: r.date });
    });
    return map;
  }

  function bestFor(exId, reps) {
    if (!exId) return null;
    var map = prMap();
    var list = map[exId] || map[String(exId)] || [];
    var best = null;
    list.forEach(function (r) {
      if (reps !== undefined && r.r < reps) return;
      if (!best || r.w > best.w) best = r;
    });
    return best;
  }

  /* Beaten means more weight at the same reps or better, or the same weight
     for more reps. The same rule Progress uses to refuse a junk record. */
  /* In the unit the row is being read in. It printed "kg" whatever the
     screen said, so a lifter working in pounds was told they had just put
     165 kg over their head. */
  function prBeaten(ex, st) {
    if (!ex || !ex.id || st.warm) return null;
    if (st.kg === null || st.reps === null) return null;
    var u = unitOf(ex);
    var w = function (v) { return trim(toDisplay(v, u)) + ' ' + unitLabel(u); };
    var b = bestFor(ex.id, st.reps);
    if (!b) {
      var any = bestFor(ex.id);
      if (!any) return null;              /* nothing to beat: not a claim */
      if (st.kg > any.w) return w(st.kg) + ' for ' + st.reps + ', past ' + w(any.w) + ' for ' + any.r + '.';
      return null;
    }
    if (st.kg > b.w) return w(st.kg) + ' for ' + st.reps + ', past ' + w(b.w) + '.';
    if (st.kg === b.w && st.reps > b.r) return w(st.kg) + ' for ' + st.reps + ', past ' + b.r + ' reps.';
    return null;
  }

  /* Appended as a row, in the one shape lk_prs holds everywhere. This used
     to write back the lookup map prMap() builds, which carries no name,
     group or muscle -- so a bench record set here read on Progress as three
     records fewer than before it was set. */
  function recordPR(ex, st) {
    if (!window.LKStore || !ex.id) return;
    var raw = LKStore.get('lk_prs', null);
    var rows = [];
    if (Array.isArray(raw)) rows = raw.slice();
    else if (raw && typeof raw === 'object') {
      Object.keys(raw).forEach(function (k) {
        (raw[k] || []).forEach(function (r) {
          rows.push({ exId: Number(k), name: '', group: '', muscle: '',
                      kg: r.w, reps: r.r, date: r.date });
        });
      });
    }
    rows.unshift({ exId: ex.id, name: ex.name || '', group: ex.group || '',
                   muscle: ex.muscle || '', kg: st.kg, reps: st.reps,
                   date: window.LKStore ? LKStore.today() : new Date().toISOString().slice(0, 10) });
    LKStore.set('lk_prs', rows);
  }

  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown') return;
    var grip = ev.target.closest ? ev.target.closest('[data-act="grip"]') : null;
    if (!grip) return;
    ev.preventDefault();
    var from = Number(grip.getAttribute('data-ex'));
    var to = from + (ev.key === 'ArrowUp' ? -1 : 1);
    if (!moveEx(from, to)) return;
    S.liftedEx = to;
    paint();
    say(S.exercises[to].name + ' moved to position ' + (to + 1) + ' of ' + S.exercises.length + '.');
    refocus('grip-' + to);
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target.closest('[data-act="rir"]');
    if (!t) return;
    var e = Number(t.getAttribute('data-ex')), i = Number(t.getAttribute('data-set'));
    S.exercises[e].sets[i].rir = Number(t.value);
    say('Set ' + (i + 1) + ' RIR ' + t.value);
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target.closest('[data-act="note"]');
    if (t) {
      var exn = S.exercises[S.overlayEx];
      exn.note = t.value;
      /* Per exercise, not per session. The sheet asks "what to remember next
         time", and the note lived only in this workout's rows: next time was
         exactly when it was gone. lk_exNotes is keyed by exercise id, so the
         note comes back the next time that lift is opened, in any session. */
      if (window.LKStore && exn.id) {
        var notes = LKStore.get('lk_exNotes', {}) || {};
        if (t.value.trim()) notes[exn.id] = t.value.trim();
        else delete notes[exn.id];
        LKStore.set('lk_exNotes', notes);
      }
      return;
    }
    var q = ev.target.closest('[data-act="addex-q"]');
    if (q) { S.addexQ = q.value; S.addexN = ADDEX_PAGE; paint(); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (S.pad) { S.pad = null; paint(); }
      else if (S.overlay) { S.overlay = null; paint(); }
      return;
    }
    /* A modal that Tab walks out of is not modal. Fourteen presses inside
       the plate sheet landed in the dev menu behind it, which is the whole
       screen a dialog exists to keep you out of. Escape closed it; Tab did
       not respect it. */
    if (ev.key !== 'Tab') return;
    var host = document.getElementById('overlay');
    if (!host || (!S.overlay && !S.pad)) return;
    var f = host.querySelectorAll(
      'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), ' +
      'textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (!host.contains(document.activeElement)) { ev.preventDefault(); first.focus(); return; }
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  });

  /* What Review reviews. Review used to hold a fixed 16-set, 4,383 kg Push
     with a bench PR in it, and the log navigated to it without handing
     anything over -- so a session of seven sets, and a session of none at
     all, both produced the same review with the same invented record.
     Written on Finish, read once by Review. */
  function handOff() {
    var lifts = [], exercises = [];
    S.exercises.forEach(function (ex) {
      var vol = 0, top = null, sets = 0;
      /* THE ROWS, not only the totals. The hand-over carried five numbers
         per lift, so Review could say the volume moved and could not show
         one set, and the record it saved to history had no sets in it --
         a workout you could never open again and read. */
      var rows = [];
      ex.sets.forEach(function (st) {
        if (!st.done || st.kg == null || st.reps == null) return;
        rows.push({ kg: st.kg, reps: st.reps, rir: st.rir, warm: !!st.warm,
                    partials: st.partials || 0, done: true, pr: !!st.pr });
        if (st.warm) return;
        sets++; vol += st.kg * st.reps;
        if (!top || st.kg > top[0] || (st.kg === top[0] && st.reps > top[1])) top = [st.kg, st.reps];
      });
      if (!rows.length) return;
      if (sets) lifts.push({ id: ex.id, name: ex.name, sets: sets, vol: Math.round(vol), top: top });
      exercises.push({ id: ex.id, name: ex.name, muscle: ex.muscle || '', sets: rows });
    });
    var rec = {
      title: S.name,
      dateISO: window.LKStore ? LKStore.today() : null,
      sets: doneSets(),
      warmups: doneWarmups(),
      volumeKg: Math.round(volumeKg()),
      minutes: Math.max(0, Math.round(elapsedSec() / 60)),
      lifts: lifts,
      exercises: exercises
    };
    if (window.LKStore) LKStore.set('lk_lastSession', rec);
    else { try { localStorage.setItem('lk_lastSession', JSON.stringify(rec)); } catch (e) {} }
  }

  /* In the demo the router claims the Finish click in the capture phase --
     it has to, because the handler above leaves with location.href -- so the
     hand-over never ran and Review opened on a session nobody had done. The
     router announces the crossing first and this does the handing over. */
  document.addEventListener('lk:handoff', function (e) {
    var d = e.detail || {};
    if (d.selector !== '[data-testid="btn-finish"]') return;
    S.over = true;
    handOff();
  });

  /* Entered, rather than merely still on screen. In the demo the log stays
     mounted for the life of the page, so after Finish, Train's "Start today's
     session" dropped the reader back into the workout they had just saved --
     sets still ticked, clock still running past the finish. */
  document.addEventListener('lk:enter', function () {
    /* A day asked for from Train wins: it is a new session, not this one. */
    if (startRequested()) { paintMenu(); paint(); return; }
    if (!S.over) return;
    applyState('mid-session');
    paint();
  });

  /* The record can end from outside this screen -- the demo's router ends it
     on Finish, because it has to swallow the click that would otherwise
     navigate the whole demo away, and a stale shelf's Finish ends it from
     another screen entirely. Either way this screen is now looking at a
     workout that is over, and the next paint would helpfully start a brand
     new session from the exercises still on the page. */
  if (window.LKSession) {
    LKSession.onChange(function (r) { if (!r) S.over = true; });
  }

  /* Clocks. One interval, no per-row timers. */
  setInterval(function () {
    var dirty = false;
    /* Only the fallback counter ticks. With a record running, elapsed is
       derived from startedAt and incrementing here would double-count. */
    if (!(window.LKSession && LKSession.get())) S.elapsed++;
    if (S.restRunning && S.restLeft > 0) { S.restLeft--; dirty = true; if (S.restLeft === 0) { S.restRunning = false; say('Rest done'); } }
    var el = document.querySelector('[data-testid="session-timer"] .num');
    if (el) el.textContent = hhmm(elapsedSec());
    var rl = document.querySelector('[data-testid="rest-remaining"] .num');
    if (rl) rl.textContent = clock(S.restLeft);
    if (dirty && !S.restRunning) paint();
  }, 1000);

  /* =============================================================
     Dev states
     ============================================================= */
  var STATES = [
    ['mid-session', 'Mid-session'],
    ['first-set', 'First set'],
    ['keypad', 'Keypad open'],
    ['rest', 'Rest running'],
    ['exercise-done', 'Exercise done'],
    ['plates', 'Plate calculator'],
    ['empty', 'Empty'],
    ['loading', 'Loading'],
    ['error', 'Error']
  ];
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  function paintMenu() {
    LKPatch(menu, STATES.map(function (s) {
      return '<button class="dev__item" type="button" data-state="' + s[0] + '" data-testid="dev-' + s[0] + '" aria-pressed="' + (S.state === s[0] ? 'true' : 'false') + '">' + s[1] + '</button>';
    }).join(''));
  }
  toggle.addEventListener('click', function () {
    var open = menu.hasAttribute('hidden');
    if (open) menu.removeAttribute('hidden'); else menu.setAttribute('hidden', '');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  menu.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-state]');
    if (!b) return;
    applyState(b.getAttribute('data-state'));
    paintMenu();
    paint();
  });

  loadLibrary();

  /* A workout already running gets its own rows back, not the fixture's.
     This is the whole point of writing them down. */
  /* A day asked for from Train replaces the seeded session outright, and it
     is not something to "pick up where you left off" from. */
  var asked = startRequested();
  var restored = asked ? false : restoreRows();

  paintMenu();
  paint();
  /* The idle clock starts with the session. */
  touchIdle();
  if (restored) say('Picked up where you left off.');
  window.__LK = { state: S, apply: function (s) { applyState(s); paintMenu(); paint(); } };
})();
</script>
</body>
</html>
