<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOCKED — Workout Log</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="fixtures.js"></script>
<script src="store.js"></script>
<script src="units.js"></script>
<script src="app.js"></script>
<script src="chrome.js"></script>
<script src="session.js"></script>
</head>
<body>
<!--
  WORKOUT LOG — a RESTORATION with four measured fixes.

  The owner uses this screen and asked for restraint: "good enough for
  me, improve it but don't prioritise it." An earlier pass rebuilt it
  into a different screen — one exercise at a time, a docked pad, no
  Partials, no AI Rec, no Add Set, no card list. That is reverted.

  WHAT IS BACK, EXACTLY AS SHIPPED
    - one dark card per exercise, drag handle, name, muscle
    - a dense grid inside it: #, WEIGHT, REPS, RIR, done
    - EVERY set is directly editable, not just the current one
    - a Partials control on every set
    - Add Set and AI Rec at the foot of each card
    - Add Exercise and Block below the list
    - header: session name, running timer, set count, volume, the
      quick-action bolt, Discard, Finish
    - the summoned numeric pad, the tools popover, the plate
      calculator, rest settings, the long-press action sheet, the
      exercise detail sheet, the block modal, the two-tap discard

  THE FOUR FIXES, AND NOTHING ELSE

  1. THE PAD REPLACES ON THE FIRST DIGIT.
     Logging a set measured 15 taps against a best known 3. Five of
     them were DEL, because the pad opened pre-filled and appended, so
     deleting was the only way to edit; the crawl's own log recorded
     "6072.5", a 60 typed onto an uncleared 72.5. The pad still opens
     showing the pending value — that is useful, it is what you lifted
     last time — but it shows it in --text-tertiary as not-yet-yours,
     and the first digit replaces it whole. After the first digit,
     digits append as before. DEL, the +-2.5/+-5 chips, CANCEL and
     DONE are unchanged. Cost: 9 taps for a fresh weight, reps and
     done; 1 tap when last session's numbers stand.

  2. EVERY HIT AREA IS AT LEAST 44x44, AT THE SHIPPED DENSITY.
     22 of 31 controls were under 44x44; the worst were the fields
     themselves at 109x33 and the done control at 32x30. The cells are
     now 44 tall and the done control 44x44. The set still occupies
     about 96px of card — the same as shipped — because the padding
     row and the value row were already that tall together. Nothing
     was dropped to buy the pixels.

  3. ONE UNIT. THE PROFILE'S.
     The shipped screen showed an "LB" column head (rows with no
     stored kg fell through to "lb"), a "1088 kg" total and a "Switch
     to LBS" control at the same time: three controls, two units. Every
     weight here is stored in kg and displayed in the profile unit,
     including the column head, the totals, the pad and the plate
     calculator. The unit switch is kept — it is a feature — but there
     is one setting behind it, so all three controls always agree.

  4. WARM-UPS COUNT.
     The header filtered setType!=="warmup" and read "0 sets" after a
     completed warm-up. It counts every completed set now, and a
     warm-up set is marked W in the number column so the two are still
     distinguishable.

  HIERARCHY. The orange stays; it is the app's accent and it belongs
  here. What changed is which control wears the solid fill: the done
  control, performed every 90 seconds, and the pad's DONE key. Finish
  is the same size and in the same corner but outlined rather than
  filled, so the loudest thing on the screen is logging a set rather
  than ending the workout.

  NOT RESTORED: the voice FAB. It is shell chrome rather than this
  screen, it is an emoji over a coloured glow, and both audits cut it.

  DATA: fixtures/seed-data.json — profile in kg, PPL Push day
  (exIds 111, 302, 103, 311, 411), exercise note from lk_exNotes.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-workout-log" data-state="mid-session">

      <header class="hdr" data-scroll-edge="#body" id="hdr"></header>
      <div id="rest-slot"></div>
      <main class="body" id="body" data-testid="log-scroll" tabindex="-1"></main>
      <nav class="tabbar" id="tabs" aria-label="Sections" data-minimize="#body"></nav>

      <div id="overlay" data-testid="overlay"></div>
      <div id="toast-slot" data-testid="toast-slot"></div>
      <p class="vis-hidden" role="status" aria-live="polite" id="live"></p>

    </div>
  </div>
</div>

<div class="dev">
  <button class="dev__toggle" type="button" id="dev-toggle" aria-expanded="false" aria-controls="dev-menu" data-testid="dev-toggle">State</button>
  <div class="dev__menu" id="dev-menu" hidden data-testid="dev-menu"></div>
</div>

<script>
(function () {
  "use strict";

  /* =============================================================
     Icons. One set, 24px box, one stroke weight. No emoji.
     ============================================================= */
  function svg(d, extra) {
    return '<svg class="ico' + (extra || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + d + '</svg>';
  }
  var ICO = {
    check: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
    grip: svg('<path d="M4 9h16M4 15h16"/>'),
    bolt: svg('<path d="M13 3 5 14h6l-1 7 8-11h-6z"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    spark: svg('<path d="M12 4v4M12 16v4M4 12h4M16 12h4M7 7l2 2M17 17l-2-2M17 7l-2 2M7 17l2-2"/>'),
    timer: svg('<circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5M9.5 3h5"/>'),
    plate: svg('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/>'),
    scale: svg('<path d="M12 4v16M6 8h12M8 8l-3 6h6zM16 8l-3 6h6z"/>'),
    note: svg('<path d="M6 4h9l3 3v13H6z"/><path d="M9 12h6M9 16h4"/>'),
    swap: svg('<path d="M4 8h13l-3-3M20 16H7l3 3"/>'),
    drop: svg('<path d="M12 3.5 7 11a5 5 0 1 0 10 0z"/>'),
    link: svg('<path d="M10 14a4 4 0 0 0 6 .5l2-2a4 4 0 0 0-5.5-5.5l-1 1"/><path d="M14 10a4 4 0 0 0-6-.5l-2 2A4 4 0 0 0 11.5 17l1-1"/>'),
    sides: svg('<path d="M9 6 5 12l4 6M15 6l4 6-4 6M12 4v16"/>'),
    trash: svg('<path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/>'),
    close: svg('<path d="m6 6 12 12M18 6 6 18"/>'),
    home: svg('<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>'),
    lift: svg('<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>'),
    fuel: svg('<path d="M12 21c4 0 6-2.7 6-6 0-4-3-6-3-10-3 1.5-4 3.5-4 6-1 0-2-1-2-2.5C7.5 10 6 12 6 15c0 3.3 2 6 6 6z"/>'),
    coach: svg('<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M12 13v4M9 21h6"/>'),
    person: svg('<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>'),
    search: svg('<circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/>')
  };

  /* =============================================================
     Formatting. Every number tabular. Every weight stored in kg and
     printed in the profile unit, in one place, so three controls can
     never imply two units again.
     ============================================================= */
  var LB_PER_KG = 2.2046226218;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function n(v) { return '<span class="num">' + v + '</span>'; }
  function round(v, step) { return Math.round(v / step) * step; }
  function trim(v) { return String(Math.round(v * 100) / 100); }

  /* ONE LIFT CAN READ IN THE OTHER UNIT. Both unit controls used to call
     setUnit(), which flips the whole app, so a rack of dumbbells stamped in
     pounds inside a kilogram session could only be logged by converting it in
     your head or by flipping every other screen with it. The tools menu still
     owns the app-wide setting; the exercise sheet now sets an override for
     that lift alone. The MODEL IS STILL KILOGRAMS everywhere -- the override
     changes the reading of a row and never what is stored -- and it is kept
     in lk_exEquip beside the bar weight, because it is the same kind of fact
     about the lift and it has to be true the next time it comes round. */
  function unitOf(ex) { return (ex && ex.unit === 'lb') || (ex && ex.unit === 'kg') ? ex.unit : S.unit; }
  function unitAt(e) { return unitOf(S.exercises[e]); }
  function toDisplay(kgValue, u) {       /* stored kg -> the unit being read */
    if (kgValue === null || kgValue === undefined || kgValue === '') return null;
    return (u || S.unit) === 'kg' ? Number(kgValue) : Math.round(Number(kgValue) * LB_PER_KG * 10) / 10;
  }
  function toKg(displayValue, u) {       /* the unit being read -> stored kg */
    if (displayValue === null || displayValue === '' || isNaN(displayValue)) return null;
    return (u || S.unit) === 'kg' ? Number(displayValue) : Math.round((Number(displayValue) / LB_PER_KG) * 100) / 100;
  }
  function unitLabel(u) { return (u || S.unit) === 'kg' ? 'kg' : 'lb'; }
  /* "everywhere" means everywhere. */
  function setUnit(u) {
    S.unit = u;
    if (window.LKUnits) LKUnits.set(u === 'kg');
  }
  function unitWord(u) { return (u || S.unit) === 'kg' ? 'kilograms' : 'pounds'; }
  /* THE PHONE'S OWN CONFIRMATION. A set logged is a thing done with the eyes
     on the bar, not on the screen, and navigator.vibrate appeared nowhere in
     the build. Guarded: desktop Safari has no vibrate and iOS ignores it, so
     the tick still pops and still announces itself. */
  function buzz(pattern) {
    try { if (navigator && typeof navigator.vibrate === 'function') navigator.vibrate(pattern); } catch (e) {}
  }

  function clock(s) {
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function hhmm(s) {
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }

  /* =============================================================
     Session data. Weights are kg in the model, always.
     ============================================================= */
  function set(kgValue, reps, opts) {
    opts = opts || {};
    return {
      kg: kgValue === undefined ? null : kgValue,
      reps: reps === undefined ? null : reps,
      rir: opts.rir === undefined ? 2 : opts.rir,
      done: !!opts.done,
      warm: !!opts.warm,
      partials: opts.partials || 0,
      /* WHAT YOU LIFTED LAST TIME IS NOT WHAT YOU ARE LIFTING NOW. These
         defaulted to the set's own figures, so a set seeded with today's
         work carried today's numbers as its "previous" ones -- and because
         exFromHistory only fills a previous figure that is still empty, the
         real ones from the last session never landed. The exercise info
         sheet's "Last session" line then read today's session back to the
         lifter: it showed 40 x 10 and 72.5 x 8 where Sep 3's bench was
         37.5 x 8 warm-up, then 72.5 x 8, 72.5 x 6, 72.5 x 5. A set with no
         history behind it has none, and says so with a dash. */
      prevKg: opts.prevKg === undefined ? null : opts.prevKg,
      prevReps: opts.prevReps === undefined ? null : opts.prevReps
    };
  }

  /* WHAT YOU LIFTED LAST TIME, from the shared history rather than typed
     here. Two of these were wrong against the fixture -- a 40 kg bench
     warm-up where the last Push logged 37.5, and a 24 kg shoulder press
     where it logged 25, a figure that appears in no session and is not even
     a multiple of the 2.5 kg step Settings says weights round to. The rows
     a person decides today's load from have to be the rows they actually
     lifted. */
  function lastSetsFor(exId) {
    var FX = window.LKFixtures;
    if (!FX || !FX.lastTime) return null;
    var last = FX.lastTime(exId, window.LKStore ? LKStore.today() : new Date().toISOString().slice(0, 10));
    if (!last) return null;
    return last.exercise.sets.filter(function (st) { return st.done; });
  }

  /* One exercise, with `todaysSets` of its own and the rest filled from the
     last session. Anything beyond what was done last time gets no previous
     figure rather than a repeated one. */
  function exFromHistory(id, name, muscle, note, todaysSets, planned) {
    var prev = lastSetsFor(id) || [];
    var work = prev.filter(function (st) { return !st.warm; });
    var warm = prev.filter(function (st) { return st.warm; });
    var sets = (todaysSets || []).slice();
    var wi = 0;
    sets.forEach(function (st) {
      /* `== null` rather than `=== undefined`: an empty previous figure is
          written as null now, and the strict test let today's warm-up keep
          today's own numbers as last session's. */
      if (st.warm) { if (warm[0] && st.prevKg == null) { st.prevKg = warm[0].kg; st.prevReps = warm[0].reps; } return; }
      var p = work[wi++];
      if (p && st.prevKg == null) { st.prevKg = p.kg; st.prevReps = p.reps; }
    });
    while (sets.length < (planned || 0)) {
      var p2 = work[wi++];
      sets.push(set(null, null, p2 ? { prevKg: p2.kg, prevReps: p2.reps } : {}));
    }
    /* A note stored against this exercise wins over whatever was typed into
       the seed, because it is the thing the reader actually wrote and it was
       written to be read next time. */
    var kept = '';
    if (window.LKStore) {
      var all = LKStore.get('lk_exNotes', {}) || {};
      if (all[id]) kept = all[id];
    }
    var eq = equipFor(id) || {};
    return { id: id, name: name, muscle: muscle, note: kept || note || '', sets: sets,
             unit: eq.unit === 'lb' || eq.unit === 'kg' ? eq.unit : null };
  }

  /* The seeded mid-session, for the dev states and for a demo. A build with
     no seed has no such session: a workout nobody logged is exactly the
     stranger's training this screen must never show. Without a seed the log
     opens empty, which is what starting a workout from nothing looks like. */
  function pushDay() {
    if (!window.LKFixtures) return [];
    /* The warm-up and the two working sets already logged are today's, and
       they stay as they are; everything else is last session's figures. */
    return [
      exFromHistory(111, 'Barbell Bench Press', 'Mid Chest', 'Pinkies on rings, feet back', [
        set(40, 10, { warm: true, done: true, rir: 4 }),
        set(72.5, 8, { done: true }),
        set(72.5, 7, { done: true })
      ], 4),
      exFromHistory(302, 'DB Shoulder Press', 'Front Delt', '', [], 3),
      exFromHistory(103, 'Incline Cable Fly', 'Upper Chest', '', [], 3),
      exFromHistory(311, 'Lateral Raise', 'Side Delt', '', [], 3),
      exFromHistory(411, 'Tricep Pushdown', 'Lateral Head', '', [], 3)
    ];
  }

  /* THE DAY TRAIN ASKED FOR. Every route into this screen opened the same
     seeded PPL - Push, twenty-one minutes in with 1,088 kg on it, so
     "Start Upper A" began somebody else's Push session. lk_startDay carries
     "<splitId>:<dayId>"; the day it names is built here, empty, at zero. */
  function splitDayFor(key) {
    if (!key) return null;
    var cut = String(key).indexOf(':');
    if (cut < 0) return null;
    var wantSplit = String(key).slice(0, cut), wantDay = String(key).slice(cut + 1);
    var all = (window.LKStore ? window.LKStore.get('lk_splits', null) : null) ||
              (window.LKFixtures && LKFixtures.splits) || [];
    for (var i = 0; i < all.length; i++) {
      if (String(all[i].id) !== wantSplit) continue;
      var days = all[i].days || [];
      for (var j = 0; j < days.length; j++) {
        var slug = String(days[j].name || ('day' + j)).toLowerCase().replace(/\W+/g, '-');
        if (slug !== wantDay) continue;
        return { split: all[i].name, day: days[j].name, exercises: days[j].exercises || [] };
      }
    }
    return null;
  }
  /* "Do this session again", handed over by workout-detail. The key was
     written and nothing ever read it, so Repeat opened today's split day
     instead of the session being read. */
  function repeatRequested() {
    if (!window.LKStore) return false;
    var rec = LKStore.get('lk_repeatWorkout', null);
    if (!rec || !rec.exercises || !rec.exercises.length) return false;
    LKStore.remove('lk_repeatWorkout');
    applyState('mid-session');
    S.name = rec.name || 'Workout';
    S.elapsed = 0;
    S.over = false;
    S.exercises = rec.exercises.map(function (e) {
      return exFromHistory(e.id, e.name, e.muscle || '', '', [], e.sets || 3);
    });
    return true;
  }

  /* A new session starts at zero. The live-session record carries the clock
     once it exists, so starting a day while one is running left the header
     reading twenty-one minutes into a workout with no sets in it. */
  function beginFresh() {
    if (window.LKSession && LKSession.end) LKSession.end();
    S.elapsed = 0;
    touchIdle();
  }

  function startRequested() {
    if (repeatRequested()) { beginFresh(); return true; }
    var key = null;
    try { key = localStorage.getItem('lk_startDay'); } catch (e) {}
    if (!key) return false;
    try { localStorage.removeItem('lk_startDay'); } catch (e) {}
    var d = splitDayFor(key);
    if (!d) return false;
    applyState('mid-session');
    beginFresh();
    S.name = d.split + ' - ' + d.day;
    S.elapsed = 0;
    S.over = false;
    /* Nothing is logged yet. Each lift carries its planned rows, empty, with
       last session's figures beside them the way every other card does. */
    S.exercises = d.exercises.map(function (e) {
      return exFromHistory(e.id, e.name, e.muscle || '', '', [], 3);
    });
    return true;
  }

  /* =============================================================
     State
     ============================================================= */
  /* WHAT THIS LIFT IS LOADED WITH, remembered per exercise. The bar on the
     rack, the base weight of a plate-loaded machine, the fact that one
     particular Smith is not counterbalanced: all of it was re-decided every
     session, so the same lift carried a different total depending on what
     somebody happened to remember that day.

     lk_exEquip is keyed by exercise id and holds what the library's create
     sheet already asks for, so a custom exercise made there arrives here
     knowing its own bar. */
  function equipFor(id) {
    if (!window.LKStore || !id) return null;
    var all = LKStore.get('lk_exEquip', {}) || {};
    var own = all[id] || all[String(id)];
    if (own) return own;
    /* Falling back to the library's own record of it, so the answer given
       once when the exercise was created is not asked for again here. */
    var customs = LKStore.get('lk_customEx', []) || [];
    for (var i = 0; i < customs.length; i++) {
      if (String(customs[i].id) === String(id)) {
        return { eq: customs[i].eq || null, base: customs[i].startResist || 0,
                 noCB: !!customs[i].smithNoCB };
      }
    }
    return null;
  }
  function setEquip(id, patch) {
    if (!window.LKStore || !id) return;
    var all = LKStore.get('lk_exEquip', {}) || {};
    var cur = all[id] || all[String(id)] || {};
    Object.keys(patch).forEach(function (k) { cur[k] = patch[k]; });
    all[id] = cur;
    LKStore.set('lk_exEquip', all);
  }
  /* The weight before any plates, which is added to what a set says. A set
     logged as 60 on a 20 kg bar was 60; the badge says which. */
  function baseOf(ex) {
    var e = equipFor(ex && ex.id);
    return e && e.base ? Number(e.base) || 0 : 0;
  }

  /* The session's own value wins where there is one -- turning auto-rest off
     mid-workout should not come back on because Settings says so -- and
     Settings is the default for a session that has not said otherwise. */
  function readFlag(key, fallback) {
    if (!window.LKStore) return fallback;
    var v = window.LKStore.get(key, null);
    if (v === null || v === undefined) return fallback;
    return v === true || v === 'true';
  }

  /* A seeded mid-session, or a new workout. The literals below describe the
     demo's half-finished Push; with no seed there is no such session, and
     opening the log means starting one. */
  var SEEDED = !!window.LKFixtures;

  var S = {
    state: SEEDED ? 'mid-session' : 'empty',
    name: SEEDED ? 'PPL - Push' : 'Quick Workout',
    /* lk_profile.useKg, through LKUnits. This screen's switch was its own:
       it converted this screen correctly and toasted "Showing lb everywhere"
       while every other screen stayed in kg, and it opened in kg whatever the
       profile said. There is one setting now, and this switch writes it. */
    unit: (window.LKUnits && !LKUnits.useKg()) ? 'lb' : 'kg',
    elapsed: SEEDED ? 1261 : 0,   /* 21:01 into the demo's session, or a new one */
    exercises: pushDay(),
    blocks: [],
    /* Which exercise the picker is replacing, or null when it is adding. */
    swapAt: null,
    /* Settings' defaults, read rather than hardcoded. Settings has a "Rest
       timer" switch and a "Count partial reps" switch, writes lk_restEnabled
       and lk_hidePartials, and says of the second "Half reps count towards
       the set" -- and this screen ignored both, so with partials switched
       off four partials controls still rendered on every exercise. A switch
       that changes nothing is worse than no switch. */
    hidePartials: readFlag('lk_hidePartials', false),
    restEnabled: readFlag('lk_restEnabled', true),
    restSeconds: 90,
    restLeft: 0,
    restRunning: false,
    pad: null,               /* { ex, set, field, buffer, replaced } */
    overlay: null,           /* tools | plates | rest | sheet | detail | block | addex | discard */
    overlayEx: 0,
    plate: { total: 20, bar: 20, added: [], perSide: true },
    aiBusyEx: -1,
    liftedEx: -1,
    dragEx: -1,               /* the card under a finger, mid-drag */
    toast: null,
    tapCount: 0
  };

  var STEPS = { kg: [-5, -2.5, 2.5, 5], lb: [-10, -5, 5, 10] };
  var PLATES = { kg: [1.25, 2.5, 5, 10, 15, 20, 25], lb: [2.5, 5, 10, 25, 35, 45] };
  /* BARS COME IN REAL SIZES, not in converted ones. The three kg bars were
     converted for display, so a reader in pounds was offered 44.1, 33.1 and
     22 lb and a 45 lb bar with two 45s -- the commonest loading there is --
     could not be made. Each unit gets the bars that exist in it. */
  var BARS = {
    kg: [[20, 'Olympic 20 kg'], [15, "Women's 15 kg"], [10, 'EZ bar 10 kg'], [0, 'No bar']],
    lb: [[20.4117, 'Olympic 45 lb'], [15.8757, "Women's 35 lb"], [9.0718, 'EZ bar 20 lb'], [0, 'No bar']]
  };
  function barOptions() { return S.unit === 'kg' ? BARS.kg : BARS.lb; }

  /* Applies a named demo state on top of a fresh session. */
  function applyState(name) {
    S.state = name;
    S.exercises = pushDay();
    S.blocks = [];
    S.pad = null; S.overlay = null; S.toast = null; S.swapAt = null;
    S.restRunning = false; S.restLeft = 0; S.aiBusyEx = -1; S.liftedEx = -1; S.dragEx = -1;
    S.tapCount = 0;
    S.over = false;
    S.elapsed = 1261;
    if (name === 'first-set') {
      S.name = 'Quick Workout';
      S.elapsed = 47;
      S.exercises = [ { id: 111, name: 'Barbell Bench Press', muscle: 'Mid Chest', note: '', sets: [ set(null, null, { prevKg: null, prevReps: null }) ] } ];
    } else if (name === 'empty') {
      S.name = 'Quick Workout';
      S.elapsed = 31;
      S.exercises = [];
    } else if (name === 'keypad') {
      S.pad = openPadFor(0, 3, 'weight');
    } else if (name === 'rest') {
      S.restRunning = true; S.restLeft = 62;
    } else if (name === 'exercise-done') {
      S.exercises[0].sets[3].kg = 72.5;
      S.exercises[0].sets[3].reps = 7;
      S.exercises[0].sets[3].done = true;
      S.restRunning = true; S.restLeft = 84;
    } else if (name === 'plates') {
      S.overlay = 'plates';
      S.plate = { total: 20, bar: 20, added: [], perSide: true, solveNote: null };
    } else if (name === 'loading') {
      S.aiBusyEx = 0;
    } else if (name === 'error') {
      /* Through toast(), so it expires. Set directly it bypassed the timer
         and stayed up for the life of the screen. */
      toast('Could not get a recommendation. Check your connection and retry.', 'error', 'Retry');
    }
    if (name !== 'first-set' && name !== 'empty') S.name = 'PPL - Push';
    /* Nothing seeded means nothing to be in the middle of. */
    if (!SEEDED && !S.exercises.length) {
      S.name = 'Quick Workout';
      S.elapsed = 0;
      S.state = 'empty';
    }
  }

  /* =============================================================
     Derived numbers. WORKING sets, which means warm-ups are counted
     separately and their load is not in the volume.

     They used to count. That put the header 1 set and 400 kg ahead of the
     same session on Review, Train, Home and Recap -- every one of which
     excludes warm-ups, and Review says so on its face ("16 working sets",
     "Warm-ups excluded"). So the total a person watched climb during the
     workout dropped the moment they finished it, and a reader counting the
     numbered rows got 6 where the header said 7.
     ============================================================= */
  /* A SIDE IS NOT A NEW SET. An exercise tracked left and right carries two
     rows per set, and both rows are real work -- their load is in the volume
     -- but three sets each side is three sets, not six. The right-hand row
     is therefore counted with its set rather than as another one, here and
     everywhere else that counts: the card's own numbering, Review's set
     list, and the record that reaches history. */
  function counts(st) { return !st.warm && st.side !== 'R'; }
  function doneSets() {
    var c = 0;
    S.exercises.forEach(function (ex) { ex.sets.forEach(function (st) { if (st.done && counts(st)) c++; }); });
    return c;
  }
  function doneWarmups() {
    var c = 0;
    S.exercises.forEach(function (ex) { ex.sets.forEach(function (st) { if (st.done && st.warm) c++; }); });
    return c;
  }
  /* Total sets in the session. The shelf on every other screen counts sets
     against this, because sets are what this screen's own header counts and
     two places describing one workout should not use two different units.
     Completed exercises were the first try and read "0 of 5" twenty-one
     minutes into real work, which is the opposite of what a progress
     figure is for. */
  function totalSets() {
    var c = 0;
    S.exercises.forEach(function (ex) { ex.sets.forEach(function (st) { if (counts(st)) c++; }); });
    return c;
  }

  function volumeKg() {
    var v = 0;
    S.exercises.forEach(function (ex) {
      ex.sets.forEach(function (st) { if (st.done && !st.warm && st.kg && st.reps) v += st.kg * st.reps; });
    });
    return v;
  }
  /* The volume as the rows on screen add up, in whatever unit they show. */
  function displayVolume() {
    var v = 0;
    S.exercises.forEach(function (ex) {
      ex.sets.forEach(function (st) {
        if (!st.done || st.warm || !st.kg || !st.reps) return;
        v += Math.round(toDisplay(st.kg) * 10) / 10 * st.reps;
      });
    });
    return v;
  }
  function nextUndone() {
    for (var e = 0; e < S.exercises.length; e++) {
      for (var i = 0; i < S.exercises[e].sets.length; i++) {
        if (!S.exercises[e].sets[i].done) return { ex: e, set: i };
      }
    }
    return null;
  }
  function isLive(e, i) {
    var nx = nextUndone();
    return !!nx && nx.ex === e && nx.set === i;
  }

  /* =============================================================
     Header
     ============================================================= */
  function headerHTML() {
    var sets = doneSets();
    var warm = doneWarmups();
    /* Summed the way the rows are shown, so the header equals the rows it is
       made of. Converting one kg total once gave 4,602 lb over rows adding to
       4,601: each row is rounded to 0.1 lb before it is read. */
    var vol = Math.round(displayVolume());
    return '' +
      '<div class="sess">' +
        /* The metrics are a SIBLING of the title column, not a child of it.
           Nested, they inherited that column's width -- about half the header
           once the bolt, Discard and Finish had taken theirs -- and "1,488 kg"
           overflowed sideways underneath the bolt button. The .sess__meta rule
           has said `flex: 1 0 100%; order: 3` all along; it just had no flex
           container to say it to. */
        '<div class="sess__main">' +
          '<h1 class="t-title" data-testid="session-name">' + esc(S.name) + '</h1>' +
        '</div>' +
        '<button class="qa" type="button" data-act="tools" data-testid="quick-action" aria-haspopup="dialog" aria-label="Workout tools">' + ICO.bolt + '</button>' +
        '<button class="btn btn--sm btn--danger" type="button" data-act="discard" data-testid="btn-discard">Discard</button>' +
        /* Secondary while the log is empty. An empty session has nothing to
           finish, and a filled Finish next to a filled "Add the first
           exercise" put two accent fills on one surface with the wrong one
           of them shouting. The empty state's own button is the primary
           until there is something to finish. */
        '<button class="btn btn--sm ' + (S.exercises.length ? 'btn--primary' : 'btn--secondary') +
          '" type="button" data-act="finish" data-testid="btn-finish">Finish</button>' +
        '<div class="sess__meta">' +
          '<span class="t-detail sess__time" data-testid="session-timer">' + n(hhmm(elapsedSec())) + '</span>' +
          '<span class="t-detail muted" data-testid="session-sets">' + n(sets) + ' working ' +
            (sets === 1 ? 'set' : 'sets') + (warm ? ' &middot; ' + n(warm) + ' W' : '') + '</span>' +
          '<span class="t-detail muted" data-testid="session-volume">' + n(vol.toLocaleString('en-US')) + ' ' + unitLabel() + '</span>' +
        '</div>' +
      '</div>';
  }

  function restHTML() {
    if (!S.restRunning) return '';
    return '<div class="rest" data-testid="rest-strip" role="status">' +
      '<div class="rest__main">' +
        '<div class="rest__label">Rest</div>' +
        '<div class="rest__time" data-testid="rest-remaining">' + n(clock(S.restLeft)) + '</div>' +
      '</div>' +
      '<button class="btn btn--sm btn--secondary" type="button" data-act="rest-add" data-testid="btn-rest-add">+30s</button>' +
      '<button class="btn btn--sm btn--tertiary" type="button" data-act="rest-skip" data-testid="btn-rest-skip">Skip</button>' +
    '</div>';
  }

  /* =============================================================
     The exercise card. The screen's whole idea: several sets
     visible and editable at once.
     ============================================================= */
  function cellHTML(e, i, field) {
    var st = S.exercises[e].sets[i];
    var editing = S.pad && S.pad.ex === e && S.pad.set === i && S.pad.field === field;
    var own = field === 'weight' ? st.kg : st.reps;
    var prev = field === 'weight' ? st.prevKg : st.prevReps;
    /* Weight carries over from last session and is shown, as shipped —
       but in the ghost tone, because it is not yet the lifter's entry.
       Reps start blank, also as shipped. */
    var u = unitAt(e);
    var raw = own !== null ? own : (field === 'weight' ? prev : null);
    var shown = field === 'weight' ? toDisplay(raw, u) : raw;
    var blank = shown === null || shown === undefined;
    var ghost = blank || own === null;
    var text = blank ? '--' : (field === 'weight' ? trim(shown) : String(shown));
    /* Partials belong ON the reps, because that is what they are: eight and
       three halves is one set. They were a separate cell in a separate row
       and the reps column read 8, so the figure a reader checks the session
       against left them out. */
    var partial = (field === 'reps' && !blank && st.partials) ? st.partials : 0;
    var label = 'Set ' + (i + 1) + ' ' + field + (blank ? ', empty'
      : (ghost ? ', last session ' : ', ') + text + (field === 'weight' ? ' ' + unitWord(u) : ' reps')) +
      (partial ? ' plus ' + partial + (partial === 1 ? ' partial' : ' partials') : '');
    return '<button class="cell' + (ghost ? ' cell--empty' : '') + (editing ? ' cell--editing' : '') + '" type="button" ' +
      'data-act="edit" data-ex="' + e + '" data-set="' + i + '" data-field="' + field + '" ' +
      'data-testid="cell-' + e + '-' + i + '-' + field + '" aria-label="' + esc(label) + '">' +
      n(esc(text)) +
      (partial ? '<span class="cell__plus" aria-hidden="true" data-testid="cell-partials-' + e + '-' + i + '">+' +
        partial + '</span>' : '') +
      '</button>';
  }

  function rirHTML(e, i) {
    var st = S.exercises[e].sets[i];
    var opts = '';
    for (var v = 0; v <= 5; v++) {
      opts += '<option value="' + v + '"' + (st.rir === v ? ' selected' : '') + '>' + v + '</option>';
    }
    return '<select class="cell cell--rir" data-act="rir" data-ex="' + e + '" data-set="' + i + '" ' +
      'data-testid="rir-' + e + '-' + i + '" aria-label="Set ' + (i + 1) + ' reps in reserve">' + opts + '</select>';
  }

  function doneHTML(e, i, half) {
    var st = S.exercises[e].sets[i];
    var live = isLive(e, i);
    var label = st.done ? 'Undo set ' + (i + 1) : 'Mark set ' + (i + 1) + ' done';
    /* Logged, but the other half of the round is not. The set IS done, so
       aria-checked stays true; the name says what is still outstanding. */
    if (half) label = 'Undo set ' + (i + 1) + ', waiting on ' + S.exercises[e + 1].name;
    return '<button class="done' + (live && !st.done ? ' done--ready' : '') + (half ? ' done--half' : '') +
      '" type="button" role="checkbox" aria-checked="' + (st.done ? 'true' : 'false') + '" ' +
      'data-act="done" data-ex="' + e + '" data-set="' + i + '" ' +
      'data-testid="done-' + e + '-' + i + '" aria-label="' + esc(label) + '">' + ICO.check + '</button>';
  }

  function partialsHTML(e, i) {
    var st = S.exercises[e].sets[i];
    return '<div class="partials">' +
      '<span class="partials__label" id="plabel-' + e + '-' + i + '">Partials</span>' +
      '<button class="partials__btn" type="button" data-act="partial" data-ex="' + e + '" data-set="' + i + '" ' +
        'data-testid="partials-' + e + '-' + i + '" aria-label="Add a partial rep to set ' + (i + 1) + (st.partials ? ', ' + st.partials + ' logged' : '') + '">' +
        (st.partials ? n(st.partials) : '+') + '</button>' +
    '</div>';
  }

  /* W for a warm-up, the set's position for a working set, and the position
     with the side on it -- 1L, 1R -- for an exercise tracked left and
     right. */
  /* W warm-up, D drop set, F to failure, or the set's position. A drop and a
     failure set are still work, so they keep their number in the count and
     carry a letter instead of replacing it -- a drop set that vanished from
     the volume would make the session read light. */
  var SET_KINDS = ['work', 'warm', 'drop', 'fail'];
  var KIND_WORD = { work: 'working set', warm: 'warm-up', drop: 'drop set', fail: 'set to failure' };
  function kindOf(st) { return st.warm ? 'warm' : (st.kind || 'work'); }
  function setNumber(ex, i) {
    var st = ex.sets[i];
    if (st.warm) return 'W';
    var c = 0;
    for (var k = 0; k <= i; k++) { if (counts(ex.sets[k])) c++; }
    var mark = st.kind === 'drop' ? 'D' : st.kind === 'fail' ? 'F' : '';
    return String(c) + (st.side || '') + mark;
  }

  function setRows(ex, e, letter) {
    var rows = '';
    ex.sets.forEach(function (st, i) {
      rows += '<button class="setgrid__n setgrid__n--btn' + (st.warm ? ' setgrid__n--warm' : '') +
          '" type="button" data-act="set-kind" data-ex="' + e + '" data-set="' + i + '" ' +
          'data-testid="set-kind-' + e + '-' + i + '" ' +
          'aria-label="Set ' + (i + 1) + ' is a ' + KIND_WORD[kindOf(st)] + '. Change it.">' +
          (letter || '') + (st.warm ? 'W' : n(setNumber(ex, i))) + '</button>' +
        cellHTML(e, i, 'weight') +
        cellHTML(e, i, 'reps') +
        rirHTML(e, i) +
        doneHTML(e, i);
      if (!S.hidePartials) rows += partialsHTML(e, i);
    });
    return rows;
  }

  function gridHead(e) {
    return '<div class="setgrid__head setgrid__head--n">#</div>' +
      '<div class="setgrid__head setgrid__head--unit" data-testid="unit-head-' + e + '">' +
        unitLabel(unitAt(e)).toUpperCase() + '</div>' +
      '<div class="setgrid__head">Reps</div>' +
      '<div class="setgrid__head">RIR</div>' +
      '<div class="setgrid__head" aria-hidden="true"></div>';
  }

  function headBtns(ex, e) {
    return '<button class="exc__grip" type="button" data-act="grip" data-ex="' + e + '" data-testid="grip-' + e + '" ' +
        'aria-pressed="' + (S.liftedEx === e ? 'true' : 'false') + '" aria-label="Reorder ' + esc(ex.name) +
        ', position ' + (e + 1) + ' of ' + S.exercises.length + '">' + ICO.grip + '</button>' +
      '<button class="exc__main" type="button" data-act="exsheet" data-ex="' + e + '" data-testid="exercise-menu-' + e + '" ' +
        'aria-haspopup="dialog" aria-label="Options for ' + esc(ex.name) +
        '. Press and hold, or press Enter." aria-description="Press and hold to open">' +
        '<span class="exc__name">' + esc(ex.name) + '</span>' +
        '<span class="exc__muscle">' + esc(ex.muscle) +
          (ex.unilateral ? ' &middot; left and right' : '') +
          /* The bar or carriage, where there is one. A set logged as 60 on a
             20 kg bar was 60, and nothing on the card said which. */
          (baseOf(ex) ? ' &middot; +' + trim(toDisplay(baseOf(ex), unitOf(ex))) + ' ' + unitLabel(unitOf(ex)) + ' base' : '') +
          /* How long since this lift was last trained, once that is long
             enough to be the reason the numbers have not moved. Under a
             month it is just a rest day and saying so would be noise. */
          (staleDays(ex) ? ' &middot; <span class="exc__stale" data-testid="stale-' + e + '">last ' +
            staleDays(ex) + ' days ago</span>' : '') +
          '</span>' +
      '</button>';
  }

  /* Days since this exercise last appeared in a finished session, when that
     is over a month. Read from lk_history rather than from the split, because
     a lift can be in the plan and not have been done since March. */
  var STALE_AFTER = 31;
  function staleDays(ex) {
    if (!ex || !ex.id || !window.LKStore) return 0;
    var today = window.LKStore ? LKStore.today() : new Date().toISOString().slice(0, 10);
    var hist = LKStore.get('lk_history', []) || [];
    var last = null;
    hist.forEach(function (w) {
      if (w.kind === 'cardio') return;
      var iso = String(w.date || w.dateISO || '').slice(0, 10);
      if (!iso) return;
      (w.exercises || []).forEach(function (x) {
        if (String(x.id) !== String(ex.id)) return;
        if (!last || iso > last) last = iso;
      });
    });
    if (!last) return 0;                   /* never logged is not stale */
    var d = Math.round((Date.parse(today) - Date.parse(last)) / 86400000);
    return d >= STALE_AFTER ? d : 0;
  }

  function aiBtn(e, label) {
    return '<button class="btn btn--sm btn--secondary" type="button" data-act="airec" data-ex="' + e + '" data-testid="btn-ai-rec-' + e + '"' +
      (S.aiBusyEx === e ? ' aria-busy="true"' : '') + '>' +
      (S.aiBusyEx === e ? '<span class="spinner" aria-hidden="true"></span><span>Thinking…</span>'
        : ICO.spark + '<span class="btn__label">AI Rec' + (label ? ' ' + label : '') + '</span>') +
      '</button>';
  }

  /* THE MOVE BAR. The grip said "Reordering Barbell Bench Press. Use the
     grip again to drop it." and nothing on the screen could move: there was
     no drag, no keyboard path and no control to move anything with. This is
     split-builder.html's pattern -- tap the grip to lift, Up/Down to move,
     drag the grip, or arrow keys while it has focus. */
  function moveBarHTML(e) {
    return '<div class="logmove" data-testid="movebar-' + e + '">' +
      '<button class="btn btn--sm btn--secondary" type="button" data-act="move" data-ex="' + e + '" data-dir="-1" ' +
        'data-testid="move-up-' + e + '"' + (e === 0 ? ' disabled aria-disabled="true"' : '') + '>' +
        '<span class="btn__label">Up</span></button>' +
      '<button class="btn btn--sm btn--secondary" type="button" data-act="move" data-ex="' + e + '" data-dir="1" ' +
        'data-testid="move-down-' + e + '"' + (e === S.exercises.length - 1 ? ' disabled aria-disabled="true"' : '') + '>' +
        '<span class="btn__label">Down</span></button>' +
      '<button class="btn btn--sm btn--tertiary" type="button" data-act="move-done" data-ex="' + e + '" ' +
        'data-testid="move-done-' + e + '"><span class="btn__label">Done</span></button>' +
    '</div>';
  }

  /* THE RECORDS SET IN THIS SESSION, read off the sets themselves so they
     survive a reload with the rows. A record was a four-second toast: beaten
     in the first exercise, it left no mark anywhere by the time the session
     ended, and the one place it appeared again was another screen days
     later. It is marked on the set, badged on the card, and banded across
     the top of the log for as long as the workout is open. */
  function sessionPRs() {
    var out = [];
    S.exercises.forEach(function (ex) {
      ex.sets.forEach(function (st, i) {
        if (st.pr) out.push({ name: ex.name, text: st.prText || '', set: i + 1 });
      });
    });
    return out;
  }
  function exHasPR(ex) {
    for (var i = 0; i < ex.sets.length; i++) if (ex.sets[i].pr) return true;
    return false;
  }
  function prBannerHTML() {
    var prs = sessionPRs();
    if (!prs.length) return '';
    return '<div class="prband" role="status" data-testid="pr-banner" data-count="' + prs.length + '">' +
      '<span class="badge badge--success">All-time ' + (prs.length === 1 ? 'PR' : 'PRs') + '</span>' +
      '<div class="prband__main">' +
        prs.map(function (r) {
          return '<p class="t-body-em">' + esc(r.name) + '</p>' +
            '<p class="t-detail muted">' + esc(r.text) + ' Set ' + r.set + ', saved to your records.</p>';
        }).join('') +
      '</div>' +
    '</div>';
  }

  function exerciseHTML(ex, e) {
    return '<article class="exc' + (S.liftedEx === e ? ' exc--lifted' : '') +
        (S.dragEx === e ? ' exc--dragging' : '') + '" data-testid="exercise-card-' + e + '">' +
      '<div class="exc__head">' + headBtns(ex, e) +
        (exHasPR(ex) ? '<span class="badge badge--success" data-testid="pr-badge-' + e + '">PR</span>' : '') +
      '</div>' +
      '<div class="sets"><div class="setgrid">' + gridHead(e) + setRows(ex, e) + '</div></div>' +
      '<div class="exc__foot">' +
        '<button class="btn btn--sm btn--secondary" type="button" data-act="addset" data-ex="' + e + '" data-testid="btn-add-set-' + e + '">' + ICO.plus + '<span class="btn__label">Add Set</span></button>' +
        aiBtn(e, '') +
      '</div>' +
      (S.liftedEx === e ? moveBarHTML(e) : '') +
    '</article>';
  }

  /* A SUPERSET IS ONE CARD. "Make it a superset" set a flag no render
     function read, so the toast said the two lifts were paired and the
     screen went on drawing them as two unrelated cards with two Add Sets
     and no order between them. A pair is drawn as it is performed: the rows
     interleaved A1, B1, A2, B2, one Add Set that lengthens both, and A's
     tick left half-marked until B's set of the same number is logged, since
     the round is not finished until both halves are. */
  function supersetHTML(a, e) {
    var b = S.exercises[e + 1];
    var rows = '';
    var na = a.sets.length, nb = b.sets.length;
    for (var i = 0; i < Math.max(na, nb); i++) {
      if (i < na) rows += setRow1(a, e, i, 'A');
      if (i < nb) rows += setRow1(b, e + 1, i, 'B');
    }
    return '<article class="exc' + (S.liftedEx === e ? ' exc--lifted' : '') +
        (S.dragEx === e ? ' exc--dragging' : '') + '" data-testid="exercise-card-' + e + '" data-superset="true">' +
      '<div class="exc__head">' + headBtns(a, e) + '<span class="badge" data-testid="superset-badge-' + e + '">Superset</span></div>' +
      '<div class="exc__head exc__head--b">' +
        '<span class="exc__grip" aria-hidden="true"></span>' +
        '<button class="exc__main" type="button" data-act="exsheet" data-ex="' + (e + 1) + '" data-testid="exercise-menu-' + (e + 1) + '" ' +
          'aria-haspopup="dialog" aria-label="Options for ' + esc(b.name) +
          '. Press and hold, or press Enter." aria-description="Press and hold to open">' +
          '<span class="exc__name">' + esc(b.name) + '</span>' +
          '<span class="exc__muscle">' + esc(b.muscle) + '</span>' +
        '</button>' +
      '</div>' +
      '<div class="sets"><div class="setgrid">' + gridHead(e) + rows + '</div></div>' +
      '<div class="exc__foot">' +
        '<button class="btn btn--sm btn--secondary" type="button" data-act="addset-both" data-ex="' + e + '" data-testid="btn-add-set-' + e + '">' +
          ICO.plus + '<span class="btn__label">Add Set to both</span></button>' +
        aiBtn(e, 'A') + aiBtn(e + 1, 'B') +
      '</div>' +
      (S.liftedEx === e ? moveBarHTML(e) : '') +
    '</article>';
  }

  /* One row of the interleaved grid. The row carries its own exercise and
     set index, so every control on it is the same control as on a plain
     card and no handler had to learn about supersets. */
  function setRow1(ex, e, i, letter) {
    var st = ex.sets[i];
    return '<div class="setgrid__n' + (st.warm ? ' setgrid__n--warm' : '') + '" aria-hidden="true">' +
        letter + (st.warm ? 'W' : n(setNumber(ex, i))) + '</div>' +
      cellHTML(e, i, 'weight') +
      cellHTML(e, i, 'reps') +
      rirHTML(e, i) +
      doneHTML(e, i, letter === 'A' ? waitingOnB(e, i) : false) +
      (S.hidePartials ? '' : partialsHTML(e, i));
  }

  /* A's set is logged, B's set of the same number is not. */
  function waitingOnB(e, i) {
    var a = S.exercises[e], b = S.exercises[e + 1];
    if (!a || !b || !a.sets[i] || !a.sets[i].done) return false;
    return !(b.sets[i] && b.sets[i].done);
  }

  function blockHTML(b, i) {
    return '<article class="block" data-testid="block-' + i + '">' +
      '<span class="sheetact__ico">' + ICO.note + '</span>' +
      '<div class="block__main">' +
        '<div class="t-body-em">' + esc(b.title) + '</div>' +
        (b.duration ? '<div class="t-detail muted">' + esc(b.duration) + '</div>' : '') +
        /* Collapsed to its title and length: a block sits between two
           exercises, and a paragraph of notes there pushes the next lift off
           the screen. The toggle is offered only when there is something to
           open. */
        (b.notes
          ? '<button class="btn btn--tertiary btn--sm mt-1" type="button" data-act="block-open" ' +

  /* =============================================================

  function openPadFor(e, i, field) {
    var st = S.exercises[e].sets[i];
    var own = field === 'weight' ? st.kg : st.reps;
    var u = unitAt(e);
    var raw = own !== null ? own : (field === 'weight' ? st.prevKg : null);
    var shown = field === 'weight' ? toDisplay(raw, u) : raw;
    return {
      ex: e, set: i, field: field, unit: u,
      buffer: (shown === null || shown === undefined) ? '' : trim(shown),
      /* THE FIX. The pad opens showing the pending value, as shipped,
         but the first digit replaces it whole instead of appending to
         it. Digits after the first append and DEL still edits, so
         nothing else about the pad's behaviour changed. */
      replaced: false,
      fromPrev: own === null && shown !== null && shown !== undefined
    };
  }

  function padHTML() {

    ['1', '2', '3', '4', '5', '6', '7', '8', '9', isWeight ? '.' : '', '0'].forEach(function (k) {

        '</div>' +
      '</div>';
  }

  function padDigit(k) {
    var p = S.pad;
    if (!p.replaced) { p.buffer = (k === '.' ? '0.' : k); p.replaced = true; return; }
    if (k === '.' && p.buffer.indexOf('.') >= 0) return;
    if (p.buffer.replace('.', '').length >= 5) return;
    p.buffer = (p.buffer === '0' && k !== '.') ? k : p.buffer + k;
  }
  function padStep(delta) {
    var p = S.pad;
    var base = parseFloat(p.buffer || '0') || 0;
    var v = Math.max(0, base + delta);
    p.buffer = trim(p.field === 'weight' ? round(v, 0.5) : Math.round(v));
    p.replaced = true;
  }
  function padCommit() {
    var p = S.pad, st = S.exercises[p.ex].sets[p.set];
    var v = p.buffer === '' ? null : parseFloat(p.buffer);
    if (p.field === 'weight') st.kg = v === null || isNaN(v) ? null : toKg(v, p.unit);
    else st.reps = v === null || isNaN(v) ? null : Math.round(v);
    S.pad = null;
  }

  function plateSVG(perSide) {
    var w = 320, mid = 160, x = mid + 28, out = '';
    out += '<rect class="platebar__bar" x="20" y="30" width="280" height="4" rx="2"/>';
    out += '<rect class="platebar__collar" x="' + (mid - 26) + '" y="24" width="52" height="16" rx="4"/>';

      out += '<rect class="platebar__plate" x="' + x + '" y="' + (32 - ph / 2) + '" width="8" height="' + ph + '" rx="2"/>';
      out += '<rect class="platebar__plate" x="' + (2 * mid - x - 8) + '" y="' + (32 - ph / 2) + '" width="8" height="' + ph + '" rx="2"/>';
      x += 11;
    });
    return '<svg class="platebar" viewBox="0 0 ' + w + ' 64" role="img" aria-label="Loaded bar diagram">' + out + '</svg>';
  }

  /* Work the plates out from the weight, which is the direction the question
     is actually asked in. The sheet could only go the other way: tap plates
     until the number matches, which is arithmetic the calculator was supposed
     to do. Greedy from the heaviest plate down, which is optimal for a real
     plate set because every plate divides the ones above it.

     It says what it CAN reach, not what was asked for. A 20 kg bar and a
     1.25 kg smallest plate cannot make 101 kg, and quietly loading 100 and
     calling it 101 is how a log stops matching the rack. */
  function solvePlates(target, bar) {
    var perSide = (target - bar) / 2;
    if (perSide < 0) return null;
    var sizes = PLATES[S.unit].map(function (x) {
      return S.unit === 'kg' ? x : Math.round((x / LB_PER_KG) * 100) / 100;
    }).slice().sort(function (a, b) { return b - a; });
    var out = [], left = perSide;
    sizes.forEach(function (sz) {
      while (left >= sz - 0.0001) { out.push(sz); left = Math.round((left - sz) * 1000) / 1000; }
    });
    var made = bar + out.reduce(function (a, b) { return a + b; }, 0) * 2;
    return { plates: out, made: Math.round(made * 100) / 100, exact: Math.abs(made - target) < 0.01 };
  }

          (S.restError ? '<p class="field__error mt-2" role="alert" data-testid="rest-error">' +
            esc(S.restError) + '</p>' : '') +
        '</div>' +
      '</div>';
  }

  /* Which one. A list of the sets as they read on the card, so the row being
     removed is identified by what is in it rather than by a number somebody
     has to count to. */
  var EQ_KINDS = ['Barbell', 'Dumbbell', 'Machine', 'Cable', 'Smith machine',
                  'Bodyweight', 'Band', 'Kettlebell', 'Plate-loaded'];
  function eqTakesBase(k) {
    return k === 'Barbell' || k === 'Plate-loaded' || k === 'Smith machine';
  }
  function equipHTML() {
    var ex = S.exercises[S.overlayEx];
    if (!ex) return '';
    var eq = equipFor(ex.id) || {};
    return '<div class="scrim" data-act="close" data-testid="equip-scrim" role="presentation"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="Equipment" data-testid="equip-sheet">' +
        '<div class="sheet__grab" aria-hidden="true"></div>' +
        '<div class="sheet__head"><h2 class="t-section">' + esc(ex.name) + '</h2>' +
          '<button class="iconbtn" type="button" data-act="close" data-testid="equip-close" aria-label="Close">' + ICO.close + '</button></div>' +
        '<div class="sheet__body">' +
          '<p class="t-detail muted">Remembered for this lift, in every session. The bar or ' +
            'carriage is added to what a set says, so the total matches the rack.</p>' +

            return '<button class="chip' + (eq.eq === k ? ' chip--on' : '') + '" type="button" ' +
              'data-act="equip-kind" data-v="' + k + '" data-testid="equip-' +

                '<input class="input num" id="equip-base" type="number" min="0" max="200" step="0.5" ' +
                  'inputmode="decimal" value="' + (eq.base || 0) + '" data-testid="equip-base"></label>' +
              '<p class="t-detail muted mt-1">' + unitWord() + '. Added to every set of this lift.</p>'
            : '') +

            ? '<div class="row row--withaside mt-3">' +
                '<span class="row__main stack">' +
                  '<span class="row__title" id="eqcb-lbl">No counterbalance</span>' +

  function pickSetHTML() {
    var ex = S.exercises[S.overlayEx];
    if (!ex) return '';
    return '<div class="scrim" data-act="close" data-testid="pickset-scrim" role="presentation"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="Remove a set" data-testid="pickset-sheet">' +

              '<span class="sheetact__ico">' + (st.warm ? 'W' : n(setNumber(ex, i))) + '</span>' +
              esc(w + ' \u00d7 ' + r) + (st.done ? ' \u00b7 logged' : '') + '</button>';
          }).join('') +

  function blockModalHTML() {
    return '<div class="scrim" data-act="close" data-testid="block-scrim" role="presentation"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="Add block" data-testid="block-sheet">' +
        '<div class="sheet__grab" aria-hidden="true"></div>' +
        '<div class="sheet__head"><h2 class="t-section">Add block</h2>' +
          '<button class="iconbtn" type="button" data-act="close" data-testid="block-close" aria-label="Close add block">' + ICO.close + '</button></div>' +
        '<div class="sheet__body">' +
          '<p class="t-detail muted">Add a note, warm-up reminder, or timed section between exercises.</p>' +
          '<label class="field mt-3"><span class="field__label t-label">Title</span>' +
            '<input class="input" id="block-title" data-testid="block-title" placeholder="Shoulder warm-up, stretch, core finisher"></label>' +
          /* Two fields, not one. "Notes or duration" took both and stored
             neither as a duration -- `duration` was hard-coded empty -- so a
             timed section could not be told from a note. */
          '<label class="field mt-3"><span class="field__label t-label">How long</span>' +
            '<input class="input num" id="block-mins" data-testid="block-mins" type="number" ' +
              'min="1" max="180" step="1" inputmode="numeric" placeholder="5"></label>' +
          '<p class="t-caption-1 quiet mt-1">Minutes. Leave it blank for a block with no set length.</p>' +
          '<label class="field mt-3"><span class="field__label t-label">Notes</span>' +
            '<input class="input" id="block-notes" data-testid="block-notes" placeholder="Bike, hip openers"></label>' +
          (S.blockError ? '<p class="field__error mt-2" role="alert" data-testid="block-error">' +
            esc(S.blockError) + '</p>' : '') +
        '</div>' +
        '<div class="sheet__foot"><div class="addrow">' +
          '<button class="btn btn--secondary" type="button" data-act="close" data-testid="block-cancel">Cancel</button>' +
          '<button class="btn btn--primary" type="button" data-act="block-add" data-testid="block-add">Add block</button>' +
