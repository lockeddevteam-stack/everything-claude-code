          ex.sets.map(function (st, i) {
            var w = st.kg !== null ? trim(toDisplay(st.kg, unitOf(ex))) + ' ' + unitLabel(unitOf(ex)) : 'no weight';
            var r = st.reps !== null ? st.reps + ' reps' : 'no reps';
            return '<button class="sheetact" type="button" data-act="delrow-go" data-i="' + i + '" ' +
              'data-testid="pickset-' + i + '">' +
              '<span class="sheetact__ico">' + (st.warm ? 'W' : n(setNumber(ex, i))) + '</span>' +
              esc(w + ' \u00d7 ' + r) + (st.done ? ' \u00b7 logged' : '') + '</button>';
          }).join('') +
        '</div></div>' +
      '</div>';
  }

  function blockModalHTML() {
    return '<div class="scrim" data-act="close" data-testid="block-scrim" role="presentation"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="Add block" data-testid="block-sheet">' +
        '<div class="sheet__grab" aria-hidden="true"></div>' +
        '<div class="sheet__head"><h2 class="t-section">Add block</h2>' +
          '<button class="iconbtn" type="button" data-act="close" data-testid="block-close" aria-label="Close add block">' + ICO.close + '</button></div>' +
        '<div class="sheet__body">' +
          '<p class="t-detail muted">Add a note, warm-up reminder, or timed section between exercises.</p>' +
          '<label class="field mt-3"><span class="field__label t-label">Title</span>' +
            '<input class="input" id="block-title" data-testid="block-title" placeholder="Shoulder warm-up, stretch, core finisher"></label>' +
          /* Two fields, not one. "Notes or duration" took both and stored
             neither as a duration -- `duration` was hard-coded empty -- so a
             timed section could not be told from a note. */
          '<label class="field mt-3"><span class="field__label t-label">How long</span>' +
            '<input class="input num" id="block-mins" data-testid="block-mins" type="number" ' +
              'min="1" max="180" step="1" inputmode="numeric" placeholder="5"></label>' +
          '<p class="t-caption-1 quiet mt-1">Minutes. Leave it blank for a block with no set length.</p>' +
          '<label class="field mt-3"><span class="field__label t-label">Notes</span>' +
            '<input class="input" id="block-notes" data-testid="block-notes" placeholder="Bike, hip openers"></label>' +
          (S.blockError ? '<p class="field__error mt-2" role="alert" data-testid="block-error">' +
            esc(S.blockError) + '</p>' : '') +
        '</div>' +
        '<div class="sheet__foot"><div class="addrow">' +
          '<button class="btn btn--secondary" type="button" data-act="close" data-testid="block-cancel">Cancel</button>' +
          '<button class="btn btn--primary" type="button" data-act="block-add" data-testid="block-add">Add block</button>' +
        '</div></div>' +
      '</div>';
  }

  /* THE PICKER'S LIBRARY. Six rows, typed into this file, against a library
     of 866 -- so "Search all exercises" searched six, and a swap could only
     ever reach whichever six somebody had chosen months ago. The whole
     catalogue is fetched the way split-builder.html and the library screen
     fetch it; from a file:// origin the fetch cannot run, the six below
     stand, and the sheet says how many it is offering either way. */
  /* Names and regions read off tests/fixtures/exercise-db.json. Five of the
     six were wrong: 211 is a Barbell Row, not a Lat Pulldown; 503 a Barbell
     Curl, not a Cable Curl; 321 a Face Pull. Swapping to one of these put a
     different lift in the session than the row said, under an id the rest of
     the app resolves for itself. */
  var LIBRARY = [
    { id: 202, name: 'Lat Pulldown', muscle: 'Lats' },
    { id: 113, name: 'Machine Chest Press', muscle: 'Mid Chest' },
    { id: 321, name: 'Face Pull', muscle: 'Rear Delt' },
    { id: 503, name: 'Barbell Curl', muscle: 'Long Head' },
    { id: 701, name: 'Barbell Squat', muscle: 'Quads' },
    { id: 802, name: 'Lying Leg Curl', muscle: 'Hamstrings' }
  ];
  var LIBRARY_FULL = false;

  function loadLibrary() {
    /* Custom exercises a person made are theirs and belong in the picker
       whether or not the catalogue loads. */
    function withCustom(rows) {
      ((window.LKStore ? LKStore.get('lk_customEx', []) : []) || []).forEach(function (c) {
        rows.push({ id: c.id, name: c.name, group: c.gid || '',
                    muscle: c.muscle || c.sid || c.gid || 'Custom', custom: true });
      });
      return rows;
    }
    /* THE CATALOGUE IS ALREADY HERE. This fetched a JSON file that does
       not exist on file:// and dropped `group` on the way in even when it
       did -- so the picker fell back to six hardcoded lifts offline, and
       "what else trains this" could never widen past the exact muscle
       because the group was not in the data it was reading. LKExercises
       is loaded before this screen, carries all 866 with both their group
       and their muscle, and needs no network. */
    if (window.LKExercises && LKExercises.all) {
      var rows = LKExercises.all();
      if (rows && rows.length) {
        LIBRARY = withCustom(rows.map(function (x) {
          return { id: x.id, name: x.name, group: x.group || '', muscle: x.muscle || x.group || '' };
        }));
        LIBRARY.sort(function (a, b) { return a.name < b.name ? -1 : 1; });
        LIBRARY_FULL = true;
        return;
      }
    }
    /* Below this the old path fetched a test fixture. It was already
       unreachable -- LKExercises returns above it in every build that
       has one, which is every build -- and an unreachable fallback
       reading a path that does not ship is a trap for whoever edits
       this next. The seed list stands if the catalogue is ever missing,
       which is the honest fallback and the only one left. */
    LIBRARY = withCustom(LIBRARY.slice());
  }

  function addExHTML() {
    return '<div class="scrim" data-act="close" data-testid="addex-scrim" role="presentation"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="Add exercise" data-testid="addex-sheet">' +
        '<div class="sheet__grab" aria-hidden="true"></div>' +
        '<div class="sheet__head"><h2 class="t-section">' +
          (S.swapAt !== null && S.exercises[S.swapAt]
            ? 'Replacing: ' + esc(S.exercises[S.swapAt].name)
            : 'Add exercise') + '</h2>' +
          '<button class="iconbtn" type="button" data-act="close" data-testid="addex-close" aria-label="Close add exercise">' + ICO.close + '</button></div>' +
        '<div class="search"><span class="search__ico">' + ICO.search + '</span>' +
          '<label class="vis-hidden" for="addex-q">Search all exercises</label>' +
          '<input class="input" id="addex-q" data-act="addex-q" data-testid="addex-search" ' +
            'value="' + esc(S.addexQ || '') + '" autocomplete="off" placeholder="Search all exercises"></div>' +
        '<div class="sheet__body mt-3">' + addExBody() +
        '</div>' +
      '</div>';
  }

  /* THE FIGURE FIRST, THEN THE LIFTS.

     This sheet used to open on a search field over the whole catalogue.
     866 lifts in a scroll is a reference book, and nobody reads a
     reference book between sets -- the question in the gym is "what else
     hits this", and the fastest way to ask it is to point at the part.

     Three states, and the reader is never more than one tap from the one
     before: the body, then one group's lifts, and search cutting across
     both at any time. */
  function addExBody() {
    var q = (S.addexQ || '').trim();
    if (q) return addExList();
    if (!S.addexGid) return addExMapHTML();
    return addExGroupHTML();
  }

  function addExMapHTML() {
    var counts = (window.LKExercises && LKExercises.groupCounts)
      ? LKExercises.groupCounts(offeredLibrary()) : {};
    var cur = S.swapAt !== null && S.exercises[S.swapAt];
    return '<div class="addexmap" data-testid="addex-map">' +
      '<div class="addexmap__fig" id="addex-fig"></div>' +
      '<div class="addexmap__side">' +
        /* `seg`, the same control the library's figure uses. A second
           spelling of the same thing is a second thing to keep in step. */
        '<div class="seg" role="tablist" aria-label="Body view">' +
          ['front', 'back'].map(function (v) {
            return '<button class="seg__item" type="button" role="tab" data-act="addex-view" ' +
              'data-view="' + v + '" data-testid="addex-view-' + v + '" ' +
              'aria-selected="' + (S.addexView === v ? 'true' : 'false') + '">' +
              (v === 'front' ? 'Front' : 'Back') + '</button>';
          }).join('') +
        '</div>' +
      '</div>' +
      '<p class="t-detail muted mt-2" data-testid="addex-map-note">' +
        (cur ? 'Tap the part you want instead of ' + esc(cur.name) + '.'
             : 'Tap the part you are training.') +
      '</p>' +
      /* The names as well as the figure. A body is faster for somebody
         who knows where a muscle is and useless to somebody who does
         not, and a list of twelve is not the list of 866 this replaced. */
      '<div class="card card--flush mt-3" data-testid="addex-groups">' +
        (window.LKExercises ? LKExercises.groups : []).map(function (gr) {
          var c = counts[gr[0]] || { n: 0 };
          if (!c.n) return '';
          return '<button class="row" type="button" data-act="addex-group" ' +
            'data-gid="' + gr[0] + '" data-testid="addex-group-' + gr[0] + '">' +
            '<span class="row__main"><span class="row__title">' + esc(gr[1]) + '</span></span>' +
            '<span class="t-meta num">' + c.n + '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span></button>';
        }).join('') +
      '</div>';
  }

  /* THE BODY STAYS, FRAMED ON WHAT WAS TAPPED. Choosing Chest used to
     swap the figure for ninety-eight rows, which is the moment the body
     stopped being useful. It stays now, zoomed to the muscle and divided
     into its parts, the same as the library and the split builder: the
     second tap picks a head and narrows the list to it. */
  function addExGroupHTML() {
    var name = (window.LKExercises && LKExercises.groupName)
      ? LKExercises.groupName(S.addexGid) : S.addexGid;
    var here = S.addexSub ? esc(S.addexSub) + ' \u00b7 ' + esc(name) : esc(name);
    return '<div class="addexmap addexmap--zoom" data-testid="addex-map-zoom">' +
        '<div class="addexmap__fig" id="addex-fig"></div>' +
        /* FRONT AND BACK OUTLIVE THE ZOOM. The two buttons left with the
           whole-body view, so the only way to reach a triceps once a
           chest was framed was to back all the way out and start again.
           They are the same control in the same place, and switching
           sides takes the camera with it. */
        '<div class="addexmap__side">' +
          '<div class="seg" role="tablist" aria-label="Body view">' +
            ['front', 'back'].map(function (v) {
              return '<button class="seg__item" type="button" role="tab" data-act="addex-view" ' +
                'data-view="' + v + '" data-testid="addex-view-' + v + '" ' +
                'aria-selected="' + (S.addexView === v ? 'true' : 'false') + '">' +
                (v === 'front' ? 'Front' : 'Back') + '</button>';
            }).join('') +
          '</div>' +
        '</div>' +
      '</div>' +
      /* THE LIFTS RIDE THE CAMERA IN. The crumb and the list are the half
         of this move that is not the figure, and until now they simply
         existed the instant the muscle was tapped while the body zoomed
         beside them. Wrapped, they rise into place at the rate the camera
         is travelling, so the sheet reads as one movement rather than as
         a picture animating next to a list that changed. */
      '<div class="zoomride">' +
        '<div class="spread mt-2" data-testid="addex-crumb">' +
          '<button class="btn btn--tertiary btn--sm" type="button" data-act="' +
            (S.addexSub ? 'addex-whole' : 'addex-back') + '" ' +
            'data-testid="addex-back">' + ICO.chevLeft + '<span class="btn__label">' +
            (S.addexSub ? esc(name) : 'Body') + '</span></button>' +
          '<span class="t-label">' + here + '</span>' +
        '</div>' + addExList() +
      '</div>';
  }

  /* THE FIGURE, BUILT ONCE THE SHEET IS ON SCREEN.

     LKBodyMap draws into a host element, so it cannot be part of the
     HTML string the sheet is patched in from -- it is mounted after,
     against the slot that string left for it. The sheet is rebuilt on
     every paint, so the figure is rebuilt with it rather than kept: a
     kept one would be pointing at a detached node the moment anything
     re-rendered.

     The library owns the same figure on its own screen. What is shared
     is the module and the taxonomy behind it, not the flow: there it is
     a way to browse, here it is a way to answer one question and get
     back to the set you were in the middle of. */
  var ADDEX_FIG = null;
  var ADDEX_HOST = null;
  function syncAddexFigure() {
    var slot = document.getElementById('addex-fig');
    if (!slot || !window.LKBodyMap || !window.LKExercises) return;
    /* MOUNTED ONCE, MOVED EVERY PAINT. The sheet's HTML is rebuilt whole
       on every paint, so a figure mounted straight into it was a brand
       new figure each time: it arrived already framed on the muscle
       rather than travelling there, because there was no previous camera
       to travel from. The figure lives in a host of its own and the host
       is moved into whichever slot the latest paint left, which keeps
       the element -- and so the animation -- alive across the redraw. */
    if (!ADDEX_HOST) {
      ADDEX_HOST = document.createElement('div');
      ADDEX_HOST.className = 'addexmap__host';
      /* IN THE DOCUMENT BEFORE IT IS DRAWN INTO. The map writes its hue
         rules into the root it finds itself in, and a detached host has
         no shadow root to find: the stylesheet went to the top document,
         never reached this screen, and every muscle rendered black. */
      slot.appendChild(ADDEX_HOST);
      try {
        ADDEX_FIG = LKBodyMap.mount(ADDEX_HOST, {
          groups: LKExercises.groupCounts(offeredLibrary()),
          order: LKExercises.groups.map(function (gr) { return gr[0]; }),
          view: S.addexView,
          /* HOW FAR THE CAMERA HAS GOT, ON THE SCREEN'S OWN ROOT. The
             figure publishes this on its svg, which reaches nothing
             outside the figure; the list is a sibling of it. Put on
             #screen it inherits into the whole sheet, and the crumb and
             the lifts under the body are a pure function of it -- no
             timer of their own, so they move at exactly the camera's
             rate. The attribute switches the rule on, and is gone the
             moment the trip is over: a transform left standing on a
             scrolling list changes what its sticky children stick to. */
          onZoom: function (t) {
            var root = document.getElementById('screen');
            if (!root) return;
            root.style.setProperty('--zoom-t', String(t));
            if (t < 1) root.setAttribute('data-zoomride', '');
            else root.removeAttribute('data-zoomride');
          },
          onSelect: function (gid) {
            S.addexGid = gid;
            S.addexSub = null;
            S.addexPinch = false;
            S.addexN = ADDEX_PAGE;
            paint();
          },
          /* The second tap is the one that answers the question: not
             "chest" but "upper chest". */
          onPart: function (gid, part) {
            S.addexGid = gid;
            S.addexSub = part;
            S.addexN = ADDEX_PAGE;
            paint();
          },
          /* And the same thing reached by pinching in rather than by
             tapping, so the two gestures agree about what they mean. */
          onSplit: function (gid) {
            if (gid) { S.addexGid = gid; S.addexPinch = true; }
            else {
              S.addexSub = null;
              /* AND THE MUSCLE GOES BACK TOO, if the only reason the
                 sheet was on it was a pinch. The figure divides whatever
                 is under the middle of the frame, so zooming in on a
                 chest puts the sheet on chest without anyone tapping it;
                 zooming back out has to give the whole body back, or the
                 sheet is left filtered to a muscle the reader never
                 chose. A muscle they DID tap stays chosen. */
              if (S.addexPinch) { S.addexGid = null; S.addexPinch = false; }
            }
            S.addexN = ADDEX_PAGE;
            paint();
          }
        });
      } catch (e) {
        ADDEX_FIG = null;
        if (ADDEX_HOST && ADDEX_HOST.parentNode) ADDEX_HOST.parentNode.removeChild(ADDEX_HOST);
        ADDEX_HOST = null;
        return;
      }
      /* Replacing a lift lights the part it trains, so the figure opens
         already answering "where am I". */
      try {
        if (ADDEX_FIG.select && S.swapAt !== null && S.exercises[S.swapAt]) {
          ADDEX_FIG.select(LKExercises.gidOf(S.exercises[S.swapAt]));
        }
      } catch (e2) {}
    }
    if (ADDEX_HOST.parentNode !== slot) slot.appendChild(ADDEX_HOST);
    /* The camera and the split follow the state on every paint, so a
       redraw never leaves a muscle framed with its parts gone. */
    var fig = ADDEX_FIG;
    if (!fig) return;
    try {
      if (fig.setView) fig.setView(S.addexView);
      if (fig.select) fig.select(S.addexGid || null);
      if (fig.zoomTo) fig.zoomTo(S.addexGid || null, S.addexView);
      if (S.addexGid && fig.showParts) {
        fig.showParts(S.addexGid, S.addexView);
        if (fig.selectPart) fig.selectPart(S.addexSub || null);
      } else if (fig.clearParts) fig.clearParts();
    } catch (e3) {}
  }

  /* The list the sheet is willing to show: the short one unless the
     reader asked for everything. Shared so the figure's counts and the
     rows underneath it can never disagree. */
  function offeredLibrary() {
    if (!S.addexAll && window.LKExercises && LKExercises.offered) {
      var short = LKExercises.offered(LIBRARY);
      if (short.length) return short;
    }
    return LIBRARY;
  }

  /* The list the search actually filters. It was rendered straight from
     LIBRARY with the field wired to nothing: typing anything left all six
     rows exactly where they were, which is worse than having no field.

     THEN IT MATCHED ON THE WHOLE TYPED STRING, in the order it was typed.
     "incline smith" found nothing here while it found the lift one screen
     over in the library, because the catalogue spells it "Smith Incline
     Press" and a substring only ever finds words in one order. The search
     is LKExercises.search now, the same one the library uses, keywords in
     any order and ranked the same way: it is what puts Barbell Bench Press
     above Close-Grip Bench Press for "bench". */
  var ADDEX_PAGE = 40;
  /* WHAT A SEARCH IS ALLOWED TO REACH. Everything the catalogue holds,
     minus the strongman and apparatus the library does not offer either:
     a sled between two presses is the thing that curation was for. Your
     own custom lifts always stay in, because you made them. */
  function searchPool() {
    if (!window.LKExercises || !LKExercises.hidden) return LIBRARY;
    return LIBRARY.filter(function (x) { return x.custom || !LKExercises.hidden(x); });
  }
  function addExList() {
    var q = (S.addexQ || '').trim().toLowerCase();
    var all = q
      ? ((window.LKExercises && LKExercises.search) ? LKExercises.search(searchPool(), q) : [])
      : LIBRARY;
    /* A SWAP WANTS THE SAME MUSCLE. Swapping the bench press opened the
       library at 3/4 Sit-Up and 45-degree Incline Lateral Raise -- an
       alphabetical list of 866 lifts, when the question being asked is "what
       else trains this". Anything hitting the same muscle comes first, and
       with nothing typed only those are offered, with a way to see the rest.
       A plain Add is unchanged: there the whole library IS the answer. */
    var swapping = S.swapAt !== null && S.exercises[S.swapAt];
    var sameOnly = false;
    /* With a part chosen by hand, the reader has already said what they
       want; re-sorting by "related to the one being replaced" would
       quietly put a different muscle back on top. */
    if (S.addexGid) swapping = false;

    /* THE SHORT LIST, unless the reader asked for the whole catalogue.
       866 lifts is a reference; picking one mid-session is a menu.

       NOT WHILE SOMEBODY IS TYPING. The short list is the top twenty per
       muscle, and "incline smith" is in none of them, so a keyword search
       ran perfectly and then had its three hits thrown away before they
       reached the screen. A typed query is the reader narrowing the list
       themselves, which is the job the short list was doing for them. The
       library has always worked this way: it keeps all 866 in search. */
    if (!q && !S.addexAll && window.LKExercises && LKExercises.offered) {
      var offered = LKExercises.offered(all);
      if (offered.length) all = offered;
    }

    /* AND ONLY THE PART THAT WAS TAPPED. With a group chosen off the
       figure, the list is that group -- which is the whole point of
       having pointed at it. Search cuts across the body, so a query
       clears the group rather than being trapped inside it. */
    if (S.addexGid && !q && window.LKExercises && LKExercises.gidOf) {
      all = all.filter(function (x) { return LKExercises.gidOf(x) === S.addexGid; });
    }

    /* A PART CHOSEN ON THE BODY IS THE WHOLE LIST. The figure's parts are
       named the way a person says them -- "Upper", "Lats" -- and the
       catalogue's muscle is "Upper Chest" or "Lats". One is the start of
       the other, in both directions, which covers every part this figure
       can draw without a table to keep in step. A part the catalogue
       files nothing under leaves the group's list alone. */
    var partNote = '';
    if (S.addexSub && !q && window.LKExercises && LKExercises.forPart) {
      var byPart = LKExercises.forPart(S.addexGid, S.addexSub, all);
      all = byPart.list;
      if (!byPart.exact) partNote = byPart.note;
    }

    /* RELATED MUSCLES, not one muscle. Replacing an incline press offered
       only other Upper Chest lifts, which is narrower than the question:
       what else trains this. The muscle comes first, then the rest of the
       group -- a chest exercise's alternatives are chest exercises -- and
       the whole library is one button away. */
    if (swapping) {
      var cur = S.exercises[S.swapAt];
      var wantM = String(cur.muscle || '').toLowerCase();
      /* The group off the CATALOGUE, not off the session. A session's
         exercise carries id, name and muscle -- exFromHistory never had a
         group to pass -- so reading it here gave an empty string and the
         "rest of the group" tier could never match anything. */
      var wantG = String(cur.group || '').toLowerCase();
      if (!wantG) {
        for (var li = 0; li < LIBRARY.length; li++) {
          if (LIBRARY[li].id === cur.id) { wantG = String(LIBRARY[li].group || '').toLowerCase(); break; }
        }
      }
      var tier = function (x) {
        if (wantM && String(x.muscle || '').toLowerCase() === wantM) return 0;
        if (wantG && String(x.group || '').toLowerCase() === wantG) return 1;
        return 2;
      };
      if (!q) {
        var related = all.filter(function (x) { return tier(x) < 2; });
        if (related.length && !S.addexAll) { all = related; sameOnly = true; }
      }
      all = all.slice().sort(function (a, b) { return tier(a) - tier(b); });
    }

    /* AND WHAT YOU HAVE ACTUALLY DONE, FIRST. The lift you used last
       Tuesday is far likelier to be the one you want than whichever sorts
       first alphabetically. Stable within each tier, so the muscle
       grouping above still holds.

       WHILE BROWSING ONLY. Somebody who has typed words has already said
       what they want, and the search ranks on exactly that: floating a
       lift up the list because it was done last week would put Close-Grip
       Bench Press above Barbell Bench Press for "bench", and would make
       this sheet disagree with the library about the same query. */
    if (!q && window.LKExercises && LKExercises.doneBefore) {
      var seenBefore = LKExercises.doneBefore();
      all = all.slice().map(function (x, i) { return [x, i]; }).sort(function (a, b) {
        var ra = seenBefore[a[0].id], rb = seenBefore[b[0].id];
        var ha = ra === undefined ? 1 : 0, hb = rb === undefined ? 1 : 0;
        if (ha !== hb) return ha - hb;
        if (!ha && ra !== rb) return ra - rb;
        return a[1] - b[1];
      }).map(function (p) { return p[0]; });
    }
    /* 866 rows in one sheet is a scroll nobody finishes, and it is the
       search field's job anyway. A page at a time, with the count and a way
       to see more, so the number offered is never hidden. */
    var noteHTML = partNote
      ? '<p class="t-detail muted mb-2" data-testid="addex-part-note">' + esc(partNote) + '</p>'
      : '';
    var rows = all.slice(0, S.addexN || ADDEX_PAGE);
    var sameNote = sameOnly
      ? '<p class="t-detail muted" data-testid="addex-same">' + n(all.length) +
        (all.length === 1 ? ' lift' : ' lifts') + ' for ' +
        esc(S.exercises[S.swapAt].muscle) + ' and the rest of ' +
        esc(S.exercises[S.swapAt].group || 'the group') + '. ' +
        '<button class="btn btn--tertiary btn--sm" type="button" data-act="addex-all" ' +
        'data-testid="addex-all">Show the whole library</button></p>'
      : '';
    if (!all.length) {
      return '<div class="empty" data-testid="addex-empty">' +
        '<p class="empty__title">Nothing matches &ldquo;' + esc(S.addexQ.trim()) + '&rdquo;</p>' +
        /* The old line said the full library has more than this sheet
           offers. It did, and it does not now: a search reaches every
           lift. Telling somebody to look elsewhere when there is nowhere
           else to look is worse than saying nothing. */
        '<p class="empty__body">Every word has to match, but they can come in any order. ' +
          'Try fewer words, or the muscle it works.</p></div>';
    }
    return noteHTML + sameNote + '<div class="card card--flush' + ((sameNote || noteHTML) ? ' mt-2' : '') + '">' + rows.map(function (x) {
      var i = LIBRARY.indexOf(x);
      return '<button class="row" type="button" data-act="addex-pick" data-i="' + i + '" data-testid="addex-pick-' + x.id + '">' +
        '<span class="row__main"><span class="row__title">' + esc(x.name) + '</span><span class="row__sub">' + esc(x.muscle) + '</span></span>' +
        '<span class="row__chev">' + ICO.plus + '</span></button>';
    }).join('') + '</div>' +
    (all.length > rows.length
      ? '<button class="btn btn--secondary btn--block mt-3" type="button" data-act="addex-more" data-testid="addex-more">' +
          '<span class="btn__label">Show more (' + (all.length - rows.length) + ' left)</span></button>'
      : '');
  }

  /* THE SESSION LEFT OPEN. A workout started and walked away from stays live
     for ever: the shelf says you are training, Home says you are training, and
     the next real session either resumes a ghost or starts beside it.

     Forty minutes of nothing, which is long enough that no set of rest reaches
     it and short enough to catch somebody who left the gym. It asks rather
     than deciding: ending a session nobody meant to end loses the sets. */
  var IDLE_MS = 40 * 60 * 1000;
  var idleTimer = null;
  function touchIdle() {
    if (idleTimer) clearTimeout(idleTimer);
    if (S.over || !S.exercises.length) return;
    idleTimer = setTimeout(function () {
      if (S.over || S.overlay === 'idle') return;
      S.overlay = 'idle';
      paint();
    }, IDLE_MS);
  }

  function idleHTML() {
    var mins = Math.round(IDLE_MS / 60000);
    return '<div class="scrim" data-act="idle-stay" data-testid="idle-scrim" role="presentation"></div>' +
      '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="idle-t" data-testid="idle-dialog">' +
        '<h2 class="t-section" id="idle-t">Still training?</h2>' +
        '<p class="t-detail muted mt-2">Nothing has been logged for ' + mins + ' minutes. ' +
          n(doneSets()) + ' sets are saved either way \u2014 this is only about whether the ' +
          'session stays open.</p>' +
        '<div class="addrow">' +
          '<button class="btn btn--secondary" type="button" data-act="idle-stay" data-testid="idle-stay">' +
            'No, continue</button>' +
          '<button class="btn btn--primary" type="button" data-act="idle-finish" data-testid="idle-finish">' +
            'End and review</button>' +
        '</div>' +
      '</div>';
  }

  function discardHTML() {
    return '<div class="scrim" data-act="close" data-testid="discard-scrim" role="presentation"></div>' +
      '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dc-t" data-testid="discard-dialog">' +
        '<h2 class="t-section" id="dc-t">Throw this workout away?</h2>' +
        '<p class="t-detail muted mt-2">' + n(doneSets()) + ' logged ' +
          LKPlural(doneSets(), 'set') + ' will be lost. This cannot be undone.</p>' +
        '<div class="addrow">' +
          '<button class="btn btn--secondary" type="button" data-act="close" data-testid="discard-cancel">Keep training</button>' +
          '<button class="btn btn--danger-solid" type="button" data-act="discard-confirm" data-testid="discard-confirm">Discard</button>' +
        '</div>' +
      '</div>';
  }

  function overlayHTML() {
    if (S.pad) return padHTML();
    switch (S.overlay) {
      case 'tools': return toolsHTML();
      case 'sheet': return exSheetHTML();
      case 'detail': return detailHTML();
      case 'plates': return platesHTML();
      case 'rest': return restSettingsHTML();
      case 'block': return blockModalHTML();
      case 'pickset': return pickSetHTML();
      case 'equip': return equipHTML();
      case 'idle': return idleHTML();
      case 'addex': return addExHTML();
      case 'discard': return discardHTML();
      default: return '';
    }
  }

  function toastHTML() {
    if (!S.toast) return '';
    var t = S.toast;
    return '<div class="toast" role="status" data-testid="toast">' +
      '<span class="toast__body">' + esc(t.text) + '</span>' +
      (t.action ? '<button class="toast__action" type="button" data-act="toast-action" data-testid="toast-action">' + esc(t.action) + '</button>' : '') +
    '</div>';
  }

  /* =============================================================
     Paint. Regions only, scroll and focus preserved: this screen is
     edited mid-set and must never jump under the thumb.
     ============================================================= */
  var hdr = document.getElementById('hdr');
  var restSlot = document.getElementById('rest-slot');
  var body = document.getElementById('body');
  var tabs = document.getElementById('tabs');
  var overlay = document.getElementById('overlay');
  var toastSlot = document.getElementById('toast-slot');
  var live = document.getElementById('live');
  var screen = document.getElementById('screen');

  /* Every region goes through the shared reconciler in app.js, which is
     loaded in <head> on this screen and inlined into the demo. Nothing is
     rebuilt: the caret, the scroll and the running animations survive. */
  function put(el, html) { LKPatch(el, html); }

  /* What was rendered last time, so an overlay that has just appeared can be
     told from one that was already there. Reading the state instead always
     says it was already open, because the caller sets it and then paints. */
  var renderedOverlay = false;

  /* The record the rest of the app reads. Written from paint rather than
     from each action, because a session that is on screen but not in the
     record is exactly the bug this file used to have: eighteen actions
     change the session and remembering to write in all eighteen is a thing
     a person forgets once and loses a workout to. Painting is the one thing
     they all do. */
  /* The one clock. The record's startedAt is the truth once a session is
     running, and this screen reads it rather than counting: a counter of its
     own restarted at the fixture's 21:01 on every load, so the header and the
     shelf for the same session could sit four hours apart on screen. */
  function elapsedSec() {
    var r = window.LKSession && LKSession.get();
    return r ? Math.floor(r.elapsed / 1000) : (S.elapsed || 0);
  }

  function record() {
    if (!window.LKSession) return;
    /* Finish and discard both end the session. Finish leaves the exercises on
       screen, so without this the very next paint saw a full workout with no
       record and started a brand new one -- every screen in the app then
       offered to Resume the workout you had just finished. */
    if (S.over) { return; }
    if (S.state === 'empty') { LKSession.end(); return; }
    /* AN EMPTY QUICK SESSION IS STILL A SESSION. Skip setup starts one
       with nothing in it on purpose -- you add lifts as you reach the
       machines -- and ending the record because it is empty means no
       resume shelf, no idle reminder, and a locked phone losing the fact
       that you are training at all. A session with no exercises and no
       quick flag is the demo's empty state, which does end. */
    if (!S.exercises.length && !S.quick) { LKSession.end(); return; }
    /* Seeded from the elapsed time already on screen the first time, so a
       session opened twenty-one minutes in does not restart its clock at
       zero. After that the record's own start time is the truth and this
       screen reads it rather than counting. */
    if (!LKSession.get()) {
      LKSession.start({
        name: S.name,
        startedAt: Date.now() - (S.elapsed || 0) * 1000,
        done: doneSets(),
        total: totalSets()
      });
      return;
    }
    /* ONLY WHEN SOMETHING CHANGED. update() stamps updatedAt, and this ran
       on every paint -- so merely opening the app refreshed a session left
       running five hours ago, and the three-hour stale guard could never
       fire. Home offered an ordinary Resume for an abandoned workout, and
       finishing it wrote 300 minutes into history. updatedAt is meant to
       say when work last happened, not when the screen last drew. */
    var nowName = S.name, nowDone = doneSets(), nowTotal = totalSets();
    if (lastWrote && lastWrote.name === nowName &&
        lastWrote.done === nowDone && lastWrote.total === nowTotal) return;
    lastWrote = { name: nowName, done: nowDone, total: nowTotal };
    LKSession.update({ name: nowName, done: nowDone, total: nowTotal });
  }
  var lastWrote = null;
  /* Set when Finish hands this session to Review; see lk:enter. */
  var handedOff = false;

  /* THE SETS, NOT ONLY THE CLOCK. LKSession's record carries the name, the
     start, and how many sets of how many are done -- it is the shelf's
     record, and every screen in the app reads it. What it cannot carry is
     the work: reload the log mid-session and the header kept counting from
     the right minute while every weight, rep and tick went back to the
     fixture. The rows live here, under the log's own key, tied to the
     record's start time so they can never be pasted onto a different
     session. LKSession itself is shared and was left alone. */
  var ROWS_KEY = 'lk_liveSessionRows';

  function persistRows() {
    if (!window.LKStore) return;
    if (S.over || !S.exercises.length) { LKStore.remove(ROWS_KEY); return; }
    var r = window.LKSession && LKSession.get();
    if (!r) return;
    LKStore.set(ROWS_KEY, {
      startedAt: r.startedAt,
      name: S.name,
      state: S.state,
      exercises: S.exercises,
      blocks: S.blocks,
      /* Auto-rest and the rest length are per-session: turning them off
         mid-workout should survive a reload of that workout. Partials
         visibility is not -- it is a preference Settings owns, and storing it
         per session meant a switch flipped in Settings could never reach a
         phone that had ever opened this screen. */
      restEnabled: S.restEnabled,
      restSeconds: S.restSeconds,
      /* The split day this came from goes with the rows. Left out, a reload
         mid-Push came back with every set intact and no memory of being a
         Push day at all, so finishing it asked nothing. */
      source: S.source
    });
  }

  function restoreRows() {
    if (!window.LKStore || !window.LKSession) return false;
    var live = LKSession.get();
    if (!live) { LKStore.remove(ROWS_KEY); return false; }
    var rows = LKStore.get(ROWS_KEY, null);
    if (!rows || !rows.exercises || !rows.exercises.length) return false;
    /* A different workout's rows are not this workout's rows. */
    if (rows.startedAt !== live.startedAt) return false;
    S.name = rows.name || S.name;
    /* A SESSION SAVED BY THE TWO-ROW BUILD IS STILL A SESSION. It is the
       one place old per-side rows have to change shape, because the screen
       they are coming back to draws one row per set. foldSides keeps every
       figure either row was carrying. */
    S.exercises = (rows.exercises || []).map(foldSides);
    S.blocks = rows.blocks || [];
    if (rows.restEnabled !== undefined) S.restEnabled = rows.restEnabled;
    if (rows.restSeconds !== undefined) S.restSeconds = rows.restSeconds;
    S.source = rows.source || null;
    /* The note belongs to the exercise, not to the session's saved rows. A
       note typed mid-workout was written to lk_exNotes and then read back
       over by the rows this same workout had saved a moment earlier, so it
       came back as whatever the seed said. */
    if (window.LKStore) {
      var kept = LKStore.get('lk_exNotes', {}) || {};
      S.exercises.forEach(function (e) {
        if (e.id && kept[e.id] !== undefined) e.note = kept[e.id];
      });
    }
    /* The state has to say a session is running, or the very first paint
       after the reload ends the record this function just restored from --
       record() reads S.state, and in the product build there is no seed, so
       it starts at 'empty'. Restoring the rows and then deleting the record
       is how a reload mid-workout came back to a blank screen. */
    S.state = 'mid-session';
    S.over = false;
    S.elapsed = Math.max(0, Math.floor((Date.now() - live.startedAt) / 1000));
    return true;
  }

  function paint() {
    /* A PAINT MUST NOT LAND ON A LIFTED ROW.

       LKPatch syncs attributes, and `style` is an attribute: the markup
       it is handed carries no style, so the inline translate, scale and
       z-index the drag wrote on the card get removed. The card snaps
       back into its slot, the neighbours snap back too, and the drag
       carries on writing transforms against geometry that no longer
       describes anything on screen. The clock in this file calls paint()
       once a second, so this was not a rare case -- it happened in the
       middle of most drags.

       v6 could not tell us about this: it had no reconciler, and the row
       it dragged was position:fixed and out of the tree entirely. So the
       repaint waits. Nothing on this screen is urgent enough to be worth
       tearing a gesture for: the timers write their own text outside
       paint, and the landing paints unconditionally, so whatever was
       skipped here is on screen a moment later. */
    if (DRAG) return;
    record();
    syncRest();
    persistRows();
    var hadOverlay = renderedOverlay;
    var opener = document.activeElement && document.activeElement.dataset
      ? document.activeElement.dataset.testid : null;

    screen.setAttribute('data-state', S.state);
    put(hdr, headerHTML());
    put(restSlot, restHTML());
    put(body, bodyHTML());
    put(tabs, tabsHTML());
    put(overlay, overlayHTML());
    put(toastSlot, toastHTML());

    if (S.pop) {
      var popped = document.querySelector('[data-testid="' + S.pop + '"]');
      S.pop = null;
      if (popped) {
        popped.classList.remove('done--pop');
        /* Next frame, or the class is added inside the same style pass the
           element was patched in and the animation never restarts. */
        requestAnimationFrame(function () { popped.classList.add('done--pop'); });
      }
    }

    var nowOverlay = !!(S.overlay || S.pad);
    renderedOverlay = nowOverlay;
    syncAddexFigure();

    /* Opening takes focus to the way OUT, never to the destructive control.
       Closing puts it back on whatever opened the thing, so the next Tab
       carries on from where the person was rather than at the top of the
       document. */
    if (nowOverlay && !hadOverlay) {
      if (opener) lastOpener = opener;
      var safe = overlay.querySelector('button[data-act="close"], button[data-act="pad-cancel"]') ||
                 overlay.querySelector('.sheet button, .dialog button');
      if (safe) safe.focus({ preventScroll: true });
    } else if (!nowOverlay && hadOverlay) {
      refocus(lastOpener);
      lastOpener = null;
    }
  }

  var lastOpener = null;
  function say(msg) { live.textContent = msg; }

  /* Focus goes back to the control that opened the thing being closed. A
     sheet that closes onto <body> restarts the next Tab at the top of the
     document, and for anybody on a keyboard or VoiceOver that is the whole
     screen to walk again. Deferred a frame because the caller closes the
     overlay by re-rendering after this returns. */
  function refocus(testid) {
    if (!testid) return;
    requestAnimationFrame(function () {
      var el = document.querySelector('[data-testid="' + testid + '"]');
      if (el && !el.disabled) el.focus({ preventScroll: true });
    });
  }

  /* =============================================================
     Behaviour
     ============================================================= */
  /* The rest is a deadline held by LKRest, not a number counted down here,
     so a locked phone or a killed tab cannot make it wrong. syncRest() is
     the one place that copies it back into S for rendering. */
  function startRest(label) {
    if (!S.restEnabled) return;
    if (window.LKRest) LKRest.start(S.restSeconds, label || S.name || 'Rest');
    syncRest();
  }

  function stopRest() {
    if (window.LKRest) LKRest.stop();
    S.restRunning = false;
    S.restLeft = 0;
  }

  /* Reads the deadline back. Returns true when the rest ran out since the
     last look -- including while the app was shut, which is the whole
     point of storing an end time instead of a remainder. */
  function syncRest() {
    if (!window.LKRest) return false;
    var ended = LKRest.justEnded();
    S.restRunning = LKRest.running();
    S.restLeft = LKRest.left();
    return ended;
  }

  /* A toast says what happened and gets out of the way; it never sits
     on top of Add Exercise waiting to be dismissed. */
  var toastTimer = null;
  /* `fn` is what the action button does. It used to take a label and nothing
     else, and the only handler for the button dismissed the toast -- so the
     Undo on "Exercise removed." threw the exercise away for good under a
     control whose whole job was to bring it back, and the Retry on the error
     state did nothing either. A toast that offers an action now has to be
     handed one. */
  function toast(text, kind, action, fn) {
    S.toast = { text: text, kind: kind || 'info', action: action || null, fn: fn || null };
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; paint(); }, 4000);
  }

  /* AT TOUCH-DOWN, NOT AT CLICK. A click arrives after the finger lifts,
     and on a phone that is a tenth of a second after the key was hit and
     after any scroll the browser was still deciding about. The pad is the
     one control in this screen somebody hits four times in two seconds,
     so it answers the moment it is touched. The click that follows is
     dropped, or every digit would be entered twice. */
  var padFastAt = 0;
  var PAD_ACTS = { 'pad-key': 1, 'pad-del': 1, 'pad-step': 1 };
  document.addEventListener('pointerdown', function (ev) {
    if (!S.pad) return;
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    var t = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!t || !PAD_ACTS[t.getAttribute('data-act')]) return;
    if (!padEdit(t.getAttribute('data-act'), t)) return;
    padFastAt = Date.now();
    touchIdle();
    S.tapCount++;
    buzz(6);
  });

  document.addEventListener('click', function (ev) {
    /* Any tap on the screen is somebody still here. The clock restarts on
       every action rather than on a set being logged, because reading the
       plate calculator between heavy singles is training too. */
    touchIdle();
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    var e = Number(t.getAttribute('data-ex'));
    var i = Number(t.getAttribute('data-set'));
    S.tapCount++;

    /* Remember what was pressed, so whatever it opens can hand focus back to
       it. Only a control outside the overlay counts: a button inside a sheet
       is not what the sheet was opened from. */
    if (!t.closest('#overlay') && t.dataset.testid) lastOpener = t.dataset.testid;

    switch (act) {
      /* ---- editing any set, not only the current one ---- */
      case 'edit':
        S.pad = openPadFor(e, i, t.getAttribute('data-field'));
        S.toast = null;
        break;
      case 'pad-key':
      case 'pad-del':
      case 'pad-step':
        /* The finger already did this on the way down. */
        if (Date.now() - padFastAt < 900) return;
        /* A keyboard has no pointerdown, so Enter and Space land here and
           take the same cheap path. */
        if (padEdit(act, t)) return;
        break;
      case 'pad-done': {
        var f = S.pad.field, ex = S.pad.ex, ix = S.pad.set;
        lastOpener = 'cell-' + ex + '-' + ix + '-' + f;
        var spoken = fieldWord(ex, f);
        padCommit();
        say('Set ' + (ix + 1) + ' ' + spoken + ' saved');
        break;
      }
      case 'pad-cancel': {
        lastOpener = S.pad ? 'cell-' + S.pad.ex + '-' + S.pad.set + '-' + S.pad.field : lastOpener;
        S.pad = null;
        break;
      }

      case 'rir':
        break;

      case 'done': {
        var st = S.exercises[e].sets[i];
        /* WHAT THE CELL SHOWS IS WHAT THE TICK COMMITS. A ghosted figure in
           an empty cell has always been the thing a tick turns into a
           logged one, and a prescribed rep count is now one of those
           figures -- so a lifter looking at a cell reading 10 and ticking
           it would have been told to "put reps in set 1 first" about a
           number they could see. Only a plain number: a range has no single
           value to commit and AMRAP has none at all, so those still need a
           figure typed, which is the honest answer to "how many did you
           do". And a prescription REPLACES last session in that cell rather
           than sitting beside it: showing 8-12 and quietly logging last
           week's 8 would be the app choosing for the lifter, which is the
           exact failure a visible ghost figure exists to avoid. */
        var planText = st.warm ? '' : (S.exercises[e].planReps || '');
        var ghostReps = planText
          ? (/^[0-9]+$/.test(planText) ? parseInt(planText, 10) : null)
          : st.prevReps;
        if (!st.done) {
          /* Nothing to log. The tick used to turn a row of dashes into a
             counted set of 0 kg, which inflated the header, the shelf and the
             discard warning by tapping. */
          var fillKg = st.kg !== null ? st.kg : st.prevKg;
          var fillReps = st.reps !== null ? st.reps : ghostReps;
          if (fillKg === null || fillKg === undefined || fillReps === null || fillReps === undefined) {
            say('Set ' + (i + 1) + ' needs a weight and reps first.');
            toast('Put a weight and reps in set ' + (i + 1) + ' before logging it.');
            break;
          }
        }
        st.done = !st.done;
        if (st.done) {
          if (st.kg === null) st.kg = st.prevKg;
          if (st.reps === null) st.reps = ghostReps;
          /* THE RIGHT SIDE IS COMMITTED WITH THE LEFT. Both cells ghost the
             same figure, so a tick that filled one and left the other empty
             would silently log half the work -- the set would read 10 reps
             on the left and a dash on the right, and the volume would be
             half of what the lifter did. */
          if (S.exercises[e].unilateral && st.repsR == null) st.repsR = st.reps;
          startRest(S.exercises[e] && S.exercises[e].name);
          /* Felt as well as seen. One short pulse for a set, two for a
             record, and the tick pops under the thumb. */
          buzz(12);
          S.pop = 'done-' + e + '-' + i;
          /* The moment a best is beaten is the moment to say so. A 100 kg
             set against a 72.5 kg best produced "Set 4 logged" and nothing
             else, and the record only appeared days later on another
             screen. */
          var pr = prBeaten(S.exercises[e], st);
          /* THE FIRST TIME IS ALSO A RECORD. prBeaten returns null when
             there is nothing to beat, which is right for the banner -- you
             cannot go "past" a mark that does not exist -- but it was also
             what decided whether to WRITE one. So on a new account the
             first set of every lift was never stored, lk_prs stayed empty,
             Profile read "0 Records" forever, and a record only ever
             appeared once you beat one that was never set. Announcing and
             recording are different questions. */
          if (!pr && !st.warm && st.kg !== null && prReps(st) != null &&
              S.exercises[e].id && !bestFor(S.exercises[e].id)) {
            recordPR(S.exercises[e], st);
            st.pr = true;
            st.prText = '';
            say(S.exercises[e].name + ', first set logged for this lift.');
          } else if (pr) {
            /* WHAT IT BEAT, read BEFORE the new row is written -- once
               recordPR has run, the best stored for this lift is this set.
               Review needs it to name the mark, and without it Review could
               not claim the record at all: it re-derives records from lk_prs,
               which by then already contains the set it is looking at. */
            var beat = bestFor(S.exercises[e].id, prReps(st)) || bestFor(S.exercises[e].id);
            if (beat) st.prBeat = { kg: beat.w, reps: beat.r, date: beat.date };
            recordPR(S.exercises[e], st);
            /* On the set, so the banner and the card badge can be drawn from
               the session itself and outlive the toast. */
            st.pr = true;
            st.prText = pr;
            buzz([12, 60, 24]);
            toast('All-time PR. ' + pr, 'info');
            say(S.exercises[e].name + ', personal best. ' + pr);
          } else {
            say('Set ' + (i + 1) + ' logged. ' + LKCount(doneSets(), 'set') + ' this session.');
          }
        } else {
          S.restRunning = false;
          /* Reopening a set takes back what ticking it claimed. The record
             row already written stands -- it was lifted -- but this session
             stops announcing it. */
          st.pr = false; st.prText = ''; st.prBeat = null;
          say('Set ' + (i + 1) + ' reopened');
        }
        break;
      }
      case 'partial': {
        var ps = S.exercises[e].sets[i];
        ps.partials = ps.partials >= 9 ? 0 : ps.partials + 1;
        say('Set ' + (i + 1) + ': ' + ps.partials + ' partials');
        break;
      }
      case 'addset': {
        var lastSet = S.exercises[e].sets[S.exercises[e].sets.length - 1];
        S.exercises[e].sets.push(set(null, null, { prevKg: lastSet ? lastSet.kg || lastSet.prevKg : null, prevReps: lastSet ? lastSet.prevReps : null, rir: lastSet ? lastSet.rir : 2 }));
        say('Set added to ' + S.exercises[e].name);
        break;
      }
      /* One Add Set for a pair, because a superset is performed in rounds:
         adding a round to one half and not the other is not a thing that
         happens on the gym floor. */
      case 'addset-both': {
        [e, e + 1].forEach(function (ix) {
          var ex2 = S.exercises[ix];
          if (!ex2) return;
          var ls = ex2.sets[ex2.sets.length - 1];
          ex2.sets.push(set(null, null, { prevKg: ls ? ls.kg || ls.prevKg : null,
                                          prevReps: ls ? ls.prevReps : null,
                                          rir: ls ? ls.rir : 2 }));
        });
        say('A set added to both halves of the superset.');
        break;
      }
      case 'airec': {
        S.toast = null;
        {
          var target = null;
          for (var k = 0; k < S.exercises[e].sets.length; k++) { if (!S.exercises[e].sets[k].done) { target = k; break; } }
          if (target === null) { toast('Every set in this exercise is logged.'); paint(); return; }
          var s2 = S.exercises[e].sets[target];
          /* A suggestion, on the set, beside the record -- never written into
             prevKg. Writing it there made the app report a weight nobody had
             lifted as what was lifted last time, and every further tap added
             another 2.5 kg to that false record with no ceiling. The base is
             the last session's top set, so the suggestion is the same figure
             on every tap rather than an escalation. */
          var base = s2.prevKg || (S.exercises[e].sets.reduce(function (a, x) {
            return Math.max(a, x.prevKg || 0);
          }, 0)) || 20;
          s2.suggestKg = Math.round((base + 2.5) * 2) / 2;
          s2.suggestReps = s2.prevReps || 8;
          toast('Suggested ' + trim(toDisplay(s2.suggestKg, unitAt(e))) + ' ' + unitLabel(unitAt(e)) + ' x ' +
                s2.suggestReps + ' for set ' + (target + 1) + '. Tap the cell to take it.',
                'info', 'Take it', function () {
                  s2.kg = s2.suggestKg; s2.reps = s2.suggestReps;
                  paint();
                  say('Set ' + (target + 1) + ' set to the suggestion.');
                });
          paint();
        }
        return;
      }

      /* ---- exercise card ---- */
      case 'grip':
        /* A drag ends with a click on whatever is under the finger. Without
           this, finishing a drag immediately lifted some other card. */
        if (Date.now() - dragEndedAt < 350) return;
        S.liftedEx = S.liftedEx === e ? -1 : e;
        say(S.liftedEx === e
          ? 'Reordering ' + S.exercises[e].name + '. Use Up and Down, or drag the grip.'
          : 'Order kept');
        break;
      case 'move': {
        var dir = Number(t.getAttribute('data-dir'));
        if (moveEx(e, e + dir)) {
          S.liftedEx = e + dir;
          say(S.exercises[e + dir].name + ' moved to position ' + (e + dir + 1) +
              ' of ' + S.exercises.length + '.');
          refocus('grip-' + (e + dir));
        }
        break;
      }
      case 'move-done': S.liftedEx = -1; say('Order kept'); refocus('grip-' + e); break;
      /* THE SHEET IS HELD OPEN, NOT TAPPED OPEN. It opened on a plain tap of
         the exercise name -- a 44-tall target sitting directly above the set
         grid, in the middle of a screen people jab at with one hand between
         sets -- so it fired by accident, and the gesture the shipped app
         taught was gone. A short press now says how to open it instead of
         opening it, which is the one thing a tap can do that is neither a
         surprise nor a dead control. Enter and Space still open it outright,
         because a keyboard cannot hold. */
      case 'exsheet':
        if (heldOpenAt && Date.now() - heldOpenAt < 600) break;   /* the hold already opened it */
        say('Hold ' + S.exercises[e].name + ' to open its options.');
        toast('Hold the name to open options for ' + S.exercises[e].name + '.');
        break;
      case 'exact': {
        var key = t.getAttribute('data-key');
        var cur = S.exercises[S.overlayEx];
        if (key === 'info') { S.overlay = 'detail'; break; }
        if (key === 'unit') {
          /* An override, stored against the lift. Nothing already logged
             changes: the rows are kilograms and stay kilograms, and only the
             reading of them moves. */
          var wasU = unitOf(cur);
          var nextU = wasU === S.unit ? (S.unit === 'kg' ? 'lb' : 'kg') : null;
          cur.unit = nextU;
          if (cur.id) setEquip(cur.id, { unit: nextU });
          S.overlay = null;
          toast(nextU
            ? cur.name + ' reads in ' + unitLabel(nextU) + '. Every other lift stays in ' + unitLabel(S.unit) + '.'
            : cur.name + ' is back in ' + unitLabel(S.unit) + ', like the rest of the session.');
          break;
        }
        if (key === 'warmup') {
          /* A ramp, not the same set twice. Pressing this twice put two
             identical 50% warm-ups on the exercise, which is not how anybody
             warms up: the rungs are 50, 70 and 85 per cent of the working
             weight, inserted in order, with the reps coming down as the
             weight goes up. Past three it stops, because a fourth warm-up on
             one lift is a different session. */
          var RAMP = [[0.5, 10], [0.7, 6], [0.85, 3]];
          var warms = cur.sets.filter(function (x) { return x.warm; }).length;
          if (warms >= RAMP.length) {
            S.overlay = null;
            toast('Three warm-ups is the most this adds. Edit one, or add a plain set.');
            break;
          }
          var work = null;
          cur.sets.forEach(function (x) {
            if (x.warm || work !== null) return;
            work = x.kg !== null ? x.kg : x.prevKg;
          });
          if (work === null || work === undefined) work = 20;
          var rung = RAMP[warms];
          var at = 0;
          /* After the warm-ups already there, before the first working set,
             so the ramp reads in the order it is performed. */
          while (at < cur.sets.length && cur.sets[at].warm) at++;
          cur.sets.splice(at, 0, set(Math.round(work * rung[0] * 2) / 2, rung[1],
                                     { warm: true, rir: 4 }));
          S.overlay = null;
          toast('Warm-up at ' + trim(toDisplay(Math.round(work * rung[0] * 2) / 2, unitOf(cur))) + ' ' +
                unitLabel(unitOf(cur)) + ' added.');
          break;
        }
        /* Any set, not only the last. delset pops, so shedding the second of
           four meant deleting two and retyping one. */
        if (key === 'equip') { S.overlay = 'equip'; break; }
        if (key === 'delrow') {
          if (cur.sets.length <= 1) { S.overlay = null; toast('An exercise keeps at least one set.'); break; }
          S.overlay = 'pickset';
          break;
        }
        if (key === 'delset') {
          if (cur.sets.length <= 1) { S.overlay = null; toast('An exercise keeps at least one set.'); break; }
          var lastIx = cur.sets.length - 1, goneSet = cur.sets.pop();
          S.overlay = null;
          toast('Last set removed from ' + cur.name + '.', 'info', 'Undo', function () {
            cur.sets.splice(lastIx, 0, goneSet);
            paint();
            say('Set ' + (lastIx + 1) + ' is back.');
          });
          break;
        }
        if (key === 'remove') {
          var at = S.overlayEx, gone = S.exercises.splice(at, 1)[0];
          S.overlay = null;
          toast('Exercise removed.', 'info', 'Undo', function () {
            S.exercises.splice(at, 0, gone);
            paint();

        }
        /* Swap REPLACES. It opened the add picker, which pushes -- so

           one beside it: five exercises became six. S.swapAt records which
           one is being replaced, and the picker reads it. */
        if (key === 'swap') {
          S.swapAt = S.overlayEx; S.addexAll = false; S.addexQ = ''; S.addexN = ADDEX_PAGE;
          /* REPLACE OPENS ON THE BODY TOO, with the part the current lift
             trains already lit. Most replacements stay in the same place
             -- another chest press for a chest press -- so that is one
             tap; going somewhere else is the same tap on a different
             muscle, rather than a search field over the whole catalogue. */
          S.addexGid = (window.LKExercises && LKExercises.gidOf)
            ? LKExercises.gidOf(S.exercises[S.overlayEx] || null) : null;
          S.overlay = 'addex'; break;
        }
        if (key === 'superset') {
          /* A superset is with the NEXT exercise, so the last one has
             nothing to pair with and the sheet used to say it had. */
          if (!cur.superset && !S.exercises[S.overlayEx + 1]) {
            S.overlay = null;
            toast('Nothing after ' + cur.name + ' to superset it with. Add the other exercise first.');
            break;
          }
          cur.superset = !cur.superset;
          S.overlay = null;
          toast(cur.superset
            ? 'Supersetted with ' + S.exercises[S.overlayEx + 1].name + '.'
            : 'Superset off.');
          break;
        }
        if (key === 'unilateral') {
          cur.unilateral = !cur.unilateral;
          /* The flag alone changed nothing on screen. Turning it on gives
             every set a second reps cell, beside the first one, on the same
             row: one weight, one RIR, an L and an R. It used to split each
             set into two whole rows and that is what the owner asked to be
             undone.

             Turning it on copies what is already logged across, because a
             set that read 10 and suddenly reads 10 and a dash looks like
             half of it has been lost. Turning it off drops the right-hand
             figures, which the toast says out loud -- it is a deliberate
             act with a stated consequence, not an upgrade quietly throwing
             numbers away. */
          if (cur.unilateral) {
            cur.sets.forEach(function (st) {
              delete st.side;
              if (st.repsR == null) st.repsR = st.reps;
            });

            foldSides(cur);

            cur.sets.forEach(function (st) {
              delete st.repsR; delete st.kgR; delete st.rirR;
            });
          }
          S.overlay = null;
          toast(cur.unilateral
            ? 'Left and right on one row now, sharing the weight and the RIR.'
            : 'Tracked as one side. The right-hand figures are gone.');
          break;
        }
        S.overlay = null;
        break;
      }

      /* ---- header ---- */
      case 'tools': S.overlay = 'tools'; break;
      case 'tool': {
        var tool = t.getAttribute('data-tool');
        if (tool === 'unit') { setUnit(S.unit === 'kg' ? 'lb' : 'kg'); S.overlay = null; toast('Showing ' + unitLabel() + ' everywhere.'); }
        else S.overlay = tool;
        break;
      }
      case 'discard': S.overlay = 'discard'; break;
      /* Discard DISCARDS. It toasted "Workout discarded." and left all five
         exercises and every set on screen, which is the worst possible
         outcome for a destructive confirm: the reader believes their session
         is gone and it is not. The session empties and the screen says so;
         Undo is not offered, because the dialog already asked. */
      /* AND IT LEAVES. Emptying the screen was right; staying on it was
         not. Discarding left the reader on a workout log with no workout
         in it, still offering Discard and Finish for a session that no
         longer existed -- and pressing Finish there, which is what a
         person does when a screen has nothing on it and they want out,
         opened Review on an empty session, where the back button and
         "Back to workout" only toasted and the tab bar is not drawn. That
         is a dead end with no way back to the app.

         Discard means "I am not doing this workout", so it goes where not
         doing a workout leaves you: Train. */
      case 'discard-confirm':
        S.over = true;
        S.overlay = null;
        S.exercises = [];
        S.blocks = [];
        S.elapsed = 0;
        stopRest();
        if (window.LKSession) LKSession.end();
        if (window.LKStore) LKStore.remove('lk_lastSession');
        toast('Workout discarded.');
        paint();
        LKGo('train');
        return;
      /* Finish leaves for Review; in the demo the router takes the click
         first. It used to toast "Opening review." and stay here. */
      /* The session is over the moment Finish is pressed. Review reads the
         numbers it shows from the workout, not from this record, so ending
         it here is what stops a finished workout following you around the
         app on a shelf that says Resume. */
      case 'finish':
        S.over = true;
        /* The rest belonged to the workout. Leaving the deadline behind
           meant the strip came back on the next session that opened this
           screen, counting down from a rest nobody is taking. */
        stopRest();
        handedOff = true;
        handOff();
        if (window.LKSession) LKSession.end();
        LKGo('review');
        break;

      /* ---- rest ---- */
      case 'rest-add':
        if (window.LKRest) LKRest.add(30);
        syncRest();
        say('Rest extended to ' + clock(S.restLeft));
        break;
      case 'rest-skip': stopRest(); say('Rest skipped'); break;
      case 'rest-toggle':
        S.restEnabled = !S.restEnabled;
        if (!S.restEnabled) stopRest();
        break;
      case 'rest-set':
        S.restSeconds = Number(t.getAttribute('data-secs'));
        if (S.restRunning && window.LKRest) LKRest.setTo(S.restSeconds);
        syncRest();
        break;

      /* ---- plate calculator ---- */
      case 'plate-add': S.plate.added.push(Number(t.getAttribute('data-plate'))); break;
      case 'plate-bar': S.plate.bar = Number(t.getAttribute('data-bar')); break;
      case 'plate-side': S.plate.perSide = t.getAttribute('data-side') === '1'; break;
      case 'plate-undo': S.plate.added.pop(); break;
      case 'plate-clear': S.plate.added = []; break;
      case 'plate-apply': {
        var target2 = nextUndone();
        if (target2) {
          var total = S.plate.bar + S.plate.added.reduce(function (a, b) { return a + b; }, 0) * 2;
          S.exercises[target2.ex].sets[target2.set].kg = total;
          S.overlay = null;
          var au = unitAt(target2.ex);
          toast(trim(toDisplay(total, au)) + unitLabel(au) + ' applied to set ' + (target2.set + 1) + '.');
        }
        break;
      }

      /* ---- add exercise, block ---- */
      case 'addex':
        S.overlay = 'addex';
        S.addexN = ADDEX_PAGE;
        /* Opens on the body, every time. A group left over from the last
           lift added is not an answer to this one. */
        S.addexGid = null;
        S.addexSub = null;
        S.addexQ = '';
        break;
      /* ---- the picker's body ---- */
      case 'addex-group':
        S.addexGid = t.getAttribute('data-gid') || null;
        S.addexSub = null;
        S.addexN = ADDEX_PAGE;
        break;
      case 'addex-back':
        S.addexGid = null;
        S.addexSub = null;
        S.addexN = ADDEX_PAGE;
        break;
      /* Two taps in, two taps out: the part first, then the muscle. */
      case 'addex-whole':
        S.addexSub = null;
        S.addexN = ADDEX_PAGE;
        break;
      case 'addex-view': {
        var wantView = t.getAttribute('data-view') === 'back' ? 'back' : 'front';

      case 'addex-more': S.addexN = (S.addexN || ADDEX_PAGE) + ADDEX_PAGE; break;

        if (S.swapAt !== null && S.exercises[S.swapAt]) {

             again" -- the weights already entered are the reader's work and
             throwing them away to change a name would be the worse bug. */
          var was = S.exercises[S.swapAt];
          was.id = pick.id; was.name = pick.name; was.muscle = pick.muscle;
          /* The sets stay; the OTHER lift's history does not. A swapped-in
             machine press kept the cable fly's "last session 15 kg", and
             because ticking a blank set commits prevKg, one stray tap logged

          was.sets.forEach(function (st) {
            st.prevKg = null; st.prevReps = null; st.suggestKg = null; st.suggestReps = null;
          });
          S.overlay = null; S.addexQ = '';
          var from = S.swapAt; S.swapAt = null;
          toast('Swapped to ' + pick.name + '.', 'info');
          break;
        }
        var keptNote = '';
        if (window.LKStore) {
          var allN = LKStore.get('lk_exNotes', {}) || {};
          if (allN[pick.id]) keptNote = allN[pick.id];
        }
        S.exercises.push({ id: pick.id, name: pick.name, muscle: pick.muscle, note: keptNote, sets: [set(null, null, {}), set(null, null, {}), set(null, null, {})] });

      }
      case 'block': S.overlay = 'block'; break;

         control that is already on every row. A menu for a four-way choice
         is a sheet to open, read and dismiss for something that takes a
         tap. */
      case 'rest-custom': {
        var mf = document.getElementById('rest-min');
        var sf = document.getElementById('rest-sec');
        var mins = mf ? parseInt(mf.value, 10) : NaN;
        var secs0 = sf ? parseInt(sf.value, 10) : NaN;
        if (isNaN(mins)) mins = 0;
        if (isNaN(secs0)) secs0 = 0;
        if (mins < 0 || secs0 < 0 || secs0 > 59) {

      }
      case 'set-kind': {

        var kex = S.exercises[ke], ks = kex.sets[ki];

        /* A DROP SET IS THE SET ABOVE IT, LIGHTER. That is the whole reason
           the state exists, and the weight was left to be typed by hand in
           the one moment nobody has a free hand: straight off a set, with the
           bar still loaded. Three quarters of the preceding set's load,
           rounded to the half, and only into a row nobody has typed into --
           a figure already entered is the lifter's and is never overwritten.
           An undone row can be re-filled; a logged one cannot. */
        if (next === 'drop' && !ks.done) {
          var above = null;
          for (var kk = ki - 1; kk >= 0; kk--) {
            var cand = kex.sets[kk];

            if (load !== null && load !== undefined) { above = { kg: load, reps: cand.reps }; break; }
          }
          if (above) {
            ks.kg = Math.round(above.kg * 0.75 * 2) / 2;
            if (ks.reps === null || ks.reps === undefined) ks.reps = above.reps;
            var du = unitOf(kex);
