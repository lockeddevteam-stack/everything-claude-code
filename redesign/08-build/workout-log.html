<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOCKED — Workout Log</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="app.js"></script>
<script src="chrome.js"></script>
</head>
<body>
<!--
  WORKOUT LOG — a RESTORATION with four measured fixes.

  The owner uses this screen and asked for restraint: "good enough for
  me, improve it but don't prioritise it." An earlier pass rebuilt it
  into a different screen — one exercise at a time, a docked pad, no
  Partials, no AI Rec, no Add Set, no card list. That is reverted.

  WHAT IS BACK, EXACTLY AS SHIPPED
    - one dark card per exercise, drag handle, name, muscle
    - a dense grid inside it: #, WEIGHT, REPS, RIR, done
    - EVERY set is directly editable, not just the current one
    - a Partials control on every set
    - Add Set and AI Rec at the foot of each card
    - Add Exercise and Block below the list
    - header: session name, running timer, set count, volume, the
      quick-action bolt, Discard, Finish
    - the summoned numeric pad, the tools popover, the plate
      calculator, rest settings, the long-press action sheet, the
      exercise detail sheet, the block modal, the two-tap discard

  THE FOUR FIXES, AND NOTHING ELSE

  1. THE PAD REPLACES ON THE FIRST DIGIT.
     Logging a set measured 15 taps against a best known 3. Five of
     them were DEL, because the pad opened pre-filled and appended, so
     deleting was the only way to edit; the crawl's own log recorded
     "6072.5", a 60 typed onto an uncleared 72.5. The pad still opens
     showing the pending value — that is useful, it is what you lifted
     last time — but it shows it in --text-tertiary as not-yet-yours,
     and the first digit replaces it whole. After the first digit,
     digits append as before. DEL, the +-2.5/+-5 chips, CANCEL and
     DONE are unchanged. Cost: 9 taps for a fresh weight, reps and
     done; 1 tap when last session's numbers stand.

  2. EVERY HIT AREA IS AT LEAST 44x44, AT THE SHIPPED DENSITY.
     22 of 31 controls were under 44x44; the worst were the fields
     themselves at 109x33 and the done control at 32x30. The cells are
     now 44 tall and the done control 44x44. The set still occupies
     about 96px of card — the same as shipped — because the padding
     row and the value row were already that tall together. Nothing
     was dropped to buy the pixels.

  3. ONE UNIT. THE PROFILE'S.
     The shipped screen showed an "LB" column head (rows with no
     stored kg fell through to "lb"), a "1088 kg" total and a "Switch
     to LBS" control at the same time: three controls, two units. Every
     weight here is stored in kg and displayed in the profile unit,
     including the column head, the totals, the pad and the plate
     calculator. The unit switch is kept — it is a feature — but there
     is one setting behind it, so all three controls always agree.

  4. WARM-UPS COUNT.
     The header filtered setType!=="warmup" and read "0 sets" after a
     completed warm-up. It counts every completed set now, and a
     warm-up set is marked W in the number column so the two are still
     distinguishable.

  HIERARCHY. The orange stays; it is the app's accent and it belongs
  here. What changed is which control wears the solid fill: the done
  control, performed every 90 seconds, and the pad's DONE key. Finish
  is the same size and in the same corner but outlined rather than
  filled, so the loudest thing on the screen is logging a set rather
  than ending the workout.

  NOT RESTORED: the voice FAB. It is shell chrome rather than this
  screen, it is an emoji over a coloured glow, and both audits cut it.

  DATA: fixtures/seed-data.json — profile in kg, PPL Push day
  (exIds 111, 302, 103, 311, 411), exercise note from lk_exNotes.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-workout-log" data-state="mid-session">

      <header class="hdr" data-scroll-edge="#body" id="hdr"></header>
      <div id="rest-slot"></div>
      <main class="body" id="body" data-testid="log-scroll" tabindex="-1"></main>
      <nav class="tabbar" id="tabs" aria-label="Sections"></nav>

      <div id="overlay" data-testid="overlay"></div>
      <div id="toast-slot" data-testid="toast-slot"></div>
      <p class="vis-hidden" role="status" aria-live="polite" id="live"></p>

    </div>
  </div>
</div>

<div class="dev">
  <button class="dev__toggle" type="button" id="dev-toggle" aria-expanded="false" aria-controls="dev-menu" data-testid="dev-toggle">State</button>
  <div class="dev__menu" id="dev-menu" hidden data-testid="dev-menu"></div>
</div>

<script>
(function () {
  "use strict";

  /* =============================================================
     Icons. One set, 24px box, one stroke weight. No emoji.
     ============================================================= */
  function svg(d, extra) {
    return '<svg class="ico' + (extra || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + d + '</svg>';
  }
  var ICO = {
    check: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>', ' ico--lg'),
    grip: svg('<path d="M4 9h16M4 15h16"/>', ' ico--lg'),
    bolt: svg('<path d="M13 3 5 14h6l-1 7 8-11h-6z"/>', ' ico--lg'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    spark: svg('<path d="M12 4v4M12 16v4M4 12h4M16 12h4M7 7l2 2M17 17l-2-2M17 7l-2 2M7 17l2-2"/>'),
    timer: svg('<circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5M9.5 3h5"/>'),
    plate: svg('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/>'),
    scale: svg('<path d="M12 4v16M6 8h12M8 8l-3 6h6zM16 8l-3 6h6z"/>'),
    note: svg('<path d="M6 4h9l3 3v13H6z"/><path d="M9 12h6M9 16h4"/>'),
    swap: svg('<path d="M4 8h13l-3-3M20 16H7l3 3"/>'),
    drop: svg('<path d="M12 3.5 7 11a5 5 0 1 0 10 0z"/>'),
    link: svg('<path d="M10 14a4 4 0 0 0 6 .5l2-2a4 4 0 0 0-5.5-5.5l-1 1"/><path d="M14 10a4 4 0 0 0-6-.5l-2 2A4 4 0 0 0 11.5 17l1-1"/>'),
    sides: svg('<path d="M9 6 5 12l4 6M15 6l4 6-4 6M12 4v16"/>'),
    trash: svg('<path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/>'),
    close: svg('<path d="m6 6 12 12M18 6 6 18"/>'),
    home: svg('<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>'),
    lift: svg('<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>'),
    fuel: svg('<path d="M12 21c4 0 6-2.7 6-6 0-4-3-6-3-10-3 1.5-4 3.5-4 6-1 0-2-1-2-2.5C7.5 10 6 12 6 15c0 3.3 2 6 6 6z"/>'),
    coach: svg('<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M12 13v4M9 21h6"/>'),
    person: svg('<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>'),
    search: svg('<circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/>')
  };

  /* =============================================================
     Formatting. Every number tabular. Every weight stored in kg and
     printed in the profile unit, in one place, so three controls can
     never imply two units again.
     ============================================================= */
  var LB_PER_KG = 2.2046226218;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function n(v) { return '<span class="num">' + v + '</span>'; }
  function round(v, step) { return Math.round(v / step) * step; }
  function trim(v) { return String(Math.round(v * 100) / 100); }

  function toDisplay(kgValue) {          /* stored kg -> profile unit */
    if (kgValue === null || kgValue === undefined || kgValue === '') return null;
    return S.unit === 'kg' ? Number(kgValue) : Math.round(Number(kgValue) * LB_PER_KG * 10) / 10;
  }
  function toKg(displayValue) {          /* profile unit -> stored kg */
    if (displayValue === null || displayValue === '' || isNaN(displayValue)) return null;
    return S.unit === 'kg' ? Number(displayValue) : Math.round((Number(displayValue) / LB_PER_KG) * 100) / 100;
  }
  function unitLabel() { return S.unit === 'kg' ? 'kg' : 'lb'; }
  function unitWord() { return S.unit === 'kg' ? 'kilograms' : 'pounds'; }
  function clock(s) {
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function hhmm(s) {
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }

  /* =============================================================
     Session data. Weights are kg in the model, always.
     ============================================================= */
  function set(kgValue, reps, opts) {
    opts = opts || {};
    return {
      kg: kgValue === undefined ? null : kgValue,
      reps: reps === undefined ? null : reps,
      rir: opts.rir === undefined ? 2 : opts.rir,
      done: !!opts.done,
      warm: !!opts.warm,
      partials: opts.partials || 0,
      prevKg: opts.prevKg === undefined ? kgValue : opts.prevKg,
      prevReps: opts.prevReps === undefined ? reps : opts.prevReps
    };
  }

  function pushDay() {
    return [
      { id: 111, name: 'Barbell Bench Press', muscle: 'Mid Chest', note: 'Pinkies on rings, feet back', sets: [
        set(40, 10, { warm: true, done: true, rir: 4 }),
        set(72.5, 8, { done: true }),
        set(72.5, 7, { done: true }),
        set(null, null, { prevKg: 72.5, prevReps: 7 })
      ] },
      { id: 302, name: 'DB Shoulder Press', muscle: 'Front Delt', sets: [
        set(null, null, { prevKg: 24, prevReps: 10 }),
        set(null, null, { prevKg: 24, prevReps: 9 }),
        set(null, null, { prevKg: 24, prevReps: 8 })
      ] },
      { id: 103, name: 'Incline Cable Fly', muscle: 'Upper Chest', sets: [
        set(null, null, { prevKg: 15, prevReps: 12 }),
        set(null, null, { prevKg: 15, prevReps: 12 })
      ] },
      { id: 311, name: 'Lateral Raise', muscle: 'Side Delt', sets: [
        set(null, null, { prevKg: 9, prevReps: 15 }),
        set(null, null, { prevKg: 9, prevReps: 14 }),
        set(null, null, { prevKg: 9, prevReps: 12 })
      ] },
      { id: 411, name: 'Tricep Pushdown', muscle: 'Lateral Head', sets: [
        set(null, null, { prevKg: 27.5, prevReps: 12 }),
        set(null, null, { prevKg: 27.5, prevReps: 11 })
      ] }
    ];
  }

  /* =============================================================
     State
     ============================================================= */
  var S = {
    state: 'mid-session',
    name: 'PPL - Push',
    unit: 'kg',              /* lk_profile.useKg === true */
    elapsed: 1261,           /* 21:01 */
    exercises: pushDay(),
    blocks: [],
    hidePartials: false,     /* lk_hidePartials */
    restEnabled: true,       /* lk_restEnabled */
    restSeconds: 90,
    restLeft: 0,
    restRunning: false,
    pad: null,               /* { ex, set, field, buffer, replaced } */
    overlay: null,           /* tools | plates | rest | sheet | detail | block | addex | discard */
    overlayEx: 0,
    plate: { total: 20, bar: 20, added: [], perSide: true },
    aiBusyEx: -1,
    liftedEx: -1,
    toast: null,
    tapCount: 0
  };

  var STEPS = { kg: [-5, -2.5, 2.5, 5], lb: [-10, -5, 5, 10] };
  var PLATES = { kg: [1.25, 2.5, 5, 10, 15, 20, 25], lb: [2.5, 5, 10, 25, 35, 45] };

  /* Applies a named demo state on top of a fresh session. */
  function applyState(name) {
    S.state = name;
    S.exercises = pushDay();
    S.blocks = [];
    S.pad = null; S.overlay = null; S.toast = null;
    S.restRunning = false; S.restLeft = 0; S.aiBusyEx = -1; S.liftedEx = -1;
    S.tapCount = 0;
    S.elapsed = 1261;
    if (name === 'first-set') {
      S.name = 'Quick Workout';
      S.elapsed = 47;
      S.exercises = [ { id: 111, name: 'Barbell Bench Press', muscle: 'Mid Chest', note: '', sets: [ set(null, null, { prevKg: null, prevReps: null }) ] } ];
    } else if (name === 'empty') {
      S.name = 'Quick Workout';
      S.elapsed = 31;
      S.exercises = [];
    } else if (name === 'keypad') {
      S.pad = openPadFor(0, 3, 'weight');
    } else if (name === 'rest') {
      S.restRunning = true; S.restLeft = 62;
    } else if (name === 'exercise-done') {
      S.exercises[0].sets[3].kg = 72.5;
      S.exercises[0].sets[3].reps = 7;
      S.exercises[0].sets[3].done = true;
      S.restRunning = true; S.restLeft = 84;
    } else if (name === 'plates') {
      S.overlay = 'plates';
      S.plate = { total: 20, bar: 20, added: [], perSide: true };
    } else if (name === 'loading') {
      S.aiBusyEx = 0;
    } else if (name === 'error') {
      S.toast = { kind: 'error', text: 'Could not get a recommendation. Check your connection and retry.', action: 'Retry' };
    }
    if (name !== 'first-set' && name !== 'empty') S.name = 'PPL - Push';
  }

  /* =============================================================
     Derived numbers. Warm-ups count.
     ============================================================= */
  function doneSets() {
    var c = 0;
    S.exercises.forEach(function (ex) { ex.sets.forEach(function (st) { if (st.done) c++; }); });
    return c;
  }
  function volumeKg() {
    var v = 0;
    S.exercises.forEach(function (ex) {
      ex.sets.forEach(function (st) { if (st.done && st.kg && st.reps) v += st.kg * st.reps; });
    });
    return v;
  }
  function nextUndone() {
    for (var e = 0; e < S.exercises.length; e++) {
      for (var i = 0; i < S.exercises[e].sets.length; i++) {
        if (!S.exercises[e].sets[i].done) return { ex: e, set: i };
      }
    }
    return null;
  }
  function isLive(e, i) {
    var nx = nextUndone();
    return !!nx && nx.ex === e && nx.set === i;
  }

  /* =============================================================
     Header
     ============================================================= */
  function headerHTML() {
    var sets = doneSets();
    var vol = Math.round(toDisplay(volumeKg()) || 0);
    return '' +
      '<div class="sess">' +
        '<div class="sess__main">' +
          '<h1 class="t-title" data-testid="session-name">' + esc(S.name) + '</h1>' +
          '<div class="sess__meta">' +
            '<span class="t-detail sess__time" data-testid="session-timer">' + n(hhmm(S.elapsed)) + '</span>' +
            '<span class="t-detail muted" data-testid="session-sets">' + n(sets) + ' ' + (sets === 1 ? 'set' : 'sets') + '</span>' +
            '<span class="t-detail muted" data-testid="session-volume">' + n(vol.toLocaleString('en-US')) + ' ' + unitLabel() + '</span>' +
          '</div>' +
        '</div>' +
        '<button class="qa" type="button" data-act="tools" data-testid="quick-action" aria-haspopup="dialog" aria-label="Workout tools">' + ICO.bolt + '</button>' +
        '<button class="btn btn--sm btn--tertiary" type="button" data-act="discard" data-testid="btn-discard">Discard</button>' +
        '<button class="btn btn--sm btn--outline" type="button" data-act="finish" data-testid="btn-finish">Finish</button>' +
      '</div>';
  }

  function restHTML() {
    if (!S.restRunning) return '';
    return '<div class="rest" data-testid="rest-strip" role="status">' +
      '<div class="rest__main">' +
        '<div class="rest__label">Rest</div>' +
        '<div class="rest__time" data-testid="rest-remaining">' + n(clock(S.restLeft)) + '</div>' +
      '</div>' +
      '<button class="btn btn--sm btn--secondary" type="button" data-act="rest-add" data-testid="btn-rest-add">+30s</button>' +
      '<button class="btn btn--sm btn--tertiary" type="button" data-act="rest-skip" data-testid="btn-rest-skip">Skip</button>' +
    '</div>';
  }

  /* =============================================================
     The exercise card. The screen's whole idea: several sets
     visible and editable at once.
     ============================================================= */
  function cellHTML(e, i, field) {
    var st = S.exercises[e].sets[i];
    var editing = S.pad && S.pad.ex === e && S.pad.set === i && S.pad.field === field;
    var own = field === 'weight' ? st.kg : st.reps;
    var prev = field === 'weight' ? st.prevKg : st.prevReps;
    /* Weight carries over from last session and is shown, as shipped —
       but in the ghost tone, because it is not yet the lifter's entry.
       Reps start blank, also as shipped. */
    var raw = own !== null ? own : (field === 'weight' ? prev : null);
    var shown = field === 'weight' ? toDisplay(raw) : raw;
    var blank = shown === null || shown === undefined;
    var ghost = blank || own === null;
    var text = blank ? '--' : (field === 'weight' ? trim(shown) : String(shown));
    var label = 'Set ' + (i + 1) + ' ' + field + (blank ? ', empty'
      : (ghost ? ', last session ' : ', ') + text + (field === 'weight' ? ' ' + unitWord() : ' reps'));
    return '<button class="cell' + (ghost ? ' cell--empty' : '') + (editing ? ' cell--editing' : '') + '" type="button" ' +
      'data-act="edit" data-ex="' + e + '" data-set="' + i + '" data-field="' + field + '" ' +
      'data-testid="cell-' + e + '-' + i + '-' + field + '" aria-label="' + esc(label) + '">' + n(esc(text)) + '</button>';
  }

  function rirHTML(e, i) {
    var st = S.exercises[e].sets[i];
    var opts = '';
    for (var v = 0; v <= 5; v++) {
      opts += '<option value="' + v + '"' + (st.rir === v ? ' selected' : '') + '>' + v + '</option>';
    }
    return '<select class="cell cell--rir" data-act="rir" data-ex="' + e + '" data-set="' + i + '" ' +
      'data-testid="rir-' + e + '-' + i + '" aria-label="Set ' + (i + 1) + ' reps in reserve">' + opts + '</select>';
  }

  function doneHTML(e, i) {
    var st = S.exercises[e].sets[i];
    var live = isLive(e, i);
    return '<button class="done' + (live && !st.done ? ' done--ready' : '') + '" type="button" role="checkbox" aria-checked="' + (st.done ? 'true' : 'false') + '" ' +
      'data-act="done" data-ex="' + e + '" data-set="' + i + '" ' +
      'data-testid="done-' + e + '-' + i + '" aria-label="' + (st.done ? 'Undo set ' + (i + 1) : 'Mark set ' + (i + 1) + ' done') + '">' + ICO.check + '</button>';
  }

  function partialsHTML(e, i) {
    var st = S.exercises[e].sets[i];
    return '<div class="partials">' +
      '<span class="partials__label" id="plabel-' + e + '-' + i + '">Partials</span>' +
      '<button class="partials__btn" type="button" data-act="partial" data-ex="' + e + '" data-set="' + i + '" ' +
        'data-testid="partials-' + e + '-' + i + '" aria-label="Add a partial rep to set ' + (i + 1) + (st.partials ? ', ' + st.partials + ' logged' : '') + '">' +
        (st.partials ? n(st.partials) : '+') + '</button>' +
    '</div>';
  }

  function exerciseHTML(ex, e) {
    var rows = '';
    ex.sets.forEach(function (st, i) {
      rows += '<div class="setgrid__n' + (st.warm ? ' setgrid__n--warm' : '') + '" aria-hidden="true">' + (st.warm ? 'W' : n(i + 1)) + '</div>' +
        cellHTML(e, i, 'weight') +
        cellHTML(e, i, 'reps') +
        rirHTML(e, i) +
        doneHTML(e, i);
      if (!S.hidePartials) rows += partialsHTML(e, i);
    });
    return '<article class="exc' + (S.liftedEx === e ? ' exc--lifted' : '') + '" data-testid="exercise-card-' + e + '">' +
      '<div class="exc__head">' +
        '<button class="exc__grip" type="button" data-act="grip" data-ex="' + e + '" data-testid="grip-' + e + '" ' +
          'aria-pressed="' + (S.liftedEx === e ? 'true' : 'false') + '" aria-label="Reorder ' + esc(ex.name) + '">' + ICO.grip + '</button>' +
        '<button class="exc__main" type="button" data-act="exsheet" data-ex="' + e + '" data-testid="exercise-menu-' + e + '" ' +
          'aria-haspopup="dialog" aria-label="Options for ' + esc(ex.name) + '">' +
          '<span class="exc__name">' + esc(ex.name) + '</span>' +
          '<span class="exc__muscle">' + esc(ex.muscle) + '</span>' +
        '</button>' +
      '</div>' +
      '<div class="sets"><div class="setgrid">' +
        '<div class="setgrid__head setgrid__head--n">#</div>' +
        '<div class="setgrid__head setgrid__head--unit" data-testid="unit-head-' + e + '">' + unitLabel().toUpperCase() + '</div>' +
        '<div class="setgrid__head">Reps</div>' +
        '<div class="setgrid__head">RIR</div>' +
        '<div class="setgrid__head" aria-hidden="true"></div>' +
        rows +
      '</div></div>' +
      '<div class="exc__foot">' +
        '<button class="btn btn--sm btn--secondary" type="button" data-act="addset" data-ex="' + e + '" data-testid="btn-add-set-' + e + '">' + ICO.plus + '<span class="btn__label">Add Set</span></button>' +
        '<button class="btn btn--sm btn--tertiary" type="button" data-act="airec" data-ex="' + e + '" data-testid="btn-ai-rec-' + e + '"' +
          (S.aiBusyEx === e ? ' aria-busy="true"' : '') + '>' +
          (S.aiBusyEx === e ? '<span class="spinner" aria-hidden="true"></span><span>Thinking…</span>' : ICO.spark + '<span class="btn__label">AI Rec</span>') +
        '</button>' +
      '</div>' +
    '</article>';
  }

  function blockHTML(b, i) {
    return '<article class="block" data-testid="block-' + i + '">' +
      '<span class="sheetact__ico">' + ICO.note + '</span>' +
      '<div class="block__main">' +
        '<div class="t-body-em">' + esc(b.title) + '</div>' +
        (b.notes || b.duration ? '<div class="t-detail muted">' + esc([b.duration, b.notes].filter(Boolean).join(' · ')) + '</div>' : '') +
      '</div>' +
      '<button class="iconbtn iconbtn--danger" type="button" data-act="block-remove" data-i="' + i + '" data-testid="block-remove-' + i + '" aria-label="Remove block ' + esc(b.title) + '">' + ICO.trash + '</button>' +
    '</article>';
  }

  function bodyHTML() {
    var out = '';
    if (!S.exercises.length && !S.blocks.length) {
      out += '<div class="empty" data-testid="empty">' +
        '<div class="empty__title">No exercises yet</div>' +
        '<p class="empty__body">Tap Add Exercise below</p>' +
      '</div>';
    } else {
      S.exercises.forEach(function (ex, e) { out += exerciseHTML(ex, e); });
      S.blocks.forEach(function (b, i) { out += blockHTML(b, i); });
    }
    out += '<div class="addrow">' +

  /* =============================================================
     The numeric pad. Summoned from a cell, as shipped.

  function openPadFor(e, i, field) {
    var st = S.exercises[e].sets[i];
    var own = field === 'weight' ? st.kg : st.reps;
    var raw = own !== null ? own : (field === 'weight' ? st.prevKg : null);
    var shown = field === 'weight' ? toDisplay(raw) : raw;
    return {
      ex: e, set: i, field: field,
      buffer: (shown === null || shown === undefined) ? '' : trim(shown),
      /* THE FIX. The pad opens showing the pending value, as shipped,
         but the first digit replaces it whole instead of appending to
         it. Digits after the first append and DEL still edits, so
         nothing else about the pad's behaviour changed. */
      replaced: false,
      fromPrev: own === null && shown !== null && shown !== undefined
    };
  }

    var p = S.pad;

    var steps = isWeight ? STEPS[S.unit] : [-2, -1, 1, 2];

    var pending = p.fromPrev && !p.replaced;
    var keys = '';
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', isWeight ? '.' : '', '0'].forEach(function (k) {
      if (k === '') { keys += '<button class="pad__key" type="button" disabled aria-hidden="true" tabindex="-1"></button>'; return; }
      keys += '<button class="pad__key" type="button" data-act="pad-key" data-key="' + k + '" data-testid="pad-' + (k === '.' ? 'dot' : k) + '" aria-label="' + (k === '.' ? 'Decimal point' : k) + '">' + k + '</button>';
    });
    keys += '<button class="pad__key pad__key--del" type="button" data-act="pad-del" data-testid="pad-del" aria-label="Delete last digit">DEL</button>';

    return '<div class="scrim" data-act="pad-cancel" data-testid="pad-scrim" role="presentation"></div>' +
      '<div class="sheet padsheet" role="dialog" aria-modal="true" aria-label="' + (isWeight ? 'Weight' : 'Reps') + ' for set ' + (p.set + 1) + '" data-testid="pad-sheet">' +
        '<div class="sheet__grab" aria-hidden="true"></div>' +
        '<div class="padsheet__read">' +
          '<span class="padsheet__what">' + (isWeight ? 'Weight' : 'Reps') + ' · set ' + (p.set + 1) + '</span>' +

            '<span class="padsheet__value' + (pending ? ' padsheet__value--pending' : '') + '" data-testid="pad-value">' + esc(shown) + '</span>' +
            (isWeight ? '<span class="padsheet__unit" data-testid="pad-unit">' + unitLabel() + '</span>' : '') +
          '</span>' +
        '</div>' +
        (pending ? '<p class="padsheet__hint" data-testid="pad-hint">Last session. Type to replace it.</p>' : '') +
        '<div class="padchips">' + steps.map(function (s) {

        }).join('') + '</div>' +

          '<button class="btn btn--secondary" type="button" data-act="pad-cancel" data-testid="pad-cancel">Cancel</button>' +
          '<button class="btn btn--primary" type="button" data-act="pad-done" data-testid="pad-done">Done</button>' +
        '</div>' +
      '</div>';
  }

  function padDigit(k) {
    var p = S.pad;
    if (!p.replaced) { p.buffer = (k === '.' ? '0.' : k); p.replaced = true; return; }
    if (k === '.' && p.buffer.indexOf('.') >= 0) return;
    if (p.buffer.replace('.', '').length >= 5) return;
    p.buffer = (p.buffer === '0' && k !== '.') ? k : p.buffer + k;
  }
  function padStep(delta) {
    var p = S.pad;
    var base = parseFloat(p.buffer || '0') || 0;
    var v = Math.max(0, base + delta);
    p.buffer = trim(p.field === 'weight' ? round(v, 0.5) : Math.round(v));
    p.replaced = true;
  }
  function padCommit() {
    var p = S.pad, st = S.exercises[p.ex].sets[p.set];
    var v = p.buffer === '' ? null : parseFloat(p.buffer);
    if (p.field === 'weight') st.kg = v === null || isNaN(v) ? null : toKg(v);
    else st.reps = v === null || isNaN(v) ? null : Math.round(v);
    S.pad = null;
  }

  /* =============================================================

  /* Every region goes through the shared reconciler in app.js, which is
     loaded in <head> on this screen and inlined into the demo. Nothing is
     rebuilt: the caret, the scroll and the running animations survive. */
  function put(el, html) { LKPatch(el, html); }

  function paint() {
    screen.setAttribute('data-state', S.state);
    put(hdr, headerHTML());
    put(restSlot, restHTML());
    put(body, bodyHTML());
    put(tabs, tabsHTML());
    put(overlay, overlayHTML());

     Behaviour
     ============================================================= */
  function startRest() {
    if (!S.restEnabled) return;
    S.restRunning = true;
    S.restLeft = S.restSeconds;
  }

  /* A toast says what happened and gets out of the way; it never sits
     on top of Add Exercise waiting to be dismissed. */
  var toastTimer = null;
  function toast(text, kind, action) {
    S.toast = { text: text, kind: kind || 'info', action: action || null };
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; paint(); }, 4000);
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    var e = Number(t.getAttribute('data-ex'));
    var i = Number(t.getAttribute('data-set'));
    S.tapCount++;

    switch (act) {
      /* ---- editing any set, not only the current one ---- */
      case 'edit':
        S.pad = openPadFor(e, i, t.getAttribute('data-field'));
        S.toast = null;
        break;
      case 'pad-key': padDigit(t.getAttribute('data-key')); break;
      case 'pad-del': {
        var p = S.pad;
        p.replaced = true;
        p.buffer = p.buffer.slice(0, -1);
        break;
      }
      case 'pad-step': padStep(parseFloat(t.getAttribute('data-step'))); break;
      case 'pad-done': {
        var f = S.pad.field, ex = S.pad.ex, ix = S.pad.set;
        padCommit();
        say('Set ' + (ix + 1) + ' ' + f + ' saved');
        break;
      }
      case 'pad-cancel': S.pad = null; break;

      case 'rir':
        break;

      case 'done': {
        var st = S.exercises[e].sets[i];
        st.done = !st.done;
        if (st.done) {
          if (st.kg === null) st.kg = st.prevKg;
          if (st.reps === null) st.reps = st.prevReps;
          startRest();
          say('Set ' + (i + 1) + ' logged. ' + doneSets() + ' sets this session.');
        } else {
          S.restRunning = false;
          say('Set ' + (i + 1) + ' reopened');
        }
        break;
      }
      case 'partial': {
        var ps = S.exercises[e].sets[i];
        ps.partials = ps.partials >= 9 ? 0 : ps.partials + 1;
        say('Set ' + (i + 1) + ': ' + ps.partials + ' partials');
        break;
      }
      case 'addset': {
        var lastSet = S.exercises[e].sets[S.exercises[e].sets.length - 1];
        S.exercises[e].sets.push(set(null, null, { prevKg: lastSet ? lastSet.kg || lastSet.prevKg : null, prevReps: lastSet ? lastSet.prevReps : null, rir: lastSet ? lastSet.rir : 2 }));
        say('Set added to ' + S.exercises[e].name);
        break;
      }
      case 'airec': {
        if (S.aiBusyEx === e) break;
        S.aiBusyEx = e;
        S.toast = null;
        paint();
        setTimeout(function () {
          S.aiBusyEx = -1;
          var target = null;
          for (var k = 0; k < S.exercises[e].sets.length; k++) { if (!S.exercises[e].sets[k].done) { target = k; break; } }
          if (target === null) { toast('Every set in this exercise is logged.'); paint(); return; }
          var s2 = S.exercises[e].sets[target];
          s2.prevKg = (s2.prevKg || 20) + 2.5;
          s2.prevReps = s2.prevReps || 8;
          toast('Suggested ' + trim(toDisplay(s2.prevKg)) + ' ' + unitLabel() + ' x ' + s2.prevReps + ' for set ' + (target + 1) + '.');
          say('Recommendation ready');
          paint();
        }, 900);
        return;
      }

      /* ---- exercise card ---- */
      case 'grip':
        S.liftedEx = S.liftedEx === e ? -1 : e;
        say(S.liftedEx === e ? 'Reordering ' + S.exercises[e].name + '. Use the grip again to drop it.' : 'Order kept');
        break;
      case 'exsheet': S.overlayEx = e; S.overlay = 'sheet'; break;
      case 'exact': {
        var key = t.getAttribute('data-key');
        var cur = S.exercises[S.overlayEx];
        if (key === 'info') { S.overlay = 'detail'; break; }
        if (key === 'unit') { S.unit = S.unit === 'kg' ? 'lb' : 'kg'; S.overlay = null; toast('Showing ' + unitLabel() + ' everywhere.'); break; }
        if (key === 'warmup') {
          cur.sets.unshift(set(cur.sets[0] ? Math.round((cur.sets[0].prevKg || 20) * 0.5 * 2) / 2 : 20, 10, { warm: true, rir: 4 }));
          S.overlay = null; toast('Warm-up set added.'); break;
        }
        if (key === 'remove') { S.exercises.splice(S.overlayEx, 1); S.overlay = null; toast('Exercise removed.', 'info', 'Undo'); break; }
        if (key === 'swap') { S.overlay = 'addex'; break; }
        S.overlay = null;
        toast(key === 'superset' ? 'Superset on.' : 'Left and right tracked separately.');
        break;
      }

      /* ---- header ---- */
      case 'tools': S.overlay = 'tools'; break;
      case 'tool': {
        var tool = t.getAttribute('data-tool');
        if (tool === 'unit') { S.unit = S.unit === 'kg' ? 'lb' : 'kg'; S.overlay = null; toast('Showing ' + unitLabel() + ' everywhere.'); }
        else S.overlay = tool;
        break;
      }
      case 'discard': S.overlay = 'discard'; break;
      case 'discard-confirm': S.overlay = null; toast('Workout discarded.'); break;
      case 'finish': toast(doneSets() + ' sets saved. Opening review.'); break;

      /* ---- rest ---- */
      case 'rest-add': S.restLeft += 30; say('Rest extended to ' + clock(S.restLeft)); break;
      case 'rest-skip': S.restRunning = false; say('Rest skipped'); break;
      case 'rest-toggle': S.restEnabled = !S.restEnabled; break;
      case 'rest-set': S.restSeconds = Number(t.getAttribute('data-secs')); if (S.restRunning) S.restLeft = S.restSeconds; break;

      /* ---- plate calculator ---- */
      case 'plate-add': S.plate.added.push(Number(t.getAttribute('data-plate'))); break;
      case 'plate-bar': S.plate.bar = Number(t.getAttribute('data-bar')); break;
      case 'plate-side': S.plate.perSide = t.getAttribute('data-side') === '1'; break;
      case 'plate-undo': S.plate.added.pop(); break;
      case 'plate-clear': S.plate.added = []; break;
      case 'plate-apply': {
        var target2 = nextUndone();
        if (target2) {
          var total = S.plate.bar + S.plate.added.reduce(function (a, b) { return a + b; }, 0) * 2;
          S.exercises[target2.ex].sets[target2.set].kg = total;
          S.overlay = null;
          toast(trim(toDisplay(total)) + unitLabel() + ' applied to set ' + (target2.set + 1) + '.');
        }
        break;
      }

      /* ---- add exercise, block ---- */
      case 'addex': S.overlay = 'addex'; break;
      case 'addex-pick': {
        var pick = LIBRARY[Number(t.getAttribute('data-i'))];
        S.exercises.push({ id: pick.id, name: pick.name, muscle: pick.muscle, note: '', sets: [set(null, null, {}), set(null, null, {}), set(null, null, {})] });
        S.overlay = null;
        toast(pick.name + ' added.');
        break;
      }
      case 'block': S.overlay = 'block'; break;
      case 'block-add': {
        var ti = document.getElementById('block-title');
        var no = document.getElementById('block-notes');
        S.blocks.push({ title: (ti && ti.value.trim()) || 'Block', notes: no ? no.value.trim() : '', duration: '' });
        S.overlay = null;
        toast('Block added.');
        break;
      }
      case 'block-remove': S.blocks.splice(Number(t.getAttribute('data-i')), 1); break;

      case 'toast-action': S.toast = null; break;
      case 'close': S.overlay = null; break;
      default: break;
    }
    paint();
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target.closest('[data-act="rir"]');
    if (!t) return;
    var e = Number(t.getAttribute('data-ex')), i = Number(t.getAttribute('data-set'));
    S.exercises[e].sets[i].rir = Number(t.value);
    say('Set ' + (i + 1) + ' RIR ' + t.value);
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target.closest('[data-act="note"]');
    if (t) { S.exercises[S.overlayEx].note = t.value; }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (S.pad) { S.pad = null; paint(); }
    else if (S.overlay) { S.overlay = null; paint(); }
  });

  /* Clocks. One interval, no per-row timers. */
  setInterval(function () {
    var dirty = false;
    S.elapsed++;
    if (S.restRunning && S.restLeft > 0) { S.restLeft--; dirty = true; if (S.restLeft === 0) { S.restRunning = false; say('Rest done'); } }
    var el = document.querySelector('[data-testid="session-timer"] .num');
    if (el) el.textContent = hhmm(S.elapsed);
    var rl = document.querySelector('[data-testid="rest-remaining"] .num');
    if (rl) rl.textContent = clock(S.restLeft);
    if (dirty && !S.restRunning) paint();
  }, 1000);

  /* =============================================================
     Dev states
     ============================================================= */
  var STATES = [
    ['mid-session', 'Mid-session'],
    ['first-set', 'First set'],
    ['keypad', 'Keypad open'],
    ['rest', 'Rest running'],
    ['exercise-done', 'Exercise done'],
    ['plates', 'Plate calculator'],
    ['empty', 'Empty'],
    ['loading', 'Loading'],
    ['error', 'Error']
  ];
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  function paintMenu() {
    LKPatch(menu, STATES.map(function (s) {
      return '<button class="dev__item" type="button" data-state="' + s[0] + '" data-testid="dev-' + s[0] + '" aria-pressed="' + (S.state === s[0] ? 'true' : 'false') + '">' + s[1] + '</button>';
    }).join(''));
  }
  toggle.addEventListener('click', function () {
    var open = menu.hasAttribute('hidden');
    if (open) menu.removeAttribute('hidden'); else menu.setAttribute('hidden', '');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  menu.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-state]');
    if (!b) return;
    applyState(b.getAttribute('data-state'));
    paintMenu();
    paint();
  });

  paintMenu();
  paint();
  window.__LK = { state: S, apply: function (s) { applyState(s); paintMenu(); paint(); } };
})();
</script>
