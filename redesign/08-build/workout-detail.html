<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOCKED — Workout detail</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="fixtures.js"></script>
<script src="store.js"></script>
<script src="units.js"></script>
<script src="app.js"></script>
<script src="chrome.js"></script>
<script src="session.js"></script>
</head>
<body>
<!--
  WORKOUT DETAIL — a session that already happened.

  WHY IT EXISTS. Every history row on Train points here, and for a while
  nothing was behind them: the row said "A past session opens its own detail
  screen, which is not in this build yet", which was honest and useless. The
  shipped app had this screen and a feature audit found it dropped with no
  note anywhere saying so.

  WHAT IT IS NOT. It is not Review. Review is the five seconds after the last
  set, when the lifter is tired and wants to be done, and it is about
  deciding: save, discard, carry the change into the split. This screen is
  read cold, days later, by somebody asking a question — what did I do, was
  it heavier than last time, what did I write down. So it leads with the sets
  rather than with a verdict, and its actions are edit, repeat and delete
  rather than save and discard.

  THE NOTE. The shipped app let a lifter write on a session and on individual
  exercises, and the rebuild had lost both the writer and the reader. The note
  is here, it is editable, and it is the only free text in the build that is
  not a message to a coach.

  REPEAT, NOT CONVERT. The original offered "Convert to split", which makes a
  whole training split out of one day. That is a bigger claim than one session
  supports and it belongs in the split builder, which can already do it. What
  a person actually wants from a past session is to do it again, so the action
  is Repeat, and it starts a workout preloaded with these exercises.

  DELETE IS UNDOABLE, not confirmed twice. The row is gone from the list
  immediately and comes back for six seconds. A confirm dialog asks a question
  the person answered by pressing a red button.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-workout-detail">

      <header class="hdr" data-scroll-edge="#body" id="hdr"></header>

      <main class="body" id="body" data-testid="detail-scroll" tabindex="-1"></main>

      <!-- The live session, seen from here. Empty unless a workout is
           running; it sits between the content and the bottom of the
           screen rather than over it, so nothing it says costs a row. -->
      <div id="shelf-slot"></div>

      <div id="overlay" data-testid="overlay"></div>

    </div>
  </div>
</div>

<div class="dev">
  <button class="dev__toggle" id="dev-toggle" aria-expanded="false" aria-controls="dev-menu" data-testid="dev-toggle">State</button>
  <div class="dev__menu" id="dev-menu" hidden data-testid="dev-menu"></div>
</div>

<script>
(function () {
  "use strict";

  function svg(d, cls) {
    return '<svg class="ico' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + d + '</svg>';
  }
  var ICO = {
    back:  svg('<path d="m15 5-7 7 7 7"/>'),
    lift:  svg('<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>'),
    cardio: svg('<path d="M4 13h4l2-6 3 12 2-8h5"/>'),
    trophy: svg('<path d="M7 4h10v4a5 5 0 0 1-10 0zM9 20h6M12 13v7M5 5h2M17 5h2"/>'),
    repeat: svg('<path d="M4 10a6 6 0 0 1 6-6h7M17 4l-3-3M17 4l-3 3M20 14a6 6 0 0 1-6 6H7M7 20l3 3M7 20l3-3"/>'),
    edit:  svg('<path d="M4 20h4l10-10-4-4L4 16z"/>'),
    close: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
    alert: svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/>')
  };

  function esc(t) {
    return String(t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function n(v) { return '<span class="num">' + v + '</span>'; }
  function group(v) { return v.toLocaleString('en-US'); }

  var TODAY = '2026-09-09';
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function ms(iso) { var p = iso.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function daysAgo(iso) { return Math.round((ms(TODAY) - ms(iso)) / 86400000); }
  function absDate(iso) { var p = iso.split('-'); return MON[+p[1] - 1] + ' ' + (+p[2]); }
  function relDate(iso) {
    var d = daysAgo(iso);
    if (d === 0) return 'Today';
    if (d === 1) return 'Yesterday';
    if (d < 7) return d + ' days ago';
    return absDate(iso);
  }
  function longDate(iso) {
    var p = iso.split('-');
    var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var d = new Date(ms(iso));
    return DAYS[d.getUTCDay()] + ', ' + MON[+p[1] - 1] + ' ' + (+p[2]);
  }
  function mins(m) { return m + ' min'; }

  /* ---------------------------------------------------------------
     The session. One fixture, so the same screen renders the same way
     every run and a screenshot diff means something. Sets carry what
     they were LAST time as well as what they were, because "was it
     heavier" is the question this screen is opened to answer.
     --------------------------------------------------------------- */
  var SESSION = {
    id: 'w_1788618300000',
    kind: 'lift',
    name: 'PPL &middot; Pull',
    date: '2026-09-05',
    min: 51,
    note: 'Left elbow tight on the first two sets of rows. Warmed up longer and it settled.',
    feel: { energy: 4, focus: 4, pump: 3, difficulty: 3, enjoyment: 4 },
    exercises: [
      { name: 'Barbell Row', muscle: 'Mid Back', note: '', sets: [
        { kg: 60, reps: 10, rir: 3, warm: true },
        { kg: 82.5, reps: 8, rir: 2, prev: '80 x 8' },
        { kg: 82.5, reps: 8, rir: 1, prev: '80 x 8' },
        { kg: 82.5, reps: 7, rir: 1, prev: '80 x 7' }
      ] },
      { name: 'Lat Pulldown', muscle: 'Lats', note: 'Wide grip', sets: [
        { kg: 65, reps: 10, rir: 2, prev: '62.5 x 10' },
        { kg: 65, reps: 10, rir: 2, prev: '62.5 x 9' },
        { kg: 65, reps: 9, rir: 1, prev: '62.5 x 9' }
      ] },
      { name: 'Seated Cable Row', muscle: 'Mid Back', note: '', sets: [
        { kg: 57.5, reps: 12, rir: 2, prev: '57.5 x 11' },
        { kg: 57.5, reps: 11, rir: 1, prev: '57.5 x 11' },
        { kg: 57.5, reps: 10, rir: 1, prev: '57.5 x 10' }
      ] },
      { name: 'Face Pull', muscle: 'Rear Delt', note: '', sets: [
        { kg: 29.3, reps: 20, rir: 2, prev: '28.5 x 19', pr: true },
        { kg: 29.3, reps: 18, rir: 1, prev: '28.5 x 18' }
      ] },
      { name: 'Barbell Curl', muscle: 'Biceps', note: '', sets: [
        { kg: 30, reps: 10, rir: 2, prev: '30 x 10' },
        { kg: 30, reps: 9, rir: 1, prev: '30 x 9' },
        { kg: 30, reps: 8, rir: 0, prev: '30 x 8' }
      ] }
    ]
  };

  var CARDIO = {
    id: 'w_1788678900000', kind: 'cardio', name: 'Treadmill run',
    date: '2026-09-06', min: 30, km: 5.2, cal: 340, note: '', feel: null, exercises: []
  };

  /* HOW IT FELT, in the keys the data actually uses. This list asked for
     energy, pump, strength, sleep and stress; the reflection a session
     carries is {energy, focus, pump, difficulty, enjoyment}. So three chips
     printed "Strength undefined", "Sleep undefined" and "Stress undefined",
     and the two figures the lifter did record were never shown at all. The
     order below is the order the seed writes them in, and a chip is drawn
     only for a key the reflection has, so a record written by an older
     build cannot put the word undefined back on the screen. */
  var FEEL_LABELS = [
    ['energy', 'Energy'],
    ['focus', 'Focus'],
    ['pump', 'Pump'],
    ['difficulty', 'Difficulty'],
    ['enjoyment', 'Enjoyment'],
    /* Names a record from an older build may carry, so it reads rather than
       being dropped silently. */
    ['strength', 'Strength'],
    ['sleep', 'Sleep'],
    ['stress', 'Stress']
  ];

  var S = {
    state: 'populated',
    w: null,          /* the session being shown */
    editingNote: false,
    noteDraft: '',
    deleted: false,
    toast: null,
    undo: null,
    /* The edit draft, or null when the screen is being read rather than
       changed. Nothing is written to history until Save is pressed. */
    edit: null
  };

  /* ---------------------------------------------------------------
     HISTORY COMES FROM THE STORE, NOT STRAIGHT FROM THE FIXTURE.
     This screen read window.LKFixtures and nothing else, so a note written
     here was gone on the next load, a deleted session came back, and a
     workout Review had just saved could not be opened at all: it was in
     lk_history and this screen was not looking there. The fixture is still
     the seed for a reader who has written nothing.
     --------------------------------------------------------------- */
  function history() {
    var FX = window.LKFixtures;
    var seed = (FX && FX.history) || [];
    var list = window.LKStore ? LKStore.get('lk_history', seed) : seed;
    return Array.isArray(list) ? list : seed;
  }
  function saveHistory(list) {
    if (window.LKStore) LKStore.set('lk_history', list);
  }
  function indexOfId(list, id) {
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return i; }
    return -1;
  }
  function recordById(id) {
    var list = history(), i = indexOfId(list, id);
    return i < 0 ? null : list[i];
  }
  /* "Last time" is read from the same list the screen is reading. Taken from
     the fixture instead, a session saved today would be compared against a
     history that has never heard of it. */
  function lastTimeIn(exId, before) {
    var list = history();
    for (var i = 0; i < list.length; i++) {
      var w = list[i];
      if (w.kind !== 'lift' || !w.exercises) continue;
      if (before && w.date >= before) continue;
      for (var j = 0; j < w.exercises.length; j++) {
        if (w.exercises[j].id === exId) return { date: w.date, exercise: w.exercises[j] };
      }
    }
    return null;
  }
  /* Working sets and working volume, recomputed from the rows rather than
     trusted from the record's own summary, which is what an edit invalidates. */
  function recount(rec) {
    var sets = 0, vol = 0;
    (rec.exercises || []).forEach(function (ex) {
      (ex.sets || []).forEach(function (st) {
        if (st.warm || st.kg == null || st.reps == null) return;
        sets++; vol += st.kg * st.reps;
      });
    });
    rec.sets = sets;
    rec.kg = Math.round(vol);
    return rec;
  }
  /* One write, used by the note, the edit and the delete alike. */
  function writeRecord(id, change) {
    var list = history().slice();
    var at = indexOfId(list, id);
    if (at < 0) return false;
    list[at] = change(JSON.parse(JSON.stringify(list[at])));
    saveHistory(list);
    return true;
  }

  function workingSets(w) {
    return w.exercises.reduce(function (a, e) {
      return a + e.sets.filter(function (s) { return !s.warm; }).length;
    }, 0);
  }
  function volume(w) {
    return w.exercises.reduce(function (a, e) {
      return a + e.sets.filter(function (s) { return !s.warm; })
        .reduce(function (b, s) { return b + s.kg * s.reps; }, 0);
    }, 0);
  }
  function prCount(w) {
    return w.exercises.reduce(function (a, e) {
      return a + e.sets.filter(function (s) { return s.pr; }).length;
    }, 0);
  }

  /* ---------------------------------------------------------------
     Pieces
     --------------------------------------------------------------- */
  function headerHTML() {
    var w = S.w;
    return '' +
      '<button class="hdr__back" type="button" data-act="back" data-testid="back" aria-label="Back to Train">' +
        ICO.back + '</button>' +
      '<div class="hdr__title stack stack--1">' +
        '<span class="t-meta" data-testid="detail-date">' + longDate(w.date).toUpperCase() + '</span>' +
        '<h1 class="t-title" data-testid="detail-name">' + w.name + '</h1>' +
      '</div>';
  }

  function totals() {
    var w = S.w;
    var parts = w.kind === 'lift'
      ? [n(workingSets(w)) + ' working sets', n(LKUnits.fmtTotal(volume(w))), mins(w.min)]
      : [mins(w.min), w.km != null ? n(w.km) + ' km' : null, w.cal != null ? n(w.cal) + ' kcal' : null];
    return '<p class="t-detail mt-3" data-testid="detail-totals">' +
      parts.filter(Boolean).join(' &middot; ') + ' &middot; ' + relDate(w.date) + '</p>';
  }

  function prBanner() {
    var c = prCount(S.w);
    if (!c) return '';
    return '<div class="card mt-4" data-testid="detail-pr">' +
      '<div class="hstack hstack--3">' +
        '<span class="ico-well">' + ICO.trophy + '</span>' +
        '<span class="stack stack--1 grow">' +
          '<span><span class="badge badge--success">Personal record</span></span>' +
          '<span class="t-section">' + c + (c === 1 ? ' set' : ' sets') + ' beat what came before</span>' +
        '</span>' +
      '</div></div>';
  }

  function setRow(s, i, exIdx) {
    var label = s.warm ? 'W' : String(i);
    return '<div class="setgrid" data-testid="dset-' + exIdx + '-' + i + '">' +
        '<span class="setgrid__n' + (s.warm ? ' setgrid__n--warm' : '') + '">' + label + '</span>' +
        '<span class="setgrid__n" style="text-align:left">' + n(LKUnits.v(s.kg)) + ' ' + LKUnits.label() + '</span>' +
        '<span class="setgrid__n" style="text-align:left">' + n(s.reps) + ' reps</span>' +
        '<span class="setgrid__n">' + (s.rir != null ? n(s.rir) + ' RIR' : '') + '</span>' +
        '<span class="setgrid__n">' + (s.pr ? '<span class="badge badge--success">PR</span>' : '') + '</span>' +
      '</div>' +
      /* Indented to the KG column, so "was" reads as a footnote to the row
         above it rather than as a new row starting at the margin. */
      (s.prev ? '<p class="t-caption-1 quiet" style="padding: 0 0 var(--sp-2) calc(var(--sp-5) + var(--sp-2))">Was ' +
        esc(s.prev) + '</p>' : '');
  }

  function exerciseCard(e, i) {
    return '<div class="exc mt-3" data-testid="dex-' + i + '">' +
        '<div class="exc__head">' +
          '<span class="stack stack--1 grow">' +
            '<span class="t-section">' + esc(e.name) + '</span>' +
            '<span class="t-detail quiet">' + esc(e.muscle) +
              (e.note ? ' &middot; ' + esc(e.note) : '') + '</span>' +
          '</span>' +
        '</div>' +
        '<div class="sets">' +
          '<div class="setgrid">' +
            '<span class="setgrid__head setgrid__head--n">#</span>' +
            '<span class="setgrid__head" style="text-align:left">KG</span>' +
            '<span class="setgrid__head" style="text-align:left">REPS</span>' +
            '<span class="setgrid__head">RIR</span>' +
            '<span class="setgrid__head"></span>' +
          '</div>' +
          e.sets.map(function (s, k) {
            return setRow(s, s.warm ? 0 : e.sets.slice(0, k).filter(function (x) { return !x.warm; }).length + 1, i);
          }).join('') +
        '</div>' +
      '</div>';
  }

  function feelCard() {
    var f = S.w.feel;
    if (!f) return '';
    return '<div class="section mt-5">' +
      '<div class="section__head"><h2 class="t-label">How it felt</h2></div>' +
      '<div class="card"><div class="chiprow">' +
        FEEL_LABELS.filter(function (p) {
          return f[p[0]] !== null && f[p[0]] !== undefined;
        }).map(function (p) {
          return '<span class="chip" data-testid="feel-' + p[0] + '">' + p[1] + ' ' + n(f[p[0]]) + '</span>';
        }).join('') +
      '</div>' +
      '<p class="t-caption-1 quiet mt-3">Recorded when the session was saved. One to five.</p>' +
      '</div></div>';
  }

  function noteCard() {
    var w = S.w;
    if (S.editingNote) {
      return '<div class="section mt-5">' +
        '<div class="section__head"><h2 class="t-label">Note</h2></div>' +
        '<div class="card">' +
          '<label class="vis-hidden" for="note-field">Session note</label>' +
          '<textarea class="input" id="note-field" rows="4" data-testid="note-field" ' +
            'placeholder="What is worth remembering about this one?">' + esc(S.noteDraft) + '</textarea>' +
          '<div class="hstack hstack--2 mt-3">' +
            '<button class="btn btn--primary grow" type="button" data-act="note-save" data-testid="note-save">' +
              '<span class="btn__label">Save note</span></button>' +
            '<button class="btn btn--secondary" type="button" data-act="note-cancel" data-testid="note-cancel">' +
              '<span class="btn__label">Cancel</span></button>' +
          '</div>' +
        '</div></div>';
    }
    return '<div class="section mt-5">' +
      '<div class="section__head"><h2 class="t-label">Note</h2></div>' +
      '<button class="card" type="button" data-act="note-edit" data-testid="note-edit" ' +
        'aria-label="' + (w.note ? 'Edit the note' : 'Add a note') + '">' +
        (w.note
          ? '<p class="t-body" data-testid="note-text">' + esc(w.note) + '</p>' +
            '<p class="t-caption-1 quiet mt-2">Tap to edit.</p>'
          : '<p class="t-body quiet" data-testid="note-text">Nothing written down.</p>' +
            '<p class="t-caption-1 quiet mt-2">Tap to add a note. It is the only thing here ' +
              'the app cannot work out for itself.</p>') +
      '</button></div>';
  }

  function actions() {
    return '<div class="section mt-5">' +
      '<div class="stack stack--2">' +
        '<button class="btn btn--primary btn--block" type="button" data-act="repeat" data-testid="detail-repeat">' +
          ICO.repeat + '<span class="btn__label">Do this session again</span></button>' +
        '<button class="btn btn--secondary btn--block" type="button" data-act="edit" data-testid="detail-edit">' +
          ICO.edit + '<span class="btn__label">Edit the sets</span></button>' +
        '<button class="btn btn--danger btn--block" type="button" data-act="delete" data-testid="detail-delete">' +
          '<span class="btn__label">Delete this session</span></button>' +
      '</div>' +
      '<p class="t-caption-1 quiet mt-3">Deleting takes it out of your history, your records and ' +
        'your charts. You get six seconds to change your mind.</p>' +
    '</div>';
  }

  var VIEWS = {};

  /* ---------------------------------------------------------------
     EDIT MODE. "Edit the sets" went to workout-log.html, which opens
     TODAY's session -- so the one control that promised to change the
     record you were reading opened a different workout and could not
     change it at all. The record is edited here, where it is being read,
     and Save writes it to lk_history.
     --------------------------------------------------------------- */
  function draftFrom(w) {
    return {
      name: w.name,
      exercises: w.exercises.map(function (e) {
        return {
          id: e.id, name: e.name, muscle: e.muscle,
          sets: e.sets.map(function (s) {
            return { kg: s.kg, reps: s.reps, rir: s.rir, warm: !!s.warm };
          })
        };
      })
    };
  }
  function draftTotals(d) {
    var sets = 0, vol = 0;
    d.exercises.forEach(function (e) {
      e.sets.forEach(function (s) {
        if (s.warm || s.kg == null || s.reps == null) return;
        sets++; vol += s.kg * s.reps;
      });
    });
    return { sets: sets, vol: vol };
  }
  function numField(label, testid, value, attrs, act, e, i) {
    return '<label class="vis-hidden" for="' + testid + '">' + esc(label) + '</label>' +
      '<input class="input" type="number" inputmode="decimal" id="' + testid + '" ' +
        'data-testid="' + testid + '" data-act="' + act + '" data-ex="' + e + '" data-set="' + i + '" ' +
        attrs + ' value="' + (value === null || value === undefined ? '' : esc(value)) + '">';
  }
  function editSetRow(s, i, e) {
    return '<div class="editset" data-testid="eset-' + e + '-' + i + '">' +
        '<button class="editset__n" type="button" data-act="ed-warm" data-ex="' + e + '" data-set="' + i + '" ' +
          'data-testid="ed-warm-' + e + '-' + i + '" aria-pressed="' + (s.warm ? 'true' : 'false') + '" ' +
          'aria-label="Set ' + (i + 1) + (s.warm ? ', a warm-up. Make it a working set' : ', a working set. Make it a warm-up') + '">' +
          (s.warm ? 'W' : String(i + 1)) + '</button>' +
        numField('Set ' + (i + 1) + ' weight in ' + LKUnits.label(), 'ed-kg-' + e + '-' + i,
                 s.kg === null || s.kg === undefined ? '' : LKUnits.v(s.kg), 'step="0.5" min="0"', 'ed-kg', e, i) +
        numField('Set ' + (i + 1) + ' reps', 'ed-reps-' + e + '-' + i, s.reps, 'step="1" min="0"', 'ed-reps', e, i) +
        numField('Set ' + (i + 1) + ' reps in reserve', 'ed-rir-' + e + '-' + i, s.rir, 'step="1" min="0" max="5"', 'ed-rir', e, i) +
        '<button class="iconbtn iconbtn--danger" type="button" data-act="ed-delset" data-ex="' + e + '" data-set="' + i + '" ' +
          'data-testid="ed-delset-' + e + '-' + i + '" aria-label="Remove set ' + (i + 1) + '">' + ICO.close + '</button>' +
      '</div>';
  }
  VIEWS.edit = function () {
    var d = S.edit;
    var t = draftTotals(d);
    return '<div class="section" data-testid="detail-editor">' +
        '<label class="field"><span class="field__label t-label">Session name</span>' +
          '<input class="input" id="ed-name" data-act="ed-name" data-testid="ed-name" ' +
            'value="' + esc(d.name) + '"></label>' +
        '<p class="t-detail mt-3" data-testid="ed-totals">' + n(t.sets) + ' working sets &middot; ' +
          n(LKUnits.fmtTotal(t.vol)) + '</p>' +
        d.exercises.map(function (e, i) {
          return '<div class="exc mt-3" data-testid="ed-ex-' + i + '">' +
              '<div class="exc__head">' +
                '<span class="stack stack--1 grow">' +
                  '<span class="t-section">' + esc(e.name) + '</span>' +
                  '<span class="t-detail quiet">' + esc(e.muscle) + '</span>' +
                '</span>' +
                '<button class="iconbtn iconbtn--danger" type="button" data-act="ed-delex" data-ex="' + i + '" ' +
                  'data-testid="ed-delex-' + i + '" aria-label="Remove ' + esc(e.name) + ' from this session">' +
                  ICO.close + '</button>' +
              '</div>' +
              '<div class="editsets">' +
                '<div class="editset editset--head" aria-hidden="true">' +
                  '<span class="t-meta">#</span><span class="t-meta">' + LKUnits.label().toUpperCase() + '</span>' +
                  '<span class="t-meta">REPS</span><span class="t-meta">RIR</span><span></span>' +
                '</div>' +
                e.sets.map(function (s, k) { return editSetRow(s, k, i); }).join('') +
              '</div>' +
              '<div class="exc__foot">' +
                '<button class="btn btn--sm btn--secondary" type="button" data-act="ed-addset" data-ex="' + i + '" ' +
                  'data-testid="ed-addset-' + i + '"><span class="btn__label">Add set</span></button>' +
              '</div>' +
            '</div>';
        }).join('') +
        (d.exercises.length ? '' :
          '<p class="t-detail quiet mt-3" data-testid="ed-empty">Every exercise has been removed. ' +
          'Saving now would leave a session with nothing in it, so Save asks you to delete it instead.</p>') +
        '<div class="stack stack--2 mt-4">' +
          '<button class="btn btn--primary btn--block" type="button" data-act="ed-save" data-testid="ed-save">' +
            '<span class="btn__label">Save changes</span></button>' +
          '<button class="btn btn--secondary btn--block" type="button" data-act="ed-cancel" data-testid="ed-cancel">' +
            '<span class="btn__label">Cancel</span></button>' +
        '</div>' +
        '<p class="t-caption-1 quiet mt-3">Changes are written to your history when you save. ' +
          'The totals above are recomputed from the rows, not carried over.</p>' +
      '</div>';
  };

  VIEWS.populated = function () {
    return totals() + prBanner() +
      '<div class="section mt-4"><div class="section__head"><h2 class="t-label">What you did</h2>' +
        '<span class="t-meta num">' + S.w.exercises.length + '</span></div>' +
        S.w.exercises.map(exerciseCard).join('') +
      '</div>' +
      feelCard() + noteCard() + actions();
  };

  VIEWS.cardio = function () {
    return totals() +
      '<div class="card mt-4" data-testid="detail-cardio">' +
        '<div class="hstack hstack--3">' +
          '<span class="ico-well">' + ICO.cardio + '</span>' +
          '<span class="stack stack--1 grow">' +
            '<span class="t-section">' + esc(S.w.name) + '</span>' +
            '<span class="t-detail quiet">Logged by hand, so there is no split or route to show.</span>' +
          '</span>' +
        '</div></div>' +
      noteCard() + actions();
  };

  VIEWS.deleted = function () {
    return '<div class="empty mt-5" data-testid="detail-deleted">' +
        '<p class="empty__title">Session deleted</p>' +
        '<p class="empty__body">It is out of your history, your records and your charts. ' +
          'If that was a mistake, the undo below is live for a few seconds.</p>' +
        '<button class="btn btn--secondary mt-2" type="button" data-act="back" data-testid="deleted-back">' +
          '<span class="btn__label">Back to Train</span></button>' +
      '</div>';
  };

  VIEWS.loading = function () {
    return '<div class="mt-4" role="status" aria-busy="true" aria-label="Loading the session">' +
      '<div class="skel" style="height: var(--sp-3); width: 60%"></div>' +
      '<div class="card mt-4">' +
        '<div class="skel" style="height: var(--sp-5); width: 50%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-3); width: 100%"></div>' +
        '<div class="skel mt-2" style="height: var(--sp-3); width: 80%"></div>' +
      '</div>' +
      '<div class="card mt-3">' +
        '<div class="skel" style="height: var(--sp-5); width: 40%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-3); width: 100%"></div>' +
        '<div class="skel mt-2" style="height: var(--sp-3); width: 70%"></div>' +
      '</div>' +
    '</div>';
  };

  VIEWS.error = function () {
    return '<div class="banner banner--error mt-4" role="alert" data-testid="detail-error">' +
        ICO.alert +
        '<span><strong>Could not open this session</strong>It is on this phone; the app ' +
          'could not read it just now. Nothing has been changed or lost.</span>' +
      '</div>' +
      '<button class="btn btn--primary btn--block mt-3" type="button" data-act="retry" data-testid="detail-retry">' +
        '<span class="btn__label">Try again</span></button>';
  };

  /* ---------------------------------------------------------------
     Paint
     --------------------------------------------------------------- */
  var hdr = document.getElementById('hdr');
  var body = document.getElementById('body');
  var overlay = document.getElementById('overlay');
  var screen = document.getElementById('screen');
  var toastTimer = null;

  function toastHTML() {
    if (!S.toast) return '';
    return '<div class="toast" role="status" data-testid="toast">' +
      '<span class="toast__body">' + esc(S.toast) + '</span>' +
      (S.undo ? '<button class="toast__action" type="button" data-act="undo" data-testid="undo">Undo</button>' : '') +
    '</div>';
  }

  function render() {
    screen.setAttribute('data-state', S.state);
    LKPatch(hdr, headerHTML());
    LKPatch(body, S.edit ? VIEWS.edit() : (VIEWS[S.state] || VIEWS.populated)());
    LKPatch(overlay, toastHTML());
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.state));
    });
    if (window.LKChrome) LKChrome.init(document);
    clearTimeout(toastTimer);
    if (S.toast) toastTimer = setTimeout(function () { S.toast = null; S.undo = null; render(); }, 6000);
  }

  function say(msg, undo) {
    S.toast = msg;
    S.undo = undo || null;
    render();
  }


  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t) return;
    var a = t.getAttribute('data-act');

    /* These leave the screen. In the demo the router takes the click first;
       each destination is declared in MANIFEST.nav. */
    if (a === 'back') { location.href = 'train.html'; return; }
    /* Repeat now HANDS THE SESSION OVER. It opened the workout log, which
       built today's Push day from the split whatever you had been reading,
       so "Do this session again" reliably started a different session. The
       log reads lk_repeatWorkout at boot and starts from these lifts. */
    if (a === 'repeat') {
      if (window.LKStore) {
        LKStore.set('lk_repeatWorkout', {
          name: S.w.name,
          from: S.w.id,
          exercises: S.w.exercises.map(function (e) {
            return { id: e.id, name: e.name, muscle: e.muscle,
                     sets: e.sets.filter(function (s) { return !s.warm; }).length };
          })
        });
      }
      location.href = 'workout-log.html';
      return;
    }
    if (a === 'edit') {
      if (S.w.kind !== 'lift') { say('A cardio session has no sets to edit.'); return; }
      S.edit = draftFrom(S.w);
      render();
      focusIn('ed-name');
      return;
    }

    /* ---- edit mode ---- */
    if (a === 'ed-warm') {
      S.edit.exercises[Number(t.dataset.ex)].sets[Number(t.dataset.set)].warm =
        !S.edit.exercises[Number(t.dataset.ex)].sets[Number(t.dataset.set)].warm;
      render(); return;
    }
    if (a === 'ed-delset') {
      var dex = S.edit.exercises[Number(t.dataset.ex)];
      dex.sets.splice(Number(t.dataset.set), 1);
      render(); say('Set removed. Nothing is written until you save.'); return;
    }
    if (a === 'ed-addset') {
      var aex = S.edit.exercises[Number(t.dataset.ex)];
      var lastS = aex.sets[aex.sets.length - 1];
      aex.sets.push({ kg: lastS ? lastS.kg : null, reps: lastS ? lastS.reps : null,
                      rir: lastS ? lastS.rir : 2, warm: false });
      render(); say('Set added to ' + aex.name + '.'); return;
    }
    if (a === 'ed-delex') {
      var goneEx = S.edit.exercises.splice(Number(t.dataset.ex), 1)[0];
      render(); say(goneEx.name + ' removed. Nothing is written until you save.'); return;
    }
    if (a === 'ed-cancel') { S.edit = null; render(); focusIn('detail-edit'); say('Edit cancelled. Nothing was changed.'); return; }
    if (a === 'ed-save') {
      if (!S.edit.exercises.length) {
        say('Nothing left to save. Delete the session instead.');
        return;
      }
      var draft = S.edit;
      var ok = writeRecord(S.w.id, function (rec) {
        rec.name = draft.name.trim() || rec.name;
        rec.exercises = draft.exercises.map(function (e) {
          return { id: e.id, name: e.name, muscle: e.muscle,
                   sets: e.sets.map(function (s) {
                     return { kg: s.kg, reps: s.reps, rir: s.rir, warm: !!s.warm, done: true };
                   }) };
        });
        return recount(rec);
      });
      S.edit = null;
      var again = fromFixture(S.w.id);
      if (again) S.w = again;
      render();
      focusIn('detail-edit');
      /* A session that is not in stored history -- the dev states' own
         material -- can be edited and read back, but there is nothing to
         write it to, and saying "saved to your history" would be a lie. */
      say(ok ? 'Session updated in your history.'
             : 'Changed on this screen. This one is a demo session, so there is nothing in your history to write to.');
      return;
    }

    if (a === 'note-edit') {
      S.editingNote = true;
      S.noteDraft = S.w.note;
      render();
      var f = document.getElementById('note-field');
      if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
      return;
    }
    if (a === 'note-cancel') { S.editingNote = false; render(); focusIn('note-edit'); return; }
    if (a === 'note-save') {
      var fld = document.getElementById('note-field');
      S.w.note = fld ? fld.value.trim() : S.w.note;
      S.editingNote = false;
      /* The note was a variable on this page. It said "Note saved." and the
         next load showed the old one. */
      var noted = S.w.note;
      var wrote = writeRecord(S.w.id, function (rec) { rec.note = noted; return rec; });
      render();
      focusIn('note-edit');
      say(wrote ? (noted ? 'Note saved.' : 'Note cleared.')
                : 'Kept on this screen. This one is a demo session, so there is nothing in your history to write to.');
      return;
    }
    if (a === 'delete') {
      var was = S.state;
      /* "Deleting takes it out of your history" was a sentence and nothing
         else: the row was still in lk_history, so Train and Home still
         counted a session the screen said was gone. It leaves history now,
         and Undo puts it back where it was. */
      var list = history().slice();
      var at = indexOfId(list, S.w.id);
      var cut = at > -1 ? list.splice(at, 1)[0] : null;
      if (cut) saveHistory(list);
      S.state = 'deleted';
      S.deleted = true;
      render();
      say('Session deleted.', function () {
        S.state = was; S.deleted = false;
        if (cut) {
          var back = history().slice();
          back.splice(Math.min(at, back.length), 0, cut);
          saveHistory(back);
        }
      });
      return;
    }
    if (a === 'undo') {
      if (S.undo) S.undo();
      S.undo = null; S.toast = null;
      render();
      return;
    }
    if (a === 'retry') {
      S.state = 'loading'; render();
      setTimeout(function () { S.state = 'populated'; render(); }, 700);
      return;
    }
  });

  function focusIn(testid) {
    var el = document.querySelector('[data-testid="' + testid + '"]');
    if (el) el.focus();
  }

  /* Typing in the editor. The draft is updated in place and the totals line
     is repainted, so the working-set count and the volume track what is on
     screen rather than what the record said when it was opened. Weights are
     typed in the profile's unit and stored in kilograms, which is the model. */
  document.addEventListener('input', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t || !S.edit) return;
    var a = t.getAttribute('data-act');
    if (a === 'ed-name') { S.edit.name = t.value; return; }
    if (a !== 'ed-kg' && a !== 'ed-reps' && a !== 'ed-rir') return;
    var st = S.edit.exercises[Number(t.dataset.ex)].sets[Number(t.dataset.set)];
    var v = t.value === '' ? null : Number(t.value);
    if (v !== null && isNaN(v)) return;
    if (a === 'ed-kg') st.kg = v === null ? null : (LKUnits.useKg() ? v : Math.round((v / LKUnits.lbPerKg) * 100) / 100);
    else if (a === 'ed-reps') st.reps = v === null ? null : Math.round(v);
    else st.rir = v === null ? null : Math.round(v);
    var tot = draftTotals(S.edit);
    var el = document.querySelector('[data-testid="ed-totals"]');
    if (el) LKPatch(el, n(tot.sets) + ' working sets &middot; ' + n(LKUnits.fmtTotal(tot.vol)));
  });

  /* ---- dev states -------------------------------------------------- */
  var STATES = [
    ['populated', 'Lifting session'],
    ['cardio', 'Cardio session'],
    ['deleted', 'Deleted'],
    ['loading', 'Loading'],
    ['error', 'Error']
  ];
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join(''));
  toggle.addEventListener('click', function () {
    var open = menu.hidden;
    menu.hidden = !open;
    this.setAttribute('aria-expanded', String(open));
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (!b) return;
    S.state = b.dataset.state;
    /* A fresh session per state, so a note written in one does not appear
       in the next. */
    S.w = b.dataset.state === 'cardio' ? clone(CARDIO) : clone(SESSION);
    S.editingNote = false; S.toast = null; S.undo = null; S.edit = null;
    render();
  });
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* The session Train handed over, built from the shared fixture. SESSION and
     CARDIO above stay as the dev states' own material; they are no longer
     what a history row opens. Every row used to open SESSION, so eighteen
     different workouts showed one fixed Sep 5 Pull whose lifts and totals
     match no session in the fixture. */
  function fromFixture(id) {
    var FX = window.LKFixtures || {};
    var w = recordById(id);
    if (!w) return null;
    if (w.kind === 'cardio') {
      return { id: w.id, kind: 'cardio', name: w.name, date: w.date, min: w.min,
               km: w.km, cal: w.cal, note: w.note || '', feel: null, exercises: [] };
    }
    /* A record is a record: the PR badge is on a set only when that set is
       one of the stored records for that lift. */
    var prSet = {};
    (FX.prs || []).forEach(function (p) { prSet[p.exId] = p; });
    return {
      id: w.id, kind: 'lift', name: w.name, date: w.date, min: w.min,
      note: w.note || '', feel: w.reflection || null,
      exercises: w.exercises.map(function (ex) {
        var last = lastTimeIn(ex.id, w.date);
        var rec = prSet[ex.id];
        return {
          id: ex.id, name: ex.name, muscle: ex.muscle || '', note: '',
          /* Working sets are compared against working sets, and a warm-up is
             compared against nothing: the first pass indexed the previous
             session's working rows by a counter that included this session's
             warm-up, so every row read one set out of step and the warm-up
             itself claimed to be "Was 85 x 7". */
          sets: (function () {
            var prevWork = last
              ? last.exercise.sets.filter(function (x) { return x.done && !x.warm; })
              : [];
            var wi = -1, prClaimed = false;
            return ex.sets.filter(function (st) { return st.done; }).map(function (st) {
              if (!st.warm) wi++;
              var lp = st.warm ? null : prevWork[wi];
              /* One record, one badge. Two identical sets both matched the
                 stored record and both wore PR, so the session claimed more
                 records than it set. */
              var isPr = !!(rec && !st.warm && !prClaimed && rec.date === w.date &&
                            st.kg === rec.kg && st.reps === rec.reps);
              if (isPr) prClaimed = true;
              return {
                kg: st.kg, reps: st.reps, rir: st.rir, warm: st.warm,
                prev: lp ? lp.kg + ' x ' + lp.reps : null,
                pr: isPr
              };
            });
          })()
        };
      })
    };
  }

  var openId = null;
  try { openId = localStorage.getItem('lk_openWorkout'); } catch (e) {}
  var handed = openId ? fromFixture(openId) : null;
  S.w = handed || clone(SESSION);
  if (handed && handed.kind === 'cardio') S.state = 'cardio';
  var q = new URLSearchParams(location.search);
  if (q.get('state') && VIEWS[q.get('state')]) {
    S.state = q.get('state');
    S.w = q.get('state') === 'cardio' ? clone(CARDIO) : clone(SESSION);
  }
  render();
  requestAnimationFrame(function () { window.__ready = true; });
})();

  /* The running workout, from a screen that is not it. Leaving the workout
     log used to lose the session outright: nothing was written down, and no
     screen but Home and Fuel had anywhere to say one was open. The record
     lives in session.js; this mounts its shelf and takes the tap back. */
  if (window.LKSession) {
    LKSession.mount(document.getElementById('shelf-slot'),
      typeof LKPatch === 'function' ? LKPatch : null);
    document.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-testid="shelf-resume"]') : null;
      if (el) { e.preventDefault(); location.href = 'workout-log.html'; }
    });
  }
</script>
</body>
</html>
