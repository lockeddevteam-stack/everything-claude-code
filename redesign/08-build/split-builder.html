<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOCKED — Split builder</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="fixtures.js"></script>
<script src="store.js"></script>
<script src="units.js"></script>
<script src="reorder.js"></script>
<script src="app.js"></script>
<script src="chrome.js"></script>
<script src="cloud-config.js"></script>
<script src="cloud.js"></script>
<script src="session.js"></script>
<style>
  /* Demo chrome only. Layout, no new values: every colour, size, radius and
     duration below is a token from tokens.css. */
  .stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--sp-5);
    background: var(--surface-sunken);
  }
  .phone {
    position: relative;
    width: 393px;
    height: 852px;
    background: var(--bg);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-overlay);
    overflow: hidden;
    isolation: isolate;
  }
  .app { height: 100%; }
  /* Fluid fallback: on a real phone the frame becomes the window. */
  @media (max-width: 460px), (max-height: 900px) {
    .stage { padding: 0; align-items: stretch; }
    .phone { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
  }
  /* Demo chrome moved off the top-right corner: that corner is now the
     screen's own Edit control. */
  .daycard__head { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2); }
  .daycard__foot { padding: var(--sp-2); }
  .movebar { display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-2) var(--sp-2); }
  .movebar .btn { flex: 1; }
  .chipwrap { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .sheet__foot { padding-top: var(--sp-3); }
  .dialog__acts { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-4); }
  .skelline { height: var(--sp-4); }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="app" id="app"></div>
    <!-- The same state inspector every other screen carries, from the
         shared layer. This screen had its own, under its own names. -->
    <div class="dev">
      <button class="dev__toggle" id="devToggle" aria-expanded="false"
              aria-controls="devPanel" data-testid="dev-toggle">State</button>
      <div class="dev__menu" id="devPanel" hidden data-testid="dev-menu"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------
     Icons. One set, one stroke weight, one optical size.
     --------------------------------------------------------------- */
  var P = {
    back: '<path d="M15 5l-7 7 7 7"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    trash: '<path d="M4 7h16M9 7V4h6v3M10 11v6M14 11v6M6 7l1 13h10l1-13"/>',
    grip: '<path d="M6 9h12M6 15h12"/>',
    up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
    down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
    check: '<path d="M20 6L9 17l-5-5"/>',
    circle: '<circle cx="12" cy="12" r="8"/>',
    chev: '<path d="M9 6l6 6-6 6"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    spark: '<path d="M12 3l1.9 4.9L19 10l-5.1 2.1L12 17l-1.9-4.9L5 10l5.1-2.1z"/>',
    layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
    alert: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
    search: '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',
    swap: '<path d="M4 8h13l-3-3M20 16H7l3 3"/>'
  };
  function ico(name, cls) {
    return '<svg class="ico' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + P[name] + '</svg>';
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  var uid = 0;
  function nid(p) { uid += 1; return p + uid; }

  /* ---------------------------------------------------------------
     Data
     --------------------------------------------------------------- */
  /* Replaced by the full catalogue once it loads; see the fetch at the
     bottom of this file. */
  var LIBRARY = [
    { name: 'Barbell Bench Press', muscle: 'Chest' },
    { name: 'Incline Dumbbell Press', muscle: 'Chest' },
    { name: 'Standing Overhead Press', muscle: 'Shoulders' },
    { name: 'Cable Lateral Raise', muscle: 'Shoulders' },
    { name: 'Weighted Pull-Up', muscle: 'Back' },
    { name: 'Chest-Supported Row', muscle: 'Back' },
    { name: 'Face Pull', muscle: 'Rear delts' },
    { name: 'Incline Dumbbell Curl', muscle: 'Biceps' },
    { name: 'Rope Pushdown', muscle: 'Triceps' },
    { name: 'Back Squat', muscle: 'Quads' },
    { name: 'Romanian Deadlift', muscle: 'Hamstrings' },
    { name: 'Leg Press', muscle: 'Quads' },
    { name: 'Lying Leg Curl', muscle: 'Hamstrings' },
    { name: 'Standing Calf Raise', muscle: 'Calves' }
  ];

  function ex(name, muscle) { return { id: nid('x'), name: name, muscle: muscle }; }

  /* THE SPLIT IS THE STORED SPLIT. This screen invented a "PPL v2" of three
     days and twelve exercises; the reader's own PPL has three days and
     fifteen, and Home and Train both name it and count it correctly. Opening
     the builder to edit a split and being shown a different split with
     different exercises is the worst possible answer to "what am I running".

     Which split: whichever Train handed over, else the first stored one. */
  /* Through the store, so an edit saved here is the split Train and Home
     read. The builder read the fixture directly, which was right when nothing
     could be saved and wrong the moment anything could. */
  function allSplits() {
    if (window.LKStore) return window.LKStore.get('lk_splits', []) || [];
    return (window.LKFixtures && LKFixtures.splits) || [];
  }

  /* A DAY'S LIFTS, in either shape it is stored in. What a phone that has
     been running LOCKED holds is `exIds: [111, 302, ...]` -- that is what
     tests/fixtures/seed-data.json carries, because it is a copy of one --
     while this builder writes the resolved `exercises: [{id, name, group,
     muscle}]`. Reading only the second threw on `undefined.map` for a real
     user's split; reading only the first would lose the names this screen
     has to print. Both, resolved through the catalogue, and a save writes
     the resolved shape back, so a split edited here stops being ambiguous. */
  function libById(id) {
    for (var i = 0; i < LIBRARY.length; i++) if (LIBRARY[i].id === id) return LIBRARY[i];
    return null;
  }
  function fixtureDay(splitId, dayName) {
    var fx = (window.LKFixtures && LKFixtures.splits) || [];
    for (var i = 0; i < fx.length; i++) {
      if (fx[i].id !== splitId) continue;
      var days = fx[i].days || [];
      for (var j = 0; j < days.length; j++) if (days[j].name === dayName) return days[j];
    }
    return null;
  }
  function dayExercises(d, splitId) {
    if (d && d.exercises && d.exercises.length) return d.exercises;
    var ids = (d && d.exIds) || [];
    if (!ids.length) return [];
    var fx = fixtureDay(splitId, d.name);
    var byId = {};
    ((fx && fx.exercises) || []).forEach(function (e) { byId[e.id] = e; });
    return ids.map(function (id) {
      var known = byId[id] || libById(id);
      return { id: id, name: (known && known.name) || ('Exercise ' + id),
               group: (known && known.group) || '', muscle: (known && known.muscle) || '' };
    });
  }

  /* A BLOCK — F-TRAIN-104. A warm-up, a mobility section, a finisher: a named
     part of a day that is not a lift with sets. The workout log has held one
     mid-session for a while, as { title, notes, duration, open }, and the
     stored split day has always carried a `blocks` array -- empty, because
     nothing could ever put anything in it. This is the same object, so a
     block programmed into a day and a block added during a session are one
     thing rather than two that happen to look alike. */
  function blockRow(b) {
    return { id: nid('b'), title: b.title || '', notes: b.notes || '',
             duration: b.duration || '', open: !!b.open };
  }

  function splitFromFixture(id) {
    var all = allSplits();
    if (!all.length) return null;
    var sp = null;
    if (id) { for (var i = 0; i < all.length; i++) if (all[i].id === id) sp = all[i]; }
    if (!sp) sp = all[0];
    return {
      id: sp.id,
      created: sp.created,
      name: sp.name,
      days: (sp.days || []).map(function (d) {
        return { id: nid('d'), name: d.name,
                 blocks: (d.blocks || []).map(blockRow),
                 exercises: dayExercises(d, sp.id).map(function (e) {
                   var row = ex(e.name, e.muscle || '');
                   /* The catalogue id, kept so a saved split still points at
                      the same exercises the rest of the app knows. */
                   row.exId = e.id;
                   row.group = e.group || '';
                   return row;
                 }) };
      })
    };
  }
  function seedSplit() {
    var want = null;
    try { want = localStorage.getItem('lk_openSplit'); } catch (e) {}
    /* New means empty. It used to mean "the same fixture as Edit". */
    if (want === '__new__') return { name: '', days: [] };
    return splitFromFixture(want) || { name: 'Split', days: [] };
  }

  function slot(role, pick, pickWhy, alts) {
    return { id: nid('s'), role: role, pick: pick, pickWhy: pickWhy, alts: alts, choice: 'auto' };
  }
  function alt(name, tag, why) { return { id: nid('a'), name: name, tag: tag, why: why }; }

  function seedPlan() {
    return {
      title: 'Push, pull, legs — 3 days',
      note: '3 days a week, barbell and cables, shoulders need volume',
      days: [
        { id: nid('p'), name: 'Push', slots: [
          slot('Horizontal press', 'Barbell Bench Press', 'Heaviest press you can load', [
            alt('Dumbbell Bench Press', 'Equipment', 'Dumbbells only'),
            alt('Incline Barbell Press', 'Emphasis', 'More upper chest'),
            alt('Machine Chest Press', 'Difficulty', 'Safe to push alone')]),
          slot('Vertical press', 'Standing Overhead Press', 'Builds the shoulder volume you asked for', [
            alt('Seated Dumbbell Press', 'Equipment', 'Dumbbells only'),
            alt('Landmine Press', 'Difficulty', 'Kinder on the shoulder'),
            alt('Machine Shoulder Press', 'Emphasis', 'Front delts, less core')]),
          slot('Side delts', 'Cable Lateral Raise', 'Steady tension through the range', [
            alt('Dumbbell Lateral Raise', 'Equipment', 'No cable needed'),
            alt('Machine Lateral Raise', 'Difficulty', 'Holds form when tired'),
            alt('Cable Y-Raise', 'Emphasis', 'Side delts and traps')]),
          slot('Triceps', 'Overhead Cable Extension', 'Long head, stretched', [
            alt('Skull Crusher', 'Equipment', 'Barbell and bench'),
            alt('Rope Pushdown', 'Difficulty', 'Easiest to load and stop'),
            alt('Dip', 'Emphasis', 'Chest and triceps together')])
        ]},
        { id: nid('p'), name: 'Pull', slots: [
          slot('Vertical pull', 'Weighted Pull-Up', 'Strongest back builder you have room for', [
            alt('Lat Pulldown', 'Difficulty', 'Scales below bodyweight'),
            alt('Neutral-Grip Pulldown', 'Emphasis', 'Less elbow strain'),
            alt('Assisted Pull-Up', 'Equipment', 'Assist machine')]),
          slot('Horizontal pull', 'Chest-Supported Row', 'No lower-back cost', [
            alt('Barbell Row', 'Emphasis', 'More lower back'),
            alt('Seated Cable Row', 'Equipment', 'Cable stack'),
            alt('Single-Arm Dumbbell Row', 'Difficulty', 'One side at a time')]),
          slot('Rear delts', 'Face Pull', 'Balances the pressing volume', [
            alt('Reverse Pec Deck', 'Equipment', 'Machine'),
            alt('Bent-Over Reverse Fly', 'Equipment', 'Dumbbells only'),
            alt('Cable Rear Delt Row', 'Emphasis', 'Rear delts and traps')]),
          slot('Biceps', 'Incline Dumbbell Curl', 'Stretched position', [
            alt('Barbell Curl', 'Difficulty', 'Heaviest loading'),
            alt('Cable Curl', 'Emphasis', 'Tension at the top'),
            alt('Hammer Curl', 'Emphasis', 'Brachialis and forearm')])
        ]},
        { id: nid('p'), name: 'Legs', slots: [
          slot('Squat', 'Back Squat', 'Main leg lift', [
            alt('Front Squat', 'Emphasis', 'More quad, less back'),
            alt('Hack Squat', 'Difficulty', 'No bar to balance'),
            alt('Goblet Squat', 'Equipment', 'One dumbbell')]),
          slot('Hinge', 'Romanian Deadlift', 'Hamstrings under stretch', [
            alt('Conventional Deadlift', 'Emphasis', 'Whole posterior chain'),
            alt('Hip Thrust', 'Emphasis', 'Glutes'),
            alt('Back Extension', 'Difficulty', 'Low spinal load')]),
          slot('Quad accessory', 'Leg Press', 'Volume without the squat fatigue', [
            alt('Bulgarian Split Squat', 'Equipment', 'Dumbbells only'),
            alt('Leg Extension', 'Emphasis', 'Quads alone'),
            alt('Walking Lunge', 'Difficulty', 'Balance under load')]),
          slot('Calves', 'Standing Calf Raise', 'Straight-leg calf work', [
            alt('Seated Calf Raise', 'Emphasis', 'Soleus'),
            alt('Leg Press Calf Raise', 'Equipment', 'Leg press'),
            alt('Single-Leg Calf Raise', 'Difficulty', 'Bodyweight only')])
        ]}
      ]
    };
  }

  /* ---------------------------------------------------------------
     State
     --------------------------------------------------------------- */
  var S = {
    screen: 'manual',
    manual: { status: 'ready', name: '', days: [], dirty: false, savedAt: null, error: null, edit: false },
    ai: { status: 'idle', note: '', plan: null, error: null, step: 0 },
    /* The photo import's own state. `url` is an object URL for the preview
       and never leaves this page. */
    photo: { file: null, url: null, size: '', note: '', error: null },
    lifted: null,          /* testid of the lifted item's grip */
    swipe: null,           /* id of the exercise row swiped open */
    dragging: null,
    modal: null,           /* {type:'leave'|'pick'|'swap', ...} */
    toast: null,
    dev: false
  };
  var timers = [];
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  function canSave() { return S.manual.name.trim().length > 0 && S.manual.days.length > 0; }
  function exCount() {
    return S.manual.days.reduce(function (n, d) { return n + d.exercises.length; }, 0);
  }
  function swapCount() {
    if (!S.ai.plan) return 0;
    var n = 0;
    S.ai.plan.days.forEach(function (d) { d.slots.forEach(function (s) { if (s.choice !== 'auto') n += 1; }); });
    return n;
  }
  function slotCount() {
    if (!S.ai.plan) return 0;
    return S.ai.plan.days.reduce(function (n, d) { return n + d.slots.length; }, 0);
  }
  /* A warning, where the split builder had none at all. Not a rule and not a
     block: a sentence naming what the day is short of or heavy on, so the
     reader can decide. The thresholds are stated because a warning whose
     threshold is hidden is a superstition.

     Under 3 exercises a day is a supplement to a session, not one.
     Over 8 is where sessions start running past ninety minutes.
     Three or more movements for one muscle in one day is where the last of
     them stops being the thing that grows anything. */
  function volumeNote(day) {
    var n = day.exercises.length;
    var msgs = [];
    if (n && n < 3) msgs.push(n + (n === 1 ? ' exercise' : ' exercises') +
      ' is a short day. Three is about where a session starts being one.');
    if (n > 8) msgs.push(n + ' exercises runs past about ninety minutes at ' +
      MIN_PER_EX_NOTE + ' minutes a lift.');
    var by = {};
    day.exercises.forEach(function (x) {
      var k = (x.muscle || '').toLowerCase();
      if (!k) return;
      by[k] = (by[k] || 0) + 1;
    });
    Object.keys(by).forEach(function (k) {
      if (by[k] >= 3) msgs.push(by[k] + ' movements for ' + k + ' in one day.');
    });
    if (!msgs.length) return '';
    return '<div class="daycard__note" data-testid="volume-note-' + day.id + '" role="note">' +
      '<p class="t-detail quiet">' + esc(msgs.join(' ')) + '</p></div>';
  }
  var MIN_PER_EX_NOTE = 10;

  function currentName(s) {
    if (s.choice === 'auto' || s.choice === 'pick') return s.pick;
    var a = s.alts.filter(function (x) { return x.id === s.choice; })[0];
    return a ? a.name : s.pick;
  }

  /* ---------------------------------------------------------------
     Manual builder
     --------------------------------------------------------------- */
  function manualHeader() {
    var m = S.manual;
    var counts = m.days.length + (m.days.length === 1 ? ' day · ' : ' days · ') +
      exCount() + (exCount() === 1 ? ' exercise' : ' exercises');
    var sub = m.dirty ? 'Unsaved changes'
      : m.savedAt ? 'Saved ' + m.savedAt
      : m.days.length ? counts
      : 'No days yet';
    /* Edit is offered only where there is something to reorder or remove. */
    var canEdit = m.days.length > 0 && m.status === 'ready';
    return '<header class="hdr" role="banner">' +
      '<button class="hdr__back" data-testid="manual-back" data-action="manual-back" aria-label="Back to Train">' + ico('back') + '</button>' +
      '<div class="hdr__title" role="heading" aria-level="1">' +
        '<div class="t-section truncate" data-testid="manual-title">' + (m.name.trim() ? esc(m.name.trim()) : 'New split') + '</div>' +
        '<div class="hstack hstack--2">' +
          (m.dirty ? '<span class="dot" aria-hidden="true"></span>' : '') +
          '<span class="t-meta" data-testid="manual-subtitle">' + esc(sub) + '</span>' +
        '</div>' +
      '</div>' +
      (canEdit ? '<button class="hdr__action" data-testid="edit-toggle" data-action="edit-toggle" data-edit="' +
        (m.edit ? 'on' : 'off') + '">' + (m.edit ? 'Done' : 'Edit') + '</button>' : '') +
    '</header>';
  }

  function gripBtn(testid, label, lifted) {
    return '<button class="grip" data-testid="' + testid + '" data-grip="1" aria-pressed="' + (lifted ? 'true' : 'false') +
      '" aria-label="' + esc(label) + '">' + ico('grip') + '</button>';
  }

  function moveBar(kind, id, dayId, first, last) {
    var d = ' data-id="' + id + '"' + (dayId ? ' data-day="' + dayId + '"' : '');
    return '<div class="movebar">' +
      '<button class="btn btn--secondary btn--sm" data-testid="move-up-' + id + '" data-action="move-' + kind + '" data-dir="-1"' + d +
        (first ? ' disabled aria-disabled="true"' : '') + '>' + ico('up') + '<span class="btn__label">Up</span></button>' +
      '<button class="btn btn--secondary btn--sm" data-testid="move-down-' + id + '" data-action="move-' + kind + '" data-dir="1"' + d +
        (last ? ' disabled aria-disabled="true"' : '') + '>' + ico('down') + '<span class="btn__label">Down</span></button>' +
      '<button class="btn btn--tertiary btn--sm" data-testid="move-done-' + id + '" data-action="lift-clear">Done</button>' +
    '</div>';
  }

  /* At rest an exercise is a line of text. The only way to destroy one is
     the iOS way: swipe it left, which reveals exactly one red button and
     leaves an Undo behind. In Edit the row grows a handle and a delete. */
  function exerciseRow(x, day, i, n) {
    var m = S.manual;
    if (!m.edit) {
      var open = S.swipe === x.id;
      return '<div class="swipe" data-swipe="1" data-id="' + x.id + '" data-day="' + day.id +
          '" data-open="' + (open ? 'true' : 'false') + '">' +
        (open ? '<button class="swipe__action" data-testid="ex-remove-' + x.id + '" data-action="ex-remove" data-id="' + x.id +
          '" data-day="' + day.id + '" aria-label="Remove ' + esc(x.name) + ' from ' + esc(day.name) + '">Delete</button>' : '') +
        '<div class="swipe__pane">' +
          '<div class="row">' +
            '<div class="row__main">' +
              '<div class="row__title">' + esc(x.name) + '</div>' +
              '<div class="row__sub">' + esc(x.muscle) + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    var gripId = 'ex-grip-' + x.id;
    var lifted = S.lifted === gripId;
    return '<div class="row sortable__item' + (lifted ? ' sortable__item--lifted' : '') +
        (S.dragging ? ' is-lifting' : '') +
        (S.dragging === gripId ? ' sortable__item--dragging is-dragging' : '') +
        '" style="--wiggle-i:' + i + '" data-sortable="1" data-id="' + x.id + '" data-day="' + day.id + '">' +
      gripBtn(gripId, 'Reorder ' + x.name + ', position ' + (i + 1) + ' of ' + n, lifted) +
      '<div class="row__main">' +
        '<div class="row__title">' + esc(x.name) + '</div>' +
        '<div class="row__sub">' + esc(x.muscle) + '</div>' +
      '</div>' +
      '<button class="iconbtn iconbtn--danger-quiet" data-testid="ex-remove-' + x.id + '" data-action="ex-remove" data-id="' + x.id +
        '" data-day="' + day.id + '" aria-label="Remove ' + esc(x.name) + ' from ' + esc(day.name) + '">' + ico('trash') + '</button>' +
    '</div>' + (lifted ? moveBar('ex', x.id, day.id, i === 0, i === n - 1) : '');
  }

  function dayCard(day, i, n) {
    var m = S.manual;
    var gripId = 'day-grip-' + day.id;
    var lifted = S.lifted === gripId;
    var rows = day.exercises.length
      ? '<div data-sortlist="ex:' + day.id + '">' + day.exercises.map(function (x, j) {
          return exerciseRow(x, day, j, day.exercises.length);
        }).join('') + '</div>'
      : '<div class="row"><div class="row__main"><div class="t-detail">No exercises yet. Add the first lift of the day.</div></div></div>';

    var head = m.edit
      ? '<div class="daycard__head">' +
          gripBtn(gripId, 'Reorder ' + day.name + ', day ' + (i + 1) + ' of ' + n, lifted) +
          '<input class="input grow" type="text" value="' + esc(day.name) + '" data-testid="day-name-' + day.id +
            '" data-action="day-name" data-id="' + day.id + '" aria-label="Name of day ' + (i + 1) + '">' +
          '<button class="iconbtn iconbtn--danger" data-testid="day-remove-' + day.id + '" data-action="day-remove" data-id="' + day.id +
            '" aria-label="Remove ' + esc(day.name) + '">' + ico('trash') + '</button>' +
        '</div>'
      : '<div class="daycard__head">' +
          '<div class="daycard__name">' +
            '<h3 class="t-section truncate">' + esc(day.name) + '</h3>' +
            '<div class="t-meta" data-num>' + day.exercises.length +
              (day.exercises.length === 1 ? ' exercise' : ' exercises') +
              ((day.blocks || []).length
                ? ' \u00b7 ' + day.blocks.length + (day.blocks.length === 1 ? ' block' : ' blocks')
                : '') + '</div>' +
          '</div>' +
        '</div>';

    return '<div class="card card--flush' + (m.edit ? ' sortable__item' : '') +
        (m.edit && lifted ? ' sortable__item--lifted' : '') +
        (m.edit && S.dragging ? ' is-lifting' : '') +
        (m.edit && S.dragging === gripId ? ' sortable__item--dragging is-dragging' : '') + '"' +
        (m.edit ? ' data-sortable="1"' : '') + ' style="--wiggle-i:' + i + '" data-id="' + day.id + '">' +
      head +
      (m.edit && lifted ? moveBar('day', day.id, null, i === 0, i === n - 1) : '') +
      volumeNote(day) +
      blockRows(day) +
      rows +
      '<div class="daycard__foot">' +
        '<button class="btn btn--secondary btn--block" data-testid="add-exercise-' + day.id + '" data-action="add-exercise" data-id="' + day.id + '">' +
          ico('plus') + '<span class="btn__label">Add exercise to ' + esc(day.name) + '</span></button>' +
        '<button class="btn btn--tertiary btn--block mt-2" data-testid="add-block-' + day.id + '" data-action="add-block" data-id="' + day.id + '">' +
          ico('plus') + '<span class="btn__label">Add a block</span></button>' +
      '</div>' +
    '</div>';
  }

  /* BLOCKS, above the lifts. A warm-up comes before the first working set and
     a finisher after the last, so they are not ordered among the exercises:
     they are the parts of the day that are not a lift with sets, listed
     together at the top of it. The row says what it is and how long it is
     meant to take; the notes open only where there are some. */
  function blockRows(day) {
    var list = day.blocks || [];
    if (!list.length) return '';
    return '<div>' + list.map(function (b, i) {
      return '<div class="row row--withaside" data-testid="block-' + b.id + '">' +
        '<span class="row__main stack">' +
          '<span class="row__title">' + esc(b.title) +
            ' <span class="badge">Block</span></span>' +
          '<span class="row__sub">' +
            (b.duration ? esc(b.duration) : 'No set length') +
            (b.notes ? ' &middot; ' + esc(b.notes) : '') + '</span>' +
        '</span>' +
        '<button class="iconbtn iconbtn--danger-quiet" data-testid="block-remove-' + b.id + '" ' +
          'data-action="block-remove" data-id="' + b.id + '" data-day="' + day.id + '" ' +
          'aria-label="Remove the block ' + esc(b.title) + ' from ' + esc(day.name) + '">' + ico('trash') + '</button>' +
      '</div>';
    }).join('') + '</div>';
  }

  /* The block form. A name, a length that may be blank because not every
     block is timed, and whatever is worth remembering about it. The same
     three questions the workout log asks when one is added mid-session. */
  function blockSheet(m) {
    var day = findDay(m.id);
    return '<div class="scrim" data-testid="scrim" data-action="close-modal"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="Add a block" data-testid="block-sheet">' +
        '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
        '<div class="sheet__head">' +
          '<div><div class="t-section">Add a block to ' + esc(day ? day.name : '') + '</div>' +
          '<div class="t-meta">A warm-up, some mobility, a finisher</div></div>' +
          '<button class="iconbtn" data-testid="block-close" data-action="close-modal" aria-label="Close">' + ico('close') + '</button>' +
        '</div>' +
        '<div class="sheet__body">' +
          '<label class="field"><span class="field__label t-label">What it is</span>' +
            '<input class="input" type="text" value="' + esc(m.title || '') + '" placeholder="Shoulder warm-up" ' +
              'data-testid="block-title" data-action="block-title" aria-label="What the block is"></label>' +
          (m.error ? '<p class="field__error" role="alert" data-testid="block-error">' + esc(m.error) + '</p>' : '') +
          '<label class="field mt-4"><span class="field__label t-label">How long (minutes)</span>' +
            '<input class="input num" type="number" min="1" max="180" step="1" inputmode="numeric" ' +
              'value="' + esc(m.mins || '') + '" placeholder="Leave blank if it is not timed" ' +
              'data-testid="block-mins" data-action="block-mins" aria-label="How long the block takes"></label>' +
          '<label class="field mt-4"><span class="field__label t-label">Notes</span>' +
            '<textarea class="input" rows="3" data-testid="block-notes" data-action="block-notes" ' +
              'placeholder="Band pull-aparts, two sets of twenty. Then the empty bar.">' + esc(m.notes || '') + '</textarea></label>' +
          '<p class="field__help mt-3">It sits at the top of the day, before the lifts, and comes back ' +
            'when you start that day in the workout log.</p>' +
        '</div>' +
        '<div class="sheet__foot">' +
          '<button class="btn btn--primary btn--block" data-testid="block-save" data-action="block-save">' +
            '<span class="btn__label">Add the block</span></button>' +
        '</div>' +
      '</div>';
  }

  function manualBody() {
    var m = S.manual;
    if (m.status === 'loading') {
      return '<div class="body" role="main" data-testid="manual-loading">' +
        '<div class="section" aria-busy="true" aria-live="polite">' +
          '<p class="t-detail" data-testid="manual-loading-text">Opening PPL v2 from this phone.</p>' +
          '<div class="skel skelline mt-4" style="width:60%"></div>' +
          '<div class="card mt-4"><div class="skel skelline" style="width:40%"></div>' +
          '<div class="skel skelline mt-3" style="width:80%"></div><div class="skel skelline mt-3" style="width:70%"></div></div>' +
          '<div class="card"><div class="skel skelline" style="width:35%"></div>' +
          '<div class="skel skelline mt-3" style="width:75%"></div><div class="skel skelline mt-3" style="width:65%"></div></div>' +
        '</div></div>';
    }

    /* The name lives in the header once the split is SAVED. The condition was
       "while it is unnamed", which is true for exactly as long as the field is
       empty: the first keystroke made the name truthy, the render dropped the
       field mid-typing, focus fell to the body, and every character after the
       first went nowhere. A new split could not be given a name longer than
       one letter.

       savedAt is the right test because it is the thing that changes once,
       when the split becomes a split, rather than on every keystroke. */
    var head = (m.edit || !m.savedAt)
      ? '<div class="section">' +
          '<label class="field">' +
            '<span class="field__label t-label">Split name</span>' +
            '<input class="input" type="text" value="' + esc(m.name) + '" placeholder="Push pull legs" ' +
              'data-testid="split-name" data-action="split-name" aria-label="Split name">' +
          '</label>' +
        '</div>'
      : '';

    var err = m.error
      ? '<div class="section"><div class="banner banner--error" role="alert" data-testid="manual-error">' + ico('alert') +
        '<div><strong>Save failed</strong>' + esc(m.error) + '</div></div></div>'
      : '';

    if (!m.days.length) {
      return '<div class="body" role="main" data-testid="manual-empty">' + err + head +
        '<div class="empty section">' +
          '<span class="empty__ico">' + ico('layers', 'ico--lg') + '</span>' +
          '<h2 class="empty__title">No days yet</h2>' +
          '<p class="empty__body">A split is a list of training days. Add a day, then add the lifts you do on it.</p>' +
          '<button class="btn btn--primary" data-testid="add-day-empty" data-action="add-day">' + ico('plus') +
            '<span class="btn__label">Add a day</span></button>' +
          '<button class="btn btn--tertiary" data-testid="go-ai" data-action="go-ai">' + ico('spark') +
            '<span class="btn__label">Let LOCKED draft it</span></button>' +
        '</div>' +
      '</div>';
    }

    var hint = m.edit
      ? 'Drag a handle to reorder, or tap it to move with buttons. Tap Done when you are finished.'
      : 'Swipe a lift left to remove it. Tap Edit to reorder, rename or delete.';

    var days = '<div class="section">' +
      '<div class="section__head"><h2 class="t-label">Days</h2>' +
      '<span class="t-meta" data-num>' + m.days.length + ' · ' + exCount() + ' exercises</span></div>' +
      '<p class="t-detail" data-testid="reorder-hint">' + hint + '</p>' +
      '<div class="mt-3" data-sortlist="days">' +
        m.days.map(function (d, i) { return dayCard(d, i, m.days.length); }).join('') +
      '</div>' +
      '<button class="btn btn--secondary btn--block mt-3" data-testid="add-day" data-action="add-day">' + ico('plus') +
        '<span class="btn__label">Add a day</span></button>' +
    '</div>';

    return '<div class="body" role="main" data-testid="manual-populated" data-edit="' + (m.edit ? 'on' : 'off') + '">' +
      err + head + days + '</div>';
  }

  /* The accent fill is the unsaved work, nothing else. A clean split has no
     Save button at all: the state is told in the header instead. */
  function showBar() {
    var m = S.manual;
    return m.status === 'saving' || (m.dirty && canSave());
  }

  function manualBar() {
    if (!showBar()) return '';
    var m = S.manual;
    var busy = m.status === 'saving';
    var status = m.error ? 'Draft kept on this phone' : 'Unsaved changes';
    var label = m.error ? 'Try saving again' : 'Save split';
    var primaryClass = S.modal ? 'btn btn--secondary' : 'btn btn--primary';
    return '<div class="actionbar" role="contentinfo" aria-label="Split actions" data-testid="manual-actionbar">' +
      '<div class="actionbar__status" data-testid="manual-status">' + esc(status) + '</div>' +
      '<button class="' + primaryClass + '" data-testid="save-split" data-action="save" ' +
        (busy ? 'aria-busy="true" disabled aria-disabled="true" ' : '') + '>' +
        (busy ? '<span class="spinner"></span>' : '') +
        '<span class="btn__label">' + label + '</span></button>' +
    '</div>';
  }

  function manualScreen() {
    return '<section class="screen" data-testid="screen-manual" data-state="' + S.manual.status + '">' +
      manualHeader() + manualBody() + (window.LKSession ? LKSession.html() : '') + manualBar() + '</section>';
  }

  /* ---------------------------------------------------------------
     AI builder
     --------------------------------------------------------------- */
  /* WHAT THIS DRAFTER IS — F-TRAIN-309.

     It used to run four progress steps over nine hundred milliseconds each --
     "Reading your description", "Choosing the training days" -- while nothing
     read anything and nothing was chosen: the plan was a twelve-slot literal
     in this file, and the only two words it could act on were "dumbbell" and
     "machine". Anything else you typed was printed back above the plan as
     though it had been understood. That is the exact theatre the build brief
     forbids: a picture of a model thinking.

     So: the draft is a RULE, it runs on this phone, it runs instantly because
     there is nothing to wait for, and it says so in those words. What it can
     read is a short, stated list, and after it runs it prints what it read
     and what it ignored, so the difference between the two is on screen
     rather than hidden behind a spinner.

     The half that would take a free description and actually understand it
     is a model. There is a server now and LKCloud.ask reaches one, but this
     drafter has not been given to it: it is still the rule, and it still
     says so in those words rather than implying otherwise. */
  var READS = [
    'How many days a week',
    'Equipment you named \u2014 dumbbells, machines, cables, barbell, bodyweight',
    'Anything you said to avoid \u2014 \u201cno deadlifts\u201d, \u201cno squats\u201d'
  ];

  function aiHeader() {
    var sub = S.ai.status === 'ready' ? S.ai.plan.title : 'One description, one draft';
    return '<header class="hdr" role="banner">' +
      '<button class="hdr__back" data-testid="ai-back" data-action="ai-back" aria-label="Back to the two ways in">' + ico('back') + '</button>' +
      '<div class="hdr__title" role="heading" aria-level="1">' +
        '<div class="t-section">Draft a split</div>' +
        '<div class="t-meta" data-testid="ai-subtitle" data-num>' + esc(sub) + '</div>' +
      '</div>' +
    '</header>';
  }

  function aiIdleBody() {
    var examples = ['3 days, barbell only', 'Upper lower, 4 days', 'Shoulders need volume', 'No deadlifts, bad back'];
    return '<div class="body" role="main" data-testid="ai-empty">' +
      '<div class="section">' +
        '<label class="field">' +
          '<span class="field__label t-label">What do you want to train</span>' +
          '<textarea class="input" rows="4" data-testid="ai-note" data-action="ai-note" ' +
            'placeholder="Three days a week, barbell and cables, shoulders need volume." ' +
            'aria-label="Describe the split you want">' + esc(S.ai.note) + '</textarea>' +
          '<span class="field__help">Days per week, equipment, anything to avoid. One or two lines is enough.</span>' +
        '</label>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">Add a detail</h2></div>' +
        '<div class="chipwrap">' + examples.map(function (t, i) {
          return '<button class="chip" data-testid="ai-example-' + i + '" data-action="ai-example" data-text="' + esc(t) + '">' +
            ico('plus') + esc(t) + '</button>';
        }).join('') + '</div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">What this can read</h2></div>' +
        '<div class="card"><ul class="t-detail" data-testid="ai-reads">' +
          READS.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') +
        '</ul>' +
        '<p class="t-caption-1 quiet mt-3">This is a rule running on your phone, not a model. ' +
        'It fills every slot from a fixed set of movements and swaps them for what you named. ' +
        'Anything it cannot read it leaves alone and tells you it left alone \u2014 it does not ' +
        'guess, and nothing you type is sent anywhere.</p></div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="banner banner--info">' + ico('spark') +
        '<div><strong>Every lift comes with three alternatives</strong>Accept the draft as it stands, or swap any single lift. Nothing is required.</div></div>' +
      '</div>' +
    '</div>';
  }

  /* Kept, and honest. Building the draft is arithmetic on this device and
     takes no measurable time, so there is nothing to wait for and no progress
     to report. If the drafting ever moves to a model on a server there will
     be a wait, and this is the state that will describe it. */
  function aiLoadingBody() {
    return '<div class="body" role="main" data-testid="ai-loading">' +
      '<div class="section" aria-live="polite">' +
        '<h2 class="t-section">Building your split</h2>' +
        '<p class="t-detail mt-2" data-testid="ai-loading-note">From: “' + esc(S.ai.note) + '”</p>' +
        '<div class="card mt-4"><div class="skel skelline" style="width:55%"></div>' +
          '<div class="skel skelline mt-3" style="width:80%"></div>' +
          '<div class="skel skelline mt-3" style="width:70%"></div></div>' +
      '</div>' +
    '</div>';
  }

  /* THE ONE WAY THIS CAN FAIL, and it is a real one: a description with
     nothing in it the rule can read. It used to say "The coach service did
     not answer" over a builder that calls no service at all -- an error about
     a thing that does not exist, which is as untrue as a success about one.
     Refusing is the right answer: returning a three-day barbell push/pull/legs
     to somebody who asked for something else is the defect this row is. */
  function aiErrorBody() {
    return '<div class="body" role="main" data-testid="ai-error">' +
      '<div class="section">' +
        '<div class="banner banner--error" role="alert">' + ico('alert') +
        '<div><strong>Nothing in that description could be read</strong>' + esc(S.ai.error) + '</div></div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">What this can read</h2></div>' +
        '<div class="card"><ul class="t-detail">' +
          READS.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') +
        '</ul></div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">Your description is kept</h2></div>' +
        '<div class="card"><p class="t-body">' + esc(S.ai.note || 'Three days a week, barbell and cables, shoulders need volume.') + '</p></div>' +
        '<button class="btn btn--secondary btn--block mt-3" data-testid="ai-edit-note" data-action="ai-edit-note">Edit the description</button>' +
        '<button class="btn btn--secondary btn--block mt-3" data-testid="ai-fallback-manual" data-action="pick-back">Build it by hand instead</button>' +
      '</div>' +
    '</div>';
  }

  function slotRow(s, day) {
    var swapped = s.choice !== 'auto';
    var sub = swapped
      ? (s.choice === 'pick' ? 'Pinned' : altOf(s).tag + ': ' + altOf(s).why)
      : '3 alternatives';
    return '<button class="row" data-testid="slot-' + s.id + '" data-action="open-swap" data-id="' + s.id + '" data-day="' + day.id + '">' +
      '<div class="row__main">' +
        '<div class="row__title">' + esc(currentName(s)) + '</div>' +
        '<div class="row__sub">' + esc(s.role) + ' · ' + esc(sub) + '</div>' +
      '</div>' +
      (swapped ? '<span class="chip chip--on">Swapped</span>' : '') +
      '<span class="row__chev">' + ico('chev') + '</span>' +
    '</button>';
  }
  function altOf(s) {
    return s.alts.filter(function (a) { return a.id === s.choice; })[0] || { tag: 'Pick', why: s.pickWhy };
  }

  function aiReadyBody() {
    var plan = S.ai.plan;
    var read = plan.read || [], ignored = plan.ignored || [];
    return '<div class="body" role="main" data-testid="ai-populated">' +
      '<div class="section">' +
        '<div class="banner banner--info">' + ico('check') +
        '<div><strong>Built on this phone by a rule</strong>Not a model, and nothing was sent anywhere. ' +
        'Every slot is filled; open any lift to pick one of three alternatives.</div></div>' +
      '</div>' +
      /* What was read, and what was not. The old screen printed the
         description above the plan as though all of it had been understood. */
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">From your description</h2></div>' +
        '<div class="card">' +
          '<ul class="t-detail" data-testid="ai-read">' + (read.length
            ? read.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('')
            : '<li>Nothing it could act on.</li>') + '</ul>' +
          (ignored.length
            ? '<p class="t-label mt-3">Not read</p><ul class="t-detail" data-testid="ai-ignored">' +
              ignored.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') +
              '</ul><p class="t-caption-1 quiet mt-2">' +
              (S.ai.read
                ? 'A coach read your description into days, equipment and things to avoid, and ' +
                  'the draft is built from those. Anything above is what neither could act on. ' +
                  'Swap any lift below by hand.'
                : 'This drafter is a rule on your phone, so it reads the short list above and ' +
                  'nothing else. Swap any lift below by hand instead.') + '</p>'
            : '') +
        '</div>' +
      '</div>' +
      plan.days.map(function (d) {
        return '<div class="section">' +
          '<div class="section__head"><h2 class="t-label">' + esc(d.name) + '</h2>' +
          '<span class="t-meta" data-num>' + d.slots.length + ' exercises</span></div>' +
          '<div class="card card--flush">' + d.slots.map(function (s) { return slotRow(s, d); }).join('') + '</div>' +
        '</div>';
      }).join('') +
      /* "Draft a different split" over a DETERMINISTIC rule was a promise it
         could not keep: the same description gives the same draft every time,
         so the button would have redrawn what was already on screen. What
         changes the draft is changing the description, so that is what the
         button does. */
      '<div class="section"><button class="btn btn--tertiary btn--block" data-testid="ai-regenerate" data-action="ai-regenerate">' +
        ico('swap') + '<span class="btn__label">Change the description</span></button></div>' +
    '</div>';
  }

  function aiBar() {
    var st = S.ai.status;
    var primaryClass = S.modal ? 'btn btn--secondary' : 'btn btn--primary';
    if (st === 'idle') {
      return '<div class="actionbar" role="contentinfo" aria-label="Split actions">' +
        '<div class="actionbar__status" data-testid="ai-status">' + (S.ai.note.trim() ? 'Ready to draft' : 'Describe it first') + '</div>' +
        '<button class="' + primaryClass + '" data-testid="ai-generate" data-action="ai-generate"' +
          (S.ai.note.trim() ? '' : ' disabled aria-disabled="true"') + '><span class="btn__label">Draft split</span></button>' +
      '</div>';
    }
    if (st === 'loading') {
      return '<div class="actionbar" role="contentinfo" aria-label="Split actions">' +
        '<button class="btn btn--tertiary" data-testid="ai-cancel" data-action="ai-cancel"><span class="btn__label">Cancel</span></button>' +
        '<div class="actionbar__status" data-testid="ai-status">Building</div>' +
        '<button class="' + primaryClass + '" data-testid="ai-generate" aria-busy="true" disabled aria-disabled="true">' +
          '<span class="spinner"></span><span class="btn__label">Building</span></button>' +
      '</div>';
    }
    if (st === 'error') {
      return '<div class="actionbar" role="contentinfo" aria-label="Split actions">' +
        '<div class="actionbar__status" data-testid="ai-status">Nothing was sent to your splits</div>' +
        '<button class="' + primaryClass + '" data-testid="ai-retry" data-action="ai-generate"><span class="btn__label">Try again</span></button>' +
      '</div>';
    }
    return '<div class="actionbar" role="contentinfo" aria-label="Split actions">' +
      '<div class="actionbar__status" data-testid="ai-status" data-num>' + slotCount() + ' exercises · ' + swapCount() + ' swapped</div>' +
      '<button class="' + primaryClass + '" data-testid="ai-accept" data-action="ai-accept"><span class="btn__label">Use this split</span></button>' +
    '</div>';
  }

  /* ---------------------------------------------------------------
     THE MODE PICKER — F-TRAIN-308. The two ways to draft a split were a
     two-card choice in the shipped app, and this build had neither the
     choice nor the second card: the only entrance was one tertiary button
     inside the manual builder's own empty state.
     --------------------------------------------------------------- */
  function pickScreen() {
    return '<section class="screen" data-testid="screen-pick" data-state="ready">' +
      '<header class="hdr" role="banner">' +
        '<button class="hdr__back" data-testid="pick-back" data-action="pick-back" aria-label="Back to the split builder">' + ico('back') + '</button>' +
        '<div class="hdr__title" role="heading" aria-level="1">' +
          '<div class="t-section">Draft a split</div>' +
          '<div class="t-meta">Two ways in. Both end in the builder.</div>' +
        '</div>' +
      '</header>' +
      '<div class="body" role="main">' +
        '<div class="section"><div class="card card--flush">' +
          '<button class="opt" data-testid="mode-describe" data-action="mode-describe">' +
            '<span class="opt__mark">' + ico('spark') + '</span>' +
            '<span class="opt__main"><span class="opt__title">Describe it</span>' +
            '<span class="opt__sub">Days a week, your equipment, anything to avoid. ' +
            'A rule on this phone turns that into a draft you can change.</span></span>' +
            '<span class="row__chev">' + ico('chev') + '</span>' +
          '</button>' +
          '<button class="opt" data-testid="mode-photo" data-action="mode-photo">' +
            '<span class="opt__mark">' + ico('layers') + '</span>' +
            '<span class="opt__main"><span class="opt__title">Import from a photo</span>' +
            '<span class="opt__sub">A programme on paper, or a screenshot. ' +
            'Reading it needs a model on a server \u2014 not in this build.</span></span>' +
            '<span class="row__chev">' + ico('chev') + '</span>' +
          '</button>' +
        '</div></div>' +
        '<div class="section">' +
          '<button class="btn btn--secondary btn--block" data-testid="mode-manual" data-action="pick-back">' +
            '<span class="btn__label">Build it by hand instead</span></button>' +
        '</div>' +
      '</div>' +
    '</section>';
  }

  /* ---------------------------------------------------------------
     IMPORT FROM A PHOTO — F-TRAIN-310.

     There was no photo import at all: no file input, no preview, no note
     field, nothing. The whole local half is here -- picking the image,
     seeing it, saying what it is, and keeping it on the device -- and the
     half that is missing is named at the point of use rather than mimed.
     Reading a training programme off a photograph is a vision model, and
     a vision model runs on a server this build has no connection to. So
     there is no button here that pretends to read it.
     --------------------------------------------------------------- */
  function photoScreen() {
    var ph = S.photo;
    return '<section class="screen" data-testid="screen-photo" data-state="' + (ph.file ? 'ready' : 'empty') + '">' +
      '<header class="hdr" role="banner">' +
        '<button class="hdr__back" data-testid="photo-back" data-action="photo-back" aria-label="Back to the two ways in">' + ico('back') + '</button>' +
        '<div class="hdr__title" role="heading" aria-level="1">' +
          '<div class="t-section">Import from a photo</div>' +
          '<div class="t-meta" data-testid="photo-subtitle">' +
            esc(ph.file ? ph.file : 'Nothing chosen yet') + '</div>' +
        '</div>' +
      '</header>' +
      '<div class="body" role="main">' +
        '<div class="section">' +
          '<label class="field">' +
            '<span class="field__label t-label">The photo</span>' +
            '<input class="input" type="file" accept="image/*" data-testid="photo-file" ' +
              'data-action="photo-file" aria-label="Choose a photo of your programme">' +
            '<span class="field__help">A photo of a programme on paper, or a screenshot of one.</span>' +
          '</label>' +
          (ph.error ? '<p class="field__error" role="alert" data-testid="photo-error">' + esc(ph.error) + '</p>' : '') +
        '</div>' +
        (ph.url
          ? '<div class="section"><div class="section__head"><h2 class="t-label">What you chose</h2>' +
              '<span class="t-meta" data-num>' + esc(ph.size) + '</span></div>' +
              '<div class="card"><img src="' + ph.url + '" alt="The photo you chose: ' + esc(ph.file) + '" ' +
                'style="width:100%;border-radius:var(--r-md);display:block" data-testid="photo-preview">' +
              '<button class="btn btn--tertiary btn--block mt-3" data-testid="photo-clear" data-action="photo-clear">' +
                '<span class="btn__label">Choose a different one</span></button></div>' +
            '</div>'
          : '') +
        '<div class="section">' +
          '<label class="field">' +
            '<span class="field__label t-label">What is in it</span>' +
            '<textarea class="input" rows="3" data-testid="photo-note" data-action="photo-note" ' +
              'placeholder="Upper/lower, four days, the sheet from the gym wall.">' + esc(ph.note) + '</textarea>' +
            '<span class="field__help">Kept with the photo, and used as the description if you ' +
              'draft from it by rule below.</span>' +
          '</label>' +
        '</div>' +
        '<div class="section">' +
          '<div class="banner banner--warn" data-testid="photo-server">' + ico('alert') +
          '<div><strong>Reading the photo is not in this build</strong>Turning a picture of a ' +
          'programme into days and lifts is a vision model, and it runs on LOCKED\u2019s server. ' +
          'This build has no connection to one, so nothing here reads your photo and nothing ' +
          'is uploaded. The photo and your note stay on this phone.</div></div>' +
        '</div>' +
        '<div class="section">' +
          '<button class="btn btn--secondary btn--block" data-testid="photo-to-describe" data-action="photo-to-describe"' +
            (ph.note.trim() ? '' : ' disabled aria-disabled="true"') + '>' +
            '<span class="btn__label">Draft from what you typed instead</span></button>' +
          '<p class="t-caption-1 quiet mt-2">The rule on this phone can read a day count and the ' +
            'equipment you named out of that note. It cannot see the photo.</p>' +
        '</div>' +
      '</div>' +
    '</section>';
  }

  function aiScreen() {
    var st = S.ai.status;
    var body = st === 'loading' ? aiLoadingBody() : st === 'error' ? aiErrorBody() : st === 'ready' ? aiReadyBody() : aiIdleBody();
    return '<section class="screen" data-testid="screen-ai" data-state="' + st + '">' + aiHeader() + body + (window.LKSession ? LKSession.html() : '') + aiBar() + '</section>';
  }

  /* ---------------------------------------------------------------
     Overlays
     --------------------------------------------------------------- */
  function swapSheet(m) {
    var day = null, s = null;
    S.ai.plan.days.forEach(function (d) {
      d.slots.forEach(function (x) { if (x.id === m.id) { s = x; day = d; } });
    });
    if (!s) return '';
    var idx = day.slots.indexOf(s) + 1;
    function opt(id, title, sub, tag) {
      var on = s.choice === id;
      /* The shared one-of-N row, the same component Coach, Review and
         Settings use. This screen had its own copy of it. */
      return '<button class="opt" role="radio" aria-checked="' + on + '" data-testid="opt-' + id + '" data-action="choose" data-id="' + s.id + '" data-opt="' + id + '">' +
        '<span class="opt__mark">' + ico('check') + '</span>' +
        '<span class="opt__main"><span class="opt__title">' + esc(title) + '</span>' +
        '<span class="opt__sub">' + esc(sub) + '</span></span>' +
        (tag ? '<span class="chip">' + esc(tag) + '</span>' : '') +
      '</button>';
    }
    return '<div class="scrim" data-testid="scrim" data-action="close-modal"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="Alternatives for ' + esc(s.role) + '" data-testid="swap-sheet">' +
        '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
        '<div class="sheet__head">' +
          '<div><div class="t-section">' + esc(s.role) + '</div>' +
          '<div class="t-meta">' + esc(day.name) + ' · slot ' + idx + ' of ' + day.slots.length + '</div></div>' +
          '<button class="iconbtn" data-testid="swap-close" data-action="close-modal" aria-label="Close alternatives">' + ico('close') + '</button>' +
        '</div>' +
        '<div class="sheet__body" role="radiogroup" aria-label="Choose the lift for this slot">' +
          opt('auto', 'Let LOCKED choose', 'Now: ' + s.pick + '. Changes if your equipment or history changes.', 'Default') +
          opt('pick', s.pick, s.pickWhy, 'Picked') +
          s.alts.map(function (a) { return opt(a.id, a.name, a.why, a.tag); }).join('') +
        '</div>' +
        '<div class="sheet__foot">' +
          '<button class="btn btn--secondary btn--block" data-testid="swap-done" data-action="close-modal"><span class="btn__label">Done</span></button>' +
        '</div>' +
      '</div>';
  }

  /* THE SAME BODY THE LOG OPENS ON.

     This sheet listed the whole catalogue with a search field over it,
     which is the arrangement the workout log's picker has just stopped
     using -- and planning a split is the place somebody adds the MOST
     exercises, so it is the worst screen to make them scroll. Pointing
     at the part being trained is the question they are actually asking.

     Three states, same as the log's: the figure, one group's lifts, and
     search cutting across both. Kept deliberately close to the log's
     version so the two read as one idea rather than two. */
  function pickBody(m) {
    var q = (m.q || '').trim();
    if (q) return pickList(m);
    if (!m.gid) return pickMapHTML(m);
    return pickGroupHTML(m);
  }

  function pickMapHTML(m) {
    var counts = (window.LKExercises && LKExercises.groupCounts)
      ? LKExercises.groupCounts(LIBRARY) : {};
    return '<div class="addexmap" data-testid="pick-map">' +
      '<div class="addexmap__fig" id="pick-fig"></div>' +
      '<div class="addexmap__side">' +
        '<div class="seg" role="tablist" aria-label="Body view">' +
          ['front', 'back'].map(function (v) {
            return '<button class="seg__item" type="button" role="tab" data-action="pick-view" ' +
              'data-view="' + v + '" data-testid="pick-view-' + v + '" ' +
              'aria-selected="' + ((m.view || 'front') === v ? 'true' : 'false') + '">' +
              (v === 'front' ? 'Front' : 'Back') + '</button>';
          }).join('') +
        '</div>' +
      '</div>' +
      '<p class="t-detail quiet mt-2">Tap the part this day trains.</p>' +
      '<div class="card card--flush mt-3" data-testid="pick-groups">' +
        (window.LKExercises ? LKExercises.groups : []).map(function (gr) {
          var c = counts[gr[0]] || { n: 0 };
          if (!c.n) return '';
          return '<button class="row" data-action="pick-group" data-gid="' + gr[0] + '" ' +
            'data-id="' + m.id + '" data-testid="pick-group-' + gr[0] + '">' +
            '<div class="row__main"><div class="row__title">' + esc(gr[1]) + '</div></div>' +
            '<span class="t-meta" data-num>' + c.n + '</span>' +
            '<span class="row__chev">' + ico('chev') + '</span></button>';
        }).join('') +
      '</div>';
  }

  /* THE BODY IS THE REASON THE PICKER IS A PICKER, and it used to leave
     at the moment it became useful: choosing Chest swapped the figure for
     ninety-eight rows. It stays now, framed on the muscle just chosen and
     divided into its parts where the anatomy divides honestly, which is
     the same thing the library does. Choosing a part narrows the list to
     that part; the crumb says where you are and how to get back. */
  function pickGroupHTML(m) {
    var name = (window.LKExercises && LKExercises.groupName)
      ? LKExercises.groupName(m.gid) : m.gid;
    var here = m.sub ? esc(m.sub) + ' \u00b7 ' + esc(name) : esc(name);
    return '<div class="addexmap addexmap--zoom" data-testid="pick-map-zoom">' +
        '<div class="addexmap__fig" id="pick-fig"></div>' +
        /* The same two buttons as the whole-body view, in the same place.
           They used to leave with it, so turning the figure over meant
           backing out of the muscle first. */
        '<div class="addexmap__side">' +
          '<div class="seg" role="tablist" aria-label="Body view">' +
            ['front', 'back'].map(function (v) {
              return '<button class="seg__item" type="button" role="tab" data-action="pick-view" ' +
                'data-view="' + v + '" data-testid="pick-view-' + v + '" ' +
                'aria-selected="' + ((m.view || 'front') === v ? 'true' : 'false') + '">' +
                (v === 'front' ? 'Front' : 'Back') + '</button>';
            }).join('') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="spread mt-2" data-testid="pick-crumb">' +
        '<button class="btn btn--tertiary btn--sm" data-action="' +
          (m.sub ? 'pick-whole' : 'pick-back') + '" data-testid="pick-back">' +
          ico('back') + '<span class="btn__label">' +
          (m.sub ? esc(name) : 'Body') + '</span></button>' +
        '<span class="t-label">' + here + '</span>' +
      '</div>' + pickList(m);
  }

  function pickRows(m) {
    var q = (m.q || '').toLowerCase();
    var list = LIBRARY.filter(function (x) {
      return !q || x.name.toLowerCase().indexOf(q) > -1 || x.muscle.toLowerCase().indexOf(q) > -1;
    });
    if (!q && m.gid && window.LKExercises && LKExercises.gidOf) {
      list = list.filter(function (x) { return LKExercises.gidOf(x) === m.gid; });
    }
    /* A PART CHOSEN ON THE BODY IS THE WHOLE LIST. The figure's parts are
       named the way a person says them -- "Upper", "Lats" -- and the
       catalogue's muscle is "Upper Chest" or "Lats". One is the start of
       the other, in both directions, which covers every part this figure
       can draw without a table to keep in step. */
    if (!q && m.sub && window.LKExercises && LKExercises.forPart) {
      var byPart = LKExercises.forPart(m.gid, m.sub, list);
      list = byPart.list;
      m.partNote = byPart.exact ? '' : byPart.note;
    } else { m.partNote = ''; }
    return list;
  }

  function pickList(m) {
    var list = pickRows(m);
    var note = m.partNote
      ? '<p class="t-detail quiet mt-2" data-testid="pick-part-note">' + esc(m.partNote) + '</p>'
      : '';
    if (!list.length) {
      return '<div class="empty"><span class="empty__ico">' + ico('search', 'ico--lg') + '</span>' +
        '<h2 class="empty__title">No match</h2>' +
        '<p class="empty__body">Nothing in the library matches that. ' +
        'Clear the search to go back to the body.</p></div>';
    }
    return note + '<div class="card card--flush">' + list.slice(0, 60).map(function (x, i) {
      return '<button class="row" data-testid="pick-' + i + '" data-action="pick-add" data-name="' + esc(x.name) + '" data-muscle="' + esc(x.muscle) + '" data-exid="' + (x.id || '') + '" data-id="' + m.id + '">' +
        '<div class="row__main"><div class="row__title">' + esc(x.name) + '</div><div class="row__sub">' + esc(x.muscle) + '</div></div>' +
        '<span class="row__chev">' + ico('plus') + '</span></button>';
    }).join('') + '</div>' +
    (list.length > 60
      ? '<p class="t-detail quiet mt-2" data-testid="pick-more">' + (list.length - 60) +
        ' more. Narrow it with the search, or pick a different part.</p>'
      : '');
  }

  /* LKBodyMap draws into a host element, so it cannot be part of the
     string the sheet is patched in from: it is mounted after, into the
     slot that string left. This screen redraws itself whole, so the
     figure is rebuilt with it rather than kept -- a kept one would be
     pointing at a node that no longer exists. */
  var PICK_FIG = null;
  function syncPickFigure() {
    var slot = document.getElementById('pick-fig');
    if (!slot || !window.LKBodyMap || !window.LKExercises) { PICK_FIG = null; return; }
    var m = S.modal;
    if (!slot.firstChild) {
      try {
        PICK_FIG = LKBodyMap.mount(slot, {
          groups: LKExercises.groupCounts(LIBRARY),
          order: LKExercises.groups.map(function (gr) { return gr[0]; }),
          view: (m && m.view) || 'front',
          onSelect: function (gid) {
            if (!S.modal) return;
            S.modal.gid = gid;
            S.modal.sub = null;
            render();
          },
          /* A part is the second tap, and it is the one that answers the
             question: not "chest" but "upper chest". */
          onPart: function (gid, part) {
            if (!S.modal) return;
            S.modal.gid = gid;
            S.modal.sub = part;
            render();
          },
          /* And the same thing reached by pinching in rather than by
             tapping, so the two gestures agree about what they mean. */
          onSplit: function (gid) {
            if (!S.modal) return;
            if (gid) S.modal.gid = gid; else S.modal.sub = null;
            render();
          }
        });
      } catch (e) { PICK_FIG = null; return; }
    }
    /* The camera and the split follow the state on every paint, so a
       redraw never leaves a muscle framed with its parts gone. */
    var fig = PICK_FIG;
    if (!fig) return;
    try {
      if (fig.setView) fig.setView((m && m.view) || 'front');
      if (fig.select) fig.select((m && m.gid) || null);
      if (fig.zoomTo) fig.zoomTo((m && m.gid) || null, (m && m.view) || 'front');
      if (m && m.gid && fig.showParts) {
        fig.showParts(m.gid, m.view || 'front');
        if (fig.selectPart) fig.selectPart(m.sub || null);
      } else if (fig.clearParts) fig.clearParts();
    } catch (e) {}
  }

  function pickSheet(m) {
    var list = pickRows(m);
    var day = S.manual.days.filter(function (d) { return d.id === m.id; })[0];
    return '<div class="scrim" data-testid="scrim" data-action="close-modal"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="Add an exercise" data-testid="pick-sheet" data-detents="0.55 0.88" data-detent-open="0.88">' +
        '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
        '<div class="sheet__head">' +
          '<div><div class="t-section">Add to ' + esc(day ? day.name : '') + '</div>' +
          '<div class="t-meta">' + list.length + ' exercises</div></div>' +
          '<button class="iconbtn" data-testid="pick-close" data-action="close-modal" aria-label="Close exercise list">' + ico('close') + '</button>' +
        '</div>' +
        '<div class="search"><span class="search__ico">' + ico('search') + '</span>' +
          '<input class="input" type="search" value="' + esc(m.q || '') + '" placeholder="Search exercises" data-testid="pick-search" data-action="pick-search" aria-label="Search exercises"></div>' +
        '<div class="sheet__body mt-3">' + pickBody(m) + '</div>' +
      '</div>';
  }

  function leaveDialog() {
    /* The scrim closes, like every other scrim in this file. It was the one
       without a data-action, and nothing said why. Tapping outside a
       confirmation is the "no" answer, and "Keep editing" is already the
       safe default beside it. */
    return '<div class="scrim" data-testid="scrim" data-action="close-modal"></div>' +
      '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="leaveTitle" data-testid="leave-dialog">' +
        '<h2 class="t-section" id="leaveTitle">Save this split first?</h2>' +
        '<p class="t-detail mt-2" data-testid="leave-body">' + esc(dirtySentence()) + '</p>' +
        '<div class="dialog__acts">' +
          '<button class="btn btn--danger btn--block" data-testid="leave-discard" data-action="leave-discard"><span class="btn__label">Discard changes</span></button>' +
          '<button class="btn btn--secondary btn--block" data-testid="leave-cancel" data-action="close-modal"><span class="btn__label">Keep editing</span></button>' +
          '<button class="btn btn--primary btn--block" data-testid="leave-save" data-action="leave-save"><span class="btn__label">Save and leave</span></button>' +
        '</div>' +
      '</div>';
  }
  function dirtySentence() {
    var n = S.manual.days.length, e = exCount();
    return (S.manual.name.trim() ? S.manual.name.trim() : 'This split') + ' has changes that are not saved: ' +
      n + (n === 1 ? ' day' : ' days') + ', ' + e + ' exercises.';
  }

  function toastEl() {
    if (!S.toast) return '';
    return '<div class="toast" role="status" data-testid="toast">' +
      '<div class="toast__body">' + esc(S.toast.text) + '</div>' +
      (S.toast.action ? '<button class="toast__action" data-testid="toast-action" data-action="toast-action">' + esc(S.toast.action) + '</button>' : '') +
    '</div>';
  }

  function overlays() {
    var m = S.modal;
    var html = toastEl();
    if (!m) return html;
    if (m.type === 'leave') return html + leaveDialog();
    if (m.type === 'pick') return html + pickSheet(m);
    if (m.type === 'swap') return html + swapSheet(m);
    if (m.type === 'block') return html + blockSheet(m);
    return html;
  }

  /* ---------------------------------------------------------------
     Dev switcher
     --------------------------------------------------------------- */
  var PRESETS = [
    ['Manual · empty', function () { reset(); }],
    ['Manual · loading', function () { reset(); S.manual.status = 'loading'; }],
    ['Manual · populated', function () { reset(); var s = seedSplit(); S.manual.id = s.id || null; S.manual.created = s.created || null; S.manual.name = s.name; S.manual.days = s.days; S.manual.savedAt = '2 minutes ago'; }],
    ['Manual · edit mode', function () { reset(); var s = seedSplit(); S.manual.id = s.id || null; S.manual.created = s.created || null; S.manual.name = s.name; S.manual.days = s.days; S.manual.savedAt = '2 minutes ago'; S.manual.edit = true; }],
    ['Manual · unsaved', function () { reset(); var s = seedSplit(); S.manual.id = s.id || null; S.manual.created = s.created || null; S.manual.name = s.name; S.manual.days = s.days; S.manual.dirty = true; }],
    ['Manual · leave prompt', function () { reset(); var s = seedSplit(); S.manual.id = s.id || null; S.manual.created = s.created || null; S.manual.name = s.name; S.manual.days = s.days; S.manual.dirty = true; S.modal = { type: 'leave' }; }],
    ['Manual · save error', function () { reset(); var s = seedSplit(); S.manual.id = s.id || null; S.manual.created = s.created || null; S.manual.name = s.name; S.manual.days = s.days; S.manual.dirty = true; S.manual.error = 'No connection to the LOCKED server. The draft is on this phone and will go up when you are back online.'; }],
    ['Draft · two ways in', function () { reset(); S.screen = 'pick'; }],
    ['Draft · describe it', function () { reset(); S.screen = 'ai'; }],
    ['Draft · building', function () { reset(); S.screen = 'ai'; S.ai.status = 'loading'; S.ai.note = 'Three days a week, barbell and cables, shoulders need volume.'; }],
    ['Draft · nothing readable', function () { reset(); S.screen = 'ai'; S.ai.status = 'error'; S.ai.note = 'make me strong'; S.ai.error = 'This builder is a rule on your phone, not a model, and nothing in \u201cmake me strong\u201d matched anything it knows how to act on. Say how many days, or name your equipment, or build it by hand.'; }],
    ['Draft · proposal', function () { reset(); S.screen = 'ai'; S.ai.note = 'Three days a week, barbell and cables, shoulders need volume.'; S.ai.status = 'ready'; S.ai.plan = planFor(S.ai.note); }],
    ['Photo · nothing chosen', function () { reset(); S.screen = 'photo'; }],
    ['Manual · a day with blocks', function () { reset(); var s2 = seedSplit(); S.manual.id = s2.id || null; S.manual.created = s2.created || null; S.manual.name = s2.name; S.manual.days = s2.days; S.manual.savedAt = 'on ' + (s2.created || 'this phone'); if (S.manual.days[0]) { S.manual.days[0].blocks = [blockRow({ title: 'Shoulder warm-up', duration: '8 min', notes: 'Band pull-aparts, two sets of twenty. Then the empty bar.' })]; } }]
  ];

  function reset() {
    clearTimers();
    S.screen = 'manual';
    S.manual = { status: 'ready', id: null, created: null, name: '', days: [],
                 dirty: false, savedAt: null, error: null, edit: false };
    S.ai = { status: 'idle', note: '', plan: null, error: null, step: 0 };
    if (S.photo && S.photo.url) { try { URL.revokeObjectURL(S.photo.url); } catch (e) {} }
    S.photo = { file: null, url: null, size: '', note: '', error: null };
    S.lifted = null; S.dragging = null; S.modal = null; S.toast = null; S.swipe = null;
  }

  function renderDev() {
    var panel = document.getElementById('devPanel');
    var btn = document.getElementById('devToggle');
    btn.setAttribute('aria-expanded', S.dev ? 'true' : 'false');
    panel.hidden = !S.dev;
    if (!S.dev) { LKPatch(panel, ''); return; }
    LKPatch(panel, PRESETS.map(function (p, i) {
      return '<button class="dev__item" data-testid="dev-preset-' + i + '" data-dev="' + i +
        '" aria-pressed="false">' + esc(p[0]) + '</button>';
    }).join(''));
  }

  /* ---------------------------------------------------------------
     Render
     --------------------------------------------------------------- */
  var app = document.getElementById('app');
  var renderedModal = false;

  function render() {
    var active = document.activeElement;
    var key = active && active.getAttribute ? active.getAttribute('data-testid') : null;
    var caret = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    /* What was RENDERED last time, not what state says now: the caller sets
       S.modal and then calls render, so reading the state here always says
       the modal was already open and focus never moved into it. */
    var hadModal = renderedModal;
    renderedModal = !!S.modal;
    LKPatch(app, (S.screen === 'manual' ? manualScreen()
                  : S.screen === 'pick' ? pickScreen()
                  : S.screen === 'photo' ? photoScreen()
                  : aiScreen()) + overlays());
    syncPickFigure();
    if (key) {
      var next = app.querySelector('[data-testid="' + key + '"]');
      if (next) {
        next.focus({ preventScroll: true });
        if (caret !== null && typeof next.setSelectionRange === 'function') {
          try { next.setSelectionRange(caret, caret); } catch (e) {}
        }
      }
    }
    /* A modal that opens takes focus, and it goes to the way OUT — never to
       the destructive button. The leave dialog took focus nowhere at all: a
       role="dialog" aria-modal="true" was on screen while activeElement was
       still <body>, so the next Tab restarted at the top of the document
       behind the dialog. */
    if (S.modal && !hadModal) {
      var safe = app.querySelector('[data-action="close-modal"].btn') ||
                 app.querySelector('.dialog button, .sheet button');
      if (safe) safe.focus({ preventScroll: true });
    }
    renderDev();
  }

  /* Tab stays inside the modal. Without this the ring walks out of a
     dialog that is covering the screen and lands on controls nobody can see. */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab' || !S.modal) return;
    var box = app.querySelector('.dialog, .sheet');
    if (!box) return;
    var f = box.querySelectorAll('button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  });

  function toast(text, action, fn) {
    S.toast = { text: text, action: action, fn: fn };
    clearTimeout(S.toastTimer);
    S.toastTimer = setTimeout(function () { S.toast = null; render(); }, 6000);
  }

  /* ---------------------------------------------------------------
     Behaviour
     --------------------------------------------------------------- */
  function findDay(id) { return S.manual.days.filter(function (d) { return d.id === id; })[0]; }
  function markDirty() { S.manual.dirty = true; S.manual.savedAt = null; }
  function move(arr, from, to) {
    if (to < 0 || to >= arr.length) return false;
    arr.splice(to, 0, arr.splice(from, 1)[0]);
    return true;
  }

  function removeExercise(dayId, id) {
    var day = findDay(dayId);
    if (!day) return;
    var i = day.exercises.map(function (x) { return x.id; }).indexOf(id);
    if (i < 0) return;
    var removed = day.exercises.splice(i, 1)[0];
    S.swipe = null;
    markDirty();
    toast('Removed ' + removed.name + '.', 'Undo', function () { day.exercises.splice(i, 0, removed); });
    render();
  }

  /* Leaving, once there is nothing left to lose. The demo's router claims
     the back control before this screen sees it, so a guarded back has to
     leave for itself after the guard clears -- "Save and leave" saved and
     stayed. */
  function leaveAfter() {
    later(function () {
      /* Through the back control, not location.href. In the demo the router
         claims that control's click and pops the route; a bare location.href
         from a timer is not a click and would take the whole demo with it.
         Standalone the same click reaches this screen's own handler, which is
         now clean and navigates. */
      var b = document.querySelector('[data-testid="manual-back"]');
      if (b) b.click(); else LKGo('train');
    }, 450);
  }

  /* It writes. This said "Split saved." and "saved just now" and wrote
     nothing at all: a rename, a deleted lift, a whole new day, and after a
     reload Train still showed the split as it was. A screen that reports a
     save it did not perform is worse than one with no save button. */
  /* THE DAY IT IS WHERE THE READER IS. toISOString is UTC, so a split
     edited at eight on a Sunday evening anywhere west of Greenwich was
     stamped Monday -- a date the reader had not reached yet, printed
     back to them as "edited Monday". LKStore.today() reads the local
     calendar; this is the same thing for the case where there is no
     store to ask. */
  function todayLocal() {
    var d = new Date();
    return d.getFullYear() + '-' +
      ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
      ('0' + d.getDate()).slice(-2);
  }

  function persistSplit() {
    if (!window.LKStore) return false;
    var list = allSplits().slice();
    var rec = {
      id: S.manual.id || ('s' + Date.now()),
      name: S.manual.name.trim(),
      created: S.manual.created || new Date().toLocaleDateString('en-US'),
      /* WHEN IT WAS LAST TOUCHED, which is not when it was made. Train
         prints "edited <date>" under every split from `updated`, and
         nothing ever wrote one -- so it fell back to `created` and a
         split reworked five times still claimed to have been edited on
         the day it was first saved. Written on every save, because
         every save IS an edit. */
      updated: (window.LKStore ? LKStore.today() : todayLocal()),
      days: S.manual.days.map(function (d) {
        return {
          name: d.name,
          /* THE DAY'S BLOCKS — F-TRAIN-104. This was `blocks: []` whatever the
             day held, so a warm-up or a finisher programmed into a day was
             thrown away on the save that claimed to have kept it. The shape is
             the workout log's own: title, notes, duration as a printed string
             ("12 min" or ""), and whether the notes are open. */
          blocks: (d.blocks || []).map(function (b) {
            return { title: b.title, notes: b.notes || '',
                     duration: b.duration || '', open: !!b.open };
          }),
          exercises: d.exercises.map(function (x) {
            /* The stored shape carries a catalogue id, a group and a muscle.
               The builder's own rows carry a generated id and a muscle, so
               anything already known keeps its figures and anything new
               carries what the builder has. */
            return { id: x.exId || x.id, name: x.name,
                     group: x.group || '', muscle: x.muscle || '' };
          })
        };
      })
    };
    S.manual.id = rec.id;
    S.manual.created = rec.created;
    var at = -1;
    for (var i = 0; i < list.length; i++) if (list[i].id === rec.id) at = i;
    if (at >= 0) list[at] = rec; else list.unshift(rec);
    window.LKStore.set('lk_splits', list);
    return true;
  }

  function doSave(thenLeave) {
    S.manual.status = 'saving';
    render();
    later(function () {
      if (!persistSplit()) {
        S.manual.status = 'ready';
        S.manual.error = 'This browser will not let the app store anything, so the split is ' +
          'held for this visit only.';
        render();
        return;
      }
      S.manual.status = 'ready';
      S.manual.dirty = false;
      S.manual.error = null;
      S.manual.savedAt = 'just now';
      S.swipe = null;
      toast('Split saved.');
      render();
      if (thenLeave) leaveAfter();
    }, 600);
  }

  /* THE MODEL READS THE SENTENCE; THE RULE STILL BUILDS THE DRAFT.
