     The gap here was never the drafting -- the rule picks real movements
     and carries three alternatives for every slot, which is the best
     thing about this screen. What it cannot do is understand a sentence:
     it matches a day count, a handful of equipment words and "no X". So
     the model is asked to turn the description into exactly those terms
     and the rule takes it from there, alternatives intact.

     Nothing the model says becomes an exercise. It returns a day count,
     equipment words and things to avoid; every lift still comes from the
     catalogue the rule already picks from. */
  function readNote(note, done) {
    var C = window.LKCloud;
    if (!C || !C.coachReady() || !String(note || '').trim()) return done(null);
    C.ask([{ role: 'user',
             content: 'Read this training description and return ONLY a JSON object: ' +
                      '{"days":number or null,"equipment":[string],"avoid":[string],' +
                      '"emphasis":[string]}. Use only what the text says; null and empty ' +
                      'arrays where it says nothing. Text: ' + String(note).slice(0, 400) }], {})
      .then(function (r) {
        var txt = (r && r.ok && r.data && (r.data.reply || r.data.raw)) || '';
        var o = null;
        try {
          var a = txt.indexOf('{'), b = txt.lastIndexOf('}');
          o = JSON.parse(a >= 0 && b > a ? txt.slice(a, b + 1) : txt);
        } catch (e) { o = null; }
        if (!o || typeof o !== 'object') return done(null);
        done({
          days: (o.days >= 1 && o.days <= 6) ? Math.round(o.days) : null,
          equipment: (Array.isArray(o.equipment) ? o.equipment : []).slice(0, 6)
            .map(function (x) { return String(x).toLowerCase().slice(0, 20); }),
          avoid: (Array.isArray(o.avoid) ? o.avoid : []).slice(0, 6)
            .map(function (x) { return String(x).toLowerCase().slice(0, 20); }),
          emphasis: (Array.isArray(o.emphasis) ? o.emphasis : []).slice(0, 4)
            .map(function (x) { return String(x).toLowerCase().slice(0, 20); })
        });
      }, function () { done(null); });
  }

  /* The read turned back into the words the rule already matches, so
     there is one matcher rather than two that can disagree. */
  function noteWithRead(note, read) {
    if (!read) return note;
    var extra = [];
    if (read.days) extra.push(LKCount(read.days, 'day'));
    read.equipment.forEach(function (e) { extra.push(e); });
    read.emphasis.forEach(function (e) { extra.push(e); });
    read.avoid.forEach(function (a) { extra.push('no ' + a); });
    return extra.length ? String(note || '') + ' ' + extra.join(' ') : note;
  }

  function runGeneration() {
    S.ai.error = null;
    if (window.LKCloud && LKCloud.coachReady() && !S.ai.readDone) {
      S.ai.status = 'loading';
      render();
      readNote(S.ai.note, function (read) {
        S.ai.readDone = true;
        S.ai.read = read;
        runGeneration();
      });
      return;
    }
    var plan = planFor(noteWithRead(S.ai.note, S.ai.read));
    if (!plan.read.length) {
      S.ai.status = 'error';
      S.ai.plan = null;
      S.ai.error = 'This builder is a rule on your phone, not a model, and nothing in ' +
        '\u201c' + String(S.ai.note || '').trim() + '\u201d matched anything it knows how to act on. ' +
        'Say how many days, or name your equipment, or build it by hand.';
      render();
      return;
    }
    S.ai.status = 'ready';
    S.ai.plan = plan;
    render();
  }

  /* The draft answers what was asked. It used to be one fixed three-day
     push/pull/legs whatever the description said -- type "two days, dumbbells
     only, no squats" and you got the same barbell PPL, with the note printed
     above it as though it had been read.

     What it reads is deliberately small and stated: a day count, and whether
     dumbbells or machines were named. Anything it cannot read, it leaves
     alone rather than pretending to have understood. */
  function planFor(note) {
    var plan = seedPlan();
    var q = String(note || '').toLowerCase();
    plan.note = note || '';
    /* WHAT IT READ and WHAT IT DID NOT, both recorded and both printed. The
       whole defect was that the second list was invisible. */
    plan.read = [];
    plan.ignored = [];

    var days = null;
    var m = q.match(/(\d+)\s*(?:days?|x\b|times)/);
    if (m) days = Math.max(1, Math.min(6, parseInt(m[1], 10)));
    else if (/\bfour\b/.test(q)) days = 4;
    else if (/\bfive\b/.test(q)) days = 5;
    else if (/\btwo\b/.test(q)) days = 2;
    else if (/\bthree\b/.test(q)) days = 3;

    if (days) plan.read.push(days + (days === 1 ? ' day a week' : ' days a week'));
    if (days && days !== plan.days.length) {
      if (days < plan.days.length) plan.days = plan.days.slice(0, days);
      else {
        /* Repeat the cycle rather than invent movements nobody asked for. */
        var src = plan.days.slice();
        var k = 0;
        while (plan.days.length < days) {
          var base = src[k % src.length];
          plan.days.push({ id: nid('p'), name: base.name + ' B', slots: base.slots });
          k++;
        }
      }
      plan.title = plan.days.map(function (d) { return d.name; }).join(', ') +
        ' \u2014 ' + LKCount(plan.days.length, 'day');
    }

    /* A named piece of equipment moves each slot to the alternative that
       carries it, where the slot has one. Where no slot has one, that is said
       rather than silently doing nothing. */
    var EQUIP = ['dumbbell', 'machine', 'cable', 'barbell', 'bodyweight', 'kettlebell'];
    var want = null;
    for (var e = 0; e < EQUIP.length; e++) if (q.indexOf(EQUIP[e]) > -1) { want = EQUIP[e]; break; }
    if (want) {
      var moved = 0;
      plan.days.forEach(function (d) {
        d.slots = d.slots.map(function (sl) {
          var hit = sl.alts.filter(function (a) { return a.name.toLowerCase().indexOf(want) > -1; })[0];
          if (!hit) return sl;
          var copy = slot(sl.role, sl.pick, sl.pickWhy, sl.alts);
          copy.choice = hit.id;
          moved += 1;
          return copy;
        });
      });
      if (moved) plan.read.push(want.charAt(0).toUpperCase() + want.slice(1) +
        ' \u2014 ' + moved + (moved === 1 ? ' lift swapped' : ' lifts swapped'));
      else plan.ignored.push('\u201c' + want + '\u201d: no slot in this draft has a ' + want + ' alternative');
    }

    /* Things to avoid. "No deadlifts", "avoid squats": any slot whose pick
       carries the word moves to an alternative that does not. A slot with no
       clean alternative is left, and said. */
    var avoid = [];
    String(q).replace(/(?:no|avoid|without)\s+([a-z][a-z \-]{2,20})/g, function (m0, w) {
      avoid.push(w.trim().replace(/s$/, ''));
      return m0;
    });
    if (avoid.length) {
      var dropped = 0, stuck = [];
      avoid.forEach(function (w) {
        plan.days.forEach(function (d) {
          d.slots = d.slots.map(function (sl) {
            if (currentName(sl).toLowerCase().indexOf(w) < 0) return sl;
            var clean = sl.alts.filter(function (a) { return a.name.toLowerCase().indexOf(w) < 0; })[0];
            if (!clean) { stuck.push(sl.role.toLowerCase()); return sl; }
            var copy = slot(sl.role, sl.pick, sl.pickWhy, sl.alts);
            copy.choice = clean.id;
            dropped += 1;
            return copy;
          });
        });
      });
      if (dropped) plan.read.push('Avoiding ' + avoid.join(' and ') + ' \u2014 ' +
        dropped + (dropped === 1 ? ' lift replaced' : ' lifts replaced'));
      if (stuck.length) plan.ignored.push('Could not avoid ' + avoid.join(' and ') +
        ' in: ' + stuck.join(', '));
      /* Said rather than silently true. "No deadlifts" against a draft with no
         deadlift in it read as though the rule had acted on it. */
      if (!dropped && !stuck.length) plan.ignored.push('\u201cNo ' + avoid.join(' or ') +
        '\u201d: there is none in this draft anyway');
    }

    /* Everything else. A description is a sentence and this reads three
       things out of it; the rest is listed so the reader can see it was not
       understood rather than assuming it was. */
    var leftover = String(note || '').trim();
    if (leftover && !plan.read.length) plan.ignored.push('The whole description');
    else if (leftover) {
      var known = /(\d+\s*(days?|x|times)|four|five|two|three|dumbbell|machine|cable|barbell|bodyweight|kettlebell|no |avoid |without )/;
      var rest = leftover.split(/[.,;]/).map(function (x) { return x.trim(); })
        .filter(function (x) { return x && !known.test(x.toLowerCase()); });
      rest.forEach(function (x) { plan.ignored.push('\u201c' + x + '\u201d'); });
    }
    return plan;
  }

  function acceptPlan() {
    var plan = S.ai.plan;
    S.manual.name = plan.title;
    S.manual.days = plan.days.map(function (d) {
      return { id: nid('d'), name: d.name, blocks: [],
               exercises: d.slots.map(function (s) { return ex(currentName(s), s.role); }) };
    });
    S.manual.dirty = true;
    S.manual.savedAt = null;
    S.manual.edit = false;
    S.swipe = null;
    S.screen = 'manual';
    S.ai.status = 'idle';
    toast('Draft added. Save it or change anything first.');
    render();
  }

  var ACTIONS = {
    'manual-back': function () {
      if (S.manual.dirty) { S.modal = { type: 'leave' }; render(); return; }
      LKGo('train');
    },
    /* THE SAME QUESTION, WHEN THE SHELL IS DRIVING. In the assembled build
       the router claims the back tap in the capture phase and navigates
       before the handler above can run, so a half-built split was thrown
       away in silence: no dialog, nothing in lk_splits, and nothing left
       after a reload. The dialog was written and wired the whole time and
       simply never got the chance. Vetoing the crossing gives it one. */
    '__beforeback': function () { return S.manual.dirty; },
    'close-modal': function () { S.modal = null; render(); },
    'edit-toggle': function () {
      S.manual.edit = !S.manual.edit;
      S.lifted = null; S.swipe = null;
      render();
      var b = document.querySelector('[data-testid="edit-toggle"]');
      if (b) b.focus({ preventScroll: true });
    },
    'leave-discard': function () {
      /* It used to clear the dirty FLAG and leave every edit on screen, under
         a message saying the changes had been discarded. The edits are what
         gets discarded: the split goes back to what is stored, and Undo puts
         the working copy back exactly as it was. */
      var was = { name: S.manual.name, days: JSON.parse(JSON.stringify(S.manual.days)) };
      var fresh = seedSplit();
      S.modal = null;
      S.manual.id = fresh.id || S.manual.id; S.manual.created = fresh.created || S.manual.created;
      S.manual.name = fresh.name; S.manual.days = fresh.days;
      S.manual.dirty = false; S.manual.edit = false; S.lifted = null; S.swipe = null;
      toast('Changes discarded.', 'Undo', function () {
        S.manual.name = was.name; S.manual.days = was.days; S.manual.dirty = true;
      });
      render();
      leaveAfter();
    },
    'leave-save': function () { S.modal = null; doSave(true); },
    'save': function () { doSave(); },
    'add-day': function () {
      /* A name that is not already taken. Every new day used to arrive called
         "Day N", and the AI draft's days all arrived called Push, so a split
         could end up with three days of the same name and no way to tell
         which one a workout had come from. */
      var taken = {};
      S.manual.days.forEach(function (d) { taken[d.name.toLowerCase()] = 1; });
      var pool = ['Push', 'Pull', 'Legs', 'Upper', 'Lower', 'Full body'];
      var name = null;
      for (var i = 0; i < pool.length && !name; i++) {
        if (!taken[pool[i].toLowerCase()]) name = pool[i];
      }
      if (!name) {
        var k = S.manual.days.length + 1;
        while (taken[('day ' + k)]) k++;
        name = 'Day ' + k;
      }
      S.manual.days.push({ id: nid('d'), name: name, blocks: [], exercises: [] });
      markDirty(); render();
    },
    'day-remove': function (el) {
      var id = el.getAttribute('data-id');
      var i = S.manual.days.map(function (d) { return d.id; }).indexOf(id);
      var removed = S.manual.days.splice(i, 1)[0];
      if (!S.manual.days.length) S.manual.edit = false;
      S.lifted = null;
      markDirty();
      /* Says what went with it. This trash icon and the one that removes a
         single exercise are the same 44px glyph 21px apart; the difference
         between them is the consequence, so the consequence is what the
         message carries. */
      var n2 = removed.exercises.length;
      toast('Removed ' + removed.name + (n2 ? ' and its ' + n2 + ' exercise' + (n2 === 1 ? '' : 's') : '') + '.',
        'Undo', function () { S.manual.days.splice(i, 0, removed); });
      render();
    },
    'ex-remove': function (el) { removeExercise(el.getAttribute('data-day'), el.getAttribute('data-id')); },
    /* Opens on the body, with no part chosen: a group left over from the
       last exercise added is not an answer to this one. */
    'add-exercise': function (el) {
      S.modal = { type: 'pick', id: el.getAttribute('data-id'), q: '', gid: null, sub: null, view: 'front' };
      render();
    },
    'pick-group': function (el) {
      if (S.modal) {
        S.modal.gid = el.getAttribute('data-gid') || null;
        S.modal.sub = null;
        render();
      }
    },
    'pick-back': function () { if (S.modal) { S.modal.gid = null; S.modal.sub = null; render(); } },
    /* Back out of a part to the whole muscle, without leaving the muscle. */
    'pick-whole': function () { if (S.modal) { S.modal.sub = null; render(); } },
    'pick-view': function (el) {
      if (!S.modal) return;
      var want = el.getAttribute('data-view') === 'back' ? 'back' : 'front';
      if (want === S.modal.view) return;
      S.modal.view = want;
      /* A head named on the front is not a head on the back, and a
         muscle the other side does not draw cannot stay chosen. */
      S.modal.sub = null;
      if (S.modal.gid && window.LKBodyMap && LKBodyMap.drawnOn &&
          !LKBodyMap.drawnOn(S.modal.gid, want)) S.modal.gid = null;
      render();
    },
    'add-block': function (el) {
      S.modal = { type: 'block', id: el.getAttribute('data-id'), title: '', mins: '', notes: '', error: null };
      render();
    },
    'block-save': function () {
      var m = S.modal, day = findDay(m.id);
      if (!day) { S.modal = null; render(); return; }
      var title = String(m.title || '').trim();
      if (!title) {
        m.error = 'Give the block a name, so the row says what it is.';
        render();
        var t1 = document.querySelector('[data-testid="block-title"]');
        if (t1) t1.focus();
        return;
      }
      /* Blank is fine -- not every block is timed. A number that is not a
         number of minutes is not. The same rule, and the same words, the
         workout log uses for the same field. */
      var raw = String(m.mins === null || m.mins === undefined ? '' : m.mins).trim();
      var mins = raw === '' ? null : Number(raw);
      if (raw !== '' && (!isFinite(mins) || mins < 1 || mins > 180)) {
        m.error = 'A length between 1 and 180 minutes, or leave it blank.';
        render();
        var t2 = document.querySelector('[data-testid="block-mins"]');
        if (t2) t2.focus();
        return;
      }
      day.blocks = day.blocks || [];
      day.blocks.push(blockRow({
        title: title,
        notes: String(m.notes || '').trim(),
        duration: mins === null ? '' : Math.round(mins) + ' min',
        open: false
      }));
      S.modal = null;
      markDirty();
      toast('Block added to ' + day.name + '.');
      render();
    },
    'block-remove': function (el) {
      var day = findDay(el.getAttribute('data-day'));
      if (!day) return;
      var id = el.getAttribute('data-id');
      var i = (day.blocks || []).map(function (b) { return b.id; }).indexOf(id);
      if (i < 0) return;
      var gone = day.blocks.splice(i, 1)[0];
      markDirty();
      toast('\u201c' + gone.title + '\u201d removed.', 'Undo', function () {
        day.blocks.splice(i, 0, gone);
        markDirty();
      });
      render();
    },
    'pick-add': function (el) {
      var day = findDay(el.getAttribute('data-id'));
      var row = ex(el.getAttribute('data-name'), el.getAttribute('data-muscle'));
      /* The catalogue id, where the picker knows it. Without it a lift added
         here was saved under a generated id no other screen recognises. */
      var exid = Number(el.getAttribute('data-exid'));
      if (exid) row.exId = exid;
      day.exercises.push(row);
      markDirty();
      toast('Added ' + el.getAttribute('data-name') + ' to ' + day.name + '.');
      render();
    },
    'move-day': function (el) {
      var id = el.getAttribute('data-id');
      var i = S.manual.days.map(function (d) { return d.id; }).indexOf(id);
      if (move(S.manual.days, i, i + Number(el.getAttribute('data-dir')))) markDirty();
      render();
    },
    'move-ex': function (el) {
      var day = findDay(el.getAttribute('data-day'));
      var i = day.exercises.map(function (x) { return x.id; }).indexOf(el.getAttribute('data-id'));
      if (move(day.exercises, i, i + Number(el.getAttribute('data-dir')))) markDirty();
      render();
    },
    'lift-clear': function () { S.lifted = null; render(); },
    /* Into the two-card choice, not straight into one of them. */
    'go-ai': function () { S.screen = 'pick'; render(); },
    'pick-back': function () { S.screen = 'manual'; render(); },
    'mode-describe': function () { S.screen = 'ai'; render(); },
    'mode-photo': function () { S.screen = 'photo'; render(); },
    'photo-back': function () { S.screen = 'pick'; render(); },
    'photo-clear': function () {
      if (S.photo.url) { try { URL.revokeObjectURL(S.photo.url); } catch (e) {} }
      S.photo.file = null; S.photo.url = null; S.photo.size = ''; S.photo.error = null;
      render();
      var f = document.querySelector('[data-testid="photo-file"]');
      if (f) { f.value = ''; f.focus({ preventScroll: true }); }
    },
    'photo-to-describe': function () {
      S.ai.note = S.photo.note;
      S.screen = 'ai';
      render();
    },
    'ai-back': function () { S.screen = 'pick'; render(); },
    'ai-example': function (el) {
      var t = el.getAttribute('data-text');
      S.ai.note = (S.ai.note.trim() ? S.ai.note.trim().replace(/\.$/, '') + '. ' : '') + t + '.';
      render();
    },
    'ai-generate': function () { runGeneration(); },
    'ai-cancel': function () {
      S.ai.status = 'idle'; clearTimers();
      toast('Generation cancelled.');
      render();
    },
    'ai-edit-note': function () { S.ai.status = 'idle'; S.ai.readDone = false; S.ai.read = null; render(); },
    'ai-regenerate': function () { S.ai.status = 'idle'; S.ai.plan = null; S.ai.readDone = false; S.ai.read = null; render(); },
    'ai-accept': function () { acceptPlan(); },
    'open-swap': function (el) { S.modal = { type: 'swap', id: el.getAttribute('data-id') }; render(); },
    'choose': function (el) {
      var id = el.getAttribute('data-id'), opt = el.getAttribute('data-opt');
      S.ai.plan.days.forEach(function (d) {
        d.slots.forEach(function (s) { if (s.id === id) s.choice = opt; });
      });
      S.modal = null;
      render();
    },
    'toast-action': function () {
      var fn = S.toast && S.toast.fn;
      S.toast = null;
      if (fn) fn();
      render();
    }
  };

  var INPUTS = {
    'split-name': function (el) { S.manual.name = el.value; markDirty(); patch(); },
    'day-name': function (el) { var d = findDay(el.getAttribute('data-id')); if (d) { d.name = el.value; markDirty(); patch(); } },
    'ai-note': function (el) { S.ai.note = el.value; patchAi(); },
    'pick-search': function (el) {
      S.modal.q = el.value;
      /* A search is a question about the whole body, so it leaves the
         chosen part behind rather than hiding most of the answers. */
      if (String(el.value || '').trim()) S.modal.gid = null;
      render();
    },
    'photo-note': function (el) {
      S.photo.note = el.value;
      var b = document.querySelector('[data-testid="photo-to-describe"]');
      if (b) { b.disabled = !el.value.trim(); b.setAttribute('aria-disabled', String(!el.value.trim())); }
    },
    'block-title': function (el) { S.modal.title = el.value; },
    'block-mins': function (el) { S.modal.mins = el.value; },
    'block-notes': function (el) { S.modal.notes = el.value; }
  };

  /* Light patches so typing never rebuilds the field under the caret. */
  function patch() {
    /* Typing can change whether the save bar exists at all; when it does,
       fall back to a full render, which restores focus and caret. */
    if (S.manual.dirty && !document.querySelector('.hdr .dot')) { render(); return; }
    var bar = document.querySelector('[data-testid="manual-actionbar"]');
    if (!!bar !== showBar()) { render(); return; }
    var title = document.querySelector('[data-testid="manual-title"]');
    if (title) title.textContent = S.manual.name.trim() || 'New split';
    var sub = document.querySelector('[data-testid="manual-subtitle"]');
    if (sub) sub.textContent = 'Unsaved changes';
    var st = document.querySelector('[data-testid="manual-status"]');
    if (st) st.textContent = S.manual.error ? 'Draft kept on this phone' : 'Unsaved changes';
  }
  function patchAi() {
    var st = document.querySelector('[data-testid="ai-status"]');
    if (st) st.textContent = S.ai.note.trim() ? 'Ready to draft' : 'Describe it first';
    var b = document.querySelector('[data-testid="ai-generate"]');
    if (b) { b.disabled = !S.ai.note.trim(); b.setAttribute('aria-disabled', String(!S.ai.note.trim())); }
  }

  document.addEventListener('click', function (e) {
    var dev = e.target.closest('[data-dev]');
    if (dev) { PRESETS[Number(dev.getAttribute('data-dev'))][1](); S.dev = false; render(); return; }
    if (e.target.closest('#devToggle')) { S.dev = !S.dev; renderDev(); return; }
    var grip = e.target.closest('[data-grip]');
    if (grip) {
      if (grip.dataset.dragged === '1') { grip.dataset.dragged = ''; return; }
      var id = grip.getAttribute('data-testid');
      S.lifted = S.lifted === id ? null : id;
      render();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (S.swipe && !(el && el.getAttribute('data-action') === 'ex-remove')) {
      S.swipe = null;
      if (!el) { render(); return; }
    }
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute('data-action')];
    if (fn) { e.preventDefault(); fn(el); }
  });

  document.addEventListener('input', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var fn = INPUTS[el.getAttribute('data-action')];
    if (fn) fn(el);
  });

  /* The chosen photo. Read as an object URL so the preview is the reader's
     own file and nothing is copied, encoded or sent. Nothing here uploads. */
  document.addEventListener('change', function (e) {
    var el = e.target.closest && e.target.closest('[data-action="photo-file"]');
    if (!el) return;
    var f = el.files && el.files[0];
    if (S.photo.url) { try { URL.revokeObjectURL(S.photo.url); } catch (err) {} }
    if (!f) { S.photo.file = null; S.photo.url = null; S.photo.size = ''; render(); return; }
    if (!/^image\//.test(f.type)) {
      S.photo.file = null; S.photo.url = null; S.photo.size = '';
      S.photo.error = 'That is not an image. A photo or a screenshot of your programme.';
      render();
      return;
    }
    S.photo.error = null;
    S.photo.file = f.name;
    S.photo.size = Math.max(1, Math.round(f.size / 1024)) + ' KB';
    try { S.photo.url = URL.createObjectURL(f); } catch (err) { S.photo.url = null; }
    render();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.modal) { S.modal = null; render(); return; }
    if (e.key === 'Escape' && S.swipe) { S.swipe = null; render(); return; }
    if (e.key === 'Escape' && S.manual.edit && S.screen === 'manual') {
      S.manual.edit = false; S.lifted = null; render(); return;
    }
    var grip = e.target.closest && e.target.closest('[data-grip]');
    if (!grip || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    var dir = e.key === 'ArrowUp' ? -1 : 1;
    var item = grip.closest('[data-sortable]');
    var dayId = item.getAttribute('data-day');
    if (dayId) {
      var day = findDay(dayId);
      var i = day.exercises.map(function (x) { return x.id; }).indexOf(item.getAttribute('data-id'));
      if (move(day.exercises, i, i + dir)) markDirty();
    } else {
      var j = S.manual.days.map(function (d) { return d.id; }).indexOf(item.getAttribute('data-id'));
      if (move(S.manual.days, j, j + dir)) markDirty();
    }
    S.lifted = grip.getAttribute('data-testid');
    render();
  });

  /* Swipe left to remove, the iOS gesture, available only at rest. A short
     swipe parks the row open with a single red Delete; a swipe past 45% of
     the row removes it outright. Either way an Undo toast follows. */
  document.addEventListener('pointerdown', function (e) {
    if (S.screen !== 'manual' || S.manual.edit) return;
    var wrap = e.target.closest('[data-swipe]');
    if (!wrap) return;
    var pane = wrap.querySelector('.swipe__pane');
    var startX = e.clientX, startY = e.clientY;
    var reveal = 88;                                  /* --sp-6 * 2 + --sp-5 */
    var base = wrap.getAttribute('data-open') === 'true' ? -reveal : 0;
    var axis = null, dx = base;

    function onMove(ev) {
      if (axis === null) {
        var ax = Math.abs(ev.clientX - startX), ay = Math.abs(ev.clientY - startY);
        if (ax < 8 && ay < 8) return;
        axis = ax > ay ? 'x' : 'y';
        if (axis === 'x') pane.style.transition = 'none';
      }
      if (axis !== 'x') return;
      if (ev.cancelable) ev.preventDefault();
      dx = Math.min(0, Math.max(-wrap.offsetWidth, base + (ev.clientX - startX)));
      pane.style.transform = 'translateX(' + dx + 'px)';
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      if (axis !== 'x') return;
      pane.style.transition = '';
      pane.style.transform = '';
      var id = wrap.getAttribute('data-id');
      if (dx <= -(wrap.offsetWidth * 0.45)) { removeExercise(wrap.getAttribute('data-day'), id); return; }
      S.swipe = dx <= -(reveal / 2) ? id : null;
      render();
    }
    document.addEventListener('pointermove', onMove, { passive: false });
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });

  /* Drag to reorder. Starts on the first pixel of movement, no long press,
     and a press that does not move is a tap that lifts the item instead. */
  /* THE SAME DRAG AS EVERY OTHER LIST IN THIS APP, through LKReorder:
     the 350ms hold, the 10px escape that hands a scroll back to the
     scroller, the lift, the wiggle on everything else and the gap opening
     under the row.

     What was here lifted on six pixels of movement with no hold at all,
     so a scroll that began on a handle picked the row up instead -- and
     nothing wiggled, so nothing said the list could be reordered until
     something already had been. The move itself is unchanged: this screen
     still owns its own data and its own repaint. */
  LKReorder.attach(document, {
    grip: '[data-grip]',
    item: '[data-sortable]',
    index: function (item) {
      /* Compared as text on both sides. An exercise id is a number and a
         day id is a string, and an attribute is always a string -- so a
         strict indexOf found every day and no exercise, which is why the
         lift worked on one list and the drop did nothing on the other. */
      var want = String(item.getAttribute('data-id'));
      var arr = listOf(item);
      for (var i = 0; i < arr.length; i++) if (String(arr[i].id) === want) return i;
      return -1;
    },
    lift: function (i, item) {
      S.dragging = i < 0 ? null
        : (item.querySelector('[data-grip]') || {}).getAttribute
          ? item.querySelector('[data-grip]').getAttribute('data-testid') : null;
      if (i >= 0) S.lifted = null;
      render();
    },
    /* The screen replaces its DOM on every render, so the element handed
       in before the repaint is not the one on screen after it. */
    refind: function (item) {
      var id = item.getAttribute('data-id');
      var day = item.getAttribute('data-day');
      return document.querySelector('[data-sortable][data-id="' + id + '"]' +
        (day ? '[data-day="' + day + '"]' : ''));
    },
    move: function (from, to, item) {
      var arr = listOf(item);
      if (!move(arr, from, to)) return false;
      markDirty();
      render();
      return true;
    }
  });

  function listOf(item) {
    var dayId = item.getAttribute('data-day');
    return dayId ? findDay(dayId).exercises : S.manual.days;
  }

  /* Open what the caller asked for. Booting on the dev switcher's populated
     preset meant "New split" opened the stored PPL split, under a line
     saying it had been "Saved 2 minutes ago" -- a split nobody had saved and
     a name nobody had typed. A new split is empty and has never been saved. */
  function openRequested() {
    var want = null;
    try { want = localStorage.getItem('lk_openSplit'); } catch (e) {}
    reset();
    /* Train's empty state offers both ways in, and says which it meant. */
    if (want === '__draft__') { S.screen = 'pick'; render(); return; }
    if (want === '__new__') { render(); return; }
    var sp = seedSplit();
    S.manual.id = sp.id || null;
    S.manual.created = sp.created || null;
    S.manual.name = sp.name;
    S.manual.days = sp.days;
    /* Saved, but not by this session: say when, not "2 minutes ago". */
    S.manual.savedAt = sp.id ? (sp.created ? 'on ' + sp.created : null) : null;
    render();
  }
  openRequested();

  /* In the demo this screen is mounted once, at boot, and Train's Edit and
     New both landed on whatever it had opened then. The route announces
     itself; open what was asked for, unless there are unsaved edits to lose. */
  document.addEventListener('lk:beforeback', function (e) {
    if (!S.manual || !S.manual.dirty) return;
    e.preventDefault();
    S.modal = { type: 'leave' };
    render();
  });

  document.addEventListener('lk:enter', function () {
    if (S.manual.dirty) return;
    openRequested();
  });

  /* THE WHOLE CATALOGUE in the picker. It held fourteen exercises against a
     library of 867, so building a split meant building it out of whatever
     fourteen were typed into this file. Fetched the way the library screen
     fetches it; from disk the inline fourteen stand, and the sheet says how
     many it is offering either way. */
  /* THE CATALOGUE, NOT A TEST FIXTURE.

     This fetched ../tests/fixtures/exercise-db.json, which exists in the
     repository and in no deployed build. In production the fetch 404s,
     the catch leaves the inline list standing, and somebody planning a
     split is offered FOURTEEN exercises out of eight hundred and sixty
     six -- with a search field over them and an empty state that still
     says "all 14 exercises". The workout log had the same fault and was
     fixed; this screen was not, because nothing pointed at it.

     LKExercises is the shared catalogue every screen already loads. It
     needs no fetch, works from a file on disk, and carries the group a
     picker needs to sort by body. */
  (function loadCatalogue() {
    if (!window.LKExercises || !LKExercises.all) return;
    var rows = LKExercises.all();
    if (!rows || !rows.length) return;
    LIBRARY = rows.map(function (x) {
      /* The catalogue id travels with the row, so a split stored as bare
         exIds can be read back into names without a second lookup table. */
      return { id: x.id, name: x.name, muscle: x.muscle || x.group || '',
               group: x.group || '' };
    });
    LIBRARY.sort(function (a, b) { return a.name < b.name ? -1 : 1; });
    if (S.modal && S.modal.type === 'pick') render();
  }());

  /* The running workout, from a screen that is not it. This screen redraws
     itself whole, so the shelf is rendered inline with everything else
     rather than mounted into a slot a redraw would throw away. A one-second
     tick repaints only when the strip's own text changes, so a session
     twenty minutes in does not sit at the same number while you read. */

  if (window.LKSession) {
    var shelfKey = null;
    window.setInterval(function () {
      var k = LKSession.html();
      if (k === shelfKey) return;
      shelfKey = k;
      render();
    }, 1000);
    document.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-testid="shelf-resume"]') : null;
      if (el) { e.preventDefault(); LKGo('workout-log'); }
    });
  }

})();

</script>
</body>
</html>
