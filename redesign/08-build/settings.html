        /* WHICHEVER OF THE TWO THIS BUILD IS. A screen that says nothing is
           scheduled while a server is scheduling it is as wrong as one
           that promises reminders it cannot send. */
        (pushReady()
          ? '<p class="t-detail" data-testid="notif-truth">These are schedules. This phone is ' +
              'registered with the server that sends them, at the times above, in your own ' +
              'timezone. ' + swLine + ' Turn the switch off and the registration goes with it.</p>'
          : '<p class="t-detail" data-testid="notif-truth">These are preferences, not schedules. ' +
            'A notification sent while you are looking at this page is all this build does: ' + swLine +
            ' Nothing above is scheduled, and turning one on will not make it arrive.</p>') +
      '</div>';

    return '<div class="card card--flush">' + head + types + sounds + foot + '</div>';
  }

  /* The workout reminder and its time used to sit here AND in the
     notification list below, two switches over one idea, with a single
     Reminder time standing in for every notification's send time. Both now
     live once, in the list, each with its own time; what is left in this card
     is the one thing that is not a notification -- how often the coach asks,
     which it asks whether or not the app is allowed to speak. */
  function remindersSection() {
    return group('Reminders',
      '<div class="card card--flush">' +
        navRow('checkin', 'Check-ins a day', CHECKIN[S.checkin], 'row-checkin') +
        '<div class="row row--static" data-testid="row-checkin-note">' +
          '<span class="row__main">' +
            '<span class="row__sub">The coach accepts this many readings a day. ' +
              'Whether it reminds you to leave one is the Daily check-in switch below.</span>' +
          '</span>' +
        '</div>' +
      '</div>' + notifCard());
  }

  /* =============================================================
     5. Data and account. One-time and destructive actions, last,
     each behind a confirmation that names what it costs.
     ============================================================= */
  /* What is running, checked rather than asserted, with the check offered
     again because a person who has just been told to reload wants to see it
     say so. "Unknown" is a real answer and is printed as one. */
  function versionRow() {
    var sub;
    if (S.versionState === 'checking') sub = 'Checking with the server…';
    else if (S.versionState === 'stale') sub = 'Build ' + esc(String(get('lk_deployVersion', '?'))) +
      '. Build ' + esc(String(S.newVersion)) + ' is published — see the top of this screen.';
    else if (S.versionState === 'current') sub = 'Build ' + esc(String(S.version)) + '. Up to date.';
    else if (S.versionState === 'absent') sub = location.protocol === 'file:'
      ? 'Opened from a file, so there is nothing to check against.'
      : 'No service worker is published beside this app, so there is no version to check.';
    else sub = 'Not checked yet.';
    return '<button class="row" data-action="check-version" data-testid="row-version">' +
             '<span class="row__main">' +
               '<span class="row__title">App version</span>' +
               '<span class="row__sub">' + sub + '</span>' +
             '</span>' +
             '<span class="row__chev">' + ICO.chev + '</span>' +
           '</button>';
  }

  function dataSection() {
    /* Measured, not asserted. This row said "1.2 MB of 5.0 MB" as a literal
       string; the whole store is a few tens of kilobytes. The figure is the
       same dump the backup writes, the count says how many keys it is, and
       the bar turns amber at 80% rather than only at the point where a write
       has already failed. */
    var used = storageBytes();
    var pct = Math.min(100, Math.round(used / QUOTA * 1000) / 10);
    var tight = pct >= 80;
    var storage =
      '<div class="row row--static" data-testid="row-storage" data-bytes="' + used + '">' +
        '<span class="row__main">' +
          '<span class="row__title">Storage used</span>' +
          '<span class="row__sub">' + n(bytesLabel(used)) + ' of ' + n('5.0') + ' MB on this phone, in ' +
            n(storedKeys()) + (storedKeys() === 1 ? ' key' : ' keys') + '</span>' +
          '<span class="meter mt-2' + (tight ? ' meter--warn' : '') + '" role="img" ' +
            'aria-label="' + pct + ' per cent of the space this app may use">' +
            '<span class="meter__fill" style="width:' + Math.max(1, pct) + '%"></span></span>' +
          (tight ? '<span class="row__sub" style="color: var(--warning)">Close to full. Export a backup, then erase what you do not need.</span>' : '') +
        '</span>' +
      '</div>';

    var files =
      '<div class="card card--flush">' + storage +
        /* EXPORT ALL DATA, and the whole of it. v6 had this twice: a consumer
           backup, and a beta admin button that downloaded four collections --
           the beta activity log, the tester roster and two counters -- which
           were an operator's view of other people's usage, not this person's
           training. That half is not reproduced: a product does not ship its
           own admin console, LKStore.dump() already returns everything the app
           is showing, and the four beta collections do not exist in this build
           to export. What is here is one file with everything in it, written
           through <a download>, with the change stamps a restore needs. */
        actionRow('export', 'Export a backup', 'One file with everything: workouts, splits, records, meals and settings', 'row-export') +
        actionRow('confirm-restore', 'Restore from a backup', 'Merge it with what is here, or replace what is here', 'row-restore') +
        actionRow('export-nutrition', 'Export your food log', 'A CSV of every meal by date, with your targets and your weigh-ins', 'row-export-nutrition') +
        versionRow() +
        actionRow('force-refresh', 'Force refresh', 'Clears what the browser cached and loads the app again. Your data is untouched', 'row-force-refresh') +
      '</div>';

    var danger = '<div class="card card--flush">';
    if (S.view === 'signed-in') {
      danger += actionRow('confirm-sign-out', 'Sign out', 'Keeps your data on this phone', 'row-sign-out', true);
    }
    danger += actionRow('confirm-reset', 'Erase everything on this phone',
      'Workouts, splits and records. Cannot be undone', 'row-reset', true);
    if (S.view === 'signed-in') {
      danger += actionRow('confirm-delete', 'Delete your account',
        'Removes your account and everything in it', 'row-delete', true);
    }
    danger += '</div>';

    /* The way back into the walkthrough. It was written, it wrote its own
       gate, and nothing anywhere opened it -- so a reader who skipped it on
       the first run had no route in, and one who wanted it again had none
       either. */
    /* TWO ROWS, NOT ONE. The quick start and the full tour are different
       lengths for different reasons -- a minute to be able to use the
       app, five to see the rest -- and offering them as one row makes
       somebody guess which they are about to get. Each says how far
       through it they are, because a module abandoned halfway is worth
       resuming and a module finished is worth not repeating. */
    var track = get('lk_tutorialTrack', null);
    var steps = get('lk_tutorialSteps', {}) || {};
    var quickAt = Number(steps.quick || 0);
    var tourAt = ['train', 'fuel', 'coach', 'progress', 'profile']
      .filter(function (k) { return Number(steps[k] || 0) > 0; }).length;
    var help = '<div class="card card--flush">' +
      actionRow('tutorial', 'Quick start',
        quickAt ? 'The loop, in about a minute. Taken already.'
                : 'The loop, in about a minute',
        'row-tutorial') +
      actionRow('tutorial-tour', 'Full tour',
        tourAt ? tourAt + (tourAt === 1 ? ' module' : ' modules') + ' of five started'
               : 'Five modules, about five minutes',
        'row-tutorial-tour') +
    '</div>';
    /* lk_tutorialTrack records which track was last taken. Nothing on
       this screen needs it yet; it is read by the walkthrough itself to
       decide what Replay means. */
    void track;

    return group('Help', help) + group('Data and account', files + danger);
  }

  /* The one thing on this screen that somebody did not come here to change.
     It sits above everything because a stale build is the reason half the
     other rows would be lying, and it is gone the moment it is dealt with. */
  function updateBanner() {
    if (S.versionState !== 'stale' || !S.newVersion) return '';
    return '<section class="section"><div class="card" data-testid="update-ready">' +
             '<div class="banner banner--info" role="status">' + ICO.cloud +
               '<span><strong>A new version is ready</strong>' +
               'Build ' + esc(String(S.newVersion)) + ' has been published. This phone is running ' +
               esc(String(get('lk_deployVersion', 'an older build'))) + '. ' +
               'Reloading clears what the browser cached and starts the new one. Nothing you have logged is touched.</span>' +
             '</div>' +
             '<button class="btn btn--primary btn--block mt-4" data-action="force-refresh" data-testid="update-now">' +
               '<span class="btn__label">Reload into the new version</span></button>' +
           '</div></section>';
  }

  function screenHTML() {
    return updateBanner() + accountSection() + displaySection() + seenSection() +
           trainingSection() + remindersSection() + dataSection();
  }

  /* =============================================================
     Sheets
     ============================================================= */
  function sheetShell(title, inner, testid) {
    return '<div class="scrim" data-action="close-sheet" data-testid="scrim"></div>' +
           '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-testid="' + testid + '">' +
             '<div class="sheet__grab"></div>' +
             '<div class="sheet__head">' +
               '<h2 class="t-section" id="sheet-title">' + title + '</h2>' +
               '<button class="iconbtn" data-action="close-sheet" data-testid="sheet-close" aria-label="Close">' +
                 ICO.close + '</button>' +
             '</div>' + inner +
           '</div>';
  }

  function optionSheet(key) {
    var spec = opts()[key];
    var list = spec.options.map(function (o) {
      var on = String(S[key]) === String(o.v);
      return '<button class="opt" role="radio" aria-checked="' + on + '" data-action="pick" data-key="' + key +
               '" data-value="' + esc(o.v) + '" data-testid="opt-' + key + '-' + esc(o.v) + '">' +
               '<span class="opt__mark">' + (on ? ICO.check : '') + '</span>' +
               '<span class="opt__main">' +
                 '<span class="opt__title">' + o.title + '</span>' +
                 (o.sub ? '<span class="opt__sub">' + o.sub + '</span>' : '') +

    }).join('');
    return sheetShell(spec.title,
      '<div class="sheet__body card card--flush" role="radiogroup" aria-labelledby="sheet-title">' + list + '</div>',
      'sheet-' + key);

  function profileSheet() {
    return sheetShell('Your name',
      '<div class="sheet__body">' +
        '<label class="field">' +
          '<span class="field__label t-detail">Display name</span>' +
          '<input class="input" id="f-name" value="' + esc(S.name) + '" data-testid="field-name" autocomplete="off">' +
        '</label>' +
        '<p class="field__help">@' + esc(S.username) + ' and ' + esc(S.email) + ' cannot be changed here.</p>' +
      '</div>' +
      '<div class="sheet__foot stack stack--2">' +
        '<button class="btn btn--secondary btn--block" data-action="save-name" data-testid="save-name">' +
          '<span class="btn__label">Save</span></button>' +
      '</div>', 'sheet-profile');
  }

  /* The body sheet is where defect 3 is visible: every number in it is
     derived from the stored kilogram value, so the unit row above and
     this field can never disagree. */
  function bodySheet() {
    function segField(key, label, map, testid) {
      var items = Object.keys(map).map(function (v) {
        return '<button class="seg__item" role="radio" aria-checked="' + (S.body[key] === v) + '" ' +
                 'data-action="body-set" data-key="' + key + '" data-value="' + v + '" ' +
                 'data-testid="' + testid + '-' + v + '">' + map[v] + '</button>';
      }).join('');
      return '<div class="field">' +
               '<span class="field__label t-detail">' + label + '</span>' +
               '<div class="seg seg--lg" role="radiogroup" aria-label="' + label + '">' + items + '</div>' +
             '</div>';
    }
    var b = S.body;
    var weightVal = b.weightKg === null ? '' : (S.unit === 'kg' ? round1(b.weightKg) : round1(b.weightKg * LB));
    /* HEIGHT IN THE UNITS THE PERSON THINKS IN. The row printed "5 ft 6 in"
       and the editor behind it took centimetres, so a reader on pounds had to
       convert their own height to open their own profile. Two fields, feet and
       inches, whenever weights are in pounds -- and still one stored number,
       in centimetres, because every screen reads that. */
    var totalIn = b.heightCm === null ? null : Math.round(b.heightCm / 2.54);
    var heightField;
    if (S.unit === 'kg') {
      heightField = '<label class="field">' +
          '<span class="field__label t-detail">Height in centimetres</span>' +
          '<input class="input num" id="f-height" inputmode="decimal" value="' +
            (b.heightCm === null ? '' : b.heightCm) + '" data-testid="field-height">' +
        '</label>';
    } else {
      heightField = '<div class="field">' +
          '<span class="field__label t-detail">Height</span>' +
          '<div class="hstack hstack--2">' +
            '<label class="grow">' +
              '<input class="input num" id="f-height-ft" inputmode="numeric" placeholder="ft" ' +
                'aria-label="Height, feet" value="' +
                (totalIn === null ? '' : Math.floor(totalIn / 12)) + '" data-testid="field-height-ft">' +
            '</label>' +
            '<label class="grow">' +
              '<input class="input num" id="f-height-in" inputmode="numeric" placeholder="in" ' +
                'aria-label="Height, inches" value="' +
                (totalIn === null ? '' : totalIn % 12) + '" data-testid="field-height-in">' +
            '</label>' +
          '</div>' +
          '<span class="field__help">Feet and inches. Stored in centimetres, so switching the unit ' +
            'converts it rather than relabelling it.</span>' +
        '</div>';
    }
    return sheetShell('Body and goal',
      '<div class="sheet__body stack stack--4">' +
        '<label class="field">' +
          '<span class="field__label t-detail">Age</span>' +
          '<input class="input num" id="f-age" inputmode="numeric" value="' +
            (b.age === null ? '' : b.age) + '" data-testid="field-age">' +
        '</label>' +
        segField('sex', 'Sex', SEX, 'seg-sex') +
        heightField +
        '<label class="field">' +
          '<span class="field__label t-detail">Body weight in ' + (S.unit === 'kg' ? 'kilograms' : 'pounds') + '</span>' +
          '<input class="input num" id="f-weight" inputmode="decimal" value="' + weightVal + '" data-testid="field-weight">' +
        '</label>' +
        '<p class="field__help">Switching the weight unit converts this figure. It does not relabel it.</p>' +
        segField('goal', 'Goal', GOAL, 'seg-goal') +
        (S.bodyError ? '<p class="field__error" role="alert" data-testid="body-error">' +
          esc(S.bodyError) + '</p>' : '') +
      '</div>' +
      '<div class="sheet__foot stack stack--2">' +
        '<button class="btn btn--secondary btn--block" data-action="save-body" data-testid="save-body">' +
          '<span class="btn__label">Save</span></button>' +
      '</div>', 'sheet-body');
  }

  /* A password form with nowhere to send a password. Every rule it can
     check on the device it checks, in the order a person meets them, and it
     says plainly that the last step -- the one that needs the account server
     -- does not happen in this build. The alternative, a form that reports
     "Password changed", would be the screen lying about the one thing a
     password form must never lie about. */
  function passwordSheet() {
    function field(id, label, testid, help) {
      return '<label class="field">' +
               '<span class="field__label t-detail">' + label + '</span>' +
               '<input class="input" type="password" id="' + id + '" data-testid="' + testid + '" ' +
                 'autocomplete="off" autocapitalize="off" spellcheck="false">' +
               (help ? '<span class="field__help">' + help + '</span>' : '') +
             '</label>';
    }
    return sheetShell('Change your password',
      '<div class="sheet__body stack stack--4">' +
        field('f-pw-old', 'Current password', 'field-pw-old', '') +
        field('f-pw-new', 'New password', 'field-pw-new', 'At least 8 characters, and not the one you have now.') +
        field('f-pw-again', 'New password again', 'field-pw-again', '') +
        (S.pwError ? '<p class="field__error" role="alert" data-testid="pw-error">' + esc(S.pwError) + '</p>' : '') +
        '<p class="field__help">This build has no account server. What you type is checked here and goes ' +
          'nowhere: nothing is saved, nothing is sent, and your password is unchanged.</p>' +
      '</div>' +
      '<div class="sheet__foot stack stack--2">' +
        '<button class="btn btn--secondary btn--block" data-action="save-password" data-testid="save-password">' +
          '<span class="btn__label">Check it</span></button>' +
      '</div>', 'sheet-password');
  }

  /* =============================================================
     Confirmations. Every destructive or one-time action names the
     consequence before it happens, and the safe choice is the one
     that reads normally.
     ============================================================= */
  var CONFIRM = {
    'sign-out': {
      title: 'Sign out?',
      body: 'Your workouts stay on this phone. You will need your password to sync again.',
      go: 'Sign out', danger: false, done: 'Signed out. Everything you logged is still on this phone.', to: 'signed-out'
    },
    'reset': {
      /* This dialog was already right. What was wrong was everything after
         it: the button closed the dialog and toasted "Everything on this
         phone was erased" while localStorage was untouched, so lk_badges,
         lk_perfTracking, lk_cycle, lk_fuelNumbers, lk_profile and lk_theme
         all survived an erase that reported success. It calls
         LKStore.reset() now and the toast counts what actually went. */
      title: 'Erase everything on this phone?',
      body: 'Every workout, split and record on this phone is deleted. This cannot be undone.',
      go: 'Erase everything', danger: true
    },
    'delete': {
      /* "Your account and everything in it is deleted from LOCKED" was a
         claim about a server this build cannot reach, followed by the toast
         "Account deleted." Nothing left the device and nothing on it was
         removed. What this can honestly do is the local half, so that is
         what it says and what it does. */
      title: 'Delete your account?',
      body: 'There is no account server in this build, so nothing can be deleted from one. ' +
            'What this does do is sign you out and erase everything LOCKED has stored on this phone. ' +
            'That cannot be undone.',
      go: 'Sign out and erase this phone', danger: true, to: 'guest'
    },
    'restore': {
      title: 'Restore from a backup?',
      body: 'Pick a backup file, and say what should happen where it disagrees with this phone.',
      go: 'Choose a file', danger: false
    }
  };

  function dialogHTML(id) {
    var c = CONFIRM[id];
    /* Restore asks the one question a restore has to ask, and each answer is
       its own button saying what it costs. A single "Choose a file" that
       silently replaced everything was the whole of it before. */
    if (id === 'restore') {
      return '<div class="scrim" data-action="close-dialog" data-testid="scrim"></div>' +
             '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" ' +
               'aria-describedby="dlg-body" data-testid="dialog-restore">' +
               '<h2 class="t-section" id="dlg-title">' + c.title + '</h2>' +
               '<p class="t-detail mt-2" id="dlg-body">' + c.body + '</p>' +
               '<div class="stack stack--2 mt-5">' +
                 '<button class="btn btn--secondary btn--block" data-action="confirm" data-id="restore" ' +
                   'data-mode="merge" data-testid="confirm-restore-merge">' +
                   '<span class="btn__label">Merge, keeping whichever is newer</span></button>' +
                 '<button class="btn btn--danger-solid btn--block" data-action="confirm" data-id="restore" ' +
                   'data-mode="replace" data-testid="confirm-restore">' +
                   '<span class="btn__label">Replace everything on this phone</span></button>' +
                 '<button class="btn btn--tertiary btn--block" data-action="close-dialog" data-testid="cancel-restore">' +
                   '<span class="btn__label">Cancel</span></button>' +
               '</div>' +
             '</div>';
    }
    return '<div class="scrim" data-action="close-dialog" data-testid="scrim"></div>' +
           '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" ' +
             'aria-describedby="dlg-body" data-testid="dialog-' + id + '">' +
             '<h2 class="t-section" id="dlg-title">' + c.title + '</h2>' +
             '<p class="t-detail mt-2" id="dlg-body">' + c.body + '</p>' +
             '<div class="stack stack--2 mt-5">' +
               '<button class="btn ' + (c.danger ? 'btn--danger-solid' : 'btn--secondary') + ' btn--block" ' +
                 'data-action="confirm" data-id="' + id + '" data-testid="confirm-' + id + '">' +
                 '<span class="btn__label">' + c.go + '</span></button>' +
               '<button class="btn btn--tertiary btn--block" data-action="close-dialog" data-testid="cancel-' + id + '">' +
                 '<span class="btn__label">Cancel</span></button>' +
             '</div>' +
           '</div>';
  }

  function toastHTML() {
    return '<div class="toast toast--nonav" data-testid="toast">' +
             '<span class="toast__body">' + S.toast + '</span>' +
             '<button class="toast__action" data-action="close-toast" data-testid="toast-dismiss">Done</button>' +
           '</div>';
  }

  /* =============================================================
     Render
     ============================================================= */
  var body = document.getElementById('body');
  var overlay = document.getElementById('overlay');
  var screen = document.getElementById('screen');
  var live = document.getElementById('live');
  var lastFocus = null;

  /* In the demo this screen is mounted once, so a weigh-in taken on Progress
     or Fuel after boot never reached the body card. */
  document.addEventListener('lk:enter', function () {
    var p = get('lk_profile', null) || {};
    var log = get('lk_weightLog', []) || [];
    var last = log.length ? log[log.length - 1] : null;
    var kg = last && last.kg ? Number(last.kg) : Number(p.weightKg);
    if (kg > 0 && kg !== S.body.weightKg) { S.body.weightKg = Math.round(kg * 10) / 10; render(); }
    /* A screen that mounts once would otherwise check for a new build at the
       moment the demo booted and never again -- and in the demo the worker is
       registered on window load, which can be after this screen's first pass,
       so the registration is looked for again rather than assumed. */
    checkServiceWorker();
  });

  /* WHICH onboarding screen. Both of these landed on Welcome, so somebody
     who had already chosen "Create account" was asked to choose again. The
     demo's router takes the click, so the answer is left where onboarding
     reads it rather than written in a handler that never runs. */
  var ONBOARD_OPEN = { 'create-account': 'signup', 'sign-in': 'signin' };
  function handOnboarding(tid) {
    if (!ONBOARD_OPEN[tid]) return;
    try { localStorage.setItem('lk_openOnboarding', ONBOARD_OPEN[tid]); } catch (e) {}
  }
  document.addEventListener('lk:handoff', function (e) {
    var el = (e.detail || {}).el;
    var tid = el && el.getAttribute ? el.getAttribute('data-testid') : null;
    handOnboarding(tid);
  });
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-testid]') : null;
    if (el) handOnboarding(el.getAttribute('data-testid'));
  }, true);

  function render() {
    screen.setAttribute('data-state', S.view);
    /* One writer. theme.js owns the root attribute and the lk_theme key,
       so the choice made here is the choice every other screen reads. */
    if (window.LKTheme) window.LKTheme.set(S.theme);
    LKPatch(body, screenHTML());

    var ov = '';
    if (S.sheet === 'profile') ov = profileSheet();
    else if (S.sheet === 'body') ov = bodySheet();
    else if (S.sheet === 'password') ov = passwordSheet();
    else if (S.sheet) ov = optionSheet(S.sheet);
    else if (S.dialog) ov = dialogHTML(S.dialog);
    if (S.toast) ov += toastHTML();
    LKPatch(overlay, ov);

    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.view));
    });

    if (S.sheet || S.dialog) {
      /* Focus goes to the way OUT, never to the thing that cannot be undone.
         "the first button in the dialog" is the confirm button, so opening
         "Erase everything on this phone" put focus on Erase everything and
         one Return wiped the device. Cancel is the safe default; the person
         who means it can reach the other button with one Tab. */
      var f = overlay.querySelector('[data-testid="sheet-close"]') ||
              overlay.querySelector('[data-action="close-dialog"].btn') ||
              overlay.querySelector('.dialog button');
      if (f) f.focus();
    }
  }

  function say(msg) { live.textContent = msg; }

  function openOverlay(kind, id) {
    lastFocus = document.activeElement;
    if (kind === 'sheet') { S.sheet = id; S.dialog = null; }
    else { S.dialog = id; S.sheet = null; }
    render();
  }
  function closeOverlay(testid) {
    S.sheet = null; S.dialog = null;
    render();
    var back = testid && document.querySelector('[data-testid="' + testid + '"]');
    if (back) back.focus();
    else if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }

  var toastTimer = null;
  function toast(msg) {
    S.toast = msg;
    say(msg.replace(/<[^>]+>/g, ''));
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; render(); }, 5000);
  }

  /* -------------------------------------------------------------
     The one network action. It has a busy state, it disables its
     own control while it runs, and its failure path can only report
     failure. Nothing about the result is assumed before it arrives.
     ------------------------------------------------------------- */
  var syncTimer = null;
  /* THE REAL SYNC, through the one seam. LKCloud knows whether there is a
     server; this screen knows how to say what happened. Neither guesses at
     the other's job.

     Every branch fails closed. The old build's catch called onResult(true)
     and rendered the verified panel, so a dropped connection granted
     access; and a sync timestamp written for a sync that did not happen is
     the same lie one screen further on. */
  function syncNow() {
    if (S.sync === 'busy') return;

    /* The dev switcher's "Account unreachable" state, kept: it is how the
       failure path is looked at without unplugging anything. */
    if (S.view === 'error') {
      S.sync = 'busy'; render(); say('Syncing');
      clearTimeout(syncTimer);
      syncTimer = setTimeout(function () {
        S.sync = 'failed'; render(); say('Sync failed. Nothing was sent.');
      }, 900);
      return;
    }

    var C = window.LKCloud;
    if (!C || !C.ready()) {
      /* No server configured. It says exactly that rather than "everything
         is up to date", which reads as a completed sync. */
      S.sync = 'idle';
      render();
      toast('Not in this build. Nothing has left this device.');
      return;
    }
    if (!C.signedIn()) {
      S.sync = 'idle';
      render();
      toast('Sign in to sync. Your training stays on this phone until you do.');
      return;
    }

    S.sync = 'busy';
    render();
    say('Syncing');
    C.sync().then(function (r) {
      if (!r.ok) {
        S.sync = 'failed';
        render();
        say(r.message || 'Sync failed. Nothing was sent.');
        return;
      }
      /* Written only on a sync that happened. */
      S.syncedAt = new Date().toISOString();
      put('lk_lastSync', S.syncedAt);
      S.sync = 'idle';
      render();
      var up = (r.data && r.data.pushed && r.data.pushed.pushed) || 0;
      var down = (r.data && r.data.pulled && r.data.pulled.applied) || 0;
      toast(!up && !down ? 'Already up to date.'
        : 'Synced. ' + up + ' up, ' + down + ' down.');
    }, function () {
      S.sync = 'failed';
      render();
      say('Sync failed. Nothing was sent.');
    });
  }

  /* WHAT THE CYCLE LOG IS ALLOWED TO DO. The sync carries it only with
     this on, in both directions -- it is the one key set here where
     ignoring the switch would not be a bug but a breach. */
  function cycleBackupOn() {
    var mc = get('lk_mcProfile', null);
    return !!(mc && mc.cloudBackup);
  }

  /* =============================================================
     Events
     ============================================================= */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var a = t.dataset.action;

    if (a === 'back') {
      /* Standalone this is a page; in the demo the router takes the click
         first. The button carried no data-action at all, so on disk it was
         a visible, enabled control with nothing behind it. */
      LKGo('profile');

    } else if (a === 'sheet') {
      openOverlay('sheet', t.dataset.key);

    } else if (a === 'close-sheet') {
      var key = S.sheet;
      S.pwError = null;
      closeOverlay(key === 'profile' ? 'row-identity' : key === 'body' ? 'row-body' : rowFor(key));

    } else if (a === 'toggle') {
      var k = t.dataset.key;
      S[k] = !S[k];
      persist(k);
      render();
      var el = document.querySelector('[data-testid="' + t.dataset.testid + '"]');
      if (el) el.focus();
      var LABEL = { restTimer: 'Rest timer ', partials: 'Count partial reps ', shortLib: 'Short exercise list ',
                    reminder: 'Workout reminder ', fuelNumbers: 'Calorie numbers ',
                    badges: 'Streaks and badges ', cycle: 'Cycle tracking ',
                    perfTracking: 'Stack tracking ', cycleBackup: 'Cycle log backup ' };
      if (k === 'cycleBackup') {
        toast(S.cycleBackup
          ? 'Recorded. Your cycle log would be included in a sync. Nothing has been uploaded: this build has no server.'
          : 'Recorded. A sync will skip your cycle log, in both directions.');
      }
      say((LABEL[k] || 'Setting ') + (S[k] ? 'on' : 'off'));

    } else if (a === 'notif-toggle') {
      var nk = t.dataset.key;
      notifSet(nk, !notifOn(nk));
      render();
      var nel = document.querySelector('[data-testid="' + t.dataset.testid + '"]');
      if (nel) nel.focus();
      /* Said out loud at the point of use, not only in the paragraph at the
         bottom of the card: turning one on is recording a preference, and
         nothing about it will arrive. */
      say(t.dataset.name + ' ' + (notifOn(nk) ? 'on' : 'off'));
      if (notifOn(nk)) toast(t.dataset.name + ' is on. It is recorded, not scheduled: ' +
        'nothing can send it until this app has a server to push from.');

    } else if (a === 'check-version') {
      checkVersion();

    } else if (a === 'notif-master') {
      askPermission();

    } else if (a === 'notif-test') {
      testNotification();

    } else if (a === 'sound-pick') {
      S.restSound = t.dataset.value;
      put('lk_restSound', S.restSound);
      playSound(S.restSound);
      render();
      var sel = document.querySelector('[data-testid="sound-' + S.restSound + '"]');
      if (sel) sel.focus();

    } else if (a === 'pick') {
      var key2 = t.dataset.key, raw = t.dataset.value;
      var before = { weightKg: S.body.weightKg, unit: S.unit };
      S[key2] = (key2 === 'restSec' || key2 === 'plateKg') ? Number(raw) : raw;
      persist(key2);
      S.sheet = null;
      render();
      var back2 = document.querySelector('[data-testid="' + rowFor(key2) + '"]');
      if (back2) back2.focus();
      /* A unit change confirms itself with both numbers, so the person
         can see the value was converted rather than relabelled. */
      if (key2 === 'unit' && before.unit !== S.unit) {
        /* persist() already wrote it through LKUnits, which is what tells
           every other open screen. */
        toast(S.unit === 'lb'
          ? 'Weights now show in pounds. Your body weight, ' + round1(before.weightKg) +
            ' kg, is ' + round1(before.weightKg * LB) + ' lb.'
          : 'Weights now show in kilograms. Your body weight, ' + round1(before.weightKg * LB) +
            ' lb, is ' + round1(before.weightKg) + ' kg.');
      }

    } else if (a === 'body-set') {
      S.body[t.dataset.key] = t.dataset.value;
      render();
      var b2 = document.querySelector('[data-testid="' + t.dataset.testid + '"]');
      if (b2) b2.focus();

    } else if (a === 'save-name') {
      var nv = (document.getElementById('f-name') || {}).value;
      if (nv && nv.trim()) S.name = nv.trim();
      /* lk_profile.displayName, so Profile's header reads what was typed
         here. The old Save closed the sheet and wrote nothing at all. */
      patchKey('lk_profile', { displayName: S.name });
      closeOverlay('row-identity');
      toast('Name saved.');

    } else if (a === 'save-body') {
      var age = Number((document.getElementById('f-age') || {}).value);
      var wv = Number((document.getElementById('f-weight') || {}).value);
      /* One number out of either editor. Feet and inches are read as a pair
         and inches alone is accepted, so "70" in the inches box is a height
         and not a rejection. */
      var hv;
      if (S.unit === 'kg') {
        hv = Number((document.getElementById('f-height') || {}).value);
      } else {
        var ft = Number((document.getElementById('f-height-ft') || {}).value) || 0;
        var inch = Number((document.getElementById('f-height-in') || {}).value) || 0;
        hv = ft * 12 + inch;
      }
      /* BOUNDED, AND A REJECTION IS SAID OUT LOUD. Age 999 saved and came
         back after a reload; a weight of 0 was dropped in silence, leaving
         the old figure under a toast saying it had been saved. */
      var wKg = S.unit === 'kg' ? wv : wv / LB;
      var hCm = S.unit === 'kg' ? hv : hv * 2.54;
      var bad = null;
      if (!(age >= 13 && age <= 120)) bad = 'An age between 13 and 120.';
      else if (!S.body.sex) bad = 'Choose one, so the calorie maths has something to work from.';
      else if (!(hCm >= 100 && hCm <= 250)) {
        bad = S.unit === 'kg' ? 'A height between 100 and 250 cm.'
                              : 'A height between 3 ft 3 in and 8 ft 2 in.';
      } else if (!(wKg >= 20 && wKg <= 400)) {
        bad = S.unit === 'kg' ? 'A body weight between 20 and 400 kg.'
                              : 'A body weight between 45 and 880 lb.';
      } else if (!S.body.goal) bad = 'Pick a goal.';
      if (bad) { S.bodyError = bad; render(); return; }
      S.bodyError = null;
      S.body.age = Math.round(age);
      /* Read back into the stored unit, never into the displayed one. */
      S.body.heightCm = Math.round(hCm);
      S.body.weightKg = round1(wKg);
      /* One key, in kilograms and centimetres, which is what every other
         screen reads. Save Stats used to change four variables on this page
         and nothing else. */
      patchKey('lk_profile', {
        age: S.body.age, sex: S.body.sex, heightCm: S.body.heightCm,
        weightKg: S.body.weightKg, goal: S.body.goal
      });
      closeOverlay('row-body');
      toast('Body and goal saved.');

    } else if (a === 'sync') {
      syncNow();

    } else if (a === 'tutorial') {
      LKGo('tutorial');
    } else if (a === 'tutorial-tour') {
      /* Straight to the hub rather than through the quick start's intro,
         because somebody who chose the full tour has already decided. */
      try { sessionStorage.setItem('lk_tutorialOpen', 'hub'); } catch (e) {}
      LKGo('tutorial');
    } else if (a === 'export') {
      exportBackup();

    } else if (a === 'export-nutrition') {
      nutritionCSV();

    } else if (a === 'force-refresh') {
      forceRefresh();

    } else if (a === 'save-password') {
      savePassword();

    } else if (a === 'create-account' || a === 'sign-in') {
      /* Both were toasts announcing a screen that exists. Onboarding holds
         sign-in and account creation, so they go there. */
      LKGo('onboarding');

    } else if (a.indexOf('confirm-') === 0 && a !== 'confirm') {
      openOverlay('dialog', a.slice(8));

    } else if (a === 'confirm') {
      if (t.dataset.mode) S.restoreMode = t.dataset.mode;
      confirmed(t.dataset.id);

    } else if (a === 'close-dialog') {
      var d = S.dialog;
      closeOverlay(d === 'sign-out' ? 'row-sign-out' : d === 'reset' ? 'row-reset' :
                   d === 'delete' ? 'row-delete' : 'row-restore');

    } else if (a === 'close-toast') {
      clearTimeout(toastTimer);
      S.toast = null;
      render();
    }
  });

  /* What each confirmation actually does. Three of the four used to do
     nothing but change a variable and print a sentence claiming otherwise. */
  function confirmed(id) {
    var c = CONFIRM[id];
    if (id === 'delete') {
      /* THE ACCOUNT, NOT JUST THE PHONE. This wiped local storage and then
         said "Nothing was sent to a server: there is not one here", which
         was true and is not any more -- so the rows and the account itself
         survived a screen that had just called itself Delete your account.
         The device is cleared either way; the server half is attempted
         first, and a failure is said rather than swallowed. */
      var Cd = window.LKCloud;
      if (Cd && Cd.ready() && Cd.signedIn()) {
        Cd.deleteAccount().then(function (r) {
          if (!r || !r.ok) {
            toast('Everything on this phone is gone. The account itself could not be ' +
                  'deleted just now \u2014 try again when you have signal.');
          }
        });
      }
    }
    if (id === 'reset' || id === 'delete') {
      var gone = ST ? ST.reset() : 0;
      /* Every row re-reads the store, which is now empty, so the whole app
         falls back to the seed -- the state a fresh install of this build
         opens in. Written down for delete, so Profile agrees rather than
         showing an account this screen has just signed out of. */
      reseed();
      if (id === 'delete') { S.view = 'guest'; put('lk_guestMode', '1'); }
      S.sync = 'idle';
      closeOverlay();
      toast(gone + (gone === 1 ? ' key' : ' keys') + ' erased. Everything you changed on this phone is gone, ' +
        'and the app is back to the data a fresh install of this build opens with.' +
        (id === 'delete'
          ? (window.LKCloud && LKCloud.ready()
              ? ' Your account has been deleted too.'
              : ' Nothing was sent to a server: there is not one here.')
          : ''));
      return;
    }
    if (id === 'restore') {
      closeOverlay('row-restore');
      restoreInput().click();
      return;
    }
    if (id === 'sign-out') {
      /* SIGNING OUT HAS TO DROP THE TOKEN. This flipped a local flag and
         nothing else, so the session in the store survived it and the next
         sync went on syncing -- on a shared phone, signed out on screen and
         signed in in fact. LKCloud.signOut clears it locally first and
         never fails: a sign-out that fails on the network and leaves
         somebody signed in is the wrong way round to fail. */
      var C0 = window.LKCloud;
      if (C0 && C0.signOut) C0.signOut();
    }
    if (c.to) {
      S.view = c.to;
      put('lk_guestMode', c.to === 'signed-in' ? '0' : '1');
    }
    closeOverlay();
    toast(c.done);
  }

  /* Four checks, in the order a person meets them. The fifth -- is the
     current password the right one -- is the server's, and is asked below
     when there is one. */
  function savePassword() {
    var cur = (document.getElementById('f-pw-old') || {}).value || '';
    var nw = (document.getElementById('f-pw-new') || {}).value || '';
    var again = (document.getElementById('f-pw-again') || {}).value || '';
    var bad = null, focus = null;
    if (!cur) { bad = 'Type the password you use now.'; focus = 'f-pw-old'; }
    else if (nw.length < 8) { bad = 'A new password needs at least 8 characters.'; focus = 'f-pw-new'; }
    else if (nw === cur) { bad = 'That is the password you already have.'; focus = 'f-pw-new'; }
    else if (again !== nw) { bad = 'The two new passwords are not the same.'; focus = 'f-pw-again'; }
    S.pwError = bad;
    render();
    if (bad) {
      var f = document.getElementById(focus);
      if (f) f.focus();
      return;
    }
    /* THE FIFTH CHECK IS THE SERVER'S. Whether the current password is the
       right one is a question only the account can answer, and this used to
       close the sheet and say so. With a server it asks, and the sheet
       stays open on a wrong password rather than reporting a change that
       did not happen. */
    var Cp = window.LKCloud;
    if (Cp && Cp.ready() && Cp.signedIn()) {
      S.pwBusy = true; render();
      Cp.changePassword(cur, nw).then(function (r) {
        S.pwBusy = false;
        if (!r || !r.ok) {
          S.pwError = (r && r.message) || 'The password could not be changed.';
          render();
          var fe = document.getElementById('f-pw-old');
          if (fe) fe.focus();
          return;
        }
        closeOverlay('row-password');
        toast('Password changed. You stay signed in on this phone.');
      });
      return;
    }
    closeOverlay('row-password');
    toast(Cp && Cp.ready()
      ? 'Sign in first: a password belongs to an account.'
      : 'Those eight characters would do. Nothing was changed and nothing was sent: ' +
        'this build has no account server.');
  }

  function rowFor(key) {
    return {
      unit: 'row-weight-unit', dist: 'row-distance-unit', weekStart: 'row-week-start',
      theme: 'row-appearance', restSec: 'row-rest-length', plateKg: 'row-plate-rounding',
      reminderAt: 'row-time-workout', checkinAt: 'row-time-checkin',
      restockAt: 'row-time-restock', checkin: 'row-checkin',
      profile: 'row-identity', body: 'row-body', password: 'row-password'
    }[key] || 'back';
  }

  /* Keyboard: Escape closes, Tab is trapped inside an open overlay. */
  document.addEventListener('keydown', function (e) {
    var open = S.sheet || S.dialog;
    if (e.key === 'Escape' && open) {
      e.preventDefault();
      closeOverlay(S.sheet ? rowFor(S.sheet) : null);
      return;
    }
    if (e.key !== 'Tab' || !open) return;
    var f = overlay.querySelectorAll('button, input');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!overlay.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  });

  /* =============================================================
     Dev state toggle
     ============================================================= */
  var STATES = [
    ['signed-in', 'Signed in'],
    ['guest', 'Guest'],
    ['signed-out', 'Signed out'],
    ['loading', 'Loading'],
    ['error', 'Account unreachable']
  ];
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" data-testid="dev-state-' + s[0] + '">' +
             s[1] + '</button>';
  }).join(''));
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (!b) return;
    S.view = b.dataset.state;
    S.sheet = null; S.dialog = null; S.toast = null;
    S.sync = b.dataset.state === 'error' ? 'failed' : 'idle';
    clearTimeout(syncTimer);
    render();
  });

  /* After the first paint, because this does not decide what the screen looks
     like -- it only corrects what the screen says about itself. The version
     check runs off the back of it: the version IS the worker's cache name, so
     there is nothing to ask for until there is a worker to ask about. */
  checkServiceWorker();
  /* A worker registered after this screen has painted -- which is what the
     demo does, on window load -- is a worker this screen would otherwise
     never see. */
  window.addEventListener('load', function () { checkServiceWorker(); });
  if (navigator.serviceWorker && navigator.serviceWorker.addEventListener) {
    navigator.serviceWorker.addEventListener('controllerchange', function () { checkServiceWorker(); });
  }

  var q = new URLSearchParams(location.search);
  var want = q.get('state');
  if (want && STATES.some(function (s) { return s[0] === want; })) {
    S.view = want;
    if (want === 'error') S.sync = 'failed';
  }
  render();

  /* Another screen, or another tab, changing something this screen shows.
     LKUnits.onChange existed and no screen subscribed to it, so a unit
     changed anywhere else left every open screen reading the old one until
     a reload. The same for the store: a restore or an erase performed in a
     second tab has to reach this one. */
  if (window.LKUnits) {
    LKUnits.onChange(function (useKg) {
      var next = useKg ? 'kg' : 'lb';
      if (next === S.unit) return;
      S.unit = next;
      render();
    });
  }
  if (ST) {
    ST.onChange(function (value, key) {
      if (mine) return;                 /* this screen's own write */
      if (S.sheet || S.dialog) return;  /* not while a sheet is open */
      reseed();
      render();
    });
  }
})();

  /* The running workout, from a screen that is not it. Leaving the workout
     log used to lose the session outright: nothing was written down, and no
     screen but Home and Fuel had anywhere to say one was open. The record
     lives in session.js; this mounts its shelf and takes the tap back. */
  if (window.LKSession) {
    LKSession.mount(document.getElementById('shelf-slot'),
      typeof LKPatch === 'function' ? LKPatch : null);
    document.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-testid="shelf-resume"]') : null;
      if (el) { e.preventDefault(); LKGo('workout-log'); }
    });
  }
</script>
</body>
</html>
