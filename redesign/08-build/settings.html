<body>
<!--
  SETTINGS AND ACCOUNT — what survives, and why.

  WHY THIS SCREEN EXISTS
  Profile lost its tab. Its function audit found one load-bearing control
  out of two: the door to Settings. Home's header now carries that door
  (data-testid="open-account"), and this is what it opens. So this file
  holds both jobs — who you are and what your account is, and everything
  you can configure — and it is the only screen that holds either.

  WHAT THE AUDITS MEASURED, AND WHAT REPLACES IT
  The old Settings scored 1 on hierarchy and 2.2 on design, the worst in
  the app: a 3,894px scroller whose squint-test winner was SIGN UP inside
  a glowing orange card, on a settings screen. It carried 22 uppercase
  headers in one style at two ranks, so a group header and a card header
  were indistinguishable, and two header strings repeated — DATA & SYNC
  twice, 1,075px apart. Placement was unpredictable: text size under Data
  and Sync, cycle logging under a red Performance Tracking header, Home
  layout at the top while every other display preference sat 1,000px
  lower. 21 of 49 targets met 44px; with the layout editor open, 30 of 102.

  Here: FIVE groups, one header rank, one card per parent, in the order a
  person changes things.
    1  Account          who you are, and whether it syncs
    2  Units and display    the two things changed most often
    3  Training         what happens while you lift
    4  Reminders        when the app is allowed to speak
    5  Data and account one-time and destructive actions, at the bottom
  Was 49 controls; rebuilt as nineteen, and the rows the audit found missing
  have been added back one at a time since (three notification preferences,
  their send times, the cycle-log consent, the version check). Every row
  prints its current value in the secondary line, so the configuration reads
  without opening anything. Nothing here is one word deep in jargon:
  "Round weights to", not "plate increment"; "Everything on this device",
  not "local storage".

  DEPTH
  A toggle changes in place — depth 0. A choice opens one sheet of
  options over the screen — depth 1. Nothing on this screen is two levels
  deep. The old screen put the unit switch behind Profile, a scroll of
  ~2,100px, and the layout editor behind a second full-screen editor.

  THE THREE MEASURED DEFECTS, ANSWERED
  1  No busy state on a network action. The old Verify button was
     pixel-identical with a request in flight (0.0001% frame diff, no
     spinner, no aria-busy, still enabled). Here the one network action
     that survives — Sync — disables its button, sets aria-busy, swaps
     the label to "Syncing", shows a spinner, and announces the outcome
     in a live region. See syncNow().
  2  Fail-open validation. The old catch block called onResult(true): a
     network failure GRANTED beta access and rendered the verified panel.
     Here the failure path is the only path that can report failure, and
     it reports nothing else — see the comment on FAIL CLOSED in syncNow().
     Dev state "Account unreachable" runs it.
  3  A unit switch that relabels without converting. The old screen
     seeded body weight once at mount, so 64.25 kg became "64.25 lbs" and
     the next save wrote 29.1 kg. Here every weight is stored in kg and
     formatted on read (wt(), plate(), height()), so switching the unit
     converts 64.2 kg to 141.5 lb, 2.5 kg to 5 lb, and 168 cm to 5 ft 6
     in — in the row, in the sheet, and in the field. The switch also
     confirms itself with a toast naming both numbers, which is the
     confirmation flow 8 never had.

  WHAT DOES NOT SHIP, AND WHY
  - LayoutEditor (51-53 controls, 44 of them under 44px, and the source
    of most of this page's target failures). It let a user reorder Home
    from another tab. The Home audit concluded it existed to paper over a
    screen with no priority; Home has been rebuilt to four blocks with
    one primary action, so the thing it repaired is gone. Ordering Home
    is the designer's job, not a setting.
  - The beta code card. Beta enrolment is not a preference, it shipped to
    every user, it had no busy state, and it granted access when the
    network failed. Unfinished and wrong when it failed.
  - Replay Tutorial. The overlay it replays is cut by the directive, and
    the control carried an emoji as its icon.
  - Cycle logging and Microphone flags. A toggle that adds or removes a
    whole tab is build configuration wearing a preference's clothes; the
    voice button also intercepted pointer events on two other screens.
  - Text size. iOS ships Dynamic Type as a system setting. A second,
    app-only text size duplicates it, disagrees with it, and was filed
    under DATA & SYNC.
  - Fuel's Left/Eaten dashboard framing. "Show calorie numbers" is here,
    because Fuel reads it; the framing is not, because Fuel reads no framing
    key and a switch this screen wrote that Fuel ignored would be a control
    that does nothing. It belongs on Fuel.
  - "Sync All to Server Now", v6's beta admin force-push. See syncRow().
  - The beta admin export of the four beta collections. See the export row.
  - The privacy disclosure block. Legal text with a +/- affordance is not
    a control; it configures nothing.
  - The old App Style's five options. Appearance offers Dark, Light and
    Match device: three values, all of which change the screen. "Match
    device" was cut in the first pass only because tokens.css carried no
    prefers-color-scheme rule for it to read; the rule exists now, so the
    option is back. A control that does nothing is worse than one fewer
    control, but a device that ignores its own appearance setting is
    worse than both. The choice is stored in localStorage under lk_theme
    and applied by theme.js on every screen, so it survives a reload and
    Appearance is not a preference that only themes its own page.
  - Nothing in the Data group, any more. The storage row said "1.2 MB of
    5.0 MB" as a literal string, Export a backup toasted a filename and
    built no file, Restore had no file input behind it, and Erase
    everything on this phone erased nothing and reported success. The
    figure is measured from LKStore.dump() and carries a bar that turns
    amber at 80%, the export builds a real JSON file through <a download>
    and names the key count in it, Restore opens a real file picker and
    goes through LKStore.load(), and Erase calls LKStore.reset() and
    counts what went.
  - Save Name and Save Stats as bare buttons stranded in a list. An edit
    now commits inside the sheet that opened it, so no row can be left in
    an unsaved state you cannot see.
  - The guest SIGN UP card as a glowing hero. Creating an account is a
    real action and stays, as one plain button inside the Account card.

  WHAT SURVIVES A RELOAD
  Everything. This screen wrote four keys -- fuelNumbers, badges, cycle,
  perfTracking -- and held the other nineteen settings in a variable on
  the page, so the display name, every body stat, the reminder and its
  time, the check-in, partial reps, the rest timer, the plate rounding,
  the week start and the distance unit all reverted on reload and reached
  no other screen. Every row now reads and writes through LKStore under
  the shipped app's own key names, and the write happens on the action
  rather than on a Save button somewhere else.

  NOTIFICATIONS, HONESTLY
  The permission prompt is a real browser API and this asks for it,
  including the blocked state a page cannot undo. There are NINE
  preferences -- unfinished workout, compounds and restock were in v6 and
  were missing here -- and the three that are a time of day carry their own
  send time, where one global Reminder time used to stand in for all of
  them. A served build does register a service worker now (10-final/
  assemble.mjs writes demo/sw.js), so the test send goes through it where
  there is one; what is still missing is the half after that. A worker can
  only show a notification when something wakes it, and what wakes it is a
  push from a server. There is no push subscription and no sender here, so
  every switch is a preference being recorded and nothing is scheduled --
  which is what the card says, at the point of use, and what turning one on
  says back.

  STATES
  Signed in, Guest, Signed out, Loading, Account unreachable. Guest is
  read from lk_guestMode as well as set by the switcher. Only the
  Account group has a loading or an error state: preferences are read
  from the device, so they cannot fail, and pretending they can would
  hide a working screen behind a spinner.

  ADDED TO components.css FOR THIS SCREEN (tokens only, no new values)
  The switch, which no screen had used before: "on" takes --success, not
  --accent, and the off track gains a --border ring so it is still a
  visible control when the track itself is only 1.51:1 on the card.
  Plus .row--danger, .row--static, a ground for a quiet button on a
  dialog, and .toast--nonav for a pushed screen that sits above no tab
  bar.

  ACCENT
  At most one accent fill per state, never on a no-op: none when signed
  in (a settings screen has no primary action), Create an account when a
  guest, Sign in when signed out, Try again when the account is
  unreachable, none while loading. Switches carry --success when on,
  because "on" is a state and the accent marks the one action.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-settings">

      <header class="hdr" data-scroll-edge="#body">
        <button class="hdr__back" type="button" data-action="back" data-testid="back" aria-label="Back to Profile">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        </button>
        <div class="hdr__title">
          <h1 class="t-title">Settings</h1>
        </div>
      </header>

      <main class="body" id="body" data-testid="settings-scroll" tabindex="-1"></main>

      <!-- The live session, seen from here. Empty unless a workout is
           running; it sits between the content and the bottom of the
           screen rather than over it, so nothing it says costs a row. -->
      <div id="shelf-slot"></div>

      <div id="overlay" data-lk-lift></div>
      <div id="live" class="vis-hidden" role="status" aria-live="polite"></div>

  <div class="dev__menu" id="dev-menu" hidden data-testid="dev-menu"></div>
</div>

<script>
(function () {
  "use strict";

  /* =============================================================
     Icons. One set, one stroke weight, one optical size.
     ============================================================= */
  function svg(d, extra) {
    return '<svg class="ico' + (extra || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  }
  var ICO = {
    chev:  svg('<path d="m9 5 7 7-7 7"/>'),
    close: svg('<path d="m6 6 12 12M18 6 6 18"/>'),
    check: svg('<path d="m5 12.5 4.5 4.5L19 7"/>'),
    alert: svg('<path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/>'),
    person: svg('<path d="M4.5 20a7.5 7.5 0 0 1 15 0"/><circle cx="12" cy="7.5" r="3.5"/>'),
    cloud: svg('<path d="M7 18a4 4 0 0 1 .5-8 5 5 0 0 1 9.6 1.2A3.5 3.5 0 0 1 17 18z"/>')
  };

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function n(v) { return '<span class="num">' + v + '</span>'; }

  /* =============================================================
     State. Seeded from fixtures/seed-data.json.
       lk_profile      Cesco, @cesco, 29, female, 168 cm, 64.2 kg, build
       lk_restEnabled  true      lk_hidePartials  false
       lk_checkinPerDay 1        lk_cardioPrefs.distUnit "km"
       lk_weightStorageUnit "kg"
     Weight is STORED in kilograms and formatted on read. Nothing on this
     screen keeps a number in display units, which is the whole of
     defect 3.
     ============================================================= */
  /* THE DEFECT THIS ANSWERS. Almost nothing on this screen was written
     down. The toggle handler wrote four keys -- fuelNumbers, badges, cycle,
     perfTracking -- and every other control was a variable on this page: the
     display name, every body stat, the workout reminder and its time, the
     daily check-in, partial reps, the rest timer, the plate rounding, the
     week start and the distance unit all reverted on reload and reached no
     other screen, which is why workout-log.html hardcodes the two it needs.
     Everything is read and written through LKStore now, under the shipped
     app's own key names, so a setting changed here is the setting every
     other screen reads. */
  var ST = window.LKStore;
  function get(key, dflt) { return ST ? ST.get(key, dflt) : dflt; }
  /* A write from this screen notifies this page as well as the other tabs,
     and the listener at the bottom of this file re-reads the store on that
     notification. `mine` stops a row from redrawing itself twice for its own
     write, and stops a write made mid-edit from being read back over a sheet
     that is open. */
  var mine = 0;
  function put(key, v) {
    if (!ST) return;
    mine++;
    try { ST.set(key, v); } finally { mine--; }
  }
  function patchKey(key, o) {
    if (!ST) return;
    mine++;
    try { ST.patch(key, o); } finally { mine--; }
  }
  /* A switch is written as a real boolean here, but the shipped app wrote
     some of these keys as the strings "true" and "false" and store.js hands
     back whatever is there. Both readings are accepted; only the boolean is
     ever written. */
  function bool(key, dflt) {
    var v = get(key, dflt);
    return v === true || v === 'true';
  }

  /* HOW MANY CHECK-INS A DAY. lk_checkinPerDay is the key the coach pane
     reads, and it accepts exactly 1, 2 or 4 -- v6's three values. This screen
     used to offer Off / Morning / Evening / Morning and evening and write
     0/1/1/2, so two of the four choices wrote the same number, "four times a
     day" could not be asked for at all, and Off wrote a 0 the coach reads back
     as 1. The row now offers the three values the reader accepts and nothing
     else; whether the app SAYS anything about a check-in is the Daily check-in
     notification switch, which is a different question and has its own row.

     PER_DAY stays as the map from a choice to the stored count, so there is
     still one place that decides what is written. */
  var PER_DAY = { once: 1, twice: 2, four: 4 };
  function checkinFromCount(c) {
    var v = parseInt(c, 10);
    return v === 4 ? 'four' : v === 2 ? 'twice' : 'once';
  }

  /* THE NINE THINGS THE APP WOULD NOTIFY ABOUT. They are preferences, not
     schedules: see the note on the Reminders group.

     Three of them -- unfinished workout, compounds and restock -- were in v6
     and were missing here entirely, so somebody who wanted them had no row to
     turn off either.

     `time` names the state field holding that preference's OWN send time, for
     the three that are a time of day rather than an event. The build had one
     global Reminder time doing the job of all of them, so moving the workout
     reminder to 6:30 AM also moved the check-in. `when` is what the row says
     instead, for the ones whose moment is not a clock time -- the event that
     triggers them, or the screen that already holds their schedule. */
  var NOTIF = [
    { k: 'workout', title: 'Workout reminder',
      sub: 'On the days your split says you train', time: 'reminderAt' },
    { k: 'rest', title: 'Rest timer finished',
      sub: 'When the timer between sets runs out', when: 'The moment the timer runs out.' },
    { k: 'checkin', title: 'Daily check-in',
      sub: 'The question the coach asks', time: 'checkinAt' },
    { k: 'unfinished', title: 'Unfinished workout',
      sub: 'A workout you started and never finished',
      when: 'Two hours after the last set you logged.' },
    { k: 'streak', title: 'Streak at risk',
      sub: 'Late in the day, if you have not trained', when: 'At 8:00 PM.' },
    { k: 'goal', title: 'Goal deadline',
      sub: 'A week before a goal is due', when: 'On the morning it falls due.' },
    { k: 'supps', title: 'Supplements',
      sub: 'Creatine, vitamins and the rest',
      when: 'At the time of day each one is set to, under Fuel.' },
    { k: 'compounds', title: 'Compounds',
      sub: 'A dose due from a cycle you are running',
      when: 'At the time the cycle in Stack sets for it.', needs: 'perfTracking' },
    { k: 'restock', title: 'Restock',
      sub: 'When something in your pantry is nearly out', time: 'restockAt' }
  ];
  /* Every preference except the workout reminder, which lives in the shipped
     app's own lk_reminderOn -- writing it here as well would be two stored
     copies of one answer. Compounds is the one that starts off: Stack
     tracking is off by default, so there is nothing for it to be about until
     somebody turns that on. */
  function defaultNotif() {
    var o = {};
    NOTIF.forEach(function (r) {
      if (r.k === 'workout') return;
      o[r.k] = r.k !== 'compounds';
    });
    return o;
  }
  function notifSpec(k) {
    var hit = null;
    NOTIF.forEach(function (r) { if (r.k === k) hit = r; });
    return hit;
  }
  /* ONE RESOLVER PER PREFERENCE. The workout reminder is the shipped app's
     lk_reminderOn / lk_reminderAt and has been since v6; the other eight live
     in lk_notifPrefs and lk_notifTimes. A screen that kept its own second copy
     of "is the workout reminder on" is how the old build ended up with a
     switch in one card and a duplicate of it in another. */
  function notifOn(k) { return k === 'workout' ? !!S.reminder : !!S.notif[k]; }
  function notifSet(k, v) {
    if (k === 'workout') { S.reminder = v; persist('reminder'); return; }
    S.notif[k] = v;
    put('lk_notifPrefs', S.notif);
  }

  /* One reader, called at boot and again whenever something outside these
     rows rewrites the store -- a restore, or an erase. The dev switcher does
     NOT come through here: it is showing a state, not reading one back over
     the state it is showing. */
  function freshState() {
  var PROF = get('lk_profile', {}) || {};
  return {
    /* The account state, from lk_guestMode rather than from the dev
       switcher alone. It was read nowhere in the build. */
    view: String(get('lk_guestMode', '0')) === '1' ? 'guest' : 'signed-in',
    /* lk_profile.displayName is what Save Name writes; name is the seed's
       own name until somebody changes it. */
    /* Whatever the profile holds, and nothing when it holds nothing. These
       fell back to the seeded persona, so an account that had never entered
       a name was shown somebody else's. */
    name: PROF.displayName || PROF.name || '',
    username: PROF.username || '',
    email: PROF.email || '',
    /* lk_profile.useKg, through LKUnits. This screen converted its own rows
       correctly and stored nothing, so the choice reached no other screen and
       did not survive a reload. */
    unit: (window.LKUnits && !LKUnits.useKg()) ? 'lb' : 'kg',
    dist: (get('lk_cardioPrefs', {}) || {}).distUnit === 'mi' ? 'mi' : 'km',
    weekStart: get('lk_weekStart', 'mon') === 'sun' ? 'sun' : 'mon',
    theme: (window.LKTheme ? window.LKTheme.get() : 'dark'),
    /* Named by Fuel's hidden state and Profile's own source comment, and
       until now existing on neither screen. */
    fuelNumbers: bool('lk_fuelNumbers', true),
    badges: bool('lk_badges', false),
    cycle: bool('lk_cycle', false),
    perfTracking: bool('lk_perfTracking', false),
    restTimer: bool('lk_restEnabled', true),
    restSec: Number(get('lk_restSec', 90)) || 90,
    /* The stored key is the negative one the app ships: hiding partials is
       what it records, counting them is what the row offers. */
    partials: !bool('lk_hidePartials', false),
    /* The short exercise list. On unless it has been turned off: 866 lifts
       is a reference, and picking one mid-session wants a menu. */
    shortLib: bool('lk_libraryShort', true),
    plateKg: Number(get('lk_plateKg', 2.5)) || 2.5,
    reminder: bool('lk_reminderOn', true),
    /* THREE SEND TIMES, NOT ONE. lk_reminderAt is the shipped key and stays
       the workout reminder's own time; the two other timed preferences keep
       theirs in lk_notifTimes, one key holding one object rather than a new
       top-level key per notification. */
    reminderAt: get('lk_reminderAt', '18:30'),
    checkinAt: (get('lk_notifTimes', null) || {}).checkin || '08:00',
    restockAt: (get('lk_notifTimes', null) || {}).restock || '09:00',
    checkin: checkinFromCount(get('lk_checkinPerDay', 1)),
    /* The cycle log's own consent, read from the key cloud.js reads before it
       will carry lk_mcProfile, lk_mcDays or lk_mcFuelAdjust in either
       direction. The Cycle screen writes the same field; this is a second
       surface on one key, not a second copy of the fact. */
    cycleBackup: !!((get('lk_mcProfile', null) || {}).cloudBackup),
    notif: (function () {
      var d = defaultNotif(), st = get('lk_notifPrefs', null) || {};
      Object.keys(st).forEach(function (k) { if (d[k] !== undefined) d[k] = !!st[k]; });
      return d;
    })(),
    notifOn: bool('lk_notifOn', false),
    restSound: get('lk_restSound', 'beep'),
    /* NOTHING, WHEN NOTHING IS SET. These fell back to 29, female, 168 cm and
       64.2 kg -- the seeded persona's body -- so an account that had never
       opened the sheet was shown somebody else's stats as its own, and the
       same numbers reached the calorie maths through lk_profile. A missing
       figure is missing. */
    body: {
      age: Number(PROF.age) > 0 ? Number(PROF.age) : null,
      sex: PROF.sex === 'male' ? 'male' : PROF.sex === 'female' ? 'female' : null,
      heightCm: Number(PROF.heightCm) > 0 ? Number(PROF.heightCm) : null,
      weightKg: Number(PROF.weightKg) > 0 ? Number(PROF.weightKg) : null,
      goal: ({ cut: 1, maintain: 1, build: 1 })[PROF.goal] ? PROF.goal : null
    },
    /* The deploy the browser is running, and whether a newer one is waiting.
       Filled in by checkVersion() after the page paints -- a version that has
       not been checked yet is not a version that is up to date. */
    version: null,
    versionState: 'unknown',   /* unknown | checking | current | stale | absent */
    newVersion: null,
    swState: 'unknown',        /* unknown | none | unsupported | insecure | active */
    sync: 'idle',          /* idle | busy | ok | failed */
    /* A real timestamp or nothing at all. It was the literal string
       "2 minutes ago" on a build that has never synced anything. */
    syncedAt: get('lk_lastSync', null),
    bodyError: null,
    pwError: null,
    pwDone: false,
    restoreError: null,
    /* replace | merge. Asked before the file picker opens, because a restore
       that has already read the file has already decided. */
    restoreMode: 'replace',
    sheet: null,
    dialog: null,
    toast: null
  };
  }
  var S = freshState();
  function reseed() {
    var f = freshState();
    Object.keys(f).forEach(function (k) {
      if (k === 'sheet' || k === 'dialog' || k === 'toast' || k === 'restoreMode') return;
      /* What the version check found is not in the store, so re-reading the
         store must not throw it away. */
      if (k === 'version' || k === 'versionState' || k === 'newVersion' || k === 'swState') return;
      S[k] = f[k];
    });
  }

  /* =============================================================
     Persistence. One place writes, so a row and the key behind it
     cannot drift. Every one of these keys is the shipped app's own.
     ============================================================= */
  /* Which of these the server's schedule is made of. Anything on this
     list moving has to reach the server, or the times shown here and the
     times reminders arrive at drift apart with nothing saying so. */
  var SCHEDULED = { restTimer: 1, reminder: 1, reminderAt: 1, checkin: 1,
                    checkinAt: 1, notifTimes: 1, notifOn: 1 };

  function persist(k) {
    if (SCHEDULED[k]) setTimeout(syncPushPrefs, 0);
    if (k === 'unit') { if (window.LKUnits) LKUnits.set(S.unit === 'kg'); return; }
    if (k === 'theme') { if (window.LKTheme) LKTheme.set(S.theme); return; }
    if (k === 'dist') {
      /* Merged into lk_cardioPrefs rather than written over it: the same key
         holds the weekly target, the resting heart rate and the zone model,
         and replacing it would quietly erase all three. */
      patchKey('lk_cardioPrefs', { distUnit: S.dist });
      return;
    }
    if (k === 'weekStart') { put('lk_weekStart', S.weekStart); return; }
    if (k === 'restTimer') { put('lk_restEnabled', S.restTimer); return; }
    if (k === 'restSec') { put('lk_restSec', S.restSec); return; }
    if (k === 'partials') { put('lk_hidePartials', !S.partials); return; }
    if (k === 'shortLib') { put('lk_libraryShort', S.shortLib); return; }
    if (k === 'plateKg') { put('lk_plateKg', S.plateKg); return; }
    if (k === 'reminder') { put('lk_reminderOn', S.reminder); return; }
    if (k === 'reminderAt') { put('lk_reminderAt', S.reminderAt); return; }
    if (k === 'checkinAt') { patchKey('lk_notifTimes', { checkin: S.checkinAt }); return; }
    if (k === 'restockAt') { patchKey('lk_notifTimes', { restock: S.restockAt }); return; }
    if (k === 'checkin') {
      /* One key, holding 1, 2 or 4 -- the only three values coach.html's
         checkinPerDay() accepts. lk_checkin, a second string saying the same
         thing in different words, is no longer written: two keys for one fact
         is how they come to disagree. */
      put('lk_checkinPerDay', PER_DAY[S.checkin]);
      return;
    }
    /* THE CYCLE LOG'S CONSENT, on the key cloud.js gates the sync with. It is
       a field inside lk_mcProfile rather than a key of its own, because the
       profile is what the Cycle screen writes and a second key would have to
       be kept in step with it forever. */
    if (k === 'cycleBackup') { patchKey('lk_mcProfile', { cloudBackup: S.cycleBackup }); return; }
    if (k === 'fuelNumbers' || k === 'badges' || k === 'cycle' || k === 'perfTracking') {
      put('lk_' + k, S[k]);
      return;
    }
  }

  /* =============================================================
     How much of this phone the app is using. The row read
     "1.2 MB of 5.0 MB" as a literal string on a build whose whole
     store is a few tens of kilobytes. It is measured now, from the
     same dump the backup writes, and it says how it was measured.
     ============================================================= */
  var QUOTA = 5 * 1024 * 1024;
  function storageBytes() {
    if (!ST) return 0;
    var d = ST.dump(), total = 0;
    Object.keys(d).forEach(function (k) {
      total += byteLen(k) + byteLen(String(d[k] === null || d[k] === undefined ? '' : d[k]));
    });
    return total;
  }
  function byteLen(str) {
    try { return new Blob([str]).size; }
    catch (e) { return str.length; }      /* no Blob: characters, near enough */
  }
  function storedKeys() {
    return ST ? Object.keys(ST.dump()).length : 0;
  }
  function bytesLabel(b) {
    if (b < 1024) return b + ' bytes';
    if (b < 1024 * 1024) return round1(b / 1024) + ' KB';
    return round1(b / (1024 * 1024)) + ' MB';
  }

  /* =============================================================
     Backup. "Export a backup" toasted a filename and built no file;
     "Restore from a backup" had no file input behind it at all, and
     its confirmation ended by saying nothing had been replaced.
     Both do the thing now, with LKStore.dump() and LKStore.load().
     ============================================================= */
  function todayStamp() {
    var t = window.LKStore ? LKStore.today() : '';
    return /^\d{4}-\d{2}-\d{2}$/.test(t) ? t : new Date().toISOString().slice(0, 10);
  }
  function exportBackup() {
    if (!ST) { toast('This phone will not let the app store anything, so there is nothing to back up.'); return; }
    var dump = ST.dump();
    var keys = Object.keys(dump).length;
    if (!keys) { toast('Nothing to back up yet. Log something first.'); return; }
    var name = 'LOCKED-backup-' + todayStamp() + '.json';
    /* EVERYTHING THE APP IS SHOWING, plus the two things a restore needs to
       be able to decide anything: when each key last changed, and which
       schema wrote it. Without the stamps a merge has no way to tell an old
       backup from a new one and can only overwrite, which is how a restore
       quietly loses a week of training. */
    var text = JSON.stringify({
      app: 'LOCKED', exported: todayStamp(), keys: keys,
      schema: ST.schemaVersion ? ST.schemaVersion() : 0,
      stamps: ST.changedAt ? ST.changedAt() : {},
      data: dump
    }, null, 2);
    var url;
    try {
      url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    } catch (e) {
      toast('This browser would not build the file. Nothing was exported.');
      return;
    }
    var a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    a.setAttribute('data-testid', 'backup-link');
    a.style.position = 'absolute'; a.style.left = '-9999px';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      document.body.removeChild(a);
      try { URL.revokeObjectURL(url); } catch (e) {}
    }, 0);
    toast(name + ' saved. ' + keys + (keys === 1 ? ' key' : ' keys') + ', ' + bytesLabel(byteLen(text)) + '.');
  }

  /* The file input lives in the page rather than in the dialog, because the
     dialog closes the moment the picker opens and a detached input never
     fires its change event. */
  function restoreInput() {
    var el = document.getElementById('restore-file');
    if (el) return el;
    el = document.createElement('input');
    el.type = 'file';
    el.accept = 'application/json,.json';
    el.id = 'restore-file';
    el.setAttribute('data-testid', 'restore-file');
    el.setAttribute('aria-label', 'Choose a backup file');
    el.className = 'vis-hidden';
    el.addEventListener('change', function () {
      var f = el.files && el.files[0];
      el.value = '';
      if (!f) return;
      var r = new FileReader();
      r.onerror = function () { toast('That file could not be read. Nothing was replaced.'); };
      r.onload = function () { restoreFrom(String(r.result), f.name); };
      r.readAsText(f);
    });
    document.body.appendChild(el);
    return el;
  }
  function restoreFrom(text, filename) {
    var parsed;
    try { parsed = JSON.parse(text); }
    catch (e) { toast('That is not a LOCKED backup. Nothing was replaced.'); return; }
    var data = parsed && parsed.data ? parsed.data : parsed;
    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      toast('That is not a LOCKED backup. Nothing was replaced.');
      return;
    }
    var mine = Object.keys(data).filter(function (k) { return k.indexOf('lk_') === 0; });
    if (!mine.length) {
      toast('No LOCKED data in ' + filename + '. Nothing was replaced.');
      return;
    }
    /* TWO WAYS TO RESTORE, AND THE READER PICKS. Replace was the only one
       there was, so restoring a two-week-old backup to get one lost split
       back also threw away two weeks of training, with no warning and no way
       to tell it had happened.

       Merge keeps whichever copy of each key is newer, by the same stamps
       cloud.js merges on -- one rule for a restore and a sync, not two. A
       backup written before this build carries no stamps; then the honest
       merge is to add only the keys this phone has never written, and the
       toast says that is what happened. */
    var mode = S.restoreMode === 'merge' ? 'merge' : 'replace';
    var stamps = parsed && parsed.stamps && typeof parsed.stamps === 'object' ? parsed.stamps : null;
    var ours = ST && ST.changedAt ? ST.changedAt() : {};
    var subset = {}, skipped = 0;
    mine.forEach(function (k) {
      if (mode === 'replace') { subset[k] = data[k]; return; }
      if (ST && !ST.touched(k)) { subset[k] = data[k]; return; }
      var theirs = stamps ? Number(stamps[k] || 0) : 0;
      if (theirs && theirs > Number(ours[k] || 0)) { subset[k] = data[k]; return; }
      skipped++;
    });
    var n = ST ? ST.load(subset) : 0;
    reload();
    toast(mode === 'replace'
      ? n + (n === 1 ? ' key' : ' keys') + ' restored from ' + filename + '. ' +
        'What was on this phone was replaced.'
      : n + (n === 1 ? ' key' : ' keys') + ' merged from ' + filename + ', ' + skipped +
        ' kept from this phone' +
        (stamps ? ' because they had changed more recently.'
                : '. That file carries no change dates, so nothing already written here was touched.'));
  }

  /* Back to what the store holds, after something outside these rows has
     rewritten it -- a restore, or an erase. The dev switcher does NOT go
     through here: it is showing a state, not reading one. */
  function reload() { reseed(); render(); }

  /* =============================================================
     Notifications. The permission prompt is real; the scheduling
     half is not, and the screen says so where it would matter.
     ============================================================= */
  function notifSupported() { return typeof window.Notification === 'function'; }
  /* Whether reminders can actually arrive, as opposed to whether the
     browser will show one this second. Three things have to be true and
     the switches say which one is missing. */
  function pushReady() {
    var C = window.LKCloud;
    return !!(C && C.ready() && C.reminders && C.reminders.supported());
  }
  /* Every switch on this screen, in the shape the server's schedule uses. */
  function pushPrefs() {
    var t = S.notifTimes || {};
    return {
      rest: !!S.restTimer,
      training: !!S.reminder,
      trainingTime: t.workout || S.reminderAt || '07:30',
      checkin: !!S.checkin,
      checkinTime: t.checkin || '08:00',
      idle: !!S.notifOn
    };
  }
  /* Sent whenever one of them moves, so the schedule on the server is
     never a version of what this screen shows. */
  function syncPushPrefs() {
    if (!pushReady() || !S.notifOn) return;
    try { window.LKCloud.reminders.prefs(pushPrefs()); } catch (e) {}
  }
  function notifPermission() {
    try { return notifSupported() ? Notification.permission : 'unsupported'; }
    catch (e) { return 'unsupported'; }
  }
  function askPermission() {
    if (!notifSupported()) { toast('This browser has no notifications to ask for.'); return; }
    if (notifPermission() === 'denied') {
      toast('Notifications are blocked for this app in your browser settings. Only you can undo that.');
      return;
    }
    if (notifPermission() === 'granted') {
      /* Granted is the browser's answer and cannot be taken back from here.
         The app-level switch is ours, and that is what this flips. */
      S.notifOn = !S.notifOn;
      put('lk_notifOn', S.notifOn);
      render();
      say('Notifications ' + (S.notifOn ? 'on' : 'off'));
      /* The switch is not the subscription. Turning it on registers this
         phone with the server that sends the reminders, and turning it
         off removes it -- otherwise the app would keep sending to a
         person who told it to stop. */
      if (pushReady()) {
        if (S.notifOn) {
          window.LKCloud.reminders.subscribe().then(function (r) {
            if (r && r.ok) { syncPushPrefs(); toast('Reminders are set up on this phone.'); }
            else { S.pushLost = true; render(); toast(r && r.message || 'Reminders could not be set up.'); }
          });
        } else {
          window.LKCloud.reminders.unsubscribe();
        }
      }
      return;
    }
    var res;
    try { res = Notification.requestPermission(); } catch (e) { res = null; }
    var done = function (perm) {
      S.notifOn = perm === 'granted';
      put('lk_notifOn', S.notifOn);
      render();
      if (perm === 'granted' && pushReady()) {
        window.LKCloud.reminders.subscribe().then(function (r) {
          if (r && r.ok) { syncPushPrefs(); toast('Allowed, and this phone is registered for reminders.'); }
          else { toast(r && r.message || 'Allowed, but reminders could not be set up.'); }
        });
        return;
      }
      toast(perm === 'granted'
        ? (pushReady() ? 'Allowed.'
                       : 'Allowed. Nothing is scheduled in this build: see the note under the switches.')
        : 'Not allowed. Nothing will be sent.');
    };
    if (res && typeof res.then === 'function') res.then(done, function () { done('denied'); });
    else done(notifPermission());
  }
  function testNotification() {
    if (notifPermission() !== 'granted') { toast('Allow notifications first.'); return; }
    /* Through the service worker where there is one, because that is the only
       path some browsers allow at all -- and because it is the path a real
       reminder would take, so a test that works here tests the right thing.
       What it does NOT do is schedule anything: this fires now, from this tap. */
    if (S.swState === 'active' && navigator.serviceWorker) {
      navigator.serviceWorker.ready.then(function (reg) {
        return reg.showNotification('LOCKED', {
          body: 'This is what one looks like. Sent now, by this tap — nothing is scheduled.',
          tag: 'lk-test'
        });
      }).then(function () {
        toast(pushReady()
          ? 'Sent by the service worker, now. The scheduled ones come from the server at ' +
            'the times above.'
          : 'Sent by the service worker, now. A reminder that arrives later needs a push ' +
            'subscription and a server, and this build has neither.');
      }, function () {
        toast('Your browser would not show it. Nothing was sent.');
      });
      return;
    }
    try {
      new Notification('LOCKED', { body: 'This is what one looks like. Sent from this phone, by this page.' });
      toast(pushReady()
        ? 'Sent from this page, now. The scheduled ones come from the server.'
        : 'Sent from this page, now. Nothing is scheduled: a reminder that arrives later ' +
          'needs a push subscription and a server.');
    } catch (e) {
      /* Chrome refuses a page-constructed Notification on some origins and
         tells you to use a service worker. That is the truth about this
         build too, so it is what the row says. */
      toast('Your browser will only send one from a service worker, and none is running here.');
    }
  }
  /* A sound the page makes itself, rather than a file it does not ship.
     Each one is a different shape so the preview is worth pressing. */
  var SOUNDS = [
    ['beep', 'Beep', [880]],
    ['chime', 'Chime', [660, 990]],
    ['thud', 'Thud', [160]],
    ['none', 'Silent', []]
  ];
  function playSound(id) {
    var spec = null;
    SOUNDS.forEach(function (r) { if (r[0] === id) spec = r[2]; });
    if (!spec || !spec.length) return;
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    try {
      var ctx = new Ctx();
      spec.forEach(function (hz, i) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        var t0 = ctx.currentTime + i * 0.14;
        o.frequency.value = hz;
        o.type = id === 'thud' ? 'sine' : 'triangle';
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.13);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0); o.stop(t0 + 0.15);
      });
      setTimeout(function () { try { ctx.close(); } catch (e) {} }, 600);
    } catch (e) {}
  }

  /* =============================================================
     A nutrition export: THE LOG, not the catalogue.

     The row says "A CSV of every meal", and the file held the eight rows of
     the built-in food table -- the list of foods that exist, not the list of
     meals anybody ate -- with no date column at all, while lk_fuelLog sat
     there holding four days of actual meals. Exporting a menu under the word
     "meal" is the kind of wrong nobody catches until they open the file
     looking for a week they remember eating.
     ============================================================= */
  function nutritionCSV() {
    var nut = get('lk_nutrition', null) || {};
    var log = get('lk_fuelLog', null) || nut.days || {};
    var dates = Object.keys(log).sort();
    var rows = [['date', 'slot', 'food', 'kcal', 'protein_g', 'carbs_g', 'fat_g',
                 'fibre_g', 'sugar_g', 'sat_fat_g', 'sodium_mg', 'source']];
    var meals = 0;
    dates.forEach(function (iso) {
      var d = log[iso] || {};
      (d.meals || []).forEach(function (m) {
        meals++;
        rows.push([iso, m.slot || '', m.name, m.kcal, m.pro, m.carb, m.fat,
                   m.fibre === undefined ? '' : m.fibre,
                   m.sugar === undefined ? '' : m.sugar,
                   m.satfat === undefined ? '' : m.satfat,
                   m.sodium === undefined ? '' : m.sodium,
                   m.src || '']);
      });
      /* The day's own totals on their own line, so a spreadsheet does not
         have to trust that the rows above add up. */
      if ((d.meals || []).length) {
        rows.push([iso, 'DAY TOTAL', '', d.eaten || '', d.pro || '', d.carb || '', d.fat || '',
                   '', '', '', '', '']);
      }
    });
    var wlog0 = (get('lk_weightLog', []) || []).filter(function (w) { return w && w.kg; });
    if (!meals && !wlog0.length) {
      toast('No meals and no weigh-ins on this phone yet, so there is nothing to export.');
      return;
    }
    var t = get('lk_fuelTargets', null) || nut.targets || {};
    if (t.kcal) rows.push(['', 'DAILY TARGET', '', t.kcal, t.pro, t.carb, t.fat, '', '', '', '', '']);
    /* THE WEIGH-INS, IN THE SAME FILE. A nutrition export with no body weight
       in it cannot answer the only question anybody exports one to ask --
       what the eating did. Written as its own table under a blank line, in
       kilograms, because kilograms is what is stored; a spreadsheet can
       convert, and a relabelled number cannot be undone. */
    var wlog = wlog0;
    var bf = (get('lk_bfLog', []) || []).filter(function (w) { return w && (w.pct || w.bf); });
    if (wlog.length || bf.length) {
      rows.push([]);
      rows.push(['date', 'measure', 'value', 'unit', '', '', '', '', '', '', '', '']);
      wlog.forEach(function (w) {
        rows.push([w.date || w.iso || '', 'body weight', round1(Number(w.kg)), 'kg', '', '', '', '', '', '', '', '']);
      });
      bf.forEach(function (w) {
        rows.push([w.date || w.iso || '', 'body fat', Number(w.pct || w.bf), '%', '', '', '', '', '', '', '', '']);
      });
    }
    var csv = rows.map(function (r) {
      return r.map(function (c) {
        var v = c === undefined || c === null ? '' : String(c);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(',');
    }).join('\r\n');
    var name = 'LOCKED-nutrition-' + todayStamp() + '.csv';
    var url;
    try { url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); }
    catch (e) { toast('This browser would not build the file. Nothing was exported.'); return; }
    var a = document.createElement('a');
    a.href = url; a.download = name; a.setAttribute('data-testid', 'csv-link');
    a.style.position = 'absolute'; a.style.left = '-9999px';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { document.body.removeChild(a); try { URL.revokeObjectURL(url); } catch (e) {} }, 0);
    toast(name + ' saved. ' + meals + (meals === 1 ? ' meal' : ' meals') +
      ' across ' + dates.length + (dates.length === 1 ? ' day' : ' days') +
      (wlog.length ? ', and ' + wlog.length + (wlog.length === 1 ? ' weigh-in.' : ' weigh-ins.') : '.'));
  }

  /* =============================================================
     Force refresh. Clears whatever the browser cached for this app
     and loads the page again. It touches no stored data, and the
     row says so, because "refresh" next to "erase" needs to.
     ============================================================= */
  function forceRefresh() {
    /* The version we are about to start running is the one the check found,
       so it is recorded before the reload rather than after -- a refresh that
       cleared the cache and then still claimed a new build was waiting is the
       banner that never goes away. */
    if (S.newVersion) { put('lk_deployVersion', S.newVersion); S.newVersion = null; }
    var done = function () { location.reload(); };
    if (window.caches && caches.keys) {
      caches.keys().then(function (names) {
        return Promise.all(names.map(function (k) { return caches['delete'](k); }));
      }).then(done, done);
    } else done();
  }

  /* =============================================================
     WHICH BUILD IS RUNNING, AND WHETHER A NEWER ONE IS PUBLISHED.

     There was no version check at all: Force refresh was the whole of it,
     so a person had to guess that the app was stale and then know to press
     a button under "Data and account" to find out.

     The version is the service worker's own cache name. assemble.mjs writes
     `var CACHE = 'locked-<byte length of the build>'` into sw.js, so the file
     a deploy publishes beside the app already carries a version string that
     changes on every rebuild and cannot be forgotten about. Fetching it with
     cache: 'no-store' asks the host, not the cache, which is what makes the
     answer worth having. No endpoint, no server code: a static host is
     enough, which is what this app deploys to.

     Nothing here reloads by itself. A build swapped under somebody mid-set
     loses the set; the check says a new one is ready and the reader decides.
     ============================================================= */
  function versionFromText(txt) {
    var m = /locked-(\w+)/.exec(String(txt || ''));
    return m ? m[1] : null;
  }
  /* The worker's OWN script URL, taken from its registration rather than
     guessed at. Fetching a path this page assumed was there is how a check
     ends up reporting a 404 as a build. */
  var SW_URL = null;
  function checkVersion() {
    if (!SW_URL) { S.versionState = 'absent'; render(); return; }
    S.versionState = 'checking';
    render();
    fetch(SW_URL, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('no version file');
      return r.text();
    }).then(function (txt) {
      var v = versionFromText(txt);
      if (!v) throw new Error('no version in it');
      S.version = v;
      var known = get('lk_deployVersion', null);
      if (!known) {
        /* First look. There is nothing to compare against, so this is what
           is running, not a new build. */
        put('lk_deployVersion', v);
        S.versionState = 'current';
      } else if (String(known) !== String(v)) {
        S.newVersion = v;
        S.versionState = 'stale';
        say('A new version of LOCKED is ready.');
      } else {
        S.newVersion = null;
        S.versionState = 'current';
      }
      render();
    }, function () {
      S.versionState = 'absent';
      render();
    });
  }

  /* Whether a worker is actually running here. The card under Reminders says
     what it can and cannot do, and that sentence has to be about this page,
     not about what a build was like when somebody wrote the comment. */
  function checkServiceWorker() {
    if (!('serviceWorker' in navigator)) { S.swState = 'unsupported'; render(); return; }
    if (location.protocol === 'file:') { S.swState = 'insecure'; render(); return; }
    navigator.serviceWorker.getRegistration().then(function (reg) {
      var w = reg && (reg.active || reg.installing || reg.waiting);
      S.swState = w ? 'active' : 'none';
      SW_URL = w ? w.scriptURL : null;
      render();
      if (!reg) { checkVersion(); return; }
      checkVersion();
      /* A worker that installs while this page is open is a new build
         arriving, and it is the same news the version fetch carries. */
      reg.addEventListener('updatefound', function () { checkVersion(); });
      try { reg.update(); } catch (e) {}
    }, function () { S.swState = 'none'; render(); });
  }

  /* =============================================================
     Formatting. One place converts, so a label can never disagree
     with the number beside it.
     ============================================================= */
  var LB = 2.20462;
  function round1(v) { return Math.round(v * 10) / 10; }
  function wt(kgv) {
    return S.unit === 'kg'
      ? n(round1(kgv)) + ' kg'
      : n(round1(kgv * LB)) + ' lb';
  }
  /* Plate steps are real hardware, not a conversion of one: a gym with
     kilo plates jumps 2.5 kg, a gym with pound plates jumps 5 lb. The
     pairs below are the equivalents actually racked, so switching the
     unit picks the matching step rather than printing 5.5 lb. */
  var PLATES = [[1.25, 2.5], [2.5, 5], [5, 10]];
  function plate(kgv) {
    if (S.unit === 'kg') return n(kgv) + ' kg';
    for (var i = 0; i < PLATES.length; i++) if (PLATES[i][0] === kgv) return n(PLATES[i][1]) + ' lb';
    return n(round1(kgv * LB)) + ' lb';
  }
  function height(cm) {
    if (S.unit === 'kg') return n(cm) + ' cm';
    var inches = Math.round(cm / 2.54);
    return n(Math.floor(inches / 12)) + ' ft ' + n(inches % 12) + ' in';
  }
  /* A rest length reads in the unit a lifter counts in: seconds up to two
     minutes, minutes after that. "1.5 minutes" is nobody's rest timer. */
  function secs(v) {
    return v < 120 ? n(v) + ' seconds' : n(v / 60) + ' minutes';
  }
  function clock(hhmm) {
    var p = hhmm.split(':'), h = Number(p[0]), suffix = h < 12 ? 'AM' : 'PM';
    var h12 = h % 12 === 0 ? 12 : h % 12;
    return n(h12 + ':' + p[1]) + ' ' + suffix;
  }
  var SEX = { female: 'Female', male: 'Male' };
  var GOAL = { cut: 'Lose fat', maintain: 'Maintain', build: 'Build muscle' };
  var CHECKIN = { once: 'Once a day', twice: 'Twice a day', four: 'Four times a day' };

  /* Only what is actually set. The line used to print five figures whatever
     the profile held, because every one of them had the seed's value as its
     fallback. */
  function bodyLine() {
    var b = S.body, parts = [];
    if (b.age) parts.push(n(b.age));
    if (b.sex) parts.push(SEX[b.sex]);
    if (b.heightCm) parts.push(height(b.heightCm));
    if (b.weightKg) parts.push(wt(b.weightKg));
    if (b.goal) parts.push(GOAL[b.goal]);
    return parts.length ? parts.join(' &middot; ') : 'Nothing set yet. Tap to add it.';
  }

  /* =============================================================
     Choice sheets. Every one of them is a list of options with the
     current value marked, opened from the row that shows that value.
     One level deep, and one implementation.
     ============================================================= */
  /* The same list of hours for every send time, so three sheets do not drift
     into three different sets of times. */
  var TIMES = ['06:30', '08:00', '09:00', '12:00', '17:00', '18:30', '20:00', '21:30'];
  function timeOptions() {
    return TIMES.map(function (v) {
      return { v: v, title: clock(v).replace(/<[^>]+>/g, ''), sub: '' };
    });
  }

  function opts() {
    return {
      unit: {
        title: 'Weight unit',
        options: [
          { v: 'kg', title: 'Kilograms', sub: 'Weights and body weight show as kg' },
          { v: 'lb', title: 'Pounds', sub: 'Weights and body weight show as lb' }
        ]
      },
      dist: {
        title: 'Distance',
        options: [
          { v: 'km', title: 'Kilometres', sub: 'Runs, rides and walks show as km' },
          { v: 'mi', title: 'Miles', sub: 'Runs, rides and walks show as mi' }
        ]
      },
      weekStart: {
        title: 'Week starts on',
        options: [
          { v: 'mon', title: 'Monday', sub: 'Your week on Home runs Monday to Sunday' },
          { v: 'sun', title: 'Sunday', sub: 'Your week on Home runs Sunday to Saturday' }
        ]
      },
      theme: {
        title: 'Appearance',
        options: [
          { v: 'dark', title: 'Dark', sub: 'Built for a gym floor and a phone at arm’s length' },
          { v: 'light', title: 'Light', sub: 'Higher brightness, for outdoors' },
          { v: 'system', title: 'Match device', sub: 'Follows your phone’s appearance setting' }
        ]
      },
      restSec: {
        title: 'Rest between sets',
        options: [60, 90, 120, 180].map(function (v) {
          return { v: v, title: secs(v).replace(/<[^>]+>/g, ''), sub: '' };
        })
      },
      plateKg: {
        title: 'Round weights to',
        options: PLATES.map(function (p) {
          return {
            v: p[0],
            title: (S.unit === 'kg' ? p[0] + ' kg' : p[1] + ' lb'),
            sub: S.unit === 'kg' ? 'Smallest pair of plates you have' : 'Smallest pair of plates you have'
          };
        })
      },
      reminderAt: {
        title: 'Workout reminder time',
        options: timeOptions()
      },
      checkinAt: {
        title: 'Check-in time',
        options: timeOptions()
      },
      restockAt: {
        title: 'Restock time',
        options: timeOptions()
      },
      checkin: {
        title: 'Check-ins a day',
        options: [
          { v: 'once', title: 'Once a day', sub: 'One reading, whenever you open it' },
          { v: 'twice', title: 'Twice a day', sub: 'Morning and evening' },
          { v: 'four', title: 'Four times a day', sub: 'For a week you want tracked closely' }
        ]
      }
    };
  }

  /* =============================================================
     Row builders
     ============================================================= */
  function navRow(key, title, value, testid) {
    return '<button class="row" data-action="sheet" data-key="' + key + '" data-testid="' + testid + '">' +
             '<span class="row__main">' +
               '<span class="row__title">' + title + '</span>' +
               '<span class="row__sub">' + value + '</span>' +
             '</span>' +
             '<span class="row__chev">' + ICO.chev + '</span>' +
           '</button>';
  }
  function switchRow(key, title, sub, on, testid) {
    return '<div class="row">' +
             '<span class="row__main">' +
               '<span class="row__title" id="lbl-' + key + '">' + title + '</span>' +
               '<span class="row__sub">' + sub + '</span>' +
             '</span>' +
             '<button class="switch" role="switch" aria-checked="' + on + '" aria-labelledby="lbl-' + key + '" ' +
               'data-action="toggle" data-key="' + key + '" data-testid="' + testid + '">' +
               '<span class="switch__track"></span><span class="switch__knob"></span>' +
             '</button>' +
           '</div>';
  }
  function actionRow(action, title, sub, testid, danger) {
    return '<button class="row' + (danger ? ' row--danger' : '') + '" data-action="' + action + '" data-testid="' + testid + '">' +
             '<span class="row__main">' +
               '<span class="row__title">' + title + '</span>' +
               '<span class="row__sub">' + sub + '</span>' +
             '</span>' +
             (danger ? '' : '<span class="row__chev">' + ICO.chev + '</span>') +
           '</button>';
  }
  function group(label, cards) {
    return '<section class="section">' +
             '<div class="section__head"><h2 class="t-label">' + label + '</h2></div>' +
             cards +
           '</section>';
  }

  /* =============================================================
     1. Account
     ============================================================= */
  function identityRow() {
    /* An account that has entered nothing says so and offers the sheet that
       asks. It used to print the seeded persona's name, handle and address. */
    var named = !!(S.name || S.username || S.email);
    var sub = [S.username ? '@' + S.username : '', S.email].filter(Boolean).join(' \u00b7 ');
    return '<button class="row" data-action="sheet" data-key="profile" data-testid="row-identity">' +
             '<span class="hdr__initial" aria-hidden="true">' +
               esc(S.name ? S.name.charAt(0) : '\u2013') + '</span>' +
             '<span class="row__main">' +
               '<span class="row__title">' + esc(S.name || 'Add your name') + '</span>' +
               '<span class="row__sub truncate">' +
                 esc(named ? (sub || 'No handle or email yet')
                           : 'Nothing set yet. Tap to add it.') + '</span>' +
             '</span>' +
             '<span class="row__chev">' + ICO.chev + '</span>' +
           '</button>';
  }
  function bodyRow() {
    return navRow('body', 'Body and goal', bodyLine(), 'row-body');
  }
  function passwordRow() {
    return navRow('password', 'Change your password', 'Checked on this phone. Nothing is sent', 'row-password');
  }

  /* The one network-shaped action on this screen. Every state it can be in
     is printed, including the one the old build could not show -- and the
     line above the button is a stored timestamp or the words "Never synced",
     never the literal "2 minutes ago" it used to be on a build that has
     never reached a server. */
  function syncedLine() {
    /* Asked, not assumed. "This build has no server" is true today and would
       become a lie the moment a deploy sets window.LK_CLOUD, so the sentence
       reads the one seam that knows. */
    var C = window.LKCloud;
    if (!S.syncedAt) {
      if (!C || !C.ready()) return 'Never synced. This build has no server to sync with.';
      if (!C.signedIn()) return 'Never synced. Sign in to sync.';
      return 'Never synced.';
    }
    return 'Last sync ' + S.syncedAt;
  }
  /* WHY THERE IS ONE SYNC BUTTON AND NOT TWO. v6 also had "Sync All to Server
     Now" in its beta admin card: a force-push of every key regardless of what
     had changed, for an operator chasing a tester's missing data. CUT. Sync now
     is the same action with a better rule -- LKCloud.push() sends what changed
     since the last sync and pulls what changed on the other side -- and a
     second button beside it whose only difference is "ignore the change stamps"
     is an admin tool in a consumer screen, one more thing to press when the
     first one does not appear to work. Forcing a full push would also need an
     API cloud.js does not have, and cloud.js belongs to another package. */
  function syncRow() {
    var sub, btn;
    if (S.sync === 'busy') {
      sub = 'Checking for changes';
      btn = '<button class="btn btn--sm btn--secondary" aria-busy="true" disabled data-testid="sync-now">' +
              '<span class="spinner"></span><span class="btn__label">Syncing</span></button>';
    } else if (S.sync === 'failed') {
      /* FAIL CLOSED. A failure says it failed and offers the retry. It
         never renders the success line. */
      sub = '<span class="t-detail" style="color: var(--error)">Could not reach LOCKED. Nothing was sent.</span>';
      btn = '<button class="btn btn--sm btn--secondary" data-action="sync" data-testid="sync-now">' +
              '<span class="btn__label">Try again</span></button>';
    } else {
      sub = syncedLine();
      btn = '<button class="btn btn--sm btn--secondary" data-action="sync" data-testid="sync-now">' +
              '<span class="btn__label">Sync now</span></button>';
    }
    return '<div class="row row--static">' +
             '<span class="row__main">' +
               '<span class="row__title">Sync</span>' +
               '<span class="row__sub">' + sub + '</span>' +
             '</span>' + btn +
           '</div>';
  }

  function accountSection() {
    var card;
    if (S.view === 'signed-in') {
      card = '<div class="card card--flush">' + identityRow() + bodyRow() + passwordRow() + syncRow() + '</div>';
    } else if (S.view === 'guest') {
      card = '<div class="card card--flush">' +
               '<div class="row row--static">' +
                 '<span class="ico-well">' + ICO.person + '</span>' +
                 '<span class="row__main">' +
                   '<span class="row__title">Guest</span>' +
                   '<span class="row__sub">Everything is saved on this phone only.</span>' +
                 '</span>' +
               '</div>' +
               bodyRow() +
               '<div class="card__foot stack stack--2">' +
                 '<button class="btn btn--primary btn--block" data-action="create-account" data-testid="create-account">' +
                   '<span class="btn__label">Create an account</span></button>' +
                 '<p class="t-detail">Keeps your history if you lose this phone, and lets the coach read it on another one.</p>' +
                 '<button class="btn btn--tertiary btn--block" data-action="sign-in" data-testid="sign-in">' +
                   '<span class="btn__label">I already have an account</span></button>' +
               '</div>' +
             '</div>';
    } else if (S.view === 'signed-out') {
      card = '<div class="card card--flush">' +
               '<div class="row row--static">' +
                 '<span class="ico-well">' + ICO.cloud + '</span>' +
                 '<span class="row__main">' +
                   '<span class="row__title">Not signed in</span>' +
                   '<span class="row__sub">Your settings and history are still on this phone.</span>' +
                 '</span>' +
               '</div>' +
               bodyRow() +
               '<div class="card__foot stack stack--2">' +
                 '<button class="btn btn--primary btn--block" data-action="sign-in" data-testid="sign-in">' +
                   '<span class="btn__label">Sign in</span></button>' +
                 '<button class="btn btn--tertiary btn--block" data-action="create-account" data-testid="create-account">' +
                   '<span class="btn__label">Create an account</span></button>' +
               '</div>' +
             '</div>';
    } else if (S.view === 'loading') {
      /* Reserves what the signed-in card actually takes: an avatar row, two
         lines of account, the sync line and the two buttons in the foot.
         The shipped skeleton was 121px against 217px loaded, so everything
         below it dropped 96px the moment the account arrived — the reader is
         then looking at a different row than the one they were reading. */
      card = '<div class="card" role="status" aria-busy="true" aria-label="Loading your account">' +
               '<div class="hstack hstack--3">' +
                 '<div class="skel" style="width: 48px; height: 48px; border-radius: var(--r-full)"></div>' +
                 '<div class="grow stack stack--2">' +
                   '<div class="skel" style="height: var(--lh-17); width: 40%"></div>' +
                   '<div class="skel" style="height: var(--lh-13); width: 70%"></div>' +
                 '</div>' +
               '</div>' +
               '<div class="skel mt-4" style="height: var(--lh-13); width: 55%"></div>' +
               /* The signed-in card grew when the account rows did -- the
                  password row and the second sync line -- and the skeleton
                  did not follow, so everything under it dropped 92px the
                  moment the account arrived. Measured at 274px loaded
                  against 182px reserved; these two lines are the difference. */
               '<div class="skel mt-3" style="height: var(--lh-13); width: 45%"></div>' +
               '<div class="card__foot stack stack--2">' +
                 '<div class="skel" style="height: var(--tap)"></div>' +
                 '<div class="skel" style="height: calc(var(--tap) + 10px)"></div>' +
               '</div>' +
             '</div>';
    } else {
      /* Account unreachable. The preferences below are read from this
         phone, so they are shown, unchanged, and still work. */
      var busy = S.sync === 'busy';
      card = '<div class="card">' +
               '<div class="banner banner--error" role="alert">' + ICO.alert +
                 '<span><strong>Can’t reach your account</strong>' +
                 'Your settings on this phone are unchanged. ' + esc(syncedLine()) + '</span>' +
               '</div>' +
               '<button class="btn btn--primary btn--block mt-4" data-action="sync" data-testid="retry-account"' +
                 (busy ? ' aria-busy="true" disabled' : '') + '>' +
                 (busy ? '<span class="spinner"></span>' : '') +
                 '<span class="btn__label">' + (busy ? 'Trying' : 'Try again') + '</span></button>' +
             '</div>' +
             '<div class="card card--flush">' + bodyRow() + '</div>';
    }
    return group('Account', card);
  }

  /* =============================================================
     2-4. Preferences. Read from this phone, so they render in every
     state, including the two the account cannot survive.
     ============================================================= */
  function displaySection() {
    return group('Units and display',
      '<div class="card card--flush">' +
        navRow('unit', 'Weight unit', S.unit === 'kg' ? 'Kilograms (kg)' : 'Pounds (lb)', 'row-weight-unit') +
        navRow('dist', 'Distance', S.dist === 'km' ? 'Kilometres (km)' : 'Miles (mi)', 'row-distance-unit') +
        navRow('weekStart', 'Week starts on', S.weekStart === 'mon' ? 'Monday' : 'Sunday', 'row-week-start') +
        navRow('theme', 'Appearance', window.LKTheme.label(S.theme), 'row-appearance') +
      '</div>');
  }

  function trainingSection() {
    return group('Training',
      '<div class="card card--flush">' +
        switchRow('restTimer', 'Rest timer',
          S.restTimer ? 'Starts when you finish a set' : 'Off', S.restTimer, 'switch-rest-timer') +
        navRow('restSec', 'Rest between sets', secs(S.restSec), 'row-rest-length') +
        switchRow('partials', 'Count partial reps',
          S.partials ? 'Half reps count towards the set' : 'Only full reps count', S.partials, 'switch-partial-reps') +
        navRow('plateKg', 'Round weights to', plate(S.plateKg), 'row-plate-rounding') +
        /* 866 lifts is the whole catalogue and the library keeps it --
           completeness is the point of a reference. Choosing one in the
           middle of a set is a different job, and scrolling past forty
           near-identical incline presses is the opposite of what somebody
           holding a barbell wants. */
        switchRow('shortLib', 'Short exercise list',
          S.shortLib ? 'The common lifts for each muscle, about twenty each'
                     : 'All 866 lifts everywhere', S.shortLib, 'switch-short-library') +
        /* What the unit switch actually does, said once, where a lifter is
           deciding whether to touch it. lk_weightStorageUnit is "kg" and
           every screen converts on the way out, so a history logged in
           kilograms reads as pounds and is still the same history. */
        '<div class="row row--static" data-testid="row-storage-unit">' +
          '<span class="row__main">' +
            '<span class="row__title">Your logs are stored in kilograms</span>' +
            '<span class="row__sub">Changing the weight unit converts what you see. It does not relabel it, ' +
              'and nothing in your history is rewritten.</span>' +
          '</span>' +
        '</div>' +
      '</div>');
  }

  /* Two switches that were named on other screens and existed on none.

     Fuel's hidden state says "Numbers are off in Settings" and there was no
     such control anywhere; Profile's own source comment says badges are "a
     setting, off unless somebody turned them on" and there was no such
     setting either. Both are here now, where the copy already said they
     were. */
  /* FUEL DISPLAY. "Show calorie numbers" is here because Fuel reads it
     (fuel.html:6558, lk_fuelNumbers === 'false' hides the figures). The other
     half of v6's card -- Left / Eaten dashboard framing -- is still not here:
     fuel.html does not read a framing key, it belongs to that screen's own
     package, and a switch on this screen that Fuel ignored would be a control
     that does nothing, which is worse than one fewer control. It goes in Fuel
     or it does not go in. */
  function seenSection() {
    return group('What you see',
      '<div class="card card--flush">' +
        switchRow('fuelNumbers', 'Show calorie numbers',
          S.fuelNumbers ? 'Fuel shows the figures' : 'Fuel shows how the day is going, not the numbers',
          S.fuelNumbers, 'switch-fuel-numbers') +
        switchRow('badges', 'Streaks and badges',
          S.badges ? 'On. Profile shows them.' : 'Off. Nothing is scored.',
          S.badges, 'switch-badges') +
        /* The gate the cycle screen and Home's cycle row both read. It was
           `lk_profile.sex === "female"` in the shipped app; a switch the
           person sets themselves says the same thing without asking them to
           declare anything to get at a feature. */
        switchRow('cycle', 'Cycle tracking',
          S.cycle ? 'On. Home shows where you are in it.' : 'Off',
          S.cycle, 'switch-cycle') +
        /* THE CYCLE LOG'S OWN CONSENT. It is the one key set in this app that
           a sync may not carry by default, so it has a switch of its own and
           the row says exactly which records it governs -- not "sync my data".
           cloud.js refuses lk_mcProfile, lk_mcDays and lk_mcFuelAdjust in both
           directions while this is off, so turning it off later also stops a
           copy already on a server from coming back. Shown only when cycle
           tracking is on: a consent switch for a feature nobody uses is a
           question with no subject. */
        (S.cycle ? switchRow('cycleBackup', 'Back up your cycle log',
          S.cycleBackup
            ? 'On. Your cycle dates, symptoms and fuel adjustments would be included in a sync.'
            : 'Off. Your cycle dates, symptoms and fuel adjustments stay on this phone, and a sync skips them.',
          S.cycleBackup, 'switch-cycle-backup') +
          '<div class="row row--static" data-testid="row-cycle-backup-note">' +
            '<span class="row__main">' +
              '<span class="row__sub">Nothing has been uploaded either way: this build has no server. ' +
                'The switch decides what a sync would be allowed to carry once there is one.</span>' +
            '</span>' +
          '</div>' : '') +
        /* Stack. Off by default, and nothing about it appears anywhere in the
           app until this is on -- not a greyed chip, not an empty tab, absent.
           The sub-line says what it records rather than what it is called,
           because "Stack" tells somebody who has not used it nothing. */
        switchRow('perfTracking', 'Stack tracking',
          S.perfTracking ? 'On. Compounds, doses and schedules, under Fuel.'
                         : 'Off. Compounds, doses and schedules.',
          S.perfTracking, 'switch-perf') +
      '</div>');
  }

  /* NOTIFICATIONS. The permission prompt is a real browser API and this asks
     for it properly, including the state where the answer was no and only the
     reader can change it. Nine preferences, each stored, and the three that
     are a time of day each carry their own send time. What still cannot
     happen is the sending: a service worker can show a notification, and it
     is a push from a server that wakes it to do so. There is no push
     subscription and no sender here, so the card says that, in its own words,
     under the switches -- rather than implying a reminder will arrive at
     6:30 PM. */
  function notifCard() {
    var perm = notifPermission();
    var head;
    if (perm === 'unsupported') {
      head = '<div class="row row--static" data-testid="notif-unsupported">' +
               '<span class="row__main">' +
                 '<span class="row__title">Notifications</span>' +
                 '<span class="row__sub">This browser has none to offer.</span>' +
               '</span></div>';
    } else if (perm === 'denied') {
      /* The blocked state. The app cannot re-ask once a browser has been
         told no, so the row stops offering and says who can undo it. */
      head = '<div class="row row--static" data-testid="notif-blocked">' +
               '<span class="row__main">' +
                 '<span class="row__title">Notifications are blocked</span>' +
                 '<span class="row__sub">You turned them off for this app in your browser. ' +
                   'Only your browser settings can turn them back on.</span>' +
               '</span></div>';
    } else if (perm === 'granted') {
      head = '<div class="row">' +
               '<span class="row__main">' +
                 '<span class="row__title" id="lbl-notif">Notifications</span>' +
                 '<span class="row__sub">' + (S.notifOn
                   ? 'Allowed by your browser'
                   : 'Allowed by your browser, switched off here') + '</span>' +
               '</span>' +
               '<button class="switch" role="switch" aria-checked="' + S.notifOn + '" ' +
                 'aria-labelledby="lbl-notif" data-action="notif-master" data-testid="switch-notif">' +
                 '<span class="switch__track"></span><span class="switch__knob"></span>' +
               '</button>' +
             '</div>';
    } else {
      head = '<div class="row row--static">' +
               '<span class="row__main">' +
                 '<span class="row__title">Notifications</span>' +
                 '<span class="row__sub">Your browser has not been asked yet.</span>' +
               '</span>' +
               '<button class="btn btn--sm btn--secondary" data-action="notif-master" data-testid="notif-ask">' +
                 '<span class="btn__label">Ask</span></button>' +
             '</div>';
    }

    var on = perm === 'granted' && S.notifOn;
    var types = NOTIF.map(function (r) {
      /* A preference for a feature that is switched off is shown and
         explained rather than hidden, so the list is the same list every
         time somebody looks at it -- but it cannot be armed, because there
         is nothing for it to be about. */
      var blocked = r.needs && !S[r.needs];
      /* A PREFERENCE IS NOT A PERMISSION. These were all disabled until the
         browser had said yes, so somebody deciding what they wanted to be told
         about had to grant a permission first -- and since nothing can fire
         either way, the switch they were being refused only records an
         intention. What the browser has allowed is the head of this card; what
         the reader wants is these. The one control gated on permission is the
         test send, because that one really does try to show a notification. */
      var live = !blocked;
      var sub = blocked ? 'Turn Stack tracking on to use this' : r.sub;
      var row = '<div class="row">' +
               '<span class="row__main">' +
                 '<span class="row__title" id="lbl-n-' + r.k + '">' + r.title + '</span>' +
                 '<span class="row__sub">' + sub + '</span>' +
               '</span>' +
               '<button class="switch" role="switch" aria-checked="' + notifOn(r.k) + '" ' +
                 'aria-labelledby="lbl-n-' + r.k + '" data-action="notif-toggle" data-key="' + r.k + '" ' +
                 'data-name="' + esc(r.title) + '" data-testid="switch-notif-' + r.k + '"' +
                 (live ? '' : ' disabled aria-disabled="true"') + '>' +
                 '<span class="switch__track"></span><span class="switch__knob"></span>' +
               '</button>' +
             '</div>';
      /* ITS OWN SEND TIME, under the preference it belongs to. One global
         Reminder time meant moving the workout reminder to the morning moved
         the check-in with it. */
      if (r.time) {
        row += '<button class="row row--sub" data-action="sheet" data-key="' + r.time +
                 '" data-testid="row-time-' + r.k + '">' +
                 '<span class="row__main">' +
                   '<span class="row__title">Send at</span>' +
                   '<span class="row__sub">' + clock(S[r.time]) + '</span>' +
                 '</span>' +
                 '<span class="row__chev">' + ICO.chev + '</span>' +
               '</button>';
      } else if (r.when) {
        row += '<div class="row row--sub row--static" data-testid="row-when-' + r.k + '">' +
                 '<span class="row__main">' +
                   '<span class="row__sub">' + r.when + '</span>' +
                 '</span>' +
               '</div>';
      }
      return row;
    }).join('');

    var sounds = '<div class="row row--static">' +
        '<span class="row__main">' +
          '<span class="row__title" id="lbl-sound">Rest timer sound</span>' +
          '<span class="row__sub">Tap one to hear it.</span>' +
          '<span class="hstack hstack--2 mt-2" role="radiogroup" aria-labelledby="lbl-sound">' +
            SOUNDS.map(function (r) {
              return '<button class="chip" role="radio" aria-checked="' + (S.restSound === r[0]) + '" ' +
                'data-action="sound-pick" data-value="' + r[0] + '" data-testid="sound-' + r[0] + '">' +
                r[1] + '</button>';
            }).join('') +
          '</span>' +
        '</span>' +
      '</div>';

    /* WHAT IS ACTUALLY MISSING, SAID WHERE IT MATTERS. The old sentence said
       there was no service worker. There is one now -- assemble.mjs generates
       demo/sw.js and registers it on a served build -- so that sentence had
       become untrue, and "needs a service worker" was no longer the reason
       nothing fires. The reason is the half after it: a worker can only show
       a notification when something wakes it, and what wakes it is a push
       from a server. There is no push subscription and no sender here, so
       every switch above is a preference being recorded for the day there is
       one, and none of them will fire. */
    var swLine =
      S.swState === 'active'
        ? 'A service worker is running, so this app can show one. Nothing wakes it: a reminder that ' +
          'arrives while the app is closed needs a push subscription and a server to send it, and ' +
          'this build has neither.'
        : S.swState === 'unsupported'
          ? 'This browser has no service workers, so nothing can be shown while the app is closed.'
          : S.swState === 'insecure'
            ? 'Opened from a file, so no service worker can run. A served build registers one — and ' +
              'even there, sending a reminder later needs a push subscription and a server.'
            : 'No service worker is running here yet, so nothing can be shown while the app is closed.';

    var foot = '<div class="card__foot stack stack--2">' +
        '<button class="btn btn--secondary btn--block" data-action="notif-test" data-testid="notif-test"' +
          (on ? '' : ' disabled') + '>' +
          '<span class="btn__label">Send one now</span></button>' +
