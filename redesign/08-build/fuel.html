<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOCKED — Fuel</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="fixtures.js"></script>
<script src="units.js"></script>
<script src="app.js"></script>
<script src="chrome.js"></script>
<script src="session.js"></script>
</head>
<body>
<!--
  FUEL — built from Concept D, "Glance and Ledger merged, no Fuel Score".

  The whole screen answers one question: what is left to eat today, and how do
  I record what I just ate. Everything else is a chip at the bottom.

  WHY THE SPLIT BUTTON
  Voice and camera are the two fast paths and neither is secondary, so they
  share one accent control rather than competing as two. That keeps the
  screen's single accent on the single job the screen is for. Concept D's
  own note: "Mic and camera share one orange split button. Equal weight, one
  accent per surface, nothing floats over content."

  WHAT WAS CUT, AND ON WHOSE SAY-SO
  The Fuel Score is gone. It was a composite of weighted sub-scores, which
  reads as rigorous and cannot be acted on: the targets and the day's actuals
  already say what to do differently. Cut at the Wave 0 gate by the owner.
  Receipt scanning went with it, to Shopping, because parsing a receipt is a
  grocery job rather than a logging one.

  SOURCE BADGES ARE NOT DECORATION
  Every logged row says where its numbers came from. A verified barcode and an
  AI estimate from a photo are not the same claim, and a screen that renders
  them identically is lying about its own confidence. This is the trust layer
  the rebuild plan asks for, and it is why "Estimate" is a visible word rather
  than a shade of grey.

  STATES
  populated, first-weeks (the target is a formula until the trend takes over),
  hidden (numbers off, for anyone the numbers hurt), empty, loading, error.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-fuel" data-state="populated">

      <header class="hdr hdr--large" data-large-title="#body" data-scroll-edge="#body" id="hdr"></header>

      <main class="body" id="body" data-testid="fuel-scroll" tabindex="-1"></main>

      <div id="overlay"></div>

      <!-- The accessory shelf. A session that is running is visible from
           whichever tab you wandered to, which is the whole reason the shelf
           exists rather than a badge on the Train tab. -->
      <div id="shelf-slot"></div>

      <nav class="tabbar" aria-label="Sections" data-minimize="#body">
        <button class="tabbar__item" type="button" data-testid="tab-home">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></svg>
          <span class="tabbar__label">Home</span>
        </button>
        <button class="tabbar__item" type="button" data-testid="tab-train">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>
          <span class="tabbar__label">Train</span>
        </button>
        <button class="tabbar__item" type="button" aria-current="page" data-testid="tab-fuel">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 3v8a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M9 13v8"/><path d="M17 3c-1.5 1.8-2 3.6-2 5.5 0 1.6.7 2.5 2 2.5s2-.9 2-2.5c0-1.9-.5-3.7-2-5.5Z"/><path d="M17 11v10"/></svg>
          <span class="tabbar__label">Fuel</span>
        </button>
        <button class="tabbar__item" type="button" data-testid="tab-coach">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 15a3 3 0 0 1-3 3H9l-4 3V7a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3z"/></svg>
          <span class="tabbar__label">Coach</span>
        </button>
        <button class="tabbar__item" type="button" data-testid="tab-profile">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
          <span class="tabbar__label">Profile</span>
        </button>
      </nav>

    </div>
  </div>
</div>

<div class="dev">
  <button class="dev__toggle" id="dev-toggle" aria-expanded="false" aria-controls="dev-menu" data-testid="dev-toggle">State</button>
  <div class="dev__menu" id="dev-menu" hidden data-testid="dev-menu"></div>
</div>

<script>
(function () {
  "use strict";

  var screen = document.getElementById('screen');
  var hdr = document.getElementById('hdr');
  var body = document.getElementById('body');
  var overlay = document.getElementById('overlay');
  var menu = document.getElementById('dev-menu');

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }
  function n(v) { return Number(v).toLocaleString('en-GB'); }

  var ICO = {
    mic: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
    cam: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    tick: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l5 5L19 7"/></svg>',
    chev: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg>',
    alert: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>',
    plus: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>',
    barcode: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6v12M7.5 6v12M11 6v9M14.5 6v12M18 6v12M20.5 6v9"/></svg>',
    /* The one row in the list that is not a food. See the comment on the
       closing row for why it is a line icon and the logged meals are not. */
    clock: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>'
  };

  /* The day. Numbers are the fixture's, not invented at render time, so the
     same screen renders the same way every run and a screenshot diff means
     something. */
  /* A function, not a literal: the dev switcher rebuilds it so one state's
     edits do not leak into the next. */
  /* One source. Every figure below comes from window.LKFixtures, which is
     generated from tests/fixtures/seed-data.json -- the same file Home,
     Train, Recap, Progress and Settings read. This screen used to carry its
     own literals, and the cross-screen audit found it showing a body weight
     22% heavier than Settings and Progress, a calorie target 580 kcal from
     Recap's for the same day, a date two days behind the rest of the app,
     and macro bars carrying 10 g of carbs and 14 g of fat that belonged to
     no meal on the list. */
  var FX = window.LKFixtures || {};
  var NUT = FX.nutrition || { targets: {}, foods: {}, days: {}, trend: [] };
  var FOODS = NUT.foods;

  /* Mon 7 Sep, Tue 8 Sep, Wed 9 Sep. */
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function dayLabel(iso) {
    var p = iso.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    return WD[d.getUTCDay()] + ' ' + (+p[2]) + ' ' + MON[+p[1] - 1];
  }

  /* NOT a stored total. eaten and the three macro `have` figures are added up
     from DAY.meals every time the list changes, so a meal that is logged,
     rescaled or deleted cannot leave anything behind. The bars used to be
     stored figures nudged by each action, which is how they came to be 10 g
     and 14 g ahead of the meals that produced them and stayed there after the
     log was emptied. */
  function recount(d) {
    var t = { kcal: 0, pro: 0, carb: 0, fat: 0 };
    d.meals.forEach(function (m) {
      t.kcal += m.kcal || 0; t.pro += m.pro || 0; t.carb += m.carb || 0; t.fat += m.fat || 0;
    });
    d.eaten = Math.round(t.kcal);
    d.macros[0].have = Math.round(t.pro);
    d.macros[1].have = Math.round(t.carb);
    d.macros[2].have = Math.round(t.fat);
    return d;
  }

  /* A function, not a literal: the dev switcher rebuilds it so one state's
     edits do not leak into the next. */
  function day() {
    var iso = FX.today;
    var src = (NUT.days && NUT.days[iso]) || { meals: [], waterMl: 0, supps: [] };
    var tg = NUT.targets;
    var d = {
      iso: iso,
      date: dayLabel(iso),
      target: tg.kcal,
      goal: 'lean bulk',
      weightKg: (FX.profile && FX.profile.weightKg) || 0,
      weekPct: 0.34,
      macros: [
        { name: 'Protein', have: 0, want: tg.pro, unit: 'g', key: 'pro' },
        { name: 'Carbs', have: 0, want: tg.carb, unit: 'g', key: 'carb' },
        { name: 'Fat', have: 0, want: tg.fat, unit: 'g', key: 'fat' }
      ],
      meals: src.meals.map(function (m) {
        return { icon: m.icon, name: m.name, at: m.at, pro: m.pro, carb: m.carb,
                 fat: m.fat, kcal: m.kcal, src: m.src };
      }),
      /* Not a target and not a nag: a pattern this person already has. */
      closing: { at: '7:30', pro: 40 },
      waterMl: src.waterMl,
      waterGoalMl: tg.waterMl,
      /* Taken, not "due": the app knows what was swallowed, not what was
         intended. Two supplements, because that is what lk_supplements holds.
         This screen used to invent four and Recap a different three. */
      supps: (src.supps || []).map(function (sp) {
        return { name: sp.name, dose: sp.dose, when: sp.when, taken: sp.taken };
      }),
      /* Fourteen days of intake against target, the last four of them the
         days above added up. A trend is the only thing a single day cannot
         tell you, which is the whole reason this sheet exists. */
      trend: NUT.trend.slice()
    };
    return recount(d);
  }

  var DAY = day();

  /* Module scope and with macros on it, because these rows log. The list was
     a literal inside the sheet's own render function and every row closed the
     sheet without logging anything, under copy that says "one tap logs it
     again with the same portion". */
  var OFTEN = [
    { key: 'shake', n: 63 }, { key: 'eggs', n: 41 },
    { key: 'bowl', n: 28 }, { key: 'pasta', n: 19 }
  ].map(function (o) {
    var f = FOODS[o.key];
    return { icon: f.icon, name: f.name, n: o.n, kcal: f.kcal, pro: f.pro, carb: f.carb, fat: f.fat };
  });

  /* Saved recipes. A recipe is a food you assembled yourself: it carries its
     own ingredients and yields a number of servings, so logging one serving
     divides rather than making you do arithmetic at the counter.

     Macros here are the recipe's TOTAL, and the total is servings x the same
     per-serving food every other path on this screen logs, so one Chilli is
     one Chilli whether it arrives from the recipe, from the plan or from the
     often list. Per-serving is derived on read, never stored, because a
     stored per-serving figure and a changed serving count disagree the moment
     either one moves. */
  function recipe(key, name, servings, ing) {
    var f = FOODS[key];
    return { icon: f.icon, name: name, servings: servings, key: key,
             kcal: f.kcal * servings, pro: f.pro * servings,
             carb: f.carb * servings, fat: f.fat * servings, ing: ing };
  }
  var RECIPES = [
    recipe('chilli', 'Chilli, big batch', 6,
      ['1 kg beef mince, 5%', '2 tins kidney beans', '2 tins chopped tomatoes',
       '1 onion', '2 peppers', 'Chilli, cumin, paprika']),
    recipe('cnr', 'Chicken and rice, 4 days', 4,
      ['800 g chicken thigh', '400 g rice, dry', '2 tbsp olive oil', 'Soy, garlic, ginger']),
    recipe('pancakes', 'Protein pancakes', 2,
      ['100 g oats', '2 scoops whey', '2 eggs', '150 g skyr', 'Baking powder'])
  ];

  /* The week's plan. Each slot names a food, and the food carries the
     figures -- a slot used to carry a bare kcal and nothing else, so logging
     a planned meal moved the calorie count and left all three macro bars
     untouched, under-counting 41 g of protein a meal.

     Today's slots are not marked done by hand either. A slot is logged when
     a meal of that name is on today's list, so the plan and the ledger for
     the same day cannot disagree -- and they did: the plan called Monday
     1,760 kcal while the ledger for that Monday held 1,570.

     NOT BUILT, deliberately: the swap-by-AI path. In the shipped app a failed
     swap invented four meals and wrote them into the saved plan as though a
     model had returned them (audit H2). Swapping here picks from your own
     recipes and often-logged meals, which cannot fabricate anything. */
  function slot(at, key) {
    var f = FOODS[key];
    return { at: at, key: key, name: f.name, kcal: f.kcal, pro: f.pro, carb: f.carb, fat: f.fat };
  }
  var PLAN = [
    { d: 'Mon', iso: '2026-09-07', slots: [slot('Breakfast', 'eggs'), slot('Lunch', 'bowl'),
        slot('Dinner', 'chilli'), slot('Snack', 'shake'), slot('Second breakfast', 'pancakes'),
        slot('Evening', 'skyr')] },
    { d: 'Tue', iso: '2026-09-08', slots: [slot('Breakfast', 'eggs'), slot('Lunch', 'cnr'),
        slot('Dinner', 'pasta'), slot('Snack', 'shake'), slot('Evening', 'pancakes')] },
    { d: 'Wed', iso: '2026-09-09', slots: [slot('Breakfast', 'eggs'), slot('Lunch', 'bowl'),
        slot('Snack', 'shake'), slot('Dinner', 'chilli')] },
    { d: 'Thu', iso: '2026-09-10', slots: [slot('Breakfast', 'pancakes'), slot('Lunch', 'cnr'),
        slot('Dinner', 'pasta')] },
    { d: 'Fri', iso: '2026-09-11', slots: [slot('Breakfast', 'shake'), slot('Lunch', 'chilli'),
        slot('Dinner', 'bowl')] }
  ];

  /* A past day is logged from the record; today is logged from what is on
     the list right now. */
  function slotDone(pd, sl) {
    if (pd.iso === DAY.iso) {
      return DAY.meals.some(function (m) { return m.name === sl.name; });
    }
    var rec = NUT.days && NUT.days[pd.iso];
    if (!rec) return false;
    return rec.meals.some(function (m) { return m.name === sl.name; });
  }

  /* What the scanner resolved. One product, because a fixture that changes
     per run makes a screenshot diff meaningless. */
  var SCAN = (function (f) {
    return { icon: f.icon, name: f.name, code: '5 060 123 456 789', key: 'skyr',
             serving: '150 g pot', kcal: f.kcal, pro: f.pro, carb: f.carb, fat: f.fat };
  })(FOODS.skyr);

  /* lk_perfTracking, the switch that makes Stack exist. Read rather than
     cached, so turning it on in Settings and coming back shows the chip. */
  function perfTracking() {
    try { return localStorage.getItem('lk_perfTracking') === 'true'; } catch (e) { return false; }
  }

  var S = { state: 'populated', sheet: null, listening: false, scanServings: 1,
            /* The camera sheet's one question. null until it is answered. */
            camOil: null, toast: null, undo: null, targetError: null, searchQ: '',
            /* Which recipe is open inside the recipes sheet. The list and the
               detail are one sheet with two faces rather than two sheets, so
               Back returns to the list without closing and losing the place. */
            recipeOpen: null };

  /* The same strip Home shows, from the same facts. It is here because
     eating during or straight after a session is exactly when somebody
     leaves the workout screen, and losing the way back is what turns one
     logged meal into an abandoned session. */
  /* The shelf comes from the live session record, not from this screen.
     It used to be hand-written markup gated on a dev state, which meant it
     showed a fixed "Push A, 4 of 7, 38:12" whether or not a workout was
     running, and never showed a real one. The dev state is kept: it seeds a
     session so the demo can show the strip without anybody training. */
  function shelfHTML() {
    return window.LKSession && LKSession.get() ? LKSession.html() : '';
  }

  /* The demo's own "live" state, seeded into the record so the shelf on
     every other screen agrees with this one. */
  function seedDemoSession(on) {
    if (!window.LKSession) return;
    var live = LKSession.get();
    if (on && !live) LKSession.start({ name: 'Push A', startedAt: Date.now() - 2292000, done: 4, total: 7 });
    else if (!on && live && live.name === 'Push A') LKSession.end();
  }

  /* ---------------------------------------------------------------
     Header
     --------------------------------------------------------------- */
  function headerHTML() {
    return '' +
      '<div class="hdr__title stack stack--1">' +
        '<span class="t-meta">' + esc(DAY.date) + '</span>' +
        '<h1 class="hdr__title-large" data-title-large>Fuel</h1>' +
      '</div>' +
      '<span class="hdr__title-small" data-title-small aria-hidden="true">Fuel</span>';
  }

  /* ---------------------------------------------------------------
     The hero, and the three ways it can read

     populated   the number left, and what it is left of
     first-weeks a day counter, because the target is still a formula
     hidden      a word, because the number is the thing being hidden
     --------------------------------------------------------------- */
  function hero() {
    /* An empty day has eaten nothing, whatever the fixture says. The fixture
       is shared across the dev states, so the empty state was printing the
       populated day's "1,410 kcal left of 2,980" directly above the words
       "Nothing logged today". */
    var eaten = S.state === 'empty' ? 0 : DAY.eaten;
    var left = DAY.target - eaten;

    if (S.state === 'hidden') {
      return '<div class="fuel-hero" data-testid="hero">' +
        '<div class="stack stack--1">' +
          '<p class="t-title-1" data-testid="hero-value">On track</p>' +
          '<p class="t-footnote quiet">Protein is ahead of pace and the day has room left. ' +
            'Numbers are off in Settings.</p>' +
        '</div></div>';
    }

    if (S.state === 'first-weeks') {
      return '<div class="fuel-hero" data-testid="hero">' +
        '<div class="stack stack--1">' +
          '<p class="t-meta">DAY 3 OF 14</p>' +
          '<p class="fuel-hero__num num" data-testid="hero-value">' + n(Math.abs(left)) + '</p>' +
          '<p class="t-footnote quiet">' + (left < 0 ? 'kcal over ' : 'kcal left of ') +
            n(DAY.target) + ' &middot; ' +
            'a starting formula, not your trend yet. It updates once there are two weeks to read.</p>' +
        '</div></div>';
    }

    /* Past the target the figure is what you are over BY, not a negative
       amount remaining. "-210 kcal left" is not a sentence anybody says, and
       a minus sign in front of the biggest number on the screen reads as a
       fault rather than as a fact about lunch. */
    var over = left < 0;
    return '<div class="fuel-hero" data-testid="hero">' +
      '<div class="stack stack--1 grow">' +
        '<p class="fuel-hero__num num" data-testid="hero-value">' + n(Math.abs(left)) + '</p>' +
        '<p class="t-footnote quiet">' + (over ? 'kcal over ' : 'kcal left of ') +
          n(DAY.target) + ' &middot; ' + esc(DAY.goal) + '</p>' +
      '</div>' +
      '<div class="fuel-hero__side stack stack--1">' +
        '<p class="t-subheadline num">' + DAY.weightKg.toFixed(1) + ' kg</p>' +
        '<p class="t-caption-2 quiet">+' + DAY.weekPct.toFixed(2) + '% / wk, on target</p>' +
      '</div></div>';
  }

  /* The one accent on the screen, holding both fast paths. Two buttons rather
     than one with a mode, because a mode is a thing to get wrong; one control
     because voice and camera are the same job done two ways. */
  function logAction() {
    return '<div class="fuel-log" role="group" aria-label="Log what you ate">' +
      '<button class="fuel-log__half" type="button" data-action="scan" data-testid="log-scan">' +
        ICO.barcode + '<span class="btn__label">Scan</span></button>' +
      '<button class="fuel-log__half" type="button" data-action="mic" data-testid="log-mic">' +
        ICO.mic + '<span class="t-headline">Say it</span>' +
      '</button>' +
      '<button class="fuel-log__half" type="button" data-action="cam" data-testid="log-cam">' +
        ICO.cam + '<span class="t-headline">Snap it</span>' +
      '</button>' +
    '</div>' +
    /* The fourth way, and the ordinary one. Scan, Say it and Snap it each
       need the food to be in front of you; a person eating something new,
       remembered, or already eaten had nowhere to put it. A DOM sweep of
       this screen for a search field returned nothing -- every search box in
       the build belonged to an exercise picker. */
    '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="search" ' +
      'data-testid="log-search"><span class="btn__label">Search foods</span></button>' +
    '<p class="t-caption-1 quiet fuel-log__hint">Search by name, say what you ate, or snap the plate.</p>';
  }

  /* Everything this build can log by name, in one list: the food table the
     rest of the screen logs from, plus your own recipes at one serving. It is
     a demo food table, not a database, and the sheet says so rather than
     implying a search that reaches further than it does. */
  function searchable() {
    var out = [];
    Object.keys(FOODS).forEach(function (k) {
      var f = FOODS[k];
      out.push({ key: k, icon: f.icon, name: f.name, kcal: f.kcal, pro: f.pro,
                 carb: f.carb, fat: f.fat, from: 'Food table', src: 'verified' });
    });
    RECIPES.forEach(function (r, i) {
      out.push({ recipe: i, icon: r.icon, name: r.name + ', one serving',
                 kcal: Math.round(r.kcal / r.servings), pro: Math.round(r.pro / r.servings),
                 carb: Math.round(r.carb / r.servings), fat: Math.round(r.fat / r.servings),
                 from: 'Your recipes', src: 'recipe' });
    });
    return out;
  }

  function macros() {
    if (S.state === 'hidden') {
      var words = ['Ahead', 'On pace', 'On pace'];
      return '<div class="card mt-4" data-testid="macros">' +
        DAY.macros.map(function (m, i) {
          return '<div class="fuel-macro">' +
            '<div class="hstack"><span class="t-subheadline grow">' + esc(m.name) + '</span>' +
            '<span class="t-footnote quiet">' + words[i] + '</span></div>' +
            '<div class="meter meter--quiet mt-2"><span class="meter__fill" style="width:' +
              Math.round(m.have / m.want * 100) + '%"></span></div>' +
          '</div>';
        }).join('') + '</div>';
    }
    /* The card is a button. The targets moved with every log and there was no
       way to set one -- not on this screen and not in Settings -- so the
       three figures the whole screen is measured against were the only
       numbers in the app nobody could choose. */
    return '<button class="card mt-4" type="button" data-action="targets" ' +
      'data-testid="macros" aria-label="Macro targets, edit">' +
      DAY.macros.map(function (m) {
        var pct = Math.min(100, Math.round(m.have / m.want * 100));
        return '<div class="fuel-macro">' +
          '<div class="hstack">' +
            '<span class="t-subheadline grow">' + esc(m.name) + '</span>' +
            '<span class="t-footnote num"><strong>' + m.have + '</strong> / ' + m.want + ' ' + m.unit + '</span>' +
          '</div>' +
          '<div class="meter meter--quiet mt-2" role="img" aria-label="' + esc(m.name) + ', ' + m.have +
            ' of ' + m.want + ' ' + m.unit + '"><span class="meter__fill" style="width:' + pct + '%"></span></div>' +
        '</div>';
      }).join('') + '</button>';
  }

  /* A badge is a claim about where a number came from. Verified means a
     barcode or a database row; Estimate means a model looked at a photo. */
  /* Four provenances, four words. 'recipe', 'plan' and 'repeat' used to fall
     through to Estimate, whose detail copy says a model read a photo -- so a
     meal built from weighed ingredients was captioned as a camera guess. */
  var SRC = {
    verified: { word: 'Verified', cls: 'badge--ok', testid: 'badge-verified',
      why: 'A barcode matched a database row, so the figures are the manufacturer\u2019s own.' },
    estimate: { word: 'Estimate', cls: 'badge--est', testid: 'badge-estimate',
      why: 'A model read the photo and estimated the portion. Expect it to be within about 15%, ' +
           'and correct it with the portion controls if it looks wrong.' },
    recipe: { word: 'Recipe', cls: 'badge--est', testid: 'badge-recipe',
      why: 'One serving of a recipe you built. The figures are your own ingredients divided by ' +
           'the number of servings you said it makes.' },
    plan: { word: 'Planned', cls: 'badge--est', testid: 'badge-plan',
      why: 'Logged from this week\u2019s plan. The figures are the ones the planned meal carries.' },
    repeat: { word: 'Repeat', cls: 'badge--est', testid: 'badge-repeat',
      why: 'A meal you have logged before, logged again with the same portion. The figures are ' +
           'the ones saved then, and no new measurement was taken.' }
  };
  function srcOf(src) { return SRC[src] || SRC.estimate; }
  function badge(src) {
    var d = srcOf(src);
    return '<span class="badge ' + d.cls + '" data-testid="' + d.testid + '">' + d.word + '</span>';
  }

  function mealRow(m, i) {
    return '<button class="row" type="button" data-action="meal" data-i="' + i +
        '" data-testid="meal-' + i + '">' +
      '<span class="fuel-thumb" aria-hidden="true">' + m.icon + '</span>' +
      '<span class="row__main stack">' +
        '<span class="row__title">' + esc(m.name) + '</span>' +
        /* All three macros, not protein alone. Two of the three bars on this
           screen could not be checked against anything a meal showed, which
           is why a 10 g carb and 14 g fat discrepancy sat there unseen. */
        '<span class="row__sub">' + esc(m.at) + ' &middot; ' + n(m.pro) + ' P &middot; ' +
          n(m.carb) + ' C &middot; ' + n(m.fat) + ' F</span>' +
      '</span>' +
      /* The badge belongs with the number, not with the time: it is a claim
         about where that number came from. It also stays when the numbers are
         hidden, because "a barcode read this" is not itself a calorie count. */
      '<span class="fuel-src">' +
        (S.state === 'hidden' ? '' : '<span class="row__value num">' + n(m.kcal) +
          '<small class="t-caption-2 quiet"> kcal</small></span>') +
        badge(m.src) +
      '</span>' +
      '<span class="row__chev">' + ICO.chev + '</span>' +
    '</button>';
  }

  function today() {
    var rows = DAY.meals.map(mealRow).join('');
    /* The empty slot is a pattern, not a target. "About 40g protein closes
       today" is something this person already does; "600 calories to beat"
       would be a number invented to be chased. */
    /* A line icon, where the three logged meals carry colour emoji. That is
       not an inconsistency, it is the distinction: an emoji here is the food,
       and this row has no food in it. It is an instruction about a meal that
       has not happened. A flat grey 🍽 next to three colour glyphs read as a
       rendering failure; a clock from the icon family reads as what it is. */
    /* It reads the day it sits under. The row used to be a fixed string, so
       after logging 4,000 kcal with protein at 265 of 160 g it still said
       "about 40 g protein closes today" -- advice, in the voice of the app,
       about a day that had already finished. */
    var proLeft = DAY.macros[0].want - DAY.macros[0].have;
    var kcalLeft = DAY.target - DAY.eaten;
    var closingSub;
    if (kcalLeft <= 0 && proLeft <= 0) {
      closingSub = 'Both closed. Nothing has to go in after this.';
    } else if (proLeft <= 0) {
      closingSub = 'Protein is closed. ' + n(kcalLeft) + ' kcal left if you want them.';
    } else if (kcalLeft <= 0) {
      closingSub = n(proLeft) + ' g of protein short, and the calories are spent.';
    } else {
      closingSub = 'Usually ' + esc(DAY.closing.at) + ' \u00b7 ' + n(proLeft) +
        ' g of protein and ' + n(kcalLeft) + ' kcal left to close today.';
    }
    var closing = '<div class="row row--quiet" data-testid="meal-closing">' +
      '<span class="fuel-thumb fuel-thumb--ico" aria-hidden="true">' + ICO.clock + '</span>' +
      '<span class="row__main stack">' +
        '<span class="row__title">Dinner</span>' +
        '<span class="row__sub">' + closingSub + '</span>' +
      '</span>' +
      '<span class="fuel-src"><span class="row__value quiet">&mdash;</span></span>' +
      '<span class="row__chev" aria-hidden="true"></span></div>';

    return '<div class="section">' +
      '<div class="section__head">' +
        '<h2 class="t-label">Today</h2>' +
        '<button class="hdr__action" type="button" data-action="meals" data-testid="open-meals">Meals</button>' +
      '</div>' +
      '<div class="card card--flush">' + rows + closing + '</div>' +
    '</div>';
  }

  /* Everything that is not logging. Quiet chips, because a fake button row is
     how a screen ends up with five things competing for one job. */
  function chips() {
    var items = [['trends', 'Trends'], ['water', 'Water'], ['supps', 'Supps'],
                 ['recipes', 'Recipes'], ['plan', 'Plan']];
    /* Stack is gated and stays invisible until it is switched on -- not
       disabled, not greyed, absent. A chip that says "Stack" to somebody who
       has never turned it on is the feature announcing itself, which is the
       one thing a gate like this exists to prevent. */
    if (perfTracking()) items.push(['stack', 'Stack']);
    items.push(['more', 'More']);
    return '<div class="chiprow mt-4" data-testid="fuel-chips">' +
      items.map(function (c) {
        return '<button class="chip" type="button" data-action="' + c[0] +
          '" data-testid="chip-' + c[0] + '">' + c[1] + '</button>';
      }).join('') + '</div>';
  }

  /* ---------------------------------------------------------------
     Views
     --------------------------------------------------------------- */
  var VIEWS = {};

  VIEWS.populated = function () {
    return '<div>' + hero() + logAction() + macros() + '</div>' +
      today() + '<div>' + chips() + '</div>';
  };
  VIEWS['first-weeks'] = VIEWS.populated;
  VIEWS.hidden = VIEWS.populated;
  VIEWS.live = VIEWS.populated;
  VIEWS['stack-on'] = VIEWS.populated;

  VIEWS.empty = function () {
    return '<div>' + hero() + logAction() + '</div>' +
      '<div class="empty mt-5" data-testid="state-empty">' +
        '<p class="empty__title">Nothing logged today</p>' +
        '<p class="empty__body">Say what you ate or snap the plate. The first one takes ' +
          'about ten seconds and the rest get faster, because it learns what you eat.</p>' +
      '</div>';
  };

  VIEWS.loading = function () {
    return '<div role="status" aria-busy="true" aria-label="Loading today">' +
      '<div class="skel" style="height: 56px; width: 60%"></div>' +
      '<div class="skel mt-2" style="height: var(--sp-4); width: 78%"></div>' +
      '<div class="skel mt-4" style="height: 64px"></div>' +
      '<div class="card mt-4">' +
        '<div class="skel" style="height: var(--sp-4); width: 40%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-2)"></div>' +
        '<div class="skel mt-4" style="height: var(--sp-4); width: 36%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-2)"></div>' +
      '</div></div>';
  };

  VIEWS.error = function () {
    return '<div class="mt-4" data-testid="state-error">' +
      '<div class="banner banner--error">' + ICO.alert +
        '<span><strong>Today did not load</strong>What you logged is on this device and is not lost. ' +
          'The targets need the server and it did not answer.</span></div>' +
      '<button class="btn btn--primary btn--block mt-4" type="button" data-action="retry" data-testid="retry">' +
        '<span class="btn__label">Try again</span></button>' +
      '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="mic" data-testid="log-offline">' +
        '<span class="btn__label">Log anyway, without targets</span></button>' +
    '</div>';
  };

  /* ---------------------------------------------------------------
     Sheets. Both fast paths open one, and both say what they are doing
     rather than spinning.
     --------------------------------------------------------------- */
  /* A logged row, opened. Everything the log knows about one entry, and the
     two things you can do to it: change what it was, or take it back. */
  function mealSheet(m, i) {
    var pct = Math.round(m.kcal / DAY.target * 100);
    return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ml-title" ' +
        'data-detents="0.55 0.88" data-testid="sheet-meal">' +
        '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
        '<div class="sheet__head">' +
          '<span class="fuel-thumb" aria-hidden="true">' + m.icon + '</span>' +
          '<h2 class="t-headline grow" id="ml-title">' + esc(m.name) + '</h2>' +
          '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="meal-close">' +
            '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
          '</button></div>' +
        '<div class="sheet__body">' +
          '<p class="t-detail">Logged at ' + esc(m.at) + ' &middot; ' + pct + '% of today</p>' +
          '<div class="card card--sunken mt-3">' +
            '<div class="hstack hstack--3"><span class="t-body grow">Energy</span>' +
              '<span class="t-body-em num">' + n(m.kcal) + ' kcal</span></div>' +
            '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Protein</span>' +
              '<span class="t-body-em num">' + n(m.pro) + ' g</span></div>' +
            '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Carbs</span>' +
              '<span class="t-body-em num">' + n(m.carb) + ' g</span></div>' +
            '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Fat</span>' +
              '<span class="t-body-em num">' + n(m.fat) + ' g</span></div>' +
          '</div>' +
          '<h3 class="t-label mt-5">Where these numbers came from</h3>' +
          '<p class="t-detail mt-2">' + srcOf(m.src).why + '</p>' +
          '<div class="chiprow mt-4">' +
            /* Symmetric, so a mistake is one tap away from undone: a quarter
               less then a quarter more used to leave the meal 6% smaller,
               because 0.75 x 1.25 is 0.9375. The factors are reciprocal, so
               the pair round-trips. */
            '<button class="chip" type="button" data-action="meal-portion" data-i="' + i + '" data-by="0.8" ' +
              'data-testid="meal-edit">A fifth less</button>' +
            '<button class="chip" type="button" data-action="meal-portion" data-i="' + i + '" data-by="1.25" ' +
              'data-testid="meal-swap">A quarter more</button>' +
          '</div>' +
        '</div>' +
        '<div class="sheet__foot">' +
          '<button class="btn btn--danger btn--block" type="button" data-action="meal-delete" data-i="' + i + '" data-testid="meal-delete">' +
            '<span class="btn__label">Remove this entry</span></button>' +
        '</div>' +
      '</div>';
  }

  function sheetHTML() {
    if (S.sheet && S.sheet.indexOf('meal:') === 0) {
      var m = DAY.meals[+S.sheet.slice(5)];
      return m ? mealSheet(m, +S.sheet.slice(5)) : '';
    }
    if (S.sheet === 'water') {
      var pctW = Math.min(100, Math.round(DAY.waterMl / DAY.waterGoalMl * 100));
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="wt-title" data-testid="sheet-water">' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="wt-title">Water</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="water-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<div class="hstack hstack--2" style="align-items: baseline">' +
              '<p class="money num" data-testid="water-value">' + (DAY.waterMl / 1000).toFixed(2) + '</p>' +
              '<p class="hero__unit grow">of ' + (DAY.waterGoalMl / 1000).toFixed(1) + ' L</p>' +
            '</div>' +
            '<div class="meter mt-3" role="img" aria-label="' + pctW + ' per cent of today&rsquo;s water">' +
              '<span class="meter__fill" style="width:' + pctW + '%"></span></div>' +
            '<div class="hstack hstack--3 mt-4">' +
              '<button class="btn btn--secondary grow" type="button" data-action="water-sub" data-testid="water-sub">' +
                '<span class="btn__label">&minus; 250 ml</span></button>' +
              '<button class="btn btn--primary grow" type="button" data-action="water-add" data-testid="water-add">' +
                '<span class="btn__label">+ 250 ml</span></button>' +
            '</div>' +
            '<p class="t-caption-1 quiet mt-3">A glass is about 250 ml. The target moves with your weight and ' +
              'the weather, not with a round number somebody picked.</p>' +
          '</div>' +
        '</div>';
    }
    if (S.sheet === 'supps') {
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sp-title" ' +
          'data-detents="0.55 0.88" data-testid="sheet-supps">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="sp-title">Supplements</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="supps-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<div class="card card--flush">' + DAY.supps.map(function (sp, i) {
              return '<button class="row" type="button" data-action="supp" data-i="' + i +
                '" aria-pressed="' + sp.taken + '" data-testid="supp-' + i + '">' +
                '<span class="tick"><span class="tick__box">' + (sp.taken ? ICO.tick : '') + '</span></span>' +
                '<span class="row__main stack">' +
                  '<span class="row__title">' + esc(sp.name) + '</span>' +
                  '<span class="row__sub">' + esc(sp.dose) + ' &middot; ' + esc(sp.when) + '</span>' +
                '</span></button>';
            }).join('') + '</div>' +
            '<p class="t-caption-1 quiet mt-3">Whey is in your food log as food, because that is what it is. ' +
              'It sits here so the list matches what is on the shelf.</p>' +
          '</div>' +
        '</div>';
    }
    if (S.sheet === 'trends') {
      var t = DAY.trend, mx = Math.max.apply(null, t), mn = Math.min.apply(null, t);
      var avg = Math.round(t.reduce(function (a, b) { return a + b; }, 0) / t.length);
      var pts = t.map(function (v, i) {
        return (i / (t.length - 1) * 300).toFixed(1) + ',' + (70 - (v - mn) / (mx - mn) * 60).toFixed(1);
      }).join(' ');
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="tr-title" data-testid="sheet-trends">' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="tr-title">Last fourteen days</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="trends-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<div class="hstack hstack--2" style="align-items: baseline">' +
              '<p class="money num" data-testid="trend-avg">' + n(avg) + '</p>' +
              '<p class="hero__unit grow">kcal a day on average</p>' +
            '</div>' +
            '<p class="t-detail mt-2">Target is ' + n(DAY.target) + '. A single day means nothing; ' +
              'fourteen of them are what the target is set from.</p>' +
            '<svg class="chart mt-4" viewBox="0 0 300 80" role="img" ' +
              'aria-label="Daily energy over fourteen days, averaging ' + n(avg) + ' kcal">' +
              '<polyline class="chart__line" points="' + pts + '"/>' +
            '</svg>' +
            '<div class="hstack hstack--3 mt-2">' +
              '<span class="t-meta num grow">' + n(mn) + ' low</span>' +
              '<span class="t-meta num">' + n(mx) + ' high</span>' +
            '</div>' +
          '</div>' +
        '</div>';
    }
    if (S.sheet === 'search') {
      var q = (S.searchQ || '').trim().toLowerCase();
      var hits = searchable().filter(function (f) {
        return !q || f.name.toLowerCase().indexOf(q) !== -1;
      });
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fs-title" ' +
          'data-detents="0.6 0.94" data-testid="sheet-search">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="fs-title">Search foods</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="search-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<input class="field" id="fs-q" type="search" autocomplete="off" ' +
              'placeholder="Chicken, oats, skyr\u2026" aria-label="Search foods" ' +
              'data-testid="search-input" value="' + esc(S.searchQ || '') + '">' +
            '<p class="t-detail quiet mt-2">' + hits.length +
              (hits.length === 1 ? ' food' : ' foods') + ' in this build\u2019s table and your own recipes. ' +
              'A real search reaches a food database; this one does not pretend to.</p>' +
            (hits.length
              ? '<div class="card card--flush mt-3">' + hits.map(function (f, i) {
                  return '<button class="row" type="button" data-action="log-search" data-i="' + i +
                    '" data-testid="search-hit-' + i + '">' +
                    '<span class="fuel-thumb" aria-hidden="true">' + f.icon + '</span>' +
                    '<span class="row__main stack">' +
                      '<span class="row__title">' + esc(f.name) + '</span>' +
                      '<span class="row__sub">' + esc(f.from) + ' \u00b7 ' + n(f.pro) + ' P \u00b7 ' +
                        n(f.carb) + ' C \u00b7 ' + n(f.fat) + ' F</span>' +
                    '</span>' +
                    '<span class="row__value num">' + n(f.kcal) +
                      '<small class="t-caption-2 quiet"> kcal</small></span>' +
                    '<span class="row__chev">' + ICO.plus + '</span></button>';
                }).join('') + '</div>'
              : '<p class="t-body mt-4">Nothing here matches \u201c' + esc(S.searchQ || '') + '\u201d.</p>' +
                '<p class="t-detail quiet mt-1">Snap the plate instead, or build it as a recipe.</p>') +
          '</div>' +
        '</div>';
    }
    if (S.sheet === 'meals') {
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="me-title" ' +
          'data-detents="0.5 0.88" data-testid="sheet-meals">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="me-title">Meals you log often</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="meals-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<p class="t-detail">One tap logs it again with the same portion. This is what makes the ' +
              'second week faster than the first.</p>' +
            '<div class="card card--flush mt-3">' + OFTEN.map(function (r, i) {
              return '<button class="row" type="button" data-action="log-often" data-i="' + i +
                '" data-testid="often-' + i + '">' +
                '<span class="fuel-thumb" aria-hidden="true">' + r.icon + '</span>' +
                '<span class="row__main stack">' +
                  '<span class="row__title">' + esc(r.name) + '</span>' +
                  '<span class="row__sub num">logged ' + r.n + ' times</span>' +
                '</span>' +
                '<span class="row__value num">' + n(r.kcal) +
                  '<small class="t-caption-2 quiet"> kcal</small></span>' +
                /* A plus, not a chevron. A chevron says "this opens something
                   to look at"; this row commits the meal on the tap, which is
                   the whole point of the sheet. */
                '<span class="row__chev">' + ICO.plus + '</span></button>';
            }).join('') + '</div>' +
          '</div>' +
        '</div>';
    }
    /* The barcode path. It is the only way a Verified badge can be earned --
       the badge was rendering on two seeded rows and nothing in the app could
       produce one, which made it a decoration rather than a claim.

       A real scanner is a camera permission and a decoder; what a static
       build can be honest about is the resolve step, which is where the
       Verified claim actually comes from: a code matched a database row, so
       the numbers are the manufacturer's own. */
    /* Recipes. A recipe is a food you built, so the sheet's job is to make
       logging one serving a single tap and to show the arithmetic it did.
       Per-serving figures are derived here and never stored: a stored
       per-serving number disagrees with its own recipe the moment the
       serving count changes. */

    if (S.sheet === 'scan') {
      var f = SCAN;
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sc-title" ' +

              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<div class="hstack hstack--3">' +
              '<span class="fuel-thumb" aria-hidden="true">' + f.icon + '</span>' +
              '<span class="stack stack--1 grow">' +
                '<span class="t-body-em">' + esc(f.name) + '</span>' +
                '<span class="t-caption-1 quiet num">' + esc(f.code) + '</span>' +
              '</span>' +
              badge('verified') +

            '<p class="t-detail mt-4">A barcode matched a database row, so these are the ' +

            '<label class="t-label field__label mt-4" for="scan-servings">Servings</label>' +
            '<input class="input num" id="scan-servings" type="number" min="0.25" max="10" step="0.25" ' +
              'inputmode="decimal" value="' + S.scanServings + '" data-testid="scan-servings">' +
            '<div class="card card--sunken mt-4">' +
              '<div class="hstack hstack--3"><span class="t-body grow">Energy</span>' +
                '<span class="t-body-em num" data-testid="scan-kcal">' +
                  n(Math.round(f.kcal * S.scanServings)) + ' kcal</span></div>' +
              /* All three, because all three are logged. It showed Energy and
                 Protein under the words "these are the manufacturer's own
                 figures" and silently logged 6 g of carbs with them. */
              '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Protein</span>' +
                '<span class="t-body-em num">' + Math.round(f.pro * S.scanServings) + ' g</span></div>' +
              '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Carbs</span>' +
                '<span class="t-body-em num">' + Math.round(f.carb * S.scanServings) + ' g</span></div>' +
              '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Fat</span>' +
                '<span class="t-body-em num">' +
                  (Math.round(f.fat * S.scanServings * 10) / 10) + ' g</span></div>' +
              '<p class="t-caption-1 quiet mt-2">Per ' + esc(f.serving) + ', times the servings above.</p>' +
            '</div>' +
          '</div>' +
          '<div class="sheet__foot">' +

              'data-testid="scan-confirm"><span class="btn__label">Log it</span></button>' +

    if (S.sheet === 'mic') {

        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mic-title" ' +
          'data-detents="0.45 0.88" data-testid="sheet-mic">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +

            '<button class="iconbtn" type="button" data-action="close" aria-label="Stop" data-testid="mic-close">' +

            '</button></div>' +
          '<div class="sheet__body">' +
            '<div class="fuel-listen" data-testid="mic-pulse" aria-hidden="true"><span></span><span></span><span></span></div>' +
            '<p class="t-body-17 mt-4">&ldquo;Chicken rice bowl and a whey shake after the gym&rdquo;</p>' +
            '<p class="t-footnote quiet mt-3">Two meals heard. Times resolve from your session: ' +
              '&ldquo;after the gym&rdquo; is 6:15 today.</p>' +

            '<button class="btn btn--primary btn--block" type="button" data-action="mic-log" data-testid="mic-confirm">' +

          'data-detents="0.6 0.88" data-testid="sheet-cam">' +

              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<p class="t-body-17">Chicken, rice, broccoli. <span class="quiet">About ' +
              n(camPlate().kcal) + ' kcal, ' + camPlate().pro + ' g protein.</span></p>' +
            '<p class="t-caption-1 quiet mt-2">Estimated from the photo, 71% confident.' +
              (S.camOil ? ' Adjusted for ' + { none: 'no oil', little: 'a little oil', lot: 'a lot of oil' }[S.camOil] + '.' : '') +
            '</p>' +
            '<p class="t-label mt-5">Was there oil or sauce?</p>' +
            '<div class="chiprow mt-2">' +
              ['none', 'little', 'lot'].map(function (k, i) {
                return '<button class="chip" type="button" data-action="cam-oil" data-oil="' + k +
                  '" aria-pressed="' + (S.camOil === k ? 'true' : 'false') +
                  '" data-testid="cam-a' + (i + 1) + '">' +
                  ['None', 'A little', 'A lot'][i] + '</button>';
              }).join('') +
            '</div>' +

              'more than 15%. Nothing else is worth interrupting you for.</p>' +

  /* ---------------------------------------------------------------
     Render
     --------------------------------------------------------------- */
  function render() {
    screen.setAttribute('data-state', S.state);
    hdr.classList.add('hdr--large');
    LKPatch(hdr, headerHTML());
    LKPatch(body, (VIEWS[S.state] || VIEWS.populated)());
    LKPatch(overlay, sheetHTML() + toastHTML());
    seedDemoSession(S.state === 'live');
    LKPatch(document.getElementById('shelf-slot'), shelfHTML());
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.state));
    });
    if (window.LKChrome) LKChrome.init(document);
  }

  document.addEventListener('click', function (e) {
    var act = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!act) return;
    var a = act.getAttribute('data-action');
    if (a === 'mic' || a === 'cam') { S.sheet = a; render(); return; }
    if (a === 'scan') { S.sheet = 'scan'; S.scanServings = 1; render(); return; }
    if (a === 'targets') { S.sheet = 'targets'; S.targetError = null; render(); return; }
    if (a === 'targets-save') { saveTargets(); return; }
    if (a === 'scan-log') { scanLog(); return; }
    if (a === 'meal') { S.sheet = 'meal:' + act.getAttribute('data-i'); render(); return; }
    if (a === 'meals' || a === 'trends' || a === 'water' || a === 'supps') { S.sheet = a; render(); return; }
    if (a === 'water-add') { DAY.waterMl = Math.min(4000, DAY.waterMl + 250); render(); return; }
    if (a === 'water-sub') { DAY.waterMl = Math.max(0, DAY.waterMl - 250); render(); return; }
    if (a === 'supp') {
      var k = act.getAttribute('data-i');
      DAY.supps[k].taken = !DAY.supps[k].taken;
      render(); return;
    }
    if (a === 'cam-oil') { S.camOil = act.getAttribute('data-oil'); render(); return; }
    if (a === 'cam-log') { camLog(); return; }
    if (a === 'mic-log') { micLog(); return; }
    if (a === 'log-often') { logOften(+act.getAttribute('data-i')); return; }
    if (a === 'search') {
      S.sheet = 'search'; S.searchQ = ''; render();
      var fq = document.getElementById('fs-q'); if (fq) fq.focus();
      return;
    }
    if (a === 'log-search') {
      var q2 = (S.searchQ || '').trim().toLowerCase();
      var hit = searchable().filter(function (f) {
        return !q2 || f.name.toLowerCase().indexOf(q2) !== -1;
      })[+act.getAttribute('data-i')];
      if (!hit) return;
      addMeal({ icon: hit.icon, name: hit.name, kcal: hit.kcal, pro: hit.pro,
                carb: hit.carb, fat: hit.fat, src: hit.src });
      S.sheet = null;
      say(esc(hit.name) + ' logged, ' + n(hit.kcal) + ' kcal.');
      return;
    }
    if (a === 'meal-portion') { portion(+act.getAttribute('data-i'), parseFloat(act.getAttribute('data-by'))); return; }
    if (a === 'meal-delete') { removeMeal(+act.getAttribute('data-i')); return; }
    if (a === 'undo') { doUndo(); return; }
    if (a === 'resume') {
      /* The shelf exists so a running session is not lost, and it was the one
         control on this screen that did nothing at all. */
      location.href = 'workout-log.html'; return;
    }
    if (a === 'stack') { location.href = 'stack.html'; return; }
    if (a === 'recipes') { S.sheet = 'recipes'; S.recipeOpen = null; render(); return; }
    if (a === 'plan') { S.sheet = 'plan'; render(); return; }
    if (a === 'open-recipe') { S.recipeOpen = +act.getAttribute('data-i'); render(); return; }
    if (a === 'recipes-back') { S.recipeOpen = null; render(); return; }
    /* Through addMeal, like every other logging path on this screen. Writing
       the totals here by hand was the first version of this handler and it
       moved nothing on screen: the day's figure is DAY.eaten and the macro
       bars read DAY.macros, neither of which a direct write to DAY.kcal
       touches. One writer, so a new way to log cannot miss half the state. */
    if (a === 'log-recipe') {
      var lr = RECIPES[+act.getAttribute('data-i')];
      if (!lr) return;
      var sv = function (v) { return Math.round(v / lr.servings); };
      addMeal({ icon: lr.icon, name: lr.name + ', one serving', kcal: sv(lr.kcal),
                pro: sv(lr.pro), carb: sv(lr.carb), fat: sv(lr.fat), src: 'recipe' });
      S.sheet = null; S.recipeOpen = null;
      render();
      say('One serving of ' + lr.name + ' logged, ' + sv(lr.kcal) + ' kcal.');
      return;
    }
    /* A planned meal logs where it stands, so the plan and the day agree
       without the plan having to be a second list of foods. */
    if (a === 'plan-log') {
      var pd = PLAN[+act.getAttribute('data-d')];
      var ps = pd && pd.slots[+act.getAttribute('data-s')];
      if (!ps) return;
      if (slotDone(pd, ps)) { say(ps.name + ' is already logged.'); return; }
      if (!ps.kcal) { say('Nothing planned for ' + ps.at.toLowerCase() + '.'); return; }
      if (pd.iso !== DAY.iso) { say(ps.name + ' is planned for ' + pd.d + ', not today.'); return; }
      /* With the slot's own macros. A planned meal logged without them moved
         the calorie figure and left all three bars where they were, so the
         same chilli was 41 g of protein from Recipes and 0 g from the plan. */
      addMeal({ icon: ps.icon || FOODS[ps.key].icon, name: ps.name, at: ps.at, kcal: ps.kcal,
                pro: ps.pro, carb: ps.carb, fat: ps.fat, src: 'plan' });
      render();
      say(ps.name + ' logged, ' + ps.kcal + ' kcal.');
      return;
    }
    if (a === 'new-recipe') { say('Building a recipe is not in this build yet.'); return; }
    if (a === 'more') {
      /* Standalone this is a page; in the demo the router takes the click
         first. It had no branch at all and was the screen's dead end. */
      location.href = 'shopping.html'; return;
    }
    if (a === 'close') { S.sheet = null; S.camOil = null; render(); return; }
    if (a === 'retry') { S.state = 'loading'; render(); setTimeout(function () { S.state = 'populated'; render(); }, 700); return; }
  });

  /* ---------------------------------------------------------------
     Logging

     Eight controls across the five sheets used to carry data-action="close"
     under copy that promised a write: "Log it", "Log both", "One tap logs it
     again", "Remove this entry". Three of them carried no action at all.
     Each one now does the thing its label says, and the day's totals move
     with it, because a log that does not move the number on the screen is
     indistinguishable from a log that failed.
     --------------------------------------------------------------- */

  /* The plate the camera sheet is looking at. Oil is the one question worth
     interrupting for because it is the one that moves the figure. */
  var CAM_BASE = { name: 'Chicken, rice, broccoli', icon: '🍗', kcal: 690, pro: 54, carb: 78, fat: 18 };
  var OIL = { none: { kcal: -90, fat: -10 }, little: { kcal: 0, fat: 0 }, lot: { kcal: 160, fat: 18 } };
  function camPlate() {
    var d = OIL[S.camOil] || OIL.little;
    return { name: CAM_BASE.name, icon: CAM_BASE.icon, kcal: CAM_BASE.kcal + d.kcal,
             pro: CAM_BASE.pro, carb: CAM_BASE.carb, fat: CAM_BASE.fat + d.fat, src: 'estimate' };
  }

  function nowLabel() {
    var d = new Date();
    var h = d.getHours() % 12 || 12;
    return h + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  }

  /* The record carries every macro it contributed, not just protein. It used
     to keep pro and kcal only, so removing a meal put its calories and its
     protein back and left its carbs and its fat in the day's totals forever
     -- structurally, not as a missed line: there was nothing on the record
     to subtract. Rescaling a portion had the same hole. */
  function addMeal(meal) {
    DAY.meals.push({ icon: meal.icon, name: meal.name, at: meal.at || nowLabel(),
                     pro: meal.pro || 0, carb: meal.carb || 0, fat: meal.fat || 0,
                     kcal: meal.kcal, src: meal.src || 'estimate' });
    recount(DAY);
  }

  function saveTargets() {
    var kcal = parseInt((document.getElementById('tg-kcal') || {}).value, 10);
    if (isNaN(kcal) || kcal < 800 || kcal > 8000) {
      S.targetError = 'Calories between 800 and 8,000.';
      render(); return;
    }
    /* Read every field, validate every field, then write. It used to write
       each macro as it read it and bail on the first bad one, so a rejected
       save still moved the targets either side of the bad field -- the day
       was then measured against a figure nobody had confirmed. */
    var bad = null, want = [];
    DAY.macros.forEach(function (m) {
      var v = parseInt((document.getElementById('tg-' + m.key) || {}).value, 10);
      if (isNaN(v) || v < 0 || v > 1000) { if (!bad) bad = m.name; return; }
      want.push([m, v]);
    });
    if (bad) { S.targetError = bad + ' between 0 and 1,000 ' + 'g.'; render(); return; }
    want.forEach(function (w) { w[0].want = w[1]; });
    DAY.target = kcal;
    S.sheet = null; S.targetError = null;
    say('Targets saved. ' + n(kcal) + ' kcal.');
  }

  function scanLog() {
    var f = SCAN, k = S.scanServings;
    /* Fat to a tenth. Rounded to whole grams, the product's 0.3 g became 0
       and the day's fat bar quietly lost it on every scan. */
    addMeal({ icon: f.icon, name: f.name, kcal: Math.round(f.kcal * k),
              pro: Math.round(f.pro * k), carb: Math.round(f.carb * k),
              fat: Math.round(f.fat * k * 10) / 10, src: 'verified' });
    S.sheet = null;
    say(esc(f.name) + ' logged, ' + n(Math.round(f.kcal * k)) + ' kcal. Verified.');
  }

  function camLog() {
    var plate = camPlate();
    addMeal(plate);
    S.sheet = null; S.camOil = null;
    say(esc(plate.name) + ' logged, ' + n(plate.kcal) + ' kcal.');
  }

  function micLog() {
    /* The two the sheet says it heard, with the times it says it resolved. */
    var heard = [FOODS.bowl, FOODS.shake];
    heard.forEach(function (f) {
      addMeal({ icon: f.icon, name: f.name, at: '6:15', pro: f.pro, carb: f.carb,
                fat: f.fat, kcal: f.kcal, src: 'estimate' });
    });
    S.sheet = null;
    say('Two meals logged, ' + n(heard[0].kcal + heard[1].kcal) + ' kcal.');
  }

  function logOften(i) {
    var r = OFTEN[i];
    if (!r) return;
    r.n += 1;
    /* 'repeat', not 'verified'. Logging a home-cooked meal again earns no new
       evidence, and stamping Verified on it told the reader a barcode had
       matched a database row -- a scan that never happened, on the same food
       the original entry calls an Estimate. */
    addMeal({ icon: r.icon, name: r.name, pro: r.pro, carb: r.carb, fat: r.fat, kcal: r.kcal, src: 'repeat' });
    S.sheet = null;
    say(esc(r.name) + ' logged again.');
  }

  /* A portion, not a rewrite. Scaling every figure by the same factor is the
     honest edit: the plate was the plate, there was just more or less of it. */
  /* `by` is the factor itself, not a delta. 0.8 and 1.25 are reciprocals, so
     one then the other returns the meal to where it started. */
  function portion(i, f) {
    var m = DAY.meals[i];
    if (!m || !f) return;
    var d = {};
    ['kcal', 'pro', 'carb', 'fat'].forEach(function (k) {
      d[k] = Math.round((m[k] || 0) * f) - (m[k] || 0);
      m[k] = (m[k] || 0) + d[k];
    });
    recount(DAY);
    /* say() renders. Rendering here as well was two full passes a tap. */
    say(esc(m.name) + ' is now ' + n(m.kcal) + ' kcal.');
  }

  function removeMeal(i) {
    var m = DAY.meals[i];
    if (!m) return;
    DAY.meals.splice(i, 1);
    recount(DAY);
    S.sheet = null;
    /* Destructive, so it is undoable rather than confirmed: a confirm asks a
       question the person already answered by pressing a red button. */
    say(esc(m.name) + ' removed.', function () {
      DAY.meals.splice(i, 0, m);
      recount(DAY);
    });
  }

  var toastTimer = null;
  /* say(msg, undo). The undo belongs to THIS message and to nothing else.
     removeMeal was the only writer of S.undo and say() never cleared it, so
     logging anything within six seconds of a delete produced a toast reading
     "Chicken, rice, broccoli logged" with an Undo that put the deleted meal
     back: three rows became four. An action that cannot be taken back says
     so by passing nothing. */
  function say(msg, undo) {
    S.toast = msg;
    S.undo = undo || null;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; S.undo = null; render(); }, 6000);
  }
  function doUndo() {
    if (S.undo) S.undo();
    S.undo = null; S.toast = null;
    render();
  }
  function toastHTML() {
    if (!S.toast) return '';
    return '<div class="toast" role="status" data-testid="toast">' +
      '<span class="toast__body">' + S.toast + '</span>' +
      (S.undo ? '<button class="toast__action" type="button" data-action="undo" data-testid="undo">Undo</button>' : '') +
    '</div>';
  }

  /* The servings field re-renders the figures under it as it is typed, and
     LKPatch keeps the caret. */
  document.addEventListener('input', function (e) {
    if (e.target.id === 'fs-q') {
      S.searchQ = e.target.value;
      render();
      /* Re-render replaces the field, so the caret has to be put back where
         the typist left it or every keystroke jumps to the start. */
      var f = document.getElementById('fs-q');
      if (f) { f.focus(); try { f.setSelectionRange(f.value.length, f.value.length); } catch (err) {} }
      return;
    }
    if (e.target.id !== 'scan-servings') return;
    var v = parseFloat(e.target.value);
    S.scanServings = (isNaN(v) || v <= 0) ? 1 : Math.min(10, v);
    render();
  });

  document.addEventListener('keydown', function (e) {
    /* Same reset as the close action. They disagreed: Escape left S.camOil
       set, so a brand-new photo opened already carrying the last plate's
       answer to the oil question -- and said so in its own caption. */
    if (e.key === 'Escape' && S.sheet) { S.sheet = null; S.camOil = null; render(); }
  });

  var STATES = [
    ['populated', 'Populated'], ['live', 'Session running'],
    ['first-weeks', 'First two weeks'],
    /* Stack is off by default and its chip does not exist until it is on, so
       without a state that turns the gate on there is no way to reach it --
       not in the demo, and not for the crossing check, which reads every
       declared state looking for the control a crossing names. */
    ['stack-on', 'Stack tracking on'],
    ['hidden', 'Numbers hidden'], ['empty', 'Empty'],
    ['loading', 'Loading'], ['error', 'Error']
  ];
  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join(''));
  document.getElementById('dev-toggle').addEventListener('click', function () {
    var open = menu.hidden;
    menu.hidden = !open;
    this.setAttribute('aria-expanded', String(open));
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (!b) return;
    /* stack-on is a gate, not a view: it turns lk_perfTracking on and then
       shows the populated screen, which now carries the Stack chip. */
    if (b.dataset.state === 'stack-on') {
      try { localStorage.setItem('lk_perfTracking', 'true'); } catch (e) {}
      S.state = 'populated';
    } else {
      S.state = b.dataset.state;
    }
    S.sheet = null;
    S.camOil = null;
    S.toast = null;
    S.undo = null;
    /* The day is a fixture and every state reads the same one, so anything
       logged, deleted or rescaled in one state was still there in the next --
       switching to Empty after logging a meal showed a day that was not
       empty. A state switch is a fresh screen, so it gets a fresh day. */
    DAY = day();
    render();
  });

  /* Settings owns "Show calorie numbers" and writes it where this screen can
     see it, the same way the theme is shared. It is the DEFAULT here: the
     dev switcher still overrides, because that is what the switcher is for. */
  try {
    if (localStorage.getItem('lk_fuelNumbers') === 'false') S.state = 'hidden';
  } catch (e) {}

  var p = new URLSearchParams(location.search);
  if (p.get('state') && VIEWS[p.get('state')]) S.state = p.get('state');
  render();
  requestAnimationFrame(function () { window.__ready = true; });
})();

  /* The strip's clock, on a screen that only repaints when something on it
     changes. Without this the shelf freezes at whatever second you arrived. */
  if (window.LKSession) {
    var shelfWas = null;
    window.setInterval(function () {
      var now = LKSession.html();
      if (now === shelfWas) return;
      shelfWas = now;
      LKPatch(document.getElementById('shelf-slot'), now);
    }, 1000);
  }
</script>
</body>
</html>
