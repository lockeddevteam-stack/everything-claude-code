          '</div>' +
          '<div class="sheet__foot">' +
            '<button class="btn btn--primary btn--block" type="button" data-action="fp-save" ' +
              'data-testid="fp-save"><span class="btn__label">Save' +
              (macroMode === 'auto' ? ' and use these targets' : '') + '</span></button>' +
          '</div>' +
        '</div>';
    }

    /* The last resort, and every food app needs one. Nothing matched, nothing
       scanned, and the packet is in your hand: type the four numbers off it.
       Add stays disabled until there is a name and a calorie figure, because
       an entry with neither is a row in the diary that means nothing and can
       never be reconciled with anything. */
    if (S.sheet === 'manual') {
      var mn = S.man || { name: '', kcal: '', pro: '', carb: '', fat: '', error: null };
      var mOk = mn.name.trim().length > 0 && +mn.kcal > 0;
      var mSlot = S.logSlot || slotForNow();
      var fld = function (k, label, unit, max) {
        return '<label class="t-label field__label mt-3" for="mn-' + k + '">' + label + '</label>' +
          '<input class="input num" id="mn-' + k + '" type="number" min="0" max="' + max + '" ' +
            'step="1" inputmode="numeric" value="' + esc(String(mn[k])) + '" ' +
            'data-testid="mn-' + k + '">' +
          (unit ? '<p class="t-caption-1 quiet mt-1">' + unit + '</p>' : '');
      };
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mn-title" ' +
          'data-detents="0.6 0.94" data-testid="sheet-manual">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="mn-title">Type the numbers</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="mn-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<p class="t-detail">For the things the table has never heard of. Read them off the ' +
              'packet, or off the menu. It goes in as an estimate, because that is what it is.</p>' +
            '<label class="t-label field__label mt-4" for="mn-name">What it was</label>' +
            '<input class="input" id="mn-name" type="text" autocomplete="off" ' +
              'placeholder="Chicken katsu, the one from work" value="' + esc(mn.name) + '" ' +
              'data-testid="mn-name">' +
            fld('kcal', 'Calories', 'kcal. The one figure this cannot be left without.', 8000) +
            fld('pro', 'Protein', 'grams. Leave it at nothing if the packet does not say.', 500) +
            fld('carb', 'Carbs', 'grams', 800) +
            fld('fat', 'Fat', 'grams', 400) +
            slotPicker(mSlot, 'pick-slot', 'mn-slot') +
            (mn.error ? '<p class="field__error mt-2" role="alert" data-testid="mn-error">' +
              esc(mn.error) + '</p>' : '') +
          '</div>' +
          '<div class="sheet__foot">' +
            '<button class="btn btn--primary btn--block" type="button" data-action="mn-add" ' +
              (mOk ? '' : 'disabled ') + 'data-testid="mn-add">' +
              '<span class="btn__label">' + (mOk
                ? 'Add to ' + esc(slotName(mSlot).toLowerCase())
                : 'A name and a calorie figure first') + '</span></button>' +
          '</div>' +
        '</div>';
    }

    /* One food, at the amount you actually had. The search sheet could only
       log a standard serving, so "half a bowl" was logged as a bowl and then
       corrected with a portion chip afterwards, if at all. Everything here
       scales from the food's own per-100 g figures, so the grams field and
       the chips cannot disagree: the chips just fill the field. */
    if (S.sheet && S.sheet.indexOf('food:') === 0) {
      var fk = S.sheet.slice(5), ff = FOODS[fk];
      if (!ff) return '';
      var grams = S.foodG || ff.g;
      var k100 = grams / 100;
      var per100 = function (v) { return Math.round(v / ff.g * 100 * 10) / 10; };
      var at = function (v) { return Math.round(v / ff.g * grams * 10) / 10; };
      var chips = [
        ['Half', Math.round(ff.g / 2)], ['Three quarters', Math.round(ff.g * 0.75)],
        ['One serving', ff.g], ['One and a half', Math.round(ff.g * 1.5)],
        ['Two servings', ff.g * 2], ['100 g', 100], ['200 g', 200]
      ];
      var slotNow = S.logSlot || slotForNow();
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fd-title" ' +
          'data-detents="0.6 0.94" data-testid="sheet-food">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="fd-title">' + esc(ff.name) + '</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="fd-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<label class="t-label field__label" for="fd-g">How much of it</label>' +
            '<input class="input num" id="fd-g" type="number" min="1" max="3000" step="5" ' +
              'inputmode="numeric" value="' + grams + '" data-testid="fd-grams">' +
            '<p class="t-caption-1 quiet mt-1">Grams. A serving is ' + n(ff.g) + ' g.</p>' +
            '<div class="chiprow mt-3">' + chips.map(function (c, ci) {
              return '<button class="chip' + (grams === c[1] ? ' chip--on' : '') + '" type="button" ' +
                'data-action="fd-chip" data-g="' + c[1] + '" data-testid="fd-chip-' + ci + '">' +
                esc(c[0]) + '</button>';
            }).join('') + '</div>' +
            '<div class="card card--sunken mt-4" data-testid="fd-figures">' +
              '<div class="hstack hstack--3"><span class="t-body grow">Energy</span>' +
                '<span class="t-body-em num">' + n(Math.round(at(ff.kcal))) + ' kcal</span></div>' +
              '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Protein</span>' +
                '<span class="t-body-em num">' + n(at(ff.pro)) + ' g</span></div>' +
              '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Carbs</span>' +
                '<span class="t-body-em num">' + n(at(ff.carb)) + ' g</span></div>' +
              '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Fat</span>' +
                '<span class="t-body-em num">' + n(at(ff.fat)) + ' g</span></div>' +
              '<p class="t-caption-1 quiet mt-2">Per 100 g: ' + n(per100(ff.kcal)) + ' kcal, ' +
                n(per100(ff.pro)) + ' P, ' + n(per100(ff.carb)) + ' C, ' + n(per100(ff.fat)) + ' F. ' +
                'Everything above is that, times ' + (Math.round(k100 * 100) / 100) + '.</p>' +
            '</div>' +
            slotPicker(slotNow, 'pick-slot', 'fd-slot') +
          '</div>' +
          '<div class="sheet__foot">' +
            '<button class="btn btn--primary btn--block" type="button" data-action="fd-log" ' +
              'data-testid="fd-log"><span class="btn__label">Log to ' +
              esc(slotName(slotNow).toLowerCase()) + '</span></button>' +
          '</div>' +
        '</div>';
    }

    if (S.sheet === 'build-recipe') {
      var d = S.draft || { name: '', servings: 4, items: [], notes: [], error: null };
      var dt = draftTotals(d);
      var per = d.servings > 0 ? d.servings : 1;
      var canSave = d.name.trim().length > 0 && d.items.length > 0;
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="br-title" ' +
          'data-detents="0.7 0.94" data-testid="sheet-build-recipe">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="br-title">Build a recipe</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="br-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<label class="t-label field__label" for="br-name">What is it called</label>' +
            '<input class="input" id="br-name" type="text" autocomplete="off" ' +
              'placeholder="Chilli, big batch" value="' + esc(d.name) + '" data-testid="br-name">' +
            '<label class="t-label field__label mt-3" for="br-servings">How many servings it makes</label>' +
            '<input class="input num" id="br-servings" type="number" min="1" max="24" step="1" ' +
              'inputmode="numeric" value="' + per + '" data-testid="br-servings">' +
            '<h3 class="t-label mt-5">Ingredients</h3>' +
            (d.items.length || d.notes.length
              ? '<div class="card card--flush mt-2">' +
                d.items.map(function (it, i) {
                  var f = FOODS[it.key];
                  return '<div class="row row--withaside">' +
                    '<span class="row__main stack">' +
                      '<span class="row__title">' + esc(f.name) + '</span>' +
                      '<span class="row__sub num">' + it.qty + ' \u00d7 ' + n(f.kcal) + ' kcal</span>' +
                    '</span>' +
                    '<button class="iconbtn" type="button" data-action="br-less" data-i="' + i + '" ' +
                      'aria-label="One less ' + esc(f.name) + '" data-testid="br-less-' + i + '">' +
                      '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>' +
                    '<button class="iconbtn" type="button" data-action="br-more" data-i="' + i + '" ' +
                      'aria-label="One more ' + esc(f.name) + '" data-testid="br-more-' + i + '">' +
                      ICO.plus + '</button>' +
                  '</div>';
                }).join('') +
                d.notes.map(function (t, i) {
                  return '<div class="row row--withaside">' +
                    '<span class="row__main stack">' +
                      '<span class="row__title">' + esc(t) + '</span>' +
                      '<span class="row__sub">not in the food table, counted as zero</span>' +
                    '</span>' +
                    '<button class="iconbtn" type="button" data-action="br-drop-note" data-i="' + i + '" ' +
                      'aria-label="Remove ' + esc(t) + '" data-testid="br-drop-note-' + i + '">' +
                      '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
                  '</div>';
                }).join('') + '</div>'
              : '<p class="t-detail quiet mt-2">Nothing in it yet. Add what the whole batch is made ' +
                'of, not one plateful \u2014 the servings figure above does the dividing.</p>') +
            '<h3 class="t-label mt-5">Add from the food table</h3>' +
            '<div class="chiprow mt-2">' + Object.keys(FOODS).map(function (k) {
              return '<button class="chip" type="button" data-action="br-add" data-k="' + k + '" ' +
                'data-testid="br-add-' + k + '">' + esc(FOODS[k].name) + '</button>';
            }).join('') + '</div>' +
            '<label class="t-label field__label mt-4" for="br-note">Anything else in it</label>' +
            '<div class="hstack hstack--2">' +
              '<input class="input grow" id="br-note" type="text" autocomplete="off" ' +
                'placeholder="2 tbsp olive oil" data-testid="br-note">' +
              '<button class="btn btn--secondary" type="button" data-action="br-add-note" ' +
                'data-testid="br-add-note"><span class="btn__label">Add</span></button>' +
            '</div>' +
            '<div class="card card--sunken mt-4" data-testid="br-totals">' +
              '<div class="hstack hstack--3"><span class="t-body grow">One serving</span>' +
                '<span class="t-body-em num">' + n(Math.round(dt.kcal / per)) + ' kcal</span></div>' +
              '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Protein, carbs, fat</span>' +
                '<span class="t-body-em num">' + n(Math.round(dt.pro / per)) + ' \u00b7 ' +
                  n(Math.round(dt.carb / per)) + ' \u00b7 ' + n(Math.round(dt.fat / per)) + ' g</span></div>' +
              '<p class="t-caption-1 quiet mt-2">The whole batch is ' + n(Math.round(dt.kcal)) +
                ' kcal, divided by ' + per + '.</p>' +
            '</div>' +
            (d.error ? '<p class="field__error mt-2" role="alert" data-testid="br-error">' +
              esc(d.error) + '</p>' : '') +
          '</div>' +
          '<div class="sheet__foot">' +
            '<button class="btn btn--primary btn--block" type="button" data-action="br-save" ' +
              (canSave ? '' : 'disabled ') + 'data-testid="br-save">' +
              '<span class="btn__label">Save this recipe</span></button>' +
          '</div>' +
        '</div>';
    }

    if (S.sheet && S.sheet.indexOf('swap:') === 0) {
      var sp = S.sheet.slice(5).split(',');
      var sd = PLAN[+sp[0]], ss = sd && sd.slots[+sp[1]];
      if (!sd || !ss) return '';
      var opts = swapChoices(ss.key);
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sw-title" ' +
          'data-detents="0.6 0.94" data-testid="sheet-swap">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="sw-title">Swap ' +
              esc(ss.at.toLowerCase()) + ' on ' + esc(sd.d) + '</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="swap-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<p class="t-detail">Currently ' + esc(ss.name) + ', ' + n(ss.kcal) + ' kcal. ' +
              'The difference each swap makes to the day is beside it.</p>' +
            '<div class="card card--flush mt-3">' + opts.map(function (f, i) {
              var diff = f.kcal - ss.kcal;
              return '<button class="row" type="button" data-action="swap-pick" data-i="' + i +
                '" data-testid="swap-' + i + '">' +
                '<span class="fuel-thumb" aria-hidden="true">' + f.icon + '</span>' +
                '<span class="row__main stack">' +
                  '<span class="row__title">' + esc(f.name) + '</span>' +
                  '<span class="row__sub">' + n(f.pro) + ' P \u00b7 ' + n(f.carb) + ' C \u00b7 ' +
                    n(f.fat) + ' F</span>' +
                '</span>' +
                '<span class="row__value num">' + (diff > 0 ? '+' : diff < 0 ? '\u2212' : '\u00b1') +
                  n(Math.abs(diff)) + '<small class="t-caption-2 quiet"> kcal</small></span>' +
              '</button>';
            }).join('') + '</div>' +
          '</div>' +
        '</div>';
    }

    if (S.sheet === 'targets') {
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="tg-title" ' +
          'data-detents="0.5 0.88" data-testid="sheet-targets">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="tg-title">Daily targets</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="targets-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<p class="t-detail">Your numbers, not a formula&rsquo;s. Change one and the day is ' +
              'measured against it from now on.</p>' +
            '<label class="t-label field__label mt-4" for="tg-kcal">Calories</label>' +
            '<input class="input num" id="tg-kcal" type="number" min="800" max="8000" step="10" ' +
              'inputmode="numeric" value="' + DAY.target + '" data-testid="tg-kcal">' +
            DAY.macros.map(function (m) {
              return '<label class="t-label field__label mt-3" for="tg-' + m.key + '">' +
                  esc(m.name) + ', ' + m.unit + '</label>' +
                '<input class="input num" id="tg-' + m.key + '" type="number" min="0" max="1000" step="5" ' +
                  'inputmode="numeric" value="' + m.want + '" data-testid="tg-' + m.key + '">';
            }).join('') +
            (S.targetError ? '<p class="field__error mt-2" role="alert" data-testid="tg-error">' +
              esc(S.targetError) + '</p>' : '') +
          '</div>' +
          '<div class="sheet__foot">' +
            '<button class="btn btn--primary btn--block" type="button" data-action="targets-save" ' +
              'data-testid="targets-save"><span class="btn__label">Save targets</span></button>' +
          '</div>' +
        '</div>';
    }
    if (S.sheet === 'scan') {
      var f = SCAN;
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sc-title" ' +
          'data-testid="sheet-scan">' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="sc-title">Scanned</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="scan-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<div class="hstack hstack--3">' +
              '<span class="fuel-thumb" aria-hidden="true">' + f.icon + '</span>' +
              '<span class="stack stack--1 grow">' +
                '<span class="t-body-em">' + esc(f.name) + '</span>' +
                '<span class="t-caption-1 quiet num">' + esc(f.code) + '</span>' +
              '</span>' +
              badge('verified') +
            '</div>' +
            '<p class="t-detail mt-4">A barcode matched a database row, so these are the ' +
              'manufacturer&rsquo;s own figures. They are only wrong if the portion is.</p>' +
            '<label class="t-label field__label mt-4" for="scan-servings">Servings</label>' +
            '<input class="input num" id="scan-servings" type="number" min="0.25" max="10" step="0.25" ' +
              'inputmode="decimal" value="' + S.scanServings + '" data-testid="scan-servings">' +
            '<div class="card card--sunken mt-4">' +
              '<div class="hstack hstack--3"><span class="t-body grow">Energy</span>' +
                '<span class="t-body-em num" data-testid="scan-kcal">' +
                  n(Math.round(f.kcal * S.scanServings)) + ' kcal</span></div>' +
              /* All three, because all three are logged. It showed Energy and
                 Protein under the words "these are the manufacturer's own
                 figures" and silently logged 6 g of carbs with them. */
              '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Protein</span>' +
                '<span class="t-body-em num">' + Math.round(f.pro * S.scanServings) + ' g</span></div>' +
              '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Carbs</span>' +
                '<span class="t-body-em num">' + Math.round(f.carb * S.scanServings) + ' g</span></div>' +
              '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Fat</span>' +
                '<span class="t-body-em num">' +
                  (Math.round(f.fat * S.scanServings * 10) / 10) + ' g</span></div>' +
              '<p class="t-caption-1 quiet mt-2">Per ' + esc(f.serving) + ', times the servings above.</p>' +
            '</div>' +
          '</div>' +
          '<div class="sheet__foot">' +
            '<button class="btn btn--primary btn--block" type="button" data-action="scan-log" ' +
              'data-testid="scan-confirm"><span class="btn__label">Log it</span></button>' +
          '</div>' +
        '</div>';
    }
    if (S.sheet === 'mic') {
      /* The transcript is a field, not a caption. Speech recognition needs a
         real microphone and a real engine; the SENTENCE is what this screen
         can honestly work on, so it is editable and parsed for real. The
         sheet used to show one canned line and log two fixed foods whatever
         it said. */
      if (S.micText === undefined || S.micText === null) S.micText = '';
      var items = S.micItems || [];
      var hit = items.filter(function (it) { return it.key; });
      var miss = items.filter(function (it) { return !it.key; });
      var tot = hit.reduce(function (a, it) { return a + it.kcal; }, 0);
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mic-title" ' +
          'data-detents="0.6 0.94" data-testid="sheet-mic">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="mic-title">Say it, or type it</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Stop" data-testid="mic-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<label class="t-label field__label" for="mic-text">What you ate</label>' +
            '<input class="input" id="mic-text" type="text" autocomplete="off" ' +
              'placeholder="2 eggs and toast with a whey shake" ' +
              'value="' + esc(S.micText) + '" data-testid="mic-text">' +
            '<p class="t-caption-1 quiet mt-2">Dictation belongs to the keyboard, which has a ' +
              'microphone on it. What this screen does is read the sentence: quantities, units ' +
              'and foods, matched against the table. It does not reach a speech service.</p>' +
            '<div class="chiprow mt-3">' +
              ['2 eggs and toast', 'chicken rice bowl and a whey shake', '200 g chilli'].map(function (t, ti) {
                return '<button class="chip" type="button" data-action="mic-eg" data-t="' + esc(t) + '" ' +
                  'data-testid="mic-eg-' + ti + '">' + esc(t) + '</button>';
              }).join('') + '</div>' +
            (items.length
              ? '<h3 class="t-label mt-5">What that reads as</h3>' +
                '<div class="card card--flush mt-2" data-testid="mic-preview">' +
                  items.map(function (it, i) {
                    return '<div class="row row--withaside">' +
                      '<span class="fuel-thumb" aria-hidden="true">' + (it.icon || '\u2753') + '</span>' +
                      '<span class="row__main stack">' +
                        '<span class="row__title">' + esc(it.key ? it.name : it.raw) + '</span>' +
                        '<span class="row__sub">' + (it.key
                          ? n(it.grams) + ' g \u00b7 ' + n(it.pro) + ' P \u00b7 ' + n(it.carb) +
                            ' C \u00b7 ' + n(it.fat) + ' F'
                          : 'nothing in the table matches this, so it is not counted') + '</span>' +
                      '</span>' +
                      (it.key ? '<span class="row__value num">' + n(it.kcal) +
                        '<small class="t-caption-2 quiet"> kcal</small></span>' : '') +
                      '<button class="iconbtn" type="button" data-action="mic-drop" data-i="' + i + '" ' +
                        'aria-label="Remove ' + esc(it.key ? it.name : it.raw) + '" ' +
                        'data-testid="mic-drop-' + i + '">' +
                        '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
                    '</div>';
                  }).join('') + '</div>' +
                '<p class="t-detail quiet mt-2" data-testid="mic-sum">' + hit.length +
                  (hit.length === 1 ? ' item' : ' items') + ', ' + n(tot) + ' kcal' +
                  (miss.length ? ' \u00b7 ' + miss.length + ' not recognised and not counted' : '') +
                  '.</p>' +
                slotPicker(S.logSlot || slotForNow(), 'pick-slot', 'mic-slot')
              : '<p class="t-detail quiet mt-4">Type a sentence and it will be read out into ' +
                'items here before anything is logged.</p>') +
            '<button class="btn btn--secondary btn--block mt-4" type="button" data-action="manual" ' +
              'data-testid="mic-manual"><span class="btn__label">Type the numbers by hand</span></button>' +
          '</div>' +
          '<div class="sheet__foot">' +
            '<button class="btn btn--primary btn--block" type="button" data-action="mic-log" ' +
              (hit.length ? '' : 'disabled ') + 'data-testid="mic-confirm">' +
              '<span class="btn__label">' + (hit.length
                ? 'Log ' + hit.length + (hit.length === 1 ? ' item' : ' items') + ', ' + n(tot) + ' kcal'
                : 'Nothing to log yet') + '</span></button>' +
          '</div>' +
        '</div>';
    }
    if (S.sheet === 'cam') {
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cam-title" ' +
          'data-detents="0.6 0.88" data-testid="sheet-cam">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="cam-title">What is on the plate</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="cam-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<p class="t-body-17">Chicken, rice, broccoli. <span class="quiet">About ' +
              n(camPlate().kcal) + ' kcal, ' + camPlate().pro + ' g protein.</span></p>' +
            '<p class="t-caption-1 quiet mt-2">Estimated from the photo, 71% confident.' +
              (S.camOil ? ' Adjusted for ' + { none: 'no oil', little: 'a little oil', lot: 'a lot of oil' }[S.camOil] + '.' : '') +
            '</p>' +
            '<p class="t-label mt-5">Was there oil or sauce?</p>' +
            '<div class="chiprow mt-2">' +
              ['none', 'little', 'lot'].map(function (k, i) {
                return '<button class="chip" type="button" data-action="cam-oil" data-oil="' + k +
                  '" aria-pressed="' + (S.camOil === k ? 'true' : 'false') +
                  '" data-testid="cam-a' + (i + 1) + '">' +
                  ['None', 'A little', 'A lot'][i] + '</button>';
              }).join('') +
            '</div>' +
            '<p class="t-caption-1 quiet mt-3">One question, asked because oil moves this plate by ' +
              'more than 15%. Nothing else is worth interrupting you for.</p>' +
          '</div>' +
          '<div class="sheet__foot">' +
            '<button class="btn btn--primary btn--block" type="button" data-action="cam-log" data-testid="cam-confirm">' +
              '<span class="btn__label">Log it</span></button>' +
          '</div>' +
        '</div>';
    }
    return '';
  }

  /* ---------------------------------------------------------------
     Render
     --------------------------------------------------------------- */
  function render() {
    screen.setAttribute('data-state', S.state);
    hdr.classList.add('hdr--large');
    LKPatch(hdr, headerHTML());
    LKPatch(body, (VIEWS[S.state] || VIEWS.populated)());
    LKPatch(overlay, sheetHTML() + toastHTML());
    seedDemoSession(S.state === 'live');
    LKPatch(document.getElementById('shelf-slot'), shelfHTML());
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.state));
    });
    if (window.LKChrome) LKChrome.init(document);
  }

  document.addEventListener('click', function (e) {
    var act = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!act) return;
    var a = act.getAttribute('data-action');
    if (a === 'mic') { S.sheet = 'mic'; S.micText = ''; S.micItems = null; render(); return; }
    if (a === 'cam') { S.sheet = 'cam'; render(); return; }
    if (a === 'scan') { S.sheet = 'scan'; S.scanServings = 1; render(); return; }
    if (a === 'targets') { S.sheet = 'targets'; S.targetError = null; render(); return; }
    if (a === 'targets-save') { saveTargets(); return; }
    if (a === 'scan-log') { scanLog(); return; }
    if (a === 'meal') { S.sheet = 'meal:' + act.getAttribute('data-i'); render(); return; }
    if (a === 'meals' || a === 'trends' || a === 'water' || a === 'supps') { S.sheet = a; render(); return; }
    if (a === 'water-add') { DAY.waterMl = Math.min(4000, DAY.waterMl + 250); saveDay(); render(); return; }
    if (a === 'water-sub') { DAY.waterMl = Math.max(0, DAY.waterMl - 250); saveDay(); render(); return; }
    if (a === 'supp') {
      var k = act.getAttribute('data-i');
      DAY.supps[k].taken = !DAY.supps[k].taken;
      saveDay();
      render(); return;
    }
    if (a === 'cam-oil') { S.camOil = act.getAttribute('data-oil'); render(); return; }
    if (a === 'cam-log') { camLog(); return; }
    if (a === 'mic-log') { micLog(); return; }
    if (a === 'log-often') { logOften(+act.getAttribute('data-i')); return; }
    if (a === 'search') {
      S.sheet = 'search'; S.searchQ = ''; render();
      var fq = document.getElementById('fs-q'); if (fq) fq.focus();
      return;
    }
    if (a === 'log-search') {
      var q2 = (S.searchQ || '').trim().toLowerCase();
      var hit = searchHits(q2)[+act.getAttribute('data-i')];
      if (!hit) return;
      addMeal(withMicros({ key: hit.key || null, icon: hit.icon, name: hit.name, kcal: hit.kcal,
                pro: hit.pro, carb: hit.carb, fat: hit.fat, src: hit.src,
                slot: S.logSlot || slotForNow() }, hit));
      S.sheet = null;
      say(esc(hit.name) + ' logged, ' + n(hit.kcal) + ' kcal.');
      return;
    }
    if (a === 'plan-day') {
      var pd2 = +act.getAttribute('data-d');
      S.planOpen = S.planOpen === pd2 ? -1 : pd2;
      render(); return;
    }
    if (a === 'plan-shop') { addPlanToShop(PLAN); return; }
    if (a === 'plan-log-day') {
      var pdd = PLAN[+act.getAttribute('data-d')];
      if (!pdd) return;
      /* Only what is not already logged, or logging a day twice doubles the
         meals that were already on the list. */
      var todo = pdd.slots.filter(function (sl) { return !slotDone(pdd, sl); });
      if (!todo.length) { say('All of ' + pdd.d + ' is already logged.'); return; }
      var kc = 0;
      todo.forEach(function (sl) {
        var pf = FOODS[sl.key];
        addMeal(withMicros({ key: sl.key, icon: pf.icon, name: sl.name, at: sl.at,
                             kcal: sl.kcal, pro: sl.pro, carb: sl.carb, fat: sl.fat,
                             src: 'plan', slot: sl.slot }, pf));
        kc += sl.kcal;
      });
      render();
      say(todo.length + ' meals logged, ' + n(kc) + ' kcal.');
      return;
    }
    if (a === 'plan-swap') {
      S.sheet = 'swap:' + act.getAttribute('data-d') + ',' + act.getAttribute('data-s');
      render(); return;
    }
    if (a === 'swap-pick') {
      var wp = String(S.sheet).slice(5).split(',');
      var wd = PLAN[+wp[0]], ws = wd && wd.slots[+wp[1]];
      var pick = ws && swapChoices(ws.key)[+act.getAttribute('data-i')];
      if (!ws || !pick) return;
      var was = ws.name;
      var pf = FOODS[pick.key];
      ws.key = pick.key; ws.name = pf.name; ws.kcal = pf.kcal;
      ws.pro = pf.pro; ws.carb = pf.carb; ws.fat = pf.fat;
      savePlan();
      S.sheet = 'plan';
      render();
      say(was + ' swapped for ' + pf.name + '.');
      return;
    }
    if (a === 'trend-range') { S.trendRange = +act.getAttribute('data-r'); render(); return; }
    if (a === 'fuel-profile') { S.fp = fuelProfile(); S.sheet = 'fuel-profile'; render(); return; }
    if (a === 'fp-sex' || a === 'fp-act' || a === 'fp-goal' || a === 'fp-mm') {
      readFP();
      var fpk = { 'fp-sex': 'sex', 'fp-act': 'activity', 'fp-goal': 'goal', 'fp-mm': 'macroMode' }[a];
      S.fp[fpk] = act.getAttribute('data-v');
      render(); return;
    }
    if (a === 'fp-save') { saveFuelProfile(); return; }
    if (a === 'water-add5') { DAY.waterMl = Math.min(4000, DAY.waterMl + 500); saveDay(); render(); return; }
    if (a === 'water-unit') {
      var fp = stored('lk_fuelProfile', {}) || {};
      if (ST && persisting()) ST.patch('lk_fuelProfile', { flOz: !fp.flOz });
      render(); return;
    }
    if (a === 'weigh-in') { weighIn(); return; }
    if (a === 'suggest-log') {
      var sk = act.getAttribute('data-k'), sf = FOODS[sk];
      if (!sf) return;
      addMeal(withMicros({ key: sk, icon: sf.icon, name: sf.name, kcal: sf.kcal,
                           pro: sf.pro, carb: sf.carb, fat: sf.fat, src: 'table' }, sf));
      render();
      say(esc(sf.name) + ' logged, ' + n(sf.kcal) + ' kcal.');
      return;
    }
    if (a === 'tdee-why') { S.tdeeWhy = !S.tdeeWhy; render(); return; }
    if (a === 'tdee-keep') { S.tdeeDismissed = true; render(); say('Target left at ' + n(DAY.target) + '.'); return; }
    if (a === 'tdee-take') {
      var tv = +act.getAttribute('data-v');
      DAY.target = tv;
      saveTargetsTo({ kcal: tv, pro: DAY.macros[0].want, carb: DAY.macros[1].want,
                      fat: DAY.macros[2].want, waterMl: TARGETS.waterMl });
      S.tdeeDismissed = true;
      render();
      say('Target moved to ' + n(tv) + ' kcal.');
      return;
    }
    if (a === 'manual') {
      S.man = { name: '', kcal: '', pro: '', carb: '', fat: '', error: null };
      S.sheet = 'manual'; render(); return;
    }
    if (a === 'mn-add') { manualAdd(); return; }
    if (a === 'mic-eg') {
      S.micText = act.getAttribute('data-t');
      S.micItems = parseMeal(S.micText);
      render(); return;
    }
    if (a === 'mic-drop') {
      (S.micItems || []).splice(+act.getAttribute('data-i'), 1);
      render(); return;
    }
    if (a === 'food-detail') {
      var fdk = act.getAttribute('data-k');
      S.foodG = (FOODS[fdk] || {}).g;
      S.sheet = 'food:' + fdk; render(); return;
    }
    if (a === 'fd-chip') { S.foodG = +act.getAttribute('data-g'); render(); return; }
    if (a === 'fd-log') {
      var lk = String(S.sheet).slice(5), lf = FOODS[lk];
      if (!lf) return;
      var gEl = document.getElementById('fd-g');
      var gv = parseInt(gEl ? gEl.value : S.foodG, 10);
      if (isNaN(gv) || gv < 1 || gv > 3000) { say('Grams between 1 and 3,000.'); return; }
      var f2 = gv / lf.g;
      var meal = { key: lk, icon: lf.icon,
                   name: lf.name + (gv === lf.g ? '' : ', ' + n(gv) + ' g'),
                   kcal: Math.round(lf.kcal * f2), pro: Math.round(lf.pro * f2 * 10) / 10,
                   carb: Math.round(lf.carb * f2 * 10) / 10, fat: Math.round(lf.fat * f2 * 10) / 10,
                   src: 'table', slot: S.logSlot || slotForNow() };
      MICROS.forEach(function (mi) {
        if (typeof lf[mi.key] === 'number') meal[mi.key] = Math.round(lf[mi.key] * f2 * 10) / 10;
      });
      addMeal(meal);
      S.sheet = null; S.foodG = null;
      render();
      say(esc(lf.name) + ', ' + n(gv) + ' g logged, ' + n(meal.kcal) + ' kcal.');
      return;
    }
    if (a === 'micros') { S.microOpen = !S.microOpen; render(); return; }
    if (a === 'pick-slot') { S.logSlot = act.getAttribute('data-slot'); render(); return; }
    if (a === 'move-slot') {
      /* The open sheet is 'meal:<index>', so the meal being moved is the one
         whose sheet is on screen. */
      var mi = String(S.sheet || '').indexOf('meal:') === 0 ? +String(S.sheet).slice(5) : -1;
      var mv = DAY.meals[mi];
      if (mv) {
        mv.slot = act.getAttribute('data-slot');
        saveDay();
        render();
        say(esc(mv.name) + ' moved to ' + slotName(mv.slot).toLowerCase() + '.');
      }
      return;
    }
    if (a === 'meal-portion') { portion(+act.getAttribute('data-i'), parseFloat(act.getAttribute('data-by'))); return; }
    if (a === 'meal-delete') { removeMeal(+act.getAttribute('data-i')); return; }
    if (a === 'undo') { doUndo(); return; }
    if (a === 'resume') {
      /* The shelf exists so a running session is not lost, and it was the one
         control on this screen that did nothing at all. */
      location.href = 'workout-log.html'; return;
    }
    if (a === 'stack') { location.href = 'stack.html'; return; }
    if (a === 'recipes') { S.sheet = 'recipes'; S.recipeOpen = null; render(); return; }
    if (a === 'plan') { S.sheet = 'plan'; render(); return; }
    if (a === 'open-recipe') { S.recipeOpen = +act.getAttribute('data-i'); render(); return; }
    if (a === 'recipes-back') { S.recipeOpen = null; render(); return; }
    /* Through addMeal, like every other logging path on this screen. Writing
       the totals here by hand was the first version of this handler and it
       moved nothing on screen: the day's figure is DAY.eaten and the macro
       bars read DAY.macros, neither of which a direct write to DAY.kcal
       touches. One writer, so a new way to log cannot miss half the state. */
    if (a === 'log-recipe') {
      var lr = allRecipes()[+act.getAttribute("data-i")];
      if (!lr) return;
      var sv = function (v) { return Math.round(v / lr.servings); };
      addMeal({ icon: lr.icon, name: lr.name + ', one serving', kcal: sv(lr.kcal),
                pro: sv(lr.pro), carb: sv(lr.carb), fat: sv(lr.fat), src: 'recipe' });
      S.sheet = null; S.recipeOpen = null;
      render();
      say('One serving of ' + lr.name + ' logged, ' + sv(lr.kcal) + ' kcal.');
      return;
    }
    /* A planned meal logs where it stands, so the plan and the day agree
       without the plan having to be a second list of foods. */
    if (a === 'plan-log') {
      var pd = PLAN[+act.getAttribute('data-d')];
      var ps = pd && pd.slots[+act.getAttribute('data-s')];
      if (!ps) return;
      if (slotDone(pd, ps)) { say(ps.name + ' is already logged.'); return; }
      if (!ps.kcal) { say('Nothing planned for ' + ps.at.toLowerCase() + '.'); return; }
      if (pd.iso !== DAY.iso) { say(ps.name + ' is planned for ' + pd.d + ', not today.'); return; }
      /* With the slot's own macros. A planned meal logged without them moved
         the calorie figure and left all three bars where they were, so the
         same chilli was 41 g of protein from Recipes and 0 g from the plan. */
      addMeal({ key: ps.key || null, icon: ps.icon || FOODS[ps.key].icon, name: ps.name,
                at: ps.at, kcal: ps.kcal, pro: ps.pro, carb: ps.carb, fat: ps.fat,
                src: 'plan', slot: ps.slot || null });
      render();
      say(ps.name + ' logged, ' + ps.kcal + ' kcal.');
      return;
    }
    if (a === 'new-recipe') {
      S.draft = { name: '', servings: 4, items: [], notes: [], error: null };
      S.sheet = 'build-recipe'; render(); return;
    }
    if (a === 'br-add') {
      readDraft();
      var bk = act.getAttribute('data-k');
      var found = null;
      S.draft.items.forEach(function (it) { if (it.key === bk) found = it; });
      if (found) found.qty += 1; else S.draft.items.push({ key: bk, qty: 1 });
      S.draft.error = null; render(); return;
    }
    if (a === 'br-more' || a === 'br-less') {
      readDraft();
      var bi = +act.getAttribute('data-i'), item = S.draft.items[bi];
      if (!item) return;
      item.qty += (a === 'br-more' ? 1 : -1);
      if (item.qty < 1) S.draft.items.splice(bi, 1);
      render(); return;
    }
    if (a === 'br-add-note') {
      readDraft();
      var nf = document.getElementById('br-note');
      var txt = nf && nf.value.trim();
      if (!txt) { S.draft.error = 'Type what to add first.'; render(); return; }
      S.draft.notes.push(txt.slice(0, 60));
      S.draft.error = null;
      render();
      var nf2 = document.getElementById('br-note');
      if (nf2) nf2.focus();
      return;
    }
    if (a === 'br-drop-note') {
      readDraft(); S.draft.notes.splice(+act.getAttribute('data-i'), 1); render(); return;
    }
    if (a === 'br-save') { saveRecipe(); return; }
    if (a === 'more') {
      /* Standalone this is a page; in the demo the router takes the click
         first. It had no branch at all and was the screen's dead end. */
      location.href = 'shopping.html'; return;
    }
    if (a === 'close') { S.sheet = null; S.camOil = null; render(); return; }
    if (a === 'retry') { S.state = 'loading'; render(); setTimeout(function () { S.state = 'populated'; render(); }, 700); return; }
  });

  /* ---------------------------------------------------------------
     Logging

     Eight controls across the five sheets used to carry data-action="close"
     under copy that promised a write: "Log it", "Log both", "One tap logs it
     again", "Remove this entry". Three of them carried no action at all.
     Each one now does the thing its label says, and the day's totals move
     with it, because a log that does not move the number on the screen is
     indistinguishable from a log that failed.
     --------------------------------------------------------------- */

  /* The plate the camera sheet is looking at. Oil is the one question worth
     interrupting for because it is the one that moves the figure. */
  var CAM_BASE = { name: 'Chicken, rice, broccoli', icon: '🍗', kcal: 690, pro: 54, carb: 78, fat: 18 };
  var OIL = { none: { kcal: -90, fat: -10 }, little: { kcal: 0, fat: 0 }, lot: { kcal: 160, fat: 18 } };
  function camPlate() {
    var d = OIL[S.camOil] || OIL.little;
    return { name: CAM_BASE.name, icon: CAM_BASE.icon, kcal: CAM_BASE.kcal + d.kcal,
             pro: CAM_BASE.pro, carb: CAM_BASE.carb, fat: CAM_BASE.fat + d.fat, src: 'estimate' };
  }

  function nowLabel() {
    var d = new Date();
    var h = d.getHours() % 12 || 12;
    return h + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  }

  /* The record carries every macro it contributed, not just protein. It used
     to keep pro and kcal only, so removing a meal put its calories and its
     protein back and left its carbs and its fat in the day's totals forever
     -- structurally, not as a missed line: there was nothing on the record
     to subtract. Rescaling a portion had the same hole. */
  function addMeal(meal) {
    DAY.meals.push({ key: meal.key || null, icon: meal.icon, name: meal.name,
                     at: meal.at || nowLabel(),
                     slot: meal.slot || slotForNow(),
                     pro: meal.pro || 0, carb: meal.carb || 0, fat: meal.fat || 0,
                     kcal: meal.kcal, src: meal.src || 'estimate',
                     fibre: meal.fibre, sugar: meal.sugar,
                     satfat: meal.satfat, sodium: meal.sodium });
    recount(DAY);
    saveDay();
    OFTEN = frequent();
  }

  /* The two fields are uncontrolled, so anything typed into them has to be
     read back before a re-render throws it away. Every control on this sheet
     re-renders, and without this a name typed before adding an ingredient was
     gone the moment the ingredient landed. */
  function readDraft() {
    if (!S.draft) S.draft = { name: '', servings: 4, items: [], notes: [], error: null };
    var nEl = document.getElementById('br-name');
    var sEl = document.getElementById('br-servings');
    if (nEl) S.draft.name = nEl.value;
    if (sEl) {
      var v = parseInt(sEl.value, 10);
      if (!isNaN(v) && v >= 1 && v <= 24) S.draft.servings = v;
    }
  }

  /* One weigh-in, written where Progress and Settings read it. The rate on
     the hero and the water target both move with it, which is the point of
     putting the field on this screen at all. */
  function readFP() {
    if (!S.fp) S.fp = fuelProfile();
    var num = function (id, min, max, cur) {
      var el = document.getElementById(id);
      if (!el) return cur;
      var v = parseFloat(el.value);
      return (isNaN(v) || v < min || v > max) ? cur : v;
    };
    S.fp.weightKg = Math.round(num('fp-w', 20, 400, S.fp.weightKg) * 10) / 10;
    S.fp.heightCm = Math.round(num('fp-h', 100, 250, S.fp.heightCm));
    S.fp.age = Math.round(num('fp-a', 13, 100, S.fp.age));
    var d = document.getElementById('fp-diet');
    var al = document.getElementById('fp-allergy');
    if (d) S.fp.diet = d.value.slice(0, 120);
    if (al) S.fp.allergy = al.value.slice(0, 120);
  }

  /* Weight, height, age, sex and goal go back to lk_profile, because Settings
     and Progress read them there and a second copy is a second truth. Only
     what this screen alone knows goes to lk_fuelProfile. */
  function saveFuelProfile() {
    readFP();
    var fp = S.fp;
    if (ST && persisting()) {
      ST.patch('lk_profile', { weightKg: fp.weightKg, heightCm: fp.heightCm,
                               age: fp.age, sex: fp.sex, goal: fp.goal });
      ST.patch('lk_fuelProfile', { activity: fp.activity, macroMode: fp.macroMode,
                                   diet: fp.diet, allergy: fp.allergy });
    }
    PROFILE.weightKg = fp.weightKg; PROFILE.heightCm = fp.heightCm;
    PROFILE.age = fp.age; PROFILE.sex = fp.sex; PROFILE.goal = fp.goal;
    /* A weight typed here is a weigh-in, or the hero would read a rate
       against a body weight nothing on the chart agrees with. */
    var log = (WEIGHTLOG || []).slice();
    var last = log[log.length - 1];
    if (last && last.date === DAY.iso) last.kg = fp.weightKg;
    else log.push({ date: DAY.iso, kg: fp.weightKg });
    WEIGHTLOG = log;
    if (ST && persisting()) ST.set('lk_weightLog', log);

    var msg = 'Saved.';
    if (fp.macroMode === 'auto') {
      var m = calcMacros(fp);
      DAY.target = m.kcal;
      DAY.macros[0].want = m.pro; DAY.macros[1].want = m.carb; DAY.macros[2].want = m.fat;
      saveTargetsTo({ kcal: m.kcal, pro: m.pro, carb: m.carb, fat: m.fat,
                      waterMl: TARGETS.waterMl });
      msg = 'Saved. Targets are now ' + n(m.kcal) + ' kcal, ' + n(m.pro) + ' g protein.';
    }
    DAY.goal = GOAL_WORD[fp.goal]; DAY.goalKey = fp.goal;
    DAY.weightKg = fp.weightKg;
    DAY.rate = weekRate();
    DAY.waterGoalMl = waterGoal().ml;
    DAY.waterGoalComputed = waterGoal().computed;
    S.fp = null; S.sheet = null;
    render();
    say(msg);
  }

  function weighIn() {
    var el = document.getElementById('wt-new');
    var v = parseFloat(el ? el.value : '');
    if (isNaN(v) || v < 20 || v > 400) { say('A weight between 20 and 400 kg.'); return; }
    var kg = Math.round(v * 10) / 10;
    var log = (WEIGHTLOG || []).slice();
    var last = log[log.length - 1];
    /* One entry a day: weighing twice should correct today, not invent a
       second day and halve the span every rate on the screen is read over. */
    if (last && last.date === DAY.iso) last.kg = kg;
    else log.push({ date: DAY.iso, kg: kg });
    WEIGHTLOG = log;
    if (ST && persisting()) {
      ST.set('lk_weightLog', log);
      ST.patch('lk_profile', { weightKg: kg });
    }
    PROFILE.weightKg = kg;
    DAY.weightKg = kg;
    DAY.rate = weekRate();
    DAY.waterGoalMl = waterGoal().ml;
    DAY.waterGoalComputed = waterGoal().computed;
    render();
    say(kg.toFixed(1) + ' kg saved.');
  }

  function readManual() {
    if (!S.man) S.man = { name: '', kcal: '', pro: '', carb: '', fat: '', error: null };
    ['name', 'kcal', 'pro', 'carb', 'fat'].forEach(function (k) {
      var el = document.getElementById('mn-' + k);
      if (el) S.man[k] = el.value;
    });
  }

  function manualAdd() {
    readManual();
    var m = S.man;
    var kcal = parseInt(m.kcal, 10);
    if (!m.name.trim()) { m.error = 'Give it a name.'; render(); return; }
    if (isNaN(kcal) || kcal < 1 || kcal > 8000) {
      m.error = 'Calories between 1 and 8,000.'; render(); return;
    }
    var num = function (v, max) {
      var x = parseFloat(v);
      if (isNaN(x) || x < 0) return 0;
      return Math.min(max, Math.round(x * 10) / 10);
    };
    addMeal({
      key: null, icon: '\ud83c\udf7d\ufe0f', name: m.name.trim().slice(0, 60), kcal: kcal,
      pro: num(m.pro, 500), carb: num(m.carb, 800), fat: num(m.fat, 400),
      /* An estimate, and labelled one. Nothing measured this: somebody read
         it off a packet or remembered it. */
      src: 'estimate', slot: S.logSlot || slotForNow()
    });
    S.man = null; S.sheet = null;
    render();
    say(esc(m.name.trim()) + ' logged, ' + n(kcal) + ' kcal.');
  }

  function saveRecipe() {
    readDraft();
    var d = S.draft;
    if (!d.name.trim()) { d.error = 'Give it a name.'; render(); return; }
    if (!d.items.length) { d.error = 'Add at least one thing from the food table, so the ' +
      'figures are the ingredients rather than a guess.'; render(); return; }
    var sEl = document.getElementById('br-servings');
    var sv = parseInt(sEl ? sEl.value : d.servings, 10);
    if (isNaN(sv) || sv < 1 || sv > 24) { d.error = 'Servings between 1 and 24.'; render(); return; }
    var t = draftTotals(d);
    var rec = {
      id: 'r' + Date.now(), name: d.name.trim().slice(0, 60), servings: sv,
      icon: (FOODS[d.items[0].key] || {}).icon || '\ud83e\udd63',
      items: d.items.map(function (it) { return { key: it.key, qty: it.qty }; }),
      notes: d.notes.slice(),
      kcal: Math.round(t.kcal), pro: Math.round(t.pro),
      carb: Math.round(t.carb), fat: Math.round(t.fat)
    };
    if (ST && persisting()) ST.push('lk_recipes', rec, true);
    S.draft = null;
    S.sheet = 'recipes';
    render();
    say(esc(rec.name) + ' saved, ' + n(Math.round(rec.kcal / sv)) + ' kcal a serving.');
  }

  function saveTargets() {
    var kcal = parseInt((document.getElementById('tg-kcal') || {}).value, 10);
    if (isNaN(kcal) || kcal < 800 || kcal > 8000) {
      S.targetError = 'Calories between 800 and 8,000.';
      render(); return;
    }
    /* Read every field, validate every field, then write. It used to write
       each macro as it read it and bail on the first bad one, so a rejected
       save still moved the targets either side of the bad field -- the day
       was then measured against a figure nobody had confirmed. */
    var bad = null, want = [];
    DAY.macros.forEach(function (m) {
      var v = parseInt((document.getElementById('tg-' + m.key) || {}).value, 10);
      if (isNaN(v) || v < 0 || v > 1000) { if (!bad) bad = m.name; return; }
      want.push([m, v]);
    });
    if (bad) { S.targetError = bad + ' between 0 and 1,000 ' + 'g.'; render(); return; }
    want.forEach(function (w) { w[0].want = w[1]; });
    DAY.target = kcal;
    saveTargetsTo({ kcal: kcal, pro: DAY.macros[0].want, carb: DAY.macros[1].want,
                    fat: DAY.macros[2].want, waterMl: TARGETS.waterMl });
    S.sheet = null; S.targetError = null;
    say('Targets saved. ' + n(kcal) + ' kcal.');
  }

  function scanLog() {
    var f = SCAN, k = S.scanServings;
    /* Fat to a tenth. Rounded to whole grams, the product's 0.3 g became 0
       and the day's fat bar quietly lost it on every scan. */
    addMeal({ icon: f.icon, name: f.name, kcal: Math.round(f.kcal * k),
              pro: Math.round(f.pro * k), carb: Math.round(f.carb * k),
              fat: Math.round(f.fat * k * 10) / 10, src: 'verified' });
    S.sheet = null;
    say(esc(f.name) + ' logged, ' + n(Math.round(f.kcal * k)) + ' kcal. Verified.');
  }

  function camLog() {
    var plate = camPlate();
    addMeal(plate);
    S.sheet = null; S.camOil = null;
    say(esc(plate.name) + ' logged, ' + n(plate.kcal) + ' kcal.');
  }

  /* Exactly what the preview showed, item by item. An unmatched piece is not
     logged and was never counted in the total on the button. */
  function micLog() {
    var items = (S.micItems || []).filter(function (it) { return it.key; });
    if (!items.length) return;
    var slot = S.logSlot || slotForNow();
    var tot = 0;
    items.forEach(function (it) {
      var meal = { key: it.key, icon: it.icon,
                   name: it.name + (it.grams === FOODS[it.key].g ? '' : ', ' + n(it.grams) + ' g'),
                   kcal: it.kcal, pro: it.pro, carb: it.carb, fat: it.fat,
                   src: 'estimate', slot: slot };
      MICROS.forEach(function (mi) {
        if (typeof it[mi.key] === 'number') meal[mi.key] = it[mi.key];
      });
      addMeal(meal);
      tot += it.kcal;
    });
    S.sheet = null; S.micText = ''; S.micItems = null;
    say(items.length + (items.length === 1 ? ' item' : ' items') + ' logged, ' + n(tot) + ' kcal.');
  }

  function logOften(i) {
    var r = OFTEN[i];
    if (!r) return;
    /* 'repeat', not 'verified'. Logging a home-cooked meal again earns no new
       evidence, and stamping Verified on it told the reader a barcode had
       matched a database row -- a scan that never happened, on the same food
       the original entry calls an Estimate. */
    addMeal({ key: r.key, icon: r.icon, name: r.name, pro: r.pro, carb: r.carb,
              fat: r.fat, kcal: r.kcal, src: 'repeat' });
    S.sheet = null;
    say(esc(r.name) + ' logged again.');
  }

  /* A portion, not a rewrite. Scaling every figure by the same factor is the
     honest edit: the plate was the plate, there was just more or less of it. */
  /* `by` is the factor itself, not a delta. 0.8 and 1.25 are reciprocals, so
     one then the other returns the meal to where it started. */
  /* Scaled from the portion the meal was logged at, never from the last
     rounded figure. Compounding rounded steps is not reciprocal: 52 g of
     protein taken down a fifth and back up a quarter came home as 53, and
     several steps drifted further each time. The meal keeps its original
     macros in `base` and every step is `base x scale`, so a fifth less then a
     quarter more is base x 0.8 x 1.25 = base, exactly. */
  function portion(i, f) {
    var m = DAY.meals[i];
    if (!m || !f) return;
    if (!m.base) {
      m.base = { kcal: m.kcal || 0, pro: m.pro || 0, carb: m.carb || 0, fat: m.fat || 0 };
      MICROS.forEach(function (mi) {
        if (typeof m[mi.key] === 'number') m.base[mi.key] = m[mi.key];
      });
      m.scale = 1;
    }
    m.scale = Math.round(m.scale * f * 1000) / 1000;
    /* A portion cannot go to nothing or to ten plates. */
    if (m.scale < 0.1) m.scale = 0.1;
    if (m.scale > 10) m.scale = 10;
    ['kcal', 'pro', 'carb', 'fat'].forEach(function (k) {
      m[k] = Math.round(m.base[k] * m.scale * 10) / 10;
    });
    MICROS.forEach(function (mi) {
      if (typeof m.base[mi.key] === 'number') {
        m[mi.key] = Math.round(m.base[mi.key] * m.scale * 10) / 10;
      }
    });
    m.kcal = Math.round(m.kcal);
    recount(DAY);
    saveDay();
    /* say() renders. Rendering here as well was two full passes a tap. */
    say(esc(m.name) + ' is now ' + n(m.kcal) + ' kcal.');
  }

  function removeMeal(i) {
    var m = DAY.meals[i];
    if (!m) return;
    DAY.meals.splice(i, 1);
    recount(DAY);
    saveDay();
    OFTEN = frequent();
    S.sheet = null;
    /* Destructive, so it is undoable rather than confirmed: a confirm asks a
       question the person already answered by pressing a red button. */
    say(esc(m.name) + ' removed.', function () {
      DAY.meals.splice(i, 0, m);
      recount(DAY);
      saveDay();
      OFTEN = frequent();
    });
  }

  var toastTimer = null;
  /* say(msg, undo). The undo belongs to THIS message and to nothing else.
     removeMeal was the only writer of S.undo and say() never cleared it, so
     logging anything within six seconds of a delete produced a toast reading
     "Chicken, rice, broccoli logged" with an Undo that put the deleted meal
     back: three rows became four. An action that cannot be taken back says
     so by passing nothing. */
  function say(msg, undo) {
    S.toast = msg;
    S.undo = undo || null;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; S.undo = null; render(); }, 6000);
  }
  function doUndo() {
    if (S.undo) S.undo();
    S.undo = null; S.toast = null;
    render();
  }
  function toastHTML() {
    if (!S.toast) return '';
    return '<div class="toast" role="status" data-testid="toast">' +
      '<span class="toast__body">' + S.toast + '</span>' +
      (S.undo ? '<button class="toast__action" type="button" data-action="undo" data-testid="undo">Undo</button>' : '') +
    '</div>';
  }

  /* The servings field re-renders the figures under it as it is typed, and
     LKPatch keeps the caret. */
  document.addEventListener('input', function (e) {
    if (e.target.id === 'fs-q') {
      S.searchQ = e.target.value;
      render();
      /* Re-render replaces the field, so the caret has to be put back where
         the typist left it or every keystroke jumps to the start. */
      var f = document.getElementById('fs-q');
      if (f) { f.focus(); try { f.setSelectionRange(f.value.length, f.value.length); } catch (err) {} }
      return;
    }
    /* The servings field drives the preview under it, so it repaints as it
       is typed. The name keeps its own value across that repaint through
       readDraft, and the caret is put back the same way the search field
       does it. */
    if (e.target.id === 'mn-name' || e.target.id === 'mn-kcal') {
      var wid = e.target.id;
      readManual();
      render();
      var el2 = document.getElementById(wid);
      if (el2) { el2.focus(); try { el2.setSelectionRange(el2.value.length, el2.value.length); } catch (err) {} }
      return;
    }
    if (e.target.id.indexOf('mn-') === 0) { readManual(); return; }
    if (e.target.id === 'mic-text') {
      S.micText = e.target.value;
      S.micItems = S.micText.trim() ? parseMeal(S.micText) : null;
      render();
      var mf = document.getElementById('mic-text');
      if (mf) { mf.focus(); try { mf.setSelectionRange(mf.value.length, mf.value.length); } catch (err) {} }
      return;
    }
    if (e.target.id === 'fd-g') {
      var gv2 = parseInt(e.target.value, 10);
      if (isNaN(gv2) || gv2 < 1) return;      /* mid-edit, not yet a number */
      S.foodG = Math.min(3000, gv2);
      render();
      var gf = document.getElementById('fd-g');
      if (gf) { gf.focus(); try { gf.setSelectionRange(gf.value.length, gf.value.length); } catch (err) {} }
      return;
    }
    if (e.target.id === 'br-servings' || e.target.id === 'br-name') {
      var wasId = e.target.id;
      readDraft();
      if (wasId === 'br-name') return;   /* nothing under it changes as you type */
      render();
      var sv = document.getElementById('br-servings');
      if (sv) { sv.focus(); try { sv.setSelectionRange(sv.value.length, sv.value.length); } catch (err) {} }
      return;
    }
    if (e.target.id !== 'scan-servings') return;
    var v = parseFloat(e.target.value);
    S.scanServings = (isNaN(v) || v <= 0) ? 1 : Math.min(10, v);
    render();
  });

  document.addEventListener('keydown', function (e) {
    /* Same reset as the close action. They disagreed: Escape left S.camOil
       set, so a brand-new photo opened already carrying the last plate's
       answer to the oil question -- and said so in its own caption. */
    if (e.key === 'Escape' && S.sheet) { S.sheet = null; S.camOil = null; render(); }
  });

  var STATES = [
    ['populated', 'Populated'], ['live', 'Session running'],
    ['first-weeks', 'First two weeks'],
    /* Stack is off by default and its chip does not exist until it is on, so
       without a state that turns the gate on there is no way to reach it --
       not in the demo, and not for the crossing check, which reads every
       declared state looking for the control a crossing names. */
    ['stack-on', 'Stack tracking on'],
    ['hidden', 'Numbers hidden'], ['empty', 'Empty'],
    ['loading', 'Loading'], ['error', 'Error']
  ];
  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join(''));
  document.getElementById('dev-toggle').addEventListener('click', function () {
    var open = menu.hidden;
    menu.hidden = !open;
    this.setAttribute('aria-expanded', String(open));
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (!b) return;
    /* stack-on is a gate, not a view: it turns lk_perfTracking on and then
       shows the populated screen, which now carries the Stack chip. */
    if (b.dataset.state === 'stack-on') {
      try { localStorage.setItem('lk_perfTracking', 'true'); } catch (e) {}
      S.state = 'populated';
    } else {
      S.state = b.dataset.state;
    }
    S.sheet = null;
    S.camOil = null;
    S.toast = null;
    S.undo = null;
    /* The day is a fixture and every state reads the same one, so anything
       logged, deleted or rescaled in one state was still there in the next --
       switching to Empty after logging a meal showed a day that was not
       empty. A state switch is a fresh screen, so it gets a fresh day. */
    DAY = day();
    OFTEN = frequent();
    render();
  });

  /* Settings owns "Show calorie numbers" and writes it where this screen can
     see it, the same way the theme is shared. It is the DEFAULT here: the
     dev switcher still overrides, because that is what the switcher is for. */
  try {
    if (localStorage.getItem('lk_fuelNumbers') === 'false') S.state = 'hidden';
  } catch (e) {}

  var p = new URLSearchParams(location.search);
  if (p.get('state') && VIEWS[p.get('state')]) S.state = p.get('state');
  render();
  requestAnimationFrame(function () { window.__ready = true; });
})();

  /* The strip's clock, on a screen that only repaints when something on it
     changes. Without this the shelf freezes at whatever second you arrived. */
  if (window.LKSession) {
    var shelfWas = null;
    window.setInterval(function () {
      var now = LKSession.html();
      if (now === shelfWas) return;
      shelfWas = now;
      LKPatch(document.getElementById('shelf-slot'), now);
    }, 1000);
  }
</script>
</body>
</html>
