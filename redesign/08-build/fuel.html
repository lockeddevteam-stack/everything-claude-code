            '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
          '</button></div>' +
        '<div class="sheet__body">' +
          '<p class="t-detail">Logged at ' + esc(m.at) + ' &middot; ' + pct + '% of today</p>' +
          '<div class="card card--sunken mt-3">' +
            '<div class="hstack hstack--3"><span class="t-body grow">Energy</span>' +
              '<span class="t-body-em num">' + n(m.kcal) + ' kcal</span></div>' +
            '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Protein</span>' +
              '<span class="t-body-em num">' + n(m.pro) + ' g</span></div>' +
            '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Carbs</span>' +
              '<span class="t-body-em num">' + n(m.carb) + ' g</span></div>' +
            '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Fat</span>' +
              '<span class="t-body-em num">' + n(m.fat) + ' g</span></div>' +
          '</div>' +
          (typeof m.fibre === 'number'
            ? '<h3 class="t-label mt-5">And in it</h3>' +
              '<div class="card card--sunken mt-2" data-testid="meal-micros">' +
                MICROS.map(function (mi, mj) {
                  return '<div class="hstack hstack--3' + (mj ? ' mt-2' : '') + '">' +
                    '<span class="t-body grow">' + esc(mi.name) + '</span>' +
                    '<span class="t-body-em num">' + n(m[mi.key] || 0) + ' ' + mi.unit + '</span></div>';
                }).join('') +
              '</div>'
            : '<p class="t-detail quiet mt-4" data-testid="meal-micros-none">No fibre, sugar, ' +
              'saturated fat or sodium on this one: it did not come from a row that carries them.</p>') +
          '<h3 class="t-label mt-5">Part of the day</h3>' +
          slotPicker(slotOf(m), 'move-slot', 'meal-slot') +
          '<h3 class="t-label mt-5">Where these numbers came from</h3>' +
          '<p class="t-detail mt-2">' + srcOf(m.src).why + '</p>' +
          '<div class="chiprow mt-4">' +
            /* Symmetric, so a mistake is one tap away from undone: a quarter
               less then a quarter more used to leave the meal 6% smaller,
               because 0.75 x 1.25 is 0.9375. The factors are reciprocal, so
               the pair round-trips. */
            '<button class="chip" type="button" data-action="meal-portion" data-i="' + i + '" data-by="0.8" ' +
              'data-testid="meal-edit">A fifth less</button>' +
            '<button class="chip" type="button" data-action="meal-portion" data-i="' + i + '" data-by="1.25" ' +
              'data-testid="meal-swap">A quarter more</button>' +
          '</div>' +
        '</div>' +
        '<div class="sheet__foot">' +
          '<button class="btn btn--danger btn--block" type="button" data-action="meal-delete" data-i="' + i + '" data-testid="meal-delete">' +
            '<span class="btn__label">Remove this entry</span></button>' +
        '</div>' +
      '</div>';
  }

  function sheetHTML() {
    if (S.sheet && S.sheet.indexOf('meal:') === 0) {
      var m = DAY.meals[+S.sheet.slice(5)];
      return m ? mealSheet(m, +S.sheet.slice(5)) : '';
    }
    if (S.sheet === 'water') {
      var pctW = Math.min(100, Math.round(DAY.waterMl / DAY.waterGoalMl * 100));
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="wt-title" data-testid="sheet-water">' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="wt-title">Water</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="water-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<div class="hstack hstack--2" style="align-items: baseline">' +
              '<p class="money num" data-testid="water-value">' + (DAY.waterMl / 1000).toFixed(2) + '</p>' +
              '<p class="hero__unit grow">of ' + (DAY.waterGoalMl / 1000).toFixed(1) + ' L</p>' +
            '</div>' +
            '<div class="meter mt-3" role="img" aria-label="' + pctW + ' per cent of today&rsquo;s water">' +
              '<span class="meter__fill" style="width:' + pctW + '%"></span></div>' +
            '<div class="hstack hstack--3 mt-4">' +
              '<button class="btn btn--secondary grow" type="button" data-action="water-sub" data-testid="water-sub">' +
                '<span class="btn__label">&minus; 250 ml</span></button>' +
              '<button class="btn btn--primary grow" type="button" data-action="water-add" data-testid="water-add">' +
                '<span class="btn__label">+ 250 ml</span></button>' +
            '</div>' +
            '<p class="t-caption-1 quiet mt-3">A glass is about 250 ml. ' +
              (DAY.waterGoalComputed
                ? 'The target is 35 ml for every kilo you weigh, rounded to the nearest 50, so it ' +
                  'moves when your weight does rather than sitting on a round number somebody picked.'
                : 'There is no weight on file yet, so this target is the stored one. Add a weigh-in ' +
                  'and it becomes 35 ml per kilo.') + '</p>' +
          '</div>' +
        '</div>';
    }
    if (S.sheet === 'supps') {
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sp-title" ' +
          'data-detents="0.55 0.88" data-testid="sheet-supps">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="sp-title">Supplements</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="supps-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<div class="card card--flush">' + DAY.supps.map(function (sp, i) {
              return '<button class="row" type="button" data-action="supp" data-i="' + i +
                '" aria-pressed="' + sp.taken + '" data-testid="supp-' + i + '">' +
                '<span class="tick"><span class="tick__box">' + (sp.taken ? ICO.tick : '') + '</span></span>' +
                '<span class="row__main stack">' +
                  '<span class="row__title">' + esc(sp.name) + '</span>' +
                  '<span class="row__sub">' + esc(sp.dose) + ' &middot; ' + esc(sp.when) + '</span>' +
                '</span></button>';
            }).join('') + '</div>' +
            '<p class="t-caption-1 quiet mt-3">Whey is in your food log as food, because that is what it is. ' +
              'It sits here so the list matches what is on the shelf.</p>' +
          '</div>' +
        '</div>';
    }
    if (S.sheet === 'trends') {
      /* 7, 14 or 30 -- three slices of one series, not three numbers. */
      var range = S.trendRange || 14;
      var se = series(range);
      var t = se.map(function (e) { return e.kcal; });
      var mx = Math.max.apply(null, t.concat([DAY.target]));
      var mn = Math.min.apply(null, t.concat([DAY.target]));
      var span = mx - mn || 1;
      var avg = Math.round(t.reduce(function (a, b) { return a + b; }, 0) / t.length);
      var y = function (v) { return (70 - (v - mn) / span * 60).toFixed(1); };
      var x = function (i) { return (i / (t.length - 1 || 1) * 300).toFixed(1); };
      var pts = t.map(function (v, i) { return x(i) + ',' + y(v); }).join(' ');
      var targetY = y(DAY.target);
      /* The weight line shares the x axis and gets its own scale, because a
         kilo and a kilocalorie are not comparable quantities and drawing them
         on one scale would flatten the weight to a straight line. */
      var wk = se.map(function (e) { return weightAt(e.date); });
      var wHas = wk.filter(function (v) { return v; });
      var wPts = '';
      if (wHas.length > 1) {
        var wMx = Math.max.apply(null, wHas), wMn = Math.min.apply(null, wHas);
        var wSpan = wMx - wMn || 1;
        wPts = wk.map(function (v, i) {
          return v ? x(i) + ',' + (70 - (v - wMn) / wSpan * 60).toFixed(1) : null;
        }).filter(Boolean).join(' ');
      }
      var over = t.filter(function (v) { return v > DAY.target; }).length;
      var hi = Math.max.apply(null, t), lo = Math.min.apply(null, t);
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="tr-title" ' +
          'data-detents="0.6 0.94" data-testid="sheet-trends">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="tr-title">Last ' + range + ' days</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="trends-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<div class="seg seg--lg" role="radiogroup" aria-label="How far back" data-testid="trend-range">' +
              [7, 14, 30].map(function (r) {
                return '<button class="seg__item" type="button" role="radio" ' +
                  'aria-checked="' + (range === r) + '" data-action="trend-range" data-r="' + r + '" ' +
                  'data-testid="trend-range-' + r + '">' + r + ' days</button>';
              }).join('') + '</div>' +
            '<div class="hstack hstack--2 mt-4" style="align-items: baseline">' +
              '<p class="money num" data-testid="trend-avg">' + n(avg) + '</p>' +
              '<p class="hero__unit grow">kcal a day on average</p>' +
            '</div>' +
            '<p class="t-detail mt-2">Target is ' + n(DAY.target) + ', the dashed line. ' +
              'A single day means nothing; a run of them is what a target is set from. ' +
              'Today counts as what is on the list so far.</p>' +
            '<svg class="chart mt-4" viewBox="0 0 300 80" role="img" ' +
              'aria-label="Daily energy over ' + range + ' days, averaging ' + n(avg) + ' kcal ' +
              'against a target of ' + n(DAY.target) + '">' +
              '<line class="chart__target" x1="0" y1="' + targetY + '" x2="300" y2="' + targetY + '"/>' +
              (wPts ? '<polyline class="chart__line chart__line--weight" points="' + wPts + '"/>' : '') +
              '<polyline class="chart__line" points="' + pts + '"/>' +
              '<circle class="chart__dot chart__dot--last" cx="300" cy="' + y(t[t.length - 1]) + '" r="3"/>' +
            '</svg>' +
            '<div class="hstack hstack--3 mt-2">' +
              '<span class="t-meta grow">Energy</span>' +
              (wPts ? '<span class="t-meta">Body weight</span>' : '') +
            '</div>' +
            '<h3 class="t-label mt-5">Over these ' + range + ' days</h3>' +
            '<div class="card card--sunken mt-2" data-testid="trend-stats">' +
              '<div class="hstack hstack--3"><span class="t-body grow">Average against target</span>' +
                '<span class="t-body-em num">' + (avg - DAY.target > 0 ? '+' : avg - DAY.target < 0 ? '\u2212' : '\u00b1') +
                  n(Math.abs(avg - DAY.target)) + ' kcal</span></div>' +
              '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Days over target</span>' +
                '<span class="t-body-em num">' + over + ' of ' + t.length + '</span></div>' +
              '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Lowest and highest</span>' +
                '<span class="t-body-em num">' + n(lo) + ' \u2013 ' + n(hi) + '</span></div>' +
              (DAY.rate
                ? '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Weight, per week</span>' +
                  '<span class="t-body-em num">' + signed(DAY.rate.pct) + '%</span></div>'
                : '') +
            '</div>' +
          '</div>' +
        '</div>';
    }
    if (S.sheet === 'search') {
      var q = (S.searchQ || '').trim().toLowerCase();
      var hits = searchHits(q);
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fs-title" ' +
          'data-detents="0.6 0.94" data-testid="sheet-search">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="fs-title">Search foods</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="search-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<input class="field" id="fs-q" type="search" autocomplete="off" ' +
              'placeholder="Chicken, oats, skyr\u2026" aria-label="Search foods" ' +
              'data-testid="search-input" value="' + esc(S.searchQ || '') + '">' +
            slotPicker(S.logSlot || slotForNow(), 'pick-slot', 'search-slot') +
            '<p class="t-detail quiet mt-2">' + hits.length +
              (hits.length === 1 ? ' food' : ' foods') + ' in this build\u2019s table and your own recipes. ' +
              'A real search reaches a food database; this one does not pretend to.</p>' +
            (hits.length
              ? '<div class="card card--flush mt-3">' + hits.map(function (f, i) {
                  /* The row logs the standard serving, which is the common
                     case and should cost one tap. The aside opens the detail
                     for the times it was not a standard serving. */
                  return '<div class="row row--withaside">' +
                    '<button class="row__main row__main--btn" type="button" data-action="log-search" data-i="' + i +

                      '<span class="fuel-thumb" aria-hidden="true">' + f.icon + '</span>' +

    if (S.sheet === 'meals') {
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="me-title" ' +

    /* The barcode path. It is the only way a Verified badge can be earned --

       build can be honest about is the resolve step, which is where the
       Verified claim actually comes from: a code matched a database row, so
       the numbers are the manufacturer's own. */
    /* Recipes. A recipe is a food you built, so the sheet's job is to make

       Per-serving figures are derived here and never stored: a stored

    if (S.sheet === 'recipes') {
      var rOpen = S.recipeOpen;

          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +

          '<div class="sheet__body">' +

                '<span class="fuel-thumb" aria-hidden="true">' + r.icon + '</span>' +

                  '<span class="row__title">' + esc(r.name) + '</span>' +

            '<button class="btn btn--secondary btn--block mt-3" type="button" data-action="new-recipe" ' +
              'data-testid="new-recipe"><span class="btn__label">Build a recipe</span></button>' +
          '</div>' +
        '</div>';
    }

    /* The week's plan. Planned and logged are different states of the same
       slot, so they are one row with a check rather than two lists. */
    if (S.sheet === 'plan') {
      var planned = 0, logged = 0;
      PLAN.forEach(function (d) { d.slots.forEach(function (sl) { planned += sl.kcal; if (slotDone(d, sl)) logged += sl.kcal; }); });
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pl-title" ' +
          'data-detents="0.6 0.94" data-testid="sheet-plan">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +

          '<div class="sheet__body">' +
            '<p class="t-detail">Tap a meal to log it, or the arrows beside it to swap it. A swap ' +

            /* An accordion, with today open. Five days of six meals is thirty
               rows, and a sheet that opens on thirty rows is a document. Each
               head carries the day's total, so the thing most people came for
               is readable without opening anything. */
            PLAN.map(function (d, di) {
              var isToday = d.iso === DAY.iso;
              var openDay = S.planOpen === undefined ? isToday : S.planOpen === di;
              var dayKcal = d.slots.reduce(function (a, sl) { return a + sl.kcal; }, 0);
              var dayDone = d.slots.filter(function (sl) { return slotDone(d, sl); }).length;

                  '<span class="row__chev' + (openDay ? ' row__chev--open' : '') + '">' + ICO.chev + '</span>' +
                '</button>' +
                (openDay ? '' : '<span hidden></span>') +
                (!openDay ? '' :
                '<div class="card card--flush mt-2">' + d.slots.map(function (sl, si) {
                  var done = slotDone(d, sl);
                  /* Two controls, not one: the row logs and the aside swaps.
                     The sheet promised a swap for months and there was no
                     control on the screen that could perform one. */
                  return '<div class="row row--withaside">' +
                    '<button class="row__main row__main--btn" type="button" data-action="plan-log" data-d="' + di +
                      '" data-s="' + si + '" data-testid="plan-' + di + '-' + si + '"' +

                      '<span class="ico-well">' + (done ? ICO.tick : ICO.plus) + '</span>' +

                        '<span class="row__title">' + esc(sl.name) + '</span>' +
                        '<span class="row__sub">' + esc(sl.at) + (done ? ' &middot; logged' : '') + '</span>' +
                      '</span>' +
                      '<span class="row__value num">' + (sl.kcal ? n(sl.kcal) + '<small class="t-caption-2 quiet"> kcal</small>' : '&mdash;') + '</span>' +
                    '</button>' +
                    '<button class="iconbtn" type="button" data-action="plan-swap" data-d="' + di +
                      '" data-s="' + si + '" aria-label="Swap ' + esc(sl.name) + ' on ' + esc(d.d) +
                      '" data-testid="plan-swap-' + di + '-' + si + '">' + ICO.swap + '</button>' +
                  '</div>';
                }).join('') + '</div>' +
                '<button class="btn btn--secondary btn--block mt-2" type="button" ' +
                  'data-action="plan-log-day" data-d="' + di + '" data-testid="plan-log-day-' + di + '">' +
                  '<span class="btn__label">Log ' + (isToday ? 'the whole day' : 'all of ' + esc(d.d)) +

            '<p class="t-detail quiet mt-4">' + n(logged) + ' of ' + n(planned) + ' planned kcal logged this week.</p>' +
            (function () {
              var add = planNew(PLAN);
              return '<button class="btn btn--secondary btn--block mt-3" type="button" ' +
                'data-action="plan-shop" ' + (add.length ? '' : 'disabled ') +
                'data-testid="plan-shop"><span class="btn__label">' +
                (add.length
                  ? '+ Shopping list (' + add.length + ')'
                  : 'Everything is on the list or in the cupboard') +
                '</span></button>';
            })() +
          '</div>' +
        '</div>';
    }

    /* Building one. Ingredients come from the food table, so the macro total
       is the sum of real rows rather than a number somebody typed; a free-text
       line is allowed for the things a food table has no row for, and it is
       counted as zero and labelled as counted as zero. */
    /* Everything on this screen is measured against these. They were spread
       between lk_profile, a constant inside a formula and nothing at all, so
       there was no one place to go and correct the figures a target is
       computed from. */
    if (S.sheet === 'fuel-profile') {
      var fp = S.fp || fuelProfile();
      var macroMode = fp.macroMode || 'auto';
      var auto = calcMacros(fp);
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fp-title" ' +
          'data-detents="0.7 0.94" data-testid="sheet-fuel-profile">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="fp-title">What your targets are from</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="fp-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<div class="hstack hstack--3">' +
              '<div class="grow"><label class="t-label field__label" for="fp-w">Weight</label>' +

                '<p class="t-caption-1 quiet mt-1">kg</p></div>' +
              '<div class="grow"><label class="t-label field__label" for="fp-h">Height</label>' +
                '<input class="input num" id="fp-h" type="number" min="100" max="250" step="1" ' +
                  'inputmode="numeric" value="' + fp.heightCm + '" data-testid="fp-height">' +
                '<p class="t-caption-1 quiet mt-1">cm \u00b7 ' + ftIn(fp.heightCm) + '</p></div>' +
              '<div class="grow"><label class="t-label field__label" for="fp-a">Age</label>' +
                '<input class="input num" id="fp-a" type="number" min="13" max="100" step="1" ' +
                  'inputmode="numeric" value="' + fp.age + '" data-testid="fp-age">' +
                '<p class="t-caption-1 quiet mt-1">years</p></div>' +
            '</div>' +
            '<h3 class="t-label mt-5">Sex</h3>' +
            '<p class="t-caption-1 quiet mt-1">The formula uses it, and it is the only thing it ' +

            '<div class="seg seg--lg mt-2" role="radiogroup" aria-label="Sex" data-testid="fp-sex">' +

                return '<button class="seg__item" type="button" role="radio" ' +
                  'aria-checked="' + (fp.sex === x[0]) + '" data-action="fp-sex" data-v="' + x[0] + '" ' +
                  'data-testid="fp-sex-' + x[0] + '">' + x[1] + '</button>';
              }).join('') + '</div>' +
            '<h3 class="t-label mt-5">How hard the week is</h3>' +
            '<div class="card card--flush mt-2">' + ACTIVITY.map(function (x) {

                (fp.activity === x[0]) + '" data-action="fp-act" data-v="' + x[0] + '" ' +
                'data-testid="fp-act-' + x[0] + '">' +
                '<span class="opt__mark"><svg class="ico" viewBox="0 0 24 24" fill="none" ' +
                  'stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" ' +
                  'aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg></span>' +

                  x[0].charAt(0).toUpperCase() + x[0].slice(1) + '</span>' +
                  '<span class="opt__sub">' + esc(x[1]) + ' \u00b7 \u00d7' + x[2] + '</span></span>' +
              '</button>';
            }).join('') + '</div>' +
            '<h3 class="t-label mt-5">Goal</h3>' +
            '<div class="seg seg--lg mt-2" role="radiogroup" aria-label="Goal" data-testid="fp-goal">' +
              [['cut', 'Lose fat'], ['maintain', 'Maintain'], ['build', 'Build']].map(function (x) {
                return '<button class="seg__item" type="button" role="radio" ' +
                  'aria-checked="' + (fp.goal === x[0]) + '" data-action="fp-goal" data-v="' + x[0] + '" ' +
                  'data-testid="fp-goal-' + x[0] + '">' + x[1] + '</button>';
              }).join('') + '</div>' +
            '<h3 class="t-label mt-5">Macros</h3>' +
            '<div class="seg seg--lg mt-2" role="radiogroup" aria-label="How macros are set" ' +
                'data-testid="fp-macromode">' +
              [['auto', 'Worked out'], ['custom', 'Mine']].map(function (x) {
                return '<button class="seg__item" type="button" role="radio" ' +
                  'aria-checked="' + (macroMode === x[0]) + '" data-action="fp-mm" data-v="' + x[0] + '" ' +
                  'data-testid="fp-mm-' + x[0] + '">' + x[1] + '</button>';
              }).join('') + '</div>' +
            (macroMode === 'auto'
              ? '<div class="card card--sunken mt-3" data-testid="fp-auto">' +
                  '<div class="hstack hstack--3"><span class="t-body grow">Calories</span>' +
                    '<span class="t-body-em num">' + n(auto.kcal) + ' kcal</span></div>' +

                  '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Carbs</span>' +
                    '<span class="t-body-em num">' + n(auto.carb) + ' g</span></div>' +
                  '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Fat</span>' +
                    '<span class="t-body-em num">' + n(auto.fat) + ' g</span></div>' +
                  '<p class="t-caption-1 quiet mt-2">' + esc(auto.why) + '</p>' +
                '</div>'
              : '<p class="t-detail quiet mt-3">Your own figures stand. Change them in Daily ' +
                'targets; nothing here will move them.</p>') +
            '<h3 class="t-label mt-5">Anything you do not eat</h3>' +
            '<label class="t-label field__label mt-2" for="fp-diet">Dietary preferences</label>' +
            '<input class="input" id="fp-diet" type="text" autocomplete="off" ' +
              'placeholder="Vegetarian, no pork" value="' + esc(fp.diet || '') + '" ' +

            '<input class="input" id="fp-allergy" type="text" autocomplete="off" ' +

              'data-testid="fp-allergy">' +
            '<p class="t-caption-1 quiet mt-2">Written down and shown beside anything this app ' +
