<body>
<!--
  FUEL — built from Concept D, "Glance and Ledger merged, no Fuel Score".

  The whole screen answers one question: what is left to eat today, and how do
  I record what I just ate. Everything else is a chip at the bottom.

  WHY THE SPLIT BUTTON
  Voice and camera are the two fast paths and neither is secondary, so they
  share one accent control rather than competing as two. That keeps the
  screen's single accent on the single job the screen is for. Concept D's
  own note: "Mic and camera share one orange split button. Equal weight, one
  accent per surface, nothing floats over content."

  WHAT WAS CUT, AND ON WHOSE SAY-SO
  The Fuel Score is gone. It was a composite of weighted sub-scores, which
  reads as rigorous and cannot be acted on: the targets and the day's actuals
  already say what to do differently. Cut at the Wave 0 gate by the owner.
  Receipt scanning went with it, to Shopping, because parsing a receipt is a
  grocery job rather than a logging one.

  SOURCE BADGES ARE NOT DECORATION
  Every logged row says where its numbers came from. A verified barcode and an
  AI estimate from a photo are not the same claim, and a screen that renders
  them identically is lying about its own confidence. This is the trust layer
  the rebuild plan asks for, and it is why "Estimate" is a visible word rather
  than a shade of grey.

  STATES
  populated, first-weeks (the target is a formula until the trend takes over),
  hidden (numbers off, for anyone the numbers hurt), empty, loading, error.

  WHAT IS DELIBERATELY NOT HERE, AND WHY

  THE CYCLE STRIP (F-CYCLE-021). v6 carried a strip on this tab showing the
  active compound cycle. It was dead code there -- nothing rendered it -- and
  it is not rebuilt here, on purpose. Fuel answers "what do I eat today"; a
  cycle is a Stack question, and Stack is a gated feature that is absent
  entirely until somebody turns it on. Putting a cycle strip on the food tab
  would announce the gated feature to everybody who has not turned it on,
  which is the one thing the gate exists to prevent. The Stack chip, which
  appears only once tracking is on, is the whole of Fuel's relationship with
  it. CUT, by this package, with nothing lost: the strip never ran.

  THE SECOND MEAL PLANNER (F-SHOP-032b). v6 had a MealPlannerTab component as
  well as the planner inside Fuel. The second one was unreachable -- no route,
  no control, no tab -- so there is one meal planner here, in the Plan sheet,
  and the duplicate is not carried over. Nothing a person could reach is lost.

  WHAT NEEDS A SERVER, SAID WHERE IT IS USED

  The multi-source food search (USDA, FatSecret, Open Food Facts), the plate
  photo estimate and a coach's own recipes all need a backend this build does
  not have. Each of those surfaces says so at the point of use rather than
  pretending: the search sheet names the three sources it would reach, the
  camera sheet says its items are a worked example and not what is in the
  picture, and no lookup on this screen is ever faked.
-->

<script>
(function () {
  "use strict";

  var screen = document.getElementById('screen');
  var hdr = document.getElementById('hdr');
  var body = document.getElementById('body');
  var overlay = document.getElementById('overlay');
  var menu = document.getElementById('dev-menu');

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }
  function n(v) { return Number(v).toLocaleString('en-GB'); }

  var ICO = {
    mic: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
    cam: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    tick: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l5 5L19 7"/></svg>',
    chev: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg>',
    alert: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>',
    plus: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>',
    barcode: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6v12M7.5 6v12M11 6v9M14.5 6v12M18 6v12M20.5 6v9"/></svg>',
    /* The one row in the list that is not a food. See the comment on the
       closing row for why it is a line icon and the logged meals are not. */
    clock: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    /* Two arrows passing, for a swap. Not a refresh circle: a circle says
       "do this again" and a swap replaces one thing with another. */
    swap: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/></svg>',
    star: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 4 2.5 5.2 5.5.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.5-.8z"/></svg>',
    starOn: '<svg class="ico" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 4 2.5 5.2 5.5.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.5-.8z"/></svg>',
    /* Edit, remove, and back. The supplements list needs all three per row. */
    pencil: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 20h4L20 8l-4-4L4 16z"/></svg>',
    trash: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>',
    back: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 6l-6 6 6 6"/></svg>',
    /* A balance, for setting an amount. */
    scale: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4v16M5 20h14M7 7h10M7 7l-3 6h6zM17 7l3 6h-6z"/></svg>'
  };

  /* The day. Numbers are the fixture's, not invented at render time, so the
     same screen renders the same way every run and a screenshot diff means
     something. */
  /* A function, not a literal: the dev switcher rebuilds it so one state's
     edits do not leak into the next. */
  /* One source. Every figure below comes from window.LKFixtures, which is
     generated from tests/fixtures/seed-data.json -- the same file Home,
     Train, Recap, Progress and Settings read. This screen used to carry its
     own literals, and the cross-screen audit found it showing a body weight
     22% heavier than Settings and Progress, a calorie target 580 kcal from
     Recap's for the same day, a date two days behind the rest of the app,
     and macro bars carrying 10 g of carbs and 14 g of fat that belonged to
     no meal on the list. */
  var FX = window.LKFixtures || {};
  /* THE TABLE SHIPS; THE SEED DOES NOT. FX.nutrition carries both the
     lookup table and one person's logged days, and the product build drops
     the whole fixture -- correctly for the days, disastrously for the
     table. Search returned nothing, every barcode read Not found, the
     portion sheet could not be opened at all, and the sentence reader lost
     the unit out of "200 g chicken". food-table.js is the reference half,
     always shipped; the fixture still wins where it exists so the demo is
     unchanged. */
  var REF = window.LKFoodTable || {};
  var FXN = FX.nutrition || {};
  var NUT = {
    targets:  FXN.targets  || REF.targets  || {},
    microRef: FXN.microRef || REF.microRef || {},
    unitG:    FXN.unitG    || REF.unitG    || {},
    barcodes: FXN.barcodes || REF.barcodes || {},
    foods:    FXN.foods    || REF.foods    || {},
    /* Seed only. A build with none has no days and no trend, which is what
       a person who has logged nothing actually has. */
    days:        FXN.days || {},
    trend:       FXN.trend || [],
    trendSeries: FXN.trendSeries || []
  };
  var FOODS = NUT.foods;

  /* The store is the truth once a person has touched anything; the fixture is
     only the seed. Read through LKStore so a target edited on Settings, a
     weigh-in added on Progress and a meal logged here are all the same data. */
  var ST = window.LKStore;
  function stored(key, fb) { return ST ? ST.get(key, fb) : fb; }

  /* THESE TWO TABLES ARE READ BEFORE THE SCREEN RENDERS, so they are
     declared before it. TARGETS below computes from the profile when
     nothing has been set, and calls goalKey() and activityKey() to do it.
     Both were declared two hundred lines further down, where `var` leaves
     them hoisted but undefined -- so the call threw and the whole screen
     was blank.

     It never showed up with the seed, because a seeded device has targets
     already and the computing branch is never taken. The reader it broke
     for is the one upgrading: a profile carried over from the shipped app,
     no targets yet, and Fuel opens empty. */
  /* The same three words Settings writes. `lean bulk` was a fourth invented
     here and printed under every hero, whatever the profile said. */
  var GOAL_WORD = { cut: 'losing fat', maintain: 'holding steady', build: 'building' };
  var GOAL_OFFSET = { cut: -400, maintain: 0, build: 250 };
  /* How hard the week is. Stored, because it is a fact about a person, not
     about a screen; defaulted to moderate and said out loud where it is used,
     rather than being an invisible constant inside a formula. */
  var ACTIVITY = [
    ['sedentary', 'Desk job, little else', 1.2],
    ['light', 'On your feet, or training twice a week', 1.375],
    ['moderate', 'Training three to five days', 1.55],
    ['hard', 'Training six days, or a physical job', 1.725],
    ['athlete', 'Twice a day, or manual work plus training', 1.9]
  ];

  /* A STORED null IS NOT A PROFILE. stored() hands back exactly what is
     on the device, and a key written as null is not "nothing written" --
     it passes the default straight through and everything downstream then
     reads weight and height off null. Fuel died on it. */
  var PROFILE = (function () {
    var p = stored('lk_profile', null);
    if (p && typeof p === 'object' && !Array.isArray(p)) return p;
    return (FX.profile && typeof FX.profile === 'object') ? FX.profile : {};
  }());
  /* The day log, keyed by date. Untouched it is the fixture's four days; the
     moment anything is logged the stored map wins and the fixture is never
     consulted again. Everything this screen did -- a logged meal, a deleted
     one, a rescaled portion, a glass of water, a supplement tick, an edited
     target -- lived in a variable and was gone on reload. */
  var FUELLOG = stored('lk_fuelLog', null) || cloneDays(NUT.days || {});
  /* Targets, in order: what was set, then what the profile computes, then
     none at all. A build with no seed had none of the three and every figure
     on the hero read NaN -- which is what a new account saw. */
  var TARGETS = (function () {
    var own = stored('lk_fuelTargets', null);
    if (own && own.kcal) return own;
    var seeded = NUT.targets;
    if (seeded && seeded.kcal) return seeded;
    /* Computed from the profile, if there is enough of one to compute from.
       PROFILE is read above; calcMacros needs weight, height and age. */
    var p = PROFILE || {};
    if (p.weightKg && p.heightCm && p.age) {
      var m = calcMacros({ weightKg: p.weightKg, heightCm: p.heightCm, age: p.age,
                           sex: p.sex === 'male' ? 'male' : 'female',
                           goal: goalKey(), activity: activityKey() });
      var out = { kcal: m.kcal, pro: m.pro, carb: m.carb, fat: m.fat, waterMl: 0, computed: true };
      /* WRITTEN DOWN, so the rest of the app can read the same number.
         This was computed here and kept here, and lk_fuelTargets was only
         ever written by the profile sheet's Save -- so Recap, which reads
         that key, printed "350 of undefined kcal" and "NaN kcal over" for
         anybody who had not been through that sheet. A target the app
         computed for you is still your target. */
      try { if (ST && ST.set) ST.set('lk_fuelTargets', out); } catch (e) {}
      return out;
    }
    return { kcal: null, pro: null, carb: null, fat: null, waterMl: 0, unset: true };
  })();
  function hasTargets() { return !!(TARGETS && TARGETS.kcal); }

  function cloneDays(d) {
    try { return JSON.parse(JSON.stringify(d)); } catch (e) { return {}; }
  }

  /* Only the two real states write. The dev switcher's empty, loading, error
     and first-weeks views are a tool for looking at the screen, not a day
     somebody lived, and logging a meal inside one must not land in the log. */
  function persisting() { return S.state === 'populated' || S.state === 'hidden'; }

  function saveDay() {
    if (!ST || !persisting()) return;
    FUELLOG[DAY.iso] = {
      date: DAY.iso,
      meals: DAY.meals.map(function (m) {
        return { key: m.key || null, icon: m.icon, name: m.name, at: m.at, src: m.src,
                 slot: m.slot || slotOf(m),
                 kcal: m.kcal, pro: m.pro, carb: m.carb, fat: m.fat,
                 fibre: m.fibre, sugar: m.sugar, satfat: m.satfat, sodium: m.sodium,
                 base: m.base || null, scale: m.scale || 1 };
      }),
      eaten: DAY.eaten,
      pro: DAY.macros[0].have, carb: DAY.macros[1].have, fat: DAY.macros[2].have,
      waterMl: DAY.waterMl,
      supps: DAY.supps.map(function (sp) {
        return { name: sp.name, dose: sp.dose, when: sp.when, taken: sp.taken };
      })
    };
    ST.set('lk_fuelLog', FUELLOG);
    /* Supplements are one list the whole app reads, so today's ticks go back
       to the key Stack, Recap and Home read rather than only into the day.

       MERGED, not rebuilt. Writing a fresh object per row dropped freq,
       reminder and created -- fields this screen never shows and does not
       own -- so one tick here silently deleted the data Home's
       "supplements due" windows are computed from. Only `taken` is this
       screen's to change. */
    /* AND THE SHELF IS NOT REBUILT FROM THE DAY. This mapped DAY.supps
       into lk_supplements, and DAY.supps is built from today's day record
       -- so a supplement ADDED today was not in it, the map produced [],
       and the whole shelf was deleted. Ticking one supplement, logging any
       food, or adding a glass of water each wiped every supplement the
       reader had, permanently. The day says which are TAKEN; it has no
       opinion on which exist. */
    var kept = stored('lk_supplements', []) || [];
    if (!Array.isArray(kept)) kept = [];
    var out = kept.map(function (k) {
      var copy = {};
      if (k) Object.keys(k).forEach(function (f) { copy[f] = k[f]; });
      return copy;
    });
    (DAY.supps || []).forEach(function (sp) {
      if (!sp || !sp.name) return;
      var hit = null;
      for (var j = 0; j < out.length; j++) {
        if (out[j] && out[j].name === sp.name) { hit = out[j]; break; }
      }
      if (!hit) { hit = { name: sp.name }; out.push(hit); }
      hit.dose = sp.dose; hit.timeOf = sp.when; hit.taken = sp.taken;
    });
    ST.set('lk_supplements', out);
  }

  function saveTargetsTo(t) {
    TARGETS = t;
    if (ST && persisting()) ST.set('lk_fuelTargets', t);
  }
  var WEIGHTLOG = stored('lk_weightLog', FX.weightLog || []);

  function goalKey() {
    var g = PROFILE.goal;
    return GOAL_WORD[g] ? g : 'maintain';
  }

  /* ---------------------------------------------------------------
     What the body is actually spending
     --------------------------------------------------------------- */

  /* The shipped app stores this as `activityLevel`; this build calls it
     `activity`, and the five words are the same five. Read under both
     names, or an upgrading reader's week silently becomes a moderate one
     and their calorie target moves with it. */
  function activityOf(fp) { return (fp || {}).activity || (fp || {}).activityLevel; }
  function activityKey() {
    var k = activityOf(stored('lk_fuelProfile', {}) || {});
    for (var i = 0; i < ACTIVITY.length; i++) if (ACTIVITY[i][0] === k) return k;
    return 'moderate';
  }
  function activityFactor() {
    var k = activityKey();
    for (var i = 0; i < ACTIVITY.length; i++) if (ACTIVITY[i][0] === k) return ACTIVITY[i][2];
    return 1.55;
  }

  /* Mifflin-St Jeor, the formula every calculator uses, times the activity
     factor. This is the ESTIMATE: it knows your height and your age and
     nothing whatever about you. */
  function calcTDEE() {
    var w = PROFILE.weightKg, h = PROFILE.heightCm, a = PROFILE.age;
    if (!w || !h || !a) return null;
    var bmr = 10 * w + 6.25 * h - 5 * a + (PROFILE.sex === 'male' ? 5 : -161);
    return Math.round(bmr * activityFactor());
  }

  /* What the body actually did, which the formula cannot know. Over the
     window, average intake plus whatever the weight change accounts for:
     losing a kilo is roughly 7,700 kcal that did not come from the plate.
     This is the MEASUREMENT, and it is the better of the two the moment
     there are enough days behind it. */
  function measuredTDEE(days) {
    var se = series(days);
    if (se.length < 7) return null;
    var rate = weekRate();
    if (!rate || rate.days < 5) return null;
    /* Today is half-logged, so it would drag the average down. */
    var past = se.slice(0, -1);
    if (past.length < 6) return null;
    var avg = past.reduce(function (a, e) { return a + e.kcal; }, 0) / past.length;
    var kgPerDay = rate.kg / rate.days;
    return Math.round(avg - kgPerDay * 7700);
  }


  /* ---------------------------------------------------------------
     The refeed
     --------------------------------------------------------------- */

  /* Three consecutive new lows on a cut is the point at which eating less is
     no longer the thing that is working. The offer is carbs, because that is
     what a refeed is; it is an offer and not an instruction, and it lasts one
     day.

     Only on a cut. Offering somebody who is building a day of extra carbs
     because their weight keeps falling would be advice pointing the wrong
     way. */
  function refeedDue() {
    if (goalKey() !== 'cut') return null;
    var log = (WEIGHTLOG || []).filter(function (e) { return e && e.date && e.kg; })
      .slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    if (log.length < 4) return null;
    var lows = 0;
    for (var i = log.length - 1; i >= 1; i--) {
      var isLow = true;
      for (var j = 0; j < i; j++) if (log[j].kg <= log[i].kg) { isLow = false; break; }
      if (isLow) lows++; else break;
      if (lows >= 3) break;
    }
    if (lows < 3) return null;
    /* A refeed is a day at maintenance, not a day at twenty per cent more.
       Taking a blind percentage off a target that was itself set for a
       different goal gave 3,580 kcal on a cut, which is not a refeed, it is a
       different week. The ceiling is what this body is estimated to spend.
       Where that is unknown, a fifth more, capped. */
    var a = adaptive();
    var maint = a ? a.tdee : null;
    var want = maint !== null ? Math.max(DAY.target, Math.round(maint / 10) * 10)
                              : DAY.target + Math.round(DAY.target * 0.2 / 10) * 10;
    var extra = want - DAY.target;
    if (extra < 100) return null;     /* not a refeed, just a rounding */
    return { lows: lows, kcal: want, carb: DAY.macros[1].want + Math.round(extra / 4) };
  }

  function refeedOn() {
    var r = stored('lk_fuelRefeed', null);
    return r && r.date === DAY.iso ? r : null;
  }
  /* An offer turned down, with a cool-off, in the store rather than in a
     variable that a repaint clears. */
  function refeedDeclined() {
    var d = stored('lk_fuelRefeedNo', null);
    return !!(d && d.until && d.until > DAY.iso);
  }

  /* One place the figures a target is computed from actually live. They were
     spread across lk_profile, a constant inside a formula, and nothing at
     all. lk_profile still owns weight, height, age, sex and goal, because
     Settings and Progress write those; lk_fuelProfile carries what only this
     screen knows. */
  /* The six a person actually keeps. A chip is a fact the screen can act on;
     a sentence in a text box is a note it can only print back. */
  var DIETS = [
    ['veg', 'Vegetarian', ['beef', 'mince', 'chicken', 'pork', 'thigh', 'bacon', 'fish', 'tuna', 'salmon']],
    ['vegan', 'Vegan', ['beef', 'mince', 'chicken', 'pork', 'thigh', 'bacon', 'fish', 'tuna', 'salmon',
                        'egg', 'eggs', 'milk', 'cheese', 'skyr', 'yogurt', 'yoghurt', 'whey', 'butter']],
    ['pesc', 'Pescatarian', ['beef', 'mince', 'chicken', 'pork', 'thigh', 'bacon']],
    ['df', 'Dairy free', ['milk', 'cheese', 'skyr', 'yogurt', 'yoghurt', 'whey', 'butter', 'cream']],
    ['gf', 'Gluten free', ['bread', 'toast', 'pasta', 'oats', 'flour', 'wheat', 'couscous']],
    ['halal', 'Halal', ['pork', 'bacon', 'ham', 'gelatin']]
  ];
  function dietWords() {
    var fp = stored('lk_fuelProfile', {}) || {};
    var on = fp.diets || [];
    var words = [];
    DIETS.forEach(function (d) { if (on.indexOf(d[0]) >= 0) words = words.concat(d[2]); });
    String(fp.allergy || '').toLowerCase().split(/[^a-z]+/).forEach(function (w) {
      if (w.length >= 3) words.push(w);
    });
    return words;
  }
  /* A recipe whose ingredients name something you have said you do not eat.
     It is a check on the words in the ingredient lines and nothing more, and
     the list that uses it says so. */
  function dietBlocks(r) {
    var words = dietWords();
    if (!words.length) return null;
    var hay = ((r.ing || []).join(' ') + ' ' + r.name).toLowerCase();
    for (var i = 0; i < words.length; i++) {
      if (hay.indexOf(words[i]) >= 0) return words[i];
    }
    return null;
  }
  function pantryStaples() {
    return (stored('lk_pantryItems', []) || []).filter(function (x) { return x && !x.empty; })
      .map(function (x) { return x.name; });
  }

  function fuelProfile() {
    var fp = stored('lk_fuelProfile', {}) || {};
    return {
      weightKg: PROFILE.weightKg || 70,
      heightCm: PROFILE.heightCm || 170,
      age: PROFILE.age || 30,
      sex: PROFILE.sex === 'male' ? 'male' : 'female',
      goal: goalKey(),
      activity: activityKey(),
      macroMode: fp.macroMode === 'custom' ? 'custom' : 'auto',
      diet: fp.diet || '',
      diets: (fp.diets || []).slice(),
      ft: !!fp.ft,
      kcal: TARGETS.kcal || null,
      pro: TARGETS.pro || null, carb: TARGETS.carb || null, fat: TARGETS.fat || null,
      allergy: fp.allergy || '',
      flOz: !!fp.flOz
    };
  }

  function ftIn(cm) {
    var inches = Math.round(cm / 2.54);
    return Math.floor(inches / 12) + '\u2032 ' + (inches % 12) + '\u2033';
  }

  /* Protein first, fat second, carbs with what is left. Protein at 2 g per
     kilo because that is the figure the evidence keeps landing on for
     somebody lifting; fat at 25% of calories, which is a floor rather than a
     target; carbs are the remainder, because they are what a body uses to
     train and there is no reason to cap them below what is left over. */
  function calcMacros(fp) {
    var bmr = 10 * fp.weightKg + 6.25 * fp.heightCm - 5 * fp.age +
      (fp.sex === 'male' ? 5 : -161);
    var factor = 1.55;
    ACTIVITY.forEach(function (x) { if (x[0] === activityOf(fp)) factor = x[2]; });
    /* A goal this build does not offer -- "recomp", which an older
       version of the shipped app wrote and this reader still carries --
       used to print as the word "undefined" in the sentence under the
       targets. It reads as the nearest goal there is, said plainly. */
    var gk = GOAL_WORD[fp.goal] ? fp.goal : 'maintain';
    var kcal = Math.round((bmr * factor + (GOAL_OFFSET[gk] || 0)) / 10) * 10;
    var pro = Math.round(fp.weightKg * 2);
    var fat = Math.round(kcal * 0.25 / 9);
    var carb = Math.max(0, Math.round((kcal - pro * 4 - fat * 9) / 4));
    return {
      kcal: kcal, pro: pro, carb: carb, fat: fat,
      why: 'Mifflin-St Jeor at \u00d7' + factor + ', ' +
        (GOAL_OFFSET[gk] >= 0 ? '+' : '\u2212') + Math.abs(GOAL_OFFSET[gk] || 0) +
        ' kcal for ' + GOAL_WORD[gk] + '. Protein at 2 g a kilo, fat at a quarter of the ' +
        'calories, carbs with what is left.'
    };
  }

  /* The two, blended. Seventy per cent measurement to thirty per cent formula:
     the measurement is better but it is noisy, and a week of water weight
     should not move a target by four hundred calories. The move itself is
     then clamped, so nothing on this screen can swing a target more than
     150 kcal in one go. */
  function adaptive() {
    var est = calcTDEE(), meas = measuredTDEE(14);
    if (!est && !meas) return null;
    var tdee = meas === null ? est : (est === null ? meas : Math.round(meas * 0.7 + est * 0.3));
    var want = Math.round((tdee + (GOAL_OFFSET[goalKey()] || 0)) / 10) * 10;
    var move = want - DAY.target;
    var capped = Math.max(-150, Math.min(150, move));
    return {
      tdee: tdee, est: est, meas: meas,
      want: DAY.target + capped,
      move: capped,
      clamped: capped !== move,
      days: 14
    };
  }

  /* ---------------------------------------------------------------
     The weekly rhythm

     The blend above was right and did nothing with itself: the card offered a
     number, the tap moved the target, and nothing was written down about
     either. So the target only ever moved on the days somebody happened to
     scroll past a card, "Keep mine" lasted until the next paint, and there
     was no answer at all to "why is my target 2,830 now".

     A week is the cadence because the measurement behind it is a fortnight of
     intake against a fortnight of weigh-ins, and that does not say anything
     new on a Tuesday that it did not say on the Monday.
     --------------------------------------------------------------- */
  var ADAPT_DEFAULT = { auto: true, lastAt: null, dismissedUntil: null };
  function adaptState() {
    var v = stored('lk_fuelAdaptive', null) || {};
    return { auto: v.auto === undefined ? ADAPT_DEFAULT.auto : !!v.auto,
             lastAt: v.lastAt || null,
             dismissedUntil: v.dismissedUntil || null };
  }
  function writeAdapt(patch) {
    var v = adaptState();
    Object.keys(patch).forEach(function (k) { v[k] = patch[k]; });
    if (ST && persisting()) ST.set('lk_fuelAdaptive', v);
    return v;
  }
  /* Every move this screen has made to a target, with what it was and what it
     became. It is the answer to "why is my target what it is", and without it
     an adapting target is an oracle. */
  function tdeeHistory() { return stored('lk_tdeeHistory', []) || []; }
  function writeTdeeEntry(e) {
    if (!ST || !persisting()) return;
    var list = tdeeHistory().slice();
    list.unshift(e);
    ST.set('lk_tdeeHistory', list.slice(0, 40));
  }
  function adaptDue() {
    var st = adaptState();
    if (!st.lastAt) return true;
    return daysBetween(st.lastAt, DAY.iso) >= 7;
  }
  function adaptDismissed() {
    var st = adaptState();
    return !!(st.dismissedUntil && st.dismissedUntil > DAY.iso);
  }

  /* Move the target, write it down, and say so. One writer, so the card's
     button, the weekly pass and anything added later cannot record the move
     differently. */
  function applyAdaptive(a, how) {
    var from = DAY.target;
    var to = a.want;
    saveTargetsTo({ kcal: to, pro: DAY.macros[0].want, carb: DAY.macros[1].want,
                    fat: DAY.macros[2].want, waterMl: TARGETS.waterMl });
    writeTdeeEntry({ date: DAY.iso, from: from, to: to, move: to - from,
                     tdee: a.tdee, meas: a.meas, est: a.est, how: how });
    writeAdapt({ lastAt: DAY.iso, dismissedUntil: null });
    DAY = day();
    OFTEN = frequent();
    return { from: from, to: to };
  }

  /* The weekly pass, run on mount and on coming back to the tab. It only ever
     moves the target by the clamped amount the card shows, and it only runs
     when a week has gone by, so the number cannot drift under somebody's
     hands day after day. */
  function adaptiveTick() {
    if (!hasTargets()) return;
    if (!persisting()) return;
    var st = adaptState();
    if (!st.auto || !adaptDue()) return;
    /* NOT ON A SCREEN NOBODY HAS TOUCHED. Moving the target of somebody who
       has never logged a meal or set a figure would be the app changing its
       own mind about a person it has never met -- and the demo's seed would
       read one target here and another on Settings before anybody had done
       anything. Until the log or the targets have been written to, the card
       asks rather than acts. */
    if (!ST || !(ST.touched('lk_fuelLog') || ST.touched('lk_fuelTargets'))) return;
    var a = adaptive();
    if (!a || a.meas === null) return;
    if (Math.abs(a.move) < 20) {
      /* Nothing worth moving is still a check: the week is spent and the
         card should not open tomorrow asking the same question. */
      writeAdapt({ lastAt: DAY.iso });
      return;
    }
    var done = applyAdaptive(a, 'weekly');
    S.tdeeMoved = done;
  }

  /* Meals belong to a part of the day, and every path on this screen used to
     stamp a clock time and append to one flat list. Breakfast, lunch, dinner
     and a snack are how people actually read a day back: "I had no protein at
     breakfast" is a sentence about a slot, not about 8:05. */
  /* Fibre, sugar, saturated fat and sodium. The screen showed energy and
     three macros and nothing else, so a day could hit every macro on 4 g of
     fibre and 4,800 mg of sodium and the app had no opinion about it at all.

     Two of these are floors and two are ceilings, and they are labelled
     differently for that reason: 6 g of 30 is a shortfall, 4,100 mg of 2,400
     is an excess, and one bar style for both would say neither. */
  var MICROS = [
    { key: 'fibre',  name: 'Fiber',         unit: 'g',  aim: 'more' },
    { key: 'sugar',  name: 'Sugar',         unit: 'g',  aim: 'less' },
    { key: 'satfat', name: 'Saturated fat', unit: 'g',  aim: 'less' },
    { key: 'sodium', name: 'Sodium',        unit: 'mg', aim: 'less' }
  ];
  var MREF = NUT.microRef || { fibre: 30, sugar: 90, satfat: 20, sodium: 2400 };

  /* THE REFERENCE MOVES WITH THE TARGET. Four constants were checked against
     everybody: 30 g of fibre and 20 g of saturated fat are the figures for a
     2,000 kcal day, and somebody eating 3,000 was being told they were short
     of fibre they were not short of, and clear of saturated fat they were not
     clear of.

     Three of the four are proportions of energy and are computed as such:
     fibre at 14 g per 1,000 kcal, free sugars and saturated fat each at a
     tenth of the calories. Sodium is not a proportion of anything -- it is a
     ceiling for a body, not for a diet -- so it stays where it is and the
     panel says so. With no target set there is nothing to scale from and the
     stored references stand. */
  function microRefs() {
    var kcal = TARGETS && TARGETS.kcal;
    if (!kcal) return { fibre: MREF.fibre, sugar: MREF.sugar, satfat: MREF.satfat,
                        sodium: MREF.sodium, scaled: false };
    return {
      fibre: Math.round(kcal / 1000 * 14),
      sugar: Math.round(kcal * 0.10 / 4),
      satfat: Math.round(kcal * 0.10 / 9),
      sodium: MREF.sodium,
      scaled: true
    };
  }
  /* How much of today the figure is actually built from. A fibre total added
     up from two meals out of five is not a fibre total, and one line at the
     bottom of the panel saying "some meals have no breakdown" does not say
     which row it is talking about. */
  function microCover(key) {
    var meals = DAY.meals || [];
    var had = meals.filter(function (m) { return typeof m[key] === 'number'; }).length;

  }

  function microTotals(meals) {
    var t = {};
    MICROS.forEach(function (mi) { t[mi.key] = 0; });
    (meals || []).forEach(function (m) {
      MICROS.forEach(function (mi) { t[mi.key] += m[mi.key] || 0; });
    });
    MICROS.forEach(function (mi) { t[mi.key] = Math.round(t[mi.key] * 10) / 10; });

  }

  /* A meal's micros, which only exist where the food it came from had them.
     A photo estimate and a free-typed entry do not, and the panel says so
     rather than counting a missing figure as a zero. */
  function microsFrom(f) {
    var out = {};
    var any = false;
    MICROS.forEach(function (mi) {
      if (typeof f[mi.key] === 'number') { out[mi.key] = f[mi.key]; any = true; }
    });
    return any ? out : null;
  }

    var mi = f ? microsFrom(f) : null;
    if (mi) Object.keys(mi).forEach(function (k) { meal[k] = mi[k]; });
    return meal;
  }

  var SLOTS = [
    ['breakfast', 'Breakfast'], ['lunch', 'Lunch'],
    ['dinner', 'Dinner'], ['snack', 'Snack']
  ];
  function slotName(k) {
    for (var i = 0; i < SLOTS.length; i++) if (SLOTS[i][0] === k) return SLOTS[i][1];
    return 'Snack';
  }

     log path stamps this and every meal can be moved afterwards. */
  function slotForNow() {
    var h = new Date().getHours();

    if (h < 16) return 'lunch';
    if (h < 21) return 'dinner';
    return 'snack';
  }

     it filed dinner under Breakfast at three in the morning. The clock is
     the fallback when every slot already has something in it. */
  function nextEmptySlot() {
    var used = {};
    (DAY.meals || []).forEach(function (m) { used[slotOf(m)] = 1; });
    for (var i = 0; i < SLOTS.length; i++) if (!used[SLOTS[i][0]]) return SLOTS[i][0];
    return slotForNow();
  }

     clock times on this screen are 12-hour and carry no am or pm, so 8:05
     could be breakfast or a late dinner and guessing would put meals in the
     wrong part of the day with a confidence nothing earns. An unslotted meal
     is a snack, and it can be moved in one tap. */
  function slotOf(m) {
    var k = m && m.slot;
    for (var i = 0; i < SLOTS.length; i++) if (SLOTS[i][0] === k) return k;

  }

  function daysBetween(a, b) {
    return Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  }

  /* Rate of weight change per week, read off the log rather than asserted.
     This screen carried `weekPct: 0.34` as a literal and rendered it as
     "+0.34% / wk, on target" while the log behind it ran 64.5 -> 64.2 kg over
     the same week: a loss of 0.47%/wk, under a goal of building. The number
     was wrong, the sign was wrong and the verdict was printed without looking
     at either.

     The span is stretched back to at least five days on purpose. Two weigh-ins
     a day apart turn a glass of water into a 10%/wk trend. */
  function weekRate() {
    var log = (WEIGHTLOG || []).filter(function (e) { return e && e.date && e.kg; })
      .slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    if (log.length < 2) return null;
    var last = log[log.length - 1], i = log.length - 2;
    while (i > 0 && daysBetween(log[i].date, last.date) < 5) i--;

  }

  /* "On target" is a claim, so it has to be checked. The direction has to match
     the goal and the pace has to be one a body can hold: under 1%/wk either
     way. Everything else is named plainly, including going the wrong way. */
  function rateVerdict(pct, goal) {
    var a = Math.abs(pct);
    if (a < 0.1) return goal === 'maintain' ? 'steady, on target' : 'flat this week';
    if (goal === 'build') {
      if (pct < 0) return 'the wrong way for a build';
      return a > 1 ? 'faster than a build needs' : 'on target';
    }
    if (goal === 'cut') {
      if (pct > 0) return 'the wrong way for a cut';

  /* 35 ml per kg of body weight, rounded to the nearest 50. The water sheet
     says the target moves with your weight; before this it was a flat 3,000
     and the sentence was false. Where there is no weight, the fixture target
     stands and the sheet says which it is. */
  function waterGoal() {
    var kg = (weekRate() || {}).kgNow || PROFILE.weightKg || 0;
    if (!kg) return { ml: (TARGETS && TARGETS.waterMl) || 3000, computed: false };
    return { ml: Math.round(kg * 35 / 50) * 50, computed: true };
  }

  /* Every other screen reads lk_profile.useKg through LKUnits. This one did
     not mention LKUnits at all, so Settings read 141.5 lb and Fuel's hero
     still said 64.2 kg on the same phone. */
  function wtNum(kg) {
    if (kg === null || kg === undefined || isNaN(kg)) return '';
    return (Math.round(LKUnits.v(kg) * 10) / 10).toFixed(1);
  }
  function wtTxt(kg) {
    if (kg === null || kg === undefined || isNaN(kg)) return '\u2014';
    return wtNum(kg) + ' ' + LKUnits.label();
  }
  /* A weight typed into the field is in whatever unit is on screen. */
  function wtToKg(v) {
    return LKUnits.useKg() ? v : Math.round((v / 2.20462262) * 10) / 10;
  }
  if (window.LKUnits && LKUnits.onChange) LKUnits.onChange(function () { render(); });

  /* Mon 7 Sep, Tue 8 Sep, Wed 9 Sep. */
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function dayLabel(iso) {
    var p = iso.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    return WD[d.getUTCDay()] + ' ' + (+p[2]) + ' ' + MON[+p[1] - 1];
  }

  /* NOT a stored total. eaten and the three macro `have` figures are added up
     from DAY.meals every time the list changes, so a meal that is logged,
     rescaled or deleted cannot leave anything behind. The bars used to be
     stored figures nudged by each action, which is how they came to be 10 g
     and 14 g ahead of the meals that produced them and stayed there after the
     log was emptied. */
  function recount(d) {
    var t = { kcal: 0, pro: 0, carb: 0, fat: 0 };
    d.meals.forEach(function (m) {
      t.kcal += m.kcal || 0; t.pro += m.pro || 0; t.carb += m.carb || 0; t.fat += m.fat || 0;
    });
    d.eaten = Math.round(t.kcal);
    d.macros[0].have = Math.round(t.pro);
    d.macros[1].have = Math.round(t.carb);
    d.macros[2].have = Math.round(t.fat);
    return d;
  }

  /* A function, not a literal: the dev switcher rebuilds it so one state's
     edits do not leak into the next. */
  function day() {
    var iso = ST ? ST.today() : new Date().toISOString().slice(0, 10);
    var src = FUELLOG[iso] || { meals: [], waterMl: 0, supps: [] };
    var tg = TARGETS;
    var rf = ST ? ST.get('lk_fuelRefeed', null) : null;
    var isRefeed = rf && rf.date === iso;
    var d = {
      iso: iso,
      date: dayLabel(iso),
      target: isRefeed ? rf.kcal : tg.kcal,
      goal: GOAL_WORD[goalKey()],
      goalKey: goalKey(),
      weightKg: (weekRate() || {}).kgNow || PROFILE.weightKg || 0,
      rate: weekRate(),
      macros: [
        { name: 'Protein', have: 0, want: tg.pro, unit: 'g', key: 'pro' },
        { name: 'Carbs', have: 0, want: isRefeed ? rf.carb : tg.carb, unit: 'g', key: 'carb' },
        { name: 'Fat', have: 0, want: tg.fat, unit: 'g', key: 'fat' }
      ],
      meals: src.meals.map(function (m) {
        return { key: m.key || null, icon: m.icon, name: m.name, at: m.at,
                 slot: slotOf(m),
                 pro: m.pro, carb: m.carb, fat: m.fat, kcal: m.kcal, src: m.src,
                 fibre: m.fibre, sugar: m.sugar, satfat: m.satfat, sodium: m.sodium,
                 base: m.base || null, scale: m.scale || 1 };
      }),
      /* Not a target and not a nag: a pattern this person already has. */
      closing: { at: '7:30', pro: 40 },
      waterMl: src.waterMl,
      waterGoalMl: waterGoal().ml,
      waterGoalComputed: waterGoal().computed,
      /* Taken, not "due": the app knows what was swallowed, not what was
         intended. Two supplements, because that is what lk_supplements holds.
         This screen used to invent four and Recap a different three. */
      supps: (src.supps || []).map(function (sp) {
        return { name: sp.name, dose: sp.dose, when: sp.when, taken: sp.taken };
      }),
      /* Fourteen days of intake against target, the last four of them the
         days above added up. A trend is the only thing a single day cannot
         tell you, which is the whole reason this sheet exists. */
      trend: NUT.trend.slice(),
      /* Dated, and ending on the day the screen is showing. The old series
         was the fixture array, so logging 890 kcal left the last point at
         1,570 and the average at 2,702 under a heading reading "Last fourteen
         days" -- a chart of a day that had already changed. */
      series: (NUT.trendSeries || []).map(function (e) { return { date: e.date, kcal: e.kcal }; })
    };
    return recount(d);
  }

  var DAY = day();

  /* The series, with every day the store knows about laid over the seed and
     today's running total on the end. Read at render time, never stored, so
     it cannot drift from the diary above it. */
  /* EVERY DAY THAT WAS LOGGED, not only the days the seed happened to
     name. This started from DAY.series and overwrote dates already in it
     -- `if (byDate[iso] !== undefined)` -- so on a build with no seed the
     list began empty and no real day could ever enter it. Trends read
     "Nothing logged in these 14 days" however much had been logged, on
     every range, forever; and measuredTDEE(), which needs seven days of
     it, could never use a measurement either. The seed still contributes
     where there is one, so the demo is unchanged. */
  function series(n) {
    var byDate = {};
    (DAY.series || []).forEach(function (e) {
      if (e && e.date) byDate[e.date] = Math.round(e.kcal || 0);
    });
    Object.keys(FUELLOG || {}).forEach(function (iso) {
      var rec = FUELLOG[iso];
      if (!rec) return;
      var k = (rec.meals || []).reduce(function (a, m) { return a + (m.kcal || 0); }, 0);
      byDate[iso] = Math.round(k);
    });
    /* Today is read off the screen rather than the log: it is the one day
       still being edited. */
    if (DAY.iso) byDate[DAY.iso] = DAY.eaten;
    var out = Object.keys(byDate).sort().map(function (iso) {
      return { date: iso, kcal: byDate[iso] };
    });
    return out.slice(-n);
  }

  /* Body weight over the same window, so the two lines can be read against
     each other: intake alone says nothing about whether it is enough. */
  function weightAt(iso) {
    var log = (WEIGHTLOG || []).filter(function (e) { return e && e.date && e.kg && e.date <= iso; });
    if (!log.length) return null;
    return log[log.length - 1].kg;
  }

  /* THE TREND, not the weigh-ins. A scale reads food, water and salt as well
     as body mass, so the line drawn through raw weigh-ins zig-zags by half a
     kilo and a person reads a bad Tuesday off it. Every weight figure that is
     compared against another one on this screen goes through here.

     It is the Hacker's Diet smoothing: carry the last reading forward over
     the days with no weigh-in, then an exponential moving average at a tenth
     a day, seeded on the first reading rather than on zero -- seeding at zero
     spends a fortnight climbing and prints a trend nobody weighs. */
  var TREND_ALPHA = 0.1;
  function weightTrend(fromIso, toIso) {
    var log = (WEIGHTLOG || []).filter(function (e) { return e && e.date && e.kg; })
      .slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    if (!log.length) return [];
    var out = [], ema = null, li = 0;
    var cur = log[0].kg;
    var start = fromIso && fromIso < log[0].date ? log[0].date : (fromIso || log[0].date);
    var end = toIso || log[log.length - 1].date;
    if (end < start) return [];
    var d = start;
    for (var guard = 0; guard < 800 && d <= end; guard++) {
      while (li < log.length && log[li].date <= d) { cur = log[li].kg; li++; }
      ema = ema === null ? cur : ema + TREND_ALPHA * (cur - ema);
      out.push({ date: d, kg: cur, trend: Math.round(ema * 100) / 100 });
      d = isoPlus(d, 1);
    }
    return out;
  }
  function isoPlus(iso, k) {
    var p = iso.split('-');
    var t = Date.UTC(+p[0], +p[1] - 1, +p[2]) + k * 86400000;
    var d = new Date(t);
    return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) +
      '-' + ('0' + d.getUTCDate()).slice(-2);
  }
  /* The trend on or before a date, which is the lookup every chart and every
     comparison actually wants. Before the first weigh-in there is no trend,
     and that is returned as null rather than as the first reading. */
  var TREND_CACHE = null;
  function trendAt(iso) {
    if (!TREND_CACHE || TREND_CACHE.to !== DAY.iso) {
      TREND_CACHE = { to: DAY.iso, rows: weightTrend(null, DAY.iso) };
    }
    var rows = TREND_CACHE.rows, out = null;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].date <= iso) out = rows[i].trend; else break;
    }
    return out;
  }

  /* One day added up, out of the log rather than out of the series: the
     series carries energy only, so an average protein figure can only be
     honest over the days that have meals on them. `full` says whether every
     meal on the day carried the four micros, because a day with a photo
     estimate in it under-counts fibre rather than being wrong about it. */
  function dayTotals(iso) {
    var rec = FUELLOG[iso];
    var meals = (rec && rec.meals) || [];
    if (iso === DAY.iso) meals = DAY.meals;
    if (!meals.length) return null;
    var t = { kcal: 0, pro: 0, carb: 0, fat: 0, fibre: 0, sodium: 0, full: true };
    meals.forEach(function (m) {
      t.kcal += m.kcal || 0; t.pro += m.pro || 0; t.carb += m.carb || 0; t.fat += m.fat || 0;
      if (typeof m.fibre === 'number') t.fibre += m.fibre; else t.full = false;
      if (typeof m.sodium === 'number') t.sodium += m.sodium;
    });
    return t;
  }

  /* Averages over the days that were actually logged, which is the only
     window an average means anything over: a day nobody logged is not a day
     somebody ate nothing, and counting it as a zero drags every figure down. */
  function loggedAverages(dates) {
    var days = [], full = 0;
    dates.forEach(function (iso) {
      var t = dayTotals(iso);
      if (t) { days.push(t); if (t.full) full++; }
    });
    if (!days.length) return null;
    var mean = function (k) {
      return Math.round(days.reduce(function (a, d) { return a + d[k]; }, 0) / days.length);
    };
    return { n: days.length, full: full, kcal: mean('kcal'), pro: mean('pro'),
             carb: mean('carb'), fat: mean('fat'), fibre: mean('fibre'), sodium: mean('sodium') };
  }

  /* Whether today is a training day, read off the same history Train writes.
     Nothing in Fuel knew, so a rest day and a leg day were offered the same
     carbohydrate and the same closing line. It is a fact, not advice: the
     screen says which kind of day it is and leaves the target alone. */
  function trainedOn(iso) {
    var h = stored('lk_history', []) || [];
    for (var i = 0; i < h.length; i++) {
      if (h[i] && h[i].date === iso) return h[i];
    }
    return null;
  }
  function isTrainingDay() { return !!trainedOn(DAY.iso); }

  /* Module scope and with macros on it, because these rows log. The list was
     a literal inside the sheet's own render function and every row closed the
     sheet without logging anything, under copy that says "one tap logs it
     again with the same portion". */
  /* Counted, not asserted. These were four literals -- 63, 41, 28, 19 -- under
     copy that calls them "how often you log this", beside a log holding four
     days. Now they are the real tallies across every day on file, so a row
     that says 4 has been logged four times and the list reorders itself as
     that changes. */
  function frequent() {
    var tally = {};
    var days = FUELLOG || {};
    Object.keys(days).forEach(function (iso) {
      ((days[iso] || {}).meals || []).forEach(function (m) {
        var k = m.key;
        if (!k || !FOODS[k]) return;
        tally[k] = (tally[k] || 0) + 1;
      });
    });
    /* Kept foods first, then by count. A favourite that has been logged
       twice should not sit under one logged three times: keeping it was a
       deliberate act and the tally is not. */
    favourites().forEach(function (k) { if (FOODS[k] && !tally[k]) tally[k] = 0; });
    return Object.keys(tally).sort(function (a, b) {
      var fa = isFav(a) ? 1 : 0, fb = isFav(b) ? 1 : 0;
      return fb - fa || tally[b] - tally[a] || (FOODS[a].name < FOODS[b].name ? -1 : 1);
    }).slice(0, 6).map(function (k) {
      var f = FOODS[k];
      return { key: k, icon: f.icon, name: f.name, n: tally[k],
               kcal: f.kcal, pro: f.pro, carb: f.carb, fat: f.fat };
    });
  }
  var OFTEN = frequent();   /* rebuilt whenever the log changes */

  /* Saved recipes. A recipe is a food you assembled yourself: it carries its
     own ingredients and yields a number of servings, so logging one serving
     divides rather than making you do arithmetic at the counter.

     Macros here are the recipe's TOTAL, and the total is servings x the same
     per-serving food every other path on this screen logs, so one Chilli is
     one Chilli whether it arrives from the recipe, from the plan or from the
     often list. Per-serving is derived on read, never stored, because a
     stored per-serving figure and a changed serving count disagree the moment
     either one moves. */
  /* Priced off the food table, so a recipe for a food the table does not hold
     is not a recipe this screen can cost. With no table at all -- a build
     that ships no seed -- there are no recipes, and the sheet says so rather
     than throwing on the first paint. */
  function recipe(key, name, servings, ing, mins, tags, steps) {
    var f = FOODS[key];
    if (!f) return null;
    return { icon: f.icon, name: name, servings: servings, key: key,
             kcal: f.kcal * servings, pro: f.pro * servings,
             carb: f.carb * servings, fat: f.fat * servings, ing: ing,
             mins: mins || 0, tags: tags || [], steps: steps || [] };
  }
  /* A recipe is a thing somebody has to cook, so it carries how long it
     takes and what it is. A list of names and calories is a menu, and a menu
     does not help at six on a Tuesday. */
  var RECIPES = [
    recipe('chilli', 'Chilli, big batch', 6,
      ['1 kg beef mince, 5%', '2 tins kidney beans', '2 tins chopped tomatoes',
       '1 onion', '2 peppers', 'Chilli, cumin, paprika'],
      55, ['batch', 'freezes', 'high fibre'],
      ['Brown the mince hard, in two batches, so it colours rather than steams.',
       'Onion and peppers in the same pan until soft.',
       'Spices in for a minute, then the tomatoes and beans.',
       'Forty minutes at a bare simmer, lid off for the last ten.']),
    recipe('cnr', 'Chicken and rice, 4 days', 4,
      ['800 g chicken thigh', '400 g rice, dry', '2 tbsp olive oil', 'Soy, garlic, ginger'],
      40, ['batch', 'high protein'],
      ['Thighs in the oven at 200C for 30 minutes, skin up.',
       'Rice on at the same time, 400 g dry to 800 ml water, lid on, 12 minutes, then rest.',
       'Soy, garlic and ginger through the rice while it is hot.',
       'Divide into four while it is still warm, or it will not get divided.']),
    recipe('pancakes', 'Protein pancakes', 2,
      ['100 g oats', '2 scoops whey', '2 eggs', '150 g skyr', 'Baking powder'],
      15, ['quick', 'high protein'],
      ['Blitz everything to a batter. It should pour, not drop.',
       'Medium heat, dry pan, three minutes a side.',
       'They brown faster than flour pancakes because of the whey, so go lower than you think.']),
    /* Three more, because three recipes is a demo and six is a week. Each one
       is priced off a row of the food table, like the three above, so nothing
       here carries a figure the rest of the screen cannot reproduce. */
    recipe('skyr', 'Overnight oats, four jars', 4,
      ['200 g oats', '600 g skyr', '400 ml milk', '300 g frozen berries', '2 tbsp honey'],
      10, ['batch', 'no cook', 'high protein'],
      ['Oats, skyr and milk stirred together until there is no dry oat left.',
       'Berries and honey on top, lids on, fridge overnight.',
       'They keep four days. Any longer and the oats go to paste.']),
    recipe('bowl', 'Burrito bowls, four days', 4,
      ['600 g chicken thigh', '300 g rice, dry', '2 tins black beans', '1 jar salsa',
       '2 peppers', '1 lime'],
      35, ['batch', 'high protein'],
      ['Thighs in a hot pan, skin down, until they release. Ten minutes, then turn.',
       'Rice on at the same time. Beans warmed through with the salsa.',
       'Build the boxes cold: rice, beans, chicken, peppers. Lime on when you eat it.']),
    recipe('eggs', 'Big breakfast, two', 2,
      ['6 eggs', '4 slices bread', '20 g butter', '4 rashers bacon', '2 tomatoes'],
      20, ['quick'],
      ['Bacon in a dry pan first; everything else cooks in what comes out of it.',
       'Tomatoes cut side down beside it, five minutes, do not move them.',
       'Eggs last, off the heat for the final thirty seconds so they stay soft.'])
  ].filter(Boolean);

  /* Recipes you built yourself, after the three above. A built recipe carries
     its own macro total rather than borrowing a food's, because that is the
     whole point of building one: the figures are the ingredients you chose,
     added up, and one serving is that total divided by the servings you said
     it makes. "Build a recipe" used to toast "not in this build yet". */
  function ownRecipes() {
    var saved = (ST ? ST.get('lk_recipes', []) : []) || [];
    return saved.map(function (r) {
      return {
        own: true, id: r.id, icon: r.icon || '\ud83e\udd63', name: r.name,
        servings: r.servings || 1, key: null,
        kcal: r.kcal, pro: r.pro, carb: r.carb, fat: r.fat,
        ing: (r.items || []).map(ingLine).concat(r.notes || [])
      };
    });
  }
  /* FROM A COACH, READ ONLY. lk_coachRecipes is the key the shipped app's
     coach writes into and nothing in this build read it, so a recipe a coach
     wrote could not reach Fuel at all. It is read now: whatever is in that
     key is listed beside your own, marked, and cannot be edited here --
     editing somebody else's recipe on your device is how two people end up
     cooking different things off the same name.

     NOTHING WRITES IT IN THIS BUILD. A coach's recipes arrive over the same
     account sync as their plan, which needs the backend; the recipes sheet
     says so where the list is, rather than showing an empty section that
     looks like a coach who has sent nothing. */
  function coachRecipes() {
    var list = stored('lk_coachRecipes', []) || [];
    return list.filter(function (r) { return r && r.name && r.kcal; }).map(function (r) {
      return { coach: true, icon: r.icon || '\ud83d\udcd8', name: r.name,
               servings: r.servings || 1, key: null,
               kcal: r.kcal, pro: r.pro || 0, carb: r.carb || 0, fat: r.fat || 0,
               mins: r.mins || 0, tags: (r.tags || []).concat(['from your coach']),
               ing: r.ing || [], steps: r.steps || [] };
    });
  }
  function allRecipes() { return RECIPES.concat(ownRecipes()).concat(coachRecipes()); }

  /* Ordered by what is left of the day, not alphabetically. A recipe list is
     read at the point of "what do I cook", and the answer depends on what is
     already eaten. */
  /* WHAT YOU SAID YOU DO NOT EAT IS TAKEN OUT. Preferences were printed as a
     note beside a list that ignored them, which is the app writing something
     down to look like it is listening. Taken out, counted, and the count is
     shown -- a filter that hides things silently is its own problem. */
  function dietHidden() {
    return allRecipes().filter(function (r) { return !!dietBlocks(r); }).length;
  }
  function eatable() {
    return allRecipes().map(function (r, i) { return { r: r, i: i }; })
      .filter(function (e) { return !dietBlocks(e.r); });
  }
  function forYou() {
    var proLeft = Math.max(0, DAY.macros[0].want - DAY.macros[0].have);
    var kcalLeft = Math.max(0, DAY.target - DAY.eaten);
    return eatable().map(function (e) {
      var r = e.r, i = e.i;
      var per = r.kcal / r.servings, pro = r.pro / r.servings;
      var fits = kcalLeft === 0 || per <= kcalLeft;
      /* THE GOAL ORDERS IT. On a cut the lighter serving wins the tie; on a
         build the bigger one does. The same list in the same order whatever
         somebody is doing is a list that has not read the profile it prints a
         note from. */
      var gk = goalKey();
      var goalBias = gk === 'cut' ? -per / 60 : gk === 'build' ? per / 90 : 0;
      var sc = (fits ? 40 : 0) + Math.min(pro, proLeft) * 2 - (r.mins || 0) / 10 + goalBias;
      var note = !fits ? 'More than the ' + n(kcalLeft) + ' kcal left today'
        : proLeft > 0 ? 'Covers ' + n(Math.round(Math.min(pro, proLeft))) + ' g of the protein left'
        : '';
      return { r: r, i: i, s: sc, note: note };
    }).sort(function (a, b) { return b.s - a.s; });
  }

  /* How much of it is already in the cupboard. The shortest trip to the shop
     is the top of the list, which is the only ordering this tab can honestly
     offer: it is about what you have, not about what you want. */
  function fromPantry() {
    return eatable().map(function (e) {
      var r = e.r, i = e.i;
      var ing = r.ing || [];
      var have = ing.filter(function (line) { return pantryMatch(line) >= 0; }).length;
      return {
        r: r, i: i, s: ing.length ? have / ing.length : 0,
        note: ing.length ? have + ' of ' + ing.length + ' already in the cupboard'
                         : 'No ingredient list on this one'
      };
    }).sort(function (a, b) { return b.s - a.s; });
  }

  /* Written down, and shown where food is suggested. It is not a filter --
     the food table is eight rows and carries no ingredients, so a filter here
     would be a safety claim nothing behind it can keep. */
  function dietNote() {
    var fp = stored('lk_fuelProfile', {}) || {};
    var bits = [];
    (fp.diets || []).forEach(function (k) {
      DIETS.forEach(function (d) { if (d[0] === k) bits.push(d[1].toLowerCase()); });
    });
    if (fp.diet) bits.push(fp.diet);
    if (fp.allergy) bits.push('allergic to ' + fp.allergy);
    if (!bits.length) return '';
    var hid = dietHidden();
    return 'You have written down: ' + bits.join('; ') + '. ' +
      (hid ? hid + (hid === 1 ? ' recipe is' : ' recipes are') + ' hidden because an ingredient ' +
             'line names one of those words. '
           : 'Nothing here names any of those words. ') +
      'It is a word match on the ingredient lines, not a safety check \u2014 read them yourself.';
  }

  /* ---------------------------------------------------------------
     An ingredient line, read
     --------------------------------------------------------------- */

  /* "1 kg beef mince, 5%" is a quantity, a unit and a thing. The list took
     the whole string as the name of one item at quantity 1, so two recipes
     wanting mince put two rows on the list, neither of them saying how much,
     and a person at the counter had to add it up themselves.

     Everything it cannot read is still added -- as the line, at one, with no
     unit -- because dropping "Chilli, cumin, paprika" because it has no
     number in front of it would lose the ingredient entirely. */
  var SHOP_UNITS = ['kg', 'g', 'mg', 'l', 'ml', 'tbsp', 'tsp', 'cup', 'cups',
                    'tin', 'tins', 'can', 'cans', 'pack', 'packs', 'clove', 'cloves',
                    'slice', 'slices', 'scoop', 'scoops', 'bunch', 'punnet'];
  function parseIngredient(line) {
    var raw = String(line || '').trim();
    var m = raw.match(/^([0-9]+(?:[.,][0-9]+)?)\s*([A-Za-z]+)?\s+(.+)$/);
    if (!m) return { qty: 1, unit: '', name: raw };
    var qty = parseFloat(String(m[1]).replace(',', '.'));
    var unit = (m[2] || '').toLowerCase();
    var rest = m[3];
    if (unit && SHOP_UNITS.indexOf(unit) < 0) {
      /* "2 peppers" -- the word after the number is the thing, not a unit. */
      rest = m[2] + ' ' + rest;
      unit = '';
    }
    if (!isNaN(qty) && qty > 0) return { qty: qty, unit: unit, name: rest.trim() };
    return { qty: 1, unit: '', name: raw };
  }
  function sameItem(a, b) {
    return String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
  }
  /* Add, or add to. Two tins of tomatoes from one recipe and two from another
     is four tins on one row, not two rows saying two. Quantities only merge
     when the units agree: 500 g and 1 kg of mince are the same shop and not
     the same number, and adding them would print 501. */
  function shopAdd(list, parsed, tag, i) {
    for (var j = 0; j < list.length; j++) {
      var r = list[j];
      if (!sameItem(r.itemName, parsed.name)) continue;
      if (String(r.unit || '').toLowerCase() !== parsed.unit) continue;
      if (r.checked) continue;          /* already bought: a new row, not a bigger old one */
      r.quantity = Math.round(((+r.quantity || 0) + parsed.qty) * 100) / 100;
      return 'merged';
    }
    list.push({ id: 'sh_' + (Date.now() + i) + '_' + tag, itemName: parsed.name,
                quantity: parsed.qty, unit: parsed.unit,
                category: 'pantry', dateAdded: new Date().toISOString(), checked: false });
    return 'added';
  }
  function shopSay(added, merged) {
    var bits = [];
    if (added) bits.push(added + (added === 1 ? ' thing' : ' things') + ' added');
    if (merged) bits.push(merged + (merged === 1 ? ' row' : ' rows') + ' topped up');
    return bits.length ? bits.join(', ') + '.' : 'It is all on the list already.';
  }

  /* The missing half of a recipe, straight onto the list. */
  function recipeToShop(r) {
    var ing = (r.ing || []).filter(function (line) { return pantryMatch(line) < 0; });
    if (!ing.length) { say('It is all in the cupboard already.'); return; }
    var list = (stored('lk_shoppingList', []) || []).slice();
    var added = 0, merged = 0;
    ing.forEach(function (line, i) {
      var got = shopAdd(list, parseIngredient(line), 'rc', i);
      if (got === 'added') added++; else merged++;
    });
    if (ST && persisting()) ST.set('lk_shoppingList', list);
    render();
    say(shopSay(added, merged));
  }

  /* The totals a half-built recipe shows while it is being built. Free-text
     lines contribute nothing, and the sheet says so rather than letting a
     reader assume "2 tbsp olive oil" was counted. */
  /* AS WEIGHED, AND WHAT THAT IS OF THE RAW FOOD.

     A recipe is built at the counter with scales, and the builder could only
     take whole units of a food -- "2 x Chilli" -- which is not a quantity
     anybody weighs. Grams are what a scale reads, so grams are what an
     ingredient is.

     Cooked weight is the other half of the same problem: 400 g of dry rice is
     about 1.2 kg on the plate, and a table priced per raw serving prices
     cooked rice at three times what it is. The yield is asked for rather than
     assumed, because the food table carries no yields and inventing one per
     food would be a figure with nothing behind it. */
  function ingGrams(it) {
    var asWeighed = +it.g || 0;
    if (!it.cooked) return { as: asWeighed, raw: asWeighed };
    var y = +it.yieldPct;
    if (!y || y <= 0) return { as: asWeighed, raw: asWeighed };
    return { as: asWeighed, raw: Math.round(asWeighed * 100 / y) };
  }
  /* One ingredient's figures, whatever kind of ingredient it is. */
  function ingMacros(it) {
    var out = { kcal: 0, pro: 0, carb: 0, fat: 0 };
    var g = ingGrams(it).raw;
    if (it.per100) {
      var k100 = g / 100;
      out.kcal = (+it.per100.kcal || 0) * k100; out.pro = (+it.per100.pro || 0) * k100;
      out.carb = (+it.per100.carb || 0) * k100; out.fat = (+it.per100.fat || 0) * k100;
      return out;
    }
    var f = FOODS[it.key];
    if (!f) return out;
    /* A recipe saved before ingredients had grams counted whole servings, and
       a stored recipe never changes shape under a person: it is read the way
       it was written. */
    var k = it.g === undefined ? (+it.qty || 0) : (g / f.g);
    out.kcal = f.kcal * k; out.pro = f.pro * k; out.carb = f.carb * k; out.fat = f.fat * k;
    return out;
  }
  function ingName(it) {
    if (it.per100) return it.name;
    var f = FOODS[it.key];
    return f ? f.name : it.key;
  }
  /* The shopping-list line a built ingredient becomes: a quantity, a unit and
     a thing, in the shape parseIngredient reads back. */
  function ingLine(it) {
    if (it.g === undefined) {
      return (it.qty === 1 ? '' : it.qty + ' \u00d7 ') + ingName(it);
    }
    var g = ingGrams(it);
    return n(g.as) + ' g ' + ingName(it) + (it.cooked ? ' (cooked)' : '');
  }
  function draftTotals(d) {
    var t = { kcal: 0, pro: 0, carb: 0, fat: 0 };
    (d.items || []).forEach(function (it) {
      var m = ingMacros(it);
      t.kcal += m.kcal; t.pro += m.pro; t.carb += m.carb; t.fat += m.fat;
    });
    return t;
  }

  /* The week's plan. Each slot names a food, and the food carries the
     figures -- a slot used to carry a bare kcal and nothing else, so logging
     a planned meal moved the calorie count and left all three macro bars
     untouched, under-counting 41 g of protein a meal.

     Today's slots are not marked done by hand either. A slot is logged when
     a meal of that name is on today's list, so the plan and the ledger for
     the same day cannot disagree -- and they did: the plan called Monday
     1,760 kcal while the ledger for that Monday held 1,570.

     NOT BUILT, deliberately: the swap-by-AI path. In the shipped app a failed
     swap invented four meals and wrote them into the saved plan as though a
     model had returned them (audit H2). Swapping here picks from your own
     recipes and often-logged meals, which cannot fabricate anything. */
  function slot(at, key) {
    var f = FOODS[key];
    /* A slot names a food from the table. With no table there is no plan to
       seed, which is the state a new account is in anyway. */
    if (!f) return null;
    var k = at.toLowerCase();
    var sl = k.indexOf('breakfast') === 0 ? 'breakfast'
           : k === 'lunch' ? 'lunch' : k === 'dinner' ? 'dinner' : 'snack';
    return { at: at, slot: sl, key: key, name: f.name,
             kcal: f.kcal, pro: f.pro, carb: f.carb, fat: f.fat };
  }
  var PLAN = [
    { d: 'Mon', iso: '2026-09-07', slots: [slot('Breakfast', 'eggs'), slot('Lunch', 'bowl'),
        slot('Dinner', 'chilli'), slot('Snack', 'shake'), slot('Second breakfast', 'pancakes'),
        slot('Evening', 'skyr')] },
    { d: 'Tue', iso: '2026-09-08', slots: [slot('Breakfast', 'eggs'), slot('Lunch', 'cnr'),
        slot('Dinner', 'pasta'), slot('Snack', 'shake'), slot('Evening', 'pancakes')] },
    { d: 'Wed', iso: '2026-09-09', slots: [slot('Breakfast', 'eggs'), slot('Lunch', 'bowl'),
        slot('Snack', 'shake'), slot('Dinner', 'chilli')] },
    { d: 'Thu', iso: '2026-09-10', slots: [slot('Breakfast', 'pancakes'), slot('Lunch', 'cnr'),
        slot('Dinner', 'pasta')] },
    { d: 'Fri', iso: '2026-09-11', slots: [slot('Breakfast', 'shake'), slot('Lunch', 'chilli'),
        slot('Dinner', 'bowl')] }
  ].map(function (d) { d.slots = d.slots.filter(Boolean); return d; })
   .filter(function (d) { return d.slots.length; });

  /* A swapped meal is a change to the plan, so it is stored. Untouched, the
     plan is the one above. */
  (function () {
    var saved = ST ? ST.get('lk_fuelPlan', null) : null;
    if (!saved || !saved.length || !saved[0].slots) return;
    /* The WHOLE plan is restored, not a list of keys patched into the literal
       above by index. Patching by index worked only while the stored plan had
       the same shape as the built-in one: saving a five-day, four-meal week
       over a plan whose days run six, five, four, three, three put four meals
       into the first day and left the rest of the old week standing. */
    var rebuilt = [];
    saved.forEach(function (sd) {
      var slots = [];
      (sd.slots || []).forEach(function (e) {
        var k = typeof e === 'string' ? e : e && e.key;
        var at = (e && e.at) || 'Meal';
        if (k && FOODS[k]) slots.push(slot(at, k));
      });
      if (slots.length) rebuilt.push({ d: sd.d || '', iso: sd.iso, slots: slots });
    });
    if (rebuilt.length) { PLAN.length = 0; rebuilt.forEach(function (d) { PLAN.push(d); }); }
  })();

  /* What a recipe is made of, as shopping-list rows. A planned meal that
     cannot reach the list is a document. Foods that are not recipes have no
     ingredient list, so they go on as themselves -- which is honest: "Chilli"
     on a list you wrote yourself means something to you. */
  function planIngredients(days) {
    var want = {};
    days.forEach(function (d) {
      d.slots.forEach(function (sl) {
        var r = null;
        allRecipes().forEach(function (x) { if (x.key === sl.key) r = x; });
        if (r && r.ing && r.ing.length) {
          r.ing.forEach(function (line) { want[line] = (want[line] || 0) + 1; });
        } else {
          want[FOODS[sl.key].name] = (want[FOODS[sl.key].name] || 0) + 1;
        }
      });
    });
    return Object.keys(want).map(function (name) { return { name: name, n: want[name] }; });
  }

  /* Dedupe against what is already on the list and against what is already in
     the cupboard. Adding twelve eggs to a list that says twelve eggs is how a
     list stops being read. */
  function planNew(days) {
    var have = {};
    (stored('lk_shoppingList', []) || []).forEach(function (r) {
      have[String(r.itemName || '').toLowerCase()] = true;
    });
    (stored('lk_pantryItems', []) || []).forEach(function (r) {
      if (!r.empty) have[String(r.name || '').toLowerCase()] = true;
    });
    return planIngredients(days).filter(function (it) {
      var nm = it.name.toLowerCase();
      var hit = false;
      Object.keys(have).forEach(function (h) {
        if (nm.indexOf(h) >= 0 || h.indexOf(nm) >= 0) hit = true;
      });
      return !hit;
    });
  }

  function addPlanToShop(days) {
    var add = planNew(days);
    if (!add.length) { say('Everything on it is already on the list or in the cupboard.'); return; }
    var list = (stored('lk_shoppingList', []) || []).slice();
    var added = 0, merged = 0;
    add.forEach(function (it, i) {
      /* The plan counts how many times a line appears across the week, so a
         line that is itself a quantity is multiplied rather than repeated:
         three dinners of chilli want 3 kg of mince, not "1 kg beef mince x 3". */
      var pi = parseIngredient(it.name);
      pi.qty = Math.round(pi.qty * it.n * 100) / 100;
      var got = shopAdd(list, pi, 'plan', i);
      if (got === 'added') added++; else merged++;
    });
    if (ST && persisting()) ST.set('lk_shoppingList', list);
    render();
    say(shopSay(added, merged));
  }

  /* ---------------------------------------------------------------
     The cupboard, and what logging takes out of it
     --------------------------------------------------------------- */

  /* Loose, on purpose. "Greek yogurt" in the pantry and "Skyr, plain" on the
     plate are the same tub to the person who bought it, and a match that
     insists on the exact string would deplete nothing, ever. A word of four
     letters or more shared between the two is enough. */
  /* EVERY word of the cupboard item has to be in the meal, not any one of
     them. A single shared word meant "Eggs, toast, butter" matched "Peanut
     butter" on `butter`, so eating breakfast emptied the peanut butter and
     put it on the shopping list. */
  function sigWords(name) {
    var all = String(name || '').toLowerCase().split(/[^a-z]+/).filter(Boolean);
    var big = all.filter(function (w) { return w.length >= 4; });
    return big.length ? big : all;
  }
  function pantryMatch(foodName) {
    var pantry = stored('lk_pantryItems', []) || [];
    var meal = String(foodName).toLowerCase().split(/[^a-z]+/).filter(Boolean);
    var has = {};
    meal.forEach(function (w) { has[w] = 1; has[w.replace(/s$/, '')] = 1; });
    for (var i = 0; i < pantry.length; i++) {
      var it = pantry[i];
      if (it.empty) continue;
      var want = sigWords(it.name);
      var all = want.length > 0;
      for (var j = 0; j < want.length; j++) {
        if (!has[want[j]] && !has[want[j].replace(/s$/, '')]) { all = false; break; }
      }
      if (all) return i;
    }
    return -1;
  }

  /* Logging a food takes it out of the cupboard, and the last of it goes
     straight onto the list. This is the loop the two screens were missing:
     the pantry was a list somebody edited by hand, so it drifted away from
     what had actually been eaten within a day. */
  function depletePantry(foodName) {
    if (!ST || !persisting()) return null;
    var pantry = (stored('lk_pantryItems', []) || []).slice();
    var i = pantryMatch(foodName);
    if (i < 0) return null;
    var it = pantry[i];
    var q = typeof it.quantity === 'number' ? it.quantity : 1;
    q -= 1;
    if (q > 0) {
      it.quantity = q; ST.set('lk_pantryItems', pantry);
      return { name: it.name, tookQty: true, listed: false, emptied: false };
    }
    var wasQty = it.quantity;
    it.quantity = 0;
    it.empty = true;
    ST.set('lk_pantryItems', pantry);
    /* Onto the list, unless it is already there. Running out is exactly when
       a thing should appear on a list without anybody remembering to add it. */
    var list = (stored('lk_shoppingList', []) || []).slice();
    var already = list.some(function (r) {
      return String(r.itemName || '').toLowerCase() === String(it.name).toLowerCase();
    });
    var listedId = null;
    if (!already) {
      listedId = 'sh_' + Date.now() + '_out';
      list.push({ id: listedId, itemName: it.name, quantity: 1,
                  unit: it.unit || '', category: it.category || 'pantry',
                  dateAdded: new Date().toISOString(), checked: false });
      ST.set('lk_shoppingList', list);
    }
    return { name: it.name, tookQty: true, emptied: true,
             wasQty: wasQty, listed: !!listedId, listedId: listedId };
  }

  /* The inverse. Deleting a meal used to give the macros back and leave the
     cupboard empty and the shopping list carrying a row nobody added: the
     screen could take a thing out of the cupboard but never put it back. */
  function restorePantry(rec) {
    if (!ST || !persisting() || !rec || !rec.name) return;
    var pantry = (stored('lk_pantryItems', []) || []).slice();
    for (var i = 0; i < pantry.length; i++) {
      if (String(pantry[i].name).toLowerCase() !== String(rec.name).toLowerCase()) continue;
      var q = typeof pantry[i].quantity === 'number' ? pantry[i].quantity : 0;
      pantry[i].quantity = rec.emptied ? (rec.wasQty || 1) : q + 1;
      if (rec.emptied) pantry[i].empty = false;
      ST.set('lk_pantryItems', pantry);
      break;
    }
    if (!rec.listedId) return;
    var list = (stored('lk_shoppingList', []) || []).filter(function (r) {
      return r.id !== rec.listedId;
    });
    ST.set('lk_shoppingList', list);
  }

  /* ---------------------------------------------------------------
     Building a week
     --------------------------------------------------------------- */

  var DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  /* Built from the food table, against the day's calorie and protein target,
     and NOT randomly: a generator that shuffles a list produces a different
     week every time you look at it, which is how a plan stops being a plan.
     It fills the biggest gap each time and refuses to put the same food in
     two consecutive slots of a day.

     Nothing here is generated by a model. Everything in the week is a row
     from the table, so no meal in it can be invented. */
  /* What a meal costs, where the shopping screen has a price for it. There
     is no price on the food table, so the only honest source is what the
     budget screen has recorded, and where it has nothing the generator says
     it is not costing anything rather than guessing. */
  function budgetSpent() {
    var b = stored('lk_budgetData', null);
    if (!b) return null;
    var weekly = b.weeklyBudget || b.weekly || b.budget || null;
    return weekly ? { weekly: weekly } : null;
  }

  function buildPlan(days, perDay, avoid) {
    var slotsFor = { 2: ['Lunch', 'Dinner'],
                     3: ['Breakfast', 'Lunch', 'Dinner'],
                     4: ['Breakfast', 'Lunch', 'Dinner', 'Snack'],
                     5: ['Breakfast', 'Lunch', 'Snack', 'Dinner', 'Evening'] }[perDay] ||
                   ['Breakfast', 'Lunch', 'Dinner'];
    /* WHAT YOU SAID YOU DO NOT EAT COMES OUT OF THE POOL. The generator read
       a free-text box on its own sheet and nothing else, so somebody who had
       ticked Vegetarian on their profile was handed a week of beef. One
       filter, shared with the sheet that reports how much of the table is
       left. */
    var pool = buildPool(avoid);
    if (!pool.length) return null;
    var tally = {};
    var out = [];
    var start = Date.parse(DAY.iso + 'T00:00:00Z');
    for (var d = 0; d < days; d++) {
      var iso = new Date(start + d * 86400000).toISOString().slice(0, 10);
      var used = null, slots = [], kcal = 0, pro = 0;
      for (var si = 0; si < slotsFor.length; si++) {
        var remainKcal = DAY.target - kcal;
        var remainSlots = slotsFor.length - si;
        var wantKcal = remainKcal / remainSlots;
        var wantPro = (DAY.macros[0].want - pro) / remainSlots;
        var best = null, bestScore = -1e9;
        pool.forEach(function (k) {
          if (k === used) return;              /* not twice in a row */
          var f = FOODS[k];
          /* Two things at once. Hitting the day's numbers is the job, so the
             calorie and protein error dominate; the repeat penalty only
             breaks ties between foods that fit about as well. Without any
             repeat penalty the picker is deterministic against a fixed
             target and every day came back with the same three meals -- a
             correct answer to the arithmetic and a useless week. With too
             large a penalty the week drifted 1,100 kcal under target, which
