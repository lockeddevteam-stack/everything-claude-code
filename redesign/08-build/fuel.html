    return '<div class="section"><div class="section__head">' +

        OFTEN.map(function (r, i) {

              '" data-testid="meals-often-' + i + '">' +

                '<span class="row__title">' + esc(r.name) + '</span>' +
                '<span class="row__sub num">logged ' + r.n + ' times</span>' +
              '</span>' +
              '<span class="row__value num">' + n(r.kcal) +
                '<small class="t-caption-2 quiet"> kcal</small></span>' +
              '<span class="row__chev">' + ICO.plus + '</span>' +

            '<button class="iconbtn" type="button" data-action="fav" data-k="' + r.key + '" ' +

  /* YOUR FOODS, with a surface of its own. It lived three taps inside the
     meals sheet, which is where a thing goes when nobody expects it to be

  function recipesSection() {
    var list = forYou().slice(0, 4);
    return '<div class="section"><div class="section__head">' +
        '<h2 class="t-label">Recipes</h2>' +
        '<button class="hdr__action" type="button" data-action="recipes" data-testid="open-recipes">All</button>' +
      '</div>' +
      (list.length
        ? '<div class="card card--flush" data-testid="meals-recipes">' + list.map(function (e) {
            var r = e.r;
            return '<button class="row" type="button" data-action="open-recipe-sheet" data-i="' + e.i +
              '" data-testid="meals-recipe-' + e.i + '">' +
              '<span class="fuel-thumb" aria-hidden="true">' + r.icon + '</span>' +
              '<span class="row__main stack">' +
                '<span class="row__title">' + esc(r.name) + '</span>' +
                '<span class="row__sub num">' + n(Math.round(r.kcal / r.servings)) + ' kcal a serving' +
                  (r.mins ? ' \u00b7 ' + r.mins + ' min' : '') + '</span>' +
                (e.note ? '<span class="row__sub">' + esc(e.note) + '</span>' : '') +
              '</span>' +
              '<span class="row__chev">' + ICO.chev + '</span></button>';
          }).join('') + '</div>'
        : '<div class="card"><p class="t-body">No recipes yet.</p></div>') +
      '<div class="gutter"><button class="btn btn--secondary btn--block mt-2" type="button" ' +
        'data-action="new-recipe" data-testid="meals-new-recipe">' +
        '<span class="btn__label">Build a recipe</span></button></div>' +
    '</div>';
  }

  /* USE IT SOON. Nothing in the cupboard carries an expiry date -- the app
     never asked for one and inventing one would be a food-safety claim with
     nothing behind it -- so what this can honestly say is how long something
     has been in, against the interval you said you replace it on. A staple
     past its interval is a restock, and a fresh thing that has been in three
     weeks is worth a look. Both are said in those words. */
  var FRESH_DAYS = 14;
  function useSoon() {
    var today = DAY.iso;
    return (stored('lk_pantryItems', []) || []).filter(function (x) {
      return x && x.name && !x.empty && x.dateAdded;
    }).map(function (x) {
      var added = String(x.dateAdded).slice(0, 10);
      var age = daysBetween(added, today);
      if (isNaN(age) || age < 0) return null;
      if (x.staple && x.intervalDays) {
        if (age < x.intervalDays) return null;
        return { name: x.name, age: age,
                 why: 'a restock: you replace it about every ' + x.intervalDays + ' days and it ' +
                      'went in ' + age + ' days ago' };
      }
      if (x.category === 'other' && age >= FRESH_DAYS) {
        return { name: x.name, age: age,
                 why: 'in the fridge ' + age + ' days, and fresh things do not keep that long' };
      }
      return null;
    }).filter(Boolean).sort(function (a, b) { return b.age - a.age; });
  }
  function useSoonCard() {
    var list = useSoon();
    if (!list.length) return '';
    return '<div class="section"><div class="section__head">' +
        '<h2 class="t-label">Worth using</h2>' +
        '<button class="hdr__action" type="button" data-action="more" data-testid="usesoon-shop">Shop</button>' +
      '</div>' +
      '<div class="card card--flush" data-testid="use-soon">' +
        list.slice(0, 4).map(function (x, i) {
          return '<div class="row row--static" data-testid="use-soon-' + i + '">' +
            '<span class="row__main stack">' +
              '<span class="row__title">' + esc(x.name) + '</span>' +
              '<span class="row__sub">' + esc(x.why) + '</span>' +
            '</span></div>';
        }).join('') +
      '</div>' +
      '<p class="t-caption-1 quiet gutter mt-2">Worked out from when it went into the cupboard, ' +
        'not from a date on the packet \u2014 nothing here records one, and a use-by this app made ' +
        'up is not a thing to eat off.</p>' +
    '</div>';
  }

  function mealsView() {
    return planTodayCard() + oftenSection() + useSoonCard() + yourFoodsSection() +
      recipesSection() + '<div>' + chips() + '</div>';
  }

  /* ---------------------------------------------------------------
     Views
     --------------------------------------------------------------- */
  var VIEWS = {};

  VIEWS.populated = function () {
    if ((S.view || fuelView()) === 'meals') {
      return '<div>' + hero() + viewSeg() + '</div>' + mealsView();
    }
    return '<div>' + hero() + viewSeg() + logAction() + macros() + microPanel() + '</div>' +
      today() +
      '<div>' + refeedCard() + tdeeCard() + suggestCard() +
        waterCard() + weightCard() + chips() + '</div>';
  };
  VIEWS['first-weeks'] = VIEWS.populated;
  VIEWS.hidden = VIEWS.populated;
  VIEWS.live = VIEWS.populated;
  VIEWS['stack-on'] = VIEWS.populated;

  VIEWS.empty = function () {
    return '<div>' + hero() + logAction() + '</div>' +
      '<div class="empty mt-5" data-testid="state-empty">' +
        '<p class="empty__title">Nothing logged today</p>' +
        '<p class="empty__body">Say what you ate or snap the plate. The first one takes ' +
          'about ten seconds and the rest get faster, because it learns what you eat.</p>' +
      '</div>';
  };

  VIEWS.loading = function () {
    return '<div role="status" aria-busy="true" aria-label="Loading today">' +
      '<div class="skel" style="height: 56px; width: 60%"></div>' +
      '<div class="skel mt-2" style="height: var(--sp-4); width: 78%"></div>' +
      '<div class="skel mt-4" style="height: 64px"></div>' +
      '<div class="card mt-4">' +
        '<div class="skel" style="height: var(--sp-4); width: 40%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-2)"></div>' +
        '<div class="skel mt-4" style="height: var(--sp-4); width: 36%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-2)"></div>' +
      '</div></div>';
  };

  VIEWS.error = function () {
    return '<div class="mt-4" data-testid="state-error">' +
      '<div class="banner banner--error">' + ICO.alert +
        '<span><strong>Today did not load</strong>What you logged is on this device and is not lost. ' +
          'The targets need the server and it did not answer.</span></div>' +
      '<button class="btn btn--primary btn--block mt-4" type="button" data-action="retry" data-testid="retry">' +
        '<span class="btn__label">Try again</span></button>' +
      '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="mic" data-testid="log-offline">' +
        '<span class="btn__label">Log anyway, without targets</span></button>' +
    '</div>';
  };

  /* ---------------------------------------------------------------
     Sheets. Both fast paths open one, and both say what they are doing
     rather than spinning.
     --------------------------------------------------------------- */
  /* A logged row, opened. Everything the log knows about one entry, and the
     two things you can do to it: change what it was, or take it back. */
  function mealSheet(m, i) {
    var pct = Math.round(m.kcal / DAY.target * 100);
    return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ml-title" ' +
        'data-detents="0.55 0.88" data-testid="sheet-meal">' +
        '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
        '<div class="sheet__head">' +
          '<span class="fuel-thumb" aria-hidden="true">' + m.icon + '</span>' +
          '<h2 class="t-headline grow" id="ml-title">' + esc(m.name) + '</h2>' +
          '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="meal-close">' +
            '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
          '</button></div>' +
        '<div class="sheet__body">' +
          '<p class="t-detail">Logged at ' + esc(m.at) + ' &middot; ' + pct + '% of today</p>' +
          '<div class="card card--sunken mt-3">' +
            '<div class="hstack hstack--3"><span class="t-body grow">Energy</span>' +
              '<span class="t-body-em num">' + n(m.kcal) + ' kcal</span></div>' +
            '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Protein</span>' +
              '<span class="t-body-em num">' + n(m.pro) + ' g</span></div>' +
            '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Carbs</span>' +
              '<span class="t-body-em num">' + n(m.carb) + ' g</span></div>' +
            '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Fat</span>' +
              '<span class="t-body-em num">' + n(m.fat) + ' g</span></div>' +
          '</div>' +
          (typeof m.fibre === 'number'
            ? '<h3 class="t-label mt-5">And in it</h3>' +
              '<div class="card card--sunken mt-2" data-testid="meal-micros">' +
                MICROS.map(function (mi, mj) {
                  return '<div class="hstack hstack--3' + (mj ? ' mt-2' : '') + '">' +
                    '<span class="t-body grow">' + esc(mi.name) + '</span>' +
                    '<span class="t-body-em num">' + n(m[mi.key] || 0) + ' ' + mi.unit + '</span></div>';
                }).join('') +
              '</div>'
            : '<p class="t-detail quiet mt-4" data-testid="meal-micros-none">No fibre, sugar, ' +
              'saturated fat or sodium on this one: it did not come from a row that carries them.</p>') +
          '<h3 class="t-label mt-5">Part of the day</h3>' +
          slotPicker(slotOf(m), 'move-slot', 'meal-slot') +
          '<h3 class="t-label mt-5">Where these numbers came from</h3>' +
          '<p class="t-detail mt-2">' + srcOf(m.src).why + '</p>' +
          '<div class="chiprow mt-4">' +
            /* Symmetric, so a mistake is one tap away from undone: a quarter
               less then a quarter more used to leave the meal 6% smaller,
               because 0.75 x 1.25 is 0.9375. The factors are reciprocal, so
               the pair round-trips. */
            '<button class="chip" type="button" data-action="meal-portion" data-i="' + i + '" data-by="0.8" ' +
              'data-testid="meal-edit">A fifth less</button>' +
            '<button class="chip" type="button" data-action="meal-portion" data-i="' + i + '" data-by="1.25" ' +
              'data-testid="meal-swap">A quarter more</button>' +
          '</div>' +
        '</div>' +
        '<div class="sheet__foot">' +
          '<button class="btn btn--danger btn--block" type="button" data-action="meal-delete" data-i="' + i + '" data-testid="meal-delete">' +
            '<span class="btn__label">Remove this entry</span></button>' +
        '</div>' +
      '</div>';
  }

  function sheetHTML() {
    if (S.sheet && S.sheet.indexOf('meal:') === 0) {
      var m = DAY.meals[+S.sheet.slice(5)];
      return m ? mealSheet(m, +S.sheet.slice(5)) : '';
    }
    if (S.sheet === 'water') {
      var pctW = Math.min(100, Math.round(DAY.waterMl / DAY.waterGoalMl * 100));
      /* The card above offers ml or fl oz and this sheet ignored the choice,
         so the card read "2,250 ml" and the sheet "2.3 L" on the same tap. */
      var wOz = !!(stored('lk_fuelProfile', {}) || {}).flOz;
      var bigW = function (ml) {
        return wOz ? (ml / 29.5735).toFixed(0) : (ml / 1000).toFixed(2);
      };
      var bigGoal = function (ml) {
        return wOz ? (ml / 29.5735).toFixed(0) + ' fl oz' : (ml / 1000).toFixed(1) + ' L';
      };
      var stepW = wOz ? '8 fl oz' : '250 ml';
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="wt-title" data-testid="sheet-water">' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="wt-title">Water</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="water-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<div class="hstack hstack--2" style="align-items: baseline">' +
              '<p class="money num" data-testid="water-value">' + bigW(DAY.waterMl) + '</p>' +
              '<p class="hero__unit grow">of ' + bigGoal(DAY.waterGoalMl) + '</p>' +
            '</div>' +
            '<div class="meter mt-3" role="img" aria-label="' + pctW + ' per cent of today&rsquo;s water">' +
              '<span class="meter__fill" style="width:' + pctW + '%"></span></div>' +
            '<div class="hstack hstack--3 mt-4">' +
              '<button class="btn btn--secondary grow" type="button" data-action="water-sub" data-testid="water-sub">' +
                '<span class="btn__label">&minus; ' + stepW + '</span></button>' +
              '<button class="btn btn--primary grow" type="button" data-action="water-add" data-testid="water-add">' +
                '<span class="btn__label">+ ' + stepW + '</span></button>' +
            '</div>' +
            '<p class="t-caption-1 quiet mt-3">A glass is about ' + stepW + '. ' +
              (DAY.waterGoalComputed
                ? 'The target is 35 ml for every kilo you weigh, rounded to the nearest 50, so it ' +
                  'moves when your weight does rather than sitting on a round number somebody picked.'
                : 'There is no weight on file yet, so this target is the stored one. Add a weigh-in ' +
                  'and it becomes 35 ml per kilo.') + '</p>' +
          '</div>' +
        '</div>';
    }
  function suppShell(title, body, foot, testid, back) {
    return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sp-title" ' +
        'data-detents="0.6 0.94" data-testid="' + testid + '">' +
        '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
        '<div class="sheet__head">' +
          (back
            ? '<button class="iconbtn" type="button" data-action="' + back + '" ' +
              'aria-label="Back to the list" data-testid="supp-back">' + ICO.back + '</button>'
            : '') +
          '<h2 class="t-headline grow" id="sp-title">' + title + '</h2>' +
          '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="supps-close">' +
            '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
          '</button></div>' +
        '<div class="sheet__body">' + body + '</div>' +
        (foot ? '<div class="sheet__foot">' + foot + '</div>' : '') +
      '</div>';
  }

  function suppListSheet() {
    var list = supps();
    var body = list.length
      ? '<div class="card card--flush">' + list.map(function (sp, i) {
          var on = tookToday(sp.name);
          var run = suppStreak(sp.name);
          return '<div class="row row--withaside' + (on ? ' row--done' : '') + '" ' +
              'data-testid="supp-row-' + i + '">' +
            '<button class="iconbtn" type="button" data-action="supp" data-i="' + i + '" ' +
              'aria-pressed="' + on + '" aria-label="' + (on ? 'Un-mark ' : 'Mark ') +
              esc(sp.name) + ' taken today" data-testid="supp-' + i + '">' +
              '<span class="tick"><span class="tick__box">' + (on ? ICO.tick : '') + '</span></span>' +
            '</button>' +
            '<button class="row__main row__main--btn" type="button" data-action="supp-hist" ' +
              'data-i="' + i + '" data-testid="supp-hist-' + i + '">' +
              '<span class="row__main stack">' +
                '<span class="row__title">' + esc(sp.name) +
                  (run > 1 ? ' <span class="pill pill--streak" data-testid="supp-streak-' + i + '">' +
                    run + ' days</span>' : '') + '</span>' +
                '<span class="row__sub">' + esc(sp.dose || 'no dose set') +
                  ' · <span style="color: var(--' + timeTone(sp.timeOf) + ')">' +
                  esc(sp.timeOf || 'any time') + '</span>' +
                  (sp.freq && sp.freq !== 'Daily' ? ' · ' + esc(sp.freq) : '') +
                  (sp.reminder === false ? ' · no reminder' : '') + '</span>' +
              '</span>' +
            '</button>' +
            '<button class="iconbtn" type="button" data-action="supp-edit" data-i="' + i + '" ' +
              'aria-label="Edit ' + esc(sp.name) + '" data-testid="supp-edit-' + i + '">' +
              ICO.pencil + '</button>' +
            '<button class="iconbtn' + (S.suppDel === i ? ' iconbtn--danger' : '') + '" type="button" ' +
              'data-action="supp-del" data-i="' + i + '" ' +
              'aria-label="' + (S.suppDel === i ? 'Confirm removing ' : 'Remove ') + esc(sp.name) + '" ' +
              'data-testid="supp-del-' + i + '">' +
              (S.suppDel === i ? '<span class="btn__label">Remove</span>' : ICO.trash) + '</button>' +
          '</div>';
        }).join('') + '</div>' +
        (S.suppDel !== null && S.suppDel !== undefined
          ? '<p class="t-caption-1 quiet mt-2" data-testid="supp-del-note">Tap the bin again to ' +
            'remove it. Nothing else on the row will do it.</p>'
          : '<p class="t-caption-1 quiet mt-2">Tap a name for its history. Whey is in your food ' +
            'log as food, because that is what it is.</p>')
      : '<p class="t-body" data-testid="supps-empty">No supplements added yet.</p>' +
        '<p class="t-detail quiet mt-1">Add what you actually take. The list is the shelf; ticking ' +
        'one is what builds the streak.</p>';
    return suppShell('Supplements', body,
      '<button class="btn btn--secondary btn--block" type="button" data-action="supp-add" ' +
        'data-testid="supp-add"><span class="btn__label">Add a supplement</span></button>',
      'sheet-supps');
  }

  function suppFormSheet() {
    var f = S.suppForm;
    var editing = f.idx !== null && f.idx !== undefined;
    var custom = SUPP_TIMES.indexOf(f.timeOf) < 0 || f.timeOf === 'Custom';
    var body =
      '<label class="t-label field__label" for="sp-name">Name</label>' +
      '<input class="input" id="sp-name" type="text" autocomplete="off" ' +
        'placeholder="Creatine" value="' + esc(f.name) + '" data-testid="sp-name">' +
      /* Only offered on a new one with nothing typed: a preset list beside a
         name somebody is already writing is a list of ways to lose it. */
      (!f.name && !editing
        ? '<button class="btn btn--tertiary btn--block mt-2" type="button" data-action="supp-presets" ' +
            'aria-expanded="' + !!f.presets + '" data-testid="sp-presets">' +
            '<span class="btn__label">' + (f.presets ? 'Hide the presets' : 'Choose from presets') +
            '</span></button>' +
          (f.presets
            ? '<input class="input mt-2" id="sp-q" type="search" autocomplete="off" ' +
                'placeholder="Search presets" value="' + esc(f.q || '') + '" data-testid="sp-q">' +
              (function () {
                var have = supps().map(function (x) { return String(x.name).toLowerCase(); });
                var q = String(f.q || '').toLowerCase();
                var hits = PRESET_SUPPS.filter(function (nm) {
                  return have.indexOf(nm.toLowerCase()) < 0 &&
                         (!q || nm.toLowerCase().indexOf(q) >= 0);
                });
                if (!hits.length) {
                  return '<p class="t-detail quiet mt-2" data-testid="sp-nopreset">No matches. ' +
                    'Type a name below instead.</p>';
                }
                return '<div class="chiprow mt-2">' + hits.map(function (nm, pi) {
                  return '<button class="chip" type="button" data-action="supp-preset" ' +
                    'data-v="' + esc(nm) + '" data-testid="sp-preset-' + pi + '">' + esc(nm) +
                    '</button>';
                }).join('') + '</div>';
              })()
            : '')
        : '') +
      '<label class="t-label field__label mt-4" for="sp-dose">Dose</label>' +
      '<input class="input" id="sp-dose" type="text" autocomplete="off" ' +
        'placeholder="5 g, 2 capsules, 1000 IU" value="' + esc(f.dose) + '" data-testid="sp-dose">' +
      '<p class="t-caption-1 quiet mt-1">Written down as you type it. Nothing here reads it as a ' +
        'number or adds it to anything.</p>' +
      '<h3 class="t-label mt-4">How often</h3>' +
      '<div class="seg seg--lg mt-2" role="radiogroup" aria-label="How often" data-testid="sp-freq">' +
        SUPP_FREQ.map(function (x) {
          return '<button class="seg__item" type="button" role="radio" ' +
            'aria-checked="' + (f.freq === x) + '" data-action="supp-freq" data-v="' + esc(x) + '" ' +
            'data-testid="sp-freq-' + x.replace(/\W+/g, '-').toLowerCase() + '">' + esc(x) +
            '</button>';
        }).join('') + '</div>' +
      '<h3 class="t-label mt-4">When</h3>' +
      '<div class="chiprow mt-2" role="radiogroup" aria-label="When" data-testid="sp-when">' +
        SUPP_TIMES.map(function (x) {
          var sel = x === 'Custom' ? custom : f.timeOf === x;
          return '<button class="chip' + (sel ? ' chip--on' : '') + '" type="button" role="radio" ' +
            'aria-checked="' + sel + '" data-action="supp-time" data-v="' + esc(x) + '" ' +
            'data-testid="sp-time-' + x.replace(/\W+/g, '-').toLowerCase() + '">' + esc(x) +
            '</button>';
        }).join('') + '</div>' +
      (custom
        ? '<input class="input mt-2" id="sp-custom" type="text" autocomplete="off" ' +
            'placeholder="After dinner" value="' + esc(f.timeOf === 'Custom' ? '' : f.timeOf) + '" ' +
            'aria-label="Your own time" data-testid="sp-custom">' +
          '<p class="t-caption-1 quiet mt-1">A time of your own has no window, so it is due all ' +
            'day rather than at a guess.</p>'
        : '<p class="t-caption-1 quiet mt-1">' + esc(f.timeOf) + ' is ' +
            ({ 'Morning': 'five in the morning to noon',
               'Pre-Workout': 'noon to six',
               'With Food': 'eleven to two',
               'Before Bed': 'seven at night onwards' }[f.timeOf] || 'all day') +
            ' on the reminder card.</p>') +
      '<div class="row row--withaside mt-4">' +
        '<span class="row__main stack">' +
          '<span class="row__title" id="sp-rem-lbl">Remind me</span>' +
          '<span class="row__sub">' + (f.reminder
            ? 'It appears on the Home card when it is due.'
            : 'It stays on this list and off the Home card.') + '</span>' +
        '</span>' +
        '<button class="switch" role="switch" aria-checked="' + !!f.reminder + '" ' +
          'aria-labelledby="sp-rem-lbl" data-action="supp-remind" data-testid="sp-remind">' +
          '<span class="switch__knob"></span></button>' +
      '</div>' +
      '<p class="t-caption-1 quiet mt-2">A card on Home, not a push notification: supplement ' +
        'times are not part of the reminder schedule.</p>' +
      (f.error ? '<p class="field__error mt-2" role="alert" data-testid="sp-error">' +
        esc(f.error) + '</p>' : '');
    return suppShell(editing ? 'Edit supplement' : 'Add a supplement', body,
      '<button class="btn btn--primary btn--block" type="button" data-action="supp-save" ' +
        'data-testid="sp-save"><span class="btn__label">' +
        (editing ? 'Save changes' : 'Add it') + '</span></button>',
      'sheet-supp-form', 'supp-list');
  }

  function suppHistorySheet() {
    var sp = supps()[S.suppHist];
    if (!sp) { S.suppHist = null; return suppListSheet(); }
    var days = suppLast14(sp.name);
    var hit = days.filter(function (d) { return d.on; }).length;
    var run = suppStreak(sp.name);
    var body =
      '<p class="t-detail">' + esc(sp.dose || 'no dose set') + ' · ' +
        esc(sp.timeOf || 'any time') + ' · ' + esc(sp.freq || 'Daily') + '</p>' +
      '<div class="hstack hstack--3 mt-4">' +
        '<div class="card grow"><span class="t-label">Streak</span>' +
          '<p class="money num mt-1" data-testid="supp-hist-streak">' + run + '</p>' +
          '<p class="t-caption-1 quiet">' + (run === 1 ? 'day' : 'days') + ' in a row</p></div>' +
        '<div class="card grow"><span class="t-label">Last 14 days</span>' +
          '<p class="money num mt-1" data-testid="supp-hist-count">' + hit + '</p>' +
          '<p class="t-caption-1 quiet">of 14</p></div>' +

          '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rc-title" ' +

    /* The week's plan. Planned and logged are different states of the same

    /* Building one. Ingredients come from the food table, so the macro total

            '</div>' +
            '<h3 class="t-label mt-5">Sex</h3>' +

            (macroMode === 'auto'

                  '<p class="t-caption-1 quiet mt-2">' + esc(auto.why) + '</p>' +
                '</div>'
              /* MINE MEANS MINE, HERE. Choosing "Mine" sent you to another
                 sheet to type the figures, which is the choice and the thing
                 chosen living on two screens. */
              : '<div class="card mt-3" data-testid="fp-custom">' +
                  '<p class="t-detail">Your figures. Saving writes these as the day\u2019s targets ' +
                    'and nothing on this screen recomputes them.</p>' +
                  '<label class="t-label field__label mt-3" for="fp-kcal">Calories</label>' +
                  '<input class="input num" id="fp-kcal" type="number" min="800" max="8000" step="10" ' +
                    'inputmode="numeric" value="' + (fp.kcal || TARGETS.kcal || auto.kcal) + '" ' +
                    'data-testid="fp-kcal">' +
                  [['pro', 'Protein'], ['carb', 'Carbs'], ['fat', 'Fat']].map(function (mk, mi) {
                    return '<label class="t-label field__label mt-3" for="fp-' + mk[0] + '">' +
                        mk[1] + ', g</label>' +
                      '<input class="input num" id="fp-' + mk[0] + '" type="number" min="0" max="1000" ' +
                        'step="5" inputmode="numeric" value="' +
                        (fp[mk[0]] || (TARGETS[mk[0]] || auto[mk[0]])) + '" ' +
                        'data-testid="fp-' + mk[0] + '">';
                  }).join('') +
                  '<p class="t-caption-1 quiet mt-2">' + (function () {

                    var diff = Math.round(fromMacros - kc);
                    return Math.abs(diff) < 50

                        n(Math.abs(diff)) + ' ' + (diff > 0 ? 'more' : 'less') + ' than the calorie ' +

                  })() + '</p>' +
                '</div>') +
            '<h3 class="t-label mt-5">Anything you do not eat</h3>' +
            /* Six chips, because these six are the ones people actually keep,
               and a chip is a fact the app can act on where a sentence is
               not. The free-text line stays under them for everything else. */
            '<div class="chiprow mt-2" data-testid="fp-diet-chips">' + DIETS.map(function (d) {

                'aria-pressed="' + on + '" data-action="fp-diet-chip" data-v="' + d[0] + '" ' +

              'data-testid="fp-allergy">' +
            '<p class="t-caption-1 quiet mt-2">Written down and shown beside anything this app ' +

            /* THE STAPLES BOX, back, and reaching the thing that replaced it.

            '<p class="t-caption-1 quiet mt-1">These go into the cupboard, which is what the ' +

              '<input class="input grow" id="fp-staple" type="text" autocomplete="off" ' +
                'placeholder="Oats, eggs, olive oil" aria-label="Staples to add to the cupboard" ' +

          '</div>' +
          '<div class="sheet__foot">' +

    }

    /* The last resort, and every food app needs one. Nothing matched, nothing

    if (S.sheet === 'manual') {
      var mn = S.man || { name: '', kcal: '', pro: '', carb: '', fat: '', g: '',

          '<div class="sheet__body">' +

            '<label class="t-label field__label mt-4" for="mn-name">What it was</label>' +

              'placeholder="Chicken katsu, the one from work" value="' + esc(mn.name) + '" ' +
              'data-testid="mn-name">' +
            fld('kcal', 'Calories', 'kcal. The one figure this cannot be left without.', 8000) +
            fld('pro', 'Protein', 'grams. Leave it at nothing if the packet does not say.', 500) +
            fld('carb', 'Carbs', 'grams', 800) +
            fld('fat', 'Fat', 'grams', 400) +
            /* KEEPING IT NEEDS A WEIGHT. Figures for a portion cannot be
               scaled to a different portion without knowing what the portion
               weighed, so the store asks rather than assuming 100 g and
               quietly halving somebody's protein next time. */

              ? fld('g', 'What that weighs', 'grams. It is what lets a different amount be ' +

              : '') +

            '<div class="hstack hstack--3 mt-4">' +
              '<span class="t-body grow" id="mn-keep-lbl">Keep it in your foods</span>' +
              '<button class="switch" type="button" role="switch" aria-checked="' + !!mn.keep + '" ' +
                'aria-labelledby="mn-keep-lbl" data-action="mn-keep" data-testid="mn-keep">' +
                '<span class="switch__track"></span><span class="switch__knob"></span></button>' +
            '</div>' +
            '<p class="t-caption-1 quiet mt-1">' + (mn.keep
              ? 'It will be searchable by name next time' +
                (mn.code ? ', and this barcode will resolve to it.' : '.')
              : 'Logged once and not kept. The next time you eat it, you type it again.') + '</p>' +

            '<button class="btn btn--primary btn--block" type="button" data-action="mn-add" ' +

        '</div>';
    }

    /* One food, at the amount you actually had. The search sheet could only

       corrected with a portion chip afterwards, if at all. Everything here
       scales from the food's own per-100 g figures, so the grams field and
       the chips cannot disagree: the chips just fill the field. */
    if (S.sheet && S.sheet.indexOf('food:') === 0) {
      var fk = S.sheet.slice(5), ff = FOODS[fk];

      var per100 = function (v) { return Math.round(v / ff.g * 100 * 10) / 10; };
      var at = function (v) { return Math.round(v / ff.g * grams * 10) / 10; };
      var chips = [

                'Everything above is that, times ' + (Math.round(k100 * 100) / 100) + '.</p>' +

              'data-k="' + fk + '" data-g="' + grams + '" data-testid="fd-keep">' +

          '<div class="sheet__foot">' +
            '<button class="btn btn--primary btn--block" type="button" data-action="fd-log" ' +
              'data-testid="fd-log"><span class="btn__label">Log to ' +
              esc(slotName(slotNow).toLowerCase()) + '</span></button>' +
          '</div>' +
        '</div>';
    }

    if (S.sheet === 'build-plan') {
      var g = S.gen || { days: 5, perDay: 3, avoid: '', preview: null };
      var pv = g.preview;
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gp-title" ' +
          'data-detents="0.6 0.94" data-testid="sheet-build-plan">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="gp-title">Build a week</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="gp-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<p class="t-detail">Built from the food table against your own targets. Nothing is ' +

                'data-testid="gp-meals">' +
              [2, 3, 4, 5].map(function (x) {
                return '<button class="seg__item" type="button" role="radio" ' +
                  'aria-checked="' + (g.perDay === x) + '" data-action="gp-meals" data-v="' + x + '" ' +
                  'data-testid="gp-meals-' + x + '">' + x + '</button>';
              }).join('') + '</div>' +
            '<label class="t-label field__label mt-4" for="gp-avoid">Anything to leave out</label>' +
            '<input class="input" id="gp-avoid" type="text" autocomplete="off" ' +
              'placeholder="Chilli, pasta" value="' + esc(g.avoid) + '" data-testid="gp-avoid">' +
            '<p class="t-caption-1 quiet mt-1">Matched against the names in the table, ' +
              'comma separated.</p>' +
            /* The two preferences it actually has, said where the week is
               built rather than left for somebody to discover in the result. */
            '<h3 class="t-label mt-4">What it is already working to</h3>' +
            '<div class="card card--sunken mt-2" data-testid="gp-prefs">' +
              '<div class="hstack hstack--3"><span class="t-body grow">Your targets</span>' +
                '<span class="t-body-em num">' + n(DAY.target) + ' kcal \u00b7 ' +
                  n(DAY.macros[0].want) + ' g P</span></div>' +
              '<div class="hstack hstack--3 mt-2"><span class="t-body grow">What you do not eat</span>' +
                '<span class="t-body-em">' + (dietWords().length
                  ? n(Object.keys(FOODS).length - buildPool(g.avoid).length) + ' of ' +
                    Object.keys(FOODS).length + ' taken out'

              '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Budget</span>' +
                '<span class="t-body-em">' + (budgetSpent()
                  ? '\u00a3' + budgetSpent().weekly + ' a week, on Shop'
                  : 'not set') + '</span></div>' +
              '<p class="t-caption-1 quiet mt-2">Preferences come off your profile, so they are ' +
                'the same ones the recipe list uses. The budget is NOT costed into this week: ' +
                'the food table carries no prices, so a plan priced against it would be a number ' +
                'this app made up. Shop is where a week is costed.</p>' +
            '</div>' +
            (pv
              ? '<h3 class="t-label mt-5">What that comes to</h3>' +
                '<div class="card card--flush mt-2" data-testid="gp-preview">' +

                        '<span class="row__title">' + esc(d.d) + '</span>' +

                          return esc(sl.name);

                  (function () {

                    });
                    var ak = Math.round(tk / pv.length), ap = Math.round(tp / pv.length);
                    var line = n(ak) + ' kcal and ' + n(ap) + ' g of protein a day on average, ' +
                      'against ' + n(DAY.target) + ' and ' + n(DAY.macros[0].want) + '.';
                    /* Said, not buried. A plan that lands short is a fact
                       about a table of eight foods and a chosen meal count,

                       screen should not quietly hand over a week that misses
                       the target it was built against. */
                    var gap = DAY.target - ak;
                    if (gap > 150) {
                      line += ' That is ' + n(gap) + ' kcal a day short: this build has eight ' +
                        'foods and the biggest is ' + n(Math.max.apply(null, Object.keys(FOODS)
                          .map(function (k) { return FOODS[k].kcal; }))) +
                        ' kcal, so ' + g.perDay + ' meals cannot reach it. More meals a day will.';
                    } else if (gap < -150) {

                        '<span class="row__main stack">' +
                          '<span class="row__title">' + esc(sp2.name) + '</span>' +
                          '<span class="row__sub num">' + sp2.days.length + ' days \u00b7 ' +
                            n(sp2.avg) + ' kcal a day</span>' +
                        '</span>' +
                      '</button>' +
                      '<button class="iconbtn" type="button" data-action="gp-star" data-i="' + i + '" ' +
                        'aria-pressed="' + !!sp2.star + '" aria-label="' +

                        'data-testid="gp-star-' + i + '">' + (sp2.star ? ICO.starOn : ICO.star) + '</button>' +
                      '<button class="iconbtn" type="button" data-action="gp-del" data-i="' + i + '" ' +
                        'aria-label="Delete ' + esc(sp2.name) + '" data-testid="gp-del-' + i + '">' +
                        '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +

          '</div>' +
          '<div class="sheet__foot">' +
            (pv
              ? '<button class="btn btn--primary btn--block" type="button" data-action="gp-save" ' +

          '</div>' +
        '</div>';
    }

    if (S.sheet === 'build-recipe') {
      var d = S.draft || { name: '', servings: 4, items: [], notes: [], error: null };
      var dt = draftTotals(d);
      var per = d.servings > 0 ? d.servings : 1;
      var canSave = d.name.trim().length > 0 && d.items.length > 0;
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="br-title" ' +
          'data-detents="0.7 0.94" data-testid="sheet-build-recipe">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="br-title">Build a recipe</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="br-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            /* ASK FOR ONE. Everything below is a form somebody fills in by
               hand, and that stays the way a recipe is made: this puts a
               draft IN the form, where every quantity can be changed and
               nothing is saved until Save is pressed. */
            ((window.LKCloud && LKCloud.coachReady())
              ? '<button class="btn btn--secondary btn--block" type="button" data-action="br-ask"' +
                  (S.brAsking ? ' aria-busy="true" disabled' : '') +
                  ' data-testid="br-ask"><span class="btn__label">' +
                  (S.brAsking ? 'Asking the coach' : 'Ask the coach for one') + '</span></button>' +
                (S.brWhy ? '<p class="t-caption-1 quiet mt-2" data-testid="br-ask-why">' +
                  esc(S.brWhy) + '</p>' : '') +
                '<p class="t-caption-1 quiet mt-2 mb-3">It fills this form. Nothing is saved ' +
                  'until you press Save, and every quantity is yours to change.</p>'
              : '') +
            '<label class="t-label field__label" for="br-name">What is it called</label>' +
            '<input class="input" id="br-name" type="text" autocomplete="off" ' +
              'placeholder="Chilli, big batch" value="' + esc(d.name) + '" data-testid="br-name">' +
            '<label class="t-label field__label mt-3" for="br-servings">How many servings it makes</label>' +
            '<input class="input num" id="br-servings" type="number" min="1" max="24" step="1" ' +
              'inputmode="numeric" value="' + per + '" data-testid="br-servings">' +
            '<h3 class="t-label mt-5">Ingredients</h3>' +
            (d.items.length || d.notes.length
              ? '<div class="card card--flush mt-2" data-testid="br-items">' +
                d.items.map(function (it, i) {
                  var g = ingGrams(it), m = ingMacros(it);
                  return '<div class="row row--static stack" data-testid="br-item-' + i + '">' +
                    '<div class="hstack hstack--3">' +
                      '<span class="row__main stack grow">' +
                        '<span class="row__title">' + esc(ingName(it)) +
                          (it.per100 ? ' <span class="pill">typed in</span>' : '') + '</span>' +
                        '<span class="row__sub num">' + n(Math.round(m.kcal)) + ' kcal \u00b7 ' +
                          n(Math.round(m.pro)) + ' P \u00b7 ' + n(Math.round(m.carb)) + ' C \u00b7 ' +
                          n(Math.round(m.fat)) + ' F' +
                          (it.cooked ? ' \u00b7 ' + n(g.raw) + ' g raw' : '') + '</span>' +
                      '</span>' +
                      '<button class="iconbtn" type="button" data-action="br-drop" data-i="' + i + '" ' +
                        'aria-label="Remove ' + esc(ingName(it)) + '" data-testid="br-drop-' + i + '">' +
                        '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
                    '</div>' +
                    '<div class="hstack hstack--2 mt-2">' +
                      '<input class="input num grow" id="br-g-' + i + '" type="number" min="1" max="20000" ' +
                        'step="5" inputmode="numeric" value="' + g.as + '" ' +
                        'aria-label="Grams of ' + esc(ingName(it)) + '" data-testid="br-g-' + i + '">' +
                      '<button class="chip' + (it.cooked ? '' : ' chip--on') + '" type="button" ' +
                        'data-action="br-raw" data-i="' + i + '" aria-pressed="' + !it.cooked + '" ' +
                        'data-testid="br-raw-' + i + '">Weighed raw</button>' +
                      '<button class="chip' + (it.cooked ? ' chip--on' : '') + '" type="button" ' +
                        'data-action="br-cooked" data-i="' + i + '" aria-pressed="' + !!it.cooked + '" ' +
                        'data-testid="br-cooked-' + i + '">Cooked</button>' +
                    '</div>' +
                    (it.cooked
                      ? '<div class="hstack hstack--2 mt-2">' +
                          '<span class="t-caption-1 quiet grow">Cooked weight is this much of raw</span>' +
                          '<input class="input num" id="br-y-' + i + '" type="number" min="20" max="600" ' +
                            'step="5" inputmode="numeric" value="' + (it.yieldPct || 100) + '" ' +
                            'aria-label="Cooked yield per cent for ' + esc(ingName(it)) + '" ' +
                            'data-testid="br-y-' + i + '">' +
                          '<span class="t-caption-1 quiet">%</span>' +
                        '</div>' +
                        '<p class="t-caption-2 quiet mt-1">Rice comes off the hob at about 300% of its ' +
                          'dry weight and meat at about 75% of its raw weight. It is your figure ' +
                          'because the table carries no yields: ' + n(g.as) + ' g cooked is being ' +
                          'priced as ' + n(g.raw) + ' g raw.</p>'
                      : '') +
                  '</div>';
                }).join('') +
                d.notes.map(function (t, i) {
                  return '<div class="row row--withaside">' +
                    '<span class="row__main stack">' +
                      '<span class="row__title">' + esc(t) + '</span>' +
                      '<span class="row__sub">no figures on this one, counted as zero</span>' +
                    '</span>' +
                    '<button class="iconbtn" type="button" data-action="br-drop-note" data-i="' + i + '" ' +
                      'aria-label="Remove ' + esc(t) + '" data-testid="br-drop-note-' + i + '">' +
                      '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
                  '</div>';
                }).join('') + '</div>' +
                ''
              : '<p class="t-detail quiet mt-2">Nothing in it yet. Add what the whole batch is made ' +
                'of, not one plateful \u2014 the servings figure above does the dividing, and every ' +
                'ingredient is in grams because that is what a scale reads.</p>') +
            /* SEARCH, not a row of every chip in the table. Eight chips was a
               list; a store of scanned products and your own saved amounts is
               not, and it is the thing you actually cook from. */
            '<h3 class="t-label mt-5">Add an ingredient</h3>' +
            '<input class="field mt-2" id="br-q" type="search" autocomplete="off" ' +
              'placeholder="Chicken, oats, skyr\u2026" aria-label="Search your foods" ' +
              'data-testid="br-search" value="' + esc(S.draftQ || '') + '">' +
            (function () {
              var hits = ingHits(S.draftQ || '');
              if (!hits.length) {
                return '<p class="t-detail quiet mt-2" data-testid="br-none">Nothing of yours ' +
                  'matches \u201c' + esc(S.draftQ || '') + '\u201d. Type it in by hand below.</p>';
              }
              return '<div class="card card--flush mt-2" data-testid="br-hits">' +
                hits.map(function (h, i) {
                  return '<button class="row" type="button" data-action="br-add" data-k="' + esc(h.key) +
                    '" data-g="' + h.g + '" data-testid="br-add-' + esc(h.key) + '">' +
                    '<span class="fuel-thumb" aria-hidden="true">' + (h.icon || '\ud83e\udd63') + '</span>' +
                    '<span class="row__main stack">' +
                      '<span class="row__title">' + esc(h.name) + '</span>' +
                      '<span class="row__sub num">' + esc(h.from) + ' \u00b7 ' + n(h.g) + ' g default \u00b7 ' +
                        n(h.kcal) + ' kcal</span>' +
                    '</span>' +
                    '<span class="row__chev">' + ICO.plus + '</span></button>';
                }).join('') + '</div>';
            })() +
            /* Anything the table has never heard of, at the figures off its
               packet. Before this it could only be a line of text counted as
               zero, so a recipe with olive oil in it was 200 kcal a serving
               light and said nothing about it. */
            '<h3 class="t-label mt-5">Or type one in</h3>' +
            '<div class="hstack hstack--2 mt-2">' +
              '<input class="input grow" id="br-mn-name" type="text" autocomplete="off" ' +
                'placeholder="Olive oil" aria-label="Ingredient name" data-testid="br-mn-name">' +
              '<input class="input num" id="br-mn-g" type="number" min="1" max="20000" step="5" ' +
                'inputmode="numeric" placeholder="g" aria-label="Grams" data-testid="br-mn-g">' +
            '</div>' +
            '<p class="t-caption-1 quiet mt-2">Per 100 g, off the packet.</p>' +
            '<div class="hstack hstack--2 mt-1">' +
              ['kcal', 'pro', 'carb', 'fat'].map(function (k, ki) {
                return '<input class="input num grow" id="br-mn-' + k + '" type="number" min="0" ' +
                  'max="' + (k === 'kcal' ? 900 : 100) + '" step="1" inputmode="numeric" ' +
                  'placeholder="' + ['kcal', 'P', 'C', 'F'][ki] + '" ' +
                  'aria-label="' + ['Calories', 'Protein', 'Carbs', 'Fat'][ki] + ' per 100 g" ' +
                  'data-testid="br-mn-' + k + '">';
              }).join('') +
            '</div>' +
            '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="br-add-manual" ' +
              'data-testid="br-add-manual"><span class="btn__label">Add it</span></button>' +
            '<label class="t-label field__label mt-4" for="br-note">Anything with no figures</label>' +
            '<div class="hstack hstack--2">' +
              '<input class="input grow" id="br-note" type="text" autocomplete="off" ' +
                'placeholder="Chilli, cumin, paprika" data-testid="br-note">' +
              '<button class="btn btn--secondary" type="button" data-action="br-add-note" ' +
                'data-testid="br-add-note"><span class="btn__label">Add</span></button>' +
            '</div>' +
            '<div class="card card--sunken mt-4" data-testid="br-totals">' +
              '<div class="hstack hstack--3"><span class="t-body grow">One serving</span>' +
                '<span class="t-body-em num">' + n(Math.round(dt.kcal / per)) + ' kcal</span></div>' +
              '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Protein, carbs, fat</span>' +
                '<span class="t-body-em num">' + n(Math.round(dt.pro / per)) + ' \u00b7 ' +
                  n(Math.round(dt.carb / per)) + ' \u00b7 ' + n(Math.round(dt.fat / per)) + ' g</span></div>' +
              '<p class="t-caption-1 quiet mt-2">The whole batch is ' + n(Math.round(dt.kcal)) +
                ' kcal, divided by ' + per + '.</p>' +
            '</div>' +
            (d.error ? '<p class="field__error mt-2" role="alert" data-testid="br-error">' +
              esc(d.error) + '</p>' : '') +
          '</div>' +
          '<div class="sheet__foot">' +
            '<button class="btn btn--primary btn--block" type="button" data-action="br-save" ' +
              (canSave ? '' : 'disabled ') + 'data-testid="br-save">' +
              '<span class="btn__label">Save this recipe</span></button>' +
          '</div>' +
        '</div>';
    }

    if (S.sheet && S.sheet.indexOf('swap:') === 0) {
      var sp = S.sheet.slice(5).split(',');
      var sd = PLAN[+sp[0]], ss = sd && sd.slots[+sp[1]];
      if (!sd || !ss) return '';
      var opts = swapChoices(ss.key);
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sw-title" ' +
          'data-detents="0.6 0.94" data-testid="sheet-swap">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="sw-title">Swap ' +
              esc(ss.at.toLowerCase()) + ' on ' + esc(sd.d) + '</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="swap-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<p class="t-detail">Currently ' + esc(ss.name) + ', ' + n(ss.kcal) + ' kcal. ' +
              'The difference each swap makes to the day is beside it.</p>' +
            '<div class="card card--flush mt-3">' + opts.map(function (f, i) {
              var diff = f.kcal - ss.kcal;
              return '<button class="row" type="button" data-action="swap-pick" data-i="' + i +
                '" data-testid="swap-' + i + '">' +
                '<span class="fuel-thumb" aria-hidden="true">' + f.icon + '</span>' +
                '<span class="row__main stack">' +
                  '<span class="row__title">' + esc(f.name) + '</span>' +
                  '<span class="row__sub">' + n(f.pro) + ' P \u00b7 ' + n(f.carb) + ' C \u00b7 ' +
                    n(f.fat) + ' F</span>' +
                '</span>' +
                '<span class="row__value num">' + (diff > 0 ? '+' : diff < 0 ? '\u2212' : '\u00b1') +
                  n(Math.abs(diff)) + '<small class="t-caption-2 quiet"> kcal</small></span>' +
              '</button>';
            }).join('') + '</div>' +
          '</div>' +
        '</div>';
    }

    if (S.sheet === 'targets') {
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="tg-title" ' +
          'data-detents="0.5 0.88" data-testid="sheet-targets">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="tg-title">Daily targets</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="targets-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            '<p class="t-detail">Your numbers, not a formula&rsquo;s. Change one and the day is ' +
              'measured against it from now on.</p>' +
            '<label class="t-label field__label mt-4" for="tg-kcal">Calories</label>' +
            '<input class="input num" id="tg-kcal" type="number" min="800" max="8000" step="10" ' +
              'inputmode="numeric" value="' + DAY.target + '" data-testid="tg-kcal">' +
            DAY.macros.map(function (m) {
              return '<label class="t-label field__label mt-3" for="tg-' + m.key + '">' +
                  esc(m.name) + ', ' + m.unit + '</label>' +
                '<input class="input num" id="tg-' + m.key + '" type="number" min="0" max="1000" step="5" ' +
                  'inputmode="numeric" value="' + m.want + '" data-testid="tg-' + m.key + '">';
            }).join('') +
            (S.targetError ? '<p class="field__error mt-2" role="alert" data-testid="tg-error">' +
              esc(S.targetError) + '</p>' : '') +
          '</div>' +
          '<div class="sheet__foot">' +
            '<button class="btn btn--primary btn--block" type="button" data-action="targets-save" ' +
              'data-testid="targets-save"><span class="btn__label">Save targets</span></button>' +
          '</div>' +
        '</div>';
    }
    if (S.sheet === 'scan') {
      var st = S.scanState || 'idle';
      var head = function (title, closeLabel) {
        return '<div class="sheet__head"><h2 class="t-headline grow" id="sc-title">' + title + '</h2>' +
          '<button class="iconbtn" type="button" data-action="close" aria-label="' + closeLabel +
            '" data-testid="scan-close">' +
            '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
          '</button></div>';
      };
      var shell = function (body, foot, title) {
        return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
          '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sc-title" ' +
            'data-detents="0.5 0.9" data-testid="sheet-scan">' +
            '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
            head(title, 'Close') +
            '<div class="sheet__body">' + body + '</div>' +
            (foot ? '<div class="sheet__foot">' + foot + '</div>' : '') +
          '</div>';
      };

      /* Waiting for the code. Live camera decoding needs a decoder this build
         does not carry, and saying so is better than a viewfinder that never
         resolves anything. The digits under the bars are the same barcode. */
      if (st === 'idle') {
        return shell(
          '<div class="fuel-scanbox" data-testid="scan-idle" aria-hidden="true">' + ICO.barcode + '</div>' +
          '<p class="t-detail mt-3">Reading a barcode off the camera needs a decoder this build ' +
            'does not carry, so it is not pretending to have one. The digits printed under the ' +
            'bars are the same barcode: type them in.</p>' +
          '<label class="t-label field__label mt-4" for="sc-code">Barcode</label>' +
          '<input class="input num" id="sc-code" type="text" inputmode="numeric" autocomplete="off" ' +
            'placeholder="5060123456789" value="' + esc(S.scanCode || '') + '" data-testid="scan-code">' +
          (S.scanError ? '<p class="field__error mt-2" role="alert" data-testid="scan-error">' +
            esc(S.scanError) + '</p>' : '') +
          '<p class="t-caption-1 quiet mt-3">Three resolve in this build. Anything else comes back ' +
            'not found, which is what a table of eight foods can honestly do.</p>' +
          '<div class="chiprow mt-2">' + Object.keys(BARCODES).map(function (c, ci) {
            return '<button class="chip" type="button" data-action="scan-try" data-c="' + c + '" ' +
              'data-testid="scan-try-' + ci + '">' + esc(FOODS[BARCODES[c]].name) + '</button>';
          }).join('') + '</div>',
          '<button class="btn btn--primary btn--block" type="button" data-action="scan-look" ' +
            'data-testid="scan-look"><span class="btn__label">Look it up</span></button>',
          'Scan a barcode');
      }

      if (st === 'looking') {
        return shell(
          '<div data-testid="scan-looking">' +
            '<div class="skel" style="height: var(--lh-17); width: 62%"></div>' +
            '<div class="skel mt-2" style="height: var(--lh-13); width: 40%"></div>' +
            '<div class="skel mt-4" style="height: 96px"></div>' +
          '</div>' +
          '<p class="t-detail mt-3">Looking up ' + esc(prettyCode(S.scanCode)) + '.</p>',
          '', 'Looking it up');
      }

      if (st === 'notfound') {
        return shell(
          '<p class="t-body-17" data-testid="scan-notfound">Nothing matches ' +
            esc(prettyCode(S.scanCode)) + '.</p>' +
          '<p class="t-detail mt-2">That is not a broken scan. This build resolves three barcodes ' +
            'and whatever you have told it about; a real one reaches a database of millions. ' +
            'What is on the packet is on the label: type that in and it is kept against this ' +
            'code, so the next scan of it comes back with your figures instead of this.</p>' +
          '<p class="t-caption-1 quiet mt-2" data-testid="scan-carry">' +
            esc(prettyCode(S.scanCode)) + ' goes to the form with you.</p>',
          '<button class="btn btn--primary btn--block" type="button" data-action="scan-manual" ' +
            'data-testid="scan-manual"><span class="btn__label">Type the label instead</span></button>' +
          '<button class="btn btn--tertiary btn--block mt-2" type="button" data-action="scan-again" ' +
            'data-testid="scan-again"><span class="btn__label">Try another code</span></button>',
          'Not found');
      }

      if (st === 'logged') {
        return shell(
          '<p class="t-body-17" data-testid="scan-logged">' + esc(S.scanLast || '') + ' logged.</p>' +
          '<p class="t-detail mt-2">It is on today\u2019s list, under ' +
            esc(slotName(S.logSlot || slotForNow()).toLowerCase()) + '.</p>',
          '<button class="btn btn--primary btn--block" type="button" data-action="scan-again" ' +
            'data-testid="scan-another"><span class="btn__label">Scan another</span></button>' +
          '<button class="btn btn--tertiary btn--block mt-2" type="button" data-action="close" ' +
            'data-testid="scan-done"><span class="btn__label">Done</span></button>',
          'Logged');
      }

      var f = S.scanHit;
      if (!f) return '';
      return shell(
        '<div class="hstack hstack--3">' +
          '<span class="fuel-thumb" aria-hidden="true">' + f.icon + '</span>' +
          '<span class="stack stack--1 grow">' +
            '<span class="t-body-em">' + esc(f.name) + '</span>' +
            '<span class="t-caption-1 quiet num">' + esc(prettyCode(f.code)) + '</span>' +
          '</span>' +
          /* WHAT THE FIGURES ACTUALLY ARE. A product you typed off a packet
             and kept against its code is your estimate, however it was
             reached the second time. Stamping Verified on it because it came
             back from a barcode would be the badge lying about its own
             claim. */
          badge(f.src === 'estimate' ? 'estimate' : 'verified') +
        '</div>' +
        '<p class="t-detail mt-4">' + (f.mine
          ? 'You have scanned this before, so it came back off this device without a lookup. ' +
            'The figures are the ones kept against the code.'
          : 'A barcode matched a database row, so these are the manufacturer&rsquo;s own ' +
            'figures. They are only wrong if the portion is.') + '</p>' +
        '<p class="t-caption-1 quiet mt-2" data-testid="scan-kept">' + (f.mine
          ? 'It is already in your foods, and searchable by name.'
          : 'Kept in your foods as \u201c' + esc(f.name) + '\u201d \u2014 the next scan of this ' +
            'code resolves on this device, and it is searchable by name from now on.') + '</p>' +
        '<label class="t-label field__label mt-4" for="scan-servings">Servings</label>' +
        '<input class="input num" id="scan-servings" type="number" min="0.25" max="10" step="0.25" ' +
          'inputmode="decimal" value="' + S.scanServings + '" data-testid="scan-servings">' +
        '<div class="card card--sunken mt-4">' +
          '<div class="hstack hstack--3"><span class="t-body grow">Energy</span>' +
            '<span class="t-body-em num" data-testid="scan-kcal">' +
              n(Math.round(f.kcal * S.scanServings)) + ' kcal</span></div>' +
          /* All three, because all three are logged. It showed Energy and
             Protein under the words "these are the manufacturer's own
             figures" and silently logged 6 g of carbs with them. */
          '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Protein</span>' +
            '<span class="t-body-em num">' + Math.round(f.pro * S.scanServings) + ' g</span></div>' +
          '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Carbs</span>' +
            '<span class="t-body-em num">' + Math.round(f.carb * S.scanServings) + ' g</span></div>' +
          '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Fat</span>' +
            '<span class="t-body-em num">' +
              (Math.round(f.fat * S.scanServings * 10) / 10) + ' g</span></div>' +
          '<p class="t-caption-1 quiet mt-2">Per ' + esc(f.serving) + ', times the servings above.</p>' +
        '</div>' +
        slotPicker(S.logSlot || slotForNow(), 'pick-slot', 'scan-slot'),
        '<button class="btn btn--primary btn--block" type="button" data-action="scan-log" ' +
          'data-testid="scan-confirm"><span class="btn__label">Log it</span></button>',
        'Scanned');
    }
    if (S.sheet === 'mic') {
      /* The transcript is a field, not a caption. Speech recognition needs a
         real microphone and a real engine; the SENTENCE is what this screen
         can honestly work on, so it is editable and parsed for real. The
         sheet used to show one canned line and log two fixed foods whatever
         it said. */
      if (S.micText === undefined || S.micText === null) S.micText = '';
      var items = S.micItems || [];
      /* Nothing weighing nothing was eaten. "0 chilli" offered an enabled
         "Log 1 item, 0 kcal" and wrote an empty row into the day. */
      var hit = items.filter(function (it) { return it.key && (it.est || it.grams > 0); });
      var zero = items.filter(function (it) { return it.key && !it.est && !(it.grams > 0); });
      var miss = items.filter(function (it) { return !it.key; });
      var tot = hit.reduce(function (a, it) { return a + it.kcal; }, 0);
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +

            ((miss.length && window.LKCloud && LKCloud.ready())
              ? '<button class="btn btn--secondary btn--block mt-4" type="button" ' +
                  'data-action="mic-estimate"' + (S.micBusy ? ' aria-busy="true" disabled' : '') +
                  ' data-testid="mic-estimate"><span class="btn__label">' +

            '<button class="btn btn--secondary btn--block mt-4" type="button" data-action="manual" ' +

          '<div class="sheet__foot">' +
            '<button class="btn btn--primary btn--block" type="button" data-action="mic-log" ' +
              (hit.length ? '' : 'disabled ') + 'data-testid="mic-confirm">' +
              '<span class="btn__label">' + (hit.length
                ? 'Log ' + hit.length + (hit.length === 1 ? ' item' : ' items') + ', ' + n(tot) + ' kcal'
                : 'Nothing to log yet') + '</span></button>' +
          '</div>' +
        '</div>';
    }
    if (S.sheet === 'cam') {
      var plate = camPlate();
      var items = camItems();
      return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cam-title" ' +
          'data-detents="0.6 0.94" data-testid="sheet-cam">' +
          '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
          '<div class="sheet__head"><h2 class="t-headline grow" id="cam-title">What is on the plate</h2>' +
            '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="cam-close">' +
              '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button></div>' +
          '<div class="sheet__body">' +
            /* A real file input, with capture so a phone opens the camera and
               a second one for the library. The photo itself stays in the
