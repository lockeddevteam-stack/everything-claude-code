               looked at. */
            (S.camShot
              ? '<div class="fuel-shot" data-testid="cam-shot">' +
                  '<img src="' + esc(S.camShot) + '" alt="The photo you took">' +
                '</div>' +
                '<div class="hstack hstack--3 mt-2">' +
                  '<button class="btn btn--tertiary grow" type="button" data-action="cam-discard" ' +
                    'data-testid="cam-discard"><span class="btn__label">Discard the photo</span></button>' +
                  '<button class="btn btn--tertiary grow" type="button" data-action="cam-redo" ' +
                    'data-testid="cam-redo"><span class="btn__label">Estimate again</span></button>' +
                '</div>'
              : '<div class="fuel-shot fuel-shot--empty" data-testid="cam-empty" aria-hidden="true">' +
                  ICO.cam + '</div>' +
                '<div class="hstack hstack--3 mt-3">' +
                  '<label class="btn btn--secondary grow" for="cam-take">' +
                    '<span class="btn__label">Take a photo</span></label>' +
                  '<input class="vis-hidden" id="cam-take" type="file" accept="image/*" ' +
                    'capture="environment" data-testid="cam-take">' +
                  '<label class="btn btn--secondary grow" for="cam-pick">' +
                    '<span class="btn__label">From the library</span></label>' +
                  '<input class="vis-hidden" id="cam-pick" type="file" accept="image/*" ' +
                    'data-testid="cam-pick">' +
                '</div>') +
            (S.camState === 'reading'
              ? '<div class="hstack hstack--3 mt-3" role="status" aria-live="polite" data-testid="cam-reading">' +
                  '<span class="spinner"></span><span class="t-detail">Reading the plate.</span></div>'
              : S.camWhy
              ? '<p class="t-caption-1 quiet mt-3" data-testid="cam-why">' + esc(S.camWhy) + '</p>'
              : S.camState === 'example'
              ? '<p class="t-caption-1 quiet mt-3">These are the worked example, not a photo: ' +
                'this is the state switcher showing the shape of a reading.</p>'
              : '<p class="t-caption-1 quiet mt-3">The photo is downscaled on this phone and sent ' +
                'to be read. Every figure that comes back is an estimate and is logged as one.</p>') +
            '<h3 class="t-label mt-5">What it reads as</h3>' +
            (items.length
              ? '<div class="card card--flush mt-2" data-testid="cam-items">' +
                  items.map(function (x, i) {
                    return '<div class="row row--withaside">' +
                      '<span class="fuel-thumb" aria-hidden="true">' + x.icon + '</span>' +
                      '<span class="row__main stack">' +
                        '<span class="row__title">' + esc(x.name) + '</span>' +
                        '<span class="row__sub">' + n(x.pro) + ' P \u00b7 ' + n(x.carb) +
                          ' C \u00b7 ' + n(x.fat) + ' F</span>' +
                      '</span>' +
                      '<span class="row__value num">' + n(x.kcal) +
                        '<small class="t-caption-2 quiet"> kcal</small></span>' +
                      '<button class="iconbtn" type="button" data-action="cam-drop" data-i="' + i + '" ' +
                        'aria-label="Not on the plate: ' + esc(x.name) + '" ' +
                        'data-testid="cam-drop-' + i + '">' +
                        '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
                    '</div>';
                  }).join('') + '</div>'
              : '<p class="t-detail quiet mt-2" data-testid="cam-none">Nothing left on the plate. ' +
                'Estimate again to start over.</p>') +
            (items.length
              ? '<p class="t-detail mt-2" data-testid="cam-total">' + n(plate.kcal) + ' kcal, ' +
                  n(plate.pro) + ' g protein. <span class="quiet">' +
                  (S.camState === 'example'
                    ? 'From the worked example, not from a photo.'
                    : 'Estimated from the photo, so treat it as a reading rather than a figure.') +
                  (S.camOil ? ' Adjusted for ' + { none: 'no oil', little: 'a little oil', lot: 'a lot of oil' }[S.camOil] + '.' : '') +
                  '</span></p>' +
                '<p class="t-label mt-5">Was there oil or sauce?</p>' +
                '<div class="chiprow mt-2">' +
                  ['none', 'little', 'lot'].map(function (k, i) {
                    return '<button class="chip" type="button" data-action="cam-oil" data-oil="' + k +
                      '" aria-pressed="' + (S.camOil === k ? 'true' : 'false') +
                      '" data-testid="cam-a' + (i + 1) + '">' +
                      ['None', 'A little', 'A lot'][i] + '</button>';
                  }).join('') +
                '</div>' +
                '<p class="t-caption-1 quiet mt-3">One question, asked because oil moves this plate ' +
                  'by more than 15%. Nothing else is worth interrupting you for. It goes on the ' +
                  'plate rather than on any one item, so dropping the rice does not drop two ' +
                  'thirds of the oil that went over all of it.</p>' +
                slotPicker(S.logSlot || slotForNow(), 'pick-slot', 'cam-slot')
              : '') +
          '</div>' +
          '<div class="sheet__foot">' +
            '<button class="btn btn--primary btn--block" type="button" data-action="cam-log" ' +
              (items.length ? '' : 'disabled ') + 'data-testid="cam-confirm">' +
              '<span class="btn__label">' + (items.length ? 'Log ' + n(plate.kcal) + ' kcal' : 'Nothing to log') +
              '</span></button>' +
          '</div>' +
        '</div>';
    }
    return '';
  }

  /* ---------------------------------------------------------------
     Render
     --------------------------------------------------------------- */
  function render() {
    screen.setAttribute('data-state', S.state);
    hdr.classList.add('hdr--large');
    LKPatch(hdr, headerHTML());
    LKPatch(body, (VIEWS[S.state] || VIEWS.populated)());
    LKPatch(overlay, sheetHTML() + toastHTML());
    seedDemoSession(S.state === 'live');
    LKPatch(document.getElementById('shelf-slot'), shelfHTML());
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.state));
    });
    if (window.LKChrome) LKChrome.init(document);
  }

  document.addEventListener('click', function (e) {
    var act = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!act) return;
    var a = act.getAttribute('data-action');
    if (a === 'mic') { S.sheet = 'mic'; S.micText = ''; S.micItems = null; render(); return; }
    if (a === 'cam') {
      S.sheet = 'cam'; S.camOil = null; S.camItems = null; S.camShot = null;
      S.camState = 'idle'; S.camWhy = null;
      render(); return;
    }
    if (a === 'cam-drop') { camItems().splice(+act.getAttribute('data-i'), 1); render(); return; }
    if (a === 'cam-redo') {
      /* Reads the photo again rather than clearing the rows and leaving
         nothing: "Estimate again" is about the reading, not the picture. */
      S.camOil = null;
      var again = document.getElementById('cam-take');
      var f2 = again && again.files && again.files[0];
      if (!f2) { again = document.getElementById('cam-pick'); f2 = again && again.files && again.files[0]; }
      if (f2) { readPlate(f2); say('Reading it again.'); return; }
      S.camItems = null; render(); say('Take a photo first.'); return;
    }
    if (a === 'cam-discard') {
      if (S.camShot) { try { URL.revokeObjectURL(S.camShot); } catch (e) {} }
      S.camShot = null; render(); return;
    }
    if (a === 'scan') {
      S.sheet = 'scan'; S.scanServings = 1; S.scanState = 'idle';
      S.scanCode = ''; S.scanError = null; S.scanHit = null;
      render(); return;
    }
    if (a === 'search-to-scan') {
      S.sheet = 'scan'; S.scanServings = 1; S.scanHit = null;
      S.scanCode = act.getAttribute('data-c'); S.scanError = null;
      scanLook(); return;
    }
    if (a === 'scan-try') { S.scanCode = act.getAttribute('data-c'); S.scanError = null; scanLook(); return; }
    if (a === 'scan-look') {
      var ce = document.getElementById('sc-code');
      S.scanCode = ce ? ce.value : S.scanCode;
      scanLook(); return;
    }
    if (a === 'scan-again') {
      S.scanState = 'idle'; S.scanCode = ''; S.scanError = null; S.scanHit = null;
      render(); return;
    }
    /* THE BARCODE TRAVELS. It was dropped on the way to the form, so a label
       somebody typed out in full was stored against nothing and the same code
       failed identically the next day. */
    if (a === 'scan-manual') {
      S.man = { name: '', kcal: '', pro: '', carb: '', fat: '', g: '',
                code: String(S.scanCode || '').replace(/\D/g, ''), keep: true, error: null };
      S.sheet = 'manual'; render(); return;
    }
    if (a === 'targets') { S.sheet = 'targets'; S.targetError = null; render(); return; }
    if (a === 'targets-save') { saveTargets(); return; }
    if (a === 'scan-log') { scanLog(); return; }
    if (a === 'meal') { S.sheet = 'meal:' + act.getAttribute('data-i'); render(); return; }
    if (a === 'meals' || a === 'trends' || a === 'water' || a === 'supps') { S.sheet = a; render(); return; }
    if (a === 'fuel-view') {
      /* Only jump to the top when the view actually changed. Tapping the
         segment you are already reading used to throw away how far down
         you had scrolled, which reads as the screen losing your place for
         no reason -- the one thing a segmented control must never do. */
      var wasView = S.view || fuelView();
      var nextView = act.getAttribute('data-v');
      setFuelView(nextView);
      render();
      if (nextView !== wasView) body.scrollTop = 0;
      return;
    }
    if (a === 'open-recipe-sheet') {
      S.sheet = 'recipes'; S.recipeOpen = +act.getAttribute('data-i'); S.recipeServ = 1;
      render(); return;
    }
    if (a === 'water-add') { DAY.waterMl = Math.min(4000, DAY.waterMl + 250); saveDay(); render(); return; }
    if (a === 'water-sub') { DAY.waterMl = Math.max(0, DAY.waterMl - 250); saveDay(); render(); return; }
    /* The tick writes to lk_suppLog, which is the thing streaks are counted
       from. It used to flip a flag on the day record and nothing counted it. */
    if (a === 'supp') {
      var sp0 = supps()[+act.getAttribute('data-i')];
      if (!sp0) return;
      var was = tookToday(sp0.name);
      markSupp(sp0.name, !was);
      /* The day record keeps its copy in step, because Recap reads it. */
      DAY.supps.forEach(function (x) { if (x.name === sp0.name) x.taken = !was; });
      saveDay();
      render();
      say(sp0.name + (was ? ' un-marked.' : ' taken. ' +
        (function () { var r = suppStreak(sp0.name); return r > 1 ? r + ' days in a row.' : ''; })()));
      return;
    }
    if (a === 'supp-list') { S.suppForm = null; S.suppHist = null; S.suppDel = null; render(); return; }
    if (a === 'supp-hist') { S.suppHist = +act.getAttribute('data-i'); S.suppDel = null; render(); return; }
    if (a === 'supp-add') {
      S.suppForm = { idx: null, name: '', dose: '', freq: 'Daily', timeOf: 'Morning',
                     reminder: true, presets: false, q: '', error: null };
      S.suppDel = null;
      render();
      var nf = document.getElementById('sp-name'); if (nf) nf.focus();
      return;
    }
    if (a === 'supp-edit') {
      var se0 = supps()[+act.getAttribute('data-i')];
      if (!se0) return;
      S.suppForm = { idx: +act.getAttribute('data-i'), name: se0.name || '', dose: se0.dose || '',
                     freq: se0.freq || 'Daily', timeOf: se0.timeOf || 'Morning',
                     reminder: se0.reminder !== false, presets: false, q: '', error: null };
      S.suppDel = null;
      render(); return;
    }
    if (a === 'supp-presets') { readSuppForm(); S.suppForm.presets = !S.suppForm.presets; render(); return; }
    if (a === 'supp-preset') {
      readSuppForm();
      S.suppForm.name = act.getAttribute('data-v');
      S.suppForm.presets = false; S.suppForm.q = '';
      render(); return;
    }
    if (a === 'supp-freq') { readSuppForm(); S.suppForm.freq = act.getAttribute('data-v'); render(); return; }
    if (a === 'supp-time') { readSuppForm(); S.suppForm.timeOf = act.getAttribute('data-v'); render(); return; }
    if (a === 'supp-remind') { readSuppForm(); S.suppForm.reminder = !S.suppForm.reminder; render(); return; }
    if (a === 'supp-save') { saveSupp(); return; }
    /* Two taps, like every other destructive control here. Tapping anything
       else on the row disarms it, so an armed bin cannot be hit by accident
       three scrolls later. */
    if (a === 'supp-del') {
      var di = +act.getAttribute('data-i');
      if (S.suppDel !== di) { S.suppDel = di; render(); return; }
      var list = supps().slice();
      var goneS = list.splice(di, 1)[0];
      writeSupps(list);
      S.suppDel = null;
      /* The log keeps its history. Removing a supplement from the shelf is not
         a claim that it was never taken, and deleting the record would rewrite
         every streak behind it. */
      render();
      say(goneS ? goneS.name + ' removed. Its history is kept.' : 'Removed.');
      return;
    }
    if (a === 'cam-oil') { S.camOil = act.getAttribute('data-oil'); render(); return; }
    if (a === 'cam-log') { camLog(); return; }
    if (a === 'mic-log') { micLog(); return; }
    if (a === 'log-often') { logOften(+act.getAttribute('data-i')); return; }
    if (a === 'search') {
      S.sheet = 'search'; S.searchQ = ''; render();
      var fq = document.getElementById('fs-q'); if (fq) fq.focus();
      return;
    }
    if (a === 'log-search') {
      var q2 = (S.searchQ || '').trim().toLowerCase();
      var hit = searchHits(q2)[+act.getAttribute('data-i')];
      if (!hit) return;
      addMeal(withMicros({ key: hit.storeId ? null : (hit.key || null), icon: hit.icon,
                name: hit.name, kcal: hit.kcal,
                pro: hit.pro, carb: hit.carb, fat: hit.fat, src: hit.src,
                slot: S.logSlot || slotForNow() }, hit));
      S.sheet = null;
      say(esc(hit.name) + ' logged, ' + n(hit.kcal) + ' kcal.');
      return;
    }
    if (a === 'build-plan') {
      S.gen = { days: 5, perDay: 3, avoid: '', preview: null };
      S.sheet = 'build-plan'; render(); return;
    }
    if (a === 'gp-days' || a === 'gp-meals') {
      readGen();
      S.gen[a === 'gp-days' ? 'days' : 'perDay'] = +act.getAttribute('data-v');
      S.gen.preview = null;
      render(); return;
    }
    if (a === 'mic-estimate') {
      estimateRest();
      return;
    }
    if (a === 'br-ask') {
      askRecipe();
      return;
    }
    if (a === 'gp-build') {
      readGen();
      var built = buildPlan(S.gen.days, S.gen.perDay, S.gen.avoid);
      if (!built) { say('Nothing is left in the table once all that is taken out.'); return; }
      S.gen.preview = built;
      render();
      return;
    }
    if (a === 'gp-save') {
      readGen();
      if (!S.gen.preview) return;
      usePlan(S.gen.preview, 'A ' + S.gen.days + '-day week, ' + S.gen.perDay + ' meals a day');
      return;
    }
    if (a === 'gp-use') {
      var sp3 = savedPlans()[+act.getAttribute('data-i')];
      if (sp3) usePlan(sp3.days, sp3.name, true);
      return;
    }
    if (a === 'gp-star') {
      var pl = savedPlans().slice(), pi = +act.getAttribute('data-i');
      if (!pl[pi]) return;
      pl[pi].star = !pl[pi].star;
      /* Kept weeks to the top, so the one you come back to is the one you
         reach first. */
      pl.sort(function (x, y) { return (y.star ? 1 : 0) - (x.star ? 1 : 0); });
      writePlans(pl); render(); return;
    }
    if (a === 'gp-del') {
      var pl2 = savedPlans().slice(), gone = pl2.splice(+act.getAttribute('data-i'), 1)[0];
      writePlans(pl2);
      render();
      say(gone ? esc(gone.name) + ' deleted.' : 'Deleted.');
      return;
    }
    if (a === 'plan-day') {
      var pd2 = +act.getAttribute('data-d');
      S.planOpen = S.planOpen === pd2 ? -1 : pd2;
      render(); return;
    }
    if (a === 'plan-shop') { addPlanToShop(PLAN); return; }
    if (a === 'plan-log-day') {
      var pdd = PLAN[+act.getAttribute('data-d')];
      if (!pdd) return;
      /* Only what is not already logged, or logging a day twice doubles the
         meals that were already on the list. */
      var todo = pdd.slots.filter(function (sl) { return !slotDone(pdd, sl); });
      if (!todo.length) { say('All of ' + pdd.d + ' is already logged.'); return; }
      var kc = 0;
      todo.forEach(function (sl) {
        var pf = FOODS[sl.key];

  /* ---------------------------------------------------------------
     Logging

     Eight controls across the five sheets used to carry data-action="close"
     under copy that promised a write: "Log it", "Log both", "One tap logs it
     again", "Remove this entry". Three of them carried no action at all.
     Each one now does the thing its label says, and the day's totals move
     with it, because a log that does not move the number on the screen is
     indistinguishable from a log that failed.
     --------------------------------------------------------------- */

  /* The plate the camera sheet is looking at. Oil is the one question worth
     interrupting for because it is the one that moves the figure. */
  /* Items, not one lump. A photo estimate that comes back as a single
     690 kcal row cannot be corrected: the broccoli is right, the rice is
     double, and there is nothing on the screen to say so. Each item is
     removable, and the total is what is left. */
  var CAM_ITEMS = [
    { name: 'Chicken breast', icon: '\ud83c\udf57', kcal: 330, pro: 46, carb: 0, fat: 8 },
    { name: 'Rice, cooked', icon: '\ud83c\udf5a', kcal: 310, pro: 6, carb: 68, fat: 2 },
    { name: 'Broccoli', icon: '\ud83e\udd66', kcal: 50, pro: 4, carb: 10, fat: 1 }
  ];
  var CAM_BASE = { name: 'Chicken, rice, broccoli', icon: '\ud83c\udf57', kcal: 690, pro: 54, carb: 78, fat: 18 };
  var OIL = { none: { kcal: -90, fat: -10 }, little: { kcal: 0, fat: 0 }, lot: { kcal: 160, fat: 18 } };
  function camItems() {
    /* THE WORKED EXAMPLE IS NO LONGER THE ANSWER. It used to be returned
       for any photo at all, so a plate of pasta read back as chicken,
       rice and broccoli with a caption underneath admitting it. That
       caption was honest and the rows still were not: three foods
       nobody ate, priced to the gram, one tap from the day's log.

       With a server the rows are what came back. Without one there are
       no rows, and the sheet says which. */
    if (S.camState === 'example') {
      if (!S.camItems) S.camItems = CAM_ITEMS.map(function (x) { return x; });
      return S.camItems;
    }
    return S.camItems || [];
  }

  /* Downscaled before it goes anywhere: a phone photo is several
     megabytes, the read does not need them, and the smaller it is the
     less of somebody's data allowance a plate costs. */
  function shrink(file, cb) {
    try {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        try {
          var max = 1024;
          var w = img.width, h = img.height;
          var f = Math.min(1, max / Math.max(w, h));
          var cv = document.createElement('canvas');
          cv.width = Math.round(w * f); cv.height = Math.round(h * f);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          cb(cv.toDataURL('image/jpeg', 0.82));
        } catch (e) { cb(null); }
        try { URL.revokeObjectURL(url); } catch (e) {}
      };
      img.onerror = function () { try { URL.revokeObjectURL(url); } catch (e) {} cb(null); };
      img.src = url;
    } catch (e) { cb(null); }
  }

  function readPlate(file) {
    var C = window.LKCloud;
    if (!C || !C.ready() || !C.vision) {
      S.camState = 'nosrv';
      S.camWhy = 'Reading a plate needs a model behind a server, and this build reaches none. ' +
                 'The photo has not left this phone.';
      render();
      return;
    }
    S.camState = 'reading'; S.camWhy = null; S.camItems = null; render();
    shrink(file, function (dataUrl) {
      if (!dataUrl) {
        S.camState = 'error';
        S.camWhy = 'That photo could not be read on this phone, so nothing was sent.';
        render();
        return;
      }
      C.vision('meal', dataUrl).then(function (r) {
        if (S.sheet !== 'cam') return;
        if (!r || !r.ok) {
          S.camState = r && r.gated ? 'gated' : 'error';
          S.camWhy = (r && r.message) || 'The read did not come back. Nothing was logged.';
          render();
          return;
        }
        /* Each row is a food and a figure, and every figure is an
           estimate -- src stays 'photo' all the way to the log so the
           diary can draw it apart from a looked-up food. */
        S.camItems = r.data.slice(0, 12).map(function (it) {
          return {
            name: String(it.name || it.food || 'Item').slice(0, 60),
            icon: '\u{1F37D}\u{FE0F}',
            kcal: Math.max(0, Math.round(Number(it.cal != null ? it.cal : it.kcal) || 0)),
            pro: Math.max(0, Math.round((Number(it.pro) || 0) * 10) / 10),
            carb: Math.max(0, Math.round((Number(it.carb) || 0) * 10) / 10),
            fat: Math.max(0, Math.round((Number(it.fat) || 0) * 10) / 10),
            src: 'photo'
          };
        }).filter(function (x) { return x.kcal > 0; });
        S.camState = S.camItems.length ? 'done' : 'empty';
        if (!S.camItems.length) S.camWhy = 'Nothing on that photo read as food.';
        render();
      }, function () {
        if (S.sheet !== 'cam') return;
        S.camState = 'error';
        S.camWhy = 'The read could not be reached. Nothing was logged.';
        render();
      });
    });
  }

  /* The oil sits on the plate, not on any one item, so it is added once to
     whatever is left rather than divided among the items. Removing the rice
     should not remove two thirds of the oil somebody poured over all of it. */
  function camPlate() {
    var d = OIL[S.camOil] || OIL.little;
    var t = { kcal: 0, pro: 0, carb: 0, fat: 0 };
    camItems().forEach(function (x) {
      t.kcal += x.kcal; t.pro += x.pro; t.carb += x.carb; t.fat += x.fat;
    });
    var names = camItems().map(function (x) { return x.name.split(',')[0].toLowerCase(); });
    return { name: names.length ? names.join(', ').replace(/^./, function (c) { return c.toUpperCase(); })
                                : CAM_BASE.name,
             icon: (camItems()[0] || CAM_BASE).icon,
             kcal: Math.max(0, t.kcal + (camItems().length ? d.kcal : 0)),
             pro: t.pro, carb: t.carb,
             fat: Math.max(0, t.fat + (camItems().length ? d.fat : 0)), src: 'estimate' };
  }

  function nowLabel() {
    var d = new Date();
    var h = d.getHours() % 12 || 12;
    return h + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  }

  /* The record carries every macro it contributed, not just protein. It used
     to keep pro and kcal only, so removing a meal put its calories and its
     protein back and left its carbs and its fat in the day's totals forever
     -- structurally, not as a missed line: there was nothing on the record
     to subtract. Rescaling a portion had the same hole. */
  function addMeal(meal) {
    DAY.meals.push({ key: meal.key || null, icon: meal.icon, name: meal.name,
                     at: meal.at || nowLabel(),
                     slot: meal.slot || slotForNow(),
                     pro: meal.pro || 0, carb: meal.carb || 0, fat: meal.fat || 0,
                     kcal: meal.kcal, src: meal.src || 'estimate',
                     fibre: meal.fibre, sugar: meal.sugar,
                     satfat: meal.satfat, sodium: meal.sodium });
    recount(DAY);
    saveDay();
    OFTEN = frequent();
    var out = depletePantry(meal.name);
    if (out) {
      /* Kept ON the meal, so deleting the meal can put back exactly what
         logging it took out. */
      DAY.meals[DAY.meals.length - 1].pantry = out;
      saveDay();
      /* Said, not silent. A thing leaving the cupboard and joining a list is
         a change to two other screens, and a person should hear about it
         from the screen that caused it. */
      if (out.emptied) S.pantryOut = out.name;
    }
  }

  /* The two fields are uncontrolled, so anything typed into them has to be
     read back before a re-render throws it away. Every control on this sheet
     re-renders, and without this a name typed before adding an ingredient was
     gone the moment the ingredient landed. */
  /* THE RECIPE GOES THROUGH THE SAME GATE EVERY COACH ACTION DOES. What
     comes back is a proposal, checked before it is drawn: LKCoachActions
     bounds every field and refuses a total the model states rather than
     one computed from the items, which is the whole reason that gate
     exists. What lands here is the form, filled in. */
  /* ESTIMATED, AND DRAWN AS AN ESTIMATE. Every row this adds carries
     src 'estimate' into the log, which is what the diary reads to draw it
     apart from a looked-up food. A figure somebody cannot tell from a
     measured one is worse than no figure. */
  /* WHAT THE TABLE DOES NOT KNOW, THE FOOD DATABASE USUALLY DOES.

     The sentence reader matches against the shipped table, and anything
     it cannot place was shown as "nothing in the table matches this, so
     it is not counted" with the primary button reading "Nothing to log
     yet". For "coconut water" -- an ordinary thing, in every food
     database -- that is the screen refusing to do the one job it was
     opened for.

     So a miss is looked up before it is written off. A hit comes back
     per 100 g with real figures and is marked as a lookup, not an
     estimate; only what the database has never heard of is left for the
     estimate button, which is where a guess belongs.

     Quiet on failure: no server, no network, nothing found -- the row
     stays exactly as it was and the estimate button still offers. */
  function lookupMissing() {
    var C = window.LKCloud;
    if (!C || !C.ready || !C.ready() || !C.foodSearch) return;
    var cur = S.micItems || [];
    var misses = [];
    cur.forEach(function (it, i) {
      if (!it.key && it.raw && String(it.raw).trim().length > 2) misses.push({ i: i, q: it.raw });
    });
    if (!misses.length) return;
    var token = (S.micLookupToken = (S.micLookupToken || 0) + 1);
    S.micLookingUp = true;
    Promise.all(misses.map(function (m) {
      return C.foodSearch(m.q).then(function (r) {
        return { i: m.i, q: m.q, hit: (r && r.ok && r.data && r.data[0]) || null };
      }, function () { return { i: m.i, q: m.q, hit: null }; });
    })).then(function (rows) {
      /* A later edit of the sentence wins: this answer is about text
         nobody is looking at any more. */
      if (token !== S.micLookupToken) return;
      S.micLookingUp = false;
      var list = (S.micItems || []).slice();
      var changed = false;
      rows.forEach(function (row) {
        if (!row.hit || !list[row.i] || list[row.i].key) return;
        var g = Number(list[row.i].grams) > 0 ? Number(list[row.i].grams) : 100;
        var f = g / 100;
        list[row.i] = {
          key: '@db' + row.i + '-' + Date.now(),
          name: row.hit.name || row.q,
          icon: '\u{1F37D}\u{FE0F}',
          grams: g,
          kcal: Math.round((row.hit.kcal || 0) * f),
          pro: Math.round((row.hit.pro || 0) * f * 10) / 10,
          carb: Math.round((row.hit.carb || 0) * f * 10) / 10,
          fat: Math.round((row.hit.fat || 0) * f * 10) / 10,
          src: 'lookup',
          from: row.hit.from || 'Food database'
        };
        changed = true;
      });
      if (changed) { S.micItems = list; render(); }
      else if (S.micLookingUp === false) render();
    });
  }

  function estimateRest() {
    var C = window.LKCloud;
    if (!C || !C.ready() || !C.vision) return;
    var cur = S.micItems || [];
    var missed = cur.filter(function (i) { return !i.key; })
      .map(function (i) { return i.raw; }).filter(Boolean);
    if (!missed.length) return;
    S.micBusy = true; S.micWhy = null; render();
    C.vision('meal', '', { description: missed.join(', ') }).then(function (r) {
      S.micBusy = false;
      if (!r || !r.ok || !Array.isArray(r.data) || !r.data.length) {
        S.micWhy = (r && r.message) || 'No estimate came back, so nothing was added.';
        render();
        return;
      }
      var made = r.data.slice(0, 10).map(function (it, i) {
        var kcal = Math.max(0, Math.round(Number(it.cal != null ? it.cal : it.kcal) || 0));
        if (!kcal) return null;
        return {
          /* A key so the row counts and can be logged; est so every place
             that draws or stores it knows it is a reading, not a lookup. */
          key: '@est' + Date.now() + i,
          est: true,
          name: String(it.name || 'Item').slice(0, 40),
          icon: '\u{1F37D}\u{FE0F}',
          grams: 0,
          kcal: kcal,
          pro: Math.max(0, Math.round((Number(it.pro) || 0) * 10) / 10),
          carb: Math.max(0, Math.round((Number(it.carb) || 0) * 10) / 10),
          fat: Math.max(0, Math.round((Number(it.fat) || 0) * 10) / 10),
          src: 'estimate'
        };
      }).filter(Boolean);
      /* The phrases that were estimated leave the list: they are these rows
         now, and showing both would count the meal twice. */
      S.micItems = cur.filter(function (i) { return i.key; }).concat(made);
      S.micWhy = made.length
        ? made.length + (made.length === 1 ? ' estimate' : ' estimates') +
          ' added, marked as estimates rather than looked-up foods.'
        : 'Nothing in that came back with a figure, so nothing was added.';
      render();
    }, function () {
      S.micBusy = false;
      S.micWhy = 'The estimate could not be reached, so nothing was added.';
      render();
    });
  }

  function askRecipe() {
    var C = window.LKCloud;
    if (!C || !C.coachReady()) return;
    if (!S.draft) S.draft = { name: '', servings: 4, items: [], notes: [], error: null };
    readDraft();
    S.brAsking = true; S.brWhy = null; render();
    var want = (S.draft.name || '').trim();
    C.ask([{ role: 'user',
             content: 'Give me one recipe' + (want ? ' for ' + want : '') +
                      ' as a recipe action. Real ingredients with weights in grams. ' +
                      'Do not state a calorie total: the app computes it.' }], {})
      .then(function (r) {
        S.brAsking = false;
        var acts = (r && r.ok && r.data && r.data.actions) || [];
        var rec = null;
        if (window.LKCoachActions) {
          LKCoachActions.checkAll(acts).forEach(function (v) {
            if (!rec && v.ok && v.kind === 'recipe') rec = v.action;
          });
        }
        if (!rec) {
          S.brWhy = !r || !r.ok
            ? ((r && r.message) || 'The coach could not be reached. Nothing was changed.')
            : 'Nothing usable came back, so the form is as you left it.';
          render();
          return;
        }
        var src = rec.recipe || rec;
        S.draft.name = String(src.name || want || 'Recipe').slice(0, 40);
        S.draft.servings = Math.max(1, Math.min(24, parseInt(src.servings, 10) || 4));
        /* Only items with a weight. A line with no grams cannot be
           costed, cannot be scaled and cannot be checked. */
        S.draft.items = (src.items || []).slice(0, 40).map(function (it) {
          var g = Math.round(Number(it.grams != null ? it.grams : it.g) || 0);
          if (!(g > 0)) return null;
          return { name: String(it.name || '').slice(0, 40), g: g, cooked: false, yieldPct: 100,
                   per100: null, fromCoach: true };
        }).filter(Boolean);
        S.draft.error = null;
        S.brWhy = S.draft.items.length
          ? 'Filled in. Every line is yours to change, and the calories are computed from ' +
            'the weights rather than taken from the reply.'
          : 'It named no ingredient with a weight, so there was nothing to fill in.';
        render();
        say('The coach filled the form.');
      }, function () {
        S.brAsking = false;
        S.brWhy = 'The coach could not be reached. Nothing was changed.';
        render();
      });
  }

  function readDraft() {
    if (!S.draft) S.draft = { name: '', servings: 4, items: [], notes: [], error: null };
    var nEl = document.getElementById('br-name');
    var sEl = document.getElementById('br-servings');
    if (nEl) S.draft.name = nEl.value;
    if (sEl) {
      var v = parseInt(sEl.value, 10);
      if (!isNaN(v) && v >= 1 && v <= 24) S.draft.servings = v;
    }
    var qEl = document.getElementById('br-q');
    if (qEl) S.draftQ = qEl.value;
    /* Every weight and every yield on the form, before anything repaints.
       A grams field that is only read when the recipe is saved loses the
       figure the moment another ingredient is added. */
    S.draft.items.forEach(function (it, i) {
      var gEl = document.getElementById('br-g-' + i);
      if (gEl) {
        var g = parseFloat(gEl.value);
        if (!isNaN(g) && g >= 1 && g <= 20000) it.g = Math.round(g);
      }
      var yEl = document.getElementById('br-y-' + i);
      if (yEl) {
        var y = parseFloat(yEl.value);
        if (!isNaN(y) && y >= 20 && y <= 600) it.yieldPct = Math.round(y);
      }
    });
  }

  /* One weigh-in, written where Progress and Settings read it. The rate on
     the hero and the water target both move with it, which is the point of
     putting the field on this screen at all. */
  function readGen() {
    if (!S.gen) S.gen = { days: 5, perDay: 3, avoid: '', preview: null };
    var el = document.getElementById('gp-avoid');
    if (el) S.gen.avoid = el.value.slice(0, 120);
  }

  /* The built week replaces the one on the plan sheet and is saved, so it can
     be come back to. A plan that cannot be saved is a suggestion. */
  function usePlan(days, name, existing) {
    var tk = 0, cnt = 0;
    days.forEach(function (d) { d.slots.forEach(function (sl) { tk += sl.kcal; }); cnt++; });
    PLAN.length = 0;
    days.forEach(function (d) { PLAN.push({ d: d.d, iso: d.iso, slots: d.slots.slice() }); });
    savePlan();
    if (!existing) {
      var list = savedPlans().slice();
      list.unshift({ id: 'pl_' + Date.now(), name: name,
                     avg: Math.round(tk / (cnt || 1)), star: false, days: days });
      writePlans(list.slice(0, 12));
    }
    S.gen = null;
    S.sheet = 'plan';
    S.planOpen = undefined;
    render();
    say(name + ' is your week now.');
  }

  function readFP() {
    if (!S.fp) S.fp = fuelProfile();
    var num = function (id, min, max, cur) {
      var el = document.getElementById(id);
      if (!el) return cur;
      var v = parseFloat(el.value);
      return (isNaN(v) || v < min || v > max) ? cur : v;
    };
    /* Read in the unit on screen, stored in kilograms, which is the one unit
       lk_profile holds. */
    var shown = num('fp-w', LKUnits.useKg() ? 20 : 45, LKUnits.useKg() ? 400 : 880, wtNum(S.fp.weightKg));
    S.fp.weightKg = Math.round(wtToKg(Number(shown)) * 10) / 10;
    /* Feet and inches are two fields and one height. Stored in centimetres,
       which is the only unit lk_profile holds. */
    if (S.fp.ft && document.getElementById('fp-ft')) {
      var ft = num('fp-ft', 3, 8, Math.floor(Math.round(S.fp.heightCm / 2.54) / 12));
      var inch = num('fp-in', 0, 11, Math.round(S.fp.heightCm / 2.54) % 12);
      S.fp.heightCm = Math.round((ft * 12 + inch) * 2.54);
    } else {
      S.fp.heightCm = Math.round(num('fp-h', 100, 250, S.fp.heightCm));
    }
    S.fp.age = Math.round(num('fp-a', 13, 100, S.fp.age));
    if (S.fp.macroMode === 'custom') {
      S.fp.kcal = Math.round(num('fp-kcal', 800, 8000, S.fp.kcal || TARGETS.kcal || 2000));
      S.fp.pro = Math.round(num('fp-pro', 0, 1000, S.fp.pro || TARGETS.pro || 0));
      S.fp.carb = Math.round(num('fp-carb', 0, 1000, S.fp.carb || TARGETS.carb || 0));
      S.fp.fat = Math.round(num('fp-fat', 0, 1000, S.fp.fat || TARGETS.fat || 0));
    }
    var d = document.getElementById('fp-diet');
    var al = document.getElementById('fp-allergy');
    if (d) S.fp.diet = d.value.slice(0, 120);
    if (al) S.fp.allergy = al.value.slice(0, 120);
  }

  /* Weight, height, age, sex and goal go back to lk_profile, because Settings
     and Progress read them there and a second copy is a second truth. Only
     what this screen alone knows goes to lk_fuelProfile. */
  function saveFuelProfile() {
    readFP();
    var fp = S.fp;
    if (ST && persisting()) {
      ST.patch('lk_profile', { weightKg: fp.weightKg, heightCm: fp.heightCm,
                               age: fp.age, sex: fp.sex, goal: fp.goal });
      ST.patch('lk_fuelProfile', { activity: fp.activity, macroMode: fp.macroMode,
                                   diet: fp.diet, diets: (fp.diets || []).slice(),
                                   ft: !!fp.ft, allergy: fp.allergy });
    }
    PROFILE.weightKg = fp.weightKg; PROFILE.heightCm = fp.heightCm;
    PROFILE.age = fp.age; PROFILE.sex = fp.sex; PROFILE.goal = fp.goal;
    /* A weight typed here is a weigh-in, or the hero would read a rate
       against a body weight nothing on the chart agrees with. */
    var log = (WEIGHTLOG || []).slice();
    var last = log[log.length - 1];
    if (last && last.date === DAY.iso) last.kg = fp.weightKg;
    else log.push({ date: DAY.iso, kg: fp.weightKg });
    WEIGHTLOG = log;
    if (ST && persisting()) ST.set('lk_weightLog', log);

    var msg = 'Saved.';
    if (fp.macroMode === 'auto') {
      var m = calcMacros(fp);
      DAY.target = m.kcal;
      DAY.macros[0].want = m.pro; DAY.macros[1].want = m.carb; DAY.macros[2].want = m.fat;
      saveTargetsTo({ kcal: m.kcal, pro: m.pro, carb: m.carb, fat: m.fat,
                      waterMl: TARGETS.waterMl });
      msg = 'Saved. Targets are now ' + n(m.kcal) + ' kcal, ' + n(m.pro) + ' g protein.';
    } else if (fp.kcal) {
      /* Typed here, saved here. Choosing "Mine" used to send somebody to
         another sheet to type the figures the sheet had just asked for. */
      DAY.target = fp.kcal;
      DAY.macros[0].want = fp.pro; DAY.macros[1].want = fp.carb; DAY.macros[2].want = fp.fat;
      saveTargetsTo({ kcal: fp.kcal, pro: fp.pro, carb: fp.carb, fat: fp.fat,
                      waterMl: TARGETS.waterMl });
      msg = 'Saved. Your targets: ' + n(fp.kcal) + ' kcal, ' + n(fp.pro) + ' g protein.';
    }
    /* Guarded against the same unknown goal as the targets sentence, and
       against fp rather than the account profile: this is the fuel
       profile's own goal, not the one Settings holds. */
    var dg = GOAL_WORD[fp.goal] ? fp.goal : 'maintain';
    DAY.goal = GOAL_WORD[dg]; DAY.goalKey = dg;
    DAY.weightKg = fp.weightKg;
    DAY.rate = weekRate();
    DAY.waterGoalMl = waterGoal().ml;
    DAY.waterGoalComputed = waterGoal().computed;
    S.fp = null; S.sheet = null;
    render();
    say(msg);
  }

  function weighIn() {
    var el = document.getElementById('wt-new');
    var v = parseFloat(el ? el.value : '');
    /* The field reads in whatever unit the app is set to. It took the number
       as kilograms whatever the switch said, so a reader in pounds typing
       141.5 was stored as 141.5 kg. */
    var lo = LKUnits.useKg() ? 20 : 45, hi = LKUnits.useKg() ? 400 : 880;
    if (isNaN(v) || v < lo || v > hi) {
      say('A weight between ' + lo + ' and ' + hi + ' ' + LKUnits.label() + '.');
      return;
    }
    var kg = Math.round(wtToKg(v) * 10) / 10;
    var log = (WEIGHTLOG || []).slice();
    var last = log[log.length - 1];
    /* One entry a day: weighing twice should correct today, not invent a
       second day and halve the span every rate on the screen is read over. */
    if (last && last.date === DAY.iso) last.kg = kg;
    else log.push({ date: DAY.iso, kg: kg });
    WEIGHTLOG = log;
    if (ST && persisting()) {
      ST.set('lk_weightLog', log);
      ST.patch('lk_profile', { weightKg: kg });
    }
    PROFILE.weightKg = kg;
    DAY.weightKg = kg;
    DAY.rate = weekRate();
    DAY.waterGoalMl = waterGoal().ml;
    DAY.waterGoalComputed = waterGoal().computed;
    render();
    say(wtTxt(kg) + ' saved.');
  }

  function readSuppForm() {
    if (!S.suppForm) return;
    var g = function (id) { var e = document.getElementById(id); return e ? e.value : null; };
    var nm = g('sp-name'); if (nm !== null) S.suppForm.name = nm;
    var ds = g('sp-dose'); if (ds !== null) S.suppForm.dose = ds;
    var q = g('sp-q'); if (q !== null) S.suppForm.q = q;
    var ct = g('sp-custom');
    if (ct !== null && String(ct).trim()) S.suppForm.timeOf = String(ct).trim();
  }

  function saveSupp() {
    readSuppForm();
    var f = S.suppForm;
    var name = String(f.name || '').trim();
    if (!name) { f.error = 'What is it called?'; render(); focusSupp('sp-name'); return; }
    var list = supps().slice();
    /* One row per thing. Two rows called Creatine would split one streak in
       half and neither half would be true. */
    var clash = -1;
    list.forEach(function (x, i) {
      if (String(x.name).toLowerCase() === name.toLowerCase() && i !== f.idx) clash = i;
    });
    if (clash >= 0) { f.error = name + ' is already on the list.'; render(); focusSupp('sp-name'); return; }
    var timeOf = f.timeOf === 'Custom' ? 'Any time' : f.timeOf;
    var rec = {
      name: name, dose: String(f.dose || '').trim(), freq: f.freq || 'Daily',
      timeOf: timeOf, reminder: !!f.reminder
    };
    if (f.idx !== null && f.idx !== undefined && list[f.idx]) {
      /* created is kept: it is what Every Other Day and Weekly count from, so
         an edit must not reset the schedule. */
      rec.created = list[f.idx].created || new Date().toISOString();
      /* A rename carries its history with it, or the streak dies on a typo
         being fixed. */
      var oldName = list[f.idx].name;
      list[f.idx] = rec;
      if (oldName !== name) renameInLog(oldName, name);
    } else {
      rec.created = new Date().toISOString();
      list.push(rec);
    }
    writeSupps(list);
    S.suppForm = null;
    render();
    say(name + ' saved.');
  }

  function renameInLog(from, to) {
    var map = suppLog(), touched = false;
    Object.keys(map).forEach(function (iso) {
      var at = map[iso].indexOf(from);
      if (at >= 0) { map[iso][at] = to; touched = true; }
    });
    if (touched) writeSuppLog(map);
  }

  function focusSupp(id) {
    var e = document.getElementById(id);
    if (e) { e.focus(); try { e.setSelectionRange(e.value.length, e.value.length); } catch (err) {} }
  }

  function readManual() {
    if (!S.man) S.man = { name: '', kcal: '', pro: '', carb: '', fat: '', g: '',
                          code: null, keep: false, error: null };
    ['name', 'kcal', 'pro', 'carb', 'fat', 'g'].forEach(function (k) {
      var el = document.getElementById('mn-' + k);
      if (el) S.man[k] = el.value;
    });
  }

  function manualAdd() {
    readManual();
    var m = S.man;
    var kcal = parseInt(m.kcal, 10);
    if (!m.name.trim()) { m.error = 'Give it a name.'; render(); return; }
    if (isNaN(kcal) || kcal < 1 || kcal > 8000) {
      m.error = 'Calories between 1 and 8,000.'; render(); return;
    }
    var num = function (v, max) {
      var x = parseFloat(v);
      if (isNaN(x) || x < 0) return 0;
      return Math.min(max, Math.round(x * 10) / 10);
    };
    addMeal({
      key: null, icon: '\ud83c\udf7d\ufe0f', name: m.name.trim().slice(0, 60), kcal: kcal,
      pro: num(m.pro, 500), carb: num(m.carb, 800), fat: num(m.fat, 400),
      /* An estimate, and labelled one. Nothing measured this: somebody read
         it off a packet or remembered it. */
      src: 'estimate', slot: S.logSlot || slotForNow()
    });
    /* KEPT, WITH ITS CODE. The typed label used to be logged and thrown away,
       so a barcode that came back not found came back not found forever. */
    var kept = null;
    if (m.keep) {
      var wg = parseFloat(m.g);
      var grams = isNaN(wg) || wg < 1 || wg > 20000 ? null : Math.round(wg);
      kept = saveProduct({
        name: m.name.trim().slice(0, 60), code: m.code || null,
        g: grams || 100, serving: grams ? null : 'one serving',
        icon: '\ud83c\udf7d\ufe0f', src: 'estimate',
        per100: per100Of({ kcal: kcal, pro: num(m.pro, 500), carb: num(m.carb, 800),
                           fat: num(m.fat, 400) }, grams || 100)
      });
    }
    var code = m.code;
    S.man = null; S.sheet = null;
    render();
    say(esc(m.name.trim()) + ' logged, ' + n(kcal) + ' kcal.' +
        (kept ? (code ? ' Kept against ' + prettyCode(code) + '.' : ' Kept in your foods.') : ''));
  }

  function saveRecipe() {
    readDraft();
    var d = S.draft;
    if (!d.name.trim()) { d.error = 'Give it a name.'; render(); return; }
    if (!d.items.length) { d.error = 'Add at least one ingredient with figures on it, so the ' +
      'recipe is its ingredients added up rather than a guess.'; render(); return; }
    var sEl = document.getElementById('br-servings');
    var sv = parseInt(sEl ? sEl.value : d.servings, 10);
    if (isNaN(sv) || sv < 1 || sv > 24) { d.error = 'Servings between 1 and 24.'; render(); return; }
    var t = draftTotals(d);
    var rec = {
      id: 'r' + Date.now(), name: d.name.trim().slice(0, 60), servings: sv,
      icon: (FOODS[d.items[0].key] || {}).icon || '\ud83e\udd63',   /* a typed-in first ingredient has none */
      /* FROZEN. What is stored is the ingredient as it was weighed, with its
         own figures where they were typed in, so a stored recipe cannot
         change when the food table does. */
      items: d.items.map(function (it) {
        return it.per100
          ? { name: it.name, g: it.g, cooked: !!it.cooked, yieldPct: it.yieldPct || 100,
              per100: { kcal: it.per100.kcal, pro: it.per100.pro, carb: it.per100.carb,
                        fat: it.per100.fat } }
          : { key: it.key, g: it.g, qty: it.qty, cooked: !!it.cooked,
              yieldPct: it.yieldPct || 100 };
      }),
      notes: d.notes.slice(),
      kcal: Math.round(t.kcal), pro: Math.round(t.pro),
      carb: Math.round(t.carb), fat: Math.round(t.fat)
    };
    if (ST && persisting()) ST.push('lk_recipes', rec, true);
    S.draft = null;
    S.sheet = 'recipes';
    render();
    say(esc(rec.name) + ' saved, ' + n(Math.round(rec.kcal / sv)) + ' kcal a serving.');
  }

  function saveTargets() {
    var kcal = parseInt((document.getElementById('tg-kcal') || {}).value, 10);
    if (isNaN(kcal) || kcal < 800 || kcal > 8000) {
      S.targetError = 'Calories between 800 and 8,000.';
      render(); return;
    }
    /* Read every field, validate every field, then write. It used to write
       each macro as it read it and bail on the first bad one, so a rejected
       save still moved the targets either side of the bad field -- the day
       was then measured against a figure nobody had confirmed. */
    var bad = null, want = [];
    DAY.macros.forEach(function (m) {
      var v = parseInt((document.getElementById('tg-' + m.key) || {}).value, 10);
      if (isNaN(v) || v < 0 || v > 1000) { if (!bad) bad = m.name; return; }
      want.push([m, v]);
    });
    if (bad) { S.targetError = bad + ' between 0 and 1,000 ' + 'g.'; render(); return; }
    want.forEach(function (w) { w[0].want = w[1]; });
    DAY.target = kcal;
    saveTargetsTo({ kcal: kcal, pro: DAY.macros[0].want, carb: DAY.macros[1].want,
                    fat: DAY.macros[2].want, waterMl: TARGETS.waterMl });
    S.sheet = null; S.targetError = null;
    say('Targets saved. ' + n(kcal) + ' kcal.');
  }

  /* A lookup is not instant, and a screen that resolves before the tap has
     finished teaches nobody what the wait looks like. One short pass through
     `looking` before either answer. */
  function scanLook() {
    var digits = String(S.scanCode || '').replace(/\D/g, '');
    if (digits.length < 8 || digits.length > 14) {
      S.scanError = 'A barcode is 8 to 14 digits. That one is ' + digits.length + '.';
      render(); return;
    }
    S.scanError = null;
    S.scanCode = digits;
    S.scanState = 'looking';
    render();
    setTimeout(function () {
      if (S.sheet !== 'scan' || S.scanState !== 'looking') return;
      var hit = lookupCode(digits);
      S.scanHit = hit;
      S.scanState = hit ? 'found' : 'notfound';
      /* IDENTIFIED IS KEPT. A code that resolved is written into your own
         foods the moment it resolves, not when something is logged from it:
         looking a product up and deciding not to eat it is still the app
         learning what the code is. Nothing is kept twice -- a product already
         yours came back from the store in the first place. */
      S.scanKept = false;
      if (hit && !hit.mine) {
        var base = FOODS[hit.key] ? FOODS[hit.key].g : 100;
        if (saveProduct({ name: hit.name, code: digits, g: base, icon: hit.icon,
                          src: 'verified', per100: per100Of(hit, base) })) S.scanKept = true;
      }
      render();
    }, 600);
  }

  function scanLog() {
    var f = S.scanHit, k = S.scanServings;
    if (!f) return;
    /* Fat to a tenth. Rounded to whole grams, the product's 0.3 g became 0
       and the day's fat bar quietly lost it on every scan. */
    var meal = { key: f.key, icon: f.icon, name: f.name, kcal: Math.round(f.kcal * k),
                 pro: Math.round(f.pro * k), carb: Math.round(f.carb * k),
                 fat: Math.round(f.fat * k * 10) / 10,
                 src: f.src === 'estimate' ? 'estimate' : 'verified',
                 slot: S.logSlot || slotForNow() };
    MICROS.forEach(function (mi) {
      if (typeof f[mi.key] === 'number') meal[mi.key] = Math.round(f[mi.key] * k * 10) / 10;
    });
    addMeal(meal);
    /* Stays open on a confirmation with "Scan another", because a shop is a
       run of barcodes, not one. Closing the sheet made the second scan four
       taps instead of one. */
    S.scanLast = f.name;
    S.scanState = 'logged';
    render();
    say(esc(f.name) + ' logged, ' + n(Math.round(f.kcal * k)) + ' kcal.' +
        (f.src === 'estimate' ? ' Your own figures.' : ' Verified.'));
  }

  function camLog() {
    var plate = camPlate();
    if (!camItems().length) return;
    plate.slot = S.logSlot || slotForNow();
    addMeal(plate);
    if (S.camShot) { try { URL.revokeObjectURL(S.camShot); } catch (e) {} }
    S.sheet = null; S.camOil = null; S.camItems = null; S.camShot = null;
    say(esc(plate.name) + ' logged, ' + n(plate.kcal) + ' kcal.');
  }

  /* Exactly what the preview showed, item by item. An unmatched piece is not
     logged and was never counted in the total on the button. */
  function micLog() {
    var items = (S.micItems || []).filter(function (it) { return it.key && (it.est || it.grams > 0); });
    if (!items.length) return;
    var slot = S.logSlot || slotForNow();
    var tot = 0;
    items.forEach(function (it) {
      /* An estimated row has no entry in the food table, so it carries no
         gram weight and must not be looked up in FOODS -- which is how a
         row read off a sentence used to throw on its own name. */
      /* THE TABLE ROW, IF THERE IS ONE. The guard was `it.est`, and a row
         filled by the database lookup carries a key of its own that is not
         in FOODS and no est flag -- so this read FOODS[key].g on nothing
         and threw "Cannot read properties of undefined (reading 'g')".
         Nothing was logged, the diary stayed empty and the hero did not
         move, on the route a person takes by default: type what you ate,
         press Log. */
      var row = (!it.est && it.key) ? FOODS[it.key] : null;
      var meal = { key: row ? it.key : null, icon: it.icon,
                   name: row && it.grams !== row.g
                     ? it.name + ', ' + n(it.grams) + ' g'
                     : it.name,
                   kcal: it.kcal, pro: it.pro, carb: it.carb, fat: it.fat,
                   src: it.est ? 'estimate' : (row ? 'table' : 'lookup'), slot: slot };
      MICROS.forEach(function (mi) {
        if (typeof it[mi.key] === 'number') meal[mi.key] = it[mi.key];
      });
      addMeal(meal);
      tot += it.kcal;
    });
    S.sheet = null; S.micText = ''; S.micItems = null;
    say(items.length + (items.length === 1 ? ' item' : ' items') + ' logged, ' + n(tot) + ' kcal.');
  }

  function logOften(i) {
    var r = OFTEN[i];
    if (!r) return;
    /* 'repeat', not 'verified'. Logging a home-cooked meal again earns no new
       evidence, and stamping Verified on it told the reader a barcode had
       matched a database row -- a scan that never happened, on the same food
       the original entry calls an Estimate. */
    addMeal({ key: r.key, icon: r.icon, name: r.name, pro: r.pro, carb: r.carb,
              fat: r.fat, kcal: r.kcal, src: 'repeat' });
    S.sheet = null;
    say(esc(r.name) + ' logged again.');
  }

  /* A portion, not a rewrite. Scaling every figure by the same factor is the
     honest edit: the plate was the plate, there was just more or less of it. */
  /* `by` is the factor itself, not a delta. 0.8 and 1.25 are reciprocals, so
     one then the other returns the meal to where it started. */
  /* Scaled from the portion the meal was logged at, never from the last
     rounded figure. Compounding rounded steps is not reciprocal: 52 g of
     protein taken down a fifth and back up a quarter came home as 53, and
     several steps drifted further each time. The meal keeps its original
     macros in `base` and every step is `base x scale`, so a fifth less then a
     quarter more is base x 0.8 x 1.25 = base, exactly. */
  function portion(i, f) {
    var m = DAY.meals[i];
    if (!m || !f) return;
    if (!m.base) {
      m.base = { kcal: m.kcal || 0, pro: m.pro || 0, carb: m.carb || 0, fat: m.fat || 0 };
      MICROS.forEach(function (mi) {
        if (typeof m[mi.key] === 'number') m.base[mi.key] = m[mi.key];
      });
      m.scale = 1;
    }
    m.scale = Math.round(m.scale * f * 1000) / 1000;
    /* A portion cannot go to nothing or to ten plates. */
    if (m.scale < 0.1) m.scale = 0.1;
    if (m.scale > 10) m.scale = 10;
    ['kcal', 'pro', 'carb', 'fat'].forEach(function (k) {
      m[k] = Math.round(m.base[k] * m.scale * 10) / 10;
    });
    MICROS.forEach(function (mi) {
      if (typeof m.base[mi.key] === 'number') {
        m[mi.key] = Math.round(m.base[mi.key] * m.scale * 10) / 10;
      }
    });
    m.kcal = Math.round(m.kcal);
    recount(DAY);
    saveDay();
    /* say() renders. Rendering here as well was two full passes a tap. */
    say(esc(m.name) + ' is now ' + n(m.kcal) + ' kcal.');
  }

  function removeMeal(i) {
    var m = DAY.meals[i];
    if (!m) return;
    DAY.meals.splice(i, 1);
    recount(DAY);
    /* What logging it took out of the cupboard goes back in, and the row it
       put on the shopping list comes off again. */
    restorePantry(m.pantry);
    saveDay();
    OFTEN = frequent();
    S.sheet = null;
    /* Destructive, so it is undoable rather than confirmed: a confirm asks a
       question the person already answered by pressing a red button. */
    say(esc(m.name) + ' removed.', function () {
      DAY.meals.splice(i, 0, m);
      recount(DAY);
      if (m.pantry) depletePantry(m.name);
      saveDay();
      OFTEN = frequent();
    });
  }

  var toastTimer = null;
  /* say(msg, undo). The undo belongs to THIS message and to nothing else.
     removeMeal was the only writer of S.undo and say() never cleared it, so
     logging anything within six seconds of a delete produced a toast reading
     "Chicken, rice, broccoli logged" with an Undo that put the deleted meal
     back: three rows became four. An action that cannot be taken back says
     so by passing nothing. */
  function say(msg, undo) {
    /* A thing leaving the cupboard and joining the list is a change to two
       other screens, and the person should hear it from the screen that
       caused it -- appended to the message the log already produced, rather
       than as a second toast that replaces the first. */
    if (S.pantryOut) {
      msg = msg + ' Last of the ' + String(S.pantryOut).toLowerCase() + ', so it is on the list.';
      S.pantryOut = null;
    }
    S.toast = msg;
    S.undo = undo || null;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; S.undo = null; render(); }, 6000);
  }
  function doUndo() {
    if (S.undo) S.undo();
    S.undo = null; S.toast = null;
    render();
  }
  function toastHTML() {
    if (!S.toast) return '';
    return '<div class="toast" role="status" data-testid="toast">' +
      '<span class="toast__body">' + S.toast + '</span>' +
      (S.undo ? '<button class="toast__action" type="button" data-action="undo" data-testid="undo">Undo</button>' : '') +
    '</div>';
  }

  /* The servings field re-renders the figures under it as it is typed, and
     LKPatch keeps the caret. */
  document.addEventListener('input', function (e) {
    if (e.target.id === 'fs-q') {
      S.searchQ = e.target.value;
      askServer(S.searchQ);
      render();
      /* Re-render replaces the field, so the caret has to be put back where
         the typist left it or every keystroke jumps to the start. */
      var f = document.getElementById('fs-q');
      if (f) { f.focus(); try { f.setSelectionRange(f.value.length, f.value.length); } catch (err) {} }
      return;
    }
    /* The ingredient search repaints its hits as it is typed, and the caret
       goes back where the typist left it. */
    if (e.target.id === 'br-q') {
      readDraft();
      S.draftQ = e.target.value;
      render();
      var bq = document.getElementById('br-q');
      if (bq) { bq.focus(); try { bq.setSelectionRange(bq.value.length, bq.value.length); } catch (err) {} }
      return;
    }
    /* A gram figure and a yield both change the row that carries them as well
       as the totals under it -- the row says what the ingredient is being
       priced as -- so the sheet repaints and the caret goes back. Patching
       only the totals left the row saying 800 g raw under totals worked out
       at 1,067. */
    if (e.target.id.indexOf('br-g-') === 0 || e.target.id.indexOf('br-y-') === 0) {
      var bid = e.target.id;
      readDraft();
      render();
      var bel = document.getElementById(bid);
      if (bel) { bel.focus(); try { bel.setSelectionRange(bel.value.length, bel.value.length); } catch (err) {} }
      return;
    }
    /* The servings field drives the preview under it, so it repaints as it
       is typed. The name keeps its own value across that repaint through
       readDraft, and the caret is put back the same way the search field
       does it. */
    if (e.target.id === 'rc-serv') {
      var rv = parseFloat(e.target.value);
      if (isNaN(rv) || rv < 0.5) return;
      S.recipeServ = Math.min(12, rv);
      render();
      var rf2 = document.getElementById('rc-serv');
      if (rf2) { rf2.focus(); try { rf2.setSelectionRange(rf2.value.length, rf2.value.length); } catch (err) {} }
      return;
    }
    if (e.target.id === 'cam-take' || e.target.id === 'cam-pick') {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      if (S.camShot) { try { URL.revokeObjectURL(S.camShot); } catch (err) {} }
      /* An object URL, not a data URL: a phone photo is several megabytes and
         base64 in a re-rendered attribute is a stall you can feel. */
      S.camShot = URL.createObjectURL(file);
      S.camItems = null; S.camOil = null;
      readPlate(file);
      return;
    }
    if (e.target.id === 'sp-q') {
      readSuppForm();
      render();
      focusSupp('sp-q');
      return;
    }
    if (e.target.id && e.target.id.indexOf('sp-') === 0) { readSuppForm(); return; }
    if (e.target.id === 'mn-name' || e.target.id === 'mn-kcal') {
      var wid = e.target.id;
      readManual();
      render();
      var el2 = document.getElementById(wid);
      if (el2) { el2.focus(); try { el2.setSelectionRange(el2.value.length, el2.value.length); } catch (err) {} }
      return;
    }
    if (e.target.id.indexOf('mn-') === 0) { readManual(); return; }
    if (e.target.id === 'mic-text') {
      S.micText = e.target.value;
      S.micItems = S.micText.trim() ? parseMeal(S.micText) : null;
      /* Looked up when the typing stops, not on every keystroke: "coconut
         water" is fourteen characters and fourteen requests would be a
         denial of service aimed at ourselves. */
      if (S.micLookupTimer) clearTimeout(S.micLookupTimer);
      S.micLookupTimer = setTimeout(function () { lookupMissing(); }, 600);
      render();
      var mf = document.getElementById('mic-text');
      if (mf) { mf.focus(); try { mf.setSelectionRange(mf.value.length, mf.value.length); } catch (err) {} }
      return;
    }
    if (e.target.id === 'fd-g') {
      var gv2 = parseInt(e.target.value, 10);
      if (isNaN(gv2) || gv2 < 1) return;      /* mid-edit, not yet a number */
      S.foodG = Math.min(3000, gv2);
      render();
      var gf = document.getElementById('fd-g');
      if (gf) { gf.focus(); try { gf.setSelectionRange(gf.value.length, gf.value.length); } catch (err) {} }
      return;
    }
    if (e.target.id === 'br-servings' || e.target.id === 'br-name') {
      var wasId = e.target.id;
      readDraft();
      if (wasId === 'br-name') return;   /* nothing under it changes as you type */
      render();
      var sv = document.getElementById('br-servings');
      if (sv) { sv.focus(); try { sv.setSelectionRange(sv.value.length, sv.value.length); } catch (err) {} }
      return;
    }
    if (e.target.id !== 'scan-servings') return;
    var v = parseFloat(e.target.value);
    S.scanServings = (isNaN(v) || v <= 0) ? 1 : Math.min(10, v);
    render();
  });

  document.addEventListener('keydown', function (e) {
    /* Same reset as the close action. They disagreed: Escape left S.camOil
       set, so a brand-new photo opened already carrying the last plate's
       answer to the oil question -- and said so in its own caption. */
    if (e.key === 'Escape' && S.sheet) { S.sheet = null; S.camOil = null; render(); }
  });

  var STATES = [
    ['populated', 'Populated'], ['live', 'Session running'],
    ['first-weeks', 'First two weeks'],
    /* Stack is off by default and its chip does not exist until it is on, so
       without a state that turns the gate on there is no way to reach it --
       not in the demo, and not for the crossing check, which reads every
       declared state looking for the control a crossing names. */
    ['stack-on', 'Stack tracking on'],
    /* The shape of a plate reading, without a photo and without a server.
       It is the only way the worked example is reachable now: it used to
       be what any photo came back as, which put three foods nobody ate
       one tap from the day's log. */
    ['plate', 'A plate, read'],
    ['hidden', 'Numbers hidden'], ['empty', 'Empty'],
    ['loading', 'Loading'], ['error', 'Error']
  ];
  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join(''));
  document.getElementById('dev-toggle').addEventListener('click', function () {
    var open = menu.hidden;
    menu.hidden = !open;
    this.setAttribute('aria-expanded', String(open));
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (!b) return;
    /* stack-on is a gate, not a view: it turns lk_perfTracking on and then
       shows the populated screen, which now carries the Stack chip. */
    if (b.dataset.state === 'stack-on') {
      try { localStorage.setItem('lk_perfTracking', 'true'); } catch (e) {}
      S.state = 'populated';
    } else if (b.dataset.state === 'plate') {
      /* The camera sheet, open, holding the worked example: the shape of
         a reading, reachable without a photo and without a server. */
      S.state = 'populated';
      S.sheet = 'cam';
      S.camState = 'example';
      S.camItems = null;
      S.camWhy = null;
      S.camShot = null;
      DAY = day(); OFTEN = frequent();
      render();
      return;
    } else {
      S.state = b.dataset.state;
    }
    S.sheet = null;
    S.camState = 'idle';
    S.camWhy = null;
    S.camOil = null;
    S.toast = null;
    S.undo = null;
    /* The day is a fixture and every state reads the same one, so anything
       logged, deleted or rescaled in one state was still there in the next --
       switching to Empty after logging a meal showed a day that was not
       empty. A state switch is a fresh screen, so it gets a fresh day. */
    DAY = day();
    OFTEN = frequent();
    render();
  });

  /* Settings owns "Show calorie numbers" and writes it where this screen can
     see it, the same way the theme is shared. It is the DEFAULT here: the
     dev switcher still overrides, because that is what the switcher is for. */
  try {
    if (localStorage.getItem('lk_fuelNumbers') === 'false') S.state = 'hidden';
  } catch (e) {}

  var p = new URLSearchParams(location.search);
  if (p.get('state') && VIEWS[p.get('state')]) S.state = p.get('state');

  /* THE SCREEN MOUNTS ONCE IN THE DEMO. Everything here reads stored data --
     the log, the targets, the weigh-ins, the pantry, the supplement ticks --
     and all of it can be changed on another tab while this one stays in the
     DOM. Coming back re-reads rather than showing the day as it was when the
     router first painted it. */
  function reread() {
    /* Same guard as the read at the top: reread() runs on every entry and
       a null here put it straight back. */
    PROFILE = (function () {
      var pr = stored('lk_profile', null);
      if (pr && typeof pr === 'object' && !Array.isArray(pr)) return pr;
      return (FX.profile && typeof FX.profile === 'object') ? FX.profile : {};
    }());
    FUELLOG = stored('lk_fuelLog', null) || cloneDays(NUT.days || {});
    WEIGHTLOG = stored('lk_weightLog', FX.weightLog || []);
    var own = stored('lk_fuelTargets', null);
    if (own && own.kcal) TARGETS = own;
    TREND_CACHE = null;
    DAY = day();
    OFTEN = frequent();
  }
  document.addEventListener('lk:enter', function () {
    reread();
    adaptiveTick();
    render();
  });

  /* The weekly pass, on the way in. */
  adaptiveTick();
  render();
  requestAnimationFrame(function () { window.__ready = true; });
})();

  /* The strip's clock, on a screen that only repaints when something on it
     changes. Without this the shelf freezes at whatever second you arrived. */
  if (window.LKSession) {
    var shelfWas = null;
    window.setInterval(function () {
      var now = LKSession.html();
      if (now === shelfWas) return;
      shelfWas = now;
      LKPatch(document.getElementById('shelf-slot'), now);
    }, 1000);
  }
</script>
</body>
</html>
