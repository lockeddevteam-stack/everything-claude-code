             is worse: a plan that misses the target is not a plan. */
          /* The last slot of a day closes the gap and nothing else. Variety
             across a week is worth something; a day that lands 600 kcal short
             because the final pick was chosen for novelty is not. */
          var last = si === slotsFor.length - 1;
          var sc = -Math.abs(f.kcal - wantKcal) / 12 - Math.abs(f.pro - wantPro) / 2
                   - (last ? 0 : (tally[k] || 0) * 7);
          if (sc > bestScore) { bestScore = sc; best = k; }
        });
        if (!best) best = pool[0];
        tally[best] = (tally[best] || 0) + 1;
        used = best;
        slots.push(slot(slotsFor[si], best));
        kcal += FOODS[best].kcal;
        pro += FOODS[best].pro;
      }
      out.push({ d: DAY_NAMES[new Date(Date.parse(iso + 'T00:00:00Z')).getUTCDay() === 0 ? 6
                  : new Date(Date.parse(iso + 'T00:00:00Z')).getUTCDay() - 1],
                 iso: iso, slots: slots });
    }
    return out;
  }

  /* The same filter the generator uses, so the sheet can say how much of the
     table is left without running the whole build. */
  function buildPool(avoid) {
    var dw = dietWords();
    return Object.keys(FOODS).filter(function (k) {
      var nm = FOODS[k].name.toLowerCase();
      for (var i = 0; i < dw.length; i++) if (nm.indexOf(dw[i]) >= 0) return false;
      if (!avoid) return true;
      return !avoid.split(/[,;]+/).some(function (w) {
        w = w.trim().toLowerCase();
        return w && nm.indexOf(w) >= 0;
      });
    });
  }

  function savedPlans() { return stored('lk_fuelPlans', []) || []; }
  function writePlans(list) { if (ST && persisting()) ST.set('lk_fuelPlans', list); }

  /* ---------------------------------------------------------------
     Supplements
     ---------------------------------------------------------------

     This was two seeded rows and a tick. The whole area -- the list with its
     streaks, adding, editing, the preset picker, the dose and frequency and
     time-of-day controls, the per-supplement reminder, the history screen and
     a two-tap delete -- did not exist, and lk_suppLog was never written, so a
     tick was a tick and nothing counted it.

     TWO KEYS, TWO JOBS. lk_supplements is what is on the shelf. lk_suppLog is
     what went down on which day, keyed by date. A streak is read from the
     second, never stored, so it cannot drift from the ticks that made it. */
  var SUPP_TIMES = ['Morning', 'Pre-Workout', 'With Food', 'Before Bed', 'Custom'];
  var SUPP_FREQ = ['Daily', 'Every Other Day', 'Weekly'];
  /* Common enough to be worth one tap, and short enough to scan. Names only:
     a preset that carried a dose would be this app telling somebody how much
     to take, which it is not qualified to do. */
  var PRESET_SUPPS = [
    'Creatine', 'Vitamin D', 'Omega-3', 'Magnesium', 'Zinc', 'Whey protein',
    'Caffeine', 'Beta-alanine', 'Vitamin B12', 'Iron', 'Ashwagandha',
    'Electrolytes', 'Collagen', 'Multivitamin', 'Citrulline'
  ];

  function supps() { return stored('lk_supplements', []) || []; }
  function writeSupps(list) {
    if (ST && persisting()) ST.set('lk_supplements', list);
  }
  function suppLog() { return stored('lk_suppLog', {}) || {}; }
  function writeSuppLog(map) {
    if (ST && persisting()) ST.set('lk_suppLog', map);
  }
  function tookToday(name) {
    return (suppLog()[DAY.iso] || []).indexOf(name) >= 0;
  }
  function markSupp(name, on) {
    var map = suppLog();
    var day = (map[DAY.iso] || []).slice();
    var at = day.indexOf(name);
    if (on && at < 0) day.push(name);
    if (!on && at >= 0) day.splice(at, 1);
    if (day.length) map[DAY.iso] = day; else delete map[DAY.iso];
    writeSuppLog(map);
  }

  function isoBack(n) {
    return new Date(Date.parse(DAY.iso + 'T00:00:00Z') - n * 86400000)
      .toISOString().slice(0, 10);
  }

  /* Consecutive days back from today, counting today only if it is already
     ticked: at eight in the morning a streak of six should not read as broken
     because the day is not finished. */
  function suppStreak(name) {
    var map = suppLog();
    var i = (map[DAY.iso] || []).indexOf(name) >= 0 ? 0 : 1;
    var run = 0;
    while (i < 400) {
      if ((map[isoBack(i)] || []).indexOf(name) >= 0) run++;
      else break;
      i++;
    }
    return run;
  }

  function suppLast14(name) {
    var map = suppLog(), out = [];
    for (var i = 13; i >= 0; i--) {
      var iso = isoBack(i);
      out.push({ iso: iso, on: (map[iso] || []).indexOf(name) >= 0 });
    }
    return out;
  }

  /* Due, by the clock and by the frequency. Every Other Day counts days since
     it was added rather than the parity of the epoch, so two supplements added
     a day apart alternate with each other instead of both landing on the same
     days. */
  function suppDue(sp) {
    if (sp.reminder === false) return false;
    if (tookToday(sp.name)) return false;
    var since = sp.created
      ? Math.round((Date.parse(DAY.iso + 'T00:00:00Z') - Date.parse(sp.created)) / 86400000)
      : 0;
    if (sp.freq === 'Every Other Day' && since % 2 !== 0) return false;
    if (sp.freq === 'Weekly') {
      var dow = new Date(Date.parse(DAY.iso + 'T00:00:00Z')).getUTCDay();
      var madeDow = sp.created ? new Date(Date.parse(sp.created)).getUTCDay() : 1;
      if (dow !== madeDow) return false;
    }
    var h = new Date().getHours();
    if (sp.timeOf === 'Morning') return h >= 5 && h < 12;
    if (sp.timeOf === 'Pre-Workout') return h >= 12 && h < 18;
    if (sp.timeOf === 'With Food') return h >= 11 && h < 14;
    if (sp.timeOf === 'Before Bed') return h >= 19;
    return true;                        /* a custom time is always due */
  }

  var TIME_TONE = {
    'Morning': 'id-3', 'Pre-Workout': 'id-2', 'With Food': 'id-1', 'Before Bed': 'id-4'
  };
  function timeTone(t) { return TIME_TONE[t] || 'text-tertiary'; }

  /* ---------------------------------------------------------------
     Things you keep
     --------------------------------------------------------------- */

  /* A favourite is a food you keep coming back to that the frequency list
     might not surface: the frequency list is a fact about the past, and a
     favourite is a decision about the future. They sit above it. */
  function favourites() { return stored('lk_fuelFavourites', []) || []; }
  function isFav(key) { return favourites().indexOf(key) >= 0; }
  function toggleFav(key) {
    var f = favourites().slice();
    var i = f.indexOf(key);
    if (i >= 0) f.splice(i, 1); else f.push(key);
    if (ST && persisting()) ST.set('lk_fuelFavourites', f);
    return i < 0;
  }

  /* Your store: a food at the amount you actually buy it in. The food table
     has one serving per row and your tub is 170 g, so every log of it was a
     correction. Saved here it is one tap, at your weight, forever. */
  /* ---------------------------------------------------------------
     YOUR FOODS. The local food store.

     Everything this screen could identify -- a barcode that resolved, a
     product whose label you typed in -- was used once and thrown away. The
     same scan went through the same lookup tomorrow, and a code that came
     back not found came back not found forever, however many times you had
     told the app what was in the packet.

     So lk_myFoods holds two kinds of row and both are findable by name:

       a food from the table at a weight you buy it in
         { id, key, g, name }
       a product, with its own figures and its own barcode
         { id, name, code, g, per100: { kcal, pro, carb, fat, ... }, src }

     The second kind is frozen: it keeps the figures it was saved with, so a
     product saved in March still logs what the packet said in March.
     --------------------------------------------------------------- */
  function myStore() { return stored('lk_myFoods', []) || []; }
  function writeStore(list) { if (ST && persisting()) ST.set('lk_myFoods', list); }
  function saveToStore(key, grams, name) {
    var f = FOODS[key];
    if (!f) return false;
    var list = myStore().slice();
    var nm = name || (f.name + ', ' + n(grams) + ' g');
    /* BY NAME. Keeping the same food at 150 g and at 151 g put two rows in
       the store that read the same to anybody looking at it; the amount is
       what a kept food IS, so a second keep of the same name replaces the
       first rather than sitting under it. */
    for (var i = 0; i < list.length; i++) {
      if (sameItem(list[i].name, nm)) {
        if (list[i].g === grams) return false;
        list[i] = { id: list[i].id, key: key, g: grams, name: nm };
        writeStore(list);
        return true;
      }
    }
    list.push({ id: 'mf_' + Date.now(), key: key, g: grams, name: nm });
    writeStore(list);
    return true;
  }

  /* A product, kept. Saved by barcode where there is one and by name where
     there is not, so scanning the same tub twice does not fill the store with
     copies of it, and so the numbers can be corrected rather than duplicated. */
  function saveProduct(prod) {
    if (!prod || !prod.name || !prod.per100 || !(prod.per100.kcal > 0)) return null;
    var list = myStore().slice();
    var at = -1;
    for (var i = 0; i < list.length; i++) {
      var x = list[i];
      if (x.per100 && ((prod.code && x.code === prod.code) ||
          (!prod.code && sameItem(x.name, prod.name)))) { at = i; break; }
    }
    var rec = { id: at >= 0 ? list[at].id : 'mf_' + Date.now(),
                name: String(prod.name).slice(0, 60), code: prod.code || null,
                g: prod.g || 100, serving: prod.serving || null,
                per100: prod.per100, src: prod.src || 'estimate',
                icon: prod.icon || '\ud83d\udce6', savedAt: DAY.iso };
    if (at >= 0) list[at] = rec; else list.push(rec);
    writeStore(list);
    return rec;
  }
  /* A row of figures for a portion, expressed per 100 g, which is the only
     shape a store can scale from. */
  function per100Of(f, grams) {
    var g = grams || 100;
    var k = 100 / g;
    var out = { kcal: Math.round(f.kcal * k), pro: Math.round(f.pro * k * 10) / 10,
                carb: Math.round(f.carb * k * 10) / 10, fat: Math.round(f.fat * k * 10) / 10 };
    MICROS.forEach(function (mi) {
      if (typeof f[mi.key] === 'number') out[mi.key] = Math.round(f[mi.key] * k * 10) / 10;
    });
    return out;
  }
  function storeAmount(x) {
    return x.serving ? x.serving : n(x.g) + ' g';
  }
  function productByCode(code) {
    var d = String(code || '').replace(/\D/g, '');
    var hit = null;
    myStore().forEach(function (x) { if (x.per100 && x.code === d) hit = x; });
    return hit;
  }
  function dropFromStore(id) {
    writeStore(myStore().filter(function (x) { return x.id !== id; }));
  }

  /* A store row's figures at the weight it is kept in. Both kinds go through
     here, so a kept food and a kept product are logged by one writer. */
  function storeAt(entry, grams) {
    var g = grams === undefined ? entry.g : grams;
    if (entry.per100) {
      var k = g / 100;
      var out = { icon: entry.icon || '\ud83d\udce6', name: entry.name,
                  kcal: Math.round(entry.per100.kcal * k),
                  pro: Math.round(entry.per100.pro * k * 10) / 10,
                  carb: Math.round(entry.per100.carb * k * 10) / 10,
                  fat: Math.round(entry.per100.fat * k * 10) / 10,
                  src: entry.src === 'verified' ? 'verified' : 'estimate' };
      MICROS.forEach(function (mi) {
        if (typeof entry.per100[mi.key] === 'number') {
          out[mi.key] = Math.round(entry.per100[mi.key] * k * 10) / 10;
        }
      });
      return out;
    }
    var f = FOODS[entry.key];
    if (!f) return null;
    var kk = g / f.g;
    var meal = { key: entry.key, icon: f.icon, name: entry.name,
                 kcal: Math.round(f.kcal * kk), pro: Math.round(f.pro * kk * 10) / 10,
                 carb: Math.round(f.carb * kk * 10) / 10, fat: Math.round(f.fat * kk * 10) / 10,
                 src: 'table' };
    MICROS.forEach(function (mi) {
      if (typeof f[mi.key] === 'number') meal[mi.key] = Math.round(f[mi.key] * kk * 10) / 10;
    });
    return meal;
  }
  function storeMeal(entry) {
    var m = storeAt(entry);
    if (!m) return null;
    m.slot = S.logSlot || slotForNow();
    return m;
  }

  function savePlan() {
    if (!ST || !persisting()) return;
    ST.set('lk_fuelPlan', PLAN.map(function (d) {
      return { d: d.d, iso: d.iso, slots: d.slots.map(function (sl) {
        return { key: sl.key, at: sl.at };
      }) };
    }));
  }

  /* What a meal can be swapped for: the food table and your own recipes at
     one serving. Nothing is generated, which is the point -- the shipped
     app's swap invented four meals when the model call failed and wrote them
     into the saved plan as though they had come back from it. */
  function swapChoices(exceptKey) {
    return searchable().filter(function (f) {
      return f.key && f.key !== exceptKey;
    });
  }

  /* A past day is logged from the record; today is logged from what is on
     the list right now. */
  function slotDone(pd, sl) {
    if (pd.iso === DAY.iso) {
      return DAY.meals.some(function (m) { return m.name === sl.name; });
    }
    var rec = NUT.days && NUT.days[pd.iso];
    if (!rec) return false;
    return rec.meals.some(function (m) { return m.name === sl.name; });
  }

  /* What the scanner resolved. One product, because a fixture that changes
     per run makes a screenshot diff meaningless. */
  /* Three barcodes resolve, and three is the honest number: a barcode is a
     lookup into a database of millions and this build carries a table of
     eight. That is exactly why the sheet needs a not-found branch and a way
     to enter the label by hand -- without one, a scanner that only ever
     succeeds is a demonstration rather than a tool. */
  var BARCODES = NUT.barcodes || {};
  function lookupCode(code) {
    var d = String(code).replace(/\D/g, '');
    /* YOUR OWN FIRST. A code you have already told this app about resolves
       from your own store, which is the whole point of keeping it: the second
       scan of the same tub is a hit, not the same dead end. */
    var mine = productByCode(d);
    if (mine) {
      var pm = mine.per100, k100 = (mine.g || 100) / 100;
      return { key: null, storeId: mine.id, icon: mine.icon || '\ud83d\udce6', name: mine.name,
               code: d, mine: true, src: mine.src,
               serving: n(mine.g || 100) + ' g',
               kcal: Math.round(pm.kcal * k100), pro: Math.round(pm.pro * k100 * 10) / 10,
               carb: Math.round(pm.carb * k100 * 10) / 10,
               fat: Math.round(pm.fat * k100 * 10) / 10,
               fibre: pm.fibre === undefined ? undefined : Math.round(pm.fibre * k100 * 10) / 10,
               sugar: pm.sugar === undefined ? undefined : Math.round(pm.sugar * k100 * 10) / 10,
               satfat: pm.satfat === undefined ? undefined : Math.round(pm.satfat * k100 * 10) / 10,
               sodium: pm.sodium === undefined ? undefined : Math.round(pm.sodium * k100 * 10) / 10 };
    }
    var k = BARCODES[d];
    if (!k || !FOODS[k]) return null;
    var f = FOODS[k];
    return { key: k, icon: f.icon, name: f.name, code: code,
             serving: n(f.g) + ' g', kcal: f.kcal, pro: f.pro, carb: f.carb, fat: f.fat,
             fibre: f.fibre, sugar: f.sugar, satfat: f.satfat, sodium: f.sodium };
  }
  /* Grouped the way it is printed on the packet. An EAN-13 reads 5 060123
     456789, not four-digit blocks counted from the right -- a code somebody
     is checking against a label has to look like the label. */
  function prettyCode(code) {
    var d = String(code).replace(/\D/g, '');
    if (d.length === 13) return d.slice(0, 1) + ' ' + d.slice(1, 7) + ' ' + d.slice(7);
    if (d.length === 12) return d.slice(0, 1) + ' ' + d.slice(1, 6) + ' ' + d.slice(6, 11) + ' ' + d.slice(11);
    if (d.length === 8) return d.slice(0, 4) + ' ' + d.slice(4);
    return d.replace(/(.)(?=(.{4})+$)/g, '$1 ');
  }

  /* lk_perfTracking, the switch that makes Stack exist. Read rather than
     cached, so turning it on in Settings and coming back shows the chip. */
  function perfTracking() {
    try { return localStorage.getItem('lk_perfTracking') === 'true'; } catch (e) { return false; }
  }

  var S = { state: 'populated', sheet: null, listening: false, scanServings: 1,
            /* Log or Meals, remembered between visits rather than reset to
               Log every time the tab is opened. */
            view: null,
            /* The camera sheet's one question. null until it is answered. */
            camOil: null, toast: null, undo: null, targetError: null, searchQ: '',
            remote: null, remoteQ: '', remoteBusy: false,
            camState: 'idle', camWhy: null,
            brAsking: false, brWhy: null,
            micBusy: false, micWhy: null,
            /* Which recipe is open inside the recipes sheet. The list and the
               detail are one sheet with two faces rather than two sheets, so
               Back returns to the list without closing and losing the place. */
            recipeOpen: null,
            /* The supplements sheet has three faces: the list, the add or edit
               form, and one supplement's history. Null means the list. */
            suppForm: null, suppHist: null, suppDel: null };

  /* The same strip Home shows, from the same facts. It is here because
     eating during or straight after a session is exactly when somebody
     leaves the workout screen, and losing the way back is what turns one
     logged meal into an abandoned session. */
  /* The shelf comes from the live session record, not from this screen.
     It used to be hand-written markup gated on a dev state, which meant it
     showed a fixed "Push A, 4 of 7, 38:12" whether or not a workout was
     running, and never showed a real one. The dev state is kept: it seeds a
     session so the demo can show the strip without anybody training. */
  function shelfHTML() {
    return window.LKSession && LKSession.get() ? LKSession.html() : '';
  }

  /* The demo's own "live" state, seeded into the record so the shelf on
     every other screen agrees with this one. */
  function seedDemoSession(on) {
    if (!window.LKSession) return;
    var live = LKSession.get();
    if (on && !live) LKSession.start({ name: 'Push A', startedAt: Date.now() - 2292000, done: 4, total: 7 });
    else if (!on && live && live.name === 'Push A') LKSession.end();
  }

  /* ---------------------------------------------------------------
     Header
     --------------------------------------------------------------- */
  function headerHTML() {
    return '' +
      '<div class="hdr__title stack stack--1">' +
        '<span class="t-meta">' + esc(DAY.date) + '</span>' +
        '<h1 class="hdr__title-large" data-title-large>Fuel</h1>' +
      '</div>' +
      '<span class="hdr__title-small" data-title-small aria-hidden="true">Fuel</span>' +
      /* One header action, the way every other screen has one. Two text
         buttons side by side in a header have no gap between their hit areas,
         so the audit is right to reject them and a thumb would be too. Shop
         is reachable from the More chip and from the plan sheet, which is
         where somebody is when they want it. */
      '<button class="hdr__action" type="button" data-action="fuel-profile" ' +
        'data-testid="hdr-profile">Profile</button>';
  }

  /* ---------------------------------------------------------------
     The hero, and the three ways it can read

     populated   the number left, and what it is left of
     first-weeks a day counter, because the target is still a formula
     hidden      a word, because the number is the thing being hidden
     --------------------------------------------------------------- */
  function hero() {
    /* An empty day has eaten nothing, whatever the fixture says. The fixture
       is shared across the dev states, so the empty state was printing the
       populated day's "1,410 kcal left of 2,980" directly above the words
       "Nothing logged today". */
    var eaten = S.state === 'empty' ? 0 : DAY.eaten;
    var left = DAY.target - eaten;

    /* NO TARGET YET. A new account has no profile to compute one from and
       nothing stored, so every figure here read NaN. The hero shows what was
       eaten -- which is a real number -- and asks for the one thing it needs
       to say anything else. */
    if (!hasTargets()) {
      return '<div class="fuel-hero" data-testid="hero">' +
        '<div class="stack stack--1">' +
          '<p class="fuel-hero__num num" data-testid="hero-value">' + n(eaten) + '</p>' +
          '<p class="t-footnote quiet">kcal today. No target set yet.</p>' +
          '<button class="btn btn--secondary btn--sm mt-3" type="button" data-action="fuel-profile" ' +
            'data-testid="hero-set-target"><span class="btn__label">Set your target</span></button>' +
        '</div></div>';
    }

    if (S.state === 'hidden') {
      return '<div class="fuel-hero" data-testid="hero">' +
        '<div class="stack stack--1">' +
          '<p class="t-title-1" data-testid="hero-value">On track</p>' +
          '<p class="t-footnote quiet">Protein is ahead of pace and the day has room left. ' +
            'Numbers are off in Settings.</p>' +
        '</div></div>';
    }

    if (S.state === 'first-weeks') {
      return '<div class="fuel-hero" data-testid="hero">' +
        '<div class="stack stack--1">' +
          '<p class="t-meta">DAY 3 OF 14</p>' +
          '<p class="fuel-hero__num num" data-testid="hero-value">' + n(Math.abs(left)) + '</p>' +
          '<p class="t-footnote quiet">' + (left < 0 ? 'kcal over ' : 'kcal left of ') +
            n(DAY.target) + ' &middot; ' +
            'the target you set. Nothing has been read off your own trend yet: that needs two ' +
            'weeks of weigh-ins against two weeks of logs.</p>' +
        '</div></div>';
    }

    /* Past the target the figure is what you are over BY, not a negative
       amount remaining. "-210 kcal left" is not a sentence anybody says, and
       a minus sign in front of the biggest number on the screen reads as a
       fault rather than as a fact about lunch. */
    var over = left < 0;
    return '<div class="fuel-hero" data-testid="hero">' +
      '<div class="stack stack--1 grow">' +
        '<p class="fuel-hero__num num" data-testid="hero-value">' + n(Math.abs(left)) + '</p>' +
        '<p class="t-footnote quiet">' + (over ? 'kcal over ' : 'kcal left of ') +
          n(DAY.target) + ' &middot; ' + esc(DAY.goal) + '</p>' +
      '</div>' +
      '<div class="fuel-hero__side stack stack--1">' +
        '<p class="t-subheadline num">' + wtTxt(DAY.weightKg) + '</p>' +
        (DAY.rate
          ? '<p class="t-caption-2 quiet" data-testid="hero-rate">' + signed(DAY.rate.pct) +
              '% / wk, ' + esc(rateVerdict(DAY.rate.pct, DAY.goalKey)) + '</p>'
          : '<p class="t-caption-2 quiet" data-testid="hero-rate">No rate yet &middot; needs two weigh-ins five days apart</p>') +
      '</div></div>';
  }

  /* The one accent on the screen, holding both fast paths. Two buttons rather
     than one with a mode, because a mode is a thing to get wrong; one control
     because voice and camera are the same job done two ways. */
  function logAction() {
    return '<div class="fuel-log" role="group" aria-label="Log what you ate">' +
      '<button class="fuel-log__half" type="button" data-action="scan" data-testid="log-scan">' +
        ICO.barcode + '<span class="btn__label">Scan</span></button>' +
      '<button class="fuel-log__half" type="button" data-action="mic" data-testid="log-mic">' +
        ICO.mic + '<span class="t-headline">Say it</span>' +
      '</button>' +
      '<button class="fuel-log__half" type="button" data-action="cam" data-testid="log-cam">' +
        ICO.cam + '<span class="t-headline">Snap it</span>' +
      '</button>' +
    '</div>' +
    /* The fourth way, and the ordinary one. Scan, Say it and Snap it each
       need the food to be in front of you; a person eating something new,
       remembered, or already eaten had nowhere to put it. A DOM sweep of
       this screen for a search field returned nothing -- every search box in
       the build belonged to an exercise picker. */
    '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="search" ' +
      'data-testid="log-search"><span class="btn__label">Search foods</span></button>' +
    '<p class="t-caption-1 quiet fuel-log__hint">Search by name, say what you ate, or snap the plate.</p>';
  }

  /* Everything this build can log by name, in one list: the food table the
     rest of the screen logs from, plus your own recipes at one serving. It is
     a demo food table, not a database, and the sheet says so rather than
     implying a search that reaches further than it does. */
  function searchable() {
    var out = [];
    Object.keys(FOODS).forEach(function (k) {
      var f = FOODS[k];
      out.push({ key: k, icon: f.icon, name: f.name, kcal: f.kcal, pro: f.pro,
                 carb: f.carb, fat: f.fat, g: f.g, fibre: f.fibre, sugar: f.sugar,
                 satfat: f.satfat, sodium: f.sodium, from: 'Food table', src: 'table' });
    });
    allRecipes().forEach(function (r, i) {
      out.push({ recipe: i, icon: r.icon, name: r.name + ', one serving',
                 kcal: Math.round(r.kcal / r.servings), pro: Math.round(r.pro / r.servings),
                 carb: Math.round(r.carb / r.servings), fat: Math.round(r.fat / r.servings),
                 from: 'Your recipes', src: 'recipe' });
    });
    /* AND YOUR OWN FOODS. A product that was scanned or whose label was typed
       in is in the same list as everything else, by name, so the second time
       you eat it you do not have to find the packet again. */
    myStore().forEach(function (x) {
      var m = storeAt(x);
      if (!m) return;
      /* A kept product whose name is already a row of the table is not a
         second food. Scanning the skyr keeps it so the CODE resolves next
         time; listing it again under the identical name would put two rows
         reading "Skyr, plain" in front of somebody searching for skyr. */
      var dupe = false;
      Object.keys(FOODS).forEach(function (k) { if (sameItem(FOODS[k].name, x.name)) dupe = true; });
      if (dupe) return;
      out.push({ storeId: x.id, icon: m.icon, name: x.name, g: x.g,
                 kcal: m.kcal, pro: m.pro, carb: m.carb, fat: m.fat,
                 fibre: m.fibre, sugar: m.sugar, satfat: m.satfat, sodium: m.sodium,
                 key: x.key || null,
                 from: x.per100 ? (x.src === 'verified' ? 'Your foods, scanned' : 'Your foods')
                                : 'Your foods',
                 src: m.src });
    });
    return out;
  }

  /* Everything of yours that can be an ingredient: the food table, and the
     store of foods you have saved at your own weights, which is where a
     scanned product ends up. Ranked by the same rule the food search uses. */
  function ingHits(q) {
    var qq = String(q || '').trim().toLowerCase();
    var out = [];
    Object.keys(FOODS).forEach(function (k) {
      var f = FOODS[k];
      out.push({ key: k, icon: f.icon, name: f.name, g: f.g, kcal: f.kcal,
                 from: f.code ? 'Scanned' : 'Food table' });
    });
    myStore().forEach(function (x) {
      var f = FOODS[x.key];
      if (!f) return;
      out.push({ key: x.key, icon: f.icon, name: x.name, g: x.g,
                 kcal: Math.round(f.kcal / f.g * x.g), from: 'Your store' });
    });
    var seen = {};
    return out.map(function (h) { return { h: h, s: rank({ name: h.name, key: h.key }, qq) }; })
      .filter(function (e) { return e.s >= 0; })
      .sort(function (a, b) { return b.s - a.s || (a.h.name < b.h.name ? -1 : 1); })
      .map(function (e) { return e.h; })
      .filter(function (h) {
        var id = h.key + '@' + h.g;
        if (seen[id]) return false;
        seen[id] = 1; return true;
      })
      .slice(0, 6);
  }

  /* How often a food has been logged, which is the one ranking signal this
     app actually has. A food database ranks by how many people ate a thing;
     this one can only rank by how often YOU did, and that is the better
     signal anyway for a list of eight. */
  function logCount(key) {
    var nn = 0;
    Object.keys(FUELLOG).forEach(function (iso) {
      ((FUELLOG[iso] || {}).meals || []).forEach(function (m) { if (m.key === key) nn++; });
    });
    return nn;
  }

  /* Specific beats generic, and what you eat beats what you do not. A query
     that matches the start of a name outranks one that matches the middle, a
     whole-word match outranks a fragment, a shorter name outranks a longer
     one carrying the same word, and anything you have logged is lifted by how
     often. The list used to come back in table order whatever was typed, so
     "chicken" put Chicken rice bowl above Chicken and rice for no reason at
     all and the ordering carried no information. */
  function rank(f, q) {
    if (!q) return logCount(f.key) * 2;
    var nm = f.name.toLowerCase();
    var at = nm.indexOf(q);
    if (at < 0) return -1;
    var sc = 20;
    if (at === 0) sc += 30;
    else if (' ,'.indexOf(nm.charAt(at - 1)) >= 0) sc += 18;
    if (nm.length === q.length) sc += 25;
    sc -= Math.min(15, Math.round((nm.length - q.length) / 3));
    sc += Math.min(20, logCount(f.key) * 3);
    if (f.recipe !== undefined) sc += 4;   /* your own recipe, over a table row */
    return sc;
  }

  /* WHAT THE SERVER FOUND, ALONGSIDE WHAT THIS DEVICE KNOWS. The local
     table is a few dozen foods; a person eats things that are not in it.
     Remote rows are appended rather than merged in by score, so the
     foods somebody keeps and their own recipes stay at the top -- the
     thing they logged yesterday should not be pushed under a brand.

     A name already in the local set is dropped from the remote one: two
     rows reading "Chicken breast" with different numbers is worse than
     either row on its own. */
  function remoteHits(q) {
    if (!q || !S.remote || S.remoteQ !== q) return [];
    var seen = {};
    searchable().forEach(function (f) { seen[String(f.name).toLowerCase()] = 1; });
    return S.remote.filter(function (f) {
      var k = String(f.name).toLowerCase();
      if (seen[k]) return false;
      seen[k] = 1;
      return true;
    }).map(function (f) {
      var c = {};
      Object.keys(f).forEach(function (k) { c[k] = f[k]; });
      c.icon = c.icon || '\u{1F37D}\u{FE0F}';
      return c;
    });
  }

  function searchHits(q) {
    var local = searchable().map(function (f) { return { f: f, s: rank(f, q) }; })
      .filter(function (e) { return e.s >= 0; })
      .sort(function (a, b) { return b.s - a.s || (a.f.name < b.f.name ? -1 : 1); })
      .map(function (e, i) { e.f.best = i === 0 && !!q; return e.f; });
    return local.concat(remoteHits(q));
  }

  /* Asked for once per pause in the typing, not once per keystroke. The
     answer is kept against the query it answered, so a slow reply for
     "chi" never paints itself under "chicken". */
  var remoteT = null;
  function askServer(q) {
    if (!(window.LKCloud && LKCloud.ready() && LKCloud.foodSearch)) return;
    var term = String(q || '').trim();
    clearTimeout(remoteT);
    if (term.length < 2) { S.remote = null; S.remoteQ = ''; S.remoteBusy = false; return; }
    if (S.remoteQ === term.toLowerCase()) return;
    S.remoteBusy = true;
    remoteT = setTimeout(function () {
      LKCloud.foodSearch(term).then(function (r) {
        S.remoteBusy = false;
        if (!r || !r.ok) { S.remote = null; return; }
        S.remote = r.data;
        S.remoteQ = term.toLowerCase();
        if (S.sheet === 'search') {
          render();
          var f2 = document.getElementById('fs-q');
          if (f2) { f2.focus(); try { f2.setSelectionRange(f2.value.length, f2.value.length); } catch (e) {} }
        }
      });
    }, 320);
  }

  /* ---------------------------------------------------------------
     Reading a sentence
     --------------------------------------------------------------- */

  /* "2 eggs and toast with a whey shake" -> two eggs and one shake.

     It matches BEFORE it splits, and that ordering is the whole design. The
     first version split on "and" and then matched each piece, which broke
     "chicken and rice" into two pieces that matched nothing, and turned
     "2 eggs and toast" into two separate meals because "toast" matches the
     eggs row on its own. Splitting a sentence into pieces destroys the
     phrases the foods are actually named by.

     So: find the longest alias anywhere in the text, claim that span, read
     the quantity and unit sitting immediately in front of it, and repeat on
     what is left. Whatever is never claimed and is not a joining word is
     reported as unmatched rather than dropped, so the preview accounts for
     the whole sentence and not just the half the parser understood. */
  var UNIT_G = NUT.unitG || {};
  var NUMWORD = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5,
                  six: 6, seven: 7, eight: 8, nine: 9, ten: 10,
                  half: 0.5, couple: 2, dozen: 12 };
  var ARTICLE = { a: 1, an: 1 };
  var JOINER = { and: 1, with: 1, plus: 1, then: 1, of: 1, some: 1,
                 the: 1, i: 1, had: 1, ate: 1, for: 1, my: 1, '': 1 };

  function aliasList() {
    var out = [];
    Object.keys(FOODS).forEach(function (k) {
      var f = FOODS[k];
      [f.name.toLowerCase()].concat(f.alias || []).forEach(function (a) {
        out.push({ key: k, a: a });
      });
    });
    /* Longest first, so "chicken and rice" is claimed before "rice" and
       "whey shake" before "shake". */
    return out.sort(function (x, y) { return y.a.length - x.a.length; });
  }

  function parseMeal(text) {
    var raw = String(text || '').toLowerCase().replace(/[.!?]/g, ' ');
    var claimed = [];                 /* [start, end) spans already taken */
    var found = [];
    var taken = function (i, j) {
      for (var c = 0; c < claimed.length; c++) {
        if (i < claimed[c][1] && j > claimed[c][0]) return true;
      }
      return false;
    };
    aliasList().forEach(function (e) {
      var from = 0, at;
      while ((at = raw.indexOf(e.a, from)) >= 0) {
        var end = at + e.a.length;
        /* Whole words only: "rice" must not match inside "priced". A plain
           plural counts as the same word -- "3 whey shakes" claimed "whey"
           and then reported "shakes" as something it could not recognise. */
        if (raw.charAt(end) === 's' && /[^a-z]|^$/.test(raw.charAt(end + 1) || ' ')) end += 1;
        var beforeOk = at === 0 || /[^a-z]/.test(raw.charAt(at - 1));
        var afterOk = end >= raw.length || /[^a-z]/.test(raw.charAt(end));
        /* "A BOWL OF OATS" IS NOT A BOWL. A few words are both a food's
           name and a thing you serve food in -- bowl, plate, portion --
           and the alias won, so asking for a bowl of oats logged the
           chicken rice bowl. Followed by "of", such a word is the
           container and whatever comes after it is the food; readQty
           picks it up as the unit on the next pass. */
        var tail = raw.slice(end).replace(/^\s+/, '');
        var containerOf = UNIT_G[e.a] !== undefined && /^of\b/.test(tail);
        if (beforeOk && afterOk && !taken(at, end) && !containerOf) {
          claimed.push([at, end]);
          found.push({ key: e.key, alias: e.a, at: at, end: end });
        }
        from = at + 1;
      }
    });
    found.sort(function (x, y) { return x.at - y.at; });

    /* The quantity and unit are whatever sits between the end of the last
       claimed span and the start of this one. */
    var items = [], cursor = 0;
    found.forEach(function (f) {
      var lead = raw.slice(cursor, f.at);
      var q = readQty(lead);
      items.push(matchFood(f.key, q.qty, q.unit, raw.slice(f.at, f.end), f.alias));
      leftoverWords(q.rest, items);
      cursor = f.end;
    });
    leftover(raw.slice(cursor), items);
    return items;
  }

  /* The number and unit in front of a food. "2", "200 g", "a couple of",
     "half a" -- and nothing, which means one serving.

     Read token by token, keeping the words it did not use. It used to return
     the one token it consumed and the caller cut that substring out of the
     lead with a string replace, so "half a chilli" took the 'a' out of the
     middle of "half" and reported eating an "h lf" -- while logging a whole
     serving, because it had read the article rather than the half. */
  function readQty(lead) {
    var qty = null, unit = null;
    var toks = String(lead || '').split(/[^a-z0-9.]+/).filter(Boolean);
    var used = {};
    for (var i = toks.length - 1; i >= 0; i--) {
      var t = toks[i];
      if (UNIT_G[t] !== undefined && unit === null) { unit = t; used[i] = 1; continue; }
      if (/^[0-9]+(\.[0-9]+)?$/.test(t)) { qty = parseFloat(t); used[i] = 1; break; }
      /* An article is a quantity only when nothing better follows it. "half a"
         means a half, not a one. */
      if (ARTICLE[t]) {
        var prev = i > 0 ? toks[i - 1] : null;
        if (prev && NUMWORD[prev] !== undefined) { used[i] = 1; continue; }
        qty = 1; used[i] = 1; break;
      }
      if (NUMWORD[t] !== undefined) { qty = NUMWORD[t]; used[i] = 1; break; }
      if (JOINER[t]) { used[i] = 1; continue; }
      break;                          /* a real word: not part of the quantity */
    }
    var rest = [];
    for (var j = 0; j < toks.length; j++) if (!used[j]) rest.push(toks[j]);
    return { qty: qty === null ? 1 : qty, counted: qty !== null, unit: unit, rest: rest };
  }

  /* Words nobody claimed. Joining words and bare numbers are not reported as
     unrecognised food, because "and" is not a thing somebody ate. */
  function keepWords(words) {
    return words.filter(function (w) {
      return !JOINER[w] && !ARTICLE[w] && NUMWORD[w] === undefined &&
             UNIT_G[w] === undefined && !/^[0-9.]+$/.test(w);
    });
  }
  /* ONE ROW PER FOOD, EVEN WHEN NONE OF THEM IS KNOWN. Anything the table
     did not claim was joined into a single row, so "200 g chicken and
     100 g rice" became one unrecognised item called "chicken rice" -- and
     the lookup that could have priced each of them separately was asked
     one question about a thing that does not exist. Three foods in a
     sentence became one row of nonsense.

     The sentence is split on the words that separate foods: "and", "plus",
     "with", "then", and a comma, which the caller has already turned into
     a space. Each piece keeps its own quantity and unit, so "200 g
     chicken" stays 200 g of chicken. */
  var SPLITTER = { and: 1, plus: 1, then: 1, with: 1 };

  function pushLeftover(words, items) {
    var w = keepWords(words || []);
    if (!w.length) return;
    var q = readQty(w.slice(0, -1).join(' '));
    var name = w.join(' ');
    items.push({ raw: name, name: name, qty: 1, unit: null, key: null });
  }

  function leftoverWords(words, items) {
    var all = (words || []).filter(Boolean);
    if (!all.length) return;
    var run = [];
    all.forEach(function (t) {
      if (SPLITTER[t]) { pushLeftover(run, items); run = []; return; }
      run.push(t);
    });
    pushLeftover(run, items);
  }

  function leftover(text, items) {
    /* Commas separate foods as surely as "and" does, so they become the
       same boundary rather than being wiped out with the punctuation. */
    var t = String(text || '').replace(/[,;]/g, ' and ')
                              .replace(/[^a-z0-9 ]/g, ' ').trim();
    if (!t) return;
    leftoverWords(t.split(/\s+/), items);
  }

  function matchFood(key, qty, unit, raw, alias) {
    var f = FOODS[key];
    var note = null;
    /* A COUNT OF A PART IS NOT A COUNT OF THE DISH. "2 eggs" matched the
       "Eggs, toast, butter" entry and doubled it -- 1,080 kcal and 76 g of
       protein for two eggs. The table holds one figure for the dish and none
       for a single egg, so the count is not something this can price. One
       serving is logged and the row says why, rather than a number nobody
       can stand behind. */
    var parts = f.parts || [];
    if (!unit && alias && parts.indexOf(alias) >= 0 && qty !== 1) {
      note = 'Counted as one serving of ' + f.name + '. The table has no figure for a single ' +
             alias.replace(/s$/, '') + '.';
      qty = 1;
    }
    /* Grams, three ways: a weight unit converts, a serving-shaped unit means
       the food's own serving, and a bare count means that many servings. */
    var grams = (unit && UNIT_G[unit] > 0) ? qty * UNIT_G[unit] : qty * f.g;
    var k = grams / f.g;
    var item = { raw: raw, name: f.name, qty: qty, unit: unit, key: key, note: note,
                 grams: Math.round(grams), icon: f.icon,
                 kcal: Math.round(f.kcal * k), pro: Math.round(f.pro * k * 10) / 10,
                 carb: Math.round(f.carb * k * 10) / 10, fat: Math.round(f.fat * k * 10) / 10 };
    MICROS.forEach(function (mi) {
      if (typeof f[mi.key] === 'number') item[mi.key] = Math.round(f[mi.key] * k * 10) / 10;
    });
    return item;
  }

  /* BARS, NOT A RING, and that is a decision rather than an omission. v6 drew
     a 90px progress ring with a 9px stroke for the day's calories. A ring
     shows one quantity: it is a percentage of one thing, drawn round. This
     screen has four quantities that matter at once -- calories and three
     macros -- and four concentric rings is a chart nobody can read a number
     off, while one ring plus three bars is two visual languages for the same
     kind of fact.

     Bars also compare across rows, which is the question actually being
     asked: "am I further behind on protein than on carbs" is answered by two
     bars sitting above each other and is not answerable from two arcs. The
     calorie figure keeps the hero, at the largest type on the screen, which
     is a stronger place than a ring. */
  function macros() {
    if (S.state === 'hidden') {
      var words = ['Ahead', 'On pace', 'On pace'];
      return '<div class="card mt-4" data-testid="macros">' +
        DAY.macros.map(function (m, i) {
          return '<div class="fuel-macro">' +
            '<div class="hstack"><span class="t-subheadline grow">' + esc(m.name) + '</span>' +
            '<span class="t-footnote quiet">' + words[i] + '</span></div>' +
            '<div class="meter meter--quiet mt-2"><span class="meter__fill" style="width:' +
              (m.want > 0 ? Math.min(100, Math.round(m.have / m.want * 100)) : 0) + '%"></span></div>' +
          '</div>';
        }).join('') + '</div>';
    }
    /* The card is a button. The targets moved with every log and there was no
       way to set one -- not on this screen and not in Settings -- so the
       three figures the whole screen is measured against were the only
       numbers in the app nobody could choose. */
    return '<button class="card mt-4" type="button" data-action="targets" ' +
      'data-testid="macros" aria-label="Macro targets, edit">' +
      DAY.macros.map(function (m) {
        /* No target is not a target of zero. Without one the row shows what
           was eaten and an empty bar, rather than "0 / null g" over a meter
           filled to NaN per cent. */
        var has = m.want > 0;
        var pct = has ? Math.min(100, Math.round(m.have / m.want * 100)) : 0;
        var reads = has ? m.have + ' of ' + m.want + ' ' + m.unit
                        : m.have + ' ' + m.unit + ', no target set';
        return '<div class="fuel-macro">' +
          '<div class="hstack">' +
            '<span class="t-subheadline grow">' + esc(m.name) + '</span>' +
            '<span class="t-footnote num"><strong>' + m.have + '</strong>' +
              (has ? ' / ' + m.want + ' ' + m.unit : ' ' + m.unit) + '</span>' +
          '</div>' +
          '<div class="meter meter--quiet mt-2" role="img" aria-label="' + esc(m.name) + ', ' + reads +
            '"><span class="meter__fill" style="width:' + pct + '%"></span></div>' +
        '</div>';
      }).join('') + '</button>';
  }

  /* A badge is a claim about where a number came from. Verified means a
     barcode or a database row; Estimate means a model looked at a photo. */
  /* Four provenances, four words. 'recipe', 'plan' and 'repeat' used to fall
     through to Estimate, whose detail copy says a model read a photo -- so a
     meal built from weighed ingredients was captioned as a camera guess. */
  var SRC = {
    verified: { word: 'Verified', cls: 'badge--ok', testid: 'badge-verified',
      why: 'A barcode matched a database row, so the figures are the manufacturer\u2019s own.' },
    estimate: { word: 'Estimate', cls: 'badge--est', testid: 'badge-estimate',
      why: 'A model read the photo and estimated the portion. Expect it to be within about 15%, ' +
           'and correct it with the portion controls if it looks wrong.' },
    /* A food-table row is not barcode evidence. Every row of the search sheet
       used to be stamped 'verified', so logging Chilli from a typed search
       earned a Verified badge and the sheet told the reader "a barcode matched
       a database row". Nothing was scanned. */
    table: { word: 'Table', cls: 'badge--est', testid: 'badge-table',
      why: 'Picked from the built-in food table. The figures are that table\u2019s standard ' +
           'portion, not a measurement of what was on your plate, so correct the portion if ' +
           'yours was bigger or smaller.' },
    recipe: { word: 'Recipe', cls: 'badge--est', testid: 'badge-recipe',
      why: 'One serving of a recipe you built. The figures are your own ingredients divided by ' +
           'the number of servings you said it makes.' },
    plan: { word: 'Planned', cls: 'badge--est', testid: 'badge-plan',
      why: 'Logged from this week\u2019s plan. The figures are the ones the planned meal carries.' },
    repeat: { word: 'Repeat', cls: 'badge--est', testid: 'badge-repeat',
      why: 'A meal you have logged before, logged again with the same portion. The figures are ' +
           'the ones saved then, and no new measurement was taken.' }
  };
  function srcOf(src) { return SRC[src] || SRC.estimate; }
  function badge(src) {
    var d = srcOf(src);
    return '<span class="badge ' + d.cls + '" data-testid="' + d.testid + '">' + d.word + '</span>';
  }

  function mealRow(m, i) {
    return '<button class="row" type="button" data-action="meal" data-i="' + i +
        '" data-testid="meal-' + i + '">' +
      '<span class="fuel-thumb" aria-hidden="true">' + m.icon + '</span>' +
      '<span class="row__main stack">' +
        '<span class="row__title">' + esc(m.name) + '</span>' +
        /* All three macros, not protein alone. Two of the three bars on this
           screen could not be checked against anything a meal showed, which
           is why a 10 g carb and 14 g fat discrepancy sat there unseen. */
        '<span class="row__sub">' + esc(m.at) + ' &middot; ' + n(m.pro) + ' P &middot; ' +
          n(m.carb) + ' C &middot; ' + n(m.fat) + ' F</span>' +
      '</span>' +
      /* The badge belongs with the number, not with the time: it is a claim
         about where that number came from. It also stays when the numbers are
         hidden, because "a barcode read this" is not itself a calorie count. */
      '<span class="fuel-src">' +
        (S.state === 'hidden' ? '' : '<span class="row__value num">' + n(m.kcal) +
          '<small class="t-caption-2 quiet"> kcal</small></span>') +
        badge(m.src) +
      '</span>' +
      '<span class="row__chev">' + ICO.chev + '</span>' +
    '</button>';
  }

  /* The day, grouped. Every meal used to go into one flat list in log order,
     so a shake at 3:15 sat between lunch and dinner with nothing saying which
     was which, and there was no way to read "breakfast was 540 kcal" off the
     screen at all. Each slot that has something in it gets a heading and its
     own kcal and P/C/F footer; the slots that are empty are not drawn, because
     four empty headings is a form, not a diary.

     The index in data-i is the meal's index in DAY.meals, not its place in the
     group. Grouping the rows without carrying the original index would make
     every tap after breakfast open the wrong meal. */
  function slotGroups() {
    var by = {};
    DAY.meals.forEach(function (m, i) {
      var k = slotOf(m);
      (by[k] = by[k] || []).push({ m: m, i: i });
    });
    return SLOTS.filter(function (sl) { return by[sl[0]] && by[sl[0]].length; })
      .map(function (sl) {
        var g = by[sl[0]];
        var t = { kcal: 0, pro: 0, carb: 0, fat: 0 };
        g.forEach(function (e) {
          t.kcal += e.m.kcal || 0; t.pro += e.m.pro || 0;
          t.carb += e.m.carb || 0; t.fat += e.m.fat || 0;
        });
        return { key: sl[0], name: sl[1], entries: g, total: t };
      });
  }

  /* Chosen at log time, not inferred after the fact. The picker defaults to
     what the clock says and is one tap wide, so the common case costs nothing
     and the 10pm dinner is still one tap from right. */
  function slotPicker(sel, act, testid) {
    return '<div class="seg seg--lg mt-3" role="radiogroup" aria-label="Part of the day" ' +
        'data-testid="' + testid + '">' +
      SLOTS.map(function (sl) {
        return '<button class="seg__item" type="button" role="radio" ' +
          'aria-checked="' + (sel === sl[0]) + '" data-action="' + act + '" ' +
          'data-slot="' + sl[0] + '" data-testid="' + testid + '-' + sl[0] + '">' +
          sl[1] + '</button>';
      }).join('') + '</div>';
  }

  function slotFooter(t) {
    if (S.state === 'hidden') {
      return '<div class="row row--foot" data-testid="slot-foot">' +
        '<span class="row__sub grow">' + n(Math.round(t.pro)) + ' P \u00b7 ' +
          n(Math.round(t.carb)) + ' C \u00b7 ' + n(Math.round(t.fat)) + ' F</span></div>';
    }
    return '<div class="row row--foot" data-testid="slot-foot">' +
      '<span class="row__sub grow">' + n(Math.round(t.pro)) + ' P \u00b7 ' +
        n(Math.round(t.carb)) + ' C \u00b7 ' + n(Math.round(t.fat)) + ' F</span>' +
      '<span class="row__sub num">' + n(Math.round(t.kcal)) + ' kcal</span></div>';
  }

  /* Folded away by default. Four more bars under the three that matter most
     would make the top of the screen a dashboard; behind one tap they are
     there when somebody goes looking, which is what a micronutrient is. */
  function microPanel() {
    if (S.state === 'empty') return '';
    var t = microTotals(DAY.meals);
    var REF = microRefs();
    var missing = DAY.meals.filter(function (m) {
      return typeof m.fibre !== 'number';
    }).length;
    if (!S.microOpen) {
      return '<button class="btn btn--tertiary btn--block mt-2" type="button" data-action="micros" ' +
        'aria-expanded="false" data-testid="micros-toggle">' +
        '<span class="btn__label">Fiber, sugar, saturated fat, sodium</span></button>';
    }
    return '<button class="btn btn--tertiary btn--block mt-2" type="button" data-action="micros" ' +
        'aria-expanded="true" data-testid="micros-toggle">' +
        '<span class="btn__label">Hide fibre, sugar, saturated fat, sodium</span></button>' +
      '<div class="card mt-2" data-testid="micros">' +
        MICROS.map(function (mi, i) {
          var have = t[mi.key], ref = REF[mi.key] || 1;
          var cov = microCover(mi.key);
          var pct = Math.min(100, Math.round(have / ref * 100));
          var overDone = mi.aim === 'less' ? have > ref : have >= ref;
          return '<div class="fuel-macro' + (i ? ' mt-3' : '') + '">' +
            '<div class="hstack"><span class="t-subheadline grow">' + esc(mi.name) + '</span>' +
              '<span class="t-subheadline num">' + n(have) + ' / ' + n(ref) + ' ' + mi.unit + '</span></div>' +
            '<div class="meter meter--quiet mt-2" role="img" aria-label="' + esc(mi.name) + ', ' +
                n(have) + ' of ' + n(ref) + ' ' + mi.unit + '">' +
              '<span class="meter__fill" style="width:' + pct + '%"></span></div>' +
            '<p class="t-caption-2 quiet mt-1" data-testid="micro-note-' + mi.key + '">' +
              (mi.aim === 'less'
                ? (overDone ? 'Over the daily reference.' : n(Math.round((ref - have) * 10) / 10) + ' ' + mi.unit + ' before it is.')
                : (overDone ? 'There for the day.' : n(Math.round((ref - have) * 10) / 10) + ' ' + mi.unit + ' short.')) +
              (cov.all && cov.had < cov.all
                ? ' From ' + cov.had + ' of ' + cov.all + ' meals \u2014 the rest carry no figure ' +
                  'for it, so this is a floor.'
                : '') +
            '</p>' +
          '</div>';
        }).join('') +
        '<p class="t-caption-1 quiet mt-3" data-testid="micros-ref">' + (REF.scaled
          ? 'Fiber at 14 g per 1,000 kcal, sugar and saturated fat at a tenth of the calories ' +
            'each \u2014 so all three move with your ' + n(TARGETS.kcal) + ' kcal target. Sodium is ' +
            'a ceiling for a body rather than a share of a diet, so it does not.'
          : 'These are the stored references. With no calorie target set there is nothing to ' +
            'scale them from.') + '</p>' +
        (missing
          ? '<p class="t-caption-1 quiet mt-3" data-testid="micros-gap">' + missing +
            (missing === 1 ? ' meal on today\u2019s list has' : ' meals on today\u2019s list have') +
            ' no breakdown \u2014 a photo estimate and a typed entry carry energy and macros ' +
            'only, so these four are under-counted rather than wrong.</p>'
          : '') +
      '</div>';
  }

  /* Water, on the screen rather than three taps into a sheet. It was a chip
     among six, which is where a thing goes when nobody has decided whether it
     matters. */
  function waterCard() {
    var pct = Math.min(100, Math.round(DAY.waterMl / DAY.waterGoalMl * 100));
    var oz = !!(stored('lk_fuelProfile', {}) || {}).flOz;
    var show = function (ml) {
      return oz ? (ml / 29.5735).toFixed(0) + ' fl oz' : n(ml) + ' ml';
    };
    return '<div class="card mt-4" data-testid="water-card">' +
      '<div class="hstack hstack--3">' +
        '<span class="t-subheadline grow">Water</span>' +
        '<span class="t-subheadline num" data-testid="water-card-value">' + show(DAY.waterMl) +
          ' / ' + show(DAY.waterGoalMl) + '</span>' +
        '<button class="btn btn--sm btn--tertiary" type="button" data-action="water-unit" ' +
          'aria-label="Show water in ' + (oz ? 'millilitres' : 'fluid ounces') + '" ' +
          'data-testid="water-unit">' + (oz ? 'ml' : 'fl oz') + '</button>' +
      '</div>' +
      '<div class="meter meter--quiet mt-2" role="img" aria-label="' + pct +
        ' per cent of today\u2019s water">' +
        '<span class="meter__fill" style="width:' + pct + '%"></span></div>' +
      /* Glasses, not the difference in millilitres. "500 ml to go" is
         arithmetic somebody has to do; two glasses is a thing you can picture
         and then go and drink. */
      '<p class="t-caption-1 quiet mt-1" data-testid="water-left">' +
        (function () {
          var left = DAY.waterGoalMl - DAY.waterMl;
          /* Past the goal it says by how much, rather than stopping at
             "there for the day". A line that stops moving once the meter is
             full tells somebody who has drunk four litres exactly what it
             tells somebody who has drunk two and a quarter. */
          if (left <= 0) {
            return left === 0 ? 'There for the day.'
              : 'There for the day, and ' + n(-left) + ' ml past it.';
          }
          var g = Math.ceil(left / 250);
          return g === 1 ? 'One glass to go.' : n(g) + ' glasses to go.';
        })() + '</p>' +
      '<div class="hstack hstack--3 mt-3">' +
        '<button class="btn btn--secondary grow" type="button" data-action="water-add" ' +
          'data-testid="water-card-250"><span class="btn__label">+ ' + show(250) + '</span></button>' +
        '<button class="btn btn--secondary grow" type="button" data-action="water-add5" ' +
          'data-testid="water-card-500"><span class="btn__label">+ ' + show(500) + '</span></button>' +
        '<button class="btn btn--secondary" type="button" data-action="water" ' +
          'data-testid="water-card-open"><span class="btn__label">More</span></button>' +
      '</div>' +
    '</div>';
  }

  /* The weigh-in, where the target that depends on it is. Progress owns the
     history; this is the one field, on the screen that uses it. */
  function weightCard() {
    var r = DAY.rate;
    var last = (WEIGHTLOG || [])[WEIGHTLOG.length - 1];
    var today = last && last.date === DAY.iso;
    return '<div class="card mt-4" data-testid="weight-card">' +
      '<div class="hstack hstack--3">' +
        '<span class="t-subheadline grow">Body weight</span>' +
        '<span class="t-subheadline num">' + (DAY.weightKg ? wtTxt(DAY.weightKg) : '\u2014') + '</span>' +
      '</div>' +
      '<p class="t-caption-1 quiet mt-1">' +
        (today ? 'Weighed in today.'
          : r ? 'Last weighed ' + (last ? dayLabel(last.date) : '') + ' \u00b7 ' +
                signed(r.pct) + '% a week'
          : 'No weigh-ins yet.') + '</p>' +
      '<div class="hstack hstack--3 mt-3">' +
        '<input class="input num grow" id="wt-new" type="number" ' +
          'min="' + (LKUnits.useKg() ? 20 : 45) + '" max="' + (LKUnits.useKg() ? 400 : 880) + '" step="0.1" ' +
          'inputmode="decimal" placeholder="' + (DAY.weightKg ? wtNum(DAY.weightKg) : wtNum(70)) + '" ' +
          'aria-label="Today\u2019s weight in ' + (LKUnits.useKg() ? 'kilograms' : 'pounds') + '" ' +
          'data-testid="weight-input">' +
        '<button class="btn btn--secondary" type="button" data-action="weigh-in" ' +
          'data-testid="weigh-in"><span class="btn__label">Save</span></button>' +
      '</div>' +
    '</div>';
  }

  /* A meal that fits what is left, picked from the table rather than invented.
     It says WHY it fits, because a suggestion without a reason is an
     instruction. */
  function suggestCard() {
    var left = DAY.target - DAY.eaten;
    var proLeft = DAY.macros[0].want - DAY.macros[0].have;
    if (left < 150) return '';
    var best = null, bestScore = -1;
    Object.keys(FOODS).forEach(function (k) {
      var f = FOODS[k];
      if (f.kcal > left) return;
      /* Closest to filling the protein gap without overshooting the calories. */
      var sc = Math.min(f.pro, Math.max(proLeft, 0)) * 3 - Math.abs(left - f.kcal) / 40;
      if (sc > bestScore) { bestScore = sc; best = k; }
    });
    if (!best) return '';
    var f = FOODS[best];
    var after = left - f.kcal;
    return '<div class="card mt-4" data-testid="suggest-card">' +
      /* Which kind of day it is, on the card that suggests what to eat. It is
         context, not an instruction: nothing here moves the target because a
         session was logged. */
      '<p class="t-caption-1 quiet" data-testid="suggest-day">' + (isTrainingDay()
        ? 'You trained today, so the carbohydrate in this is doing something.'
        : 'No session logged today.') + '</p>' +
      '<div class="hstack hstack--3 mt-2">' +
        '<span class="fuel-thumb" aria-hidden="true">' + f.icon + '</span>' +
        '<span class="row__main stack grow">' +
          '<span class="row__title">' + esc(f.name) + '</span>' +
          '<span class="row__sub">' + n(f.kcal) + ' kcal \u00b7 ' + n(f.pro) + ' g protein</span>' +
        '</span>' +
      '</div>' +
      '<p class="t-caption-1 quiet mt-2" data-testid="suggest-why">' +
        (proLeft > 0
          ? 'It covers ' + n(Math.min(f.pro, proLeft)) + ' g of the ' + n(proLeft) + ' g of protein left'
          : 'Protein is already closed') +
        ' and leaves ' + n(after) + ' kcal of the day.</p>' +
      '<button class="btn btn--secondary btn--block mt-3" type="button" data-action="suggest-log" ' +
        'data-k="' + best + '" data-testid="suggest-log">' +
        '<span class="btn__label">Add it to today</span></button>' +
    '</div>';
  }

  function refeedCard() {
    var on = refeedOn();
    if (on) {
      return '<div class="card mt-4" data-testid="refeed-banner">' +
        '<div class="hstack hstack--3">' +
          '<span class="t-subheadline grow">Refeed day</span>' +
          '<button class="btn btn--sm btn--tertiary" type="button" data-action="refeed-off" ' +
            'data-testid="refeed-off">End it</button>' +
        '</div>' +
        '<p class="t-detail mt-1">Today only: ' + n(on.kcal) + ' kcal and ' + n(on.carb) +
          ' g of carbs, back to normal tomorrow.</p>' +
      '</div>';
    }
    if (refeedDeclined()) return '';
    var r = refeedDue();
    if (!r) return '';
    return '<div class="card mt-4" data-testid="refeed-card">' +
      '<span class="t-subheadline">Three new lows in a row</span>' +
      '<p class="t-detail mt-1">A day at ' + n(r.kcal) + ' kcal, most of the difference in carbs, ' +
        'is what a cut usually wants at this point. It is one day and it is an offer, not a ' +
        'plan change: tomorrow goes back to ' + n(DAY.target) + '.</p>' +
      '<div class="hstack hstack--3 mt-3">' +
        '<button class="btn btn--secondary grow" type="button" data-action="refeed-on" ' +
          'data-k="' + r.kcal + '" data-c="' + r.carb + '" data-testid="refeed-accept">' +
          '<span class="btn__label">Take it today</span></button>' +
        '<button class="btn btn--tertiary" type="button" data-action="refeed-no" ' +
          'data-testid="refeed-dismiss"><span class="btn__label">Not today</span></button>' +
      '</div>' +
    '</div>';
  }

  /* What the target should be, from what the body actually did. Behind a
     disclosure, because a number that moves a target has to be able to show
     its working or it is just an oracle. */
  /* What it has already done, so a target that moves on its own is still
     something a person can audit. */
  function tdeeHistoryHTML() {
    var h = tdeeHistory();
    if (!h.length) return '';
    var word = { weekly: 'the weekly check', manual: 'you', kept: 'you, left alone' };
    return '<h3 class="t-label mt-5">What it has moved</h3>' +
      '<div class="card card--flush mt-2" data-testid="tdee-history">' +
        h.slice(0, 5).map(function (e, i) {
          return '<div class="row row--static" data-testid="tdee-hist-' + i + '">' +
            '<span class="row__main stack">' +
              '<span class="row__title">' + (e.how === 'kept'
                ? 'Left at ' + n(e.from) + ' kcal'
                : n(e.from) + ' \u2192 ' + n(e.to) + ' kcal') + '</span>' +
              '<span class="row__sub">' + esc(dayLabel(e.date)) + ' \u00b7 ' +
                esc(word[e.how] || e.how) + '</span>' +
            '</span>' +
            (e.how === 'kept' ? '' : '<span class="row__value num">' +
              (e.move > 0 ? '+' : '\u2212') + n(Math.abs(e.move)) + '</span>') +
          '</div>';
        }).join('') +
      '</div>';
  }

  function tdeeCard() {
    var st = adaptState();
    /* IT ALREADY MOVED. The weekly pass ran on the way in, so the card's job
       is to report a change rather than to ask for one, and to make putting
       it back one tap. */
    if (S.tdeeMoved) {
      var mv = S.tdeeMoved;
      return '<div class="card mt-4" data-testid="tdee-moved">' +
        '<span class="t-subheadline">Your target moved to ' + n(mv.to) + '</span>' +
        '<p class="t-detail mt-1">It was ' + n(mv.from) + '. This is the weekly check: your ' +
          'average intake over the last 14 days against what your weight actually did, blended ' +
          'with the formula and capped at 150 kcal a move.</p>' +
        '<div class="hstack hstack--3 mt-3">' +
          '<button class="btn btn--secondary grow" type="button" data-action="tdee-revert" ' +
            'data-v="' + mv.from + '" data-testid="tdee-revert">' +
            '<span class="btn__label">Put it back to ' + n(mv.from) + '</span></button>' +
          '<button class="btn btn--tertiary" type="button" data-action="tdee-seen" ' +
            'data-testid="tdee-seen"><span class="btn__label">Fine</span></button>' +
        '</div>' +
        tdeeHistoryHTML() +
      '</div>';
    }
    var a = adaptive();
    if (!a || a.meas === null) return '';
    if (Math.abs(a.move) < 20) return '';
    /* A dismissal that lasts. "Keep mine" used to live in a variable, so the
       card it closed was back on the next paint and the answer counted for
       nothing. It now holds for a week, which is the cadence the whole thing
       runs on. */
    if (adaptDismissed()) return '';
    return '<div class="card mt-4" data-testid="tdee-card">' +
      '<div class="hstack hstack--3">' +
        '<span class="t-subheadline grow">Your target looks ' +
          (a.move > 0 ? 'low' : 'high') + '</span>' +
        '<button class="iconbtn" type="button" data-action="tdee-why" ' +
          'aria-expanded="' + (!!S.tdeeWhy) + '" aria-label="How this was worked out" ' +
          'data-testid="tdee-why">' + ICO.alert + '</button>' +
      '</div>' +
      '<p class="t-detail mt-2">' + n(DAY.target) + ' now, ' + n(a.want) + ' on the evidence ' +
        'of the last ' + a.days + ' days. That is ' + signed(a.move).replace('.00', '') +
        ' kcal' + (a.clamped ? ', which is as far as this will move a target in one go' : '') + '.</p>' +
      (S.tdeeWhy
        ? '<div class="card card--sunken mt-3" data-testid="tdee-working">' +
            '<div class="hstack hstack--3"><span class="t-body grow">What you spent, measured</span>' +
              '<span class="t-body-em num">' + n(a.meas) + ' kcal</span></div>' +
            '<div class="hstack hstack--3 mt-2"><span class="t-body grow">What the formula says</span>' +
              '<span class="t-body-em num">' + (a.est ? n(a.est) + ' kcal' : '\u2014') + '</span></div>' +
            '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Blended, 70 to 30</span>' +
              '<span class="t-body-em num">' + n(a.tdee) + ' kcal</span></div>' +
            '<div class="hstack hstack--3 mt-2"><span class="t-body grow">For ' +
                esc(GOAL_WORD[goalKey()]) + '</span>' +
              '<span class="t-body-em num">' + (GOAL_OFFSET[goalKey()] >= 0 ? '+' : '\u2212') +
                n(Math.abs(GOAL_OFFSET[goalKey()])) + ' kcal</span></div>' +
            '<p class="t-caption-1 quiet mt-2">The measurement is your average intake over those ' +
              'days plus whatever your weight change accounts for, at roughly 7,700 kcal a kilo. ' +
              'The formula is Mifflin-St Jeor at ' + esc(activityKey()) + ' activity, which knows ' +
              'your height and your age and nothing else about you. The measurement is weighted ' +
              'higher because it is better, and not weighted at 100 because it is noisy.</p>' +
          '</div>'
        : '') +
      '<div class="hstack hstack--3 mt-3">' +
        '<button class="btn btn--secondary grow" type="button" data-action="tdee-take" ' +
          'data-v="' + a.want + '" data-testid="tdee-take">' +
          '<span class="btn__label">Use ' + n(a.want) + '</span></button>' +
        '<button class="btn btn--tertiary" type="button" data-action="tdee-keep" ' +
          'data-testid="tdee-keep"><span class="btn__label">Keep mine</span></button>' +
      '</div>' +
      '<div class="hstack hstack--3 mt-3">' +
        '<span class="t-body grow" id="tdee-auto-lbl">Adjust it for me every week</span>' +
        '<button class="switch" type="button" role="switch" aria-checked="' + st.auto + '" ' +
          'aria-labelledby="tdee-auto-lbl" data-action="tdee-auto" data-testid="tdee-auto">' +
          '<span class="switch__track"></span><span class="switch__knob"></span></button>' +
      '</div>' +
      '<p class="t-caption-1 quiet mt-1">' + (st.auto
        ? 'On: once a week, from the first thing you log, the target moves itself by at most ' +
          '150 kcal and this card says it did. Turning it off leaves every move to you.'
        : 'Off: the target only moves when you tap Use. The card still appears once a week.') +
        (adaptState().lastAt ? ' Last checked ' + esc(dayLabel(adaptState().lastAt)) + '.' : '') +
      '</p>' +
      tdeeHistoryHTML() +
    '</div>';
  }

  function diaryHidden() { return !!stored('lk_fuelDiaryHidden', false); }

  function today() {
    var groups = slotGroups();
    var rows = groups.map(function (g) {
      return '<div class="section__sub" data-testid="slot-' + g.key + '">' +
          '<h3 class="t-label">' + esc(g.name) + '</h3></div>' +
        g.entries.map(function (e) { return mealRow(e.m, e.i); }).join('') +
        slotFooter(g.total);
    }).join('');
    /* The empty slot is a pattern, not a target. "About 40g protein closes
       today" is something this person already does; "600 calories to beat"
       would be a number invented to be chased. */
    /* A line icon, where the three logged meals carry colour emoji. That is
       not an inconsistency, it is the distinction: an emoji here is the food,
       and this row has no food in it. It is an instruction about a meal that
       has not happened. A flat grey 🍽 next to three colour glyphs read as a
       rendering failure; a clock from the icon family reads as what it is. */
    /* It reads the day it sits under. The row used to be a fixed string, so
       after logging 4,000 kcal with protein at 265 of 160 g it still said
       "about 40 g protein closes today" -- advice, in the voice of the app,
       about a day that had already finished. */
    var proLeft = DAY.macros[0].want - DAY.macros[0].have;
    var kcalLeft = DAY.target - DAY.eaten;
    /* Named "Dinner" whatever the day held, so it sat under a dinner that had
       already been logged. It is the first slot with nothing in it. */
    var filled = {};
    groups.forEach(function (g) { filled[g.key] = true; });
    var closingSlot = 'Snack';
    for (var ci = 0; ci < SLOTS.length; ci++) {
      if (!filled[SLOTS[ci][0]]) { closingSlot = SLOTS[ci][1]; break; }
    }
    var closingSub;
    if (kcalLeft <= 0 && proLeft <= 0) {
      closingSub = 'Both closed. Nothing has to go in after this.';
    } else if (proLeft <= 0) {
      closingSub = 'Protein is closed. ' + n(kcalLeft) + ' kcal left if you want them.';
    } else if (kcalLeft <= 0) {
      closingSub = n(proLeft) + ' g of protein short, and the calories are spent.';
    } else {
      /* The usual time belongs to the meal that closes the day. Naming the
         first empty slot made it say "Usually 7:30" under Breakfast. */
      closingSub = (closingSlot === 'Dinner' ? 'Usually ' + esc(DAY.closing.at) + ' \u00b7 ' : '') +
        n(proLeft) + ' g of protein and ' + n(kcalLeft) + ' kcal left to close today.';
    }
    var closing = '<div class="row row--quiet" data-testid="meal-closing">' +
      '<span class="fuel-thumb fuel-thumb--ico" aria-hidden="true">' + ICO.clock + '</span>' +
      '<span class="row__main stack">' +
        '<span class="row__title">' + esc(closingSlot) + '</span>' +
        '<span class="row__sub">' + closingSub + '</span>' +
      '</span>' +
      '<span class="fuel-src"><span class="row__value quiet">&mdash;</span></span>' +
      '<span class="row__chev" aria-hidden="true"></span></div>';

    /* WHETHER TODAY IS A TRAINING DAY, which nothing in Fuel knew. It does
       not move the target -- a target is a week's arithmetic, not a day's --
       but it is the difference between "the calories are spent" reading as a
       problem and reading as the point. Read off lk_history, which is what
       Train writes when a session ends. */
    var trained = trainedOn(DAY.iso);
    var dayKind = trained
      ? 'Training day \u00b7 ' + esc(trained.name || 'a session logged')
      : 'No session logged today';

    /* SHOWN OR HIDDEN, and the answer is kept. Somebody who does not want to
       read back everything they ate -- which is a great many of the people
       this screen is for -- had no way to put it away. */
    var open = !diaryHidden();
    return '<div class="section">' +
      '<div class="section__head">' +
        '<h2 class="t-label">Today</h2>' +
        '<button class="hdr__action" type="button" data-action="diary-toggle" ' +
          'aria-expanded="' + open + '" data-testid="diary-toggle">' +
          (open ? 'Hide' : 'Show') + '</button>' +
      '</div>' +
      '<p class="t-caption-1 quiet gutter" data-testid="day-kind">' + dayKind + '</p>' +
      (open
        ? '<div class="card card--flush">' + rows + closing + '</div>'
        : '<div class="card" data-testid="diary-hidden">' +
            '<p class="t-body">' + (DAY.meals.length
              ? DAY.meals.length + (DAY.meals.length === 1 ? ' thing' : ' things') + ' logged, ' +
                n(DAY.eaten) + ' kcal.'
              : 'Nothing logged yet today.') + '</p>' +
            '<p class="t-detail quiet mt-1">The diary is hidden. The totals above are still ' +
              'everything on it.</p>' +
          '</div>') +
    '</div>';
  }

  /* Everything that is not logging. Quiet chips, because a fake button row is
     how a screen ends up with five things competing for one job. */
  function chips() {
    var items = [['trends', 'Trends'], ['water', 'Water'], ['supps', 'Supps'],
                 ['recipes', 'Recipes'], ['plan', 'Plan']];
    /* Stack is gated and stays invisible until it is switched on -- not
       disabled, not greyed, absent. A chip that says "Stack" to somebody who
       has never turned it on is the feature announcing itself, which is the
       one thing a gate like this exists to prevent. */
    if (perfTracking()) items.push(['stack', 'Stack']);
    /* IT SAYS SHOP. It said "More", which is the label a screen uses when
       nobody decided what is behind it -- and what was behind it was the
       shopping list and the budget, the one thing on this row somebody
       arrives looking for by name. The data-testid stays chip-more because
       the crossing to Shopping is declared against it in the assembled demo's
       manifest, which this package does not own. */
    items.push(['more', 'Shop']);
    return '<div class="chiprow mt-4" data-testid="fuel-chips">' +
      items.map(function (c) {
        return '<button class="chip" type="button" data-action="' + c[0] +
          '" data-testid="chip-' + c[0] + '">' + c[1] + '</button>';
      }).join('') + '</div>';
  }

  /* ---------------------------------------------------------------
     Log and Meals

     One screen, two things a person comes to it for: recording what they just
     ate, and deciding what to eat next. The build had the first as the screen
     and the second scattered through a row of chips that opened sheets, so
     "what am I cooking tonight" was three taps into a modal and the answer
     closed when you looked at the diary.

     The choice is remembered. A person who lives in Meals was put back on Log
     every time they came to the tab, which is the app forgetting something it
     was told every single day.
     --------------------------------------------------------------- */
  var FUEL_VIEWS = [['log', 'Log'], ['meals', 'Meals']];
  function fuelView() {
    var v = stored('lk_fuelView', null);
    for (var i = 0; i < FUEL_VIEWS.length; i++) if (FUEL_VIEWS[i][0] === v) return v;
    return 'log';
  }
  function setFuelView(v) {
    if (ST && persisting()) ST.set('lk_fuelView', v);
    S.view = v;
  }
  function viewSeg() {
    var v = S.view || fuelView();
    return '<div class="seg seg--lg mt-3" role="radiogroup" aria-label="Log or meals" ' +
        'data-testid="fuel-view">' +
      FUEL_VIEWS.map(function (x) {
        return '<button class="seg__item" type="button" role="radio" ' +
          'aria-checked="' + (v === x[0]) + '" data-action="fuel-view" data-v="' + x[0] + '" ' +
          'data-testid="fuel-view-' + x[0] + '">' + x[1] + '</button>';
      }).join('') + '</div>';
  }

  /* Today's plan, on the screen rather than inside the Plan sheet, with what
     each meal is made of under it -- a plan you cannot see the ingredients of
     is a menu, and the shopping list is built from exactly these lines. */
  function planTodayCard() {
    var pd = null, pi = -1;
    PLAN.forEach(function (d, i) { if (d.iso === DAY.iso) { pd = d; pi = i; } });
    if (!pd) {
      return '<div class="section"><div class="section__head">' +
          '<h2 class="t-label">Today\u2019s plan</h2>' +
          '<button class="hdr__action" type="button" data-action="plan" data-testid="open-plan">Plan</button>' +
        '</div>' +
        '<div class="card" data-testid="plan-today-none">' +
          '<p class="t-body">Nothing planned for today.</p>' +
          '<p class="t-detail quiet mt-1">The week that is saved does not cover ' +
            esc(DAY.date) + '. Build one and today gets its own row.</p>' +
          '<button class="btn btn--secondary btn--block mt-3" type="button" data-action="build-plan" ' +
            'data-testid="plan-today-build"><span class="btn__label">Build a week</span></button>' +
        '</div></div>';
    }
    var left = pd.slots.filter(function (sl) { return !slotDone(pd, sl); }).length;
    return '<div class="section"><div class="section__head">' +
        '<h2 class="t-label">Today\u2019s plan</h2>' +
        '<button class="hdr__action" type="button" data-action="plan" data-testid="open-plan">Plan</button>' +
      '</div>' +
      '<div class="card card--flush" data-testid="plan-today">' +
        pd.slots.map(function (sl, si) {
          var done = slotDone(pd, sl);
          var r = null;
          allRecipes().forEach(function (x) { if (x.key === sl.key) r = x; });
          var made = r && r.ing && r.ing.length
            ? r.ing.slice(0, 3).join(', ') + (r.ing.length > 3 ? '\u2026' : '')
            : 'No ingredient list on this one';
          return '<div class="row row--withaside" data-testid="plan-today-' + si + '">' +
            '<span class="fuel-thumb" aria-hidden="true">' + ((FOODS[sl.key] || {}).icon || '') + '</span>' +
            '<span class="row__main stack">' +
              '<span class="row__title">' + esc(sl.at) + ' \u00b7 ' + esc(sl.name) + '</span>' +
              '<span class="row__sub num">' + n(sl.kcal) + ' kcal \u00b7 ' + n(sl.pro) + ' P \u00b7 ' +
                n(sl.carb) + ' C \u00b7 ' + n(sl.fat) + ' F</span>' +
              '<span class="row__sub quiet">' + esc(made) + '</span>' +
            '</span>' +
            (done
              ? '<span class="row__value quiet">logged</span>'
              : '<button class="btn btn--sm btn--secondary" type="button" data-action="plan-log" ' +
                  'data-d="' + pi + '" data-s="' + si + '" data-testid="plan-today-log-' + si + '">' +
                  '<span class="btn__label">Log</span></button>') +
          '</div>';
        }).join('') +
      '</div>' +
      (left
        ? '<div class="gutter"><button class="btn btn--secondary btn--block mt-2" type="button" ' +
            'data-action="plan-log-day" data-d="' + pi + '" data-testid="plan-today-all">' +
            '<span class="btn__label">Log the ' + left + ' left of today</span></button></div>'
        : '') +
    '</div>';
  }

  function oftenSection() {
    if (!OFTEN.length) return '';
