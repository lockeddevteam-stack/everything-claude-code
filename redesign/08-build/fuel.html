<body>
<!--
  FUEL — built from Concept D, "Glance and Ledger merged, no Fuel Score".

  The whole screen answers one question: what is left to eat today, and how do
  I record what I just ate. Everything else is a chip at the bottom.

  WHY THE SPLIT BUTTON
  Voice and camera are the two fast paths and neither is secondary, so they
  share one accent control rather than competing as two. That keeps the
  screen's single accent on the single job the screen is for. Concept D's
  own note: "Mic and camera share one orange split button. Equal weight, one
  accent per surface, nothing floats over content."

  WHAT WAS CUT, AND ON WHOSE SAY-SO
  The Fuel Score is gone. It was a composite of weighted sub-scores, which
  reads as rigorous and cannot be acted on: the targets and the day's actuals
  already say what to do differently. Cut at the Wave 0 gate by the owner.
  Receipt scanning went with it, to Shopping, because parsing a receipt is a
  grocery job rather than a logging one.

  SOURCE BADGES ARE NOT DECORATION
  Every logged row says where its numbers came from. A verified barcode and an
  AI estimate from a photo are not the same claim, and a screen that renders
  them identically is lying about its own confidence. This is the trust layer
  the rebuild plan asks for, and it is why "Estimate" is a visible word rather
  than a shade of grey.

  STATES
  populated, first-weeks (the target is a formula until the trend takes over),
  hidden (numbers off, for anyone the numbers hurt), empty, loading, error.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-fuel" data-state="populated">

      <header class="hdr hdr--large" data-large-title="#body" data-scroll-edge="#body" id="hdr"></header>

      <main class="body" id="body" data-testid="fuel-scroll" tabindex="-1"></main>

      <div id="overlay"></div>

      <!-- The accessory shelf. A session that is running is visible from
           whichever tab you wandered to, which is the whole reason the shelf
           exists rather than a badge on the Train tab. -->
      <div id="shelf-slot"></div>

      <nav class="tabbar" aria-label="Sections" data-minimize="#body">
        <button class="tabbar__item" type="button" data-testid="tab-home">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></svg>
          <span class="tabbar__label">Home</span>

        <button class="tabbar__item" type="button" data-testid="tab-train">

          <span class="tabbar__label">Train</span>

        <button class="tabbar__item" type="button" aria-current="page" data-testid="tab-fuel">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 3v8a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M9 13v8"/><path d="M17 3c-1.5 1.8-2 3.6-2 5.5 0 1.6.7 2.5 2 2.5s2-.9 2-2.5c0-1.9-.5-3.7-2-5.5Z"/><path d="M17 11v10"/></svg>
          <span class="tabbar__label">Fuel</span>

        <button class="tabbar__item" type="button" data-testid="tab-coach">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 15a3 3 0 0 1-3 3H9l-4 3V7a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3z"/></svg>
          <span class="tabbar__label">Coach</span>

        <button class="tabbar__item" type="button" data-testid="tab-profile">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
          <span class="tabbar__label">Profile</span>

    </div>

</div>

<div class="dev">
  <button class="dev__toggle" id="dev-toggle" aria-expanded="false" aria-controls="dev-menu" data-testid="dev-toggle">State</button>
  <div class="dev__menu" id="dev-menu" hidden data-testid="dev-menu"></div>

<script>
(function () {
  "use strict";

  var screen = document.getElementById('screen');
  var hdr = document.getElementById('hdr');
  var body = document.getElementById('body');
  var overlay = document.getElementById('overlay');
  var menu = document.getElementById('dev-menu');

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }
  function n(v) { return Number(v).toLocaleString('en-GB'); }

  var ICO = {
    mic: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
    cam: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    tick: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12.5l5 5L19 7"/></svg>',
    chev: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg>',
    alert: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>',
    plus: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>',
    barcode: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6v12M7.5 6v12M11 6v9M14.5 6v12M18 6v12M20.5 6v9"/></svg>',
    /* The one row in the list that is not a food. See the comment on the
       closing row for why it is a line icon and the logged meals are not. */
    clock: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    /* Two arrows passing, for a swap. Not a refresh circle: a circle says
       "do this again" and a swap replaces one thing with another. */
    swap: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/></svg>',
    /* A balance, for setting an amount. */
    scale: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4v16M5 20h14M7 7h10M7 7l-3 6h6zM17 7l3 6h-6z"/></svg>'
  };

  /* The day. Numbers are the fixture's, not invented at render time, so the
     same screen renders the same way every run and a screenshot diff means
     something. */
  /* A function, not a literal: the dev switcher rebuilds it so one state's
     edits do not leak into the next. */
  /* One source. Every figure below comes from window.LKFixtures, which is
     generated from tests/fixtures/seed-data.json -- the same file Home,
     Train, Recap, Progress and Settings read. This screen used to carry its
     own literals, and the cross-screen audit found it showing a body weight
     22% heavier than Settings and Progress, a calorie target 580 kcal from
     Recap's for the same day, a date two days behind the rest of the app,
     and macro bars carrying 10 g of carbs and 14 g of fat that belonged to
     no meal on the list. */
  var FX = window.LKFixtures || {};
  var NUT = FX.nutrition || { targets: {}, foods: {}, days: {}, trend: [] };
  var FOODS = NUT.foods;

  /* The store is the truth once a person has touched anything; the fixture is
     only the seed. Read through LKStore so a target edited on Settings, a
     weigh-in added on Progress and a meal logged here are all the same data. */
  var ST = window.LKStore;
  function stored(key, fb) { return ST ? ST.get(key, fb) : fb; }

  var PROFILE = stored('lk_profile', FX.profile || {});
  /* The day log, keyed by date. Untouched it is the fixture's four days; the
     moment anything is logged the stored map wins and the fixture is never
     consulted again. Everything this screen did -- a logged meal, a deleted
     one, a rescaled portion, a glass of water, a supplement tick, an edited
     target -- lived in a variable and was gone on reload. */
  var FUELLOG = stored('lk_fuelLog', null) || cloneDays(NUT.days || {});
  var TARGETS = stored('lk_fuelTargets', NUT.targets || {});

  function cloneDays(d) {
    try { return JSON.parse(JSON.stringify(d)); } catch (e) { return {}; }
  }

  /* Only the two real states write. The dev switcher's empty, loading, error
     and first-weeks views are a tool for looking at the screen, not a day
     somebody lived, and logging a meal inside one must not land in the log. */
  function persisting() { return S.state === 'populated' || S.state === 'hidden'; }

  function saveDay() {
    if (!ST || !persisting()) return;
    FUELLOG[DAY.iso] = {
      date: DAY.iso,
      meals: DAY.meals.map(function (m) {
        return { key: m.key || null, icon: m.icon, name: m.name, at: m.at, src: m.src,
                 slot: m.slot || slotOf(m),
                 kcal: m.kcal, pro: m.pro, carb: m.carb, fat: m.fat,
                 fibre: m.fibre, sugar: m.sugar, satfat: m.satfat, sodium: m.sodium,
                 base: m.base || null, scale: m.scale || 1 };
      }),
      eaten: DAY.eaten,
      pro: DAY.macros[0].have, carb: DAY.macros[1].have, fat: DAY.macros[2].have,
      waterMl: DAY.waterMl,
      supps: DAY.supps.map(function (sp) {
        return { name: sp.name, dose: sp.dose, when: sp.when, taken: sp.taken };
      })
    };
    ST.set('lk_fuelLog', FUELLOG);
    /* Supplements are one list the whole app reads, so today's ticks go back
       to the key Stack and Recap read rather than only into the day. */
    ST.set('lk_supplements', DAY.supps.map(function (sp) {
      return { name: sp.name, dose: sp.dose, timeOf: sp.when, taken: sp.taken };
    }));
  }

  function saveTargetsTo(t) {
    TARGETS = t;
    if (ST && persisting()) ST.set('lk_fuelTargets', t);
  }
  var WEIGHTLOG = stored('lk_weightLog', FX.weightLog || []);

  /* The same three words Settings writes. `lean bulk` was a fourth invented
     here and printed under every hero, whatever the profile said. */
  var GOAL_WORD = { cut: 'losing fat', maintain: 'holding steady', build: 'building' };
  function goalKey() {
    var g = PROFILE.goal;
    return GOAL_WORD[g] ? g : 'maintain';
  }

  /* ---------------------------------------------------------------
     What the body is actually spending
     --------------------------------------------------------------- */

  /* How hard the week is. Stored, because it is a fact about a person, not
     about a screen; defaulted to moderate and said out loud where it is used,
     rather than being an invisible constant inside a formula. */
  var ACTIVITY = [
    ['sedentary', 'Desk job, little else', 1.2],
    ['light', 'On your feet, or training twice a week', 1.375],
    ['moderate', 'Training three to five days', 1.55],
    ['hard', 'Training six days, or a physical job', 1.725],
    ['athlete', 'Twice a day, or manual work plus training', 1.9]
  ];
  function activityKey() {
    var k = (stored('lk_fuelProfile', {}) || {}).activity;
    for (var i = 0; i < ACTIVITY.length; i++) if (ACTIVITY[i][0] === k) return k;
    return 'moderate';
  }
  function activityFactor() {
    var k = activityKey();
    for (var i = 0; i < ACTIVITY.length; i++) if (ACTIVITY[i][0] === k) return ACTIVITY[i][2];
    return 1.55;
  }

  /* Mifflin-St Jeor, the formula every calculator uses, times the activity
     factor. This is the ESTIMATE: it knows your height and your age and
     nothing whatever about you. */
  function calcTDEE() {
    var w = PROFILE.weightKg, h = PROFILE.heightCm, a = PROFILE.age;
    if (!w || !h || !a) return null;
    var bmr = 10 * w + 6.25 * h - 5 * a + (PROFILE.sex === 'male' ? 5 : -161);
    return Math.round(bmr * activityFactor());
  }

  /* What the body actually did, which the formula cannot know. Over the
     window, average intake plus whatever the weight change accounts for:
     losing a kilo is roughly 7,700 kcal that did not come from the plate.
     This is the MEASUREMENT, and it is the better of the two the moment
     there are enough days behind it. */
  function measuredTDEE(days) {
    var se = series(days);
    if (se.length < 7) return null;
    var rate = weekRate();
    if (!rate || rate.days < 5) return null;
    /* Today is half-logged, so it would drag the average down. */
    var past = se.slice(0, -1);
    if (past.length < 6) return null;
    var avg = past.reduce(function (a, e) { return a + e.kcal; }, 0) / past.length;
    var kgPerDay = rate.kg / rate.days;
    return Math.round(avg - kgPerDay * 7700);
  }

  var GOAL_OFFSET = { cut: -400, maintain: 0, build: 250 };

  /* One place the figures a target is computed from actually live. They were
     spread across lk_profile, a constant inside a formula, and nothing at
     all. lk_profile still owns weight, height, age, sex and goal, because
     Settings and Progress write those; lk_fuelProfile carries what only this
     screen knows. */
  function fuelProfile() {
    var fp = stored('lk_fuelProfile', {}) || {};
    return {
      weightKg: PROFILE.weightKg || 70,
      heightCm: PROFILE.heightCm || 170,
      age: PROFILE.age || 30,
      sex: PROFILE.sex === 'male' ? 'male' : 'female',
      goal: goalKey(),
      activity: activityKey(),
      macroMode: fp.macroMode === 'custom' ? 'custom' : 'auto',
      diet: fp.diet || '',
      allergy: fp.allergy || '',
      flOz: !!fp.flOz
    };
  }

  function ftIn(cm) {
    var inches = Math.round(cm / 2.54);
    return Math.floor(inches / 12) + '\u2032 ' + (inches % 12) + '\u2033';
  }

  /* Protein first, fat second, carbs with what is left. Protein at 2 g per
     kilo because that is the figure the evidence keeps landing on for
     somebody lifting; fat at 25% of calories, which is a floor rather than a
     target; carbs are the remainder, because they are what a body uses to
     train and there is no reason to cap them below what is left over. */
  function calcMacros(fp) {
    var bmr = 10 * fp.weightKg + 6.25 * fp.heightCm - 5 * fp.age +
      (fp.sex === 'male' ? 5 : -161);
    var factor = 1.55;
    ACTIVITY.forEach(function (x) { if (x[0] === fp.activity) factor = x[2]; });
    var kcal = Math.round((bmr * factor + (GOAL_OFFSET[fp.goal] || 0)) / 10) * 10;
    var pro = Math.round(fp.weightKg * 2);
    var fat = Math.round(kcal * 0.25 / 9);
    var carb = Math.max(0, Math.round((kcal - pro * 4 - fat * 9) / 4));
    return {
      kcal: kcal, pro: pro, carb: carb, fat: fat,
      why: 'Mifflin-St Jeor at \u00d7' + factor + ', ' +
        (GOAL_OFFSET[fp.goal] >= 0 ? '+' : '\u2212') + Math.abs(GOAL_OFFSET[fp.goal] || 0) +
        ' kcal for ' + GOAL_WORD[fp.goal] + '. Protein at 2 g a kilo, fat at a quarter of the ' +
        'calories, carbs with what is left.'
    };
  }

  /* The two, blended. Seventy per cent measurement to thirty per cent formula:
     the measurement is better but it is noisy, and a week of water weight
     should not move a target by four hundred calories. The move itself is
     then clamped, so nothing on this screen can swing a target more than
     150 kcal in one go. */
  function adaptive() {
    var est = calcTDEE(), meas = measuredTDEE(14);
    if (!est && !meas) return null;
    var tdee = meas === null ? est : (est === null ? meas : Math.round(meas * 0.7 + est * 0.3));
    var want = Math.round((tdee + (GOAL_OFFSET[goalKey()] || 0)) / 10) * 10;
    var move = want - DAY.target;
    var capped = Math.max(-150, Math.min(150, move));
    return {
      tdee: tdee, est: est, meas: meas,
      want: DAY.target + capped,
      move: capped,
      clamped: capped !== move,
      days: 14
    };
  }

  /* Meals belong to a part of the day, and every path on this screen used to
     stamp a clock time and append to one flat list. Breakfast, lunch, dinner
     and a snack are how people actually read a day back: "I had no protein at
     breakfast" is a sentence about a slot, not about 8:05. */
  /* Fibre, sugar, saturated fat and sodium. The screen showed energy and
     three macros and nothing else, so a day could hit every macro on 4 g of
     fibre and 4,800 mg of sodium and the app had no opinion about it at all.

     Two of these are floors and two are ceilings, and they are labelled
     differently for that reason: 6 g of 30 is a shortfall, 4,100 mg of 2,400
     is an excess, and one bar style for both would say neither. */
  var MICROS = [
    { key: 'fibre',  name: 'Fibre',         unit: 'g',  aim: 'more' },
    { key: 'sugar',  name: 'Sugar',         unit: 'g',  aim: 'less' },
    { key: 'satfat', name: 'Saturated fat', unit: 'g',  aim: 'less' },
    { key: 'sodium', name: 'Sodium',        unit: 'mg', aim: 'less' }
  ];
  var MREF = NUT.microRef || { fibre: 30, sugar: 90, satfat: 20, sodium: 2400 };

  function microTotals(meals) {
    var t = {};
    MICROS.forEach(function (mi) { t[mi.key] = 0; });
    (meals || []).forEach(function (m) {
      MICROS.forEach(function (mi) { t[mi.key] += m[mi.key] || 0; });
    });
    MICROS.forEach(function (mi) { t[mi.key] = Math.round(t[mi.key] * 10) / 10; });
    return t;
  }

  /* A meal's micros, which only exist where the food it came from had them.
     A photo estimate and a free-typed entry do not, and the panel says so
     rather than counting a missing figure as a zero. */
  function microsFrom(f) {
    var out = {};
    var any = false;
    MICROS.forEach(function (mi) {
      if (typeof f[mi.key] === 'number') { out[mi.key] = f[mi.key]; any = true; }
    });
    return any ? out : null;
  }

  function withMicros(meal, f) {
    var mi = f ? microsFrom(f) : null;
    if (mi) Object.keys(mi).forEach(function (k) { meal[k] = mi[k]; });
    return meal;
  }

  var SLOTS = [
    ['breakfast', 'Breakfast'], ['lunch', 'Lunch'],
    ['dinner', 'Dinner'], ['snack', 'Snack']
  ];
  function slotName(k) {
    for (var i = 0; i < SLOTS.length; i++) if (SLOTS[i][0] === k) return SLOTS[i][1];
    return 'Snack';
  }

  /* What is being eaten now, by the clock. A default, never a decision: every
     log path stamps this and every meal can be moved afterwards. */
  function slotForNow() {
    var h = new Date().getHours();
    if (h < 11) return 'breakfast';
    if (h < 16) return 'lunch';
    if (h < 21) return 'dinner';
    return 'snack';
  }

  /* Anything logged before slots existed still has to land somewhere. The
     clock times on this screen are 12-hour and carry no am or pm, so 8:05
     could be breakfast or a late dinner and guessing would put meals in the
     wrong part of the day with a confidence nothing earns. An unslotted meal
     is a snack, and it can be moved in one tap. */
  function slotOf(m) {
    var k = m && m.slot;
    for (var i = 0; i < SLOTS.length; i++) if (SLOTS[i][0] === k) return k;
    return 'snack';
  }

  function daysBetween(a, b) {
    return Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  }

  /* Rate of weight change per week, read off the log rather than asserted.
     This screen carried `weekPct: 0.34` as a literal and rendered it as
     "+0.34% / wk, on target" while the log behind it ran 64.5 -> 64.2 kg over
     the same week: a loss of 0.47%/wk, under a goal of building. The number
     was wrong, the sign was wrong and the verdict was printed without looking
     at either.

     The span is stretched back to at least five days on purpose. Two weigh-ins
     a day apart turn a glass of water into a 10%/wk trend. */
  function weekRate() {
    var log = (WEIGHTLOG || []).filter(function (e) { return e && e.date && e.kg; })
      .slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    if (log.length < 2) return null;
    var last = log[log.length - 1], i = log.length - 2;
    while (i > 0 && daysBetween(log[i].date, last.date) < 5) i--;
    var first = log[i], span = daysBetween(first.date, last.date);
    if (span < 1 || !first.kg) return null;
    return {
      pct: ((last.kg - first.kg) / first.kg) * 100 * (7 / span),
      kg: last.kg - first.kg,
      days: span,
      kgNow: last.kg
    };
  }

  /* "On target" is a claim, so it has to be checked. The direction has to match
     the goal and the pace has to be one a body can hold: under 1%/wk either
     way. Everything else is named plainly, including going the wrong way. */
  function rateVerdict(pct, goal) {
    var a = Math.abs(pct);
    if (a < 0.1) return goal === 'maintain' ? 'steady, on target' : 'flat this week';
    if (goal === 'build') {
      if (pct < 0) return 'the wrong way for a build';
      return a > 1 ? 'faster than a build needs' : 'on target';
    }
    if (goal === 'cut') {
      if (pct > 0) return 'the wrong way for a cut';
      return a > 1 ? 'faster than a cut should be' : 'on target';
    }
    return a > 0.5 ? 'drifting' : 'steady, on target';
  }

  function signed(v) { return (v > 0 ? '+' : v < 0 ? '\u2212' : '') + Math.abs(v).toFixed(2); }

  /* 35 ml per kg of body weight, rounded to the nearest 50. The water sheet
     says the target moves with your weight; before this it was a flat 3,000
     and the sentence was false. Where there is no weight, the fixture target
     stands and the sheet says which it is. */
  function waterGoal() {
    var kg = (weekRate() || {}).kgNow || PROFILE.weightKg || 0;
    if (!kg) return { ml: (TARGETS && TARGETS.waterMl) || 3000, computed: false };
    return { ml: Math.round(kg * 35 / 50) * 50, computed: true };
  }

  /* Mon 7 Sep, Tue 8 Sep, Wed 9 Sep. */
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function dayLabel(iso) {
    var p = iso.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    return WD[d.getUTCDay()] + ' ' + (+p[2]) + ' ' + MON[+p[1] - 1];
  }

  /* NOT a stored total. eaten and the three macro `have` figures are added up
     from DAY.meals every time the list changes, so a meal that is logged,
     rescaled or deleted cannot leave anything behind. The bars used to be
     stored figures nudged by each action, which is how they came to be 10 g
     and 14 g ahead of the meals that produced them and stayed there after the
     log was emptied. */
  function recount(d) {
    var t = { kcal: 0, pro: 0, carb: 0, fat: 0 };
    d.meals.forEach(function (m) {
      t.kcal += m.kcal || 0; t.pro += m.pro || 0; t.carb += m.carb || 0; t.fat += m.fat || 0;
    });
    d.eaten = Math.round(t.kcal);
    d.macros[0].have = Math.round(t.pro);
    d.macros[1].have = Math.round(t.carb);
    d.macros[2].have = Math.round(t.fat);
    return d;
  }

  /* A function, not a literal: the dev switcher rebuilds it so one state's
     edits do not leak into the next. */
  function day() {
    var iso = FX.today;
    var src = FUELLOG[iso] || { meals: [], waterMl: 0, supps: [] };
    var tg = TARGETS;
    var d = {
      iso: iso,
      date: dayLabel(iso),
      target: tg.kcal,
      goal: GOAL_WORD[goalKey()],
      goalKey: goalKey(),
      weightKg: (weekRate() || {}).kgNow || PROFILE.weightKg || 0,
      rate: weekRate(),
      macros: [
        { name: 'Protein', have: 0, want: tg.pro, unit: 'g', key: 'pro' },
        { name: 'Carbs', have: 0, want: tg.carb, unit: 'g', key: 'carb' },
        { name: 'Fat', have: 0, want: tg.fat, unit: 'g', key: 'fat' }
      ],
      meals: src.meals.map(function (m) {
        return { key: m.key || null, icon: m.icon, name: m.name, at: m.at,
                 slot: slotOf(m),
                 pro: m.pro, carb: m.carb, fat: m.fat, kcal: m.kcal, src: m.src,
                 fibre: m.fibre, sugar: m.sugar, satfat: m.satfat, sodium: m.sodium,
                 base: m.base || null, scale: m.scale || 1 };
      }),
      /* Not a target and not a nag: a pattern this person already has. */
      closing: { at: '7:30', pro: 40 },
      waterMl: src.waterMl,
      waterGoalMl: waterGoal().ml,
      waterGoalComputed: waterGoal().computed,
      /* Taken, not "due": the app knows what was swallowed, not what was
         intended. Two supplements, because that is what lk_supplements holds.
         This screen used to invent four and Recap a different three. */
      supps: (src.supps || []).map(function (sp) {
        return { name: sp.name, dose: sp.dose, when: sp.when, taken: sp.taken };
      }),
      /* Fourteen days of intake against target, the last four of them the
         days above added up. A trend is the only thing a single day cannot
         tell you, which is the whole reason this sheet exists. */
      trend: NUT.trend.slice(),
      /* Dated, and ending on the day the screen is showing. The old series
         was the fixture array, so logging 890 kcal left the last point at
         1,570 and the average at 2,702 under a heading reading "Last fourteen
         days" -- a chart of a day that had already changed. */
      series: (NUT.trendSeries || []).map(function (e) { return { date: e.date, kcal: e.kcal }; })
    };
    return recount(d);
  }

  var DAY = day();

  /* The series, with every day the store knows about laid over the seed and
     today's running total on the end. Read at render time, never stored, so
     it cannot drift from the diary above it. */
  function series(n) {
    var out = (DAY.series || []).map(function (e) { return { date: e.date, kcal: e.kcal }; });
    var byDate = {};
    out.forEach(function (e, i) { byDate[e.date] = i; });
    Object.keys(FUELLOG).forEach(function (iso) {
      var rec = FUELLOG[iso];
      var k = (rec.meals || []).reduce(function (a, m) { return a + (m.kcal || 0); }, 0);
      if (byDate[iso] !== undefined) out[byDate[iso]].kcal = Math.round(k);
    });
    if (byDate[DAY.iso] !== undefined) out[byDate[DAY.iso]].kcal = DAY.eaten;
    return out.slice(-n);
  }

  /* Body weight over the same window, so the two lines can be read against
     each other: intake alone says nothing about whether it is enough. */
  function weightAt(iso) {
    var log = (WEIGHTLOG || []).filter(function (e) { return e && e.date && e.kg && e.date <= iso; });
    if (!log.length) return null;
    return log[log.length - 1].kg;
  }

  /* Module scope and with macros on it, because these rows log. The list was
     a literal inside the sheet's own render function and every row closed the
     sheet without logging anything, under copy that says "one tap logs it
     again with the same portion". */
  /* Counted, not asserted. These were four literals -- 63, 41, 28, 19 -- under
     copy that calls them "how often you log this", beside a log holding four
     days. Now they are the real tallies across every day on file, so a row
     that says 4 has been logged four times and the list reorders itself as
     that changes. */
  function frequent() {
    var tally = {};
    var days = FUELLOG || {};
    Object.keys(days).forEach(function (iso) {
      ((days[iso] || {}).meals || []).forEach(function (m) {
        var k = m.key;
        if (!k || !FOODS[k]) return;
        tally[k] = (tally[k] || 0) + 1;
      });
    });
    return Object.keys(tally).sort(function (a, b) {
      return tally[b] - tally[a] || (FOODS[a].name < FOODS[b].name ? -1 : 1);
    }).slice(0, 4).map(function (k) {
      var f = FOODS[k];
      return { key: k, icon: f.icon, name: f.name, n: tally[k],
               kcal: f.kcal, pro: f.pro, carb: f.carb, fat: f.fat };
    });
  }
  var OFTEN = frequent();   /* rebuilt whenever the log changes */

  /* Saved recipes. A recipe is a food you assembled yourself: it carries its
     own ingredients and yields a number of servings, so logging one serving
     divides rather than making you do arithmetic at the counter.

     Macros here are the recipe's TOTAL, and the total is servings x the same
     per-serving food every other path on this screen logs, so one Chilli is
     one Chilli whether it arrives from the recipe, from the plan or from the
     often list. Per-serving is derived on read, never stored, because a
     stored per-serving figure and a changed serving count disagree the moment
     either one moves. */
  function recipe(key, name, servings, ing) {
    var f = FOODS[key];
    return { icon: f.icon, name: name, servings: servings, key: key,
             kcal: f.kcal * servings, pro: f.pro * servings,
             carb: f.carb * servings, fat: f.fat * servings, ing: ing };
  }
  var RECIPES = [
    recipe('chilli', 'Chilli, big batch', 6,
      ['1 kg beef mince, 5%', '2 tins kidney beans', '2 tins chopped tomatoes',
       '1 onion', '2 peppers', 'Chilli, cumin, paprika']),
    recipe('cnr', 'Chicken and rice, 4 days', 4,
      ['800 g chicken thigh', '400 g rice, dry', '2 tbsp olive oil', 'Soy, garlic, ginger']),
    recipe('pancakes', 'Protein pancakes', 2,
      ['100 g oats', '2 scoops whey', '2 eggs', '150 g skyr', 'Baking powder'])
  ];

  /* Recipes you built yourself, after the three above. A built recipe carries
     its own macro total rather than borrowing a food's, because that is the
     whole point of building one: the figures are the ingredients you chose,
     added up, and one serving is that total divided by the servings you said
     it makes. "Build a recipe" used to toast "not in this build yet". */
  function ownRecipes() {
    var saved = (ST ? ST.get('lk_recipes', []) : []) || [];
    return saved.map(function (r) {
      return {
        own: true, id: r.id, icon: r.icon || '\ud83e\udd63', name: r.name,
        servings: r.servings || 1, key: null,
        kcal: r.kcal, pro: r.pro, carb: r.carb, fat: r.fat,
        ing: (r.items || []).map(function (it) {
          var f = FOODS[it.key];
          return (it.qty === 1 ? '' : it.qty + ' \u00d7 ') + (f ? f.name : it.key);
        }).concat(r.notes || [])
      };
    });
  }
  function allRecipes() { return RECIPES.concat(ownRecipes()); }

  /* The totals a half-built recipe shows while it is being built. Free-text
     lines contribute nothing, and the sheet says so rather than letting a
     reader assume "2 tbsp olive oil" was counted. */
  function draftTotals(d) {
    var t = { kcal: 0, pro: 0, carb: 0, fat: 0 };
    (d.items || []).forEach(function (it) {
      var f = FOODS[it.key];
      if (!f) return;
      t.kcal += f.kcal * it.qty; t.pro += f.pro * it.qty;
      t.carb += f.carb * it.qty; t.fat += f.fat * it.qty;
    });
    return t;
  }

  /* The week's plan. Each slot names a food, and the food carries the
     figures -- a slot used to carry a bare kcal and nothing else, so logging
     a planned meal moved the calorie count and left all three macro bars
     untouched, under-counting 41 g of protein a meal.

     Today's slots are not marked done by hand either. A slot is logged when
     a meal of that name is on today's list, so the plan and the ledger for
     the same day cannot disagree -- and they did: the plan called Monday
     1,760 kcal while the ledger for that Monday held 1,570.

     NOT BUILT, deliberately: the swap-by-AI path. In the shipped app a failed
     swap invented four meals and wrote them into the saved plan as though a
     model had returned them (audit H2). Swapping here picks from your own
     recipes and often-logged meals, which cannot fabricate anything. */
  function slot(at, key) {
    var f = FOODS[key];
    var k = at.toLowerCase();
    var sl = k.indexOf('breakfast') === 0 ? 'breakfast'
           : k === 'lunch' ? 'lunch' : k === 'dinner' ? 'dinner' : 'snack';
    return { at: at, slot: sl, key: key, name: f.name,
             kcal: f.kcal, pro: f.pro, carb: f.carb, fat: f.fat };
  }
  var PLAN = [
    { d: 'Mon', iso: '2026-09-07', slots: [slot('Breakfast', 'eggs'), slot('Lunch', 'bowl'),
        slot('Dinner', 'chilli'), slot('Snack', 'shake'), slot('Second breakfast', 'pancakes'),
        slot('Evening', 'skyr')] },
    { d: 'Tue', iso: '2026-09-08', slots: [slot('Breakfast', 'eggs'), slot('Lunch', 'cnr'),
        slot('Dinner', 'pasta'), slot('Snack', 'shake'), slot('Evening', 'pancakes')] },
    { d: 'Wed', iso: '2026-09-09', slots: [slot('Breakfast', 'eggs'), slot('Lunch', 'bowl'),
        slot('Snack', 'shake'), slot('Dinner', 'chilli')] },
    { d: 'Thu', iso: '2026-09-10', slots: [slot('Breakfast', 'pancakes'), slot('Lunch', 'cnr'),
        slot('Dinner', 'pasta')] },
    { d: 'Fri', iso: '2026-09-11', slots: [slot('Breakfast', 'shake'), slot('Lunch', 'chilli'),
        slot('Dinner', 'bowl')] }
  ];

  /* A swapped meal is a change to the plan, so it is stored. Untouched, the
     plan is the one above. */
  (function () {
    var saved = ST ? ST.get('lk_fuelPlan', null) : null;
    if (!saved || !saved.length) return;
    PLAN.forEach(function (d, di) {
      var sd = saved[di];
      if (!sd || !sd.slots) return;
      d.slots.forEach(function (sl, si) {
        var k = sd.slots[si];
        if (k && FOODS[k] && k !== sl.key) {
          var f = FOODS[k];
          sl.key = k; sl.name = f.name; sl.kcal = f.kcal;
          sl.pro = f.pro; sl.carb = f.carb; sl.fat = f.fat;
        }
      });
    });
  })();

  /* What a recipe is made of, as shopping-list rows. A planned meal that
     cannot reach the list is a document. Foods that are not recipes have no
     ingredient list, so they go on as themselves -- which is honest: "Chilli"
     on a list you wrote yourself means something to you. */
  function planIngredients(days) {
    var want = {};
    days.forEach(function (d) {
      d.slots.forEach(function (sl) {
        var r = null;
        allRecipes().forEach(function (x) { if (x.key === sl.key) r = x; });
        if (r && r.ing && r.ing.length) {
          r.ing.forEach(function (line) { want[line] = (want[line] || 0) + 1; });
        } else {
          want[FOODS[sl.key].name] = (want[FOODS[sl.key].name] || 0) + 1;
        }
      });
    });
    return Object.keys(want).map(function (name) { return { name: name, n: want[name] }; });
  }

  /* Dedupe against what is already on the list and against what is already in
     the cupboard. Adding twelve eggs to a list that says twelve eggs is how a
     list stops being read. */
  function planNew(days) {
    var have = {};
    (stored('lk_shoppingList', []) || []).forEach(function (r) {
      have[String(r.itemName || '').toLowerCase()] = true;
    });
    (stored('lk_pantryItems', []) || []).forEach(function (r) {
      if (!r.empty) have[String(r.name || '').toLowerCase()] = true;
    });
    return planIngredients(days).filter(function (it) {
      var nm = it.name.toLowerCase();
      var hit = false;
      Object.keys(have).forEach(function (h) {
        if (nm.indexOf(h) >= 0 || h.indexOf(nm) >= 0) hit = true;
      });
      return !hit;
    });
  }

  function addPlanToShop(days) {
    var add = planNew(days);
    if (!add.length) { say('Everything on it is already on the list or in the cupboard.'); return; }
    var list = (stored('lk_shoppingList', []) || []).slice();
    var now = Date.now();
    add.forEach(function (it, i) {
      list.push({
        id: 'sh_' + (now + i) + '_plan', itemName: it.name, quantity: it.n, unit: '',
        category: 'pantry', dateAdded: new Date().toISOString(), checked: false
      });
    });
    if (ST && persisting()) ST.set('lk_shoppingList', list);
    render();
    say(add.length + (add.length === 1 ? ' thing' : ' things') + ' added to the list.');
  }

  function savePlan() {
    if (!ST || !persisting()) return;
    ST.set('lk_fuelPlan', PLAN.map(function (d) {
      return { iso: d.iso, slots: d.slots.map(function (sl) { return sl.key; }) };
    }));
  }

  /* What a meal can be swapped for: the food table and your own recipes at
     one serving. Nothing is generated, which is the point -- the shipped
     app's swap invented four meals when the model call failed and wrote them
     into the saved plan as though they had come back from it. */
  function swapChoices(exceptKey) {
    return searchable().filter(function (f) {
      return f.key && f.key !== exceptKey;
    });
  }

  /* A past day is logged from the record; today is logged from what is on
     the list right now. */
  function slotDone(pd, sl) {
    if (pd.iso === DAY.iso) {
      return DAY.meals.some(function (m) { return m.name === sl.name; });
    }
    var rec = NUT.days && NUT.days[pd.iso];
    if (!rec) return false;
    return rec.meals.some(function (m) { return m.name === sl.name; });
  }

  /* What the scanner resolved. One product, because a fixture that changes
     per run makes a screenshot diff meaningless. */
  var SCAN = (function (f) {
    return { icon: f.icon, name: f.name, code: '5 060 123 456 789', key: 'skyr',
             serving: '150 g pot', kcal: f.kcal, pro: f.pro, carb: f.carb, fat: f.fat };
  })(FOODS.skyr);

  /* lk_perfTracking, the switch that makes Stack exist. Read rather than
     cached, so turning it on in Settings and coming back shows the chip. */
  function perfTracking() {
    try { return localStorage.getItem('lk_perfTracking') === 'true'; } catch (e) { return false; }
  }

  var S = { state: 'populated', sheet: null, listening: false, scanServings: 1,
            /* The camera sheet's one question. null until it is answered. */
            camOil: null, toast: null, undo: null, targetError: null, searchQ: '',
            /* Which recipe is open inside the recipes sheet. The list and the
               detail are one sheet with two faces rather than two sheets, so
               Back returns to the list without closing and losing the place. */
            recipeOpen: null };

  /* The same strip Home shows, from the same facts. It is here because
     eating during or straight after a session is exactly when somebody
     leaves the workout screen, and losing the way back is what turns one
     logged meal into an abandoned session. */
  /* The shelf comes from the live session record, not from this screen.
     It used to be hand-written markup gated on a dev state, which meant it
     showed a fixed "Push A, 4 of 7, 38:12" whether or not a workout was
     running, and never showed a real one. The dev state is kept: it seeds a
     session so the demo can show the strip without anybody training. */
  function shelfHTML() {
    return window.LKSession && LKSession.get() ? LKSession.html() : '';
  }

  /* The demo's own "live" state, seeded into the record so the shelf on
     every other screen agrees with this one. */
  function seedDemoSession(on) {
    if (!window.LKSession) return;
    var live = LKSession.get();
    if (on && !live) LKSession.start({ name: 'Push A', startedAt: Date.now() - 2292000, done: 4, total: 7 });
    else if (!on && live && live.name === 'Push A') LKSession.end();
  }

  /* ---------------------------------------------------------------
     Header
     --------------------------------------------------------------- */
  function headerHTML() {
    return '' +
      '<div class="hdr__title stack stack--1">' +
        '<span class="t-meta">' + esc(DAY.date) + '</span>' +
        '<h1 class="hdr__title-large" data-title-large>Fuel</h1>' +
      '</div>' +
      '<span class="hdr__title-small" data-title-small aria-hidden="true">Fuel</span>' +
      /* One header action, the way every other screen has one. Two text
         buttons side by side in a header have no gap between their hit areas,
         so the audit is right to reject them and a thumb would be too. Shop
         is reachable from the More chip and from the plan sheet, which is
         where somebody is when they want it. */
      '<button class="hdr__action" type="button" data-action="fuel-profile" ' +
        'data-testid="hdr-profile">Profile</button>';
  }

  /* ---------------------------------------------------------------
     The hero, and the three ways it can read

     populated   the number left, and what it is left of
     first-weeks a day counter, because the target is still a formula
     hidden      a word, because the number is the thing being hidden
     --------------------------------------------------------------- */
  function hero() {
    /* An empty day has eaten nothing, whatever the fixture says. The fixture
       is shared across the dev states, so the empty state was printing the
       populated day's "1,410 kcal left of 2,980" directly above the words
       "Nothing logged today". */
    var eaten = S.state === 'empty' ? 0 : DAY.eaten;
    var left = DAY.target - eaten;

    if (S.state === 'hidden') {
      return '<div class="fuel-hero" data-testid="hero">' +
        '<div class="stack stack--1">' +
          '<p class="t-title-1" data-testid="hero-value">On track</p>' +
          '<p class="t-footnote quiet">Protein is ahead of pace and the day has room left. ' +
            'Numbers are off in Settings.</p>' +
        '</div></div>';
    }

    if (S.state === 'first-weeks') {
      return '<div class="fuel-hero" data-testid="hero">' +
        '<div class="stack stack--1">' +
          '<p class="t-meta">DAY 3 OF 14</p>' +
          '<p class="fuel-hero__num num" data-testid="hero-value">' + n(Math.abs(left)) + '</p>' +
          '<p class="t-footnote quiet">' + (left < 0 ? 'kcal over ' : 'kcal left of ') +
            n(DAY.target) + ' &middot; ' +
            'the target you set. Nothing has been read off your own trend yet: that needs two ' +
            'weeks of weigh-ins against two weeks of logs.</p>' +
        '</div></div>';
    }

    /* Past the target the figure is what you are over BY, not a negative
       amount remaining. "-210 kcal left" is not a sentence anybody says, and
       a minus sign in front of the biggest number on the screen reads as a
       fault rather than as a fact about lunch. */
    var over = left < 0;
    return '<div class="fuel-hero" data-testid="hero">' +
      '<div class="stack stack--1 grow">' +
        '<p class="fuel-hero__num num" data-testid="hero-value">' + n(Math.abs(left)) + '</p>' +
        '<p class="t-footnote quiet">' + (over ? 'kcal over ' : 'kcal left of ') +
          n(DAY.target) + ' &middot; ' + esc(DAY.goal) + '</p>' +
      '</div>' +
      '<div class="fuel-hero__side stack stack--1">' +
        '<p class="t-subheadline num">' + DAY.weightKg.toFixed(1) + ' kg</p>' +
        (DAY.rate
          ? '<p class="t-caption-2 quiet" data-testid="hero-rate">' + signed(DAY.rate.pct) +
              '% / wk, ' + esc(rateVerdict(DAY.rate.pct, DAY.goalKey)) + '</p>'
          : '<p class="t-caption-2 quiet" data-testid="hero-rate">No rate yet &middot; needs two weigh-ins five days apart</p>') +
      '</div></div>';
  }

  /* The one accent on the screen, holding both fast paths. Two buttons rather
     than one with a mode, because a mode is a thing to get wrong; one control
     because voice and camera are the same job done two ways. */
  function logAction() {
    return '<div class="fuel-log" role="group" aria-label="Log what you ate">' +
      '<button class="fuel-log__half" type="button" data-action="scan" data-testid="log-scan">' +
        ICO.barcode + '<span class="btn__label">Scan</span></button>' +
      '<button class="fuel-log__half" type="button" data-action="mic" data-testid="log-mic">' +
        ICO.mic + '<span class="t-headline">Say it</span>' +
      '</button>' +
      '<button class="fuel-log__half" type="button" data-action="cam" data-testid="log-cam">' +
        ICO.cam + '<span class="t-headline">Snap it</span>' +
      '</button>' +
    '</div>' +
    /* The fourth way, and the ordinary one. Scan, Say it and Snap it each
       need the food to be in front of you; a person eating something new,
       remembered, or already eaten had nowhere to put it. A DOM sweep of
       this screen for a search field returned nothing -- every search box in
       the build belonged to an exercise picker. */
    '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="search" ' +
      'data-testid="log-search"><span class="btn__label">Search foods</span></button>' +
    '<p class="t-caption-1 quiet fuel-log__hint">Search by name, say what you ate, or snap the plate.</p>';
  }

  /* Everything this build can log by name, in one list: the food table the
     rest of the screen logs from, plus your own recipes at one serving. It is
     a demo food table, not a database, and the sheet says so rather than
     implying a search that reaches further than it does. */
  function searchable() {
    var out = [];
    Object.keys(FOODS).forEach(function (k) {
      var f = FOODS[k];
      out.push({ key: k, icon: f.icon, name: f.name, kcal: f.kcal, pro: f.pro,
                 carb: f.carb, fat: f.fat, g: f.g, fibre: f.fibre, sugar: f.sugar,
                 satfat: f.satfat, sodium: f.sodium, from: 'Food table', src: 'table' });
    });
    allRecipes().forEach(function (r, i) {
      out.push({ recipe: i, icon: r.icon, name: r.name + ', one serving',
                 kcal: Math.round(r.kcal / r.servings), pro: Math.round(r.pro / r.servings),
                 carb: Math.round(r.carb / r.servings), fat: Math.round(r.fat / r.servings),
                 from: 'Your recipes', src: 'recipe' });
    });
    return out;
  }

  /* How often a food has been logged, which is the one ranking signal this
     app actually has. A food database ranks by how many people ate a thing;
     this one can only rank by how often YOU did, and that is the better
     signal anyway for a list of eight. */
  function logCount(key) {
    var nn = 0;
    Object.keys(FUELLOG).forEach(function (iso) {
      ((FUELLOG[iso] || {}).meals || []).forEach(function (m) { if (m.key === key) nn++; });
    });
    return nn;
  }

  /* Specific beats generic, and what you eat beats what you do not. A query
     that matches the start of a name outranks one that matches the middle, a
     whole-word match outranks a fragment, a shorter name outranks a longer
     one carrying the same word, and anything you have logged is lifted by how
     often. The list used to come back in table order whatever was typed, so
     "chicken" put Chicken rice bowl above Chicken and rice for no reason at
     all and the ordering carried no information. */
  function rank(f, q) {
    if (!q) return logCount(f.key) * 2;
    var nm = f.name.toLowerCase();
    var at = nm.indexOf(q);
    if (at < 0) return -1;
    var sc = 20;
    if (at === 0) sc += 30;
    else if (' ,'.indexOf(nm.charAt(at - 1)) >= 0) sc += 18;
    if (nm.length === q.length) sc += 25;
    sc -= Math.min(15, Math.round((nm.length - q.length) / 3));
    sc += Math.min(20, logCount(f.key) * 3);
    if (f.recipe !== undefined) sc += 4;   /* your own recipe, over a table row */
    return sc;
  }

  function searchHits(q) {
    return searchable().map(function (f) { return { f: f, s: rank(f, q) }; })
      .filter(function (e) { return e.s >= 0; })
      .sort(function (a, b) { return b.s - a.s || (a.f.name < b.f.name ? -1 : 1); })
      .map(function (e, i) { e.f.best = i === 0 && !!q; return e.f; });
  }

  /* ---------------------------------------------------------------
     Reading a sentence
     --------------------------------------------------------------- */

  /* "2 eggs and toast with a whey shake" -> two eggs and one shake.

     It matches BEFORE it splits, and that ordering is the whole design. The
     first version split on "and" and then matched each piece, which broke
     "chicken and rice" into two pieces that matched nothing, and turned
     "2 eggs and toast" into two separate meals because "toast" matches the
     eggs row on its own. Splitting a sentence into pieces destroys the
     phrases the foods are actually named by.

     So: find the longest alias anywhere in the text, claim that span, read
     the quantity and unit sitting immediately in front of it, and repeat on
     what is left. Whatever is never claimed and is not a joining word is
     reported as unmatched rather than dropped, so the preview accounts for
     the whole sentence and not just the half the parser understood. */
  var UNIT_G = NUT.unitG || {};
  var NUMWORD = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5,
                  six: 6, seven: 7, eight: 8, nine: 9, ten: 10,
                  half: 0.5, couple: 2, dozen: 12 };
  var JOINER = { and: 1, with: 1, plus: 1, then: 1, of: 1, some: 1, a: 1, an: 1,
                 the: 1, i: 1, had: 1, ate: 1, for: 1, my: 1, '': 1 };

  function aliasList() {
    var out = [];
    Object.keys(FOODS).forEach(function (k) {
      var f = FOODS[k];
      [f.name.toLowerCase()].concat(f.alias || []).forEach(function (a) {
        out.push({ key: k, a: a });
      });
    });
    /* Longest first, so "chicken and rice" is claimed before "rice" and
       "whey shake" before "shake". */
    return out.sort(function (x, y) { return y.a.length - x.a.length; });
  }

  function parseMeal(text) {
    var raw = String(text || '').toLowerCase().replace(/[.!?]/g, ' ');
    var claimed = [];                 /* [start, end) spans already taken */
    var found = [];
    var taken = function (i, j) {
      for (var c = 0; c < claimed.length; c++) {
        if (i < claimed[c][1] && j > claimed[c][0]) return true;
      }
      return false;
    };
    aliasList().forEach(function (e) {
      var from = 0, at;
      while ((at = raw.indexOf(e.a, from)) >= 0) {
        var end = at + e.a.length;
        /* Whole words only: "rice" must not match inside "priced". */
        var beforeOk = at === 0 || /[^a-z]/.test(raw.charAt(at - 1));
        var afterOk = end >= raw.length || /[^a-z]/.test(raw.charAt(end));
        if (beforeOk && afterOk && !taken(at, end)) {
          claimed.push([at, end]);
          found.push({ key: e.key, at: at, end: end });
        }
        from = at + 1;
      }
    });
    found.sort(function (x, y) { return x.at - y.at; });

    /* The quantity and unit are whatever sits between the end of the last
       claimed span and the start of this one. */
    var items = [], cursor = 0;
    found.forEach(function (f) {
      var lead = raw.slice(cursor, f.at);
      var q = readQty(lead);
      items.push(matchFood(f.key, q.qty, q.unit, raw.slice(f.at, f.end)));
      leftover(lead.replace(q.consumed, ' '), items);
      cursor = f.end;
    });
    leftover(raw.slice(cursor), items);
    return items;
  }

  /* The number and unit in front of a food. "2", "200 g", "a couple of",
     "half a" -- and nothing, which means one serving. */
  function readQty(lead) {
    var qty = 1, unit = null, consumed = '';
    var toks = lead.split(/[^a-z0-9.]+/).filter(Boolean);
    for (var i = toks.length - 1; i >= 0; i--) {
      var t = toks[i];
      if (UNIT_G[t] !== undefined && unit === null) { unit = t; consumed = t; continue; }
      if (/^[0-9]+(\.[0-9]+)?$/.test(t)) { qty = parseFloat(t); consumed = t; break; }
      if (NUMWORD[t] !== undefined) { qty = NUMWORD[t]; consumed = t; break; }
      if (JOINER[t]) continue;
      break;                          /* a real word: not part of the quantity */
    }
    return { qty: qty, unit: unit, consumed: consumed };
  }

  /* Words nobody claimed. Joining words and bare numbers are not reported as
     unrecognised food, because "and" is not a thing somebody ate. */
  function leftover(text, items) {
    var t = String(text || '').replace(/[^a-z0-9 ]/g, ' ').trim();
    if (!t) return;
    var words = t.split(/\s+/).filter(function (w) {
      return !JOINER[w] && NUMWORD[w] === undefined && UNIT_G[w] === undefined &&
             !/^[0-9.]+$/.test(w);
    });
    if (!words.length) return;
    items.push({ raw: words.join(' '), name: words.join(' '), qty: 1, unit: null, key: null });
  }

  function matchFood(key, qty, unit, raw) {
    var f = FOODS[key];
    /* Grams, three ways: a weight unit converts, a serving-shaped unit means
       the food's own serving, and a bare count means that many servings. */
    var grams = (unit && UNIT_G[unit] > 0) ? qty * UNIT_G[unit] : qty * f.g;
    var k = grams / f.g;
    var item = { raw: raw, name: f.name, qty: qty, unit: unit, key: key,
                 grams: Math.round(grams), icon: f.icon,
                 kcal: Math.round(f.kcal * k), pro: Math.round(f.pro * k * 10) / 10,
                 carb: Math.round(f.carb * k * 10) / 10, fat: Math.round(f.fat * k * 10) / 10 };
    MICROS.forEach(function (mi) {
      if (typeof f[mi.key] === 'number') item[mi.key] = Math.round(f[mi.key] * k * 10) / 10;
    });
    return item;
  }

  function macros() {
    if (S.state === 'hidden') {
      var words = ['Ahead', 'On pace', 'On pace'];
      return '<div class="card mt-4" data-testid="macros">' +
        DAY.macros.map(function (m, i) {
          return '<div class="fuel-macro">' +
            '<div class="hstack"><span class="t-subheadline grow">' + esc(m.name) + '</span>' +
            '<span class="t-footnote quiet">' + words[i] + '</span></div>' +
            '<div class="meter meter--quiet mt-2"><span class="meter__fill" style="width:' +
              Math.round(m.have / m.want * 100) + '%"></span></div>' +
          '</div>';
        }).join('') + '</div>';
    }
    /* The card is a button. The targets moved with every log and there was no
       way to set one -- not on this screen and not in Settings -- so the
       three figures the whole screen is measured against were the only
       numbers in the app nobody could choose. */
    return '<button class="card mt-4" type="button" data-action="targets" ' +
      'data-testid="macros" aria-label="Macro targets, edit">' +
      DAY.macros.map(function (m) {
        var pct = Math.min(100, Math.round(m.have / m.want * 100));
        return '<div class="fuel-macro">' +
          '<div class="hstack">' +
            '<span class="t-subheadline grow">' + esc(m.name) + '</span>' +
            '<span class="t-footnote num"><strong>' + m.have + '</strong> / ' + m.want + ' ' + m.unit + '</span>' +
          '</div>' +
          '<div class="meter meter--quiet mt-2" role="img" aria-label="' + esc(m.name) + ', ' + m.have +
            ' of ' + m.want + ' ' + m.unit + '"><span class="meter__fill" style="width:' + pct + '%"></span></div>' +
        '</div>';
      }).join('') + '</button>';
  }

  /* A badge is a claim about where a number came from. Verified means a
     barcode or a database row; Estimate means a model looked at a photo. */
  /* Four provenances, four words. 'recipe', 'plan' and 'repeat' used to fall
     through to Estimate, whose detail copy says a model read a photo -- so a
     meal built from weighed ingredients was captioned as a camera guess. */
  var SRC = {
    verified: { word: 'Verified', cls: 'badge--ok', testid: 'badge-verified',
      why: 'A barcode matched a database row, so the figures are the manufacturer\u2019s own.' },
    estimate: { word: 'Estimate', cls: 'badge--est', testid: 'badge-estimate',
      why: 'A model read the photo and estimated the portion. Expect it to be within about 15%, ' +
           'and correct it with the portion controls if it looks wrong.' },
    /* A food-table row is not barcode evidence. Every row of the search sheet
       used to be stamped 'verified', so logging Chilli from a typed search
       earned a Verified badge and the sheet told the reader "a barcode matched
       a database row". Nothing was scanned. */
    table: { word: 'Table', cls: 'badge--est', testid: 'badge-table',
      why: 'Picked from the built-in food table. The figures are that table\u2019s standard ' +
           'portion, not a measurement of what was on your plate, so correct the portion if ' +
           'yours was bigger or smaller.' },
    recipe: { word: 'Recipe', cls: 'badge--est', testid: 'badge-recipe',
      why: 'One serving of a recipe you built. The figures are your own ingredients divided by ' +
           'the number of servings you said it makes.' },
    plan: { word: 'Planned', cls: 'badge--est', testid: 'badge-plan',
      why: 'Logged from this week\u2019s plan. The figures are the ones the planned meal carries.' },
    repeat: { word: 'Repeat', cls: 'badge--est', testid: 'badge-repeat',
      why: 'A meal you have logged before, logged again with the same portion. The figures are ' +
           'the ones saved then, and no new measurement was taken.' }
  };
  function srcOf(src) { return SRC[src] || SRC.estimate; }
  function badge(src) {
    var d = srcOf(src);
    return '<span class="badge ' + d.cls + '" data-testid="' + d.testid + '">' + d.word + '</span>';
  }

  function mealRow(m, i) {
    return '<button class="row" type="button" data-action="meal" data-i="' + i +
        '" data-testid="meal-' + i + '">' +
      '<span class="fuel-thumb" aria-hidden="true">' + m.icon + '</span>' +
      '<span class="row__main stack">' +
        '<span class="row__title">' + esc(m.name) + '</span>' +
        /* All three macros, not protein alone. Two of the three bars on this
           screen could not be checked against anything a meal showed, which
           is why a 10 g carb and 14 g fat discrepancy sat there unseen. */
        '<span class="row__sub">' + esc(m.at) + ' &middot; ' + n(m.pro) + ' P &middot; ' +
          n(m.carb) + ' C &middot; ' + n(m.fat) + ' F</span>' +
      '</span>' +
      /* The badge belongs with the number, not with the time: it is a claim
         about where that number came from. It also stays when the numbers are
         hidden, because "a barcode read this" is not itself a calorie count. */
      '<span class="fuel-src">' +
        (S.state === 'hidden' ? '' : '<span class="row__value num">' + n(m.kcal) +
          '<small class="t-caption-2 quiet"> kcal</small></span>') +
        badge(m.src) +
      '</span>' +
      '<span class="row__chev">' + ICO.chev + '</span>' +
    '</button>';
  }

  /* The day, grouped. Every meal used to go into one flat list in log order,
     so a shake at 3:15 sat between lunch and dinner with nothing saying which
     was which, and there was no way to read "breakfast was 540 kcal" off the
     screen at all. Each slot that has something in it gets a heading and its
     own kcal and P/C/F footer; the slots that are empty are not drawn, because
     four empty headings is a form, not a diary.

     The index in data-i is the meal's index in DAY.meals, not its place in the
     group. Grouping the rows without carrying the original index would make
     every tap after breakfast open the wrong meal. */
  function slotGroups() {
    var by = {};
    DAY.meals.forEach(function (m, i) {
      var k = slotOf(m);
      (by[k] = by[k] || []).push({ m: m, i: i });
    });
    return SLOTS.filter(function (sl) { return by[sl[0]] && by[sl[0]].length; })
      .map(function (sl) {
        var g = by[sl[0]];
        var t = { kcal: 0, pro: 0, carb: 0, fat: 0 };
        g.forEach(function (e) {
          t.kcal += e.m.kcal || 0; t.pro += e.m.pro || 0;
          t.carb += e.m.carb || 0; t.fat += e.m.fat || 0;
        });
        return { key: sl[0], name: sl[1], entries: g, total: t };
      });
  }

  /* Chosen at log time, not inferred after the fact. The picker defaults to
     what the clock says and is one tap wide, so the common case costs nothing
     and the 10pm dinner is still one tap from right. */
  function slotPicker(sel, act, testid) {
    return '<div class="seg seg--lg mt-3" role="radiogroup" aria-label="Part of the day" ' +
        'data-testid="' + testid + '">' +
      SLOTS.map(function (sl) {
        return '<button class="seg__item" type="button" role="radio" ' +
          'aria-checked="' + (sel === sl[0]) + '" data-action="' + act + '" ' +
          'data-slot="' + sl[0] + '" data-testid="' + testid + '-' + sl[0] + '">' +
          sl[1] + '</button>';
      }).join('') + '</div>';
  }

  function slotFooter(t) {
    if (S.state === 'hidden') {
      return '<div class="row row--foot" data-testid="slot-foot">' +
        '<span class="row__sub grow">' + n(Math.round(t.pro)) + ' P \u00b7 ' +
          n(Math.round(t.carb)) + ' C \u00b7 ' + n(Math.round(t.fat)) + ' F</span></div>';
    }
    return '<div class="row row--foot" data-testid="slot-foot">' +
      '<span class="row__sub grow">' + n(Math.round(t.pro)) + ' P \u00b7 ' +
        n(Math.round(t.carb)) + ' C \u00b7 ' + n(Math.round(t.fat)) + ' F</span>' +
      '<span class="row__sub num">' + n(Math.round(t.kcal)) + ' kcal</span></div>';
  }

  /* Folded away by default. Four more bars under the three that matter most
     would make the top of the screen a dashboard; behind one tap they are
     there when somebody goes looking, which is what a micronutrient is. */
  function microPanel() {
    if (S.state === 'empty') return '';
    var t = microTotals(DAY.meals);
    var missing = DAY.meals.filter(function (m) {
      return typeof m.fibre !== 'number';
    }).length;
    if (!S.microOpen) {
      return '<button class="btn btn--tertiary btn--block mt-2" type="button" data-action="micros" ' +
        'aria-expanded="false" data-testid="micros-toggle">' +
        '<span class="btn__label">Fibre, sugar, saturated fat, sodium</span></button>';
    }
    return '<button class="btn btn--tertiary btn--block mt-2" type="button" data-action="micros" ' +
        'aria-expanded="true" data-testid="micros-toggle">' +
        '<span class="btn__label">Hide fibre, sugar, saturated fat, sodium</span></button>' +
      '<div class="card mt-2" data-testid="micros">' +
        MICROS.map(function (mi, i) {
          var have = t[mi.key], ref = MREF[mi.key] || 1;
          var pct = Math.min(100, Math.round(have / ref * 100));
          var overDone = mi.aim === 'less' ? have > ref : have >= ref;
          return '<div class="fuel-macro' + (i ? ' mt-3' : '') + '">' +
            '<div class="hstack"><span class="t-subheadline grow">' + esc(mi.name) + '</span>' +
              '<span class="t-subheadline num">' + n(have) + ' / ' + n(ref) + ' ' + mi.unit + '</span></div>' +
            '<div class="meter meter--quiet mt-2" role="img" aria-label="' + esc(mi.name) + ', ' +
                n(have) + ' of ' + n(ref) + ' ' + mi.unit + '">' +
              '<span class="meter__fill" style="width:' + pct + '%"></span></div>' +
            '<p class="t-caption-2 quiet mt-1">' +
              (mi.aim === 'less'
                ? (overDone ? 'Over the daily reference.' : n(Math.round((ref - have) * 10) / 10) + ' ' + mi.unit + ' before it is.')
                : (overDone ? 'There for the day.' : n(Math.round((ref - have) * 10) / 10) + ' ' + mi.unit + ' short.')) +
            '</p>' +
          '</div>';
        }).join('') +
        (missing
          ? '<p class="t-caption-1 quiet mt-3" data-testid="micros-gap">' + missing +
            (missing === 1 ? ' meal on today\u2019s list has' : ' meals on today\u2019s list have') +
            ' no breakdown \u2014 a photo estimate and a typed entry carry energy and macros ' +
            'only, so these four are under-counted rather than wrong.</p>'
          : '') +
      '</div>';
  }

  /* Water, on the screen rather than three taps into a sheet. It was a chip
     among six, which is where a thing goes when nobody has decided whether it
     matters. */
  function waterCard() {
    var pct = Math.min(100, Math.round(DAY.waterMl / DAY.waterGoalMl * 100));
    var oz = !!(stored('lk_fuelProfile', {}) || {}).flOz;
    var show = function (ml) {
      return oz ? (ml / 29.5735).toFixed(0) + ' fl oz' : n(ml) + ' ml';
    };
    return '<div class="card mt-4" data-testid="water-card">' +
      '<div class="hstack hstack--3">' +
        '<span class="t-subheadline grow">Water</span>' +
        '<span class="t-subheadline num" data-testid="water-card-value">' + show(DAY.waterMl) +
          ' / ' + show(DAY.waterGoalMl) + '</span>' +
        '<button class="btn btn--sm btn--tertiary" type="button" data-action="water-unit" ' +
          'aria-label="Show water in ' + (oz ? 'millilitres' : 'fluid ounces') + '" ' +
          'data-testid="water-unit">' + (oz ? 'ml' : 'fl oz') + '</button>' +
      '</div>' +
      '<div class="meter meter--quiet mt-2" role="img" aria-label="' + pct +
        ' per cent of today\u2019s water">' +
        '<span class="meter__fill" style="width:' + pct + '%"></span></div>' +
      '<div class="hstack hstack--3 mt-3">' +
        '<button class="btn btn--secondary grow" type="button" data-action="water-add" ' +
          'data-testid="water-card-250"><span class="btn__label">+ ' + show(250) + '</span></button>' +
        '<button class="btn btn--secondary grow" type="button" data-action="water-add5" ' +
          'data-testid="water-card-500"><span class="btn__label">+ ' + show(500) + '</span></button>' +
        '<button class="btn btn--secondary" type="button" data-action="water" ' +
          'data-testid="water-card-open"><span class="btn__label">More</span></button>' +
      '</div>' +
    '</div>';
  }

  /* The weigh-in, where the target that depends on it is. Progress owns the
     history; this is the one field, on the screen that uses it. */
  function weightCard() {
    var r = DAY.rate;
    var last = (WEIGHTLOG || [])[WEIGHTLOG.length - 1];
    var today = last && last.date === DAY.iso;
    return '<div class="card mt-4" data-testid="weight-card">' +
      '<div class="hstack hstack--3">' +
        '<span class="t-subheadline grow">Body weight</span>' +
        '<span class="t-subheadline num">' + (DAY.weightKg ? DAY.weightKg.toFixed(1) + ' kg' : '\u2014') + '</span>' +
      '</div>' +
      '<p class="t-caption-1 quiet mt-1">' +
        (today ? 'Weighed in today.'
          : r ? 'Last weighed ' + (last ? dayLabel(last.date) : '') + ' \u00b7 ' +
                signed(r.pct) + '% a week'
          : 'No weigh-ins yet.') + '</p>' +
      '<div class="hstack hstack--3 mt-3">' +
        '<input class="input num grow" id="wt-new" type="number" min="20" max="400" step="0.1" ' +
          'inputmode="decimal" placeholder="' + (DAY.weightKg ? DAY.weightKg.toFixed(1) : '70.0') + '" ' +
          'aria-label="Today\u2019s weight in kilograms" data-testid="weight-input">' +
        '<button class="btn btn--secondary" type="button" data-action="weigh-in" ' +
          'data-testid="weigh-in"><span class="btn__label">Save</span></button>' +
      '</div>' +
    '</div>';
  }

  /* A meal that fits what is left, picked from the table rather than invented.
     It says WHY it fits, because a suggestion without a reason is an
     instruction. */
  function suggestCard() {
    var left = DAY.target - DAY.eaten;
    var proLeft = DAY.macros[0].want - DAY.macros[0].have;
    if (left < 150) return '';
    var best = null, bestScore = -1;
    Object.keys(FOODS).forEach(function (k) {
      var f = FOODS[k];
      if (f.kcal > left) return;
      /* Closest to filling the protein gap without overshooting the calories. */
      var sc = Math.min(f.pro, Math.max(proLeft, 0)) * 3 - Math.abs(left - f.kcal) / 40;
      if (sc > bestScore) { bestScore = sc; best = k; }
    });
    if (!best) return '';
    var f = FOODS[best];
    var after = left - f.kcal;
    return '<div class="card mt-4" data-testid="suggest-card">' +
      '<div class="hstack hstack--3">' +
        '<span class="fuel-thumb" aria-hidden="true">' + f.icon + '</span>' +
        '<span class="row__main stack grow">' +
          '<span class="row__title">' + esc(f.name) + '</span>' +
          '<span class="row__sub">' + n(f.kcal) + ' kcal \u00b7 ' + n(f.pro) + ' g protein</span>' +
        '</span>' +
      '</div>' +
      '<p class="t-caption-1 quiet mt-2" data-testid="suggest-why">' +
        (proLeft > 0
          ? 'It covers ' + n(Math.min(f.pro, proLeft)) + ' g of the ' + n(proLeft) + ' g of protein left'
          : 'Protein is already closed') +
        ' and leaves ' + n(after) + ' kcal of the day.</p>' +
      '<button class="btn btn--secondary btn--block mt-3" type="button" data-action="suggest-log" ' +
        'data-k="' + best + '" data-testid="suggest-log">' +
        '<span class="btn__label">Add it to today</span></button>' +
    '</div>';
  }

  /* What the target should be, from what the body actually did. Behind a
     disclosure, because a number that moves a target has to be able to show
     its working or it is just an oracle. */
  function tdeeCard() {
    var a = adaptive();
    if (!a || a.meas === null) return '';
    if (Math.abs(a.move) < 20) return '';
    return '<div class="card mt-4" data-testid="tdee-card">' +
      '<div class="hstack hstack--3">' +
        '<span class="t-subheadline grow">Your target looks ' +
          (a.move > 0 ? 'low' : 'high') + '</span>' +
        '<button class="iconbtn" type="button" data-action="tdee-why" ' +
          'aria-expanded="' + (!!S.tdeeWhy) + '" aria-label="How this was worked out" ' +
          'data-testid="tdee-why">' + ICO.alert + '</button>' +
      '</div>' +
      '<p class="t-detail mt-2">' + n(DAY.target) + ' now, ' + n(a.want) + ' on the evidence ' +
        'of the last ' + a.days + ' days. That is ' + signed(a.move).replace('.00', '') +
        ' kcal' + (a.clamped ? ', which is as far as this will move a target in one go' : '') + '.</p>' +
      (S.tdeeWhy
        ? '<div class="card card--sunken mt-3" data-testid="tdee-working">' +
            '<div class="hstack hstack--3"><span class="t-body grow">What you spent, measured</span>' +
              '<span class="t-body-em num">' + n(a.meas) + ' kcal</span></div>' +
            '<div class="hstack hstack--3 mt-2"><span class="t-body grow">What the formula says</span>' +
              '<span class="t-body-em num">' + (a.est ? n(a.est) + ' kcal' : '\u2014') + '</span></div>' +
            '<div class="hstack hstack--3 mt-2"><span class="t-body grow">Blended, 70 to 30</span>' +
              '<span class="t-body-em num">' + n(a.tdee) + ' kcal</span></div>' +
            '<div class="hstack hstack--3 mt-2"><span class="t-body grow">For ' +
                esc(GOAL_WORD[goalKey()]) + '</span>' +
              '<span class="t-body-em num">' + (GOAL_OFFSET[goalKey()] >= 0 ? '+' : '\u2212') +
                n(Math.abs(GOAL_OFFSET[goalKey()])) + ' kcal</span></div>' +
            '<p class="t-caption-1 quiet mt-2">The measurement is your average intake over those ' +
              'days plus whatever your weight change accounts for, at roughly 7,700 kcal a kilo. ' +
              'The formula is Mifflin-St Jeor at ' + esc(activityKey()) + ' activity, which knows ' +
              'your height and your age and nothing else about you. The measurement is weighted ' +
              'higher because it is better, and not weighted at 100 because it is noisy.</p>' +
          '</div>'
        : '') +
      '<div class="hstack hstack--3 mt-3">' +
        '<button class="btn btn--secondary grow" type="button" data-action="tdee-take" ' +
          'data-v="' + a.want + '" data-testid="tdee-take">' +
          '<span class="btn__label">Use ' + n(a.want) + '</span></button>' +
        '<button class="btn btn--tertiary" type="button" data-action="tdee-keep" ' +
          'data-testid="tdee-keep"><span class="btn__label">Keep mine</span></button>' +
      '</div>' +
    '</div>';
  }

  function today() {
    var groups = slotGroups();
    var rows = groups.map(function (g) {
      return '<div class="section__sub" data-testid="slot-' + g.key + '">' +
          '<h3 class="t-label">' + esc(g.name) + '</h3></div>' +
        g.entries.map(function (e) { return mealRow(e.m, e.i); }).join('') +
        slotFooter(g.total);
    }).join('');
    /* The empty slot is a pattern, not a target. "About 40g protein closes
       today" is something this person already does; "600 calories to beat"
       would be a number invented to be chased. */
    /* A line icon, where the three logged meals carry colour emoji. That is
       not an inconsistency, it is the distinction: an emoji here is the food,
       and this row has no food in it. It is an instruction about a meal that
       has not happened. A flat grey 🍽 next to three colour glyphs read as a
       rendering failure; a clock from the icon family reads as what it is. */
    /* It reads the day it sits under. The row used to be a fixed string, so
       after logging 4,000 kcal with protein at 265 of 160 g it still said
       "about 40 g protein closes today" -- advice, in the voice of the app,
       about a day that had already finished. */
    var proLeft = DAY.macros[0].want - DAY.macros[0].have;
    var kcalLeft = DAY.target - DAY.eaten;
    /* Named "Dinner" whatever the day held, so it sat under a dinner that had
       already been logged. It is the first slot with nothing in it. */
    var filled = {};
    groups.forEach(function (g) { filled[g.key] = true; });
    var closingSlot = 'Snack';
    for (var ci = 0; ci < SLOTS.length; ci++) {
      if (!filled[SLOTS[ci][0]]) { closingSlot = SLOTS[ci][1]; break; }
    }
    var closingSub;
    if (kcalLeft <= 0 && proLeft <= 0) {
      closingSub = 'Both closed. Nothing has to go in after this.';
    } else if (proLeft <= 0) {
      closingSub = 'Protein is closed. ' + n(kcalLeft) + ' kcal left if you want them.';
    } else if (kcalLeft <= 0) {
      closingSub = n(proLeft) + ' g of protein short, and the calories are spent.';
    } else {
      /* The usual time belongs to the meal that closes the day. Naming the
         first empty slot made it say "Usually 7:30" under Breakfast. */
      closingSub = (closingSlot === 'Dinner' ? 'Usually ' + esc(DAY.closing.at) + ' \u00b7 ' : '') +
        n(proLeft) + ' g of protein and ' + n(kcalLeft) + ' kcal left to close today.';
    }
    var closing = '<div class="row row--quiet" data-testid="meal-closing">' +
      '<span class="fuel-thumb fuel-thumb--ico" aria-hidden="true">' + ICO.clock + '</span>' +
      '<span class="row__main stack">' +
        '<span class="row__title">' + esc(closingSlot) + '</span>' +
        '<span class="row__sub">' + closingSub + '</span>' +
      '</span>' +
      '<span class="fuel-src"><span class="row__value quiet">&mdash;</span></span>' +
      '<span class="row__chev" aria-hidden="true"></span></div>';

    return '<div class="section">' +
      '<div class="section__head">' +
        '<h2 class="t-label">Today</h2>' +
        '<button class="hdr__action" type="button" data-action="meals" data-testid="open-meals">Meals</button>' +
      '</div>' +
      '<div class="card card--flush">' + rows + closing + '</div>' +
    '</div>';
  }

  /* Everything that is not logging. Quiet chips, because a fake button row is
     how a screen ends up with five things competing for one job. */
  function chips() {
    var items = [['trends', 'Trends'], ['water', 'Water'], ['supps', 'Supps'],
                 ['recipes', 'Recipes'], ['plan', 'Plan']];
    /* Stack is gated and stays invisible until it is switched on -- not
       disabled, not greyed, absent. A chip that says "Stack" to somebody who
       has never turned it on is the feature announcing itself, which is the
       one thing a gate like this exists to prevent. */
    if (perfTracking()) items.push(['stack', 'Stack']);
    items.push(['more', 'More']);
    return '<div class="chiprow mt-4" data-testid="fuel-chips">' +
      items.map(function (c) {
        return '<button class="chip" type="button" data-action="' + c[0] +
          '" data-testid="chip-' + c[0] + '">' + c[1] + '</button>';
      }).join('') + '</div>';
  }

  /* ---------------------------------------------------------------
     Views
     --------------------------------------------------------------- */
  var VIEWS = {};

  VIEWS.populated = function () {
    return '<div>' + hero() + logAction() + macros() + microPanel() + '</div>' +
      today() +
      '<div>' + (S.tdeeDismissed ? '' : tdeeCard()) + suggestCard() +
        waterCard() + weightCard() + chips() + '</div>';
  };
  VIEWS['first-weeks'] = VIEWS.populated;
  VIEWS.hidden = VIEWS.populated;
  VIEWS.live = VIEWS.populated;
  VIEWS['stack-on'] = VIEWS.populated;

  VIEWS.empty = function () {
    return '<div>' + hero() + logAction() + '</div>' +
      '<div class="empty mt-5" data-testid="state-empty">' +
        '<p class="empty__title">Nothing logged today</p>' +
        '<p class="empty__body">Say what you ate or snap the plate. The first one takes ' +
          'about ten seconds and the rest get faster, because it learns what you eat.</p>' +
      '</div>';
  };

  VIEWS.loading = function () {
    return '<div role="status" aria-busy="true" aria-label="Loading today">' +
      '<div class="skel" style="height: 56px; width: 60%"></div>' +
      '<div class="skel mt-2" style="height: var(--sp-4); width: 78%"></div>' +
      '<div class="skel mt-4" style="height: 64px"></div>' +
      '<div class="card mt-4">' +
        '<div class="skel" style="height: var(--sp-4); width: 40%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-2)"></div>' +
        '<div class="skel mt-4" style="height: var(--sp-4); width: 36%"></div>' +
        '<div class="skel mt-3" style="height: var(--sp-2)"></div>' +
      '</div></div>';
  };

  VIEWS.error = function () {
    return '<div class="mt-4" data-testid="state-error">' +
      '<div class="banner banner--error">' + ICO.alert +
        '<span><strong>Today did not load</strong>What you logged is on this device and is not lost. ' +
          'The targets need the server and it did not answer.</span></div>' +
      '<button class="btn btn--primary btn--block mt-4" type="button" data-action="retry" data-testid="retry">' +
        '<span class="btn__label">Try again</span></button>' +
      '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="mic" data-testid="log-offline">' +
        '<span class="btn__label">Log anyway, without targets</span></button>' +
    '</div>';
  };

  /* ---------------------------------------------------------------
     Sheets. Both fast paths open one, and both say what they are doing
     rather than spinning.
     --------------------------------------------------------------- */
  /* A logged row, opened. Everything the log knows about one entry, and the
     two things you can do to it: change what it was, or take it back. */
  function mealSheet(m, i) {
    var pct = Math.round(m.kcal / DAY.target * 100);
    return '<div class="scrim" data-action="close" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ml-title" ' +
        'data-detents="0.55 0.88" data-testid="sheet-meal">' +
        '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
        '<div class="sheet__head">' +
          '<span class="fuel-thumb" aria-hidden="true">' + m.icon + '</span>' +
          '<h2 class="t-headline grow" id="ml-title">' + esc(m.name) + '</h2>' +
          '<button class="iconbtn" type="button" data-action="close" aria-label="Close" data-testid="meal-close">' +
