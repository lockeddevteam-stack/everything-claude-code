  VIEWS['diff-updated']  = function () { return full(DATA['diff-updated']); };

  /* Nothing logged. The old screen printed WORKOUT COMPLETE over zero
     sets and left both save paths live. There is no Save control here
     at all, and the copy says what will and will not happen. */
  VIEWS.empty = function () {
    return {
      body: '<div class="empty mt-5 enter-rise" data-testid="card-nothing-logged">' +
              '<span class="empty__ico">' + ICO.empty + '</span>' +
              '<h2 class="empty__title">Nothing logged</h2>' +
              '<p class="empty__body">No sets were completed, so there is nothing to save ' +
                'and nothing will be added to your history.</p>' +
              '<button class="btn btn--primary" data-testid="action-back-to-workout">' +
                '<span class="btn__label">Back to workout</span></button>' +
            '</div>' +
            discardSection(0),
      bar: '', overlay: ''
    };
  };

  /* Loading. The prior session is being read off the device. Save waits,
     because a comparison is the point and a save before the totals are
     known is a save of an unknown thing. */
  VIEWS.loading = function () {
    return {
      body: '<div class="skel mt-2" style="height: var(--sp-4); width: 65%"></div>' +
            '<div class="section" role="status" aria-busy="true" aria-label="Reading your last Push session">' +
              '<div class="card">' +
                '<div class="skel" style="height: var(--sp-6); width: 45%"></div>' +
                '<div class="skel mt-3" style="height: var(--sp-4); width: 70%"></div>' +
              '</div>' +
              '<div class="card mt-3">' +
                '<div class="skel" style="height: var(--sp-5)"></div>' +
                '<div class="skel mt-4" style="height: var(--sp-5)"></div>' +
                '<div class="skel mt-4" style="height: var(--sp-5)"></div>' +
                '<div class="skel mt-4" style="height: var(--sp-5)"></div>' +
                '<div class="skel mt-4" style="height: var(--sp-5)"></div>' +
              '</div>' +
            '</div>',
      bar: saveBar({ disabled: true, status: 'Reading your last Push session' }), overlay: ''
    };
  };

  /* Error. The comparison failed; the session did not. The failure is
     named, the totals that ARE known are still shown, and Save stays
     the primary action rather than being held hostage to a read that
     the lifter did not ask for. */
  VIEWS.error = function () {
    var d = DATA.error;
    return {
      body: receipt(d) +
            '<div class="section" data-testid="section-compare-error">' +
              '<div class="banner banner--error" role="alert">' + ICO.alert +
                '<span><strong>No comparison available</strong>' +
                'Your Sep 3 Push session could not be read, so this one cannot be measured ' +
                'against it. Saving still works.</span></div>' +
              '<button class="btn btn--secondary btn--block mt-3" data-testid="action-retry-compare">' +
                '<span class="btn__label">Try again</span></button>' +
            '</div>' +
            feelSection() + noteSection() + discardSection(d.sets),
      bar: saveBar({ status: '' }), overlay: ''
    };
  };

  /* ---- render ------------------------------------------------------ */
  var STATES = [
    ['record',        'New record'],
    ['populated',     'Populated'],
    ['diff-swap',     'Split: swap'],
    ['diff-add-skip', 'Split: add + skip'],
    ['diff-skip',     'Split: skip only'],
    ['diff-many',     'Split: per-change sheet'],
    ['diff-updated',  'Split: updated'],
    ['empty',         'Nothing logged'],
    ['loading',       'Loading'],
    ['error',         'Error']
  ];

  var body = document.getElementById('body');
  var barSlot = document.getElementById('bar-slot');
  var overlaySlot = document.getElementById('overlay-slot');
  var toastSlot = document.getElementById('toast-slot');
  var screen = document.getElementById('screen');
  var hdrDate = document.getElementById('hdr-date');
  var hdrTitle = document.getElementById('hdr-title');
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  var toastTimer = null;

  function toastHTML() {
    if (!S.toast) return '';
    return '<div class="toast" role="status" data-testid="toast">' +
             '<span class="toast__body">' + S.toast + '</span></div>';
  }

  function paint(keepScroll) {
    var top = body.scrollTop;
    var d = DATA[S.view];
    var out = VIEWS[S.view]();
    screen.setAttribute('data-state', S.view);
    hdrDate.textContent = d.date;
    hdrTitle.textContent = d.title;
    LKPatch(body, out.body);
    LKPatch(barSlot, out.bar);
    LKPatch(overlaySlot, out.overlay || '');
    LKPatch(toastSlot, toastHTML());
    body.scrollTop = keepScroll ? top : 0;
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.view));
    });
  }

  /* Read on boot and on entry, not on every paint: re-reading on paint would
     change the screen under a reader who had only pressed a dev-state button,
     but in the demo this screen is mounted once and Finish arrives long
     after boot -- so it reported its fixture's 16 sets and 4,383 kg against
     a session of two sets and 1,088 kg. */
  var HANDED = null;
  /* Which session the split decision on screen belongs to, and the day as
     it stood before it was written, which is all Undo needs. */
  var DRIFT_KEY = null, DRIFT_BEFORE = null;
  function takeHanded() {
    var h = handed();
    if (!h) return false;
    HANDED = h;
    /* The prior column has to be the same lifts. Left at the fixture's whole
       5-lift Push, a session of one bench read "-2,671 kg, -62.6%" against a
       workout it shares one exercise with. Comparing like for like means
       summing the prior volume of the lifts that are actually in this
       session, and naming the session it came from. */
    var pv = 0, pd = null;
    HANDED.lifts.forEach(function (l) {
      pv += l.priorVol || 0;
      if (l.priorDate && (!pd || l.priorDate > pd)) pd = l.priorDate;
    });
    if (pv > 0) {
      PRIOR = { name: HANDED.lifts.length === 1 ? HANDED.lifts[0].name : 'the same lifts',
                dateLabel: pd ? shortDate(pd) : 'last time', volumeKg: pv };
    }
    DATA.record = HANDED;
    DATA.populated = HANDED;
    DATA.error = { title: HANDED.title, date: HANDED.date, sets: HANDED.sets,
                   volumeKg: HANDED.volumeKg, minutes: HANDED.minutes };
    DATA.empty = { title: HANDED.title, date: HANDED.date };
    DATA.loading = DATA.empty;
    SAVED = null;
    /* THE CARD TALKS ABOUT THE DAY IN FRONT OF IT. This was a PPL/Push
       constant, so the one real session that ever reached it would have
       been offered a "Save as your Push day" over somebody else's split.
       The dev states below still read the constant, which is what they
       are: a mock with no session behind it. */
    if (HANDED.split) SPLIT = HANDED.split;
    /* A NEW SESSION HAS NOT BEEN ANSWERED. This screen is mounted once for
       the life of the page, so an answer given after Monday's Push was
       still on the state when Wednesday's arrived: the card came back
       already reading "Push updated" over a session nobody had decided
       anything about, with an Undo that would have put back a day the
       reader had never touched. Same family of bug as S.saved below. */
    if (DRIFT_KEY !== HANDED.driftKey) {
      DRIFT_KEY = HANDED.driftKey;
      DRIFT_BEFORE = null;
      S.split = 'pending';
      S.applied = [];
      S.sheet = false;
      S.detail = false;
    }
    /* A NEW SESSION IS NOT THE LAST ONE'S SAVE. In the assembled build this
       screen is mounted once for the life of the page, so S.saved survived
       from the previous workout: the second session of the day arrived with
       the action bar already reading "Saved to history" and a Done button
       where Save should be. There was no control to save it with, and the
       note and the reflection from the earlier workout were still in the
       fields. Anyone who trains twice in a day, or repeats a session, lost
       the second one silently. */
    S.saved = false;
    S.note = '';
    S.reflection = {};
    S.discardArmed = false;
    S.ai = 'idle';
    return true;
  }
  takeHanded();
  document.addEventListener('lk:enter', function () {
    if (takeHanded()) { S.view = 'populated'; paint(); }
  });

  /* ---- saving ------------------------------------------------------
     SAVING SAVES. "Save session" set a flag, disabled its own button and
     printed "Saved to history" -- and wrote nothing, anywhere. A finished
     workout never joined lk_history, so Train's list, Home's counts, the
     records, and this screen's own "against last time" all carried on as
     if the session had not happened. It is the one hole that made the whole
     training loop a demo, and it is written now, through LKStore, under the
     key every other screen reads.
     -------------------------------------------------------------------- */
  var SAVED = null;                 /* the record written, once per session */

  /* ---- WHO A WORKOUT IS ------------------------------------------------
     Every row in lk_history is addressed by its id: workout-detail opens one
     by id, edits it by id and deletes it by id. The id came from whoever
     happened to write the row -- this screen stamps one, the log's own
     history writer stamps another -- and a row that arrived without one
     (an older build's, an import, a seed row) was invisible to all three: it
     could be read in a list and never opened.

     withWorkoutIds stamps every unstamped row it is given, from the row's own
     date and position so the same list always produces the same ids.
     sameWorkout answers the other half: two records are the same session when
     they carry the same id, or -- with no id to go on -- when they are the
     same day, the same name and the same work. Saving uses it so pressing
     Save twice, or reopening a review that was already banked, cannot put two
     copies of one workout in the history.

     They live here because this is the screen that writes history. The right
     home for them is store.js, which every screen already loads, but this
     package does not own that file; the note is in the report. */
  function withWorkoutIds(list) {
    var out = Array.isArray(list) ? list : [];
    var stamped = 0;
    out.forEach(function (w, i) {
      if (!w || w.id) return;
      var t = isoMs(w.date);
      w.id = 'w_' + (isNaN(t) ? 'x' : t) + '_' + i;
      stamped++;
    });
    return { list: out, stamped: stamped };
  }
  function sameWorkout(a, b) {
    if (!a || !b) return false;
    if (a.id && b.id) return String(a.id) === String(b.id);
    return String(a.date).slice(0, 10) === String(b.date).slice(0, 10) &&
           String(a.name || '') === String(b.name || '') &&
           Number(a.sets || 0) === Number(b.sets || 0) &&
           Number(a.kg || 0) === Number(b.kg || 0);
  }

  function reflectionOrNull() {
    var out = null;
    REFLECT.forEach(function (f) {
      var v = S.reflection[f[0]];
      if (v === undefined || v === null) return;
      if (!out) out = {};
      out[f[0]] = v;
    });
    return out;
  }

  function saveSession() {
    if (SAVED) return SAVED;
    if (!HANDED || !window.LKStore) return null;
    var rec = {
      id: 'w_' + Date.now(),
      kind: 'lift',
      name: HANDED.title,
      /* The seed's own field names -- date, min, kg -- because every screen
         that reads history reads those, and a record written in a second
         vocabulary is a record only this screen can read. */
      date: HANDED.dateISO || (window.LKStore ? LKStore.today() : null),
      min: HANDED.minutes,
      sets: HANDED.sets,
      kg: HANDED.volumeKg,
      exercises: HANDED.exercises || [],
      note: (S.note || '').trim(),
      reflection: reflectionOrNull()
    };
    /* Stamped on the way past, and never doubled. */
    var hist = withWorkoutIds(LKStore.get('lk_history', [])).list;
    var dup = null;
    for (var h = 0; h < hist.length; h++) { if (sameWorkout(hist[h], rec)) { dup = hist[h]; break; } }
    if (dup) {
      SAVED = dup;
      LKStore.remove('lk_lastSession');
      return dup;
    }
    hist.unshift(rec);
    LKStore.set('lk_history', hist);

    /* A mark set today becomes the record. Left alone, this screen announced
       a personal record and the PR vault went on showing the one it beat. */
    var r = HANDED.record;
    if (r && r.exId != null) {
      var prs = LKStore.get('lk_prs', []);
      if (Array.isArray(prs)) {
        for (var i = 0; i < prs.length; i++) {
          if (prs[i].exId === r.exId) {
            prs[i].kg = r.w; prs[i].reps = r.r; prs[i].date = rec.date;
            break;
          }
        }
        LKStore.set('lk_prs', prs);
      }
    }

    /* The hand-over has been used up. Left in place, reopening this screen
       would offer to save the same workout again. */
    LKStore.remove('lk_lastSession');
    SAVED = rec;
    return rec;
  }

  function show(view) {
    var v = VIEWS[view] ? view : 'record';
    S = { view: v, saved: false, reflection: {}, note: '', discardArmed: false, ai: 'idle',
          toast: null, split: 'pending', applied: [], sheet: false, detail: false,
          /* The dismissal is stored, so it does not need to survive here. */
          throwbackGone: false };
    /* Two of the dev states are a mid-decision snapshot rather than an
       entry state: the sheet already open, and the split already
       updated by the swap. */
    if (v === 'diff-many') S.sheet = true;
    if (v === 'diff-updated') { S.split = 'updated'; S.applied = DATA['diff-swap'].diffs.slice(); }
    if (v === 'diff-swap' || v === 'diff-add-skip' || v === 'diff-skip') S.sheet = true;
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    paint(false);
  }

  /* Paints. The shipped version set the message and left the painting to
     whoever called it next: save painted again by accident and its toast
     appeared, discard did not and its toast was written into an
     already-painted slot, sat there invisible, and was cleared four seconds
     later. A function that shows a message shows it. */
  /* Focus goes to a named control after the render that replaces the one
     that was pressed. Deferred a frame: the caller paints after this. */
  function refocus(testid) {
    if (!testid) return;
    requestAnimationFrame(function () {
      var el = document.querySelector('[data-testid="' + testid + '"]');
      if (el) el.focus({ preventScroll: true });
    });
  }

  function toast(msg) {
    S.toast = msg;
    LKPatch(toastSlot, toastHTML());
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; paint(true); }, 4000);
  }

  /* Writes the chosen differences into lk_splits and remembers the day as
     it was, for Undo. Called from three places, so it lives in one. */
  function applySplit(d, applied) {
    if (!d || !d.drift) return false;
    var before = writeSplit(d.drift, applied);
    if (before) DRIFT_BEFORE = before;
    markDriftAnswered(d.driftKey, true);
    return !!before;
  }

  /* One delegated handler. Every control on the screen is in here, so
     there is no path that reaches a control with no behaviour. */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-testid], [data-rate]');
    if (!el) return;
    var id = el.getAttribute('data-testid');
    var d = DATA[S.view] || {};

    if (el.dataset.rate) {
      var rk = el.dataset.rate, rv = Number(el.dataset.val);
      /* Tapping the figure that is already chosen clears it, so an answer
         given by accident can be taken back rather than only changed. */
      if (S.reflection[rk] === rv) delete S.reflection[rk];
      else S.reflection[rk] = rv;
      paint(true);
      return;
    }
    switch (id) {
      case 'action-save':
        var written = saveSession();
        if (!written) {
          /* No workout was handed over, so there is nothing to write. Saying
             "saved" here is exactly the lie this screen used to tell. */
          toast('Nothing to save: this screen was opened without a workout, so no record was written.');
          return;
        }
        S.saved = true;
        paint(true);
        toast('Session saved to your history.');
        /* Saving disables the button it was pressed with, which blurs it and
           drops focus to <body> — so the next Tab restarts at the top of the
           document. It goes to the status the save just produced, which is
           also the thing somebody would want read to them. */
        refocus('save-status');
        return;
      case 'action-discard':
        S.discardArmed = true;
        S.focusAfter = 'action-discard-cancel';
        paint(true);
        /* The armed confirmation is the last thing in the scroller and the
           action bar sits under it, so on a full session both its buttons
           land below the fold. A confirmation you have to go looking for is
           a dead end in both directions. */
        var armed = body.querySelector('[data-testid="section-discard"]');
        if (armed && armed.scrollIntoView) armed.scrollIntoView({ block: 'end', behavior: 'smooth' });
        refocus('action-discard-cancel');
        return;
      case 'action-discard-cancel':
        S.discardArmed = false; paint(true); return;
      case 'action-discard-confirm':
        /* Discard has to consume the hand-over as well, or the discarded
           workout is still sitting there waiting to be reviewed and saved
           the next time this screen opens. */
        if (window.LKStore) LKStore.remove('lk_lastSession');
        if (window.LKSession) LKSession.end();
        S.discardArmed = false;
        toast('Session discarded. Nothing was written.');
        paint(true);
        /* AND IT LEAVES. This screen has no tab bar -- it is a pushed
           screen, reached from the workout -- so a discard that repaints
           in place leaves the reader on a review of a session that no
           longer exists with nothing on it that goes anywhere. */
        LKGo('train');
        return;
      case 'ai-ask':
      case 'ai-retry':
        askCoach();
        return;
      /* Hidden for three days, on the shipped app's own key, so it is the
         same suppression every other surface honours. */
      case 'action-throwback-dismiss':
        S.throwbackGone = true;
        if (window.LKStore) LKStore.set('lk_throwbackDismissed', new Date().toISOString());
        paint(true);
        toast('Hidden. Nothing like it for a few days.');
        return;
      case 'action-retry-compare':
        show('loading');
        setTimeout(function () { if (S.view === 'loading') show('record'); }, 900);
        return;
      case 'action-done':
        LKGo('home');
        return;

      /* THESE HAVE TO GO SOMEWHERE. Both only toasted and repainted, and
         this screen draws no tab bar, so a reader who finished a session
         with nothing in it -- which is exactly what pressing Finish after
         a discard does -- had a back button that did not go back, a "Back
         to workout" that did not, and no tabs. Trapped, on a review of a
         workout that was never saved.

         Back to the workout where there is still a workout to go back to;
         Train where there is not, because that is where the session came
         from and the one place that can start another. */
      case 'action-back':
      case 'action-back-to-workout': {
        var running = window.LKSession && LKSession.get();
        if (running) { LKGo('workout-log'); return; }
        toast('Nothing was saved.');
        LKGo('train');
        return;
      }

      /* ---- the split decision. None of these touch S.saved: the
         session can be banked before, after, or instead of answering. */
      /* THE BUBBLE. One tap, and the question is in a pop-up. */
      case 'split-open':
        S.sheet = true; paint(true); return;
      case 'split-update':
        /* EVERYTHING THE POP-UP LISTED, including a skipped lift. The
           button says save this as your Push day and the line above it
           says which lift was skipped; a save that quietly kept it would
           not be saving the day that was run. Keep the previous version is
           the answer for a session that ran short, and Undo is behind both.

           AND IT REACHES lk_splits. Over a dev state there is nothing to
           write and the pop-up is still worth showing, so a failed write is
           not an error here. */
        S.applied = d.diffs.slice();
        applySplit(d, S.applied);
        S.split = 'updated'; S.sheet = false;
        paint(true);
        return;
      case 'split-keep':
        /* Answered, so it is not asked again -- but nothing was written,
           and the session itself was already logged either way. */
        markDriftAnswered(d.driftKey, true);
        S.split = 'kept'; S.sheet = false; paint(true); return;
      /* Closing is not answering. The bubble is still there and the
         question can be opened again. */
      case 'split-sheet-close':
      case 'scrim':
        S.sheet = false; paint(true); return;
      case 'split-undo':
        /* The day goes back exactly as it was, timestamp included, and the
           question is open again: undoing an answer is not an answer. */
        if (DRIFT_BEFORE) restoreSplit(d.drift, DRIFT_BEFORE);
        DRIFT_BEFORE = null;
        markDriftAnswered(d.driftKey, false);
        S.split = 'pending'; S.applied = [];
        paint(true);
        toast(esc(SPLIT.day) + ' put back as it was.');
        return;
      case 'action-detail':
        S.detail = !S.detail;
        paint(true);
        refocus('action-detail');
        return;
      default:
        return;
    }
  });

  /* The note, as it is typed. Kept in state rather than read off the field
     at save time, because the field is inside a region that repaints. */
  document.addEventListener('input', function (e) {
    var t = e.target.closest ? e.target.closest('[data-testid="session-note"]') : null;
    if (t) S.note = t.value;
  });

  /* A sheet closes on Escape, and closing it changes nothing. */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (S.sheet) { S.sheet = false; paint(true); }
  });

  /* ---- dev toggle -------------------------------------------------- */
  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" ' +
           'data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join(''));
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (b) show(b.dataset.state);
  });

  /* The demo's finished Push is the entry state while a seed is loaded. With
     no seed there is no session to review until one is handed over, and
     showing the seeded Push would be a workout nobody did. */
  show(new URLSearchParams(location.search).get('state') ||
       (window.LKFixtures ? 'record' : 'empty'));
})();

  /* The running workout, from a screen that is not it. Leaving the workout
     log used to lose the session outright: nothing was written down, and no
     screen but Home and Fuel had anywhere to say one was open. The record
     lives in session.js; this mounts its shelf and takes the tap back. */
  if (window.LKSession) {
    LKSession.mount(document.getElementById('shelf-slot'),
      typeof LKPatch === 'function' ? LKPatch : null);
    document.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-testid="shelf-resume"]') : null;
      if (el) { e.preventDefault(); LKGo('workout-log'); }
    });
  }
</script>
</body>
</html>
