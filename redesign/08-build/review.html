<body>
<!--
  REVIEW — what this screen is, and why it is shaped this way.

  THE MOMENT. The last set is racked. The lifter is tired, one-handed,
  and wants to be done. Whatever this screen says has about five
  seconds to be worth reading, and then it has to get out of the way.

  THE AUDIT'S VERDICT (01-audit-function/review.md). The old screen
  "mostly wastes a tap": three stat tiles restating numbers the lifter
  had just watched accumulate, then a five-row / five-chip reflection
  gate styled as the one accent action, then a network call for the one
  thing the screen could say that the lifter did not already know —
  eight taps in, and only if the call answered. Function mean 3.3,
  state handling 2.

  FOUR DEFECTS THIS SCREEN FIXES, each traced to the audit:

  1. "The one accent button is HOW DID IT FEEL?; the job sits in the
     quiet Save without reflection" (rubric, purpose clarity 3). Here
     the single accent fill on every state is Save session, pinned in
     an actionbar so it never scrolls away. Saving is one tap from
     entry. Feel is five one-to-five ratings and a note, in a section
     below the fold, optional, and it gates nothing.

     AND SAVING SAVES. Save set a flag and wrote nothing: a finished
     workout never joined lk_history, so the loop from logging a set to
     reading the session back days later was never closed. The record
     is written here, through LKStore, in the seed's own field names,
     with the sets, the note and the five ratings in it -- which is
     what workout-detail reads when that session is opened again.

  2. "Zero-set guard on save(): missing — saves sets:0, exercises:[],
     an empty record joins history and inflates Home's TOTAL WORKOUTS"
     (§2 L16012, §5). The nothing-logged state has no Save control at
     all. It says the session holds nothing and that nothing will be
     written, and offers the two things that are actually available:
     go back and log a set, or discard.

  3. "Canned fallback on aiCall fail — broken: fabricated insight
     styled as a real one" (§2 L16112, `review-error.png`). Every
     figure on this screen is computed from lk_history on the device.
     The one generated line lives in a dashed, labelled card
     (.card--unverified), is never fetched unless asked for, and on
     failure shows the failure and a Retry — never a sentence.

  4. "Five seconds after racking, a lifter wants the comparison — this
     session against the last, per lift, and any PR — computable
     locally" (§7 Cut). That comparison is computed on the device and
     needs no network. It is no longer the first thing on the screen;
     see ONE PAGE below.

  AND THEN IT WAS STILL A WALL. Every fix above was right on its own and
  the sum of them was a screen that opened with the lift comparison, two
  cards of "against last time", a throwback, every set of the session,
  a five-row reflection, a note field and a full-width card arguing about
  the split. The owner's note after living with it: "it shows you lines
  and lines of recap data. Don't include much of that. Just have it start
  off like, how was this workout."

  ONE PAGE. The first screen is the question, one line of the session's
  own figures, and a record if there was one. Everything else -- the
  comparison, the throwback, every set, the note and the coach's written
  read -- is behind ONE control. Not seven collapsed sections: a page
  with seven things to open is the same wall with extra taps in it.

  WHAT THE LIFTER DID NOT ALREADY KNOW
    - Total working volume against the same session last time:
      4,383 kg vs 4,266 kg, +117 kg, +2.7%.
    - Per lift, this session's top set against that session's top set,
      and the working-volume change: bench +60 kg, shoulder press
      +50 kg, cable fly +30 kg, lateral raise -53 kg, pushdown +30 kg.
      The lateral raise is down. The screen says so; a lifter who is
      only ever congratulated stops reading.
    - Any record set today, with the mark it beat and when.

  NUMBERS. Working sets only, warm-ups excluded, stated on the screen
  in one line. This settles the audit's finding that the old header and
  the old per-exercise line disagreed about warm-ups (15985 vs 16254).
  Every figure is tabular and carries kg. Dates are relative inside the
  week and absolute after it.

  DATA. tests/fixtures/seed-data.json. The session under review is the
  Push day of Wed 9 Sep 2026; the prior session it is compared against
  is w_1788458700000, "PPL - Push", 3 Sep 2026, 16 sets, 4,266 kg,
  55 min, whose five exercises and every set are in the fixture. The
  record state's beaten mark is lk_prs["111"], 72.5 kg x 8 on
  2026-09-03. The prior top sets, prior per-lift volumes and the
  4,266 kg total are read off that fixture session, not invented; the
  five deltas sum to the header delta.

  ACCENT. Exactly one accent fill per state, always on the primary
  action: Save session in populated, record, loading and error; Back to
  workout in nothing-logged, where there is nothing to save. Feel chips
  use --accent-quiet as a selected tint, which is a ground, not a fill,
  and the record badge is success-toned so a record can never be
  confused with an action.

  MOTION. One entrance, on the block that carries the news. Reduced
  motion switches it off.

  ---------------------------------------------------------------------
  SPLIT DRIFT — the second thing this screen does.

  A lifter who swaps an exercise three weeks running should end up with
  a split that reflects what they actually do, without ever opening the
  split builder. So when the exercises performed differ from the ones
  the Push day prescribed, Review asks once, here, while the session is
  still in front of them.

  DETECTION. The prescribed list against the exercises with at least one
  completed set. Added = performed, not prescribed. Skipped =
  prescribed, never started. A skip and an addition filling the same
  slot are one SWAP and draw one line, because they are one decision.
  The card appears only when the difference is non-empty and only when
  the session came from a split: a freestyle session and an identical
  session draw nothing. There is no "no changes detected" state, and the
  screen never asks twice.

  A BUBBLE AND A POP-UP. The card is gone. The first page carries one
  small pill saying the day ran differently and how many things did; the
  question itself is a short sheet behind it, in the build's own squircle,
  with one or two lines of fact and two answers. Save this as your Push
  day, or keep the previous version.

  LOUDNESS. Both of its actions are secondary. The accent fill stays on
  Save, and this never gates it: saving is one tap with a difference on
  screen, and the decision can be made before the save, after it, or not
  at all.

  TWO VERSIONS, NOT A MENU. The per-change sheet, with a checkbox for
  every difference, is gone, and so is the asymmetry that held a skipped
  lift back unless it was picked by name. There are two versions of a
  day: the one that was run and the one that was already there. A screen
  that asks somebody to assemble a third out of checkboxes at the end of
  a workout is asking too much, and a "save this as your Push day" that
  quietly kept a lift they did not do would not be saving that day at
  all. Keep the previous version is the answer for a session that ran
  short, and Undo is behind both.

  SETS AND REPS, TOO. The difference used to be which lifts were in the
  day and nothing else, so a day prescribing three sets where four were
  done registered as nothing, and a day reading 3 x 8 went on reading
  3 x 8 through a month of 3 x 10. A changed set count and a rep count
  that lands outside what the day asked for are both kinds of difference
  now, they draw their own line, and taking the offer writes them.

  AFTER. The bubble becomes one named line, "Push saved. Machine Chest
  Press replaces Barbell Bench Press.", plus Undo, because this edits a
  programme the lifter may have spent time building. Keeping the split
  gets a quiet acknowledgement and no second ask.

  ALSO. A lift the prior session did not contain is marked New and left
  uncompared rather than given a delta against nothing, and when the
  exercises differ the day total says it is not like for like.

  AND IT IS REAL. All of the above described four dev states and nothing
  else: the differences were four hand-written lists, the split was a
  PPL/Push constant, and the buttons moved a variable in this screen and
  wrote to lk_splits never. A lifter could swap the incline press for a
  flat press every Push for a month and the plan never heard about it,
  which is the one promise this card makes. The workout log now carries
  its split day across (`source` on lk_lastSession: the split's id and
  name, the day's id and name, and the exercises the day PLANNED), the
  difference is computed from that against what was logged, and taking
  the offer rewrites that day in lk_splits -- in whichever of the two
  shapes the day already carries, exIds or resolved exercises, or both --
  and stamps the split's `updated` so Train's "edited" line stays honest.
  The dev states are untouched and still read the constant, because that
  is what they are: a mock with no session behind it.

  ORDER. The same lifts in another order is its own kind of difference
  and gets its own line and its own verb, rather than being dressed up as
  five swaps. It is never mixed with an addition or a swap: a swap moves
  everything below it, and that is the swap, not a reorder.

  NOT TWICE. The answer is stored against the session it was given for,
  so the edge-swipe back onto this screen does not ask again, and
  tomorrow's Push still does.

  NOTHING QUIETLY. Neither button is required. The session is logged
  either way and the plan is only ever changed by a press on the button
  that names the change.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-review">

      <header class="hdr" data-scroll-edge="#body">
        <button class="hdr__back" id="action-back" data-testid="action-back" aria-label="Back to workout">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        </button>
        <div class="hdr__title stack stack--1">
          <span class="t-meta num" id="hdr-date">WED, SEP 9</span>
          <h1 class="t-title" id="hdr-title">Push</h1>
        </div>
      </header>

      <main class="body" id="body" data-testid="review-scroll" tabindex="-1"></main>

      <!-- The live session, seen from here. Empty unless a workout is
           running; it sits between the content and the bottom of the
           screen rather than over it, so nothing it says costs a row. -->
      <div id="shelf-slot"></div>

      <div id="overlay-slot"></div>
      <div id="bar-slot"></div>
      <div id="toast-slot" data-testid="toast-slot"></div>

    </div>
  </div>
</div>

<div class="dev">
  <button class="dev__toggle" id="dev-toggle" aria-expanded="false" aria-controls="dev-menu" data-testid="dev-toggle">State</button>
  <div class="dev__menu" id="dev-menu" hidden data-testid="dev-menu"></div>
</div>

<script>
(function () {
  "use strict";

  /* ---- icons: one set, one stroke weight ------------------------- */
  function svg(d, extra) {
    return '<svg class="ico' + (extra || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  }
  var ICO = {
    record: svg('<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/><path d="M12 14v3M9 20h6"/>'),
    alert:  svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/>'),
    empty:  svg('<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>', ' ico--lg'),
    check:  svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
    close:  svg('<path d="M6 6l12 12M18 6L6 18"/>')
  };

  /* ---- formatting ------------------------------------------------ */
  /* Free text reaches this screen now -- a session name a person typed, a
     note they wrote -- and it is written into markup, so it is escaped. */
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function n(v) { return '<span class="num">' + v + '</span>'; }
  function kg(v) { return n(LKUnits.fmtTotal(Number(v))); }
  /* A signed figure always prints its sign, so the colour is a second
     carrier of direction and never the only one. */
  function signedKg(v) {
    var u = LKUnits.label();
    if (v === 0) return n('0') + ' ' + u;
    var x = LKUnits.vRound(Math.abs(v));
    return n((v > 0 ? '+' : '\u2212') + x.toLocaleString('en-GB')) + ' ' + u;
  }
  function dir(v) { return v > 0 ? 'up' : (v < 0 ? 'down' : 'flat'); }
  function set(w, r) { return n(LKUnits.v(w)) + ' ' + LKUnits.label() + ' \u00d7 ' + n(r); }
  /* LEFT AND RIGHT ON ONE LINE. A set tracked per side is one set with two
     rep counts under one weight -- 20 kg x 10 | 9 -- which is how the log
     now draws it and how it now reaches history.

     THE OLD SHAPE STILL READS. Sessions already banked carry two rows, the
     second marked side 'R', and they keep their 1L / 1R numbering below;
     nothing stored has been rewritten. */
  function setLine(s) {
    if (s.repsR == null) return set(s.kg, s.reps);
    return set(s.kg, s.reps) + ' \u2502 ' + n(s.repsR);
  }

  /* ---- seed --------------------------------------------------------
     Prior column is w_1788458700000 in fixtures/seed-data.json:
     "PPL - Push", 3 Sep 2026, 16 working sets, 4,266 kg, 55 min.
       Barbell Bench Press  72.5x8, 72.5x6, 72.5x5, 67.5x5  = 1715 kg
       DB Shoulder Press    25x9, 25x9, 25x8                =  650 kg
       Incline Cable Fly    15x11, 15x11, 15x10             =  480 kg
       Lateral Raise        10.5x15, 10.5x14, 10.5x12       =  430.5 kg
       Tricep Pushdown      30x12, 30x11, 30x10             =  990 kg
                                                    total     4265.5 -> 4,266 kg
     (The fixture's 37.5x8 bench warm-up is excluded, which is what
     makes the fixture's own "4266 kg" reproduce.)
     ------------------------------------------------------------------ */

  /* NO INVENTED PRIOR SESSION. This was a literal -- "Push, Sep 3, 4,266 kg"
     -- and it is only replaced when the lifts carry a prior volume, which
     needs the history read above. On the shipped build that read was dead,
     so every reader saw a comparison against a workout nobody had done:
     a first-ever session claimed "-3,786 kg, -88.7% against Push, Sep 3",
     and a screen announcing a record beaten on Sep 7 sat directly above a
     card denying the Sep 7 session existed.

     Null means "nothing to compare against", and the card says that rather
     than inventing a number. */
  var PRIOR = null;

  function lift(name, tw, tr, tvol, pw, pr, pvol) {
    /* Rounded away from zero, so the five row deltas always sum to the
       header delta rather than drifting by a half kilo. */
    var raw = tvol - pvol;
    return { name: name, top: [tw, tr], vol: tvol, priorTop: [pw, pr], priorVol: pvol,
             delta: (raw < 0 ? -1 : 1) * Math.round(Math.abs(raw)) };
  }

  /* Today, 9 Sep. Same five lifts, same order. Two variants: one where
     the bench moved and set a record, one where it held. */
  var LIFTS_RECORD = [
    lift('Barbell Bench Press', 75, 8, 1775, 72.5, 8, 1715),
    lift('DB Shoulder Press',   25, 10, 700, 25, 9, 650),
    lift('Incline Cable Fly',   15, 12, 510, 15, 11, 480),
    lift('Lateral Raise',       10.5, 13, 378, 10.5, 15, 430.5),
    lift('Tricep Pushdown',     30, 12, 1020, 30, 12, 990)
  ];
  var LIFTS_FLAT = [
    lift('Barbell Bench Press', 72.5, 8, 1715, 72.5, 8, 1715)
  ].concat(LIFTS_RECORD.slice(1));

  /* A lift the prior session does not contain. It has no delta, because
     inventing one would compare two different exercises. */
  function liftNew(name, tw, tr, tvol) {
    return { name: name, top: [tw, tr], vol: tvol, priorTop: null, priorVol: 0, delta: null };
  }

  /* THE SESSION JUST FINISHED, if the workout log handed one over.

     Review used to be a fixture and only a fixture: whatever you logged --
     seven sets, or none at all after a discard -- it reported 16 working
     sets, 4,383 kg, 52 min and awarded a bench record of 75 kg x 8 that
     nobody had set. The log now writes lk_lastSession on Finish and this
     reads it once. The dev states below are untouched; they are what this
     screen shows when no session was handed over, which is how it is opened
     from the index and from a screenshot run. */
  function handed() {
    var r = window.LKStore ? LKStore.get('lk_lastSession', null) : null;
    if (!r) {
      var raw = null;
      try { raw = localStorage.getItem('lk_lastSession'); } catch (e) { return null; }
      if (!raw) return null;
      try { r = JSON.parse(raw); } catch (e) { return null; }
    }
    if (!r || !r.lifts || !r.lifts.length) return null;
    /* The device's own history, not the fixture's. The product build ships
       no fixtures, so FX was undefined on every real account and every lift
       took the "no prior session" branch -- which left the comparison card
       falling through to the hardcoded demo constant below and printing a
       session that does not exist. */
    var FX = window.LKHistory;

    var lifts = r.lifts.map(function (l) {
      /* The prior column is the last session that actually contains this
         lift, found in the shared history. A lift with no prior session gets
         no delta rather than an invented one. */
      var last = FX && FX.lastTime ? FX.lastTime(l.id, r.dateISO) : null;
      /* THE ID TRAVELS WITH THE LIFT. It was dropped here, so everything
         downstream had only a name to go on and anything that wanted to look
         the lift up in history -- the throwback below, for one -- could not. */
      if (!last) return { id: l.id, name: l.name, top: l.top, vol: l.vol, priorTop: null, priorVol: 0,
                          priorDate: null, delta: null };
      var st = FX.liftStats(last.exercise);
      var raw2 = l.vol - st.vol;
      return { id: l.id, name: l.name, top: l.top, vol: l.vol, priorTop: st.top, priorVol: st.vol,
               priorDate: last.date,
               delta: (raw2 < 0 ? -1 : 1) * Math.round(Math.abs(raw2)) };
    });

    /* A record is claimed only when a top set beats EVERY stored row for that
       lift. Checked row by row, a 72.5 kg x 8 "beat" the stored 72.5 x 5 and
       the screen awarded a record for equalling its own standing best.
       Beaten means no stored row matches or exceeds it on both counts. */
    /* THE RECORD THE LOG ALREADY KNOWS ABOUT. The workout log marks the set
       that beat a best and writes the new row to lk_prs the moment it is
       ticked -- so by the time this screen re-derives records from lk_prs,
       the standing best for that lift IS the set it is looking at, and the
       scan below can never find a record in a session that actually set one.
       The session's own mark wins, and it carries the mark it beat. */
    var rec = null;
    (r.exercises || []).forEach(function (ex) {
      (ex.sets || []).forEach(function (st) {
        if (rec || !st.pr || !st.prBeat) return;
        rec = { exId: ex.id, lift: ex.name, w: st.kg, r: st.reps,
                prevW: st.prBeat.kg, prevR: st.prBeat.reps,
                prevDate: /^\d{4}-\d{2}-\d{2}$/.test(String(st.prBeat.date || ''))
                  ? shortDate(String(st.prBeat.date).slice(0, 10)) : st.prBeat.date };
      });
    });
    var rows = (window.LKStore ? window.LKStore.get('lk_prs', null) : null) ||
               (FX && FX.prs) || [];
    if (!Array.isArray(rows)) rows = [];
    r.lifts.forEach(function (l) {
      if (rec || !l.top) return;
      var mine = rows.filter(function (p) { return Number(p.exId) === Number(l.id); });
      if (!mine.length) return;               /* nothing to beat is not a claim */
      var held = null;
      for (var i = 0; i < mine.length; i++) {
        if (mine[i].kg >= l.top[0] && mine[i].reps >= l.top[1]) return;  /* not beaten */
        if (!held || mine[i].kg > held.kg || (mine[i].kg === held.kg && mine[i].reps > held.reps)) held = mine[i];
      }
      rec = { exId: l.id, lift: l.name, w: l.top[0], r: l.top[1],
              /* THE MARK IT BEAT, as it was actually set. The card printed the
                 old weight against TODAY's reps -- so a 25 kg x 9 that beat a
                 standing 25 kg x 8 read "Beat 25 kg x 9", which is the same
                 set twice and not a record at all. */
              prevW: held.kg, prevR: held.reps,
              prevDate: /^\d{4}-\d{2}-\d{2}$/.test(String(held.date || ''))
                ? shortDate(String(held.date).slice(0, 10)) : held.date };
    });

    /* HOW TODAY DIFFERED FROM THE DAY IT CAME FROM. Null for a quick
       workout, for a session with no split behind it, for a day that has
       been deleted since, for a session that ran exactly to plan, and for
       a session that has already been asked about once. */
    var dkey = driftKey(r);
    var drift = driftAnswered(dkey) ? null : driftFor(r);

    return {
      title: r.title || 'Workout',
      dateISO: r.dateISO,
      date: r.dateISO ? longDate(r.dateISO) : '',
      sets: r.sets, volumeKg: r.volumeKg, minutes: r.minutes,
      lifts: lifts,
      /* The card reads these two; everything it needs to WRITE is on
         `drift`, which never reaches the markup. */
      split: drift ? drift.split : null,
      diffs: drift ? drift.diffs : null,
      drift: drift,
      driftKey: dkey,
      /* `mixed` is deliberately NOT set from the difference. It switches on
         the comparison card's "the exercises differ from <date>" line, and
         that date is the dev state's own Sep 3 constant unless a real prior
         session was found -- so a true difference printed a sentence about
         a session that does not exist. The comparison decides for itself
         what it can compare; this card is not its source. */
      /* The rows, so the screen can show what was actually done and the
         record it saves has sets in it. */
      exercises: r.exercises || [],
      record: rec,
      /* No insight. The insight lines below are written about the fixture's
         own sessions; generating one about a session this screen has only
         totals for would be the screen inventing a reading of your training. */
      insight: null
    };
  }

  var MONTHS_SHORT = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var DOW_SHORT = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  function longDate(iso) {
    var a = iso.split('-');
    var d = new Date(Date.UTC(+a[0], +a[1] - 1, +a[2]));
    return DOW_SHORT[d.getUTCDay()] + ', ' + MONTHS_SHORT[+a[1] - 1] + ' ' + (+a[2]);
  }
  function shortDate(iso) {
    var a = iso.split('-');
    return MONTHS_SHORT[+a[1] - 1].charAt(0) + MONTHS_SHORT[+a[1] - 1].slice(1).toLowerCase() +
      ' ' + (+a[2]);
  }

  var DATA = {
    record: {
      title: 'Push', date: 'WED, SEP 9',
      sets: 16, volumeKg: 4383, minutes: 52,
      lifts: LIFTS_RECORD,
      /* lk_prs["111"]: the standing best at 8 reps was 72.5 kg, 3 Sep. */
      record: { lift: 'Barbell Bench Press', w: 75, r: 8, prevW: 72.5, prevDate: 'Sep 3' },
      insight: 'Bench top set has moved up 2.5 kg on every second Push since ' +
               'Aug 20. Lateral raise reps have fallen in three straight ' +
               'sessions; it runs last in the order every time.'
    },
    populated: {
      title: 'Push', date: 'WED, SEP 9',
      sets: 16, volumeKg: 4323, minutes: 49,
      lifts: LIFTS_FLAT,
      record: null,
      insight: 'Bench has held at 72.5 kg for two Push sessions while the ' +
               'accessories kept climbing. The last two top sets both ' +
               'stopped at RIR 2.'
    },
    empty:   { title: 'Push', date: 'WED, SEP 9' },
    loading: { title: 'Push', date: 'WED, SEP 9' },
    error:   { title: 'Push', date: 'WED, SEP 9', sets: 16, volumeKg: 4383, minutes: 52 }
  };

  /* ---- the split, and how today differed from it -------------------
     lk_splits: the PPL split's Push day prescribes, in order, Barbell
     Bench Press, DB Shoulder Press, Incline Cable Fly, Lateral Raise,
     Tricep Pushdown. A difference is the prescribed list against the
     exercises with at least one completed set:
       ADDED    performed, not prescribed
       SKIPPED  prescribed, never started
       SWAPPED  one skipped and one added filling the same slot, which
                is one decision and is drawn as one line
     The card appears only when that difference is non-empty and only
     when the session came from a split. A freestyle session and an
     identical session both draw nothing at all: no card, no empty
     state, no "no changes detected".
     ------------------------------------------------------------------ */

  var SPLIT = { name: 'PPL', day: 'Push' };

  var D_SWAP    = { kind: 'swap', to: 'Machine Chest Press', from: 'Barbell Bench Press',
                    slot: 'Mid Chest', sets: 4 };
  var D_ADD     = { kind: 'added', to: 'Incline Dumbbell Press', slot: 'Upper Chest', sets: 3 };
  var D_ADD2    = { kind: 'added', to: 'Incline Dumbbell Press', slot: 'Upper Chest', sets: 2 };
  var D_SKIP    = { kind: 'skipped', from: 'Lateral Raise', slot: 'Side Delt', sets: 3 };

  /* Each variant's lift list is the session that produced its
     difference, so the comparison above the card and the card itself
     describe the same workout. */
  var TAIL = LIFTS_RECORD.slice(1);            /* shoulder, fly, lateral, pushdown */
  var TAIL_NO_LAT = [TAIL[0], TAIL[1], TAIL[3]];

  DATA['diff-swap'] = {
    title: 'Push', date: 'WED, SEP 9', sets: 16, volumeKg: 4508, minutes: 51,
    lifts: [liftNew('Machine Chest Press', 50, 10, 1900)].concat(TAIL),
    record: null, mixed: true, split: SPLIT, diffs: [D_SWAP],
    insight: 'The machine press let you hold 50 kg for four sets where the ' +
             'barbell has been dropping a set by the third. Same slot, ' +
             'steadier reps.'
  };
  DATA['diff-add-skip'] = {
    title: 'Push', date: 'WED, SEP 9', sets: 16, volumeKg: 4815, minutes: 54,
    lifts: [LIFTS_FLAT[0], TAIL[0], TAIL[1],
            liftNew('Incline Dumbbell Press', 30, 10, 870), TAIL[3]],
    record: null, mixed: true, split: SPLIT, diffs: [D_ADD, D_SKIP],
    insight: 'Upper chest got its own movement for the first time in six ' +
             'Push sessions, and the side delts got none.'
  };
  DATA['diff-skip'] = {
    title: 'Push', date: 'WED, SEP 9', sets: 13, volumeKg: 3945, minutes: 41,
    lifts: [LIFTS_FLAT[0]].concat(TAIL_NO_LAT),
    record: null, mixed: true, split: SPLIT, diffs: [D_SKIP],
    insight: 'Four of five lifts held their loads in eleven fewer minutes. ' +
             'The one that went missing is the one that runs last.'
  };
  DATA['diff-many'] = {
    title: 'Push', date: 'WED, SEP 9', sets: 15, volumeKg: 4700, minutes: 53,
    lifts: [liftNew('Machine Chest Press', 50, 10, 1900), TAIL[0], TAIL[1],
            liftNew('Incline Dumbbell Press', 30, 10, 570), TAIL[3]],
    record: null, mixed: true, split: SPLIT, diffs: [D_SWAP, D_ADD2, D_SKIP],
    insight: 'Three of the five slots ran differently from the programme. ' +
             'Two of the three have now run that way twice.'
  };
  DATA['diff-updated'] = DATA['diff-swap'];

  /* ---- THE SAME CARD, OVER A REAL SESSION ---------------------------
     Everything above this line was a mock: four hand-written difference
     lists behind four dev-state buttons, a PPL/Push constant, and four
     buttons that moved a variable in this screen and touched lk_splits
     never. The card read beautifully and could not have changed a split
     if you had pressed it all afternoon -- swap the incline press for a
     flat press during Push and next week's Push day still said incline,
     which is the one thing the card promises not to happen.

     What follows is the same detection over the session the workout log
     actually handed across. The log now carries its split day with it
     (`source`: the split's id and name, the day's id and name, and the
     exercises the day PLANNED), so this can compare like with like even
     if the split has been renamed or reordered since.
     ------------------------------------------------------------------ */

  function sameId(a, b) { return String(a) === String(b); }
  function hasId(list, id) {
    for (var i = 0; i < list.length; i++) if (sameId(list[i].id, id)) return true;
    return false;
  }

  /* A session is asked about once. Answered, the screen is reopened --
     the edge-swipe back off Train is one tap away -- and the card came
     back offering to write a change that had already been written. The
     answer is stored against the session it was given for, not against
     the day, so tomorrow's Push is still asked about. */
  function driftKey(r) {
    var src = r && r.source;
    if (!src) return null;
    return [src.splitId, src.dayId, r.dateISO || '', r.sets, r.volumeKg].join('|');
  }
  function driftAnswered(key) {
    if (!key || !window.LKStore) return false;
    return String(LKStore.get('lk_splitDriftDone', '') || '') === key;
  }
  function markDriftAnswered(key, yes) {
    if (!key || !window.LKStore) return;
    if (yes) LKStore.set('lk_splitDriftDone', key);
    else LKStore.remove('lk_splitDriftDone');
  }

  /* HOW MANY REPS THIS LIFT IS ACTUALLY TRAINED FOR, out of the sets that
     were logged. The most common figure, and the lowest one when two are
     equally common, because a day is rewritten to something the lifter can
     hold for every set rather than to the one good set at the front.

     A set tracked left and right counts as the weaker side: the day cannot
     honestly say ten if only one arm got ten. */
  function commonReps(rows) {
    var tally = {}, best = null;
    rows.forEach(function (st) {
      var v = st.repsR == null ? st.reps : Math.min(st.reps, st.repsR);
      if (v == null || !isFinite(v)) return;
      tally[v] = (tally[v] || 0) + 1;
      if (best === null || tally[v] > tally[best] || (tally[v] === tally[best] && v < best)) best = v;
    });
    return best;
  }

  /* WHAT THE DAY ASKED FOR AGAINST WHAT WAS DONE, in sets and in reps.

     This is the half of the question that was missing. A day prescribing
     three sets where four were done registered as nothing at all, and a day
     reading 3 x 8 stayed at 3 x 8 through a month of 3 x 10, because the
     only thing ever compared was WHICH lifts were in the day.

     A LIFT NOBODY PRESCRIBED IS NOT DRIFTING. Most days on most phones
     carry no sets and no reps, and there is no honest guess at what
     somebody else meant, so a lift with nothing written down produces no
     line here. Nor does AMRAP: "as many as you can" has no figure to miss.
     A range is only missed when the reps fall outside it, which is what a
     range is for. */
  function presDiffs(planned, performed) {
    var P = window.LKPrescription;
    if (!P) return [];
    var out = [];
    planned.forEach(function (pl) {
      var perf = null;
      for (var i = 0; i < performed.length; i++) {
        if (sameId(performed[i].id, pl.id)) { perf = performed[i]; break; }
      }
      if (!perf) return;                    /* skipped: that is its own line */
      var ps = P.sets(pl.sets);
      if (ps && perf.sets && perf.sets !== ps) {
        out.push({ kind: 'sets', id: pl.id, name: pl.name, was: ps, now: perf.sets });
      }
      var pr = P.reps(pl.reps);
      if (!pr || !/^[0-9]/.test(pr) || perf.reps == null) return;
      var span = /^([0-9]+)-([0-9]+)$/.exec(pr);
      var off = span
        ? (perf.reps < +span[1] || perf.reps > +span[2])
        : String(perf.reps) !== pr;
      if (off) out.push({ kind: 'reps', id: pl.id, name: pl.name, was: pr, now: String(perf.reps) });
    });
    return out;
  }

  /* The difference between what the day prescribed and what was logged.
     Returns null when there is nothing to say: no split behind the
     session, a day that has since been deleted, or a session that ran
     exactly to plan. There is no "no changes detected" state, so the
     nothing case has to be nothing at all rather than an empty card. */
  function driftFor(r) {
    var src = r && r.source;
    if (!src || !src.splitId || !src.planned || !src.planned.length) return null;
    /* THE DAY HAS TO STILL EXIST. Delete or rename the split between the
       session and the review and this used to be asked anyway, and the
       write behind it would have thrown looking for a day that is not
       there. Offering to update something that is gone is worse than
       staying quiet about it. */
    if (!findDay(src)) return null;

    /* THE PRESCRIPTION TRAVELS WITH THE PLAN. It was dropped on the way in
       here, so the only question this screen could ever ask was which
       lifts were in the day -- never how many sets of them, never how many
       reps. A day that says 3 x 8 went on saying 3 x 8 after a month of
       4 x 10 and nothing anywhere noticed. */
    var planned = src.planned.map(function (e) {
      return { id: e.id, name: e.name, group: e.group || '', muscle: e.muscle || '',
               sets: e.sets, reps: e.reps };
    });
    var performed = (r.exercises || []).map(function (e) {
      var working = (e.sets || []).filter(function (st) { return !st.warm; });
      return { id: e.id, name: e.name, group: '', muscle: e.muscle || '',
               sets: working.length || (e.sets || []).length,
               reps: commonReps(working) };
    });
    if (!performed.length) return null;

    var added = performed.filter(function (e) { return !hasId(planned, e.id); });
    var skipped = planned.filter(function (e) { return !hasId(performed, e.id); });

    /* SAME LIFTS, DIFFERENT ORDER. Worth offering -- an order somebody
       settled into over three weeks is a decision -- but it is its own
       kind of change and says so, rather than being dressed up as five
       swaps. It can only be the whole story when nothing came or went,
       because a swap moves everything below it and that is not a
       reorder, it is the swap. */
    if (!added.length && !skipped.length) {
      var same = planned.length === performed.length;
      for (var i = 0; same && i < planned.length; i++) {
        if (!sameId(planned[i].id, performed[i].id)) same = false;
      }
      var only = presDiffs(planned, performed);
      if (!same) {
        only = [{ kind: 'order', count: performed.length,
                  first: performed[0].name, was: planned[0].name }].concat(only);
      }
      if (!only.length) return null;
      return { split: { id: src.splitId, name: src.splitName,
                        dayId: src.dayId, day: src.dayName },
               planned: planned, performed: performed, diffs: only };
    }

    /* A SKIP AND AN ADDITION IN THE SAME SLOT ARE ONE DECISION. Paired by
       the muscle the two lifts train, which is what "the same slot" means
       to a reader; failing that, by position, because the replacement is
       normally reached at the moment the original would have been. */
    var pairs = [], usedAdd = [];
    skipped.forEach(function (sk) {
      var slot = String(sk.muscle || '').toLowerCase();
      var mate = null;
      if (slot) {
        for (var a = 0; a < added.length; a++) {
          if (usedAdd.indexOf(added[a]) > -1) continue;
          if (String(added[a].muscle || '').toLowerCase() === slot) { mate = added[a]; break; }
        }
      }
      if (!mate) {
        var at = -1;
        for (var q = 0; q < planned.length; q++) if (sameId(planned[q].id, sk.id)) at = q;
        for (var b = 0; b < added.length; b++) {
          if (usedAdd.indexOf(added[b]) > -1) continue;
          var pat = -1;
          for (var w = 0; w < performed.length; w++) if (sameId(performed[w].id, added[b].id)) pat = w;
          if (pat === at) { mate = added[b]; break; }
        }
      }
      if (mate) { usedAdd.push(mate); pairs.push([sk, mate]); }
    });

    var diffs = [];
    planned.forEach(function (pl) {
      var pair = null;
      for (var i = 0; i < pairs.length; i++) if (pairs[i][0] === pl) pair = pairs[i];
      if (pair) {
        diffs.push({ kind: 'swap', from: pl.name, fromId: pl.id,
                     to: pair[1].name, toId: pair[1].id,
                     slot: pair[1].muscle || pl.muscle || 'the same slot',
                     sets: pair[1].sets });
        return;
      }
      if (skipped.indexOf(pl) > -1) {
        diffs.push({ kind: 'skipped', from: pl.name, fromId: pl.id,
                     slot: pl.muscle || 'the same slot', sets: 3 });
      }
    });
    added.forEach(function (ad) {
      if (usedAdd.indexOf(ad) > -1) return;
      diffs.push({ kind: 'added', to: ad.name, toId: ad.id,
                   slot: ad.muscle || 'a new slot', sets: ad.sets });
    });
    diffs = diffs.concat(presDiffs(planned, performed));
    if (!diffs.length) return null;

    return { split: { id: src.splitId, name: src.splitName,
                      dayId: src.dayId, day: src.dayName },
             planned: planned, performed: performed, diffs: diffs };
  }

  /* ---- writing it back ----------------------------------------------
     lk_splits holds a day's lifts in either of two shapes: `exIds: [111,
     302]` on a phone that has been running LOCKED, and the resolved
     `exercises: [{id, name, group, muscle}]` from the split builder.
     Whichever a day already carries is what it gets written back in --
     and a day carrying both keeps both, because Train reads one and the
     builder reads the other and a half-written day would show five
     lifts on one screen and two on another.
     ------------------------------------------------------------------ */

  function allSplits() {
    var raw = window.LKStore ? LKStore.get('lk_splits', null) : null;
    return Array.isArray(raw) ? raw : [];
  }
  function daySlug(name, i) {
    return String(name || ('day' + i)).toLowerCase().replace(/\W+/g, '-');
  }
  /* The day as it stands NOW, found by id first and by name second, so a
     day that has been renamed since the session is still found and a day
     that has been deleted is honestly not. */
  function findDay(src) {
    var all = allSplits();
    for (var i = 0; i < all.length; i++) {
      if (!sameId(all[i].id, src.splitId)) continue;
      var days = all[i].days || [];
      for (var j = 0; j < days.length; j++) {
        if (daySlug(days[j].name, j) === src.dayId) return { split: all[i], day: days[j], list: all };
      }
      for (var k = 0; k < days.length; k++) {
        if (days[k].name === src.dayName) return { split: all[i], day: days[k], list: all };
      }
      return null;
    }
    return null;
  }
  function dayLifts(d) {
    if (d && d.exercises && d.exercises.length) return d.exercises.slice();
    return ((d && d.exIds) || []).map(function (id) { return { id: id }; });
  }
  /* THE GROUP TOO, NOT ONLY THE NAME. What was logged carries an id, a
     name and a muscle; a stored split day carries a group as well, and a
     lift written into a day without one read as ungrouped everywhere the
     builder shows a day by group. The catalogue knows it, so it is asked
     rather than left blank. */
  function liftFor(id, drift) {
    var out = null;
    var pools = [drift.performed || [], drift.planned || []];
    for (var p = 0; p < pools.length && !out; p++) {
      for (var i = 0; i < pools[p].length; i++) {
        if (sameId(pools[p][i].id, id)) {
          var e = pools[p][i];
          out = { id: e.id, name: e.name, group: e.group || '', muscle: e.muscle || '' };
          break;
        }
      }
    }
    if (!out) out = { id: id, name: 'Exercise ' + id, group: '', muscle: '' };
    if ((!out.group || !out.muscle) && window.LKExercises && LKExercises.all) {
      var rows = LKExercises.all();
      for (var k = 0; k < rows.length; k++) {
        if (!sameId(rows[k].id, id)) continue;
        if (!out.group) out.group = rows[k].group || '';
        if (!out.muscle) out.muscle = rows[k].muscle || '';
        if (!out.name) out.name = rows[k].name;
        break;
      }
    }
    return out;
  }

  /* Applies the chosen differences and returns what the day looked like
     before, so Undo has something to put back. Returns null if anything
     is missing, and in that case nothing at all was written. */
  function writeSplit(drift, applied) {
    if (!window.LKStore || !drift || !applied || !applied.length) return null;
    var found = findDay({ splitId: drift.split.id, dayId: drift.split.dayId,
                          dayName: drift.split.day });
    if (!found) return null;
    var day = found.day;
    var before = { exercises: day.exercises ? JSON.parse(JSON.stringify(day.exercises)) : undefined,
                   exIds: day.exIds ? day.exIds.slice() : undefined,
                   updated: found.split.updated };
    /* WHAT THE DAY PRESCRIBED SURVIVES THE REWRITE. A day carries sets
       and reps on its lifts now, and every path below rebuilds the list
       out of what was logged -- an order change replaces it wholesale
       from `performed`, and a swap builds a fresh record from the
       catalogue. A session has no prescription in it, so all of them
       dropped it: reorder your Push day once and the 4 x 8-12 you or
       your coach wrote was gone from every lift in it.

       So it is taken off the stored day FIRST, by exercise id, and put
       back at the end whatever route the list took. A lift that was not
       in the day before -- one swapped in, one added mid-session --
       finds nothing here and is written unprescribed, which is the
       truth: nobody has said how to train it yet. */
    var wasPrescribed = {};
    dayLifts(day).forEach(function (e) {
      if (!e || e.id == null) return;
      if (e.sets != null || e.reps != null) {
        wasPrescribed[String(e.id)] = { sets: e.sets, reps: e.reps };
      }
    });
    /* The day as it stands wins on its own lifts: a name or a group the
       reader edited in the builder is theirs, and rebuilding the whole
       list out of the session would quietly write over it. */
    var list = dayLifts(day).map(function (e) {
      var k = liftFor(e.id, drift);
      return { id: e.id, name: e.name || k.name, group: e.group || k.group,
               muscle: e.muscle || k.muscle };
    });

    /* A DAY IS REWRITTEN IN SETS AND REPS TOO, not only in which lifts are
       in it. These two go into the same map the old prescriptions come out
       of, so whichever route the list takes below, the figure written back
       is the one that was actually trained. */
    var presChanged = false;
    applied.forEach(function (df) {
      if (df.kind !== 'sets' && df.kind !== 'reps') return;
      var pk = String(df.id);
      var row = wasPrescribed[pk] || (wasPrescribed[pk] = {});
      if (df.kind === 'sets') row.sets = df.now; else row.reps = df.now;
      presChanged = true;
    });

    applied.forEach(function (df) {
      if (df.kind === 'order') {
        list = drift.performed.map(function (e) { return liftFor(e.id, drift); });
        return;
      }
      if (df.kind === 'skipped') {
        list = list.filter(function (e) { return !sameId(e.id, df.fromId); });
        return;
      }
      if (df.kind === 'swap') {
        var at = -1;
        for (var i = 0; i < list.length; i++) if (sameId(list[i].id, df.fromId)) at = i;
        if (at > -1) list.splice(at, 1, liftFor(df.toId, drift));
        else if (!hasId(list, df.toId)) list.push(liftFor(df.toId, drift));
        return;
      }
      if (df.kind === 'added' && !hasId(list, df.toId)) list.push(liftFor(df.toId, drift));
    });

    /* EVERY DIFFERENCE TAKEN MEANS "SAVE THIS VERSION", so the day ends up
       in the order it was actually run in rather than the old order with
       the new lifts bolted on where the old ones stood. Applying only
       some of them leaves the rest of the day where it was, which is the
       whole point of choosing per change. */
    var sameSet = list.length === drift.performed.length;
    for (var s2 = 0; sameSet && s2 < list.length; s2++) {
      if (!hasId(drift.performed, list[s2].id)) sameSet = false;
    }
    if (sameSet) list = drift.performed.map(function (e) { return liftFor(e.id, drift); });

    /* Both shapes, or the one the day already had. A day with neither --
       a day somebody emptied -- is written in the builder's shape, which
       is the one every screen can read without a catalogue lookup. */
    /* A day held as bare ids has nowhere to put a prescription, so one that
       has just been given one grows the builder's shape to hold it. Left as
       ids, "3 sets, not 4" would have been answered yes and changed
       nothing. */
    if (day.exercises || !day.exIds || presChanged) {
      day.exercises = list.map(function (e) {
        var row = { id: e.id, name: e.name, group: e.group || '', muscle: e.muscle || '' };
        var was = wasPrescribed[String(e.id)];
        if (was) {
          if (was.sets != null) row.sets = was.sets;
          if (was.reps != null) row.reps = was.reps;
        }
        return row;
      });
    }
    if (day.exIds) day.exIds = list.map(function (e) { return e.id; });

    /* Train prints "edited <date>" from this, falling back to `created`.
       Left alone, a split rewritten from here still claimed to have been
       edited on the day it was first built. */
    found.split.updated = LKStore.today();
    LKStore.set('lk_splits', found.list);
    return before;
  }

  function restoreSplit(drift, before) {
    if (!window.LKStore || !drift || !before) return false;
    var found = findDay({ splitId: drift.split.id, dayId: drift.split.dayId,
                          dayName: drift.split.day });
    if (!found) return false;
    if (before.exercises === undefined) delete found.day.exercises;
    else found.day.exercises = before.exercises;
    if (before.exIds === undefined) delete found.day.exIds;
    else found.day.exIds = before.exIds;
    if (before.updated === undefined) delete found.split.updated;
    else found.split.updated = before.updated;
    LKStore.set('lk_splits', found.list);
    return true;
  }

  /* HOW IT FELT. One four-chip question -- easy, steady, hard, all out --
     was stored nowhere and shown nowhere afterwards: workout-detail's "How
     it felt" card reads a reflection of five one-to-five ratings, and every
     session in the seed carries those five. So this asks for the five the
     data actually has, under the keys the data actually uses, and what is
     answered here is what that card reads back. Still optional, still below
     the fold, and it still gates nothing. */
  var REFLECT = [
    ['energy',     'Energy'],
    ['focus',      'Focus'],
    ['pump',       'Pump'],
    ['difficulty', 'Difficulty'],
    ['enjoyment',  'Enjoyment']
  ];

  /* ---- screen state ---------------------------------------------- */
  /* Review reviews a session that was handed over. Opened with nothing handed
     and no seed to fall back on -- a new account -- there is no session, and
     the screen says so instead of showing the demo's Push. */
  var S = { view: (window.LKFixtures ? 'record' : 'empty'),
            saved: false, reflection: {}, note: '', discardArmed: false,
            ai: 'idle', toast: null,
            /* split: 'pending' | 'updated' | 'kept'. sheet is the pop-up. */
            split: 'pending', applied: [], sheet: false,
            /* Shut on entry, every time. The rest of the session is a thing
               you go looking for, not a thing the screen opens at you. */
            detail: false,
            throwbackGone: false };

  /* ---- blocks ----------------------------------------------------- */

  /* The receipt line. One line, not three tiles: these are numbers the
     lifter watched accumulate, so they confirm, they do not lead. */
  function receipt(d) {
    return '<p class="t-detail mt-2" data-testid="session-totals">' +
      n(d.sets) + ' working ' + LKPlural(d.sets, 'set') + ' · ' + kg(d.volumeKg) + ' · ' + n(d.minutes) + ' min' +
      '</p>';
  }

  /* The record. Only drawn when there is one, and it names the mark it
     beat, because "new record" without the old number is a compliment
     rather than information. */
  function recordCard(r) {
    return '' +
      '<div class="card mt-4 enter-rise" data-testid="card-record">' +
        '<div class="hstack hstack--3">' +
          '<span class="ico-well delta--up">' + ICO.record + '</span>' +
          '<div class="grow stack stack--1">' +
            '<div><span class="badge badge--success">Personal record</span></div>' +
            '<h2 class="t-section">' + r.lift + '</h2>' +
          '</div>' +
        '</div>' +
        '<p class="t-body-em mt-3 num">' + set(r.w, r.r) + '</p>' +
        '<p class="t-detail">Beat ' + set(r.prevW, r.prevR === undefined ? r.r : r.prevR) +
          ', set ' + r.prevDate + '.</p>' +
      '</div>';
  }

  /* ---- THE THROWBACK -------------------------------------------------
     One session in five, after the save decision is already on screen, this
     says what the same lift looked like a long time ago. The shipped app had
     it, the rebuild dropped it with no note anywhere saying so, and the note
     Progress left about cutting its own copy was that a 25% Math.random()
     card is unreproducible -- a screenshot of it can never be taken twice
     and a test can never assert it.

     So the roll is 1-in-5 and DETERMINISTIC: it is a hash of the session
     being reviewed, which means the same session always makes the same
     decision, on every device and in every test run, and it is still a
     surprise because nobody knows the hash of their Tuesday.

     It only draws when there is something real behind it: a lift in this
     session that was also trained at least thirty days ago, and that has
     gone up since. Dismissing writes lk_throwbackDismissed -- the shipped
     app's own key -- and nothing asks again for three days.
     -------------------------------------------------------------------- */
  var THROWBACK_MIN_DAYS = 30;
  var THROWBACK_QUIET_DAYS = 3;
  /* The same list workout-detail reads: the store, with the seed behind it.
     FX.lastTime above answers a different question -- the MOST RECENT
     session before a date -- and cannot reach back to the oldest one. */
  function historyList() {
    var seed = (window.LKFixtures && LKFixtures.history) || [];
    var list = window.LKStore ? LKStore.get('lk_history', seed) : seed;
    return Array.isArray(list) ? list : seed;
  }
  function isoMs(iso) {
    var a = String(iso || '').slice(0, 10).split('-');
    return a.length === 3 ? Date.UTC(+a[0], +a[1] - 1, +a[2]) : NaN;
  }
  function today() {
    return window.LKStore ? LKStore.today() : new Date().toISOString().slice(0, 10);
  }
  function throwbackQuiet() {
    var raw = window.LKStore ? LKStore.get('lk_throwbackDismissed', null) : null;
    if (!raw) return false;
    var then = Date.parse(raw);
    if (isNaN(then)) return false;
    return (isoMs(today()) - then) < THROWBACK_QUIET_DAYS * 86400000;
  }
  /* 32-bit FNV-ish, which is all a 1-in-5 needs. */
  function rollOf(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return h % 5;
  }
  function throwback(d) {
    if (S.throwbackGone || throwbackQuiet()) return null;
    if (!d || !d.lifts || !d.lifts.length) return null;
    var key = String(d.dateISO || d.date || '') + '|' + String(d.title || '');
    if (rollOf(key) !== 0) return null;
    var cut = isoMs(d.dateISO || today()) - THROWBACK_MIN_DAYS * 86400000;
    if (isNaN(cut)) return null;
    var best = null;
    var list = historyList();
    d.lifts.forEach(function (l) {
      if (!l.top) return;
      /* The OLDEST session with this lift in it, that far back. */
      var found = null;
      list.forEach(function (w) {
        if (w.kind === 'cardio' || !w.exercises) return;
        var when = isoMs(w.date);
        if (isNaN(when) || when > cut) return;
        w.exercises.forEach(function (ex) {
          if (Number(ex.id) !== Number(l.id)) return;
          if (!found || when < found.when) {
            var st = window.LKFixtures && LKFixtures.liftStats ? LKFixtures.liftStats(ex) : null;
            if (st && st.top) found = { when: when, date: w.date, top: st.top };
          }
        });
      });
      if (!found) return;
      var gain = l.top[0] - found.top[0];
      if (gain <= 0) return;                 /* no progression is not a throwback */
      if (!best || gain > best.gain) {
        best = { name: l.name, now: l.top, then: found.top, thenDate: found.date, gain: gain,
                 days: Math.round((isoMs(d.dateISO || today()) - found.when) / 86400000) };
      }
    });
    return best;
  }

  function throwbackCard(d) {
    var t = throwback(d);
    if (!t) return '';
    return '<div class="section" data-testid="section-throwback">' +
      '<div class="card" data-testid="card-throwback">' +
        '<div class="spread"><span class="t-label">' + t.days + ' days ago</span>' +
          '<button class="btn btn--tertiary btn--sm" data-testid="action-throwback-dismiss">' +
            '<span class="btn__label">Hide</span></button></div>' +
        '<h2 class="t-section mt-2">' + esc(t.name) + '</h2>' +
        '<p class="t-body-em mt-2">' + set(t.then[0], t.then[1]) + ' \u2192 ' + set(t.now[0], t.now[1]) + '</p>' +
        '<p class="t-detail mt-1">' + shortDate(t.thenDate) + ' to today, ' +
          n((t.gain > 0 ? '+' : '\u2212') + LKUnits.v(Math.abs(t.gain))) + ' ' + LKUnits.label() +
          ' on the top set.</p>' +
      '</div></div>';
  }

  /* The comparison. The reason this screen exists: it is computed on
     the device from lk_history and needs no network. */
  function compare(d) {
    /* Nothing to compare against is an answer. Without this the card
       divided by a prior volume that no longer exists, and before PRIOR
       was emptied it printed a fixture's session as the reader's own. */
    if (!PRIOR || !PRIOR.volumeKg) {
      return '' +
        '<div class="section" data-testid="section-compare">' +
          '<div class="section__head"><h2 class="t-label">Against last time</h2></div>' +
          '<div class="card">' +
            '<p class="t-body">This is the first time these lifts have been logged, so there is ' +
              'nothing to measure today against yet.</p>' +
            '<p class="t-detail quiet mt-2">Log them again and this card compares the two.</p>' +
          '</div>' +
        '</div>';
    }
    var delta = d.volumeKg - PRIOR.volumeKg;
    var pct = (delta / PRIOR.volumeKg) * 100;
    var pctText = (delta >= 0 ? '+' : '−') + Math.abs(pct).toFixed(1) + '%';

    var rows = d.lifts.map(function (l) {
      /* A lift the prior session did not contain gets no number: it is
         marked new and left uncompared, because a delta against nothing
         is not a measurement. */
      var isNew = l.priorTop === null;
      return '' +
        '<div class="row" data-testid="lift-' + l.name.toLowerCase().replace(/[^a-z]+/g, '-') + '">' +
          '<span class="row__main">' +
            '<span class="row__title">' + esc(l.name) + '</span>' +
            '<span class="row__sub">' + set(l.top[0], l.top[1]) +
              (isNew ? ', not in the Sep 3 session'
                     : ', was ' + set(l.priorTop[0], l.priorTop[1])) + '</span>' +
          '</span>' +
          (isNew
            ? '<span class="row__value delta--flat">New</span>'
            : '<span class="row__value delta--' + dir(l.delta) + '">' + signedKg(l.delta) + '</span>') +
        '</div>';
    }).join('');

    return '' +
      '<div class="section" data-testid="section-compare">' +
        '<div class="section__head">' +
          '<h2 class="t-label">Against ' + esc(PRIOR.name) + ', ' + esc(PRIOR.dateLabel) + '</h2>' +
        '</div>' +
        '<div class="card enter-rise">' +
          '<div class="spread">' +
            '<div class="hero">' +
              '<span class="hero__figure">' +
                '<span class="t-hero num delta--' + dir(delta) + '" data-testid="volume-delta">' +
                  (delta >= 0 ? '+' : '−') + Math.abs(delta).toLocaleString('en-US') +
                '</span>' +
                '<span class="hero__unit">kg</span>' +
              '</span>' +
              '<span class="hero__label">Working volume</span>' +
            '</div>' +
            '<span class="t-body-em num delta--' + dir(delta) + '">' + pctText + '</span>' +
          '</div>' +
          '<p class="t-detail mt-2 num">' + kg(d.volumeKg) + ' today, ' + kg(PRIOR.volumeKg) + ' on ' + PRIOR.dateLabel + '</p>' +
        '</div>' +
        '<div class="card card--flush mt-3">' + rows + '</div>' +
        '<p class="t-meta mt-2">Change is working-set volume. Warm-ups excluded.' +
          (d.mixed ? ' The exercises differ from Sep 3, so the day total is not like for like.' : '') +
        '</p>' +
      '</div>';
  }

  /* ---- the split question, as a small pop-up ------------------------
     THE WALL. Review used to stack the lift comparison, two "against last
     time" cards, the five feel ratings, a note, every set of the session,
     and a full-width card arguing about the split -- at the moment a
     person is standing by a rack with one hand free and about ten seconds
     of patience. The owner's note was exactly that: "it shows you lines
     and lines of recap data."

     So the difference is not a card any more. The first page carries one
     small bubble that says the day ran differently, and everything the
     decision needs is in a pop-up behind it: one or two lines saying what
     changed, and the two answers. Save this version, or keep the one you
     had.

     WHAT WENT. The per-change sheet, with a checkbox for every difference,
     is gone. There are two versions of a day, the one you ran and the one
     you had, and a screen that asks you to assemble a third out of
     checkboxes at the end of a workout is asking too much. Undo is still
     there, which is the real safety net.

     AND A SKIP NOW COUNTS. It used to be held back unless it was picked by
     name, on the reasoning that missing a lift is usually the rack or the
     clock. That reasoning does not survive the new wording: the button
     says save this as your Push day, the line above it says the lateral
     raise was skipped, and a save that quietly kept the lateral raise
     would not be saving this day at all. Keep the previous version is the
     answer for a session that ran short.
     ------------------------------------------------------------------ */

  /* ONE LINE PER DIFFERENCE, short enough to read standing up. No icon, no
     second line, no explanation: the owner asked for this twice and the
     word he used was simplistic.

     EVERY NAME IN HERE IS SOMEBODY'S OWN WORDS. The day, the split and both
     lift names are read off the split and off the session, and a custom
     exercise can be called anything at all. Escaped, or a lift named with
     an angle bracket rewrites the sheet. */
  function diffBullet(diff) {
    if (diff.kind === 'swap') return esc(diff.to) + ' replaces ' + esc(diff.from);
    if (diff.kind === 'added') return esc(diff.to) + ' added';
    if (diff.kind === 'skipped') return esc(diff.from) + ' skipped';
    if (diff.kind === 'order') return 'A different order';
    if (diff.kind === 'sets') {
      var by = diff.now - diff.was;
      return esc(diff.name) + ' ' + n((by > 0 ? '+' : '−') + Math.abs(by)) + ' ' +
             LKPlural(Math.abs(by), 'set');
    }
    return esc(diff.name) + ' ' + n(diff.now) + ' reps, not ' + n(diff.was);
  }

  /* What a given set of applied differences did, in one named line. */
  function appliedLine(applied) {
    return applied.map(function (dd) {
      if (dd.kind === 'swap') return esc(dd.to) + ' replaces ' + esc(dd.from) + '.';
      if (dd.kind === 'added') return esc(dd.to) + ' added.';
      if (dd.kind === 'skipped') return esc(dd.from) + ' removed.';
      if (dd.kind === 'order') return 'The order you ran it in was kept.';
      if (dd.kind === 'sets') return esc(dd.name) + ' now ' + dd.now + ' ' +
        LKPlural(dd.now, 'set') + '.';
      return esc(dd.name) + ' now ' + dd.now + ' reps.';
    }).join(' ');
  }

  /* THE BUBBLE. A pill, not a card: it names the day and how many things
     ran differently, and it opens the pop-up. It never gates Save, and a
     reader who ignores it has answered nothing and lost nothing. */
  function splitCard(d) {
    if (!d.split || !d.diffs || !d.diffs.length) return '';
    var DAY = esc(SPLIT.day);
    if (S.split === 'updated') {
      return '<div class="section" data-testid="section-split">' +
        '<p class="t-detail" data-testid="card-split-updated">' + DAY + ' saved. ' +
          appliedLine(S.applied) + '</p>' +
        '<button class="btn btn--tertiary btn--sm mt-2" data-testid="split-undo">' +
          '<span class="btn__label">Undo</span></button>' +
      '</div>';
    }
    if (S.split === 'kept') {
      return '<div class="section" data-testid="section-split">' +
        '<p class="t-meta" data-testid="split-kept">' + DAY + ' kept as it is.</p></div>';
    }
    return '<div class="section" data-testid="section-split">' +
      '<button class="bubble" type="button" data-testid="split-open" ' +
              'aria-haspopup="dialog">' +
        '<span class="bubble__main">' + DAY + ' ran differently</span>' +
        '<span class="bubble__count num">' + d.diffs.length + '</span>' +
      '</button></div>';
  }

  /* THE POP-UP. .sheet is the build's own squircle -- corner-shape:
     var(--corner-smooth) on an inset panel -- so this is the shape that was
     asked for without a new radius anywhere. It is short by design: a
     question, up to two lines of fact, two answers.

     MORE THAN TWO DIFFERENCES still only draws two lines. The rest are
     counted on one quiet line, because the answer does not change with the
     sixth of them and a pop-up that grows into a list is the wall again. */
  function splitSheet(d) {
    var DAY = esc(SPLIT.day);
    var shown = d.diffs.slice(0, 2);
    var rest = d.diffs.length - shown.length;
    return '' +
      '<div class="scrim" data-testid="scrim"></div>' +
      '<div class="sheet sheet--mini" role="dialog" aria-modal="true" ' +
           'aria-labelledby="split-sheet-title" data-testid="split-sheet">' +
        '<div class="sheet__head">' +
          '<h2 class="t-section" id="split-sheet-title">Save this as your ' + DAY + ' day?</h2>' +
          '<button class="iconbtn" type="button" data-testid="split-sheet-close" ' +
                  'aria-label="Close, change nothing">' + ICO.close + '</button>' +
        '</div>' +
        '<ul class="bullets" data-testid="split-bullets">' +
          shown.map(function (dd, i) {
            return '<li class="bullets__li" data-testid="split-diff-' + i + '">' +
                   diffBullet(dd) + '</li>';
          }).join('') +
        '</ul>' +
        (rest > 0
          ? '<p class="t-meta mt-2" data-testid="split-more">and ' + rest + ' more</p>'
          : '') +
        '<div class="sheet__foot">' +
          '<button class="btn btn--secondary btn--block" data-testid="split-update">' +
            '<span class="btn__label">Save as your ' + DAY + ' day</span></button>' +
          '<button class="btn btn--tertiary btn--block mt-2" data-testid="split-keep">' +
            '<span class="btn__label">Keep the previous version</span></button>' +
        '</div>' +
      '</div>';
  }

  /* THE READ IS ASKED FOR, NOT INVENTED. This used to be a 900 ms timer
     that set done or error from whichever dev state was showing, and the
     text under it came from the fixture -- which is the one thing a card
     labelled "Generated, not measured" must never be, because a reader
     has no way to tell a written read from a fabricated one.

     It sends the session's own figures and nothing else: the totals this
     screen computed, the sets, and how they compare to last time. A
     failure stays a failure, and saving never waits for it. */
  function sessionForCoach(d) {
    d = d || {};
    var out = {
      name: d.name || (d.session && d.session.name) || 'this session',
      volumeKg: d.volume || (d.totals && d.totals.volume) || null,
      sets: d.sets || (d.totals && d.totals.sets) || null,
      minutes: d.minutes || (d.totals && d.totals.minutes) || null
    };
    if (Array.isArray(d.lifts)) {
      out.lifts = d.lifts.slice(0, 10).map(function (l) {
        return { name: l.name, best: l.best || l.top || null, last: l.last || null };
      });
    }
    return out;
  }

  function askCoach() {
    var C = window.LKCloud;
    var d = DATA[S.view] || {};
    if (!C || !C.coachReady()) {
      /* No endpoint, so no read, and the card says which rather than
         spinning at somebody. */
      S.ai = 'error';
      S.aiWhy = 'The coach is not available, so nothing was asked and nothing was ' +
                'written. Your session is untouched.';
      paint(true);
      return;
    }
    S.ai = 'loading'; S.aiWhy = null; paint(true);
    C.ask([{ role: 'user',
             content: 'Write one short paragraph about the session below. Use only the ' +
                      'numbers given. Do not state a total that is not there, and do not ' +
                      'invent a lift. ' + JSON.stringify(sessionForCoach(d)) }],
           { })
      .then(function (r) {
        if (S.view !== 'record' && S.view !== 'populated') return;
        if (!r || !r.ok || !r.data || !String(r.data.reply || '').trim()) {
          S.ai = 'error';
          S.aiWhy = (r && r.message) || null;
          paint(true);
          return;
        }
        S.aiText = String(r.data.reply).trim().slice(0, 900);
        S.ai = 'done';
        paint(true);
      }, function () {
        S.ai = 'error'; S.aiWhy = null; paint(true);
      });
  }

  /* The one thing on the screen that is not measured. Dashed, labelled,
     never fetched unless asked, and a failure stays a failure. */
  function aiCard(d) {
    var inner;
    if (S.ai === 'idle') {
      inner = '<p class="t-detail">A written read on this session and the five before it. ' +
              'The figures above are computed on this phone; this is not, and saving ' +
              'does not wait for it.</p>' +
              '<button class="btn btn--secondary btn--block mt-3" data-testid="ai-ask">' +
                '<span class="btn__label">Ask coach</span></button>';
    } else if (S.ai === 'loading') {
      inner = '<div class="hstack hstack--3" role="status" aria-live="polite">' +
                '<span class="spinner"></span>' +
                '<span class="t-detail">Reading your last six Push sessions.</span>' +
              '</div>';
    } else if (S.ai === 'error') {
      inner = '<div class="banner banner--error" role="alert" data-testid="ai-error">' +
                ICO.alert +
                '<span><strong>Coach did not answer</strong>' + esc(S.aiWhy ||
                  'The request did not come back. Your session is untouched and the ' +
                  'comparison above is unaffected.') + '</span>' +
              '</div>' +
              '<button class="btn btn--secondary btn--block mt-3" data-testid="ai-retry">' +
                '<span class="btn__label">Try again</span></button>';
    } else {
      /* What came back, when something did. d.insight is the fixture's own
         line and only shows on a dev state nobody asked the coach from. */
      inner = S.aiText
        ? '<p class="t-detail" data-testid="ai-text">' + esc(S.aiText) + '</p>'
        : d.insight
        ? '<p class="t-detail" data-testid="ai-text">' + d.insight + '</p>'
        : '<p class="t-detail" data-testid="ai-text">Nothing was written about this session. ' +
          'The figures above are yours and are computed on this phone. Nothing wrote a ' +
          'read on them for this session.</p>';
    }
    return '' +
      '<div class="section">' +
        '<div class="card card--flush card--unverified" data-testid="card-ai">' +
          '<div class="card__head">' +
            '<span class="t-label grow">Coach note</span>' +
            '<span class="badge">Generated, not measured</span>' +
          '</div>' +
          '<div style="padding: var(--sp-4)">' + inner + '</div>' +
        '</div>' +
      '</div>';
  }

  /* Optional, secondary, and it gates nothing. Five ratings and a line of
     text, all of it saved with the session and all of it readable again on
     the session's own screen days later. */
  function feelSection() {
    var rows = REFLECT.map(function (f) {
      var v = S.reflection[f[0]];
      var dots = '';
      for (var i = 1; i <= 5; i++) {
        dots += '<button class="rate__dot" type="button" aria-pressed="' + (v === i) + '" ' +
          'data-rate="' + f[0] + '" data-val="' + i + '" data-testid="rate-' + f[0] + '-' + i + '" ' +
          'aria-label="' + f[1] + ', ' + i + ' of 5">' + i + '</button>';
      }
      return '<div class="rate" role="group" aria-label="' + f[1] + ', one to five, optional" ' +
               'data-testid="rate-' + f[0] + '">' +
          '<span class="rate__label t-detail">' + f[1] + '</span>' +
          '<span class="rate__dots">' + dots + '</span>' +
        '</div>';
    }).join('');
    return '' +
      '<div class="section" data-testid="section-feel">' +
        '<div class="section__head">' +
          '<h2 class="t-label">How was this workout</h2>' +
          '<span class="t-meta">Optional</span>' +
        '</div>' +
        '<div class="card">' + rows +
          '<p class="t-meta mt-2">One is low, five is high. Saved with the session.</p>' +
        '</div>' +
      '</div>';
  }

  /* THE NOTE MOVED DOWN WITH THE REST OF IT. It is worth having and it is
     not worth a text field on a screen whose whole job is now one question
     and three figures. Anybody who has something to write will open the
     rest of the session to find the sets anyway. */
  function noteSection() {
    return '' +
      '<div class="section" data-testid="section-note">' +
        '<div class="section__head">' +
          '<h2 class="t-label">Note</h2>' +
          '<span class="t-meta">Optional</span>' +
        '</div>' +
        '<div class="card">' +
          '<label class="vis-hidden" for="session-note">A note about this session</label>' +
          '<textarea class="input" id="session-note" rows="2" data-testid="session-note" ' +
            'placeholder="What is worth remembering about this one?">' + esc(S.note) + '</textarea>' +
        '</div>' +
      '</div>';
  }

  /* WHAT YOU ACTUALLY DID. The screen compared today against last time and
     never once showed a set: a lifter asking "how many did I get on the
     third one" had to leave and find the session in their history, which is
     the one screen this one is supposed to save them. */
  function setsSection(d) {
    if (!d.exercises || !d.exercises.length) return '';
    return '<div class="section" data-testid="section-sets">' +
        '<div class="section__head"><h2 class="t-label">Every set</h2>' +
          '<span class="t-meta num">' + d.exercises.length + '</span></div>' +
        d.exercises.map(function (e, i) {
          var wi = 0;
          return '<div class="card card--flush mt-3" data-testid="rex-' + i + '">' +
              '<div class="card__head"><span class="t-label grow">' + esc(e.name) + '</span>' +
                '<span class="t-meta">' + esc(e.muscle || '') + '</span></div>' +
              '<div style="padding: 0 var(--sp-4) var(--sp-4)">' +
                e.sets.map(function (s, k) {
                  /* A right-hand row is the same set on the other side, so it
                     takes its set's number rather than the next one. */
                  if (!s.warm && s.side !== 'R') wi++;
                  return '<div class="rsetline" data-testid="rset-' + i + '-' + k + '">' +
                      '<span class="rsetline__n' + (s.warm ? ' rsetline__n--warm' : '') + '">' +
                        (s.warm ? 'W' : wi + (s.side || (s.repsR != null ? ' L/R' : ''))) + '</span>' +
                      '<span class="t-detail num">' + setLine(s) + '</span>' +
                      '<span class="t-meta num">' + (s.rir != null ? s.rir + ' RIR' : '') + '</span>' +
                    '</div>';
                }).join('') +
              '</div>' +
            '</div>';
        }).join('') +
      '</div>';
  }

  /* Two-step, and the second step names the consequence. */
  function discardSection(sets) {
    if (S.discardArmed) {
      var what = sets
        ? 'The ' + sets + ' sets you logged are deleted and nothing is written to your history.'
        : 'This session is closed and nothing is written to your history.';
      return '' +
        '<div class="section" data-testid="section-discard">' +
          '<div class="banner banner--error" role="alert">' + ICO.alert +
            '<span><strong>Discard this session</strong>' + what + '</span></div>' +
          '<div class="hstack hstack--2 mt-3">' +
            '<button class="btn btn--secondary grow" data-testid="action-discard-cancel">' +
              '<span class="btn__label">Keep it</span></button>' +
            '<button class="btn btn--danger-solid grow" data-testid="action-discard-confirm">' +
              '<span class="btn__label">Discard</span></button>' +
          '</div>' +
        '</div>';
    }
    return '' +
      '<div class="section" data-testid="section-discard">' +
        '<button class="btn btn--danger btn--block" data-testid="action-discard">' +
          '<span class="btn__label">Discard session</span></button>' +
      '</div>';
  }

  /* ---- the pinned bar --------------------------------------------
     Save never scrolls away, so banking the session is one tap from
     the state the screen opens in, whatever the scroll position. */
  function saveBar(opts) {
    /* Opened from the index or a dev state, there is no workout behind this
       screen. The button stays -- it is the shape of the screen -- and the
       line beside it says what it will find to save. */
    if (!HANDED && !S.saved) {
      return '<div class="actionbar" role="contentinfo" aria-label="Session actions" data-testid="actionbar">' +
               '<span class="actionbar__status" data-testid="save-status">Demo session</span>' +
               '<button class="btn btn--primary" data-testid="action-save">' +
                 '<span class="btn__label">Save session</span></button>' +
             '</div>';
    }
    if (S.saved) {
      return '<div class="actionbar" role="contentinfo" aria-label="Session actions" data-testid="actionbar">' +
               /* tabindex -1 so focus can be MOVED here without the status
                  joining the tab order. Saving disables the button that was
                  pressed, and focus has to land somewhere that says what
                  happened rather than on <body>. */
               '<span class="actionbar__status" role="status" tabindex="-1" data-testid="save-status">' +
                 'Saved to history</span>' +
               /* A WAY FORWARD, NOT A FULL STOP. This was a disabled button
                  reading "Saved", so finishing a workout and banking it left
                  the reader on a screen with nothing on it to press: the last
                  act of a session ended in a dead end. The status still says
                  what happened; the button now does the thing somebody
                  actually wants next. */
               '<button class="btn btn--primary" data-testid="action-done">' +
                 '<span class="btn__label">Done</span></button>' +
             '</div>';
    }
    var busy = opts && opts.disabled;
    return '<div class="actionbar" role="contentinfo" aria-label="Session actions" data-testid="actionbar">' +
             '<span class="actionbar__status">' + (opts && opts.status ? opts.status : '') + '</span>' +
             '<button class="btn btn--primary" data-testid="action-save"' +
               (busy ? ' disabled' : '') + '>' +
               '<span class="btn__label">Save session</span></button>' +
           '</div>';
  }

  /* ---- states ------------------------------------------------------ */
  var VIEWS = {};

  /* ---- ONE PAGE, ONE QUESTION ---------------------------------------
     WHAT SURVIVED. The receipt line, because three figures a person
     watched accumulate are worth one line to confirm. A record, because a
     record is the one thing that happened today that nobody already knew.
     The feel question, because it is the thing the screen is asking for.
     The split bubble, when the day ran differently. And Discard, because
     a session that should not be saved has to have a way out of here.

     WHAT MOVED. The comparison against last time, the throwback, every set
     of the session, the note and the coach's written read all sit behind
     one control. They are worth having and none of them is worth reading
     in the ten seconds after a last set, which is the only moment this
     screen is ever open in.

     ONE CONTROL, not seven collapsed sections. A page with seven things to
     open is the same wall with extra taps in it.
     ------------------------------------------------------------------ */
  function detailButton() {
    return '<div class="section">' +
      '<button class="btn btn--tertiary btn--block" data-testid="action-detail" ' +
              'aria-expanded="' + (S.detail ? 'true' : 'false') + '" aria-controls="detail">' +
        '<span class="btn__label">' +
          (S.detail ? 'Hide the rest of it' : 'The rest of this session') +
        '</span></button></div>';
  }
  function detailBody(d) {
    if (!S.detail) return '';
    return '<div id="detail" data-testid="section-detail">' +
      compare(d) + throwbackCard(d) + setsSection(d) + noteSection() + aiCard(d) +
      '</div>';
  }

  function full(d) {
    return {
      body: receipt(d) + (d.record ? recordCard(d.record) : '') +
            feelSection() + splitCard(d) +
            detailButton() + detailBody(d) + discardSection(d.sets),
      bar: saveBar({ status: d.record ? 'Record included' : '' }),
      overlay: (S.sheet && d.diffs) ? splitSheet(d) : ''
    };
  }
  VIEWS.record = function () { return full(DATA.record); };
  VIEWS.populated = function () { return full(DATA.populated); };
  /* Every difference variant is the same screen with a different
     session behind it. Record, populated and error carry no split
     difference and so draw no card at all. */
  VIEWS['diff-swap']     = function () { return full(DATA['diff-swap']); };
  VIEWS['diff-add-skip'] = function () { return full(DATA['diff-add-skip']); };
  VIEWS['diff-skip']     = function () { return full(DATA['diff-skip']); };
  VIEWS['diff-many']     = function () { return full(DATA['diff-many']); };
