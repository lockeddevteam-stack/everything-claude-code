     `{name, by, now: 'Not started'}` -- three keys, none of which goalPct,
     goalNow, goalBy, activeGoals or nextGoalDue look at -- so every goal
     added by hand sat at 0% forever under a bar that could never move, and
     the whole measured-goal machinery above only ever ran on the seed.

     A goal is a type, a start, a target and a date. The type is what says
     which number watches it: a weight goal reads the weigh-in log, a body-fat
     goal reads the body-fat log, a lift goal reads your records. `custom` is
     kept for the things nothing measures, and it says "You decide" rather
     than printing a percentage it cannot compute. */
  function saveGoal() {
    var val = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
    var type = S.goalType || 'weight';
    var name = String(val('gl-name')).trim();
    var target = parseFloat(val('gl-target'));
    var start = parseFloat(val('gl-start'));
    var date = String(val('gl-date')).trim();
    var exId = type === 'lift' ? Number(val('gl-lift')) : null;

    if (type === 'lift' && !name) {
      var lf = liftById(exId);
      name = lf ? lf.name + ' to ' + num1(target || 0) + ' kg' : '';
    }
    if (!name) { S.goalError = 'What are you aiming at?'; render(); focusIn('gl-name'); return; }
    if (type !== 'custom') {
      if (isNaN(target)) { S.goalError = 'What number are you aiming for?'; render(); focusIn('gl-target'); return; }
      /* The start defaults to where you are now, which is the honest zero
         point: a bar measured from nothing is measured from nothing. */
      if (isNaN(start)) {
        var nowv = goalNow({ type: type, exId: exId });
        if (nowv === null || nowv === undefined) {
          S.goalError = 'Nothing is logged to start from. Log one first, or type a starting figure.';
          render(); focusIn('gl-start'); return;
        }
        start = nowv;
      }
      if (start === target) { S.goalError = 'The start and the target are the same number.'; render(); focusIn('gl-target'); return; }
    }
    GOALS.push(normGoal({
      type: type, name: name, exId: exId,
      target: type === 'custom' ? null : target,
      start: type === 'custom' ? null : start,
      unit: type === 'bodyfat' ? '%' : type === 'custom' ? '' : 'kg',
      targetDate: date, status: 'active', created: new Date().toISOString()
    }));
    saveGoals();
    S.goalForm = false; S.goalError = null; S.goalType = null;
    S.toast = 'Goal added.';
    render();
  }

  function saveRecord() {
    var liftSel = document.getElementById('rec-lift');
    /* `load`, not `kg`: kg() is the formatter and a local of that name
       shadowed it, so the toast threw the moment a record was saved. */
    var load = parseFloat((document.getElementById('rec-kg') || {}).value);
    var reps = parseInt((document.getElementById('rec-reps') || {}).value, 10);
    if (isNaN(load) || load <= 0) { S.recordError = 'How much did you lift?'; render(); focusIn('rec-kg'); return; }
    if (isNaN(reps) || reps < 1) { S.recordError = 'At least one rep.'; render(); focusIn('rec-reps'); return; }
    var id = liftSel ? Number(liftSel.value) : 0;
    /* A record has to beat the record. This accepted 1 kg for 5 as a Leg
       Press record against a stored best of 165 for 10, and then redated the
       row to today -- so the screen asserted a personal best that had never
       been lifted, and buried the real one.

       Beating it means more weight at the same reps or better, or the same
       weight for more reps. Anything else is a set, and a set belongs in a
       session rather than in the record book. */
    var beaten = null;
    RECORDS.forEach(function (r) {
      if (r.id !== id) return;
      if (r.kg > load && r.reps >= reps) { if (!beaten || r.kg > beaten.kg) beaten = r; }
      else if (r.kg === load && r.reps >= reps) { if (!beaten || r.reps > (beaten.reps || 0)) beaten = r; }
    });
    if (beaten) {
      var lift0 = liftById(id);
      S.recordError = (lift0 ? lift0.name : 'That lift') + ' already has ' + num1(beaten.kg) +
        ' kg for ' + beaten.reps + '. A record has to beat the record \u2014 more weight at the ' +
        'same reps, or the same weight for more. Log it as a set instead.';
      render(); focusIn('rec-kg'); return;
    }
    RECORDS.unshift({ id: id, reps: reps, kg: load, date: todayISO() });
    saveRecords();
    S.recordError = null;
    S.sheet = false;
    var lift = liftById(id);
    S.toast = (lift ? lift.name : 'Record') + ', ' + num1(load) + ' kg for ' + reps + '. Added.';
    render();
    refocus('log-record');
  }

  function refocus(testid) {
    var back = document.querySelector('[data-testid="' + testid + '"]');
    if (back) back.focus();
  }

  document.addEventListener('input', function (e) {
    if (e.target.id !== 'rec-q') return;
    S.recordQ = e.target.value;
    render();
    var back = document.getElementById('rec-q');
    if (back) { back.focus(); try { back.setSelectionRange(back.value.length, back.value.length); } catch (err) {} }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.sheet) { e.preventDefault(); closeSheet(true); return; }
    if (e.key !== 'Tab' || !S.sheet) return;
    var f = overlay.querySelectorAll('button');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!overlay.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(drawChart, 100);
  });

  /* ---- dev state toggle ------------------------------------------ */
  var STATES = [
    ['populated', 'Populated'],
    ['empty', 'Empty'],
    ['loading', 'Loading'],
    ['error', 'Error']
  ];
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join(''));
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (!b) return;
    S.view = b.dataset.state;
    S.sheet = false;
    render();
  });

  var q = new URLSearchParams(location.search);
  if (q.get('state') && VIEWS[q.get('state')]) S.view = q.get('state');
  if (q.get('range')) S.range = q.get('range');
  render();
})();

  /* The running workout, from a screen that is not it. Leaving the workout
     log used to lose the session outright: nothing was written down, and no
     screen but Home and Fuel had anywhere to say one was open. The record
     lives in session.js; this mounts its shelf and takes the tap back. */
  if (window.LKSession) {
    LKSession.mount(document.getElementById('shelf-slot'),
      typeof LKPatch === 'function' ? LKPatch : null);
    document.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-testid="shelf-resume"]') : null;
      if (el) { e.preventDefault(); location.href = 'workout-log.html'; }
    });
  }
</script>
</body>
</html>
