<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">

<body>
<!--
  PROGRESS — what survives, and why.

  The audits measured a screen that promised a trend and showed none: a
  448px tab strip inside a 353px box (PR Vault clipped to zero visible
  pixels, no scroll affordance), five unrelated surfaces on one strip,
  and the app's only per-lift chart two levels deep behind the invisible
  tab. That chart had no axes, rescaled so the lowest point always sat on
  the floor, spaced points by index while labelling them with dates,
  letterboxed into 120 of 319px, and two of its three ranges returned
  identical data. The worst contrast in the app was here: 2.2:1 on a chip
  label dimmed by a row-level opacity:.5.

  THIS SCREEN ANSWERS ONE QUESTION: am I getting stronger.

  KEPT / REBUILT (4 blocks, was 5 tabs):
  1. Range. Two options, both of which change the data. 4 weeks returns
     4 points per lift, 12 weeks returns 6 and a wider date window.
  2. Answer card. The question in one sentence, with the count, the
     sessions behind it, and the biggest single gain.
  3. Trend chart, on the screen, no tabs, no drill-down. Labelled y axis
     on round numbers (never the data min), gridlines, x positions
     proportional to real dates with three dated ticks, full card width.
  4. Records. The PR Vault's payload as a first-class section, not a
     clipped tab. Every row sets the chart above: one tap to any lift.

  CUT
  - The tab strip itself. Five destinations do not fit one row at 44px.
  - Photos (906 lines, its own header and tab bar, wearing Progress's
    chrome; it does not serve the lift-trend job).
  - Calendar (338px, day cells were non-interactive divs with a hover
    tooltip — dead on touch; the month belongs with history in Train).
  - Day-1-vs-PR cards. Two static numbers cannot show a trend.
  - Strength Profile bar chart (restated the estimate at a second
    rounding), the "1RM —" chip (empty on 9 of 9 rows), ThrowbackCard
    (25% random, unreproducible), the dashed accent outline that made
    the primary read as a placeholder.
  - The third range option: on this history 90D and ALL are the same
    data. A control that does nothing is worse than one fewer control.
  - Goals as a surface: reduced to one row that leaves for its own
    screen. Body weight likewise: one row, one number, one delta.

  ACCENT: exactly one per state. In the populated state it is the trend
  line and its dots — the data is the point of this screen, so no button
  is accent-filled. Empty and error states have no chart, so the accent
  moves to their single primary action.

  CONTRAST: no opacity is applied to any text-bearing element anywhere on
  this page. The dimming that produced 2.2:1 has no equivalent here.

  DATA: inlined subset of tests/fixtures/seed-data.json — lk_history
  (18 strength sessions, 2026-07-30 to 2026-09-07, best working set per
  exercise per session, Epley), lk_prs (12 records over 9 lifts),
  lk_weightLog, lk_goals. Units kg, from lk_profile.useKg.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-progress" data-state="populated">

      <header class="hdr hdr--large" data-large-title="#body" data-scroll-edge="#body">
        <div class="hdr__title stack stack--1">
          <span class="t-meta">STRENGTH</span>
          <h1 class="hdr__title-large" data-title-large>Progress</h1>

        <span class="hdr__title-small" data-title-small aria-hidden="true">Progress</span>
      </header>

      <main class="body" id="body" data-testid="progress-scroll" tabindex="-1"></main>

      <!-- The live session, seen from here. Empty unless a workout is
           running; it sits between the content and the bottom of the
           screen rather than over it, so nothing it says costs a row. -->
      <div id="shelf-slot"></div>


      <nav class="tabbar" aria-label="Sections" data-minimize="#body">
        <button class="tabbar__item" aria-current="page" data-testid="tab-home">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></svg>
          <span class="tabbar__label">Home</span>
        </button>
        <button class="tabbar__item" data-testid="tab-train">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>
          <span class="tabbar__label">Train</span>
        </button>
        <button class="tabbar__item" data-testid="tab-fuel">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M9 13v8"/><path d="M17 3c-1.5 1.8-2 3.6-2 5.5 0 1.6.7 2.5 2 2.5s2-.9 2-2.5c0-1.9-.5-3.7-2-5.5Z"/><path d="M17 11v10"/></svg>
          <span class="tabbar__label">Fuel</span>

        <button class="tabbar__item" data-testid="tab-coach">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H9l-4 3V7a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3z"/></svg>
          <span class="tabbar__label">Coach</span>
        </button>
        <button class="tabbar__item" data-testid="tab-profile">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
          <span class="tabbar__label">Profile</span>

    </div>
  </div>
</div>

<div class="dev">
  <button class="dev__toggle" id="dev-toggle" aria-expanded="false" aria-controls="dev-menu" data-testid="dev-toggle">State</button>
  <div class="dev__menu" id="dev-menu" hidden data-testid="dev-menu"></div>
</div>

<script>
(function () {
  "use strict";

  /* =============================================================
     Icons. One set, one stroke weight, one optical size.
     ============================================================= */
  function svg(d, extra) {
    return '<svg class="ico' + (extra || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  }
  var ICO = {
    cam: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8.5h3l1.5-2h7L17 8.5h3v10H4z"/><circle cx="12" cy="13" r="3.2"/></svg>',
    chev: svg('<path d="m9 5 7 7-7 7"/>'),
    close: svg('<path d="M6 6l12 12M18 6 6 18"/>'),
    alert: svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/>'),
    chart: svg('<path d="M4 19h16M7 16v-4M12 16V7M17 16v-6"/>', ' ico--lg'),
    lift: svg('<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>'),
    scale: svg('<path d="M5 20h14M12 4v16M6.5 12 12 4l5.5 8a5.5 5.5 0 0 1-11 0z"/>'),
    flag: svg('<path d="M6 21V4h12l-2.5 4L18 12H6"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>')
  };

  /* =============================================================
     The data. Everything on this screen was a literal in this file:
     fifteen hand-typed lift series, twelve records, a weight log, a
     goals list and a photo list. None of it was read from the store
     and none of it was written to it, so a weight logged here, a
     record added here, a goal added here and a photo deleted here
     were all gone on the next load, and no other screen ever saw any
     of it. Every list below comes out of LKStore under the shipped
     app's own key, and every write goes back to it.
     ============================================================= */
  var ST = window.LKStore;
  function get(key, dflt) { return ST ? ST.get(key, dflt) : dflt; }
  function put(key, v) { if (ST) ST.set(key, v); }

  var TODAY = (window.LKFixtures && LKFixtures.today) || '2026-09-09';

  var HISTORY = get('lk_history', []) || [];

  /* The trend, computed from the sessions rather than typed beside them.
     A point is the best working set of that session for that exercise, by
     Epley, to one decimal -- which is the convention the rest of the app
     rounds to. Derived this way the chart moves when a session is logged;
     the table it replaces could not.

     Checked against the table it replaces: all fifteen series, every point,
     identical. Warm-up sets are not working sets and do not make a point. */
  function e1rm(w, r) { return w * (1 + r / 30); }
  function buildLifts(history) {
    var by = {};
    history.forEach(function (h) {
      if (h.kind === 'cardio' || !h.exercises) return;
      h.exercises.forEach(function (ex) {
        var best = null;
        (ex.sets || []).forEach(function (st) {
          if (st.warm || !st.done) return;
          var e = e1rm(st.kg, st.reps);
          if (!best || e > best.e) best = { e: e, kg: st.kg, reps: st.reps };
        });
        if (!best) return;
        var L = by[ex.id] || (by[ex.id] = { id: ex.id, name: ex.name, muscle: ex.muscle, pts: [] });
        L.pts.push([String(h.date).slice(0, 10), Math.round(best.e * 10) / 10, best.kg, best.reps]);
      });
    });
    var out = Object.keys(by).map(function (k) { return by[k]; });
    out.forEach(function (l) { l.pts.sort(function (a, b) { return a[0] < b[0] ? -1 : 1; }); });
    /* Heaviest lift first, which is the order the picker had. */
    out.sort(function (a, b) {
      return (b.pts[b.pts.length - 1][1]) - (a.pts[a.pts.length - 1][1]);
    });
    return out;
  }
  var LIFTS = buildLifts(HISTORY);

  /* lk_prs: one array of record rows, the shape the fixture seeds and every
     screen reads. A hand-typed copy of the same twelve rows used to sit here
     because fixtures.js flattened the key to one row per lift; the generator
     emits all of them now, so there is nothing to restate. The map shape an
     older build wrote is still read, so a phone that stored one does not
     lose its records. */
  function readRecords() {
    var raw = ST && ST.touched('lk_prs') ? ST.get('lk_prs', null) : null;
    if (!raw) raw = (window.LKFixtures && LKFixtures.prs) || [];
    var out = [];
    if (Array.isArray(raw)) {
      raw.forEach(function (r) {
        out.push({ id: Number(r.exId != null ? r.exId : r.id), reps: r.reps, kg: r.kg,
                   date: String(r.date || '').slice(0, 10) });
      });
    } else if (typeof raw === 'object') {
      Object.keys(raw).forEach(function (id) {
        (raw[id] || []).forEach(function (r) {
          out.push({ id: Number(id), reps: r.r, kg: r.w, date: String(r.date || '').slice(0, 10) });
        });
      });
    }
    out.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    return out;
  }
  function nameOfLift(id) {
    var l = liftById(id);
    if (l) return { name: l.name, group: l.group || '', muscle: l.muscle || '' };
    var all = (window.LKFixtures && LKFixtures.prs) || [];
    for (var i = 0; i < all.length; i++) if (Number(all[i].exId) === Number(id)) return all[i];
    return null;
  }
  function saveRecords() {
    /* Written back as rows, carrying the lift's name and group, so a record
       set here reads the same on Recap, Profile and the library. */
    put('lk_prs', RECORDS.map(function (r) {
      var meta = nameOfLift(r.id) || {};
      return { exId: r.id, name: meta.name || '', group: meta.group || '',
               muscle: meta.muscle || '', kg: r.kg, reps: r.reps, date: r.date };
    }));
  }
  var RECORDS = readRecords();

  var SESSIONS = (function () {
    var seen = {}, out = [];
    HISTORY.forEach(function (h) {
      var d = String(h.date).slice(0, 10);
      if (seen[d]) return;
      seen[d] = 1;
      out.push(d);
    });
    return out.sort();
  })();

  /* lk_weightLog, as [date, kg] pairs on the way in and objects on the way
     out, because that is the shape every other screen reads. */
  var WEIGHT_LOG = (get('lk_weightLog', []) || []).map(function (w) {
    return [String(w.date).slice(0, 10), w.kg];
  }).sort(function (a, b) { return a[0] < b[0] ? -1 : 1; });
  function saveWeight() {
    put('lk_weightLog', WEIGHT_LOG.map(function (w) { return { date: w[0], kg: w[1] }; }));
  }

  /* lk_bfLog. It ships in the seed with two readings and nothing in the
     build read it: there was no body-fat log anywhere. */
  var BF = (get('lk_bfLog', []) || []).slice()
    .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  function saveBF() { put('lk_bfLog', BF.slice()); }
  var BF_METHODS = [
    ['manual', 'By eye'],
    ['calipers', 'Calipers'],
    ['scale', 'Smart scale'],
    ['dexa', 'DEXA'],
    ['navy', 'Tape (Navy)']
  ];
  function bfMethodLabel(id) {
    var out = id || '';
    BF_METHODS.forEach(function (m) { if (m[0] === id) out = m[1]; });
    return out;
  }

  /* lk_progressPhotos. A photo is a date, a note and a downscaled JPEG;
     the full-resolution image is never stored, only what the grid and the
     lightbox draw. The fixture's two entries carry no thumbnail, so they
     render as the drawn stand-ins they always were, and anything taken on
     the device carries a real one. */
  var PHOTOS = (get('lk_progressPhotos', []) || []).map(function (ph, i) {
    return { date: String(ph.date).slice(0, 10), note: ph.note || '', thumb: ph.thumb || '', tone: i % 4 };
  }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  function savePhotos() {
    put('lk_progressPhotos', PHOTOS.map(function (ph) {
      return { date: ph.date, note: ph.note, thumb: ph.thumb || '' };
    }));
  }

  /* lk_goals. The percentage is computed, never stored: it is (now - start)
     / (target - start), clamped, which works the same whether the number is
     meant to go up or down. `now` is read live, so logging a weight, a body
     fat reading or a record moves the bar under the goal that watches it. */
  var GOALS = (get('lk_goals', []) || []).map(function (g) { return normGoal(g); });
  function normGoal(g) {
    return {
      type: g.type || 'custom',
      name: g.name || '',
      exId: g.exId === undefined ? null : g.exId,
      target: g.target === undefined ? null : g.target,
      start: g.start === undefined ? null : g.start,
      unit: g.unit || (g.type === 'bodyfat' ? '%' : g.type === 'custom' ? '' : 'kg'),
      targetDate: g.targetDate || '',
      notes: g.notes || '',
      status: g.status === 'done' ? 'done' : 'active',
      created: g.created || new Date().toISOString(),
      completed: g.completed || ''
    };
  }
  function saveGoals() { put('lk_goals', GOALS.slice()); }

  function latestWeight() {
    var w = WEIGHT_LOG[WEIGHT_LOG.length - 1];
    return w ? w[1] : null;
  }
  function latestBF() { return BF.length ? BF[0].pct : null; }
  function bestFor(exId) {
    var best = null;
    RECORDS.forEach(function (r) {
      if (r.id !== exId) return;
      if (best === null || r.kg > best) best = r.kg;
    });
    return best;
  }
  function goalNow(g) {
    if (g.type === 'weight') return latestWeight();
    if (g.type === 'bodyfat') return latestBF();
    if (g.type === 'lift') return bestFor(g.exId);
    return null;                 /* custom: nothing measures it */
  }
  function goalPct(g) {
    var now = goalNow(g);
    if (now === null || now === undefined || g.start === null || g.target === null) return null;
    var span = g.target - g.start;
    if (!span) return now === g.target ? 100 : 0;
    return Math.max(0, Math.min(100, Math.round(((now - g.start) / span) * 100)));
  }
  function goalUnit(g) { return g.unit || (g.type === 'bodyfat' ? '%' : g.type === 'custom' ? '' : 'kg'); }
  /* A goal in kilograms prints through LKUnits like every other weight; a
     body-fat goal is a percentage and is not a weight at all. */
  function goalVal(g, v) {
    if (v === null || v === undefined) return null;
    return goalUnit(g) === 'kg' ? num1(LKUnits.v(v)) + ' ' + LKUnits.label() : num1(v) + (goalUnit(g) ? ' ' + goalUnit(g) : '');
  }
  function goalNowText(g) {
    var now = goalNow(g);
    if (now === null || now === undefined) {
      return g.type === 'custom' ? 'You decide' : 'Nothing logged yet';
    }
    return goalVal(g, now);
  }
  function goalBy(g) {
    if (!g.targetDate) return 'No deadline';
    if (!/^\d{4}-\d{2}-\d{2}$/.test(g.targetDate)) return g.targetDate;
    return dayLabel(g.targetDate);
  }
  function daysLeft(g) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(g.targetDate || '')) return null;
    return Math.round((ms(g.targetDate) - ms(TODAY)) / 86400000);
  }
  function activeGoals() { return GOALS.filter(function (g) { return g.status !== 'done'; }); }
  function doneGoals() { return GOALS.filter(function (g) { return g.status === 'done'; }); }
  /* The soonest deadline among the active goals, rather than a date typed
     once into the row. */
  function nextGoalDue() {
    var dates = activeGoals().map(function (g) { return g.targetDate; })
      .filter(function (d) { return /^\d{4}-\d{2}-\d{2}$/.test(d || ''); }).sort();
    return dates.length ? dayLabel(dates[0]) : null;
  }

  var RANGES = [
    { id: '4w', label: '4 weeks', days: 28 },
    { id: '12w', label: '12 weeks', days: 84 }
  ];

  /* =============================================================
     Formatting. One date format for axes and rows, one rounding.
     ============================================================= */
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONTHS_LONG = ['January','February','March','April','May','June','July',
    'August','September','October','November','December'];

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function n(v) { return '<span class="num">' + v + '</span>'; }
  function ms(iso) {
    var p = iso.split('-');
    return Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function dayLabel(iso) {
    var p = iso.split('-');
    return MONTHS[Number(p[1]) - 1] + ' ' + Number(p[2]);
  }
  function dayLabelFromMs(t) {
    var d = new Date(t);
    return MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate();
  }
  function longDate(iso) {
    var p = iso.split('-');
    return MONTHS_LONG[Number(p[1]) - 1] + ' ' + Number(p[2]) + ', ' + p[0];
  }
  /* One convention: at most one decimal, no trailing .0 on whole numbers. */
  function num1(v) {
    var r = Math.round(v * 10) / 10;
    return (Math.abs(r % 1) < 0.05 ? String(Math.round(r)) : r.toFixed(1));
  }
  function kg(v) { return n(num1(LKUnits.v(v))) + ' ' + LKUnits.label(); }
  function signed(v) { return (v > 0 ? '+' : v < 0 ? '−' : '') + num1(Math.abs(v)); }
  function signedKg(v) { return n(signed(LKUnits.v(v))) + ' ' + LKUnits.label(); }

  /* =============================================================
     Selection maths. Every number on the screen comes from here.
     ============================================================= */
  function windowStart(days) { return ms(TODAY) - days * 86400000; }

  function ptsIn(lift, days) {
    var from = windowStart(days);
    return lift.pts.filter(function (p) { return ms(p[0]) >= from; });
  }
  function liftById(id) {
    for (var i = 0; i < LIFTS.length; i++) if (LIFTS[i].id === id) return LIFTS[i];
    return null;
  }
  function sessionsIn(days) {
    var from = windowStart(days);
    return SESSIONS.filter(function (d) { return ms(d) >= from; }).length;
  }
  function summary(days) {
    var up = 0, tracked = 0, best = null, from = null;
    LIFTS.forEach(function (l) {
      var p = ptsIn(l, days);
      if (p.length < 2) return;
      tracked++;
      var delta = p[p.length - 1][1] - p[0][1];
      if (delta > 0) up++;
      if (!best || delta > best.delta) best = { name: l.name, delta: delta, id: l.id };
      if (!from || p[0][0] < from) from = p[0][0];
    });
    /* The label names the first session inside the window, not the
       window's own edge: a range with no data before Jul 30 must not
       claim to start in June. */
    return { up: up, tracked: tracked, best: best, sessions: sessionsIn(days), from: from };
  }
  function recordsFor(id) {
    return RECORDS.filter(function (r) { return r.id === id; })
      .sort(function (a, b) { return b.kg * (1 + b.reps / 30) - a.kg * (1 + a.reps / 30); });
  }
  function recordLifts() {
    var seen = {}, out = [];
    RECORDS.forEach(function (r) {
      if (seen[r.id]) return;
      seen[r.id] = 1;
      var rs = recordsFor(r.id), l = liftById(r.id);
      /* The list sorts by date, so the date on the row has to be the lift's
         most recent record. It was the date of its heaviest one, which for
         the deadlift meant a row dated Aug 29 sorting below three Sep 5 rows
         when the deadlift's own latest record is Sep 5 as well. The heaviest
         set is still what the row and the est. 1RM report. */
      var latest = rs.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; })[0];
      /* Three figures, not one. A lift's records answer three different
         questions -- what is the most you have lifted, what is the most you
         have lifted for a working set of six to eight, and what does that
         extrapolate to -- and the row showed only the last, which is the one
         that was never actually lifted. */
      var heaviest = rs.slice().sort(function (a, b) { return b.kg - a.kg; })[0];
      var rep68 = rs.filter(function (x) { return x.reps >= 6 && x.reps <= 8; })
        .sort(function (a, b) { return b.kg - a.kg; })[0] || null;
      out.push({ id: r.id, name: l ? l.name : '', muscle: l ? l.muscle : '',
                 best: rs[0], heaviest: heaviest, rep68: rep68,
                 date: latest.date, count: rs.length });
    });
    /* Compounds first. A list sorted by date puts whatever you happened to
       log last at the top, so the lifts a reader actually tracks sink under
       a lateral raise. Within each group the most recent record still leads. */
    out.sort(function (a, b) {
      var ca = isCompound(a.name) ? 0 : 1, cb = isCompound(b.name) ? 0 : 1;
      if (ca !== cb) return ca - cb;
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    });
    return out;
  }

  /* The lifts a programme is built around. Named rather than inferred: a
     rule over muscle groups would call a lateral raise a compound the first
     time somebody logged one under Back. */
  var COMPOUNDS = ['squat', 'deadlift', 'bench', 'press', 'row', 'pull-up', 'pullup',
                   'chin-up', 'chinup', 'dip', 'lunge', 'clean', 'snatch'];
  function isCompound(name) {
    var nm = String(name).toLowerCase();
    /* A leg press is a machine, not the press a programme means. */
    if (nm.indexOf('leg press') >= 0 || nm.indexOf('calf') >= 0) return false;
    for (var i = 0; i < COMPOUNDS.length; i++) if (nm.indexOf(COMPOUNDS[i]) >= 0) return true;
    return false;
  }

  /* =============================================================
     The chart.

     Fixes measured by the audits, one by one:
       y axis    labelled ticks on round numbers, chosen by a 1/2/2.5/5
                 step. The floor is a tick below the data, never the
                 data minimum, so a flat run draws flat.
       x axis    position is proportional to the real date. A 3-day gap
                 and a 10-day gap draw differently. Three dated ticks.
       width     the svg viewBox is built from the measured container
                 width, so 1 unit = 1px and nothing letterboxes.
       range     each range changes both the point count and the date
                 domain, and the axis labels say so.
     ============================================================= */
  function niceStep(span, intervals) {
    var raw = span / intervals;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var norm = raw / mag;
    var mult = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
    return mult * mag;
  }
  function yScale(values) {
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var span = max - min;
    if (span <= 0) span = Math.max(1, max * 0.1);
    var step = niceStep(span, 4);
    var lo = Math.floor(min / step) * step;
    var hi = Math.ceil(max / step) * step;
    /* The floor is a labelled round number below the data, and never the
       data minimum: a point must not sit on the axis, because that is
       what made the old chart draw every trend with the same shape. */
    if (min - lo < step * 0.1) lo -= step;
    if (hi - max < step * 0.1) hi += step;
    if (hi - lo < step * 1.5) hi = lo + step * 2;
    var ticks = [], v = lo, guard = 0;
    while (v <= hi + step * 0.001 && guard++ < 20) { ticks.push(Math.round(v * 100) / 100); v += step; }
    return { lo: lo, hi: ticks[ticks.length - 1], ticks: ticks };
  }

  /* The weigh-ins, drawn. Body weight was a drill-down to a list of dates
     and deltas with no chart at all, on the screen whose other trend -- a
     lift's estimated 1RM -- gets a full plot. A column of numbers is the one
     way to hide a trend from somebody looking for one.

     Same axes, same scale-picking and same description as the lift chart, so
     the two read alike; a trend line is a trend line. */
  function weightChartSVG(width) {
    if (WEIGHT_LOG.length < 2) return '';
    var W = Math.max(240, Math.round(width));
    var H = 164;
    var padL = 42, padR = 10, padT = 12, padB = 26;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var vals = WEIGHT_LOG.map(function (w) { return LKUnits.v(w[1]); });
    var ys = yScale(vals);
    var t0 = ms(WEIGHT_LOG[0][0]), t1 = ms(WEIGHT_LOG[WEIGHT_LOG.length - 1][0]);
    if (t1 === t0) { t0 -= 86400000; t1 += 86400000; }
    var X = function (t) { return padL + (t - t0) / (t1 - t0) * plotW; };
    var Y = function (v) { return padT + (1 - (v - ys.lo) / (ys.hi - ys.lo)) * plotH; };
    var out = [];
    ys.ticks.forEach(function (t) {
      var y = Math.round(Y(t)) + 0.5;
      out.push('<line class="chart__grid" x1="' + padL + '" y1="' + y + '" x2="' + (padL + plotW) + '" y2="' + y + '"/>');
      out.push('<text class="chart__axis" x="' + (padL - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + num1(t) + '</text>');
    });
    var mid = t0 + (t1 - t0) / 2;
    [[t0, 'start'], [mid, 'middle'], [t1, 'end']].forEach(function (pp) {
      var x = X(pp[0]);
      out.push('<line class="chart__grid" x1="' + x.toFixed(1) + '" y1="' + (padT + plotH) + '" x2="' + x.toFixed(1) + '" y2="' + (padT + plotH + 4) + '"/>');
      out.push('<text class="chart__axis" x="' + x.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + pp[1] + '">' + dayLabelFromMs(pp[0]) + '</text>');
    });
    var poly = WEIGHT_LOG.map(function (w) {
      return X(ms(w[0])).toFixed(1) + ',' + Y(LKUnits.v(w[1])).toFixed(1);
    }).join(' ');
    out.push('<polyline class="chart__line" points="' + poly + '"/>');
    WEIGHT_LOG.forEach(function (w, i) {
      var last = i === WEIGHT_LOG.length - 1;
      out.push('<circle class="chart__dot' + (last ? ' chart__dot--last' : '') + '" cx="' +
        X(ms(w[0])).toFixed(1) + '" cy="' + Y(LKUnits.v(w[1])).toFixed(1) + '" r="' + (last ? 4.5 : 3) + '"/>');
    });
    var f = WEIGHT_LOG[0], l = WEIGHT_LOG[WEIGHT_LOG.length - 1];
    var desc = 'Body weight, ' + WEIGHT_LOG.length + ' readings from ' + longDate(f[0]) +
      ' to ' + longDate(l[0]) + '. ' + num1(LKUnits.v(f[1])) + ' to ' + num1(LKUnits.v(l[1])) +
      ' ' + LKUnits.label() + ', ' +
      (l[1] > f[1] ? 'up ' : l[1] < f[1] ? 'down ' : 'unchanged, ') +
      num1(Math.abs(LKUnits.v(l[1]) - LKUnits.v(f[1]))) + '. Points: ' +
      WEIGHT_LOG.map(function (w) { return dayLabel(w[0]) + ' ' + num1(LKUnits.v(w[1])); }).join('; ') + '.';
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
      '" role="img" aria-label="' + esc(desc) + '" data-testid="weight-chart" ' +
      'data-points="' + WEIGHT_LOG.length + '">' + out.join('') + '</svg>';
  }

  function chartSVG(lift, pts, days, width) {
    var W = Math.max(240, Math.round(width));
    var H = 184;
    var padL = 42, padR = 10, padT = 12, padB = 26;
    var plotW = W - padL - padR, plotH = H - padT - padB;

    var vals = pts.map(function (p) { return p[1]; });
    var ys = yScale(vals);
    var t0 = ms(pts[0][0]), t1 = ms(pts[pts.length - 1][0]);
    if (t1 === t0) { t0 -= 86400000; t1 += 86400000; }

    function X(t) { return padL + (t - t0) / (t1 - t0) * plotW; }
    function Y(v) { return padT + (1 - (v - ys.lo) / (ys.hi - ys.lo)) * plotH; }

    var out = [];
    /* horizontal gridlines with a label each */
    ys.ticks.forEach(function (t) {
      var y = Math.round(Y(t)) + 0.5;
      out.push('<line class="chart__grid" x1="' + padL + '" y1="' + y + '" x2="' + (padL + plotW) + '" y2="' + y + '"/>');
      out.push('<text class="chart__axis" x="' + (padL - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + num1(t) + '</text>');
    });
    /* dated x ticks: first, true midpoint of the time domain, last */
    var mid = t0 + (t1 - t0) / 2;
    var xt = [[t0, 'start'], [mid, 'middle'], [t1, 'end']];
    xt.forEach(function (p) {
      var x = X(p[0]);
      out.push('<line class="chart__grid" x1="' + x.toFixed(1) + '" y1="' + (padT + plotH) + '" x2="' + x.toFixed(1) + '" y2="' + (padT + plotH + 4) + '"/>');
      out.push('<text class="chart__axis" x="' + x.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + p[1] + '">' + dayLabelFromMs(p[0]) + '</text>');
    });
    /* the line, positioned by date */
    var poly = pts.map(function (p) { return X(ms(p[0])).toFixed(1) + ',' + Y(p[1]).toFixed(1); }).join(' ');
    out.push('<polyline class="chart__line" points="' + poly + '"/>');
    pts.forEach(function (p, i) {
      var last = i === pts.length - 1;
      out.push('<circle class="chart__dot' + (last ? ' chart__dot--last' : '') + '" cx="' + X(ms(p[0])).toFixed(1) + '" cy="' + Y(p[1]).toFixed(1) + '" r="' + (last ? 4.5 : 3) + '"/>');
    });

    var first = pts[0], lastp = pts[pts.length - 1];
    var desc = lift.name + ', estimated 1 rep max. ' + pts.length + ' sessions from ' +
      longDate(first[0]) + ' to ' + longDate(lastp[0]) + '. ' +
      num1(first[1]) + ' to ' + num1(lastp[1]) + ' kilograms, ' +
      (lastp[1] > first[1] ? 'up ' : lastp[1] < first[1] ? 'down ' : 'unchanged, ') +
      num1(Math.abs(lastp[1] - first[1])) + ' kilograms. Vertical axis ' +
      num1(ys.lo) + ' to ' + num1(ys.hi) + ' kilograms. Points: ' +
      pts.map(function (p) { return dayLabel(p[0]) + ' ' + num1(p[1]) + ', from ' + num1(p[2]) + ' kilograms for ' + p[3] + ' reps'; }).join('; ') + '.';

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
      '" role="img" aria-label="' + esc(desc) + '" data-testid="trend-chart" data-range="' + days +
      '" data-points="' + pts.length + '" data-ylo="' + num1(ys.lo) + '" data-yhi="' + num1(ys.hi) + '">' +
      out.join('') + '</svg>';
  }

  /* =============================================================
     State
     ============================================================= */
  var S = {
    view: 'populated',
    range: '12w',
    /* What is typed into the records search. */
    recordQ: '',
    /* lk_featuredLifts[0], unless a screen said which lift it meant. */
    liftId: (function () {
      var want = null;
      try { want = localStorage.getItem('lk_openLift'); } catch (e) {}
      try { localStorage.removeItem('lk_openLift'); } catch (e) {}
      var id = want ? Number(want) : NaN;
      return isNaN(id) ? 111 : id;
    })(),
    sheet: false,
    photoIdx: null,      /* which photo the lightbox is showing */
    confirmDel: false,   /* a photo cannot be recreated, so delete asks twice */
    /* The three sheets that write. Each carries its own error sentence rather
       than a shared flag, so a message can say which field is wrong. */
    weightError: null,
    goalForm: false,
    goalError: null,
    recordError: null,
    toast: null
  };
  function rangeDays() {
    for (var i = 0; i < RANGES.length; i++) if (RANGES[i].id === S.range) return RANGES[i].days;
    return 84;
  }
  function rangeLabel() {
    for (var i = 0; i < RANGES.length; i++) if (RANGES[i].id === S.range) return RANGES[i].label;
    return '';
  }

  /* =============================================================
     Blocks
     ============================================================= */
  function rangeControl() {
    return '' +
      '<div class="section" style="margin-top: var(--sp-3)">' +
        '<div class="seg seg--lg" role="radiogroup" aria-label="Range" data-testid="range-control">' +
          RANGES.map(function (r) {
            return '<button class="seg__item" role="radio" aria-checked="' + (S.range === r.id) +
              '" data-action="range" data-range="' + r.id + '" data-testid="range-' + r.id + '">' +
              'Last ' + r.label + '</button>';
          }).join('') +
        '</div>' +
      '</div>';
  }

  function answerCard() {
    var days = rangeDays(), s = summary(days);
    /* summary() leaves from and best null when no lift has two points in the
       window, and both dayLabel(null) and s.best.name threw on that. */
    if (!s.from || !s.best) {
      return '<div class="card mt-3" data-testid="card-answer" data-up="0" data-tracked="' + s.tracked + '">' +
        '<div class="t-label">Last ' + days + ' days</div>' +
        '<h2 class="t-title mt-2">Not enough to compare yet</h2>' +
        '<p class="t-detail mt-2">A trend needs two sessions of the same lift inside the range. ' +
          'Widen it above, or log one more.</p>' +
      '</div>';
    }
    var from = dayLabel(s.from);
    /* One sentence shape in every case: the count is the answer, and a
       reader should not have to tell two phrasings apart. */
    var headline = n(s.up) + ' of ' + n(s.tracked) + ' lifts are heavier';
    return '' +
      '<div class="card mt-3" data-testid="card-answer" data-up="' + s.up + '" data-tracked="' + s.tracked + '">' +
        '<div class="t-label">Since ' + from + '</div>' +
        '<h2 class="t-title mt-2">' + headline + '</h2>' +
        '<p class="t-detail mt-2">' + n(s.sessions) + ' sessions logged. Biggest gain: ' +
          esc(s.best.name) + ', ' + signedKg(s.best.delta) + ' on the estimate.</p>' +
      '</div>';
  }

  function trendCard() {
    var days = rangeDays();
    var lift = liftById(S.liftId);
    var pts = ptsIn(lift, days);
    /* A lift with nothing inside the range is not an error, it is an answer.
       The three routines that read pts[0] and pts[length-1] threw on it,
       which is the whole card gone rather than the one figure it cannot
       give. */
    if (!pts.length) {
      return '<div class="card mt-3" data-testid="card-trend">' +
        '<div class="t-label">' + esc(lift.name) + '</div>' +
        '<p class="t-detail mt-2">Nothing logged for this lift in the last ' + days +
          ' days. Widen the range above, or it is waiting for its next session.</p>' +
      '</div>';
    }
    var cur = pts[pts.length - 1];
    var delta = cur[1] - pts[0][1];
    var trendClass = delta > 0 ? ' trend-up' : delta < 0 ? ' trend-down' : '';
    var deltaText = delta === 0
      ? 'level since ' + dayLabel(pts[0][0])
      : signedKg(delta) + ' since ' + dayLabel(pts[0][0]);

    return '' +
      '<div class="section">' +
        '<div class="section__head">' +
          '<h2 class="t-label">Estimated 1 rep max</h2>' +
          '<span class="t-meta">' + n(pts.length) + ' sessions</span>' +
        '</div>' +
        '<div class="card" data-testid="card-trend" data-lift="' + lift.id + '">' +
          '<div class="spread">' +
            '<div class="stack stack--1 grow">' +
              '<span class="t-section">' + esc(lift.name) + '</span>' +
              '<span class="t-meta">' + esc(lift.muscle) + '</span>' +
            '</div>' +
            '<div class="stack stack--1" style="text-align: right">' +
              '<span class="stat__value" data-testid="trend-current">' + kg(cur[1]) + '</span>' +
              '<span class="t-meta' + trendClass + '" data-testid="trend-delta">' + deltaText + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="mt-3" id="chart-holder" data-testid="chart-holder"></div>' +
          '<p class="t-meta mt-2" data-testid="chart-caption">Vertical axis in kilograms, starting at ' +
            '<span class="num" data-testid="axis-floor">' + num1(chartFloor(pts)) + '</span>, not at zero. ' +
            'Points sit on the day they were lifted.</p>' +
          '<p class="t-detail mt-3">Last set: ' + kg(cur[2]) + ' &times; ' + n(cur[3]) +
            ' on ' + dayLabel(cur[0]) + '.</p>' +
          '<button class="btn btn--secondary btn--block mt-3" data-action="open-picker" data-testid="choose-lift">' +
            '<span class="btn__label">Choose another lift</span>' +
          '</button>' +
        '</div>' +
      '</div>';
  }
  function chartFloor(pts) {
    return yScale(pts.map(function (p) { return p[1]; })).lo;
  }

  function recordsSection() {
    var all = recordLifts();
    var q = String(S.recordQ || '').trim().toLowerCase();
    var rows = q ? all.filter(function (r) {
      return r.name.toLowerCase().indexOf(q) >= 0 || String(r.muscle).toLowerCase().indexOf(q) >= 0;
    }) : all;
    return '' +
      '<div class="section">' +
        '<div class="section__head">' +
          '<h2 class="t-label">Records</h2>' +
          '<span class="t-meta">' + n(RECORDS.length) + ' across ' + n(all.length) + ' lifts</span>' +
        '</div>' +
        /* Nine lifts fit on a screen; thirty do not, and a vault nobody can
           search is a list to scroll past. */
        /* Gated on the FULL list, not the filtered one. Gating on `rows`
           made the box vanish the moment a search matched nothing, so there
           was no way to correct a typo. */
        (all.length > 6
          ? '<input class="input" id="rec-q" type="search" autocomplete="off" ' +
              'placeholder="Find a lift" value="' + esc(S.recordQ || '') + '" ' +
              'aria-label="Find a lift in your records" data-testid="records-search">'
          : '') +
        '<div class="card card--flush' + (all.length > 6 ? ' mt-2' : '') + '" role="radiogroup" ' +
            'aria-label="Lift plotted on the chart above" data-testid="records-list">' +
          (rows.length
            ? rows.map(function (r) {
            var sel = r.id === S.liftId;
            /* A radio, not a link. Tapping it plots that lift on the chart
               above, which is the same job as the picker sheet's rows and is
               marked the same way. The chevron came off: it promised a detail
               screen there is not one of, and it was the reason a tap that
               moved the page felt like the page had moved on its own. */
            return '<button class="row' + (sel ? ' row--selected' : '') + '" role="radio" aria-checked="' + sel +
              '" data-action="pick-lift" data-id="' + r.id +
              '" data-testid="record-' + r.id + '">' +
              '<span class="row__main stack">' +
                '<span class="row__title">' + esc(r.name) + '</span>' +
                '<span class="row__sub">' + dayLabel(r.date) + ' &middot; ' + kg(r.best.kg) +
                  ' &times; ' + n(r.best.reps) + (r.count > 1 ? ' &middot; ' + n(r.count) + ' records' : '') + '</span>' +
              '</span>' +
              '<span class="row__value stack" style="text-align: right">' +
                '<span class="num">' + kg(r.heaviest.kg) + '</span>' +
                '<span class="t-caption-2 quiet">heaviest</span>' +
              '</span>' +
              '<span class="row__value stack" style="text-align: right">' +
                '<span class="num">' + (r.rep68 ? kg(r.rep68.kg) : '\u2014') + '</span>' +
                '<span class="t-caption-2 quiet">6\u20138 reps</span>' +
              '</span>' +
              '<span class="row__value stack" style="text-align: right">' +
                '<span class="num">' + kg(e1rm(r.best.kg, r.best.reps)) + '</span>' +
                '<span class="t-caption-2 quiet">est. 1RM</span>' +
              '</span>' +
            '</button>';
          }).join('')
            : '<div class="row row--static"><span class="row__main"><span class="row__title">' +
              'Nothing matches \u201c' + esc(S.recordQ || '') + '\u201d.</span></span></div>') +
        '</div>' +
        '<button class="btn btn--tertiary btn--block mt-2" data-action="log-record" data-testid="log-record">' +
          ICO.plus + '<span class="btn__label">Log a record without a workout</span>' +
        '</button>' +
      '</div>';
  }

  function moreSection() {
    var w = WEIGHT_LOG[WEIGHT_LOG.length - 1], w0 = WEIGHT_LOG[0];
    var d = w[1] - w0[1];
    return '' +
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">Also tracked</h2></div>' +
        '<div class="card card--flush">' +
          '<button class="row" data-action="open-weight" data-testid="row-body-weight">' +
            '<span class="ico-well">' + ICO.scale + '</span>' +
            '<span class="row__main stack">' +
              '<span class="row__title">Body weight</span>' +
              '<span class="row__sub">' + signedKg(d) + ' since ' + dayLabel(w0[0]) + '</span>' +
            '</span>' +
            '<span class="row__value">' + kg(w[1]) + '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
          /* The body-fat log. lk_bfLog ships in the seed with two readings
             and nothing in the build read it, so the one number a body-fat
             goal is measured against could not be seen or added. */
          '<button class="row" data-action="open-bf" data-testid="row-body-fat">' +
            '<span class="ico-well">' + ICO.scale + '</span>' +
            '<span class="row__main stack">' +
              '<span class="row__title">Body fat</span>' +
              '<span class="row__sub">' + (BF.length
                ? n(BF.length) + (BF.length === 1 ? ' reading since ' : ' readings since ') +
                  dayLabel(BF[BF.length - 1].date) + ' \u00b7 ' + bfMethodLabel(BF[0].method)
                : 'Nothing logged') + '</span>' +
            '</span>' +
            '<span class="row__value">' + (BF.length ? num1(BF[0].pct) + '%' : '\u2014') + '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
          '<button class="row" data-action="open-photos" data-testid="row-photos">' +
            '<span class="ico-well">' + ICO.cam + '</span>' +
            '<span class="row__main stack">' +
              '<span class="row__title">Photos</span>' +
              /* PHOTOS[0] with no guard threw once the last photo was deleted, and the
                 throw happened inside render, so Progress went blank and stayed blank. */
              '<span class="row__sub">' + (PHOTOS.length
                ? n(PHOTOS.length) + ' since ' + dayLabel(PHOTOS[0].date.slice(0, 10))
                : 'None yet') + '</span>' +
            '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
          '<button class="row" data-action="open-goals" data-testid="row-goals">' +
            '<span class="ico-well">' + ICO.flag + '</span>' +
            '<span class="row__main stack">' +
              '<span class="row__title">Goals</span>' +
              '<span class="row__sub">' + n(GOALS.length) + ' active' +
                (nextGoalDue() ? ', next due ' + nextGoalDue() : '') + '</span>' +
            '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
        '</div>' +
      '</div>';
  }

  /* =============================================================
     Views
     ============================================================= */
  var VIEWS = {};

  VIEWS.populated = function () {
    return rangeControl() + answerCard() + trendCard() + recordsSection() + moreSection();
  };

  VIEWS.empty = function () {
    return '' +
      '<div class="empty mt-5" data-testid="progress-empty">' +
        '<span class="empty__ico">' + ICO.chart + '</span>' +
        '<h2 class="empty__title">No trend yet</h2>' +
        '<p class="empty__body">Log two sessions of the same lift and this screen charts it, ' +
          'with the record it beat.</p>' +
        '<button class="btn btn--primary" data-action="start-workout" data-testid="empty-action">' +
          '<span class="btn__label">Start a workout</span>' +
        '</button>' +
      '</div>';
  };

  VIEWS.loading = function () {
    return '' +
      '<div class="section" style="margin-top: var(--sp-3)" role="status" aria-busy="true" aria-label="Loading your progress" data-testid="progress-loading">' +
        '<div class="skel" style="height: var(--tap)"></div>' +
        '<div class="card mt-3">' +
          '<div class="skel" style="height: var(--sp-3); width: 35%"></div>' +
          '<div class="skel mt-3" style="height: var(--sp-5); width: 70%"></div>' +
          '<div class="skel mt-3" style="height: var(--sp-4); width: 85%"></div>' +
        '</div>' +
        '<div class="card mt-3">' +
          '<div class="skel" style="height: var(--sp-4); width: 50%"></div>' +
          '<div class="skel mt-3" style="height: 184px"></div>' +
        '</div>' +
        '<div class="card mt-3">' +
          '<div class="skel" style="height: var(--sp-4); width: 60%"></div>' +
          '<div class="skel mt-3" style="height: var(--sp-4); width: 45%"></div>' +
        '</div>' +
      '</div>';
  };

  VIEWS.error = function () {
    return '' +
      '<div class="card mt-3" data-testid="progress-error">' +
        '<div class="banner banner--error" role="alert">' +
          ICO.alert +
          '<span><strong>Progress did not load</strong>Your last sync failed, so sessions after ' +
            'Aug 24 are missing. Nothing was lost on this phone.</span>' +
        '</div>' +
        '<button class="btn btn--primary btn--block mt-4" data-action="retry" data-testid="retry">' +
          '<span class="btn__label">Try again</span>' +
        '</button>' +
        '<button class="btn btn--secondary btn--block mt-2" data-action="show-cached" data-testid="show-cached">' +
          '<span class="btn__label">Show what is on this phone</span>' +
        '</button>' +
      '</div>';
  };

  /* =============================================================
     Lift picker sheet. Every lift with history, not only those with
     a record, because a lift you are building has no record yet.
     ============================================================= */
  /* Body weight, in full. The row above it says the trend; this says every
     reading it was drawn from, because a trend nobody can check is a claim. */
  function weightSheet() {
    var log = WEIGHT_LOG.slice().reverse();
    var first = WEIGHT_LOG[0], last = WEIGHT_LOG[WEIGHT_LOG.length - 1];
    var d = last[1] - first[1];
    /* Weeks between the first and last reading, not the number of readings.
       Counting entries made a second weigh-in in the same week add a week to
       the span, so the per-week figure -- the one this card says is "the only
       one worth reading" -- moved because you stepped on the scale twice. */
    var wkMs = 7 * 86400000;
    var spanMs = Math.max(0, ms(WEIGHT_LOG[WEIGHT_LOG.length - 1][0]) - ms(WEIGHT_LOG[0][0]));
    var weeks = Math.max(1, Math.round(spanMs / wkMs));
    return '' +
      '<div class="scrim" data-action="close-sheet" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="wt-title" ' +
        'data-testid="weight-sheet" data-detents="0.55 0.88" data-detent-open="0.88">' +
        '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
        '<div class="sheet__head"><h2 class="t-section grow" id="wt-title">Body weight</h2>' +
          '<button class="iconbtn" data-action="close-sheet" data-testid="weight-close" aria-label="Close body weight">' +
            ICO.close + '</button></div>' +
        '<div class="sheet__body">' +
          weightChartSVG(320) +
          '<p class="t-detail mt-3">' + signedKg(d) + ' over ' + weeks + ' weeks, or ' +
            signedKg(d / weeks) + ' a week. A weekly figure is the only one worth reading: ' +
            'a single morning moves a kilo on water alone.</p>' +
          '<div class="card card--flush mt-4">' + log.map(function (r, i) {
            var prev = log[i + 1];
            var step = prev ? r[1] - prev[1] : null;
            return '<div class="row row--static" data-testid="w-' + r[0] + '">' +
              '<span class="row__main stack">' +
                '<span class="row__title">' + kg(r[1]) + '</span>' +
                '<span class="row__sub">' + dayLabel(r[0]) + '</span>' +
              '</span>' +
              (step === null ? '<span class="row__value quiet">first</span>'
                             : '<span class="row__value num">' + signedKg(step) + '</span>') +
            '</div>';
          }).join('') + '</div>' +
        '</div>' +
        '<div class="sheet__foot">' +
          '<label class="t-label field__label" for="wt-kg">Today, kg</label>' +
          '<input class="input num" id="wt-kg" type="number" min="20" max="400" step="0.1" ' +
            'inputmode="decimal" value="' + (last ? last[1] : '') + '" data-testid="wt-kg">' +
          (S.weightError ? '<p class="field__error" role="alert" data-testid="wt-error">' +
            esc(S.weightError) + '</p>' : '') +
          '<button class="btn btn--primary btn--block mt-3" data-action="log-weight" data-testid="weight-log">' +
            '<span class="btn__label">Log today&rsquo;s weight</span></button>' +
        '</div>' +
      '</div>';
  }

  /* Goals. Each one is a number with a date, and each says what it is
     measured against, because a goal you cannot check is a wish. */
  function goalsSheet() {
    var goals = GOALS;
    return '' +
      '<div class="scrim" data-action="close-sheet" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gl-title" ' +
        'data-testid="goals-sheet" data-detents="0.55 0.88" data-detent-open="0.88">' +
        '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
        '<div class="sheet__head"><h2 class="t-section grow" id="gl-title">Goals</h2>' +
          '<button class="iconbtn" data-action="close-sheet" data-testid="goals-close" aria-label="Close goals">' +
            ICO.close + '</button></div>' +
        '<div class="sheet__body">' +
          goals.map(function (g, i) {
            var pct = goalPct(g);
            return '<div class="card' + (i ? ' mt-3' : '') + '" data-testid="goal-' + i + '">' +
              '<div class="hstack hstack--3"><span class="t-section grow">' + g.name + '</span>' +
                '<span class="t-meta num">' + pct + '%</span></div>' +
              '<div class="meter mt-2" role="img" aria-label="' + pct + ' per cent of the way there">' +
                '<span class="meter__fill" style="width:' + pct + '%"></span></div>' +
              '<p class="t-detail mt-2">Now ' + goalNowText(g) +
                (g.start !== undefined ? ' &middot; from ' + num1(g.start) + ' ' + (g.unit || 'kg') : '') +
                ' &middot; by ' + goalBy(g) + '</p>' +
            '</div>';
          }).join('') +
        '</div>' +
        '<div class="sheet__foot">' +
          (S.goalForm ? goalForm()
            : '<button class="btn btn--secondary btn--block" data-action="add-goal" data-testid="goals-add">' +
                '<span class="btn__label">Add a goal</span></button>') +
        '</div>' +
      '</div>';
  }

  /* The type comes first because it decides what the rest of the form asks
     for AND what number will measure the goal afterwards. A form that takes
     a sentence and a date can only ever produce a bar that does not move. */
  var GOAL_TYPES = [
    ['weight', 'Body weight'], ['bodyfat', 'Body fat'],
    ['lift', 'A lift'], ['custom', 'Something else']
  ];
  function liftOptions() {
    return LIFTS.map(function (l) {
      return '<option value="' + l.id + '">' + l.name + '</option>';
    }).join('');
  }
  function goalForm() {
    var type = S.goalType || 'weight';
    var nowv = goalNow({ type: type, exId: Number((document.getElementById('gl-lift') || {}).value || 0) });
    var unit = type === 'bodyfat' ? '%' : 'kg';
    var out = '<div class="seg seg--lg" role="radiogroup" aria-label="What kind of goal" ' +
        'data-testid="gl-type">' +
      GOAL_TYPES.map(function (t) {
        return '<button class="seg__item" type="button" role="radio" ' +
          'aria-checked="' + (type === t[0]) + '" data-action="goal-type" data-v="' + t[0] + '" ' +
          'data-testid="gl-type-' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>';

    if (type === 'lift') {
      out += '<label class="t-label field__label mt-3" for="gl-lift">Which lift</label>' +
        '<select class="input" id="gl-lift" data-testid="gl-lift">' +
          liftOptions() + '</select>';
    }
    out += '<label class="t-label field__label mt-3" for="gl-name">What to call it</label>' +
      '<input class="input" id="gl-name" type="text" ' +
        'placeholder="' + (type === 'lift' ? 'Left blank, the lift names it' : 'e.g. Back to 62 kg') + '" ' +
        'data-testid="gl-name">';
    if (type !== 'custom') {
      out += '<div class="hstack hstack--3 mt-3">' +
          '<div class="grow"><label class="t-label field__label" for="gl-start">From</label>' +
            '<input class="input num" id="gl-start" type="number" step="0.1" inputmode="decimal" ' +
              'placeholder="' + (nowv === null || nowv === undefined ? 'now' : num1(nowv)) + '" ' +
              'data-testid="gl-start"></div>' +
          '<div class="grow"><label class="t-label field__label" for="gl-target">To</label>' +
            '<input class="input num" id="gl-target" type="number" step="0.1" inputmode="decimal" ' +
              'data-testid="gl-target"></div>' +
        '</div>' +
        '<p class="t-caption-1 quiet mt-1">' + unit + '. Left blank, From is where you are now' +
          (nowv === null || nowv === undefined ? ', and nothing is logged yet.' : ': ' + num1(nowv) + ' ' + unit + '.') +
        '</p>';
    } else {
      out += '<p class="t-caption-1 quiet mt-1">Nothing measures this one, so it carries no ' +
        'percentage. It is a note with a date on it.</p>';
    }
    out += '<label class="t-label field__label mt-3" for="gl-date">By when</label>' +
      '<input class="input" id="gl-date" type="date" min="' + TODAY + '" data-testid="gl-date">' +
      '<p class="t-caption-1 quiet mt-1">Optional. No date means no deadline, not a failed goal.</p>' +
      (S.goalError ? '<p class="field__error mt-2" role="alert" data-testid="gl-error">' +
        esc(S.goalError) + '</p>' : '') +
      '<button class="btn btn--primary btn--block mt-3" data-action="save-goal" data-testid="goals-save">' +
        '<span class="btn__label">Add it</span></button>';
    return out;
  }

  /* A record set outside a logged session. It happens, and refusing to
     record it is how a personal best goes missing from the one place that
     is meant to hold all of them. */
  function recordSheet() {
    return '' +
      '<div class="scrim" data-action="close-sheet" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rc-title" data-testid="record-sheet">' +
        '<div class="sheet__head"><h2 class="t-section grow" id="rc-title">Log a record</h2>' +
          '<button class="iconbtn" data-action="close-sheet" data-testid="record-close" aria-label="Close">' +
            ICO.close + '</button></div>' +
        '<div class="sheet__body">' +
          '<p class="t-detail">For a lift you did somewhere the app was not. It joins your records ' +
            'and your charts; it does not create a session.</p>' +
          '<label class="t-label field__label mt-4" for="rec-lift">Lift</label>' +
          '<select class="input" id="rec-lift" data-testid="rec-lift">' +
            liftOptions() +
          '</select>' +
          '<div class="hstack hstack--3 mt-3">' +
            '<div class="field grow"><label class="t-label field__label" for="rec-kg">Weight, kg</label>' +
              '<input class="input num" id="rec-kg" type="number" min="0" step="0.5" inputmode="decimal" ' +
                'placeholder="0" data-testid="rec-kg"></div>' +
            '<div class="field" style="width: 96px"><label class="t-label field__label" for="rec-reps">Reps</label>' +
              '<input class="input num" id="rec-reps" type="number" min="1" step="1" inputmode="numeric" ' +
                'value="1" data-testid="rec-reps"></div>' +
          '</div>' +
        '</div>' +
        '<div class="sheet__foot">' +
          (S.recordError ? '<p class="field__error" role="alert" data-testid="rec-error">' +
            esc(S.recordError) + '</p>' : '') +
          '<button class="btn btn--primary btn--block" data-action="save-record" data-testid="rec-save">' +
            '<span class="btn__label">Add to my records</span></button>' +
        '</div>' +
      '</div>';
  }

  function sheetHTML() {
    if (S.sheet === 'weight') return weightSheet();
    if (S.sheet === 'goals') return goalsSheet();
    if (S.sheet === 'record') return recordSheet();
    if (S.sheet === 'bf') return bfSheet();
    if (S.sheet === 'photos') return photosSheet();
    if (S.sheet === 'photo') return photoSheet();
    if (S.sheet === 'analyse-consent') return consentSheet();
    var days = rangeDays();
    return '' +
      '<div class="scrim" data-action="close-sheet" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-testid="lift-sheet" data-detents="0.55 0.88" data-detent-open="0.88">' +
        '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-section" id="sheet-title">Choose a lift</h2>' +
          '<button class="iconbtn" data-action="close-sheet" data-testid="sheet-close" aria-label="Close lift picker">' +
            ICO.close + '</button>' +
        '</div>' +
        '<div class="sheet__body" role="radiogroup" aria-label="Lifts with history">' +
          '<div class="card card--flush">' +
            LIFTS.map(function (l) {
              var p = ptsIn(l, days);
              var on = l.id === S.liftId;
              var d = p.length > 1 ? p[p.length - 1][1] - p[0][1] : 0;
              var latest = p.length ? p[p.length - 1][1] : null;
              return '<button class="row' + (on ? ' row--selected' : '') + '" role="radio" aria-checked="' + on +
                '" data-action="pick-lift" data-id="' + l.id + '" data-testid="sheet-lift-' + l.id + '">' +
                '<span class="ico-well">' + ICO.lift + '</span>' +
                '<span class="row__main stack">' +
                  '<span class="row__title">' + esc(l.name) + '</span>' +
                  '<span class="row__sub">' + esc(l.muscle) + ' &middot; ' + n(p.length) + ' sessions</span>' +
                '</span>' +
                /* Said, not implied. This is the latest estimated one-rep max
                   from the trend; the Records list two taps away shows the
                   heaviest set actually lifted. Both were a bare "kg" in the
                   same slot, so the same lift read 231 here and 220 there
                   with nothing to tell a person which was their record. */
                '<span class="row__value stack" style="text-align: right">' +
                  (latest === null
                    ? '<span class="quiet">&mdash;</span>'
                    : '<span class="num">' + kg(latest) + '</span>' +
                      '<span class="t-caption-2 quiet">est. 1RM</span>') +
                '</span>' +
              '</button>';
            }).join('') +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* =============================================================
     Render
     ============================================================= */
  var body = document.getElementById('body');
  var overlay = document.getElementById('overlay');
  var screen = document.getElementById('screen');
  var lastFocus = null;

  function drawChart() {
    var holder = document.getElementById('chart-holder');
    if (!holder) return;
    var lift = liftById(S.liftId);
    var pts = ptsIn(lift, rangeDays());
    var w = holder.clientWidth || 329;
    LKPatch(holder, chartSVG(lift, pts, rangeDays(), w));
  }

  function render() {
    screen.setAttribute('data-state', S.view);
    LKPatch(body, (VIEWS[S.view] || VIEWS.populated)());
    drawChart();
    LKPatch(overlay, (S.sheet ? sheetHTML() : '') + toastHTML());
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.view));
    });
    if (S.sheet) {
      var f = overlay.querySelector('[data-testid="sheet-close"]');
      if (f) f.focus();
    }
    clearTimeout(toastTimer);
    if (S.toast) toastTimer = setTimeout(function () { S.toast = null; render(); }, 6000);
  }

  /* A write that changes nothing on screen has to say so. Three sheets here
     write into lists that are behind the sheet, so without this the only
     feedback was the sheet closing. Six seconds, then it goes on its own. */
  var toastTimer = null;
  function toastHTML() {
    if (!S.toast) return '';
    return '<div class="toast toast--nonav" role="status" data-testid="toast">' +
      '<span class="toast__body">' + esc(S.toast) + '</span>' +
      '<button class="toast__action" type="button" data-action="dismiss-toast" ' +
        'data-testid="toast-dismiss">Done</button>' +
    '</div>';
  }

  /* S.sheet holds WHICH sheet, not whether one is open. It was a boolean
     when the screen had one; three more rows now have somewhere to go, and
     "true" cannot say which. Everything that reads it as truthy still works
     because a name is truthy. */
  /* The shell every sheet on this screen shares. It was three near-identical
     copies before the photo sheets made it four; one shell means a change to
     how a sheet closes is a change in one place. */
  function sheet(id, title, detents, inner) {
    return '' +
      '<div class="scrim" data-action="close-sheet" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="' + id + '-title" ' +
        'data-testid="' + id + '-sheet" data-detents="' + detents + '">' +
        '<div class="sheet__grab" data-sheet-drag aria-hidden="true"></div>' +
        '<div class="sheet__head"><h2 class="t-section grow" id="' + id + '-title">' + esc(title) + '</h2>' +
          '<button class="iconbtn" data-action="close-sheet" data-testid="' + id + '-close" ' +
            'aria-label="Close ' + esc(title) + '">' + ICO.close + '</button></div>' +
        '<div class="sheet__body">' + inner + '</div>' +
      '</div>';
  }

  /* Photos. Grouped by month, newest month first AND newest photo first
     inside each month -- the shipped grid reversed only the outer list.

     The thumbnails here are drawn, not photographed: a static build has no
     camera, and a stock body shot presented as this person's progress would
     be the screen lying about its own data. Each stands in for a stored
     downscale at the size one really is. */
  function photoTile(ph, i) {
    var tone = ['#2a2f3a', '#333a47', '#3d4553', '#48515f'][ph.tone] || '#333a47';
    return '<button class="ph" type="button" data-action="open-photo" data-i="' + i +
        '" data-testid="photo-' + i + '" aria-label="' + esc(dayLabel(ph.date)) +
        (ph.note ? ', ' + esc(ph.note) : '') + '">' +
      '<span class="ph__img" style="' + (ph.thumb
        ? 'background-image:url(' + ph.thumb + ');background-size:cover;background-position:center'
        : 'background:' + tone) + '" aria-hidden="true"></span>' +
      '<span class="ph__cap">' + esc(dayLabel(ph.date)) + '</span>' +
    '</button>';
  }

  /* Every reading, with the method beside it, because a caliper number and a
     DEXA number are not the same measurement and a chart that mixes them
     without saying so is a chart of two things. */
  function bfSheet() {
    var rows = BF.map(function (r, i) {
      return '<div class="row row--withaside" data-testid="bf-row-' + i + '">' +
        '<span class="row__main stack">' +
          '<span class="row__title">' + num1(r.pct) + '%</span>' +
          '<span class="row__sub">' + dayLabel(r.date) + ' \u00b7 ' + esc(bfMethodLabel(r.method)) + '</span>' +
        '</span>' +
        '<button class="iconbtn" type="button" data-action="del-bf" data-i="' + i + '" ' +
          'aria-label="Remove the ' + esc(dayLabel(r.date)) + ' reading" ' +
          'data-testid="bf-del-' + i + '">' + ICO.close + '</button>' +
      '</div>';
    }).join('');
    return sheet('bf', 'Body fat', '0.55 0.9',
      (BF.length
        ? '<p class="t-detail">' + n(BF.length) + (BF.length === 1 ? ' reading' : ' readings') +
            ', newest first. A goal set on body fat is measured against the top one.</p>' +
          '<div class="card card--flush mt-3">' + rows + '</div>'
        : '<p class="t-body">Nothing logged yet.</p>' +
          '<p class="t-detail muted mt-1">Any method works as long as you keep using the same one. ' +
            'The direction is the reading; the absolute number is not.</p>') +
      '<h3 class="t-label mt-5">Add one</h3>' +
      '<div class="hstack hstack--3 mt-2">' +
        '<div class="grow"><label class="t-label field__label" for="bf-pct">Per cent</label>' +
          '<input class="input num" id="bf-pct" type="number" min="1" max="70" step="0.1" ' +
            'inputmode="decimal" data-testid="bf-pct"></div>' +
        '<div class="grow"><label class="t-label field__label" for="bf-method">How</label>' +
          '<select class="input" id="bf-method" data-testid="bf-method">' +
            BF_METHODS.map(function (m) {
              return '<option value="' + m[0] + '">' + m[1] + '</option>';
            }).join('') + '</select></div>' +
      '</div>' +
      (S.bfError ? '<p class="field__error mt-2" role="alert" data-testid="bf-error">' +
        esc(S.bfError) + '</p>' : '') +
      '<button class="btn btn--primary btn--block mt-3" type="button" data-action="save-bf" ' +
        'data-testid="bf-save"><span class="btn__label">Log it</span></button>');
  }

  /* Downscaled to 480px on the long edge and re-encoded as JPEG. A phone
     photo is three to six megabytes; localStorage is five, so storing the
     original would fill it with one picture and throw on the second. */
  function addPhotoFile(file) {
    if (!file) return;
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var max = 480;
      var w = img.width, h = img.height;
      var k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.round(w * k); c.height = Math.round(h * k);
      try {
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var thumb = c.toDataURL('image/jpeg', 0.72);
        var iso = todayISO();
        PHOTOS.unshift({ date: iso, note: '', thumb: thumb, tone: PHOTOS.length % 4 });
        savePhotos();
        S.toast = 'Photo added for ' + dayLabel(iso) + '.';
      } catch (e) {
        /* A tainted canvas or a quota refusal. Said, not swallowed: a photo
           the person believes was saved and was not is worse than a failure
           they can see. */
        S.toast = 'That photo could not be saved on this device.';
      }
      try { URL.revokeObjectURL(url); } catch (e) {}
      render();
    };
    img.onerror = function () {
      try { URL.revokeObjectURL(url); } catch (e) {}
      S.toast = 'That file is not an image this browser can read.';
      render();
    };
    img.src = url;
  }

  document.addEventListener('change', function (e) {
    if (e.target.id === 'ph-take' || e.target.id === 'ph-pick') {
      addPhotoFile(e.target.files && e.target.files[0]);
    }
  });

  function logBF() {
    var el = document.getElementById('bf-pct');
    var v = el ? parseFloat(el.value) : NaN;
    if (isNaN(v) || v < 1 || v > 70) { S.bfError = 'A percentage between 1 and 70.'; render(); focusIn('bf-pct'); return; }
    var m = (document.getElementById('bf-method') || {}).value || 'manual';
    var iso = todayISO();
    /* One a day, the same rule the weigh-in follows. */
    if (BF.length && BF[0].date === iso) { BF[0].pct = v; BF[0].method = m; }
    else BF.unshift({ date: iso, pct: v, method: m });
    saveBF();
    S.bfError = null;
    S.toast = num1(v) + '% logged.';
    render();
  }

  function photosSheet() {
    var byMonth = {};
    PHOTOS.forEach(function (ph, i) {
      var k = ph.date.slice(0, 7);
      (byMonth[k] = byMonth[k] || []).push([ph, i]);
    });
    var months = Object.keys(byMonth).sort().reverse();
    var body = months.map(function (k) {
      var pm = k.split('-');
      return '<p class="t-label mt-4">' + MONTHS[+pm[1] - 1] + ' ' + pm[0] + '</p>' +
        '<div class="phgrid mt-2">' + byMonth[k]
          .sort(function (a, b) { return a[0].date < b[0].date ? 1 : -1; })
          .map(function (p) { return photoTile(p[0], p[1]); }).join('') + '</div>';
    }).join('');

    return sheet('photos', 'Photos', '0.6 0.94',
      (PHOTOS.length
        ? '<p class="t-detail">' + n(PHOTOS.length) + (PHOTOS.length === 1 ? ' photo' : ' photos') +
            ', stored on this device.</p>' + body
        : '<p class="t-body">No photos yet.</p>' +
          '<p class="t-detail muted mt-1">A photo every few weeks shows what the scale does not.</p>') +
      /* Real inputs. "Add a photo" toasted, so there was no way to add one
         at all -- on the screen whose whole point is a picture every few
         weeks. The camera one opens the camera on a phone; the other opens
         the library. What is stored is a downscaled JPEG, never the
         full-resolution original, because the grid and the lightbox are all
         that is ever drawn from it and a phone photo would fill localStorage
         in a fortnight. */
      '<div class="hstack hstack--3 mt-4">' +
        '<label class="btn btn--primary grow" for="ph-take">' +
          '<span class="btn__label">Take one</span></label>' +
        '<input class="vis-hidden" id="ph-take" type="file" accept="image/*" capture="environment" ' +
          'data-testid="add-photo">' +
        '<label class="btn btn--secondary grow" for="ph-pick">' +
          '<span class="btn__label">From the library</span></label>' +
        '<input class="vis-hidden" id="ph-pick" type="file" accept="image/*" data-testid="pick-photo">' +
      '</div>' +
      '<p class="t-caption-1 muted mt-2">Downscaled and kept on this device. Nothing is uploaded, ' +
        'and there is no server behind this screen to upload it to.</p>');
  }

  function photoSheet() {
    var ph = PHOTOS[S.photoIdx];
    if (!ph) return '';
    var tone = ['#2a2f3a', '#333a47', '#3d4553', '#48515f'][ph.tone] || '#333a47';
    return sheet('photo', dayLabel(ph.date), 'auto',
      '<div class="ph__full" style="background:' + tone + '" role="img" aria-label="' +
        esc(ph.note || dayLabel(ph.date)) + '"></div>' +
      (ph.note ? '<p class="t-body mt-3">' + esc(ph.note) + '</p>' : '') +
      /* The analyse path asks first, and says exactly what leaves. The
         shipped screen offered it with no consent step, no opt-out, and the
         words "stored on device" on the same screen. */
      '<button class="btn btn--secondary btn--block mt-4" type="button" data-action="analyse" ' +
        'data-testid="analyse"><span class="btn__label">Analyse this photo</span></button>' +
      '<button class="btn btn--danger btn--block mt-2" type="button" data-action="del-photo" ' +
        'data-testid="del-photo"><span class="btn__label">' +
        (S.confirmDel ? 'Tap again to delete' : 'Delete') + '</span></button>' +
      '<p class="t-detail muted mt-2">A photo cannot be recreated, so deleting asks twice.</p>');
  }

  function consentSheet() {
    return sheet('analyse-consent', 'Before it leaves the device', 'auto',
      '<p class="t-body">Analysing sends this photo to LOCKED\u2019s server, along with your ' +
        'goal, your body weight and your weekly set volume. It is processed there and the ' +
        'reply comes back here.</p>' +
      '<p class="t-detail muted mt-3">Everything else on this screen stays on the device. ' +
        'This one action would not, which is why it asks.</p>' +
      '<p class="t-detail muted mt-2">In this build it is not wired to anything: nothing is ' +
        'sent, and the consent step is here so the shape of the flow can be read.</p>' +
      '<button class="btn btn--primary btn--block mt-4" type="button" data-action="analyse-go" ' +
        'data-testid="analyse-go"><span class="btn__label">Send it and analyse</span></button>' +
      /* Declining goes back to the photo, not out of the stack. Closing
         everything would punish the safer answer with more taps. */
      '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="analyse-no" ' +
        'data-testid="analyse-no"><span class="btn__label">Keep it on the device</span></button>');
  }

  function openSheet(name) {
    lastFocus = document.activeElement;
    S.sheet = name || 'lift';
    /* A sheet opens clean. These four survived close-and-reopen, so a form
       the reader had not touched yet accused them of something -- and Goals
       reopened straight into a half-filled add form instead of its button.
       Every other piece of state these sheets own is reset here; these were
       added later and were not. */
    S.weightError = null;
    S.goalError = null;
    S.goalForm = false;
    S.recordError = null;
    render();
  }
  function closeSheet(refocus) {
    S.sheet = false;
    render();
    var back = refocus && document.querySelector('[data-testid="choose-lift"]');
    if (back) back.focus();
    else if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var a = t.dataset.action;
    if (a === 'range') {
      S.range = t.dataset.range;
      render();
    } else if (a === 'open-picker') {
      openSheet('lift');
    } else if (a === 'close-sheet') {
      closeSheet(true);
    } else if (a === 'pick-lift') {
      S.liftId = Number(t.dataset.id);
      var wasSheet = S.sheet;
      S.sheet = false;
      render();
      var card = document.querySelector('[data-testid="card-trend"]');
      if (card) card.scrollIntoView({ block: 'nearest' });
      if (wasSheet) {
        var back = document.querySelector('[data-testid="choose-lift"]');
        if (back) back.focus();
      }
    } else if (a === 'open-weight') {
      openSheet('weight');
    } else if (a === 'open-photos') {
      openSheet('photos');
    } else if (a === 'open-photo') {
      S.photoIdx = +t.getAttribute('data-i'); S.confirmDel = false; openSheet('photo');
    } else if (a === 'analyse') {
      openSheet('analyse-consent');
    } else if (a === 'analyse-no') {
      openSheet('photo');
    } else if (a === 'analyse-go') {
      S.sheet = null; render();
      /* It says what this build does, which is nothing. The old wording
         claimed a photo had been sent somewhere and a reply was coming; no
         request is made, and telling somebody their body photo has left the
         device when it has not is the worst direction for that error. */
      S.toast = 'Not in this build. No photo has left this device.'; render();
    } else if (a === 'del-photo') {
      if (!S.confirmDel) { S.confirmDel = true; render(); return; }
      var gonePh = PHOTOS.splice(S.photoIdx, 1)[0];
      savePhotos();
      S.photoIdx = null; S.confirmDel = false; S.sheet = 'photos'; render();
      S.toast = dayLabel(gonePh.date) + ' deleted.'; render();
    } else if (a === 'open-bf') {
      openSheet('bf');
    } else if (a === 'save-bf') {
      logBF(); return;
    } else if (a === 'del-bf') {
      var goneBf = BF.splice(+t.getAttribute('data-i'), 1)[0];
      saveBF(); render();
      if (goneBf) { S.toast = dayLabel(goneBf.date) + ' removed.'; render(); }
      return;
    } else if (a === 'goal-type') {
      S.goalType = t.getAttribute('data-v'); S.goalError = null; render(); return;
    } else if (a === 'open-goals') {
      openSheet('goals');
    } else if (a === 'log-record') {
      openSheet('record');
    } else if (a === 'log-weight') {
      logWeight();
    } else if (a === 'add-goal') {
      S.goalForm = true; S.goalError = null; S.goalType = S.goalType || 'weight';
      render(); focusIn('gl-name');
    } else if (a === 'save-goal') {
      saveGoal();
    } else if (a === 'save-record') {
      saveRecord();
    } else if (a === 'start-workout') {
      /* Standalone this is a page; in the demo the router takes the click
         before this runs. Either way the empty state's one call to action
         now leads somewhere -- it was rendered with no branch behind it. */
      location.href = 'train.html';
    } else if (a === 'dismiss-toast') {
      S.toast = null; render();
    } else if (a === 'retry' || a === 'show-cached') {
      S.view = 'populated';
      render();
    }
  });

  /* ---- The three writes -------------------------------------------
     Each of these sheets used to close on its primary and change nothing;
     the record one discarded whatever had been typed into it first. */

  function focusIn(id) {
    var el = document.getElementById(id);
    if (el) el.focus();
  }
  /* TODAY, not the wall clock. Every date on this screen is measured against
     the fixture, so a reading stamped with the real date sorts and labels
     itself wrongly the moment the two disagree. */
  function todayISO() { return TODAY; }

  function logWeight() {
    var el = document.getElementById('wt-kg');
    var v = el ? parseFloat(el.value) : NaN;
    if (isNaN(v) || v < 20 || v > 400) {
      S.weightError = 'A weight between 20 and 400 kg.';
      render();
      return;
    }
    var iso = todayISO();
    var last = WEIGHT_LOG[WEIGHT_LOG.length - 1];
    /* One reading a day. A second one replaces the first rather than
       stacking two points on the same date, which would put a vertical
       segment in the trend. */
    if (last && last[0] === iso) last[1] = v;
    else WEIGHT_LOG.push([iso, v]);
    saveWeight();
    S.weightError = null;
    S.sheet = false;
    S.toast = num1(v) + ' kg logged for today.';
    render();
    refocus('row-body-weight');
  }

  /* The form writes the shape the screen READS. It used to push
