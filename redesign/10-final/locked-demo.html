<!--
  Generated by 10-final/assemble.mjs. Do not hand-edit: run the assembler.

  Screens in this build: home, train, fuel-placeholder, progress, coach, split-builder, exercise-library, onboarding, settings, workout-log, review.

  Every screen is a separate shadow root, so ids, aria references and CSS
  cannot cross between screens. Every screen's script runs in its own closure

  inlined once and adopted by each root. No iframes, no network.

<style id="demo-global-css">
/* LOCKED design tokens
   Every value the demo is allowed to use. Nothing outside this file.
   Dark is the built theme. Light is defined with verified contrast pairs.
   Contrast measured, not estimated: see the pair table at the end. */

:root {
  color-scheme: dark;

  /* ---- Type scale. Six sizes, no others. ---- */
  --type-11: 11px;   /* labels, units, meta */
  --type-13: 13px;   /* secondary text, list detail */
  --type-15: 15px;   /* body, list titles */
  --type-17: 17px;   /* section titles, emphasised body */
  --type-22: 22px;   /* screen titles */
  --type-28: 28px;   /* single hero number */

  /* Line height and tracking are set per size, never ad hoc. */
  --lh-11: 14px;  --tr-11: 0.06em;
  --lh-13: 18px;  --tr-13: 0.005em;
  --lh-15: 20px;  --tr-15: 0em;
  --lh-17: 22px;  --tr-17: -0.01em;
  --lh-22: 28px;  --tr-22: -0.02em;
  --lh-28: 32px;  --tr-28: -0.02em;

  /* ---- Weights. 700 is for numbers and titles only. ---- */
  --w-regular: 400;
  --w-medium: 500;
  --w-semibold: 600;
  --w-bold: 700;

  /* ---- Spacing. Six steps. ---- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;

  /* ---- Radius. Four values. ---- */
  --r-sm: 8px;    /* inputs, chips, small controls */
  --r-md: 12px;   /* buttons, rows */
  --r-lg: 16px;   /* cards, sheets */
  --r-full: 999px;/* pills, avatars, toggles */

  /* ---- Surfaces. Elevation by tone, shadow secondary. ---- */
  --bg: #0A0A0B;          /* app ground, L* 3.4 */
  --surface: #141416;      /* card, L* 7.4 */
  --surface-raised: #1C1C1F;/* sheet, popover, L* 10.6 */
  --surface-sunken: #050506;/* inset wells, keypad ground */
  --hairline: #2A2A2E;     /* separators, 1px */
  --border: #35353A;       /* control borders, 3:1 against surface */

  /* ---- Text ---- */
  --text: #F5F5F7;
  --text-secondary: #A1A1A8;
  --text-tertiary: #86868F;   /* 5.10:1 on surface, passes AA small */
  --text-on-accent: #0A0A0B;  /* orange is a light colour: dark text on it */
  --text-on-solid: #FFFFFF;   /* for deep/semantic fills only */

  /* ---- Accent. One. ---- */
  --accent: #F97316;        /* fills. Pair with --text-on-accent */
  --accent-text: #FF8A3D;   /* accent as text or icon on dark, 7.85:1 */
  --accent-deep: #C2410C;   /* pressed fill, and white-text fills */
  --accent-quiet: #2A1B12;  /* tinted ground for selected rows */

  /* ---- Semantic ---- */
  --success: #3FD98B;
  --success-quiet: #10281C;
  --error: #FF6B6B;
  --error-solid: #D92D2D;   /* fills needing white text */
  --error-quiet: #2A1416;
  --warning: #FFB224;
  --warning-quiet: #2A2010;
  --info: #5AA9FF;
  --info-quiet: #101E2E;

  /* ---- Motion. Two durations, two easings, one spring. ---- */
  --dur-fast: 150ms;   /* state change on a control */
  --dur-slow: 300ms;   /* something entering or leaving */
  --ease: cubic-bezier(0.2, 0, 0.2, 1);          /* standard */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);      /* decelerate, for exits */
  --spring: cubic-bezier(0.32, 0.72, 0, 1);       /* sheets only */

  /* ---- Shadows. Two. Achromatic. ---- */
  --shadow-raised: 0 1px 2px rgba(0, 0, 0, 0.5);
  --shadow-overlay: 0 12px 32px rgba(0, 0, 0, 0.6);
  --scrim: rgba(0, 0, 0, 0.5);

  /* ---------------------------------------------------------------
     ANATOMY DATA PALETTE
     Twelve hues, one per muscle group in the exercise database, that
     encode muscle identity on the body map in the same way a chart
     palette encodes series. They are DATA, never chrome: no button,
     bar, icon, border or text outside an anatomical shape may use
     them, and the body never carries --accent, so a muscle can never
     be mistaken for an action.

     Twelve is more than a categorical palette normally holds, so the
     wheel is spent anatomically rather than evenly: the three arm
     groups sit together in the teal-to-sky band and the four leg
     groups together in the lime-to-jade band, so a limb reads as one
     family at a glance while each group stays individually
     selectable. Chest, Back, Shoulders, Abs and Calves take clearly
     separate hues of their own.

     Hues: 345, 228, 272, 312, 48, 168, 186, 203, 66, 98, 128, 154.
     None sits in the accent's orange band (--accent is hue 25); Abs
     at 48 is the nearest and is a yellow gold, not an orange.

     Measured, WCAG 2.1, against --bg #0A0A0B / --surface #18181B /
     --surface-raised #1F1F23 / black. The last column is the shade
     step used for the seam between two muscles and for fibre
     striations, mixed 45% of the hue into black, measured against
     its own hue -- every seam clears 3:1 against the muscle it
     separates, so the separation is visible, not decorative.

       group      hex        bg    surf  raised  black   seam vs hue
       chest      #FF6B90   7.31   6.54   6.07   7.76      3.48
       back       #7A95FF   7.13   6.39   5.92   7.57      3.42
       shoulders  #CB8FFE   8.39   7.51   6.96   8.90      3.68
       calves     #F17EDA   8.23   7.37   6.83   8.74      3.64
       abs        #F3D149  13.22  11.83  10.97  14.03      4.29
       forearms   #18DCB5  11.26  10.08   9.34  11.94      4.09
       biceps     #4CE0F0  12.47  11.16  10.35  13.23      4.20
       triceps    #7BC6F4  10.58   9.47   8.78  11.23      3.99
       hams       #D4E250  13.94  12.48  11.57  14.79      4.34
       quads      #67DB24  11.06   9.90   9.18  11.73      4.03
       adduc      #90D599  11.46  10.26   9.51  12.16      4.08
       glutes     #29E091  11.46  10.26   9.52  12.17      4.11
     --------------------------------------------------------------- */
  --anat-chest: #FF6B90;      /* rose */
  --anat-back: #7A95FF;       /* periwinkle */
  --anat-shoulders: #CB8FFE;  /* violet */
  --anat-calves: #F17EDA;     /* orchid */
  --anat-abs: #F3D149;        /* gold */
  --anat-forearms: #18DCB5;   /* teal      \                        */
  --anat-biceps: #4CE0F0;     /* cyan       > the arm family        */
  --anat-triceps: #7BC6F4;    /* sky       /                        */
  --anat-hams: #D4E250;       /* lime      \                        */
  --anat-quads: #67DB24;      /* green      \  the leg family       */
  --anat-adduc: #90D599;      /* sage       /                       */
  --anat-glutes: #29E091;     /* jade      /                        */

  /* Sub-region tints. A group's parts read as one family: the same
     hue lightened and deepened, never a different hue. Chest is the
     worked example; the other four groups that hold sub-regions
     (Back, Shoulders, Triceps, Biceps, Abs) follow the same ramp.
     Measured on --bg: 11.79, 7.31, 5.37 -- all AA for text on them. */
  --anat-chest-1: #FFB3C6;
  --anat-chest-2: #FF6B90;
  --anat-chest-3: #E0537D;

  /* Body ground and the deselected state. --anat-muted is 3.18:1 on
     --bg, so an unselected but still interactive region keeps a 3:1
     boundary (WCAG 1.4.11); --anat-silhouette is the inert body
     behind the muscles and --anat-shorts the garment, both carrying
     no meaning and no hue. The silhouette is 2.11:1 on --bg: enough
     for the body's outline to read as a figure, not enough to compete
     with the muscles drawn on it. */
  --anat-muted: #606069;
  --anat-silhouette: #34343B;
  --anat-shorts: #1B1B20;

  /* ---- Layout ---- */
  --nav-h: 56px;
  --tap: 44px;             /* nothing interactive is smaller */
  --page-x: var(--sp-4);   /* page gutter */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* Light theme. Defined and contrast-checked. No light screens are built. */
:root[data-theme="light"] {
  color-scheme: light;
  /* Elevation ramp mirrors dark: the ground is darkest, raised is lightest.
     Measured L*: 90.74 -> 94.57 -> 98.32 -> 100.00, strictly increasing.
     The previous values put bg and surface-raised both at pure white, so a
     raised card had a 1.00:1 boundary against the page. */
  --bg: #EFEFF4;
  --surface: #FAFAFC;
  --surface-raised: #FFFFFF;
  --surface-sunken: #E4E4EA;
  --hairline: #C9C9D2;
  --border: #868690;   /* 3.14:1 on bg, 3.46:1 on surface, 3.60:1 on raised */
  --text: #0A0A0B;
  --text-secondary: #55555E;
  --text-tertiary: #6B6B75;  /* 5.05:1 on surface, 4.60:1 on bg */
  --text-on-accent: #FFFFFF;
  --accent: #C2410C;
  --accent-text: #B03A0A;
  --accent-deep: #9A3412;
  --accent-quiet: #FDEDE4;
  --success: #127A4B;
  --success-quiet: #E4F6EC;
  --error: #C42525;
  --error-solid: #C42525;
  --error-quiet: #FCE9E9;
  --warning: #8A5A00;
  --warning-quiet: #FDF3E0;
  --info: #17538F;
  --info-quiet: #E7F0FA;
  --shadow-raised: 0 1px 2px rgba(0, 0, 0, 0.12);
  --shadow-overlay: 0 12px 32px rgba(0, 0, 0, 0.18);
  --scrim: rgba(0, 0, 0, 0.35);
}

/* ---------------------------------------------------------------
   Base. The demo's only global rules.
   --------------------------------------------------------------- */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  font-size: var(--type-15);
  line-height: var(--lh-15);
  letter-spacing: var(--tr-15);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Numbers are tabular everywhere. A weight that changes width is a bug. */
.num, [data-num] {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

button, input, select, textarea { font: inherit; color: inherit; }

button {
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* Every control answers within 100ms. */
button, [role="button"], a, input, select, .row, .chip {
  transition: background-color var(--dur-fast) var(--ease),
              transform var(--dur-fast) var(--ease),
              opacity var(--dur-fast) var(--ease),
              border-color var(--dur-fast) var(--ease);
}
button:active, [role="button"]:active, .row:active, .chip:active {
  transform: scale(0.97);
}
button:disabled, [aria-disabled="true"] {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}

:focus-visible {
  outline: 2px solid var(--accent-text);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* Nothing scrolls sideways unless it says it is a carousel. */
body { overflow-x: hidden; }
.carousel { overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
.carousel > * { scroll-snap-align: start; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ---------------------------------------------------------------
   Type helpers. Every text node uses one of these.
   --------------------------------------------------------------- */
.t-label   { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); font-weight: var(--w-semibold); text-transform: uppercase; color: var(--text-tertiary); }
.t-meta    { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); font-weight: var(--w-medium); color: var(--text-tertiary); text-transform: none; }
.t-detail  { font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13); font-weight: var(--w-regular); color: var(--text-secondary); }
.t-body    { font-size: var(--type-15); line-height: var(--lh-15); letter-spacing: var(--tr-15); font-weight: var(--w-regular); }
.t-body-em { font-size: var(--type-15); line-height: var(--lh-15); letter-spacing: var(--tr-15); font-weight: var(--w-medium); }
.t-section { font-size: var(--type-17); line-height: var(--lh-17); letter-spacing: var(--tr-17); font-weight: var(--w-semibold); }
.t-title   { font-size: var(--type-22); line-height: var(--lh-22); letter-spacing: var(--tr-22); font-weight: var(--w-bold); }
.t-hero    { font-size: var(--type-28); line-height: var(--lh-28); letter-spacing: var(--tr-28); font-weight: var(--w-bold); font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------
   Forbidden, enforced by review:
     hex or rgba outside this file
     a font size, spacing, radius or duration not listed above
     decorative gradients; the accent fill marks the primary action only
     emoji as an icon
     a shadow that carries colour
     an interactive target under 44x44
     !important, except the reduced-motion block above
   --------------------------------------------------------------- */

/* ---------------------------------------------------------------
   Verified contrast pairs (WCAG 2.1, measured by script)

   DARK                                            ratio   result
   text          on bg                             18.18   AA
   text          on surface                        16.90   AA
   text-secondary on surface                        7.17   AA
   text-tertiary on surface                         5.10   AA
   accent-text   on bg                              8.44   AA
   accent-text   on surface                         7.85   AA
   text-on-accent on accent (primary button)        7.06   AA
   text-on-solid on accent-deep                     5.18   AA
   text-on-solid on error-solid                     4.81   AA
   success       on surface                        10.08   AA
   error         on surface                         6.63   AA
   warning       on surface                        10.20   AA
   info          on surface                         7.49   AA
   border        on surface                         3.06   AA (non-text)

   White on --accent measures 2.80 and is forbidden. Orange is a light
   colour; the primary button carries dark text. Use --accent-deep when a
   fill must carry white text.

   LIGHT                                           ratio   result
   text          on bg                             17.27   AA
   text          on surface                        18.98   AA
   text          on surface-raised                 19.79   AA
   text-secondary on surface                        7.08   AA
   text-tertiary on surface                         5.05   AA
   text-tertiary on bg                              4.60   AA
   border        on bg                              3.14   AA (non-text)
   border        on surface                         3.46   AA (non-text)
   border        on surface-raised                  3.60   AA (non-text)

   --hairline is a 1px separator between rows, not a control boundary, so
   WCAG 1.4.11 does not apply to it. Every control boundary uses --border.

   Elevation, measured L*:
     dark    1.39 -> 2.76 -> 6.39 -> 10.38   (sunken, bg, surface, raised)
     light  90.74 -> 94.57 -> 98.32 -> 100.00
   Both ramps are strictly monotonic, so elevation reads by tone alone and
   shadow stays secondary.
   --------------------------------------------------------------- */


/* LOCKED components.
   Every page composes these classes. A page may not invent a component,
   and may not use a value that is not a token.

   Rules encoded here so pages cannot break them:
     one accent fill per screen, on the primary action only
     no interactive target under 44x44
     every control has a pressed and a disabled state
     numbers are tabular
     sheets rise, they do not fade in place */

/* Headings and paragraphs carry no default margin: spacing is set by
   the stack and section utilities, never by the user-agent stylesheet. */
h1, h2, h3, h4, p { margin: 0; font: inherit; }

/* ===============================================================
   Screen shell
   =============================================================== */

.screen {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--bg);
  overflow: hidden;
}

/* Header. One title, one optional back, one optional trailing action. */
.hdr {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--page-x);
  padding-top: calc(var(--sp-2) + var(--safe-top));
  min-height: var(--tap);
  background: var(--bg);
}
.hdr__back {
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--tap);
  height: var(--tap);
  margin-left: calc(var(--sp-3) * -1);
  border-radius: var(--r-full);
  color: var(--text);
}
.hdr__back:active { background: var(--surface); }
.hdr__title { flex: 1; min-width: 0; }
.hdr__action {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: var(--tap);
  height: var(--tap);
  margin-right: calc(var(--sp-3) * -1);
  padding: 0 var(--sp-3);
  border-radius: var(--r-full);
  color: var(--accent-text);
  font-size: var(--type-15); line-height: var(--lh-15); letter-spacing: var(--tr-15);
  font-weight: var(--w-medium);
}
.hdr__action:active { background: var(--surface); }

/* Scroll body. The only scrolling element on a screen. */
.body {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 0 var(--page-x) var(--sp-6);
}
.body--flush { padding-left: 0; padding-right: 0; }

/* ===============================================================
   Buttons
   =============================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  min-height: var(--tap);
  padding: 0 var(--sp-4);
  border-radius: var(--r-md);
  font-size: var(--type-15); line-height: var(--lh-15);
  font-weight: var(--w-semibold);
  letter-spacing: var(--tr-15);
  white-space: nowrap;
}
.btn--block { display: flex; width: 100%; }

/* Primary. The one accent fill on the screen. Dark text: white fails. */
.btn--primary { background: var(--accent); color: var(--text-on-accent); }
.btn--primary:active { background: var(--accent-deep); color: var(--text-on-solid); }

/* Secondary. Same shape, quieter. */
.btn--secondary { background: var(--surface-raised); color: var(--text); }
.btn--secondary:active { background: var(--hairline); }

/* Tertiary. Text only, for the third thing. */
.btn--tertiary { background: none; color: var(--accent-text); font-weight: var(--w-medium); }
.btn--tertiary:active { background: var(--surface); }

/* Destructive. Never an accent fill. */
.btn--danger { background: none; color: var(--error); }
.btn--danger:active { background: var(--error-quiet); }
.btn--danger-solid { background: var(--error-solid); color: var(--text-on-solid); }

.btn--sm { min-height: var(--tap); padding: 0 var(--sp-3); font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13); }

/* Busy. A control that is working says so. */
.btn[aria-busy="true"] { pointer-events: none; }
.btn[aria-busy="true"] .btn__label { opacity: 0.5; }
.spinner {
  width: 16px; height: 16px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: var(--r-full);
  animation: spin 700ms linear infinite;
  flex: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===============================================================
   Card and section
   =============================================================== */

.card {
  background: var(--surface);
  border-radius: var(--r-lg);
  padding: var(--sp-4);
}
.card--flush { padding: 0; overflow: hidden; }
.card--raised { background: var(--surface-raised); box-shadow: var(--shadow-raised); }
.card + .card { margin-top: var(--sp-3); }

.section { margin-top: var(--sp-5); }
.section__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: var(--sp-2);
}

/* ===============================================================
   List row. One implementation. Every list uses it.
   =============================================================== */

.row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  min-height: var(--tap);
  padding: var(--sp-3) var(--sp-4);
  text-align: left;
  background: var(--surface);
  color: var(--text);
}
.row:active { background: var(--surface-raised); }
.row + .row { box-shadow: inset 0 1px 0 var(--hairline); }
.row__main { flex: 1; min-width: 0; }
.row__title { display: block; font-size: var(--type-15); letter-spacing: var(--tr-15); line-height: var(--lh-15); font-weight: var(--w-medium); }
.row__sub { display: block; font-size: var(--type-13); letter-spacing: var(--tr-13); line-height: var(--lh-13); color: var(--text-secondary); margin-top: 2px; font-variant-numeric: tabular-nums; }
.row__value { font-size: var(--type-15); line-height: var(--lh-15); letter-spacing: var(--tr-15); font-weight: var(--w-semibold); font-variant-numeric: tabular-nums; }
.row__chev { color: var(--text-tertiary); flex: none; }
.row--selected { background: var(--accent-quiet); }

/* Icon holder. One icon set, one optical size. */
.ico { width: 20px; height: 20px; flex: none; stroke-width: 1.75; }
.ico--lg { width: 24px; height: 24px; }
.ico-well {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; flex: none;
  border-radius: var(--r-sm);
  background: var(--surface-raised);
  color: var(--text-secondary);
}

/* ===============================================================
   Inputs
   =============================================================== */

.field { display: block; }
.field__label { display: block; margin-bottom: var(--sp-2); }
.input {
  display: block;
  width: 100%;
  min-height: var(--tap);
  padding: var(--sp-3);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--text);
  font-size: var(--type-15); line-height: var(--lh-15); letter-spacing: var(--tr-15);
}
.input::placeholder { color: var(--text-tertiary); }
.input:focus { outline: none; border-color: var(--accent-text); box-shadow: 0 0 0 var(--sp-1) var(--accent-quiet); }
.input[aria-invalid="true"] { border-color: var(--error); }
.field__help { margin-top: var(--sp-2); font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13); color: var(--text-secondary); }
.field__error { margin-top: var(--sp-2); font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13); color: var(--error); display: flex; gap: var(--sp-2); align-items: flex-start; }

/* Search. Prominent, because finding is the job. */
.search { position: relative; }
.search .input { padding-left: calc(var(--sp-4) + 20px); }
.search__ico { position: absolute; left: var(--sp-3); top: 50%; transform: translateY(-50%); color: var(--text-tertiary); pointer-events: none; }

/* Switch. 44px hit area, smaller visual. */
.switch {
  position: relative;
  width: 52px; height: var(--tap);
  flex: none;
  display: flex; align-items: center;
}
.switch__track {
  width: 52px; height: 32px;
  border-radius: var(--r-full);
  background: var(--hairline);
  transition: background-color var(--dur-fast) var(--ease);
}
.switch__knob {
  position: absolute; left: 2px;
  width: 28px; height: 28px;
  border-radius: var(--r-full);
  background: var(--text);
  box-shadow: var(--shadow-raised);
  transition: transform var(--dur-fast) var(--ease);
}
.switch[aria-checked="true"] .switch__track { background: var(--accent); }
.switch[aria-checked="true"] .switch__knob { transform: translateX(20px); }

/* ===============================================================
   Chips and segmented control
   =============================================================== */

.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: var(--tap);
  padding: 0 var(--sp-3);
  border-radius: var(--r-full);
  background: var(--surface-raised);
  color: var(--text-secondary);
  font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13);
  font-weight: var(--w-medium);
  white-space: nowrap;
}
.chip[aria-pressed="true"], .chip--on { background: var(--accent-quiet); color: var(--accent-text); }

/* One segmented control for the whole app. Not four. */
.seg {
  display: flex;
  gap: 2px;
  padding: 2px;
  background: var(--surface);
  border-radius: var(--r-md);
}
.seg__item {
  flex: 1;
  min-height: 40px;
  border-radius: var(--r-sm);
  font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13);
  font-weight: var(--w-medium);
  color: var(--text-secondary);
}
.seg__item[aria-selected="true"] { background: var(--surface-raised); color: var(--text); font-weight: var(--w-semibold); }
.seg--wrap { flex-wrap: wrap; }
/* A segmented control never scrolls sideways. If items do not fit, it wraps. */

/* ===============================================================
   Tab bar
   =============================================================== */

.tabbar {
  display: flex;
  align-items: stretch;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  box-shadow: inset 0 1px 0 var(--hairline);
}
.tabbar__item {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2px;
  color: var(--text-tertiary);
  font-size: var(--type-11);
  line-height: var(--lh-11);
  font-weight: var(--w-medium);
  letter-spacing: 0;
  text-transform: none;
}
.tabbar__item[aria-current="page"] { color: var(--accent-text); }
.tabbar__item:active { opacity: 0.6; }

/* ===============================================================
   Sheet and dialog. Sheets rise from where they were summoned.
   =============================================================== */

.scrim {
  position: absolute; inset: 0;
  background: var(--scrim);
  animation: scrimIn var(--dur-slow) var(--ease) both;
  z-index: 10;
}
@keyframes scrimIn { from { opacity: 0; } }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  z-index: 11;
  background: var(--surface-raised);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  box-shadow: var(--shadow-overlay);
  padding: var(--sp-2) var(--page-x) calc(var(--sp-5) + var(--safe-bottom));
  animation: sheetUp var(--dur-slow) var(--spring) both;
  max-height: 88%;
  display: flex; flex-direction: column;
}
@keyframes sheetUp { from { transform: translateY(100%); } }
.sheet__grab {
  width: 36px; height: 4px;
  margin: var(--sp-2) auto var(--sp-3);
  border-radius: var(--r-full);
  background: var(--border);
  flex: none;
}
.sheet__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.sheet__body { overflow-y: auto; }

.dialog {
  position: absolute; left: var(--sp-5); right: var(--sp-5); top: 50%;
  transform: translateY(-50%);
  z-index: 11;
  background: var(--surface-raised);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-overlay);
  padding: var(--sp-5);
  animation: dialogIn var(--dur-slow) var(--spring) both;
}
@keyframes dialogIn { from { opacity: 0; transform: translateY(-50%) scale(0.94); } }

/* ===============================================================
   Feedback
   =============================================================== */

.toast {
  position: absolute; left: var(--sp-4); right: var(--sp-4);
  bottom: calc(var(--nav-h) + var(--sp-4) + var(--safe-bottom));
  z-index: 12;
  display: flex; align-items: flex-start; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  background: var(--surface-raised);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-overlay);
  animation: toastIn var(--dur-slow) var(--spring) both;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } }
.toast__body { flex: 1; min-width: 0; font-size: var(--type-13); letter-spacing: var(--tr-13); line-height: var(--lh-13); }
.toast__action { color: var(--accent-text); font-weight: var(--w-semibold); font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13); min-height: var(--tap); display: flex; align-items: center; padding: 0 var(--sp-2); margin: calc(var(--sp-3) * -1) calc(var(--sp-2) * -1) calc(var(--sp-3) * -1) 0; }

/* Banner. Inline, for a condition that persists. */
.banner {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-md);
  font-size: var(--type-13); letter-spacing: var(--tr-13);
  line-height: var(--lh-13);
}
.banner--warn { background: var(--warning-quiet); color: var(--warning); }
.banner--error { background: var(--error-quiet); color: var(--error); }
.banner--info { background: var(--info-quiet); color: var(--info); }
.banner--success { background: var(--success-quiet); color: var(--success); }
.banner strong { color: var(--text); font-weight: var(--w-semibold); display: block; margin-bottom: 2px; }

/* Empty state. One sentence that teaches the next action, one action. */
.empty {
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
  padding: var(--sp-6) var(--sp-4);
  gap: var(--sp-3);
}
.empty__ico { color: var(--text-tertiary); margin-bottom: var(--sp-1); }
.empty__title { font-size: var(--type-17); line-height: var(--lh-17); letter-spacing: var(--tr-17); font-weight: var(--w-semibold); }
.empty__body { font-size: var(--type-13); letter-spacing: var(--tr-13); line-height: var(--lh-13); color: var(--text-secondary); max-width: 30ch; }
.empty .btn { margin-top: var(--sp-2); }

/* Skeleton. A loading state you can tell from a loaded one. */
.skel {
  background: var(--surface-raised);
  border-radius: var(--r-sm);
  animation: pulse 1.4s var(--ease) infinite;
}
@keyframes pulse { 50% { opacity: 0.45; } }

/* ===============================================================
   Data display
   =============================================================== */

.stat { display: flex; flex-direction: column; gap: 2px; }
.stat__value { font-size: var(--type-22); line-height: var(--lh-22); font-weight: var(--w-bold); font-variant-numeric: tabular-nums; letter-spacing: var(--tr-22); }
.stat__unit { font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13); font-weight: var(--w-medium); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.stat__label { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); text-transform: uppercase; font-weight: var(--w-semibold); color: var(--text-tertiary); }

.meter { height: var(--sp-2); border-radius: var(--r-full); background: var(--surface-raised); overflow: hidden; }
.meter__fill { height: 100%; border-radius: var(--r-full); background: var(--accent); transition: width var(--dur-slow) var(--ease); }

/* Chart. Axes and labels are not optional. */
.chart { width: 100%; display: block; }
.chart__grid { stroke: var(--hairline); stroke-width: 1; }
.chart__line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chart__dot { fill: var(--accent); }
.chart__axis { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); fill: var(--text-tertiary); font-variant-numeric: tabular-nums; }

/* ===============================================================
   Numeric keypad. Replaces on first digit, does not append.
   =============================================================== */

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); }
.pad__key {
  min-height: 56px;
  border-radius: var(--r-md);
  background: var(--surface);
  font-size: var(--type-22); line-height: var(--lh-22); letter-spacing: var(--tr-22);
  font-weight: var(--w-medium);
  font-variant-numeric: tabular-nums;
}
.pad__key:active { background: var(--surface-raised); }
.pad__key--action { background: none; color: var(--text-secondary); font-size: var(--type-15); line-height: var(--lh-15); letter-spacing: var(--tr-15); }


/* ---------------------------------------------------------------
   Documented grid breaks. Everything else is a multiple of 4.
   Three 2px values exist, each optical rather than structural:
     .row__sub margin-top   optical baseline gap under a row title;
                            4px reads as a separate block, 0 collides
     .seg padding           the track inset that makes the selected
                            item's radius concentric with the container
     .switch__knob offset   the same inset, so the knob sits centred
   These are the only sub-4px values in the system.
   --------------------------------------------------------------- */

/* ===============================================================
   Utilities. Layout only. No new values.
   =============================================================== */

.stack { display: flex; flex-direction: column; }
.stack--1 { gap: var(--sp-1); } .stack--2 { gap: var(--sp-2); }
.stack--3 { gap: var(--sp-3); } .stack--4 { gap: var(--sp-4); }
.stack--5 { gap: var(--sp-5); }
.hstack { display: flex; align-items: center; }
.hstack--2 { gap: var(--sp-2); } .hstack--3 { gap: var(--sp-3); } .hstack--4 { gap: var(--sp-4); }
.grow { flex: 1; min-width: 0; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.mt-2 { margin-top: var(--sp-2); } .mt-3 { margin-top: var(--sp-3); }
.mt-4 { margin-top: var(--sp-4); } .mt-5 { margin-top: var(--sp-5); }
.center { text-align: center; }
.muted { color: var(--text-secondary); }
.quiet { color: var(--text-tertiary); }
.accent { color: var(--accent-text); }
.vis-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===============================================================
   Added for split-builder. Tokens only, no new values.
   =============================================================== */

/* Pinned action bar. The primary action never sits below the fold. */
.actionbar {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--page-x) calc(var(--sp-3) + var(--safe-bottom));
  background: var(--bg);
  box-shadow: inset 0 1px 0 var(--hairline);
}
.actionbar__status { flex: 1; min-width: 0; font-size: var(--type-13); letter-spacing: var(--tr-13); line-height: var(--lh-13); color: var(--text-secondary); }
.actionbar .btn { flex: none; }

/* Unsaved marker. */
.dot {
  width: var(--sp-2); height: var(--sp-2);
  border-radius: var(--r-full);
  background: var(--accent-text);
  flex: none;
}

/* Square control, always a full target. */
.iconbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--tap); height: var(--tap);
  flex: none;
  border-radius: var(--r-md);
  color: var(--text-secondary);
  background: none;
}
.iconbtn:active { background: var(--surface-raised); }
.iconbtn--danger { color: var(--error); }
.iconbtn--danger:active { background: var(--error-quiet); }

/* Reorder handle. Labelled, 44x44, drag or tap. Tap lifts the item and
   reveals the move controls; it is never a hidden long press. */
.grip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--tap); height: var(--tap);
  flex: none;
  border-radius: var(--r-md);
  color: var(--text-secondary);
  background: var(--surface-raised);
  touch-action: none;
}
.grip:active { background: var(--hairline); }
.grip[aria-pressed="true"] { background: var(--accent-quiet); color: var(--accent-text); }

.sortable__item { position: relative; }
.sortable__item--lifted { box-shadow: inset 0 0 0 2px var(--accent-text); border-radius: var(--r-md); }
.sortable__item--dragging { opacity: 0.4; }

/* Honest progress. One line per thing actually happening. */
.gensteps { display: flex; flex-direction: column; gap: var(--sp-3); }
.genstep { display: flex; align-items: center; gap: var(--sp-3); min-height: var(--tap); font-size: var(--type-13); letter-spacing: var(--tr-13); line-height: var(--lh-13); color: var(--text-tertiary); }
.genstep__mark { width: 20px; height: 20px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); }
.genstep[data-state="active"] { color: var(--text); }
.genstep[data-state="active"] .genstep__mark { color: var(--accent-text); }
.genstep[data-state="done"] { color: var(--text-secondary); }
.genstep[data-state="done"] .genstep__mark { color: var(--success); }

/* ===============================================================
   Demo shell. Not app UI: the device frame the demo pages are
   judged in, and the corner state toggle. Tokens only; the two
   pixel values below are the iPhone 15 Pro viewport itself.
   =============================================================== */

.stage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-5);
  background: var(--surface-sunken);
}
.phone {
  width: 393px;
  height: 852px;
  flex: none;
  overflow: hidden;
  border-radius: var(--r-lg);
  background: var(--bg);
  box-shadow: var(--shadow-overlay);
}
/* Fluid fallback: below the frame size the screen fills the window. */
@media (max-width: 441px), (max-height: 899px) {
  .stage { padding: 0; }
  .phone { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
}

.dev {
  position: fixed;
  top: var(--sp-3);
  right: var(--sp-3);
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: var(--sp-2);
}
.dev__toggle {
  display: flex; align-items: center; justify-content: center;
  min-width: var(--tap); min-height: var(--tap);
  padding: 0 var(--sp-3);
  border-radius: var(--r-full);
  background: var(--surface-raised);
  color: var(--text-secondary);
  font-size: var(--type-11);
  line-height: var(--lh-11);
  letter-spacing: var(--tr-11);
  font-weight: var(--w-semibold);
  text-transform: uppercase;
  box-shadow: var(--shadow-raised);
}
.dev__menu[hidden] { display: none; }
.dev__menu {
  display: flex; flex-direction: column; gap: 2px;
  padding: var(--sp-1);
  border-radius: var(--r-md);
  background: var(--surface-raised);
  box-shadow: var(--shadow-overlay);
}
.dev__item {
  display: flex; align-items: center;
  min-height: var(--tap);
  padding: 0 var(--sp-3);
  border-radius: var(--r-sm);
  color: var(--text-secondary);
  font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13);
  text-align: left;
  white-space: nowrap;
}
.dev__item[aria-pressed="true"] { background: var(--hairline); color: var(--text); font-weight: var(--w-semibold); }

/* ===============================================================
   Added for the onboarding flow. Tokens only, no new values.
   =============================================================== */

/* Step indicator. A bar plus a count, because "how many left" is the
   question a setup flow has to answer. The fill is not the accent: the
   accent belongs to the primary action alone. */
.stepbar { display: flex; align-items: center; gap: var(--sp-3); }
.stepbar__track {
  flex: 1;
  height: var(--sp-1);
  border-radius: var(--r-full);
  background: var(--surface-raised);
  overflow: hidden;
}
.stepbar__fill {
  height: 100%;
  border-radius: var(--r-full);
  background: var(--text-secondary);
  transition: width var(--dur-slow) var(--ease);
}
.stepbar__count {
  font-size: var(--type-11);
  line-height: var(--lh-11);
  letter-spacing: var(--tr-11);
  font-weight: var(--w-semibold);
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* Field control. Wraps an input that carries a control inside it,
   such as a password reveal. The reveal is a full 44x44 target. */
.field__control { position: relative; display: block; }
.field__control--adorned .input { padding-right: calc(var(--tap) + var(--sp-2)); }
.field__reveal {
  position: absolute;
  top: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  width: var(--tap); height: var(--tap);
  border-radius: var(--r-sm);
  color: var(--text-secondary);
}
.field__reveal:active { background: var(--surface-raised); }

/* Password strength. Four segments and a sentence. The sentence carries
   the meaning; the segments are a summary of it, never the whole story. */
.strength { display: flex; flex-direction: column; gap: var(--sp-2); }
.strength__scale { display: flex; gap: var(--sp-1); }
.strength__seg {
  flex: 1;
  height: var(--sp-1);
  border-radius: var(--r-full);
  background: var(--surface-raised);
  transition: background-color var(--dur-fast) var(--ease);
}
.strength__seg--weak { background: var(--error); }
.strength__seg--fair { background: var(--warning); }
.strength__seg--good { background: var(--success); }
.strength__text { font-size: var(--type-13); letter-spacing: var(--tr-13); line-height: var(--lh-13); color: var(--text-secondary); }

/* Quiet meter. For a progress bar on a screen whose accent fill is
   already spent on the primary action. Same shape, neutral fill. */
.meter--quiet .meter__fill { background: var(--text-tertiary); }
/* Remove, at rest, in a list of many: quiet until pressed, still not primary. */
.iconbtn--danger-quiet { color: var(--text-secondary); }
.iconbtn--danger-quiet:active { background: var(--error-quiet); color: var(--error); }

/* ===============================================================
   Added for Home. Tokens only, no new values.

   Home leads with a figure the lifter earned, so it needs three
   things the library did not have: a hero figure paired with a
   quiet label, a week rhythm read at a glance, and a sparkline
   quiet enough to sit beside the one accent fill.
   =============================================================== */

/* Hero figure. One per screen, and only for a number that was
   earned. The label under it is small on purpose: the scale
   contrast is the whole effect. */
.hero { display: flex; flex-direction: column; gap: var(--sp-1); }
.hero__figure { display: flex; align-items: baseline; gap: var(--sp-2); }
.hero__value {
  font-size: var(--type-28);
  line-height: var(--lh-28);
  letter-spacing: var(--tr-28);
  font-weight: var(--w-bold);
  font-variant-numeric: tabular-nums;
}
.hero__unit { font-size: var(--type-17); letter-spacing: var(--tr-17); line-height: var(--lh-17); font-weight: var(--w-medium); color: var(--text-secondary); }
.hero__label { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); font-weight: var(--w-semibold); text-transform: uppercase; color: var(--text-tertiary); }

/* Week rhythm. A sunken track: the week is the ground the sessions
   sit in. Seven columns, never scrolls, not interactive, and the
   whole track carries one aria-label because seven letters do not
   read aloud as a week. */
.week {
  display: flex;
  gap: var(--sp-2);
  padding: var(--sp-3);
  border-radius: var(--r-md);
  background: var(--surface-sunken);
}
.week__day { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: var(--sp-2); }
.week__cap {
  font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11);
  font-weight: var(--w-semibold); color: var(--text-tertiary); text-transform: uppercase;
}
.week__day--now .week__cap { color: var(--text); }
.week__mark {
  width: 100%;
  height: var(--sp-6);
  border-radius: var(--r-sm);
  background: var(--text);
  animation: markIn var(--dur-slow) var(--ease-out) both;
}
.week__mark--planned { background: none; box-shadow: inset 0 0 0 1px var(--border); }
.week__mark--today { background: none; box-shadow: inset 0 0 0 2px var(--accent-text); }
.week__mark--rest { height: var(--sp-1); background: var(--hairline); }
.week__mark--today-rest { height: var(--sp-1); background: var(--text-tertiary); }
@keyframes markIn { from { opacity: 0; transform: scaleY(0.3); } }
.week__mark { transform-origin: bottom; }
/* The week fills left to right and stops on today. Steps are one
   third of the fast duration, so the whole run is under 300ms. */
.week__day:nth-child(1) .week__mark { animation-delay: 0ms; }
.week__day:nth-child(2) .week__mark { animation-delay: calc(var(--dur-fast) / 3); }
.week__day:nth-child(3) .week__mark { animation-delay: calc(var(--dur-fast) / 3 * 2); }
.week__day:nth-child(4) .week__mark { animation-delay: var(--dur-fast); }
.week__day:nth-child(5) .week__mark { animation-delay: calc(var(--dur-fast) / 3 * 4); }
.week__day:nth-child(6) .week__mark { animation-delay: calc(var(--dur-fast) / 3 * 5); }
.week__day:nth-child(7) .week__mark { animation-delay: calc(var(--dur-fast) / 3 * 6); }

/* Sunken card. For a state that is meant to feel settled rather
   than urgent: it sits below the page ground, not above it. */
.card--sunken { background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--hairline); }

/* Sparkline. A trend small enough to sit inside a row. Never the
   accent: its endpoints are named in the row text beside it. */
.spark { width: calc(var(--sp-6) * 2); height: var(--sp-5); flex: none; display: block; }
.spark__line { fill: none; stroke: var(--text-tertiary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spark__dot { fill: var(--text); }

/* Entry. Used once, on the block that answers the screen's question.
   A training day rises into place; a rest day settles into it. */
.enter-rise { animation: riseIn var(--dur-slow) var(--ease-out) both; }
.enter-settle { animation: settleIn var(--dur-slow) var(--ease) both; }
@keyframes riseIn { from { opacity: 0; transform: translateY(var(--sp-4)); } }
@keyframes settleIn { from { opacity: 0; transform: translateY(calc(var(--sp-2) * -1)); } }

@media (prefers-reduced-motion: reduce) {
  .enter-rise, .enter-settle, .week__mark { animation: none; }
}

/* ===============================================================
   Added for coach. Tokens only, no new values.
   =============================================================== */

/* View bar. The one control that switches Chat, Plan and Setup.
   The segmented control is the app's only one; --seg-tall raises its
   items to a full 44px target, which the base 40px does not meet. */
.viewbar { padding: 0 var(--page-x) var(--sp-2); background: var(--bg); }
.seg--tall .seg__item { min-height: var(--tap); }

/* Conversation. ONE component, two speakers, two states.
   The old screen made user turns bubbles and replies transparent
   full-bleed prose with no name and no time. Both speakers now carry a
   name, a time and the same bubble; only the ground colour differs. */
.thread { display: flex; flex-direction: column; padding-top: var(--sp-3); }
.thread > * + * { margin-top: var(--sp-4); }

.daymark {
  align-self: center;
  padding: var(--sp-1) var(--sp-3);
  border-radius: var(--r-full);
  background: var(--surface);
  font-size: var(--type-11);
  line-height: var(--lh-11);
  letter-spacing: var(--tr-11);
  font-weight: var(--w-semibold);
  text-transform: uppercase;
  color: var(--text-tertiary);
}

.msg { display: flex; align-items: flex-start; gap: var(--sp-2); }
.msg__avatar {
  display: flex; align-items: center; justify-content: center;
  width: var(--sp-6); height: var(--sp-6); flex: none;
  border-radius: var(--r-full);
  background: var(--surface-raised);
  color: var(--accent-text);
}
.msg__col { display: flex; flex-direction: column; min-width: 0; max-width: 86%; }
.msg__head { display: flex; align-items: baseline; gap: var(--sp-2); margin-bottom: var(--sp-1); padding: 0 var(--sp-1); }
.msg__who { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); font-weight: var(--w-semibold); text-transform: uppercase; color: var(--text-tertiary); }
.msg__time { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); font-weight: var(--w-medium); color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.msg__bubble {
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-lg);
  background: var(--surface);
  font-size: var(--type-15);
  line-height: var(--lh-15);
  letter-spacing: var(--tr-15);
}
.msg__acts { display: flex; align-items: center; gap: var(--sp-1); margin-top: var(--sp-1); }
.msg--user { flex-direction: row-reverse; }
.msg--user .msg__col { align-items: flex-end; }
.msg--user .msg__head { flex-direction: row-reverse; }
.msg--user .msg__bubble { background: var(--accent-quiet); }
.msg--user .msg__avatar { background: var(--surface); color: var(--text-secondary); }
.msg--error .msg__bubble { background: var(--error-quiet); color: var(--error); }
.msg__attach { margin-top: var(--sp-2); }

/* Thinking. Dots plus the one line saying what is being read, so the
   loading state cannot be mistaken for a delivered reply. */
.typing { display: flex; align-items: center; gap: var(--sp-1); height: var(--lh-15); }
.typing__dot { width: var(--sp-2); height: var(--sp-2); border-radius: var(--r-full); background: var(--text-tertiary); animation: blink 1.2s var(--ease) infinite; }
.typing__dot:nth-child(2) { animation-delay: 150ms; }
.typing__dot:nth-child(3) { animation-delay: 300ms; }
@keyframes blink { 50% { opacity: 0.25; } }

/* Composer. Pinned, never floating, nothing painted over it. */
.composer {
  display: flex; align-items: flex-end; gap: var(--sp-2);
  padding: var(--sp-2) var(--page-x);
  background: var(--bg);
  box-shadow: inset 0 1px 0 var(--hairline);
}
.composer__input {
  flex: 1; min-width: 0;
  min-height: var(--tap); max-height: 120px;
  padding: var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  color: var(--text);
  font-size: var(--type-15); letter-spacing: var(--tr-15);
  line-height: var(--lh-15);
  resize: none;
}
.composer__input::placeholder { color: var(--text-tertiary); }
.composer__input:focus { outline: none; border-color: var(--accent-text); box-shadow: 0 0 0 var(--sp-1) var(--accent-quiet); }
.composer__send {
  display: flex; align-items: center; justify-content: center;
  width: var(--tap); height: var(--tap); flex: none;
  border-radius: var(--r-full);
  background: var(--accent);
  color: var(--text-on-accent);
}
.composer__send:active { background: var(--accent-deep); color: var(--text-on-solid); }
/* When a card in the thread is the thing to act on, the accent moves to
   it and the send button steps back. One accent fill, always. */
.screen[data-accent="card"] .composer__send { background: var(--surface-raised); color: var(--accent-text); }

/* Choice and permission row. A check, not a switch: the switch's on-state
   is an accent fill, and the accent belongs to the primary action alone. */
.opt {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  width: 100%; min-height: var(--tap);
  padding: var(--sp-3) var(--sp-4);
  text-align: left;
  background: var(--surface);
  color: var(--text);
}
.opt + .opt { box-shadow: inset 0 1px 0 var(--hairline); }
.opt:active { background: var(--surface-raised); }
.opt__mark {
  display: flex; align-items: center; justify-content: center;
  width: var(--sp-5); height: var(--sp-5); flex: none;
  margin-top: 2px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: transparent;
}
.opt[aria-checked="true"] .opt__mark { background: var(--accent-quiet); border-color: var(--accent-text); color: var(--accent-text); }
.opt__main { flex: 1; min-width: 0; }
.opt__title { display: block; font-size: var(--type-15); letter-spacing: var(--tr-15); line-height: var(--lh-15); font-weight: var(--w-medium); }
.opt__sub { display: block; font-size: var(--type-13); letter-spacing: var(--tr-13); line-height: var(--lh-13); color: var(--text-secondary); margin-top: 2px; }

/* Permissions do not look like preferences. Preferences sit on a filled
   card; a permission group is drawn, bordered, and headed by what it
   grants. Same rows, different weight. */
.card--outline { background: none; border: 1px solid var(--border); }
.card--outline .opt, .card--outline .row { background: none; }
.card__head {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  box-shadow: inset 0 -1px 0 var(--hairline);
}
.card__foot { padding: var(--sp-3) var(--sp-4); box-shadow: inset 0 1px 0 var(--hairline); }

/* ===============================================================
   Added for exercise-library. Tokens only, no new values.
   =============================================================== */

/* Find bar. Sits above the scroll body rather than inside it, so the
   search field is present at every level of the library and cannot
   scroll away. The audited library dropped search at group level. */
.findbar { padding: var(--sp-2) var(--page-x) var(--sp-3); background: var(--bg); }

/* Prominent search. The audited field carried a 1.07:1 border on its own
   fill and disappeared under an 8px blur. This one is raised off the
   ground and bounded by --text-tertiary: 4.71:1 against its fill,
   5.49:1 against the page ground. */
.search--find .input {
  background: var(--surface-raised);
  border-color: var(--text-tertiary);
  padding-left: calc(var(--sp-5) + var(--sp-3));
  padding-right: calc(var(--tap) + var(--sp-1));
  font-size: var(--type-17); letter-spacing: var(--tr-17);
  line-height: var(--lh-17);
}
.search--find .search__ico { left: var(--sp-4); color: var(--text-secondary); }
.search__clear {
  position: absolute;
  top: 0; right: 0;
  width: var(--tap); height: var(--tap);
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-sm);
  color: var(--text-secondary);
}
.search__clear:active { background: var(--hairline); }
.search__clear[hidden] { display: none; }

/* Sticky heading inside a long flat list. */
.listhead {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--page-x) var(--sp-2);
  background: var(--bg);
}

/* Gutter for a flush-bodied screen whose rows run edge to edge. */
.gutter { margin-left: var(--page-x); margin-right: var(--page-x); }

/* Badge. A non-interactive marker on a row or a title. */
.badge {
  display: inline-flex; align-items: center;
  padding: 0 var(--sp-2);
  border-radius: var(--r-full);
  background: var(--surface-raised);
  color: var(--text-secondary);
  font-size: var(--type-11);
  line-height: var(--lh-11);
  letter-spacing: var(--tr-11);
  font-weight: var(--w-semibold);
  text-transform: uppercase;
  white-space: nowrap;
}
.badge--accent { background: var(--accent-quiet); color: var(--accent-text); }

/* Wrapping row of chips. A chip row never scrolls sideways. */
.chiprow { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

/* Fact pairs in a detail sheet. */
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }

/* Muscle map. Drawn, not fetched: the detail sheet's illustration works
   with no network, which is the designed case rather than the failure. */
.bodymap { display: flex; gap: var(--sp-5); align-items: flex-start; }
.bodymap__unit { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); }
.bodymap__fig { height: 112px; width: auto; flex: none; }
.bm-base { fill: var(--surface); stroke: var(--hairline); stroke-width: 1; }
.bm-on { fill: var(--accent-quiet); stroke: var(--accent-text); stroke-width: 1.5; }

/* Demonstration slot. Fixed aspect, so loading, loaded and unavailable
   occupy the same box and are told apart by what is in it. */
.media {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: var(--r-md);
  background: var(--surface);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.media__art { width: 100%; height: 100%; display: block; }
.media__note {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  color: var(--text-secondary);
  font-size: var(--type-13); letter-spacing: var(--tr-13);
  line-height: var(--lh-13);
  text-align: center;
}

/* ===============================================================
   Added for progress. Tokens only, no new values.
   =============================================================== */

/* Segmented control at full target height, and a checked state for
   when the group is a radiogroup rather than a tablist. The 40px
   variant stays for controls that sit inside a padded toolbar. */
.seg--lg .seg__item { min-height: var(--tap); }
.seg__item[aria-checked="true"] { background: var(--surface-raised); color: var(--text); font-weight: var(--w-semibold); }

/* Direction of a measured change. Colour repeats the sign, it does not
   replace it: every delta on screen carries + or − as text. */
.trend-up { color: var(--success); }
.trend-down { color: var(--error); }
.chiprow--center { justify-content: center; }

/* Pinned foot inside a sheet: the primary action never scrolls away. */
.sheet__foot { padding-top: var(--sp-3); flex: none; }
.card__note { padding: var(--sp-3) var(--sp-4); }
.wrap { flex-wrap: wrap; }
.good { color: var(--success); }

/* One line, clipped with an ellipsis. For a row subtitle that lists more
   than fits at 393px. */
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Account entry in a screen header. Profile has no tab: its only unique job
   was being the door to Settings, so that door lives here instead. */
.hdr__account {
  display: flex; align-items: center; justify-content: center;
  width: var(--tap); height: var(--tap);
  margin-right: calc(var(--sp-3) * -1);
  flex: none;
  border-radius: var(--r-full);
  color: var(--text-secondary);
}
.hdr__account:active { background: var(--surface); }
.hdr__initial {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  border-radius: var(--r-full);
  background: var(--surface-raised);
  color: var(--text-secondary);
  font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13);
  font-weight: var(--w-semibold);
  font-variant-numeric: tabular-nums;
}

/* A chart on a screen whose accent is already spent on the primary
   action. Same shape, neutral ink. */
.chart--quiet .chart__line { stroke: var(--text-secondary); }
.chart--quiet .chart__dot { fill: var(--text); }

/* A quiet button standing on a raised sheet needs a ground of its own:
   the sheet is already --surface-raised. */
.sheet .btn--secondary { background: var(--hairline); }
.sheet .btn--secondary:active { background: var(--border); }
/* Header without a second row of padding: the coach header carries the
   view control under it, so the bar itself is a single 44px row. */
.hdr--tight { padding-bottom: 0; }
.hdr--tight .hdr__title { display: flex; align-items: center; min-height: var(--tap); }
/* A row's title and detail are lines, not phrases run together. */
.row__main > .meter { display: block; }

/* ===============================================================
   Added for split-builder edit mode. Tokens only, no new values.
   =============================================================== */

/* Swipe to remove. The iOS way to destroy one row without putting a
   trash can on every row. The red action exists in the DOM only while a
   row is open, so a list at rest carries no destructive control. */
.swipe { position: relative; overflow: hidden; background: var(--error-solid); }
.swipe__pane { position: relative; touch-action: pan-y; transition: transform var(--dur-fast) var(--ease); }
.swipe[data-open="true"] .swipe__pane { transform: translateX(calc((var(--sp-6) * 2 + var(--sp-5)) * -1)); }
.swipe__action {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: calc(var(--sp-6) * 2 + var(--sp-5));
  display: flex; align-items: center; justify-content: center;
  background: var(--error-solid);
  color: var(--text-on-solid);
  font-size: var(--type-13); letter-spacing: var(--tr-13);
  line-height: var(--lh-13);
  font-weight: var(--w-semibold);
}
.swipe__action:active { background: var(--error); color: var(--text-on-accent); }
/* A separator between rows survives the swipe wrapper. */
.swipe + .swipe .row { box-shadow: inset 0 1px 0 var(--hairline); }
@media (prefers-reduced-motion: reduce) {
  .swipe__pane { transition: none; }
}

/* Day heading at rest: the same line the edit field occupies, without
   being a field. */
.daycard__name { flex: 1; min-width: 0; padding: var(--sp-2); }

/* ===============================================================
   Added for train. Tokens only, no new values.
   =============================================================== */

/* Column chart. The line chart's neighbour: same axis, same tabular
   labels, one bar per bucket. Bars are ink, never accent — on Train the
   one accent fill belongs to Start. The current bucket is the bright
   one, and a bucket with nothing in it still draws a stub, so an empty
   week is visibly empty rather than invisible. */
.chart__bar { fill: var(--border); }
.chart__bar--now { fill: var(--text); }
.chart__value {
  font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11);
  fill: var(--text);
  font-weight: var(--w-semibold);
  font-variant-numeric: tabular-nums;
}

/* A trailing value that must not wrap: the date beside a history row. */
.nowrap { white-space: nowrap; }

/* ===============================================================
   Added for review. Tokens only, no new values.
   =============================================================== */

/* Direction of a change. Review is the one screen whose subject IS a
   difference, so it is the one place a semantic colour lands on a
   number: up is success, down is error, unchanged is tertiary ink. A
   sign character is always printed beside the figure, so colour is
   never the only carrier of the meaning (WCAG 1.4.1). */
.delta--up { color: var(--success); }
.delta--down { color: var(--error); }
.delta--flat { color: var(--text-tertiary); }

/* Record marker. Success tone, never accent: on this screen the single
   accent fill belongs to Save and to nothing else. */
.badge--success { background: var(--success-quiet); color: var(--success); }

/* A card whose contents are not measured. Everything else on Review is
   computed from the lifter's own history; a generated line is drawn
   with a dashed boundary and a labelled head so it can never be read
   as one of the figures above it, and so a failure inside it stays
   visibly a failure. */
.card--unverified { background: none; border: 1px dashed var(--border); }

/* ===============================================================
   Added for settings. Tokens only, no new values.
   =============================================================== */

/* Switch. Settings is the first screen in the system to use one, and a
   screen of switches cannot spend the accent on every "on": the accent
   fill marks the one primary action, so twelve accent pills in a list
   would mark nothing. "On" is a state, not an action, so it takes the
   semantic success tone the way an iOS switch does — measured 10.08:1
   against --surface. The off track is --hairline, only 1.29:1 against
   the card it sits on, so it also carries a --border ring (3.06:1) and
   stays a visible control when off (WCAG 1.4.11). */
.switch__track { box-shadow: inset 0 0 0 1px var(--border); }
.switch[aria-checked="true"] .switch__track { background: var(--success); box-shadow: none; }

/* A row whose action destroys something. Never an accent fill, never a
   red ground: the ink carries the warning, the confirmation carries the
   consequence. */
.row--danger .row__title { color: var(--error); }
.row--danger:active { background: var(--error-quiet); }

/* A row that reports rather than acts: storage, account state. Has no
   pressed state because there is nothing to press. */
.row--static:active { background: var(--surface); }

/* A quiet button standing on a dialog, which is --surface-raised like a
   sheet, needs the same darker ground the sheet rule gives it. */
.dialog .btn--secondary { background: var(--hairline); }
.dialog .btn--secondary:active { background: var(--border); }

/* Toast on a screen with no tab bar. The pushed screens sit above no
   nav, so the toast sits on the safe area instead of above 56px of it. */
.toast--nonav { bottom: calc(var(--sp-4) + var(--safe-bottom)); }

/* ===============================================================
   Added for workout-log. Tokens only, no new values.

   The audits measured the app's most-repeated control — mark set
   done — at 32x30 on the right rail, and the numeric keypad, the
   only well-placed surface on the screen, treated as a dismissible
   sheet that opened pre-filled and appended. Here the keypad IS the
   floor of the screen: it never has to be summoned or dismissed, it
   sits entirely inside the thumb arc, and the commit key is the
   largest target on the page.
   =============================================================== */

/* Sticky exercise head. The name of the thing being logged never
   scrolls away; the tools button beside it replaces a 350ms hold on
   a 20x12 handle. */
.exhead {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) 0 var(--sp-2);
  background: var(--bg);
}
.exhead__main { flex: 1; min-width: 0; }

/* Header action that is not the primary action. Finish ends the
   workout: it is a word in the corner, never a fill, and never in
   the thumb arc. */
.hdr__action--quiet { color: var(--text-secondary); font-weight: var(--w-medium); }

/* Set status mark. Non-interactive: the whole row is the target. */
.setmark {
  display: flex; align-items: center; justify-content: center;
  width: var(--sp-5); height: var(--sp-5); flex: none;
  border-radius: var(--r-full);
  box-shadow: inset 0 0 0 1px var(--border);
  color: transparent;
}
.setmark--done { background: var(--success-quiet); box-shadow: none; color: var(--success); }
.setmark--now { box-shadow: inset 0 0 0 2px var(--accent-text); color: var(--accent-text); }

/* A logged value, and a value that is only last session's. The ghost
   tone is the answer to the audited hesitation at pad open: a number
   the lifter has not typed never looks like one they have. */
.setrow__val { font-size: var(--type-15); line-height: var(--lh-15); letter-spacing: var(--tr-15); font-weight: var(--w-semibold); font-variant-numeric: tabular-nums; white-space: nowrap; }
.setrow__val--ghost { color: var(--text-tertiary); font-weight: var(--w-medium); }
.setrow__rir { flex: none; width: calc(var(--sp-6) + var(--sp-4)); text-align: right; }

/* ---------------------------------------------------------------
   The logging deck. A landmark of its own: it is the working surface
   of the screen, not a footer under the list.
   --------------------------------------------------------------- */
.deckwrap { flex: none; }

/* ---------------------------------------------------------------
   The logging deck. Pinned to the bottom of the screen: everything
   performed every 90 seconds lives here, nothing else does.
   --------------------------------------------------------------- */
.deck {
  flex: none;
  padding: var(--sp-3) var(--page-x) calc(var(--sp-3) + var(--safe-bottom));
  background: var(--surface);
  box-shadow: inset 0 1px 0 var(--hairline);
}
.deck__ctx {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--sp-3); margin-bottom: var(--sp-2);
}

/* Rest strip. Directly above the pad, so the timer is read without
   hunting and extended without moving the hand. */
.rest { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.rest__main { flex: 1; min-width: 0; }
.rest__time {
  font-size: var(--type-22); line-height: var(--lh-22); letter-spacing: var(--tr-22);
  font-weight: var(--w-bold); font-variant-numeric: tabular-nums;
}
.rest__label { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); font-weight: var(--w-semibold); text-transform: uppercase; color: var(--text-tertiary); }
.rest__done .rest__time { color: var(--success); }

/* Value targets: weight, reps, RIR. One mechanism for all three —
   tap the target, type into the pad. The audited fields were 109x33
   and were the most-tapped controls on the screen. */
.tgts { display: flex; gap: var(--sp-2); }
.tgt {

<!--
  HOME — what survives, and why.

  The audits measured a 1,688px screen whose only real action started at
  y659 of a 781px fold, behind 534px of read-only material. This screen
  answers one question — train today, or not, and if so, what — and puts
  the answer, the reason to act on it, and the action in the first fold.

  FOUR BLOCKS (was 10):
  1. Momentum band. The hero figure the old screen never had: weeks on
     plan (5, measured from lk_history: weeks of Aug 3, 10, 17, 24 and 31
     each carry three lifting sessions; the week of Jul 27 carries two,
     which is where the count starts). Beside it, the week rhythm — a
     sunken track showing the seven days as trained, today, planned or
     rest. Streak plus this week, one line, no chrome. Not interactive,
     so nothing here is a target under 44px.
  2. Answer card. Session name, its shape, the accent-filled primary.
     Raised on a training day, sunken on a rest day: the two states are
     given different tone, not different colour.
  3. Last session row. One tap back into the thing most likely to be
     unfinished, and the only place a relative date belongs.
  4. Climbing lift row. The third timescale: the squat's top set across
     five weeks, drawn as a sparkline whose endpoints are named in text.

  CUT: greeting block, 2x2 stat grid (179px, 0 controls), quick actions,
  feed cards (source of the "999 days" sentinel), VIEW PROGRESS (a button
  standing in for a tab), Weekly Recap, calendar (338px, no tappable
  cells), cycle row, ThrowbackCard, the voice FAB (second accent fill,
  and it intercepted pointer events over the last block).

  MOTION: one entry animation per state, on the block that answers the
  question. Training rises into place; rest settles down into it. The
  week track fills left to right and stops on today. Both are switched
  off under prefers-reduced-motion.

  ACCENT: exactly one accent fill per state, on the primary action.
  Today's mark in the week track carries a 2px --accent-text ring, not
  a fill, and only on a training day.

  NUMBERS: every figure is tabular and carries its unit. Dates are
  relative inside the week, absolute after it, never a sentinel.
-->

<template id="demo-tpl-train">
<!--
  TRAIN — what this screen is, and why it is shaped this way.

  WHY IT EXISTS. The HIG audit's finding 2: "the split builder has no
  entrance once you have a split. Train lands directly on Exercises with
  no sub-navigation, and populated Home offers only 'Choose another
  session'. For a user who already has a split, editing their own
  program is unreachable at any depth." Train is now the home of
  everything training-related that is not the active session: the splits
  you own, the record of what you did, cardio, and the catalogue.

  STRUCTURE: ONE SCROLLING SCREEN, ONE PUSHED DESTINATION, TWO SHEETS.

  Sections on one screen, not tabs. The audited hub had a three-item
  underline sub-tab row (My Splits / History / Library) that was broken
  as a set — "Library" replaced the whole hub while the other two swapped
  content — and the design audit counted it as the app's sixth tab
  idiom. The four things this screen holds are not peers you switch
  between; they are one continuous answer to "what do I do about
  training". Splits, cardio and history are read in that order, top to
  bottom, and stacking them costs a scroll rather than a tap. The
  segmented control is spent once, on the one place a filter genuinely
  reduces work: the full history list. That is the app's single
  segmented control, and this screen introduces no second tab pattern.

  Two things push away, both because they are deeper than daily:
    - All history (22 sessions, filterable) is its own destination,
      reached from a five-row preview. Same row component in both, so
      this is a preview and its expansion, not the two competing
      history lists the Cardio audit found.
    - Editing a split lives inside a sheet on the split, one level below
      starting a day. Monthly action, one level deeper; still findable
      because the split row is the obvious thing to touch.

  TAPS. Start today's session: 1 (Start Push, first fold). Start any
  other day: 2 (split row, then the day). Edit a split: 2 (split row,
  then Edit split). The audited hub was 3 taps cold to a programmed
  workout, and editing a split had no entrance at all.

  WHAT CAME FROM CARDIO. Both audits concluded Cardio merges here: its
  history list filtered the same lk_history Train already rendered, so
  one of the two was pure duplication.
    - The history row design. The Cardio audit judged its row the
      better of the two: icon, title, one muted metric line, a
      right-aligned date. Train's printed the duration twice and wrapped
      the metrics in an accent-outlined pill that competed with the
      lifting volume figure. This screen has one row component, used for
      both kinds of session; the duration is printed once and no metric
      carries a pill.
    - MINUTES PER WEEK, kept as built: eight bars, tabular labels, a
      dated axis, one bar standing out. Its ink is --text rather than
      the accent, because the accent on this screen is on Start.
    - Instead of the 41-tile wall: ranking. The audit called the wall a
      selection problem — 41 equal tiles ordered by category, ~2,700px
      tall, favourites the real fix but taught only in the empty state.
      Here the three activities this lifter actually does are rows at
      the top, already carrying their usual duration, one tap to log.
      Everything else is behind one row that opens a search-first
      picker. Rank the list, do not enlarge the grid.
    - Dropped from Cardio: the separate screen and its back button, the
      duplicate history list and filter chips, the "which treadmill?"
      step its own copy called cosmetic, the tile gradients and glow.

  ALSO CUT. Quick Start (an accent fill that started an empty workout
  while the programmed session sat below the fold), the RECENT strip
  (clipped past the third chip, every chip reachable from history), the
  day sheet that re-listed days already on screen, and Delete split from
  the footer row — it had no confirm and sat a thumb-width from Start.
  Deleting a split belongs in the editor that owns it.

  ACCENT: exactly one fill per state, on the action a lifter came to
  take. Populated: Start Push. Empty: Build a split. Error: Try again.
  Loading and the history destination carry none.

  DATA: inlined from tests/fixtures/seed-data.json — lk_splits (3),
  lk_history (18 lifting + 4 cardio, 2026-07-30 to 2026-09-06),
  lk_cardioFavorites. Units kg from lk_profile.useKg. Today is
  Wed 9 Sep 2026, matching home.html.
-->

<template id="demo-tpl-progress">
<!--
  PROGRESS — what survives, and why.

  The audits measured a screen that promised a trend and showed none: a
  448px tab strip inside a 353px box (PR Vault clipped to zero visible
  pixels, no scroll affordance), five unrelated surfaces on one strip,
  and the app's only per-lift chart two levels deep behind the invisible
  tab. That chart had no axes, rescaled so the lowest point always sat on
  the floor, spaced points by index while labelling them with dates,
  letterboxed into 120 of 319px, and two of its three ranges returned
  identical data. The worst contrast in the app was here: 2.2:1 on a chip
  label dimmed by a row-level opacity:.5.

  THIS SCREEN ANSWERS ONE QUESTION: am I getting stronger.

  KEPT / REBUILT (4 blocks, was 5 tabs):
  1. Range. Two options, both of which change the data. 4 weeks returns
     4 points per lift, 12 weeks returns 6 and a wider date window.
  2. Answer card. The question in one sentence, with the count, the
     sessions behind it, and the biggest single gain.
  3. Trend chart, on the screen, no tabs, no drill-down. Labelled y axis
     on round numbers (never the data min), gridlines, x positions
     proportional to real dates with three dated ticks, full card width.
  4. Records. The PR Vault's payload as a first-class section, not a
     clipped tab. Every row sets the chart above: one tap to any lift.

  CUT
  - The tab strip itself. Five destinations do not fit one row at 44px.
  - Photos (906 lines, its own header and tab bar, wearing Progress's
    chrome; it does not serve the lift-trend job).
  - Calendar (338px, day cells were non-interactive divs with a hover
    tooltip — dead on touch; the month belongs with history in Train).
  - Day-1-vs-PR cards. Two static numbers cannot show a trend.
  - Strength Profile bar chart (restated the estimate at a second
    rounding), the "1RM —" chip (empty on 9 of 9 rows), ThrowbackCard
    (25% random, unreproducible), the dashed accent outline that made
    the primary read as a placeholder.
  - The third range option: on this history 90D and ALL are the same
    data. A control that does nothing is worse than one fewer control.
  - Goals as a surface: reduced to one row that leaves for its own
    screen. Body weight likewise: one row, one number, one delta.

  ACCENT: exactly one per state. In the populated state it is the trend
  line and its dots — the data is the point of this screen, so no button
  is accent-filled. Empty and error states have no chart, so the accent
  moves to their single primary action.

  COACH — three views behind one control: Chat, Plan, Setup.

  WHAT THE AUDITS FORCED:
