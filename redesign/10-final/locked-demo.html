<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOCKED demo</title>
<!--
  Generated by 10-final/assemble.mjs. Do not hand-edit: run the assembler.

  Screens in this build: home, train, fuel-placeholder, progress, coach, split-builder, exercise-library, onboarding, settings, workout-log, review.

  Every screen is a separate shadow root, so ids, aria references and CSS
  cannot cross between screens. Every screen's script runs in its own closure
  with a document proxy bound to that root. tokens.css and components.css are
  inlined once and adopted by each root. No iframes, no network.

  app.js (LKPatch) is inlined once, before anything else runs, and every
  screen's render goes through it instead of assigning innerHTML.
-->
<style id="demo-global-css">
/* LOCKED design tokens
   Every value the demo is allowed to use. Nothing outside this file.
   Dark is the built theme. Light is defined with verified contrast pairs.
   Contrast measured, not estimated: see the pair table at the end. */

:root {
  color-scheme: dark;

  /* ---- Type scale. Apple's eleven roles, no others.

     Named by role, not by size. A token called --type-17 cannot tell an author
     whether they want Body or Headline, and those are the same size with
     different weights doing different jobs. Naming the role makes the choice
     the author is actually making visible in the code.

     Sizes, leading and tracking are Apple's, at the Large content size. The
     leading is exact; the tracking is converted from Apple's 1/1000em table,
     which browsers do not apply automatically the way iOS does.

     SF splits its optical size at 20pt: below that it draws Text, at and above
     it draws Display. The system stack gets that for free on Apple hardware.
     Elsewhere the tracking below is what carries the difference.
     ---- */
  --type-large-title: 34px;  --lh-large-title: 41px;  --tr-large-title: -0.4px;
  --type-title-1:     28px;  --lh-title-1:     34px;  --tr-title-1:     -0.8px;
  --type-title-2:     22px;  --lh-title-2:     28px;  --tr-title-2:     -0.5px;
  --type-title-3:     20px;  --lh-title-3:     25px;  --tr-title-3:     -0.45px;
  --type-headline:    17px;  --lh-headline:    22px;  --tr-headline:    -0.43px;
  --type-body:        17px;  --lh-body:        22px;  --tr-body:        -0.43px;
  --type-callout:     16px;  --lh-callout:     21px;  --tr-callout:     -0.31px;
  --type-subheadline: 15px;  --lh-subheadline: 20px;  --tr-subheadline: -0.23px;
  --type-footnote:    13px;  --lh-footnote:    18px;  --tr-footnote:    -0.08px;
  --type-caption-1:   12px;  --lh-caption-1:   16px;  --tr-caption-1:   0px;
  --type-caption-2:   11px;  --lh-caption-2:   13px;  --tr-caption-2:   0.07px;

  /* The size-named tokens the build already speaks, pointed at their roles.
     Kept so no screen has to change in the same commit that adds the scale,
     and so the two can never drift: there is one value, under two names. */
  --type-11: var(--type-caption-2);   --lh-11: var(--lh-caption-2);   --tr-11: var(--tr-caption-2);
  --type-13: var(--type-footnote);    --lh-13: var(--lh-footnote);    --tr-13: var(--tr-footnote);
  --type-15: var(--type-subheadline); --lh-15: var(--lh-subheadline); --tr-15: var(--tr-subheadline);
  --type-17: var(--type-body);        --lh-17: var(--lh-body);        --tr-17: var(--tr-body);
  --type-22: var(--type-title-2);     --lh-22: var(--lh-title-2);     --tr-22: var(--tr-title-2);
  --type-28: var(--type-title-1);     --lh-28: var(--lh-title-1);     --tr-28: var(--tr-title-1);

  /* ---- Weights. 700 is for numbers and titles only. ---- */
  --w-regular: 400;
  --w-medium: 500;
  --w-semibold: 600;
  --w-bold: 700;

  /* ---- Spacing. Six steps. ---- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;

  /* ---- Radius. Four values. ---- */
  --r-sm: 8px;    /* inputs, chips, small controls */
  --r-md: 12px;   /* buttons, rows */
  --r-lg: 16px;   /* cards, sheets */
  --r-xl: 22px;   /* sheets and modals, per the sheet convention */
  --r-full: 999px;/* pills, avatars, toggles */

  /* Corner smoothing. A plain border-radius draws a circular arc that meets
     the straight edge at a visible kink, and above about 16px the eye catches
     it even when it cannot name it. Apple's corners are a superellipse: cubic
     Beziers spliced into a central arc, with a smoothing factor deciding how
     much of the straight edge turns into the curve. 0.6 is the iOS value and
     Figma's iOS preset.

     `corner-shape` ships in Chromium only, so it is applied as a progressive
     enhancement over the radius every browser already draws. Nothing depends
     on it: without it the corners are circular, which is what they are today.
     The exponent below is the superellipse power that corresponds to 60%
     smoothing. */
  --corner-smooth: superellipse(1.8);

  /* ---- Surfaces. Elevation by tone, shadow secondary. ---- */
  --bg: #0A0A0B;          /* app ground, L* 3.4 */
  --surface: #141416;      /* card, L* 7.4 */
  --surface-raised: #1C1C1F;/* sheet, popover, L* 10.6 */
  --surface-sunken: #050506;/* inset wells, keypad ground */
  --hairline: #2A2A2E;     /* separators, 1px */
  /* Control borders. The shipped value was #35353A, which the pair table
     recorded as 3.06:1 against --surface; measured, it is 1.51 -- and
     1.39 against a sheet. Every control whose only boundary is that
     border (the text input, the composer, the switch's off track, the
     checkbox mark, the set mark, the value targets) therefore failed
     WCAG 1.4.11 in the primary theme, while the light theme passed it.
     #6A6A74 clears 3:1 on all four grounds: 3.81 sunken, 3.70 bg,
     3.44 surface, 3.18 raised, and still carries --text at 4.91 for the
     one control that uses it as a pressed fill. */
  --border: #6A6A74;

  /* ---- Fills. The three tokens that make the system theme-reversible.
     In dark, "a fill that stands out on a card" and "a surface that sits
     above the page" are the same colour, so the build used
     --surface-raised for both. In light they are opposites: an overlay
     rises to white, while a chip, a meter track or a pressed row must
     go DARKER than the card it sits on. --surface-raised keeps the
     elevation job; these three take the fill job.
       --fill        quiet fill on top of any surface level: chips,
                     badges, icon wells, meter and progress tracks,
                     skeletons, avatars, keypad keys, secondary buttons
       --fill-press  the ground a row or key takes while pressed
       --track       the inset ground of the segmented control, so the
                     selected item (--surface-raised) reads on it
     Their dark values are exactly what those components already used,
     so dark is byte-identical to before. ---- */
  --fill: #1C1C1F;
  --fill-press: #1C1C1F;
  --track: #141416;

  /* ---- Text ---- */
  --text: #F5F5F7;
  --text-secondary: #A1A1A8;
  --text-tertiary: #86868F;   /* 5.10:1 on surface, passes AA small */
  --text-on-accent: #0A0A0B;  /* orange is a light colour: dark text on it */
  --text-on-solid: #FFFFFF;   /* for deep/semantic fills only */

  /* ---- Accent. One. ---- */
  --accent: #F97316;        /* fills. Pair with --text-on-accent */
  --accent-text: #FF8A3D;   /* accent as text or icon on dark, 7.85:1 */
  --accent-deep: #C2410C;   /* pressed fill, and white-text fills */
  --accent-quiet: #2A1B12;  /* tinted ground for selected rows */

  /* ---- Semantic ---- */
  --success: #3FD98B;
  --success-quiet: #10281C;
  --error: #FF6B6B;
  --error-solid: #D92D2D;   /* fills needing white text */
  --error-quiet: #2A1416;
  --warning: #FFB224;
  --warning-quiet: #2A2010;
  --info: #5AA9FF;
  --info-quiet: #101E2E;

  /* ---- Liquid Glass.

     Glass needs three things at once: something vivid behind it, enough blur,
     and a visible hairline edge. Miss any one and it reads as a grey box,
     which is how most recreations end up.

     It belongs to the chrome layer only — tab bar, nav bar, search field,
     sheets, menus. Content cards stay opaque. A data-dense fitness app drowns
     if every card is translucent, and the point of glass is that the chrome
     floats above content, which requires the content to be solid.

     Two variants, as Apple has them. Regular adapts and is legible over
     anything; Clear is permanently transparent and needs its own dimming, so
     it is only for small surfaces over rich media.
     ---- */
  --glass-blur: 20px;
  --glass-saturate: 180%;
  --glass-tint: color-mix(in srgb, var(--bg) 82%, transparent);
  --glass-tint-clear: color-mix(in srgb, var(--bg) 55%, transparent);
  /* iOS 27 darkened the outer stroke and brightened the inner top highlight.
     Both are qualitative in the spec; these are the values that read right
     against this build's own grounds. */
  --glass-edge: color-mix(in srgb, var(--text) 14%, transparent);
  --glass-specular: color-mix(in srgb, var(--text) 22%, transparent);
  --glass-shadow: 0 8px 32px rgb(0 0 0 / 0.35);

  /* ---- Motion.

     Since iOS 17 every meaningful Apple animation is a spring, so the two
     easings below are kept only for the things that are not motion: a colour
     crossfade, an opacity change. Everything that moves uses a spring.

     Three presets, no more. Bounce never exceeds 0.4; past that it stops
     reading as physics and starts reading as a toy.
     ---- */
/* Generated by tests/gen-springs.mjs. Do not hand-edit.
   Each curve is a real spring solved from duration and bounce, sampled to
   a linear() so it runs on the compositor. Regenerate rather than tune. */
  /* smooth: 0.5s, bounce 0 — layout shifts and opacity, where overshoot reads as sloppy
     stiffness 157.9, damping 25.1, zeta 1.000 */
  --spring-smooth: linear(0, 0.0151, 0.0536, 0.1071, 0.1695, 0.2363, 0.3042, 0.3709, 0.4349, 0.4952, 0.5513, 0.6028, 0.6497, 0.6921, 0.7301, 0.7641, 0.7943, 0.821, 0.8446, 0.8653, 0.8834, 0.8993, 0.9131, 0.9251, 0.9356, 0.9446, 0.9525, 0.9592, 0.9651, 0.9701, 0.9744, 0.9781, 0.9813, 0.9841, 1);
  /* snappy: 0.5s, bounce 0.15 — the default: taps, toggles, sheet snaps, tab switches
     stiffness 157.9, damping 21.4, zeta 0.850 */
  --spring-snappy: linear(0, 0.0154, 0.0554, 0.1122, 0.1797, 0.2529, 0.3282, 0.4029, 0.4748, 0.5428, 0.6057, 0.6632, 0.7151, 0.7613, 0.802, 0.8375, 0.8682, 0.8945, 0.9168, 0.9355, 0.951, 0.9638, 0.9742, 0.9825, 0.9892, 0.9943, 0.9982, 1.0011, 1.0032, 1.0047, 1.0056, 1.0061, 1.0063, 1.0062, 1);
  /* bouncy: 0.5s, bounce 0.3 — the wobble: card expansion, glass press, celebrations
     stiffness 157.9, damping 17.6, zeta 0.700 */
  --spring-bouncy: linear(0, 0.0156, 0.0573, 0.1177, 0.1908, 0.2715, 0.3557, 0.44, 0.522, 0.5995, 0.6714, 0.7368, 0.7952, 0.8464, 0.8905, 0.9279, 0.9589, 0.9841, 1.004, 1.0193, 1.0305, 1.0382, 1.043, 1.0454, 1.046, 1.045, 1.0429, 1.04, 1.0365, 1.0328, 1.0289, 1.025, 1.0213, 1.0177, 1);

  /* Anything tracking a finger. Response 0.15, damping 0.86 — the response is
     short because a drag that lags the thumb is the most obvious tell there
     is. This one is solved in JS, not sampled, because a curve cannot pick up
     the velocity a gesture ended with. See LKSpring in app.js. */
  --spring-interactive-response: 0.15;
  --spring-interactive-damping: 0.86;

  /* ---- Durations and easings for things that are not motion. ---- */
  --dur-fast: 150ms;   /* state change on a control */
  --dur-slow: 300ms;   /* something entering or leaving */
  --ease: cubic-bezier(0.2, 0, 0.2, 1);          /* standard */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);      /* decelerate, for exits */
  --spring: cubic-bezier(0.32, 0.72, 0, 1);       /* sheets only */

  /* ---- Shadows. Two. Achromatic. ---- */
  --shadow-raised: 0 1px 2px rgba(0, 0, 0, 0.5);
  --shadow-overlay: 0 12px 32px rgba(0, 0, 0, 0.6);
  --scrim: rgba(0, 0, 0, 0.5);
  --knob: #FFFFFF;         /* switch knob, white in both themes */

  /* ---------------------------------------------------------------
     ANATOMY DATA PALETTE
     Twelve hues, one per muscle group in the exercise database, that
     encode muscle identity on the body map in the same way a chart
     palette encodes series. They are DATA, never chrome: no button,
     bar, icon, border or text outside an anatomical shape may use
     them, and the body never carries --accent, so a muscle can never
     be mistaken for an action.

     Twelve is more than a categorical palette normally holds, so the
     wheel is spent by what touches what, not evenly: the three arm
     groups sit together in the teal-to-azure band so a limb reads as
     one family, but the quadriceps and the adductors, which share a
     thigh, are pushed further apart than any other leg pair. Chest,
     Back, Shoulders, Abs and Calves take clearly separate hues.

     Hues, in degrees: 28, 276, 306, 338, 72, 196, 220, 250, 105, 132,
     178, 158. Abs is a hot orange at 72 and is the nearest thing on the
     body to --accent, which is hue 55: they are 14.6 apart by CIEDE2000,
     which is plainly a different colour, and the accent only ever appears
     as a filled button while the body is a diagram. The closest two hues to each other are
     the adductors and the forearms at 8.6, which never appear beside one
     another: one is on a thigh, the other on an arm.

     Chroma and lightness are both held: at the top of the sRGB gamut these
     hues go fluorescent, and twelve fluorescent colours on one body read as
     a toy rather than as anatomy. Every colour is the most chromatic one
     available at its hue inside a narrow lightness band, which is what makes
     the set read as one depth: crimson, electric blue, violet, magenta, hot
     orange, and the arm and leg families.

     Measured, WCAG 2.1, against --bg / --surface / --surface-raised. The
     last column is the seam between two muscles -- 22% of the hue toward
     black -- measured against its own hue, so the separation between two
     touching bellies clears 3:1 and is visible rather than decorative.

     Dark
       group      hex      hue     bg   surf raised   seam vs hue
       chest     #FF3146    28   5.45   4.88   4.52       4.73
       back      #0C95FF   276   6.37   5.70   5.29       5.29
       shoulders #946AFF   306   5.43   4.86   4.51       4.63
       calves    #FF3DD1   338   6.45   5.77   5.35       5.41
       abs       #EF9805    72   8.64   7.73   7.17       6.69
       forearms  #0ABEBE   196   8.60   7.70   7.13       6.67
       biceps    #12BBD6   220   8.58   7.68   7.12       6.68
       triceps   #18B7F7   250   8.63   7.72   7.16       6.72
       hams      #ACB201   105   8.60   7.70   7.14       6.65
       quads     #4DC314   132   8.61   7.70   7.14       6.66
       adduc     #0AC0A7   178   8.59   7.69   7.13       6.70
       glutes    #0CC37F   158   8.60   7.70   7.14       6.68

     Light. White leaves no room above a hue, so the same twelve hues are
     taken down rather than up. Every one still clears 3:1 on the ground.
       group      hex      hue     bg   surf raised   seam vs hue
       chest     #F9043B    28   3.58   3.78   3.94       4.36
       back      #0186E8   276   3.28   3.46   3.61       4.56
       shoulders #6945DE   306   5.22   5.50   5.74       3.05
       calves    #E101B5   338   3.76   3.96   4.13       4.18
       abs       #B97400    72   3.29   3.47   3.62       4.48
       forearms  #019191   196   3.35   3.53   3.69       4.45
       biceps    #0292A8   220   3.22   3.40   3.54       4.61
       triceps   #048EC2   250   3.24   3.41   3.56       4.59
       hams      #878C01   105   3.16   3.34   3.48       4.62
       quads     #369A01   132   3.17   3.34   3.48       4.64
       adduc     #01937F   178   3.34   3.52   3.67       4.48
       glutes    #039862   158   3.23   3.40   3.55       4.61
     --------------------------------------------------------------- */
  --anat-chest: #FF3146;     /* crimson */
  --anat-back: #0C95FF;      /* electric blue */
  --anat-shoulders: #946AFF; /* violet */
  --anat-calves: #FF3DD1;    /* magenta */
  --anat-abs: #EF9805;       /* hot orange */
  --anat-forearms: #0ABEBE;  /* teal      \ */
  --anat-biceps: #12BBD6;    /* cyan       > the arm family */
  --anat-triceps: #18B7F7;   /* azure     / */
  --anat-hams: #ACB201;      /* olive       \ */
  --anat-quads: #4DC314;     /* green        \  the leg family */
  --anat-adduc: #0AC0A7;     /* turquoise    >  quads and adductors share a thigh, */
  --anat-glutes: #0CC37F;    /* spring      /   so they sit furthest apart */


  /* Body ground and the deselected state. --anat-muted is 3.18:1 on
     --bg, so an unselected but still interactive region keeps a 3:1
     boundary (WCAG 1.4.11); --anat-silhouette is the inert body
     behind the muscles and --anat-shorts the garment, both carrying
     no meaning and no hue. The silhouette is 2.11:1 on --bg: enough
     for the body's outline to read as a figure, not enough to compete
     with the muscles drawn on it. */
  --anat-muted: #606069;
  --anat-silhouette: #34343B;
  --anat-shorts: #22222A;

  /* ---- Layout ---- */
  --nav-h: 56px;
  --tap: 44px;             /* nothing interactive is smaller */
  --page-x: var(--sp-4);   /* page gutter */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ---------------------------------------------------------------
   LIGHT THEME
   Two selectors, one palette. The block is emitted twice from a single
   source and the audit script asserts the two copies are identical, so
   they cannot drift: CSS has no way to give one declaration block both
   an attribute selector and a media query.
     [data-theme="light"]  an explicit choice, stored in lk_theme
     prefers-color-scheme  "Match device", which is the absence of an
                           explicit choice. theme.js clears the attribute
                           for it; this rule is what makes it mean
                           something.
   --------------------------------------------------------------- */
:root[data-theme="light"] {
  color-scheme: light;

  /* Elevation. The dark ramp is 1.39 -> 2.76 -> 6.39 -> 10.38 L*: each
     step up is roughly 4 L* lighter. Light mirrors it away from white:
     88.05 -> 92.53 -> 96.61 -> 100.00, steps of 4.48, 4.08 and 3.39.
     The shipped light ramp put surface at 98.32 and raised at 100.00 —
     1.68 L* apart, half the dark step — so a sheet, a selected segment
     and a secondary button all vanished into the card behind them. */
  --bg: #E9E9F0;
  --surface: #F5F5F8;
  --surface-raised: #FFFFFF;
  --surface-sunken: #DCDCE7;
  --hairline: #C9C9D2;
  --border: #767681;       /* 3.30 sunken, 3.71 bg, 4.12 surface, 4.49 raised */

  /* Fills run the other way from elevation here: down, not up. */
  --fill: #D8D8E5;         /* 5.84 L* below bg, 9.93 below surface;
                              dark's fill sits 7.62 above bg, 4.00 above surface */
  --fill-press: #CFCFDD;
  --track: #D8D8E5;

  --text: #0A0A0B;
  --text-secondary: #55555E;
  --text-tertiary: #5E5E68;  /* 4.71 on sunken, the darkest ground it lands on */
  --text-on-accent: #FFFFFF;
  --text-on-solid: #FFFFFF;

  /* The accent as ink is a step deeper than the shipped #B03A0A so it
     still clears 4.5 on its own tinted ground. */
  --accent: #C2410C;
  --accent-text: #9E3408;
  --accent-deep: #9A3412;
  --accent-quiet: #FAD1B9;

  /* The quiet tints sit at L* 85.5-86.5, six L* below the page ground -- the same tone step dark's quiet tints take above their ground (6.6 to 11.1), so
     a banner, a selected row or a chat bubble is a surface rather than a
     rumour. The shipped tints sat at 94-96, level with the ground: an
     accent-quiet chat bubble measured 1.00:1 against the page behind it.
     Measured, ink on its own tint: accent 5.05, success 4.61, error 4.73,
     warning 4.95, info 5.54. The
     semantic inks deepen to match, so each still clears 4.5 on its tint. */
  --success: #0F6B41;
  --success-quiet: #AFE4C7;
  --error: #B31F1F;
  --error-solid: #C42525;
  --error-quiet: #F8CFCF;
  --warning: #7A4F00;
  --warning-quiet: #F7D28F;
  --info: #17538F;
  --info-quiet: #C5DBF3;

  --shadow-raised: 0 1px 2px rgba(0, 0, 0, 0.14);
  --shadow-overlay: 0 12px 32px rgba(0, 0, 0, 0.20);
  --scrim: rgba(0, 0, 0, 0.35);

  /* Anatomy palette, light. The twelve hues are the same twelve hues at
     the same angles; only their depth changes, because a colour picked to
     read on near-black washes out on white. Each is darkened until it
     clears 3.6:1 on --surface-raised (3.3 on --surface, 2.97 on --bg with
     the seam carrying the boundary), and the seam is still 45% of the hue
     mixed into black, which clears 3.03:1 against every hue it separates. */
  --anat-chest: #F9043B;     /* crimson */
  --anat-back: #0186E8;      /* electric blue */
  --anat-shoulders: #6945DE; /* violet */
  --anat-calves: #E101B5;    /* magenta */
  --anat-abs: #B97400;       /* hot orange */
  --anat-forearms: #019191;  /* teal      \ */
  --anat-biceps: #0292A8;    /* cyan       > the arm family */
  --anat-triceps: #048EC2;   /* azure     / */
  --anat-hams: #878C01;      /* olive       \ */
  --anat-quads: #369A01;     /* green        \  the leg family */
  --anat-adduc: #01937F;     /* turquoise    >  quads and adductors share a thigh, */
  --anat-glutes: #039862;    /* spring      /   so they sit furthest apart */
  --anat-muted: #83838E;       /* 3.10 on bg: an unselected region keeps its 3:1 */
  --anat-silhouette: #A8A8B2;  /* 2.17 on surface: a figure, not a competitor */
  --anat-shorts: #C6C6CF;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;

    /* Elevation. The dark ramp is 1.39 -> 2.76 -> 6.39 -> 10.38 L*: each
       step up is roughly 4 L* lighter. Light mirrors it away from white:
       88.05 -> 92.53 -> 96.61 -> 100.00, steps of 4.48, 4.08 and 3.39.
       The shipped light ramp put surface at 98.32 and raised at 100.00 —
       1.68 L* apart, half the dark step — so a sheet, a selected segment
       and a secondary button all vanished into the card behind them. */
    --bg: #E9E9F0;
    --surface: #F5F5F8;
    --surface-raised: #FFFFFF;
    --surface-sunken: #DCDCE7;
    --hairline: #C9C9D2;
    --border: #767681;       /* 3.30 sunken, 3.71 bg, 4.12 surface, 4.49 raised */

    /* Fills run the other way from elevation here: down, not up. */
    --fill: #D8D8E5;         /* 5.84 L* below bg, 9.93 below surface;
                                dark's fill sits 7.62 above bg, 4.00 above surface */
    --fill-press: #CFCFDD;
    --track: #D8D8E5;

    --text: #0A0A0B;
    --text-secondary: #55555E;
    --text-tertiary: #5E5E68;  /* 4.71 on sunken, the darkest ground it lands on */
    --text-on-accent: #FFFFFF;
    --text-on-solid: #FFFFFF;

    /* The accent as ink is a step deeper than the shipped #B03A0A so it
       still clears 4.5 on its own tinted ground. */
    --accent: #C2410C;
    --accent-text: #9E3408;
    --accent-deep: #9A3412;
    --accent-quiet: #FAD1B9;

    /* The quiet tints sit at L* 85.5-86.5, six L* below the page ground -- the same tone step dark's quiet tints take above their ground (6.6 to 11.1), so
       a banner, a selected row or a chat bubble is a surface rather than a
       rumour. The shipped tints sat at 94-96, level with the ground: an
       accent-quiet chat bubble measured 1.00:1 against the page behind it.
       Measured, ink on its own tint: accent 5.05, success 4.61, error 4.73,
       warning 4.95, info 5.54. The
       semantic inks deepen to match, so each still clears 4.5 on its tint. */
    --success: #0F6B41;
    --success-quiet: #AFE4C7;
    --error: #B31F1F;
    --error-solid: #C42525;
    --error-quiet: #F8CFCF;
    --warning: #7A4F00;
    --warning-quiet: #F7D28F;
    --info: #17538F;
    --info-quiet: #C5DBF3;

    --shadow-raised: 0 1px 2px rgba(0, 0, 0, 0.14);
    --shadow-overlay: 0 12px 32px rgba(0, 0, 0, 0.20);
    --scrim: rgba(0, 0, 0, 0.35);

    /* Anatomy palette, light. The twelve hues are the same twelve hues at
       the same angles; only their depth changes, because a colour picked to
       read on near-black washes out on white. Each is darkened until it
       clears 3.6:1 on --surface-raised (3.3 on --surface, 2.97 on --bg with
       the seam carrying the boundary), and the seam is still 45% of the hue
       mixed into black, which clears 3.03:1 against every hue it separates. */
    --anat-chest: #F9043B;     /* crimson */
    --anat-back: #0186E8;      /* electric blue */
    --anat-shoulders: #6945DE; /* violet */
    --anat-calves: #E101B5;    /* magenta */
    --anat-abs: #B97400;       /* hot orange */
    --anat-forearms: #019191;  /* teal      \ */
    --anat-biceps: #0292A8;    /* cyan       > the arm family */
    --anat-triceps: #048EC2;   /* azure     / */
    --anat-hams: #878C01;      /* olive       \ */
    --anat-quads: #369A01;     /* green        \  the leg family */
    --anat-adduc: #01937F;     /* turquoise    >  quads and adductors share a thigh, */
    --anat-glutes: #039862;    /* spring      /   so they sit furthest apart */
    --anat-muted: #83838E;       /* 3.10 on bg: an unselected region keeps its 3:1 */
    --anat-silhouette: #A8A8B2;  /* 2.17 on surface: a figure, not a competitor */
    --anat-shorts: #C6C6CF;
  }
}

/* ---------------------------------------------------------------
   Base. The demo's only global rules.
   --------------------------------------------------------------- */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  font-size: var(--type-15);
  line-height: var(--lh-15);
  letter-spacing: var(--tr-15);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Numbers are tabular everywhere. A weight that changes width is a bug. */
.num, [data-num] {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

button, input, select, textarea { font: inherit; color: inherit; }

button {
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* Every control answers within 100ms. */
button, [role="button"], a, input, select, .row, .chip {
  transition: background-color var(--dur-fast) var(--ease),
              transform var(--dur-fast) var(--ease),
              opacity var(--dur-fast) var(--ease),
              border-color var(--dur-fast) var(--ease);
}
button:active, [role="button"]:active, .row:active, .chip:active {
  transform: scale(0.97);
}
button:disabled, [aria-disabled="true"] {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}

:focus-visible {
  outline: 2px solid var(--accent-text);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

/* Nothing on any screen scrolls sideways. Wide content scrolls inside its
   own container, which sets that for itself. */
body { overflow-x: hidden; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ---------------------------------------------------------------
   Type helpers. Every text node uses one of these.

   The three smallest carry tabular figures. A stacked column of records has a
   value down one side and a date and a weight down the other, and a screen
   where only one side aligns reads as a mistake. Sixty-six numeric nodes were
   non-tabular when this depended on an author remembering a `num` class on
   each one, so the scale carries it instead.
   --------------------------------------------------------------- */
/* Apple's roles, available by name. The .t-* helpers above are this build's
   own vocabulary and stay: they carry colour and case decisions the raw roles
   do not. These are for anything new, and for the chrome, where the role is
   what matters — a nav title is a Large Title collapsing to a Headline, and
   naming it by size loses that. */
.t-large-title { font-size: var(--type-large-title); line-height: var(--lh-large-title); letter-spacing: var(--tr-large-title); font-weight: var(--w-bold); }
.t-title-1     { font-size: var(--type-title-1);     line-height: var(--lh-title-1);     letter-spacing: var(--tr-title-1);     font-weight: var(--w-bold); }
.t-title-2     { font-size: var(--type-title-2);     line-height: var(--lh-title-2);     letter-spacing: var(--tr-title-2);     font-weight: var(--w-bold); }
.t-title-3     { font-size: var(--type-title-3);     line-height: var(--lh-title-3);     letter-spacing: var(--tr-title-3);     font-weight: var(--w-semibold); }
.t-headline    { font-size: var(--type-headline);    line-height: var(--lh-headline);    letter-spacing: var(--tr-headline);    font-weight: var(--w-semibold); }
.t-body-17     { font-size: var(--type-body);        line-height: var(--lh-body);        letter-spacing: var(--tr-body);        font-weight: var(--w-regular); }
.t-callout     { font-size: var(--type-callout);     line-height: var(--lh-callout);     letter-spacing: var(--tr-callout);     font-weight: var(--w-regular); }
.t-subheadline { font-size: var(--type-subheadline); line-height: var(--lh-subheadline); letter-spacing: var(--tr-subheadline); font-weight: var(--w-regular); }
.t-footnote    { font-size: var(--type-footnote);    line-height: var(--lh-footnote);    letter-spacing: var(--tr-footnote);    font-weight: var(--w-regular); font-variant-numeric: tabular-nums; }
.t-caption-1   { font-size: var(--type-caption-1);   line-height: var(--lh-caption-1);   letter-spacing: var(--tr-caption-1);   font-weight: var(--w-regular); font-variant-numeric: tabular-nums; }
.t-caption-2   { font-size: var(--type-caption-2);   line-height: var(--lh-caption-2);   letter-spacing: var(--tr-caption-2);   font-weight: var(--w-regular); font-variant-numeric: tabular-nums; }

.t-label   { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); font-weight: var(--w-semibold); text-transform: uppercase; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.t-meta    { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); font-weight: var(--w-medium); color: var(--text-tertiary); text-transform: none; font-variant-numeric: tabular-nums; }
.t-detail  { font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13); font-weight: var(--w-regular); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.t-body    { font-size: var(--type-15); line-height: var(--lh-15); letter-spacing: var(--tr-15); font-weight: var(--w-regular); }
.t-body-em { font-size: var(--type-15); line-height: var(--lh-15); letter-spacing: var(--tr-15); font-weight: var(--w-medium); }
.t-section { font-size: var(--type-17); line-height: var(--lh-17); letter-spacing: var(--tr-17); font-weight: var(--w-semibold); }
.t-title   { font-size: var(--type-22); line-height: var(--lh-22); letter-spacing: var(--tr-22); font-weight: var(--w-bold); }
.t-hero    { font-size: var(--type-28); line-height: var(--lh-28); letter-spacing: var(--tr-28); font-weight: var(--w-bold); font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------
   Forbidden, enforced by review:
     hex or rgba outside this file
     a font size, spacing, radius or duration not listed above
     decorative gradients; the accent fill marks the primary action only
     emoji as an icon
     a shadow that carries colour
     an interactive target under 44x44
     !important, except the reduced-motion block above
   --------------------------------------------------------------- */

/* ---------------------------------------------------------------
   VERIFIED CONTRAST PAIRS (WCAG 2.1, measured by script against the
   rendered page, not estimated). Both themes, side by side, so a change
   to one that is not made to the other is visible here.

   pair                              DARK    LIGHT   result
   text            on bg            18.18    16.38   AA
   text            on surface       16.90    18.19   AA
   text            on raised        15.61    19.79   AA
   text-secondary  on surface        7.17     6.78   AA
   text-tertiary   on surface        5.10     5.89   AA
   text-tertiary   on bg             5.48     5.30   AA
   text-tertiary   on sunken         5.65     4.71   AA
   text-tertiary   on fill           4.71     4.54   AA
   accent-text     on bg             8.44     5.89   AA
   accent-text     on surface        7.85     6.55   AA
   accent-text     on accent-quiet   7.08     5.05   AA
   text-on-accent  on accent         7.06     5.18   AA
   text-on-solid   on accent-deep    5.18     7.31   AA
   text-on-solid   on error-solid    4.81     5.77   AA
   success         on surface       10.08     6.03   AA
   success         on success-quiet  8.57     4.61   AA
   error           on surface        6.63     6.16   AA
   error           on error-quiet    6.25     4.73   AA
   warning         on surface       10.20     6.55   AA
   warning         on warning-quiet  8.87     4.95   AA
   info            on surface        7.49     7.23   AA
   info            on info-quiet     6.86     5.54   AA
   border          on sunken         3.81     3.30   AA (non-text)
   border          on bg             3.70     3.71   AA (non-text)
   border          on surface        3.44     4.12   AA (non-text)
   border          on raised         3.18     4.49   AA (non-text)

   White on dark --accent measures 2.80 and is forbidden. Orange is a
   light colour; the primary button carries dark text in dark. In light
   --accent is the deeper #C2410C and white on it measures 5.18, so light
   carries white text on the same button. That is why --text-on-accent is
   a token and not a constant.

   --hairline is a 1px separator between rows, not a control boundary, so
   WCAG 1.4.11 does not apply to it. Every control boundary uses --border.

   ELEVATION, measured L*. Both ramps are strictly monotonic, so elevation
   reads by tone alone and shadow stays secondary.
                 sunken    bg  surface  raised
     dark          1.39  2.76     6.39   10.38   steps 1.37 / 3.63 / 3.99
     light        88.05 92.53    96.61  100.00   steps 4.48 / 4.08 / 3.39

   FILLS, measured L* distance from the surface they sit on. In dark a
   fill rises; in light it sinks. Same job, opposite direction, which is
   the whole reason these are separate tokens from --surface-raised.
                        vs bg  vs surface  vs raised
     dark --fill         7.62        4.00       0.00 (identical to raised)
     light --fill        5.84        9.93      13.31
     dark --fill-press   7.62        4.00       0.00
     light --fill-press  9.03       13.11      16.50
   Selected segment (--surface-raised) against its track (--track):
     dark 4.00 L*, light 13.31 L*.

   QUIET TINTS, measured L* distance from the page ground. A banner, a
   selected row or a chat bubble has to be a surface, not a rumour.
                    dark   light
     accent-quiet   8.65    5.81
     success-quiet 11.13    6.16
     error-quiet    6.64    5.98
     warning-quiet 10.24    6.60
     info-quiet     8.06    6.02

   KNOWN, ACCEPTED, AND IDENTICAL IN BOTH THEMES
   A chip, a badge, an icon well, a secondary button and a keypad key are
   bounded by a tone step rather than a border: 1.16:1 in dark, 1.17:1 in
   light on the page ground. They are named controls whose label or icon
   carries the identification, so 1.4.11 is met by the text rather than
   the edge; the tone step is the system's idiom and it is now the same
   strength in both themes. Anything that has no label -- an input, a
   switch track, a checkbox, a set mark -- carries --border instead and
   clears 3:1 on every ground.
   --------------------------------------------------------------- */


/* LOCKED components.
   Every page composes these classes. A page may not invent a component,
   and may not use a value that is not a token.

   Rules encoded here so pages cannot break them:
     one accent fill per screen, on the primary action only
     no interactive target under 44x44
     every control has a pressed and a disabled state
     numbers are tabular
     sheets rise, they do not fade in place */

/* Headings and paragraphs carry no default margin: spacing is set by
   the stack and section utilities, never by the user-agent stylesheet. */
h1, h2, h3, h4, p { margin: 0; font: inherit; }

/* ===============================================================
   Screen shell
   =============================================================== */

.screen {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--bg);
  overflow: hidden;
}

/* Header. One title, one optional back, one optional trailing action. */
.hdr {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--page-x);
  padding-top: calc(var(--sp-2) + var(--safe-top));
  min-height: var(--tap);
  background: var(--bg);
}
.hdr__back {
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--tap);
  height: var(--tap);
  margin-left: calc(var(--sp-3) * -1);
  border-radius: var(--r-full);
  color: var(--text);
}
.hdr__back:active { background: var(--fill-press); }
.hdr__title { flex: 1; min-width: 0; }
.hdr__action {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: var(--tap);
  height: var(--tap);
  margin-right: calc(var(--sp-3) * -1);
  padding: 0 var(--sp-3);
  border-radius: var(--r-full);
  color: var(--accent-text);
  font-size: var(--type-15); line-height: var(--lh-15); letter-spacing: var(--tr-15);
  font-weight: var(--w-medium);
}
.hdr__action:active { background: var(--fill-press); }

/* Scroll body. The only scrolling element on a screen. */
.body {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 0 var(--page-x) var(--sp-6);
}
.body--flush { padding-left: 0; padding-right: 0; }

/* ===============================================================
   Buttons
   =============================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  min-height: var(--tap);
  padding: 0 var(--sp-4);
  border-radius: var(--r-md);
  corner-shape: var(--corner-smooth);
  font-size: var(--type-15); line-height: var(--lh-15);
  font-weight: var(--w-semibold);
  letter-spacing: var(--tr-15);
  white-space: nowrap;
}
.btn--block { display: flex; width: 100%; }

/* Primary. The one accent fill on the screen. Dark text: white fails. */
.btn--primary { background: var(--accent); color: var(--text-on-accent); }
.btn--primary:active { background: var(--accent-deep); color: var(--text-on-solid); }

/* Secondary. Same shape, quieter. */
.btn--secondary { background: var(--fill); color: var(--text); }
.btn--secondary:active { background: var(--hairline); }

/* Tertiary. Text only, for the third thing. */
.btn--tertiary { background: none; color: var(--accent-text); font-weight: var(--w-medium); }
.btn--tertiary:active { background: var(--fill-press); }

/* Destructive. Never an accent fill. */
.btn--danger { background: none; color: var(--error); }
.btn--danger:active { background: var(--error-quiet); }
.btn--danger-solid { background: var(--error-solid); color: var(--text-on-solid); }

.btn--sm { min-height: var(--tap); padding: 0 var(--sp-3); font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13); }

/* Busy. A control that is working says so. */
.btn[aria-busy="true"] { pointer-events: none; }
.btn[aria-busy="true"] .btn__label { opacity: 0.5; }
.spinner {
  width: 16px; height: 16px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: var(--r-full);
  animation: spin 700ms linear infinite;
  flex: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===============================================================
   Card and section
   =============================================================== */

.card {
  background: var(--surface);
  border-radius: var(--r-lg);
  corner-shape: var(--corner-smooth);
  padding: var(--sp-4);
}
.card--flush { padding: 0; overflow: hidden; }
.card--raised { background: var(--surface-raised); box-shadow: var(--shadow-raised); }
.card + .card { margin-top: var(--sp-3); }

.section { margin-top: var(--sp-5); }
.section__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: var(--sp-2);
}

/* ===============================================================
   List row. One implementation. Every list uses it.
   =============================================================== */

.row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  min-height: var(--tap);
  padding: var(--sp-3) var(--sp-4);
  text-align: left;
  background: var(--surface);
  color: var(--text);
}
.row:active { background: var(--fill-press); }
.row + .row { box-shadow: inset 0 1px 0 var(--hairline); }
.row__main { flex: 1; min-width: 0; }
.row__title { display: block; font-size: var(--type-15); letter-spacing: var(--tr-15); line-height: var(--lh-15); font-weight: var(--w-medium); }
.row__sub { display: block; font-size: var(--type-13); letter-spacing: var(--tr-13); line-height: var(--lh-13); color: var(--text-secondary); margin-top: 2px; font-variant-numeric: tabular-nums; }
.row__value { font-size: var(--type-15); line-height: var(--lh-15); letter-spacing: var(--tr-15); font-weight: var(--w-semibold); font-variant-numeric: tabular-nums; }
.row__chev { color: var(--text-tertiary); flex: none; }
.row--selected { background: var(--accent-quiet); }

/* Icon holder. One icon set, one optical size. */
.ico { width: 20px; height: 20px; flex: none; stroke-width: 1.75; }
.ico--lg { width: 24px; height: 24px; }
.ico-well {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; flex: none;
  border-radius: var(--r-sm);
  corner-shape: var(--corner-smooth);
  background: var(--fill);
  color: var(--text-secondary);
}

/* ===============================================================
   Inputs
   =============================================================== */

.field { display: block; }
.field__label { display: block; margin-bottom: var(--sp-2); }
.input {
  display: block;
  width: 100%;
  min-height: var(--tap);
  padding: var(--sp-3);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  corner-shape: var(--corner-smooth);
  color: var(--text);
  font-size: var(--type-15); line-height: var(--lh-15); letter-spacing: var(--tr-15);
}
.input::placeholder { color: var(--text-tertiary); }
.input:focus { outline: none; border-color: var(--accent-text); box-shadow: 0 0 0 var(--sp-1) var(--accent-quiet); }
.input[aria-invalid="true"] { border-color: var(--error); }
.field__help { margin-top: var(--sp-2); font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13); color: var(--text-secondary); }
.field__error { margin-top: var(--sp-2); font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13); color: var(--error); display: flex; gap: var(--sp-2); align-items: flex-start; }

/* Search. Prominent, because finding is the job. */
.search { position: relative; }
.search .input { padding-left: calc(var(--sp-4) + 20px); }
.search__ico { position: absolute; left: var(--sp-3); top: 50%; transform: translateY(-50%); color: var(--text-tertiary); pointer-events: none; }

/* Switch. 44px hit area, smaller visual. */
.switch {
  position: relative;
  width: 52px; height: var(--tap);
  flex: none;
  display: flex; align-items: center;
}
.switch__track {
  width: 52px; height: 32px;
  border-radius: var(--r-full);
  background: var(--hairline);
  transition: background-color var(--dur-fast) var(--ease);
}
.switch__knob {
  position: absolute; left: 2px;
  width: 28px; height: 28px;
  border-radius: var(--r-full);
  /* The knob is white in BOTH themes: it rides a coloured track, so it
     must not follow --text, which inverts. A dark knob on a green track
     reads as a hole rather than a control. */
  background: var(--knob);
  box-shadow: var(--shadow-raised);
  transition: transform var(--dur-fast) var(--spring-snappy);
}
.switch[aria-checked="true"] .switch__track { background: var(--accent); }
.switch[aria-checked="true"] .switch__knob { transform: translateX(20px); }

/* ===============================================================
   Chips and segmented control
   =============================================================== */

.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  min-height: var(--tap);
  padding: 0 var(--sp-3);
  border-radius: var(--r-full);
  background: var(--fill);
  color: var(--text-secondary);
  font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13);
  font-weight: var(--w-medium);
  white-space: nowrap;
}
.chip[aria-pressed="true"], .chip--on { background: var(--accent-quiet); color: var(--accent-text); }

/* One segmented control for the whole app. Not four. */
.seg {
  display: flex;
  gap: 2px;
  padding: 2px;
  background: var(--track);
  border-radius: var(--r-md);
  corner-shape: var(--corner-smooth);
}
.seg__item {
  flex: 1;
  min-height: 40px;
  border-radius: var(--r-sm);
  corner-shape: var(--corner-smooth);
  font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13);
  font-weight: var(--w-medium);
  color: var(--text-secondary);
}
.seg__item[aria-selected="true"] { background: var(--surface-raised); color: var(--text); font-weight: var(--w-semibold); box-shadow: var(--shadow-raised); }
/* A segmented control never scrolls sideways. If items do not fit, it wraps. */

/* ===============================================================
   Tab bar
   =============================================================== */

.tabbar {
  display: flex;
  align-items: stretch;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--glass-tint);
  backdrop-filter: saturate(var(--glass-saturate)) blur(var(--glass-blur));
  -webkit-backdrop-filter: saturate(var(--glass-saturate)) blur(var(--glass-blur));
  box-shadow: inset 0 1px 0 var(--glass-specular);
}
.tabbar__item {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2px;
  color: var(--text-tertiary);
  font-size: var(--type-11);
  line-height: var(--lh-11);
  font-weight: var(--w-medium);
  letter-spacing: 0;
  text-transform: none;
}
.tabbar__item[aria-current="page"] { color: var(--accent-text); }
.tabbar__item:active { opacity: 0.6; }

/* ===============================================================
   Sheet and dialog. Sheets rise from where they were summoned.
   =============================================================== */

.scrim {
  position: absolute; inset: 0;
  background: var(--scrim);
  animation: scrimIn var(--dur-slow) var(--ease) both;
  z-index: 10;
}
@keyframes scrimIn { from { opacity: 0; } }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  z-index: 11;
  background: var(--surface-raised);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  corner-shape: var(--corner-smooth);
  box-shadow: var(--shadow-overlay);
  padding: var(--sp-2) var(--page-x) calc(var(--sp-5) + var(--safe-bottom));
  animation: sheetUp var(--dur-slow) var(--spring-snappy) both;
  max-height: 88%;
  display: flex; flex-direction: column;
}
@keyframes sheetUp { from { transform: translateY(100%); } }
.sheet__grab {
  width: 36px; height: 4px;
  margin: var(--sp-2) auto var(--sp-3);
  border-radius: var(--r-full);
  background: var(--border);
  flex: none;
}
.sheet__head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.sheet__body { overflow-y: auto; }

.dialog {
  position: absolute; left: var(--sp-5); right: var(--sp-5); top: 50%;
  transform: translateY(-50%);
  z-index: 11;
  background: var(--surface-raised);
  border-radius: var(--r-lg);
  corner-shape: var(--corner-smooth);
  box-shadow: var(--shadow-overlay);
  padding: var(--sp-5);
  animation: dialogIn var(--dur-slow) var(--spring-bouncy) both;
}
@keyframes dialogIn { from { opacity: 0; transform: translateY(-50%) scale(0.94); } }

/* ===============================================================
   Feedback
   =============================================================== */

.toast {
  position: absolute; left: var(--sp-4); right: var(--sp-4);
  bottom: calc(var(--nav-h) + var(--sp-4) + var(--safe-bottom));
  z-index: 12;
  display: flex; align-items: flex-start; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  background: var(--surface-raised);
  border-radius: var(--r-md);
  corner-shape: var(--corner-smooth);
  box-shadow: var(--shadow-overlay);
  animation: toastIn var(--dur-slow) var(--spring-bouncy) both;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } }
.toast__body { flex: 1; min-width: 0; font-size: var(--type-13); letter-spacing: var(--tr-13); line-height: var(--lh-13); }
.toast__action { color: var(--accent-text); font-weight: var(--w-semibold); font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13); min-height: var(--tap); display: flex; align-items: center; padding: 0 var(--sp-2); margin: calc(var(--sp-3) * -1) calc(var(--sp-2) * -1) calc(var(--sp-3) * -1) 0; }

/* Banner. Inline, for a condition that persists. */
.banner {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-md);
  corner-shape: var(--corner-smooth);
  font-size: var(--type-13); letter-spacing: var(--tr-13);
  line-height: var(--lh-13);
}
.banner--warn { background: var(--warning-quiet); color: var(--warning); }
.banner--error { background: var(--error-quiet); color: var(--error); }
.banner--info { background: var(--info-quiet); color: var(--info); }
.banner--success { background: var(--success-quiet); color: var(--success); }
.banner strong { color: var(--text); font-weight: var(--w-semibold); display: block; margin-bottom: 2px; }

/* Empty state. One sentence that teaches the next action, one action. */
.empty {
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
  padding: var(--sp-6) var(--sp-4);
  gap: var(--sp-3);
}
.empty__ico { color: var(--text-tertiary); margin-bottom: var(--sp-1); }
.empty__title { font-size: var(--type-17); line-height: var(--lh-17); letter-spacing: var(--tr-17); font-weight: var(--w-semibold); }
.empty__body { font-size: var(--type-13); letter-spacing: var(--tr-13); line-height: var(--lh-13); color: var(--text-secondary); max-width: 30ch; }
.empty .btn { margin-top: var(--sp-2); }

/* Skeleton. A loading state you can tell from a loaded one. */
.skel {
  background: var(--fill);
  border-radius: var(--r-sm);
  corner-shape: var(--corner-smooth);
  animation: pulse 1.4s var(--ease) infinite;
}
@keyframes pulse { 50% { opacity: 0.45; } }

/* ===============================================================
   Data display
   =============================================================== */

.stat { display: flex; flex-direction: column; gap: 2px; }
.stat__value { font-size: var(--type-22); line-height: var(--lh-22); font-weight: var(--w-bold); font-variant-numeric: tabular-nums; letter-spacing: var(--tr-22); }
.stat__unit { font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13); font-weight: var(--w-medium); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.stat__label { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); text-transform: uppercase; font-weight: var(--w-semibold); color: var(--text-tertiary); }

.meter { height: var(--sp-2); border-radius: var(--r-full); background: var(--fill); overflow: hidden; }
.meter__fill { height: 100%; border-radius: var(--r-full); background: var(--accent); transition: width var(--dur-slow) var(--spring-snappy); }

/* Chart. Axes and labels are not optional. */
.chart { width: 100%; display: block; }
.chart__grid { stroke: var(--hairline); stroke-width: 1; }
.chart__line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chart__dot { fill: var(--accent); }
.chart__axis { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); fill: var(--text-tertiary); font-variant-numeric: tabular-nums; }

/* ===============================================================
   Numeric keypad. Replaces on first digit, does not append.
   =============================================================== */

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-2); }
.pad__key {
  min-height: 56px;
  border-radius: var(--r-md);
  corner-shape: var(--corner-smooth);
  background: var(--fill);
  font-size: var(--type-22); line-height: var(--lh-22); letter-spacing: var(--tr-22);
  font-weight: var(--w-medium);
  font-variant-numeric: tabular-nums;
}
.pad__key:active { background: var(--fill-press); }


/* ---------------------------------------------------------------
   Documented grid breaks. Everything else is a multiple of 4.
   Three 2px values exist, each optical rather than structural:
     .row__sub margin-top   optical baseline gap under a row title;
                            4px reads as a separate block, 0 collides
     .seg padding           the track inset that makes the selected
                            item's radius concentric with the container
     .switch__knob offset   the same inset, so the knob sits centred
   These are the only sub-4px values in the system.
   --------------------------------------------------------------- */

/* ===============================================================
   Utilities. Layout only. No new values.
   =============================================================== */

.stack { display: flex; flex-direction: column; }
.stack--1 { gap: var(--sp-1); } .stack--2 { gap: var(--sp-2); }
.stack--3 { gap: var(--sp-3); } .stack--4 { gap: var(--sp-4); }
.hstack { display: flex; align-items: center; }
.hstack--2 { gap: var(--sp-2); } .hstack--3 { gap: var(--sp-3); } .hstack--4 { gap: var(--sp-4); }
.grow { flex: 1; min-width: 0; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.mt-2 { margin-top: var(--sp-2); } .mt-3 { margin-top: var(--sp-3); }
.mt-4 { margin-top: var(--sp-4); } .mt-5 { margin-top: var(--sp-5); }
.center { text-align: center; }
.muted { color: var(--text-secondary); }
.quiet { color: var(--text-tertiary); }
.accent { color: var(--accent-text); }
.vis-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===============================================================
   Added for split-builder. Tokens only, no new values.
   =============================================================== */

/* Pinned action bar. The primary action never sits below the fold. */
.actionbar {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--page-x) calc(var(--sp-3) + var(--safe-bottom));
  background: var(--bg);
  box-shadow: inset 0 1px 0 var(--hairline);
}
.actionbar__status { flex: 1; min-width: 0; font-size: var(--type-13); letter-spacing: var(--tr-13); line-height: var(--lh-13); color: var(--text-secondary); }
.actionbar .btn { flex: none; }

/* Unsaved marker. */
.dot {
  width: var(--sp-2); height: var(--sp-2);
  border-radius: var(--r-full);
  background: var(--accent-text);
  flex: none;
}

/* Square control, always a full target. */
.iconbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--tap); height: var(--tap);
  flex: none;
  border-radius: var(--r-md);
  corner-shape: var(--corner-smooth);
  color: var(--text-secondary);
  background: none;
}
.iconbtn:active { background: var(--fill-press); }
.iconbtn--danger { color: var(--error); }
.iconbtn--danger:active { background: var(--error-quiet); }

/* Reorder handle. Labelled, 44x44, drag or tap. Tap lifts the item and
   reveals the move controls; it is never a hidden long press. */
.grip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--tap); height: var(--tap);
  flex: none;
  border-radius: var(--r-md);
  corner-shape: var(--corner-smooth);
  color: var(--text-secondary);
  background: var(--fill);
  touch-action: none;
}
.grip:active { background: var(--hairline); }
.grip[aria-pressed="true"] { background: var(--accent-quiet); color: var(--accent-text); }

.sortable__item { position: relative; }
.sortable__item--lifted { box-shadow: inset 0 0 0 2px var(--accent-text); border-radius: var(--r-md); }
.sortable__item--dragging { opacity: 0.4; }

/* Honest progress. One line per thing actually happening. */
.gensteps { display: flex; flex-direction: column; gap: var(--sp-3); }
.genstep { display: flex; align-items: center; gap: var(--sp-3); min-height: var(--tap); font-size: var(--type-13); letter-spacing: var(--tr-13); line-height: var(--lh-13); color: var(--text-tertiary); }
.genstep__mark { width: 20px; height: 20px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); }
.genstep[data-state="active"] { color: var(--text); }
.genstep[data-state="active"] .genstep__mark { color: var(--accent-text); }
.genstep[data-state="done"] { color: var(--text-secondary); }
.genstep[data-state="done"] .genstep__mark { color: var(--success); }

/* ===============================================================
   Demo shell. Not app UI: the device frame the demo pages are
   judged in, and the corner state toggle. Tokens only; the two
   pixel values below are the iPhone 15 Pro viewport itself.
   =============================================================== */

.stage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-5);
  background: var(--surface-sunken);
}
.phone {
  width: 393px;
  height: 852px;
  flex: none;
  overflow: hidden;
  border-radius: var(--r-lg);
  corner-shape: var(--corner-smooth);
  background: var(--bg);
  box-shadow: var(--shadow-overlay);
}
/* Fluid fallback: below the frame size the screen fills the window. */
@media (max-width: 441px), (max-height: 899px) {
  .stage { padding: 0; }
  .phone { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
}

.dev {
  position: fixed;
  top: var(--sp-3);
  right: var(--sp-3);
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: var(--sp-2);
}
.dev__toggle {
  display: flex; align-items: center; justify-content: center;
  min-width: var(--tap); min-height: var(--tap);
  padding: 0 var(--sp-3);
  border-radius: var(--r-full);
  background: var(--surface-raised);
  color: var(--text-secondary);
  font-size: var(--type-11);
  line-height: var(--lh-11);
  letter-spacing: var(--tr-11);
  font-weight: var(--w-semibold);
  text-transform: uppercase;
  box-shadow: var(--shadow-raised);
}
.dev__menu[hidden] { display: none; }
.dev__menu {
  display: flex; flex-direction: column; gap: 2px;
  padding: var(--sp-1);
  border-radius: var(--r-md);
  corner-shape: var(--corner-smooth);
  background: var(--surface-raised);
  box-shadow: var(--shadow-overlay);
}
.dev__item {
  display: flex; align-items: center;
  min-height: var(--tap);
  padding: 0 var(--sp-3);
  border-radius: var(--r-sm);
  corner-shape: var(--corner-smooth);
  color: var(--text-secondary);
  font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13);
  text-align: left;
  white-space: nowrap;
}
.dev__item[aria-pressed="true"] { background: var(--hairline); color: var(--text); font-weight: var(--w-semibold); }

/* ===============================================================
   Added for the onboarding flow. Tokens only, no new values.
   =============================================================== */

/* Step indicator. A bar plus a count, because "how many left" is the
   question a setup flow has to answer. The fill is not the accent: the
   accent belongs to the primary action alone. */
.stepbar { display: flex; align-items: center; gap: var(--sp-3); }
.stepbar__track {
  flex: 1;
  height: var(--sp-1);
  border-radius: var(--r-full);
  background: var(--fill);
  overflow: hidden;
}
.stepbar__fill {
  height: 100%;
  border-radius: var(--r-full);
  background: var(--text-secondary);
  transition: width var(--dur-slow) var(--spring-snappy);
}
.stepbar__count {
  font-size: var(--type-11);
  line-height: var(--lh-11);
  letter-spacing: var(--tr-11);
  font-weight: var(--w-semibold);
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* Field control. Wraps an input that carries a control inside it,
   such as a password reveal. The reveal is a full 44x44 target. */
.field__control { position: relative; display: block; }
.field__control--adorned .input { padding-right: calc(var(--tap) + var(--sp-2)); }
.field__reveal {
  position: absolute;
  top: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  width: var(--tap); height: var(--tap);
  border-radius: var(--r-sm);
  corner-shape: var(--corner-smooth);
  color: var(--text-secondary);
}
.field__reveal:active { background: var(--fill-press); }

/* Password strength. Four segments and a sentence. The sentence carries
   the meaning; the segments are a summary of it, never the whole story. */
.strength { display: flex; flex-direction: column; gap: var(--sp-2); }
.strength__scale { display: flex; gap: var(--sp-1); }
.strength__seg {
  flex: 1;
  height: var(--sp-1);
  border-radius: var(--r-full);
  background: var(--fill);
  transition: background-color var(--dur-fast) var(--ease);
}
.strength__seg--weak { background: var(--error); }
.strength__seg--fair { background: var(--warning); }
.strength__seg--good { background: var(--success); }
.strength__text { font-size: var(--type-13); letter-spacing: var(--tr-13); line-height: var(--lh-13); color: var(--text-secondary); }

/* Quiet meter. For a progress bar on a screen whose accent fill is
   already spent on the primary action. Same shape, neutral fill. */
.meter--quiet .meter__fill { background: var(--text-tertiary); }
/* Remove, at rest, in a list of many: quiet until pressed, still not primary. */
.iconbtn--danger-quiet { color: var(--text-secondary); }
.iconbtn--danger-quiet:active { background: var(--error-quiet); color: var(--error); }

/* ===============================================================
   Added for Home. Tokens only, no new values.

   Home leads with a figure the lifter earned, so it needs three
   things the library did not have: a hero figure paired with a
   quiet label, a week rhythm read at a glance, and a sparkline
   quiet enough to sit beside the one accent fill.
   =============================================================== */

/* Hero figure. One per screen, and only for a number that was
   earned. The label under it is small on purpose: the scale
   contrast is the whole effect. */
.hero { display: flex; flex-direction: column; gap: var(--sp-1); }
.hero__figure { display: flex; align-items: baseline; gap: var(--sp-2); }
/* The hero number is the type scale's largest step and nothing more, so it
   is .t-hero. A second class that set the same five declarations was a second
   place to change one of them. */
.hero__unit { font-size: var(--type-17); letter-spacing: var(--tr-17); line-height: var(--lh-17); font-weight: var(--w-medium); color: var(--text-secondary); }
.hero__label { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); font-weight: var(--w-semibold); text-transform: uppercase; color: var(--text-tertiary); }

/* Week rhythm. A sunken track: the week is the ground the sessions
   sit in. Seven columns, never scrolls, not interactive, and the
   whole track carries one aria-label because seven letters do not
   read aloud as a week. */
.week {
  display: flex;
  gap: var(--sp-2);
  padding: var(--sp-3);
  border-radius: var(--r-md);
  corner-shape: var(--corner-smooth);
  background: var(--surface-sunken);
}
.week__day { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: var(--sp-2); }
.week__cap {
  font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11);
  font-weight: var(--w-semibold); color: var(--text-tertiary); text-transform: uppercase;
}
.week__day--now .week__cap { color: var(--text); }
.week__mark {
  width: 100%;
  height: var(--sp-6);
  border-radius: var(--r-sm);
  corner-shape: var(--corner-smooth);
  background: var(--text);
  animation: markIn var(--dur-slow) var(--spring-bouncy) both;
}
.week__mark--planned { background: none; box-shadow: inset 0 0 0 1px var(--border); }
.week__mark--today { background: none; box-shadow: inset 0 0 0 2px var(--accent-text); }
/* A rest day is a 4px bar. The mark's 8px radius clamps to half its height,
   so these two are capsules by geometry whatever token they were given, and a
   superellipse flattens a capsule. They opt out. */
.week__mark--rest, .week__mark--today-rest { corner-shape: round; }
.week__mark--rest { height: var(--sp-1); background: var(--hairline); }
.week__mark--today-rest { height: var(--sp-1); background: var(--text-tertiary); }
@keyframes markIn { from { opacity: 0; transform: scaleY(0.3); } }
.week__mark { transform-origin: bottom; }
/* The week fills left to right and stops on today. Steps are one
   third of the fast duration, so the whole run is under 300ms. */
.week__day:nth-child(1) .week__mark { animation-delay: 0ms; }
.week__day:nth-child(2) .week__mark { animation-delay: calc(var(--dur-fast) / 3); }
.week__day:nth-child(3) .week__mark { animation-delay: calc(var(--dur-fast) / 3 * 2); }
.week__day:nth-child(4) .week__mark { animation-delay: var(--dur-fast); }
.week__day:nth-child(5) .week__mark { animation-delay: calc(var(--dur-fast) / 3 * 4); }
.week__day:nth-child(6) .week__mark { animation-delay: calc(var(--dur-fast) / 3 * 5); }
.week__day:nth-child(7) .week__mark { animation-delay: calc(var(--dur-fast) / 3 * 6); }

/* Sunken card. For a state that is meant to feel settled rather
   than urgent: it sits below the page ground, not above it. */
.card--sunken { background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--hairline); }

/* Sparkline. A trend small enough to sit inside a row. Never the
   accent: its endpoints are named in the row text beside it. */
.spark { width: calc(var(--sp-6) * 2); height: var(--sp-5); flex: none; display: block; }
.spark__line { fill: none; stroke: var(--text-tertiary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spark__dot { fill: var(--text); }

/* Entry. Used once, on the block that answers the screen's question.
   A training day rises into place; a rest day settles into it. */
.enter-rise { animation: riseIn var(--dur-slow) var(--spring-snappy) both; }
.enter-settle { animation: settleIn var(--dur-slow) var(--spring-smooth) both; }
@keyframes riseIn { from { opacity: 0; transform: translateY(var(--sp-4)); } }
@keyframes settleIn { from { opacity: 0; transform: translateY(calc(var(--sp-2) * -1)); } }

@media (prefers-reduced-motion: reduce) {
  .enter-rise, .enter-settle, .week__mark { animation: none; }
}

/* ===============================================================
   Added for coach. Tokens only, no new values.
   =============================================================== */

/* View bar. The one control that switches Chat, Plan and Setup.
   The segmented control is the app's only one; --seg-tall raises its
   items to a full 44px target, which the base 40px does not meet. */
.viewbar { padding: 0 var(--page-x) var(--sp-2); background: var(--bg); }
.seg--tall .seg__item { min-height: var(--tap); }

/* Conversation. ONE component, two speakers, two states.
   The old screen made user turns bubbles and replies transparent
   full-bleed prose with no name and no time. Both speakers now carry a
   name, a time and the same bubble; only the ground colour differs. */
.thread { display: flex; flex-direction: column; padding-top: var(--sp-3); }
.thread > * + * { margin-top: var(--sp-4); }

.daymark {
  align-self: center;
  padding: var(--sp-1) var(--sp-3);
  border-radius: var(--r-full);
  background: var(--surface);
  font-size: var(--type-11);
  line-height: var(--lh-11);
  letter-spacing: var(--tr-11);
  font-weight: var(--w-semibold);
  text-transform: uppercase;
  color: var(--text-tertiary);
}

.msg { display: flex; align-items: flex-start; gap: var(--sp-2); }
.msg__avatar {
  display: flex; align-items: center; justify-content: center;
  width: var(--sp-6); height: var(--sp-6); flex: none;
  border-radius: var(--r-full);
  background: var(--fill);
  color: var(--accent-text);
}
.msg__col { display: flex; flex-direction: column; min-width: 0; max-width: 86%; }
.msg__head { display: flex; align-items: baseline; gap: var(--sp-2); margin-bottom: var(--sp-1); padding: 0 var(--sp-1); }
.msg__who { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); font-weight: var(--w-semibold); text-transform: uppercase; color: var(--text-tertiary); }
.msg__time { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); font-weight: var(--w-medium); color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.msg__bubble {
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-lg);
  corner-shape: var(--corner-smooth);
  background: var(--surface);
  font-size: var(--type-15);
  line-height: var(--lh-15);
  letter-spacing: var(--tr-15);
}
.msg__acts { display: flex; align-items: center; gap: var(--sp-1); margin-top: var(--sp-1); }
.msg--user { flex-direction: row-reverse; }
.msg--user .msg__col { align-items: flex-end; }
.msg--user .msg__head { flex-direction: row-reverse; }
.msg--user .msg__bubble { background: var(--accent-quiet); }
.msg--user .msg__avatar { background: var(--surface); color: var(--text-secondary); }
.msg--error .msg__bubble { background: var(--error-quiet); color: var(--error); }
.msg__attach { margin-top: var(--sp-2); }

/* Thinking. Dots plus the one line saying what is being read, so the
   loading state cannot be mistaken for a delivered reply. */
.typing { display: flex; align-items: center; gap: var(--sp-1); height: var(--lh-15); }
.typing__dot { width: var(--sp-2); height: var(--sp-2); border-radius: var(--r-full); background: var(--text-tertiary); animation: blink 1.2s var(--ease) infinite; }
.typing__dot:nth-child(2) { animation-delay: 150ms; }
.typing__dot:nth-child(3) { animation-delay: 300ms; }
@keyframes blink { 50% { opacity: 0.25; } }

/* Composer. Pinned, never floating, nothing painted over it. */
.composer {
  display: flex; align-items: flex-end; gap: var(--sp-2);
  padding: var(--sp-2) var(--page-x);
  background: var(--bg);
  box-shadow: inset 0 1px 0 var(--hairline);
}
.composer__input {
  flex: 1; min-width: 0;
  min-height: var(--tap); max-height: 120px;
  padding: var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  corner-shape: var(--corner-smooth);
  background: var(--surface);
  color: var(--text);
  font-size: var(--type-15); letter-spacing: var(--tr-15);
  line-height: var(--lh-15);
  resize: none;
}
.composer__input::placeholder { color: var(--text-tertiary); }
.composer__input:focus { outline: none; border-color: var(--accent-text); box-shadow: 0 0 0 var(--sp-1) var(--accent-quiet); }
.composer__send {
  display: flex; align-items: center; justify-content: center;
  width: var(--tap); height: var(--tap); flex: none;
  border-radius: var(--r-full);
  background: var(--accent);
  color: var(--text-on-accent);
}
.composer__send:active { background: var(--accent-deep); color: var(--text-on-solid); }
/* When a card in the thread is the thing to act on, the accent moves to
   it and the send button steps back. One accent fill, always. */
.screen[data-accent="card"] .composer__send { background: var(--fill); color: var(--accent-text); }

/* Choice and permission row. A check, not a switch: the switch's on-state
   is an accent fill, and the accent belongs to the primary action alone. */
.opt {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  width: 100%; min-height: var(--tap);
  padding: var(--sp-3) var(--sp-4);
  text-align: left;
  background: var(--surface);
  color: var(--text);
}
.opt + .opt { box-shadow: inset 0 1px 0 var(--hairline); }
.opt:active { background: var(--fill-press); }
.opt__mark {
  display: flex; align-items: center; justify-content: center;
  width: var(--sp-5); height: var(--sp-5); flex: none;
  margin-top: 2px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  corner-shape: var(--corner-smooth);
  color: transparent;
}
/* A chosen row is shown by its mark filling, and by nothing else. Tinting the
   row as well was tried and removed: nine data-access rows with five of them
   on would flood the card in accent, and the accent is reserved for the one
   primary action, which on that screen is Save. It also could not have worked
   where it was most wanted -- `.card--outline .opt` below sets a background
   and wins on source order -- so the rule would have lost silently.

   .row--selected tints a whole row, and that is a different component doing a
   different job: choosing one item out of a list, not switching a setting on.
   The two screens that once had their own copy of this row now use this one,
   so no two screens show the same act two ways. */
.opt[aria-checked="true"] .opt__mark { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); }
.opt__mark .ico { opacity: 0; transition: opacity var(--dur-fast) var(--ease); }
.opt[aria-checked="true"] .opt__mark .ico { opacity: 1; }
.opt__main { flex: 1; min-width: 0; }
.opt__title { display: block; font-size: var(--type-15); letter-spacing: var(--tr-15); line-height: var(--lh-15); font-weight: var(--w-medium); }
.opt__sub { display: block; font-size: var(--type-13); letter-spacing: var(--tr-13); line-height: var(--lh-13); color: var(--text-secondary); margin-top: 2px; }

/* Permissions do not look like preferences. Preferences sit on a filled
   card; a permission group is drawn, bordered, and headed by what it
   grants. Same rows, different weight. */
.card--outline { background: none; border: 1px solid var(--border); }
.card--outline .opt, .card--outline .row { background: none; }
.card__head {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  box-shadow: inset 0 -1px 0 var(--hairline);
}
.card__foot { padding: var(--sp-3) var(--sp-4); box-shadow: inset 0 1px 0 var(--hairline); }

/* ===============================================================
   Added for exercise-library. Tokens only, no new values.
   =============================================================== */

/* Find bar. Sits above the scroll body rather than inside it, so the
   search field is present at every level of the library and cannot
   scroll away. The audited library dropped search at group level. */
.findbar { padding: var(--sp-2) var(--page-x) var(--sp-3); background: var(--bg); }

/* Prominent search. The audited field carried a 1.07:1 border on its own
   fill and disappeared under an 8px blur. This one is raised off the
   ground and bounded by --text-tertiary, measured in both themes:
   4.71 dark / 6.41 light against its own fill, 5.48 dark / 5.30 light
   against the page ground. */
.search--find .input {
  background: var(--surface-raised);
  border-color: var(--text-tertiary);
  padding-left: calc(var(--sp-5) + var(--sp-3));
  padding-right: calc(var(--tap) + var(--sp-1));
  font-size: var(--type-17); letter-spacing: var(--tr-17);
  line-height: var(--lh-17);
}
.search--find .search__ico { left: var(--sp-4); color: var(--text-secondary); }
.search__clear {
  position: absolute;
  top: 0; right: 0;
  width: var(--tap); height: var(--tap);
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-sm);
  corner-shape: var(--corner-smooth);
  color: var(--text-secondary);
}
.search__clear:active { background: var(--hairline); }
.search__clear[hidden] { display: none; }

/* Sticky heading inside a long flat list. */
.listhead {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--page-x) var(--sp-2);
  background: var(--bg);
}

/* Gutter for a flush-bodied screen whose rows run edge to edge. */
.gutter { margin-left: var(--page-x); margin-right: var(--page-x); }

/* Badge. A non-interactive marker on a row or a title. */
.badge {
  display: inline-flex; align-items: center;
  padding: 0 var(--sp-2);
  border-radius: var(--r-full);
  background: var(--fill);
  color: var(--text-secondary);
  font-size: var(--type-11);
  line-height: var(--lh-11);
  letter-spacing: var(--tr-11);
  font-weight: var(--w-semibold);
  text-transform: uppercase;
  white-space: nowrap;
}
.badge--accent { background: var(--accent-quiet); color: var(--accent-text); }

/* Wrapping row of chips. A chip row never scrolls sideways. */
.chiprow { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

/* Fact pairs in a detail sheet. */
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }

/* Muscle map. Drawn, not fetched: the detail sheet's illustration works
   with no network, which is the designed case rather than the failure. */
.bodymap { display: flex; gap: var(--sp-5); align-items: flex-start; }
.bodymap__unit { display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); }
.bodymap__fig { height: 112px; width: auto; flex: none; }
/* The demonstration stand-in: a figure at the start and the end of the lift,
   shown where a clip would be. It is not anatomy and shares nothing with the
   body map, which is why it no longer shares its names either. */
.demofig { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
.demofig--end { fill: var(--accent-quiet); stroke: var(--accent-text); stroke-width: 1.5; }

/* Demonstration slot. Fixed aspect, so loading, loaded and unavailable
   occupy the same box and are told apart by what is in it. */
.media {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: var(--r-md);
  corner-shape: var(--corner-smooth);
  background: var(--surface);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.media__art { width: 100%; height: 100%; display: block; }

/* ===============================================================
   Added for progress. Tokens only, no new values.
   =============================================================== */

/* Segmented control at full target height, and a checked state for
   when the group is a radiogroup rather than a tablist. The 40px
