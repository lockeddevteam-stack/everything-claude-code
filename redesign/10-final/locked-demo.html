            alt('Single-Arm Dumbbell Row', 'Difficulty', 'One side at a time')]),
          slot('Rear delts', 'Face Pull', 'Balances the pressing volume', [
            alt('Reverse Pec Deck', 'Equipment', 'Machine'),
            alt('Bent-Over Reverse Fly', 'Equipment', 'Dumbbells only'),
            alt('Cable Rear Delt Row', 'Emphasis', 'Rear delts and traps')]),
          slot('Biceps', 'Incline Dumbbell Curl', 'Stretched position', [
            alt('Barbell Curl', 'Difficulty', 'Heaviest loading'),
            alt('Cable Curl', 'Emphasis', 'Tension at the top'),
            alt('Hammer Curl', 'Emphasis', 'Brachialis and forearm')])
        ]},
        { id: nid('p'), name: 'Legs', slots: [
          slot('Squat', 'Back Squat', 'Main leg lift', [
            alt('Front Squat', 'Emphasis', 'More quad, less back'),
            alt('Hack Squat', 'Difficulty', 'No bar to balance'),
            alt('Goblet Squat', 'Equipment', 'One dumbbell')]),
          slot('Hinge', 'Romanian Deadlift', 'Hamstrings under stretch', [
            alt('Conventional Deadlift', 'Emphasis', 'Whole posterior chain'),
            alt('Hip Thrust', 'Emphasis', 'Glutes'),
            alt('Back Extension', 'Difficulty', 'Low spinal load')]),
          slot('Quad accessory', 'Leg Press', 'Volume without the squat fatigue', [
            alt('Bulgarian Split Squat', 'Equipment', 'Dumbbells only'),
            alt('Leg Extension', 'Emphasis', 'Quads alone'),
            alt('Walking Lunge', 'Difficulty', 'Balance under load')]),
          slot('Calves', 'Standing Calf Raise', 'Straight-leg calf work', [
            alt('Seated Calf Raise', 'Emphasis', 'Soleus'),
            alt('Leg Press Calf Raise', 'Equipment', 'Leg press'),
            alt('Single-Leg Calf Raise', 'Difficulty', 'Bodyweight only')])
        ]}
      ]
    };
  }

  /* ---------------------------------------------------------------
     State
     --------------------------------------------------------------- */
  var S = {
    screen: 'manual',
    manual: { status: 'ready', name: '', days: [], dirty: false, savedAt: null, error: null, edit: false },
    ai: { status: 'idle', note: '', plan: null, error: null, step: 0 },
    lifted: null,          /* testid of the lifted item's grip */
    swipe: null,           /* id of the exercise row swiped open */
    dragging: null,
    modal: null,           /* {type:'leave'|'pick'|'swap', ...} */
    toast: null,
    dev: false
  };
  var timers = [];
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  function canSave() { return S.manual.name.trim().length > 0 && S.manual.days.length > 0; }
  function exCount() {
    return S.manual.days.reduce(function (n, d) { return n + d.exercises.length; }, 0);
  }
  function swapCount() {
    if (!S.ai.plan) return 0;
    var n = 0;
    S.ai.plan.days.forEach(function (d) { d.slots.forEach(function (s) { if (s.choice !== 'auto') n += 1; }); });
    return n;
  }
  function slotCount() {
    if (!S.ai.plan) return 0;
    return S.ai.plan.days.reduce(function (n, d) { return n + d.slots.length; }, 0);
  }
  function currentName(s) {
    if (s.choice === 'auto' || s.choice === 'pick') return s.pick;
    var a = s.alts.filter(function (x) { return x.id === s.choice; })[0];
    return a ? a.name : s.pick;
  }

  /* ---------------------------------------------------------------
     Manual builder
     --------------------------------------------------------------- */
  function manualHeader() {
    var m = S.manual;
    var counts = m.days.length + (m.days.length === 1 ? ' day · ' : ' days · ') +
      exCount() + (exCount() === 1 ? ' exercise' : ' exercises');
    var sub = m.dirty ? 'Unsaved changes'
      : m.savedAt ? 'Saved ' + m.savedAt
      : m.days.length ? counts
      : 'No days yet';
    /* Edit is offered only where there is something to reorder or remove. */
    var canEdit = m.days.length > 0 && m.status === 'ready';
    return '<header class="hdr" role="banner">' +
      '<button class="hdr__back" data-testid="manual-back" data-action="manual-back" aria-label="Back to Train">' + ico('back') + '</button>' +
      '<div class="hdr__title" role="heading" aria-level="1">' +
        '<div class="t-section truncate" data-testid="manual-title">' + (m.name.trim() ? esc(m.name.trim()) : 'New split') + '</div>' +
        '<div class="hstack hstack--2">' +
          (m.dirty ? '<span class="dot" aria-hidden="true"></span>' : '') +
          '<span class="t-meta" data-testid="manual-subtitle">' + esc(sub) + '</span>' +
        '</div>' +
      '</div>' +
      (canEdit ? '<button class="hdr__action" data-testid="edit-toggle" data-action="edit-toggle" data-edit="' +
        (m.edit ? 'on' : 'off') + '">' + (m.edit ? 'Done' : 'Edit') + '</button>' : '') +
    '</header>';
  }

  function gripBtn(testid, label, lifted) {
    return '<button class="grip" data-testid="' + testid + '" data-grip="1" aria-pressed="' + (lifted ? 'true' : 'false') +
      '" aria-label="' + esc(label) + '">' + ico('grip') + '</button>';
  }

  function moveBar(kind, id, dayId, first, last) {
    var d = ' data-id="' + id + '"' + (dayId ? ' data-day="' + dayId + '"' : '');
    return '<div class="movebar">' +
      '<button class="btn btn--secondary btn--sm" data-testid="move-up-' + id + '" data-action="move-' + kind + '" data-dir="-1"' + d +
        (first ? ' disabled aria-disabled="true"' : '') + '>' + ico('up') + '<span class="btn__label">Up</span></button>' +
      '<button class="btn btn--secondary btn--sm" data-testid="move-down-' + id + '" data-action="move-' + kind + '" data-dir="1"' + d +
        (last ? ' disabled aria-disabled="true"' : '') + '>' + ico('down') + '<span class="btn__label">Down</span></button>' +
      '<button class="btn btn--tertiary btn--sm" data-testid="move-done-' + id + '" data-action="lift-clear">Done</button>' +
    '</div>';
  }

  /* At rest an exercise is a line of text. The only way to destroy one is
     the iOS way: swipe it left, which reveals exactly one red button and
     leaves an Undo behind. In Edit the row grows a handle and a delete. */
  function exerciseRow(x, day, i, n) {
    var m = S.manual;
    if (!m.edit) {
      var open = S.swipe === x.id;
      return '<div class="swipe" data-swipe="1" data-id="' + x.id + '" data-day="' + day.id +
          '" data-open="' + (open ? 'true' : 'false') + '">' +
        (open ? '<button class="swipe__action" data-testid="ex-remove-' + x.id + '" data-action="ex-remove" data-id="' + x.id +
          '" data-day="' + day.id + '" aria-label="Remove ' + esc(x.name) + ' from ' + esc(day.name) + '">Delete</button>' : '') +
        '<div class="swipe__pane">' +
          '<div class="row">' +
            '<div class="row__main">' +
              '<div class="row__title">' + esc(x.name) + '</div>' +
              '<div class="row__sub">' + esc(x.muscle) + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    var gripId = 'ex-grip-' + x.id;
    var lifted = S.lifted === gripId;
    return '<div class="row sortable__item' + (lifted ? ' sortable__item--lifted' : '') +
        (S.dragging === gripId ? ' sortable__item--dragging' : '') + '" data-sortable="1" data-id="' + x.id + '" data-day="' + day.id + '">' +
      gripBtn(gripId, 'Reorder ' + x.name + ', position ' + (i + 1) + ' of ' + n, lifted) +
      '<div class="row__main">' +
        '<div class="row__title">' + esc(x.name) + '</div>' +
        '<div class="row__sub">' + esc(x.muscle) + '</div>' +
      '</div>' +
      '<button class="iconbtn iconbtn--danger-quiet" data-testid="ex-remove-' + x.id + '" data-action="ex-remove" data-id="' + x.id +
        '" data-day="' + day.id + '" aria-label="Remove ' + esc(x.name) + ' from ' + esc(day.name) + '">' + ico('trash') + '</button>' +
    '</div>' + (lifted ? moveBar('ex', x.id, day.id, i === 0, i === n - 1) : '');
  }

  function dayCard(day, i, n) {
    var m = S.manual;
    var gripId = 'day-grip-' + day.id;
    var lifted = S.lifted === gripId;
    var rows = day.exercises.length
      ? '<div data-sortlist="ex:' + day.id + '">' + day.exercises.map(function (x, j) {
          return exerciseRow(x, day, j, day.exercises.length);
        }).join('') + '</div>'
      : '<div class="row"><div class="row__main"><div class="t-detail">No exercises yet. Add the first lift of the day.</div></div></div>';

    var head = m.edit
      ? '<div class="daycard__head">' +
          gripBtn(gripId, 'Reorder ' + day.name + ', day ' + (i + 1) + ' of ' + n, lifted) +
          '<input class="input grow" type="text" value="' + esc(day.name) + '" data-testid="day-name-' + day.id +
            '" data-action="day-name" data-id="' + day.id + '" aria-label="Name of day ' + (i + 1) + '">' +
          '<button class="iconbtn iconbtn--danger" data-testid="day-remove-' + day.id + '" data-action="day-remove" data-id="' + day.id +
            '" aria-label="Remove ' + esc(day.name) + '">' + ico('trash') + '</button>' +
        '</div>'
      : '<div class="daycard__head">' +
          '<div class="daycard__name">' +
            '<h3 class="t-section truncate">' + esc(day.name) + '</h3>' +
            '<div class="t-meta" data-num>' + day.exercises.length +
              (day.exercises.length === 1 ? ' exercise' : ' exercises') + '</div>' +
          '</div>' +
        '</div>';

    return '<div class="card card--flush' + (m.edit ? ' sortable__item' : '') +
        (m.edit && lifted ? ' sortable__item--lifted' : '') +
        (m.edit && S.dragging === gripId ? ' sortable__item--dragging' : '') + '"' +
        (m.edit ? ' data-sortable="1"' : '') + ' data-id="' + day.id + '">' +
      head +
      (m.edit && lifted ? moveBar('day', day.id, null, i === 0, i === n - 1) : '') +
      rows +
      '<div class="daycard__foot">' +
        '<button class="btn btn--secondary btn--block" data-testid="add-exercise-' + day.id + '" data-action="add-exercise" data-id="' + day.id + '">' +
          ico('plus') + '<span class="btn__label">Add exercise to ' + esc(day.name) + '</span></button>' +
      '</div>' +
    '</div>';
  }

  function manualBody() {
    var m = S.manual;
    if (m.status === 'loading') {
      return '<div class="body" role="main" data-testid="manual-loading">' +
        '<div class="section" aria-busy="true" aria-live="polite">' +
          '<p class="t-detail" data-testid="manual-loading-text">Opening PPL v2 from this phone.</p>' +
          '<div class="skel skelline mt-4" style="width:60%"></div>' +
          '<div class="card mt-4"><div class="skel skelline" style="width:40%"></div>' +
          '<div class="skel skelline mt-3" style="width:80%"></div><div class="skel skelline mt-3" style="width:70%"></div></div>' +
          '<div class="card"><div class="skel skelline" style="width:35%"></div>' +
          '<div class="skel skelline mt-3" style="width:75%"></div><div class="skel skelline mt-3" style="width:65%"></div></div>' +
        '</div></div>';
    }

    /* The name lives in the header once it exists. The field is shown while
       the split is unnamed (it cannot be saved without one) and inside Edit. */
    var head = (m.edit || !m.name.trim())
      ? '<div class="section">' +
          '<label class="field">' +
            '<span class="field__label t-label">Split name</span>' +
            '<input class="input" type="text" value="' + esc(m.name) + '" placeholder="Push pull legs" ' +
              'data-testid="split-name" data-action="split-name" aria-label="Split name">' +
          '</label>' +
        '</div>'
      : '';

    var err = m.error
      ? '<div class="section"><div class="banner banner--error" role="alert" data-testid="manual-error">' + ico('alert') +
        '<div><strong>Save failed</strong>' + esc(m.error) + '</div></div></div>'
      : '';

    if (!m.days.length) {
      return '<div class="body" role="main" data-testid="manual-empty">' + err + head +
        '<div class="empty section">' +
          '<span class="empty__ico">' + ico('layers', 'ico--lg') + '</span>' +
          '<h2 class="empty__title">No days yet</h2>' +
          '<p class="empty__body">A split is a list of training days. Add a day, then add the lifts you do on it.</p>' +
          '<button class="btn btn--primary" data-testid="add-day-empty" data-action="add-day">' + ico('plus') +
            '<span class="btn__label">Add a day</span></button>' +
          '<button class="btn btn--tertiary" data-testid="go-ai" data-action="go-ai">' + ico('spark') +
            '<span class="btn__label">Let LOCKED draft it</span></button>' +
        '</div>' +
      '</div>';
    }

    var hint = m.edit
      ? 'Drag a handle to reorder, or tap it to move with buttons. Tap Done when you are finished.'
      : 'Swipe a lift left to remove it. Tap Edit to reorder, rename or delete.';

    var days = '<div class="section">' +
      '<div class="section__head"><h2 class="t-label">Days</h2>' +
      '<span class="t-meta" data-num>' + m.days.length + ' · ' + exCount() + ' exercises</span></div>' +
      '<p class="t-detail" data-testid="reorder-hint">' + hint + '</p>' +
      '<div class="mt-3" data-sortlist="days">' +
        m.days.map(function (d, i) { return dayCard(d, i, m.days.length); }).join('') +
      '</div>' +
      '<button class="btn btn--secondary btn--block mt-3" data-testid="add-day" data-action="add-day">' + ico('plus') +
        '<span class="btn__label">Add a day</span></button>' +
    '</div>';

    return '<div class="body" role="main" data-testid="manual-populated" data-edit="' + (m.edit ? 'on' : 'off') + '">' +
      err + head + days + '</div>';
  }

  /* The accent fill is the unsaved work, nothing else. A clean split has no
     Save button at all: the state is told in the header instead. */
  function showBar() {
    var m = S.manual;
    return m.status === 'saving' || (m.dirty && canSave());
  }

  function manualBar() {
    if (!showBar()) return '';
    var m = S.manual;
    var busy = m.status === 'saving';
    var status = m.error ? 'Draft kept on this phone' : 'Unsaved changes';
    var label = m.error ? 'Try saving again' : 'Save split';
    var primaryClass = S.modal ? 'btn btn--secondary' : 'btn btn--primary';
    return '<div class="actionbar" role="contentinfo" aria-label="Split actions" data-testid="manual-actionbar">' +
      '<div class="actionbar__status" data-testid="manual-status">' + esc(status) + '</div>' +
      '<button class="' + primaryClass + '" data-testid="save-split" data-action="save" ' +
        (busy ? 'aria-busy="true" disabled aria-disabled="true" ' : '') + '>' +
        (busy ? '<span class="spinner"></span>' : '') +
        '<span class="btn__label">' + label + '</span></button>' +
    '</div>';
  }

  function manualScreen() {
    return '<section class="screen" data-testid="screen-manual" data-state="' + S.manual.status + '">' +
      manualHeader() + manualBody() + manualBar() + '</section>';
  }

  /* ---------------------------------------------------------------
     AI builder
     --------------------------------------------------------------- */
  var STEPS = [
    'Reading your description',
    'Choosing the training days',
    'Picking a lift for each slot',
    'Finding three alternatives per lift'
  ];

  function aiHeader() {
    var sub = S.ai.status === 'ready' ? S.ai.plan.title : 'One description, one draft';
    return '<header class="hdr" role="banner">' +
      '<button class="hdr__back" data-testid="ai-back" data-action="ai-back" aria-label="Back to the split builder">' + ico('back') + '</button>' +
      '<div class="hdr__title" role="heading" aria-level="1">' +
        '<div class="t-section">Draft a split</div>' +
        '<div class="t-meta" data-testid="ai-subtitle" data-num>' + esc(sub) + '</div>' +
      '</div>' +
    '</header>';
  }

  function aiIdleBody() {
    var examples = ['3 days, barbell only', 'Upper lower, 4 days', 'Shoulders need volume', 'No deadlifts, bad back'];
    return '<div class="body" role="main" data-testid="ai-empty">' +
      '<div class="section">' +
        '<label class="field">' +
          '<span class="field__label t-label">What do you want to train</span>' +
          '<textarea class="input" rows="4" data-testid="ai-note" data-action="ai-note" ' +
            'placeholder="Three days a week, barbell and cables, shoulders need volume." ' +
            'aria-label="Describe the split you want">' + esc(S.ai.note) + '</textarea>' +
          '<span class="field__help">Days per week, equipment, anything to avoid. One or two lines is enough.</span>' +
        '</label>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">Add a detail</h2></div>' +
        '<div class="chipwrap">' + examples.map(function (t, i) {
          return '<button class="chip" data-testid="ai-example-' + i + '" data-action="ai-example" data-text="' + esc(t) + '">' +
            ico('plus') + esc(t) + '</button>';
        }).join('') + '</div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="banner banner--info">' + ico('spark') +
        '<div><strong>Every lift comes with three alternatives</strong>Accept the draft as it stands, or swap any single lift. Nothing is required.</div></div>' +
      '</div>' +
    '</div>';
  }

  function aiLoadingBody() {
    return '<div class="body" role="main" data-testid="ai-loading">' +
      '<div class="section" aria-live="polite">' +
        '<h2 class="t-section">Building your split</h2>' +
        '<p class="t-detail mt-2" data-testid="ai-loading-note">From: “' + esc(S.ai.note) + '”</p>' +
        '<div class="card mt-4"><div class="gensteps">' + STEPS.map(function (t, i) {
          var state = i < S.ai.step ? 'done' : (i === S.ai.step ? 'active' : 'todo');
          return '<div class="genstep" data-state="' + state + '" data-testid="ai-step-' + i + '">' +
            '<span class="genstep__mark">' + (state === 'done' ? ico('check') : state === 'active' ? '<span class="spinner"></span>' : ico('circle')) + '</span>' +
            '<span>' + esc(t) + '</span></div>';
        }).join('') + '</div></div>' +
        '<p class="t-detail mt-3">Usually 6 to 10 seconds. Nothing is saved until you accept it.</p>' +
      '</div>' +
    '</div>';
  }

  function aiErrorBody() {
    return '<div class="body" role="main" data-testid="ai-error">' +
      '<div class="section">' +
        '<div class="banner banner--error" role="alert">' + ico('alert') +
        '<div><strong>The coach service did not answer</strong>' + esc(S.ai.error) + '</div></div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">Your description is kept</h2></div>' +
        '<div class="card"><p class="t-body">' + esc(S.ai.note || 'Three days a week, barbell and cables, shoulders need volume.') + '</p></div>' +
        '<button class="btn btn--secondary btn--block mt-3" data-testid="ai-edit-note" data-action="ai-edit-note">Edit the description</button>' +
        '<button class="btn btn--secondary btn--block mt-3" data-testid="ai-fallback-manual" data-action="ai-back">Build it by hand instead</button>' +
      '</div>' +
    '</div>';
  }

  function slotRow(s, day) {
    var swapped = s.choice !== 'auto';
    var sub = swapped
      ? (s.choice === 'pick' ? 'Pinned' : altOf(s).tag + ': ' + altOf(s).why)
      : '3 alternatives';
    return '<button class="row" data-testid="slot-' + s.id + '" data-action="open-swap" data-id="' + s.id + '" data-day="' + day.id + '">' +
      '<div class="row__main">' +
        '<div class="row__title">' + esc(currentName(s)) + '</div>' +
        '<div class="row__sub">' + esc(s.role) + ' · ' + esc(sub) + '</div>' +
      '</div>' +
      (swapped ? '<span class="chip chip--on">Swapped</span>' : '') +
      '<span class="row__chev">' + ico('chev') + '</span>' +
    '</button>';
  }
  function altOf(s) {
    return s.alts.filter(function (a) { return a.id === s.choice; })[0] || { tag: 'Pick', why: s.pickWhy };
  }

  function aiReadyBody() {
    var plan = S.ai.plan;
    return '<div class="body" role="main" data-testid="ai-populated">' +
      '<div class="section">' +
        '<div class="banner banner--info">' + ico('check') +
        '<div><strong>Every slot is already filled</strong>Accept it as it is, or open any lift to pick one of three alternatives.</div></div>' +
      '</div>' +
      plan.days.map(function (d) {
        return '<div class="section">' +
          '<div class="section__head"><h2 class="t-label">' + esc(d.name) + '</h2>' +
          '<span class="t-meta" data-num>' + d.slots.length + ' exercises</span></div>' +
          '<div class="card card--flush">' + d.slots.map(function (s) { return slotRow(s, d); }).join('') + '</div>' +
        '</div>';
      }).join('') +
      '<div class="section"><button class="btn btn--tertiary btn--block" data-testid="ai-regenerate" data-action="ai-regenerate">' +
        ico('swap') + '<span class="btn__label">Draft a different split</span></button></div>' +
    '</div>';
  }

  function aiBar() {
    var st = S.ai.status;
    var primaryClass = S.modal ? 'btn btn--secondary' : 'btn btn--primary';
    if (st === 'idle') {
      return '<div class="actionbar" role="contentinfo" aria-label="Split actions">' +
        '<div class="actionbar__status" data-testid="ai-status">' + (S.ai.note.trim() ? 'Ready to draft' : 'Describe it first') + '</div>' +
        '<button class="' + primaryClass + '" data-testid="ai-generate" data-action="ai-generate"' +
          (S.ai.note.trim() ? '' : ' disabled aria-disabled="true"') + '><span class="btn__label">Draft split</span></button>' +
      '</div>';
    }
    if (st === 'loading') {
      return '<div class="actionbar" role="contentinfo" aria-label="Split actions">' +
        '<button class="btn btn--tertiary" data-testid="ai-cancel" data-action="ai-cancel"><span class="btn__label">Cancel</span></button>' +
        '<div class="actionbar__status" data-testid="ai-status">Step ' + (S.ai.step + 1) + ' of ' + STEPS.length + '</div>' +
        '<button class="' + primaryClass + '" data-testid="ai-generate" aria-busy="true" disabled aria-disabled="true">' +
          '<span class="spinner"></span><span class="btn__label">Building</span></button>' +
      '</div>';
    }
    if (st === 'error') {
      return '<div class="actionbar" role="contentinfo" aria-label="Split actions">' +
        '<div class="actionbar__status" data-testid="ai-status">Nothing was sent to your splits</div>' +
        '<button class="' + primaryClass + '" data-testid="ai-retry" data-action="ai-generate"><span class="btn__label">Try again</span></button>' +
      '</div>';
    }
    return '<div class="actionbar" role="contentinfo" aria-label="Split actions">' +
      '<div class="actionbar__status" data-testid="ai-status" data-num>' + slotCount() + ' exercises · ' + swapCount() + ' swapped</div>' +
      '<button class="' + primaryClass + '" data-testid="ai-accept" data-action="ai-accept"><span class="btn__label">Use this split</span></button>' +
    '</div>';
  }

  function aiScreen() {
    var st = S.ai.status;
    var body = st === 'loading' ? aiLoadingBody() : st === 'error' ? aiErrorBody() : st === 'ready' ? aiReadyBody() : aiIdleBody();

  /* ---------------------------------------------------------------

  function swapSheet(m) {

          opt('pick', s.pick, s.pickWhy, 'Picked') +

  function pickSheet(m) {

      return !q || x.name.toLowerCase().indexOf(q) > -1 || x.muscle.toLowerCase().indexOf(q) > -1;

  function leaveDialog() {
    return '<div class="scrim" data-testid="scrim"></div>' +
      '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="leaveTitle" data-testid="leave-dialog">' +
        '<h2 class="t-section" id="leaveTitle">Save this split first?</h2>' +
        '<p class="t-detail mt-2" data-testid="leave-body">' + esc(dirtySentence()) + '</p>' +
        '<div class="dialog__acts">' +
          '<button class="btn btn--danger btn--block" data-testid="leave-discard" data-action="leave-discard"><span class="btn__label">Discard changes</span></button>' +
          '<button class="btn btn--secondary btn--block" data-testid="leave-cancel" data-action="close-modal"><span class="btn__label">Keep editing</span></button>' +

  function dirtySentence() {
    var n = S.manual.days.length, e = exCount();
    return (S.manual.name.trim() ? S.manual.name.trim() : 'This split') + ' has changes that are not saved: ' +
      n + (n === 1 ? ' day' : ' days') + ', ' + e + ' exercises.';
  }

  function toastEl() {
    if (!S.toast) return '';
    return '<div class="toast" role="status" data-testid="toast">' +
      '<div class="toast__body">' + esc(S.toast.text) + '</div>' +
      (S.toast.action ? '<button class="toast__action" data-testid="toast-action" data-action="toast-action">' + esc(S.toast.action) + '</button>' : '') +
    '</div>';
  }

  function overlays() {
    var m = S.modal;
    var html = toastEl();
    if (!m) return html;
    if (m.type === 'leave') return html + leaveDialog();
    if (m.type === 'pick') return html + pickSheet(m);
    if (m.type === 'swap') return html + swapSheet(m);
    return html;
  }

  /* ---------------------------------------------------------------
     Dev switcher
     --------------------------------------------------------------- */
  var PRESETS = [
    ['Manual · empty', function () { reset(); }],
    ['Manual · loading', function () { reset(); S.manual.status = 'loading'; }],
    ['Manual · populated', function () { reset(); var s = seedSplit(); S.manual.name = s.name; S.manual.days = s.days; S.manual.savedAt = '2 minutes ago'; }],
    ['Manual · edit mode', function () { reset(); var s = seedSplit(); S.manual.name = s.name; S.manual.days = s.days; S.manual.savedAt = '2 minutes ago'; S.manual.edit = true; }],
    ['Manual · unsaved', function () { reset(); var s = seedSplit(); S.manual.name = s.name; S.manual.days = s.days; S.manual.dirty = true; }],
    ['Manual · leave prompt', function () { reset(); var s = seedSplit(); S.manual.name = s.name; S.manual.days = s.days; S.manual.dirty = true; S.modal = { type: 'leave' }; }],
    ['Manual · save error', function () { reset(); var s = seedSplit(); S.manual.name = s.name; S.manual.days = s.days; S.manual.dirty = true; S.manual.error = 'No connection to the LOCKED server. The draft is on this phone and will go up when you are back online.'; }],
    ['AI · description', function () { reset(); S.screen = 'ai'; }],
    ['AI · generating', function () { reset(); S.screen = 'ai'; S.ai.status = 'loading'; S.ai.note = 'Three days a week, barbell and cables, shoulders need volume.'; S.ai.step = 1; }],
    ['AI · failed', function () { reset(); S.screen = 'ai'; S.ai.status = 'error'; S.ai.note = 'Three days a week, barbell and cables, shoulders need volume.'; S.ai.error = 'The request timed out after 20 seconds. Nothing was charged and nothing was saved.'; }],
    ['AI · proposal', function () { reset(); S.screen = 'ai'; S.ai.status = 'ready'; S.ai.note = 'Three days a week, barbell and cables, shoulders need volume.'; S.ai.plan = seedPlan(); }]
  ];

  function reset() {
    clearTimers();
    S.screen = 'manual';
    S.manual = { status: 'ready', name: '', days: [], dirty: false, savedAt: null, error: null, edit: false };
    S.ai = { status: 'idle', note: '', plan: null, error: null, step: 0 };
    S.lifted = null; S.dragging = null; S.modal = null; S.toast = null; S.swipe = null;
  }

  function renderDev() {
    var panel = document.getElementById('devPanel');
    var btn = document.getElementById('devToggle');
    btn.setAttribute('aria-expanded', S.dev ? 'true' : 'false');
    panel.hidden = !S.dev;
    if (!S.dev) { LKPatch(panel, ''); return; }
    LKPatch(panel, PRESETS.map(function (p, i) {
      return '<button class="dev__item" data-testid="dev-preset-' + i + '" data-dev="' + i +
        '" aria-pressed="false">' + esc(p[0]) + '</button>';
    }).join(''));
  }

  /* ---------------------------------------------------------------
     Render
     --------------------------------------------------------------- */
  var app = document.getElementById('app');
  function render() {
    var active = document.activeElement;
    var key = active && active.getAttribute ? active.getAttribute('data-testid') : null;
    var caret = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    LKPatch(app, (S.screen === 'manual' ? manualScreen() : aiScreen()) + overlays());
    if (key) {
      var next = app.querySelector('[data-testid="' + key + '"]');
      if (next) {
        next.focus({ preventScroll: true });
        if (caret !== null && typeof next.setSelectionRange === 'function') {
          try { next.setSelectionRange(caret, caret); } catch (e) {}
        }
      }
    }
    renderDev();
  }

  function toast(text, action, fn) {
    S.toast = { text: text, action: action, fn: fn };
    clearTimeout(S.toastTimer);
    S.toastTimer = setTimeout(function () { S.toast = null; render(); }, 6000);
  }

  /* ---------------------------------------------------------------
     Behaviour
     --------------------------------------------------------------- */
  function findDay(id) { return S.manual.days.filter(function (d) { return d.id === id; })[0]; }
  function markDirty() { S.manual.dirty = true; S.manual.savedAt = null; }
  function move(arr, from, to) {
    if (to < 0 || to >= arr.length) return false;
    arr.splice(to, 0, arr.splice(from, 1)[0]);
    return true;
  }

  function removeExercise(dayId, id) {
    var day = findDay(dayId);
    if (!day) return;
    var i = day.exercises.map(function (x) { return x.id; }).indexOf(id);
    if (i < 0) return;
    var removed = day.exercises.splice(i, 1)[0];
    S.swipe = null;
    markDirty();
    toast('Removed ' + removed.name + '.', 'Undo', function () { day.exercises.splice(i, 0, removed); });
    render();
  }

  function doSave() {
    S.manual.status = 'saving';
    render();
    later(function () {
      S.manual.status = 'ready';
      S.manual.dirty = false;
      S.manual.error = null;
      S.manual.savedAt = 'just now';
      S.swipe = null;
      toast('Split saved.');
      render();
    }, 600);
  }

  function runGeneration() {
    S.ai.status = 'loading';
    S.ai.step = 0;
    S.ai.error = null;
    render();
    var i = 0;
    function tick() {
      i += 1;
      if (S.ai.status !== 'loading') return;
      if (i < STEPS.length) { S.ai.step = i; render(); later(tick, 900); return; }
      S.ai.status = 'ready';
      S.ai.plan = seedPlan();
      render();
    }
    later(tick, 900);
  }

  function acceptPlan() {
    var plan = S.ai.plan;
    S.manual.name = plan.title;
    S.manual.days = plan.days.map(function (d) {
      return { id: nid('d'), name: d.name, exercises: d.slots.map(function (s) { return ex(currentName(s), s.role); }) };
    });
    S.manual.dirty = true;
    S.manual.savedAt = null;
    S.manual.edit = false;
    S.swipe = null;
    S.screen = 'manual';
    S.ai.status = 'idle';
    toast('Draft added. Save it or change anything first.');
    render();
  }

  var ACTIONS = {
    'manual-back': function () {
      if (S.manual.dirty) { S.modal = { type: 'leave' }; render(); return; }
      toast('Back to Train. Nothing was lost.');
      render();
    },
    'close-modal': function () { S.modal = null; render(); },
    'edit-toggle': function () {
      S.manual.edit = !S.manual.edit;
      S.lifted = null; S.swipe = null;
      render();
      var b = document.querySelector('[data-testid="edit-toggle"]');
      if (b) b.focus({ preventScroll: true });
    },
    'leave-discard': function () {
      S.modal = null; S.manual.dirty = false;
      toast('Changes discarded.', 'Undo', function () { S.manual.dirty = true; });
      render();
    },
    'leave-save': function () { S.modal = null; doSave(); },
    'save': function () { doSave(); },
    'add-day': function () {
      var n = S.manual.days.length + 1;
      S.manual.days.push({ id: nid('d'), name: 'Day ' + n, exercises: [] });
      markDirty(); render();
    },
    'day-remove': function (el) {
      var id = el.getAttribute('data-id');
      var i = S.manual.days.map(function (d) { return d.id; }).indexOf(id);
      var removed = S.manual.days.splice(i, 1)[0];
      if (!S.manual.days.length) S.manual.edit = false;
      S.lifted = null;
      markDirty();
      toast('Removed ' + removed.name + '.', 'Undo', function () { S.manual.days.splice(i, 0, removed); });
      render();
    },
    'ex-remove': function (el) { removeExercise(el.getAttribute('data-day'), el.getAttribute('data-id')); },
    'add-exercise': function (el) { S.modal = { type: 'pick', id: el.getAttribute('data-id'), q: '' }; render(); },
    'pick-add': function (el) {
      var day = findDay(el.getAttribute('data-id'));
      day.exercises.push(ex(el.getAttribute('data-name'), el.getAttribute('data-muscle')));
      markDirty();
      toast('Added ' + el.getAttribute('data-name') + ' to ' + day.name + '.');
      render();
    },
    'move-day': function (el) {
      var id = el.getAttribute('data-id');
      var i = S.manual.days.map(function (d) { return d.id; }).indexOf(id);
      if (move(S.manual.days, i, i + Number(el.getAttribute('data-dir')))) markDirty();
      render();
    },
    'move-ex': function (el) {
      var day = findDay(el.getAttribute('data-day'));
      var i = day.exercises.map(function (x) { return x.id; }).indexOf(el.getAttribute('data-id'));
      if (move(day.exercises, i, i + Number(el.getAttribute('data-dir')))) markDirty();
      render();
    },
    'lift-clear': function () { S.lifted = null; render(); },
    'go-ai': function () { S.screen = 'ai'; render(); },
    'ai-back': function () { S.screen = 'manual'; render(); },
    'ai-example': function (el) {
      var t = el.getAttribute('data-text');
      S.ai.note = (S.ai.note.trim() ? S.ai.note.trim().replace(/\.$/, '') + '. ' : '') + t + '.';
      render();
    },
    'ai-generate': function () { runGeneration(); },
    'ai-cancel': function () {
      S.ai.status = 'idle'; clearTimers();
      toast('Generation cancelled.');
      render();
    },
    'ai-edit-note': function () { S.ai.status = 'idle'; render(); },
    'ai-regenerate': function () { S.ai.plan = null; runGeneration(); },
    'ai-accept': function () { acceptPlan(); },
    'open-swap': function (el) { S.modal = { type: 'swap', id: el.getAttribute('data-id') }; render(); },
    'choose': function (el) {
      var id = el.getAttribute('data-id'), opt = el.getAttribute('data-opt');
      S.ai.plan.days.forEach(function (d) {
        d.slots.forEach(function (s) { if (s.id === id) s.choice = opt; });
      });
      S.modal = null;
      render();
    },
    'toast-action': function () {
      var fn = S.toast && S.toast.fn;
      S.toast = null;
      if (fn) fn();
      render();
    }
  };

  var INPUTS = {
    'split-name': function (el) { S.manual.name = el.value; markDirty(); patch(); },
    'day-name': function (el) { var d = findDay(el.getAttribute('data-id')); if (d) { d.name = el.value; markDirty(); patch(); } },
    'ai-note': function (el) { S.ai.note = el.value; patchAi(); },
    'pick-search': function (el) { S.modal.q = el.value; render(); }
  };

  /* Light patches so typing never rebuilds the field under the caret. */
  function patch() {
    /* Typing can change whether the save bar exists at all; when it does,
       fall back to a full render, which restores focus and caret. */
    if (S.manual.dirty && !document.querySelector('.hdr .dot')) { render(); return; }
    var bar = document.querySelector('[data-testid="manual-actionbar"]');
    if (!!bar !== showBar()) { render(); return; }
    var title = document.querySelector('[data-testid="manual-title"]');
    if (title) title.textContent = S.manual.name.trim() || 'New split';
    var sub = document.querySelector('[data-testid="manual-subtitle"]');
    if (sub) sub.textContent = 'Unsaved changes';
    var st = document.querySelector('[data-testid="manual-status"]');
    if (st) st.textContent = S.manual.error ? 'Draft kept on this phone' : 'Unsaved changes';
  }
  function patchAi() {
    var st = document.querySelector('[data-testid="ai-status"]');
    if (st) st.textContent = S.ai.note.trim() ? 'Ready to draft' : 'Describe it first';
    var b = document.querySelector('[data-testid="ai-generate"]');
    if (b) { b.disabled = !S.ai.note.trim(); b.setAttribute('aria-disabled', String(!S.ai.note.trim())); }
  }

  document.addEventListener('click', function (e) {
    var dev = e.target.closest('[data-dev]');
    if (dev) { PRESETS[Number(dev.getAttribute('data-dev'))][1](); S.dev = false; render(); return; }
    if (e.target.closest('#devToggle')) { S.dev = !S.dev; renderDev(); return; }
    var grip = e.target.closest('[data-grip]');
    if (grip) {
      if (grip.dataset.dragged === '1') { grip.dataset.dragged = ''; return; }
      var id = grip.getAttribute('data-testid');
      S.lifted = S.lifted === id ? null : id;
      render();
      return;
    }
    var el = e.target.closest('[data-action]');
    if (S.swipe && !(el && el.getAttribute('data-action') === 'ex-remove')) {
      S.swipe = null;
      if (!el) { render(); return; }
    }
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.getAttribute('data-action')];
    if (fn) { e.preventDefault(); fn(el); }
  });

  document.addEventListener('input', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var fn = INPUTS[el.getAttribute('data-action')];
    if (fn) fn(el);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.modal) { S.modal = null; render(); return; }
    if (e.key === 'Escape' && S.swipe) { S.swipe = null; render(); return; }
    if (e.key === 'Escape' && S.manual.edit && S.screen === 'manual') {
      S.manual.edit = false; S.lifted = null; render(); return;
    }
    var grip = e.target.closest && e.target.closest('[data-grip]');
    if (!grip || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    var dir = e.key === 'ArrowUp' ? -1 : 1;
    var item = grip.closest('[data-sortable]');
    var dayId = item.getAttribute('data-day');
    if (dayId) {
      var day = findDay(dayId);
      var i = day.exercises.map(function (x) { return x.id; }).indexOf(item.getAttribute('data-id'));
      if (move(day.exercises, i, i + dir)) markDirty();
    } else {
      var j = S.manual.days.map(function (d) { return d.id; }).indexOf(item.getAttribute('data-id'));
      if (move(S.manual.days, j, j + dir)) markDirty();
    }
    S.lifted = grip.getAttribute('data-testid');
    render();
  });

  /* Swipe left to remove, the iOS gesture, available only at rest. A short
     swipe parks the row open with a single red Delete; a swipe past 45% of
     the row removes it outright. Either way an Undo toast follows. */
  document.addEventListener('pointerdown', function (e) {
    if (S.screen !== 'manual' || S.manual.edit) return;
    var wrap = e.target.closest('[data-swipe]');
    if (!wrap) return;
    var pane = wrap.querySelector('.swipe__pane');
    var startX = e.clientX, startY = e.clientY;
    var reveal = 88;                                  /* --sp-6 * 2 + --sp-5 */
    var base = wrap.getAttribute('data-open') === 'true' ? -reveal : 0;
    var axis = null, dx = base;

    function onMove(ev) {
      if (axis === null) {
        var ax = Math.abs(ev.clientX - startX), ay = Math.abs(ev.clientY - startY);
        if (ax < 8 && ay < 8) return;
        axis = ax > ay ? 'x' : 'y';
        if (axis === 'x') pane.style.transition = 'none';
      }
      if (axis !== 'x') return;
      if (ev.cancelable) ev.preventDefault();
      dx = Math.min(0, Math.max(-wrap.offsetWidth, base + (ev.clientX - startX)));
      pane.style.transform = 'translateX(' + dx + 'px)';
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      if (axis !== 'x') return;
      pane.style.transition = '';
      pane.style.transform = '';
      var id = wrap.getAttribute('data-id');
      if (dx <= -(wrap.offsetWidth * 0.45)) { removeExercise(wrap.getAttribute('data-day'), id); return; }
      S.swipe = dx <= -(reveal / 2) ? id : null;
      render();
    }
    document.addEventListener('pointermove', onMove, { passive: false });
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });

  /* Drag to reorder. Starts on the first pixel of movement, no long press,
     and a press that does not move is a tap that lifts the item instead. */
  document.addEventListener('pointerdown', function (e) {
    var grip = e.target.closest('[data-grip]');
    if (!grip) return;
    var item = grip.closest('[data-sortable]');
    var list = item.parentElement;
    var startY = e.clientY;
    var moved = false;
    var dayId = item.getAttribute('data-day');
    var arr = dayId ? findDay(dayId).exercises : S.manual.days;
    var ids = arr.map(function (o) { return o.id; });
    var index = ids.indexOf(item.getAttribute('data-id'));
    var rects = [].slice.call(list.querySelectorAll(':scope > [data-sortable]')).map(function (n) { return n.getBoundingClientRect(); });
    grip.setPointerCapture(e.pointerId);

    function onMove(ev) {
      if (!moved && Math.abs(ev.clientY - startY) < 6) return;
      if (!moved) { moved = true; S.dragging = grip.getAttribute('data-testid'); S.lifted = null; }
      var target = index;
      for (var k = 0; k < rects.length; k++) {
        var c = rects[k].top + rects[k].height / 2;
        if (k < index && ev.clientY < c) { target = k; break; }

      .map(function (g) { return g[1]; }).slice(0, 2);
    if (!near.length) near = ['Chest', 'Back'];
    return near.concat(['Dumbbell', 'Cable']).slice(0, 4);
  }

  function viewCustomEmpty() {
    return '<div class="empty" data-testid="state-empty">' +
      '<span class="empty__ico">' + ico('star', 'ico--lg') + '</span>' +
      '<h2 class="empty__title">No custom exercises</h2>' +
      '<p class="empty__body">Add a lift your gym has and the catalogue does not. It appears in browse, in search and in the counts, next to the rest.</p>' +
      '<button class="btn btn--primary" type="button" data-action="create" data-testid="create-custom">' +
        ico('plus') + '<span class="btn__label">Create a custom exercise</span>' +
      '</button>' +
    '</div>';
  }

  function viewLoading() {
    var rows = '';
    for (var i = 0; i < 7; i++) {
      rows += '<div class="row"><span class="row__main stack stack--2">' +
        '<span class="skel" style="height: var(--sp-4); width: ' + (72 - i * 4) + '%"></span>' +
        '<span class="skel" style="height: var(--sp-3); width: ' + (48 - i * 2) + '%"></span>' +
      '</span></div>';
    }
    return head('Muscle groups', 'Loading') +
      '<div class="card card--flush gutter" role="status" aria-busy="true" aria-label="Loading the exercise library" data-testid="state-loading">' + rows + '</div>';
  }

  function viewError() {
    return '<div class="gutter mt-4" data-testid="state-error">' +
      '<div class="banner banner--error">' + ico('alert') +
        '<span><strong>The exercise list did not load</strong>LOCKED could not read the catalogue on this device. Your ' +
        n(S.customs.length) + ' custom exercises are still here.</span>' +
      '</div>' +
      '<button class="btn btn--primary btn--block mt-4" type="button" data-action="retry" data-testid="retry">' +
        '<span class="btn__label">Try again</span></button>' +
      '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="filter" data-filter="custom" data-testid="show-customs">' +
        '<span class="btn__label">Show my custom exercises</span></button>' +
    '</div>';
  }

  function renderBody() {
    if (S.status === 'loading') return viewLoading();
    if (S.status === 'error') return viewError();
    if (S.q.trim()) return viewResults();
    if (S.filter === 'custom') {
      var list = pool();
      if (!list.length) return viewCustomEmpty();
      return head('Custom exercises', n(list.length)) +
        listCard(list.map(exRow).concat([
          '<button class="row" type="button" data-action="create" data-testid="create-custom">' +
            '<span class="ico-well">' + ico('plus') + '</span>' +
            '<span class="row__main stack"><span class="row__title accent">Create a custom exercise</span>' +
            '<span class="row__sub">A lift your gym has and the catalogue does not</span></span>' +
          '</button>'
        ]));
    }
    if (S.gid) return viewGroup(S.gid);
    return viewGroups();
  }

  /* ---------------------------------------------------------------
     Detail sheet
     --------------------------------------------------------------- */
  function spark(trend) {
    var w = 240, h = 44, min = Math.min.apply(null, trend), max = Math.max.apply(null, trend);
    var span = (max - min) || 1;
    var pts = trend.map(function (v, i) {
      var x = (i / (trend.length - 1)) * (w - 8) + 4;
      var y = h - 6 - ((v - min) / span) * (h - 14);
      return [x, y];
    });
    var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    return '<svg class="chart chart--quiet" viewBox="0 0 ' + w + ' ' + h + '" height="' + h + '" aria-hidden="true" focusable="false">' +
      '<path class="chart__line" d="' + d + '"/>' +
      '<circle class="chart__dot" cx="' + pts[pts.length - 1][0].toFixed(1) + '" cy="' + pts[pts.length - 1][1].toFixed(1) + '" r="3"/>' +
    '</svg>';
  }

  function historyBlock(it) {
    var h = HISTORY[it.id];
    if (!h) {
      return '<div class="section"><div class="section__head"><h3 class="t-label">Your history</h3></div>' +
        '<p class="t-detail">No sets logged yet. The first time you log this lift, your last and best set appear here.</p></div>';
    }
    return '<div class="section"><div class="section__head"><h3 class="t-label">Your history</h3>' +
      '<span class="t-meta">Last 6 sessions</span></div>' +
      '<div class="facts">' +
        '<div class="stat"><span class="stat__label">Last set</span>' +
          '<span class="stat__value">' + n(h.last.kg) + '<span class="stat__unit"> kg</span></span>' +
          '<span class="t-detail">' + n(h.last.reps) + ' reps &middot; ' + when(h.last.daysAgo, h.last.iso) + '</span></div>' +
        '<div class="stat"><span class="stat__label">Best set</span>' +
          '<span class="stat__value">' + n(h.best.kg) + '<span class="stat__unit"> kg</span></span>' +
          '<span class="t-detail">' + n(h.best.reps) + ' reps &middot; ' + when(99, h.best.iso) + '</span></div>' +
      '</div>' +
      '<div class="mt-3">' + spark(h.trend) +
        '<div class="spread"><span class="t-meta">' + kg(h.trend[0]) + ', 6 sessions ago</span>' +
        '<span class="t-meta">' + kg(h.trend[h.trend.length - 1]) + ', last</span></div>' +
      '</div>' +
    '</div>';
  }

  function factsBlock(it) {
    return '<div class="facts mt-4">' +
      '<div class="stack stack--1"><span class="t-label">Muscle group</span><span class="t-body-em">' + esc(it.group) + '</span></div>' +
      '<div class="stack stack--1"><span class="t-label">Region</span><span class="t-body-em">' + esc(it.muscle) + '</span></div>' +
      '<div class="stack stack--1"><span class="t-label">Equipment</span><span class="t-body-em">' + esc(it.eq) + '</span></div>' +
      '<div class="stack stack--1"><span class="t-label">In your splits</span><span class="t-body-em">' +
        (IN_SPLIT[it.id] ? esc(IN_SPLIT[it.id]) : 'Not in a split') + '</span></div>' +
    '</div>';
  }

  /* The demonstration slot only exists when there is a clip to show.
     It is never the sheet's subject, so its three states are three small
     things in one 16:9 box, not a void. */
  function mediaBlock(it) {
    if (S.media === 'none') return '';
    var inner;
    if (S.media === 'loading') {
      inner = '<div class="media" role="status" aria-busy="true" aria-label="Loading the demonstration clip" data-testid="media-loading">' +
        '<span class="skel media__art"></span></div>';
    } else if (S.media === 'error') {
      inner = '<div class="banner banner--warn" data-testid="media-error">' + ico('alert') +
        '<span><strong>The demonstration clip did not load</strong>It is not stored on this device. The muscle map and your history above do not need it.</span></div>' +
        '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="media-retry" data-testid="media-retry">' +
        '<span class="btn__label">Try again</span></button>';
    } else {
      inner = '<div class="media" data-testid="media-image">' +
        '<svg class="media__art" viewBox="0 0 320 180" role="img" aria-label="Demonstration: the top and bottom position of ' + esc(it.name) + '" focusable="false">' +
          '<rect class="demofig" x="0" y="0" width="320" height="180"/>' +
          '<g class="demofig"><circle cx="96" cy="60" r="14"/><rect x="70" y="78" width="52" height="54" rx="10"/>' +
            '<rect x="52" y="82" width="16" height="40" rx="8"/><rect x="124" y="82" width="16" height="40" rx="8"/>' +
            '<rect x="78" y="132" width="16" height="34" rx="8"/><rect x="98" y="132" width="16" height="34" rx="8"/></g>' +
          '<g class="demofig--end"><circle cx="224" cy="60" r="14"/><rect x="198" y="78" width="52" height="54" rx="10"/>' +
            '<rect x="180" y="70" width="16" height="40" rx="8"/><rect x="252" y="70" width="16" height="40" rx="8"/>' +
            '<rect x="206" y="132" width="16" height="34" rx="8"/><rect x="226" y="132" width="16" height="34" rx="8"/></g>' +
        '</svg></div>';
    }
    return '<div class="section"><div class="section__head"><h3 class="t-label">Demonstration</h3></div>' + inner + '</div>';
  }

  function actions(it) {
    var primary, secondary = '';
    if (S.entry === 'picker') {
      primary = ['add-day', 'Add to Push', 'plus'];
    } else if (S.entry === 'active') {
      primary = ['add-workout', 'Add to today&rsquo;s workout', 'plus'];
      secondary = 'Add to a split day';
    } else {
      primary = ['start', 'Start a workout with this', 'play'];
      secondary = 'Add to a split day';
    }
    return '<div class="sheet__foot mt-4">' +
      '<button class="btn btn--primary btn--block" type="button" data-action="' + primary[0] + '" data-id="' + it.id + '" data-testid="sheet-primary">' +
        ico(primary[2]) + '<span class="btn__label">' + primary[1] + '</span></button>' +
      (secondary
        ? '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="choose-day" data-id="' + it.id + '" data-testid="sheet-secondary">' +
            '<span class="btn__label">' + secondary + '</span></button>'
        : '') +
    '</div>';
  }

  function sheetDetail(it) {
    return '<div class="scrim" data-action="close-sheet" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-testid="sheet-detail" data-media="' + S.media + '">' +
        '<div class="sheet__grab"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-section grow" id="sheet-title">' + esc(it.name) +
            (it.custom ? ' <span class="badge badge--accent">Custom</span>' : '') + '</h2>' +
          '<button class="iconbtn" type="button" data-action="close-sheet" data-testid="sheet-close" aria-label="Close">' + ico('close') + '</button>' +
        '</div>' +
        '<div class="sheet__body" tabindex="0">' +
          bodymap(it) +
          factsBlock(it) +
          historyBlock(it) +
          mediaBlock(it) +
        '</div>' +
        actions(it) +
      '</div>';
  }

  function sheetDays(it) {
    return '<div class="scrim" data-action="close-days" data-testid="scrim-days"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="days-title" data-testid="sheet-days">' +
        '<div class="sheet__grab"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-section grow" id="days-title">Add ' + esc(it.name) + ' to</h2>' +
          '<button class="iconbtn" type="button" data-action="close-days" data-testid="days-close" aria-label="Close">' + ico('close') + '</button>' +
        '</div>' +
        '<div class="sheet__body" tabindex="0">' +
          '<div class="card card--flush">' + SPLIT_DAYS.map(function (d) {
            return '<button class="row" type="button" data-action="add-day" data-day="' + d.id + '" data-id="' + it.id + '" data-testid="row-day-' + d.id + '">' +
              '<span class="row__main stack"><span class="row__title">' + esc(d.name) + '</span>' +
              '<span class="row__sub">' + esc(d.split) + ' &middot; ' + n(d.count) + ' exercises</span></span>' +
              '<span class="row__chev">' + ico('chev') + '</span></button>';
          }).join('') + '</div>' +
        '</div>' +
      '</div>';
  }

  function sheetCreate() {
    var d = S.create, subs = GROUP_INDEX[GORDER[d.gid]][2];
    return '<div class="scrim" data-action="close-create" data-testid="scrim-create"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="create-title" data-testid="sheet-create">' +
        '<div class="sheet__grab"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-section grow" id="create-title">New exercise</h2>' +
          '<button class="iconbtn" type="button" data-action="close-create" data-testid="create-close" aria-label="Close">' + ico('close') + '</button>' +
        '</div>' +
        '<div class="sheet__body" tabindex="0">' +
          '<label class="field"><span class="field__label t-label">Name</span>' +
            '<input class="input" id="cname" type="text" value="' + esc(d.name) + '" data-action="cname" data-testid="create-name" placeholder="Machine decline press"></label>' +
          '<label class="field mt-4"><span class="field__label t-label">Muscle group</span>' +
            '<select class="input" id="cgroup" data-action="cgroup" data-testid="create-group">' +
              GROUP_INDEX.map(function (g) {
                return '<option value="' + g[0] + '"' + (g[0] === d.gid ? ' selected' : '') + '>' + esc(g[1]) + '</option>';
              }).join('') + '</select></label>' +
          '<label class="field mt-4"><span class="field__label t-label">Region</span>' +
            '<select class="input" id="csub" data-action="csub" data-testid="create-sub">' +
              subs.map(function (s) {
                return '<option value="' + s[0] + '"' + (s[0] === d.sid ? ' selected' : '') + '>' + esc(s[1]) + '</option>';
              }).join('') + '</select></label>' +
          '<p class="field__help">It is saved on this device and appears in browse, search and the counts.</p>' +
        '</div>' +
        '<div class="sheet__foot mt-4">' +
          '<button class="btn btn--primary btn--block" type="button" data-action="save-custom" data-testid="create-save"' +
            (d.name.trim() ? '' : ' disabled') + '>' + ico('plus') + '<span class="btn__label">Save exercise</span></button>' +
        '</div>' +
    '</div>';
  }

  function renderLayer() {
    var html = '';
    if (S.create) html = sheetCreate();
    else if (S.days && S.sheet) html = sheetDays(byId(S.sheet));
    else if (S.sheet) { var it = byId(S.sheet); if (it) html = sheetDetail(it); }
    if (S.toast) {
      html += '<div class="toast" role="status" data-testid="toast"><span class="toast__body">' + S.toast.text + '</span>' +
        (S.toast.undo ? '<button class="toast__action" type="button" data-action="undo" data-testid="toast-undo">Undo</button>' : '') + '</div>';
    }
    return html;
  }

  /* ---------------------------------------------------------------
     Header and filters
     --------------------------------------------------------------- */
  function renderHdr() {
    var title, meta;
    if (S.gid) { title = GNAME[S.gid]; meta = n(inGroup(S.gid).length) + ' exercises'; }
    else if (S.filter === 'custom') { title = 'Custom'; meta = n(pool().length) + ' of your own'; }
    else if (S.status === 'error') { title = 'Exercises'; meta = 'List unavailable'; }
    else if (S.status === 'loading') { title = 'Exercises'; meta = 'Loading'; }
    else { title = 'Exercises'; meta = n(pool().length) + ' in the library'; }
    return (S.gid
      ? '<button class="hdr__back" type="button" data-action="back" data-testid="back" aria-label="Back to muscle groups">' + ico('back') + '</button>'
      : '') +
      '<div class="hdr__title stack stack--1">' +
        '<span class="t-meta">' + meta + '</span>' +
        '<h1 class="t-title">' + esc(title) + '</h1>' +
      '</div>';
  }

  function renderFilters() {
    if (S.status !== 'ready') return '';
    var customs = S.items.filter(function (x) { return x.custom; }).length;
    var chips = [['all', 'All ' + S.items.length], ['custom', 'Custom ' + customs]].map(function (f) {
      return '<button class="chip" type="button" data-action="filter" data-filter="' + f[0] + '" aria-pressed="' +
        (S.filter === f[0]) + '" data-testid="filter-' + f[0] + '">' + esc(f[1]) + '</button>';
    }).join('');

    /* The switch appears only where it means anything: choosing a group. Once
       a group is open, or a search is running, there is nothing on the body
       left to choose. */
    if (S.gid || S.q.trim() || S.filter === 'custom') return chips;
    return chips +
      '<div class="chiprow__end"><button class="chip chip--icon" type="button" ' +
        'data-action="browse" data-browse="' + (S.browse === 'map' ? 'list' : 'map') + '" ' +
        'data-testid="browse-toggle" aria-label="Browse by ' +
        (S.browse === 'map' ? 'list' : 'body') + '">' +
        (S.browse === 'map' ? ico('list') : ico('body')) +
        '<span>' + (S.browse === 'map' ? 'List' : 'Body') + '</span></button></div>';
  }

  /* ---------------------------------------------------------------
     Render
     --------------------------------------------------------------- */
  var screen = document.getElementById('screen');
  var hdr = document.getElementById('hdr');
  var body = document.getElementById('body');
  var layer = document.getElementById('layer');
  var input = document.getElementById('q');
  var clear = document.getElementById('clear');
  var filters = document.getElementById('filters');

  /* The figure. Mounted the first time the body is asked for and kept, so
     switching back to it is instant and the SVG is built once. */
  var libmap = document.getElementById('libmap');
  var mapFrame = document.getElementById('map');
  var FIG = null;

  function mapGroups() {
    var out = {};
    GROUP_INDEX.forEach(function (g) {
      out[g[0]] = { name: g[1], n: inGroup(g[0]).length };
    });
    return out;
  }

  function syncMap() {
    var on = S.browse === 'map' && !S.gid && !S.q.trim() &&
             S.filter !== 'custom' && S.status === 'ready';
    libmap.hidden = !on;
    if (!on) return;
    if (!FIG) {
      FIG = LKBodyMap.mount(mapFrame, {
        groups: mapGroups(), order: GROUP_INDEX.map(function (g) { return g[0]; }),
        onSelect: function (gid) {
          /* The same destination a row in the list goes to. The map is a
             second way to the group, not a second flow. */
          S.gid = gid;
          S.scope = 'group';
          render({ scrollTop: true });
        }
      });
    }
    FIG.setView(S.bodyView);
    FIG.select(null);
    var count = document.getElementById('libmap-count');
    if (count) count.textContent = pool().length + ' exercises';
    var f = document.getElementById('tab-front'), b = document.getElementById('tab-back');
    if (f) f.setAttribute('aria-selected', String(S.bodyView === 'front'));
    if (b) b.setAttribute('aria-selected', String(S.bodyView === 'back'));
  }

  function stateName() {
    if (S.status !== 'ready') return S.status;
    if (S.q.trim()) return results().length ? 'results' : 'no-results';
    if (S.filter === 'custom' && !pool().length) return 'empty';
    return S.gid ? 'group' : 'browse';
  }

  function render(opts) {
    LKPatch(hdr, renderHdr());
    LKPatch(filters, renderFilters());
    LKPatch(body, renderBody());
    LKPatch(layer, renderLayer());
    clear.hidden = !S.q;
    input.disabled = S.status !== 'ready';
    input.placeholder = S.status !== 'ready' ? 'Search'
      : (S.gid && !S.q ? 'Search ' + GNAME[S.gid] + ' and the whole library' : 'Search ' + S.items.length + ' exercises');
    syncMap();
    mountSheetFigures();
    screen.setAttribute('data-state', stateName());
    screen.setAttribute('data-entry', S.entry);
    screen.setAttribute('data-source', S.source);
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.preset === String(S.preset)));
    });
    if (opts && opts.focus) {
      var el = document.querySelector('[data-testid="' + opts.focus + '"]');
      if (el) el.focus();
    }
    if (opts && opts.scrollTop) body.scrollTop = 0;
  }

  /* ---------------------------------------------------------------
     Actions
     --------------------------------------------------------------- */
  function toast(text, undo) {
    S.toast = { text: text, undo: !!undo };
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { S.toast = null; render(); }, 4000);
  }

  var ACTIONS = {
    /* Switching between the list of groups and the body. The choice is
       remembered, because it is a preference about how a person reads
       rather than a step in a task. */
    browse: function (el) {
      S.browse = el.getAttribute('data-browse') === 'map' ? 'map' : 'list';
      try { localStorage.setItem('lk_libBrowse', S.browse); } catch (e) {}
      render({ scrollTop: true });
    },
    'body-view': function (el) {
      S.bodyView = el.getAttribute('data-view') === 'back' ? 'back' : 'front';
      if (FIG) FIG.setView(S.bodyView);
      syncMap();
    },
    group: function (el) { S.gid = el.getAttribute('data-gid'); S.scope = 'group'; render({ scrollTop: true }); },
    back: function () { S.gid = null; render({ scrollTop: true, focus: 'search-input' }); },
    filter: function (el) {
      S.filter = el.getAttribute('data-filter');
      S.gid = null;
      /* Reached from the error state: the catalogue is gone, the customs
         on this device are not, and the list says so rather than staying
         on the error. */
      if (S.status === 'error') { S.raw = []; S.status = 'ready'; rebuild(); }
      render({ scrollTop: true });
    },
    'scope-all': function () { S.scope = 'all'; render({ scrollTop: true }); },
    try: function (el) { S.q = el.getAttribute('data-q'); input.value = S.q; S.scope = 'all'; render({ scrollTop: true, focus: 'search-input' }); },
    open: function (el) {
      S.restore = 'row-ex-' + el.getAttribute('data-id');
      S.sheet = Number(el.getAttribute('data-id'));
      render({ focus: 'sheet-primary' });
    },
    'close-sheet': function () {
      var back = S.restore; S.sheet = null; S.days = false; S.restore = null;
      render({ focus: back });
    },
    'choose-day': function () { S.days = true; render({ focus: 'row-day-push' }); },
    'close-days': function () { S.days = false; render({ focus: 'sheet-secondary' }); },
    'add-day': function (el) {
      var it = byId(Number(el.getAttribute('data-id')));
      var day = el.getAttribute('data-day') || 'push';
      var d = SPLIT_DAYS.filter(function (x) { return x.id === day; })[0];
      S.days = false; S.sheet = null;
      render({ focus: S.restore });
      toast('Added ' + esc(it.name) + ' to ' + esc(d.name) + ', ' + esc(d.split) + '.', true);
      render();
    },
    'add-workout': function (el) {
      var it = byId(Number(el.getAttribute('data-id')));
      S.sheet = null;
      render({ focus: S.restore });
      toast('Added ' + esc(it.name) + ' to today&rsquo;s workout.', true);
      render();
    },
    start: function (el) {
      var it = byId(Number(el.getAttribute('data-id')));
      S.sheet = null; S.entry = 'active';
      render({ focus: S.restore });
      toast('Workout started with ' + esc(it.name) + '.', false);
      render();
    },
    undo: function () { S.toast = null; render(); toast('Removed again.', false); render(); },
    create: function () {
      S.create = { name: S.q.trim(), gid: 'chest', sid: 'upper' };
      render({ focus: 'create-name' });
    },
    'close-create': function () { S.create = null; render({ focus: 'search-input' }); },
    'save-custom': function () {
      var d = S.create;
      if (!d.name.trim()) return;
      var id = 900001 + S.customs.length + 1;
      S.customs.push({ id: id, name: d.name.trim(), eq: 'Machine', gid: d.gid, sid: d.sid });
      rebuild();
      S.create = null; S.q = ''; input.value = ''; S.filter = 'all'; S.gid = d.gid;
      render({ scrollTop: true });

     --------------------------------------------------------------- */
  function seed(rows, source) {

  }

      if (done) return; done = true;

      render();

       console error the page cannot catch. The demo opens from disk, so ask
       first and go straight to the inline catalogue when the answer is disk. */
    if (location.protocol === 'file:') {
      finish(fromTuples(FALLBACK), 'inline');

      try {
        fetch('../tests/fixtures/exercise-db.json', { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
          .then(function (rows) { finish(rows, 'fetch'); })
          .catch(function () { finish(fromTuples(FALLBACK), 'inline'); });
      } catch (err) {
        finish(fromTuples(FALLBACK), 'inline');
      }
    }
    setTimeout(function () { finish(fromTuples(FALLBACK), 'inline'); }, 1500);
  }

  /* ---------------------------------------------------------------
     Dev state switcher
     --------------------------------------------------------------- */
  var PRESETS = [
    ['Browse (library tab)', function () { reset(); }],
    ['Search: "chest"', function () { reset(); S.q = 'chest'; input.value = 'chest'; }],
    ['Search inside a group', function () { reset(); S.gid = 'back'; S.q = 'row'; input.value = 'row'; }],
    ['No results', function () { reset(); S.q = 'kettlebell swing'; input.value = 'kettlebell swing'; }],
    ['Group: Chest', function () { reset(); S.gid = 'chest'; }],
    ['Detail: logged lift', function () { reset(); S.sheet = 111; S.media = 'none'; }],
    ['Detail: never logged', function () { reset(); S.sheet = 123; S.media = 'none'; }],
    ['Detail: clip loading', function () { reset(); S.sheet = 111; S.media = 'loading'; }],
    ['Detail: clip failed', function () { reset(); S.sheet = 111; S.media = 'error'; }],
    ['Detail: clip loaded', function () { reset(); S.sheet = 111; S.media = 'image'; }],
    ['Detail: from a picker', function () { reset(); S.entry = 'picker'; S.sheet = 111; }],
    ['Detail: workout running', function () { reset(); S.entry = 'active'; S.sheet = 111; }],
    ['Create custom', function () { reset(); S.create = { name: '', gid: 'chest', sid: 'lower' }; }],
    ['Empty: no customs', function () { reset(); S.customs = []; rebuild(); S.filter = 'custom'; }],
    ['Loading', function () { reset(); S.status = 'loading'; }],
    ['Error', function () { reset(); S.status = 'error'; }]
  ];
  function reset() {
    S.q = ''; input.value = ''; S.gid = null; S.scope = 'group'; S.filter = 'all';
    S.sheet = null; S.days = false; S.create = null; S.toast = null; S.media = 'none';
    S.entry = 'tab'; S.status = 'ready'; S.customs = CUSTOMS.slice(); rebuild();
  }
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  LKPatch(menu, PRESETS.map(function (p, i) {
    return '<button class="dev__item" type="button" data-preset="' + i + '" aria-pressed="false" data-testid="dev-preset-' + i + '">' + p[0] + '</button>';
  }).join(''));
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  function applyPreset(i) {
    S.preset = i;
    PRESETS[i][1]();
    menu.hidden = true;
    toggle.setAttribute('aria-expanded', 'false');
    render({ scrollTop: true });
    if (!S.sheet && !S.create && S.status === 'ready') input.focus();
  }

  /* ---------------------------------------------------------------
     Boot. Inline data first so the screen is never blank, then the
     full catalogue if a server can serve it. The field is focused on
     arrival: the audited one was not.
     --------------------------------------------------------------- */
  seed(fromTuples(FALLBACK), 'inline');
  S.preset = 0;
  render();
  input.focus();
  /* Same reason as above: from disk the inline catalogue is the catalogue. */
  if (location.protocol !== 'file:') {
    fetch('../tests/fixtures/exercise-db.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (rows) {
        if (!Array.isArray(rows) || !rows.length) return;
        seed(rows, 'fetch');
        render();
      })
      .catch(function () { /* inline catalogue stands */ });
  }
})();

});

    $('[data-testid="setup-skip"]').textContent = last ? 'Skip and go to the app' : 'Skip this step';
    if (S.variant === 'busy') setBusy('setup-continue', true, 'Saving');

      $('#setup-name').addEventListener('input', function (e) { S.answers.name = e.target.value; });

    ] },

    { group: 'Overview', items: [
      { screen: 'overview', variant: 'populated', label: 'Plan ready', tag: 'populated' },
      { screen: 'overview', variant: 'loading', label: 'Building the week', tag: 'loading' },
      { screen: 'overview', variant: 'error', label: 'Could not build', tag: 'error' },

  function renderDevList() {

  var S = {

    email: 'cesco@locked.app',
    unit: 'kg',

     Row builders
     ============================================================= */
  function navRow(key, title, value, testid) {
    return '<button class="row" data-action="sheet" data-key="' + key + '" data-testid="' + testid + '">' +
             '<span class="row__main">' +
               '<span class="row__title">' + title + '</span>' +
               '<span class="row__sub">' + value + '</span>' +
             '</span>' +
             '<span class="row__chev">' + ICO.chev + '</span>' +
           '</button>';
  }
  function switchRow(key, title, sub, on, testid) {
    return '<div class="row">' +
             '<span class="row__main">' +
               '<span class="row__title" id="lbl-' + key + '">' + title + '</span>' +
               '<span class="row__sub">' + sub + '</span>' +
             '</span>' +
             '<button class="switch" role="switch" aria-checked="' + on + '" aria-labelledby="lbl-' + key + '" ' +
               'data-action="toggle" data-key="' + key + '" data-testid="' + testid + '">' +
               '<span class="switch__track"></span><span class="switch__knob"></span>' +
             '</button>' +
           '</div>';
  }
  function actionRow(action, title, sub, testid, danger) {
    return '<button class="row' + (danger ? ' row--danger' : '') + '" data-action="' + action + '" data-testid="' + testid + '">' +
             '<span class="row__main">' +
               '<span class="row__title">' + title + '</span>' +
               '<span class="row__sub">' + sub + '</span>' +
             '</span>' +
             (danger ? '' : '<span class="row__chev">' + ICO.chev + '</span>') +
           '</button>';
  }
  function group(label, cards) {
    return '<section class="section">' +
             '<div class="section__head"><h2 class="t-label">' + label + '</h2></div>' +
             cards +
           '</section>';
  }

  /* =============================================================
     1. Account
     ============================================================= */
  function identityRow() {
    return '<button class="row" data-action="sheet" data-key="profile" data-testid="row-identity">' +
             '<span class="hdr__initial" aria-hidden="true">' + esc(S.name.charAt(0)) + '</span>' +
             '<span class="row__main">' +
               '<span class="row__title">' + esc(S.name) + '</span>' +
               '<span class="row__sub truncate">@' + esc(S.username) + ' &middot; ' + esc(S.email) + '</span>' +
             '</span>' +
             '<span class="row__chev">' + ICO.chev + '</span>' +
           '</button>';
  }
  function bodyRow() {
    return navRow('body', 'Body and goal', bodyLine(), 'row-body');
  }

  /* The one network action on this screen. Every state it can be in is
     printed, including the one the old build could not show. */
  function syncRow() {
    var sub, btn;
    if (S.sync === 'busy') {
      sub = 'Checking for changes';
      btn = '<button class="btn btn--sm btn--secondary" aria-busy="true" disabled data-testid="sync-now">' +
              '<span class="spinner"></span><span class="btn__label">Syncing</span></button>';
    } else if (S.sync === 'failed') {
      /* FAIL CLOSED. A failure says it failed and offers the retry. It
         never renders the success line. */
      sub = '<span class="t-detail" style="color: var(--error)">Could not reach LOCKED. Nothing was sent.</span>';
      btn = '<button class="btn btn--sm btn--secondary" data-action="sync" data-testid="sync-now">' +
              '<span class="btn__label">Try again</span></button>';
    } else {
      sub = S.sync === 'ok' ? 'Synced just now' : 'Synced ' + S.syncedAt;
      btn = '<button class="btn btn--sm btn--secondary" data-action="sync" data-testid="sync-now">' +
              '<span class="btn__label">Sync now</span></button>';
    }
    return '<div class="row row--static">' +
             '<span class="row__main">' +
               '<span class="row__title">Sync</span>' +
               '<span class="row__sub">' + sub + '</span>' +
             '</span>' + btn +
           '</div>';
  }

  function accountSection() {
    var card;
    if (S.view === 'signed-in') {
      card = '<div class="card card--flush">' + identityRow() + bodyRow() + syncRow() + '</div>';
    } else if (S.view === 'guest') {
      card = '<div class="card card--flush">' +
               '<div class="row row--static">' +
                 '<span class="ico-well">' + ICO.person + '</span>' +
                 '<span class="row__main">' +
                   '<span class="row__title">Guest</span>' +
                   '<span class="row__sub">Everything is saved on this phone only.</span>' +
                 '</span>' +
               '</div>' +
               bodyRow() +
               '<div class="card__foot stack stack--2">' +
                 '<button class="btn btn--primary btn--block" data-action="create-account" data-testid="create-account">' +
                   '<span class="btn__label">Create an account</span></button>' +
                 '<p class="t-detail">Keeps your history if you lose this phone, and lets the coach read it on another one.</p>' +
                 '<button class="btn btn--tertiary btn--block" data-action="sign-in" data-testid="sign-in">' +
                   '<span class="btn__label">I already have an account</span></button>' +
               '</div>' +
             '</div>';
    } else if (S.view === 'signed-out') {
      card = '<div class="card card--flush">' +
               '<div class="row row--static">' +
                 '<span class="ico-well">' + ICO.cloud + '</span>' +
                 '<span class="row__main">' +
                   '<span class="row__title">Not signed in</span>' +
                   '<span class="row__sub">Your settings and history are still on this phone.</span>' +
                 '</span>' +
               '</div>' +
               bodyRow() +
               '<div class="card__foot stack stack--2">' +
                 '<button class="btn btn--primary btn--block" data-action="sign-in" data-testid="sign-in">' +
                   '<span class="btn__label">Sign in</span></button>' +
                 '<button class="btn btn--tertiary btn--block" data-action="create-account" data-testid="create-account">' +
                   '<span class="btn__label">Create an account</span></button>' +
               '</div>' +
             '</div>';
    } else if (S.view === 'loading') {
      card = '<div class="card" role="status" aria-busy="true" aria-label="Loading your account">' +
               '<div class="hstack hstack--3">' +
                 '<div class="skel" style="width: var(--sp-6); height: var(--sp-6); border-radius: var(--r-full)"></div>' +
                 '<div class="grow stack stack--2">' +
                   '<div class="skel" style="height: var(--sp-4); width: 40%"></div>' +
                   '<div class="skel" style="height: var(--sp-3); width: 70%"></div>' +
                 '</div>' +
               '</div>' +
               '<div class="skel mt-4" style="height: var(--sp-4); width: 55%"></div>' +
             '</div>';
    } else {
      /* Account unreachable. The preferences below are read from this
         phone, so they are shown, unchanged, and still work. */
      var busy = S.sync === 'busy';
      card = '<div class="card">' +
               '<div class="banner banner--error" role="alert">' + ICO.alert +
                 '<span><strong>Can’t reach your account</strong>' +
                 'Your settings on this phone are unchanged. Nothing has synced since 2:14 PM.</span>' +
               '</div>' +
               '<button class="btn btn--primary btn--block mt-4" data-action="sync" data-testid="retry-account"' +
                 (busy ? ' aria-busy="true" disabled' : '') + '>' +
                 (busy ? '<span class="spinner"></span>' : '') +
                 '<span class="btn__label">' + (busy ? 'Trying' : 'Try again') + '</span></button>' +
             '</div>' +
             '<div class="card card--flush">' + bodyRow() + '</div>';
    }
    return group('Account', card);
  }

  /* =============================================================
     2-4. Preferences. Read from this phone, so they render in every
     state, including the two the account cannot survive.
     ============================================================= */
  function displaySection() {
    return group('Units and display',
      '<div class="card card--flush">' +
        navRow('unit', 'Weight unit', S.unit === 'kg' ? 'Kilograms (kg)' : 'Pounds (lb)', 'row-weight-unit') +
        navRow('dist', 'Distance', S.dist === 'km' ? 'Kilometres (km)' : 'Miles (mi)', 'row-distance-unit') +
        navRow('weekStart', 'Week starts on', S.weekStart === 'mon' ? 'Monday' : 'Sunday', 'row-week-start') +
        navRow('theme', 'Appearance', window.LKTheme.label(S.theme), 'row-appearance') +
      '</div>');
