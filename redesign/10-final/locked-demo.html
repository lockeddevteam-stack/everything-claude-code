               '</div>' +
               bodyRow() +
               '<div class="card__foot stack stack--2">' +
                 '<button class="btn btn--primary btn--block" data-action="sign-in" data-testid="sign-in">' +
                   '<span class="btn__label">Sign in</span></button>' +
                 '<button class="btn btn--tertiary btn--block" data-action="create-account" data-testid="create-account">' +
                   '<span class="btn__label">Create an account</span></button>' +
               '</div>' +
             '</div>';
    } else if (S.view === 'loading') {
      card = '<div class="card" role="status" aria-busy="true" aria-label="Loading your account">' +
               '<div class="hstack hstack--3">' +
                 '<div class="skel" style="width: 32px; height: 32px; border-radius: var(--r-full)"></div>' +
                 '<div class="grow stack stack--2">' +
                   '<div class="skel" style="height: var(--sp-4); width: 40%"></div>' +
                   '<div class="skel" style="height: var(--sp-3); width: 70%"></div>' +
                 '</div>' +
               '</div>' +
               '<div class="skel mt-4" style="height: var(--sp-4); width: 55%"></div>' +
             '</div>';
    } else {
      /* Account unreachable. The preferences below are read from this
         phone, so they are shown, unchanged, and still work. */
      var busy = S.sync === 'busy';
      card = '<div class="card">' +
               '<div class="banner banner--error" role="alert">' + ICO.alert +
                 '<span><strong>Can’t reach your account</strong>' +
                 'Your settings on this phone are unchanged. Nothing has synced since 2:14 PM.</span>' +
               '</div>' +
               '<button class="btn btn--primary btn--block mt-4" data-action="sync" data-testid="retry-account"' +
                 (busy ? ' aria-busy="true" disabled' : '') + '>' +
                 (busy ? '<span class="spinner"></span>' : '') +
                 '<span class="btn__label">' + (busy ? 'Trying' : 'Try again') + '</span></button>' +
             '</div>' +
             '<div class="card card--flush">' + bodyRow() + '</div>';
    }
    return group('Account', card);
  }

  /* =============================================================
     2-4. Preferences. Read from this phone, so they render in every
     state, including the two the account cannot survive.
     ============================================================= */
  function displaySection() {
    return group('Units and display',
      '<div class="card card--flush">' +
        navRow('unit', 'Weight unit', S.unit === 'kg' ? 'Kilograms (kg)' : 'Pounds (lb)', 'row-weight-unit') +
        navRow('dist', 'Distance', S.dist === 'km' ? 'Kilometres (km)' : 'Miles (mi)', 'row-distance-unit') +
        navRow('weekStart', 'Week starts on', S.weekStart === 'mon' ? 'Monday' : 'Sunday', 'row-week-start') +
        navRow('theme', 'Appearance', S.theme === 'dark' ? 'Dark' : 'Light', 'row-appearance') +

  function trainingSection() {
    return group('Training',
      '<div class="card card--flush">' +
        switchRow('restTimer', 'Rest timer',
          S.restTimer ? 'Starts when you finish a set' : 'Off', S.restTimer, 'switch-rest-timer') +
        navRow('restSec', 'Rest between sets', secs(S.restSec), 'row-rest-length') +
        switchRow('partials', 'Count partial reps',
          S.partials ? 'Half reps count towards the set' : 'Only full reps count', S.partials, 'switch-partial-reps') +
        navRow('plateKg', 'Round weights to', plate(S.plateKg), 'row-plate-rounding') +

  function remindersSection() {
    return group('Reminders',

        navRow('reminderAt', 'Reminder time', clock(S.reminderAt), 'row-reminder-time') +
        navRow('checkin', 'Daily check-in', CHECKIN[S.checkin], 'row-checkin') +

  /* =============================================================
     5. Data and account. One-time and destructive actions, last,
     each behind a confirmation that names what it costs.
     ============================================================= */
  function dataSection() {
    var storage =
      '<div class="row row--static">' +
        '<span class="row__main">' +
          '<span class="row__title">Storage used</span>' +
          '<span class="row__sub">' + n('1.2') + ' MB of ' + n('5.0') + ' MB on this phone</span>' +
          '<span class="meter meter--quiet mt-2"><span class="meter__fill" style="width: 24%"></span></span>' +
        '</span>' +
      '</div>';

    var files =
      '<div class="card card--flush">' + storage +
        actionRow('export', 'Export a backup', 'One file with every workout, split and record', 'row-export') +
        actionRow('confirm-restore', 'Restore from a backup', 'Replaces what is on this phone', 'row-restore') +
      '</div>';

    var danger = '<div class="card card--flush">';
    if (S.view === 'signed-in') {
      danger += actionRow('confirm-sign-out', 'Sign out', 'Keeps your data on this phone', 'row-sign-out', true);
    }
    danger += actionRow('confirm-reset', 'Erase everything on this phone',
      'Workouts, splits and records. Cannot be undone', 'row-reset', true);
    if (S.view === 'signed-in') {
      danger += actionRow('confirm-delete', 'Delete your account',
        'Removes your account and everything in it', 'row-delete', true);
    }
    danger += '</div>';

    return group('Data and account', files + danger);
  }

  function screenHTML() {
    return accountSection() + displaySection() + trainingSection() + remindersSection() + dataSection();
  }

  /* =============================================================
     Sheets
     ============================================================= */
  function sheetShell(title, inner, testid) {
    return '<div class="scrim" data-action="close-sheet" data-testid="scrim"></div>' +
           '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-testid="' + testid + '">' +
             '<div class="sheet__grab"></div>' +
             '<div class="sheet__head">' +
               '<h2 class="t-section" id="sheet-title">' + title + '</h2>' +
               '<button class="iconbtn" data-action="close-sheet" data-testid="sheet-close" aria-label="Close">' +
                 ICO.close + '</button>' +
             '</div>' + inner +
           '</div>';
  }

  function optionSheet(key) {
    var spec = opts()[key];
    var list = spec.options.map(function (o) {
      var on = String(S[key]) === String(o.v);
      return '<button class="opt" role="radio" aria-checked="' + on + '" data-action="pick" data-key="' + key +
               '" data-value="' + esc(o.v) + '" data-testid="opt-' + key + '-' + esc(o.v) + '">' +
               '<span class="opt__mark">' + (on ? ICO.check : '') + '</span>' +
               '<span class="opt__main">' +
                 '<span class="opt__title">' + o.title + '</span>' +
                 (o.sub ? '<span class="opt__sub">' + o.sub + '</span>' : '') +
               '</span>' +
             '</button>';
    }).join('');
    return sheetShell(spec.title,
      '<div class="sheet__body card card--flush" role="radiogroup" aria-labelledby="sheet-title">' + list + '</div>',
      'sheet-' + key);
  }

  function profileSheet() {
    return sheetShell('Your name',
      '<div class="sheet__body">' +
        '<label class="field">' +
          '<span class="field__label t-detail">Display name</span>' +
          '<input class="input" id="f-name" value="' + esc(S.name) + '" data-testid="field-name" autocomplete="off">' +
        '</label>' +
        '<p class="field__help">@' + esc(S.username) + ' and ' + esc(S.email) + ' cannot be changed here.</p>' +
      '</div>' +
      '<div class="sheet__foot stack stack--2">' +
        '<button class="btn btn--secondary btn--block" data-action="save-name" data-testid="save-name">' +
          '<span class="btn__label">Save</span></button>' +
      '</div>', 'sheet-profile');
  }

  /* The body sheet is where defect 3 is visible: every number in it is
     derived from the stored kilogram value, so the unit row above and
     this field can never disagree. */
  function bodySheet() {
    function segField(key, label, map, testid) {
      var items = Object.keys(map).map(function (v) {
        return '<button class="seg__item" role="radio" aria-checked="' + (S.body[key] === v) + '" ' +
                 'data-action="body-set" data-key="' + key + '" data-value="' + v + '" ' +
                 'data-testid="' + testid + '-' + v + '">' + map[v] + '</button>';
      }).join('');
      return '<div class="field">' +
               '<span class="field__label t-detail">' + label + '</span>' +
               '<div class="seg seg--lg" role="radiogroup" aria-label="' + label + '">' + items + '</div>' +
             '</div>';
    }
    var b = S.body;
    var weightVal = S.unit === 'kg' ? round1(b.weightKg) : round1(b.weightKg * LB);
    var heightVal = S.unit === 'kg' ? b.heightCm : Math.round(b.heightCm / 2.54);
    return sheetShell('Body and goal',
      '<div class="sheet__body stack stack--4">' +
        '<label class="field">' +
          '<span class="field__label t-detail">Age</span>' +
          '<input class="input num" id="f-age" inputmode="numeric" value="' + b.age + '" data-testid="field-age">' +
        '</label>' +
        segField('sex', 'Sex', SEX, 'seg-sex') +
        '<label class="field">' +
          '<span class="field__label t-detail">Height in ' + (S.unit === 'kg' ? 'centimetres' : 'inches') + '</span>' +
          '<input class="input num" id="f-height" inputmode="decimal" value="' + heightVal + '" data-testid="field-height">' +
        '</label>' +
        '<label class="field">' +
          '<span class="field__label t-detail">Body weight in ' + (S.unit === 'kg' ? 'kilograms' : 'pounds') + '</span>' +
          '<input class="input num" id="f-weight" inputmode="decimal" value="' + weightVal + '" data-testid="field-weight">' +
        '</label>' +
        '<p class="field__help">Switching the weight unit converts this figure. It does not relabel it.</p>' +
        segField('goal', 'Goal', GOAL, 'seg-goal') +
      '</div>' +
      '<div class="sheet__foot stack stack--2">' +
        '<button class="btn btn--secondary btn--block" data-action="save-body" data-testid="save-body">' +
          '<span class="btn__label">Save</span></button>' +
      '</div>', 'sheet-body');
  }

  /* =============================================================
     Confirmations. Every destructive or one-time action names the
     consequence before it happens, and the safe choice is the one
     that reads normally.
     ============================================================= */
  var CONFIRM = {
    'sign-out': {
      title: 'Sign out?',
      body: 'Your workouts stay on this phone. You will need your password to sync again.',
      go: 'Sign out', danger: false, done: 'Signed out.', to: 'signed-out'
    },
    'reset': {
      title: 'Erase everything on this phone?',
      body: 'Every workout, split and record on this phone is deleted. This cannot be undone.',
      go: 'Erase everything', danger: true, done: 'Everything on this phone was erased.'
    },
    'delete': {
      title: 'Delete your account?',
      body: 'Your account and everything in it is deleted from LOCKED. This cannot be undone.',
      go: 'Delete account', danger: true, done: 'Account deleted.', to: 'guest'
    },
    'restore': {
      title: 'Restore from a backup?',
      body: 'What is on this phone is replaced by the backup file you choose.',
      go: 'Choose a file', danger: false, done: 'Nothing was replaced. No file was chosen.'
    }
  };

  function dialogHTML(id) {
    var c = CONFIRM[id];
    return '<div class="scrim" data-action="close-dialog" data-testid="scrim"></div>' +
           '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" ' +
             'aria-describedby="dlg-body" data-testid="dialog-' + id + '">' +
             '<h2 class="t-section" id="dlg-title">' + c.title + '</h2>' +
             '<p class="t-detail mt-2" id="dlg-body">' + c.body + '</p>' +
             '<div class="stack stack--2 mt-5">' +
               '<button class="btn ' + (c.danger ? 'btn--danger-solid' : 'btn--secondary') + ' btn--block" ' +
                 'data-action="confirm" data-id="' + id + '" data-testid="confirm-' + id + '">' +
                 '<span class="btn__label">' + c.go + '</span></button>' +
               '<button class="btn btn--tertiary btn--block" data-action="close-dialog" data-testid="cancel-' + id + '">' +
                 '<span class="btn__label">Cancel</span></button>' +
             '</div>' +
           '</div>';
  }

  function toastHTML() {
    return '<div class="toast toast--nonav" data-testid="toast">' +
             '<span class="toast__body">' + S.toast + '</span>' +
             '<button class="toast__action" data-action="close-toast" data-testid="toast-dismiss">Done</button>' +
           '</div>';
  }

  /* =============================================================
     Render
     ============================================================= */
  var body = document.getElementById('body');
  var overlay = document.getElementById('overlay');
  var screen = document.getElementById('screen');
  var live = document.getElementById('live');
  var lastFocus = null;

  function render() {
    screen.setAttribute('data-state', S.view);
    document.documentElement.setAttribute('data-theme', S.theme);
    body.innerHTML = screenHTML();

    var ov = '';
    if (S.sheet === 'profile') ov = profileSheet();
    else if (S.sheet === 'body') ov = bodySheet();
    else if (S.sheet) ov = optionSheet(S.sheet);
    else if (S.dialog) ov = dialogHTML(S.dialog);
    if (S.toast) ov += toastHTML();
    overlay.innerHTML = ov;

    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.view));
    });

    if (S.sheet || S.dialog) {
      var f = overlay.querySelector('[data-testid="sheet-close"]') ||
              overlay.querySelector('.dialog button');
      if (f) f.focus();
    }
  }

  function say(msg) { live.textContent = msg; }

  function openOverlay(kind, id) {
    lastFocus = document.activeElement;
    if (kind === 'sheet') { S.sheet = id; S.dialog = null; }
    else { S.dialog = id; S.sheet = null; }
    render();
  }
  function closeOverlay(testid) {
    S.sheet = null; S.dialog = null;
    render();
    var back = testid && document.querySelector('[data-testid="' + testid + '"]');
    if (back) back.focus();
    else if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }

  var toastTimer = null;
  function toast(msg) {
    S.toast = msg;
    say(msg.replace(/<[^>]+>/g, ''));
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; render(); }, 5000);
  }

  /* -------------------------------------------------------------
     The one network action. It has a busy state, it disables its
     own control while it runs, and its failure path can only report
     failure. Nothing about the result is assumed before it arrives.
     ------------------------------------------------------------- */
  var syncTimer = null;
  function syncNow() {
    if (S.sync === 'busy') return;
    S.sync = 'busy';
    render();
    say('Syncing');
    var willFail = S.view === 'error';       /* dev state: Account unreachable */
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () {
      if (willFail) {
        /* FAIL CLOSED. The old build's catch called onResult(true) and
           rendered the verified panel; a dropped connection granted
           access. A failure here reports a failure and offers the retry,
           and it is the only branch that can be reached on failure. */
        S.sync = 'failed';
        render();
        say('Sync failed. Nothing was sent.');
      } else {
        S.sync = 'ok';
        render();
        toast('Everything is up to date.');
      }
    }, 1200);
  }

  /* =============================================================
     Events
     ============================================================= */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var a = t.dataset.action;

    if (a === 'sheet') {
      openOverlay('sheet', t.dataset.key);

    } else if (a === 'close-sheet') {
      var key = S.sheet;
      closeOverlay(key === 'profile' ? 'row-identity' : key === 'body' ? 'row-body' : rowFor(key));

    } else if (a === 'toggle') {
      var k = t.dataset.key;
      S[k] = !S[k];
      render();
      var el = document.querySelector('[data-testid="' + t.dataset.testid + '"]');
      if (el) el.focus();
      say((k === 'restTimer' ? 'Rest timer ' : k === 'partials' ? 'Count partial reps ' : 'Workout reminder ') +
          (S[k] ? 'on' : 'off'));

    } else if (a === 'pick') {
      var key2 = t.dataset.key, raw = t.dataset.value;
      var before = { weightKg: S.body.weightKg, unit: S.unit };
      S[key2] = (key2 === 'restSec' || key2 === 'plateKg') ? Number(raw) : raw;
      S.sheet = null;
      render();
      var back2 = document.querySelector('[data-testid="' + rowFor(key2) + '"]');
      if (back2) back2.focus();
      /* A unit change confirms itself with both numbers, so the person
         can see the value was converted rather than relabelled. */
      if (key2 === 'unit' && before.unit !== S.unit) {
        toast(S.unit === 'lb'
          ? 'Weights now show in pounds. Your body weight, ' + round1(before.weightKg) +
            ' kg, is ' + round1(before.weightKg * LB) + ' lb.'
          : 'Weights now show in kilograms. Your body weight, ' + round1(before.weightKg * LB) +
            ' lb, is ' + round1(before.weightKg) + ' kg.');
      }

    } else if (a === 'body-set') {
      S.body[t.dataset.key] = t.dataset.value;
      render();
      var b2 = document.querySelector('[data-testid="' + t.dataset.testid + '"]');
      if (b2) b2.focus();

    } else if (a === 'save-name') {
      var nv = (document.getElementById('f-name') || {}).value;
      if (nv && nv.trim()) S.name = nv.trim();
      closeOverlay('row-identity');
      toast('Name saved.');

    } else if (a === 'save-body') {
      var age = Number((document.getElementById('f-age') || {}).value);
      var hv = Number((document.getElementById('f-height') || {}).value);
      var wv = Number((document.getElementById('f-weight') || {}).value);
      if (age > 0) S.body.age = Math.round(age);
      /* Read back into the stored unit, never into the displayed one. */
      if (hv > 0) S.body.heightCm = S.unit === 'kg' ? Math.round(hv) : Math.round(hv * 2.54);
      if (wv > 0) S.body.weightKg = S.unit === 'kg' ? round1(wv) : round1(wv / LB);
      closeOverlay('row-body');
      toast('Body and goal saved.');

    } else if (a === 'sync') {
      syncNow();

    } else if (a === 'export') {
      toast('Backup ready. LOCKED-backup-2026-09-09.json');

    } else if (a === 'create-account' || a === 'sign-in') {
      toast(a === 'sign-in' ? 'Sign in opens next.' : 'Account setup opens next.');

    } else if (a.indexOf('confirm-') === 0 && a !== 'confirm') {
      openOverlay('dialog', a.slice(8));

    } else if (a === 'confirm') {
      var c = CONFIRM[t.dataset.id];
      if (c.to) S.view = c.to;
      if (t.dataset.id === 'reset') { S.sync = 'idle'; }
      closeOverlay();
      toast(c.done);

    } else if (a === 'close-dialog') {
      var d = S.dialog;
      closeOverlay(d === 'sign-out' ? 'row-sign-out' : d === 'reset' ? 'row-reset' :
                   d === 'delete' ? 'row-delete' : 'row-restore');

    } else if (a === 'close-toast') {
      clearTimeout(toastTimer);
      S.toast = null;
      render();
    }
  });

  function rowFor(key) {
    return {
      unit: 'row-weight-unit', dist: 'row-distance-unit', weekStart: 'row-week-start',
      theme: 'row-appearance', restSec: 'row-rest-length', plateKg: 'row-plate-rounding',
      reminderAt: 'row-reminder-time', checkin: 'row-checkin',
      profile: 'row-identity', body: 'row-body'
    }[key] || 'back';
  }

  /* Keyboard: Escape closes, Tab is trapped inside an open overlay. */
  document.addEventListener('keydown', function (e) {
    var open = S.sheet || S.dialog;
    if (e.key === 'Escape' && open) {
      e.preventDefault();
      closeOverlay(S.sheet ? rowFor(S.sheet) : null);
      return;
    }
    if (e.key !== 'Tab' || !open) return;
    var f = overlay.querySelectorAll('button, input');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!overlay.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  });

  /* =============================================================
     Dev state toggle
     ============================================================= */
  var STATES = [
    ['signed-in', 'Signed in'],
    ['guest', 'Guest'],
    ['signed-out', 'Signed out'],
    ['loading', 'Loading'],
    ['error', 'Account unreachable']
  ];
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  menu.innerHTML = STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" data-testid="dev-state-' + s[0] + '">' +
             s[1] + '</button>';
  }).join('');
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (!b) return;
    S.view = b.dataset.state;
    S.sheet = null; S.dialog = null; S.toast = null;
    S.sync = b.dataset.state === 'error' ? 'failed' : 'idle';
    clearTimeout(syncTimer);
    render();
  });

  var q = new URLSearchParams(location.search);
  var want = q.get('state');
  if (want && STATES.some(function (s) { return s[0] === want; })) {
    S.view = want;
    if (want === 'error') S.sync = 'failed';
  }
  render();
})();

});
</script>

<script>
/* workout-log — original page script, unchanged, in its own closure.
   document is scoped to this screen's shadow root. */
DEMO.define("workout-log", function (document, window, location, fetch) {

(function () {
  "use strict";

  /* =============================================================
     Icons. One set, 24px box, one stroke weight.
     ============================================================= */
  function svg(d, extra) {
    return '<svg class="ico' + (extra || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + d + '</svg>';
  }
  var ICO = {
    check: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
    checkLg: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>', ' ico--lg'),
    tools: svg('<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>', ' ico--lg'),
    back: svg('<path d="M14 9H8a3 3 0 0 0 0 6h3"/><path d="m10 6-4 3 4 3"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    skip: svg('<path d="M6 5v14l9-7z"/><path d="M18 5v14"/>'),
    plate: svg('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/>'),
    swap: svg('<path d="M4 8h13l-3-3M20 16H7l3 3"/>'),
    note: svg('<path d="M6 4h9l3 3v13H6z"/><path d="M9 12h6M9 16h4"/>'),
    timer: svg('<circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5M9.5 3h5"/>'),
    trash: svg('<path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/>'),
    alert: svg('<path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/>'),
    chev: svg('<path d="m9 5 7 7-7 7"/>'),
    close: svg('<path d="m6 6 12 12M18 6 6 18"/>'),
    lift: svg('<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>')
  };

  /* =============================================================
     Formatting. Every number tabular, every weight in kg.
     ============================================================= */
  function n(v) { return '<span class="num">' + v + '</span>'; }
  function kg(v) { return n(v) + ' kg'; }
  function vol(v) { return Number(v).toLocaleString('en-US'); }
  function clock(s) {
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  /* =============================================================
     Seed. fixtures/seed-data.json: guest profile useKg:true, split
     "PPL" day Push (exIds 111, 302, 103, 311, 411). `last` is the
     Push session of 9/3/2026 — the single most useful number on this
     screen, so it is on every row and under every field.
     ============================================================= */
  var REST_SECONDS = 150;               /* 2:30, this exercise */
  var TYPES = ['warmup', 'work', 'work', 'work', 'work'];
  var LASTS = [
    { w: '37.5', r: 8 }, { w: '72.5', r: 8 }, { w: '72.5', r: 6 },
    { w: '72.5', r: 5 }, { w: '67.5', r: 5 }
  ];
  var EX = {
    id: 111, name: 'Barbell Bench Press', muscle: 'Mid Chest',
    note: 'Pinkies on rings, feet back'   /* lk_exNotes["111"] */
  };
  var UP_NEXT = [
    { id: 302, name: 'DB Shoulder Press', sets: 3, last: '25 kg &times; 9' },
    { id: 103, name: 'Incline Cable Fly', sets: 3, last: '15 kg &times; 11' },
    { id: 311, name: 'Lateral Raise', sets: 3, last: '10.5 kg &times; 15' },
    { id: 411, name: 'Tricep Pushdown', sets: 3, last: '30 kg &times; 12' }
  ];
  var PLANNED_SETS = 5 + 3 + 3 + 3 + 3;   /* 17, warm-up included */

  /* Sets already logged, per state. Progressive overload on last
     session's 72.5 kg. */
  var LOGGED = {
    populated: [['37.5', '8', ''], ['75', '8', '2'], ['75', '7', '2']],
    first: [],
    completed: [['37.5', '8', ''], ['75', '8', '2'], ['75', '7', '2'], ['75', '6', '1'], ['70', '6', '0']]
  };
  var ELAPSED = {
    populated: '18:42', first: '0:26', keypad: '18:47', rest: '19:04',
    completed: '24:10', plates: '18:44', error: '18:52', loading: '18:40', empty: '0:12'
  };

  function makeSets(logged) {
    return LASTS.map(function (l, i) {
      var v = logged[i];
      return {
        type: TYPES[i], last: l,
        w: v ? v[0] : '', r: v ? v[1] : '', rir: v ? v[2] : '',
        done: !!v
      };
    });
  }

  /* =============================================================
     State
     ============================================================= */
  var S = {
    state: 'populated',
    sets: [],
    active: 0,                                    /* index of the set being logged */
    target: 'weight',                             /* weight | reps | rir */
    pending: { weight: '', reps: '', rir: '' },
    fresh: { weight: true, reps: true, rir: true },/* true = next digit replaces */
    rest: null,                                   /* { left, total } */
    sheet: null,                                  /* 'tools' | 'plates' */
    toast: null
  };
  var timer = null, toastTimer = null, lastFocus = null;

  function activeSet() { return S.sets[S.active]; }

  /* Pending values start as last session's, marked not-yet-typed. */
  function loadPending() {
    var s = activeSet();
    if (!s) { S.pending = { weight: '', reps: '', rir: '' }; return; }
    S.pending = { weight: s.done ? s.w : s.last.w, reps: s.done ? s.r : String(s.last.r), rir: s.rir || '' };
    S.fresh = { weight: !s.done, reps: !s.done, rir: !s.done };
    S.target = 'weight';
  }

  function firstUndone() {
    for (var i = 0; i < S.sets.length; i++) if (!S.sets[i].done) return i;
    return -1;
  }
  function doneCount() { return S.sets.filter(function (s) { return s.done; }).length; }
  function volume() {
    return S.sets.reduce(function (t, s) {
      return s.done ? t + Number(s.w) * Number(s.r) : t;
    }, 0);
  }
  function isPending(field) { return S.fresh[field] && !activeSet().done; }

  /* =============================================================
     Header. Warm-ups counted: the audited header filtered them out
     and read "0 sets" after a completed warm-up.
     ============================================================= */
  function headerHTML() {
    var meta;
    if (S.state === 'loading') meta = 'Loading session';
    else if (S.state === 'empty') meta = n(ELAPSED.empty) + ' &middot; no sets yet';
    else meta = n(ELAPSED[S.state] || ELAPSED.populated) + ' &middot; ' +
      n(doneCount()) + ' of ' + n(PLANNED_SETS) + ' sets &middot; ' + kg(vol(volume()));
    return '' +
      '<div class="hdr__title stack stack--1">' +
        '<h1 class="t-section">Push</h1>' +
        '<p class="t-meta num" data-testid="session-meta">' + meta + '</p>' +
      '</div>' +
      '<button class="hdr__action hdr__action--quiet" type="button" data-action="finish" ' +
              'data-testid="finish-workout">Finish</button>';
  }

  /* =============================================================
     Set list. Rows are the record; the deck is the input. One target
     per row instead of five, and every row is at least 44px tall.
     ============================================================= */
  function setRow(s, i) {
    var live = i === S.active && !s.done;
    var label = s.type === 'warmup' ? 'Warm-up' : 'Set ' + (i - (TYPES[0] === 'warmup' ? 1 : 0) + 1);
    var mark = s.done ? 'setmark--done' : (live ? 'setmark--now' : '');
    var value, cls = 'setrow__val';
    if (s.done) value = kg(s.w) + ' &times; ' + n(s.r);
    else if (live) {
      value = (isPending('weight') ? '' : '') +
        n(S.pending.weight || '0') + ' kg &times; ' + n(S.pending.reps || '0');
      if (isPending('weight') && isPending('reps')) cls += ' setrow__val--ghost';
    } else {
      value = kg(s.last.w) + ' &times; ' + n(s.last.r);
      cls += ' setrow__val--ghost';
    }
    var rir = s.done && s.rir !== '' ? 'RIR ' + n(s.rir) : (live && S.pending.rir !== '' && !isPending('rir') ? 'RIR ' + n(S.pending.rir) : '');
    return '' +
      '<button class="row' + (live ? ' row--selected' : '') + '" type="button" ' +
              'data-action="pick-set" data-i="' + i + '" data-testid="set-' + (i + 1) + '" ' +
              'aria-label="' + label + (s.done ? ', logged ' + s.w + ' kilograms for ' + s.r + ' reps' :
                (live ? ', now logging' : ', last time ' + s.last.w + ' kilograms for ' + s.last.r + ' reps')) + '">' +
        '<span class="setmark ' + mark + '" aria-hidden="true">' + ICO.check + '</span>' +
        '<span class="row__main stack">' +
          '<span class="row__title">' + label + '</span>' +
          '<span class="row__sub">Last ' + kg(s.last.w) + ' &times; ' + n(s.last.r) + '</span>' +
        '</span>' +
        '<span class="' + cls + '">' + value + '</span>' +
        '<span class="t-meta num setrow__rir">' + rir + '</span>' +
      '</button>';
  }

  function exHeadHTML() {
    return '' +
      '<div class="exhead">' +
        '<div class="exhead__main stack stack--1">' +
          '<h2 class="t-section">' + esc(EX.name) + '</h2>' +
          '<p class="t-meta">' + EX.muscle + ' &middot; rest ' + n(clock(REST_SECONDS)) + '</p>' +
        '</div>' +
        '<button class="iconbtn" type="button" data-action="open-tools" data-testid="open-tools" ' +
                'aria-label="Exercise tools">' + ICO.tools + '</button>' +
      '</div>';
  }

  function upNextHTML() {
    return '' +
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">Up next</h2></div>' +
        '<div class="card card--flush">' +
          UP_NEXT.map(function (e) {
            return '<button class="row" type="button" data-action="pick-exercise" data-id="' + e.id + '" ' +
                           'data-testid="exercise-' + e.id + '">' +
              '<span class="ico-well">' + ICO.lift + '</span>' +
              '<span class="row__main stack">' +
                '<span class="row__title truncate">' + e.name + '</span>' +
                '<span class="row__sub">' + n(e.sets) + ' sets &middot; last ' + e.last + '</span>' +
              '</span>' +
              '<span class="row__chev">' + ICO.chev + '</span>' +
            '</button>';
          }).join('') +
        '</div>' +
        '<button class="btn btn--secondary btn--block mt-3" type="button" data-action="add-exercise" ' +
                'data-testid="add-exercise"><span class="btn__label">Add exercise</span></button>' +
      '</div>';
  }

  function listHTML() {
    var banner = S.state === 'error'
      ? '<div class="banner banner--error mt-3" data-testid="save-error">' + ICO.alert +
          '<span><strong>Set not saved</strong>This phone is offline. Your sets are kept here and sync when it reconnects.</span>' +
        '</div>'
      : '';
    return banner + exHeadHTML() +
      '<div class="card card--flush" data-testid="set-list">' +
        S.sets.map(setRow).join('') +
      '</div>' +
      '<button class="btn btn--tertiary btn--block mt-2" type="button" data-action="add-set" ' +
              'data-testid="add-set">' + ICO.plus + '<span class="btn__label">Add set</span></button>' +
      (EX.note ? '<p class="t-detail mt-3" data-testid="exercise-note">' + esc(EX.note) + '</p>' : '') +
      upNextHTML();
  }

  /* =============================================================
     The deck. Everything performed every 90 seconds, and nothing
     else, inside the bottom third of the screen.
     ============================================================= */
  function tgt(field, label, unit) {
    var raw = S.pending[field];
    var pending = isPending(field);
    var shown = raw === '' ? '—' : raw;
    var sel = S.target === field;
    return '' +
      '<button class="tgt' + (field === 'rir' ? ' tgt--rir' : '') + (pending ? ' tgt--pending' : '') + '" ' +
              'type="button" data-action="target" data-field="' + field + '" aria-pressed="' + sel + '" ' +
              'data-testid="target-' + field + '" ' +
              'aria-label="' + label + (raw === '' ? ', not set' : ', ' + raw + (unit ? ' ' + unit : '')) +
              (pending ? ', last session' : '') + '">' +
        '<span class="tgt__label">' + label + '</span>' +
        '<span class="tgt__figure">' +
          '<span class="tgt__value num" data-testid="value-' + field + '">' + shown + '</span>' +
          (unit ? '<span class="tgt__unit">' + unit + '</span>' : '') +
          (sel ? '<span class="tgt__caret" aria-hidden="true"></span>' : '') +
        '</span>' +
      '</button>';
  }

  function padHTML() {
    var noDot = S.target !== 'weight';
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(function (d) {
      return '<button class="pad__key" type="button" data-action="digit" data-d="' + d + '" ' +
             'data-testid="key-' + d + '">' + d + '</button>';
    }).join('');
    return '' +
      '<div class="padrow">' +
        '<div class="pad" data-testid="keypad">' + keys +
          '<button class="pad__key pad__key--action" type="button" data-action="digit" data-d="." ' +
                  'data-testid="key-dot" aria-label="Decimal point"' + (noDot ? ' disabled' : '') + '>.</button>' +
          '<button class="pad__key" type="button" data-action="digit" data-d="0" data-testid="key-0">0</button>' +
          '<button class="pad__key pad__key--action" type="button" data-action="back" data-testid="key-back" ' +
                  'aria-label="Delete last digit">' + ICO.back + '</button>' +
        '</div>' +
        '<button class="key-log" type="button" data-action="log" data-testid="log-set">' +
          ICO.checkLg + '<span>Log set</span>' +
        '</button>' +
      '</div>';
  }

  /* Rest strip. Above the pad, so the timer is read without hunting
     and extended without moving the hand. The meter is neutral ink:
     the screen's one accent fill belongs to Log set. */
  function restHTML() {
    if (!S.rest) return '';
    var over = S.rest.left <= 0;
    var pct = Math.max(0, Math.min(100, (S.rest.left / S.rest.total) * 100));
    return '' +
      '<div class="rest' + (over ? ' rest__done' : '') + '" data-testid="rest-timer">' +
        '<div class="rest__main stack stack--1">' +
          '<div class="spread">' +
            '<span class="rest__label">' + (over ? 'Rest done' : 'Rest') + '</span>' +
            '<span class="rest__time" data-testid="rest-remaining">' + (over ? 'Go' : clock(S.rest.left)) + '</span>' +
          '</div>' +
          '<div class="meter meter--quiet"><span class="meter__fill" style="width: ' + pct.toFixed(0) + '%"></span></div>' +
        '</div>' +
        '<button class="btn btn--secondary btn--sm" type="button" data-action="rest-add" data-testid="rest-add">' +
          '<span class="btn__label">+30 s</span></button>' +
        '<button class="iconbtn" type="button" data-action="rest-skip" data-testid="rest-skip" ' +
                'aria-label="Skip rest">' + ICO.skip + '</button>' +
      '</div>';
  }

  function deckHTML() {
    if (S.state === 'loading') {
      return '<div class="deck" data-testid="deck" aria-busy="true">' +
        '<div class="skel" style="height: 56px"></div>' +
        '<div class="skel mt-3" style="height: calc(var(--sp-6) * 7 + var(--sp-5))"></div>' +
      '</div>';
    }
    if (S.state === 'empty') {
      return '<div class="deck" data-testid="deck">' +
        '<button class="btn btn--primary btn--block" type="button" data-action="add-exercise" ' +
                'data-testid="primary-action">' + ICO.plus +
          '<span class="btn__label">Add exercise</span></button>' +
      '</div>';
    }
    if (S.state === 'completed') {
      return '<div class="deck" data-testid="deck">' +
        '<p class="t-detail center" data-testid="deck-context">' + esc(EX.name) + ' complete &middot; ' +
          n(5) + ' sets &middot; ' + kg(vol(volume())) + '</p>' +
        '<button class="btn btn--primary btn--block mt-3" type="button" data-action="next-exercise" ' +
                'data-testid="primary-action">' +
          '<span class="btn__label">Next: DB Shoulder Press</span></button>' +
        '<button class="btn btn--secondary btn--block mt-2" type="button" data-action="add-set" ' +
                'data-testid="deck-add-set"><span class="btn__label">Add a set</span></button>' +
      '</div>';
    }
    var s = activeSet();
    var label = s.type === 'warmup' ? 'Warm-up' : 'Set ' + S.active + ' of 4';
    return '' +
      '<div class="deck" data-testid="deck">' +
        restHTML() +
        '<div class="deck__ctx">' +
          '<span class="t-label" data-testid="deck-context">' + label + '</span>' +
          '<span class="t-meta num" data-testid="deck-last">Last ' + s.last.w + ' kg &times; ' + s.last.r + '</span>' +
        '</div>' +
        '<div class="tgts">' +
          tgt('weight', 'Weight', 'kg') + tgt('reps', 'Reps', '') + tgt('rir', 'RIR', '') +
        '</div>' +
        padHTML() +
      '</div>';
  }

  /* =============================================================
     Sheets. Occasional actions, one level down, behind a visible
     44x44 button rather than a 350ms hold on a 20x12 handle.
     ============================================================= */
  function toolsSheet() {
    var items = [
      ['plates', ICO.plate, 'Plate calculator', 'For ' + S.pending.weight + ' kg'],
      ['add-set', ICO.plus, 'Add set', ''],
      ['rest-settings', ICO.timer, 'Rest timer', clock(REST_SECONDS)],
      ['swap', ICO.swap, 'Swap exercise', ''],
      ['note', ICO.note, 'Exercise note', EX.note]
    ];
    return '' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="tools-title" data-testid="tools-sheet">' +
        '<div class="sheet__grab"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-section" id="tools-title">' + esc(EX.name) + '</h2>' +
          '<button class="iconbtn" type="button" data-action="close-sheet" data-testid="tools-close" ' +
                  'aria-label="Close exercise tools">' + ICO.close + '</button>' +
        '</div>' +
        '<div class="sheet__body">' +
          '<div class="card card--flush">' +
            items.map(function (it) {
              return '<button class="row" type="button" data-action="' + it[0] + '" ' +
                             'data-testid="tool-' + it[0] + '">' +
                '<span class="ico-well">' + it[1] + '</span>' +
                '<span class="row__main"><span class="row__title">' + it[2] + '</span></span>' +
                (it[3] ? '<span class="row__value truncate">' + esc(it[3]) + '</span>' : '') +
              '</button>';
            }).join('') +
          '</div>' +
          '<button class="btn btn--danger btn--block mt-3" type="button" data-action="remove-exercise" ' +
                  'data-testid="tool-remove">' + ICO.trash +
            '<span class="btn__label">Remove exercise</span></button>' +
        '</div>' +
      '</div>';
  }

  /* Plate calculator. kg only — the profile unit — because the
     audited one carried a redundant KG/LB pair on a screen that
     already had two other unit toggles. */
  var BAR_KG = 20;
  var PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
  function plateSolve(total) {
    var perSide = (total - BAR_KG) / 2, out = [], rest = perSide;
    if (perSide < 0) return { perSide: 0, out: [], short: true };
    PLATES.forEach(function (p) {
      var c = Math.floor((rest + 0.001) / p);
      if (c > 0) { out.push([p, c]); rest -= c * p; }
    });
    return { perSide: perSide, out: out, short: false, left: rest };
  }
  function plateBar(sol) {
    /* One sleeve, plates sized by mass. Drawn, so it works from disk. */
    var x = 96, parts = '';
    sol.out.forEach(function (pc) {
      for (var i = 0; i < pc[1]; i++) {
        var h = 12 + pc[0] * 1.6, w = 8;
        parts += '<rect class="platebar__plate" x="' + x + '" y="' + (32 - h / 2).toFixed(1) +
                 '" width="' + w + '" height="' + h.toFixed(1) + '" rx="2"/>';
        x += w + 3;
      }
    });
    return '<svg class="platebar" viewBox="0 0 220 64" role="img" ' +
             'aria-label="Loaded bar, ' + sol.perSide + ' kilograms a side" data-testid="plate-diagram">' +
             '<rect class="platebar__bar" x="8" y="29" width="200" height="6" rx="3"/>' +
             '<rect class="platebar__collar" x="88" y="24" width="6" height="16" rx="2"/>' +
             parts +
           '</svg>';
  }
  function platesSheet() {
    var total = Number(S.pending.weight) || Number(activeSet().last.w);
    var sol = plateSolve(total);
    return '' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="plates-title" data-testid="plates-sheet">' +
        '<div class="sheet__grab"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-section" id="plates-title">Plate calculator</h2>' +
          '<button class="iconbtn" type="button" data-action="close-sheet" data-testid="plates-close" ' +
                  'aria-label="Close plate calculator">' + ICO.close + '</button>' +
        '</div>' +
        '<div class="sheet__body">' +
          '<div class="card">' +
            '<div class="spread">' +
              '<span class="stat"><span class="stat__label">Target</span>' +
                '<span class="stat__value num">' + total + ' <span class="stat__unit">kg</span></span></span>' +
              '<span class="stat"><span class="stat__label">Each side</span>' +
                '<span class="stat__value num">' + sol.perSide + ' <span class="stat__unit">kg</span></span></span>' +
            '</div>' +
            plateBar(sol) +
            '<p class="t-detail center">Bar ' + n(BAR_KG) + ' kg &middot; ' +
              sol.out.map(function (pc) { return n(pc[0]) + ' kg &times; ' + n(pc[1]); }).join(' &middot; ') +
              ' a side</p>' +
          '</div>' +
        '</div>' +
        '<div class="sheet__foot">' +
          '<button class="btn btn--primary btn--block" type="button" data-action="apply-plates" ' +
                  'data-testid="apply-plates"><span class="btn__label">Use ' + total + ' kg for this set</span></button>' +
        '</div>' +
      '</div>';
  }

  function overlayHTML() {
    if (!S.sheet) return '';
    var inner = S.sheet === 'plates' ? platesSheet() : toolsSheet();
    return '<div class="scrim" data-action="close-sheet" data-testid="scrim"></div>' + inner;
  }

  function toastHTML() {
    if (!S.toast) return '';
    return '<div class="toast" role="status" data-testid="toast">' +
      '<span class="toast__body">' + S.toast + '</span></div>';
  }

  /* =============================================================
     Views that replace the list entirely.
     ============================================================= */
  function emptyHTML() {
    return '' +
      '<div class="empty mt-5" data-testid="empty-state">' +
        '<span class="empty__ico">' + ICO.lift + '</span>' +
        '<h2 class="empty__title">No exercises yet</h2>' +
        '<p class="empty__body">Add the first exercise and every set you log lands here.</p>' +
      '</div>';
  }
  function loadingHTML() {
    var rows = '';
    for (var i = 0; i < 5; i++) {
      rows += '<div class="row"><div class="skel" style="height: var(--sp-5); width: var(--sp-5); border-radius: var(--r-full)"></div>' +
              '<div class="row__main"><div class="skel" style="height: var(--sp-4); width: 40%"></div></div>' +
              '<div class="skel" style="height: var(--sp-4); width: calc(var(--sp-6) * 3)"></div></div>';
    }
    return '<div class="exhead"><div class="exhead__main stack stack--1">' +
             '<div class="skel" style="height: var(--sp-5); width: 60%"></div>' +
             '<div class="skel" style="height: var(--sp-3); width: 35%"></div>' +
           '</div></div>' +
           '<div class="card card--flush" role="status" aria-busy="true" aria-label="Loading sets">' + rows + '</div>';
  }

  /* =============================================================
     Render
     ============================================================= */
  var screen = document.getElementById('screen');
  var hdr = document.getElementById('hdr');
  var body = document.getElementById('body');
  var deck = document.getElementById('deck');
  var overlay = document.getElementById('overlay');
  var toastSlot = document.getElementById('toast-slot');
  var live = document.getElementById('live');
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');

  function render(keepScroll) {
    var top = keepScroll ? body.scrollTop : 0;
    screen.setAttribute('data-state', S.state);
    screen.setAttribute('data-accent', S.sheet === 'plates' ? 'sheet' : 'deck');
    hdr.innerHTML = headerHTML();
    body.innerHTML = S.state === 'empty' ? emptyHTML()
      : S.state === 'loading' ? loadingHTML() : listHTML();
    body.scrollTop = top;
    deck.innerHTML = deckHTML();
    overlay.innerHTML = overlayHTML();
    toastSlot.innerHTML = toastHTML();
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.state));
    });
    if (S.sheet) { var f = overlay.querySelector('.iconbtn'); if (f) f.focus(); }
  }

  function say(msg) {
    S.toast = msg;
    render(true);
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; render(true); }, 3200);
  }
  function announce(msg) { live.textContent = msg; }

  /* =============================================================
     Entry. Replace on the first digit, append after it. The audited
     pad pre-filled and appended, so DEL was the only editing key
     and five of fifteen taps were deletions.
     ============================================================= */
  function digit(d) {
    var t = S.target;
    if (t !== 'weight' && d === '.') return;
    if (S.fresh[t] || activeSet().done) {
      S.pending[t] = d === '.' ? '0.' : d;
      S.fresh[t] = false;
      if (activeSet().done) markUndone();
    } else {
      if (d === '.' && S.pending[t].indexOf('.') > -1) return;
      if (S.pending[t].replace('.', '').length >= 4) return;
      S.pending[t] += d;
    }
    render(true);
  }
  function backspace() {
    var t = S.target;
    S.fresh[t] = false;
    S.pending[t] = S.pending[t].slice(0, -1);
    render(true);
  }
  function markUndone() { activeSet().done = false; }

  function logSet() {
    var s = activeSet();
    if (!S.pending.weight || !S.pending.reps) {
      S.target = !S.pending.weight ? 'weight' : 'reps';
      render(true);
      announce('Enter a ' + (S.target === 'weight' ? 'weight' : 'rep count') + ' first.');
      return;
    }
    s.w = S.pending.weight; s.r = S.pending.reps; s.rir = S.pending.rir; s.done = true;
    announce((s.type === 'warmup' ? 'Warm-up' : 'Set ' + S.active) + ' logged, ' +
             s.w + ' kilograms for ' + s.r + ' reps. Rest ' + clock(REST_SECONDS) + '.');
    startRest();
    var next = firstUndone();
    if (next === -1) { S.state = 'completed'; stopRest(); render(); return; }
    S.active = next;
    loadPending();
    render(true);
  }

  function startRest() {
    S.rest = { left: REST_SECONDS, total: REST_SECONDS };
    if (timer) clearInterval(timer);
    timer = setInterval(tick, 1000);
  }
  function stopRest() {
    if (timer) { clearInterval(timer); timer = null; }
    S.rest = null;
  }
  function tick() {
    if (!S.rest) return;
    S.rest.left -= 1;
    if (S.rest.left === 0) announce('Rest done.');
    if (S.rest.left <= -5) { stopRest(); }
    render(true);
  }

  /* =============================================================
     Events. One delegated listener; every control declares its
     action on the element.
     ============================================================= */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t || t.disabled) return;
    var a = t.dataset.action;

    if (a === 'digit') { digit(t.dataset.d); return; }
    if (a === 'back') { backspace(); return; }
    if (a === 'log') { logSet(); return; }
    if (a === 'target') { S.target = t.dataset.field; render(true); return; }
    if (a === 'pick-set') {
      S.active = Number(t.dataset.i);
      loadPending();
      render(true);
      return;
    }
    if (a === 'rest-add') { if (S.rest) { S.rest.left += 30; S.rest.total += 30; render(true); } return; }
    if (a === 'rest-skip') { stopRest(); render(true); announce('Rest skipped.'); return; }
    if (a === 'open-tools') { openSheet('tools'); return; }
    if (a === 'plates') { S.sheet = 'plates'; render(true); return; }
    if (a === 'close-sheet') { closeSheet(); return; }
    if (a === 'apply-plates') {
      S.fresh.weight = false;
      closeSheet();
      say('Weight set to ' + S.pending.weight + ' kg.');
      return;
    }
    /* Everything below leaves this screen or edits the session in the
       app; in the demo each says where it goes. */
    if (a === 'finish') { say('Opens Review.'); return; }
    if (a === 'add-set') { closeSheet(); say('Adds a set to this exercise.'); return; }
    if (a === 'add-exercise') { say('Opens the exercise library.'); return; }
    if (a === 'next-exercise' || a === 'pick-exercise') { closeSheet(); say('Switches to that exercise.'); return; }
    if (a === 'rest-settings') { say('Opens rest timer settings.'); return; }
    if (a === 'swap') { closeSheet(); say('Opens replacements for this exercise.'); return; }
    if (a === 'note') { closeSheet(); say('Opens the exercise note.'); return; }
    if (a === 'remove-exercise') { closeSheet(); say('Removes the exercise. Undo in Review.'); return; }
  });

  function openSheet(kind) {
    lastFocus = document.activeElement;
    S.sheet = kind;
    render(true);
  }
  function closeSheet() {
    if (!S.sheet) return;
    S.sheet = null;
    render(true);
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }

  /* A physical keyboard types into the same entry the pad does. */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeSheet(); return; }
    if (S.sheet || S.state === 'empty' || S.state === 'loading' || S.state === 'completed') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key) || e.key === '.') { e.preventDefault(); digit(e.key); return; }
    if (e.key === 'Backspace') { e.preventDefault(); backspace(); }
  });

  /* =============================================================
     Dev state toggle
     ============================================================= */
  var STATES = [
    ['populated', 'Mid-session'],
    ['first', 'First set'],
    ['keypad', 'Keypad entry'],
    ['rest', 'Rest running'],
    ['completed', 'Exercise done'],
    ['plates', 'Plate calculator'],
    ['empty', 'Empty'],
    ['loading', 'Loading'],
    ['error', 'Error']
  ];

  function applyState(name) {
    stopRest();
    if (toastTimer) clearTimeout(toastTimer);
    S.state = name; S.sheet = null; S.toast = null;
    var logged = LOGGED[name] || (name === 'first' || name === 'empty' ? LOGGED.first
      : name === 'completed' ? LOGGED.completed : LOGGED.populated);
    S.sets = makeSets(logged);
    S.active = name === 'completed' ? S.sets.length - 1 : Math.max(0, firstUndone());
    loadPending();

    if (name === 'keypad') {
      /* Mid-entry: 77 typed over last session's 72.5, so the replace
         behaviour and the solid-vs-ghost tone are both visible. */
      S.pending.weight = '77'; S.fresh.weight = false; S.target = 'weight';
    }
    if (name === 'rest') {
      S.rest = { left: 67, total: REST_SECONDS };
      timer = setInterval(tick, 1000);
    }
    if (name === 'plates') { S.sheet = 'plates'; }
    render();
  }

  menu.innerHTML = STATES.map(function (s) {
    return '<button class="dev__item" type="button" data-state="' + s[0] + '" aria-pressed="false" ' +
      'data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join('');
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (b) applyState(b.dataset.state);
  });

  applyState(new URLSearchParams(location.search).get('state') || 'populated');
})();

});
</script>

<script>
/* review — original page script, unchanged, in its own closure.
   document is scoped to this screen's shadow root. */
DEMO.define("review", function (document, window, location, fetch) {

(function () {
  "use strict";

  /* ---- icons: one set, one stroke weight ------------------------- */
  function svg(d, extra) {
    return '<svg class="ico' + (extra || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  }
  var ICO = {
    record: svg('<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/><path d="M12 14v3M9 20h6"/>'),
    alert:  svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/>'),
    empty:  svg('<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>', ' ico--lg'),
    spark:  svg('<path d="M12 4.5 13.7 9l4.8.3-3.7 3 1.2 4.6L12 14.4 7.9 16.9 9.2 12.3l-3.7-3L10.3 9z"/>')
  };

  /* ---- formatting ------------------------------------------------ */
  function n(v) { return '<span class="num">' + v + '</span>'; }
  function kg(v) { return n(Number(v).toLocaleString('en-US')) + ' kg'; }
  /* A signed figure always prints its sign, so the colour is a second
     carrier of direction and never the only one. */
  function signedKg(v) {
    if (v === 0) return n('0') + ' kg';
    return n((v > 0 ? '+' : '−') + Math.abs(v).toLocaleString('en-US')) + ' kg';
  }
  function dir(v) { return v > 0 ? 'up' : (v < 0 ? 'down' : 'flat'); }
  function set(w, r) { return n(w) + ' kg × ' + n(r); }

  /* ---- seed --------------------------------------------------------
     Prior column is w_1788458700000 in fixtures/seed-data.json:
     "PPL - Push", 3 Sep 2026, 16 working sets, 4,266 kg, 55 min.
       Barbell Bench Press  72.5x8, 72.5x6, 72.5x5, 67.5x5  = 1715 kg
       DB Shoulder Press    25x9, 25x9, 25x8                =  650 kg
       Incline Cable Fly    15x11, 15x11, 15x10             =  480 kg
       Lateral Raise        10.5x15, 10.5x14, 10.5x12       =  430.5 kg
       Tricep Pushdown      30x12, 30x11, 30x10             =  990 kg
                                                    total     4265.5 -> 4,266 kg
     (The fixture's 37.5x8 bench warm-up is excluded, which is what
     makes the fixture's own "4266 kg" reproduce.)
     ------------------------------------------------------------------ */

  var PRIOR = { name: 'Push', dateLabel: 'Sep 3', volumeKg: 4266 };

  function lift(name, tw, tr, tvol, pw, pr, pvol) {
    /* Rounded away from zero, so the five row deltas always sum to the
       header delta rather than drifting by a half kilo. */
    var raw = tvol - pvol;
    return { name: name, top: [tw, tr], vol: tvol, priorTop: [pw, pr], priorVol: pvol,
             delta: (raw < 0 ? -1 : 1) * Math.round(Math.abs(raw)) };
  }

  /* Today, 9 Sep. Same five lifts, same order. Two variants: one where
     the bench moved and set a record, one where it held. */
  var LIFTS_RECORD = [
    lift('Barbell Bench Press', 75, 8, 1775, 72.5, 8, 1715),
    lift('DB Shoulder Press',   25, 10, 700, 25, 9, 650),
    lift('Incline Cable Fly',   15, 12, 510, 15, 11, 480),
    lift('Lateral Raise',       10.5, 13, 378, 10.5, 15, 430.5),
    lift('Tricep Pushdown',     30, 12, 1020, 30, 12, 990)
  ];
  var LIFTS_FLAT = [
    lift('Barbell Bench Press', 72.5, 8, 1715, 72.5, 8, 1715)
  ].concat(LIFTS_RECORD.slice(1));

  var DATA = {
    record: {
      title: 'Push', date: 'WED, SEP 9',
      sets: 16, volumeKg: 4383, minutes: 52,
      lifts: LIFTS_RECORD,
      /* lk_prs["111"]: the standing best at 8 reps was 72.5 kg, 3 Sep. */
      record: { lift: 'Barbell Bench Press', w: 75, r: 8, prevW: 72.5, prevDate: 'Sep 3' },
      insight: 'Bench top set has moved up 2.5 kg on every second Push since ' +
               'Aug 20. Lateral raise reps have fallen in three straight ' +
               'sessions; it runs last in the order every time.'
    },
    populated: {
      title: 'Push', date: 'WED, SEP 9',
      sets: 16, volumeKg: 4323, minutes: 49,
      lifts: LIFTS_FLAT,
      record: null,
      insight: 'Bench has held at 72.5 kg for two Push sessions while the ' +
               'accessories kept climbing. The last two top sets both ' +
               'stopped at RIR 2.'
    },
    empty:   { title: 'Push', date: 'WED, SEP 9' },
    loading: { title: 'Push', date: 'WED, SEP 9' },
    error:   { title: 'Push', date: 'WED, SEP 9', sets: 16, volumeKg: 4383, minutes: 52 }
  };

  var FEELINGS = [
    ['easy',   'Easy'],
    ['steady', 'Steady'],
    ['hard',   'Hard'],
    ['max',    'All out']
  ];

  /* ---- screen state ---------------------------------------------- */
  var S = { view: 'record', saved: false, feel: null, discardArmed: false,
            ai: 'idle', toast: null };

  /* ---- blocks ----------------------------------------------------- */

  /* The receipt line. One line, not three tiles: these are numbers the
     lifter watched accumulate, so they confirm, they do not lead. */
  function receipt(d) {
    return '<p class="t-detail mt-2" data-testid="session-totals">' +
      n(d.sets) + ' working sets · ' + kg(d.volumeKg) + ' · ' + n(d.minutes) + ' min' +
      '</p>';
  }

  /* The record. Only drawn when there is one, and it names the mark it
     beat, because "new record" without the old number is a compliment
     rather than information. */
  function recordCard(r) {
    return '' +
      '<div class="card mt-4 enter-rise" data-testid="card-record">' +
        '<div class="hstack hstack--3">' +
          '<span class="ico-well delta--up">' + ICO.record + '</span>' +
          '<div class="grow stack stack--1">' +
            '<div><span class="badge badge--success">Personal record</span></div>' +
            '<h2 class="t-section">' + r.lift + '</h2>' +
          '</div>' +
        '</div>' +
        '<p class="t-body-em mt-3 num">' + set(r.w, r.r) + '</p>' +
        '<p class="t-detail">Beat ' + set(r.prevW, r.r) + ', set ' + r.prevDate + '.</p>' +
      '</div>';
  }

  /* The comparison. The reason this screen exists: it is computed on
     the device from lk_history and needs no network. */
  function compare(d) {
    var delta = d.volumeKg - PRIOR.volumeKg;
    var pct = (delta / PRIOR.volumeKg) * 100;
    var pctText = (delta >= 0 ? '+' : '−') + Math.abs(pct).toFixed(1) + '%';

    var rows = d.lifts.map(function (l) {
      return '' +
        '<div class="row" data-testid="lift-' + l.name.toLowerCase().replace(/[^a-z]+/g, '-') + '">' +
          '<span class="row__main">' +
            '<span class="row__title">' + l.name + '</span>' +
            '<span class="row__sub">' + set(l.top[0], l.top[1]) + ', was ' +
              set(l.priorTop[0], l.priorTop[1]) + '</span>' +
          '</span>' +
          '<span class="row__value delta--' + dir(l.delta) + '">' + signedKg(l.delta) + '</span>' +
        '</div>';
    }).join('');

    return '' +
      '<div class="section" data-testid="section-compare">' +
        '<div class="section__head">' +
          '<h2 class="t-label">Against ' + PRIOR.name + ', ' + PRIOR.dateLabel + '</h2>' +
        '</div>' +
        '<div class="card enter-rise">' +
          '<div class="spread">' +
            '<div class="hero">' +
              '<span class="hero__figure">' +
                '<span class="hero__value num delta--' + dir(delta) + '" data-testid="volume-delta">' +
                  (delta >= 0 ? '+' : '−') + Math.abs(delta).toLocaleString('en-US') +
                '</span>' +
                '<span class="hero__unit">kg</span>' +
              '</span>' +
              '<span class="hero__label">Working volume</span>' +
            '</div>' +
            '<span class="t-body-em num delta--' + dir(delta) + '">' + pctText + '</span>' +
          '</div>' +
          '<p class="t-detail mt-2 num">' + kg(d.volumeKg) + ' today, ' + kg(PRIOR.volumeKg) + ' on ' + PRIOR.dateLabel + '</p>' +
        '</div>' +
        '<div class="card card--flush mt-3">' + rows + '</div>' +
        '<p class="t-meta mt-2">Change is working-set volume. Warm-ups excluded.</p>' +
      '</div>';
  }

  /* The one thing on the screen that is not measured. Dashed, labelled,
     never fetched unless asked, and a failure stays a failure. */
  function aiCard(d) {
    var inner;
    if (S.ai === 'idle') {
      inner = '<p class="t-detail">A written read on this session and the five before it. ' +
              'The figures above are computed on this phone; this is not, and saving ' +
              'does not wait for it.</p>' +
              '<button class="btn btn--secondary btn--block mt-3" data-testid="ai-ask">' +
                '<span class="btn__label">Ask coach</span></button>';
    } else if (S.ai === 'loading') {
      inner = '<div class="hstack hstack--3" role="status" aria-live="polite">' +
                '<span class="spinner"></span>' +
                '<span class="t-detail">Reading your last six Push sessions.</span>' +
              '</div>';
    } else if (S.ai === 'error') {
      inner = '<div class="banner banner--error" role="alert" data-testid="ai-error">' +
                ICO.alert +
                '<span><strong>Coach did not answer</strong>The request timed out. Your session is ' +
                'untouched and the comparison above is unaffected.</span>' +
              '</div>' +
              '<button class="btn btn--secondary btn--block mt-3" data-testid="ai-retry">' +
                '<span class="btn__label">Try again</span></button>';
    } else {
      inner = '<p class="t-detail" data-testid="ai-text">' + d.insight + '</p>';
    }
    return '' +
      '<div class="section">' +
        '<div class="card card--flush card--unverified" data-testid="card-ai">' +
          '<div class="card__head">' +
            '<span class="t-label grow">Coach note</span>' +
            '<span class="badge">Generated, not measured</span>' +
          '</div>' +
          '<div style="padding: var(--sp-4)">' + inner + '</div>' +
        '</div>' +
      '</div>';
  }

  /* Optional, secondary, and it gates nothing. One question, four
     answers, one tap, and the screen is savable with or without it. */
  function feelSection() {
    var chips = FEELINGS.map(function (f) {
      return '<button class="chip" type="button" aria-pressed="' + (S.feel === f[0]) + '" ' +
             'data-feel="' + f[0] + '" data-testid="feel-' + f[0] + '">' + f[1] + '</button>';
    }).join('');
    return '' +
      '<div class="section" data-testid="section-feel">' +
        '<div class="section__head">' +
          '<h2 class="t-label">How did it feel</h2>' +
          '<span class="t-meta">Optional</span>' +
        '</div>' +
        '<div class="chiprow" role="group" aria-label="How did it feel, optional">' + chips + '</div>' +
      '</div>';
  }

  /* Two-step, and the second step names the consequence. */
  function discardSection(sets) {
    if (S.discardArmed) {
      var what = sets
        ? 'The ' + sets + ' sets you logged are deleted and nothing is written to your history.'
        : 'This session is closed and nothing is written to your history.';
      return '' +
        '<div class="section" data-testid="section-discard">' +
          '<div class="banner banner--error" role="alert">' + ICO.alert +
            '<span><strong>Discard this session</strong>' + what + '</span></div>' +
          '<div class="hstack hstack--2 mt-3">' +
            '<button class="btn btn--secondary grow" data-testid="action-discard-cancel">' +
              '<span class="btn__label">Keep it</span></button>' +
            '<button class="btn btn--danger-solid grow" data-testid="action-discard-confirm">' +
              '<span class="btn__label">Discard</span></button>' +
          '</div>' +
        '</div>';
    }
    return '' +
      '<div class="section" data-testid="section-discard">' +
        '<button class="btn btn--danger btn--block" data-testid="action-discard">' +
          '<span class="btn__label">Discard session</span></button>' +
      '</div>';
  }

  /* ---- the pinned bar --------------------------------------------
     Save never scrolls away, so banking the session is one tap from
     the state the screen opens in, whatever the scroll position. */
  function saveBar(opts) {
    if (S.saved) {
      return '<div class="actionbar" data-testid="actionbar">' +
               '<span class="actionbar__status" role="status" data-testid="save-status">' +
                 'Saved to history</span>' +
               '<button class="btn btn--secondary" disabled data-testid="action-save">' +
                 '<span class="btn__label">Saved</span></button>' +
             '</div>';
    }
    var busy = opts && opts.disabled;
    return '<div class="actionbar" data-testid="actionbar">' +
             '<span class="actionbar__status">' + (opts && opts.status ? opts.status : '') + '</span>' +
             '<button class="btn btn--primary" data-testid="action-save"' +
               (busy ? ' disabled' : '') + '>' +
               '<span class="btn__label">Save session</span></button>' +
           '</div>';
  }

  /* ---- states ------------------------------------------------------ */
  var VIEWS = {};

  function full(d) {
    return {
      body: receipt(d) + (d.record ? recordCard(d.record) : '') + compare(d) +
            aiCard(d) + feelSection() + discardSection(d.sets),
      bar: saveBar({ status: d.record ? 'Record included' : '' })
    };
  }
  VIEWS.record = function () { return full(DATA.record); };
  VIEWS.populated = function () { return full(DATA.populated); };

  /* Nothing logged. The old screen printed WORKOUT COMPLETE over zero
     sets and left both save paths live. There is no Save control here
     at all, and the copy says what will and will not happen. */
  VIEWS.empty = function () {
    return {
      body: '<div class="empty mt-5 enter-rise" data-testid="card-nothing-logged">' +
              '<span class="empty__ico">' + ICO.empty + '</span>' +
              '<h2 class="empty__title">Nothing logged</h2>' +
              '<p class="empty__body">No sets were completed, so there is nothing to save ' +
                'and nothing will be added to your history.</p>' +
              '<button class="btn btn--primary" data-testid="action-back-to-workout">' +
                '<span class="btn__label">Back to workout</span></button>' +
            '</div>' +
            discardSection(0),
      bar: ''
    };
  };

  /* Loading. The prior session is being read off the device. Save waits,
     because a comparison is the point and a save before the totals are
     known is a save of an unknown thing. */
  VIEWS.loading = function () {
    return {
      body: '<div class="skel mt-2" style="height: var(--sp-4); width: 65%"></div>' +
            '<div class="section" role="status" aria-busy="true" aria-label="Reading your last Push session">' +
              '<div class="card">' +
                '<div class="skel" style="height: var(--sp-6); width: 45%"></div>' +
                '<div class="skel mt-3" style="height: var(--sp-4); width: 70%"></div>' +
              '</div>' +
              '<div class="card mt-3">' +
                '<div class="skel" style="height: var(--sp-5)"></div>' +
                '<div class="skel mt-4" style="height: var(--sp-5)"></div>' +
                '<div class="skel mt-4" style="height: var(--sp-5)"></div>' +
                '<div class="skel mt-4" style="height: var(--sp-5)"></div>' +
                '<div class="skel mt-4" style="height: var(--sp-5)"></div>' +
              '</div>' +
            '</div>',
      bar: saveBar({ disabled: true, status: 'Reading your last Push session' })
    };
  };

  /* Error. The comparison failed; the session did not. The failure is
     named, the totals that ARE known are still shown, and Save stays
     the primary action rather than being held hostage to a read that
     the lifter did not ask for. */
  VIEWS.error = function () {
    var d = DATA.error;
    return {
      body: receipt(d) +
            '<div class="section" data-testid="section-compare-error">' +
              '<div class="banner banner--error" role="alert">' + ICO.alert +
                '<span><strong>No comparison available</strong>' +
                'Your Sep 3 Push session could not be read, so this one cannot be measured ' +
                'against it. Saving still works.</span></div>' +
              '<button class="btn btn--secondary btn--block mt-3" data-testid="action-retry-compare">' +
                '<span class="btn__label">Try again</span></button>' +
            '</div>' +
            feelSection() + discardSection(d.sets),
      bar: saveBar({ status: '' })
    };
  };

  /* ---- render ------------------------------------------------------ */
  var STATES = [
    ['record',    'New record'],
    ['populated', 'Populated'],
    ['empty',     'Nothing logged'],
    ['loading',   'Loading'],
    ['error',     'Error']
  ];

  var body = document.getElementById('body');
  var barSlot = document.getElementById('bar-slot');
  var toastSlot = document.getElementById('toast-slot');
  var screen = document.getElementById('screen');
  var hdrDate = document.getElementById('hdr-date');
  var hdrTitle = document.getElementById('hdr-title');
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  var toastTimer = null;

  function toastHTML() {
    if (!S.toast) return '';
    return '<div class="toast" role="status" data-testid="toast">' +
             '<span class="toast__body">' + S.toast + '</span></div>';
  }

  function paint(keepScroll) {
    var top = body.scrollTop;
    var d = DATA[S.view];
    var out = VIEWS[S.view]();
    screen.setAttribute('data-state', S.view);
    hdrDate.textContent = d.date;
    hdrTitle.textContent = d.title;
    body.innerHTML = out.body;
    barSlot.innerHTML = out.bar;
    toastSlot.innerHTML = toastHTML();
    body.scrollTop = keepScroll ? top : 0;
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.view));
    });
  }

  function show(view) {
    S = { view: VIEWS[view] ? view : 'record', saved: false, feel: null,
          discardArmed: false, ai: 'idle', toast: null };
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    paint(false);
  }

  function toast(msg) {
    S.toast = msg;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; paint(true); }, 4000);
  }

  /* One delegated handler. Every control on the screen is in here, so
     there is no path that reaches a control with no behaviour. */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-testid], [data-feel]');
    if (!el) return;
    var id = el.getAttribute('data-testid');

    if (el.dataset.feel) {
      S.feel = S.feel === el.dataset.feel ? null : el.dataset.feel;
      paint(true);
      return;
    }
    switch (id) {
      case 'action-save':
        S.saved = true;
        paint(true);
        toast('Session saved' + (S.feel ? ', marked ' + S.feel : '') + '.');
        paint(true);
        return;
      case 'action-discard':
        S.discardArmed = true; paint(true); return;
      case 'action-discard-cancel':
        S.discardArmed = false; paint(true); return;
      case 'action-discard-confirm':
        S.discardArmed = false; paint(true); toast('Session discarded. Nothing was written.'); return;
      case 'ai-ask':
      case 'ai-retry':
        S.ai = 'loading'; paint(true);
        setTimeout(function () {
          if (S.view !== 'record' && S.view !== 'populated') return;
          S.ai = S.view === 'populated' ? 'error' : 'done';
          paint(true);
        }, 900);
        return;
      case 'action-retry-compare':
        show('loading');
        setTimeout(function () { if (S.view === 'loading') show('record'); }, 900);
        return;
      case 'action-back':
      case 'action-back-to-workout':
        toast('Back to the workout. Nothing was saved.'); paint(true); return;
      default:
        return;
    }
  });

  /* ---- dev toggle -------------------------------------------------- */
  menu.innerHTML = STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" ' +
           'data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join('');
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (b) show(b.dataset.state);
  });

  show(new URLSearchParams(location.search).get('state') || 'record');
})();

});
</script>

<script>DEMO.start();</script>
</body>
</html>
