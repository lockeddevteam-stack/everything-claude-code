<script>
(function () {
  "use strict";

  var CFG = window.__DEMO_CFG__;
  var GLOBAL_CSS = document.getElementById('demo-global-css').textContent;

  /* One parsed copy of the design system, adopted by every shadow root. */
  var SHEET = null;
  if (window.CSSStyleSheet && CSSStyleSheet.prototype.replaceSync) {
    try { SHEET = new CSSStyleSheet(); SHEET.replaceSync(GLOBAL_CSS); } catch (e) { SHEET = null; }
  }

  var screens = {};        /* id -> record */
  var defs = {};           /* id -> boot function */
  var order = [];
  var leaked = [];
  var booted = false;

  /* ---------------------------------------------------------------
     A document scoped to one shadow root. Every screen was written as
     a standalone page; this is what lets it keep that code unchanged.
     --------------------------------------------------------------- */
  function scopedDocument(root) {
    return new Proxy(document, {
      get: function (target, prop) {
        switch (prop) {
          case 'getElementById': return function (id) { return root.getElementById(id); };
          case 'querySelector': return function (s) { return root.querySelector(s); };
          case 'querySelectorAll': return function (s) { return root.querySelectorAll(s); };
          case 'getElementsByClassName': return function (c) { return root.querySelectorAll('.' + c); };
          case 'getElementsByTagName': return function (t) { return root.querySelectorAll(t); };
          case 'activeElement': return root.activeElement;
          case 'contains': return function (n) { return root.contains(n); };
          case 'addEventListener': return root.addEventListener.bind(root);
          case 'removeEventListener': return root.removeEventListener.bind(root);
          case 'dispatchEvent': return root.dispatchEvent.bind(root);
          default: {
            var v = target[prop];
            return typeof v === 'function' ? v.bind(target) : v;
          }
        }
      }
    });
  }

  /* A window whose writes land on the screen, not on the page. Screens ship
     test hooks (onboarding sets window.__locked); two screens setting the same
     name would otherwise overwrite each other. Reads still see the real window,
     so setTimeout, matchMedia and the rest behave normally. */
  function scopedWindow(rec, doc) {
    var store = rec.globals;
    return new Proxy(window, {
      get: function (t, p) {
        if (Object.prototype.hasOwnProperty.call(store, p)) return store[p];
        if (p === 'document') return doc;
        var v = t[p];
        return (typeof v === 'function' && !v.prototype) ? v.bind(t) : v;
      },
      set: function (t, p, v) { store[p] = v; return true; },
      has: function (t, p) { return Object.prototype.hasOwnProperty.call(store, p) || (p in t); },
      deleteProperty: function (t, p) { delete store[p]; return true; },
      getOwnPropertyDescriptor: function (t, p) {
        if (Object.prototype.hasOwnProperty.call(store, p)) {
          return { value: store[p], writable: true, enumerable: true, configurable: true };
        }
        return Object.getOwnPropertyDescriptor(t, p);
      }
    });
  }

  /* Screens fetch their seed data. Nothing is on the network here: the
     assembler inlined those files, and anything else fails fast. */
  function scopedFetch(id) {
    return function (url) {
      var key = String(url);
      var text = CFG.assets[key];
      if (text == null) return Promise.reject(new Error('demo is offline: ' + key));
      return Promise.resolve({
        ok: true, status: 200, url: key,
        json: function () { return Promise.resolve(JSON.parse(text)); },
        text: function () { return Promise.resolve(text); }
      });
    };
  }

  /* A hidden screen must never steal focus from the visible one. */
  var nativeFocus = HTMLElement.prototype.focus;
  HTMLElement.prototype.focus = function () {
    var r = this.getRootNode && this.getRootNode();
    if (r && r.host && r.host.classList && r.host.classList.contains('demo-screen') && r.host.hidden) return;
    return nativeFocus.apply(this, arguments);
  };

  function define(id, fn) { defs[id] = fn; }

  function mount(rec) {
    var host = document.createElement('div');
    host.className = 'demo-screen';
    host.id = 'demo-screen-' + rec.id;
    host.setAttribute('data-screen', rec.id);
    host.hidden = true;
    document.getElementById('demo-screens').appendChild(host);

    var root = host.attachShadow({ mode: 'open' });
    var frag = document.getElementById('demo-tpl-' + rec.id).content.cloneNode(true);

    /* The screen's own CSS has to land AFTER the design system, exactly as it
       did in the standalone page: some screens rely on cascade order rather
       than specificity (onboarding's trailing [hidden] { display: none }).
       Adopted sheets cascade after anything in the tree, so the screen's style
       is adopted second rather than left as a <style> in the tree. */
    var own = Array.prototype.slice.call(frag.querySelectorAll('style[data-screen-css]'));
    var ownCss = own.map(function (s) { return s.textContent; }).join('\n');
    own.forEach(function (s) { s.parentNode.removeChild(s); });

    if (SHEET) {
      var sheets = [SHEET];
      if (ownCss.trim()) {
        try { var s2 = new CSSStyleSheet(); s2.replaceSync(ownCss); sheets.push(s2); }
        catch (e) { var f = document.createElement('style'); f.textContent = ownCss; frag.insertBefore(f, frag.firstChild); }
      }
      root.adoptedStyleSheets = sheets;
    } else {
      var g = document.createElement('style'); g.textContent = GLOBAL_CSS; root.appendChild(g);
      if (ownCss.trim()) { var o = document.createElement('style'); o.textContent = ownCss; root.appendChild(o); }
    }
    root.appendChild(frag);

    rec.host = host;
    rec.root = root;
    return rec;
  }

  function boot(rec) {
    if (rec.booted || !defs[rec.id]) { rec.booted = true; return; }
    rec.booted = true;
    var before = Object.getOwnPropertyNames(window);
    try {
      var doc = scopedDocument(rec.root);
      defs[rec.id](doc, scopedWindow(rec, doc), window.location, scopedFetch(rec.id));
    } catch (err) {
      console.error('[demo] ' + rec.id + ' failed to boot', err);
    }
    var after = Object.getOwnPropertyNames(window);
    for (var i = 0; i < after.length; i++) {
      if (before.indexOf(after[i]) === -1 && after[i].indexOf('__DEMO') !== 0) {
        leaked.push(rec.id + ':' + after[i]);
      }
    }
  }

  /* ---------------------------------------------------------------
     Router. Hash-driven, so browser back works from file://.
       #/train                     a tab
       #/train/split-builder       a screen pushed on top of that tab
     --------------------------------------------------------------- */
  var TABS = CFG.tabs;
  var PUSHED = CFG.pushed;

  function tabOf(id) { for (var i = 0; i < TABS.length; i++) if (TABS[i].id === id) return TABS[i]; return null; }

  function parseHash() {
    var raw = (location.hash || '').replace(/^#\/?/, '');
    var parts = raw.split('/').filter(Boolean);
    var base = tabOf(parts[0]) ? parts[0] : TABS[0].id;
    var top = parts[1] && screens[parts[1]] ? parts[1] : null;
    return { base: base, top: top };
  }

  function screenForTab(tabId) {
    var t = tabOf(tabId);
    return t && t.screen ? t.screen : 'fuel-placeholder';
  }

  var current = null;
  var prevRoute = null;

  function labelOfRoute(r) {
    if (!r) return null;
    if (r.top) return (screens[r.top] || {}).label || r.top;
    var t = tabOf(r.base);
    return t ? t.label : r.base;
  }

  function show(id) {
    order.forEach(function (sid) {
      var rec = screens[sid];
      if (!rec) return;
      var on = sid === id;
      if (on && !rec.booted) boot(rec);
      rec.host.hidden = !on;
    });
    current = id;
    /* Charts and any other size-derived drawing redraw once visible. */
    window.dispatchEvent(new Event('resize'));
  }

  function syncTabs(route) {
    var rec = screens[current];
    if (!rec) return;
    var items = rec.root.querySelectorAll('[data-testid^="tab-"]');
    Array.prototype.forEach.call(items, function (b) {
      var name = b.getAttribute('data-testid').slice(4);
      if (name === route.base) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
  }

  function render() {
    var route = parseHash();
    var id = route.top || screenForTab(route.base);
    show(id);
    syncTabs(route);

    var bar = document.getElementById('demo-back');
    if (route.top) {
      /* Named for where you actually came from, since that is where it goes. */
      var fromLabel = (prevRoute && (prevRoute.top !== route.top || prevRoute.base !== route.base))
        ? labelOfRoute(prevRoute)
        : (tabOf(route.base) || {}).label || route.base;
      bar.hidden = false;
      bar.querySelector('.demo-back__label').textContent = 'Back to ' + fromLabel;
      bar.setAttribute('aria-label', 'Back to ' + fromLabel);
    } else {
      bar.hidden = true;
    }
    document.title = 'LOCKED demo — ' + ((screens[id] || {}).label || id);
    prevRoute = route;
  }

  function goTab(tabId) { location.hash = '#/' + tabId; }
  function push(screenId) {
    var route = parseHash();
    var parent = (PUSHED[screenId] && PUSHED[screenId].parent) || route.base;
    location.hash = '#/' + parent + '/' + screenId;
  }
  function back() {
    /* No entry to go back to (a deep link opened straight into a pushed
       screen): fall back to that screen's parent rather than leaving the page. */
    var route = parseHash();
    if (!prevRoute || !route.top) { history.back(); return; }
    if (history.length > 1) history.back();
    else location.hash = '#/' + ((PUSHED[route.top] && PUSHED[route.top].parent) || route.base);
  }

  /* ---------------------------------------------------------------
     Clicks that leave a screen: taken in the capture phase, before the
     screen's own delegated handler runs.
     --------------------------------------------------------------- */
  function wire(rec) {
    rec.root.addEventListener('click', function (e) {
      var path = e.composedPath();

        for (var i = 0; i < path.length; i++) {
          var n = path[i];
          if (n.nodeType === 1 && n.matches && n.matches(sel)) return n;
          if (n === rec.root) return null;
        }
        return null;
      }

      var tab = hit('[data-testid^="tab-"]');
      if (tab && tab.closest('.tabbar')) {
        e.preventDefault(); e.stopPropagation();
        goTab(tab.getAttribute('data-testid').slice(4));
        return;
      }

      for (var i = 0; i < CFG.nav.length; i++) {
        var n = CFG.nav[i];
        if (n.from !== rec.id) continue;
        if (hit(n.selector)) {
          e.preventDefault(); e.stopPropagation();
          if (n.mode === 'push') push(n.to); else goTab(n.to);
          return;
        }
      }

      var p = PUSHED[rec.id];
      if (p && p.backSelector && hit(p.backSelector) && parseHash().top === rec.id) {
        e.preventDefault(); e.stopPropagation();
        back();
      }

     Demo-level index: every screen, and every state each screen's own
     switcher offers, in one list. The states are read from the screens
     themselves, so a new screen needs no entry here.
     --------------------------------------------------------------- */
  function devButtons(rec) {
    return Array.prototype.slice.call(rec.root.querySelectorAll(CFG.devStateSelector))
      .filter(function (b) { return b.textContent.trim() && !b.matches(CFG.devToggleSelector); });
  }

  function harvest(rec) {
    var found = devButtons(rec);
    if (found.length) return found;
    var toggle = rec.root.querySelector(CFG.devToggleSelector);
    if (toggle) {
      toggle.click();
      found = devButtons(rec);
      toggle.click();
    }
    return found;
  }

  function buildIndex() {
    var list = document.getElementById('demo-index-list');
    list.innerHTML = '';
    order.forEach(function (sid) {
      var rec = screens[sid];
      if (!rec) return;
      if (!rec.booted) { boot(rec); }
      var group = document.createElement('section');
      group.className = 'demo-index__group';

      var h = document.createElement('button');
      h.type = 'button';
      h.className = 'demo-index__screen';
      h.textContent = rec.label + (rec.tab ? '  ·  tab' : rec.id === 'fuel-placeholder' ? '  ·  tab' : '  ·  pushed');
      h.addEventListener('click', function () { openScreen(sid); });
      group.appendChild(h);

      var states = harvest(rec);
      if (states.length) {
        var wrap = document.createElement('div');
        wrap.className = 'demo-index__states';
        states.forEach(function (b) {
          var s = document.createElement('button');
          s.type = 'button';
          s.className = 'demo-index__state';
          s.textContent = b.textContent.trim();
          s.addEventListener('click', function () {
            openScreen(sid);
            b.click();
          });
          wrap.appendChild(s);
        });
        group.appendChild(wrap);
      }
      list.appendChild(group);
    });
  }

  function openScreen(sid) {
    var rec = screens[sid];
    if (!rec) return;
    if (rec.tab) goTab(rec.tab);
    else if (sid === 'fuel-placeholder') goTab('fuel');
    else push(sid);
    closeIndex();
  }

  function openIndex() {
    var panel = document.getElementById('demo-index');
    var btn = document.getElementById('demo-index-toggle');
    buildIndex();
    panel.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
  }
  function closeIndex() {
    var panel = document.getElementById('demo-index');
    var btn = document.getElementById('demo-index-toggle');
    panel.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
  }

  /* --------------------------------------------------------------- */
  function start() {
    if (booted) return;
    booted = true;

    CFG.screens.forEach(function (meta) {
      var rec = mount({ id: meta.id, label: meta.label, tab: meta.tab || null, booted: false, globals: {} });
      screens[meta.id] = rec;
      order.push(meta.id);
      wire(rec);
    });

    /* Boot every screen up front so the index can read their states and so
       no screen pops in on first visit. Hidden screens cannot take focus. */
    order.forEach(function (sid) { boot(screens[sid]); });

    document.getElementById('demo-index-toggle').addEventListener('click', function () {
      var open = document.getElementById('demo-index').hidden;
      if (open) openIndex(); else closeIndex();
    });
    document.getElementById('demo-index-close').addEventListener('click', closeIndex);
    document.getElementById('demo-back').addEventListener('click', back);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !document.getElementById('demo-index').hidden) closeIndex();
    });

    window.addEventListener('hashchange', render);
    if (!location.hash) location.replace(location.href.split('#')[0] + '#/' + TABS[0].id);
    render();
  }

  window.DEMO = {
    define: define,
    start: start,
    go: goTab,
    push: push,
    back: back,
    route: parseHash,
    screens: screens,
    leakedGlobals: leaked
  };
})();
</script>

    ['loading', 'Loading'],

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + read + '">' +

     ============================================================= */

    if (a === 'start-today') { say('Starts the Push session.'); return; }

  });

  document.addEventListener('input', function (e) {
    if (e.target.id !== 'act-q') return;
    S.query = e.target.value;
    var holder = overlay.querySelector('.sheet__body');

    var tmp = document.createElement('div');

  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;

  });

     Dev state toggle
     ============================================================= */
  var STATES = [
    ['populated', 'Populated'],
    ['empty', 'Empty'],
    ['loading', 'Loading'],
    ['error', 'Error']
  ];
  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" type="button" data-state="' + s[0] + '" aria-pressed="false" ' +

    var open = toggle.getAttribute('aria-expanded') === 'true';

    menu.hidden = open;
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');

    S.state = b.dataset.state;
    S.view = 'hub';
    S.sheet = null;
    S.toast = null;
    render();
  });

  var params = new URLSearchParams(location.search);
  if (params.get('state')) S.state = params.get('state');
  if (params.get('view')) S.view = params.get('view');
  render();
})();

});
</script>

  function niceStep(span, intervals) {
    var raw = span / intervals;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var norm = raw / mag;
    var mult = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
    return mult * mag;
  }
  function yScale(values) {
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var span = max - min;
    if (span <= 0) span = Math.max(1, max * 0.1);
    var step = niceStep(span, 4);
    var lo = Math.floor(min / step) * step;
    var hi = Math.ceil(max / step) * step;
    /* The floor is a labelled round number below the data, and never the
       data minimum: a point must not sit on the axis, because that is
       what made the old chart draw every trend with the same shape. */
    if (min - lo < step * 0.1) lo -= step;
    if (hi - max < step * 0.1) hi += step;
    if (hi - lo < step * 1.5) hi = lo + step * 2;
    var ticks = [], v = lo, guard = 0;
    while (v <= hi + step * 0.001 && guard++ < 20) { ticks.push(Math.round(v * 100) / 100); v += step; }
    return { lo: lo, hi: ticks[ticks.length - 1], ticks: ticks };
  }

  function chartSVG(lift, pts, days, width) {
    var W = Math.max(240, Math.round(width));
    var H = 184;
    var padL = 42, padR = 10, padT = 12, padB = 26;
    var plotW = W - padL - padR, plotH = H - padT - padB;

    var vals = pts.map(function (p) { return p[1]; });
    var ys = yScale(vals);
    var t0 = ms(pts[0][0]), t1 = ms(pts[pts.length - 1][0]);
    if (t1 === t0) { t0 -= 86400000; t1 += 86400000; }

    function X(t) { return padL + (t - t0) / (t1 - t0) * plotW; }
    function Y(v) { return padT + (1 - (v - ys.lo) / (ys.hi - ys.lo)) * plotH; }

    var out = [];
    /* horizontal gridlines with a label each */
    ys.ticks.forEach(function (t) {
      var y = Math.round(Y(t)) + 0.5;
      out.push('<line class="chart__grid" x1="' + padL + '" y1="' + y + '" x2="' + (padL + plotW) + '" y2="' + y + '"/>');
      out.push('<text class="chart__axis" x="' + (padL - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + num1(t) + '</text>');
    });
    /* dated x ticks: first, true midpoint of the time domain, last */
    var mid = t0 + (t1 - t0) / 2;
    var xt = [[t0, 'start'], [mid, 'middle'], [t1, 'end']];
    xt.forEach(function (p) {
      var x = X(p[0]);
      out.push('<line class="chart__grid" x1="' + x.toFixed(1) + '" y1="' + (padT + plotH) + '" x2="' + x.toFixed(1) + '" y2="' + (padT + plotH + 4) + '"/>');
      out.push('<text class="chart__axis" x="' + x.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + p[1] + '">' + dayLabelFromMs(p[0]) + '</text>');
    });
    /* the line, positioned by date */
    var poly = pts.map(function (p) { return X(ms(p[0])).toFixed(1) + ',' + Y(p[1]).toFixed(1); }).join(' ');
    out.push('<polyline class="chart__line" points="' + poly + '"/>');
    pts.forEach(function (p, i) {
      var last = i === pts.length - 1;
      out.push('<circle class="chart__dot" cx="' + X(ms(p[0])).toFixed(1) + '" cy="' + Y(p[1]).toFixed(1) + '" r="' + (last ? 4.5 : 3) + '"/>');
    });

    var first = pts[0], lastp = pts[pts.length - 1];
    var desc = lift.name + ', estimated 1 rep max. ' + pts.length + ' sessions from ' +
      longDate(first[0]) + ' to ' + longDate(lastp[0]) + '. ' +
      num1(first[1]) + ' to ' + num1(lastp[1]) + ' kilograms, ' +
      (lastp[1] > first[1] ? 'up ' : lastp[1] < first[1] ? 'down ' : 'unchanged, ') +
      num1(Math.abs(lastp[1] - first[1])) + ' kilograms. Vertical axis ' +
      num1(ys.lo) + ' to ' + num1(ys.hi) + ' kilograms. Points: ' +
      pts.map(function (p) { return dayLabel(p[0]) + ' ' + num1(p[1]) + ', from ' + num1(p[2]) + ' kilograms for ' + p[3] + ' reps'; }).join('; ') + '.';

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
      '" role="img" aria-label="' + esc(desc) + '" data-testid="trend-chart" data-range="' + days +
      '" data-points="' + pts.length + '" data-ylo="' + num1(ys.lo) + '" data-yhi="' + num1(ys.hi) + '">' +
      out.join('') + '</svg>';
  }

  /* =============================================================
     State
     ============================================================= */
  var S = {
    view: 'populated',
    range: '12w',
    liftId: 111,      /* lk_featuredLifts[0] */
    sheet: false
  };
  function rangeDays() {
    for (var i = 0; i < RANGES.length; i++) if (RANGES[i].id === S.range) return RANGES[i].days;
    return 84;
  }
  function rangeLabel() {
    for (var i = 0; i < RANGES.length; i++) if (RANGES[i].id === S.range) return RANGES[i].label;
    return '';
  }

  /* =============================================================
     Blocks
     ============================================================= */
  function rangeControl() {
    return '' +
      '<div class="section" style="margin-top: var(--sp-3)">' +
        '<div class="seg seg--lg" role="radiogroup" aria-label="Range" data-testid="range-control">' +
          RANGES.map(function (r) {
            return '<button class="seg__item" role="radio" aria-checked="' + (S.range === r.id) +
              '" data-action="range" data-range="' + r.id + '" data-testid="range-' + r.id + '">' +
              'Last ' + r.label + '</button>';
          }).join('') +
        '</div>' +
      '</div>';
  }

  function answerCard() {
    var days = rangeDays(), s = summary(days);
    var from = dayLabel(s.from);
    /* One sentence shape in every case: the count is the answer, and a
       reader should not have to tell two phrasings apart. */
    var headline = n(s.up) + ' of ' + n(s.tracked) + ' lifts are heavier';
    return '' +
      '<div class="card mt-3" data-testid="card-answer" data-up="' + s.up + '" data-tracked="' + s.tracked + '">' +
        '<div class="t-label">Since ' + from + '</div>' +
        '<h2 class="t-title mt-2">' + headline + '</h2>' +
        '<p class="t-detail mt-2">' + n(s.sessions) + ' sessions logged. Biggest gain: ' +
          esc(s.best.name) + ', ' + signedKg(s.best.delta) + ' on the estimate.</p>' +
      '</div>';
  }

  function trendCard() {
    var days = rangeDays();
    var lift = liftById(S.liftId);
    var pts = ptsIn(lift, days);
    var cur = pts[pts.length - 1];
    var delta = cur[1] - pts[0][1];
    var trendClass = delta > 0 ? ' trend-up' : delta < 0 ? ' trend-down' : '';
    var deltaText = delta === 0
      ? 'level since ' + dayLabel(pts[0][0])
      : signedKg(delta) + ' since ' + dayLabel(pts[0][0]);

    return '' +
      '<div class="section">' +
        '<div class="section__head">' +
          '<h2 class="t-label">Estimated 1 rep max</h2>' +
          '<span class="t-meta">' + n(pts.length) + ' sessions</span>' +
        '</div>' +
        '<div class="card" data-testid="card-trend" data-lift="' + lift.id + '">' +
          '<div class="spread">' +
            '<div class="stack stack--1 grow">' +
              '<span class="t-section">' + esc(lift.name) + '</span>' +
              '<span class="t-meta">' + esc(lift.muscle) + '</span>' +
            '</div>' +
            '<div class="stack stack--1" style="text-align: right">' +
              '<span class="stat__value" data-testid="trend-current">' + kg(cur[1]) + '</span>' +
              '<span class="t-meta' + trendClass + '" data-testid="trend-delta">' + deltaText + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="mt-3" id="chart-holder" data-testid="chart-holder"></div>' +
          '<p class="t-meta mt-2" data-testid="chart-caption">Vertical axis in kilograms, starting at ' +
            '<span class="num" data-testid="axis-floor">' + num1(chartFloor(pts)) + '</span>, not at zero. ' +
            'Points sit on the day they were lifted.</p>' +
          '<p class="t-detail mt-3">Last set: ' + kg(cur[2]) + ' &times; ' + n(cur[3]) +
            ' on ' + dayLabel(cur[0]) + '.</p>' +
          '<button class="btn btn--secondary btn--block mt-3" data-action="open-picker" data-testid="choose-lift">' +
            '<span class="btn__label">Choose another lift</span>' +
          '</button>' +
        '</div>' +
      '</div>';
  }
  function chartFloor(pts) {
    return yScale(pts.map(function (p) { return p[1]; })).lo;
  }

  function recordsSection() {
    var rows = recordLifts();
    return '' +
      '<div class="section">' +
        '<div class="section__head">' +
          '<h2 class="t-label">Records</h2>' +
          '<span class="t-meta">' + n(RECORDS.length) + ' across ' + n(rows.length) + ' lifts</span>' +
        '</div>' +
        '<div class="card card--flush" data-testid="records-list">' +
          rows.map(function (r) {
            var sel = r.id === S.liftId;
            return '<button class="row' + (sel ? ' row--selected' : '') + '" data-action="pick-lift" data-id="' + r.id +
              '" data-testid="record-' + r.id + '"' + (sel ? ' aria-current="true"' : '') + '>' +
              '<span class="row__main stack">' +
                '<span class="row__title">' + esc(r.name) + '</span>' +
                '<span class="row__sub">' + dayLabel(r.best.date) + ' &middot; ' + kg(r.best.kg) +
                  ' &times; ' + n(r.best.reps) + (r.count > 1 ? ' &middot; ' + n(r.count) + ' records' : '') + '</span>' +
              '</span>' +
              '<span class="row__value">' + kg(e1rm(r.best.kg, r.best.reps)) + '</span>' +
              '<span class="row__chev">' + ICO.chev + '</span>' +
            '</button>';
          }).join('') +
        '</div>' +
        '<button class="btn btn--tertiary btn--block mt-2" data-action="log-record" data-testid="log-record">' +
          ICO.plus + '<span class="btn__label">Log a record without a workout</span>' +
        '</button>' +
      '</div>';
  }

  function moreSection() {
    var w = WEIGHT_LOG[WEIGHT_LOG.length - 1], w0 = WEIGHT_LOG[0];
    var d = w[1] - w0[1];
    return '' +
      '<div class="section">' +
        '<div class="section__head"><h2 class="t-label">Also tracked</h2></div>' +
        '<div class="card card--flush">' +
          '<button class="row" data-action="open-weight" data-testid="row-body-weight">' +
            '<span class="ico-well">' + ICO.scale + '</span>' +
            '<span class="row__main stack">' +
              '<span class="row__title">Body weight</span>' +
              '<span class="row__sub">' + signedKg(d) + ' since ' + dayLabel(w0[0]) + '</span>' +
            '</span>' +
            '<span class="row__value">' + kg(w[1]) + '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
          '<button class="row" data-action="open-goals" data-testid="row-goals">' +
            '<span class="ico-well">' + ICO.flag + '</span>' +
            '<span class="row__main stack">' +
              '<span class="row__title">Goals</span>' +
              '<span class="row__sub">' + n(GOALS_ACTIVE) + ' active, next due Nov 7</span>' +
            '</span>' +
            '<span class="row__chev">' + ICO.chev + '</span>' +
          '</button>' +
        '</div>' +
      '</div>';
  }

  /* =============================================================
     Views
     ============================================================= */
  var VIEWS = {};

  VIEWS.populated = function () {
    return rangeControl() + answerCard() + trendCard() + recordsSection() + moreSection();
  };

  VIEWS.empty = function () {
    return '' +
      '<div class="empty mt-5" data-testid="progress-empty">' +
        '<span class="empty__ico">' + ICO.chart + '</span>' +
        '<h2 class="empty__title">No trend yet</h2>' +
        '<p class="empty__body">Log two sessions of the same lift and this screen charts it, ' +
          'with the record it beat.</p>' +
        '<button class="btn btn--primary" data-action="start-workout" data-testid="empty-action">' +
          '<span class="btn__label">Start a workout</span>' +
        '</button>' +
      '</div>';
  };

  VIEWS.loading = function () {
    return '' +
      '<div class="section" style="margin-top: var(--sp-3)" role="status" aria-busy="true" aria-label="Loading your progress" data-testid="progress-loading">' +
        '<div class="skel" style="height: var(--tap)"></div>' +
        '<div class="card mt-3">' +
          '<div class="skel" style="height: var(--sp-3); width: 35%"></div>' +
          '<div class="skel mt-3" style="height: var(--sp-5); width: 70%"></div>' +
          '<div class="skel mt-3" style="height: var(--sp-4); width: 85%"></div>' +
        '</div>' +
        '<div class="card mt-3">' +
          '<div class="skel" style="height: var(--sp-4); width: 50%"></div>' +
          '<div class="skel mt-3" style="height: 184px"></div>' +
        '</div>' +
        '<div class="card mt-3">' +
          '<div class="skel" style="height: var(--sp-4); width: 60%"></div>' +
          '<div class="skel mt-3" style="height: var(--sp-4); width: 45%"></div>' +
        '</div>' +
      '</div>';
  };

  VIEWS.error = function () {
    return '' +
      '<div class="card mt-3" data-testid="progress-error">' +
        '<div class="banner banner--error" role="alert">' +
          ICO.alert +
          '<span><strong>Progress did not load</strong>Your last sync failed, so sessions after ' +
            'Aug 24 are missing. Nothing was lost on this phone.</span>' +
        '</div>' +
        '<button class="btn btn--primary btn--block mt-4" data-action="retry" data-testid="retry">' +
          '<span class="btn__label">Try again</span>' +
        '</button>' +
        '<button class="btn btn--secondary btn--block mt-2" data-action="show-cached" data-testid="show-cached">' +
          '<span class="btn__label">Show what is on this phone</span>' +
        '</button>' +
      '</div>';
  };

  /* =============================================================
     Lift picker sheet. Every lift with history, not only those with
     a record, because a lift you are building has no record yet.
     ============================================================= */
  function sheetHTML() {
    var days = rangeDays();
    return '' +
      '<div class="scrim" data-action="close-sheet" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-testid="lift-sheet">' +
        '<div class="sheet__grab"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-section" id="sheet-title">Choose a lift</h2>' +
          '<button class="iconbtn" data-action="close-sheet" data-testid="sheet-close" aria-label="Close lift picker">' +
            ICO.close + '</button>' +
        '</div>' +
        '<div class="sheet__body" role="radiogroup" aria-label="Lifts with history">' +
          '<div class="card card--flush">' +
            LIFTS.map(function (l) {
              var p = ptsIn(l, days);
              var on = l.id === S.liftId;
              var d = p.length > 1 ? p[p.length - 1][1] - p[0][1] : 0;
              return '<button class="row' + (on ? ' row--selected' : '') + '" role="radio" aria-checked="' + on +
                '" data-action="pick-lift" data-id="' + l.id + '" data-testid="sheet-lift-' + l.id + '">' +
                '<span class="ico-well">' + ICO.lift + '</span>' +
                '<span class="row__main stack">' +
                  '<span class="row__title">' + esc(l.name) + '</span>' +
                  '<span class="row__sub">' + esc(l.muscle) + ' &middot; ' + n(p.length) + ' sessions</span>' +
                '</span>' +
                '<span class="row__value">' + kg(p[p.length - 1][1]) + '</span>' +
              '</button>';
            }).join('') +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* =============================================================
     Render
     ============================================================= */
  var body = document.getElementById('body');
  var overlay = document.getElementById('overlay');
  var screen = document.getElementById('screen');
  var lastFocus = null;

  function drawChart() {
    var holder = document.getElementById('chart-holder');
    if (!holder) return;
    var lift = liftById(S.liftId);
    var pts = ptsIn(lift, rangeDays());
    var w = holder.clientWidth || 329;
    LKPatch(holder, chartSVG(lift, pts, rangeDays(), w));
  }

  function render() {
    screen.setAttribute('data-state', S.view);
    LKPatch(body, (VIEWS[S.view] || VIEWS.populated)());
    drawChart();
    LKPatch(overlay, S.sheet ? sheetHTML() : '');
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.view));
    });
    if (S.sheet) {
      var f = overlay.querySelector('[data-testid="sheet-close"]');
      if (f) f.focus();
    }
  }

  function openSheet() {
    lastFocus = document.activeElement;
    S.sheet = true;
    render();
  }
  function closeSheet(refocus) {
    S.sheet = false;
    render();
    var back = refocus && document.querySelector('[data-testid="choose-lift"]');
    if (back) back.focus();
    else if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var a = t.dataset.action;
    if (a === 'range') {
      S.range = t.dataset.range;
      render();
    } else if (a === 'open-picker') {
      openSheet();
    } else if (a === 'close-sheet') {
      closeSheet(true);
    } else if (a === 'pick-lift') {
      S.liftId = Number(t.dataset.id);
      var wasSheet = S.sheet;
      S.sheet = false;
      render();
      var card = document.querySelector('[data-testid="card-trend"]');
      if (card) card.scrollIntoView({ block: 'nearest' });
      if (wasSheet) {
        var back = document.querySelector('[data-testid="choose-lift"]');
        if (back) back.focus();
      }
    } else if (a === 'retry' || a === 'show-cached') {
      S.view = 'populated';
      render();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.sheet) { e.preventDefault(); closeSheet(true); return; }
    if (e.key !== 'Tab' || !S.sheet) return;
    var f = overlay.querySelectorAll('button');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!overlay.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(drawChart, 100);
  });

  /* ---- dev state toggle ------------------------------------------ */
  var STATES = [
    ['populated', 'Populated'],
    ['empty', 'Empty'],
    ['loading', 'Loading'],
    ['error', 'Error']
  ];
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join(''));
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (!b) return;
    S.view = b.dataset.state;
    S.sheet = false;
    render();
  });

  var q = new URLSearchParams(location.search);
  if (q.get('state') && VIEWS[q.get('state')]) S.view = q.get('state');
  if (q.get('range')) S.range = q.get('range');
  render();
})();

});
</script>

  function parseDate(s) { var p = s.split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }

    }

  function best(id, reps) {
    var rows = PRS[id] || [], top = null;
    rows.forEach(function (r) { if (r.r >= reps && (!top || r.w > top.w)) top = r; });
    return top;
  }

    var b = map ? best(map.id, map.reps) : null;
    if (!b) return { has: false, lift: map ? EX[map.id] : '', reps: map ? map.reps : 0 };
    return {
      has: true, lift: EX[map.id], reps: map.reps, now: b.w, target: t.value,
      pct: Math.round((b.w / t.value) * 100), met: b.w >= t.value

          '<div class="skel mt-3" style="height: var(--sp-2); width: 100%"></div>' +
        '</div>' +
        '<div class="card mt-3">' +
          '<div class="skel" style="height: var(--sp-4); width: 45%"></div>' +
          '<div class="skel mt-3" style="height: var(--sp-4); width: 80%"></div>' +
          '<div class="skel mt-3" style="height: var(--tap)"></div>' +
        '</div>' +
        '<div class="card mt-3">' +
          '<div class="skel" style="height: var(--sp-4); width: 60%"></div>' +
          '<div class="skel mt-3" style="height: var(--sp-4); width: 40%"></div>' +
        '</div>' +
        '<p class="t-detail quiet mt-3 center">Reading your plan and your logged bests.</p>' +
      '</div>';
    }
    if (st === 'error') {
      return '<div class="mt-3" data-testid="plan-error">' +
        '<div class="banner banner--error">' + ico('alert') +
          '<span><strong>The plan did not arrive whole</strong>The coach’s last reply was cut off, so the block could not be read. Nothing was overwritten.</span></div>' +
        '<button class="btn btn--primary btn--block mt-4" data-act="ask-again" data-testid="plan-retry">' +
          '<span class="btn__label">Ask the coach to send it again</span></button>' +
      '</div>';
    }

    var p = S.plan.data;
    var week = weekOf(p);
    var ph = phaseAt(p, Math.max(1, week));
    var pct = Math.round((Math.max(0, week) / p.weeks) * 100);
    var split = SPLITS.filter(function (s) { return s.id === p.boundSplit; })[0];

    var head = '' +
      '<div class="card mt-3" data-testid="plan-head">' +
        '<div class="t-label">Plan</div>' +
        '<h2 class="t-title mt-2">' + esc(p.name) + '</h2>' +
        '<p class="t-detail mt-2">' + esc(p.description) + '</p>' +
        '<div class="spread mt-4">' +
          '<span class="t-detail">' + (week === 0
            ? 'Starts ' + dayLabel(p.start)
            : 'Week ' + n(week) + ' of ' + n(p.weeks)) + '</span>' +
          '<span class="t-meta num">' + (week === 0 ? '0%' : pct + '%') + '</span>' +
        '</div>' +
        '<span class="meter meter--quiet mt-2"><span class="meter__fill" style="width: ' + (week === 0 ? 0 : pct) + '%"></span></span>' +
      '</div>';

    /* The route into the app. An unbound plan asks to be bound; a bound
       plan starts today's session. Either way the primary action leaves
       this screen. */
    var act;
    if (!split) {
      act = '<section class="section" data-testid="plan-bind">' +
        '<div class="section__head"><h2 class="t-label">Before it can run</h2></div>' +
        '<div class="card">' +
          '<p class="t-detail">This block has phases and targets but no days. Bind it to one of your splits and LOCKED puts its session on Home each training day.</p>' +
          '<button class="btn btn--primary btn--block mt-4" data-act="bind" data-testid="plan-bind-open">' +
            ico('link') + '<span class="btn__label">Run it on a split</span></button>' +
        '</div></section>';
    } else {
      var notStarted = week === 0;
      act = '<section class="section" data-testid="plan-this-week">' +
        '<div class="section__head"><h2 class="t-label">' + (notStarted ? 'First week' : 'This week') + '</h2></div>' +
        '<div class="card">' +
          '<div class="t-section">' + esc(ph.name) + ' &middot; ' +
            (notStarted ? 'week 1 of ' + n(ph.weekEnd - ph.weekStart + 1) : 'week ' + n(week - ph.weekStart + 1) + ' of ' + n(ph.weekEnd - ph.weekStart + 1)) + '</div>' +
          '<p class="t-detail mt-2">' + (notStarted ? 'Starts ' + dayLabel(p.start) + '. ' : '') + esc(ph.note) + '</p>' +
          '<div class="card card--flush card--raised mt-3">' +
            '<button class="row" data-act="open-split" data-testid="plan-open-split">' +
              '<span class="ico-well">' + ico('lift') + '</span>' +
              '<span class="row__main"><span class="row__title">Runs on ' + esc(split.name) + '</span>' +
              '<span class="row__sub">' + n(split.days.length) + ' days &middot; next is ' + esc(p.nextDay) + '</span></span>' +
              '<span class="row__chev">' + ico('chev') + '</span></button>' +
          '</div>' +
          '<button class="btn btn--primary btn--block mt-3" data-act="start" data-testid="plan-start">' +
            ico('play') + '<span class="btn__label">Start ' + esc(p.nextDay) + (notStarted ? ' early' : '') + '</span></button>' +
        '</div></section>';
    }

    var targets = ph && ph.targets.length ? '<section class="section" data-testid="plan-targets">' +
      '<div class="section__head"><h2 class="t-label">' + esc(ph.name) + ' targets</h2>' +
        '<span class="t-meta">From your logged bests</span></div>' +
      '<div class="card card--flush">' +
        ph.targets.map(function (t, i) { t.weekStart = ph.weekStart; return targetRow(t, i, week === 0 ? 'future' : 'now'); }).join('') +
      '</div></section>' : '';

    var phases = '<section class="section" data-testid="plan-phases">' +
      '<div class="section__head"><h2 class="t-label">Phases</h2></div>' +
      '<div class="card card--flush">' +
        p.phases.map(function (x, i) { return phaseRow(p, x, week, i); }).join('') +
      '</div></section>';

    var more = '<section class="section stack stack--2" data-testid="plan-more">' +
      '<button class="btn btn--secondary btn--block" data-act="adjust" data-testid="plan-adjust">' +
        ico('coach') + '<span class="btn__label">Ask the coach to adjust it</span></button>' +
      '<button class="btn btn--danger btn--block" data-act="delete" data-testid="plan-delete">' +
        ico('trash') + '<span class="btn__label">Delete this plan</span></button>' +
    '</section>';

    return head + act + targets + phases + more;
  }

  /* ---------------------------------------------------------------
     Setup
     --------------------------------------------------------------- */
  function permCount() {
    return PERMS.filter(function (p) { return S.setup.perms[p[0]]; }).length;
  }

  function answered() { return S.interview.answers.filter(function (a) { return a; }).length; }

  function setupBody() {
    var s = S.setup;
    var empty = s.status === 'empty';

    if (s.status === 'loading') {
      return '<div class="mt-3" role="status" aria-busy="true" aria-label="Writing your instructions" data-testid="setup-loading">' +
        '<div class="card">' +
          '<div class="t-section">Writing your instructions</div>' +
          '<div class="gensteps mt-3">' + WRITE_STEPS.map(function (t, i) {
            var st = i < S.interview.writeStep ? 'done' : i === S.interview.writeStep ? 'active' : 'todo';
            return '<div class="genstep" data-state="' + st + '"><span class="genstep__mark">' +
              (st === 'done' ? ico('check') : st === 'active' ? ico('circle') : ico('circle')) + '</span>' + t + '</div>';
          }).join('') + '</div>' +
          '<p class="t-detail quiet mt-3">Your six answers are already saved. Closing this does not lose them.</p>' +
        '</div>' +
        '<div class="card mt-3"><div class="skel" style="height: var(--sp-4); width: 70%"></div>' +
          '<div class="skel mt-3" style="height: var(--sp-4); width: 90%"></div>' +
          '<div class="skel mt-3" style="height: var(--sp-4); width: 50%"></div></div>' +
      '</div>';
    }

    if (s.status === 'error') {
      return '<div class="mt-3" data-testid="setup-error">' +
        '<div class="banner banner--error">' + ico('alert') +
          '<span><strong>The coach is down</strong>Your instructions were not written. All six answers are kept on this phone.</span></div>' +
        '<button class="btn btn--primary btn--block mt-4" data-act="write-again" data-testid="setup-retry">' +
          '<span class="btn__label">Try again</span></button>' +
        '<button class="btn btn--secondary btn--block mt-2" data-act="review-answers" data-testid="setup-review-answers">' +
          '<span class="btn__label">Review my answers</span></button>' +
      '</div>';
    }

    /* --- Persona ------------------------------------------------- */
    var interview = '<section class="section" data-testid="setup-interview-block">' +
      '<div class="section__head"><h2 class="t-label">Interview</h2></div>' +
      '<div class="card">' +
        '<div class="t-body-em">Let the coach interview you</div>' +
        '<p class="t-detail mt-2">Six questions. Each answer is kept as you give it, so you can stop and come back.</p>' +
        (answered()
          ? '<div class="banner banner--info mt-3">' + ico('check') + '<span>' + answered() + ' of ' + QUESTIONS.length + ' answered. Nothing was lost.</span></div>' +
            '<button class="btn ' + (empty ? 'btn--primary' : 'btn--secondary') + ' btn--block mt-3" data-act="interview" data-testid="setup-interview-resume">' +
              '<span class="btn__label">Resume at question ' + Math.min(QUESTIONS.length, answered() + 1) + '</span></button>' +
            '<button class="btn btn--tertiary btn--block mt-2" data-act="review-answers" data-testid="setup-interview-review">' +
              '<span class="btn__label">Review answers</span></button>'
          : '<button class="btn ' + (empty ? 'btn--primary' : 'btn--secondary') + ' btn--block mt-3" data-act="interview" data-testid="setup-interview-open">' +
              ico('spark') + '<span class="btn__label">Start the interview</span></button>') +
      '</div></section>';

    var instructions = '<section class="section" data-testid="setup-instructions-block">' +
      '<div class="section__head"><h2 class="t-label">Instructions</h2>' +
        '<span class="t-meta num">' + s.instructions.length + ' / 500</span></div>' +
      '<div class="card">' +
        '<label class="field">' +
          '<span class="vis-hidden">Instructions for the coach</span>' +
          '<textarea class="input" rows="4" placeholder="Tell the coach how to talk to you and what to work around." data-act="instr" data-testid="setup-instructions">' + esc(s.instructions) + '</textarea>' +
        '</label>' +
        '<div class="hstack hstack--2 wrap mt-3">' +
          QUICK.map(function (q, i) {
            return '<button class="chip" data-act="quick" data-i="' + i + '" data-testid="setup-quick-' + i + '">' + ico('plus') + esc(q) + '</button>';
          }).join('') +
        '</div>' +
      '</div></section>';

    var style = '<section class="section" data-testid="setup-style-block">' +
      '<div class="section__head"><h2 class="t-label">Tone</h2></div>' +
      '<div class="card"><div class="hstack hstack--2 wrap">' +
        STYLES.map(function (t) {
          return '<button class="chip" aria-pressed="' + (s.style === t[0]) + '" data-act="style" data-style="' + t[0] + '" data-testid="setup-style-' + t[0] + '">' + t[1] + '</button>';
        }).join('') +
      '</div></div></section>';

    var memory = '<section class="section" data-testid="setup-memory-block">' +
      '<div class="section__head"><h2 class="t-label">What it remembers</h2></div>' +
      (s.memory.length
        ? '<div class="card card--flush">' + s.memory.map(function (m, i) {
            return '<div class="row"><span class="row__main"><span class="row__title">' + esc(m.text) + '</span>' +
              '<span class="row__sub">' + esc(m.src) + '</span></span>' +
              '<button class="iconbtn iconbtn--danger-quiet" data-act="forget" data-i="' + i + '" aria-label="Forget: ' + esc(m.text) + '" data-testid="setup-forget-' + i + '">' + ico('trash') + '</button></div>';
          }).join('') + '</div>'
        : '<div class="card"><p class="t-detail">Nothing remembered yet. Facts you add here go into every reply.</p></div>') +
      '<button class="btn btn--secondary btn--block mt-3" data-act="add-memory" data-testid="setup-add-memory">' +
        ico('plus') + '<span class="btn__label">Add a fact</span></button>' +
    '</section>';

    /* --- Data access. Drawn as a permission grant, not a preference. -- */
    var perms = '<section class="section" data-testid="setup-data-block">' +
      '<div class="card card--outline card--flush">' +
        '<div class="card__head"><span class="ico-well">' + ico('lock') + '</span>' +
          '<span class="grow"><span class="t-label">Data access</span>' +
          '<span class="row__title">' + permCount() + ' of ' + PERMS.length + ' sources on</span></span></div>' +
        '<p class="t-detail card__note">Only what is on is sent, and only when you send a message. Everything else stays on this phone.</p>' +
        PERMS.map(function (p) {
          var on = !!s.perms[p[0]];
          return '<button class="opt" role="checkbox" aria-checked="' + on + '" data-act="perm" data-key="' + p[0] + '" data-testid="setup-perm-' + p[0] + '">' +
            '<span class="opt__mark">' + ico('check') + '</span>' +
            '<span class="opt__main"><span class="opt__title">' + p[1] + '</span>' +
            '<span class="opt__sub">' + p[2] + '</span></span></button>';
        }).join('') +
        '<div class="card__foot hstack hstack--2">' +
          '<button class="btn btn--tertiary btn--sm" data-act="perms-on" data-testid="setup-perms-on"' +
            (permCount() === PERMS.length ? ' disabled' : '') + '>' +
            '<span class="btn__label">Turn all on</span></button>' +
          '<button class="btn btn--tertiary btn--sm" data-act="perms-off" data-testid="setup-perms-off"' +
            (permCount() === 0 ? ' disabled' : '') + '>' +
            '<span class="btn__label">Turn all off</span></button>' +
        '</div>' +
      '</div></section>';

    var lead = empty
      ? '<div class="banner banner--warn mt-3" data-testid="setup-empty">' + ico('alert') +
          '<span><strong>The coach knows nothing about you</strong>It can still answer, but it will answer generically. The interview is the fastest way out of that.</span></div>'
      : '';

    return lead + interview + instructions + style + memory + perms;
  }

  function actionbar() {
    var s = S.setup;
    if (s.status === 'loading' || s.status === 'error') return '';
    var cls = S.modal || S.interview.open ? 'btn--secondary' : 'btn--primary';
    if (s.status === 'empty' && !s.dirty) {
      return '<div class="actionbar"><span class="actionbar__status" data-testid="setup-status">Nothing to save yet</span>' +
        '<button class="btn btn--secondary" disabled data-testid="setup-save"><span class="btn__label">Save</span></button></div>';
    }
    return '<div class="actionbar">' +
      '<span class="actionbar__status" data-testid="setup-status">' +
        (s.dirty ? '<span class="hstack hstack--2"><span class="dot"></span>Unsaved changes</span>' : 'Saved just now') + '</span>' +
      '<button class="btn ' + cls + '" ' + (s.dirty ? '' : 'disabled ') + 'data-act="save-setup" data-testid="setup-save">' +
        '<span class="btn__label">Save</span></button></div>';
  }

  /* ---------------------------------------------------------------
     Interview sheet. Answers persist, Back exists, Escape closes,
     and closing says what was kept.
     --------------------------------------------------------------- */
  function interviewSheet() {
    var iv = S.interview;
    var head = function (title, sub) {
      return '<div class="sheet__head">' +
        '<div class="stack stack--1"><h2 class="t-section">' + title + '</h2>' +
          (sub ? '<span class="t-detail">' + sub + '</span>' : '') + '</div>' +
        '<button class="iconbtn" data-act="iv-close" aria-label="Close the interview" data-testid="iv-close">' + ico('close') + '</button>' +
      '</div>';
    };

    if (iv.phase === 'review') {
      return '<div class="scrim" data-act="iv-close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-label="Review your answers" data-testid="iv-review">' +
          '<span class="sheet__grab"></span>' +
          head('Your answers', 'Change any of them before the coach writes.') +
          '<div class="sheet__body"><div class="card card--flush">' +
            QUESTIONS.map(function (q, i) {
              return '<button class="row" data-act="iv-edit" data-i="' + i + '" data-testid="iv-edit-' + i + '">' +
                '<span class="row__main"><span class="row__sub">' + esc(q.q) + '</span>' +
                '<span class="row__title">' + (iv.answers[i] ? esc(iv.answers[i]) : 'Not answered') + '</span></span>' +
                '<span class="row__chev">' + ico('edit') + '</span></button>';
            }).join('') +
          '</div>' +
          '<button class="btn btn--primary btn--block mt-4" ' + (answered() < QUESTIONS.length ? 'disabled ' : '') +
            'data-act="write" data-testid="iv-write"><span class="btn__label">Write my instructions</span></button>' +
          '<button class="btn btn--tertiary btn--block mt-2" data-act="iv-close" data-testid="iv-review-close">' +
            '<span class="btn__label">Close, keep my answers</span></button>' +
          '</div>' +
        '</div>';
    }

    if (iv.phase === 'preview') {
      return '<div class="scrim" data-act="iv-close" data-testid="scrim"></div>' +
        '<div class="sheet" role="dialog" aria-modal="true" aria-label="Instructions the coach wrote" data-testid="iv-preview">' +
          '<span class="sheet__grab"></span>' +
          head('From your answers', 'This replaces your instructions. Nothing else changes.') +
          '<div class="sheet__body">' +
            '<div class="card"><p class="t-body">' + esc(DRAFT_INSTRUCTIONS) + '</p></div>' +
            '<button class="btn btn--primary btn--block mt-4" data-act="iv-use" data-testid="iv-use">' +
              '<span class="btn__label">Use these instructions</span></button>' +
            '<button class="btn btn--secondary btn--block mt-2" data-act="iv-edit-first" data-testid="iv-edit-first">' +
              '<span class="btn__label">Save and edit them</span></button>' +
          '</div>' +
        '</div>';
    }

    var q = QUESTIONS[iv.step];
    var pct = Math.round((iv.step / QUESTIONS.length) * 100);
    return '<div class="scrim" data-act="iv-close" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="Coach interview" data-testid="iv-sheet">' +
        '<span class="sheet__grab"></span>' +
        head('Question ' + (iv.step + 1) + ' of ' + QUESTIONS.length, 'Answers are kept as you give them.') +
        '<div class="stepbar mt-2"><span class="stepbar__track"><span class="stepbar__fill" style="width: ' + pct + '%"></span></span>' +
          '<span class="stepbar__count">' + answered() + ' answered</span></div>' +
        '<div class="sheet__body mt-3">' +
          '<h3 class="t-section">' + esc(q.q) + '</h3>' +
          '<div class="card card--flush mt-3">' +
            q.opts.map(function (o, i) {
              return '<button class="opt" role="radio" aria-checked="' + (iv.answers[iv.step] === o) + '" data-act="iv-answer" data-val="' + esc(o) + '" data-testid="iv-option-' + i + '">' +
                '<span class="opt__mark">' + ico('check') + '</span>' +
                '<span class="opt__main"><span class="opt__title">' + esc(o) + '</span></span></button>';
            }).join('') +
          '</div>' +
          (q.free ? '<label class="field mt-3"><span class="field__label t-label">Or say it yourself</span>' +
            '<input class="input" value="' + esc(iv.draft) + '" placeholder="Right hip on deadlifts" data-act="iv-free" data-testid="iv-free">' +
            '</label>' : '') +
          '<div class="hstack hstack--2 mt-4">' +
            '<button class="btn btn--secondary" ' + (iv.step === 0 ? 'disabled ' : '') + 'data-act="iv-back" data-testid="iv-back">' +
              ico('back') + '<span class="btn__label">Back</span></button>' +
            '<button class="btn btn--primary grow" ' + (iv.answers[iv.step] ? '' : 'disabled ') + 'data-act="iv-next" data-testid="iv-next">' +
              '<span class="btn__label">' + (iv.step === QUESTIONS.length - 1 ? 'Review answers' : 'Next') + '</span></button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* ---------------------------------------------------------------
     Overlays
     --------------------------------------------------------------- */
  function bindSheet() {
    return '<div class="scrim" data-act="close-modal" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="Run this plan on a split" data-testid="bind-sheet">' +
        '<span class="sheet__grab"></span>' +
        '<div class="sheet__head"><div class="stack stack--1">' +
          '<h2 class="t-section">Run it on</h2>' +
          '<span class="t-detail">The plan sets loads and RIR. The split sets the days.</span></div>' +
          '<button class="iconbtn" data-act="close-modal" aria-label="Close" data-testid="bind-close">' + ico('close') + '</button></div>' +
        '<div class="sheet__body"><div class="card card--flush">' +
          SPLITS.map(function (sp, i) {
            return '<button class="opt" role="radio" aria-checked="false" data-act="bind-pick" data-split="' + sp.id + '" data-testid="bind-split-' + i + '">' +
              '<span class="opt__mark">' + ico('check') + '</span>' +
              '<span class="opt__main"><span class="opt__title">' + sp.name + '</span>' +
              '<span class="opt__sub">' + sp.days.length + ' days &middot; ' + sp.days.join(', ') + '</span></span></button>';
          }).join('') +
        '</div></div>' +
      '</div>';
  }

  function deleteDialog() {
    return '<div class="scrim" data-act="close-modal" data-testid="scrim"></div>' +
      '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="del-t" data-testid="delete-dialog">' +
        '<h2 class="t-section" id="del-t">Delete this plan?</h2>' +
        '<p class="t-detail mt-2">' + esc(S.plan.data.name) + ' and its targets go. Your logged sessions stay. You can undo this once.</p>' +
        '<div class="stack stack--2 mt-4">' +
          '<button class="btn btn--danger-solid btn--block" data-act="delete-confirm" data-testid="delete-confirm">' +
            '<span class="btn__label">Delete plan</span></button>' +
          '<button class="btn btn--secondary btn--block" data-act="close-modal" data-testid="delete-cancel">' +
            '<span class="btn__label">Keep it</span></button>' +
        '</div>' +
      '</div>';
  }

  function toastEl() {
    if (!S.toast) return '';
    return '<div class="toast" role="status" data-testid="toast">' +
      '<span class="toast__body">' + esc(S.toast.text) + '</span>' +
      (S.toast.action ? '<button class="toast__action" data-act="toast" data-testid="toast-action">' + esc(S.toast.action) + '</button>' : '') +
      '</div>';
  }

  function overlays() {
    var html = toastEl();
    if (S.interview.open) return html + interviewSheet();
    if (S.modal === 'bind') return html + bindSheet();
    if (S.modal === 'delete') return html + deleteDialog();
    return html;
  }

  /* ---------------------------------------------------------------
     Render
     --------------------------------------------------------------- */
  var phone = document.getElementById('phone');

  function currentState() {
    if (S.view === 'chat') return S.chat.status === 'ready' && S.chat.offer ? 'plan-offer' : S.chat.status;
    if (S.view === 'plan') return S.plan.status;
    return S.setup.status;
  }

  function render() {
    var active = document.activeElement;
    var key = active && active.getAttribute ? active.getAttribute('data-testid') : null;
    var caret = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;

    var body, foot = '';
    if (S.view === 'chat') { body = chatBody(); foot = composer(); }
    else if (S.view === 'plan') { body = planBody(); }
    else { body = setupBody(); foot = actionbar(); }

    /* One accent fill: normally the primary action; in chat it moves to
       the plan card while the card is waiting to be saved. */
    var accent = (S.view === 'chat' && S.chat.offer && !S.chat.offerSaved) ? 'card' : 'action';

    LKPatch(phone, '' +
