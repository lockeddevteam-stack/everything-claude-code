   variant stays for controls that sit inside a padded toolbar. */
.seg--lg .seg__item { min-height: var(--tap); }
.seg__item[aria-checked="true"] { background: var(--surface-raised); color: var(--text); font-weight: var(--w-semibold); box-shadow: var(--shadow-raised); }

/* Direction of a measured change. Colour repeats the sign, it does not
   replace it: every delta on screen carries + or − as text. */
.trend-up { color: var(--success); }
.trend-down { color: var(--error); }
.chiprow--center { justify-content: center; }

/* Pinned foot inside a sheet: the primary action never scrolls away. */
.sheet__foot { padding-top: var(--sp-3); flex: none; }
.card__note { padding: var(--sp-3) var(--sp-4); }
.wrap { flex-wrap: wrap; }
.good { color: var(--success); }

/* One line, clipped with an ellipsis. For a row subtitle that lists more
   than fits at 393px. */
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Account entry in a screen header. Profile has no tab: its only unique job
   was being the door to Settings, so that door lives here instead. */
.hdr__account {
  display: flex; align-items: center; justify-content: center;
  width: var(--tap); height: var(--tap);
  margin-right: calc(var(--sp-3) * -1);
  flex: none;
  border-radius: var(--r-full);
  color: var(--text-secondary);
}
.hdr__account:active { background: var(--fill-press); }
.hdr__initial {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  border-radius: var(--r-full);
  background: var(--fill);
  color: var(--text-secondary);
  font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13);
  font-weight: var(--w-semibold);
  font-variant-numeric: tabular-nums;
}

/* A chart on a screen whose accent is already spent on the primary
   action. Same shape, neutral ink. */
.chart--quiet .chart__line { stroke: var(--text-secondary); }
.chart--quiet .chart__dot { fill: var(--text); }

/* A quiet button standing on a raised sheet needs a ground of its own:
   the sheet is already --surface-raised. */
.sheet .btn--secondary { background: var(--hairline); }
.sheet .btn--secondary:active { background: var(--border); }
/* Header without a second row of padding: the coach header carries the

/* A row's title and detail are lines, not phrases run together. */
.row__main > .meter { display: block; }

/* ===============================================================
   Added for split-builder edit mode. Tokens only, no new values.
   =============================================================== */

/* Swipe to remove. The iOS way to destroy one row without putting a
   trash can on every row. The red action exists in the DOM only while a
   row is open, so a list at rest carries no destructive control. */
.swipe { position: relative; overflow: hidden; background: var(--error-solid); }
.swipe__pane { position: relative; touch-action: pan-y; transition: transform var(--dur-fast) var(--spring-snappy); }
.swipe[data-open="true"] .swipe__pane { transform: translateX(calc((var(--sp-6) * 2 + var(--sp-5)) * -1)); }
.swipe__action {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: calc(var(--sp-6) * 2 + var(--sp-5));
  display: flex; align-items: center; justify-content: center;
  background: var(--error-solid);
  color: var(--text-on-solid);
  font-size: var(--type-13); letter-spacing: var(--tr-13);
  line-height: var(--lh-13);
  font-weight: var(--w-semibold);
}
.swipe__action:active { background: var(--error); color: var(--text-on-accent); }
/* A separator between rows survives the swipe wrapper. */
.swipe + .swipe .row { box-shadow: inset 0 1px 0 var(--hairline); }
@media (prefers-reduced-motion: reduce) {
  .swipe__pane { transition: none; }
}

/* Day heading at rest: the same line the edit field occupies, without
   being a field. */
.daycard__name { flex: 1; min-width: 0; padding: var(--sp-2); }

/* ===============================================================
   Added for train. Tokens only, no new values.
   =============================================================== */

/* Column chart. The line chart's neighbour: same axis, same tabular
   labels, one bar per bucket. Bars are ink, never accent — on Train the
   one accent fill belongs to Start. The current bucket is the bright
   one, and a bucket with nothing in it still draws a stub, so an empty
   week is visibly empty rather than invisible. */
.chart__bar { fill: var(--border); }
.chart__bar--now { fill: var(--text); }
.chart__value {
  font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11);
  fill: var(--text);
  font-weight: var(--w-semibold);
  font-variant-numeric: tabular-nums;
}

/* A trailing value that must not wrap: the date beside a history row. */
.nowrap { white-space: nowrap; }

/* ===============================================================
   Added for review. Tokens only, no new values.
   =============================================================== */

/* Direction of a change. Review is the one screen whose subject IS a
   difference, so it is the one place a semantic colour lands on a
   number: up is success, down is error, unchanged is tertiary ink. A
   sign character is always printed beside the figure, so colour is
   never the only carrier of the meaning (WCAG 1.4.1). */
.delta--up { color: var(--success); }
.delta--down { color: var(--error); }
.delta--flat { color: var(--text-tertiary); }

/* Record marker. Success tone, never accent: on this screen the single
   accent fill belongs to Save and to nothing else. */
.badge--success { background: var(--success-quiet); color: var(--success); }

/* A card whose contents are not measured. Everything else on Review is
   computed from the lifter's own history; a generated line is drawn
   with a dashed boundary and a labelled head so it can never be read
   as one of the figures above it, and so a failure inside it stays
   visibly a failure. */
.card--unverified { background: none; border: 1px dashed var(--border); }

/* ===============================================================
   Added for settings. Tokens only, no new values.
   =============================================================== */

/* Switch. Settings is the first screen in the system to use one, and a
   screen of switches cannot spend the accent on every "on": the accent
   fill marks the one primary action, so twelve accent pills in a list
   would mark nothing. "On" is a state, not an action, so it takes the
   semantic success tone the way an iOS switch does — 10.08:1 against
   --surface in dark, 6.03:1 in light. The off track is --hairline, only
   1.51:1 against the card it sits on, so it also carries a --border ring
   — 3.44:1 dark, 4.12:1 light — and stays a visible control when off
   (WCAG 1.4.11). The knob is --knob, white in BOTH themes: it rides a
   coloured track, so it must not follow --text, which inverts. */
.switch__track { box-shadow: inset 0 0 0 1px var(--border); }
.switch[aria-checked="true"] .switch__track { background: var(--success); box-shadow: none; }

/* A row whose action destroys something. Never an accent fill, never a
   red ground: the ink carries the warning, the confirmation carries the
   consequence. */
.row--danger .row__title { color: var(--error); }
.row--danger:active { background: var(--error-quiet); }

/* A row that reports rather than acts: storage, account state. Has no
   pressed state because there is nothing to press. */
.row--static:active { background: var(--surface); }

/* A quiet button standing on a dialog, which is --surface-raised like a
   sheet, needs the same darker ground the sheet rule gives it. */
.dialog .btn--secondary { background: var(--hairline); }
.dialog .btn--secondary:active { background: var(--border); }

/* Toast on a screen with no tab bar. The pushed screens sit above no
   nav, so the toast sits on the safe area instead of above 56px of it. */
.toast--nonav { bottom: calc(var(--sp-4) + var(--safe-bottom)); }


/* ===============================================================
   Added for workout-log. Tokens only, no new values.

   This screen is a RESTORATION. The shipped shape — a dark card per
   exercise, a dense grid of directly editable sets inside it, a
   summoned numeric pad, orange accents — is the shape the owner
   uses and asked to keep. Only the four measured defects moved:
     - every hit area is now >= 44x44 while the drawn control keeps
       roughly its shipped size, so the card stays as dense as it was
       (one set still occupies ~96px, exactly as shipped);
     - the pad replaces the pending value on the first digit instead
       of appending to it (5 of 15 taps were deletions);
     - one unit, the profile's, on the column head, the totals, the
       pad and the plate calculator;
     - the accent fill moves off Finish and onto the done control,
       which is the act performed every 90 seconds.
   =============================================================== */

/* --- Session header ------------------------------------------- */
/* Two rows, as shipped: the name and the session controls on one
   line, the running numbers on their own line beneath them so a
   long session name can never push the volume onto a second line. */
.sess { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.sess__main { flex: 1; min-width: 0; }
.sess__meta { flex: 1 0 100%; order: 3; display: flex; align-items: baseline; gap: var(--sp-3); }
.sess__meta > * { white-space: nowrap; }
.sess__time { color: var(--accent-text); font-variant-numeric: tabular-nums; }
/* Quick action. A 44x44 outlined square, the shipped bolt. */
.qa {
  flex: none;
  width: var(--tap); height: var(--tap);
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--r-md);
  corner-shape: var(--corner-smooth);
  border: 1px solid var(--border);
  color: var(--accent-text);
  background: none;
}
.qa:active { background: var(--accent-quiet); }
/* Finish. Outlined, not filled: it ends the workout, it is not the
   thing being done every 90 seconds. Discard is quieter still. */
.btn--outline {
  background: none;
  color: var(--accent-text);
  box-shadow: inset 0 0 0 1px var(--accent-text);
}
.btn--outline:active { background: var(--accent-quiet); }

/* --- Exercise card -------------------------------------------- */
.exc { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; }
.exc + .exc, .exc + .block, .block + .exc, .block + .block { margin-top: var(--sp-3); }
.exc__head {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  box-shadow: inset 0 -1px 0 var(--hairline);
}
.exc__main { flex: 1; min-width: 0; text-align: left; background: none; color: inherit; padding: var(--sp-1) 0; min-height: var(--tap); display: flex; flex-direction: column; justify-content: center; }
.exc__name { display: block; font-size: var(--type-17); line-height: var(--lh-17); letter-spacing: var(--tr-17); font-weight: var(--w-semibold); }
.exc__muscle { display: block; font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13); color: var(--text-secondary); }
/* Drag handle. Drawn at its shipped width, 44x44 of hit area around it. */
.exc__grip {
  flex: none; width: var(--tap); height: var(--tap);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-tertiary); border-radius: var(--r-sm);
}
.exc__grip:active, .exc__grip[aria-pressed="true"] { background: var(--fill-press); color: var(--text); }
.exc--lifted { box-shadow: inset 0 0 0 2px var(--accent-text); }

/* --- The set grid. The dense part, and the point of the screen. */
.sets { padding: var(--sp-2) var(--sp-3) var(--sp-3); }
.setgrid {
  display: grid;
  grid-template-columns: var(--sp-5) 1fr 1fr calc(var(--sp-6) + var(--sp-5)) var(--tap);
  gap: var(--sp-2);
  align-items: center;
}
.setgrid__head { font-size: var(--type-11); line-height: var(--lh-11); letter-spacing: var(--tr-11); font-weight: var(--w-semibold); text-transform: uppercase; color: var(--text-tertiary); text-align: center; padding-bottom: var(--sp-1); }
.setgrid__head--n { text-align: left; }
.setgrid__head--unit { color: var(--accent-text); }
.setgrid__n { font-size: var(--type-13); line-height: var(--lh-13); letter-spacing: var(--tr-13); color: var(--text-tertiary); font-variant-numeric: tabular-nums; text-align: center; }
.setgrid__n--warm { color: var(--text-secondary); }

/* An editable value. Every set's cell is live, not just the current
   one: tapping any of them opens the pad on that set. */
.cell {
  min-height: var(--tap);
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  corner-shape: var(--corner-smooth);
  background: var(--fill);
  color: var(--text);

.chip--icon .ico { width: 18px; height: 18px; }

/* ===============================================================

   Shared by the Exercise Library and the body-map screen. bodymap.js
   builds the geometry; this is what it looks like. The body is data, so
   it carries the anatomy palette from tokens.css; every other surface on
   a screen showing it stays monochrome, and the accent stays reserved for

   travels with it and the lifter sees where they came from. */

   plus the shorts. No hue, no meaning. */

/* A muscle group: every belly the anatomy gives it, filled in the group's
   hue, with the seam between two bellies drawn in that hue taken most of
   the way to black. The seam is what separates the eight abdominal
   segments and the three heads of the quadriceps, so the definition on the
   figure is anatomy rather than decoration.

   Over each group sits one soft top-down wash, clipped to the group, so a
   mass is lighter where it faces the light and darker where it turns away.
   The wash carries no meaning and never takes a tap. */
.mg { cursor: pointer; }
.mg__gnd { transition: fill var(--dur-fast) var(--ease), stroke var(--dur-fast) var(--ease); }

   a stroke-only target would be a ring around a muscle whose middle a

   this holds wherever the figure is drawn -- a full-screen map, or a pair of
   small ones in an exercise sheet. */
.map__svg[data-selected] .mg:not([data-on]) .mg__gnd {
  fill: var(--anat-muted);
  stroke: color-mix(in srgb, var(--anat-muted) 22%, #000);

   paired muscle is a box across the whole chest. It is suppressed on focus of

.mg:focus, .part:focus, .mg:focus-visible, .part:focus-visible { outline: none; }

/* ===============================================================
   LIQUID GLASS

   One class, for the chrome layer only. Applying it to a content card is the
   mistake this comment exists to prevent: glass works because the thing
   behind it is solid and vivid, so a screen of glass on glass is a screen of
   grey boxes.

   Glass cannot sample glass. Two overlapping glass surfaces must share one
   container with one background rather than stacking, which is what
   .glass-group is for.
   =============================================================== */

.glass {
  background: var(--glass-tint);
  backdrop-filter: saturate(var(--glass-saturate)) blur(var(--glass-blur));
  -webkit-backdrop-filter: saturate(var(--glass-saturate)) blur(var(--glass-blur));

   its own dimming behind the content that sits on it. */

   rather than as panes stacked on panes. Children opt out of their own. */
.glass-group { position: relative; }

  backdrop-filter: none;
  -webkit-backdrop-filter: none;

   this is the setting Liquid Glass shipped broken against. */

/* Increase Contrast wants the edge to carry its weight rather than the blur. */
@media (prefers-contrast: more) {

}


/* ===============================================================
   PRESS

   An iOS control responds on touch-down, not on click. The gap between a
   finger landing and a colour changing is the difference between a control
   and a link, and it is about 80ms of nothing that everybody can feel.

   :active fires on pointer-down in every current engine, so the colour
   changes below already do the right thing. What they do not do is move. A
   real press takes the control down slightly and springs it back, and the
   spring is what makes it feel like an object rather than a state.

   Scale, not translate: the control must not appear to move on the screen,
   only to be pushed into it. 0.96 is Apple's own figure for a glass press.
   =============================================================== */

.btn, .chip, .row, .opt, .tabbar__item, .seg__item, .iconbtn,
.hdr__back, .hdr__action, .pad__key {

     Going down is immediate, because a press that eases in feels late. */
  transition: transform var(--dur-slow) var(--spring-bouncy),
              background-color var(--dur-fast) var(--ease),
              opacity var(--dur-fast) var(--ease);
}

.btn:active, .chip:active, .opt:active, .seg__item:active,
.iconbtn:active, .hdr__back:active, .hdr__action:active, .pad__key:active {
  transform: scale(0.96);
  transition-duration: 0s;
}

/* A full-width row scales less: 0.96 on something 361px wide is a visible
   jump at the edges, where the same figure on a 44px button is a nudge. */
.row:active { transform: scale(0.99); transition-duration: 0s; }

/* A control that is doing nothing does not react. */
.btn:disabled:active, .chip:disabled:active, .opt:disabled:active,
.iconbtn:disabled:active { transform: none; }

@media (prefers-reduced-motion: reduce) {
  .btn, .chip, .row, .opt, .tabbar__item, .seg__item, .iconbtn,
  .hdr__back, .hdr__action, .pad__key { transition: background-color var(--dur-fast) var(--ease); }
  .btn:active, .chip:active, .row:active, .opt:active, .seg__item:active,
  .iconbtn:active, .hdr__back:active, .hdr__action:active,
  .pad__key:active { transform: none; }
}

<script>
/* theme.js — inlined verbatim from 08-build/theme.js */
/* LOCKED — theme initialiser.

   One file, loaded by every screen in <head> before any stylesheet-
   dependent paint, so the stored appearance is on the root element the
   first time the page is painted and there is no flash of the wrong
   theme. Nothing here touches the DOM beyond the root attribute, so it
   runs safely before <body> exists.

   THREE VALUES, stored in localStorage under lk_theme:
     "dark"    the demo's primary theme, and the default
     "light"   the contrast-checked light palette
     "system"  Match device. The attribute is REMOVED, and the
               prefers-color-scheme rule in tokens.css decides.

   Why the attribute is removed rather than resolved to dark or light:
   the CSS is then the single source of truth for what "match device"
   means, the page keeps following the device if the user changes it
   mid-session with no listener needed, and a screen still themes
   correctly if this script never runs.

   localStorage can throw (private mode, a file:// origin with site data
   blocked). Every access is guarded and the failure mode is the default
   theme, never a broken screen. */
(function () {
  'use strict';

  var KEY = 'lk_theme';
  var VALUES = { dark: 1, light: 1, system: 1 };
  var DEFAULT = 'dark';
  var root = document.documentElement;

  function read() {
    var v;
    try { v = window.localStorage.getItem(KEY); } catch (e) { v = null; }
    return VALUES[v] ? v : DEFAULT;
  }

  function paint(pref) {
    if (pref === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', pref);
  }

  paint(read());

  /* The one API the screens use. Settings writes through set(); every
     other screen only ever reads what Settings stored. */
  window.LKTheme = {
    key: KEY,
    get: read,
    set: function (pref) {
      if (!VALUES[pref]) pref = DEFAULT;
      try { window.localStorage.setItem(KEY, pref); } catch (e) {}
      paint(pref);
      return pref;
    },
    /* "Dark" / "Light" / "Match device", for a row that shows its value. */
    label: function (pref) {
      return pref === 'system' ? 'Match device' : pref === 'light' ? 'Light' : 'Dark';
    }
  };

  /* A second tab, or the same screen reopened behind this one, changing
     the preference. Cheap, and it keeps two open demo screens agreeing. */
  window.addEventListener('storage', function (e) {
    if (e.key === KEY) paint(read());
  });
})();

</script>
<script>
/* app.js — inlined verbatim from 08-build/app.js */
/* LOCKED — DOM reconciler.

   Loaded by every screen in <head>, next to tokens.css and components.css:

       <script src="app.js"> ... close the tag

   No dependencies, no build step, no network. Works from file://.

   WHY THIS FILE EXISTS
   Every screen renders by building an HTML string and assigning it to a
   container. That is a fine way to describe a screen and a terrible way to
   apply one: `el.innerHTML = html` destroys every node in the container and
   builds new ones, so on every state change the caret leaves the input you
   were typing in, focus lands back on <body>, scroll snaps to the top, and
   every CSS entry animation replays on elements that did not change. That is
   the "screen resets and jumps" people report.

   The fix is to keep the string and change what is done with it. LKPatch
   morphs the container's existing children into the shape the new markup
   describes: it matches nodes, updates the ones that stayed, inserts the ones
   that are new, removes the ones that are gone, and leaves everything else —
   identity, focus, caret, scroll, running animations — exactly where it was.

       LKPatch(container, html);      // instead of container.innerHTML = html

   HOW NODES ARE MATCHED
   By a stable key first: data-testid, then id, then data-key. A keyed node
   that is still described by the new markup keeps its identity and is never
   replaced — it is moved at most. Unkeyed nodes fall back to tag name plus
   position among their siblings, which is what the screens' own lists need.

   THE RULE FOR FORM STATE
   `.value`, `.checked` and `.selected` are live state that diverges from the
   markup the moment a person touches the control. So they are written only
   when the DECLARED value changed — when the new markup says something
   different from what the old markup said — never merely because the live
   value differs from the markup. A re-render fired by a keystroke therefore
   cannot move the caret or clear the field, while a state change that really
   does set a new value still lands.

   ANIMATIONS

         groups: { chest: { name: 'Chest', n: 30 }, ... },
         order:  ['chest', 'back', ...],
         onSelect: function (gid) { ... }
       });
       map.setView('back');        // front | back
       map.select('chest');        // or null to clear
       map.view, map.selected      // what it is showing now

   Two options make it a picture rather than a control, which is what the
   exercise sheet wants: `interactive: false` takes the muscles out of the tab
   order and off the pointer, and `view: 'back'` opens on the far side. A
   figure like that still answers `select`, so the sheet lights the one group
   the exercise works and nothing else.

   The art itself is in vendor/body-art.js, with its licence and the reason
   it is there. This file is the geometry, the hit model and the paint.
*/
(function (global) {
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';

  function n2(v) { return Math.round(v * 10) / 10; }

  var ART = global.LKBodyArt;
  if (!ART) throw new Error('LKBodyMap: vendor/body-art.js must load first');
  var FIGURE = { front: [53, 96, 622, 1244], back: [773, 97, 622, 1245] };
  var TOP = 12, BOTTOM = 411, MID = 100;

  function fitOf(view) {
    var b = FIGURE[view];
    var s = (BOTTOM - TOP) / b[3];
    return { s: s, tx: MID - (b[0] + b[2] / 2) * s, ty: TOP - b[1] * s };
  }
  var FIT = { front: fitOf('front'), back: fitOf('back') };
  function fitAttr(view) {
    var f = FIT[view];
    return 'translate(' + n2(f.tx) + ' ' + n2(f.ty) + ') scale(' + (Math.round(f.s * 1e5) / 1e5) + ')';
  }
  /* A measured box, in the frame's coordinates rather than the art's. */
  function boxIn(view, b) {
    var f = FIT[view];
    return { x: b[0] * f.s + f.tx, y: b[1] * f.s + f.ty, w: b[2] * f.s, h: b[3] * f.s };
  }

  var MEASURED = {"front": {"chest": [255, 317, 218, 118], "abs": [256, 417, 217, 299], "biceps": [182, 406, 365, 87], "back": [284, 280, 160, 32], "shoulders": [195, 303, 339, 94], "adduc": [274, 647, 180, 251], "quads": [241, 667, 246, 281], "calves": [251, 973, 226, 259], "forearms": [126, 498, 477, 188]}, "back": {"back": [956, 297, 255, 342], "shoulders": [914, 311, 339, 87], "triceps": [899, 382, 370, 153], "forearms": [839, 518, 490, 170], "glutes": [976, 619, 214, 159], "adduc": [1039, 784, 88, 79], "hams": [962, 741, 243, 266], "calves": [970, 972, 227, 318]}};
  /* The thinnest single belly in each group, measured: what a finger is
     actually aiming at when it goes for that group. */
  var THIN = {"front": {"chest": 103, "abs": 15, "biceps": 41, "back": 31, "shoulders": 84, "adduc": 19, "quads": 19, "calves": 30, "forearms": 57}, "back": {"back": 35, "shoulders": 67, "triceps": 22, "forearms": 17, "glutes": 50, "adduc": 33, "hams": 20, "calves": 18}};

  /* Where a group divides into real muscles, each one measured too. */
  var PART_BOX = {"front": {"back": {"Traps": [284, 280, 160, 32]}}, "back": {"back": {"Traps": [1003, 297, 162, 176], "Lats": [956, 323, 255, 263], "Lower Back": [984, 487, 199, 152]}}};

  /* HIT AREAS

     A rectangle over a group's extent cannot work here, because a paired
     muscle's extent spans both arms: the triceps box is 370 units wide and
     swallows the whole chest between them. So the muscle itself is the
     target. A tap on the pectoral selects Chest because that is what was
     tapped, which is also the only rule a person would guess.

     What a shape cannot give is size. Several bellies are drawn narrower
     than a finger -- the trapezius above the collarbone is 10 CSS px tall
     on this frame, against the 44 the rest of the app holds itself to -- so
     each muscle also carries a copy of itself in a transparent stroke wide
     enough to bring it up to 44. A stroke grows a shape along its own
     outline rather than into a box around it, so a thin muscle gains reach
     without covering the muscle beside it.

     The strokes live in one layer above the paint, laid down largest first,
     so where two grown outlines overlap the smaller muscle -- the harder
     target, and the one a finger near it was aiming at -- wins. */
  var MIN_HIT = 44;
  /* How wide a viewBox unit is on screen. The frame is 240 units across and
     renders at roughly the screen width, so a unit is worth rather more than
     a CSS pixel. Reach is baked in at build time and the figure is a fixed
     fraction of the viewport, so this is a constant rather than a measurement
     of a element that may not be in the document yet. */
  var FRAME_UNITS = 240;
  function unitPx() {
    var w = global.innerWidth || 390;
    return Math.min(w, 430) / FRAME_UNITS;
  }
  /* How much stroke a group needs, in CSS pixels, to bring its thinnest
     belly up to 44. The group's own bounding box is no use here, because a
     paired muscle's box spans both arms and reports a width no finger will
     ever meet; THIN holds the measured thinnest single belly instead.

     A stroke lies half outside the shape, so clearing a shortfall of d takes
     a stroke of d. It is capped at 44, past which a margin says more about the empty space
     around a muscle than about the muscle. The exact-shape layer above keeps
     a margin from ever taking a tap that landed on another muscle. */
  function reachOf(view, gid) {
    var t = THIN[view] && THIN[view][gid];
    if (!t) return 0;
    var thin = t * unitPx() * FIT[view].s;
    return Math.max(0, Math.min(MIN_HIT - thin, 44));
  }

  function el(tag, attrs, doc) {
    var n = (doc || document).createElementNS(NS, tag);
    for (var k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    return n;
  }

  /* The per-group fill rules, generated from the palette so the twelve hues
     are declared once, in tokens.css, and nowhere else. Written once per
     document, however many maps that document holds. */
  function installHues(doc, order) {
    if (doc.getElementById('lk-anat-hues')) return;
    var style = doc.createElement('style');
    style.id = 'lk-anat-hues';
    style.textContent = order.map(function (gid) {
      var v = 'var(--anat-' + gid + ')';
      /* The belly carries the hue itself. The seam between two bellies is the
         same hue taken most of the way to black, so a muscle border reads as
         shadow between two masses rather than as an ink outline. */
      return '.mg--' + gid + ' .mg__gnd { fill: ' + v + '; ' +
             'stroke: color-mix(in srgb, ' + v + ' 22%, #000); }\n' +
             '.lab--' + gid + ' { color: ' + v + '; }\n' +
             '.pick__dot--' + gid + ' { background: ' + v + '; }';
    }).join('\n');
    (doc.head || doc.documentElement).appendChild(style);
  }

  /* Which of a group's sub-regions are real on this figure.

     Only two of the twelve divide honestly. Back divides into three muscles
     the art draws separately: the trapezius, the latissimus and the erectors.
     Chest divides into upper, mid and lower, which are the clavicular,
     sternal and costal heads of one continuous sheet -- there is no border
     between them to draw, so they are the pectoral clipped into three bands.
     That is what the heads are.

     The other ten do not. Front, side and rear deltoid are three faces of one
     mass and two of them are on the far side of the body; the heads of the
     triceps and biceps are stacked, not banded; and the Abs group's own
     sub-regions, Weighted and Bodyweight, are a way of choosing an exercise
     rather than a part of anybody. Drawing regions on those would be
     inventing anatomy, so a screen sends those groups straight to their
     exercises. */
  function partsOf(gid, view) {
    var real = ART[view].parts && ART[view].parts[gid];
    if (real) return { kind: 'muscles', names: Object.keys(real), paths: real };
    if (gid === 'chest') return { kind: 'bands', names: ['Upper', 'Mid', 'Lower'] };
    return null;
  }

  /* DRAWING

     The art already carries both sides of the body, so nothing is mirrored
     here and nothing is generated: each path is drawn where the anatomy put
     it. A group is one <g> holding every path the twelve-group mapping gave
     it, which is what makes a tap anywhere on either pectoral select Chest.

     Depth comes from the shapes rather than from shading tricks. Adjacent
     bellies share a hairline in a darker tone of the same hue, so the eight
     abdominal segments, the two heads of the calf and the three of the
     quadriceps read as separate muscles without a single extra line being
     invented. Over that sits one soft top-down wash per group. */

  function shadeDefs(api) {
    if (api.defs.querySelector('#mg-shade')) return;
    var g = api.el('linearGradient', { id: 'mg-shade', x1: '0', y1: '0', x2: '0', y2: '1' });
    g.appendChild(api.el('stop', { offset: '0', 'stop-color': '#fff', 'stop-opacity': '0.20' }));
    g.appendChild(api.el('stop', { offset: '0.5', 'stop-color': '#fff', 'stop-opacity': '0.02' }));
    g.appendChild(api.el('stop', { offset: '1', 'stop-color': '#000', 'stop-opacity': '0.14' }));
    api.defs.appendChild(g);
  }

  function drawPaths(api, host, paths, cls) {
    paths.forEach(function (d) { host.appendChild(api.el('path', { d: d, class: cls })); });
  }

  function buildView(api, view) {
    var art = ART[view], fit = fitAttr(view);
    var slot = api.views[view];
    var GROUPS = api.groups, ORDER = api.order;

    /* The inert body first: head, neck, hands, feet, knees, ankles and the
       shin. It carries no hue and never takes a tap, and it is the reason
       the figure reads as a person rather than a chart.

       The silhouette under it is not an outline: it is the union of the inert
       body and every muscle, laid down once in the ground tone under a fat
       round stroke, so a gap between two masses reads as body rather than as
       the screen behind it. */
    var base = api.el('g', { transform: fit });
    var union = art.inert.slice();
    ORDER.forEach(function (gid) {
      if (art.groups[gid]) union = union.concat(art.groups[gid]);
    });
    drawPaths(api, base, union, 'sil');
    drawPaths(api, base, art.inert, 'inert');
    slot.base.appendChild(base);

    var host = slot.groups;
    var made = {};
    function groupFor(gid) {
      if (made[gid]) return made[gid];
      /* The group sits in the frame's coordinates, so its hit rectangles are
         written in the same numbers a label or a zoom camera uses. Only the
         art inside it is fitted. */
      var meta = GROUPS[gid] || { name: gid, n: 0 };
      /* A figure that is not a control carries no role, no tab stop and no
         name: the whole picture is labelled by whatever mounted it, and
         twelve unreachable buttons inside it would be noise to a screen
         reader and a trap to a keyboard. */
      var g = api.el('g', api.interactive ? {
        class: 'mg mg--' + gid, tabindex: '0', role: 'button',
        'data-g': gid, 'data-testid': 'mg-' + gid,
        'aria-label': meta.name + (meta.n ? ', ' + meta.n + ' exercises' : '')
      } : {
        class: 'mg mg--' + gid, 'data-g': gid, 'aria-hidden': 'true'
      });
      host.appendChild(g);
      made[gid] = g;
      return g;
    }

    ORDER.forEach(function (gid) {
      var paths = art.groups[gid];
      if (!paths || !paths.length) return;
      var g = groupFor(gid);
      var inner = api.el('g', { transform: fit });
      drawPaths(api, inner, paths, 'mg__gnd');

      /* One gradient wash over the whole group, clipped to it, so the light
         falls across the mass rather than across each segment of it. */
      var clip = 'mgc-' + api.uid + '-' + view + '-' + gid;
      var cp = api.el('clipPath', { id: clip, clipPathUnits: 'userSpaceOnUse' });
      drawPaths(api, cp, paths, '');
      api.defs.appendChild(cp);
      var b = MEASURED[view][gid];
      var wash = api.el('g', { 'clip-path': 'url(#' + clip + ')', class: 'mg__wash' });
      wash.appendChild(api.el('rect', { x: b[0], y: b[1], width: b[2], height: b[3],
        fill: 'url(#mg-shade)' }));
      inner.appendChild(wash);
      g.appendChild(inner);
    });

    /* Nothing to grow when nothing can be tapped. */
    if (!api.interactive) return;

    /* The reach paths sit in one layer of their own after every group, rather
       than inside the groups, because a layer inside a group would still be
       painted under the next group along. They carry the group id themselves,
       and the tap handler reads that id rather than the group element.
       Largest reach first, so the thinnest muscle ends up on top. */
    var reach = ORDER.filter(function (gid) {
      return art.groups[gid] && reachOf(view, gid) > 0;
    }).sort(function (x, y) { return reachOf(view, y) - reachOf(view, x); });

    var reachLayer = api.el('g', { class: 'reach', transform: fit, 'aria-hidden': 'true' });
    reach.forEach(function (gid) {
      art.groups[gid].forEach(function (d) {
        reachLayer.appendChild(api.el('path', { d: d, class: 'hit', 'data-g': gid,
          'stroke-width': Math.round(reachOf(view, gid) * 10) / 10 }));
      });
    });
    host.appendChild(reachLayer);

    /* Above the grown margins, every muscle's exact shape. The rule this
       settles is that a muscle's own outline always beats a neighbour's
       margin: the abdominal wall is thin enough to need 30px of reach, which
       would otherwise spill over the adductor beside it and take taps meant
       for the muscle a finger was on. Within this layer the paint order
       stands, so where the deltoid genuinely covers the pectoral, tapping the
       overlap selects the deltoid, as the picture says it should. */
    var exactLayer = api.el('g', { class: 'exact', transform: fit, 'aria-hidden': 'true' });
    ORDER.forEach(function (gid) {
      if (!art.groups[gid]) return;
      art.groups[gid].forEach(function (d) {
        exactLayer.appendChild(api.el('path', { d: d, class: 'hit hit--exact', 'data-g': gid }));
      });
    });
    host.appendChild(exactLayer);
  }

  /* ---------------------------------------------------------------
     Mounting
     --------------------------------------------------------------- */

  var nextUid = 0;

  function mount(host, opts) {
    opts = opts || {};
    var doc = host.ownerDocument || document;
    var GROUPS = opts.groups || {};
    var ORDER = opts.order || Object.keys(GROUPS);
    installHues(doc, ORDER);

    var mk = function (t, a) { return el(t, a, doc); };
    var interactive = opts.interactive !== false;
    var startView = opts.view === 'back' ? 'back' : 'front';
    var svg = mk('svg', interactive ? {
      class: 'map__svg', viewBox: '-16 8 240 402',
      preserveAspectRatio: 'xMidYMid meet',
      role: 'group', 'aria-label': 'Muscle map, ' + startView + ' view'
    } : {
      class: 'map__svg map__svg--static', viewBox: '-16 8 240 402',
      preserveAspectRatio: 'xMidYMid meet', 'aria-hidden': 'true', focusable: 'false'
    });
    var defs = mk('defs');
    var cam = mk('g', { class: 'cam' });
    svg.appendChild(defs);
    svg.appendChild(cam);

    var views = {};
    ['front', 'back'].forEach(function (v) {
      var wrap = mk('g', { class: 'view' });
      if (v !== startView) wrap.setAttribute('data-hidden', 'true');
      var base = mk('g'), groups = mk('g');
      wrap.appendChild(base);
      wrap.appendChild(groups);
      cam.appendChild(wrap);
      views[v] = { wrap: wrap, base: base, groups: groups };
    });

    var api = {
      element: svg, svg: svg, defs: defs, cam: cam, views: views, doc: doc,
      uid: ++nextUid, el: mk, interactive: interactive,
      view: startView, selected: null,
      groups: GROUPS, order: ORDER,
      /* The geometry, so a screen that zooms can frame a group without
         measuring the DOM. */
      measured: MEASURED, thin: THIN, partBox: PART_BOX, figure: FIGURE,
      fitAttr: fitAttr, boxIn: boxIn, fit: FIT, n2: n2, partsOf: partsOf, art: ART
    };

    shadeDefs(api);
    buildView(api, 'front');
    buildView(api, 'back');
    host.appendChild(svg);

    api.setView = function (v) {
      if (v !== 'front' && v !== 'back') return;
      api.view = v;
      views.front.wrap.setAttribute('data-hidden', String(v !== 'front'));
      views.back.wrap.setAttribute('data-hidden', String(v !== 'back'));
      if (interactive) svg.setAttribute('aria-label', 'Muscle map, ' + v + ' view');
    };

    api.select = function (gid) {
      api.selected = gid || null;
      /* The flag goes on the figure, not on whatever contains it. A figure in
         a sheet has no map frame around it, and a rule that reached for one
         left every muscle lit. */
      if (api.selected) svg.setAttribute('data-selected', api.selected);
      else svg.removeAttribute('data-selected');
      Array.prototype.forEach.call(svg.querySelectorAll('.mg[data-g]'), function (g) {
        if (g.getAttribute('data-g') === api.selected) g.setAttribute('data-on', '');
        else g.removeAttribute('data-on');
      });
    };

    function choose(target, e) {
      var t = target && target.closest ? target.closest('[data-g]') : null;
      if (!t) return false;
      if (e) e.preventDefault();
      var gid = t.getAttribute('data-g');
      api.select(gid);
      if (opts.onSelect) opts.onSelect(gid);
      return true;
    }

    if (interactive) {
      /* One listener on the figure. '[data-g]' rather than '.mg', because the
         reach paths carry the group id but sit outside the groups, so a thin
         muscle can be grown without being painted over by the next group. */
      svg.addEventListener('click', function (e) { choose(e.target, null); });

      /* Enter and Space on a focused muscle, so the map is not mouse-only.
         Groups are already focusable, in anatomical order. */
      svg.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
        choose(e.target, e);
      });
    }

    return api;
  }

  global.LKBodyMap = { mount: mount, partsOf: partsOf };
})(typeof window !== 'undefined' ? window : this);

</script>
</head>

          data-testid="demo-index-toggle">Screens</button>

    <span aria-hidden="true">&#8592;</span><span class="demo-back__label">Back</span>

<template id="demo-tpl-home">
<!--
  HOME — what survives, and why.

  The audits measured a 1,688px screen whose only real action started at
  y659 of a 781px fold, behind 534px of read-only material. This screen
  answers one question — train today, or not, and if so, what — and puts
  the answer, the reason to act on it, and the action in the first fold.

  FOUR BLOCKS (was 10):
  1. Momentum band. The hero figure the old screen never had: weeks on
     plan (5, measured from lk_history: weeks of Aug 3, 10, 17, 24 and 31
     each carry three lifting sessions; the week of Jul 27 carries two,
     which is where the count starts). Beside it, the week rhythm — a
     sunken track showing the seven days as trained, today, planned or
     rest. Streak plus this week, one line, no chrome. Not interactive,
     so nothing here is a target under 44px.
  2. Answer card. Session name, its shape, the accent-filled primary.
     Raised on a training day, sunken on a rest day: the two states are
     given different tone, not different colour.
  3. Last session row. One tap back into the thing most likely to be
     unfinished, and the only place a relative date belongs.
  4. Climbing lift row. The third timescale: the squat's top set across
     five weeks, drawn as a sparkline whose endpoints are named in text.

  CUT: greeting block, 2x2 stat grid (179px, 0 controls), quick actions,
  feed cards (source of the "999 days" sentinel), VIEW PROGRESS (a button
  standing in for a tab), Weekly Recap, calendar (338px, no tappable
  cells), cycle row, ThrowbackCard, the voice FAB (second accent fill,
  and it intercepted pointer events over the last block).

  MOTION: one entry animation per state, on the block that answers the
  question. Training rises into place; rest settles down into it. The
  week track fills left to right and stops on today. Both are switched
  off under prefers-reduced-motion.

  ACCENT: exactly one accent fill per state, on the primary action.
  Today's mark in the week track carries a 2px --accent-text ring, not
  a fill, and only on a training day.

  NUMBERS: every figure is tabular and carries its unit. Dates are
  relative inside the week, absolute after it, never a sentinel.
-->

<div class="stage">
  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-home">

      <header class="hdr">
        <div class="hdr__title stack stack--1">
          <span class="t-meta num" id="hdr-date">WED, SEP 9</span>
          <h1 class="t-title">Today</h1>
        </div>
        <button class="hdr__account" data-testid="open-account" aria-label="Account and settings">
          <span class="hdr__initial" aria-hidden="true">C</span>
        </button>
      </header>

      <main class="body" id="body" data-testid="home-scroll" tabindex="-1"></main>

      <nav class="tabbar" aria-label="Sections">
        <button class="tabbar__item" aria-current="page" data-testid="tab-home">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></svg>
          Home
        </button>
        <button class="tabbar__item" data-testid="tab-train">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/></svg>
          Train
        </button>
        <button class="tabbar__item" data-testid="tab-fuel">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M9 13v8"/><path d="M17 3c-1.5 1.8-2 3.6-2 5.5 0 1.6.7 2.5 2 2.5s2-.9 2-2.5c0-1.9-.5-3.7-2-5.5Z"/><path d="M17 11v10"/></svg>
          Fuel
        </button>
        <button class="tabbar__item" data-testid="tab-progress">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M7 16v-4M12 16V7M17 16v-6"/></svg>
          Progress
        </button>
        <button class="tabbar__item" data-testid="tab-coach">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H9l-4 3V7a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3z"/></svg>
          Coach
        </button>
      </nav>

    </div>
  </div>
</div>

<div class="dev">
  <button class="dev__toggle" id="dev-toggle" aria-expanded="false" aria-controls="dev-menu" data-testid="dev-toggle">State</button>
  <div class="dev__menu" id="dev-menu" hidden data-testid="dev-menu"></div>
</div>

<template id="demo-tpl-train">
<!--
  TRAIN — what this screen is, and why it is shaped this way.

  WHY IT EXISTS. The HIG audit's finding 2: "the split builder has no
  entrance once you have a split. Train lands directly on Exercises with
  no sub-navigation, and populated Home offers only 'Choose another
  session'. For a user who already has a split, editing their own
  program is unreachable at any depth." Train is now the home of
  everything training-related that is not the active session: the splits
  you own, the record of what you did, cardio, and the catalogue.

  STRUCTURE: ONE SCROLLING SCREEN, ONE PUSHED DESTINATION, TWO SHEETS.

  Sections on one screen, not tabs. The audited hub had a three-item
  underline sub-tab row (My Splits / History / Library) that was broken
  as a set — "Library" replaced the whole hub while the other two swapped
  content — and the design audit counted it as the app's sixth tab
  idiom. The four things this screen holds are not peers you switch
  between; they are one continuous answer to "what do I do about
  training". Splits, cardio and history are read in that order, top to
  bottom, and stacking them costs a scroll rather than a tap. The
  segmented control is spent once, on the one place a filter genuinely
  reduces work: the full history list. That is the app's single
  segmented control, and this screen introduces no second tab pattern.

  Two things push away, both because they are deeper than daily:
    - All history (22 sessions, filterable) is its own destination,
      reached from a five-row preview. Same row component in both, so
      this is a preview and its expansion, not the two competing
      history lists the Cardio audit found.
    - Editing a split lives inside a sheet on the split, one level below
      starting a day. Monthly action, one level deeper; still findable
      because the split row is the obvious thing to touch.

  TAPS. Start today's session: 1 (Start Push, first fold). Start any
  other day: 2 (split row, then the day). Edit a split: 2 (split row,
  then Edit split). The audited hub was 3 taps cold to a programmed
  workout, and editing a split had no entrance at all.

  WHAT CAME FROM CARDIO. Both audits concluded Cardio merges here: its
  history list filtered the same lk_history Train already rendered, so
  one of the two was pure duplication.
    - The history row design. The Cardio audit judged its row the
      better of the two: icon, title, one muted metric line, a
      right-aligned date. Train's printed the duration twice and wrapped
      the metrics in an accent-outlined pill that competed with the
      lifting volume figure. This screen has one row component, used for
      both kinds of session; the duration is printed once and no metric
      carries a pill.
    - MINUTES PER WEEK, kept as built: eight bars, tabular labels, a
      dated axis, one bar standing out. Its ink is --text rather than
      the accent, because the accent on this screen is on Start.
    - Instead of the 41-tile wall: ranking. The audit called the wall a
      selection problem — 41 equal tiles ordered by category, ~2,700px
      tall, favourites the real fix but taught only in the empty state.
      Here the three activities this lifter actually does are rows at
      the top, already carrying their usual duration, one tap to log.
      Everything else is behind one row that opens a search-first
      picker. Rank the list, do not enlarge the grid.
    - Dropped from Cardio: the separate screen and its back button, the
      duplicate history list and filter chips, the "which treadmill?"
      step its own copy called cosmetic, the tile gradients and glow.

  ALSO CUT. Quick Start (an accent fill that started an empty workout
  while the programmed session sat below the fold), the RECENT strip
  (clipped past the third chip, every chip reachable from history), the
  day sheet that re-listed days already on screen, and Delete split from
  the footer row — it had no confirm and sat a thumb-width from Start.
  Deleting a split belongs in the editor that owns it.

  ACCENT: exactly one fill per state, on the action a lifter came to
  take. Populated: Start Push. Empty: Build a split. Error: Try again.
  Loading and the history destination carry none.

  lk_cardioFavorites. Units kg from lk_profile.useKg. Today is
  Wed 9 Sep 2026, matching home.html.

  EXERCISE LIBRARY — what changed, and why.

  The audits measured a screen that reads as "a menu of body parts": the
  search field's border was 1.07:1 against its own fill, it vanished at
  8px blur, it was not focused on arrival, and it disappeared entirely
  once a group was open. Browsing cost 3 taps. Search matched name
  substrings only, above a 2-character floor, so "chest" returned 7 of
  30. Custom exercises never appeared in browse because the merge matched
  on fields stored customs do not carry. The detail sheet's dominant
  object was a 351x351 void — 81% of the sheet body — and its primary
  action did nothing when the library was entered from its own tab.

  DECISIONS

  1. Search is the screen. The field sits above the scroll body, so it is
     present at the root, inside a group and over results; it is focused
     on arrival; it is raised off the ground and bounded by
     --text-tertiary (4.71:1 on its own fill, 5.49:1 on the page ground).
     Enter opens the top result, so a named lift costs 0 taps.
  2. Search matches name, muscle group, region, equipment and a small
     alias list (legs, arms, core, upper, lower), from the first
     character, ranked: name prefix, word start, substring, region and
     group, equipment. "chest" now returns all 31, not 7.
  3. Browsing is two taps, not three. A group opens one flat list of all
     its exercises with the regions as sticky headings, instead of a
     second list of subgroup rows.
  4. Customs merge on gid/sid — the fields a stored custom carries — so
     they appear in browse, in counts and in search, marked CUSTOM.
     Lower Chest reads 11, not 10.
  5. The detail sheet is drawn, not fetched. Its illustration is a muscle
     map rendered in SVG from the exercise's own group and region, so the
     sheet is complete with no network: name, tags, map, four facts
     (group, region, equipment, which split day uses it) and your logged
     history. A demonstration clip is an extra when one is cached, never
     the sheet's subject: loading is a skeleton in the same 16:9 box,
     failure is one line and a Try again button, and neither leaves a
     void, because nothing was ever holding the sheet up.
  6. Every row leads somewhere. The sheet's primary action depends on the
     entry: from a picker it adds to the summoning day; with a workout
     running it adds to that workout; from the Library tab with nothing
     running it starts a workout with the lift, and the secondary adds it
     to a split day. No dead primary.

  ACCENT: one accent fill per screen. On the browse and results screens

  SETTINGS AND ACCOUNT — what survives, and why.

  WHY THIS SCREEN EXISTS
  Profile lost its tab. Its function audit found one load-bearing control
  out of two: the door to Settings. Home's header now carries that door
  (data-testid="open-account"), and this is what it opens. So this file
  holds both jobs — who you are and what your account is, and everything
  you can configure — and it is the only screen that holds either.

  WHAT THE AUDITS MEASURED, AND WHAT REPLACES IT
  The old Settings scored 1 on hierarchy and 2.2 on design, the worst in
  the app: a 3,894px scroller whose squint-test winner was SIGN UP inside
  a glowing orange card, on a settings screen. It carried 22 uppercase
  headers in one style at two ranks, so a group header and a card header
  were indistinguishable, and two header strings repeated — DATA & SYNC
  twice, 1,075px apart. Placement was unpredictable: text size under Data
  and Sync, cycle logging under a red Performance Tracking header, Home
  layout at the top while every other display preference sat 1,000px
  lower. 21 of 49 targets met 44px; with the layout editor open, 30 of 102.

  Here: FIVE groups, one header rank, one card per parent, in the order a
  person changes things.
    1  Account          who you are, and whether it syncs
    2  Units and display    the two things changed most often
    3  Training         what happens while you lift
    4  Reminders        when the app is allowed to speak
    5  Data and account one-time and destructive actions, at the bottom
  Nineteen interactive rows, was 49 controls. Every row prints its current
  value in the secondary line, so the whole configuration is readable
  without opening anything. Nothing here is one word deep in jargon:
  "Round weights to", not "plate increment"; "Everything on this device",
  not "local storage".

  DEPTH
  A toggle changes in place — depth 0. A choice opens one sheet of
  options over the screen — depth 1. Nothing on this screen is two levels
  deep. The old screen put the unit switch behind Profile, a scroll of
  ~2,100px, and the layout editor behind a second full-screen editor.

  THE THREE MEASURED DEFECTS, ANSWERED
  1  No busy state on a network action. The old Verify button was
     pixel-identical with a request in flight (0.0001% frame diff, no
     spinner, no aria-busy, still enabled). Here the one network action
     that survives — Sync — disables its button, sets aria-busy, swaps
     the label to "Syncing", shows a spinner, and announces the outcome
     in a live region. See syncNow().
  2  Fail-open validation. The old catch block called onResult(true): a
     network failure GRANTED beta access and rendered the verified panel.
     Here the failure path is the only path that can report failure, and
     it reports nothing else — see the comment on FAIL CLOSED in syncNow().
     Dev state "Account unreachable" runs it.
  3  A unit switch that relabels without converting. The old screen
     seeded body weight once at mount, so 64.25 kg became "64.25 lbs" and
     the next save wrote 29.1 kg. Here every weight is stored in kg and
     formatted on read (wt(), plate(), height()), so switching the unit
     converts 64.2 kg to 141.5 lb, 2.5 kg to 5 lb, and 168 cm to 5 ft 6
     in — in the row, in the sheet, and in the field. The switch also
     confirms itself with a toast naming both numbers, which is the
     confirmation flow 8 never had.

  WHAT DOES NOT SHIP, AND WHY
  - LayoutEditor (51-53 controls, 44 of them under 44px, and the source
    of most of this page's target failures). It let a user reorder Home
    from another tab. The Home audit concluded it existed to paper over a
    screen with no priority; Home has been rebuilt to four blocks with
    one primary action, so the thing it repaired is gone. Ordering Home
    is the designer's job, not a setting.
  - The beta code card. Beta enrolment is not a preference, it shipped to
    every user, it had no busy state, and it granted access when the
    network failed. Unfinished and wrong when it failed.
  - Replay Tutorial. The overlay it replays is cut by the directive, and
    the control carried an emoji as its icon.
  - Cycle logging and Microphone flags. A toggle that adds or removes a
    whole tab is build configuration wearing a preference's clothes; the
    voice button also intercepted pointer events on two other screens.
  - Text size. iOS ships Dynamic Type as a system setting. A second,
    app-only text size duplicates it, disagrees with it, and was filed
    under DATA & SYNC.
  - Fuel display preferences (hide calories, Left/Eaten). Settings for a
    screen belong on that screen; Fuel is a separate track.
  - The privacy disclosure block. Legal text with a +/- affordance is not
    a control; it configures nothing.
  - The old App Style's five options. Appearance offers Dark, Light and
    Match device: three values, all of which change the screen. "Match
    device" was cut in the first pass only because tokens.css carried no
    prefers-color-scheme rule for it to read; the rule exists now, so the
    option is back. A control that does nothing is worse than one fewer
    control, but a device that ignores its own appearance setting is
    worse than both. The choice is stored in localStorage under lk_theme
    and applied by theme.js on every screen, so it survives a reload and
    Appearance is not a preference that only themes its own page.
  - The storage progress bar. The sentence above it already says 1.2 MB
    of 5.0 MB; a second, lower-contrast reading of the same number is
    decoration.
  - Save Name and Save Stats as bare buttons stranded in a list. An edit
    now commits inside the sheet that opened it, so no row can be left in
    an unsaved state you cannot see.
  - The guest SIGN UP card as a glowing hero. Creating an account is a
    real action and stays, as one plain button inside the Account card.

  STATES
  Signed in, Guest, Signed out, Loading, Account unreachable. Only the
  Account group has a loading or an error state: preferences are read
  from the device, so they cannot fail, and pretending they can would
  hide a working screen behind a spinner.

  ADDED TO components.css FOR THIS SCREEN (tokens only, no new values)
  The switch, which no screen had used before: "on" takes --success, not
  --accent, and the off track gains a --border ring so it is still a
  visible control when the track itself is only 1.51:1 on the card.
  Plus .row--danger, .row--static, a ground for a quiet button on a
  dialog, and .toast--nonav for a pushed screen that sits above no tab
  bar.

  ACCENT
  At most one accent fill per state, never on a no-op: none when signed
  in (a settings screen has no primary action), Create an account when a
  guest, Sign in when signed out, Try again when the account is
  unreachable, none while loading. Switches carry --success when on,
  because "on" is a state and the accent marks the one action.
-->

<template id="demo-tpl-workout-log">
<!--
  WORKOUT LOG — a RESTORATION with four measured fixes.

  The owner uses this screen and asked for restraint: "good enough for
  me, improve it but don't prioritise it." An earlier pass rebuilt it
  into a different screen — one exercise at a time, a docked pad, no
  Partials, no AI Rec, no Add Set, no card list. That is reverted.

  WHAT IS BACK, EXACTLY AS SHIPPED
    - one dark card per exercise, drag handle, name, muscle
    - a dense grid inside it: #, WEIGHT, REPS, RIR, done
    - EVERY set is directly editable, not just the current one
    - a Partials control on every set
    - Add Set and AI Rec at the foot of each card
    - Add Exercise and Block below the list
    - header: session name, running timer, set count, volume, the
      quick-action bolt, Discard, Finish
    - the summoned numeric pad, the tools popover, the plate
      calculator, rest settings, the long-press action sheet, the
      exercise detail sheet, the block modal, the two-tap discard

  THE FOUR FIXES, AND NOTHING ELSE

  1. THE PAD REPLACES ON THE FIRST DIGIT.
     Logging a set measured 15 taps against a best known 3. Five of
     them were DEL, because the pad opened pre-filled and appended, so
     deleting was the only way to edit; the crawl's own log recorded
     "6072.5", a 60 typed onto an uncleared 72.5. The pad still opens
     showing the pending value — that is useful, it is what you lifted
     last time — but it shows it in --text-tertiary as not-yet-yours,
     and the first digit replaces it whole. After the first digit,
     digits append as before. DEL, the +-2.5/+-5 chips, CANCEL and
     DONE are unchanged. Cost: 9 taps for a fresh weight, reps and
     done; 1 tap when last session's numbers stand.

  2. EVERY HIT AREA IS AT LEAST 44x44, AT THE SHIPPED DENSITY.
     22 of 31 controls were under 44x44; the worst were the fields
     themselves at 109x33 and the done control at 32x30. The cells are
     now 44 tall and the done control 44x44. The set still occupies
     about 96px of card — the same as shipped — because the padding
     row and the value row were already that tall together. Nothing
     was dropped to buy the pixels.

  3. ONE UNIT. THE PROFILE'S.
     The shipped screen showed an "LB" column head (rows with no
     stored kg fell through to "lb"), a "1088 kg" total and a "Switch
     to LBS" control at the same time: three controls, two units. Every
     weight here is stored in kg and displayed in the profile unit,
     including the column head, the totals, the pad and the plate
     calculator. The unit switch is kept — it is a feature — but there
     is one setting behind it, so all three controls always agree.

  4. WARM-UPS COUNT.
     The header filtered setType!=="warmup" and read "0 sets" after a
     completed warm-up. It counts every completed set now, and a
     warm-up set is marked W in the number column so the two are still
     distinguishable.

  HIERARCHY. The orange stays; it is the app's accent and it belongs
  here. What changed is which control wears the solid fill: the done
  control, performed every 90 seconds, and the pad's DONE key. Finish
  is the same size and in the same corner but outlined rather than
  filled, so the loudest thing on the screen is logging a set rather
  than ending the workout.

  NOT RESTORED: the voice FAB. It is shell chrome rather than this
  screen, it is an emoji over a coloured glow, and both audits cut it.

  DATA: fixtures/seed-data.json — profile in kg, PPL Push day
  (exIds 111, 302, 103, 311, 411), exercise note from lk_exNotes.

<template id="demo-tpl-review">
<!--
  REVIEW — what this screen is, and why it is shaped this way.

  THE MOMENT. The last set is racked. The lifter is tired, one-handed,
  and wants to be done. Whatever this screen says has about five
  seconds to be worth reading, and then it has to get out of the way.

  THE AUDIT'S VERDICT (01-audit-function/review.md). The old screen
  "mostly wastes a tap": three stat tiles restating numbers the lifter
  had just watched accumulate, then a five-row / five-chip reflection
  gate styled as the one accent action, then a network call for the one
  thing the screen could say that the lifter did not already know —
  eight taps in, and only if the call answered. Function mean 3.3,
  state handling 2.

  FOUR DEFECTS THIS SCREEN FIXES, each traced to the audit:

  1. "The one accent button is HOW DID IT FEEL?; the job sits in the
     quiet Save without reflection" (rubric, purpose clarity 3). Here
     the single accent fill on every state is Save session, pinned in
     an actionbar so it never scrolls away. Saving is one tap from
     entry. Feel is four chips in a section below the fold, optional,
     and it gates nothing.

  2. "Zero-set guard on save(): missing — saves sets:0, exercises:[],
     an empty record joins history and inflates Home's TOTAL WORKOUTS"
     (§2 L16012, §5). The nothing-logged state has no Save control at
     all. It says the session holds nothing and that nothing will be
     written, and offers the two things that are actually available:
     go back and log a set, or discard.

  3. "Canned fallback on aiCall fail — broken: fabricated insight
     styled as a real one" (§2 L16112, `review-error.png`). Every
     figure on this screen is computed from lk_history on the device.
     The one generated line lives in a dashed, labelled card
     (.card--unverified), is never fetched unless asked for, and on
     failure shows the failure and a Retry — never a sentence.

  4. "Five seconds after racking, a lifter wants the comparison — this
     session against the last, per lift, and any PR — computable
     locally" (§7 Cut). That comparison is now the first thing on the
     screen, above the fold, before any control.

  WHAT THE LIFTER DID NOT ALREADY KNOW
    - Total working volume against the same session last time:
      4,383 kg vs 4,266 kg, +117 kg, +2.7%.
    - Per lift, this session's top set against that session's top set,
      and the working-volume change: bench +60 kg, shoulder press
      +50 kg, cable fly +30 kg, lateral raise -53 kg, pushdown +30 kg.
      The lateral raise is down. The screen says so; a lifter who is
      only ever congratulated stops reading.
    - Any record set today, with the mark it beat and when.

  NUMBERS. Working sets only, warm-ups excluded, stated on the screen
  in one line. This settles the audit's finding that the old header and
  the old per-exercise line disagreed about warm-ups (15985 vs 16254).
  Every figure is tabular and carries kg. Dates are relative inside the
  week and absolute after it.

  DATA. tests/fixtures/seed-data.json. The session under review is the
  Push day of Wed 9 Sep 2026; the prior session it is compared against
  is w_1788458700000, "PPL - Push", 3 Sep 2026, 16 sets, 4,266 kg,
  55 min, whose five exercises and every set are in the fixture. The
  record state's beaten mark is lk_prs["111"], 72.5 kg x 8 on
  2026-09-03. The prior top sets, prior per-lift volumes and the
  4,266 kg total are read off that fixture session, not invented; the
  five deltas sum to the header delta.

  ACCENT. Exactly one accent fill per state, always on the primary
  action: Save session in populated, record, loading and error; Back to
  workout in nothing-logged, where there is nothing to save. Feel chips
  use --accent-quiet as a selected tint, which is a ground, not a fill,
  and the record badge is success-toned so a record can never be
  confused with an action.

  MOTION. One entrance, on the block that carries the news. Reduced
  motion switches it off.

  ---------------------------------------------------------------------
  SPLIT DRIFT — the second thing this screen does.

  A lifter who swaps an exercise three weeks running should end up with
  a split that reflects what they actually do, without ever opening the
  split builder. So when the exercises performed differ from the ones
  the Push day prescribed, Review asks once, here, while the session is
  still in front of them.

  DETECTION. The prescribed list against the exercises with at least one
  completed set. Added = performed, not prescribed. Skipped =
  prescribed, never started. A skip and an addition filling the same
  slot are one SWAP and draw one line, because they are one decision.
  The card appears only when the difference is non-empty and only when
  the session came from a split: a freestyle session and an identical
  session draw nothing. There is no "no changes detected" state, and the
  screen never asks twice.

  LOUDNESS. It sits below the comparison, and both of its actions are
  secondary. The accent fill stays on Save, and this never gates it:
  saving is one tap with a difference on screen, and the decision can be
  made before the save, after it, or not at all.

  THE ASYMMETRY. Additions and swaps are usually intentional; a skip is
  usually the rack or the clock. Removing a lift from a programme
  because it was missed once is the wrong default, so a skip is applied
  only when it is chosen by name — "Update Push" writes the swaps and
  additions and says in the card that skips stay put. When a skip is the
  only difference, the card says why keeping is the sane reading and the
  keep action comes first, with the other button naming the removal
  outright rather than hiding it behind the word "update".

  PER CHANGE. With more than one difference, a third and quieter route
  opens a sheet with one checkbox per difference, every row unselected,
  so opening it and confirming without reading changes nothing — that
  path is read as a decision to keep.

  AFTER. One named line, "Push updated. Machine Chest Press replaces
  Barbell Bench Press.", plus Undo, because this edits a programme the
  lifter may have spent time building. Keeping the split gets a quiet
  acknowledgement and no second ask.

  ALSO. A lift the prior session did not contain is marked New and left
  uncompared rather than given a delta against nothing, and when the
  exercises differ the day total says it is not like for like.
-->

  <div class="phone">
    <div class="screen" id="screen" data-testid="screen-review">

        <button class="hdr__back" id="action-back" data-testid="action-back" aria-label="Back to workout">
