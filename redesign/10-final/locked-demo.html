  function trainingSection() {
    return group('Training',
      '<div class="card card--flush">' +
        switchRow('restTimer', 'Rest timer',
          S.restTimer ? 'Starts when you finish a set' : 'Off', S.restTimer, 'switch-rest-timer') +
        navRow('restSec', 'Rest between sets', secs(S.restSec), 'row-rest-length') +
        switchRow('partials', 'Count partial reps',
          S.partials ? 'Half reps count towards the set' : 'Only full reps count', S.partials, 'switch-partial-reps') +
        navRow('plateKg', 'Round weights to', plate(S.plateKg), 'row-plate-rounding') +
      '</div>');

  function remindersSection() {
    return group('Reminders',
      '<div class="card card--flush">' +
        switchRow('reminder', 'Workout reminder',
          S.reminder ? 'On training days only' : 'Off', S.reminder, 'switch-workout-reminder') +
        navRow('reminderAt', 'Reminder time', clock(S.reminderAt), 'row-reminder-time') +
        navRow('checkin', 'Daily check-in', CHECKIN[S.checkin], 'row-checkin') +
      '</div>');
  }

  /* =============================================================
     5. Data and account. One-time and destructive actions, last,
     each behind a confirmation that names what it costs.
     ============================================================= */
  function dataSection() {
    var storage =
      '<div class="row row--static">' +
        '<span class="row__main">' +
          '<span class="row__title">Storage used</span>' +
          '<span class="row__sub">' + n('1.2') + ' MB of ' + n('5.0') + ' MB on this phone</span>' +
        '</span>' +
      '</div>';

    var files =
      '<div class="card card--flush">' + storage +
        actionRow('export', 'Export a backup', 'One file with every workout, split and record', 'row-export') +
        actionRow('confirm-restore', 'Restore from a backup', 'Replaces what is on this phone', 'row-restore') +
      '</div>';

    var danger = '<div class="card card--flush">';
    if (S.view === 'signed-in') {
      danger += actionRow('confirm-sign-out', 'Sign out', 'Keeps your data on this phone', 'row-sign-out', true);
    }
    danger += actionRow('confirm-reset', 'Erase everything on this phone',
      'Workouts, splits and records. Cannot be undone', 'row-reset', true);
    if (S.view === 'signed-in') {
      danger += actionRow('confirm-delete', 'Delete your account',
        'Removes your account and everything in it', 'row-delete', true);
    }
    danger += '</div>';

    return group('Data and account', files + danger);
  }

  function screenHTML() {
    return accountSection() + displaySection() + trainingSection() + remindersSection() + dataSection();
  }

  /* =============================================================
     Sheets
     ============================================================= */
  function sheetShell(title, inner, testid) {
    return '<div class="scrim" data-action="close-sheet" data-testid="scrim"></div>' +
           '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-testid="' + testid + '">' +
             '<div class="sheet__grab"></div>' +
             '<div class="sheet__head">' +
               '<h2 class="t-section" id="sheet-title">' + title + '</h2>' +
               '<button class="iconbtn" data-action="close-sheet" data-testid="sheet-close" aria-label="Close">' +
                 ICO.close + '</button>' +
             '</div>' + inner +
           '</div>';
  }

  function optionSheet(key) {
    var spec = opts()[key];
    var list = spec.options.map(function (o) {
      var on = String(S[key]) === String(o.v);
      return '<button class="opt" role="radio" aria-checked="' + on + '" data-action="pick" data-key="' + key +
               '" data-value="' + esc(o.v) + '" data-testid="opt-' + key + '-' + esc(o.v) + '">' +
               '<span class="opt__mark">' + (on ? ICO.check : '') + '</span>' +
               '<span class="opt__main">' +
                 '<span class="opt__title">' + o.title + '</span>' +
                 (o.sub ? '<span class="opt__sub">' + o.sub + '</span>' : '') +
               '</span>' +
             '</button>';
    }).join('');
    return sheetShell(spec.title,
      '<div class="sheet__body card card--flush" role="radiogroup" aria-labelledby="sheet-title">' + list + '</div>',
      'sheet-' + key);
  }

  function profileSheet() {
    return sheetShell('Your name',
      '<div class="sheet__body">' +
        '<label class="field">' +
          '<span class="field__label t-detail">Display name</span>' +
          '<input class="input" id="f-name" value="' + esc(S.name) + '" data-testid="field-name" autocomplete="off">' +
        '</label>' +
        '<p class="field__help">@' + esc(S.username) + ' and ' + esc(S.email) + ' cannot be changed here.</p>' +
      '</div>' +
      '<div class="sheet__foot stack stack--2">' +
        '<button class="btn btn--secondary btn--block" data-action="save-name" data-testid="save-name">' +
          '<span class="btn__label">Save</span></button>' +
      '</div>', 'sheet-profile');
  }

  /* The body sheet is where defect 3 is visible: every number in it is
     derived from the stored kilogram value, so the unit row above and
     this field can never disagree. */
  function bodySheet() {
    function segField(key, label, map, testid) {
      var items = Object.keys(map).map(function (v) {
        return '<button class="seg__item" role="radio" aria-checked="' + (S.body[key] === v) + '" ' +
                 'data-action="body-set" data-key="' + key + '" data-value="' + v + '" ' +
                 'data-testid="' + testid + '-' + v + '">' + map[v] + '</button>';
      }).join('');
      return '<div class="field">' +
               '<span class="field__label t-detail">' + label + '</span>' +
               '<div class="seg seg--lg" role="radiogroup" aria-label="' + label + '">' + items + '</div>' +
             '</div>';
    }
    var b = S.body;
    var weightVal = S.unit === 'kg' ? round1(b.weightKg) : round1(b.weightKg * LB);
    var heightVal = S.unit === 'kg' ? b.heightCm : Math.round(b.heightCm / 2.54);
    return sheetShell('Body and goal',
      '<div class="sheet__body stack stack--4">' +
        '<label class="field">' +
          '<span class="field__label t-detail">Age</span>' +
          '<input class="input num" id="f-age" inputmode="numeric" value="' + b.age + '" data-testid="field-age">' +
        '</label>' +
        segField('sex', 'Sex', SEX, 'seg-sex') +
        '<label class="field">' +
          '<span class="field__label t-detail">Height in ' + (S.unit === 'kg' ? 'centimetres' : 'inches') + '</span>' +
          '<input class="input num" id="f-height" inputmode="decimal" value="' + heightVal + '" data-testid="field-height">' +
        '</label>' +
        '<label class="field">' +
          '<span class="field__label t-detail">Body weight in ' + (S.unit === 'kg' ? 'kilograms' : 'pounds') + '</span>' +
          '<input class="input num" id="f-weight" inputmode="decimal" value="' + weightVal + '" data-testid="field-weight">' +
        '</label>' +
        '<p class="field__help">Switching the weight unit converts this figure. It does not relabel it.</p>' +
        segField('goal', 'Goal', GOAL, 'seg-goal') +
      '</div>' +
      '<div class="sheet__foot stack stack--2">' +
        '<button class="btn btn--secondary btn--block" data-action="save-body" data-testid="save-body">' +
          '<span class="btn__label">Save</span></button>' +
      '</div>', 'sheet-body');
  }

  /* =============================================================
     Confirmations. Every destructive or one-time action names the
     consequence before it happens, and the safe choice is the one
     that reads normally.
     ============================================================= */
  var CONFIRM = {
    'sign-out': {
      title: 'Sign out?',
      body: 'Your workouts stay on this phone. You will need your password to sync again.',
      go: 'Sign out', danger: false, done: 'Signed out.', to: 'signed-out'
    },
    'reset': {
      title: 'Erase everything on this phone?',
      body: 'Every workout, split and record on this phone is deleted. This cannot be undone.',
      go: 'Erase everything', danger: true, done: 'Everything on this phone was erased.'
    },
    'delete': {
      title: 'Delete your account?',
      body: 'Your account and everything in it is deleted from LOCKED. This cannot be undone.',
      go: 'Delete account', danger: true, done: 'Account deleted.', to: 'guest'
    },
    'restore': {
      title: 'Restore from a backup?',
      body: 'What is on this phone is replaced by the backup file you choose.',
      go: 'Choose a file', danger: false, done: 'Nothing was replaced. No file was chosen.'
    }
  };

  function dialogHTML(id) {
    var c = CONFIRM[id];
    return '<div class="scrim" data-action="close-dialog" data-testid="scrim"></div>' +
           '<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title" ' +
             'aria-describedby="dlg-body" data-testid="dialog-' + id + '">' +
             '<h2 class="t-section" id="dlg-title">' + c.title + '</h2>' +
             '<p class="t-detail mt-2" id="dlg-body">' + c.body + '</p>' +
             '<div class="stack stack--2 mt-5">' +
               '<button class="btn ' + (c.danger ? 'btn--danger-solid' : 'btn--secondary') + ' btn--block" ' +
                 'data-action="confirm" data-id="' + id + '" data-testid="confirm-' + id + '">' +
                 '<span class="btn__label">' + c.go + '</span></button>' +
               '<button class="btn btn--tertiary btn--block" data-action="close-dialog" data-testid="cancel-' + id + '">' +
                 '<span class="btn__label">Cancel</span></button>' +
             '</div>' +
           '</div>';
  }

  function toastHTML() {
    return '<div class="toast toast--nonav" data-testid="toast">' +
             '<span class="toast__body">' + S.toast + '</span>' +
             '<button class="toast__action" data-action="close-toast" data-testid="toast-dismiss">Done</button>' +
           '</div>';
  }

  /* =============================================================
     Render
     ============================================================= */
  var body = document.getElementById('body');
  var overlay = document.getElementById('overlay');
  var screen = document.getElementById('screen');
  var live = document.getElementById('live');
  var lastFocus = null;

  function render() {
    screen.setAttribute('data-state', S.view);
    /* One writer. theme.js owns the root attribute and the lk_theme key,
       so the choice made here is the choice every other screen reads. */
    if (window.LKTheme) window.LKTheme.set(S.theme);
    LKPatch(body, screenHTML());

    var ov = '';
    if (S.sheet === 'profile') ov = profileSheet();
    else if (S.sheet === 'body') ov = bodySheet();
    else if (S.sheet) ov = optionSheet(S.sheet);
    else if (S.dialog) ov = dialogHTML(S.dialog);
    if (S.toast) ov += toastHTML();
    LKPatch(overlay, ov);

    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.view));
    });

    if (S.sheet || S.dialog) {
      var f = overlay.querySelector('[data-testid="sheet-close"]') ||
              overlay.querySelector('.dialog button');
      if (f) f.focus();
    }
  }

  function say(msg) { live.textContent = msg; }

  function openOverlay(kind, id) {
    lastFocus = document.activeElement;
    if (kind === 'sheet') { S.sheet = id; S.dialog = null; }
    else { S.dialog = id; S.sheet = null; }
    render();
  }
  function closeOverlay(testid) {
    S.sheet = null; S.dialog = null;
    render();
    var back = testid && document.querySelector('[data-testid="' + testid + '"]');
    if (back) back.focus();
    else if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
    lastFocus = null;
  }

  var toastTimer = null;
  function toast(msg) {
    S.toast = msg;
    say(msg.replace(/<[^>]+>/g, ''));
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; render(); }, 5000);
  }

  /* -------------------------------------------------------------
     The one network action. It has a busy state, it disables its
     own control while it runs, and its failure path can only report
     failure. Nothing about the result is assumed before it arrives.
     ------------------------------------------------------------- */
  var syncTimer = null;
  function syncNow() {
    if (S.sync === 'busy') return;
    S.sync = 'busy';
    render();
    say('Syncing');
    var willFail = S.view === 'error';       /* dev state: Account unreachable */
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () {
      if (willFail) {
        /* FAIL CLOSED. The old build's catch called onResult(true) and
           rendered the verified panel; a dropped connection granted
           access. A failure here reports a failure and offers the retry,
           and it is the only branch that can be reached on failure. */
        S.sync = 'failed';
        render();
        say('Sync failed. Nothing was sent.');
      } else {
        S.sync = 'ok';
        render();
        toast('Everything is up to date.');
      }
    }, 1200);
  }

  /* =============================================================
     Events
     ============================================================= */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var a = t.dataset.action;

    if (a === 'sheet') {
      openOverlay('sheet', t.dataset.key);

    } else if (a === 'close-sheet') {
      var key = S.sheet;
      closeOverlay(key === 'profile' ? 'row-identity' : key === 'body' ? 'row-body' : rowFor(key));

    } else if (a === 'toggle') {
      var k = t.dataset.key;
      S[k] = !S[k];
      render();
      var el = document.querySelector('[data-testid="' + t.dataset.testid + '"]');
      if (el) el.focus();
      say((k === 'restTimer' ? 'Rest timer ' : k === 'partials' ? 'Count partial reps ' : 'Workout reminder ') +
          (S[k] ? 'on' : 'off'));

    } else if (a === 'pick') {
      var key2 = t.dataset.key, raw = t.dataset.value;
      var before = { weightKg: S.body.weightKg, unit: S.unit };
      S[key2] = (key2 === 'restSec' || key2 === 'plateKg') ? Number(raw) : raw;
      S.sheet = null;
      render();
      var back2 = document.querySelector('[data-testid="' + rowFor(key2) + '"]');
      if (back2) back2.focus();
      /* A unit change confirms itself with both numbers, so the person
         can see the value was converted rather than relabelled. */
      if (key2 === 'unit' && before.unit !== S.unit) {
        toast(S.unit === 'lb'
          ? 'Weights now show in pounds. Your body weight, ' + round1(before.weightKg) +
            ' kg, is ' + round1(before.weightKg * LB) + ' lb.'
          : 'Weights now show in kilograms. Your body weight, ' + round1(before.weightKg * LB) +
            ' lb, is ' + round1(before.weightKg) + ' kg.');
      }

    } else if (a === 'body-set') {
      S.body[t.dataset.key] = t.dataset.value;
      render();
      var b2 = document.querySelector('[data-testid="' + t.dataset.testid + '"]');
      if (b2) b2.focus();

    } else if (a === 'save-name') {
      var nv = (document.getElementById('f-name') || {}).value;
      if (nv && nv.trim()) S.name = nv.trim();
      closeOverlay('row-identity');
      toast('Name saved.');

    } else if (a === 'save-body') {
      var age = Number((document.getElementById('f-age') || {}).value);
      var hv = Number((document.getElementById('f-height') || {}).value);
      var wv = Number((document.getElementById('f-weight') || {}).value);
      if (age > 0) S.body.age = Math.round(age);
      /* Read back into the stored unit, never into the displayed one. */
      if (hv > 0) S.body.heightCm = S.unit === 'kg' ? Math.round(hv) : Math.round(hv * 2.54);
      if (wv > 0) S.body.weightKg = S.unit === 'kg' ? round1(wv) : round1(wv / LB);
      closeOverlay('row-body');
      toast('Body and goal saved.');

    } else if (a === 'sync') {
      syncNow();

    } else if (a === 'export') {
      toast('Backup ready. LOCKED-backup-2026-09-09.json');

    } else if (a === 'create-account' || a === 'sign-in') {
      toast(a === 'sign-in' ? 'Sign in opens next.' : 'Account setup opens next.');

    } else if (a.indexOf('confirm-') === 0 && a !== 'confirm') {
      openOverlay('dialog', a.slice(8));

    } else if (a === 'confirm') {
      var c = CONFIRM[t.dataset.id];
      if (c.to) S.view = c.to;
      if (t.dataset.id === 'reset') { S.sync = 'idle'; }
      closeOverlay();
      toast(c.done);

    } else if (a === 'close-dialog') {
      var d = S.dialog;
      closeOverlay(d === 'sign-out' ? 'row-sign-out' : d === 'reset' ? 'row-reset' :
                   d === 'delete' ? 'row-delete' : 'row-restore');

    } else if (a === 'close-toast') {
      clearTimeout(toastTimer);
      S.toast = null;
      render();
    }
  });

  function rowFor(key) {
    return {
      unit: 'row-weight-unit', dist: 'row-distance-unit', weekStart: 'row-week-start',
      theme: 'row-appearance', restSec: 'row-rest-length', plateKg: 'row-plate-rounding',
      reminderAt: 'row-reminder-time', checkin: 'row-checkin',
      profile: 'row-identity', body: 'row-body'
    }[key] || 'back';
  }

  /* Keyboard: Escape closes, Tab is trapped inside an open overlay. */
  document.addEventListener('keydown', function (e) {
    var open = S.sheet || S.dialog;
    if (e.key === 'Escape' && open) {
      e.preventDefault();
      closeOverlay(S.sheet ? rowFor(S.sheet) : null);
      return;
    }
    if (e.key !== 'Tab' || !open) return;
    var f = overlay.querySelectorAll('button, input');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!overlay.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  });

  /* =============================================================
     Dev state toggle
     ============================================================= */
  var STATES = [
    ['signed-in', 'Signed in'],
    ['guest', 'Guest'],
    ['signed-out', 'Signed out'],
    ['loading', 'Loading'],
    ['error', 'Account unreachable']

  var menu = document.getElementById('dev-menu');

  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" data-testid="dev-state-' + s[0] + '">' +
             s[1] + '</button>';
  }).join(''));
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (!b) return;
    S.view = b.dataset.state;
    S.sheet = null; S.dialog = null; S.toast = null;
    S.sync = b.dataset.state === 'error' ? 'failed' : 'idle';
    clearTimeout(syncTimer);
    render();
  });

  var q = new URLSearchParams(location.search);
  var want = q.get('state');
  if (want && STATES.some(function (s) { return s[0] === want; })) {
    S.view = want;
    if (want === 'error') S.sync = 'failed';
  }
  render();
})();

});
</script>

  /* =============================================================
     The numeric pad. Summoned from a cell, as shipped.
     THE FIX: the first digit replaces the pending value.
     ============================================================= */
  function openPadFor(e, i, field) {
    var st = S.exercises[e].sets[i];
    var own = field === 'weight' ? st.kg : st.reps;
    var raw = own !== null ? own : (field === 'weight' ? st.prevKg : null);
    var shown = field === 'weight' ? toDisplay(raw) : raw;
    return {
      ex: e, set: i, field: field,
      buffer: (shown === null || shown === undefined) ? '' : trim(shown),
      /* THE FIX. The pad opens showing the pending value, as shipped,
         but the first digit replaces it whole instead of appending to
         it. Digits after the first append and DEL still edits, so
         nothing else about the pad's behaviour changed. */
      replaced: false,
      fromPrev: own === null && shown !== null && shown !== undefined
    };
  }

  function padHTML() {
    var p = S.pad;
    var isWeight = p.field === 'weight';
    var steps = isWeight ? STEPS[S.unit] : [-2, -1, 1, 2];
    var shown = p.buffer === '' ? '0' : p.buffer;
    var pending = p.fromPrev && !p.replaced;
    var keys = '';
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', isWeight ? '.' : '', '0'].forEach(function (k) {
      if (k === '') { keys += '<button class="pad__key" type="button" disabled aria-hidden="true" tabindex="-1"></button>'; return; }
      keys += '<button class="pad__key" type="button" data-act="pad-key" data-key="' + k + '" data-testid="pad-' + (k === '.' ? 'dot' : k) + '" aria-label="' + (k === '.' ? 'Decimal point' : k) + '">' + k + '</button>';
    });
    keys += '<button class="pad__key pad__key--del" type="button" data-act="pad-del" data-testid="pad-del" aria-label="Delete last digit">DEL</button>';

    return '<div class="scrim" data-act="pad-cancel" data-testid="pad-scrim" role="presentation"></div>' +
      '<div class="sheet padsheet" role="dialog" aria-modal="true" aria-label="' + (isWeight ? 'Weight' : 'Reps') + ' for set ' + (p.set + 1) + '" data-testid="pad-sheet">' +
        '<div class="sheet__grab" aria-hidden="true"></div>' +

          '<span class="padsheet__what">' + (isWeight ? 'Weight' : 'Reps') + ' · set ' + (p.set + 1) + '</span>' +

            '<span class="padsheet__value' + (pending ? ' padsheet__value--pending' : '') + '" data-testid="pad-value">' + esc(shown) + '</span>' +
            (isWeight ? '<span class="padsheet__unit" data-testid="pad-unit">' + unitLabel() + '</span>' : '') +
          '</span>' +
        '</div>' +
        (pending ? '<p class="padsheet__hint" data-testid="pad-hint">Last session. Type to replace it.</p>' : '') +
        '<div class="padchips">' + steps.map(function (s) {
          return '<button class="padchip" type="button" data-act="pad-step" data-step="' + s + '" data-testid="pad-step-' + String(s).replace('.', '_').replace('-', 'm') + '" aria-label="' + (s > 0 ? 'Add ' : 'Subtract ') + Math.abs(s) + '">' + (s > 0 ? '+' : '') + s + '</button>';
        }).join('') + '</div>' +
        '<div class="pad">' + keys + '</div>' +

          '<button class="btn btn--secondary" type="button" data-act="pad-cancel" data-testid="pad-cancel">Cancel</button>' +
          '<button class="btn btn--primary" type="button" data-act="pad-done" data-testid="pad-done">Done</button>' +
        '</div>' +
      '</div>';
  }

  function padDigit(k) {
    var p = S.pad;
    if (!p.replaced) { p.buffer = (k === '.' ? '0.' : k); p.replaced = true; return; }
    if (k === '.' && p.buffer.indexOf('.') >= 0) return;
    if (p.buffer.replace('.', '').length >= 5) return;
    p.buffer = (p.buffer === '0' && k !== '.') ? k : p.buffer + k;
  }
  function padStep(delta) {
    var p = S.pad;
    var base = parseFloat(p.buffer || '0') || 0;
    var v = Math.max(0, base + delta);
    p.buffer = trim(p.field === 'weight' ? round(v, 0.5) : Math.round(v));
    p.replaced = true;
  }
  function padCommit() {
    var p = S.pad, st = S.exercises[p.ex].sets[p.set];
    var v = p.buffer === '' ? null : parseFloat(p.buffer);
    if (p.field === 'weight') st.kg = v === null || isNaN(v) ? null : toKg(v);
    else st.reps = v === null || isNaN(v) ? null : Math.round(v);
    S.pad = null;
  }

  /* =============================================================
     Paint. Regions only, scroll and focus preserved: this screen is
     edited mid-set and must never jump under the thumb.

  var hdr = document.getElementById('hdr');
  var restSlot = document.getElementById('rest-slot');
  var body = document.getElementById('body');
  var tabs = document.getElementById('tabs');
  var overlay = document.getElementById('overlay');
  var toastSlot = document.getElementById('toast-slot');
  var live = document.getElementById('live');
  var screen = document.getElementById('screen');

  /* Every region goes through the shared reconciler in app.js, which is
     loaded in <head> on this screen and inlined into the demo. Nothing is
     rebuilt: the caret, the scroll and the running animations survive. */
  function put(el, html) { LKPatch(el, html); }

  function paint() {
    screen.setAttribute('data-state', S.state);
    put(hdr, headerHTML());
    put(restSlot, restHTML());
    put(body, bodyHTML());
    put(tabs, tabsHTML());
    put(overlay, overlayHTML());
    put(toastSlot, toastHTML());
  }
  function say(msg) { live.textContent = msg; }

  /* =============================================================
     Behaviour
     ============================================================= */
  function startRest() {
    if (!S.restEnabled) return;
    S.restRunning = true;
    S.restLeft = S.restSeconds;
  }

  /* A toast says what happened and gets out of the way; it never sits
     on top of Add Exercise waiting to be dismissed. */
  var toastTimer = null;
  function toast(text, kind, action) {
    S.toast = { text: text, kind: kind || 'info', action: action || null };
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; paint(); }, 4000);
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    var e = Number(t.getAttribute('data-ex'));
    var i = Number(t.getAttribute('data-set'));
    S.tapCount++;

    switch (act) {
      /* ---- editing any set, not only the current one ---- */
      case 'edit':
        S.pad = openPadFor(e, i, t.getAttribute('data-field'));
        S.toast = null;
        break;
      case 'pad-key': padDigit(t.getAttribute('data-key')); break;
      case 'pad-del': {
        var p = S.pad;
        p.replaced = true;
        p.buffer = p.buffer.slice(0, -1);
        break;
      }
      case 'pad-step': padStep(parseFloat(t.getAttribute('data-step'))); break;
      case 'pad-done': {
        var f = S.pad.field, ex = S.pad.ex, ix = S.pad.set;
        padCommit();
        say('Set ' + (ix + 1) + ' ' + f + ' saved');
        break;
      }
      case 'pad-cancel': S.pad = null; break;

      case 'rir':
        break;

      case 'done': {
        var st = S.exercises[e].sets[i];
        st.done = !st.done;
        if (st.done) {
          if (st.kg === null) st.kg = st.prevKg;
          if (st.reps === null) st.reps = st.prevReps;
          startRest();
          say('Set ' + (i + 1) + ' logged. ' + doneSets() + ' sets this session.');
        } else {
          S.restRunning = false;
          say('Set ' + (i + 1) + ' reopened');
        }
        break;
      }
      case 'partial': {
        var ps = S.exercises[e].sets[i];
        ps.partials = ps.partials >= 9 ? 0 : ps.partials + 1;
        say('Set ' + (i + 1) + ': ' + ps.partials + ' partials');
        break;
      }
      case 'addset': {
        var lastSet = S.exercises[e].sets[S.exercises[e].sets.length - 1];
        S.exercises[e].sets.push(set(null, null, { prevKg: lastSet ? lastSet.kg || lastSet.prevKg : null, prevReps: lastSet ? lastSet.prevReps : null, rir: lastSet ? lastSet.rir : 2 }));
        say('Set added to ' + S.exercises[e].name);
        break;
      }
      case 'airec': {
        if (S.aiBusyEx === e) break;
        S.aiBusyEx = e;
        S.toast = null;
        paint();
        setTimeout(function () {
          S.aiBusyEx = -1;
          var target = null;
          for (var k = 0; k < S.exercises[e].sets.length; k++) { if (!S.exercises[e].sets[k].done) { target = k; break; } }
          if (target === null) { toast('Every set in this exercise is logged.'); paint(); return; }
          var s2 = S.exercises[e].sets[target];
          s2.prevKg = (s2.prevKg || 20) + 2.5;
          s2.prevReps = s2.prevReps || 8;
          toast('Suggested ' + trim(toDisplay(s2.prevKg)) + ' ' + unitLabel() + ' x ' + s2.prevReps + ' for set ' + (target + 1) + '.');
          say('Recommendation ready');
          paint();
        }, 900);
        return;
      }

      /* ---- exercise card ---- */
      case 'grip':
        S.liftedEx = S.liftedEx === e ? -1 : e;
        say(S.liftedEx === e ? 'Reordering ' + S.exercises[e].name + '. Use the grip again to drop it.' : 'Order kept');
        break;
      case 'exsheet': S.overlayEx = e; S.overlay = 'sheet'; break;
      case 'exact': {
        var key = t.getAttribute('data-key');
        var cur = S.exercises[S.overlayEx];
        if (key === 'info') { S.overlay = 'detail'; break; }
        if (key === 'unit') { S.unit = S.unit === 'kg' ? 'lb' : 'kg'; S.overlay = null; toast('Showing ' + unitLabel() + ' everywhere.'); break; }
        if (key === 'warmup') {
          cur.sets.unshift(set(cur.sets[0] ? Math.round((cur.sets[0].prevKg || 20) * 0.5 * 2) / 2 : 20, 10, { warm: true, rir: 4 }));
          S.overlay = null; toast('Warm-up set added.'); break;
        }
        if (key === 'remove') { S.exercises.splice(S.overlayEx, 1); S.overlay = null; toast('Exercise removed.', 'info', 'Undo'); break; }
        if (key === 'swap') { S.overlay = 'addex'; break; }
        S.overlay = null;
        toast(key === 'superset' ? 'Superset on.' : 'Left and right tracked separately.');
        break;
      }

      /* ---- header ---- */
      case 'tools': S.overlay = 'tools'; break;
      case 'tool': {
        var tool = t.getAttribute('data-tool');
        if (tool === 'unit') { S.unit = S.unit === 'kg' ? 'lb' : 'kg'; S.overlay = null; toast('Showing ' + unitLabel() + ' everywhere.'); }
        else S.overlay = tool;
        break;
      }
      case 'discard': S.overlay = 'discard'; break;
      case 'discard-confirm': S.overlay = null; toast('Workout discarded.'); break;
      case 'finish': toast(doneSets() + ' sets saved. Opening review.'); break;

      /* ---- rest ---- */
      case 'rest-add': S.restLeft += 30; say('Rest extended to ' + clock(S.restLeft)); break;
      case 'rest-skip': S.restRunning = false; say('Rest skipped'); break;
      case 'rest-toggle': S.restEnabled = !S.restEnabled; break;
      case 'rest-set': S.restSeconds = Number(t.getAttribute('data-secs')); if (S.restRunning) S.restLeft = S.restSeconds; break;

      /* ---- plate calculator ---- */
      case 'plate-add': S.plate.added.push(Number(t.getAttribute('data-plate'))); break;
      case 'plate-bar': S.plate.bar = Number(t.getAttribute('data-bar')); break;
      case 'plate-side': S.plate.perSide = t.getAttribute('data-side') === '1'; break;
      case 'plate-undo': S.plate.added.pop(); break;
      case 'plate-clear': S.plate.added = []; break;
      case 'plate-apply': {
        var target2 = nextUndone();
        if (target2) {
          var total = S.plate.bar + S.plate.added.reduce(function (a, b) { return a + b; }, 0) * 2;
          S.exercises[target2.ex].sets[target2.set].kg = total;
          S.overlay = null;
          toast(trim(toDisplay(total)) + unitLabel() + ' applied to set ' + (target2.set + 1) + '.');
        }
        break;
      }

      /* ---- add exercise, block ---- */
      case 'addex': S.overlay = 'addex'; break;
      case 'addex-pick': {
        var pick = LIBRARY[Number(t.getAttribute('data-i'))];
        S.exercises.push({ id: pick.id, name: pick.name, muscle: pick.muscle, note: '', sets: [set(null, null, {}), set(null, null, {}), set(null, null, {})] });
        S.overlay = null;
        toast(pick.name + ' added.');
        break;
      }
      case 'block': S.overlay = 'block'; break;
      case 'block-add': {
        var ti = document.getElementById('block-title');
        var no = document.getElementById('block-notes');
        S.blocks.push({ title: (ti && ti.value.trim()) || 'Block', notes: no ? no.value.trim() : '', duration: '' });
        S.overlay = null;
        toast('Block added.');
        break;
      }
      case 'block-remove': S.blocks.splice(Number(t.getAttribute('data-i')), 1); break;

      case 'toast-action': S.toast = null; break;
      case 'close': S.overlay = null; break;
      default: break;
    }
    paint();
  });

  document.addEventListener('change', function (ev) {
    var t = ev.target.closest('[data-act="rir"]');
    if (!t) return;
    var e = Number(t.getAttribute('data-ex')), i = Number(t.getAttribute('data-set'));
    S.exercises[e].sets[i].rir = Number(t.value);
    say('Set ' + (i + 1) + ' RIR ' + t.value);
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target.closest('[data-act="note"]');
    if (t) { S.exercises[S.overlayEx].note = t.value; }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (S.pad) { S.pad = null; paint(); }
    else if (S.overlay) { S.overlay = null; paint(); }
  });

  /* Clocks. One interval, no per-row timers. */
  setInterval(function () {
    var dirty = false;
    S.elapsed++;
    if (S.restRunning && S.restLeft > 0) { S.restLeft--; dirty = true; if (S.restLeft === 0) { S.restRunning = false; say('Rest done'); } }
    var el = document.querySelector('[data-testid="session-timer"] .num');
    if (el) el.textContent = hhmm(S.elapsed);
    var rl = document.querySelector('[data-testid="rest-remaining"] .num');
    if (rl) rl.textContent = clock(S.restLeft);
    if (dirty && !S.restRunning) paint();
  }, 1000);

  /* =============================================================
     Dev states
     ============================================================= */
  var STATES = [
    ['mid-session', 'Mid-session'],
    ['first-set', 'First set'],
    ['keypad', 'Keypad open'],
    ['rest', 'Rest running'],
    ['exercise-done', 'Exercise done'],
    ['plates', 'Plate calculator'],
    ['empty', 'Empty'],
    ['loading', 'Loading'],
    ['error', 'Error']
  ];
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  function paintMenu() {
    LKPatch(menu, STATES.map(function (s) {
      return '<button class="dev__item" type="button" data-state="' + s[0] + '" data-testid="dev-' + s[0] + '" aria-pressed="' + (S.state === s[0] ? 'true' : 'false') + '">' + s[1] + '</button>';
    }).join(''));
  }
  toggle.addEventListener('click', function () {
    var open = menu.hasAttribute('hidden');
    if (open) menu.removeAttribute('hidden'); else menu.setAttribute('hidden', '');
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  menu.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-state]');
    if (!b) return;
    applyState(b.getAttribute('data-state'));
    paintMenu();
    paint();
  });

  paintMenu();
  paint();
  window.__LK = { state: S, apply: function (s) { applyState(s); paintMenu(); paint(); } };
})();

});
</script>

<script>
/* review — original page script, unchanged, in its own closure.
   document is scoped to this screen's shadow root. */
DEMO.define("review", function (document, window, location, fetch) {

(function () {
  "use strict";

  /* ---- icons: one set, one stroke weight ------------------------- */
  function svg(d, extra) {
    return '<svg class="ico' + (extra || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  }
  var ICO = {
    record: svg('<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/><path d="M12 14v3M9 20h6"/>'),
    alert:  svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/>'),
    empty:  svg('<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>', ' ico--lg'),
    /* One mark per kind of difference, so the kind is carried by the
       drawing as well as by the sentence beside it. */
    swap:   svg('<path d="M4 8h13l-3-3M20 16H7l3 3"/>'),
    plus:   svg('<path d="M12 5v14M5 12h14"/>'),
    minus:  svg('<path d="M5 12h14"/>'),
    check:  svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
    close:  svg('<path d="M6 6l12 12M18 6L6 18"/>')
  };

  /* ---- formatting ------------------------------------------------ */
  function n(v) { return '<span class="num">' + v + '</span>'; }
  function kg(v) { return n(Number(v).toLocaleString('en-US')) + ' kg'; }
  /* A signed figure always prints its sign, so the colour is a second
     carrier of direction and never the only one. */
  function signedKg(v) {
    if (v === 0) return n('0') + ' kg';
    return n((v > 0 ? '+' : '−') + Math.abs(v).toLocaleString('en-US')) + ' kg';
  }
  function dir(v) { return v > 0 ? 'up' : (v < 0 ? 'down' : 'flat'); }
  function set(w, r) { return n(w) + ' kg × ' + n(r); }

  /* ---- seed --------------------------------------------------------
     Prior column is w_1788458700000 in fixtures/seed-data.json:
     "PPL - Push", 3 Sep 2026, 16 working sets, 4,266 kg, 55 min.
       Barbell Bench Press  72.5x8, 72.5x6, 72.5x5, 67.5x5  = 1715 kg
       DB Shoulder Press    25x9, 25x9, 25x8                =  650 kg
       Incline Cable Fly    15x11, 15x11, 15x10             =  480 kg
       Lateral Raise        10.5x15, 10.5x14, 10.5x12       =  430.5 kg
       Tricep Pushdown      30x12, 30x11, 30x10             =  990 kg
                                                    total     4265.5 -> 4,266 kg
     (The fixture's 37.5x8 bench warm-up is excluded, which is what
     makes the fixture's own "4266 kg" reproduce.)
     ------------------------------------------------------------------ */

  var PRIOR = { name: 'Push', dateLabel: 'Sep 3', volumeKg: 4266 };

  function lift(name, tw, tr, tvol, pw, pr, pvol) {
    /* Rounded away from zero, so the five row deltas always sum to the
       header delta rather than drifting by a half kilo. */
    var raw = tvol - pvol;
    return { name: name, top: [tw, tr], vol: tvol, priorTop: [pw, pr], priorVol: pvol,
             delta: (raw < 0 ? -1 : 1) * Math.round(Math.abs(raw)) };
  }

  /* Today, 9 Sep. Same five lifts, same order. Two variants: one where
     the bench moved and set a record, one where it held. */
  var LIFTS_RECORD = [
    lift('Barbell Bench Press', 75, 8, 1775, 72.5, 8, 1715),
    lift('DB Shoulder Press',   25, 10, 700, 25, 9, 650),
    lift('Incline Cable Fly',   15, 12, 510, 15, 11, 480),
    lift('Lateral Raise',       10.5, 13, 378, 10.5, 15, 430.5),
    lift('Tricep Pushdown',     30, 12, 1020, 30, 12, 990)
  ];
  var LIFTS_FLAT = [
    lift('Barbell Bench Press', 72.5, 8, 1715, 72.5, 8, 1715)
  ].concat(LIFTS_RECORD.slice(1));

  /* A lift the prior session does not contain. It has no delta, because
     inventing one would compare two different exercises. */
  function liftNew(name, tw, tr, tvol) {
    return { name: name, top: [tw, tr], vol: tvol, priorTop: null, priorVol: 0, delta: null };
  }

  var DATA = {
    record: {
      title: 'Push', date: 'WED, SEP 9',
      sets: 16, volumeKg: 4383, minutes: 52,
      lifts: LIFTS_RECORD,
      /* lk_prs["111"]: the standing best at 8 reps was 72.5 kg, 3 Sep. */
      record: { lift: 'Barbell Bench Press', w: 75, r: 8, prevW: 72.5, prevDate: 'Sep 3' },
      insight: 'Bench top set has moved up 2.5 kg on every second Push since ' +
               'Aug 20. Lateral raise reps have fallen in three straight ' +
               'sessions; it runs last in the order every time.'
    },
    populated: {
      title: 'Push', date: 'WED, SEP 9',
      sets: 16, volumeKg: 4323, minutes: 49,
      lifts: LIFTS_FLAT,
      record: null,
      insight: 'Bench has held at 72.5 kg for two Push sessions while the ' +
               'accessories kept climbing. The last two top sets both ' +
               'stopped at RIR 2.'
    },
    empty:   { title: 'Push', date: 'WED, SEP 9' },
    loading: { title: 'Push', date: 'WED, SEP 9' },
    error:   { title: 'Push', date: 'WED, SEP 9', sets: 16, volumeKg: 4383, minutes: 52 }
  };

  /* ---- the split, and how today differed from it -------------------
     lk_splits: the PPL split's Push day prescribes, in order, Barbell
     Bench Press, DB Shoulder Press, Incline Cable Fly, Lateral Raise,
     Tricep Pushdown. A difference is the prescribed list against the
     exercises with at least one completed set:
       ADDED    performed, not prescribed
       SKIPPED  prescribed, never started
       SWAPPED  one skipped and one added filling the same slot, which
                is one decision and is drawn as one line
     The card appears only when that difference is non-empty and only
     when the session came from a split. A freestyle session and an
     identical session both draw nothing at all: no card, no empty
     state, no "no changes detected".
     ------------------------------------------------------------------ */

  var SPLIT = { name: 'PPL', day: 'Push' };

  var D_SWAP    = { kind: 'swap', to: 'Machine Chest Press', from: 'Barbell Bench Press',
                    slot: 'Mid Chest', sets: 4 };
  var D_ADD     = { kind: 'added', to: 'Incline Dumbbell Press', slot: 'Upper Chest', sets: 3 };
  var D_ADD2    = { kind: 'added', to: 'Incline Dumbbell Press', slot: 'Upper Chest', sets: 2 };
  var D_SKIP    = { kind: 'skipped', from: 'Lateral Raise', slot: 'Side Delt', sets: 3 };

  /* Each variant's lift list is the session that produced its
     difference, so the comparison above the card and the card itself
     describe the same workout. */
  var TAIL = LIFTS_RECORD.slice(1);            /* shoulder, fly, lateral, pushdown */
  var TAIL_NO_LAT = [TAIL[0], TAIL[1], TAIL[3]];

  DATA['diff-swap'] = {
    title: 'Push', date: 'WED, SEP 9', sets: 16, volumeKg: 4508, minutes: 51,
    lifts: [liftNew('Machine Chest Press', 50, 10, 1900)].concat(TAIL),
    record: null, mixed: true, split: SPLIT, diffs: [D_SWAP],
    insight: 'The machine press let you hold 50 kg for four sets where the ' +
             'barbell has been dropping a set by the third. Same slot, ' +
             'steadier reps.'
  };
  DATA['diff-add-skip'] = {
    title: 'Push', date: 'WED, SEP 9', sets: 16, volumeKg: 4815, minutes: 54,
    lifts: [LIFTS_FLAT[0], TAIL[0], TAIL[1],
            liftNew('Incline Dumbbell Press', 30, 10, 870), TAIL[3]],
    record: null, mixed: true, split: SPLIT, diffs: [D_ADD, D_SKIP],
    insight: 'Upper chest got its own movement for the first time in six ' +
             'Push sessions, and the side delts got none.'
  };
  DATA['diff-skip'] = {
    title: 'Push', date: 'WED, SEP 9', sets: 13, volumeKg: 3945, minutes: 41,
    lifts: [LIFTS_FLAT[0]].concat(TAIL_NO_LAT),
    record: null, mixed: true, split: SPLIT, diffs: [D_SKIP],
    insight: 'Four of five lifts held their loads in eleven fewer minutes. ' +
             'The one that went missing is the one that runs last.'
  };
  DATA['diff-many'] = {
    title: 'Push', date: 'WED, SEP 9', sets: 15, volumeKg: 4700, minutes: 53,
    lifts: [liftNew('Machine Chest Press', 50, 10, 1900), TAIL[0], TAIL[1],
            liftNew('Incline Dumbbell Press', 30, 10, 570), TAIL[3]],
    record: null, mixed: true, split: SPLIT, diffs: [D_SWAP, D_ADD2, D_SKIP],
    insight: 'Three of the five slots ran differently from the programme. ' +
             'Two of the three have now run that way twice.'
  };
  DATA['diff-updated'] = DATA['diff-swap'];

  var FEELINGS = [
    ['easy',   'Easy'],
    ['steady', 'Steady'],
    ['hard',   'Hard'],
    ['max',    'All out']
  ];

  /* ---- screen state ---------------------------------------------- */
  var S = { view: 'record', saved: false, feel: null, discardArmed: false,
            ai: 'idle', toast: null,
            /* split: 'pending' | 'updated' | 'kept'. picks: indices chosen
               in the per-change sheet, empty until the lifter picks. */
            split: 'pending', applied: [], picks: [], sheet: false };

  /* ---- blocks ----------------------------------------------------- */

  /* The receipt line. One line, not three tiles: these are numbers the
     lifter watched accumulate, so they confirm, they do not lead. */
  function receipt(d) {
    return '<p class="t-detail mt-2" data-testid="session-totals">' +
      n(d.sets) + ' working sets · ' + kg(d.volumeKg) + ' · ' + n(d.minutes) + ' min' +
      '</p>';
  }

  /* The record. Only drawn when there is one, and it names the mark it
     beat, because "new record" without the old number is a compliment
     rather than information. */
  function recordCard(r) {
    return '' +
      '<div class="card mt-4 enter-rise" data-testid="card-record">' +
        '<div class="hstack hstack--3">' +
          '<span class="ico-well delta--up">' + ICO.record + '</span>' +
          '<div class="grow stack stack--1">' +
            '<div><span class="badge badge--success">Personal record</span></div>' +
            '<h2 class="t-section">' + r.lift + '</h2>' +
          '</div>' +
        '</div>' +
        '<p class="t-body-em mt-3 num">' + set(r.w, r.r) + '</p>' +
        '<p class="t-detail">Beat ' + set(r.prevW, r.r) + ', set ' + r.prevDate + '.</p>' +
      '</div>';
  }

  /* The comparison. The reason this screen exists: it is computed on
     the device from lk_history and needs no network. */
  function compare(d) {
    var delta = d.volumeKg - PRIOR.volumeKg;
    var pct = (delta / PRIOR.volumeKg) * 100;
    var pctText = (delta >= 0 ? '+' : '−') + Math.abs(pct).toFixed(1) + '%';

    var rows = d.lifts.map(function (l) {
      /* A lift the prior session did not contain gets no number: it is
         marked new and left uncompared, because a delta against nothing
         is not a measurement. */
      var isNew = l.priorTop === null;
      return '' +
        '<div class="row" data-testid="lift-' + l.name.toLowerCase().replace(/[^a-z]+/g, '-') + '">' +
          '<span class="row__main">' +
            '<span class="row__title">' + l.name + '</span>' +
            '<span class="row__sub">' + set(l.top[0], l.top[1]) +
              (isNew ? ', not in the Sep 3 session'
                     : ', was ' + set(l.priorTop[0], l.priorTop[1])) + '</span>' +
          '</span>' +
          (isNew
            ? '<span class="row__value delta--flat">New</span>'
            : '<span class="row__value delta--' + dir(l.delta) + '">' + signedKg(l.delta) + '</span>') +
        '</div>';
    }).join('');

    return '' +
      '<div class="section" data-testid="section-compare">' +
        '<div class="section__head">' +
          '<h2 class="t-label">Against ' + PRIOR.name + ', ' + PRIOR.dateLabel + '</h2>' +
        '</div>' +
        '<div class="card enter-rise">' +
          '<div class="spread">' +
            '<div class="hero">' +
              '<span class="hero__figure">' +
                '<span class="t-hero num delta--' + dir(delta) + '" data-testid="volume-delta">' +
                  (delta >= 0 ? '+' : '−') + Math.abs(delta).toLocaleString('en-US') +
                '</span>' +
                '<span class="hero__unit">kg</span>' +
              '</span>' +
              '<span class="hero__label">Working volume</span>' +
            '</div>' +
            '<span class="t-body-em num delta--' + dir(delta) + '">' + pctText + '</span>' +
          '</div>' +
          '<p class="t-detail mt-2 num">' + kg(d.volumeKg) + ' today, ' + kg(PRIOR.volumeKg) + ' on ' + PRIOR.dateLabel + '</p>' +
        '</div>' +
        '<div class="card card--flush mt-3">' + rows + '</div>' +
        '<p class="t-meta mt-2">Change is working-set volume. Warm-ups excluded.' +
          (d.mixed ? ' The exercises differ from Sep 3, so the day total is not like for like.' : '') +
        '</p>' +
      '</div>';
  }

  /* ---- the split card ----------------------------------------------
     A secondary decision standing next to a primary action, so both of
     its actions are secondary: the accent fill stays on Save, and this
     never gates it. Saving is one tap whether or not this is answered.
     ------------------------------------------------------------------ */

  /* One line per difference, each naming the exercise and enough detail
     to judge it without opening anything. */
  function diffLine(diff, i, forSheet) {
    var ico, title, sub;
    if (diff.kind === 'swap') {
      ico = ICO.swap;
      title = diff.to + ' instead of ' + diff.from;
      sub = n(diff.sets) + ' sets logged · same slot, ' + diff.slot;
    } else if (diff.kind === 'added') {
      ico = ICO.plus;
      title = 'Added ' + diff.to + ', ' + diff.sets + ' sets';
      sub = 'Not in ' + SPLIT.day + ' · ' + diff.slot;
    } else {
      ico = ICO.minus;
      title = 'Skipped ' + diff.from;
      sub = n(diff.sets) + ' sets prescribed · none started';
    }
    if (!forSheet) {
      return '<div class="row" data-testid="split-diff-' + i + '">' +
               '<span class="ico-well" aria-hidden="true">' + ico + '</span>' +
               '<span class="row__main">' +
                 '<span class="row__title">' + title + '</span>' +
                 '<span class="row__sub">' + sub + '</span>' +
               '</span>' +
             '</div>';
    }
    /* In the sheet every row starts unselected, so opening it and
       confirming without reading changes nothing. */
    var picked = S.picks.indexOf(i) > -1;
    return '<button class="opt" type="button" role="checkbox" aria-checked="' + picked + '" ' +
             'data-pick="' + i + '" data-testid="split-pick-' + i + '">' +
             '<span class="opt__mark">' + ICO.check + '</span>' +
             '<span class="opt__main">' +
               '<span class="opt__title">' + title + '</span>' +
               '<span class="opt__sub">' + sub +
                 (diff.kind === 'skipped'
                   ? ' · choosing this removes it from ' + SPLIT.day
                   : ' · choosing this writes it into ' + SPLIT.day) +
               '</span>' +
             '</span>' +
           '</button>';
  }

  /* What a given set of applied differences did, in one named line. */
  function appliedLine(applied, diffs) {
    var parts = applied.map(function (dd) {
      if (dd.kind === 'swap') return dd.to + ' replaces ' + dd.from + '.';
      if (dd.kind === 'added') return dd.to + ' added.';
      return dd.from + ' removed.';
    });
    var keptSkips = diffs.filter(function (dd) {
      return dd.kind === 'skipped' && applied.indexOf(dd) === -1;
    });
    keptSkips.forEach(function (dd) { parts.push(dd.from + ' stays in ' + SPLIT.day + '.'); });
    return parts.join(' ');
  }

  function splitCard(d) {
    if (!d.split || !d.diffs || !d.diffs.length) return '';
    var diffs = d.diffs;
    var head = '<div class="section" data-testid="section-split">' +
                 '<div class="section__head"><h2 class="t-label">' +
                   SPLIT.name + ' · ' + SPLIT.day + ' day</h2></div>';

    if (S.split === 'updated') {
      return head +
        '<div class="card" data-testid="card-split-updated">' +
          '<div class="banner banner--success" role="status">' + ICO.check +
            '<span><strong>' + SPLIT.day + ' updated</strong>' +
            appliedLine(S.applied, diffs) + '</span></div>' +
          '<button class="btn btn--secondary btn--block mt-3" data-testid="split-undo">' +
            '<span class="btn__label">Undo update</span></button>' +
        '</div></div>';
    }
    if (S.split === 'kept') {
      /* A quiet acknowledgement, and the screen does not ask again. */
      return head + '<p class="t-meta" data-testid="split-kept">' +
             SPLIT.day + ' kept as it is.</p></div>';
    }

    var skips = diffs.filter(function (dd) { return dd.kind === 'skipped'; });
    var applicable = diffs.filter(function (dd) { return dd.kind !== 'skipped'; });
    var skipOnly = applicable.length === 0;

    /* A skip is usually the rack or the clock, not a change of plan, so
       it is never applied unless it is picked by name. When a skip is
       the only difference, the card says so and keeping is the reading
       the copy and the button order both point at. */
    var note = skipOnly
      ? 'Missing a lift once is usually the rack or the clock, not a change of ' +
        'plan. ' + SPLIT.day + ' stays as it is unless you say otherwise.'
      : (skips.length
          ? 'Update ' + SPLIT.day + ' applies the ' +
            (applicable.length > 1 ? 'swap and the addition' : applicable[0].kind === 'swap' ? 'swap' : 'addition') +
            '. Skipped exercises stay in ' + SPLIT.day + ' unless you pick them one by one.'
          : 'Update ' + SPLIT.day + ' writes this into the split. Later ' +
            SPLIT.day + ' sessions start from it.');

    var actions = skipOnly
      ? '<button class="btn btn--secondary btn--block" data-testid="split-keep">' +
          '<span class="btn__label">Keep ' + SPLIT.day + ' as it is</span></button>' +
        '<button class="btn btn--secondary btn--block mt-2" data-testid="split-update">' +
          '<span class="btn__label">Remove ' + skips[0].from + ' from ' + SPLIT.day + '</span></button>'
      : '<button class="btn btn--secondary btn--block" data-testid="split-update">' +
          '<span class="btn__label">Update ' + SPLIT.day + '</span></button>' +
        '<button class="btn btn--secondary btn--block mt-2" data-testid="split-keep">' +
          '<span class="btn__label">Keep ' + SPLIT.day + ' as it is</span></button>';

    /* The third route exists only when there is more than one decision
       to separate. */
    var perChange = diffs.length > 1
      ? '<button class="btn btn--tertiary btn--block mt-2" data-testid="split-per-change">' +
          '<span class="btn__label">Choose per change</span></button>'
      : '';

    return head +
      '<div class="card card--flush">' +
        '<div class="card__head">' +
          '<span class="t-label grow">' + SPLIT.day + ' ran differently</span>' +
          '<span class="badge">' + diffs.length +
            (diffs.length === 1 ? ' change' : ' changes') + '</span>' +
        '</div>' +
        diffs.map(function (dd, i) { return diffLine(dd, i, false); }).join('') +
        '<div class="card__foot">' +
          '<p class="t-detail">' + note + '</p>' +
          '<div class="mt-3">' + actions + perChange + '</div>' +
        '</div>' +
      '</div></div>';
  }

  /* Per-change sheet. Nothing is pre-selected, so confirming without
     reading is a no-op rather than a silent edit. */
  function splitSheet(d) {
    var diffs = d.diffs;
    return '' +
      '<div class="scrim" data-testid="scrim"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="split-sheet-title" ' +
           'data-testid="split-sheet">' +
        '<div class="sheet__grab"></div>' +
        '<div class="sheet__head">' +
          '<h2 class="t-section" id="split-sheet-title">Update ' + SPLIT.day + '</h2>' +
          '<button class="iconbtn" type="button" data-testid="split-sheet-close" ' +
                  'aria-label="Close, change nothing">' + ICO.close + '</button>' +
        '</div>' +
        '<p class="t-detail">Nothing is selected. Pick only the changes you want ' +
          'in the split.</p>' +
        '<div class="sheet__body mt-3">' +
          '<div class="card card--flush">' +
            diffs.map(function (dd, i) { return diffLine(dd, i, true); }).join('') +
          '</div>' +
        '</div>' +
        '<div class="sheet__foot">' +
          '<div class="hstack hstack--2">' +
            '<button class="btn btn--secondary grow" data-testid="split-sheet-cancel">' +
              '<span class="btn__label">Cancel</span></button>' +
            '<button class="btn btn--secondary grow" data-testid="split-sheet-apply">' +
              '<span class="btn__label">Apply to ' + SPLIT.day + '</span></button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* The one thing on the screen that is not measured. Dashed, labelled,
     never fetched unless asked, and a failure stays a failure. */
  function aiCard(d) {
    var inner;
    if (S.ai === 'idle') {
      inner = '<p class="t-detail">A written read on this session and the five before it. ' +
              'The figures above are computed on this phone; this is not, and saving ' +
              'does not wait for it.</p>' +
              '<button class="btn btn--secondary btn--block mt-3" data-testid="ai-ask">' +
                '<span class="btn__label">Ask coach</span></button>';
    } else if (S.ai === 'loading') {
      inner = '<div class="hstack hstack--3" role="status" aria-live="polite">' +
                '<span class="spinner"></span>' +
                '<span class="t-detail">Reading your last six Push sessions.</span>' +
              '</div>';
    } else if (S.ai === 'error') {
      inner = '<div class="banner banner--error" role="alert" data-testid="ai-error">' +
                ICO.alert +
                '<span><strong>Coach did not answer</strong>The request timed out. Your session is ' +
                'untouched and the comparison above is unaffected.</span>' +
              '</div>' +
              '<button class="btn btn--secondary btn--block mt-3" data-testid="ai-retry">' +
                '<span class="btn__label">Try again</span></button>';
    } else {
      inner = '<p class="t-detail" data-testid="ai-text">' + d.insight + '</p>';
    }
    return '' +
      '<div class="section">' +
        '<div class="card card--flush card--unverified" data-testid="card-ai">' +
          '<div class="card__head">' +
            '<span class="t-label grow">Coach note</span>' +
            '<span class="badge">Generated, not measured</span>' +
          '</div>' +
          '<div style="padding: var(--sp-4)">' + inner + '</div>' +
        '</div>' +
      '</div>';
  }

  /* Optional, secondary, and it gates nothing. One question, four
     answers, one tap, and the screen is savable with or without it. */
  function feelSection() {
    var chips = FEELINGS.map(function (f) {
      return '<button class="chip" type="button" aria-pressed="' + (S.feel === f[0]) + '" ' +
             'data-feel="' + f[0] + '" data-testid="feel-' + f[0] + '">' + f[1] + '</button>';
    }).join('');
    return '' +
      '<div class="section" data-testid="section-feel">' +
        '<div class="section__head">' +
          '<h2 class="t-label">How did it feel</h2>' +
          '<span class="t-meta">Optional</span>' +
        '</div>' +
        '<div class="chiprow" role="group" aria-label="How did it feel, optional">' + chips + '</div>' +
      '</div>';
  }

  /* Two-step, and the second step names the consequence. */
  function discardSection(sets) {
    if (S.discardArmed) {
      var what = sets
        ? 'The ' + sets + ' sets you logged are deleted and nothing is written to your history.'
        : 'This session is closed and nothing is written to your history.';
      return '' +
        '<div class="section" data-testid="section-discard">' +
          '<div class="banner banner--error" role="alert">' + ICO.alert +
            '<span><strong>Discard this session</strong>' + what + '</span></div>' +
          '<div class="hstack hstack--2 mt-3">' +
            '<button class="btn btn--secondary grow" data-testid="action-discard-cancel">' +
              '<span class="btn__label">Keep it</span></button>' +
            '<button class="btn btn--danger-solid grow" data-testid="action-discard-confirm">' +
              '<span class="btn__label">Discard</span></button>' +
          '</div>' +
        '</div>';
    }
    return '' +
      '<div class="section" data-testid="section-discard">' +
        '<button class="btn btn--danger btn--block" data-testid="action-discard">' +
          '<span class="btn__label">Discard session</span></button>' +
      '</div>';
  }

  /* ---- the pinned bar --------------------------------------------
     Save never scrolls away, so banking the session is one tap from
     the state the screen opens in, whatever the scroll position. */
  function saveBar(opts) {
    if (S.saved) {
      return '<div class="actionbar" role="contentinfo" aria-label="Session actions" data-testid="actionbar">' +
               '<span class="actionbar__status" role="status" data-testid="save-status">' +
                 'Saved to history</span>' +
               '<button class="btn btn--secondary" disabled data-testid="action-save">' +
                 '<span class="btn__label">Saved</span></button>' +
             '</div>';
    }
    var busy = opts && opts.disabled;
    return '<div class="actionbar" role="contentinfo" aria-label="Session actions" data-testid="actionbar">' +
             '<span class="actionbar__status">' + (opts && opts.status ? opts.status : '') + '</span>' +
             '<button class="btn btn--primary" data-testid="action-save"' +
               (busy ? ' disabled' : '') + '>' +
               '<span class="btn__label">Save session</span></button>' +
           '</div>';
  }

  /* ---- states ------------------------------------------------------ */
  var VIEWS = {};

  function full(d) {
    return {
      body: receipt(d) + (d.record ? recordCard(d.record) : '') + compare(d) +
            splitCard(d) + aiCard(d) + feelSection() + discardSection(d.sets),
      bar: saveBar({ status: d.record ? 'Record included' : '' }),
      overlay: (S.sheet && d.diffs) ? splitSheet(d) : ''
    };
  }
  VIEWS.record = function () { return full(DATA.record); };
  VIEWS.populated = function () { return full(DATA.populated); };
  /* Every difference variant is the same screen with a different
     session behind it. Record, populated and error carry no split
     difference and so draw no card at all. */
  VIEWS['diff-swap']     = function () { return full(DATA['diff-swap']); };
  VIEWS['diff-add-skip'] = function () { return full(DATA['diff-add-skip']); };
  VIEWS['diff-skip']     = function () { return full(DATA['diff-skip']); };
  VIEWS['diff-many']     = function () { return full(DATA['diff-many']); };
  VIEWS['diff-updated']  = function () { return full(DATA['diff-updated']); };

  /* Nothing logged. The old screen printed WORKOUT COMPLETE over zero
     sets and left both save paths live. There is no Save control here
     at all, and the copy says what will and will not happen. */
  VIEWS.empty = function () {
    return {
      body: '<div class="empty mt-5 enter-rise" data-testid="card-nothing-logged">' +
              '<span class="empty__ico">' + ICO.empty + '</span>' +
              '<h2 class="empty__title">Nothing logged</h2>' +
              '<p class="empty__body">No sets were completed, so there is nothing to save ' +
                'and nothing will be added to your history.</p>' +
              '<button class="btn btn--primary" data-testid="action-back-to-workout">' +
                '<span class="btn__label">Back to workout</span></button>' +
            '</div>' +
            discardSection(0),
      bar: '', overlay: ''
    };
  };

  /* Loading. The prior session is being read off the device. Save waits,
     because a comparison is the point and a save before the totals are
     known is a save of an unknown thing. */
  VIEWS.loading = function () {
    return {
      body: '<div class="skel mt-2" style="height: var(--sp-4); width: 65%"></div>' +
            '<div class="section" role="status" aria-busy="true" aria-label="Reading your last Push session">' +
              '<div class="card">' +
                '<div class="skel" style="height: var(--sp-6); width: 45%"></div>' +
                '<div class="skel mt-3" style="height: var(--sp-4); width: 70%"></div>' +
              '</div>' +
              '<div class="card mt-3">' +
                '<div class="skel" style="height: var(--sp-5)"></div>' +
                '<div class="skel mt-4" style="height: var(--sp-5)"></div>' +
                '<div class="skel mt-4" style="height: var(--sp-5)"></div>' +
                '<div class="skel mt-4" style="height: var(--sp-5)"></div>' +
                '<div class="skel mt-4" style="height: var(--sp-5)"></div>' +
              '</div>' +
            '</div>',
      bar: saveBar({ disabled: true, status: 'Reading your last Push session' }), overlay: ''
    };
  };

  /* Error. The comparison failed; the session did not. The failure is
     named, the totals that ARE known are still shown, and Save stays
     the primary action rather than being held hostage to a read that
     the lifter did not ask for. */
  VIEWS.error = function () {
    var d = DATA.error;
    return {
      body: receipt(d) +
            '<div class="section" data-testid="section-compare-error">' +
              '<div class="banner banner--error" role="alert">' + ICO.alert +
                '<span><strong>No comparison available</strong>' +
                'Your Sep 3 Push session could not be read, so this one cannot be measured ' +
                'against it. Saving still works.</span></div>' +
              '<button class="btn btn--secondary btn--block mt-3" data-testid="action-retry-compare">' +
                '<span class="btn__label">Try again</span></button>' +
            '</div>' +
            feelSection() + discardSection(d.sets),
      bar: saveBar({ status: '' }), overlay: ''
    };
  };

  /* ---- render ------------------------------------------------------ */
  var STATES = [
    ['record',        'New record'],
    ['populated',     'Populated'],
    ['diff-swap',     'Split: swap'],
    ['diff-add-skip', 'Split: add + skip'],
    ['diff-skip',     'Split: skip only'],
    ['diff-many',     'Split: per-change sheet'],
    ['diff-updated',  'Split: updated'],
    ['empty',         'Nothing logged'],
    ['loading',       'Loading'],
    ['error',         'Error']
  ];

  var body = document.getElementById('body');
  var barSlot = document.getElementById('bar-slot');
  var overlaySlot = document.getElementById('overlay-slot');
  var toastSlot = document.getElementById('toast-slot');
  var screen = document.getElementById('screen');
  var hdrDate = document.getElementById('hdr-date');
  var hdrTitle = document.getElementById('hdr-title');
  var menu = document.getElementById('dev-menu');
  var toggle = document.getElementById('dev-toggle');
  var toastTimer = null;

  function toastHTML() {
    if (!S.toast) return '';
    return '<div class="toast" role="status" data-testid="toast">' +
             '<span class="toast__body">' + S.toast + '</span></div>';
  }

  function paint(keepScroll) {
    var top = body.scrollTop;
    var d = DATA[S.view];
    var out = VIEWS[S.view]();
    screen.setAttribute('data-state', S.view);
    hdrDate.textContent = d.date;
    hdrTitle.textContent = d.title;
    LKPatch(body, out.body);
    LKPatch(barSlot, out.bar);
    LKPatch(overlaySlot, out.overlay || '');
    LKPatch(toastSlot, toastHTML());
    body.scrollTop = keepScroll ? top : 0;
    Array.prototype.forEach.call(menu.querySelectorAll('.dev__item'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.state === S.view));
    });
  }

  function show(view) {
    var v = VIEWS[view] ? view : 'record';
    S = { view: v, saved: false, feel: null, discardArmed: false, ai: 'idle',
          toast: null, split: 'pending', applied: [], picks: [], sheet: false };
    /* Two of the dev states are a mid-decision snapshot rather than an
       entry state: the sheet already open, and the split already
       updated by the swap. */
    if (v === 'diff-many') S.sheet = true;
    if (v === 'diff-updated') { S.split = 'updated'; S.applied = DATA['diff-swap'].diffs.slice(); }
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    paint(false);
  }

  function toast(msg) {
    S.toast = msg;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; paint(true); }, 4000);
  }

  /* One delegated handler. Every control on the screen is in here, so
     there is no path that reaches a control with no behaviour. */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-testid], [data-feel], [data-pick]');
    if (!el) return;
    var id = el.getAttribute('data-testid');
    var d = DATA[S.view] || {};

    if (el.dataset.pick !== undefined) {
      var pi = Number(el.dataset.pick);
      var at = S.picks.indexOf(pi);
      if (at > -1) S.picks.splice(at, 1); else S.picks.push(pi);
      paint(true);
      return;
    }
    if (el.dataset.feel) {
      S.feel = S.feel === el.dataset.feel ? null : el.dataset.feel;
      paint(true);
      return;
    }
    switch (id) {
      case 'action-save':
        S.saved = true;
        paint(true);
        toast('Session saved' + (S.feel ? ', marked ' + S.feel : '') + '.');
        paint(true);
        return;
      case 'action-discard':
        S.discardArmed = true; paint(true); return;
      case 'action-discard-cancel':
        S.discardArmed = false; paint(true); return;
      case 'action-discard-confirm':
        S.discardArmed = false; paint(true); toast('Session discarded. Nothing was written.'); return;
      case 'ai-ask':
      case 'ai-retry':
        S.ai = 'loading'; paint(true);
        setTimeout(function () {
          if (S.view !== 'record' && S.view !== 'populated') return;
          S.ai = S.view === 'populated' ? 'error' : 'done';
          paint(true);
        }, 900);
        return;
      case 'action-retry-compare':
        show('loading');
        setTimeout(function () { if (S.view === 'loading') show('record'); }, 900);
        return;
      case 'action-back':
      case 'action-back-to-workout':
        toast('Back to the workout. Nothing was saved.'); paint(true); return;

      /* ---- the split decision. None of these touch S.saved: the
         session can be banked before, after, or instead of answering. */
      case 'split-update':
        /* A skip is applied only when it is the sole difference and the
           lifter pressed the button that names the removal. Otherwise
           Update writes the swaps and additions and leaves skips alone. */
        var applicable = d.diffs.filter(function (dd) { return dd.kind !== 'skipped'; });
        S.applied = applicable.length ? applicable : d.diffs.slice();
        S.split = 'updated';
        paint(true);
        return;
      case 'split-keep':
        S.split = 'kept'; paint(true); return;
      case 'split-per-change':
        S.picks = []; S.sheet = true; paint(true); return;
      case 'split-sheet-close':
      case 'split-sheet-cancel':
        S.sheet = false; S.picks = []; paint(true); return;
      case 'scrim':
        S.sheet = false; S.picks = []; paint(true); return;
      case 'split-sheet-apply':
        S.sheet = false;
        if (!S.picks.length) {
          /* Opened, read, nothing picked. That is a decision to keep. */
          S.split = 'kept'; S.picks = []; paint(true); return;
        }
        S.applied = S.picks.slice().sort(function (a, b) { return a - b; })
                      .map(function (i) { return d.diffs[i]; });
        S.picks = []; S.split = 'updated';
        paint(true);
        return;
      case 'split-undo':
        S.split = 'pending'; S.applied = []; S.picks = [];
        paint(true);
        toast(SPLIT.day + ' update undone. The split is back as it was.');
        return;
      default:
        return;
    }
  });

  /* A sheet closes on Escape, and closing it changes nothing. */
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (S.sheet) { S.sheet = false; S.picks = []; paint(true); }
  });

  /* ---- dev toggle -------------------------------------------------- */
  LKPatch(menu, STATES.map(function (s) {
    return '<button class="dev__item" data-state="' + s[0] + '" aria-pressed="false" ' +
           'data-testid="dev-state-' + s[0] + '">' + s[1] + '</button>';
  }).join(''));
  toggle.addEventListener('click', function () {
    var open = toggle.getAttribute('aria-expanded') === 'true';
    toggle.setAttribute('aria-expanded', String(!open));
    menu.hidden = open;
  });
  menu.addEventListener('click', function (e) {
    var b = e.target.closest('.dev__item');
    if (b) show(b.dataset.state);
  });

  show(new URLSearchParams(location.search).get('state') || 'record');
})();

});
</script>

<script>DEMO.start();</script>
</body>
</html>
